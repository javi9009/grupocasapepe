<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BBDD de Datos · Experiencias · Casa Pepe</title>
<style>
  :root{
    --bg:#0f0d0a; --panel:#1a1611; --panel2:#221d16; --line:#34291c;
    --txt:#f3ead9; --muted:#a99a82; --gold:#d9a441; --gold2:#f0c674;
    --green:#5fae6b; --red:#cf6a5a; --blue:#6a93cf;
    --meso:#c98a3a; --virr:#9c6fb0; --nac:#5a9bb5;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  a{color:var(--gold2)}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .brand h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  .brand .sub{color:var(--muted);font-size:12px}
  .spacer{flex:1}
  .who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
  .who b{color:var(--gold2)}
  .btn{background:var(--gold);color:#1a1206;border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:13px}
  .btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
  .btn.sm{padding:5px 9px;font-size:12px}
  .progress{margin-top:10px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted)}
  .bar{flex:1;height:8px;background:#2a2218;border-radius:6px;overflow:hidden;max-width:360px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));width:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .filters input,.filters select{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
  .filters input[type=search]{min-width:200px;flex:1}
  .chiptog{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12px;user-select:none}
  .chiptog input{accent-color:var(--gold)}
  main{padding:14px 16px 80px;max-width:1100px;margin:0 auto}
  .grp{margin:18px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;gap:8px;align-items:center}
  .grp .n{color:var(--muted);text-transform:none;letter-spacing:0}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0;overflow:hidden}
  .row .head{display:flex;align-items:center;gap:10px;padding:11px 13px;cursor:pointer}
  .row .head:hover{background:#1f1a13}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .dot.Mesoamerica{background:var(--meso)}.dot.Virreinal{background:var(--virr)}.dot.Nacional{background:var(--nac)}.dot.none{background:#5a5145}
  .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tags{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
  .tag{font-size:11px;padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .tag.tipo{color:var(--gold2);border-color:#5a431f}
  .tag.ok{color:var(--green);border-color:#2f5a35}
  .tag.todo{color:var(--red);border-color:#5a2f2a}
  .caret{color:var(--muted);transition:transform .15s}
  .row.open .caret{transform:rotate(90deg)}
  .editor{display:none;padding:6px 14px 16px;border-top:1px solid var(--line);background:#16120c}
  .row.open .editor{display:block}
  .fg{margin:11px 0}
  .fg label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin-bottom:5px}
  .fg input[type=text],.fg select,.fg textarea{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}
  @media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
  .pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick .opt{font-size:12px;padding:4px 9px;border-radius:20px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);cursor:pointer;user-select:none}
  .pick .opt.on{background:#3a2c12;border-color:var(--gold);color:var(--gold2)}
  .tagsin{display:flex;flex-wrap:wrap;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px}
  .tagsin .t{display:inline-flex;align-items:center;gap:5px;background:#3a2c12;border-radius:16px;padding:3px 8px;font-size:12px;color:var(--gold2)}
  .tagsin .t b{cursor:pointer;color:var(--muted)}
  .tagsin input{flex:1;min-width:90px;border:0;background:transparent;color:var(--txt);outline:0;font-size:13px;padding:3px}
  .savest{font-size:11px;color:var(--muted);height:14px;margin-top:4px}
  .savest.ok{color:var(--green)}.savest.err{color:var(--red)}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:340px;width:90%;text-align:center}
  .gate h2{margin:0 0 4px;color:var(--gold2)}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .gate .who-opts{display:flex;flex-direction:column;gap:8px}
  .gate .who-opts button{background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:11px;border-radius:9px;font-size:14px;cursor:pointer}
  .gate .who-opts button:hover{border-color:var(--gold);color:var(--gold2)}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2a3a2c;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none}
  .toast.show{opacity:1}
  .empty{text-align:center;color:var(--muted);padding:40px}
  .hint{font-size:11px;color:var(--muted);margin-top:3px}
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h2>Casa Pepe · Experiencias</h2>
    <p>¿Quién eres? Quedará registrado en cada dato que edites.</p>
    <div class="who-opts" id="whoOpts"></div>
  </div>
</div>

<header>
  <div class="brand">
    <h1>🗺️ BBDD de Datos · Experiencias</h1>
    <span class="sub">El acervo de identidad mexicana de los tours</span>
    <span class="spacer"></span>
    <span class="who">Editando como <b id="whoLbl">—</b> <button class="btn ghost sm" id="changeWho">cambiar</button></span>
    <button class="btn sm" id="addBtn">+ Nuevo dato</button>
  </div>
  <div class="progress">
    <span id="progTxt">Cargando…</span>
    <div class="bar"><div id="progBar"></div></div>
  </div>
  <div class="filters">
    <input type="search" id="q" placeholder="Buscar dato, palabra clave…">
    <select id="fTour"><option value="">Todos los tours</option></select>
    <select id="fTipo"><option value="">Todo tipo (género)</option><option>Objeto</option><option>Institución</option><option>Conocimiento</option></select>
    <select id="fEpoca"><option value="">Toda temporalidad</option><option>Mesoamerica</option><option>Virreinal</option><option>Nacional</option></select>
    <label class="chiptog"><input type="checkbox" id="fTodo"> Solo sin enriquecer</label>
  </div>
</header>

<main id="main"><div class="empty">Cargando datos…</div></main>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=createClient(SB_URL,SB_KEY);

// Catálogos (fallback; se refrescan desde la BBDD al cargar)
let EPOCAS=["Horizonte Preclásico (Formativo)","Horizonte Clásico","Horizonte Posclásico","La Conquista y la conquista espiritual","Barroco novohispano","Reformas borbónicas e Ilustración novohispana","Independencia","La Reforma","El Porfiriato","La Revolución Mexicana","El Ateneo de la Juventud","El Estridentismo","El Muralismo mexicano","Los Contemporáneos","El Cardenismo","Época de Oro del Cine Mexicano","El Desarrollo Estabilizador (\"milagro mexicano\")","La Generación de la Ruptura","El Movimiento del 68","El Indigenismo","El Neoliberalismo y el TLCAN"];
let PENSADORES=["Alfonso Reyes","Benito Juárez","Carlos Monsiváis","Guillermo Bonfil Batalla","José Vasconcelos","Lázaro Cárdenas","Moctezuma II","Nezahualcóyotl","Octavio Paz","Sor Juana Inés de la Cruz"];
let IDEAS=["El Encuentro como hospitalidad indígena","El respeto al derecho ajeno es la paz","Hospitalidad Original / Turismo de Paz","La raza cósmica / mexicanidad","La región más transparente del aire","México Profundo","Turismo como diálogo entre culturas"];
let SISTEMAS=["Materialismo Filosófico-Dialéctico"];
let TOURS=[];

const EDITORS=["Alan","Joseph","Víctor","Ana","Javi"];
const $=id=>document.getElementById(id);
let WHO=localStorage.getItem('cpp_who')||'';
let ROWS=[];

// ---------- gate ----------
function buildGate(){
  $('whoOpts').innerHTML='';
  EDITORS.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{WHO=n;localStorage.setItem('cpp_who',n);$('gate').style.display='none';$('whoLbl').textContent=n;};$('whoOpts').appendChild(b);});
}
buildGate();
if(WHO){$('gate').style.display='none';$('whoLbl').textContent=WHO;}
$('changeWho').onclick=()=>{$('gate').style.display='flex';};

// ---------- toast ----------
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#2a3a2c':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

// ---------- load ----------
async function loadCatalogs(){
  try{
    const [e,p,i,s]=await Promise.all([
      sb.from('epocas').select('nombre,orden').order('orden'),
      sb.from('pensadores').select('nombre').order('nombre'),
      sb.from('ideas').select('nombre').order('nombre'),
      sb.from('sistemas_pensamiento').select('nombre').order('nombre')
    ]);
    if(e.data&&e.data.length)EPOCAS=e.data.map(x=>x.nombre);
    if(p.data&&p.data.length)PENSADORES=p.data.map(x=>x.nombre);
    if(i.data&&i.data.length)IDEAS=i.data.map(x=>x.nombre);
    if(s.data&&s.data.length)SISTEMAS=s.data.map(x=>x.nombre);
  }catch(err){console.warn('catalogos',err);}
}
async function loadData(){
  const {data,error}=await sb.from('datos').select('*').order('tour_grupo').order('dato');
  if(error){$('main').innerHTML='<div class="empty">Error cargando: '+error.message+'</div>';return;}
  ROWS=data||[];
  TOURS=[...new Set(ROWS.map(r=>r.tour_grupo).filter(Boolean))].sort();
  const sel=$('fTour');TOURS.forEach(t=>{const o=document.createElement('option');o.value=t;o.textContent=t;sel.appendChild(o);});
  render();
}

// ---------- helpers ----------
const arr=v=>Array.isArray(v)?v:[];
function enriched(r){return arr(r.epocas).length>0 || arr(r.personajes).length>0 || arr(r.ideas).length>0 || arr(r.palabras_clave).length>0;}
function updateProgress(){
  const tot=ROWS.length,en=ROWS.filter(enriched).length;
  $('progTxt').textContent=`${en} / ${tot} enriquecidos`;
  $('progBar').style.width=tot?(100*en/tot)+'%':'0';
}

// ---------- render list ----------
function render(){
  const q=$('q').value.trim().toLowerCase(), ft=$('fTour').value, fy=$('fTipo').value, fe=$('fEpoca').value, ftodo=$('fTodo').checked;
  let rows=ROWS.filter(r=>{
    if(ft&&r.tour_grupo!==ft)return false;
    if(fy&&r.tipo!==fy)return false;
    if(fe&&r.temporalidad!==fe)return false;
    if(ftodo&&enriched(r))return false;
    if(q){const hay=[r.dato,...(arr(r.palabras_clave)),...(arr(r.epocas)),...(arr(r.personajes))].join(' ').toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
  const m=$('main');m.innerHTML='';
  updateProgress();
  if(!rows.length){m.innerHTML='<div class="empty">Sin resultados con estos filtros.</div>';return;}
  const byTour={};rows.forEach(r=>{(byTour[r.tour_grupo||'(sin tour)']=byTour[r.tour_grupo||'(sin tour)']||[]).push(r);});
  Object.keys(byTour).sort().forEach(t=>{
    const g=document.createElement('div');g.className='grp';
    const done=byTour[t].filter(enriched).length;
    g.innerHTML=`<span>${t}</span><span class="n">· ${byTour[t].length} datos · ${done} enriquecidos</span>`;
    m.appendChild(g);
    byTour[t].forEach(r=>m.appendChild(rowEl(r)));
  });
}

function rowEl(r){
  const el=document.createElement('div');el.className='row';el.dataset.id=r.id;
  const ep=arr(r.epocas).length, ok=enriched(r);
  el.innerHTML=`
    <div class="head">
      <span class="dot ${r.temporalidad||'none'}"></span>
      <span class="nm">${esc(r.dato||'(sin nombre)')}</span>
      <span class="tags">
        ${r.tipo?`<span class="tag tipo">${r.tipo}</span>`:''}
        ${ep?`<span class="tag">${ep} época${ep>1?'s':''}</span>`:''}
        <span class="tag ${ok?'ok':'todo'}">${ok?'✓':'enriquecer'}</span>
      </span>
      <span class="caret">▸</span>
    </div>
    <div class="editor"></div>`;
  el.querySelector('.head').onclick=()=>{
    const open=el.classList.toggle('open');
    if(open && !el.querySelector('.editor').dataset.built){buildEditor(el,r);}
  };
  return el;
}

function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

// ---------- editor ----------
function buildEditor(el,r){
  const ed=el.querySelector('.editor');ed.dataset.built='1';
  const opts=(list,sel)=>list.map(v=>`<span class="opt ${arr(sel).includes(v)?'on':''}" data-v="${esc(v)}">${esc(v)}</span>`).join('');
  const u=r.ubicacion||{};
  ed.innerHTML=`
    <div class="fg"><label>Dato (hecho)</label><input type="text" data-f="dato" value="${esc(r.dato)}"></div>
    <div class="grid3">
      <div class="fg"><label>Tipo (género Bueno)</label><select data-f="tipo">${['','Objeto','Institución','Conocimiento'].map(v=>`<option ${r.tipo===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fg"><label>Temporalidad (eje)</label><select data-f="temporalidad">${['','Mesoamerica','Virreinal','Nacional'].map(v=>`<option ${r.temporalidad===v?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="fg"><label>Sistema de pensamiento</label><select data-f="sistema_pensamiento"><option value=""></option>${SISTEMAS.map(v=>`<option ${r.sistema_pensamiento===v?'selected':''}>${esc(v)}</option>`).join('')}</select></div>
    </div>
    <div class="fg"><label>Épocas <span class="hint">(una o varias · validadas)</span></label><div class="pick" data-arr="epocas">${opts(EPOCAS,r.epocas)}</div></div>
    <div class="grid2">
      <div class="fg"><label>Personajes / protagonistas <span class="hint">(pueden repetirse entre tours)</span></label><div class="tagsin" data-tags="personajes"></div>
        <div class="pick mini" data-suggest="personajes">${PENSADORES.map(v=>`<span class="opt" data-v="${esc(v)}">+ ${esc(v)}</span>`).join('')}</div></div>
      <div class="fg"><label>Ideas (de pensadores)</label><div class="pick" data-arr="ideas">${IDEAS.map(v=>`<span class="opt ${arr(r.ideas).includes(v)?'on':''}" data-v="${esc(v)}">${esc(v)}</span>`).join('')}</div></div>
    </div>
    <div class="fg"><label>Palabras clave</label><div class="tagsin" data-tags="palabras_clave"></div></div>
    <div class="grid3">
      <div class="fg"><label>Barrio / colonia</label><input type="text" data-u="barrio" value="${esc(u.barrio||'')}"></div>
      <div class="fg"><label>Estado</label><input type="text" data-u="estado" value="${esc(u.estado||'CDMX')}"></div>
      <div class="fg"><label>País</label><input type="text" data-u="pais" value="${esc(u.pais||'México')}"></div>
    </div>
    <div class="grid2">
      <div class="fg"><label>Referencia / enlace 1</label><input type="text" data-f="referencia_url" value="${esc(r.referencia_url)}"></div>
      <div class="fg"><label>Referencia / enlace 2</label><input type="text" data-f="referencia_url2" value="${esc(r.referencia_url2)}"></div>
    </div>
    <div class="savest" data-save></div>`;

  // multi-pick (epocas, ideas)
  ed.querySelectorAll('.pick[data-arr]').forEach(p=>{
    p.addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;o.classList.toggle('on');queueSave(el,r,ed);});
  });
  // tag inputs (personajes, palabras_clave)
  ['personajes','palabras_clave'].forEach(f=>renderTags(ed,r,el,f));
  // personaje suggestions
  const sug=ed.querySelector('.pick[data-suggest="personajes"]');
  if(sug)sug.addEventListener('click',e=>{const o=e.target.closest('.opt');if(!o)return;addTag(ed,r,el,'personajes',o.dataset.v);});
  // text/select fields
  ed.querySelectorAll('[data-f]').forEach(inp=>inp.addEventListener('change',()=>queueSave(el,r,ed)));
  ed.querySelectorAll('[data-u]').forEach(inp=>inp.addEventListener('change',()=>queueSave(el,r,ed)));
}

function renderTags(ed,r,el,field){
  const box=ed.querySelector(`.tagsin[data-tags="${field}"]`);if(!box)return;
  const vals=arr(r[field]);
  box.innerHTML=vals.map((v,i)=>`<span class="t">${esc(v)} <b data-i="${i}">×</b></span>`).join('')+`<input type="text" placeholder="+ agregar…">`;
  box.querySelectorAll('b').forEach(b=>b.onclick=()=>{vals.splice(+b.dataset.i,1);r[field]=vals;renderTags(ed,r,el,field);queueSave(el,r,ed);});
  const inp=box.querySelector('input');
  inp.onkeydown=e=>{if(e.key==='Enter'||e.key===','){e.preventDefault();const v=inp.value.trim().replace(/,$/,'');if(v){addTag(ed,r,el,field,v);}}};
  inp.onblur=()=>{const v=inp.value.trim();if(v){addTag(ed,r,el,field,v);}};
}
function addTag(ed,r,el,field,v){const vals=arr(r[field]);if(!vals.includes(v)){vals.push(v);r[field]=vals;renderTags(ed,r,el,field);queueSave(el,r,ed);}}

// ---------- save ----------
const timers={};
function queueSave(el,r,ed){const id=r.id;clearTimeout(timers[id]);const st=ed.querySelector('[data-save]');st.textContent='Guardando…';st.className='savest';timers[id]=setTimeout(()=>doSave(el,r,ed),650);}
async function doSave(el,r,ed){
  const get=f=>{const e=ed.querySelector(`[data-f="${f}"]`);return e?(e.value.trim()||null):r[f];};
  const pick=a=>[...ed.querySelectorAll(`.pick[data-arr="${a}"] .opt.on`)].map(o=>o.dataset.v);
  const ub={barrio:val(ed,'barrio'),estado:val(ed,'estado'),pais:val(ed,'pais')};
  const hasUb=ub.barrio||ub.estado||ub.pais;
  const payload={
    dato:get('dato'), tipo:get('tipo'), temporalidad:get('temporalidad'),
    sistema_pensamiento:get('sistema_pensamiento'),
    epocas:pick('epocas'), ideas:pick('ideas'),
    personajes:arr(r.personajes), palabras_clave:arr(r.palabras_clave),
    referencia_url:get('referencia_url'), referencia_url2:get('referencia_url2'),
    ubicacion:hasUb?ub:null,
    extra:{...(r.extra||{}),editor:WHO,edited_at:new Date().toISOString()},
    updated_at:new Date().toISOString()
  };
  const st=ed.querySelector('[data-save]');
  const {error}=await sb.from('datos').update(payload).eq('id',r.id);
  if(error){st.textContent='⚠ '+error.message;st.className='savest err';return;}
  Object.assign(r,payload);
  st.textContent='✓ Guardado por '+WHO;st.className='savest ok';
  // refresh row chips
  const ep=arr(r.epocas).length, ok=enriched(r);
  const tags=el.querySelector('.tags');
  tags.innerHTML=`${r.tipo?`<span class="tag tipo">${r.tipo}</span>`:''}${ep?`<span class="tag">${ep} época${ep>1?'s':''}</span>`:''}<span class="tag ${ok?'ok':'todo'}">${ok?'✓':'enriquecer'}</span>`;
  el.querySelector('.dot').className='dot '+(r.temporalidad||'none');
  updateProgress();
}
const val=(ed,u)=>{const e=ed.querySelector(`[data-u="${u}"]`);return e?e.value.trim():'';};

// ---------- add new ----------
$('addBtn').onclick=async()=>{
  if(!WHO){$('gate').style.display='flex';return;}
  const tour=$('fTour').value||TOURS[0]||null;
  const nombre=prompt('Nombre del nuevo dato:');if(!nombre)return;
  const {data,error}=await sb.from('datos').insert({dato:nombre,tour_grupo:tour,tours_asociados:tour?[tour]:null,fuente:'manual',extra:{editor:WHO,created_by:WHO}}).select().single();
  if(error){toast('Error: '+error.message,false);return;}
  ROWS.push(data);toast('Dato creado');render();
};

// ---------- filters ----------
['q','fTour','fTipo','fEpoca','fTodo'].forEach(id=>$(id).addEventListener('input',render));

// ---------- go ----------
await loadCatalogs();
await loadData();
</script>
</body>
</html>
