<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Casa Pepe</title>
<style>
  :root {
    --bg:#ffffff; --bg2:#f7f6f1; --bg3:#f1efe8;
    --txt:#2c2c2a; --txt2:#5f5e5a; --txt3:#888780;
    --accent:#1d9e75; --gold:#FFD700; --warn:#E1251B;
    --bd:rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  aside { background:var(--bg2); padding:1.5rem 1rem; border-right:1px solid var(--bd); }
  aside h2 { font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--txt3); margin:1.5rem 0 .5rem; font-weight:500; }
  aside ul { list-style:none; padding:0; margin:0; }
  aside li a { display:block; padding:8px 12px; border-radius:6px; color:var(--txt); text-decoration:none; font-size:13.5px; }
  aside li a:hover { background:var(--bg3); }
  aside li a.active { background:var(--accent); color:#fff; }
  main { padding:2rem; }
  .panel-internal { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--txt3); margin-bottom:.5rem; }
  h1 { font-size:28px; font-weight:500; margin:0 0 1rem; }
  .lead { color:var(--txt2); margin:0 0 2rem; max-width:600px; line-height:1.6; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--bg2); padding:1.25rem; border-radius:10px; }
  .card .label { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--txt3); margin-bottom:.5rem; }
  .card .value { font-size:24px; font-weight:500; }
  .card .sub { font-size:12px; color:var(--txt3); margin-top:.25rem; }
  .next-steps { background:var(--bg2); padding:1.25rem 1.5rem; border-radius:10px; }
  .next-steps h3 { font-size:14px; margin:0 0 .75rem; color:var(--txt2); font-weight:500; text-transform:uppercase; letter-spacing:1px; }
  .next-steps ul { margin:0; padding-left:1.25rem; line-height:1.8; }
</style>
</head>
<body>
<div class="layout">
  <aside id="sidebar">
    <div style="font-weight:500; font-size:14px; color:var(--txt);">Grupo Casa Pepe</div>
    <h2>Cargando módulos…</h2>
  </aside>
  <main>
    <div class="panel-internal">Panel Interno</div>
    <h1>Hola, <span id="user-name">…</span></h1>
    <p class="lead">Bienvenido a Grupo Casa Pepe. Selecciona un módulo en el menú lateral.</p>

    <div class="cards">
      <div class="card"><div class="label">Roles</div><div class="value" id="roles">—</div></div>
      <div class="card"><div class="label">Módulos visibles</div><div class="value" id="num-modulos">—</div></div>
      <div class="card"><div class="label">Contexto activo</div><div class="value" id="contexto">—</div></div>
    </div>

    <div class="next-steps">
      <h3>Próximos pasos</h3>
      <ul id="next-steps">
        <li>Cargando…</li>
      </ul>
    </div>
  </main>
</div>
