<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Casa Pepe · Panel</title>
<style>
  :root{--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#2c2c2a;--txt2:#5f5e5a;--txt3:#888780;--accent:#1d9e75;--gold:#C9A227;--bd:rgba(0,0,0,.10)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#fff}
  .layout{display:grid;grid-template-columns:248px 1fr;height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--bd);overflow-y:auto;padding:1rem .75rem}
  aside .brand{font-weight:600;font-size:14px;margin:.25rem .4rem 1rem;color:var(--txt)}
  aside .brand b{color:var(--gold)}
  aside .grp{margin-top:.5rem}
  aside .grp>.h{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt3);font-weight:600;padding:7px 8px;cursor:pointer;border-radius:6px;user-select:none}
  aside .grp>.h:hover{background:var(--bg3)}
  aside .grp>.h .chev{margin-left:auto;transition:transform .15s;font-size:9px;color:var(--txt3)}
  aside .grp.collapsed .chev{transform:rotate(-90deg)}
  aside .grp.collapsed ul{display:none}
  aside ul{list-style:none;padding:0;margin:2px 0 4px}
  aside li a{display:block;padding:7px 10px 7px 22px;border-radius:6px;color:var(--txt);text-decoration:none;font-size:13px;cursor:pointer}
  aside li a:hover{background:var(--bg3);color:var(--accent)}
  aside li a.active{background:var(--accent);color:#fff;font-weight:600}
  aside li a.disabled{color:var(--txt3);pointer-events:none}
  aside li a.disabled::after{content:' · próx';font-size:10px}
  main{position:relative;background:var(--bg3)}
  .topbar{height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--bd)}
  .topbar .crumb{font-size:13px;color:var(--txt2)}
  .topbar .crumb b{color:var(--txt);font-weight:600}
  .topbar .open{margin-left:auto;font-size:12px;color:var(--accent);text-decoration:none}
  iframe{display:block;width:100%;height:calc(100vh - 42px);border:0;background:#fff}
  @media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:10;width:248px;height:100%;transform:translateX(-100%);transition:transform .2s}aside.show{transform:none}.menu-btn{display:inline-block!important}}
  .menu-btn{display:none;background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px}
</style></head>
<body>
<div class="layout">
  <aside id="aside"></aside>
  <main>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <span class="crumb" id="crumb">—</span>
      <a class="open" id="openExt" href="#" target="_blank" rel="noopener">Abrir en pestaña ↗</a>
    </div>
    <iframe id="frame" title="Contenido"></iframe>
  </main>
</div>
<script>
const REPORTE='https://reportesocios.netlify.app';
// Estructura del menú. tipo: 'rep' = reporte socios con #tab, 'mod' = módulo /m/...
const MENU=[
  {grp:'Socios', items:[
    {t:'Lectura',           src:REPORTE+'#lectura'},
    {t:'Resumen',           src:REPORTE+'#resumen'},
    {t:'Ventas',            src:REPORTE+'#ventas'},
    {t:'Indicadores',       src:REPORTE+'#egresos'},
    {t:'Mapa de gastos',    src:REPORTE+'#mapa'},
    {t:'Deuda',             src:REPORTE+'#deuda'},
    {t:'Satisfacción',      src:REPORTE+'#sat'},
    {t:'Estatus corporativo',src:REPORTE+'#corp'},
  ]},
  {grp:'Horarios', items:[
    {t:'Front / Recepción',      src:'/m/rh-horario?tab=front'},
    {t:'A&B',                    src:'/m/rh-horario?tab=ab'},
    {t:'Cuartos',                src:'/m/rh-horario?tab=cuartos'},
    {t:'Virreyes / Sincrético',  src:'/m/rh-horario?tab=virreyes'},
    {t:'＋ Alta de trabajador',  src:'/m/rh-alta-trabajador'},
    {t:'Trabajadores · Gerencia',src:'/m/rh-gerencia-empleados'},
  ]},
  {grp:'Revenue', items:[
    {t:'Pricing / Revenue', src:'/m/rh-pricing'},
  ]},
];
let flat=[]; MENU.forEach(g=>g.items.forEach(it=>flat.push({...it,grp:g.grp})));

function render(){
  const a=document.getElementById('aside');
  a.innerHTML='<div class="brand">Grupo <b>Casa Pepe</b></div>'+MENU.map((g,gi)=>`
    <div class="grp" data-g="${gi}">
      <div class="h">${g.grp}<span class="chev">▼</span></div>
      <ul>${g.items.map(it=>`<li><a data-src="${it.src}" data-t="${it.t}" data-grp="${g.grp}">${it.t}</a></li>`).join('')}</ul>
    </div>`).join('');
  a.querySelectorAll('.grp > .h').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('collapsed'));
  a.querySelectorAll('li a').forEach(el=>el.onclick=e=>{e.preventDefault();select(el.dataset.src,el.dataset.t,el.dataset.grp)});
}
function select(src,t,grp){
  document.querySelectorAll('#aside li a').forEach(x=>x.classList.toggle('active',x.dataset.src===src));
  document.getElementById('frame').src=src;
  document.getElementById('crumb').innerHTML=grp+' · <b>'+t+'</b>';
  const ext=document.getElementById('openExt'); ext.href = src.startsWith('http')?src:location.origin+src;
  document.getElementById('aside').classList.remove('show');
  history.replaceState(0,0,'#'+encodeURIComponent(t));
}
document.getElementById('menuBtn').onclick=()=>document.getElementById('aside').classList.toggle('show');
render();
// abrir por hash o default (primera opción de Socios)
const want=decodeURIComponent((location.hash||'').slice(1));
const start=flat.find(f=>f.t===want)||flat[0];
select(start.src,start.t,start.grp);
</script>
</body></html>
