<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Casa Pepe · Panel</title>
<style>
  :root{--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#2c2c2a;--txt2:#5f5e5a;--txt3:#888780;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.10)}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:#fff}
  .layout{display:grid;grid-template-columns:248px 1fr;height:100vh}
  aside{background:var(--bg2);border-right:1px solid var(--bd);overflow-y:auto;padding:1rem .75rem}
  aside .brand{font-weight:600;font-size:14px;margin:.25rem .4rem 1rem;color:var(--txt)}
  aside .brand b{color:var(--gold)}
  aside .grp{margin-top:.5rem}
  aside .grp>.h{display:flex;align-items:center;gap:6px;font-size:11px;text-transform:uppercase;letter-spacing:1.2px;color:var(--txt3);font-weight:600;padding:7px 8px;cursor:pointer;border-radius:6px;user-select:none}
  aside .grp>.h:hover{background:var(--bg3)}
  aside .grp>.h .chev{margin-left:auto;transition:transform .15s;font-size:9px;color:var(--txt3)}
  aside .grp.collapsed .chev{transform:rotate(-90deg)}
  aside .grp.collapsed ul{display:none}
  aside ul{list-style:none;padding:0;margin:2px 0 4px}
  aside li a{display:block;padding:7px 10px 7px 22px;border-radius:6px;color:var(--txt);text-decoration:none;font-size:13px;cursor:pointer}
  aside li a:hover{background:var(--bg3);color:var(--accent)}
  aside li a.active{background:var(--accent);color:#fff;font-weight:600}
  aside li a.disabled{color:var(--txt3);pointer-events:none}
  aside li a.disabled::after{content:' · próx';font-size:10px}
  main{position:relative;background:var(--bg3)}
  .topbar{height:42px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#fff;border-bottom:1px solid var(--bd)}
  .topbar .crumb{font-size:13px;color:var(--txt2)}
  .topbar .crumb b{color:var(--txt);font-weight:600}
  .topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .topbar .open{font-size:12px;color:var(--accent);text-decoration:none}
  .llegue-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;cursor:pointer}
  .who{font-size:11px;color:var(--txt3)}
  .out{font-size:11px;color:var(--txt3);background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 8px;cursor:pointer}
  iframe{display:block;width:100%;height:calc(100vh - 42px);border:0;background:#fff}
  @media(max-width:760px){.layout{grid-template-columns:1fr}aside{position:fixed;z-index:10;width:248px;height:100%;transform:translateX(-100%);transition:transform .2s}aside.show{transform:none}.menu-btn{display:inline-block!important}}
  .menu-btn{display:none;background:none;border:1px solid var(--bd);border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px}
  /* Login */
  #login{position:fixed;inset:0;background:#16130f;display:flex;align-items:center;justify-content:center;z-index:50}
  #login .card{background:#241f18;border:1px solid #3a3228;border-radius:14px;padding:24px;width:340px;max-width:92vw;color:#f4ecdd}
  #login h1{margin:0 0 2px;font-size:18px}#login h1 b{color:var(--gold)}
  #login .s{font-size:12px;color:#8d8170;margin-bottom:14px}
  #login label{display:block;font-size:12px;font-weight:600;color:#c9bca6;margin:10px 0 4px}
  #login input{width:100%;padding:11px;border:1px solid #3a3228;border-radius:9px;background:#16130f;color:#f4ecdd;font-size:15px}
  #login button{width:100%;margin-top:16px;padding:13px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
  #login .err{display:none;margin-top:10px;font-size:13px;color:#e89a95;background:#3a1f1f;border:1px solid var(--bad);padding:9px;border-radius:8px}
  #login .err.show{display:block}
  /* Modal genérico */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:60;padding:14px}
  .modal.show{display:flex}
  .modal .box{background:#fff;border-radius:14px;padding:20px;width:420px;max-width:94vw;max-height:88vh;overflow:auto}
  .modal h2{margin:0 0 6px;font-size:17px}.modal .sub{font-size:12px;color:var(--txt3);margin-bottom:12px}
  .modal .x{float:right;cursor:pointer;color:var(--txt3);font-size:18px;border:none;background:none}
  .checin{text-align:center;padding:8px 0}
  .llegue{background:var(--accent);color:#fff;border:none;border-radius:18px;width:170px;height:170px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(29,158,117,.35)}
  .geo{font-size:12px;color:var(--txt3);margin-top:10px}
  .msg{display:none;margin-top:12px;font-size:13px;padding:10px;border-radius:8px}
  .msg.show{display:block}.msg.ok{background:#eaf6f0;color:#176b4c;border:1px solid #bfe0d0}.msg.err{background:#fbeaea;color:#9a2b2b;border:1px solid #e3b4b4}
  .hrow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
  .hrow:last-child{border-bottom:none}.hrow .t{font-weight:600;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.tag.ok{background:#eaf6f0;color:#176b4c}.tag.tarde{background:#fbf0db;color:#8a5a00}
</style></head>
<body>

<div id="login">
  <div class="card">
    <h1>Grupo <b>Casa Pepe</b></h1>
    <div class="s">Entra con tu cuenta</div>
    <label>Correo</label><input id="l-email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label>Contraseña</label><input id="l-pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button id="l-go">Entrar</button>
    <div class="err" id="l-err"></div>
  </div>
</div>

<div class="layout" style="display:none" id="shell">
  <aside id="aside"></aside>
  <main>
    <div class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>
      <span class="crumb" id="crumb">—</span>
      <span class="right">
        <span class="who" id="who"></span>
        <button class="llegue-btn" id="llegueTop">✋ Llegué</button>
        <a class="open" id="openExt" href="#" target="_blank" rel="noopener">Abrir ↗</a>
        <button class="out" id="logout">Salir</button>
      </span>
    </div>
    <iframe id="frame" title="Contenido"></iframe>
  </main>
</div>

<!-- Modal Checador -->
<div class="modal" id="checModal"><div class="box">
  <button class="x" data-close="checModal">✕</button>
  <h2>Reloj checador</h2>
  <div class="sub" id="checsub">Marca tu llegada estando en el lugar de trabajo.</div>
  <div class="checin"><button class="llegue" id="llegue">✋<br>Llegué</button><div class="geo" id="geo"></div></div>
  <div class="msg" id="checmsg"></div>
</div></div>

<!-- Modal Mi Horario -->
<div class="modal" id="horModal"><div class="box">
  <button class="x" data-close="horModal">✕</button>
  <h2>Mi horario · esta semana</h2>
  <div class="sub">Solo lectura</div>
  <div id="miHorario"><div class="sub">Cargando…</div></div>
</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY);
const REPORTE='https://reportesocios.netlify.app';
const $=id=>document.getElementById(id);
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MGMT=['coordinador','admin','gerente','gerencia','owner','dueño'];
let isGerencia=false, EMP=null, CFG=null, flat=[];

function mxToday(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})).toISOString().slice(0,10);}
function mxNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));}
function quincena(){const d=mxNow();return d.toISOString().slice(0,7)+(d.getDate()<=15?'-Q1':'-Q2');}
function hhmm(t){return t?t.slice(0,5):'';}
function fmtFecha(f){const d=new Date(f+'T00:00:00');return DOW[d.getDay()]+' '+d.getDate();}
function dist(la1,lo1,la2,lo2){const R=6371000,r=x=>x*Math.PI/180;const dla=r(la2-la1),dlo=r(lo2-lo1);const a=Math.sin(dla/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(a));}
function msg(el,t,cls){el.textContent=t;el.className='msg show '+(cls||'');}

function buildMenu(){
  const M=[];
  M.push({grp:'Mi trabajo', items:[
    {t:'Mi Horario', action:'horario'},
    {t:'Mis documentos', disabled:true},
  ]});
  if(isGerencia){
    M.push({grp:'Socios', items:[
      {t:'Lectura',src:REPORTE+'#lectura'},{t:'Resumen',src:REPORTE+'#resumen'},{t:'Ventas',src:REPORTE+'#ventas'},
      {t:'Indicadores',src:REPORTE+'#egresos'},{t:'Mapa de gastos',src:REPORTE+'#mapa'},{t:'Deuda',src:REPORTE+'#deuda'},
      {t:'Satisfacción',src:REPORTE+'#sat'},{t:'Estatus corporativo',src:REPORTE+'#corp'},
      {t:'Deck inversión Sincrético',src:'/m/socios-deck-sincretico'},
    ]});
    M.push({grp:'Horarios (editar)', items:[
      {t:'Front / Recepción',src:'/m/rh-horario?tab=front'},{t:'A&B',src:'/m/rh-horario?tab=ab'},
      {t:'Cuartos',src:'/m/rh-horario?tab=cuartos'},{t:'Virreyes / Sincrético',src:'/m/rh-horario?tab=virreyes'},
      {t:'＋ Alta de trabajador',src:'/m/rh-alta-trabajador'},{t:'Trabajadores · Gerencia',src:'/m/rh-gerencia-empleados'},
    ]});
    M.push({grp:'Revenue', items:[{t:'Pricing / Revenue',src:'/m/rh-pricing'}]});
  }
  return M;
}
function render(M){
  flat=[]; M.forEach(g=>g.items.forEach(it=>flat.push({...it,grp:g.grp})));
  const a=$('aside');
  a.innerHTML='<div class="brand">Grupo <b>Casa Pepe</b></div>'+M.map(g=>`
    <div class="grp"><div class="h">${g.grp}<span class="chev">▼</span></div>
      <ul>${g.items.map(it=>`<li><a ${it.disabled?'class="disabled"':''} data-t="${it.t}" ${it.src?`data-src="${it.src}"`:''} ${it.action?`data-action="${it.action}"`:''}>${it.t}</a></li>`).join('')}</ul></div>`).join('');
  a.querySelectorAll('.grp > .h').forEach(h=>h.onclick=()=>h.parentElement.classList.toggle('collapsed'));
  a.querySelectorAll('li a:not(.disabled)').forEach(el=>el.onclick=e=>{e.preventDefault();
    if(el.dataset.action==='horario'){openHorario();return}
    select(el.dataset.src,el.dataset.t,el.closest('.grp').querySelector('.h').textContent);
  });
}
function select(src,t,grp){
  $('aside').querySelectorAll('li a').forEach(x=>x.classList.toggle('active',x.dataset.src===src));
  $('frame').src=src;
  $('crumb').innerHTML=grp.replace('▼','').trim()+' · <b>'+t+'</b>';
  $('openExt').href=src.startsWith('http')?src:location.origin+src;
  $('aside').classList.remove('show');
}
$('menuBtn').onclick=()=>$('aside').classList.toggle('show');

// ---- Mi Horario ----
async function openHorario(){
  $('horModal').classList.add('show');
  if(!EMP){$('miHorario').innerHTML='<div class="sub">Tu cuenta no está vinculada a un colaborador.</div>';return}
  const t=mxToday(); const d=new Date(t+'T00:00:00'); const k=(d.getDay()+6)%7; const lun=new Date(d); lun.setDate(d.getDate()-k);
  const d0=lun.toISOString().slice(0,10); const fin=new Date(lun); fin.setDate(lun.getDate()+6); const d6=fin.toISOString().slice(0,10);
  const {data}=await sb.from('horarios').select('fecha,hora_inicio,hora_fin,actividad').eq('employee_id',EMP).gte('fecha',d0).lte('fecha',d6).order('fecha');
  if(!data||!data.length){$('miHorario').innerHTML='<div class="sub">Sin turnos asignados esta semana.</div>';return}
  $('miHorario').innerHTML=data.map(a=>{const hh=a.hora_inicio?hhmm(a.hora_inicio)+'–'+hhmm(a.hora_fin):(a.actividad||'Descanso');
    return '<div class="hrow"><span>'+fmtFecha(a.fecha)+(a.actividad&&a.hora_inicio?' · '+a.actividad:'')+'</span><span class="t">'+hh+'</span></div>';}).join('');
}
// ---- Checador ----
function openChec(){$('checModal').classList.add('show');hide($('checmsg'));$('geo').textContent='';}
function hide(el){el.className='msg';}
$('llegueTop').onclick=openChec;
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$(b.dataset.close).classList.remove('show'));
$('llegue').onclick=()=>{
  hide($('checmsg'));$('geo').textContent='Obteniendo ubicación…';$('llegue').disabled=true;
  if(!EMP){msg($('checmsg'),'Tu cuenta no está vinculada a un colaborador.','err');$('llegue').disabled=false;return}
  if(!navigator.geolocation){msg($('checmsg'),'Tu dispositivo no permite ubicación.','err');$('llegue').disabled=false;return}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    const dm=Math.round(dist(lat,lng,CFG.lat,CFG.lng));
    $('geo').textContent='Estás a ~'+dm+' m (precisión ±'+Math.round(accuracy)+' m).';
    if(dm>CFG.radio_m){msg($('checmsg'),'⚠ Estás a '+dm+' m. Debes estar a ≤'+CFG.radio_m+' m para marcar.','err');$('llegue').disabled=false;return}
    const today=mxToday();
    const {data:tn}=await sb.from('horarios').select('hora_inicio').eq('employee_id',EMP).eq('fecha',today).not('hora_inicio','is',null).order('hora_inicio').limit(1);
    let hora_turno=null,retraso=null,estatus='sin_turno';
    if(tn&&tn.length){hora_turno=tn[0].hora_inicio;const [h,m]=hora_turno.split(':').map(Number);const n=mxNow();const minN=n.getHours()*60+n.getMinutes();retraso=minN-(h*60+m);estatus=retraso<=CFG.tolerancia_min?'a_tiempo':'tarde';}
    const {error}=await sb.from('asistencias').insert({employee_id:EMP,fecha:today,check_in:new Date().toISOString(),lat,lng,distancia_m:dm,dentro_geocerca:true,hora_turno,minutos_retraso:retraso,estatus,quincena:quincena()});
    $('llegue').disabled=false;
    if(error){msg($('checmsg'),'No se pudo registrar: '+error.message,'err');return}
    msg($('checmsg'),estatus==='a_tiempo'?'✅ ¡Llegada a tiempo!':(estatus==='tarde'?('🟡 Registrada — '+retraso+' min tarde vs '+hhmm(hora_turno)+'.'):'✅ Llegada registrada (sin turno hoy).'),'ok');
  },err=>{$('llegue').disabled=false;$('geo').textContent='';msg($('checmsg'),'No pudimos obtener tu ubicación: '+(err.message||'permiso denegado')+'.','err');},{enableHighAccuracy:true,timeout:12000,maximumAge:0});
};

// ---- Sesión / arranque ----
async function start(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').style.display='flex';$('shell').style.display='none';return}
  $('login').style.display='none';$('shell').style.display='grid';
  const uid=session.user.id;
  const {data:roles}=await sb.from('user_roles').select('role').eq('user_id',uid);
  isGerencia=(roles||[]).some(r=>MGMT.includes(String(r.role).toLowerCase()));
  const {data:link}=await sb.from('empleado_login').select('employee_id').eq('user_id',uid).maybeSingle();
  EMP=link?link.employee_id:null;
  let nombre=session.user.email;
  if(EMP){const {data:e}=await sb.from('v_empleados_publico').select('nombre').eq('id',EMP).maybeSingle();if(e&&e.nombre)nombre=e.nombre;}
  $('who').textContent=nombre+(isGerencia?' · gerencia':' · colaborador');
  const {data:cfg}=await sb.from('checador_config').select('*').eq('id',1).maybeSingle();
  CFG=cfg||{lat:19.43033,lng:-99.13449,radio_m:50,tolerancia_min:15,lugar:'tu lugar de trabajo'};
  $('checsub').textContent='Marca tu llegada estando a ≤'+CFG.radio_m+' m de '+(CFG.lugar||'tu lugar de trabajo')+'.';
  const M=buildMenu(); render(M);
  if(flat[0]&&flat[0].src) select(flat[0].src,flat[0].t,flat[0].grp); else openHorario();
}
$('l-go').onclick=async()=>{
  $('l-err').className='err';$('l-go').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('l-email').value.trim(),password:$('l-pass').value});
  $('l-go').disabled=false;
  if(error){$('l-err').textContent='No pudimos entrar: '+(error.message||'revisa tus datos');$('l-err').className='err show';return}
  start();
};
$('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('l-go').click()});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
start();
</script>
</body></html>
