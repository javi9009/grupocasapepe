<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grupo Casa Pepe</title>
<style>
  :root {
    --bg:#ffffff; --bg2:#f7f6f1; --bg3:#f1efe8;
    --txt:#2c2c2a; --txt2:#5f5e5a; --txt3:#888780;
    --accent:#1d9e75; --gold:#FFD700; --warn:#E1251B;
    --bd:rgba(0,0,0,.10);
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--txt); }
  .layout { display:grid; grid-template-columns:260px 1fr; min-height:100vh; }
  aside { background:var(--bg2); padding:1.5rem 1rem; border-right:1px solid var(--bd); }
  aside .brand { font-weight:500; font-size:14px; color:var(--txt); margin-bottom:1.5rem; }
  aside h2 { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--txt3); margin:1.25rem 0 .5rem; font-weight:500; }
  aside ul { list-style:none; padding:0; margin:0; }
  aside li a {
    display:block; padding:7px 11px; border-radius:6px; color:var(--txt); text-decoration:none; font-size:13px;
    transition: background .12s;
  }
  aside li a:hover { background:var(--bg3); color:var(--accent); }
  aside li a.disabled { color:var(--txt3); pointer-events:none; }
  aside li a.disabled::after { content:' · próx'; color:var(--txt3); font-size:10px; }

  main { padding:2rem; }
  .panel-internal { font-size:11px; text-transform:uppercase; letter-spacing:2px; color:var(--txt3); margin-bottom:.5rem; }
  h1 { font-size:28px; font-weight:500; margin:0 0 1rem; }
  .lead { color:var(--txt2); margin:0 0 2rem; max-width:680px; line-height:1.6; }

  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:1rem; margin-bottom:2rem; }
  .card { background:var(--bg2); padding:1.25rem; border-radius:10px; }
  .card .label { font-size:11px; text-transform:uppercase; letter-spacing:1.5px; color:var(--txt3); margin-bottom:.5rem; }
  .card .value { font-size:24px; font-weight:500; }
  .card .sub { font-size:12px; color:var(--txt3); margin-top:.25rem; }

  .modulos-block { background:var(--bg2); padding:1.5rem; border-radius:12px; margin-bottom:2rem; }
  .modulos-block h3 { font-size:13px; margin:0 0 1rem; color:var(--txt2); font-weight:500; text-transform:uppercase; letter-spacing:1px; }
  .modulos-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:.75rem; }
  .modulo-card {
    background:#fff; padding:1rem 1.1rem; border-radius:8px;
    border:1px solid var(--bd);
    text-decoration:none; color:var(--txt);
    display:block;
    transition: border-color .12s, transform .08s;
  }
  .modulo-card:hover { border-color:var(--accent); transform:translateY(-1px); box-shadow:0 2px 6px rgba(0,0,0,.04); }
  .modulo-card .tag { display:inline-block; font-size:10px; text-transform:uppercase; letter-spacing:1px; color:var(--accent); margin-bottom:.4rem; }
  .modulo-card .titulo { font-weight:500; font-size:14px; margin-bottom:.25rem; }
  .modulo-card .desc { font-size:12px; color:var(--txt2); line-height:1.5; }
  .modulo-card.preview { opacity:.55; pointer-events:none; }
  .modulo-card.preview .tag { color:var(--txt3); }

  .info-box {
    background:#FFFBEB; border-left:4px solid #c47318; padding:.85rem 1rem;
    border-radius:6px; font-size:13px; color:#7A2A04; margin-bottom:1.5rem;
  }
</style>
</head>
