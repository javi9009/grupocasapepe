<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funnel de captación de hoteles</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 10px;max-width:1420px;margin:0 auto}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.wrap{max-width:1420px;margin:0 auto;padding:0 16px 80px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.mini{font-size:12px;color:var(--muted)}
/* el embudo */
.emb{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin-bottom:16px}
@media(max-width:1100px){.emb{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.emb{grid-template-columns:repeat(2,minmax(0,1fr))}}
.et{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:13px 14px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.et:before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--faint)}
.et .en{font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.et .ev{font-size:28px;font-weight:800;line-height:1.05;margin-top:5px}
.et .ed{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4}
.et .fr{font-size:11.5px;font-weight:700;margin-top:6px}
/* por grupo */
.gr{border:1px solid var(--rule);border-radius:12px;margin-bottom:11px;background:var(--surface);overflow:hidden}
.grc{display:flex;gap:12px;align-items:center;padding:12px 15px;background:var(--surface-3);cursor:pointer;flex-wrap:wrap}
.grc .gn{font-weight:700;font-size:14px;flex:1;min-width:150px}
.grc .gm{font-size:12px;color:var(--muted)}
.grh{display:none}
.gr.ab .grh{display:block}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:9px 11px;border-top:1px solid var(--rule);vertical-align:middle}
th{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;background:var(--surface)}
td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.pas{display:inline-flex;gap:3px}
.pas i{width:16px;height:6px;border-radius:99px;background:var(--surface-2);display:block}
.pas i.on{background:var(--accent)}
.sel{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--rule);border-radius:7px;background:var(--surface)}
.xy{font-weight:700}
.xy.ok{color:var(--ok)} .xy.med{color:var(--warn)} .xy.no{color:var(--faint)}
.lnk{color:var(--accent);text-decoration:none;font-weight:600;font-size:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;display:none;z-index:40}
.toast.err{background:var(--bad)}
</style><link rel="icon" type="image/png" href="/dash-192.png">
</head><body>
<div class="top"><h1>🧲 Funnel de captación de hoteles</h1><div class="sub" id="sub">Cargando…</div></div>
<div class="wrap">
  <div class="emb" id="emb"></div>
  <div class="card">
    <h3>Dónde se atasca</h3>
    <div class="hint">Un hotel no está vendido cuando firma: está vendido cuando tiene experiencias puestas, concierges dados de alta y algo a la venta. Las tres últimas columnas son las que de verdad cuestan.</div>
    <div id="grupos"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var ETAPAS=[
    {k:'candidato',  n:'Candidatos',  d:'Los tenemos en la mira',               c:'#A49B8C'},
    {k:'contactado', n:'Contactados', d:'Ya hablamos con ellos',                c:'#8DC8EA'},
    {k:'alta',       n:'De alta',     d:'Firmaron y están dados de alta',       c:'#1A7FB5'},
    {k:'intangibles',n:'Con oferta',  d:'Ya escogieron qué vender',             c:'#8C6212'},
    {k:'concierges', n:'Con equipo',  d:'Tienen quien lo venda en recepción',   c:'#C9501A'},
    {k:'venta',      n:'Vendiendo',   d:'Su app está viva y cobra',             c:'#1D6B4A'}
  ];
  var H=[];
  function $(i){return document.getElementById(i);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=localStorage.getItem(k);if(v.indexOf('base64-')===0)v=atob(v.slice(7));var j=JSON.parse(v||'null');var s=j&&(j.currentSession||j);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
  function toast(t,e){var x=$('toast');x.textContent=t;x.className='toast'+(e?' err':'');x.style.display='block';setTimeout(function(){x.style.display='none';},2400);}
  function xy(a,b){ var c = b===0?'no' : a>=b?'ok' : a>0?'med':'no';
    return '<span class="xy '+c+'">'+a+'</span><span class="mini"> de '+b+'</span>'; }

  async function load(){
    var r=await fetch(SB+'/rest/v1/v_hotel_funnel?select=*&order=grupo_nombre.nullsfirst,nombre_comercial',{headers:hdr()});
    if(!r.ok){ $('sub').textContent='No se pudo cargar. Abre esta pantalla desde el panel.'; return; }
    H=await r.json();
    $('sub').textContent=H.length+' hoteles · '+H.filter(function(h){return h.etapa==='venta';}).length+' vendiendo';
    pintaEmbudo(); pintaGrupos();
  }

  /* El embudo cuenta hoteles que YA PASARON por cada etapa, no los que están
     parados ahí: si no, "vendiendo" se ve vacío aunque todo vaya bien. */
  function pintaEmbudo(){
    var orden=ETAPAS.map(function(e){return e.k;});
    var tot=H.length;
    $('emb').innerHTML=ETAPAS.map(function(e,i){
      var n=H.filter(function(h){return orden.indexOf(h.etapa)>=i;}).length;
      var pct=tot?Math.round(n/tot*100):0;
      return '<div class="et" style="--c:'+e.c+'"><span style="position:absolute;left:0;top:0;bottom:0;width:4px;background:'+e.c+'"></span>'
        +'<div class="en">'+esc(e.n)+'</div><div class="ev">'+n+'</div>'
        +'<div class="fr" style="color:'+e.c+'">'+pct+'% del total</div>'
        +'<div class="ed">'+esc(e.d)+'</div></div>';
    }).join('');
  }

  function pintaGrupos(){
    var G={}, orden=[];
    H.forEach(function(h){ var k=h.grupo_nombre||'Sin grupo'; if(!G[k]){G[k]=[];orden.push(k);} G[k].push(h); });
    $('grupos').innerHTML=orden.map(function(k){
      var L=G[k], vend=L.filter(function(h){return h.etapa==='venta';}).length;
      return '<div class="gr ab"><div class="grc"><span class="gn">'+esc(k)+'</span>'
        +'<span class="gm">'+L.length+' hotel'+(L.length===1?'':'es')+' · '+xy(vend,L.length)+' a la venta</span></div>'
        +'<div class="grh"><table><thead><tr>'
        +'<th>Hotel</th><th>Ciudad</th><th>Etapa</th><th>Avance</th>'
        +'<th>Experiencias</th><th>Concierges</th><th>Módulos</th><th>Contrato</th><th></th></tr></thead><tbody>'
        + L.map(function(h){
            var i=ETAPAS.map(function(e){return e.k;}).indexOf(h.etapa);
            return '<tr><td><b>'+esc(h.nombre_comercial||'')+'</b></td>'
              +'<td class="mini">'+esc(h.ciudad||'—')+'</td>'
              +'<td><select class="sel" data-h="'+h.id+'">'
                + ETAPAS.map(function(e){return '<option value="'+e.k+'"'+(h.etapa===e.k?' selected':'')+'>'+esc(e.n)+'</option>';}).join('')
                +'<option value="descartado"'+(h.etapa==='descartado'?' selected':'')+'>Descartado</option></select></td>'
              +'<td><span class="pas">'+ETAPAS.map(function(e,j){return '<i class="'+(j<=i?'on':'')+'"></i>';}).join('')+'</span></td>'
              +'<td class="n">'+xy(h.intangibles,h.intangibles>0?h.intangibles:0)+'</td>'
              +'<td class="n">'+xy(h.concierges,h.gente||0)+'</td>'
              +'<td class="n">'+h.modulos+'</td>'
              +'<td class="mini">'+(h.firmado?String(h.contrato_firmado_at).slice(0,10):'sin firmar')+'</td>'
              +'<td><a class="lnk" href="/m/hoteles.html">Su ficha</a> · '
              +'<a class="lnk" href="/m/hotel-portal.html?h='+h.id+'">Su portal</a></td></tr>';
          }).join('')
        +'</tbody></table></div></div>';
    }).join('');
    $('grupos').querySelectorAll('.grc').forEach(function(c){c.onclick=function(){c.parentNode.classList.toggle('ab');};});
    $('grupos').querySelectorAll('select[data-h]').forEach(function(s){
      s.onclick=function(e){e.stopPropagation();};
      s.onchange=async function(){
        var id=s.getAttribute('data-h'), v=s.value, b={etapa:v};
        if(v==='contactado') b.contactado_at=new Date().toISOString();
        if(v==='venta')      b.a_la_venta_at=new Date().toISOString();
        var h=hdr(); h['Prefer']='return=representation';
        var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+id,{method:'PATCH',headers:h,body:JSON.stringify(b)});
        if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,100),true);return;}
        var j=await r.json();
        if(!j||!j.length){toast('No se guardó: no puedes editar ese hotel.',true);return;}
        toast('Movido a '+v); await load();
      };
    });
  }
  load();
})();
</script>
</body></html>
