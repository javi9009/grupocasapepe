<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Funnel de hoteles</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{max-width:1500px;margin:0 auto;padding:16px 16px 4px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.top .der{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.barra{max-width:1500px;margin:0 auto;padding:10px 16px 0;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff}
.tablero{display:flex;gap:13px;overflow-x:auto;padding:16px 16px 90px;max-width:1500px;margin:0 auto;align-items:flex-start}
.col{flex:0 0 252px;background:var(--surface-3);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;max-height:76vh}
.col.dentro{outline:2px dashed var(--accent);outline-offset:-3px;background:var(--accent-soft)}
.col .cab{padding:11px 13px 9px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface-3);border-radius:12px 12px 0 0}
.col .cab .num{font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--faint)}
.col .cab h2{font-size:13px;font-weight:700;margin:2px 0 0;line-height:1.25}
.col .cab .cuenta{font-size:20px;font-weight:800;margin-top:3px}
.col .cab .cuenta small{font-size:11px;color:var(--muted);font-weight:400;margin-left:4px}
.col .cab .qd{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.4}
.col .cuerpo{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:70px}
.t{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 11px;cursor:grab;box-shadow:var(--shadow)}
.t:active{cursor:grabbing}
.t.arrastrando{opacity:.45}
.t .tn{font-weight:700;font-size:13px;line-height:1.3}
.t .tm{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.t .marcas{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.mk{font-size:9.5px;font-weight:700;border-radius:999px;padding:3px 7px;background:var(--surface-2);color:var(--muted)}
.mk.si{background:var(--ok-bg);color:var(--ok)}
.t .auto{font-size:10.5px;color:var(--warn);margin-top:6px;font-weight:600}
.vacia{color:var(--faint);font-size:12px;text-align:center;padding:14px 6px}
.lnk{color:var(--accent);text-decoration:none;font-weight:600;font-size:11.5px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;display:none;z-index:40}
.toast.err{background:var(--bad)}
.nota{max-width:1500px;margin:0 auto;padding:4px 16px 0;font-size:12px;color:var(--muted);line-height:1.5}
</style><link rel="icon" type="image/png" href="/dash-192.png">
</head><body>
<div class="top">
  <div><h1>🧲 Funnel de hoteles</h1><div class="sub" id="sub">Cargando…</div></div>
  <div class="der"><label class="chip" style="cursor:default">Agrupar por <select id="gby" style="font:inherit;border:0;background:none;font-weight:700"><option value="">nada</option><option value="grupo">grupo</option><option value="ciudad">ciudad</option></select></label></div>
</div>
<div class="barra" id="barra"></div>
<div class="nota">La etapa se calcula sola de lo que el hotel ya hizo. Puedes arrastrar una tarjeta <b>hacia adelante</b> para anotar algo que pasó fuera del sistema, pero no hacia atrás de donde los hechos la ponen.</div>
<div class="tablero" id="tablero"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  /* Mismo tablero que el de touroperadoras y productoras: columnas, tarjetas
     que se arrastran, y una etapa automatica que sale de los hechos. */
  var ETAPAS=[
    {k:'candidato',  n:'Candidatos',  q:'Los tenemos en la mira'},
    {k:'contactado', n:'Contactados', q:'Ya hablamos con ellos'},
    {k:'alta',       n:'De alta',     q:'Firmaron el acuerdo'},
    {k:'intangibles',n:'Con oferta',  q:'Escogieron qué vender'},
    {k:'concierges', n:'Con equipo',  q:'Tienen quién lo venda'},
    {k:'venta',      n:'Vendiendo',   q:'Su app está viva'}
  ];
  var H=[], gby='', filtro='', llevando=null;
  function $(i){return document.getElementById(i);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=localStorage.getItem(k);if(v.indexOf('base64-')===0)v=atob(v.slice(7));var j=JSON.parse(v||'null');var s=j&&(j.currentSession||j);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
  function toast(t,e){var x=$('toast');x.textContent=t;x.className='toast'+(e?' err':'');x.style.display='block';setTimeout(function(){x.style.display='none';},2600);}
  function ix(k){ for(var i=0;i<ETAPAS.length;i++) if(ETAPAS[i].k===k) return i; return 0; }
  function donde(h){ /* la de la mano manda solo si va por delante de la automatica */
    return Math.max(ix(h.etapa||'candidato'), ix(h.etapa_auto||'candidato')); }

  async function load(){
    var r=await fetch(SB+'/rest/v1/v_hotel_embudo?select=*&order=nombre_comercial',{headers:hdr()});
    if(!r.ok){ $('sub').textContent='No se pudo cargar. Abre esta pantalla desde el panel.'; return; }
    H=await r.json();
    $('sub').textContent=H.length+' hoteles · '+H.filter(function(h){return donde(h)>=5;}).length+' vendiendo';
    pintaBarra(); pinta();
  }

  function pintaBarra(){
    var gs={}; H.forEach(function(h){ gs[h.grupo_nombre||'Sin grupo']=1; });
    var L=Object.keys(gs).sort();
    $('barra').innerHTML='<button class="chip'+(filtro===''?' on':'')+'" data-f="">Todos</button>'
      + L.map(function(g){return '<button class="chip'+(filtro===g?' on':'')+'" data-f="'+esc(g)+'">'+esc(g)+'</button>';}).join('');
    $('barra').querySelectorAll('.chip').forEach(function(c){c.onclick=function(){filtro=c.getAttribute('data-f');pintaBarra();pinta();};});
  }

  function visibles(){ return filtro? H.filter(function(h){return (h.grupo_nombre||'Sin grupo')===filtro;}) : H; }

  function pinta(){
    var V=visibles(), tot=V.length;
    $('tablero').innerHTML=ETAPAS.map(function(e,i){
      var L=V.filter(function(h){return donde(h)===i;});
      var pasaron=V.filter(function(h){return donde(h)>=i;}).length;
      return '<div class="col" data-e="'+e.k+'"><div class="cab">'
        +'<div class="num">Paso '+(i+1)+'</div><h2>'+esc(e.n)+'</h2>'
        +'<div class="cuenta">'+L.length+'<small>aquí · '+pasaron+' ya pasaron'+(tot?' ('+Math.round(pasaron/tot*100)+'%)':'')+'</small></div>'
        +'<div class="qd">'+esc(e.q)+'</div></div>'
        +'<div class="cuerpo" data-e="'+e.k+'">'
        + (L.length? L.map(tarjeta).join('') : '<div class="vacia">Vacío</div>')
        +'</div></div>';
    }).join('');
    engancha();
  }

  function tarjeta(h){
    var manual = ix(h.etapa||'candidato') > ix(h.etapa_auto||'candidato');
    var M=[['Firmó',h.firmado],['Oferta',h.intangibles>0],['Concierge',h.concierges>0],
           ['PMS',h.pms_ok],['Cobro',h.cobro_ok],['Espacios',h.espacios>0]];
    return '<div class="t" draggable="true" data-h="'+h.id+'">'
      +'<div class="tn">'+esc(h.nombre_comercial||'')+'</div>'
      +'<div class="tm">'+esc(h.grupo_nombre||'Sin grupo')+' · '+esc(h.ciudad||'')+(h.cuartos?' · '+h.cuartos+' cuartos':'')+'</div>'
      +'<div class="marcas">'+M.map(function(m){return '<span class="mk'+(m[1]?' si':'')+'">'+m[0]+'</span>';}).join('')+'</div>'
      + (manual?'<div class="auto">Movido a mano · los hechos lo ponen en «'+esc((ETAPAS[ix(h.etapa_auto)]||{}).n||'')+'»</div>':'')
      +'<div style="margin-top:7px"><a class="lnk" href="/m/hoteles.html">Ficha</a> · <a class="lnk" href="/hotelero.html?h='+h.id+'">Su portal</a></div>'
      +'</div>';
  }

  function engancha(){
    document.querySelectorAll('.t').forEach(function(t){
      t.addEventListener('dragstart',function(ev){ llevando=t.getAttribute('data-h'); t.classList.add('arrastrando');
        try{ev.dataTransfer.setData('text/plain',llevando);}catch(_){ } });
      t.addEventListener('dragend',function(){ t.classList.remove('arrastrando'); llevando=null; });
    });
    document.querySelectorAll('.cuerpo').forEach(function(c){
      c.addEventListener('dragover',function(ev){ ev.preventDefault(); c.classList.add('dentro'); });
      c.addEventListener('dragleave',function(){ c.classList.remove('dentro'); });
      c.addEventListener('drop',function(ev){ ev.preventDefault(); c.classList.remove('dentro');
        var id=llevando||ev.dataTransfer.getData('text/plain'); if(id) mueve(id,c.getAttribute('data-e')); });
    });
  }

  async function mueve(id,etapa){
    var h=H.filter(function(x){return x.id===id;})[0]; if(!h) return;
    if(ix(etapa) < ix(h.etapa_auto||'candidato')){
      toast('No se puede: los hechos ya lo ponen en «'+(ETAPAS[ix(h.etapa_auto)]||{}).n+'»',true); return;
    }
    if(etapa===h.etapa) return;
    var b={etapa:etapa};
    if(etapa==='contactado' && !h.contactado_at) b.contactado_at=new Date().toISOString();
    if(etapa==='venta'      && !h.a_la_venta_at) b.a_la_venta_at=new Date().toISOString();
    var hh=hdr(); hh['Prefer']='return=representation';
    var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+id,{method:'PATCH',headers:hh,body:JSON.stringify(b)});
    if(!r.ok){ toast('No se pudo mover: '+(await r.text()).slice(0,100),true); return; }
    var j=await r.json();
    if(!j||!j.length){ toast('No se guardó: no puedes editar ese hotel.',true); return; }
    toast(h.nombre_comercial+' → '+(ETAPAS[ix(etapa)]||{}).n);
    await load();
  }

  $('gby').onchange=function(){ gby=this.value; pinta(); };
  load();
})();
</script>
</body></html>
