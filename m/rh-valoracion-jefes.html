<!doctype html>
<html lang="es">
<head>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valoración de jefes · RH · Grupo Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--ground);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:.8rem}
#estado{margin-left:auto;font-size:.78rem;color:var(--muted)}
#estado.ok{color:var(--ok)} #estado.err{color:var(--bad)}

.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.mini{padding:4px 9px;font-size:.76rem;border-radius:5px}
select,input{font:inherit;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);padding:16px;margin:14px 0}
.card h2{margin:0 0 2px;font-size:.95rem;font-weight:700}
.card .meta{color:var(--muted);font-size:.78rem}
.vacia{color:var(--muted);font-style:italic;margin:10px 0}
.faint{color:var(--faint)}
.nota{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:6px;
  padding:10px 12px;font-size:.8rem;color:#6b4f12;margin:10px 0}
.pill{display:inline-block;border-radius:999px;font-size:.66rem;font-weight:700;padding:1px 8px;
  border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

.barra{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:6px 0 2px}
.barra > i{display:block;height:100%;background:var(--accent)}
.prow{display:grid;grid-template-columns:1fr 150px 62px;gap:12px;align-items:center;
  padding:9px 2px;border-top:1px solid var(--rule);font-size:.82rem}
.prow .pb{position:relative;height:16px;background:var(--none-bg);border:1px solid var(--rule);border-radius:5px;overflow:hidden}
.prow .pb i{display:block;height:100%;background:var(--accent)}
.prow .pb i.w{background:var(--warn)} .prow .pb i.b{background:var(--bad)}
.prow .pv{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.bq{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);
  font-weight:600;margin:16px 0 2px}
.abierta{border-left:3px solid var(--rule-2);background:var(--surface-3);padding:9px 12px;
  margin:8px 0;border-radius:0 6px 6px 0;font-size:.85rem;white-space:pre-wrap}
.gran{font-size:2rem;font-weight:700;line-height:1}
.gran small{font-size:.8rem;font-weight:500;color:var(--muted)}
.oculto{display:none}
@media(max-width:640px){.prow{grid-template-columns:1fr 90px 54px;gap:8px}}
</style>
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Valoración de jefes</h1>
    <span class="sub">Lo que su equipo dice de ellos, en anónimo</span>
    <span id="estado"></span>
  </div>
</header>

<nav class="secnav" aria-label="Secciones">
  <div class="secnav-in" id="tabs">
    <button data-t="jefes"      aria-selected="true">Jefes</button>
    <button data-t="resultados" aria-selected="false">Resultados</button>
    <button data-t="preguntas"  aria-selected="false">Las preguntas</button>
  </div>
</nav>

<main class="wrap" id="vista"><p class="vacia">Cargando…</p></main>

<script src="/cp-acceso.js"></script>
<script>if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);
  const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);
  if(_t){H.Authorization='Bearer '+_t;}}}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function estado(t,c){const e=$('estado');e.textContent=t||'';e.className=c||'';}
async function api(p,o){const r=await fetch(SB+p,{headers:H,...o});
  if(!r.ok){estado('⚠ '+r.status,'err');throw new Error(await r.text());}
  const c=await r.text();return c?JSON.parse(c):null;}
const rpc=(n,b)=>api('/rpc/'+n,{method:'POST',body:JSON.stringify(b||{})});

const BLOQ={trato:'Cómo te trata', escucha:'Cómo te escucha', herramientas:'Para poder trabajar',
  desempeno:'Mi desempeño en Casa Pepe', equipo:'El equipo', abierta:'Lo que quieras contar'};

let JEFES=[], PREG=[], TAB='jefes', RES=null, RONDA=null;

async function cargar(){
  estado('cargando…');
  JEFES = await rpc('enc_panel_jefes') || [];
  PREG  = await api('/enc_preguntas?select=*&tipo_encuesta=eq.jefe&order=orden') || [];
  estado('');
  pinta();
}

/* ─────────────────────────────── jefes ─────────────────────────────── */
function vJefes(){
  if(!JEFES.length) return '<p class="vacia">Todavía nadie tiene equipo asignado en el organigrama. '
    +'En cuanto cada quien tenga su jefe jerárquico, aquí aparecen.</p>';

  let h='<div class="nota"><b>Solo se lanza con 3 personas o más.</b> Con uno o dos, quien contesta '
   +'queda señalado y la encuesta deja de servir. Las respuestas se guardan sin nombre y sin hora: '
   +'ni tú ni el jefe pueden saber quién dijo qué.</div>'
   +'<div class="card"><div class="scroll"><table><thead><tr>'
   +'<th>Jefe</th><th>Equipo</th><th>Última ronda</th><th class="num">Contestadas</th>'
   +'<th class="num">Nota</th><th></th></tr></thead><tbody>';

  JEFES.forEach(function(j){
    const chico = (j.equipo_con_acceso||0) < 3;
    const abierta = j.ronda_estado==='abierta';
    let ronda='<span class="faint">nunca</span>';
    if(j.ronda){
      ronda = abierta
        ? '<span class="pill warn">abierta</span> cierra '+esc(j.ronda_cierra||'')
        : '<span class="pill">cerrada</span> '+esc(String(j.lanzada||'').slice(0,10));
    }
    const nota = (j.promedio_0_10!=null && (j.contestadas||0)>=3)
      ? '<b>'+j.promedio_0_10+'</b> <span class="faint">/10</span>'
      : ((j.contestadas||0)>0 ? '<span class="faint">aún no</span>' : '—');

    h+='<tr><td><b>'+esc(j.nombre)+'</b><div class="meta">'+esc(j.rol||'')
      +(j.sede?' · '+esc(j.sede):'')+'</div></td>'
      +'<td>'+(j.equipo||0)+(j.equipo_con_acceso!==j.equipo
          ? ' <span class="faint">('+(j.equipo_con_acceso||0)+' con acceso)</span>' : '')
      +(chico?'<div><span class="pill bad">equipo chico</span></div>':'')+'</td>'
      +'<td>'+ronda+'</td>'
      +'<td class="num">'+(j.ronda?((j.contestadas||0)+' / '+(j.invitados||0)):'—')+'</td>'
      +'<td class="num">'+nota+'</td>'
      +'<td style="text-align:right;white-space:nowrap">'
      + (j.ronda ? '<button class="btn ghost mini" data-ver="'+j.ronda+'">Ver</button> ' : '')
      + (abierta
          ? '<button class="btn ghost mini" data-cerrar="'+j.ronda+'">Cerrar</button>'
          : (chico
              ? '<span class="faint" style="font-size:.74rem">hacen falta 3</span>'
              : '<button class="btn mini" data-lanzar="'+j.id+'">Lanzar</button>'))
      +'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* ───────────────────────────── resultados ──────────────────────────── */
function vResultados(){
  const conRonda = JEFES.filter(function(j){return j.ronda;});
  if(!conRonda.length) return '<p class="vacia">Todavía no se ha lanzado ninguna ronda.</p>';

  let h='<div class="card"><label class="meta">Ronda</label><br><select id="selR" style="margin-top:4px;min-width:280px">';
  conRonda.forEach(function(j){
    h+='<option value="'+j.ronda+'"'+(RONDA===j.ronda?' selected':'')+'>'+esc(j.nombre)
      +' · '+(j.ronda_estado==='abierta'?'abierta':'cerrada')
      +' · '+(j.contestadas||0)+' de '+(j.invitados||0)+'</option>';
  });
  h+='</select></div><div id="resbox"><p class="vacia">Elige una ronda.</p></div>';
  return h;
}

function pintaResultado(){
  const box=$('resbox'); if(!box) return;
  if(!RES){ box.innerHTML='<p class="vacia">Elige una ronda.</p>'; return; }
  if(RES.error){ box.innerHTML='<p class="vacia">'+esc(RES.error)+'</p>'; return; }

  if(!RES.publicable){
    box.innerHTML='<div class="card"><h2>Todavía no se puede enseñar</h2>'
      +'<div class="nota">'+esc(RES.nota||'')+'</div>'
      +'<div class="meta">'+(RES.respuestas||0)+' de '+(RES.invitados||0)+' han contestado.</div></div>';
    return;
  }

  const prom=RES.promedio_0_10;
  const cls = prom==null ? '' : (prom>=7?'ok':(prom>=6?'warn':'bad'));
  let h='<div class="card"><h2>'+esc(RES.persona||'')+'</h2>'
   +'<div class="meta">'+esc(RES.rol||'')+(RES.sede?' · '+esc(RES.sede):'')
   +' · '+(RES.respuestas||0)+' de '+(RES.invitados||0)+' contestaron</div>'
   +'<div style="margin-top:12px"><span class="gran">'+(prom==null?'—':prom)+'</span> <small>/10</small> '
   +(cls?'<span class="pill '+cls+'">'+(prom>=7?'bien':(prom>=6?'justo':'hay que hablarlo'))+'</span>':'')
   +'</div>'
   +'<div class="meta" style="margin-top:6px">Mínimo del plan de carrera: 6 para jefatura, 7 para gerencia.</div>'
   +'</div>';

  const por=RES.por_pregunta||[];
  let bloque=null;
  h+='<div class="card"><h2>Pregunta por pregunta</h2>';
  por.forEach(function(p){
    if(p.bloque!==bloque){ bloque=p.bloque; h+='<div class="bq">'+esc(BLOQ[bloque]||bloque||'')+'</div>'; }
    const m=Number(p.media)||0, pct=Math.max(0,Math.min(100,(m-1)/4*100));
    const c = !p.cuenta ? 'w' : (m>=4?'':(m>=3?'w':'b'));
    h+='<div class="prow"><div>'+esc(p.pregunta)
      +(p.cuenta?'':' <span class="pill warn">no suma</span>')
      +(p.bajas>0?' <span class="faint">· '+p.bajas+' en 1 o 2</span>':'')
      +'</div>'
      +'<div class="pb"><i class="'+c+'" style="width:'+pct.toFixed(0)+'%"></i></div>'
      +'<div class="pv">'+m.toFixed(1)+'</div></div>';
  });
  h+='</div>';

  const ab=RES.abiertas||[];
  h+='<div class="card"><h2>Lo que escribieron</h2>';
  h+= ab.length
    ? ab.map(function(g){
        return '<div class="bq">'+esc(g.pregunta||'')+'</div>'
          +(g.respuestas||[]).map(function(t){return '<div class="abierta">'+esc(t)+'</div>';}).join('');
      }).join('')
    : '<p class="vacia">Nadie escribió nada.</p>';
  h+='<div class="meta" style="margin-top:8px">Van en orden alfabético, no en el orden en que llegaron, '
    +'para que no se pueda juntar lo que escribió una misma persona.</div></div>';

  box.innerHTML=h;
}

/* ───────────────────────────── preguntas ───────────────────────────── */
function vPreguntas(){
  let h='<div class="nota">Son '+PREG.length+' preguntas. La escala va de 1 a 5 y cada pregunta '
   +'dice qué significa cada extremo, para que nadie tenga que adivinar. La nota final es el promedio '
   +'×2, así queda en una escala de 0 a 10 — la misma que usa el plan de carrera.</div>'
   +'<div class="card"><div class="scroll"><table><thead><tr>'
   +'<th>#</th><th>Bloque</th><th>Pregunta</th><th>1 =</th><th>5 =</th><th>Suma</th>'
   +'</tr></thead><tbody>';
  PREG.forEach(function(p,i){
    h+='<tr><td class="num">'+(i+1)+'</td>'
      +'<td>'+esc(BLOQ[p.bloque]||p.bloque||'')+'</td>'
      +'<td>'+esc(p.pregunta)+(p.tipo==='texto'?' <span class="pill">texto libre</span>':'')+'</td>'
      +'<td class="faint">'+esc(p.polo_bajo||'')+'</td>'
      +'<td class="faint">'+esc(p.polo_alto||'')+'</td>'
      +'<td>'+(p.cuenta_promedio?'sí':'<span class="faint">no</span>')+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}

/* ──────────────────────────────── pinta ────────────────────────────── */
function pinta(){
  const v=$('vista');
  if(TAB==='jefes')      v.innerHTML=vJefes();
  else if(TAB==='resultados') { v.innerHTML=vResultados(); engancharRonda(); }
  else                   v.innerHTML=vPreguntas();
}

function engancharRonda(){
  const s=$('selR'); if(!s) return;
  s.onchange=async function(){ RONDA=s.value; await verRonda(RONDA); };
  if(RONDA){ s.value=RONDA; pintaResultado(); }
}

async function verRonda(id){
  RONDA=id; RES=null;
  const box=$('resbox'); if(box) box.innerHTML='<p class="vacia">Cargando…</p>';
  try{ RES=await rpc('enc_resultado',{p_ronda:id}); }catch(e){ RES={error:'No se pudo leer el resultado.'}; }
  pintaResultado();
}

document.getElementById('tabs').onclick=function(e){
  const b=e.target.closest('button[data-t]'); if(!b) return;
  TAB=b.dataset.t;
  document.querySelectorAll('#tabs button').forEach(function(x){ x.setAttribute('aria-selected', x===b); });
  pinta();
};

document.addEventListener('click', async function(e){
  const lanzar=e.target.closest('[data-lanzar]');
  const cerrar=e.target.closest('[data-cerrar]');
  const ver=e.target.closest('[data-ver]');

  if(ver){
    RONDA=ver.dataset.ver; TAB='resultados';
    document.querySelectorAll('#tabs button').forEach(function(x){ x.setAttribute('aria-selected', x.dataset.t==='resultados'); });
    pinta(); await verRonda(RONDA); return;
  }

  if(lanzar){
    const j=JEFES.find(function(x){return x.id===lanzar.dataset.lanzar;})||{};
    if(!confirm('¿Lanzar la valoración de '+(j.nombre||'')+'?\n\n'
      +'Se le manda a sus '+(j.equipo_con_acceso||0)+' colaboradores y queda abierta 10 días.\n'
      +'Las respuestas son anónimas y no se enseñan hasta que haya 3.')) return;
    lanzar.disabled=true; lanzar.textContent='Lanzando…';
    try{
      const r=await rpc('enc_lanzar_jefe',{p_jefe:j.id,p_dias:10});
      if(r && r.error){ alert(r.error); }
      else estado('✓ lanzada a '+(r&&r.invitados||0)+' personas','ok');
    }catch(err){ alert('No se pudo: '+err.message); }
    await cargar(); return;
  }

  if(cerrar){
    if(!confirm('¿Cerrar la ronda?\n\nDespués de cerrarla ya nadie puede contestar.')) return;
    cerrar.disabled=true; cerrar.textContent='Cerrando…';
    try{ await rpc('enc_cerrar_ronda',{p_ronda:cerrar.dataset.cerrar}); estado('✓ cerrada','ok'); }
    catch(err){ alert('No se pudo: '+err.message); }
    await cargar(); return;
  }
});

cargar().catch(function(e){ $('vista').innerHTML='<p class="vacia">No se pudo cargar. '
  +'Si acabas de entrar, recarga la página.</p>'; });
</script>
</body>
</html>
