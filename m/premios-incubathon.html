<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Premios Incubathon · Ateneo</title>
<style>
:root{--bg:#f2efe9;--card:#fff;--line:#e4ded3;--ink:#2b2622;--mut:#7d7266;
 --clay:#d2632f;--gold:#8a6420;--green:#43663a;--r:12px;
 --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font-family:var(--sans);line-height:1.5;font-size:15px;padding:18px 16px 60px;max-width:1100px;margin:0 auto}
h1{font-family:var(--serif);font-size:24px;margin:0 0 2px;font-weight:600}
.sub{color:var(--mut);font-size:13.5px;margin:0 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
h2{font-family:var(--serif);font-size:18px;margin:0 0 10px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);
 padding:0 10px 8px;font-weight:700;white-space:nowrap}
td{padding:10px;border-top:1px solid var(--line);vertical-align:top}
.tag{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
 padding:3px 9px;border-radius:99px;background:#ece5da;color:var(--mut);white-space:nowrap}
.tag.firma{background:#e6eef6;color:#2f5c85}
.tag.ok{background:#e3efe0;color:var(--green)}
.tag.pag{background:#fbf0dc;color:var(--gold)}
.chk{color:var(--mut);font-size:13px}
.ok{color:var(--green);font-weight:700}
.no{color:var(--clay)}
.btn{font:inherit;font-size:13.5px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);
 background:#fff;color:var(--ink);border-radius:99px;padding:7px 14px;margin:0 4px 4px 0}
.btn.p{background:var(--clay);border-color:var(--clay);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
input{font:inherit;font-size:13.5px;border:1.5px solid var(--line);border-radius:8px;padding:7px 10px}
.vacio{color:var(--mut);font-style:italic}
.msg{font-size:13.5px;min-height:18px;margin:8px 0 0}
.msg.e{color:var(--clay)} .msg.k{color:var(--green)}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;font-size:12px;font-weight:700}
details summary{cursor:pointer;font-size:13.5px;color:var(--mut)}
code{background:#f1ece3;padding:1px 5px;border-radius:5px;font-size:12.5px}
.tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.tab{font:inherit;font-size:14px;font-weight:600;cursor:pointer;border:1.5px solid var(--line);background:#fff;
 color:var(--mut);border-radius:99px;padding:8px 16px}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
textarea{width:100%;font:inherit;font-size:13.5px;line-height:1.55;border:1.5px solid var(--line);
 border-radius:8px;padding:10px 12px;min-height:130px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace}
textarea:focus,input:focus{border-color:var(--gold);outline:none}
.sec{border-top:1px solid var(--line);padding:14px 0}
.sec:first-of-type{border-top:0}
.clave{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);font-weight:700}
.back{position:fixed;inset:0;background:rgba(20,17,15,.55);display:grid;place-items:center;padding:18px;z-index:50}
.modal{background:#fff;border-radius:14px;max-width:820px;width:100%;max-height:88vh;display:flex;flex-direction:column}
.mhead{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h2{margin:0;flex:1}
.mbody{overflow:auto;padding:20px 24px}
.mbody h1{font-size:21px} .mbody h2{font-size:16px;margin:22px 0 6px;color:var(--gold)}
.mbody table.ficha{width:100%;border-collapse:collapse;margin:12px 0;font-size:14px}
.mbody table.ficha th{text-align:left;color:var(--mut);font-weight:600;padding:6px 10px 6px 0;width:40%;vertical-align:top}
.mbody table.ficha td{padding:6px 0;vertical-align:top}
.mbody .pend{color:var(--clay);font-style:italic}
.mbody .sub{color:var(--mut)} .mbody .mini{color:var(--mut);font-size:13px}
.x{font:inherit;font-size:20px;line-height:1;cursor:pointer;border:0;background:none;color:var(--mut);padding:4px 8px}
</style>
</head>
<body>
<h1>🏆 Premios Incubathon</h1>
<p class="sub">Convenio de entrega · aportación de Casa Pepe de USD 500 por equipo, el 50% que corresponde a la empresa.
Se paga cuando han firmado la empresa <b>y</b> el equipo de desarrollo.</p>

<div class="tabs">
  <button class="tab on" id="tb-equipos" onclick="ve('equipos')">Equipos</button>
  <button class="tab" id="tb-texto" onclick="ve('texto')">Leer y editar el convenio</button>
</div>

<div id="panel"><p class="vacio">Cargando…</p></div>
<div id="modal"></div>

<script>
const SBU='https://rehophywchakfapivsbh.supabase.co';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const FN=SBU+'/functions/v1/premio';
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f=d=>d?new Date(d).toLocaleDateString('es-MX',{day:'2-digit',month:'short'}):'—';

function tokenSesion(){
  try{
    for(const k in localStorage){
      if(!/^sb-.*-auth-token$/.test(k)) continue;
      const v=JSON.parse(localStorage.getItem(k)||'null');
      const ses=v&&(v.currentSession||v);
      if(ses && ses.access_token) return ses.access_token;
    }
  }catch(e){}
  return null;
}
function H(){ const t=tokenSesion();
  return {'apikey':KEY,'Authorization':'Bearer '+(t||KEY),'Content-Type':'application/json'}; }

async function rpc(fn,body){
  const r=await fetch(SBU+'/rest/v1/rpc/'+fn,{method:'POST',headers:H(),body:JSON.stringify(body||{})});
  return await r.json();
}
async function accion(body){
  const r=await fetch(FN,{method:'POST',headers:H(),body:JSON.stringify(body)});
  return await r.json();
}

const ETAPA=c=>{
  if(c.estado==='acusado') return ['ok','Acusado'];
  if(c.estado==='pagado')  return ['pag','Pagado'];
  if(c.estado==='firmado') return ['ok','Listo para pagar'];
  if(c.estado==='en_firma')return ['firma','En firma'];
  if(c.estado==='anulado') return ['','Anulado'];
  return ['','Sin mandar'];
};

let DATOS=[], TEXTO=[], TAB='equipos';

function ve(t){
  TAB=t;
  $('tb-equipos').className='tab'+(t==='equipos'?' on':'');
  $('tb-texto').className='tab'+(t==='texto'?' on':'');
  t==='texto'?pintaTexto():pinta();
}

async function carga(){
  const [d,t]=await Promise.all([rpc('premio_lista'),rpc('premio_plantilla_lista')]);
  if(!Array.isArray(d)){ $('panel').innerHTML='<p class="vacio">No se pudo cargar. ¿Tienes permiso sobre esta página?</p>'; return }
  if(!d.length){ $('panel').innerHTML='<p class="vacio">Todavía no hay convenios cargados.</p>'; return }
  DATOS=d; TEXTO=Array.isArray(t)?t:[];
  TAB==='texto'?pintaTexto():pinta();
}

function pinta(){
  const n=k=>DATOS.filter(k).length;
  let h='<div class="res">'
   +'<span class="tag">Sin mandar — '+n(c=>c.estado==='borrador')+'</span>'
   +'<span class="tag firma">En firma — '+n(c=>c.estado==='en_firma')+'</span>'
   +'<span class="tag ok">Listos para pagar — '+n(c=>c.estado==='firmado')+'</span>'
   +'<span class="tag pag">Pagados — '+n(c=>c.estado==='pagado'||c.estado==='acusado')+'</span>'
   +'</div>';

  h+='<div class="card"><table><thead><tr><th>Equipo</th><th>Empresa</th><th>Desarrollo</th>'
   +'<th>Cuenta</th><th>Etapa</th><th></th></tr></thead><tbody>';

  DATOS.forEach(c=>{
    const fs=c.firmas||[];
    const fe=fs.find(x=>x.rol==='empresa'), fd=fs.find(x=>x.rol==='dev');
    const et=ETAPA(c);
    const marca=(x,quien)=> !x ? '<span class="chk">— sin enlace</span>'
      : x.firmado_at ? '<span class="ok">✓ firmó '+f(x.firmado_at)+'</span>'
      : '<span class="chk">enlace enviado '+f(x.enviado_at)+'</span>';

    h+='<tr><td><b>'+esc(c.empresa)+'</b><br><span class="chk">USD '+esc(c.monto_usd)+'</span></td>'
     +'<td>'+esc(c.rep_nombre||'—')+'<br><span class="chk">'+(c.rep_email?esc(c.rep_email):'<span class="no">sin correo</span>')+'</span>'
     +'<br>'+marca(fe)+'</td>'
     +'<td>'+esc(c.dev_nombre||'—')+'<br><span class="chk">'+esc(c.dev_email||'—')+'</span><br>'+marca(fd)+'</td>'
     +'<td class="chk">'+(c.clabe
         ? esc(c.titular||'')+'<br>'+esc(c.banco||'')+'<br><code>'+esc(c.clabe)+'</code>'
         : '<span class="no">todavía no</span>')+'</td>'
     +'<td><span class="tag '+et[0]+'">'+et[1]+'</span>'
     +(c.pagado_at?'<br><span class="chk">'+f(c.pagado_at)+(c.referencia?' · '+esc(c.referencia):'')+'</span>':'')+'</td>'
     +'<td style="min-width:210px">'+acciones(c)+'</td></tr>';
  });

  h+='</tbody></table><p class="msg" id="msg"></p></div>';

  h+='<div class="card"><h2>Cómo funciona</h2>'
   +'<p class="chk" style="margin:0">Le mandas el convenio al representante de la empresa. Él lo lee, escribe la cuenta '
   +'bancaria a su nombre, confirma el nombre y el correo del desarrollador y firma con el dedo. En ese momento le llega '
   +'al desarrollador su propio enlace: firma reconociendo el reparto 50/50 y que la mitad que le toca la paga ETH 5 de Mayo, '
   +'no Casa Pepe. Cuando los dos han firmado, el convenio pasa a <b>listo para pagar</b> y te llega un aviso. '
   +'De cada firma se guarda fecha, IP, dispositivo y el documento tal como se firmó.</p></div>';

  $('panel').innerHTML=h;
}

function acciones(c){
  const id=c.id;
  const ver='<button class="btn" onclick="verDoc(\''+id+'\')">Leer</button>';
  if(c.estado==='borrador'||c.estado==='en_firma'){
    const hay=!!c.rep_email;
    return (hay?'':'<input type="email" id="m-'+id+'" placeholder="correo de la empresa" style="width:100%;margin-bottom:6px">')
      +ver+'<button class="btn p" onclick="enviar(\''+id+'\')">'+(c.estado==='borrador'?'Mandar convenio':'Reenviar')+'</button>'
      +(c.estado==='en_firma'?' <button class="btn" onclick="recordar(\''+id+'\')">Recordar que firmen</button>':'');
  }
  if(c.estado==='firmado'){
    return '<input id="fix-'+id+'" placeholder="FIX" style="width:78px">'
      +' <input id="mxn-'+id+'" placeholder="MXN" style="width:88px">'
      +'<br><input id="ref-'+id+'" placeholder="referencia bancaria" style="width:100%;margin:6px 0">'
      +'<button class="btn p" onclick="pagar(\''+id+'\')">Marcar pagado</button>';
  }
  return ver;
}

/* ---------- leer el convenio de un equipo ---------- */
async function verDoc(id){
  const d=await rpc('premio_previo',{p_id:id});
  if(!d||!d.html){ alert('No se pudo abrir el convenio.'); return }
  const aviso = d.congelado && d.estado!=='borrador'
    ? '<p class="mini" style="color:var(--gold);margin:0 0 12px"><b>Éste es el texto congelado</b> que se mandó a firmar. '
      +'Editar la plantilla ya no lo cambia; sólo afecta a los que todavía no has mandado.</p>'
    : '<p class="mini" style="margin:0 0 12px">Vista previa con los datos de este equipo. Todavía no se ha mandado nada.</p>';
  $('modal').innerHTML='<div class="back" onclick="if(event.target===this)cierra()"><div class="modal">'
    +'<div class="mhead"><h2>'+esc(d.empresa)+'</h2><button class="x" onclick="cierra()">✕</button></div>'
    +'<div class="mbody">'+aviso+d.html+'</div></div></div>';
}
function cierra(){ $('modal').innerHTML=''; }

/* ---------- el texto del convenio, editable ---------- */
function pintaTexto(){
  if(!TEXTO.length){ $('panel').innerHTML='<p class="vacio">No se pudo cargar el texto.</p>'; return }
  let h='<div class="card"><h2>El texto que firman</h2>'
   +'<p class="chk">Esto es el convenio tal cual, partido en secciones. Edita lo que quieras y guarda: '
   +'lo que escribas aquí es lo que verán los que todavía no has mandado. Los ya mandados conservan el texto '
   +'congelado del día que salieron.</p>'
   +'<p class="chk" style="margin-top:8px">Los huecos se rellenan solos: '
   +'<code>{{EMPRESA}}</code> <code>{{PROYECTO}}</code> <code>{{REP}}</code> <code>{{DEV}}</code> '
   +'<code>{{MONTO}}</code> <code>{{PLAZO}}</code> <code>{{FECHAS}}</code> <code>{{EVENTO}}</code> '
   +'<code>{{BANCO}}</code>. Puedes usar HTML sencillo: <code>&lt;p&gt;</code> <code>&lt;b&gt;</code>.</p></div>';

  h+='<div class="card">';
  TEXTO.forEach(t=>{
    h+='<div class="sec"><div class="clave">'+esc(t.clave)+(t.updated_by?' · editado por '+esc(t.updated_by):'')+'</div>'
     +'<input type="text" id="ti-'+t.clave+'" placeholder="Título de la sección (opcional)" value="'+esc(t.titulo||'')+'" style="width:100%;margin:6px 0">'
     +'<textarea id="tc-'+t.clave+'">'+esc(t.cuerpo)+'</textarea>'
     +'<button class="btn p" style="margin-top:8px" onclick="guardaSec(\''+t.clave+'\')">Guardar esta sección</button>'
     +'<span class="msg" id="ms-'+t.clave+'"></span></div>';
  });
  h+='</div>';

  const primero=DATOS.find(c=>c.estado==='borrador')||DATOS[0];
  if(primero) h+='<div class="card"><h2>Cómo queda</h2><p class="chk">Ábrelo con los datos reales de un equipo '
   +'antes de mandar nada.</p><button class="btn" onclick="verDoc(\''+primero.id+'\')">Ver con los datos de '
   +esc(primero.empresa)+'</button></div>';

  $('panel').innerHTML=h;
}

async function guardaSec(clave){
  const m=$('ms-'+clave); m.className='msg'; m.textContent=' guardando…';
  const r=await rpc('premio_plantilla_guardar',{
    p_clave:clave, p_titulo:$('ti-'+clave).value, p_cuerpo:$('tc-'+clave).value});
  if(r&&r.error){ m.className='msg e'; m.textContent=' '+r.error; return }
  m.className='msg k'; m.textContent=' guardado';
  TEXTO=await rpc('premio_plantilla_lista');
}

async function enviar(id){
  const m=$('msg'); m.className='msg'; m.textContent='Mandando…';
  const inp=$('m-'+id);
  const r=await accion({accion:'enviar',id,email:inp?inp.value.trim():null});
  if(r.error){ m.className='msg e'; m.textContent=r.error; return }
  m.className='msg k';
  m.textContent=r.enviado?'Convenio enviado.':'Enlace creado, pero el correo no salió. Pásaselo a mano: '+r.link;
  await carga();
}

async function recordar(id){
  const m=$('msg'); m.className='msg'; m.textContent='Mandando el recordatorio…';
  const r=await accion({accion:'recordar',id});
  if(r.error){ m.className='msg e'; m.textContent=r.error; return }
  m.className='msg k';
  m.textContent = r.avisados
    ? 'Recordatorio enviado a '+r.avisados+(r.avisados===1?' persona que falta por firmar.':' personas que faltan por firmar.')
    : (r.nota||'No falta nadie por firmar.');
  await carga();
}

async function pagar(id){
  const m=$('msg'); m.className='msg';
  const fix=parseFloat(($('fix-'+id)||{}).value||'')||null;
  const mxn=parseFloat(($('mxn-'+id)||{}).value||'')||null;
  const ref=(($('ref-'+id)||{}).value||'').trim();
  if(!confirm('¿Confirmas que ya se transfirió?')) return;
  const r=await accion({accion:'pago',id,fix,monto_mxn:mxn,referencia:ref});
  if(r.error){ m.className='msg e'; m.textContent=r.error; return }
  m.className='msg k'; m.textContent='Pago registrado.';
  await carga();
}

carga();
</script>
</body>
</html>
