<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intercambios · Casa Pepe</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--papel:#F4F1EA;--blanco:#fff;--tinta:#2c2c2a;--gris:#6E6A5C;--tenue:#A7A08C;
  --linea:#E3E0D6;--verde:#1d9e75;--oro:#C9A227;--rojo:#9E3B2E;--crema:#f3f8ea;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font:14px/1.5 Inter,system-ui,-apple-system,sans-serif}
h1,h2,h3{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
a{color:#15663c}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
h1{font-size:21px;margin-bottom:4px}
.sub{color:var(--gris);font-size:13.5px;margin:0 0 14px}
/* Sin "← Panel": esta pantalla vive dentro del iframe del panel y volver a /
   cargaria el dashboard entero aqui dentro. */
.secnav{display:flex;gap:6px;flex-wrap:wrap;position:sticky;top:0;background:var(--papel);
  padding:8px 0 10px;z-index:4;border-bottom:1px solid var(--linea);margin-bottom:14px}
.secnav button{font:inherit;font-size:13px;border:1.5px solid var(--linea);background:var(--blanco);
  color:var(--gris);border-radius:99px;padding:7px 14px;cursor:pointer}
.secnav button[aria-selected="true"]{background:var(--tinta);color:#fff;border-color:var(--tinta);font-weight:600}
.secnav .n{font-size:11px;opacity:.75;margin-left:5px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:3px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-family:Oswald;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris);background:var(--crema)}
tr.row{cursor:pointer}tr.row:hover{background:#faf9f5}
.chk{color:var(--gris);font-size:12px}
.pill{display:inline-block;font-family:Oswald;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
  border-radius:99px;padding:2px 8px;background:var(--crema);color:var(--gris)}
.pill.nuevo{background:#F6EBD5;color:#8C6212}
.pill.aprobado{background:#E1F0E7;color:#1D6B4A}
.pill.rechazado{background:#F4E2DE;color:var(--rojo)}
.pill.archivado{background:#eee;color:#777}
.pill.casa{background:#E2EEF8;color:#1F6FB2}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
.kv{background:var(--crema);border-radius:9px;padding:10px 12px;font-size:13.5px}
.kv b{display:block;font-family:Oswald;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin-bottom:2px}
.btn{font:inherit;font-size:13px;font-weight:600;border:1.5px solid var(--linea);background:var(--blanco);
  color:var(--tinta);border-radius:9px;padding:8px 14px;cursor:pointer}
.btn.g{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.r{background:#fff;border-color:var(--rojo);color:var(--rojo)}
.btn[disabled]{opacity:.5;cursor:default}
.fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.quote{border-left:3px solid var(--oro);padding:6px 0 6px 12px;margin:10px 0;font-size:13.5px;color:var(--gris)}
.msg{font-size:13.5px;margin-top:10px}.msg.e{color:var(--rojo)}.msg.k{color:#1D6B4A}
.vacio{color:var(--tenue);font-size:13.5px;text-align:center;padding:22px}
.aviso{background:#F6EBD5;border:1px solid #e2cfa5;color:#8C6212;border-radius:10px;padding:11px 13px;font-size:13px;margin:10px 0}
textarea{width:100%;padding:9px 10px;border:1px solid var(--linea);border-radius:9px;font:inherit;font-size:13.5px;min-height:54px;resize:vertical}
label.lb{display:block;font-family:Oswald;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gris);margin:10px 0 4px}
</style>
<link rel="icon" type="image/png" href="/dash-192.png">
</head><body>
<div class="wrap">
  <h1>Intercambios</h1>
  <p class="sub">Dos noches a cambio de contenido en <b>sus</b> redes. No es voluntariado: no hacen turnos, no arman plan de un mes y los apruebas tú. Al aprobar se les confirma por correo.</p>

  <div class="secnav" id="nav"></div>
  <div id="lista"><p class="vacio">Cargando…</p></div>
  <div id="ficha"></div>
</div>

<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var TODO=[], FILTRO='nuevo', ABIERTA=null;
  var CASA={cdmx:'Casa Pepe CDMX', puebla:'Casa Pepe Puebla'};

  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function f(d){ if(!d) return '—'; var p=String(d).slice(0,10).split('-');
    return p[2]+'/'+p[1]+'/'+p[0].slice(2); }

  /* El token de la sesión del panel: igual que el resto de pantallas de /m/ */
  function tok(){
    try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
      if(k&&/sb-.*-auth-token/.test(k)){ var s=JSON.parse(localStorage.getItem(k));
        if(s&&s.access_token) return s.access_token; } } }catch(e){}
    return null;
  }
  async function rpc(fn,body){
    var t=tok(), h={apikey:KEY,'Content-Type':'application/json',
                    Authorization:'Bearer '+(t||KEY)};
    var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body||{})});
    if(!r.ok) throw new Error(fn+' '+r.status);
    return r.json();
  }

  var PESTANAS=[['nuevo','Te toca decidir'],['aprobado','Aprobados'],
                ['rechazado','Rechazados'],['archivado','Archivados'],['', 'Todos']];
  function pintaNav(){
    $('nav').innerHTML = PESTANAS.map(function(p){
      var n = p[0] ? TODO.filter(function(x){return x.estado===p[0];}).length : TODO.length;
      return '<button data-p="'+p[0]+'" aria-selected="'+(FILTRO===p[0])+'">'+esc(p[1])
        +'<span class="n">'+n+'</span></button>';
    }).join('');
    Array.prototype.forEach.call($('nav').children,function(b){
      b.onclick=function(){ FILTRO=b.getAttribute('data-p'); ABIERTA=null; pinta(); };
    });
  }

  function pinta(){
    pintaNav();
    var ls = FILTRO ? TODO.filter(function(x){return x.estado===FILTRO;}) : TODO.slice();
    if(!ls.length){
      $('lista').innerHTML='<div class="card"><p class="vacio">'
        +(FILTRO==='nuevo'?'Nadie esperando. Cuando llegue una solicitud nueva aparece aquí.':'Nada por aquí.')
        +'</p></div>';
      $('ficha').innerHTML=''; return;
    }
    var h='<div class="card"><table><thead><tr><th>Quién</th><th>Casa</th><th>Cuándo</th>'
      +'<th>Redes</th><th>Ideas</th><th>Estado</th></tr></thead><tbody>';
    h+=ls.map(function(x){
      var noches = (x.fecha_desde&&x.fecha_hasta)
        ? Math.round((new Date(x.fecha_hasta)-new Date(x.fecha_desde))/864e5) : 0;
      return '<tr class="row" data-id="'+x.id+'">'
        +'<td><b>'+esc(x.nombre||'(sin nombre)')+'</b><div class="chk">'+esc(x.email||'')+'</div></td>'
        +'<td><span class="pill casa">'+esc(CASA[x.propiedad]||x.propiedad||'—')+'</span></td>'
        +'<td>'+f(x.fecha_desde)+' → '+f(x.fecha_hasta)+'<div class="chk">'+(noches?noches+' noche'+(noches===1?'':'s'):'')+'</div></td>'
        +'<td>'+(x.instagram?'<a href="https://instagram.com/'+encodeURIComponent(x.instagram)+'" target="_blank" rel="noopener">@'+esc(x.instagram)+'</a>':'—')
        +(x.seguidores?'<div class="chk">'+x.seguidores+' seguidores</div>':'')+'</td>'
        +'<td>'+(x.piezas||0)+'</td>'
        +'<td><span class="pill '+esc(x.estado)+'">'+esc(x.estado)+'</span>'
        +(x.reserva_id?'<div class="chk">reserva '+esc(x.reserva_id)+'</div>':'')+'</td></tr>';
    }).join('');
    h+='</tbody></table></div>';
    $('lista').innerHTML=h;
    Array.prototype.forEach.call($('lista').querySelectorAll('.row'),function(tr){
      tr.onclick=function(){ abre(tr.getAttribute('data-id')); };
    });
    if(ABIERTA) abre(ABIERTA);
  }

  async function abre(id){
    ABIERTA=id;
    var x=TODO.filter(function(y){return y.id===id;})[0]; if(!x) return;
    var pz=[]; try{ pz=await rpc('inter_piezas',{p_id:id})||[]; }catch(e){}
    var noches=(x.fecha_desde&&x.fecha_hasta)?Math.round((new Date(x.fecha_hasta)-new Date(x.fecha_desde))/864e5):0;
    var h='<div class="card"><h2>'+esc(x.nombre||'(sin nombre)')+'</h2>'
      +'<p class="sub">'+esc(CASA[x.propiedad]||x.propiedad||'')+' · '+f(x.fecha_desde)+' → '+f(x.fecha_hasta)
      +(noches?' · '+noches+' noche'+(noches===1?'':'s'):'')+'</p>';

    if(x.estado==='aprobado' && !x.reserva_id)
      h+='<div class="aviso"><b>Aprobado, pero sin reserva en Cloudbeds.</b> Créala a mano en '
        +esc(CASA[x.propiedad]||'')+' con esas fechas, o avísame para conectarlo.</div>';
    if(x.reserva_error)
      h+='<div class="aviso"><b>La reserva no se pudo crear:</b> '+esc(x.reserva_error)+'</div>';

    h+='<div class="grid">'
      +'<div class="kv"><b>Correo</b>'+esc(x.email||'—')+'</div>'
      +'<div class="kv"><b>WhatsApp</b>'+(x.whatsapp?'<a href="https://wa.me/'+encodeURIComponent(String(x.whatsapp).replace(/\D/g,''))+'" target="_blank" rel="noopener">'+esc(x.whatsapp)+'</a>':'—')+'</div>'
      +'<div class="kv"><b>Instagram</b>'+(x.instagram?'<a href="https://instagram.com/'+encodeURIComponent(x.instagram)+'" target="_blank" rel="noopener">@'+esc(x.instagram)+'</a>'+(x.seguidores?' · '+x.seguidores:''):'—')+'</div>'
      +'<div class="kv"><b>Graba con</b>'+esc(x.graba_con||'—')+'</div>'
      +'<div class="kv"><b>Viene de</b>'+esc(x.ciudad||'—')+'</div>'
      +'<div class="kv"><b>Solicitó</b>'+f(x.enviado_at||x.created_at)+'</div></div>';

    if(x.portafolio) h+='<p class="chk">Portafolio: <a href="'+esc(x.portafolio)+'" target="_blank" rel="noopener">'+esc(x.portafolio)+'</a></p>';
    if(x.nota_suya) h+='<div class="quote"><b>En sus palabras</b><br>'+esc(x.nota_suya)+'</div>';

    h+='<h3 style="font-size:14px;margin:14px 0 6px">Lo que propone publicar</h3>';
    h+= pz.length ? pz.map(function(z){
          return '<div class="kv" style="margin-bottom:7px"><b>'+esc(z.tipo||'')+'</b>'+esc(z.idea||'')
            +(z.url?'<div class="chk"><a href="'+esc(z.url)+'" target="_blank" rel="noopener">'+esc(z.url)+'</a></div>':'')+'</div>';
        }).join('')
      : '<p class="chk">No puso ideas. No es obligatorio: con ver su contenido ya puedes decidir.</p>';

    h+='<label class="lb" for="nt">Nota interna (sólo la ves tú)</label><textarea id="nt">'+esc(x.nota_interna||'')+'</textarea>';
    h+='<label class="lb" for="np">Nota para él/ella (la lee en su liga)</label><textarea id="np">'+esc(x.nota_para_el||'')+'</textarea>';

    h+='<div class="fila">'
      +(x.estado==='aprobado'?'':'<button class="btn g" data-j="aprobado">✓ Aprobar</button>')
      +'<button class="btn r" data-j="rechazado">No nos encaja</button>'
      +'<button class="btn" data-j="archivado">Archivar</button>'
      +(x.estado==='nuevo'?'':'<button class="btn" data-j="nuevo">Volver a pendiente</button>')
      +'<button class="btn" data-copia="'+esc('https://grupocasapepe.netlify.app/intercambio?t='+x.token)+'">Copiar su liga</button>'
      +'</div><p class="msg" id="msg"></p></div>';

    $('ficha').innerHTML=h;
    Array.prototype.forEach.call($('ficha').querySelectorAll('[data-j]'),function(b){
      b.onclick=function(){ juzga(id, b.getAttribute('data-j')); };
    });
    var cp=$('ficha').querySelector('[data-copia]');
    if(cp) cp.onclick=function(){
      var t=cp.getAttribute('data-copia'), a=cp.textContent;
      try{ navigator.clipboard.writeText(t).then(function(){ cp.textContent='¡Copiada!';
        setTimeout(function(){cp.textContent=a;},1400); }); }catch(e){ prompt('Copia la liga:', t); }
    };
    $('ficha').scrollIntoView({behavior:'smooth',block:'start'});
  }

  async function juzga(id, estado){
    var m=$('msg'); if(m){ m.className='msg'; m.textContent='Guardando…'; }
    try{
      var j=await rpc('inter_juzgar',{p_id:id, p_estado:estado,
        p_nota:($('nt')?$('nt').value.trim():null), p_para_el:($('np')?$('np').value.trim():null)});
      if(!j||!j.ok){ if(m){m.className='msg e'; m.textContent=(j&&j.error)||'No se pudo.';} return; }
      if(m){ m.className='msg k'; m.textContent='Listo: '+estado+'.'; }
      await carga();
    }catch(e){ if(m){m.className='msg e'; m.textContent='No se pudo guardar.';} }
  }

  async function carga(){
    try{ TODO = await rpc('inter_bandeja') || []; }
    catch(e){ $('lista').innerHTML='<div class="card"><p class="vacio">No se pudo cargar. Vuelve a entrar al panel.</p></div>'; return; }
    pinta();
  }
  carga();
})();
</script>
</body></html>
