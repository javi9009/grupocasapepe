<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espacios del Ateneo</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- EDITOR DE ESPACIOS DEL ATENEO (coworking + residencias).
     Aquí se definen los espacios y su CAPACIDAD EN PERSONAS (pax): una oficina de 4
     son 4 pax, un dorm de 6 son 6 pax, un lugar de deck o daypass es 1. De esta
     capacidad sale el X/Y de ocupación. No es la ocupación del día -eso es el
     calendario de ocupación-, es la foto de qué espacios hay. Javi, 3-oct. -->
<style>
:root{
  --ground:#F4F1EA; --blanco:#fff; --tinta:#2c2c2a; --gris:#5f5e5a; --tenue:#8a897f;
  --linea:rgba(0,0,0,.10); --cow:#1F6FB2; --res:#9A5B2E; --verde:#1d9e75; --rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
.top{max-width:980px;margin:0 auto;padding:24px 16px 4px}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.top .sub{color:var(--gris);font-size:13px;margin-top:5px}
.wrap{max-width:980px;margin:14px auto 0;padding:0 16px 70px}
.cat{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);margin-bottom:16px;overflow:hidden}
.cab{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--linea)}
.cab .ic{font-size:20px}
.cab h2{margin:0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase;letter-spacing:.02em}
.cab .tot{margin-left:auto;font-size:12.5px;color:var(--gris)}
.cab.cow{border-top:3px solid var(--cow)} .cab.res{border-top:3px solid var(--res)}
.row{display:grid;grid-template-columns:1.3fr 1fr 78px 64px 44px;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--linea)}
.row:last-child{border-bottom:0}
.row.head{background:#faf8f3;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue);font-weight:700;padding:8px 16px}
input,select{font:inherit;font-size:13px;border:1px solid var(--linea);border-radius:8px;padding:6px 8px;background:#fff;color:var(--tinta);width:100%}
input[type=number]{text-align:center}
.row input:focus,.row select:focus{outline:none;border-color:var(--cow)}
.lbl{display:flex;align-items:center;gap:6px}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:none}
.sw input{display:none}
.sw span{position:absolute;inset:0;background:#cfcabd;border-radius:99px;transition:.15s;cursor:pointer}
.sw span:before{content:"";position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--verde)}
.sw input:checked+span:before{transform:translateX(16px)}
.del{background:none;border:0;color:var(--tenue);cursor:pointer;font-size:16px;padding:4px;border-radius:6px}
.del:hover{color:var(--rojo);background:rgba(181,69,47,.08)}
.add{display:inline-flex;align-items:center;gap:6px;margin:10px 16px 14px;background:none;border:1px dashed var(--linea);
  border-radius:10px;padding:9px 14px;color:var(--gris);font:inherit;font-weight:600;font-size:13px;cursor:pointer}
.add:hover{border-color:var(--cow);color:var(--cow)}
.tipe{font-size:10px;color:var(--tenue);margin-top:2px}
.vacio{color:var(--tenue);font-size:13px;padding:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:9px 16px;border-radius:99px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:.2s;pointer-events:none;z-index:50}
.toast.on{opacity:1}
.toast.err{background:var(--rojo)}
@media(max-width:620px){ .row{grid-template-columns:1fr 1fr;row-gap:6px} .row .c-pax,.row .c-act,.row .c-del{grid-column:auto} .row.head{display:none} .top h1{font-size:21px} }
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Ateneo</div>
  <h1>Espacios del Ateneo</h1>
  <div class="sub">Define los espacios y su capacidad en <b>personas (pax)</b>. De aquí sale el X/Y de ocupación.</div>
</div>
<div class="wrap" id="wrap"><div class="vacio">Cargando…</div></div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CATS={
  coworking:{ic:'💻', t:'Coworking', cls:'cow',
    tipos:[['deck','Deck / lugar abierto'],['oficina','Oficina privada'],['daypass','Day pass']]},
  residencias:{ic:'🛏', t:'Residencias', cls:'res',
    tipos:[['privada','Habitación privada'],['dorm','Dormitorio (cama compartida)']]}
};
/* Normaliza los tipos viejos (texto libre) a los canónicos, sin perder el dato. */
function canon(cat,tipo){
  const t=String(tipo||'').toLowerCase();
  if(cat==='coworking'){ if(t.startsWith('ofi'))return 'oficina'; if(t.includes('daypass')||t.includes('day pass'))return 'daypass';
    return CATS.coworking.tipos.some(x=>x[0]===t)?t:'deck'; }
  if(t.includes('dorm'))return 'dorm'; return CATS.residencias.tipos.some(x=>x[0]===t)?t:'privada';
}
function toast(m,err){ const t=$('#toast'); t.textContent=m; t.className='toast on'+(err?' err':''); setTimeout(()=>t.className='toast',err?3000:1600); }

let ROWS=[];
async function cargar(){
  const {data,error}=await sb.from('ateneo_lugares').select('id,numero,categoria,tipo,capacidad,activo,orden').order('categoria').order('orden');
  if(error){ $('#wrap').innerHTML='<div class="vacio">No se pudo cargar: '+esc(error.message)+'</div>'; return; }
  ROWS=data||[]; render();
}

function filaHTML(r){
  const cat=r.categoria||'coworking';
  const tipos=CATS[cat].tipos; const tv=canon(cat,r.tipo);
  const extra=(tipos.some(x=>x[0]===tv))?'':('<option value="'+esc(r.tipo)+'" selected>'+esc(r.tipo)+'</option>');
  return '<div class="row" data-id="'+esc(r.id)+'">'
    +'<div class="c-nom"><input data-f="numero" value="'+esc(r.numero||'')+'" placeholder="Nombre / número"></div>'
    +'<div class="c-tipo"><select data-f="tipo">'+extra
      +tipos.map(x=>'<option value="'+x[0]+'"'+(x[0]===tv?' selected':'')+'>'+x[1]+'</option>').join('')
      +'</select></div>'
    +'<div class="c-pax"><input data-f="capacidad" type="number" min="1" value="'+(r.capacidad||1)+'" title="personas (pax)"></div>'
    +'<div class="c-act"><label class="sw"><input data-f="activo" type="checkbox"'+(r.activo!==false?' checked':'')+'><span></span></label></div>'
    +'<div class="c-del"><button class="del" title="Eliminar">🗑</button></div>'
    +'</div>';
}

const CATFILTER=(new URLSearchParams(location.search).get('cat')||'').trim();
function render(){
  const html=Object.keys(CATS).filter(c=>!CATFILTER||c===CATFILTER).map(cat=>{
    const c=CATS[cat];
    const rows=ROWS.filter(r=>(r.categoria||'coworking')===cat);
    const pax=rows.filter(r=>r.activo!==false).reduce((s,r)=>s+(+r.capacidad||0),0);
    const porTipo={};
    rows.filter(r=>r.activo!==false).forEach(r=>{const k=canon(cat,r.tipo);porTipo[k]=(porTipo[k]||0)+(+r.capacidad||0);});
    const resumen=c.tipos.filter(x=>porTipo[x[0]]).map(x=>x[1].split(' ')[0].toLowerCase()+' '+porTipo[x[0]]).join(' · ');
    return '<div class="cat"><div class="cab '+c.cls+'"><span class="ic">'+c.ic+'</span><h2>'+c.t+'</h2>'
      +'<span class="tot"><b>'+pax+'</b> pax'+(resumen?(' · '+esc(resumen)):'')+'</span></div>'
      +'<div class="row head"><div>Nombre / número</div><div>Tipo</div><div>Pax</div><div>Activo</div><div></div></div>'
      +(rows.length?rows.map(filaHTML).join(''):'<div class="vacio">Aún no hay espacios. Agrega el primero ↓</div>')
      +'<button class="add" data-cat="'+cat+'">＋ Agregar espacio</button></div>';
  }).join('');
  $('#wrap').innerHTML=html;
  wire();
}

function wire(){
  document.querySelectorAll('.row[data-id]').forEach(row=>{
    const id=row.dataset.id;
    row.querySelectorAll('[data-f]').forEach(el=>{
      const ev=(el.type==='checkbox'||el.tagName==='SELECT')?'change':'change';
      el.addEventListener(ev, async ()=>{
        const f=el.dataset.f;
        let v = el.type==='checkbox'?el.checked : (f==='capacidad'?Math.max(1,+el.value||1):el.value.trim());
        const patch={}; patch[f]=v;
        const {error}=await sb.from('ateneo_lugares').update(patch).eq('id',id);
        if(error){ toast('No se guardó: '+error.message,true); return; }
        const r=ROWS.find(x=>x.id===id); if(r) r[f]=v;
        toast('Guardado ✓');
        if(f==='capacidad'||f==='activo'||f==='tipo') render();
      });
    });
    row.querySelector('.del').addEventListener('click', async ()=>{
      const r=ROWS.find(x=>x.id===id);
      if(!confirm('¿Eliminar "'+(r&&r.numero||'este espacio')+'"? No se puede deshacer.')) return;
      const {error}=await sb.from('ateneo_lugares').delete().eq('id',id);
      if(error){ toast('No se pudo eliminar: '+error.message,true); return; }
      ROWS=ROWS.filter(x=>x.id!==id); render(); toast('Eliminado');
    });
  });
  document.querySelectorAll('.add[data-cat]').forEach(b=>b.addEventListener('click', async ()=>{
    const cat=b.dataset.cat;
    const orden=(ROWS.filter(r=>(r.categoria||'coworking')===cat).reduce((m,r)=>Math.max(m,+r.orden||0),0))+1;
    const nuevo={numero:'', categoria:cat, tipo:CATS[cat].tipos[0][0], capacidad:(cat==='residencias'?2:1), activo:true, orden};
    const {data,error}=await sb.from('ateneo_lugares').insert(nuevo).select().single();
    if(error){ toast('No se pudo agregar: '+error.message,true); return; }
    ROWS.push(data); render();
    const el=document.querySelector('.row[data-id="'+data.id+'"] [data-f="numero"]'); if(el) el.focus();
  }));
}

sb.auth.getSession().then(({data})=>{ if(!data||!data.session){ $('#wrap').innerHTML='<div class="vacio">Abre esta pantalla desde el panel (necesita tu sesión).</div>'; return; } cargar(); });
</script>
</body></html>
