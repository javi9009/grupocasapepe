<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Calendario del Ateneo</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CALENDARIO UNIFICADO DEL ATENEO (nativo en el panel). Pestañas horizontales:
     Coworking (ateneo_lugares + ateneo_asignaciones), Residencias (habitaciones +
     ateneo_residencias_reservas, con "Nueva reserva"), Salas (qué hay en las salas
     = módulo de eventos). Mismo fondo crema y header que Configuración. Javi, 4-oct. -->
<style>
:root{--ground:#F4F1EA;--blanco:#fff;--tinta:#2c2c2a;--gris:#5f5e5a;--tenue:#8a897f;
  --linea:rgba(0,0,0,.10);--cow:#1F6FB2;--res:#9A5B2E;--verde:#1d9e75;--rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
.top{max-width:1200px;margin:0 auto;padding:24px 16px 0}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.secnav{max-width:1200px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--ground);z-index:5}
.secnav button{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-1px}
.secnav button.on{color:var(--tinta);border-bottom-color:var(--tinta)}
.nav{max-width:1200px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nav button{font:inherit;border:1px solid var(--linea);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--gris)}
.nav button:hover{border-color:var(--tinta);color:var(--tinta)}
.nav button.pri{background:var(--res);border-color:var(--res);color:#fff}
.nav .fch{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:15px;min-width:130px;text-align:center}
.nav .cnt{margin-left:auto;color:var(--tenue);font-size:12px}
.wrap{max-width:1200px;margin:14px auto 0;padding:0 16px 70px}
.tblwrap{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border:1px solid var(--linea);padding:0}
thead th{background:#faf8f3;font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris);padding:7px 5px;text-align:center;white-space:nowrap;position:sticky;top:0;z-index:2}
thead th .dd{display:block;font-weight:700;font-size:12.5px;color:var(--tinta)}
thead th.today{color:var(--res)}
th.lcell{position:sticky;left:0;z-index:3;text-align:left;min-width:150px}
td.lcell{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:7px 10px;min-width:150px}
td.lcell b{font-weight:700}
td.lcell .tp{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--tenue);margin-top:1px}
tr.ng td{border-top:2px solid rgba(0,0,0,.18)}
td.cc{height:40px;min-width:74px;text-align:center;cursor:pointer;color:#fff;font-weight:600;font-size:11.5px}
td.cc:not(.occ):hover{background:#f6efe8}
td.cc.occ{border-color:rgba(0,0,0,.25)}
.hint{color:var(--tenue);font-size:12px;margin:12px 2px 0}
.gate{max-width:1100px;margin:50px auto;padding:0 16px;text-align:center;color:var(--tenue)}
.salas{max-width:760px;margin:30px auto;padding:0 16px;text-align:center}
.salas .btn{display:inline-block;margin-top:14px;text-decoration:none}
/* modal */
.rmodal{position:fixed;inset:0;background:rgba(20,16,12,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.rmodal.on{display:flex}
.rmodal-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);width:100%;max-width:480px;padding:20px 20px 16px;max-height:92vh;overflow:auto}
.rmodal-card h3{margin:0 0 12px;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:18px;text-transform:uppercase}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gris);font-weight:600;margin-bottom:4px}
.fld input,.fld select{width:100%;font:inherit;font-size:14px;border:1px solid var(--linea);border-radius:9px;padding:9px 11px;background:#fff;color:var(--tinta)}
.rm-row{display:flex;gap:10px}.rm-row .fld{flex:1}
.msg{display:none;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.msg.err{display:block;background:#fbe9e6;color:var(--rojo)}
.rm-acts{display:flex;align-items:center;gap:8px;margin-top:14px}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:99px;padding:8px 16px;cursor:pointer;border:1px solid var(--linea);background:#fff;color:var(--gris)}
.btn.pri{background:var(--res);border-color:var(--res);color:#fff}
.btn.x{color:var(--rojo);border-color:#e8c7bf}
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Ateneo</div>
  <h1>Calendario del Ateneo</h1>
</div>
<div class="secnav" id="secnav">
  <button data-t="coworking" class="on">Coworking</button>
  <button data-t="residencias">Residencias</button>
  <button data-t="salas">Salas</button>
</div>
<div class="nav" id="nav"></div>
<div class="wrap" id="wrap"><div class="gate">Cargando…</div></div>

<div class="rmodal" id="modal"><div class="rmodal-card">
  <h3 id="m-title">Nueva reserva</h3>
  <div class="msg err" id="m-err"></div>
  <input type="hidden" id="m-id">
  <div class="fld"><label>Nombre del residente</label><input id="m-nombre" type="text" placeholder="Nombre y apellido"></div>
  <div class="rm-row"><div class="fld"><label>Email</label><input id="m-email" type="email" placeholder="correo@ejemplo.com"></div><div class="fld"><label>Teléfono</label><input id="m-tel" type="text" placeholder="55..."></div></div>
  <div class="rm-row"><div class="fld"><label>Entrada</label><input id="m-ini" type="date"></div><div class="fld"><label>Salida</label><input id="m-fin" type="date"></div></div>
  <div class="fld"><label>Habitación / cama (solo libres para esas fechas)</label><select id="m-unit"></select></div>
  <div class="fld"><label>Notas</label><input id="m-notas" type="text" placeholder="Opcional"></div>
  <div class="rm-acts"><button class="btn x" id="m-del" style="display:none">Eliminar</button><span style="flex:1"></span><button class="btn" id="m-cancel">Cancelar</button><button class="btn pri" id="m-save">Guardar</button></div>
</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function mondayOf(d){d=new Date(d);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);d.setHours(0,0,0,0);return d;}
function addDays(ds,n){const d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
function color(id){let h=0,x=String(id);for(let i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))%360;return 'hsl('+h+',48%,40%)';}

let TAB='coworking';
let hasSession=false;

/* ---------- COWORKING ---------- */
let weekStart=mondayOf(new Date());
async function vCoworking(){
  $('nav').innerHTML='<button id="cw-prev">‹ Semana</button><div class="fch" id="cw-fch">…</div><button id="cw-next">Semana ›</button><button id="cw-hoy">Hoy</button>';
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
  const start=ymd(days[0]),end=ymd(days[6]),today=ymd(new Date());
  $('cw-fch').textContent=days[0].getDate()+'/'+(days[0].getMonth()+1)+' – '+days[6].getDate()+'/'+(days[6].getMonth()+1);
  $('cw-prev').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);vCoworking();};
  $('cw-next').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);vCoworking();};
  $('cw-hoy').onclick=()=>{weekStart=mondayOf(new Date());vCoworking();};
  const [lr,ar]=await Promise.all([
    sb.from('ateneo_lugares').select('*').eq('categoria','coworking').order('orden'),
    sb.from('ateneo_asignaciones').select('*').eq('estado','activa').lte('fecha_inicio',end).gte('fecha_fin',start)
  ]);
  if(lr.error){$('wrap').innerHTML='<div class="gate">No se pudieron leer los espacios: '+esc(lr.error.message)+'</div>';return;}
  const lug=lr.data||[], asig=(ar.error?[]:ar.data)||[];
  if(!lug.length){$('wrap').innerHTML='<div class="gate">No hay espacios de coworking dados de alta. Agrégalos en Configuración.</div>';return;}
  let h='<div class="tblwrap"><table><thead><tr><th class="lcell">Lugar</th>'
    +days.map(d=>'<th class="'+(ymd(d)===today?'today':'')+'">'+DOW[(d.getDay()+6)%7]+'<span class="dd">'+d.getDate()+'/'+(d.getMonth()+1)+'</span></th>').join('')+'</tr></thead><tbody>';
  lug.forEach(l=>{
    h+='<tr><td class="lcell"><b>'+esc(l.numero)+'</b><span class="tp">'+esc(l.tipo||'')+'</span></td>';
    days.forEach(d=>{const ds=ymd(d);const a=asig.find(x=>x.lugar_id===l.id&&x.fecha_inicio<=ds&&x.fecha_fin>=ds);
      if(a)h+='<td class="cc occ" style="background:'+color(a.id)+'" data-aid="'+a.id+'" title="'+esc(a.ocupante)+' ('+a.fecha_inicio+' → '+a.fecha_fin+')">'+esc(a.ocupante).slice(0,11)+'</td>';
      else h+='<td class="cc" data-lug="'+l.id+'" data-num="'+esc(l.numero)+'" data-d="'+ds+'"></td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div><p class="hint">Clic en una celda vacía para <b>asignar</b> un ocupante (con fecha de salida). Clic en una ocupada para <b>liberarla</b>.</p>';
  $('wrap').innerHTML=h;
  document.querySelectorAll('td.cc.occ').forEach(c=>c.onclick=async()=>{
    if(!confirm('¿Liberar esta asignación?'))return;
    const {error}=await sb.from('ateneo_asignaciones').delete().eq('id',c.dataset.aid);
    if(error){alert(error.message);return;} vCoworking();
  });
  document.querySelectorAll('td.cc:not(.occ)').forEach(c=>c.onclick=async()=>{
    const ocu=prompt('Ocupante para '+c.dataset.num+' (desde '+c.dataset.d+'):');if(!ocu)return;
    const fin=prompt('¿Hasta qué fecha? (YYYY-MM-DD). Vacío = solo ese día:',c.dataset.d)||c.dataset.d;
    const {error}=await sb.from('ateneo_asignaciones').insert({lugar_id:c.dataset.lug,ocupante:ocu,fecha_inicio:c.dataset.d,fecha_fin:fin,estado:'activa'});
    if(error){alert(error.message);return;} vCoworking();
  });
}

/* ---------- RESIDENCIAS ---------- */
const RESID_ROOMS=[
 {hab:'102',tipo:'Dormitorio · 6 camas',camas:6},{hab:'103',tipo:'Privada · Bunk & Bed',camas:1},
 {hab:'104',tipo:'Litera · 2 camas',camas:2},{hab:'105',tipo:'Litera · 2 camas',camas:2},
 {hab:'106',tipo:'Litera · 2 camas',camas:2},{hab:'107',tipo:'Litera · 2 camas',camas:2},
 {hab:'108',tipo:'Dormitorio · 1 cama',camas:1},{hab:'109',tipo:'Taller',camas:1},
 {hab:'110',tipo:'Deluxe Queen · Residencia',camas:1},{hab:'111',tipo:'Taller',camas:1},
 {hab:'112',tipo:'Deluxe Queen · Residencia',camas:1},{hab:'113',tipo:'Taller',camas:1},
 {hab:'114',tipo:'Taller',camas:1},{hab:'115',tipo:'Taller',camas:1}
];
function residUnits(){const u=[];RESID_ROOMS.forEach(r=>{if(r.camas===1)u.push({key:r.hab,hab:r.hab,tipo:r.tipo,sub:''});else for(let i=1;i<=r.camas;i++)u.push({key:r.hab+'-'+i,hab:r.hab,tipo:r.tipo,sub:'Cama '+i});});return u;}
let ALL=[];const WIN=14;
let startDate=(()=>{const d=new Date();d.setHours(0,0,0,0);return d;})();
function free(unit,ini,fin,exId){return !ALL.some(r=>r.unidad===unit&&r.id!==exId&&(ini<r.fecha_fin&&fin>r.fecha_inicio));}
function at(unit,ds){return ALL.find(r=>r.unidad===unit&&r.fecha_inicio<=ds&&ds<r.fecha_fin);}
async function vResidencias(){
  $('nav').innerHTML='<button class="pri" id="rNuevo">＋ Nueva reserva</button><button id="rPrev">‹ 2 sem</button><div class="fch" id="rFch">…</div><button id="rNext">2 sem ›</button><button id="rHoy">Hoy</button><span class="cnt" id="rCnt"></span>';
  $('rNuevo').onclick=()=>openModal(null,null);
  $('rPrev').onclick=()=>{startDate.setDate(startDate.getDate()-WIN);vResidencias();};
  $('rNext').onclick=()=>{startDate.setDate(startDate.getDate()+WIN);vResidencias();};
  $('rHoy').onclick=()=>{startDate=new Date();startDate.setHours(0,0,0,0);vResidencias();};
  const rr=await sb.from('ateneo_residencias_reservas').select('*').neq('estado','cancelada').order('fecha_inicio');
  if(rr.error){$('wrap').innerHTML='<div class="gate">No se pudo leer: '+esc(rr.error.message)+'</div>';return;}
  ALL=rr.data||[];$('rCnt').textContent=ALL.length+' reservas activas';
  const units=residUnits();
  const days=[];for(let i=0;i<WIN;i++){const d=new Date(startDate);d.setDate(d.getDate()+i);days.push(d);}
  const today=ymd(new Date());
  $('rFch').textContent=days[0].getDate()+'/'+(days[0].getMonth()+1)+' – '+days[WIN-1].getDate()+'/'+(days[WIN-1].getMonth()+1);
  let h='<div class="tblwrap"><table><thead><tr><th class="lcell">Habitación</th>'
    +days.map(d=>'<th class="'+(ymd(d)===today?'today':'')+'">'+DOW[(d.getDay()+6)%7]+'<span class="dd">'+d.getDate()+'/'+(d.getMonth()+1)+'</span></th>').join('')+'</tr></thead><tbody>';
  let lastHab=null;
  units.forEach(u=>{
    const ng=u.hab!==lastHab;lastHab=u.hab;
    h+='<tr'+(ng?' class="ng"':'')+'><td class="lcell"><b>'+esc(u.hab)+'</b>'+(u.sub?' · '+esc(u.sub):'')+'<span class="tp">'+esc(u.tipo)+'</span></td>';
    const shown={};
    days.forEach(d=>{const ds=ymd(d);const r=at(u.key,ds);
      if(r){const first=!shown[r.id];shown[r.id]=true;h+='<td class="cc occ" style="background:'+color(r.id)+'" data-rid="'+r.id+'" title="'+esc(r.nombre)+' ('+r.fecha_inicio+' → '+r.fecha_fin+')">'+(first?esc(r.nombre).slice(0,10):'·')+'</td>';}
      else h+='<td class="cc" data-unit="'+esc(u.key)+'" data-d="'+ds+'"></td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div><p class="hint">Clic en una celda vacía para <b>crear</b> reserva · clic en una ocupada para <b>editar o mover</b>.</p>';
  $('wrap').innerHTML=h;
  document.querySelectorAll('td.cc.occ').forEach(c=>c.onclick=()=>{const r=ALL.find(x=>x.id===c.dataset.rid);if(r)openModal(r,null);});
  document.querySelectorAll('td.cc:not(.occ)').forEach(c=>c.onclick=()=>openModal(null,{unidad:c.dataset.unit,fecha:c.dataset.d}));
}
function unitOptions(selUnit,ini,fin,exId){
  const units=residUnits();const byHab={};units.forEach(u=>{(byHab[u.hab]=byHab[u.hab]||[]).push(u);});
  const canCheck=ini&&fin&&ini<fin;let html='';
  Object.keys(byHab).forEach(hab=>{
    const opts=byHab[hab].map(u=>{
      const ok=!canCheck?true:free(u.key,ini,fin,exId);const isSel=(u.key===selUnit);
      if(!ok&&!isSel)return '';
      const lbl=(u.sub?u.sub:('Habitación '+u.hab));
      return '<option value="'+esc(u.key)+'"'+(isSel?' selected':'')+'>'+esc(lbl)+'</option>';
    }).filter(Boolean).join('');
    if(opts)html+='<optgroup label="'+esc(hab+' · '+byHab[hab][0].tipo)+'">'+opts+'</optgroup>';
  });
  return html||'<option value="">(sin unidades libres para esas fechas)</option>';
}
function openModal(r,prefill){
  const isEdit=!!r;
  const ini=r?r.fecha_inicio:((prefill&&prefill.fecha)?prefill.fecha:'');
  const fin=r?r.fecha_fin:((prefill&&prefill.fecha)?addDays(prefill.fecha,1):'');
  const unit=r?r.unidad:((prefill&&prefill.unidad)?prefill.unidad:'');
  $('m-title').textContent=isEdit?'Editar reserva':'Nueva reserva';
  $('m-id').value=r?r.id:'';$('m-nombre').value=r?(r.nombre||''):'';$('m-email').value=r?(r.email||''):'';
  $('m-tel').value=r?(r.telefono||''):'';$('m-ini').value=ini;$('m-fin').value=fin;$('m-notas').value=r?(r.notas||''):'';
  $('m-del').style.display=isEdit?'inline-flex':'none';$('m-err').style.display='none';
  $('m-unit').innerHTML=unitOptions(unit,ini,fin,r?r.id:null);
  const refresh=()=>{const cur=$('m-unit').value||unit;$('m-unit').innerHTML=unitOptions(cur,$('m-ini').value,$('m-fin').value,r?r.id:null);};
  $('m-ini').onchange=refresh;$('m-fin').onchange=refresh;
  $('modal').classList.add('on');
}
async function save(){
  const er=m=>{$('m-err').textContent=m;$('m-err').style.display='block';};
  const id=$('m-id').value,nombre=$('m-nombre').value.trim(),ini=$('m-ini').value,fin=$('m-fin').value,unit=$('m-unit').value;
  if(!nombre)return er('Escribe el nombre de la reserva.');
  if(!ini||!fin)return er('Indica entrada y salida.');
  if(fin<=ini)return er('La salida debe ser posterior a la entrada.');
  if(!unit)return er('Selecciona una habitación libre.');
  if(!free(unit,ini,fin,id||null))return er('Esa habitación no está libre en esas fechas.');
  const row={unidad:unit,habitacion:unit.split('-')[0],nombre:nombre,email:$('m-email').value.trim()||null,telefono:$('m-tel').value.trim()||null,fecha_inicio:ini,fecha_fin:fin,notas:$('m-notas').value.trim()||null};
  const res=id?await sb.from('ateneo_residencias_reservas').update(row).eq('id',id):await sb.from('ateneo_residencias_reservas').insert(row);
  if(res.error)return er('No se pudo guardar: '+res.error.message);
  $('modal').classList.remove('on');vResidencias();
}
async function del(){
  const id=$('m-id').value;if(!id)return;
  if(!confirm('¿Eliminar esta reserva?'))return;
  const res=await sb.from('ateneo_residencias_reservas').delete().eq('id',id);
  if(res.error){alert(res.error.message);return;}
  $('modal').classList.remove('on');vResidencias();
}
$('m-save').onclick=save;$('m-del').onclick=del;
$('m-cancel').onclick=()=>$('modal').classList.remove('on');
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.remove('on');});

/* ---------- SALAS (qué hay en las salas = módulo de eventos) ---------- */
function vSalas(){
  $('nav').innerHTML='';
  $('wrap').innerHTML='<div class="salas"><p>El calendario de <b>qué hay en las salas</b> (eventos y espacios de eventos) vive en el módulo de Eventos.</p>'
    +'<a class="btn pri" href="/m/eventos.html">Abrir «Qué hay en las salas»</a></div>';
}

/* ---------- tabs ---------- */
function render(){
  document.querySelectorAll('.secnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  if(!hasSession){$('wrap').innerHTML='<div class="gate">Abre esta pantalla desde el panel (necesita tu sesión).</div>';$('nav').innerHTML='';return;}
  $('wrap').innerHTML='<div class="gate">Cargando…</div>';
  if(TAB==='coworking')vCoworking();
  else if(TAB==='residencias')vResidencias();
  else vSalas();
}
function tabFromHash(){const h=(location.hash||'').replace('#','');return ['coworking','residencias','salas'].includes(h)?h:null;}
document.querySelectorAll('.secnav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{history.replaceState(null,'','#'+TAB);}catch(_){}render();});
window.addEventListener('hashchange',()=>{const h=tabFromHash();if(h){TAB=h;render();}});
