  // listado de asistencia: retrasos + salidas antes + validaciones, tope 4 con "+ ver más" y botón aprobar
  function attList(items, ro){
    if(!items || !items.length) return '<div class="empty">Nada por revisar en el periodo 🎉</div>';

      else if(x.tipo==='extra'){ badge='<span class="tg tg-s">horas extra</span>'; mtxt='+'+x.min+"'"; mcls='mid'; }
      else if(x.tipo==='salida'){ badge='<span class="tg tg-s">salió antes</span>'; mtxt='−'+x.min+"'"; mcls='mid'; }
      else { badge='<span class="tg tg-v">por validar</span>'; }
      var msg=x.msg?'<div class="amsg">'+esc(x.msg)+'</div>':'';
      var act=ro
        ? (x.est?'<span class="okchip">'+(x.est==='rechazado'||x.est==='falta'?'👎':'👍')+' '+esc(x.est)+'</span>':'')
        : (x.pend
          ?'<button class="apb up" data-res="'+esc(x.id)+'" data-acc="hora" title="Aprobar · justificar (no cuenta en nómina)">👍</button>'+
           '<button class="apb dn" data-res="'+esc(x.id)+'" data-acc="falta" title="Rechazar">👎</button>'
          :'<span class="okchip">'+(x.est==='rechazado'||x.est==='falta'?'👎':'👍')+' '+esc(x.est||'ok')+'</span>');
      return '<div class="arow'+(i>=CAP?' hide extra':'')+'">'+
        '<div class="ainfo">'+badge+' <b>'+esc(x.nombre)+'</b> <span class="f">'+esc(x.fecha)+'</span>'+

  // ---- gauge semicircular segmentado ----
  function polar(cx,cy,r,ang){ var a=(ang-180)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function arc(cx,cy,r,a0,a1){ var p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1); var large=(a1-a0)>180?1:0; return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1); }
  function gauge(segs, centerN, centerL){
    var W=200,H=120,cx=100,cy=108,r=84,sw=18;
    var total=0; segs.forEach(function(s){total+=(+s.v||0);});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:230px">';
    svg+='<path d="'+arc(cx,cy,r,0,180)+'" fill="none" stroke="#2a2115" stroke-width="'+sw+'" stroke-linecap="round"/>';
    if(total>0){ var a=0; segs.forEach(function(s){ var frac=(+s.v||0)/total; if(frac<=0)return; var a1=a+frac*180; svg+='<path d="'+arc(cx,cy,r,a+0.6,a1-0.6)+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'" style="cursor:default"><title>'+esc((s.lbl||'')+': '+(+s.v||0))+'</title></path>'; a=a1; }); }
    svg+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" fill="#f3ead9" font-size="30" font-weight="800">'+centerN+'</text>';
    svg+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" fill="#a99a82" font-size="10" font-weight="700" letter-spacing="0.5">'+esc(centerL).toUpperCase()+'</text>';
    svg+='</svg>';
    return '<div class="gwrap">'+svg+'</div>';
  }

    function grp(g, filt, metric){ return (g||[]).filter(filt).map(function(p){ return {info:'<b>'+esc(p.nombre)+'</b> <span class="f">'+metric(p)+'</span>', act:pepe360(p.id)}; }); }
    function renderLleg(L){
      var segs=[{v:L.a_tiempo,color:'var(--green)',lbl:'A tiempo'},{v:L.retrasos,color:'var(--gold)',lbl:'Retrasos'},{v:L.faltas,color:'var(--red)',lbl:'Faltas'}];

        {color:'var(--red)',lbl:'Faltas',v:L.faltas||0, people:grp(L.gente,function(p){return p.fal>0;}, function(p){return p.fal+' falta'+(p.fal===1?'':'s');})}

    function renderSal(S){

    async function render(sede, per){
      if(per) periodo=per;
      if(!$('asisLleg')) return;
      document.querySelectorAll('.perb').forEach(function(b){ b.classList.toggle('on', b.getAttribute('data-per')===periodo); });
      $('asisLleg').innerHTML='<div class="load" style="padding:24px">Cargando…</div>'; if($('asisSal')) $('asisSal').innerHTML='';
      var r; try{ r=await rpcA(sede, periodo); }catch(e){ $('asisLleg').innerHTML='<div class="empty">No se pudo cargar.</div>'; return; }
      if(!r || r.error){ $('asisLleg').innerHTML='<div class="empty">'+esc((r&&r.error)||'Sin datos')+'</div>'; return; }
      $('asisLleg').innerHTML=renderLleg(r.llegadas||{});
      if($('asisSal')) $('asisSal').innerHTML=renderSal(r.salidas||{});
      wire();

    return { render: render, get periodo(){ return periodo; } };

// ===== RECA: reproducción del módulo de recamaristas (gráfica del día) =====
// Copia de la lógica de /m/hk-ama-llaves.html (pintarCapacidad + tarjetas por persona
// con apertura de info). Solo lectura: sin reasignar cuartos. Datos por REST.
var RECA=(function(){
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});};
  function F(){ return TODAY; }
  var ESTLBL={vacia_limpia:['VL','vl','Vacía limpia · refresco'],vacia_sucia:['VS','vs','Vacía sucia · salida'],ocupada:['EC','oc','En casa'],ocupada_blancos:['EC+B','bl','En casa · cambio de blancos'],rutina:['RUT','','Rutina diaria'],profunda:['PROF','','Limpieza profunda']};
  var hhmm=function(t){return t?String(t).slice(0,5):'—';};
  var hhmmM=function(t){ if(!t)return 0; var p=String(t).split(':').map(Number); return p[0]*60+(p[1]||0); };
  var nivel=function(p,ex){ return ex>0?'extra':p>=95?'bad':p>=75?'warn':'ok'; };
  function jornadaDe(a,c){
    if(a.hora_inicio&&a.hora_fin){ var d=hhmmM(a.hora_fin)-hhmmM(a.hora_inicio); if(d<0)d+=1440; return d-(c.minutos_comida||0); }
    return (a.metadata&&a.metadata.capacidad_bruta_min) || (((a.metadata&&a.metadata.capacidad_min)||0)+((a.metadata&&a.metadata.admin_min)||0)) || (Number(c.horas_turno||8)*60);
  }

  function metricasProd(a,r,c){
    const ts=(a&&a.hk_tareas)||[];
    const jornada=a?jornadaDe(a,c):(Number(c.horas_turno||8)*60);
    const objetivo=Number(r.min_estimados!=null?r.min_estimados:ts.reduce((s,t)=>s+(t.minutos_estimados||0),0));
    const especiales=ts.filter(t=>t.metadata&&(t.metadata.asignada_a_mano||t.metadata.se_limpio_igual));
    const pct=Math.round(objetivo/jornada*100);
    const estHechas=Number(r.min_est_hechas!=null?r.min_est_hechas:ts.filter(t=>t.estado==='terminada').reduce((s,t)=>s+(t.minutos_estimados||0),0));
    const hechasOrden=ts.filter(t=>t.estado==='terminada'&&(t.minutos_estimados||0)>0)
      .sort((x,y)=>String(x.terminado_at||'').localeCompare(String(y.terminado_at||'')));
    const ordinarias=[], extras=[];
    let acum=0;
    hechasOrden.forEach(t=>{
      const m=t.minutos_estimados||0;
      if(acum>=jornada) extras.push(t);
      else if(acum+m<=jornada) ordinarias.push(t);
      else extras.push(t);
      acum+=m;
    });
    let horasExtra=Math.max(0,estHechas-jornada);
    const minExtra=extras.reduce((s,t)=>s+(t.minutos_estimados||0),0);
    const nExtra=extras.length;
    const lleno=Math.min(estHechas,jornada);
    const enCurso=ts.find(t=>t.estado==='en_curso'&&t.iniciado_at);
    const vivo=enCurso?Math.min(240,Math.max(0,(Date.now()-new Date(enCurso.iniciado_at))/60000)):0;
    const dedicado=Number(r.min_reales!=null?r.min_reales:0)+vivo;
    const falta=Math.max(0,objetivo-estHechas);
    const ritmo=(estHechas>=30&&dedicado>0)?estHechas/dedicado:1;
    const faltaReal=ritmo>0?falta/ritmo:falta;
    const nv1=nivel(pct,0);
    const forecast=dedicado+faltaReal;
    const avance=objetivo?Math.round(estHechas/objetivo*100):0;
    const nv2=forecast<=jornada?'ok':forecast<=jornada+60?'warn':'bad';
    const finTurno=(a&&a.hora_fin)?new Date(`${F()}T${String(a.hora_fin).slice(0,8)}`):null;
    const cerrado=finTurno?Date.now()>finTurno.getTime():false;
    const fuera=finTurno?ts.filter(t=>t.terminado_at&&new Date(t.terminado_at)>finTurno):[];
    const ultima=fuera.length?new Date(Math.max(...fuera.map(t=>new Date(t.terminado_at).getTime()))):null;
    const minFuera=ultima?Math.max(0,(ultima-finTurno)/60000):0;
    const ocho=dedicado>=jornada;
    const minPagar=(ocho&&minFuera>=60)?minFuera:0;
    const extraCaida=cerrado&&!ocho&&horasExtra>0?horasExtra:0;
    if(extraCaida) horasExtra=0;
    const noQuisieron=ts.filter(t=>t.estado==='no_realizada');
    const tareas=Math.max(0,Number(r.tareas_asignadas!=null?r.tareas_asignadas:ts.length)-noQuisieron.length);
    const hechas=Number(r.tareas_terminadas!=null?r.tareas_terminadas:ts.filter(t=>t.estado==='terminada').length);
    const efi=r.eficiencia_pct?Number(r.eficiencia_pct):null;
    return {ts,jornada,objetivo,especiales,pct,estHechas,ordinarias,extras,horasExtra,minExtra,nExtra,lleno,
      dedicado,falta,faltaReal,ritmo,nv1,forecast,avance,nv2,cerrado,minFuera,ocho,minPagar,extraCaida,
      noQuisieron,tareas,hechas,efi};
  }

  function listaTareas(ts,vacio){
    if(!ts.length) return `<div class="nada">${vacio}</div>`;
    const peso=t=>t.estado==='pendiente'?1:0;
    const orden=ts.slice().sort((x,y)=>peso(x)-peso(y)
      || (peso(x)? String((x.hk_areas&&x.hk_areas.codigo)||'').localeCompare(String((y.hk_areas&&y.hk_areas.codigo)||''),'es',{numeric:true})
                 : String(y.terminado_at||'').localeCompare(String(x.terminado_at||''))));
    return orden.map(t=>{
      const ar=t.hk_areas||{}, op=t.hk_tareas_op;
      const nom=op?op.nombre:(t.titulo||`${ar.codigo||''}${ar.nombre&&ar.nombre!==ar.codigo?` · ${ar.nombre}`:''}`);
      const est=(ESTLBL[t.estatus_area]||[])[2]||'';
      const real=t.minutos_reales!=null?Number(t.minutos_reales):null;
      const dif=real!=null?Math.round((t.minutos_estimados||0)-real):null;
      const hora=t.terminado_at?new Date(t.terminado_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'}):'';
      return `<div class="lin ${t.estado}">
        <span class="nm">${esc(nom)}${t.es_extra?' <i class="ex">extra</i>':''}</span>
        <span class="es">${esc(est)}</span>
        <span class="mi">${real!=null&&t.estado!=='pendiente'?`${Math.round(real)}′ de ${t.minutos_estimados}′`:`${t.minutos_estimados}′`}</span>
        ${dif!=null&&t.estado!=='pendiente'?`<span class="di ${dif<0?'mal':'bien'}">${dif>0?'−':'+'}${Math.abs(dif)}′</span>`:'<span class="di"></span>'}
        <span class="ho">${t.estado==='pendiente'?'sin empezar':(hora||(t.estado==='en_curso'?'en curso':''))}</span>
      </div>`;
    }).join('');
  }

  function pintarCapacidad(asigs,sueltas,c,filas){
    const box=$('rcCap');
    const porNombre={}; (filas||[]).forEach(r=>porNombre[r.colaborador]=r);
    if(!asigs.length){ box.innerHTML=''; return; }
    const hm=m=>`${Math.round(m/60*10)/10} h`;
    const gente=asigs.map(a=>{
      const k=metricasProd(a,porNombre[a.nombre_display]||{},c);
      const carga=(a.hk_tareas||[]).filter(t=>t.estado!=='no_realizada')
        .reduce((s,t)=>s+(t.minutos_estimados||0),0);
      const jornada=k.jornada||1;
      const real=k.forecast>0?k.forecast:carga;
      return {nombre:a.nombre_display||'—',carga,real,jornada,
        pct:Math.round(real/jornada*100),pctStd:Math.round(carga/jornada*100),k};
    }).sort((x,y)=>y.pct-x.pct);
    const sinCubrir=(sueltas||[]).reduce((s,a)=>s+(a.hk_tareas||[])
      .filter(t=>t.estado!=='no_realizada').reduce((y,t)=>y+(t.minutos_estimados||0),0),0);
    const capacidad=gente.reduce((s,p)=>s+p.jornada,0);
    const carga=gente.reduce((s,p)=>s+p.real,0)+sinCubrir;
    const cargaStd=gente.reduce((s,p)=>s+p.carga,0)+sinCubrir;
    const pct=Math.round(carga/capacidad*100);
    const nv=pct>=100?'bad':pct>=90?'warn':'ok';
    const tope=Math.max(capacidad,carga)||1;
    const w=x=>x/tope*100;
    const barras=gente.map(p=>`<i class="${nivel(p.pct,0)}" style="width:${w(p.real)}%"
        title="${esc(p.nombre)} · ${hm(p.real)} de horas reales para ${hm(p.carga)} de papel · turno ${hm(p.jornada)} (${p.pct}%)"></i>`).join('')
      +(sinCubrir?`<i class="nadie" style="width:${w(sinCubrir)}%" title="Sin cubrir · ${hm(sinCubrir)}"></i>`:'');
    const exceso=gente.reduce((s,p)=>s+Math.max(0,p.real-p.jornada),0);
    const holgura=gente.reduce((s,p)=>s+Math.max(0,p.jornada-p.real),0);
    const bascular=Math.min(exceso,Math.max(0,holgura-sinCubrir));
    const arriba=gente.filter(p=>p.real>p.jornada);
    const abajo=gente.filter(p=>p.jornada-p.real>=20).sort((x,y)=>x.pct-y.pct);
    const falta=Math.max(0,carga-capacidad);
    let etiqueta;
    if(falta>0) etiqueta=['bad','No cabe'];
    else if(bascular>=20&&arriba.length&&abajo.length) etiqueta=['warn','Se puede balancear'];
    else if(pct>=90) etiqueta=['warn','Al límite'];
    else etiqueta=['ok','Cabe'];
    const stdHecho=gente.reduce((s,p)=>s+p.k.estHechas,0);
    const relojHecho=gente.reduce((s,p)=>s+p.k.dedicado,0);
    const ritmoGrupo=(stdHecho>=180&&relojHecho>0)?stdHecho/relojHecho:1;
    const bajar=Math.round((1-1/ritmoGrupo)*100);
    const extraTotal=gente.reduce((s,p)=>s+p.k.horasExtra,0);
    const pctHecho=Math.round(relojHecho/capacidad*100);
    const topeR=Math.max(tope,relojHecho);
    const wr=x=>x/topeR*100;
    const barrasR=gente.map(p=>{
      const dentro=Math.min(p.k.dedicado,p.jornada);
      const fuera=Math.max(0,p.k.dedicado-p.jornada);
      return `<i class="${nivel(Math.round(dentro/p.jornada*100),0)}" style="width:${wr(dentro)}%"
          title="${esc(p.nombre)} · ${hm(dentro)} reales de ${hm(p.jornada)}"></i>`
        +(fuera>0?`<i class="pagar" style="width:${wr(fuera)}%"
          title="${esc(p.nombre)} · ${hm(fuera)} fuera de su turno"></i>`:'');
    }).join('');
    const holguraDe=p=>Math.max(0,p.jornada-p.k.forecast);
    const huecos=gente.filter(p=>p.k.horasExtra<=0)
      .map(p=>({nombre:p.nombre,libre:holguraDe(p),ritmo:p.k.ritmo>0?p.k.ritmo:1,
        dedicado:p.k.dedicado,jornada:p.jornada}))
      .filter(h=>h.libre>=15);
    const movidas=[];
    let evitable=0;
    for(const p of gente.filter(p=>p.k.horasExtra>0)){
      let movido=0;
      const suyas=p.k.extras.slice().sort((x,y)=>(y.minutos_estimados||0)-(x.minutos_estimados||0));
      for(const t of suyas){
        if(movido>=p.k.horasExtra) break;
        const min=t.minutos_estimados||0;
        const h=huecos.filter(h=>h.libre>=min/h.ritmo).sort((m,n)=>n.libre-m.libre)[0];
        if(!h) continue;
        h.libre-=min/h.ritmo; movido+=min; movidas.push({t,de:p.nombre,min,a:h.nombre,rec:h});
      }
      evitable+=Math.min(movido,p.k.horasExtra);
    }
    const pagar=Math.max(0,extraTotal-evitable);
    const extraProg=gente.reduce((s,p)=>s+Math.max(0,p.carga-p.jornada),0);
    const pares=new Map();
    movidas.forEach(m=>{ const k=`${m.de}|${m.a}`; const e=pares.get(k)||{de:m.de,a:m.a,min:0,n:0}; e.min+=m.min; e.n++; pares.set(k,e); });
    const recos=[...pares.values()].sort((x,y)=>y.min-x.min);
    const fila=(cls,et,val)=>`<div class="r ${cls}"><span>${et}</span><b>${val}</b></div>`;
    const cerradoTodo=gente.every(p=>p.k.cerrado
      || !(p.k.ts||[]).some(t=>t.estado==='pendiente'||t.estado==='en_curso'));
    const detalle=r=>{
      const suyas=movidas.filter(m=>m.de===r.de&&m.a===r.a);
      return `<div class="d">${suyas.map(m=>`<span>${esc((m.t.hk_areas&&m.t.hk_areas.codigo)||m.t.titulo||'tarea')} ${m.min}′</span>`).join('')}</div>`;
    };
    const cajones=`<div class="gcajs">
      <div class="gcaj"><div class="t">Horas extra</div>
        ${fila('','Del reparto',hm(extraProg))}
        ${fila(extraTotal>0?'bad':'','Acumuladas',hm(extraTotal))}
        ${fila(evitable>0?'warn':'','Evitables',hm(evitable))}
        ${fila(pagar>0?'bad':'ok','A pagar',pagar>0?hm(pagar):'0 h')}</div>
      <div class="gcaj"><div class="t">Recomendación ${cerradoTodo?'· al cierre':'· provisional'}</div>
        ${recos.length?recos.map(r=>fila('warn',`${esc(r.de.split(' ')[0])} → ${esc(r.a.split(' ')[0])}`,
            `${Math.round(r.min)}′`)+detalle(r)).join('')
          :bascular>=20&&arriba.length&&abajo.length
            ? fila('warn',`${esc(arriba[0].nombre.split(' ')[0])} → ${esc(abajo[0].nombre.split(' ')[0])}`,hm(bascular))
            : fila('ok','Reparto','sin cambios')}
        ${sinCubrir?fila('bad','Sin cubrir',hm(sinCubrir)):''}</div>
      <div class="gcaj"><div class="t">Tiempo del día</div>
        ${fila('','Papel repartido',hm(cargaStd))}
        ${fila('','Papel efectuado',hm(stdHecho))}
        ${fila('','Horas reales',hm(relojHecho))}
        ${fila(Math.abs(bajar)>=3?'warn':'',bajar>=0?'Bajar tiempos':'Subir tiempos',Math.abs(bajar)+'%')}</div>
    </div>`;
    box.innerHTML=`<div class="gcap">
      <div class="gsub">1 · Papel repartido <i>convertido a horas reales</i></div>
      <div class="gh"><span class="gpct ${nv}">${pct}%</span>
        <span class="gtx">${hm(carga)} de horas reales para ${hm(capacidad)} de turno · ${gente.length} persona${gente.length===1?'':'s'}${sinCubrir?` · ${hm(sinCubrir)} sin cubrir`:''}</span>
        <span class="gtag ${etiqueta[0]}">${etiqueta[1]}</span></div>
      <div class="gbar">${barras}<span class="tope" style="left:${w(capacidad)}%"></span></div>
      <div class="gleg">${gente.map(p=>`<span class="${nivel(p.pct,0)}"><b>${esc(p.nombre.split(' ')[0])}</b> ${p.pct}%</span>`).join('')}
        ${sinCubrir?`<span class="bad"><b>Sin cubrir</b> ${hm(sinCubrir)}</span>`:''}</div>
      <div class="gsep"></div>
      <div class="gsub">2 · Horas reales <i>el reloj que ya se gastó</i></div>
      <div class="gh"><span class="gpct ${pagar>0?'bad':evitable>0?'warn':'ok'}">${pctHecho}%</span>
        <span class="gtx">${hm(relojHecho)} reales de ${hm(capacidad)} de turno · ${hm(stdHecho)} de papel efectuado</span>
        <span class="gtag ${pagar>0?'bad':evitable>0?'warn':'ok'}">${pagar>0?`${hm(pagar)} a pagar`
          :evitable>0?'Evitables':'Sin horas extra'}</span></div>
      <div class="gbar">${barrasR||'<i class="nadie" style="width:100%"></i>'}<span class="tope" style="left:${wr(capacidad)}%"></span></div>
      <div class="gleg">${gente.map(p=>{
        const libre=holguraDe(p);
        return `<span class="${p.k.horasExtra>0?'bad':libre>=30?'ok':''}"><b>${esc(p.nombre.split(' ')[0])}</b>
          ${hm(p.k.dedicado)} de ${hm(p.jornada)}${p.k.horasExtra>0?` · +${hm(p.k.horasExtra)} extra`
            :libre>=15?` · ${hm(libre)} libres`:''}</span>`;
      }).join('')}</div>
      ${cajones}
    </div>`;
  }

  function tarjetaProd(a,r,c){
    const k=metricasProd(a,r,c);
    const {ts,jornada,objetivo,especiales,pct,estHechas,extras,horasExtra,nExtra,dedicado,faltaReal,
      nv1,forecast,avance,nv2,extraCaida,noQuisieron,tareas,hechas,efi}=k;
    const w=x=>Math.max(0,Math.min(100,x/jornada*100));
    const hm=m=>`${Math.round(m/60*10)/10} h`;
    const hora=iso=>new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'});
    const entradaISO=r.primera_entrada||null;
    const entrada=entradaISO?hora(entradaISO):hhmm(a&&a.hora_inicio);
    return `<div class="pcard ${horasExtra>0?'sobrecarga':''}">
      <div class="ph"><b>${esc(a?a.nombre_display:r.colaborador)}</b>
        <span>${esc(((a&&a.turno)||r.turno||'').replace('_',' '))}${a?` · ${hhmm(a.hora_inicio)}–${hhmm(a.hora_fin)}`:''}</span></div>
      <div class="pet">Papel repartido</div>
      <div class="ppila"><i class="${nv1}" style="width:${w(objetivo)}%"></i>
        ${objetivo>jornada?'<i class="tope"></i>':''}</div>
      <div class="pfila"><span class="ppct ${nv1}">${pct}%</span>
        <span class="pmin">${hm(objetivo)} de papel · el turno son ${hm(jornada)}</span>
        ${horasExtra>0?`<span class="pext">⚠ ${hm(horasExtra)} extra</span>`:''}</div>
      <div class="pet">Horas reales</div>

    html+=section('📊 Negocio', [ n&&cardReporteDia(n), n&&cardOcupacion(n), ((SEDE==='cdmx'||SEDE==='puebla')?cardPace2():''), f&&cardPace(f), f&&cardTours(f), cardTickets(d,f)]);
    $('root').innerHTML= html || '<div class="empty">Sin datos</div>';
    wire();
    try{ ASIS.render(SEDE); }catch(_){}
    try{ PACE.render(SEDE); }catch(_){}
    try{ if(f&&f.recamaristas&&f.recamaristas.aplica) RECA.render(SEDE); }catch(_){}
    try{ $('hsub').textContent='operación al día · '+({cdmx:'CDMX',puebla:'Puebla',virreyes:'Virreyes',sincretico:'Sincrético'}[SEDE]||SEDE); }catch(_){}
  }

  document.querySelectorAll('.subv').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.subv').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); SEDE=b.getAttribute('data-sede'); load(); }; });
  $('rbtn').onclick=load;
  load();
})();
</script>
