<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de incidencias · Casa Pepe</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;
    --gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf;--purple:#a98fd0;--orange:#e08a4f;--gray:#7d7266}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand h1{font-size:16px;margin:0;font-weight:600}.brand h1 b{color:var(--gold2)}
  .spacer{flex:1}.mut{color:var(--muted);font-size:12px}
  .subbar{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
  .subv{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:7px 15px;cursor:pointer;font:inherit;font-size:13px;font-weight:700}
  .subv.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .rbtn{margin-left:auto;background:var(--panel2);border:1px solid var(--line);color:var(--gold2);border-radius:9px;padding:7px 13px;font:inherit;font-size:12.5px;font-weight:700;cursor:pointer}
  main{padding:16px;max-width:1080px;margin:0 auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
  .card h2{margin:0 0 2px;font-size:14px;font-weight:700}
  .card .csub{color:var(--muted);font-size:11.5px;margin-bottom:6px}
  .gwrap{display:flex;justify-content:center;margin:2px 0 6px}
  .gcenter{font-size:30px;font-weight:800;line-height:1}
  .gcenter small{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}
  .leg{display:flex;flex-direction:column;gap:5px;margin-top:4px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px}
  .lg .dot{width:11px;height:11px;border-radius:3px;flex:none}
  .lg .v{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
  .lg .lbl{color:var(--muted)}
  .punta{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;display:flex;align-items:center;gap:8px;font-size:12.5px}
  .punta .n{font-weight:800;color:var(--red)}
  .tickrow{display:flex;gap:10px;margin-top:4px}
  .tk{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px 8px;text-align:center}
  .tk .n{font-size:26px;font-weight:800;line-height:1}
  .tk .l{font-size:10.5px;color:var(--muted);margin-top:5px;text-transform:uppercase;letter-spacing:.3px}
  .tk.warn .n{color:var(--gold2)}.tk.bad .n{color:var(--red)}.tk.ok .n{color:var(--green)}
  .listwrap{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
  .listwrap .lh{font-size:11px;font-weight:800;color:var(--gold2);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
  .rtbl{width:100%;border-collapse:collapse;font-size:12.5px}
  .rtbl td{padding:5px 4px;border-bottom:1px solid #2a2014}
  .rtbl td.min{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
  .rtbl td.f{color:var(--muted);white-space:nowrap}
  .min.hi{color:var(--red)}.min.mid{color:var(--gold2)}
  .empty{color:var(--muted);text-align:center;padding:18px;font-size:12.5px}
  .full{grid-column:1/-1}
  .load{color:var(--muted);text-align:center;padding:60px}
  .gate{color:var(--red);text-align:center;padding:60px;font-size:14px}
  .mini{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
  .mini .mb{flex:1;min-width:130px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px}
  .mini .mb .mt{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
  .mini .mb .mv{font-size:20px;font-weight:800;margin-top:3px;line-height:1.1}
  .salud{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px;margin-top:6px}
  .bar{height:8px;border-radius:6px;background:#2a2115;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:6px}
  .occ{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .occ .o{flex:1;min-width:80px;text-align:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 4px}
  .occ .o .n{font-size:18px;font-weight:800}.occ .o .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.2px;margin-top:3px}
  .cmt{display:flex;gap:9px;padding:8px 0;border-bottom:1px solid #2a2014;align-items:flex-start}
  .cmt .rb{flex:none;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px}
  .cmt .ct{font-size:12.5px;line-height:1.35}.cmt .cm{color:var(--muted);font-size:11px;margin-top:2px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>Panel de <b>incidencias</b></h1>
    <span class="mut" id="hsub">últimos 15 días · por propiedad</span>
  </div>
  <div class="subbar">
    <button class="subv on" data-sede="cdmx">CDMX</button>
    <button class="subv" data-sede="puebla">Puebla</button>
    <button class="subv" data-sede="virreyes">Virreyes</button>
    <button class="subv" data-sede="sincretico">Sincrético</button>
    <button class="rbtn" id="rbtn">⟳ Actualizar</button>
  </div>
</header>
<main>
  <div id="root"><div class="load">Cargando…</div></div>
</main>

<script>
(function(){
  var U='https://rehophywchakfapivsbh.supabase.co', K='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var SEDE='cdmx';
  function tok(){ try{ var v=JSON.parse(localStorage.getItem('sb-rehophywchakfapivsbh-auth-token')); var s=v&&(v.access_token?v:(v.currentSession||v.session||null)); return (s&&s.access_token)?s.access_token:null; }catch(e){ return null; } }
  function H(){ var t=tok(),h={'apikey':K,'Content-Type':'application/json'}; if(t)h['Authorization']='Bearer '+t; return h; }
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});};
  var $=function(id){return document.getElementById(id);};

  async function rpc(sede){
    var r=await fetch(U+'/rest/v1/rpc/panel_incidencias_rh',{method:'POST',headers:H(),body:JSON.stringify({p_sede:sede})});
    if(!r.ok) throw new Error('rpc '+r.status);
    return await r.json();
  }
  async function rpc2(sede){
    var r=await fetch(U+'/rest/v1/rpc/panel_incidencias_rh_fase2',{method:'POST',headers:H(),body:JSON.stringify({p_sede:sede})});
    if(!r.ok) throw new Error('rpc2 '+r.status);
    return await r.json();
  }
  var money=function(n){ n=+n||0; return '$'+Math.round(n).toLocaleString('es-MX'); };
  var pctf=function(n){ return (n==null?'—':(Math.round(n*10)/10)+'%'); };
  function saludColor(s){ s=(s||'').toLowerCase(); if(s.indexOf('sobre')>=0||s.indexOf('línea')>=0||s.indexOf('linea')>=0) return 'var(--green)'; if(s.indexOf('leve')>=0) return 'var(--gold)'; if(s.indexOf('atras')>=0) return 'var(--red)'; return 'var(--gray)'; }
  function ratColor(n){ n=+n||0; return n>=85?'var(--green)':(n>=70?'var(--gold)':'var(--red)'); }

  // ---- gauge semicircular segmentado ----
  function polar(cx,cy,r,ang){ var a=(ang-180)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; }
  function arc(cx,cy,r,a0,a1){ var p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1); var large=(a1-a0)>180?1:0; return 'M'+p0[0].toFixed(1)+' '+p0[1].toFixed(1)+' A'+r+' '+r+' 0 '+large+' 1 '+p1[0].toFixed(1)+' '+p1[1].toFixed(1); }
  function gauge(segs, centerN, centerL){
    var W=200,H=120,cx=100,cy=108,r=84,sw=18;
    var total=0; segs.forEach(function(s){total+=(+s.v||0);});
    var svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:230px">';
    svg+='<path d="'+arc(cx,cy,r,0,180)+'" fill="none" stroke="#2a2115" stroke-width="'+sw+'" stroke-linecap="round"/>';
    if(total>0){ var a=0; segs.forEach(function(s){ var frac=(+s.v||0)/total; if(frac<=0)return; var a1=a+frac*180; svg+='<path d="'+arc(cx,cy,r,a+0.6,a1-0.6)+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'"/>'; a=a1; }); }
    svg+='<text x="'+cx+'" y="'+(cy-14)+'" text-anchor="middle" fill="#f3ead9" font-size="30" font-weight="800">'+centerN+'</text>';
    svg+='<text x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle" fill="#a99a82" font-size="10" font-weight="700" letter-spacing="0.5">'+esc(centerL).toUpperCase()+'</text>';
    svg+='</svg>';
    return '<div class="gwrap">'+svg+'</div>';
  }
  function legend(items){ return '<div class="leg">'+items.map(function(it){ return '<div class="lg"><span class="dot" style="background:'+it.color+'"></span><span class="lbl">'+esc(it.lbl)+'</span><span class="v">'+it.v+'</span></div>'; }).join('')+'</div>'; }

  function cardLlegadas(d){
    var lg=d.llegadas||{}; var lista=lg.lista||[];
    var segs=[{v:lg.a_tiempo,color:'var(--green)'},{v:lg.retrasos,color:'var(--gold)'},{v:lg.faltas,color:'var(--red)'}];
    var h='<div class="card"><h2>🕘 Llegadas · 15 días</h2><div class="csub">registros de checada del personal</div>';
    h+=gauge(segs,(lg.total||0),'llegadas');
    h+=legend([{color:'var(--green)',lbl:'A tiempo',v:lg.a_tiempo||0},{color:'var(--gold)',lbl:'Retrasos',v:lg.retrasos||0},{color:'var(--red)',lbl:'Faltas',v:lg.faltas||0}]);
    h+='<div class="listwrap"><div class="lh">Retrasos</div>';
    if(lista.length){ h+='<table class="rtbl"><tbody>'; lista.forEach(function(x){ var m=+x.min||0; var cls=m>=60?'hi':(m>=20?'mid':''); h+='<tr><td>'+esc(x.nombre)+'</td><td class="f">'+esc(x.fecha)+'</td><td class="min '+cls+'">+'+m+"'</td></tr>"; }); h+='</tbody></table>'; }
    else h+='<div class="empty">Sin retrasos en el periodo 🎉</div>';
    h+='</div></div>';
    return h;
  }
  function cardDocs(d){
    var x=d.documentacion||{};
    var segs=[{v:x.verde,color:'var(--green)'},{v:x.morado,color:'var(--purple)'},{v:x.naranja,color:'var(--orange)'},{v:x.amarillo,color:'var(--gold)'},{v:x.azul,color:'var(--blue)'}];
    var h='<div class="card"><h2>📄 Documentación del personal</h2><div class="csub">estado de contrato · '+ (x.total||0) +' personas</div>';
    h+=gauge(segs,(x.total||0),'personal');
    h+=legend([
      {color:'var(--green)',lbl:'Contrato completo',v:x.verde||0},
      {color:'var(--purple)',lbl:'Planta sin contrato',v:x.morado||0},
      {color:'var(--orange)',lbl:'Prueba con contrato',v:x.naranja||0},
      {color:'var(--gold)',lbl:'Prueba · por vencer',v:x.amarillo||0},
      {color:'var(--blue)',lbl:'Solicitud de contrato',v:x.azul||0}
    ]);
    h+='</div>';
    return h;
  }
  function cardVac(d){
    var v=d.vacaciones||{};
    var segs=[{v:v.tomadas,color:'var(--green)'},{v:v.validadas,color:'var(--blue)'},{v:v.pend_validar,color:'var(--gold)'},{v:v.sin_solicitar,color:'var(--gray)'}];
    var h='<div class="card"><h2>🏖️ Vacaciones</h2><div class="csub">'+(v.asignados||0)+' días asignados al año</div>';
    h+=gauge(segs,(v.asignados||0),'días/año');
    h+=legend([
      {color:'var(--green)',lbl:'Tomadas',v:v.tomadas||0},
      {color:'var(--blue)',lbl:'Validadas',v:v.validadas||0},
      {color:'var(--gold)',lbl:'Pendientes de validar',v:v.pend_validar||0},
      {color:'var(--gray)',lbl:'Sin solicitar',v:v.sin_solicitar||0}
    ]);
    h+='<div class="punta"><span>⚠️ No tomadas / prescritas (&gt;18 meses):</span><span class="n">'+(v.prescritas||0)+' días</span></div>';
    h+='</div>';
    return h;
  }
  function cardTickets(d){
    var t=d.tickets||{};
    var h='<div class="card"><h2>🎫 Tickets que atender</h2><div class="csub">buzón de dirección</div>';
    h+='<div class="tickrow">'+
       '<div class="tk"><div class="n">'+(t.abiertos||0)+'</div><div class="l">Vigentes abiertos</div></div>'+
       '<div class="tk ok"><div class="n">'+(t.respondidos_mi||0)+'</div><div class="l">Respondidos por mí</div></div>'+
       '<div class="tk bad"><div class="n">'+(t.pend_mi||0)+'</div><div class="l">Pendientes de mi respuesta</div></div>'+
       '</div></div>';
    return h;
  }

  // ===== FASE 2 =====
  function cardRecamaristas(f){
    var r=f.recamaristas||{}; if(!r.aplica) return '';
    var h='<div class="card"><h2>🧹 Recamaristas · hoy</h2><div class="csub">productividad del turno de limpieza</div>';
    if(!r.personas){ h+='<div class="empty">Sin reparto de limpieza hoy</div></div>'; return h; }
    h+='<div class="tickrow">'+
       '<div class="tk ok"><div class="n">'+(r.terminadas||0)+'</div><div class="l">Terminadas / '+(r.asignadas||0)+'</div></div>'+
       '<div class="tk"><div class="n">'+(r.extra||0)+'</div><div class="l">Extra</div></div>'+
       '<div class="tk '+((r.no_realizadas||0)>0?'bad':'')+'"><div class="n">'+(r.no_realizadas||0)+'</div><div class="l">No hechas</div></div>'+
       '</div>';
    h+='<div class="listwrap"><div class="lh">Por persona · ef. prom '+(r.ef_promedio!=null?r.ef_promedio+'%':'—')+'</div><table class="rtbl"><tbody>';
    (r.lista||[]).forEach(function(x){ var ef=x.ef; var cls=ef==null?'':(ef>=100?'':(ef>=80?'mid':'hi'));
      h+='<tr><td>'+esc(x.nombre)+'</td><td class="f">'+esc(x.term)+'/'+esc(x.asig)+'</td><td class="min '+cls+'">'+(ef==null?'—':ef+'%')+'</td></tr>'; });
    h+='</tbody></table></div></div>'; return h;
  }
  function cardMtto(f){
    var m=f.mantenimiento||{}; if(!m.aplica) return '';
    var h='<div class="card"><h2>🔧 Mantenimiento · semana</h2><div class="csub">tickets resueltos esta semana</div>';
    h+='<div class="tickrow">'+
       '<div class="tk ok"><div class="n">'+(m.resueltos_sem||0)+'</div><div class="l">Resueltos</div></div>'+
       '<div class="tk"><div class="n">'+(m.horas_sem||0)+'</div><div class="l">Horas</div></div>'+
       '<div class="tk '+((m.pendientes||0)>0?'warn':'')+'"><div class="n">'+(m.pendientes||0)+'</div><div class="l">Pendientes</div></div>'+
       '</div>';
    var pt=m.por_tecnico||[];
    if(pt.length){ h+='<div class="listwrap"><div class="lh">Por técnico</div><table class="rtbl"><tbody>';
      pt.forEach(function(x){ h+='<tr><td>'+esc(x.tecnico)+'</td><td class="f">'+esc(x.resueltos)+' tickets</td><td class="min">'+esc(x.horas)+' h</td></tr>'; });
      h+='</tbody></table></div>'; }
    h+='</div>'; return h;
  }
  function cardTours(f){
    var t=f.tours||{}; if(!t.aplica) return '';
    var h='<div class="card"><h2>🎟️ Tours · Sincrético</h2><div class="csub">ventas de experiencias</div>';
    h+='<div class="tickrow">'+
       '<div class="tk"><div class="n">'+(t.vendidos_hoy||0)+'</div><div class="l">Vendidos hoy</div></div>'+
       '<div class="tk"><div class="n" style="font-size:18px">'+money(t.monto_hoy)+'</div><div class="l">Monto hoy</div></div>'+
       '<div class="tk"><div class="n">'+(t.pax_por_llegar||0)+'</div><div class="l">Pax por llegar</div></div>'+
       '</div>';
    h+='<div class="listwrap"><div class="lh">Mes</div><div style="padding:6px 2px">Venta del mes: <b>'+money(t.venta_mes)+'</b></div>';
    if(t.sin_datos) h+='<div class="empty">Aún sin ventas registradas en el sistema de tours.</div>';
    h+='</div></div>'; return h;
  }
  function mesBlock(m,lbl){ if(!m) return ''; var sc=saludColor(m.salud);
    return '<div class="mb"><div class="mt">'+lbl+'</div><div class="mv">'+money(m.forecast)+'</div>'+
      '<div class="mut" style="font-size:11px">plan '+money(m.plan)+'</div>'+
      '<div class="bar"><i style="width:'+Math.max(3,Math.min(100,(+m.pct_cump||0)))+'%;background:'+sc+'"></i></div>'+
      '<div style="font-size:11px;margin-top:4px">cumpl. '+pctf(m.pct_cump)+' · pace AA '+pctf(m.pace_yoy)+'</div>'+
      '<span class="salud" style="background:'+sc+'22;color:'+sc+'">'+esc(m.salud||'')+'</span></div>';
  }
  function cardPace(f){
    var p=f.pace||{}; if(!p.aplica) return '';
    var occ=p.ocupacion||{}, dia=p.dia||{}, ec=(dia&&dia.en_casa)||{};
    var h='<div class="card full"><h2>📈 Pace & forecast</h2><div class="csub">forecast del mes y ocupación de hoy</div>';
    h+='<div class="mini">'+mesBlock(p.mes_actual,'Mes actual')+mesBlock(p.mes_prox,'Mes próximo')+'</div>';
    h+='<div class="occ">'+
       '<div class="o"><div class="n">'+(occ.general!=null?occ.general+'%':'—')+'</div><div class="l">Ocup. gral</div></div>'+
       '<div class="o"><div class="n">'+(occ.dorm!=null?occ.dorm+'%':'—')+'</div><div class="l">Dorms</div></div>'+
       '<div class="o"><div class="n">'+(occ.privadas!=null?occ.privadas+'%':'—')+'</div><div class="l">Privadas</div></div>'+
       '<div class="o"><div class="n">'+(dia.llegadas!=null?dia.llegadas:'—')+'</div><div class="l">Llegadas hoy</div></div>'+
       '<div class="o"><div class="n">'+(dia.salidas!=null?dia.salidas:'—')+'</div><div class="l">Salidas hoy</div></div>'+
       '<div class="o"><div class="n">'+(ec.total!=null?ec.total:'—')+'</div><div class="l">En casa</div></div>'+
       '</div></div>'; return h;
  }
  function cardReputacion(f){
    var r=f.reputacion||{}; if(!r.aplica) return '';
    var fs=r.fuentes||[], cs=r.comentarios||[];
    var h='<div class="card full"><h2>💬 PepeFeliz · reputación</h2><div class="csub">nota por fuente · '+(r.coment_10d||0)+' reseñas en 10 días</div>';
    h+='<div class="mini">';
    fs.forEach(function(x){ var c=ratColor(x.nota100); h+='<div class="mb"><div class="mt">'+esc(x.fuente)+'</div><div class="mv" style="color:'+c+'">'+esc(x.rating)+'<span style="font-size:12px;color:var(--muted)">/'+esc(x.escala)+'</span></div><div class="mut" style="font-size:11px">'+esc(x.nota100)+'/100 · '+(x.resenas||0)+' reseñas</div></div>'; });
    h+='</div>';
    if(cs.length){ h+='<div class="listwrap"><div class="lh">Últimos comentarios</div>';
      cs.forEach(function(x){ var esc5=(x.plataforma==='google'||x.plataforma==='tripadvisor'); var c=ratColor((+x.rating||0)*(esc5?20:10));
        h+='<div class="cmt"><div class="rb" style="background:'+c+'22;color:'+c+'">'+(x.rating==null?'—':esc(x.rating))+'</div><div><div class="ct">'+esc(x.texto)+'</div><div class="cm">'+esc(x.plataforma)+' · '+esc(x.fecha)+'</div></div></div>'; });
      h+='</div>'; }
    h+='</div>'; return h;
  }

  async function load(){
    $('root').innerHTML='<div class="load">Cargando…</div>';
    var d, f=null;
    try{ d=await rpc(SEDE); }catch(e){ $('root').innerHTML='<div class="gate">No se pudo cargar. Inicia sesión de nuevo o revisa tu conexión.</div>'; return; }
    if(d && d.error){ $('root').innerHTML='<div class="gate">'+esc(d.error)+'</div>'; return; }
    try{ f=await rpc2(SEDE); if(f && f.error) f=null; }catch(e){ f=null; }
    var g=cardLlegadas(d)+cardDocs(d)+cardVac(d)+cardTickets(d);
    if(f){ g+=cardRecamaristas(f)+cardMtto(f)+cardTours(f)+cardPace(f)+cardReputacion(f); }
    $('root').innerHTML='<div class="grid">'+g+'</div>';
    try{ $('hsub').textContent='operación al día · '+({cdmx:'CDMX',puebla:'Puebla',virreyes:'Virreyes',sincretico:'Sincrético'}[SEDE]||SEDE); }catch(_){}
  }

  document.querySelectorAll('.subv').forEach(function(b){ b.onclick=function(){ document.querySelectorAll('.subv').forEach(function(x){x.classList.remove('on');}); b.classList.add('on'); SEDE=b.getAttribute('data-sede'); load(); }; });
  $('rbtn').onclick=load;
  load();
})();
</script>
