<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM · Contactos del Grupo</title>
<style>
:root{--bg:#F4F1EA;--card:#fff;--ink:#1c1813;--soft:#6b6459;--line:#e6e0d4;--gold:#b8862f;--green:#1d7a5a;--terra:#b2472c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 16px 8px;border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--soft);font-size:12.5px;margin-top:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;font-size:13px;background:#fff}
.bar input[type=search]{flex:1;min-width:160px}
.btn{padding:8px 13px;border-radius:9px;border:0;font-weight:700;font-size:13px;cursor:pointer}
.btn.p{background:var(--gold);color:#fff}.btn.g{background:var(--green);color:#fff}.btn.o{background:#fff;border:1px solid var(--line);color:var(--ink)}
.wrap{padding:12px 16px 80px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-width:96px}
.kpi b{display:block;font-size:20px}.kpi span{font-size:11px;color:var(--soft);text-transform:uppercase;letter-spacing:.06em}
.tablewrap{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--soft);position:sticky;top:0;background:#faf8f3;cursor:pointer;white-space:nowrap}
tr:hover td{background:#faf8f3}
.chip{display:inline-block;background:#f0ebdf;color:#6b5a2f;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;margin:1px 2px}
.chip.u{background:#e7f0ec;color:#1d7a5a}.chip.f{background:#f3e7e2;color:#b2472c}
.mini{color:var(--soft);font-size:12px}
a.act{color:var(--gold);font-weight:700;cursor:pointer;margin-right:8px}
.empty{padding:40px;text-align:center;color:var(--soft)}
#modal{position:fixed;inset:0;background:rgba(20,16,11,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
#modal.on{display:flex}.box{background:#fff;border-radius:16px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:20px}
.box h3{margin:0 0 12px}.fld{margin:8px 0}.fld label{display:block;font-size:12px;color:var(--soft);font-weight:700;margin-bottom:3px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px;border:1px solid var(--line);border-radius:9px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--green);color:#fff;padding:10px 16px;border-radius:10px;font-weight:700;display:none;z-index:60}
.toast.err{background:var(--terra)}
</style></head><body>
<div class="top">
  <h1>📇 CRM · Contactos del Grupo</h1>
  <div class="sub" id="sub">Cargando…</div>
  <div class="bar">
    <input type="search" id="q" placeholder="Buscar nombre, correo, teléfono, empresa…">
    <select id="fUnidad" data-cp-ubic><option value="">Todas las unidades</option><option value="virreyes">Virreyes</option><option value="cdmx">CDMX</option><option value="puebla">Puebla</option><option value="sincretico">Sincrético</option><option value="corp">Corporativo</option></select>
    <select id="fFuente"><option value="">Todas las fuentes</option></select>
    <button class="btn g" id="btnAdd">＋ Contacto</button>
    <button class="btn o" id="btnCsv">⭳ CSV</button>
  </div>
</div>
<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="tablewrap"><table><thead><tr>
    <th data-s="nombre">Nombre</th><th>Contacto</th><th data-s="empresa">Empresa</th>
    <th>Unidad</th><th>Fuentes</th><th>Eventos</th><th data-s="ultimo_at">Último</th><th></th>
  </tr></thead><tbody id="tb"><tr><td colspan="8" class="empty">Cargando contactos…</td></tr></tbody></table></div>
</div>
<div id="modal"><div class="box">
  <h3 id="mTitle">Nuevo contacto</h3>
  <input type="hidden" id="mId">
  <div class="fld"><label>Nombre</label><input id="mNombre"></div>
  <div class="fld"><label>Correo</label><input id="mEmail" type="email"></div>
  <div class="fld"><label>Teléfono / WhatsApp</label><input id="mTel"></div>
  <div class="fld"><label>Empresa</label><input id="mEmpresa"></div>
  <div class="fld"><label>Unidad</label><select id="mUnidad"><option value="virreyes">Virreyes</option><option value="cdmx">CDMX</option><option value="puebla">Puebla</option><option value="sincretico">Sincrético</option><option value="corp">Corporativo</option></select></div>
  <div class="fld"><label>Notas</label><textarea id="mNotas" rows="2"></textarea></div>
  <div style="display:flex;gap:8px;margin-top:12px">
    <button class="btn g" id="mSave" style="flex:1">Guardar</button>
    <button class="btn o" id="mDel">Borrar</button>
    <button class="btn o" id="mClose">Cancelar</button>
  </div>
</div></div>
<div class="toast" id="toast"></div>
<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var TBL='crm_contactos';
  var rows=[], view=[], sortKey='ultimo_at', sortDir=-1;
  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(w){var h={'apikey':KEY,'Authorization':'Bearer '+(w?tok():KEY),'Content-Type':'application/json'};return h;}
  function toast(t,err){var e=document.getElementById('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2800);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function arr(x){return Array.isArray(x)?x:[];}
  function fdate(s){if(!s)return '';var d=new Date(s);if(isNaN(d))return '';return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'2-digit'});}

  async function load(){
    var r=await fetch(SB+'/rest/v1/'+TBL+'?select=*&order=ultimo_at.desc&limit=5000',{headers:hdr(true)});
    if(!r.ok){document.getElementById('tb').innerHTML='<tr><td colspan="8" class="empty">No se pudieron cargar los contactos (revisa tu sesión).</td></tr>';document.getElementById('sub').textContent='Error de carga';return;}
    rows=await r.json();
    // fuentes al filtro
    var fset={};rows.forEach(function(c){arr(c.fuentes).forEach(function(f){fset[f]=1;});});
    var sf=document.getElementById('fFuente');
    Object.keys(fset).sort().forEach(function(f){var o=document.createElement('option');o.value=f;o.textContent=f;sf.appendChild(o);});
    apply();
  }
  function apply(){
    var q=(document.getElementById('q').value||'').toLowerCase().trim();
    var u=document.getElementById('fUnidad').value;
    var f=document.getElementById('fFuente').value;
    view=rows.filter(function(c){
      if(u){ if((c.unidad!==u) && arr(c.unidades).indexOf(u)<0) return false; }
      if(f && arr(c.fuentes).indexOf(f)<0) return false;
      if(q){var hay=[c.nombre,c.email,c.telefono,c.empresa].join(' ').toLowerCase();if(hay.indexOf(q)<0)return false;}
      return true;
    });
    view.sort(function(a,b){var x=a[sortKey]||'',y=b[sortKey]||'';return (x<y?-1:x>y?1:0)*sortDir;});
    render();
  }
  function render(){
    var tb=document.getElementById('tb');
    document.getElementById('sub').textContent=view.length+' de '+rows.length+' contactos';
    // KPIs
    var byU={};rows.forEach(function(c){var k=c.unidad||'—';byU[k]=(byU[k]||0)+1;});
    var kp=document.getElementById('kpis');kp.innerHTML='<div class="kpi"><b>'+rows.length+'</b><span>Total</span></div>'+
      Object.keys(byU).sort(function(a,b){return byU[b]-byU[a];}).map(function(k){return '<div class="kpi"><b>'+byU[k]+'</b><span>'+esc(k)+'</span></div>';}).join('');
    if(!view.length){tb.innerHTML='<tr><td colspan="8" class="empty">Sin resultados.</td></tr>';return;}
    tb.innerHTML=view.slice(0,1000).map(function(c){
      var contacto=[c.email?('✉ '+esc(c.email)):'',c.telefono?('☎ '+esc(c.telefono)):''].filter(Boolean).join('<br>');
      var uni=arr(c.unidades).map(function(x){return '<span class="chip u">'+esc(x)+'</span>';}).join('')||('<span class="chip u">'+esc(c.unidad||'—')+'</span>');
      var fu=arr(c.fuentes).map(function(x){return '<span class="chip f">'+esc(x)+'</span>';}).join('');
      var ev=arr(c.eventos).slice(0,3).map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('');
      return '<tr><td><b>'+esc(c.nombre||'')+'</b></td><td class="mini">'+contacto+'</td><td>'+esc(c.empresa||'')+'</td><td>'+uni+'</td><td>'+fu+'</td><td>'+ev+'</td><td class="mini">'+fdate(c.ultimo_at)+'</td><td><a class="act" data-id="'+c.id+'">editar</a></td></tr>';
    }).join('');
    Array.prototype.forEach.call(tb.querySelectorAll('a.act'),function(a){a.onclick=function(){openEdit(a.getAttribute('data-id'));};});
  }
  // modal
  function openEdit(id){
    var c=rows.filter(function(x){return x.id===id;})[0]||{};
    document.getElementById('mTitle').textContent=id?'Editar contacto':'Nuevo contacto';
    document.getElementById('mId').value=c.id||'';
    document.getElementById('mNombre').value=c.nombre||'';
    document.getElementById('mEmail').value=c.email||'';
    document.getElementById('mTel').value=c.telefono||'';
    document.getElementById('mEmpresa').value=c.empresa||'';
    document.getElementById('mUnidad').value=c.unidad||'virreyes';
    document.getElementById('mNotas').value=c.notas||'';
    document.getElementById('mDel').style.display=id?'':'none';
    document.getElementById('modal').classList.add('on');
  }
  document.getElementById('btnAdd').onclick=function(){openEdit('');};
  document.getElementById('mClose').onclick=function(){document.getElementById('modal').classList.remove('on');};
  document.getElementById('mSave').onclick=async function(){
    var id=document.getElementById('mId').value;
    var body={nombre:document.getElementById('mNombre').value.trim()||'Sin nombre',
      email:document.getElementById('mEmail').value.trim().toLowerCase()||null,
      telefono:document.getElementById('mTel').value.trim()||null,
      empresa:document.getElementById('mEmpresa').value.trim()||null,
      unidad:document.getElementById('mUnidad').value,
      notas:document.getElementById('mNotas').value.trim()||null,
      updated_at:new Date().toISOString()};
    var r;
    if(id){ r=await fetch(SB+'/rest/v1/'+TBL+'?id=eq.'+id,{method:'PATCH',headers:Object.assign(hdr(true),{'Prefer':'return=minimal'}),body:JSON.stringify(body)}); }
    else { body.fuentes=['manual'];body.unidades=[body.unidad]; r=await fetch(SB+'/rest/v1/'+TBL,{method:'POST',headers:Object.assign(hdr(true),{'Prefer':'return=minimal'}),body:JSON.stringify(body)}); }
    if(r.ok){toast('Guardado');document.getElementById('modal').classList.remove('on');load();}
    else toast('No se pudo guardar (permiso o sesión)',true);
  };
  document.getElementById('mDel').onclick=async function(){
    var id=document.getElementById('mId').value;if(!id)return;if(!confirm('¿Borrar este contacto?'))return;
    var r=await fetch(SB+'/rest/v1/'+TBL+'?id=eq.'+id,{method:'DELETE',headers:hdr(true)});
    if(r.ok){toast('Borrado');document.getElementById('modal').classList.remove('on');load();}
    else toast('Solo dirección puede borrar',true);
  };
  document.getElementById('btnCsv').onclick=function(){
    var cols=['nombre','email','telefono','empresa','unidad','fuentes','eventos','ultimo_at'];
    var lines=[cols.join(',')].concat(view.map(function(c){return cols.map(function(k){var v=c[k];if(Array.isArray(v))v=v.join('|');return '"'+String(v==null?'':v).replace(/"/g,'""')+'"';}).join(',');}));
    var blob=new Blob(["﻿"+lines.join('\n')],{type:'text/csv;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='crm_contactos.csv';a.click();
  };
  ['q','fUnidad','fFuente'].forEach(function(id){document.getElementById(id).addEventListener('input',apply);});
  Array.prototype.forEach.call(document.querySelectorAll('th[data-s]'),function(th){th.onclick=function(){var k=th.getAttribute('data-s');if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}apply();};});
  load();
})();
</script>
</body></html>
