   Tres pestañas y ninguna más, porque son las tres preguntas que se hacen:
     · El embudo  — ¿qué entró y en qué va cada cosa?
     · El dinero  — ¿quién debe, quién pagó y a quién le debemos?
     · El catálogo— ¿con qué precios está cotizando la página ahora mismo?

var TOSTA=null;
function tosta(txt,mal){
  if(!TOSTA){ TOSTA=document.createElement('div'); document.body.appendChild(TOSTA);
    TOSTA.style.cssText='position:fixed;left:50%;bottom:18px;transform:translateX(-50%);'+

  TOSTA.style.color      = mal? '#8C2F27' : 'var(--ok)';

/* El token de Supabase dura una hora. Se relee en cada llamada y, si aun así
   contesta 401, se renueva con el refresh_token y se reintenta una vez. */
function clave(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k))return k;}}catch(_){}return null;}
function sesion(){try{var k=clave(); if(!k)return null;
  var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); return (s&&s.access_token)?s:null;}catch(_){}return null;}
function hdr(extra){
  var S=sesion();
  var h={'apikey':KEY,'Authorization':'Bearer '+((S&&S.access_token)||KEY),
         'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
var renovando=null, ultimoFalloRef=0, ESPERA_REF=60000;
async function renueva(){
  if(renovando) return renovando;
  if(Date.now()-ultimoFalloRef<ESPERA_REF) return null;
  renovando=(async function(){
    try{
      var s=sesion(); if(!s||!s.refresh_token) return null;
      var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
        headers:{apikey:KEY,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok){ ultimoFalloRef=Date.now(); return null; }
      var j=await r.json(); if(!j||!j.access_token) return null;
      var k=clave();
      if(k){ try{
        var v=JSON.parse(localStorage.getItem(k)||'null')||{};
        if(v.currentSession) v.currentSession=Object.assign({},v.currentSession,j);
        else v=Object.assign({},v,j);
        localStorage.setItem(k,JSON.stringify(v));
      }catch(_){} }
      return j.access_token;
    }catch(_){ return null; }
    finally{ setTimeout(function(){ renovando=null; },0); }
  })();
  return renovando;
}
async function get(p){
  var r=await fetch(SB+'/rest/v1/'+p,{headers:hdr()});
  if(r.status===401){ if(await renueva()) r=await fetch(SB+'/rest/v1/'+p,{headers:hdr()}); }
  if(!r.ok) throw new Error('La base respondió '+r.status);
  return await r.json();
}
async function rpc(fn,args){
  var o={method:'POST',headers:hdr(),body:JSON.stringify(args||{})};
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,o);
  if(r.status===401){ if(await renueva()) r=await fetch(SB+'/rest/v1/rpc/'+fn,o); }
  var t=await r.text(), j=null; try{ j=JSON.parse(t); }catch(_){}
  if(!r.ok) throw new Error((j&&(j.message||j.hint||j.error))||('La base respondió '+r.status));

}
async function patch(tabla,filtro,cuerpo){
  var o={method:'PATCH',headers:hdr({'Prefer':'return=minimal'}),body:JSON.stringify(cuerpo)};
  var r=await fetch(SB+'/rest/v1/'+tabla+'?'+filtro,o);
  if(r.status===401){ if(await renueva()) r=await fetch(SB+'/rest/v1/'+tabla+'?'+filtro,o); }
  if(!r.ok){ var t=await r.text(); var j=null; try{j=JSON.parse(t);}catch(_){}
    throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status)); }
  return true;
}

/* ===================== ESTADO ===================== */
/* LAS ETAPAS NO SE ARRASTRAN. La columna donde cae una cotización es un hecho,
   no una opinión: la pone corp_solicitar al nacer, corp_confirmar al programar
   la salida y corp_pago_registrar cuando entra el dinero. */
var ETAPAS=[
  {k:'solicitud', n:'Solicitud',       d:'Llegó de la página. Nadie la ha tocado.'},
  {k:'anticipo',  n:'Esperando el anticipo', d:'Confirmada o con algo pagado. Falta el 30%.'},
  {k:'pagado',    n:'Pagado',          d:'El dinero cubre el total.'},
  {k:'pasado',    n:'Ya pasó',         d:'El evento se dio o se cayó.'}
];
var TAB='embudo', COTS=[], LIN={}, PAG={}, REGLAS={}, TRANSP=[], EXTRAS=[], ESPACIOS=[], EXPS=[],
    abierta=null, EDIT=null, VERARCH=false;

function regla(k,d){ var v=REGLAS[k]; return v==null||v===''?d:v; }
function anticipoDe(c){
  var p=Number(c.anticipo_pct||regla('anticipo_pct',30))||30;
  return Number(c.total||0)*p/100;
}
function faltaDe(c){ return Math.max(Number(c.total||0)-Number(c.pagado||0),0); }

/* ===================== EL EMBUDO ===================== */
function tarjeta(c){
  var ant=anticipoDe(c), pag=Number(c.pagado||0);
  var etqs=[];
  if(c.salida_id) etqs.push('<span class="etq pub">Programada</span>');
  else if(c.etapa!=='solicitud') etqs.push('<span class="etq mano">Sin salida</span>');
  if(c.correo_error) etqs.push('<span class="etq no">El correo falló</span>');
  else if(!c.correo_at) etqs.push('<span class="etq mano">Sin correo</span>');
  if(pag>0 && pag<Number(c.total||0)) etqs.push('<span class="etq con">'+moneyC(pag)+' dentro</span>');
  return '<button class="tj" data-cot="'+esc(c.id)+'">'+
    '<b>'+esc(c.empresa||'sin nombre')+'</b>'+
    '<div class="don">'+esc(c.folio)+' · '+(Number(c.personas)||0)+' personas</div>'+
    '<div class="mini2">'+esc(diaCorto(c.fecha1))+(c.hora1?' · '+esc(hhmm(c.hora1)):'')+'</div>'+
    '<div class="imp">'+moneyC(c.total)+'</div>'+
    (c.etapa==='anticipo'&&pag<ant
      ? '<div class="mini2">Anticipo '+moneyC(ant)+'</div>' : '')+
    (etqs.length?'<div class="datos">'+etqs.join('')+'</div>':'')+
  '</button>';
}
function vivas(){
  /* ARCHIVAR, NO BORRAR. Javi, 21-nov-2026. Una cotización que no fue sigue
     contando -dice qué se pidió y a qué precio-, pero no tiene por qué estar
     en el tablero de lo que hay que mover. */
  return COTS.filter(function(c){ return VERARCH ? !!c.archivada_at : !c.archivada_at; });
}
function pintaEmbudo(){
  var nArch=COTS.filter(function(c){ return !!c.archivada_at; }).length;
  var h='<div class="hoja" style="padding-bottom:0"><div style="display:flex;gap:8px;flex-wrap:wrap">'+
    '<button class="btn '+(VERARCH?'':'fan')+' sm" id="bArch">'+
      (VERARCH?'← Volver al tablero':'Ver archivadas'+(nArch?' ('+nArch+')':''))+'</button></div></div>'+
    '<div class="tablero">';
  ETAPAS.forEach(function(e,i){
    var l=vivas().filter(function(c){ return (c.etapa||'solicitud')===e.k; });
    var suma=l.reduce(function(a,c){ return a+Number(c.total||0); },0);
    h+='<section class="col"><div class="cab">'+
        '<div class="num">Paso '+(i+1)+'</div><h2>'+esc(e.n)+'</h2>'+
        '<div class="cuenta">'+l.length+'<small>'+moneyC(suma)+'</small></div>'+
        '<div class="mini2" style="color:var(--tenue);font-size:11px;margin-top:4px">'+esc(e.d)+'</div>'+
      '</div><div class="cuerpo">'+
      (l.length? l.map(tarjeta).join('') : '<div class="nada">Nada por aquí.</div>')+
      '</div></section>';
  });
  return h+'</div>';
}

/* ===================== EL DINERO ===================== */
/* Dos preguntas distintas y se enseñan aparte: lo que nos deben los clientes
   y lo que debemos a los ateneístas. Javi, 21-nov-2026: la venta corporativa
   se le paga al ateneísta por transferencia, no por su Stripe; esa deuda la
   lleva sinc_repartos y se mira en «Por pagar». */
function pintaDinero(){
  var L=COTS.filter(function(c){ return !c.archivada_at; });
  var vendido=L.filter(function(c){ return c.salida_id; });
  var cobrado=L.reduce(function(a,c){ return a+Number(c.pagado||0); },0);
  var porCobrar=vendido.reduce(function(a,c){ return a+faltaDe(c); },0);
  var pipeline=L.filter(function(c){ return c.etapa==='solicitud'; })
                .reduce(function(a,c){ return a+Number(c.total||0); },0);

  var h='<div class="hoja">';
  h+='<div class="kpis">'+
      kpi('En el embudo', moneyC(pipeline), (function(n){
        return n===1?'1 solicitud sin confirmar':n+' solicitudes sin confirmar';
      })(L.filter(function(c){return c.etapa==='solicitud';}).length))+
      kpi('Vendido', moneyC(vendido.reduce(function(a,c){return a+Number(c.total||0);},0)),
        vendido.length===1?'1 con salida programada':vendido.length+' con salida programada')+
      kpi('Cobrado', moneyC(cobrado), 'anticipos y saldos registrados')+
      kpi('Por cobrar', moneyC(porCobrar), 'de lo ya vendido')+
    '</div>';

  var conf=vendido.slice().sort(function(a,b){ return String(a.fecha1||'').localeCompare(String(b.fecha1||'')); });
  h+='<div class="tabla"><h3>Lo vendido, y qué falta cobrar</h3>'+
    (conf.length? '<table class="tb"><thead><tr>'+
      '<th>Folio</th><th>Empresa</th><th>Cuándo</th><th>Pax</th>'+
      '<th style="text-align:right">Total</th><th style="text-align:right">Pagado</th>'+
      '<th style="text-align:right">Falta</th><th></th></tr></thead><tbody>'+
      conf.map(function(c){
        var f=faltaDe(c);
        return '<tr><td>'+esc(c.folio)+'</td><td>'+esc(c.empresa)+'</td>'+
          '<td>'+esc(diaCorto(c.fecha1))+(c.hora1?' '+esc(hhmm(c.hora1)):'')+'</td>'+
          '<td class="i">'+(Number(c.personas)||0)+'</td>'+
          '<td class="i">'+money(c.total)+'</td>'+
          '<td class="i">'+money(c.pagado||0)+'</td>'+
          '<td class="i">'+(f>0?'<b style="color:var(--mal)">'+money(f)+'</b>':'<span class="etq pub">Al día</span>')+'</td>'+
          '<td><button class="btn fan sm" data-cot="'+esc(c.id)+'">Abrir</button></td></tr>';
      }).join('')+'</tbody></table>'
      : '<div class="vacio">Todavía no hay ninguna cotización confirmada.</div>')+
    '</div>';

  h+='<div class="nota amb">Lo que se le debe al ateneísta por estas ventas no se paga por su Stripe: '+
     'nace como deuda y se le paga por transferencia. Esa lista vive en <b>Por pagar</b>, '+
     'con el resto de lo que el grupo debe a sus operadores.</div>';
  return h+'</div>';
}
function kpi(k,v,d){
  return '<div class="kpi"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div>'+
    (d?'<div class="d">'+esc(d)+'</div>':'')+'</div>';
}

function fotoDe(o){
  if(!o) return '';
  if(o.foto_url) return o.foto_url;
  var f=o.fotos; if(Array.isArray(f)&&f.length) return typeof f[0]==='string'?f[0]:(f[0].url||'');
  return '';
}
/* ===================== SUBIR FOTOS =====================
   Javi, 21-nov-2026: «mete la opción de subir foto y editar en todos los
   editores de info de la página». Pedir una liga era pedirle a alguien que
   primero suba la foto a otro lado y luego copie la dirección: dos pasos de
   los que el segundo se olvida, y por eso media base no tiene fotos. Ahora se
   escoge del teléfono o de la computadora y se sube al almacén del grupo.
   La liga sigue a la vista y se puede pegar a mano: a veces la foto ya vive
   en otro sitio y lo rápido es pegarla. */
var BUCKET='sincretico';
var FOTOS={};   /* k -> [url] mientras el editor está abierto */

function nombreArchivo(f){
  var ext=(String(f.name||'').match(/\.[a-z0-9]+$/i)||['.jpg'])[0].toLowerCase();
  return 'corp/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+ext;
}
async function subeArchivo(f){
  if(!/^image\//.test(f.type||'')) throw new Error('Eso no es una imagen');
  if(f.size>8*1024*1024) throw new Error('La foto pesa más de 8 MB; recórtala antes');
  var S=sesion(); var tok=(S&&S.access_token)||KEY;
  var ruta=nombreArchivo(f);
  var r=await fetch(SB+'/storage/v1/object/'+BUCKET+'/'+ruta,{method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+tok,
             'Content-Type':f.type||'image/jpeg','x-upsert':'true'},body:f});
  if(!r.ok){ var d=''; try{ d=(await r.json()).message||''; }catch(_){}
    throw new Error('El almacén la rechazó ('+r.status+(d?' · '+d:'')+')'); }
  return SB+'/storage/v1/object/public/'+BUCKET+'/'+ruta;
}
function pintaFotos(k){
  var cont=$('fot_'+k); if(!cont) return;
  var ls=FOTOS[k]||[];
  cont.innerHTML = ls.length
    ? ls.map(function(u,i){
        return '<span class="fotoMini" style="background-image:url('+encodeURI(u)+')">'+
          '<button type="button" data-quita="'+k+':'+i+'" aria-label="Quitar">×</button>'+
          (i>0?'<button type="button" class="izq" data-sube="'+k+':'+i+'" aria-label="Mover antes">‹</button>':'')+
          '</span>'; }).join('')
    : '<span style="color:var(--tenue);font-size:12.5px">Todavía no hay fotos.</span>';
  Array.prototype.forEach.call(cont.querySelectorAll('[data-quita]'),function(b){
    b.onclick=function(){ var p=b.getAttribute('data-quita').split(':');
      FOTOS[p[0]].splice(Number(p[1]),1); pintaFotos(p[0]); };});
  Array.prototype.forEach.call(cont.querySelectorAll('[data-sube]'),function(b){
    b.onclick=function(){ var p=b.getAttribute('data-sube').split(':'), i=Number(p[1]);
      var a=FOTOS[p[0]]; var t=a[i-1]; a[i-1]=a[i]; a[i]=t; pintaFotos(p[0]); };});
}
function campoFotos(k,et,varias){
  return '<label class="cmpl"><span>'+esc(et)+'</span></label>'+
    '<div class="fotos" id="fot_'+k+'"></div>'+
    '<div style="display:flex;gap:8px;align-items:center;margin:8px 0 2px;flex-wrap:wrap">'+
      '<button type="button" class="btn fan sm" id="bSube_'+k+'">'+
        (varias?'Subir fotos':'Subir foto')+'</button>'+
      '<button type="button" class="btn fan sm" id="bCarp_'+k+'">De la carpeta de contenido</button>'+
      '<input type="file" accept="image/*"'+(varias?' multiple':'')+
        ' id="file_'+k+'" style="display:none">'+
      '<span id="est_'+k+'" style="font-size:12.5px;color:var(--tenue)"></span>'+
    '</div>'+
    '<label class="cmpl"><span style="font-size:11.5px">…o pega la liga'+(varias?' (una por renglón)':'')+'</span>'+
      (varias?'<textarea class="cmp" id="f_'+k+'" rows="3"></textarea>'
             :'<input class="cmp" id="f_'+k+'">')+'</label>';
}
function cableaFotos(k,varias){
  var b=$('bSube_'+k), inp=$('file_'+k), est=$('est_'+k), txt=$('f_'+k);
  if(!b||!inp) return;
  b.onclick=function(){ inp.click(); };
  /* La carpeta de contenido: lo que ya está subido no se vuelve a subir. */
  var bc=$('bCarp_'+k);
  if(bc) bc.onclick=async function(){
    if(!window.cpFotos){ await avisa('La carpeta de contenido no cargó; recarga la pantalla.'); return; }
    var us=await cpFotos.elige({varias:varias});
    if(!us || !us.length) return;
    if(varias) us.forEach(function(u){ if(FOTOS[k].indexOf(u)<0) FOTOS[k].push(u); });
    else FOTOS[k]=[us[0]];
    pintaFotos(k); sincroTexto();
  };
  inp.onchange=async function(){
    var fs=Array.prototype.slice.call(inp.files||[]); if(!fs.length) return;
    if(!varias) fs=fs.slice(0,1);
    b.disabled=true;
    for(var i=0;i<fs.length;i++){
      est.textContent='Subiendo '+(i+1)+' de '+fs.length+'…';
      try{ var u=await subeArchivo(fs[i]);
        if(varias) FOTOS[k].push(u); else FOTOS[k]=[u];
      }catch(e){ est.textContent=''; b.disabled=false; inp.value='';
        await avisa('No se pudo subir: '+e.message); pintaFotos(k); sincroTexto(); return; }
    }
    est.textContent=fs.length>1?(fs.length+' fotos arriba'):'Lista';
    setTimeout(function(){ est.textContent=''; },2200);
    b.disabled=false; inp.value=''; pintaFotos(k); sincroTexto();
  };
  /* Pegar la liga a mano sigue valiendo: manda lo último que se tocó. */
  if(txt) txt.oninput=function(){
    FOTOS[k]= varias ? String(txt.value||'').split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean)
                     : (String(txt.value||'').trim()?[String(txt.value).trim()]:[]);
    pintaFotos(k);
  };
  function sincroTexto(){ if(txt) txt.value=(FOTOS[k]||[]).join('\n'); }
  sincroTexto(); pintaFotos(k);
}

    }else if(t==='sel'){

async function guardaExclusivo(def){
  var b=$('bGuardaEx'); var cuerpo={};
  var falta=null;
  def.campos.forEach(function(c){
    var k=c[0], t=c[2], req=c[3], el=$('f_'+k); if(!el) return;
    if(k==='foto') return;
    if(t==='fotos'){ cuerpo[k]=(FOTOS[k]||[]).slice(); return; }
    if(t==='bool'){ cuerpo[k]=!!el.checked; return; }
    var v=String(el.value||'').trim();
    if(req && v===''){ falta=falta||c[1]; }
    if(t==='num'){ cuerpo[k] = v===''?null:Number(v); }
    else cuerpo[k] = v===''?null:v;
  });
  if(falta){ await avisa('Falta «'+falta+'».'); return; }
  /* La foto va donde cada tabla la guarda: una liga en el extra, una lista en
     el vehículo. Un campo en la pantalla, dos formas en la base. */
  if(FOTOS.foto){
    var fu=(FOTOS.foto||[])[0]||'';
    if(EDIT.que==='veh') cuerpo.fotos = fu?[fu]:[];
    else { cuerpo.foto_url = fu||null; cuerpo.fotos = fu?[fu]:[]; }
  }
  b.disabled=true; b.textContent='Guardando…';
  try{
    if(EDIT.id) await patch(def.tabla,'id=eq.'+encodeURIComponent(EDIT.id),cuerpo);
    else{
      var r=await fetch(SB+'/rest/v1/'+def.tabla,{method:'POST',
        headers:hdr({'Prefer':'return=minimal'}),body:JSON.stringify(cuerpo)});
      if(!r.ok){ var t=await r.text(); var j=null; try{j=JSON.parse(t);}catch(_){}
        throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status)); }
    }
    cierra(); await carga();
  }catch(e){ await avisa('No se pudo guardar: '+e.message);
    b.disabled=false; b.textContent=EDIT.id?'Guardar':'Crear'; }
}

  }
  if(porCotizar.length)
    h+='<div class="nota amb" style="margin-top:10px"><b>No está sumado</b> y hay que confirmarlo a mano: '+
       porCotizar.map(function(x){return esc(x.nombre);}).join(', ')+'.</div>';
  h+='</div>';

  /* El dinero de esta cotización. */
  h+='<div class="bloque"><h3>El dinero</h3>'+
    fila('Anticipo', money(ant)+' <span style="color:var(--tenue)">('+
      (Number(c.anticipo_pct||regla('anticipo_pct',30)))+'%)</span>')+
    fila('Pagado', '<b>'+money(pag)+'</b>')+
    fila('Falta', falta>0?'<b style="color:var(--mal)">'+money(falta)+'</b>':'<span class="etq pub">Nada</span>');
  if(p.length){
    h+='<div class="gr">Los pagos</div>';
    p.forEach(function(x){
      h+='<div class="lin"><div class="n">'+esc(x.concepto==='anticipo'?'Anticipo':'Saldo')+
        '<span>'+esc(String(x.pagado_at||'').slice(0,10))+
        (x.registrado_por?' · '+esc(x.registrado_por):'')+'</span></div>'+
        '<div class="i">'+money(x.importe)+'</div></div>';
    });
  }
  if(falta>0){
    h+='<div class="gr">Apuntar un pago</div>'+
      '<label class="cmpl"><span>Concepto</span><select class="cmp" id="pgConcepto">'+
        '<option value="anticipo"'+(pag<=0?' selected':'')+'>Anticipo</option>'+
        '<option value="saldo"'+(pag>0?' selected':'')+'>Saldo</option></select></label>'+
      '<label class="cmpl"><span>Importe en pesos</span><input class="cmp" id="pgImporte" type="number" '+
        'step="0.01" min="0" value="'+(pag<=0?ant.toFixed(2):falta.toFixed(2))+'"></label>'+
      '<label class="cmpl"><span>Referencia · opcional</span><input class="cmp" id="pgRef" '+
        'placeholder="Folio de la transferencia o del cargo"></label>'+
      '<div class="acciones"><button class="btn sm" id="bPago">Apuntar el pago</button></div>'+
      '<div class="nota" style="background:var(--hueso);margin-top:9px">Se apunta una vez: '+
        'lo pagado y la etapa se calculan de los pagos, no se teclean.</div>';
  }
  h+='</div>';

  /* Qué se puede hacer con ella. */
  h+='<div class="bloque"><h3>Qué hacemos</h3>';
  if(c.salida_id){
    h+='<div class="nota verde">Confirmada'+(c.confirmada_at?' el '+esc(String(c.confirmada_at).slice(0,10)):'')+
      '. Ya es una salida de ese día en la programación.</div>'+
      '<div class="acciones" style="margin-top:10px">'+
      '<a class="btn fan sm" href="/m/sinc-operacion.html?r='+esc(c.reserva_id||'')+'">Ver la reserva</a></div>';
  }else{
    var puede = c.experiencia_id && c.fecha1 && c.hora1;
    h+='<div class="nota '+(puede?'verde':'amb')+'">'+
      (puede
        ? 'Al confirmarla se programa la salida de ese día, se le abre su reserva y, si la experiencia '+
          'es de un ateneísta, nace la deuda de lo que se le debe pagar por transferencia.'
        : 'No se puede confirmar todavía: '+
          (!c.experiencia_id?'no eligió experiencia':'')+
          (!c.experiencia_id&&(!c.fecha1||!c.hora1)?' y ':'')+
          ((!c.fecha1||!c.hora1)?'falta la fecha o la hora, y la hora no se inventa':'')+'.')+
      '</div>'+
      '<div class="acciones" style="margin-top:10px">'+
      '<button class="btn sm" id="bConfirmar"'+(puede?'':' disabled')+'>Confirmar y programar</button></div>';
  }
  h+='<div class="gr">El correo al cliente</div>'+
    (c.correo_at
      ? '<div style="font-size:12.5px;color:var(--gris)">Salió el '+esc(String(c.correo_at).slice(0,10))+'.</div>'
      : (c.correo_error
          ? '<div class="nota roja">No salió: '+esc(c.correo_error)+'</div>'
          : '<div style="font-size:12.5px;color:var(--gris)">Nunca salió. Si es de antes del '+
            '21 de noviembre, es que el correo todavía no existía.</div>'));

  h+='<div class="gr">Archivar</div>'+
    (c.archivada_at
      ? '<div class="nota" style="background:var(--hueso)">Archivada el '+
        esc(String(c.archivada_at).slice(0,10))+
        (c.archivada_por?' por '+esc(c.archivada_por):'')+'.</div>'+
        '<div class="acciones" style="margin-top:9px">'+
        '<button class="btn fan sm" data-arch="0">Devolverla al tablero</button></div>'
      : '<div style="font-size:12.5px;color:var(--gris)">Se quita del tablero y sigue en la base: '+
        'lo que no fue también es información.</div>'+
        '<div class="acciones" style="margin-top:9px">'+
        '<button class="btn fan sm" data-arch="1">Archivarla</button></div>')+

    '<div class="gr">Mover de etapa</div>'+
    '<div class="acciones">'+
    (c.etapa!=='solicitud'&&c.etapa!=='pagado'
      ? '<button class="btn fan sm" data-etapa="solicitud">Devolver a solicitud</button>':'')+
    (c.etapa!=='pasado'
      ? '<button class="btn fan sm" data-etapa="pasado">Marcar que ya pasó</button>':'')+
    '</div>'+
    '<div style="font-size:11.5px;color:var(--tenue);margin-top:7px">La etapa «pagado» la pone el dinero, '+
      'no la mano.</div>';
  h+='</div>';
  return h;
}
function fila(k,v){ return '<div class="dato"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }

function cableaFicha(c){
  var bp=$('bPago');
  if(bp) bp.onclick=async function(){
    var imp=Number(($('pgImporte')||{}).value||0);
    if(!(imp>0)){ await avisa('¿De cuánto es el pago?'); return; }
    bp.disabled=true; bp.textContent='Apuntando…';
    try{
      var j=await rpc('corp_pago_registrar',{p_cot:c.id, p_concepto:($('pgConcepto')||{}).value||'anticipo',
        p_importe:imp, p_ref:($('pgRef')||{}).value||null});
      await avisa('Apuntado. Llevan '+money(j.pagado)+' de '+money(j.total)+
        (Number(j.falta)>0?(', faltan '+money(j.falta)+'.'):', está al día.'));
      cierra(); await carga();
    }catch(e){ await avisa('No se pudo apuntar: '+e.message);
      bp.disabled=false; bp.textContent='Apuntar el pago'; }
  };
  var bc=$('bConfirmar');
  if(bc) bc.onclick=async function(){
    if(window.cpPregunta && !await cpPregunta(
      'Esto programa la salida del '+dia(c.fecha1)+' a las '+hhmm(c.hora1)+
      ' para '+c.personas+' personas, le abre su reserva y, si la experiencia es de un ateneísta, '+
      'deja apuntado lo que se le debe. ¿La confirmo?','Sí, confírmala','Ahora no')) return;
    bc.disabled=true; bc.textContent='Confirmando…';
    try{
      var j=await rpc('corp_confirmar',{p_cot:c.id});
      await avisa('Confirmada. Ya está en la programación.'+
        (Number(j.al_ateneista)>0
          ? ' Al ateneísta se le deben '+money(j.al_ateneista)+
            (Number(j.desplazamiento)>0?(' (incluye '+money(j.desplazamiento)+' del desplazamiento)'):'')+
            ', por transferencia.'
          : ' Es una experiencia propia: no hay nada que pagarle a nadie.'));
      cierra(); await carga();
    }catch(e){ await avisa('No se pudo confirmar: '+e.message);
      bc.disabled=false; bc.textContent='Confirmar y programar'; }
  };
  Array.prototype.forEach.call(document.querySelectorAll('[data-arch]'),function(b){
    b.onclick=async function(){
      var si=b.getAttribute('data-arch')==='1';
      if(si && window.cpPregunta && !await cpPregunta(
        'Se quita del tablero. No se borra: sigue en la base y la puedes devolver cuando quieras.',
        'Sí, archívala','Ahora no')) return;
      b.disabled=true;
      try{ await rpc('corp_archivar',{p_cot:c.id, p_si:si}); cierra(); await carga(); }
      catch(x){ await avisa('No se pudo: '+x.message); b.disabled=false; }
    };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-etapa]'),function(b){
    b.onclick=async function(){
      var e=b.getAttribute('data-etapa');
      b.disabled=true;
      try{ await rpc('corp_etapa',{p_cot:c.id, p_etapa:e}); cierra(); await carga(); }
      catch(x){ await avisa('No se pudo mover: '+x.message); b.disabled=false; }
    };
  });
}

/* ===================== PINTAR Y CABLEAR ===================== */
function pinta(){
  Array.prototype.forEach.call($('pest').querySelectorAll('button'),function(b){
    b.setAttribute('aria-selected', b.getAttribute('data-t')===TAB ? 'true':'false'); });

  var sinCorreo=COTS.filter(function(c){ return !c.correo_at && c.etapa==='solicitud' && !c.archivada_at; }).length;
  var L=COTS.filter(function(c){ return !c.archivada_at; });
  $('sub').textContent = L.length+(L.length===1?' cotización · ':' cotizaciones · ')+
    L.filter(function(c){return c.etapa==='solicitud';}).length+' sin confirmar · '+
    L.filter(function(c){return c.salida_id;}).length+' programadas';

  $('caja').innerHTML =
    TAB==='embudo'
      ? 'Las etapas <b>no se arrastran</b>: salen de los hechos. Una cotización pasa a esperar '+
        'anticipo cuando se confirma o cuando entra dinero, y a «pagado» cuando el dinero cubre el total. '+
        'Toca una tarjeta para abrir su ficha.'+
        (sinCorreo?' <b>'+sinCorreo+'</b> sin correo enviado — las de antes del 21 de noviembre son de cuando el correo no existía.':'')
    : TAB==='dinero'
      ? 'Dos preguntas distintas: lo que nos deben los clientes, que está aquí, y lo que debemos a los '+
        'ateneístas por estas ventas, que vive en «Por pagar» porque se paga por transferencia.'
      : 'Esto es lo que la página está cotizando ahora mismo: lo que cambies aquí lo ve el siguiente '+
        'visitante del cotizador. Los precios de transporte son <b>sin IVA</b>.';

  $('vista').innerHTML =
    TAB==='embudo' ? pintaEmbudo() :
    TAB==='dinero' ? pintaDinero() : pintaCatalogo();
  cablea();
}
function cablea(){
  var ba=$('bArch'); if(ba) ba.onclick=function(){ VERARCH=!VERARCH; pinta(); };
  Array.prototype.forEach.call($('vista').querySelectorAll('[data-cot]'),function(b){
    b.onclick=function(){ abre(b.getAttribute('data-cot')); };});

  Array.prototype.forEach.call($('vista').querySelectorAll('[data-greg]'),function(b){
    b.onclick=async function(){
      var k=b.getAttribute('data-greg');
      var i=$('vista').querySelector('[data-regla="'+k+'"]');
      if(!i) return;
      var v=String(i.value||'').trim();
      if(v===''){ await avisa('Esa regla no puede quedarse vacía.'); return; }
      b.disabled=true; b.textContent='…';
      try{
        await patch('corp_reglas','clave=eq.'+encodeURIComponent(k),{valor:v});
        REGLAS[k]=v; b.textContent='Guardado';
        setTimeout(function(){ b.textContent='Guardar'; b.disabled=false; },1400);
      }catch(e){ await avisa('No se pudo guardar: '+e.message);
        b.disabled=false; b.textContent='Guardar'; }
    };});

  Array.prototype.forEach.call($('vista').querySelectorAll('[data-nuevo]'),function(b){
    b.onclick=function(){ abreExclusivo(b.getAttribute('data-nuevo'), null); };});
  Array.prototype.forEach.call($('vista').querySelectorAll('[data-ver]'),function(b){
    b.onclick=function(){ abreLugar(b.getAttribute('data-ver')); };});
  Array.prototype.forEach.call($('vista').querySelectorAll('[data-ficha]'),function(b){
    b.onclick=function(){ var p=b.getAttribute('data-ficha').split(':');
      abreExclusivo(p[0], p.slice(1).join(':')); };});

  /* LOS INTERRUPTORES DE LO CONECTADO. Se guardan al tocarlos: un checkbox
     con botón de guardar al lado es un checkbox que la mitad de la gente deja
     sin guardar. */
  Array.prototype.forEach.call($('vista').querySelectorAll('[data-sw]'),function(c){
    c.onchange=async function(){
      var p=c.getAttribute('data-sw').split(':');
      var tabla = p[0]==='esp' ? 'ev_espacios' : 'op_experiencias';
      var cuerpo={}; cuerpo[p[2]]=!!c.checked;
      c.disabled=true;
      try{ await patch(tabla,'id=eq.'+encodeURIComponent(p[1]),cuerpo);
        (p[0]==='esp'?ESPACIOS:EXPS).forEach(function(x){
          if(String(x.id)===String(p[1])) x[p[2]]=!!c.checked; });
        /* No se repinta la pantalla entera: tocar una casilla de la fila 30 y
           que la lista salte al principio hace perder el sitio. Sólo cambia
           el Sí/No de al lado. */
        var et=c.parentNode.querySelector('span');
        if(et) et.textContent = c.checked?'Sí':'No';
        c.disabled=false;
        tosta('Guardado');
      }catch(e){ c.checked=!c.checked; c.disabled=false;
        tosta('No se pudo guardar',true); }
    };});

  /* El tipo y el protagonista se guardan al salir del campo. */
  Array.prototype.forEach.call($('vista').querySelectorAll('[data-ex]'),function(el){
    var antes=el.value;
    el.onchange=async function(){
      var id=el.getAttribute('data-ex'), campo=el.getAttribute('data-c');
      var v=String(el.value||'').trim(); var cuerpo={}; cuerpo[campo]= v===''?null:v;
      try{ await patch('op_experiencias','id=eq.'+encodeURIComponent(id),cuerpo);
        EXPS.forEach(function(x){ if(String(x.id)===String(id)) x[campo]=cuerpo[campo]; });
        antes=el.value; el.style.borderColor='var(--ok)';
        setTimeout(function(){ el.style.borderColor=''; },1200);
        tosta('Guardado');
      }catch(e){ el.value=antes; tosta('No se pudo guardar',true); }
    };});

  if($('bRefresca')) $('bRefresca').onclick=async function(){
    $('bRefresca').disabled=true; $('bRefresca').textContent='Trayendo…';
    await carga(); tosta('Lista al día');
  };
}

async function carga(){
  LIN={}; PAG={};
  try{
    var res=await Promise.all([
      get('corp_cotizaciones?select=*&order=created_at.desc&limit=500'),
      get('corp_reglas?select=clave,valor'),
      get('corp_transportes?select=*&order=orden'),
      get('op_extras_catalogo?select=*&order=orden'),
      get('ev_espacios?select=id,nombre,sede,direccion,capacidad,capacidad_sentado,metros2,'+
          'descripcion,ideal_para,reglas,horario_servicio,observaciones,plano_url,alias,'+
          'tarifa_hora,tarifa_dia,tarifa_hora_extra,fianza_monto,'+
          'fotos,hotel_id,corporativo,corp_carta,activo'+
          '&activo=eq.true&order=nombre'),
      /* Lo conectable: lo que ya se ofrece y lo que podría ofrecerse. Un
         borrador no se enseña aquí porque encenderlo no serviría de nada
         -el cotizador sólo vende lo publicado-, salvo que ya esté encendido,
         y entonces hay que poder verlo y apagarlo. */
      get('op_experiencias?select=id,nombre,corp_tipo,corp_activo,corp_protagonista,espacio_id,estado,privado,operador_id'+
          '&or=(corp_activo.eq.true,estado.eq.publicada)&order=nombre&limit=200'),
      get('tour_operadores?select=id,nombre_comercial&limit=400')
    ]);
    COTS=res[0]||[];
    REGLAS={}; (res[1]||[]).forEach(function(r){ REGLAS[r.clave]=r.valor; });
    TRANSP=res[2]||[]; EXTRAS=res[3]||[]; ESPACIOS=res[4]||[];
    var ops={}; (res[6]||[]).forEach(function(o){ ops[o.id]=o.nombre_comercial; });
    EXPS=(res[5]||[]).map(function(x){ x.operador=ops[x.operador_id]||null; return x; });
    pinta();
  }catch(e){
    $('sub').textContent='No se pudo cargar: '+e.message;
    $('vista').innerHTML='<div class="hoja"><div class="nota roja">'+esc(e.message)+
      '. Esto lo ve el equipo de la casa; si entraste con otra cuenta, no vas a ver nada.</div></div>';
  }
}

Array.prototype.forEach.call($('pest').querySelectorAll('button'),function(b){
  b.onclick=function(){ TAB=b.getAttribute('data-t'); pinta();
    try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){ } };});
$('bRecarga').onclick=function(){ carga(); };
$('pCerrar').onclick=cierra;
$('velo').onclick=cierra;
$('lugCerrar').onclick=cierraLugar;
$('lugarVelo').onclick=function(ev){ if(ev.target===$('lugarVelo')) cierraLugar(); };
document.addEventListener('keydown',function(ev){ if(ev.key==='Escape') cierraLugar(); });
document.addEventListener('keydown',function(e){ if(e.key==='Escape'&&abierta) cierra(); });
carga();
})();
</script>
