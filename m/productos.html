<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, TODOS=null, FALLO='', OPS={}, MEDIA={}, YO='';
var F={q:'',formato:'',estados:[],tipo:'',ateneista:''};

/* Lo que le falta al ALIADO -no a la ficha- para poder publicar. Las palabras

function frenaAlAliado(p){
  if(p._ev || !p.operador_id) return null;
  var c=CANDADO[p.operador_id];

}

/* LA CASA LA MANDA EL SELECTOR DE ARRIBA. El panel pasa ?proyecto= al abrir el
   módulo y lo guarda en localStorage, pero cambiarlo NO recarga el iframe: hay
   que leerlo y vigilarlo. Mismo patrón que la home del panel.
   Sólo cdmx y puebla filtran de verdad; virreyes enseña sus eventos, y

function proyActual(){ var p='';
  try{ p=(new URLSearchParams(location.search).get('proyecto')||'').toLowerCase(); }catch(_){}
  if(!p){ try{ p=(localStorage.getItem('cpp_proyecto')||'').toLowerCase(); }catch(_){} }
  return p;
}

var CIUDAD={cdmx:'CDMX',puebla:'Puebla'};
/* Qué vista eligió la última vez: se queda en el aparato, no en la base. */
var VISTA=(function(){ try{ return localStorage.getItem('cpp_prod_vista')||'lista'; }catch(_){ return 'lista'; } })();

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}

/* LA SESIÓN CADUCA Y HAY QUE RENOVARLA. Javi, 26-oct-2026: «JWT expired».
   El token dura una hora; esta pantalla lo leía una vez al abrirla y lo usaba
   para siempre. Pasada esa hora, todo fallaba con un 401 -incluidos los
   candados, que al no cargar dejaban el botón de publicar verde cuando no
   debía-. La ficha larga ya sabía renovarlo; aquí no. Mismo mecanismo. */
var refrescando=null, ultimoFalloRef=0, ESPERA_REF=60000, caduco=false;
function guardaSes(s){
  ses=s;
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k&&/sb-.*-auth-token/.test(k)){
        var v=null; try{ v=JSON.parse(localStorage.getItem(k)||'null'); }catch(_e){}
        if(v&&v.currentSession){ v.currentSession=s; localStorage.setItem(k,JSON.stringify(v)); }
        else localStorage.setItem(k,JSON.stringify(s));
        return;
      }
    }
  }catch(_){}
}
function refresca(){
  if(refrescando) return refrescando;
  if(Date.now()-ultimoFalloRef<ESPERA_REF) return Promise.resolve(false);
  var rt=ses&&ses.refresh_token;
  if(!rt) return Promise.resolve(false);
  refrescando=fetch(SB+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},
      body:JSON.stringify({refresh_token:rt})})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(s){ if(!s||!s.access_token) return false; guardaSes(s); return true; })
    .catch(function(){ return false; })
    .then(function(ok){ refrescando=null; if(!ok) ultimoFalloRef=Date.now(); return ok; });
  return refrescando;
}
/* Todas las llamadas pasan por aquí: si vuelve un 401, se renueva y se repite
   una vez. Si tampoco entonces, se dice en castellano y se recarga, en vez de
   enseñar «JWT expired». */
async function api(url,o){
  o=o||{};
  function tira(){
    return fetch(url, Object.assign({}, o, {headers:Object.assign(hdr(), o.headers||{})}));
  }
  var r=await tira();
  if(r.status===401){ if(await refresca()) r=await tira(); }
  if(r.status===401 && !caduco){
    caduco=true;
    avisa('Tu sesión caducó. Vuelvo a abrir la pantalla…');
    setTimeout(function(){ location.reload(); },2200);
  }
  return r;
}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}

  try{ return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }
  catch(_){ return String(s).slice(0,10); } }

var ESTADOS={publicada:['ok','Publicada'],en_revision:['al','En revisión'],
             borrador:['ne','Borrador'],en_cartera:['na','En cartera'],
             pausada:['ne','En pausa'],

/* DE QUÉ CASA ES CADA COSA.
   Esto decía: «las fichas sin ciudad puesta se ven en las dos, porque esconder
   trabajo hecho por un campo vacío es peor que enseñarlo donde quizá no toca».
   La intención era buena y el resultado no: con 71 fichas sin ciudad, Puebla
   —que tiene 7 tours— enseñaba 78, y entre ellos tours de Coyoacán y de
   Teotihuacán. Javi, 29-oct-2026: «sepárame tours de CDMX y de Puebla cuando
   los busco en productos».
   Ahora cada casa ve lo suyo. Las que no tienen ciudad no desaparecen: tienen
   su propio chip, «Sin ciudad», que es donde se van a arreglar. */
function esDeLaCasa(p){
  /* El chip manda y aísla: enseña SÓLO las que no tienen ciudad, no las de
     esta casa más esas. Es una lista de tareas, no una casa más. */
  if(SIN_CIUDAD) return !p._ev && !String(p.ciudad||'').trim();
  if(PROY!=='cdmx' && PROY!=='puebla' && PROY!=='virreyes') return true;
  if(p._ev) return PROY==='cdmx' || PROY==='virreyes';
  if(PROY==='virreyes') return false;
  var c=String(p.ciudad||'').trim();
  if(!c) return false;               // sin ciudad no es de ninguna casa
  return c===CIUDAD[PROY];
}
/* Lo enciende el chip de arriba. Vive fuera de la función porque `pasa()` y
   `esDeLaCasa()` se llaman en dos sitios distintos y tienen que coincidir. */
var SIN_CIUDAD=false;

/* En cartera dejó de ser una propiedad del aliado para ser un estado de la
   ficha: mientras el touroperador no firma el convenio, su experiencia no entra
   en el circuito -ni borrador, ni revisión, ni venta-. Lo decide la base.
   Javi, 26-oct-2026. */
function enCartera(p){ return p.estado==='en_cartera'; }
/* Y POR ESO YA NO SE PINTA APARTE. Javi, 26-oct: «me sigues poniendo los en
   cartera también en revisión». Cuando «en cartera» era una propiedad del
   aliado, la ficha podía estar en revisión Y en cartera a la vez, y había que
   enseñar las dos. Desde que es un estado son excluyentes: la pastilla de
   estado ya lo dice. La segunda pastilla se quedó de la etapa anterior y
   repetía «En cartera» al lado de sí misma. */

function pasa(p){
  if(!esDeLaCasa(p)) return false;
  if(F.formato && String(p.formato||'tour')!==F.formato) return false;
  if(F.estados.length && F.estados.indexOf(String(p.estado||''))<0) return false;
  if(F.tipo && String(p.tipo||'')!==F.tipo) return false;
  /* El ateneista se compara por id cuando el nombre escrito coincide con uno
     de la lista; si no, por texto, para que escribir «barrio» a medias siga
     acotando en vez de no devolver nada. */
  if(F.ateneista){
    if(ATE_ID[F.ateneista]){ if(p.operador_id!==ATE_ID[F.ateneista]) return false; }
    else {
      var d=String(p._dueno||OPS[p.operador_id]||'').toLowerCase();
      if(d.indexOf(F.ateneista.toLowerCase())<0) return false;
    }
  }
  if(F.q){
    var t=(String(p.nombre||'')+' '+String(p.sku||'')+' '+
           String(p._dueno||OPS[p.operador_id]||'')).toLowerCase();
    if(t.indexOf(F.q.toLowerCase())<0) return false;
  }
  return true;
}

/* Lo que le falta a una ficha para poder venderse. Mismas palabras que usa
   el operador en su portal: si aqui dice "sin precio" alla dice lo mismo.

   DOS CAMPOS QUE YA NO SE LLENAN. Javi, 26-oct-2026: esta pantalla preguntaba
   por `precio_adulto` y por `fotos`, y ninguno de los dos es ya donde viven
   esos datos. El precio que escribe el operador es el neto -220 de los 264
   borradores lo tienen, y sólo 20 tienen precio_adulto-, y las fotos se
   mudaron a sinc_media -161 borradores tienen, y la columna `fotos` está
   vacía en los 264-. Resultado: la pantalla decía "sin precio, sin fotos" a
   fichas completas, y la cola de aprobación repetía la mentira. El Cable Bus
   de Kari salía como "sin precio" con sus 100 pesos y sus seis fotos puestas.

   A un tour por propina para huéspedes sí se le pide precio: es el que paga
   quien llega de la calle. La regla es la misma que la de la ficha. */
function leFalta(p){
  /* A lo que ya ocurrió no se le reclama nada: una ficha de un evento de hace
     dos semanas no se va a terminar, y el «sin punto de encuentro» en rojo
     sólo hace ruido en la lista. */
  if(p.estado==='pasada' || p.estado==='anulada') return [];
  if(p._ev) return leFaltaEvento(p);
  var f=[];
  var fmt=String(p.formato||'tour');
  if(!(Number(p.neto_adulto)>0) && fmt!=='evento' && (fmt==='tour' || !p.apepe_gratuito))
    f.push('sin precio');
  if(!p.duracion_min) f.push('sin duración');
  if(!MEDIA[p.id]) f.push('sin fotos');
  if(!p.cer_inicio_lugar && !p.punto_encuentro) f.push('sin punto de encuentro');
  if(p.tipo==='tercero' && !p.operador_id) f.push('sin dueño');
  return f;
}

/* A UN EVENTO NO SE LE PIDE LO MISMO. No tiene punto de encuentro -tiene sala-
   ni hace falta la duración para venderlo. Lo que no puede faltar es cuándo es,
   dónde es y cuánto cuesta. Y un evento con boletos tiene el precio en ellos,
   no en su campo: mirar sólo `eventos.precio` fue el mismo fallo que ya se
   arregló en el calendario. Una renta de espacio -clase 'espacio'- no tiene
   fecha: se alquila cuando alguien la pide. Javi, 26-oct-2026. */
function leFaltaEvento(p){
  var f=[];
  var esEspacio = p._clase==='espacio';
  if(!esEspacio && !p._fecha) f.push('sin fecha');
  if(!p._sala) f.push('sin sala');
  if(!p._gratis && !(Number(p.neto_adulto)>0)) f.push('sin precio');
  if(!p._fotos) f.push('sin fotos');
  return f;
}

/* Los dos mundos se enseñan juntos pero no se mezclan: un evento del Ateneo
   sigue viviendo en su tabla, con sus estados. Aquí sólo se traduce para que
   la lista hable un idioma. «Propuesto» es su manera de decir «en revisión»:
   es el estado con el que sale en la cola de aprobación. */
var EV_ESTADO={borrador:'borrador',propuesto:'en_revision',
               publicado:'publicada',realizado:'pasada',cancelado:'anulada'};

/* LO QUE YA PASÓ, PASADO. Javi, 27-oct-2026: «en productos, cuando ya pasaron
   déjalos en pasados y que no aparezcan en publicados ni en borrador o
   pendiente de revisión».
   Era ruido de verdad: El Bonche del 25 de octubre seguía saliendo «en
   cartera», y la lista de lo que hay que terminar o revisar se llenaba de
   fechas que ya ocurrieron. Nadie va a terminar la ficha de un evento de hace
   dos semanas.
   No se guarda nada: haber pasado es cuestión de la fecha, así que se calcula
   al leer. Guardarlo pediría un trabajo nocturno que lo fuera marcando, y a la
   mañana siguiente estaría otra vez desfasado.
   Lo anulado se queda anulado —esa decisión la tomó una persona— y una sala
   (clase espacio) no pasa nunca: se alquila cuando alguien la pide. Una
   experiencia que se repite cada semana tampoco: sólo la que tiene fechas
   contadas o un último día. */
function yaPaso(p){
  if(p.estado==='anulada') return false;
  if(p._clase==='espacio') return false;
  var hoy=new Date(); hoy.setHours(0,0,0,0);
  var fin=null;
  if(p._ev) fin=p._fin||null;
  else if(p.termina_en) fin=p.termina_en;
  else if(p.calendario_modo==='fechas' && p.fechas && p.fechas.length)
    fin=p.fechas.slice().sort().pop();
  if(!fin) return false;
  var d=new Date(fin);
  if(isNaN(d.getTime())) return false;
  return d < hoy;
}

/* Se aplica a todo lo que entra en la lista, venga de la tabla que venga. */
function marcaPasados(l){
  l.forEach(function(p){
    if(yaPaso(p)){ p._estadoAntes=p.estado; p.estado='pasada'; }
  });
  return l;
}

function normalizaEvento(e, prodNombre, precioBoleto, opId){
  /* Una sala no se vende por entrada sino por hora: su precio vive en otro
     campo, y mirar sólo los dos de siempre la dejaba como «sin precio» con sus
     doscientos pesos la hora puestos. */
  var porHora = !(Number(e.precio||0)>0) && !(precioBoleto>0) && Number(e.precio_por_hora||0)>0;
  var precio = Number(e.precio||0)>0 ? Number(e.precio)
             : (precioBoleto>0 ? precioBoleto
             : (porHora ? Number(e.precio_por_hora) : null));
  return {
    id:e.id, _ev:true, _clase:e.clase||'evento', _porHora:porHora,
    nombre:e.nombre, formato:'evento',
    estado: EV_ESTADO[e.estado] || 'borrador',
    _estadoReal: e.estado,
    tipo: e.productora_id ? 'tercero' : 'propio',
    /* EL EVENTO ES DE SU ATENEISTA, NO DE NADIE. Javi, 30-oct-2026: «Café
       Cumbre ya está activo pero si selecciono el ateneísta solo me da 4».
       Eran las 4 copias muertas que viven en op_experiencias; sus 7 eventos de
       verdad salian con operador_id en nulo, asi que el filtro por ateneista
       -que compara ids- los tiraba a todos. El sombrero de productora y el de
       ateneista son de la misma persona: se enlaza por tour_operador_id. */
    operador_id: opId || null, _dueno: prodNombre || 'Casa Pepe',
    neto_adulto: precio, precio_adulto: null,
    _gratis: !!e.es_gratis,
    duracion_min: e.duracion_min || null,
    _fecha: e.fecha_inicio || null,
    _fin: e.fecha_fin || e.fecha_inicio || null,
    _sala: e.espacio || null,
    _foto: (e.fotos && e.fotos.length && (e.fotos[0].url || e.fotos[0])) || '',
    _fotos: !!(e.fotos && e.fotos.length),
    ciudad:'CDMX', sku:null, updated_at: e.updated_at || e.created_at
  };
}

function pinta(){
  var caja=$('lista');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos traer los productos</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—';
    return;
  }
  if(TODOS===null){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  /* La cuenta de arriba cuenta lo de esta casa, no lo del Grupo entero: si el
     selector dice Puebla, decir «331 productos» sería contarle a Puebla los de
     CDMX. */
  var dela=TODOS.filter(esDeLaCasa);
  var pub=0, med=0, car=0;
  dela.forEach(function(p){
    if(p.estado==='publicada')pub++;
    else if(enCartera(p))car++;
    else if(p.estado!=='anulada'&&p.estado!=='pasada')med++; });
  var casa=(PROY==='cdmx'?' en CDMX':PROY==='puebla'?' en Puebla':PROY==='virreyes'?' en Virreyes':'');
  /* Lo que está en cartera se cuenta aparte: no es trabajo a medias nuestro,
     es trabajo que espera a que el aliado firme. */
  var huerfanas=TODOS.filter(function(p){
    return !p._ev && !String(p.ciudad||'').trim();
  }).length;
  $('cuenta').innerHTML = SIN_CIUDAD
    ? '<b>'+dela.length+'</b> fichas <b>sin ciudad puesta</b>. No salen en CDMX ni en Puebla hasta que se les ponga.'
    : '<b>'+dela.length+'</b> productos'+casa+' · <b>'+pub+'</b> publicados · <b>'+med+'</b> a medias'+
      (car?' · <b>'+car+'</b> en cartera':'')+
      (huerfanas?' · <b>'+huerfanas+'</b> sin ciudad':'');

  var v=TODOS.filter(pasa);
  $('cuantos').textContent = v.length===dela.length ? '' : v.length+' con este filtro';
  $('vLista').classList.toggle('on', VISTA==='lista');
  $('vFotos').classList.toggle('on', VISTA==='fotos');
  if(!v.length){
    caja.className='';
    caja.innerHTML='<div class="vacio"><b>Nada con ese filtro</b>'+
      (dela.length?'Hay '+dela.length+' productos aquí, ninguno cumple lo que pediste.':'Todavía no hay productos dados de alta.')+'</div>';
    return;
  }
  if(VISTA==='fotos'){ pintaRejilla(v, caja); engancha(caja); return; }
  caja.className='';
  caja.innerHTML=v.map(function(p){
    var fo=FORMATOS[p.formato||'tour']||['🧾',p.formato||'—'];
    if(p._clase==='espacio') fo=['🏛','Espacio'];
    var es=ESTADOS[p.estado]||['ne',p.estado||'—'];
    var falta=leFalta(p), frena=frenaAlAliado(p);
    return '<div class="fila" data-p="'+esc(p.id)+'">'+
      '<div class="ico">'+(fotoDe(p)?'<img src="'+esc(fotoDe(p))+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\''+fo[0]+'\'">':fo[0])+'</div>'+
      '<div class="mid">'+
        '<div class="nom"><b>'+esc(p.nombre||'(sin nombre)')+'</b></div>'+
        '<div class="pills">'+
          '<span class="pill '+es[0]+'">'+es[1]+'</span>'+
          '<span class="pill ne">'+fo[1]+'</span>'+
          (p.tipo==='propio'?'<span class="pill na">Propia</span>':'')+
          falta.map(function(x){return '<span class="pill al">'+esc(x)+'</span>';}).join('')+
          /* Lo que frena al aliado va con otra cara: no es la ficha la que está
             a medias, es su alta. */
          (frena?frena.map(function(x){return '<span class="pill er">🔒 '+esc(x)+'</span>';}).join(''):'')+
        '</div>'+
        '<div class="donde">'+esc(p._dueno||OPS[p.operador_id]||(p.tipo==='propio'?'Casa Pepe':'sin dueño'))+
          (p._sala?' · '+esc(p._sala):'')+(p._fecha?' · '+esc(fecha(p._fecha)):'')+
          (p.ciudad&&!p._ev?' · '+esc(p.ciudad):'')+(p.sku?' · '+esc(p.sku):'')+'</div>'+
      '</div>'+
      /* Si no hay PVP calculado se enseña el neto, que es lo que el operador
         escribió: un «—» donde hay cien pesos puestos es lo que nos tenía
         mirando fichas vacías que no lo estaban. */
      '<div class="cifra"'+(!p._ev&&p.precio_adulto==null&&Number(p.neto_adulto)>0?' title="Neto del operador · sin PVP calculado"':'')+
        '><b>'+((p._ev&&p._gratis&&!(Number(p.neto_adulto)>0))?'Gratis'
                : dinero(p.precio_adulto!=null?p.precio_adulto:p.neto_adulto))+'</b><span>'+
        (p._porHora?'por hora':p.duracion_min?p.duracion_min+' min':(p._ev?(p._clase==='espacio'?'espacio':'evento'):'—'))+'</span></div>'+
      /* Un evento del Ateneo no se edita en la ficha de Sincrético: vive en su
         propia tabla y se toca en su pantalla, con su calendario y sus salas. */
      '<div class="acc"><a class="btn sm" target="_top" href="'+
        (p._ev ? '/m/eventos.html?ev='+encodeURIComponent(p.id)+'#evt'
               : '/ficha.html?id='+encodeURIComponent(p.id)+'&de=productos')+
        '">Editar ↗</a>'+
        /* EL PASO QUE FALTABA: DE BORRADOR A LA COLA. Mientras es borrador la
           ficha se está armando y no la ve nadie más; mandarla a revisión es
           decir «ya está». Hasta hoy sólo se podía desde dentro de la ficha, y
           desde aquí -que es donde se ven los 264 borradores de golpe- no había
           manera. Javi, 26-oct-2026.
           Si le falta algo para venderse, el botón se queda en gris: la cola de
           aprobación es el rato de alguien, y una ficha sin precio ni fotos le
           hace perder ese rato. Lo que le falta ya está escrito en las pastillas
           de al lado, con las mismas palabras. */
        /* EL BOTÓN DE MANDAR A REVISIÓN SE FUE. Desde el 26-oct el estado no lo
           pone nadie: en cuanto no le falta nada, la ficha sube sola a revisión,
           y si le vuelve a faltar algo baja sola a borrador. Dejar el botón era
           ofrecer un paso que la base ya había dado. */
        /* PUBLICAR ES PONERLO A LA VENTA, así que pide lo mismo que pedía la
           ficha: si le falta algo, el botón no está. Desde «en revisión» es
           aprobarlo sin dar el rodeo por la cola; desde borrador o desde pausa
           es sacarlo directo, que es lo que hace quien lo armó él mismo. */
        (['borrador','en_revision','pausada'].indexOf(p.estado)>=0
          ? (falta.length
              ? gris('Publicar','Le falta '+falta.join(', ')+'. Eso no se pone a la venta.')
              : frena
                ? gris('Publicar','A '+(p._dueno||OPS[p.operador_id]||'su aliado')+' le falta '+frena.join(', ')+'. La ficha está lista; el alta no.')
                : '<button class="btn sm verde" data-publicar="'+esc(p.id)+'">Publicar</button>')
          : '')+
        /* DESPUBLICAR NO BORRA NADA: lo quita del escaparate y lo deja donde
           pueda volver. Una experiencia queda en pausa; un evento vuelve a
           borrador, que es lo más cerca que tiene de una pausa. */
        (p.estado==='publicada'
          ? '<button class="btn sm" data-despublicar="'+esc(p.id)+'">Despublicar</button>'
          : '')+
        (p.estado==='publicada'
          ? gris('Borrar','Quítala de la venta primero')
          : '<button class="btn sm rojo" data-borrar="'+esc(p.id)+'">Borrar</button>')+
      '</div>'+
    '</div>';
  }).join('');
  engancha(caja);
}

/* ---------- EL CAJÓN LATERAL ----------
   Javi, 27-oct-2026: «pasa a productos la función de cuando le picas que se
   abra el menú lateral». Viene del funnel. Tocar la fila enseña la ficha de un
   vistazo sin salir de la lista: lo que costó poner el filtro no se pierde por
   ir a mirar una cosa. */
function cierraCajon(){
  $('cajon').classList.remove('on'); $('velo').classList.remove('on');
  $('cajon').setAttribute('aria-hidden','true');
}
$('cCerrar').onclick=cierraCajon;
$('velo').onclick=cierraCajon;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') cierraCajon(); });

function abreCajon(id){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p)return;
  var fo=FORMATOS[p.formato||'tour']||['🧾',p.formato||'—'];
  if(p._clase==='espacio') fo=['🏛','Espacio'];
  var es=ESTADOS[p.estado]||['ne',p.estado||'—'];
  var falta=leFalta(p), frena=frenaAlAliado(p), fh=fotoDe(p,'h');
  var dueno=p._dueno||OPS[p.operador_id]||(p.tipo==='propio'?'Casa Pepe':'sin dueño');

  $('cNom').textContent=p.nombre||'(sin nombre)';
  $('cDon').innerHTML=esc(dueno)+' · <span class="pill '+es[0]+'">'+es[1]+'</span> <span class="pill ne">'+fo[1]+'</span>';

  function dato(k,v){ return v==null||v===''?'' :
    '<div class="dato"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

  var h='';
  if(fh) h+='<img class="portada" src="'+esc(fh)+'" alt="" onerror="this.remove()">';

  /* Lo primero, lo que lo detiene. Es la razón por la que alguien abre esto. */
  if(falta.length||frena){
    h+='<div class="bloque"><h3>Lo que lo frena</h3>'+
       (falta.length?'<div class="pills" style="margin-bottom:'+(frena?'8px':'0')+'">'+
          falta.map(function(x){return '<span class="pill al">'+esc(x)+'</span>';}).join('')+'</div>':'')+
       (frena?'<div class="pills">'+frena.map(function(x){return '<span class="pill er">🔒 '+esc(x)+'</span>';}).join('')+'</div>'+
              '<div class="mini" style="margin-top:7px;color:var(--gris)">La ficha está lista; el alta de '+esc(dueno)+' no.</div>':'')+
       '</div>';
  }else if(['borrador','en_revision','pausada'].indexOf(p.estado)>=0){
    h+='<div class="bloque"><h3>Lo que lo frena</h3><div class="dato"><span class="v">Nada: está lista para ponerse a la venta.</span></div></div>';
  }

  h+='<div class="bloque"><h3>La ficha</h3>'+
     dato('Precio', (p._ev&&p._gratis&&!(Number(p.neto_adulto)>0))?'Gratis'
            : esc(dinero(p.precio_adulto!=null?p.precio_adulto:p.neto_adulto))+
              (!p._ev&&p.precio_adulto==null&&Number(p.neto_adulto)>0?' <span class="mini" style="color:var(--gris)">· neto del operador</span>':''))+
     dato(p._porHora?'Cobro':'Dura', p._porHora?'por hora':(p.duracion_min?p.duracion_min+' min':null))+
     dato('Quién la lleva', esc(dueno))+
     dato('Dónde', [p._sala,p.ciudad].filter(Boolean).map(esc).join(' · ')||null)+
     dato('Cuándo', p._fecha?esc(fecha(p._fecha)):null)+
     dato('Clave', p.sku?esc(p.sku):null)+
     dato('Última vez tocada', p.updated_at?esc(fecha(p.updated_at)):null)+
     '</div>';

  /* Las mismas acciones de la fila, con las mismas reglas: lo que no se puede
     hacer no aparece disfrazado de botón. */
  var acc='<a class="btn sm" target="_top" href="'+
      (p._ev ? '/m/eventos.html?ev='+encodeURIComponent(p.id)+'#evt'
             : '/ficha.html?id='+encodeURIComponent(p.id)+'&de=productos')+'">Editar ↗</a>';
  if(!p._ev && p.operador_id)
    acc+='<a class="btn sm" target="_top" href="/m/comunidad.html?id='+encodeURIComponent(p.operador_id)+'">Ver a '+esc(dueno)+' ↗</a>';
  if(['borrador','en_revision','pausada'].indexOf(p.estado)>=0){
    acc += falta.length
      ? gris('Publicar','Le falta '+falta.join(', ')+'. Eso no se pone a la venta.')
      : frena
        ? gris('Publicar','A '+dueno+' le falta '+frena.join(', ')+'. La ficha está lista; el alta no.')
        : '<button class="btn sm verde" data-publicar="'+esc(p.id)+'">Publicar</button>';
  }
  if(p.estado==='publicada') acc+='<button class="btn sm" data-despublicar="'+esc(p.id)+'">Despublicar</button>';
  acc += (p.estado==='publicada')
    ? gris('Borrar','Quítala de la venta primero')
    : '<button class="btn sm rojo" data-borrar="'+esc(p.id)+'">Borrar</button>';
  h+=bloqueFotos(p);
  h+='<div class="bloque"><h3>Qué hacer con esto</h3><div class="acc">'+acc+'</div></div>';

  $('cCuerpo').innerHTML=h;
  engancha($('cCuerpo'));
  enganchaFotos(p);
  $('cajon').classList.add('on'); $('velo').classList.add('on');
  $('cajon').setAttribute('aria-hidden','false');
  $('cajon').scrollTop=0;
}

/* ---------- LAS DOS FOTOS, CADA UNA CON SU RECORTE ----------
   Javi, 27-oct-2026: «¿puedes que no tome la horizontal de cualquier lugar
   sino del recorte horizontal, y que en la barra lateral nos permitas editar y
   subir fotos para la horizontal y para la vertical?».
   Una foto vive recortada dos veces: 900×1200 para las tarjetas y 1600×900
   para lo ancho. Son dos encuadres distintos de la misma imagen, no la misma
   imagen estirada, y por eso se editan por separado: lo que se salva en una
   vertical —la cara, el cartel— no es lo que se salva en una horizontal.
   Un evento no entra aquí: sus fotos viven en su propia tabla y se tocan en su
   pantalla, con su galería. */
function bloqueFotos(p){
  if(p._ev){
    return '<div class="bloque"><h3>Fotos</h3>'+
      '<div class="dato"><span class="v">Las fotos de un evento se cambian en su pantalla, '+
      'que es donde está su galería. <a target="_top" href="/m/eventos.html?ev='+
      encodeURIComponent(p.id)+'#evt">Abrirla ↗</a></span></div></div>';
  }
  var m=MEDIA[p.id];
  function hueco(forma){
    var url = m ? (forma==='h' ? m.url_h : m.url) : '';
    var alto = forma==='h' ? 'aspect-ratio:16/9' : 'aspect-ratio:3/4';
    var nom  = forma==='h' ? 'Horizontal · portada y cabeceras' : 'Vertical · tarjetas';
    return '<div style="flex:1;min-width:130px">'+
      '<div class="mini" style="color:var(--gris);margin-bottom:5px">'+nom+'</div>'+
      '<div style="'+alto+';background:var(--hueso);border-radius:9px;overflow:hidden;display:grid;place-items:center">'+
        (url ? '<img src="'+esc(url)+'" alt="" style="width:100%;height:100%;object-fit:cover" onerror="this.remove()">'
             : '<span class="mini" style="color:var(--tenue);padding:8px;text-align:center">'+
               (m?'Sin recorte horizontal':'Sin foto')+'</span>')+
      '</div>'+
      '<div class="acc" style="margin-top:6px">'+
        (url?'<button class="btn sm" data-recorta="'+forma+'">Reencuadrar</button>':'')+
        '<button class="btn sm" data-cambia="'+forma+'">'+(url?'Cambiar':'Subir')+'</button>'+
      '</div></div>';
  }
  return '<div class="bloque"><h3>Fotos</h3>'+
    '<div style="display:flex;gap:11px;align-items:flex-start">'+hueco('v')+hueco('h')+'</div>'+
    '<div class="mini" id="fotoDice" style="margin-top:8px;color:var(--gris)">'+
      (m?'Cada una se encuadra aparte: lo que se salva en la vertical no es lo que se salva en la ancha.'
        :'Esta ficha no tiene fotos. Súbelas aquí o en su ficha completa.')+'</div>'+
    '<div class="mini" style="margin-top:4px;color:var(--tenue)">La galería entera se maneja en la ficha, en «Fotos y video».</div>'+
    '</div>';
}

/* Recorta y guarda una de las dos. `fuente` es un archivo del disco, o la liga
   de la que ya hay para reencuadrarla sin volver a subir nada. */
function guardaFoto(p, forma, fuente){
  var m=MEDIA[p.id];
  function di(t,mal){ var d=$('fotoDice'); if(d){ d.textContent=t; d.style.color=mal?'var(--error)':'var(--gris)'; } }
  if(!m && typeof fuente==='string'){ di('No hay foto que reencuadrar.',true); return; }
  di('Abriendo el recortador…');
  var ruta=(p.operador_id?('op-'+p.operador_id):'casa-pepe')+'/'+p.id;
  sincCrop.subir(fuente,{sb:SB,key:KEY,token:tok(),bucket:'sincretico',ruta:ruta,
      only:forma, titulo: forma==='h'?'Encuadra la horizontal':'Encuadra la vertical'},
    async function(err,r){
      if(err||!r){ di('No se guardó: '+((err&&err.message)||'cerraste el recortador'),true); return; }
      var url = forma==='h' ? r.hUrl : r.vUrl;
      var pat = forma==='h' ? r.hPath : r.vPath;
      if(!url){ di('El almacén no aceptó la foto.',true); return; }
      di('Guardando…');
      var cuerpo = forma==='h'
        ? {url_h:url, storage_path_h:pat}
        : {url:url, storage_path:pat, url_t:r.tUrl||null, storage_path_t:r.tPath||null,
           foco_x:0.5, foco_y:0.5};
      try{
        var destino='sinc_media?id=eq.'+encodeURIComponent(m?m.id:''), metodo='PATCH';
        if(!m){
          /* Primera foto de la ficha: se crea la fila. Una horizontal suelta no
             sirve de nada —la vertical es la que se enseña en todos lados—, así
             que la primera nace siempre como vertical. */
          metodo='POST'; destino='sinc_media';
          cuerpo=Object.assign({operador_id:p.operador_id||null, experiencia_id:p.id,
            tipo:'foto', etiqueta:'general', origen:'subida', estado:'listo', orden:0,
            ancho:r.srcW||null, alto:r.srcH||null}, cuerpo);
        }
        var rr=await api(SB+'/rest/v1/'+destino,{method:metodo,
          headers:Object.assign(hdr(),{Prefer:'return=representation'}),
          body:JSON.stringify(cuerpo)});
        if(!rr.ok) throw new Error('la base respondió '+rr.status+' · '+(await rr.text()).slice(0,160));
        /* La fila de vuelta: un PATCH que no toca ninguna fila también contesta
           que todo fue bien, y entonces se canta un guardado que no ocurrió. */
        var fila=await rr.json().catch(function(){return null;});
        if(!fila||!fila.length) throw new Error('la base no dejó tocar esta foto; suele ser la cuenta con la que entraste');
        MEDIA[p.id]=fila[0];
        avisa(forma==='h'?'Horizontal guardada':'Vertical guardada');
        abreCajon(p.id);     /* se repinta con lo que acaba de pasar */
        pinta();
      }catch(e){ di('No se guardó: '+((e&&e.message)||e), true); }
    });
}

function enganchaFotos(p){
  var cc=$('cCuerpo');
  Array.prototype.forEach.call(cc.querySelectorAll('[data-recorta]'),function(b){
    b.onclick=function(){
      var forma=b.getAttribute('data-recorta'), m=MEDIA[p.id];
      /* Se reencuadra desde el recorte que ya hay de esa forma; si no lo hay
         —una ficha vieja sin horizontal— se parte de la vertical. */
      var de = forma==='h' ? (m&&(m.url_h||m.url)) : (m&&m.url);
      if(de) guardaFoto(p, forma, de);
    };});
  Array.prototype.forEach.call(cc.querySelectorAll('[data-cambia]'),function(b){
    b.onclick=function(){
      var forma=b.getAttribute('data-cambia');
      var inp=document.createElement('input');
      inp.type='file'; inp.accept='image/*'; inp.style.display='none';
      document.body.appendChild(inp);
      inp.onchange=function(){
        var f=inp.files&&inp.files[0];
        document.body.removeChild(inp);
        if(f) guardaFoto(p, forma, f);
      };
      inp.click();
    };});
}

function engancha(caja){
  /* Tocar la fila abre el cajón; tocar un botón o una liga hace lo suyo y no
     abre nada. Sin esto, «Publicar» publicaría y abriría el cajón a la vez. */
  Array.prototype.forEach.call(caja.querySelectorAll('[data-p]'),function(fila){
    fila.style.cursor='pointer';
    fila.onclick=function(e){
      if(e.target.closest('a,button,select,input')) return;
      abreCajon(fila.getAttribute('data-p'));
    };
  });
  Array.prototype.forEach.call(caja.querySelectorAll('[data-borrar]'),function(b){
    b.onclick=function(){ pideMotivo(b.getAttribute('data-borrar'), b); };});
  Array.prototype.forEach.call(caja.querySelectorAll('[data-publicar]'),function(b){
    b.onclick=function(){ cambiaEstado(b.getAttribute('data-publicar'),'publicar',b); };});
  Array.prototype.forEach.call(caja.querySelectorAll('[data-despublicar]'),function(b){
    b.onclick=function(){ cambiaEstado(b.getAttribute('data-despublicar'),'despublicar',b); };});
}

/* La foto principal: la primera de su galería. En una experiencia vive en
   sinc_media; en un evento, en su propio campo. */
/* `forma` dice qué recorte se quiere: 'h' para un hueco ancho, 'v' o nada para
   uno alto. Si la horizontal no existe todavía -fotos de antes de que se
   guardaran las dos- se cae a la vertical, que es feo pero no es un hueco. */
function fotoDe(p, forma){
  if(p._ev) return p._foto||'';
  var m=MEDIA[p.id];
  if(!m) return '';
  return forma==='h' ? (m.url_h||m.url||'') : (m.url||'');
}

/* LA VISTA DE FOTOS. La misma información, puesta para mirar en vez de para
   trabajar: lo que manda es cuál es la foto principal de cada uno. Los botones
   son los mismos, con las mismas reglas. */
function pintaRejilla(v, caja){

  caja.innerHTML=v.map(function(p){
    var fo=FORMATOS[p.formato||'tour']||['🧾',p.formato||'—'];
    if(p._clase==='espacio') fo=['🏛','Espacio'];

    var falta=leFalta(p), f=fotoDe(p), frena=frenaAlAliado(p);
    return '<div class="tar" data-p="'+esc(p.id)+'">'+
      '<div class="foto">'+(f?'<img src="'+esc(f)+'" alt="" loading="lazy" onerror="this.remove()">':fo[0])+'</div>'+
      '<div class="cuerpo">'+
        '<div class="pills"><span class="pill '+es[0]+'">'+es[1]+'</span>'+
          '<span class="pill ne">'+fo[1]+'</span>'+
        '</div>'+
        '<div class="nom">'+esc(p.nombre||'(sin nombre)')+'</div>'+
        '<div class="donde">'+esc(p._dueno||OPS[p.operador_id]||(p.tipo==='propio'?'Casa Pepe':'sin dueño'))+
          (p._sala?' · '+esc(p._sala):'')+(p._fecha?' · '+esc(fecha(p._fecha)):'')+'</div>'+
        ((falta.length||frena)?'<div class="pills">'+
            falta.map(function(x){ return '<span class="pill al">'+esc(x)+'</span>'; }).join('')+
            (frena?frena.map(function(x){ return '<span class="pill er">🔒 '+esc(x)+'</span>'; }).join(''):'')+
          '</div>':'')+
        '<div class="pie">'+
          '<span class="precio">'+((p._ev&&p._gratis&&!(Number(p.neto_adulto)>0))?'Gratis'
              : dinero(p.precio_adulto!=null?p.precio_adulto:p.neto_adulto))+'</span>'+
          '<a class="btn sm" target="_top" href="'+
            (p._ev ? '/m/eventos.html?ev='+encodeURIComponent(p.id)+'#evt'
                   : '/ficha.html?id='+encodeURIComponent(p.id)+'&de=productos')+'">Editar ↗</a>'+
          (['borrador','en_revision','pausada'].indexOf(p.estado)>=0 && !falta.length && !frena
            ? '<button class="btn sm verde" data-publicar="'+esc(p.id)+'">Publicar</button>' : '')+
          (p.estado==='publicada'
            ? '<button class="btn sm" data-despublicar="'+esc(p.id)+'">Despublicar</button>' : '')+
        '</div>'+
      '</div></div>';
  }).join('');
}

function gris(txt,porque){
  return '<span class="btn sm gris" title="'+esc(porque)+'" style="opacity:.45;cursor:default">'+esc(txt)+'</span>';
}

/* PUBLICAR Y DESPUBLICAR. Cada mundo con su palabra y con lo suyo: una
   experiencia apunta cuándo se publicó, un evento apunta quién lo validó -que
   es lo que mira su pantalla-. Despublicar deja la experiencia en pausa y el
   evento en borrador, que es donde cada uno puede volver.
   Lo que no se hace aquí es apartar la sala de un evento: eso es un paso del
   calendario, con sus choques, y publicar desde una lista no puede decidirlo.
   Por eso un evento sin sala no tiene botón: le falta y se ve. */
async function cambiaEstado(id, que, btn){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  var ahora=new Date().toISOString();
  var tabla = p._ev ? 'eventos' : 'op_experiencias';
  var cuerpo, nuevoVisible;
  if(que==='publicar'){
    cuerpo = p._ev ? {estado:'publicado',validado_at:ahora,validado_por:YO||null}
                   : {estado:'publicada',publicada_at:ahora};
    nuevoVisible='publicada';
  }else{
    cuerpo = p._ev ? {estado:'borrador'} : {estado:'pausada'};
    nuevoVisible = p._ev ? 'borrador' : 'pausada';
  }
  var antes=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent=que==='publicar'?'Publicando…':'Quitando…'; }
  try{
    var r=await api(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
       body:JSON.stringify(cuerpo)});
    if(!r.ok){
      /* La base escribe mensajes buenos -«a Kari Costa le falta un teléfono o
         WhatsApp»- y los estábamos enseñando envueltos en JSON. Se saca el
         mensaje y se tira el envoltorio. */
      var txt=await r.text(), msg='';
      try{ msg=(JSON.parse(txt)||{}).message||''; }catch(_){}
      throw new Error(msg || ('la base respondió '+r.status+' · '+txt.slice(0,120)));
    }
    var fila=await r.json().catch(function(){return null;});
    if(!fila || !fila.length) throw new Error('la base no dejó cambiar esto');
    try{
      await api(SB+'/rest/v1/historia',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
        body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,
          que:que==='publicar'?'publicada':'despublicada',quien:YO||'el equipo',
          detalle:{desde:p.estado,nombre:p.nombre,operador:p._dueno||OPS[p.operador_id]||null}})});
    }catch(_){}
    p.estado=nuevoVisible;
    if(p._ev) p._estadoReal=cuerpo.estado;
    avisa(que==='publicar' ? 'Publicada · ya está a la venta'
                           : 'Quitada de la venta · no se borró nada');
    /* Si la orden salió del cajón, el cajón enseña el estado de hace un
       segundo: se vuelve a pintar con lo que acaba de pasar. */
    pinta();
    if($('cajon').classList.contains('on')) abreCajon(id);
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent=antes; }
    avisa('No se pudo: '+((e&&e.message)||e));
  }
}

/* BORRAR SIN POP-UP DEL NAVEGADOR. Javi lo lleva pidiendo desde hace meses:
   «ese "grupocasapepe.netlify.app dice" rompe la casa y en el móvil tapa media
   pantalla». La pregunta se hace en la propia fila, donde está lo que se va a
   borrar, y el motivo se escribe ahí mismo. */
function pideMotivo(id, btn){
  var acc=btn && btn.parentNode; if(!acc) return;
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  acc.className='acc conf';
  /* Los botones se buscan por data-, no por id: un uuid que empieza por dígito
     no es un selector CSS válido y querySelector reventaría. */
  acc.innerHTML='<div class="dice">Esto no se deshace. ¿Por qué se borra?</div>'+
    '<input placeholder="El motivo es lo único que queda de ella" maxlength="200">'+
    '<button class="btn sm rojo" data-si="1">Sí, borrar</button>'+
    '<button class="btn sm gris" data-no="1">No</button>';
  var inp=acc.querySelector('input');
  var si=acc.querySelector('[data-si]');
  inp.focus();
  acc.querySelector('[data-no]').onclick=function(){ pinta(); };
  si.onclick=function(){
    var txt=String(inp.value||'').trim();
    if(txt.length<4){ acc.querySelector('.dice').textContent='Escribe el motivo: es lo único que queda de ella.'; inp.focus(); return; }
    si.disabled=true; si.textContent='Borrando…';
    borra(id, txt, acc);
  };
  inp.onkeydown=function(ev){ if(ev.key==='Enter') si.click(); };
}

/* Mandar a revisión no cambia la ficha, sólo de quién es el turno: pasa a la
   cola de aprobación y deja de ser del operador. Por eso no se pregunta nada
   -no hay nada que decidir- y por eso se deja escrito quién la mandó: cuando
   alguien la apruebe, la fila de al lado dirá de dónde venía. */
async function mandaRevision(id, btn){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p || p.estado!=='borrador') return;
  if(btn){ btn.disabled=true; btn.textContent='Mandando…'; }
  /* Cada mundo guarda el mismo paso con su palabra: la experiencia pasa a
     `en_revision` y el evento a `propuesto`, que es el estado con el que la
     cola de aprobación los va a buscar. */
  var tabla = p._ev ? 'eventos' : 'op_experiencias';
  var nuevo = p._ev ? {estado:'propuesto'} : {estado:'en_revision'};
  try{
    var r=await api(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
       body:JSON.stringify(nuevo)});
    if(!r.ok) throw new Error('la base respondió '+r.status+' · '+(await r.text()).slice(0,140));
    var fila=await r.json().catch(function(){return null;});
    /* Un PATCH que no devuelve nada es un PATCH que no cambió nada: la base lo
       dejó pasar pero no dejó tocar esta ficha. Decirlo, no cantar victoria. */
    if(!fila || !fila.length) throw new Error('la base no dejó cambiar esta ficha');
    try{
      await api(SB+'/rest/v1/historia',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
        body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,
          que:'mandada a revisión',quien:YO||'el equipo',
          detalle:{desde:'borrador',nombre:p.nombre,
            operador:p._dueno||OPS[p.operador_id]||null}})});
    }catch(_){}
    p.estado='en_revision';
    if(p._ev) p._estadoReal='propuesto';
    avisa('Mandada a revisión · ya está en la cola de aprobación');
    pinta();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Mandar a revisión'; }
    avisa('No se mandó: '+((e&&e.message)||e));
  }
}

/* BORRAR UNA FICHA NO ES UN DELETE. Javi, 26-oct-2026.
   La base NO lo frena: sinc_reservas.op_experiencia_id está en ON DELETE SET
   NULL, así que borrar una ficha con reservas no da error — deja las reservas
   vivas y sin saber de qué eran. Una venta que no sabe qué vendió es el mismo
   fallo que nos hizo dar por perdida la de Jorge Ruvalcaba. Se cuenta antes,
   y si hay reservas se dice que no con el número delante. */
async function borra(id, motivo, acc){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  if(p.estado==='publicada'){ avisa('Está publicada. Quítala de la venta y luego se borra.'); return; }
  function dice(t){ var d=acc&&acc.querySelector('.dice'); if(d) d.textContent=t; else avisa(t); }

  /* UN EVENTO SE CUENTA IGUAL, pero lo suyo son boletos vendidos y la sala que
     tiene apartada. Un boleto vendido es alguien que va a presentarse en la
     puerta: eso no se borra, se cancela en su pantalla. */
  var res=0, sal=0;
  try{
    if(p._ev){
      var r1=await api(SB+'/rest/v1/evento_reservas?select=id&evento_id=eq.'+id+'&limit=1',
        {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
      if(!r1.ok) throw new Error('no pudimos contar sus boletos ('+r1.status+')');
      res=Number((r1.headers.get('content-range')||'/0').split('/')[1]||0);
      var r2=await api(SB+'/rest/v1/ev_ocupaciones?select=id&evento_id=eq.'+id);
      sal=r2.ok?(await r2.json()).length:0;
    }else{
      var e1=await api(SB+'/rest/v1/sinc_reservas?select=id&op_experiencia_id=eq.'+id+'&limit=1',
        {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
      if(!e1.ok) throw new Error('no pudimos contar sus reservas ('+e1.status+')');
      res=Number((e1.headers.get('content-range')||'/0').split('/')[1]||0);
      /* OJO AL ID. sinc_salidas.experiencia_id NO apunta a op_experiencias:
         apunta a la tabla vieja `experiencias`, y la ficha guarda ese id en su
         columna experiencia_id. Preguntando con el id de la ficha salían
         siempre cero salidas, así que se podía borrar una ficha con salidas
         programadas sin que nadie avisara. Javi, 26-oct-2026. */
      if(p.experiencia_id){
        var e2=await api(SB+'/rest/v1/sinc_salidas?select=id&experiencia_id=eq.'+encodeURIComponent(p.experiencia_id));
        sal=e2.ok?(await e2.json()).length:0;
      }
    }
  }catch(e){
    dice('No se borró: '+((e&&e.message)||e)+'. Sin poder comprobarlo, no lo toco.');
    return;
  }

  if(res>0){
    dice(p._ev
      ? 'Tiene '+res+' boleto'+(res===1?'':'s')+' vendido'+(res===1?'':'s')+'. Eso se cancela en la pantalla de eventos, no se borra.'
      : 'Tiene '+res+' reserva'+(res===1?'':'s')+' colgando. Si la borras se quedan sin saber de qué eran: pásala a anulada.');
    return;
  }

  try{
    await api(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
      body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,que:'borrada',
        quien:YO||'el equipo',
        detalle:{nombre:p.nombre,estado:p._estadoReal||p.estado,formato:p.formato,
                 operador:p._dueno||OPS[p.operador_id]||null,
                 salidas_borradas:sal,motivo:String(motivo||'').trim()}})});
    if(sal){
      /* Y al borrarlas, el mismo id con el que se contaron. */
      var tsal=p._ev ? 'ev_ocupaciones?evento_id=eq.'+encodeURIComponent(id)
                     : 'sinc_salidas?experiencia_id=eq.'+encodeURIComponent(p.experiencia_id);
      var rs=await api(SB+'/rest/v1/'+tsal,{method:'DELETE',headers:hdr()});
      if(!rs.ok) throw new Error('no se pudo soltar lo que tenía apartado ('+rs.status+')');
    }
    var tab=p._ev?'eventos':'op_experiencias';
    var rr=await api(SB+'/rest/v1/'+tab+'?id=eq.'+id,{method:'DELETE',headers:hdr()});
    if(!rr.ok) throw new Error('la base respondió '+rr.status+' · '+(await rr.text()).slice(0,140));
    TODOS=TODOS.filter(function(x){return String(x.id)!==String(id);});
    avisa('Borrada · la quitó '+(YO||'el equipo'));
    cierraCajon();          /* ya no existe: no se deja su ficha abierta */
    pinta();
  }catch(e){ dice('No se pudo borrar: '+((e&&e.message)||e)); }
}

async function carga(){
  FALLO=''; TODOS=null; pinta();
  try{
    var campos='id,experiencia_id,nombre,formato,estado,tipo,operador_id,precio_adulto,neto_adulto,apepe_gratuito,duracion_min,sku,ciudad,cer_inicio_lugar,punto_encuentro,updated_at,fechas,termina_en,calendario_modo';
    var r=await api(SB+'/rest/v1/op_experiencias?select='+campos+'&order=updated_at.desc&limit=2000');
    if(!r.ok) throw new Error('la base respondió '+r.status);
    TODOS=await r.json();
    var o=await api(SB+'/rest/v1/tour_operadores?select=id,nombre_comercial&limit=1000',{headers:hdr()});
    if(o.ok){ (await o.json()).forEach(function(x){ OPS[x.id]=x.nombre_comercial; }); }
    pintaAteneistas();
    /* EL CANDADO DEL ALIADO, ANTES DE INTENTARLO. La base ya frena a quien no
       puede publicar -«a Kari Costa le falta un teléfono o WhatsApp»- y lo dice
       con buenas palabras, pero lo decía con un 403 después de apretar el
       botón. Son las mismas palabras de La comunidad: aquí se enseñan antes.
       Javi, 26-oct-2026. */
    CANDADO={};
    var ca=await api(SB+'/rest/v1/v_ateneistas?select=id,candado&limit=2000',{headers:hdr()});
    if(ca.ok){ (await ca.json()).forEach(function(x){ if(x.id) CANDADO[x.id]=x.candado||null; }); }
    /* Las fotos viven en sinc_media desde la unificación de la galería. Se
       traen sólo los ids: aquí no se pintan, sólo hace falta saber si hay. */
    MEDIA={};
    var m=await api(SB+'/rest/v1/sinc_media?select=id,experiencia_id,url,url_h,storage_path,storage_path_h,orden&tipo=eq.foto&estado=eq.listo&order=orden.asc&limit=5000',{headers:hdr()});
    if(m.ok){ (await m.json()).forEach(function(x){
      /* La primera por orden es la principal: se guarda su liga, que es la que
         se enseña, en vez de un simple «sí tiene». */
      /* LA HORIZONTAL NO SE SACA DE LA VERTICAL. Javi, 27-oct-2026: «tu sistema
         toma la foto vertical igual que para la horizontal». Cada foto se
         guarda recortada dos veces -900x1200 para las tarjetas, 1600x900 para
         lo ancho- y aquí sólo se traía la vertical, así que al meterla en un
         hueco ancho se le cortaba la cabeza. Ahora viaja la fila entera y cada
         sitio pide la forma que necesita. */
      if(x.experiencia_id && !MEDIA[x.experiencia_id]) MEDIA[x.experiencia_id]=x; }); }

    /* LOS EVENTOS DEL ATENEO, EN LA MISMA LISTA. Javi, 26-oct-2026. Viven en su
       propia tabla y se venden por su propio camino, así que esta pantalla no
       los veía: el filtro «Eventos» sólo enseñaba las seis fichas de
       op_experiencias con formato evento, ninguna de ellas a la venta, mientras
       los 17 que sí se venden no salían por ningún lado.
       No se migra nada ni se duplica nada: se leen las dos tablas y se traduce
       la de eventos al idioma de la lista. Si un día los eventos se mudan, lo
       único que cambia es de dónde se leen. */
    try{
      var ev=await api(SB+'/rest/v1/eventos?select=id,nombre,estado,clase,espacio,fecha_inicio,fecha_fin,'+
        'es_gratis,precio,precio_por_hora,duracion_min,fotos,productora_id,created_at,updated_at&order=updated_at.desc&limit=1000',
        {headers:hdr()});
      if(ev.ok){
        var EVS=await ev.json();
        /* Un evento con boletos tiene el precio en ellos, no en su campo: el
           más barato es el «desde» que se enseña. */
        var BOL={};
        var bp=await api(SB+'/rest/v1/evento_precios?select=evento_id,precio&limit=2000',{headers:hdr()});
        if(bp.ok){ (await bp.json()).forEach(function(b){
          var n=Number(b.precio||0); if(!(n>0)) return;
          if(!BOL[b.evento_id] || n<BOL[b.evento_id]) BOL[b.evento_id]=n; }); }
        var PROD={};
        var PRODOP={};
        var pr=await api(SB+'/rest/v1/productoras?select=id,nombre_comercial,tour_operador_id&limit=1000',{headers:hdr()});
        if(pr.ok){ (await pr.json()).forEach(function(x){
          PROD[x.id]=x.nombre_comercial; PRODOP[x.id]=x.tour_operador_id||null; }); }
        TODOS=TODOS.concat(EVS.map(function(e){
          return normalizaEvento(e, PROD[e.productora_id], BOL[e.id], PRODOP[e.productora_id]);
        }));
        TODOS.sort(function(a,b){ return String(b.updated_at||'').localeCompare(String(a.updated_at||'')); });
      }
    }catch(_){ /* si los eventos no cargan, la lista de experiencias sigue sirviendo */ }
    /* Lo último, cuando ya están las dos tablas en la misma lista: lo que ya
       ocurrió se va a Pasadas y deja de estorbar en borrador, en revisión y
       publicadas. */
    if(TODOS) marcaPasados(TODOS);
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  pinta();
}

/* La lista sale de QUIEN TIENE PRODUCTOS AQUI, no del censo entero de
   ateneistas: un desplegable con ciento y pico de nombres de los que la
   mitad no tiene nada que enseñar es un desplegable que estorba. Se recalcula
   al cargar, asi que sigue a la casa que esté elegida arriba. */
function pintaAteneistas(){
  var dl=$('dlAteneistas'); if(!dl) return;
  var vistos={};
  (TODOS||[]).forEach(function(p){
    var n=p._dueno||OPS[p.operador_id]||'';
    if(!n) return;
    if(!vistos[n]) vistos[n]={n:n, id:p.operador_id||null, cuantos:0};
    /* Si la primera fila con ese nombre venía sin id, el nombre se quedaba sin
       id para siempre. Basta con que UNA lo traiga. */
    if(!vistos[n].id && p.operador_id) vistos[n].id=p.operador_id;
    vistos[n].cuantos++;
  });
  ATE_ID={};
  var L=Object.keys(vistos).map(function(k){return vistos[k];})
        .sort(function(a,b){ return a.n.localeCompare(b.n,'es'); });
  dl.innerHTML = L.map(function(x){
    if(x.id) ATE_ID[x.n]=x.id;
    return '<option value="'+esc(x.n)+'">'+x.cuantos+'</option>';
  }).join('');
}

/* Los estados se suman: tocar uno lo enciende, tocarlo otra vez lo apaga, y
   ninguno encendido quiere decir todos. */
Array.prototype.forEach.call($('festados').querySelectorAll('button[data-e]'),function(b){
  b.onclick=function(){
    var e=b.getAttribute('data-e');
    /* «Sin ciudad» no es un estado de la ficha, es otra pregunta: enseña las
       que no tienen casa asignada EN VEZ de las de esta casa. Por eso no entra
       en la lista de estados ni se mezcla con ellos. */
    if(e==='sin_ciudad'){
      SIN_CIUDAD=!SIN_CIUDAD;
      b.classList.toggle('on', SIN_CIUDAD);
      pinta();
      return;
    }
    var i=F.estados.indexOf(e);
    if(i<0) F.estados.push(e); else F.estados.splice(i,1);
    b.classList.toggle('on', i<0);
    pinta();
  };
});
