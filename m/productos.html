<!--
  PRODUCTOS · el listado unico de lo que Sincretico vende.
  Javi, 26-oct-2026.

  Antes habia tres entradas que ensenaban lo mismo con nombres distintos
  -Experiencias propias, Experiencias de terceros y Ficha del producto- y
  ninguna de las tres contestaba la pregunta que se hace de verdad: que
  tenemos a la venta y que esta a medias.

  Aqui cabe todo lo que vive en op_experiencias: tours, transportes y
  eventos, propios y de terceros. El formato es una pastilla, no una
  pantalla aparte.

  VACIO Y ERROR NO SE VEN IGUAL. Si la consulta falla se dice que fallo; si
  no hay nada se dice que no hay nada. Es la leccion de la venta de Jorge
  Ruvalcaba, que parecia perdida y solo estaba detras de una consulta rota.
-->

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, TODOS=null, FALLO='', OPS={}, MEDIA={}, YO='';
var F={q:'',formato:'',estados:[],tipo:'',cartera:false};
var CARTERA={};   /* operador_id -> true mientras no haya entrado a la plataforma */

/* LA CASA LA MANDA EL SELECTOR DE ARRIBA. El panel pasa ?proyecto= al abrir el
   módulo y lo guarda en localStorage, pero cambiarlo NO recarga el iframe: hay
   que leerlo y vigilarlo. Mismo patrón que la home del panel.
   Sólo cdmx y puebla filtran de verdad; virreyes enseña sus eventos, y
   sincrético o corporativo lo ven todo. Javi, 26-oct-2026. */
function proyActual(){ var p='';
  try{ p=(new URLSearchParams(location.search).get('proyecto')||'').toLowerCase(); }catch(_){}
  if(!p){ try{ p=(localStorage.getItem('cpp_proyecto')||'').toLowerCase(); }catch(_){} }
  return p;
}
var PROY=proyActual();
var CIUDAD={cdmx:'CDMX',puebla:'Puebla'};
/* Qué vista eligió la última vez: se queda en el aparato, no en la base. */
var VISTA=(function(){ try{ return localStorage.getItem('cpp_prod_vista')||'lista'; }catch(_){ return 'lista'; } })();

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}
function dinero(n){ if(n==null||n==='') return '—';
  return '$'+Number(n).toLocaleString('es-MX',{maximumFractionDigits:0}); }
function fecha(s){ if(!s) return '';
  try{ return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }
  catch(_){ return String(s).slice(0,10); } }

var FORMATOS={tour:['🚶','Tour'],evento:['🎫','Evento'],transporte:['🚐','Transporte']};
var ESTADOS={publicada:['ok','Publicada'],en_revision:['al','En revisión'],
             borrador:['ne','Borrador'],pausada:['ne','En pausa'],
             pasada:['ne','Pasada'],anulada:['er','Anulada']};

/* De qué casa es cada cosa. Una experiencia lo dice en su ciudad; un evento del
   Ateneo está en Virreyes, que es CDMX. Las 66 fichas sin ciudad puesta se ven
   en las dos: esconder trabajo hecho por un campo vacío es peor que enseñarlo
   donde quizá no toca, y así además se ve que les falta. */
function esDeLaCasa(p){
  if(PROY!=='cdmx' && PROY!=='puebla' && PROY!=='virreyes') return true;
  if(p._ev) return PROY==='cdmx' || PROY==='virreyes';
  if(PROY==='virreyes') return false;
  var c=String(p.ciudad||'').trim();
  if(!c) return true;
  return c===CIUDAD[PROY];
}

function enCartera(p){ return !p._ev && !!p.operador_id && CARTERA[p.operador_id]===true; }

function pasa(p){
  if(!esDeLaCasa(p)) return false;
  if(F.cartera && !enCartera(p)) return false;
  if(F.formato && String(p.formato||'tour')!==F.formato) return false;
  if(F.estados.length && F.estados.indexOf(String(p.estado||''))<0) return false;
  if(F.tipo && String(p.tipo||'')!==F.tipo) return false;
  if(F.q){
    var t=(String(p.nombre||'')+' '+String(p.sku||'')+' '+
           String(p._dueno||OPS[p.operador_id]||'')).toLowerCase();
    if(t.indexOf(F.q.toLowerCase())<0) return false;
  }
  return true;
}

/* Lo que le falta a una ficha para poder venderse. Mismas palabras que usa
   el operador en su portal: si aqui dice "sin precio" alla dice lo mismo.

   DOS CAMPOS QUE YA NO SE LLENAN. Javi, 26-oct-2026: esta pantalla preguntaba
   por `precio_adulto` y por `fotos`, y ninguno de los dos es ya donde viven
   esos datos. El precio que escribe el operador es el neto -220 de los 264
   borradores lo tienen, y sólo 20 tienen precio_adulto-, y las fotos se
   mudaron a sinc_media -161 borradores tienen, y la columna `fotos` está
   vacía en los 264-. Resultado: la pantalla decía "sin precio, sin fotos" a
   fichas completas, y la cola de aprobación repetía la mentira. El Cable Bus
   de Kari salía como "sin precio" con sus 100 pesos y sus seis fotos puestas.

   A un tour por propina para huéspedes sí se le pide precio: es el que paga
   quien llega de la calle. La regla es la misma que la de la ficha. */
function leFalta(p){
  if(p._ev) return leFaltaEvento(p);
  var f=[];
  var fmt=String(p.formato||'tour');
  if(!(Number(p.neto_adulto)>0) && fmt!=='evento' && (fmt==='tour' || !p.apepe_gratuito))
    f.push('sin precio');
  if(!p.duracion_min) f.push('sin duración');
  if(!MEDIA[p.id]) f.push('sin fotos');
  if(!p.cer_inicio_lugar && !p.punto_encuentro) f.push('sin punto de encuentro');
  if(p.tipo==='tercero' && !p.operador_id) f.push('sin dueño');
  return f;
}

/* A UN EVENTO NO SE LE PIDE LO MISMO. No tiene punto de encuentro -tiene sala-
   ni hace falta la duración para venderlo. Lo que no puede faltar es cuándo es,
   dónde es y cuánto cuesta. Y un evento con boletos tiene el precio en ellos,
   no en su campo: mirar sólo `eventos.precio` fue el mismo fallo que ya se
   arregló en el calendario. Una renta de espacio -clase 'espacio'- no tiene
   fecha: se alquila cuando alguien la pide. Javi, 26-oct-2026. */
function leFaltaEvento(p){
  var f=[];
  var esEspacio = p._clase==='espacio';
  if(!esEspacio && !p._fecha) f.push('sin fecha');
  if(!p._sala) f.push('sin sala');
  if(!p._gratis && !(Number(p.neto_adulto)>0)) f.push('sin precio');
  if(!p._fotos) f.push('sin fotos');
  return f;
}

/* Los dos mundos se enseñan juntos pero no se mezclan: un evento del Ateneo
   sigue viviendo en su tabla, con sus estados. Aquí sólo se traduce para que
   la lista hable un idioma. «Propuesto» es su manera de decir «en revisión»:
   es el estado con el que sale en la cola de aprobación. */
var EV_ESTADO={borrador:'borrador',propuesto:'en_revision',
               publicado:'publicada',realizado:'pasada',cancelado:'anulada'};

function normalizaEvento(e, prodNombre, precioBoleto){
  /* Una sala no se vende por entrada sino por hora: su precio vive en otro
     campo, y mirar sólo los dos de siempre la dejaba como «sin precio» con sus
     doscientos pesos la hora puestos. */
  var porHora = !(Number(e.precio||0)>0) && !(precioBoleto>0) && Number(e.precio_por_hora||0)>0;
  var precio = Number(e.precio||0)>0 ? Number(e.precio)
             : (precioBoleto>0 ? precioBoleto
             : (porHora ? Number(e.precio_por_hora) : null));
  return {
    id:e.id, _ev:true, _clase:e.clase||'evento', _porHora:porHora,
    nombre:e.nombre, formato:'evento',
    estado: EV_ESTADO[e.estado] || 'borrador',
    _estadoReal: e.estado,
    tipo: e.productora_id ? 'tercero' : 'propio',
    operador_id:null, _dueno: prodNombre || 'Casa Pepe',
    neto_adulto: precio, precio_adulto: null,
    _gratis: !!e.es_gratis,
    duracion_min: e.duracion_min || null,
    _fecha: e.fecha_inicio || null,
    _sala: e.espacio || null,
    _foto: (e.fotos && e.fotos.length && (e.fotos[0].url || e.fotos[0])) || '',
    _fotos: !!(e.fotos && e.fotos.length),
    ciudad:'CDMX', sku:null, updated_at: e.updated_at || e.created_at
  };
}

function pinta(){
  var caja=$('lista');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos traer los productos</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—';
    return;
  }
  if(TODOS===null){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  /* La cuenta de arriba cuenta lo de esta casa, no lo del Grupo entero: si el
     selector dice Puebla, decir «331 productos» sería contarle a Puebla los de
     CDMX. */
  var dela=TODOS.filter(esDeLaCasa);
  var pub=0, med=0;
  dela.forEach(function(p){ if(p.estado==='publicada')pub++; else if(p.estado!=='anulada'&&p.estado!=='pasada')med++; });
  var casa=(PROY==='cdmx'?' en CDMX':PROY==='puebla'?' en Puebla':PROY==='virreyes'?' en Virreyes':'');
  $('cuenta').innerHTML='<b>'+dela.length+'</b> productos'+casa+' · <b>'+pub+'</b> publicados · <b>'+med+'</b> a medias';

  var v=TODOS.filter(pasa);
  $('cuantos').textContent = v.length===dela.length ? '' : v.length+' con este filtro';
  $('vLista').classList.toggle('on', VISTA==='lista');
  $('vFotos').classList.toggle('on', VISTA==='fotos');
  if(!v.length){
    caja.className='';
    caja.innerHTML='<div class="vacio"><b>Nada con ese filtro</b>'+
      (dela.length?'Hay '+dela.length+' productos aquí, ninguno cumple lo que pediste.':'Todavía no hay productos dados de alta.')+'</div>';
    return;
  }
  if(VISTA==='fotos'){ pintaRejilla(v, caja); engancha(caja); return; }
  caja.className='';
  caja.innerHTML=v.map(function(p){
    var fo=FORMATOS[p.formato||'tour']||['🧾',p.formato||'—'];
    if(p._clase==='espacio') fo=['🏛','Espacio'];
    var es=ESTADOS[p.estado]||['ne',p.estado||'—'];
    var falta=leFalta(p);
    return '<div class="fila">'+
      '<div class="ico">'+(fotoDe(p)?'<img src="'+esc(fotoDe(p))+'" alt="" loading="lazy" onerror="this.parentNode.textContent=\''+fo[0]+'\'">':fo[0])+'</div>'+
      '<div class="mid">'+
        '<div class="nom"><b>'+esc(p.nombre||'(sin nombre)')+'</b></div>'+
        '<div class="pills">'+
          '<span class="pill '+es[0]+'">'+es[1]+'</span>'+
          '<span class="pill ne">'+fo[1]+'</span>'+
          (p.tipo==='propio'?'<span class="pill na">Propia</span>':'')+
          (enCartera(p)?'<span class="pill ne" title="Su aliado todavía no ha entrado a la plataforma">En cartera</span>':'')+
          falta.map(function(x){return '<span class="pill al">'+esc(x)+'</span>';}).join('')+
        '</div>'+
        '<div class="donde">'+esc(p._dueno||OPS[p.operador_id]||(p.tipo==='propio'?'Casa Pepe':'sin dueño'))+
          (p._sala?' · '+esc(p._sala):'')+(p._fecha?' · '+esc(fecha(p._fecha)):'')+
          (p.ciudad&&!p._ev?' · '+esc(p.ciudad):'')+(p.sku?' · '+esc(p.sku):'')+'</div>'+
      '</div>'+
      /* Si no hay PVP calculado se enseña el neto, que es lo que el operador
         escribió: un «—» donde hay cien pesos puestos es lo que nos tenía
         mirando fichas vacías que no lo estaban. */
      '<div class="cifra"'+(!p._ev&&p.precio_adulto==null&&Number(p.neto_adulto)>0?' title="Neto del operador · sin PVP calculado"':'')+
        '><b>'+((p._ev&&p._gratis&&!(Number(p.neto_adulto)>0))?'Gratis'
                : dinero(p.precio_adulto!=null?p.precio_adulto:p.neto_adulto))+'</b><span>'+
        (p._porHora?'por hora':p.duracion_min?p.duracion_min+' min':(p._ev?(p._clase==='espacio'?'espacio':'evento'):'—'))+'</span></div>'+
      /* Un evento del Ateneo no se edita en la ficha de Sincrético: vive en su
         propia tabla y se toca en su pantalla, con su calendario y sus salas. */
      '<div class="acc"><a class="btn sm" target="_top" href="'+
        (p._ev ? '/m/eventos.html?ev='+encodeURIComponent(p.id)+'#evt'
               : '/ficha.html?id='+encodeURIComponent(p.id)+'&de=productos')+
        '">Editar ↗</a>'+
        /* EL PASO QUE FALTABA: DE BORRADOR A LA COLA. Mientras es borrador la
           ficha se está armando y no la ve nadie más; mandarla a revisión es
           decir «ya está». Hasta hoy sólo se podía desde dentro de la ficha, y
           desde aquí -que es donde se ven los 264 borradores de golpe- no había
           manera. Javi, 26-oct-2026.
           Si le falta algo para venderse, el botón se queda en gris: la cola de
           aprobación es el rato de alguien, y una ficha sin precio ni fotos le
           hace perder ese rato. Lo que le falta ya está escrito en las pastillas
           de al lado, con las mismas palabras. */
        /* EL BOTÓN DE MANDAR A REVISIÓN SE FUE. Desde el 26-oct el estado no lo
           pone nadie: en cuanto no le falta nada, la ficha sube sola a revisión,
           y si le vuelve a faltar algo baja sola a borrador. Dejar el botón era
           ofrecer un paso que la base ya había dado. */
        /* PUBLICAR ES PONERLO A LA VENTA, así que pide lo mismo que pedía la
           ficha: si le falta algo, el botón no está. Desde «en revisión» es
           aprobarlo sin dar el rodeo por la cola; desde borrador o desde pausa
           es sacarlo directo, que es lo que hace quien lo armó él mismo. */
        (['borrador','en_revision','pausada'].indexOf(p.estado)>=0
          ? (falta.length
              ? gris('Publicar','Le falta '+falta.join(', ')+'. Eso no se pone a la venta.')
              : '<button class="btn sm verde" data-publicar="'+esc(p.id)+'">Publicar</button>')
          : '')+
        /* DESPUBLICAR NO BORRA NADA: lo quita del escaparate y lo deja donde
           pueda volver. Una experiencia queda en pausa; un evento vuelve a
           borrador, que es lo más cerca que tiene de una pausa. */
        (p.estado==='publicada'
          ? '<button class="btn sm" data-despublicar="'+esc(p.id)+'">Despublicar</button>'
          : '')+
        (p.estado==='publicada'
          ? gris('Borrar','Quítala de la venta primero')
          : '<button class="btn sm rojo" data-borrar="'+esc(p.id)+'">Borrar</button>')+
      '</div>'+
    '</div>';
  }).join('');
  engancha(caja);
}

function engancha(caja){
  Array.prototype.forEach.call(caja.querySelectorAll('[data-borrar]'),function(b){
    b.onclick=function(){ pideMotivo(b.getAttribute('data-borrar'), b); };});
  Array.prototype.forEach.call(caja.querySelectorAll('[data-publicar]'),function(b){
    b.onclick=function(){ cambiaEstado(b.getAttribute('data-publicar'),'publicar',b); };});
  Array.prototype.forEach.call(caja.querySelectorAll('[data-despublicar]'),function(b){
    b.onclick=function(){ cambiaEstado(b.getAttribute('data-despublicar'),'despublicar',b); };});
}

/* La foto principal: la primera de su galería. En una experiencia vive en
   sinc_media; en un evento, en su propio campo. */
function fotoDe(p){
  if(p._ev) return p._foto||'';
  var m=MEDIA[p.id];
  return (m && m!=='1') ? m : '';
}

/* LA VISTA DE FOTOS. La misma información, puesta para mirar en vez de para
   trabajar: lo que manda es cuál es la foto principal de cada uno. Los botones
   son los mismos, con las mismas reglas. */
function pintaRejilla(v, caja){
  caja.className='rejilla';
  caja.innerHTML=v.map(function(p){
    var fo=FORMATOS[p.formato||'tour']||['🧾',p.formato||'—'];
    if(p._clase==='espacio') fo=['🏛','Espacio'];
    var es=ESTADOS[p.estado]||['ne',p.estado||'—'];
    var falta=leFalta(p), f=fotoDe(p);
    return '<div class="tar">'+
      '<div class="foto">'+(f?'<img src="'+esc(f)+'" alt="" loading="lazy" onerror="this.remove()">':fo[0])+'</div>'+
      '<div class="cuerpo">'+
        '<div class="pills"><span class="pill '+es[0]+'">'+es[1]+'</span>'+
          '<span class="pill ne">'+fo[1]+'</span>'+
          /* También aquí: «en revisión» y «en cartera» son dos cosas distintas
             que se dan a la vez, y viendo sólo una se entiende al revés. */
          (enCartera(p)?'<span class="pill ne" title="Su aliado todavía no ha entrado a la plataforma">En cartera</span>':'')+
        '</div>'+
        '<div class="nom">'+esc(p.nombre||'(sin nombre)')+'</div>'+
        '<div class="donde">'+esc(p._dueno||OPS[p.operador_id]||(p.tipo==='propio'?'Casa Pepe':'sin dueño'))+
          (p._sala?' · '+esc(p._sala):'')+(p._fecha?' · '+esc(fecha(p._fecha)):'')+'</div>'+
        (falta.length?'<div class="pills">'+falta.map(function(x){
            return '<span class="pill al">'+esc(x)+'</span>';}).join('')+'</div>':'')+
        '<div class="pie">'+
          '<span class="precio">'+((p._ev&&p._gratis&&!(Number(p.neto_adulto)>0))?'Gratis'
              : dinero(p.precio_adulto!=null?p.precio_adulto:p.neto_adulto))+'</span>'+
          '<a class="btn sm" target="_top" href="'+
            (p._ev ? '/m/eventos.html?ev='+encodeURIComponent(p.id)+'#evt'
                   : '/ficha.html?id='+encodeURIComponent(p.id))+'">Editar ↗</a>'+
          (['borrador','en_revision','pausada'].indexOf(p.estado)>=0 && !falta.length
            ? '<button class="btn sm verde" data-publicar="'+esc(p.id)+'">Publicar</button>' : '')+
          (p.estado==='publicada'
            ? '<button class="btn sm" data-despublicar="'+esc(p.id)+'">Despublicar</button>' : '')+
        '</div>'+
      '</div></div>';
  }).join('');
}

function gris(txt,porque){
  return '<span class="btn sm gris" title="'+esc(porque)+'" style="opacity:.45;cursor:default">'+esc(txt)+'</span>';
}

/* PUBLICAR Y DESPUBLICAR. Cada mundo con su palabra y con lo suyo: una
   experiencia apunta cuándo se publicó, un evento apunta quién lo validó -que
   es lo que mira su pantalla-. Despublicar deja la experiencia en pausa y el
   evento en borrador, que es donde cada uno puede volver.
   Lo que no se hace aquí es apartar la sala de un evento: eso es un paso del
   calendario, con sus choques, y publicar desde una lista no puede decidirlo.
   Por eso un evento sin sala no tiene botón: le falta y se ve. */
async function cambiaEstado(id, que, btn){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  var ahora=new Date().toISOString();
  var tabla = p._ev ? 'eventos' : 'op_experiencias';
  var cuerpo, nuevoVisible;
  if(que==='publicar'){
    cuerpo = p._ev ? {estado:'publicado',validado_at:ahora,validado_por:YO||null}
                   : {estado:'publicada',publicada_at:ahora};
    nuevoVisible='publicada';
  }else{
    cuerpo = p._ev ? {estado:'borrador'} : {estado:'pausada'};
    nuevoVisible = p._ev ? 'borrador' : 'pausada';
  }
  var antes=btn?btn.textContent:'';
  if(btn){ btn.disabled=true; btn.textContent=que==='publicar'?'Publicando…':'Quitando…'; }
  try{
    var r=await fetch(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
       body:JSON.stringify(cuerpo)});
    if(!r.ok) throw new Error('la base respondió '+r.status+' · '+(await r.text()).slice(0,140));
    var fila=await r.json().catch(function(){return null;});
    if(!fila || !fila.length) throw new Error('la base no dejó cambiar esto');
    try{
      await fetch(SB+'/rest/v1/historia',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
        body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,
          que:que==='publicar'?'publicada':'despublicada',quien:YO||'el equipo',
          detalle:{desde:p.estado,nombre:p.nombre,operador:p._dueno||OPS[p.operador_id]||null}})});
    }catch(_){}
    p.estado=nuevoVisible;
    if(p._ev) p._estadoReal=cuerpo.estado;
    avisa(que==='publicar' ? 'Publicada · ya está a la venta'
                           : 'Quitada de la venta · no se borró nada');
    pinta();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent=antes; }
    avisa('No se pudo: '+((e&&e.message)||e));
  }
}

/* BORRAR SIN POP-UP DEL NAVEGADOR. Javi lo lleva pidiendo desde hace meses:
   «ese "grupocasapepe.netlify.app dice" rompe la casa y en el móvil tapa media
   pantalla». La pregunta se hace en la propia fila, donde está lo que se va a
   borrar, y el motivo se escribe ahí mismo. */
function pideMotivo(id, btn){
  var acc=btn && btn.parentNode; if(!acc) return;
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  acc.className='acc conf';
  /* Los botones se buscan por data-, no por id: un uuid que empieza por dígito
     no es un selector CSS válido y querySelector reventaría. */
  acc.innerHTML='<div class="dice">Esto no se deshace. ¿Por qué se borra?</div>'+
    '<input placeholder="El motivo es lo único que queda de ella" maxlength="200">'+
    '<button class="btn sm rojo" data-si="1">Sí, borrar</button>'+
    '<button class="btn sm gris" data-no="1">No</button>';
  var inp=acc.querySelector('input');
  var si=acc.querySelector('[data-si]');
  inp.focus();
  acc.querySelector('[data-no]').onclick=function(){ pinta(); };
  si.onclick=function(){
    var txt=String(inp.value||'').trim();
    if(txt.length<4){ acc.querySelector('.dice').textContent='Escribe el motivo: es lo único que queda de ella.'; inp.focus(); return; }
    si.disabled=true; si.textContent='Borrando…';
    borra(id, txt, acc);
  };
  inp.onkeydown=function(ev){ if(ev.key==='Enter') si.click(); };
}

/* Mandar a revisión no cambia la ficha, sólo de quién es el turno: pasa a la
   cola de aprobación y deja de ser del operador. Por eso no se pregunta nada
   -no hay nada que decidir- y por eso se deja escrito quién la mandó: cuando
   alguien la apruebe, la fila de al lado dirá de dónde venía. */
async function mandaRevision(id, btn){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p || p.estado!=='borrador') return;
  if(btn){ btn.disabled=true; btn.textContent='Mandando…'; }
  /* Cada mundo guarda el mismo paso con su palabra: la experiencia pasa a
     `en_revision` y el evento a `propuesto`, que es el estado con el que la
     cola de aprobación los va a buscar. */
  var tabla = p._ev ? 'eventos' : 'op_experiencias';
  var nuevo = p._ev ? {estado:'propuesto'} : {estado:'en_revision'};
  try{
    var r=await fetch(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
       body:JSON.stringify(nuevo)});
    if(!r.ok) throw new Error('la base respondió '+r.status+' · '+(await r.text()).slice(0,140));
    var fila=await r.json().catch(function(){return null;});
    /* Un PATCH que no devuelve nada es un PATCH que no cambió nada: la base lo
       dejó pasar pero no dejó tocar esta ficha. Decirlo, no cantar victoria. */
    if(!fila || !fila.length) throw new Error('la base no dejó cambiar esta ficha');
    try{
      await fetch(SB+'/rest/v1/historia',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
        body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,
          que:'mandada a revisión',quien:YO||'el equipo',
          detalle:{desde:'borrador',nombre:p.nombre,
            operador:p._dueno||OPS[p.operador_id]||null}})});
    }catch(_){}
    p.estado='en_revision';
    if(p._ev) p._estadoReal='propuesto';
    avisa('Mandada a revisión · ya está en la cola de aprobación');
    pinta();
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Mandar a revisión'; }
    avisa('No se mandó: '+((e&&e.message)||e));
  }
}

/* BORRAR UNA FICHA NO ES UN DELETE. Javi, 26-oct-2026.
   La base NO lo frena: sinc_reservas.op_experiencia_id está en ON DELETE SET
   NULL, así que borrar una ficha con reservas no da error — deja las reservas
   vivas y sin saber de qué eran. Una venta que no sabe qué vendió es el mismo
   fallo que nos hizo dar por perdida la de Jorge Ruvalcaba. Se cuenta antes,
   y si hay reservas se dice que no con el número delante. */
async function borra(id, motivo, acc){
  var p=(TODOS||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!p) return;
  if(p.estado==='publicada'){ avisa('Está publicada. Quítala de la venta y luego se borra.'); return; }
  function dice(t){ var d=acc&&acc.querySelector('.dice'); if(d) d.textContent=t; else avisa(t); }

  /* UN EVENTO SE CUENTA IGUAL, pero lo suyo son boletos vendidos y la sala que
     tiene apartada. Un boleto vendido es alguien que va a presentarse en la
     puerta: eso no se borra, se cancela en su pantalla. */
  var res=0, sal=0;
  try{
    if(p._ev){
      var r1=await fetch(SB+'/rest/v1/evento_reservas?select=id&evento_id=eq.'+id+'&limit=1',
        {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
      if(!r1.ok) throw new Error('no pudimos contar sus boletos ('+r1.status+')');
      res=Number((r1.headers.get('content-range')||'/0').split('/')[1]||0);
      var r2=await fetch(SB+'/rest/v1/ev_ocupaciones?select=id&evento_id=eq.'+id,{headers:hdr()});
      sal=r2.ok?(await r2.json()).length:0;
    }else{
      var e1=await fetch(SB+'/rest/v1/sinc_reservas?select=id&op_experiencia_id=eq.'+id+'&limit=1',
        {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
      if(!e1.ok) throw new Error('no pudimos contar sus reservas ('+e1.status+')');
      res=Number((e1.headers.get('content-range')||'/0').split('/')[1]||0);
      var e2=await fetch(SB+'/rest/v1/sinc_salidas?select=id&experiencia_id=eq.'+id,{headers:hdr()});
      sal=e2.ok?(await e2.json()).length:0;
    }
  }catch(e){
    dice('No se borró: '+((e&&e.message)||e)+'. Sin poder comprobarlo, no lo toco.');
    return;
  }

  if(res>0){
    dice(p._ev
      ? 'Tiene '+res+' boleto'+(res===1?'':'s')+' vendido'+(res===1?'':'s')+'. Eso se cancela en la pantalla de eventos, no se borra.'
      : 'Tiene '+res+' reserva'+(res===1?'':'s')+' colgando. Si la borras se quedan sin saber de qué eran: pásala a anulada.');
    return;
  }

  try{
    await fetch(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
      body:JSON.stringify({entidad:p._ev?'evento':'experiencia',entidad_id:id,que:'borrada',
        quien:YO||'el equipo',
        detalle:{nombre:p.nombre,estado:p._estadoReal||p.estado,formato:p.formato,
                 operador:p._dueno||OPS[p.operador_id]||null,
                 salidas_borradas:sal,motivo:String(motivo||'').trim()}})});
    if(sal){
      var tsal=p._ev?'ev_ocupaciones?evento_id=eq.':'sinc_salidas?experiencia_id=eq.';
      var rs=await fetch(SB+'/rest/v1/'+tsal+id,{method:'DELETE',headers:hdr()});
      if(!rs.ok) throw new Error('no se pudo soltar lo que tenía apartado ('+rs.status+')');
    }
    var tab=p._ev?'eventos':'op_experiencias';
    var rr=await fetch(SB+'/rest/v1/'+tab+'?id=eq.'+id,{method:'DELETE',headers:hdr()});
    if(!rr.ok) throw new Error('la base respondió '+rr.status+' · '+(await rr.text()).slice(0,140));
    TODOS=TODOS.filter(function(x){return String(x.id)!==String(id);});
    avisa('Borrada · la quitó '+(YO||'el equipo'));
    pinta();
  }catch(e){ dice('No se pudo borrar: '+((e&&e.message)||e)); }
}

async function carga(){
  FALLO=''; TODOS=null; pinta();
  try{
    var campos='id,nombre,formato,estado,tipo,operador_id,precio_adulto,neto_adulto,apepe_gratuito,duracion_min,sku,ciudad,cer_inicio_lugar,punto_encuentro,updated_at';
    var r=await fetch(SB+'/rest/v1/op_experiencias?select='+campos+'&order=updated_at.desc&limit=2000',{headers:hdr()});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    TODOS=await r.json();
    var o=await fetch(SB+'/rest/v1/tour_operadores?select=id,nombre_comercial&limit=1000',{headers:hdr()});
    if(o.ok){ (await o.json()).forEach(function(x){ OPS[x.id]=x.nombre_comercial; }); }
    /* Quién sigue en cartera: lo dice la base mirando si existe la cuenta, no si
       le mandamos la invitación. Una cosa dice lo que hicimos nosotros y la otra
       lo que hizo él. */
    CARTERA={};
    var ca=await fetch(SB+'/rest/v1/v_operadores_cartera?select=operador_id,en_cartera&limit=2000',{headers:hdr()});
    if(ca.ok){ (await ca.json()).forEach(function(x){ CARTERA[x.operador_id]=x.en_cartera===true; }); }
    /* Las fotos viven en sinc_media desde la unificación de la galería. Se
       traen sólo los ids: aquí no se pintan, sólo hace falta saber si hay. */
    MEDIA={};
    var m=await fetch(SB+'/rest/v1/sinc_media?select=experiencia_id,url,orden&tipo=eq.foto&estado=eq.listo&order=orden.asc&limit=5000',{headers:hdr()});
    if(m.ok){ (await m.json()).forEach(function(x){
      /* La primera por orden es la principal: se guarda su liga, que es la que
         se enseña, en vez de un simple «sí tiene». */
      if(x.experiencia_id && !MEDIA[x.experiencia_id]) MEDIA[x.experiencia_id]=x.url||'1'; }); }

    /* LOS EVENTOS DEL ATENEO, EN LA MISMA LISTA. Javi, 26-oct-2026. Viven en su
       propia tabla y se venden por su propio camino, así que esta pantalla no
       los veía: el filtro «Eventos» sólo enseñaba las seis fichas de
       op_experiencias con formato evento, ninguna de ellas a la venta, mientras
       los 17 que sí se venden no salían por ningún lado.
       No se migra nada ni se duplica nada: se leen las dos tablas y se traduce
       la de eventos al idioma de la lista. Si un día los eventos se mudan, lo
       único que cambia es de dónde se leen. */
    try{
      var ev=await fetch(SB+'/rest/v1/eventos?select=id,nombre,estado,clase,espacio,fecha_inicio,'+
        'es_gratis,precio,precio_por_hora,duracion_min,fotos,productora_id,created_at,updated_at&order=updated_at.desc&limit=1000',
        {headers:hdr()});
      if(ev.ok){
        var EVS=await ev.json();
        /* Un evento con boletos tiene el precio en ellos, no en su campo: el
           más barato es el «desde» que se enseña. */
        var BOL={};
        var bp=await fetch(SB+'/rest/v1/evento_precios?select=evento_id,precio&limit=2000',{headers:hdr()});
        if(bp.ok){ (await bp.json()).forEach(function(b){
          var n=Number(b.precio||0); if(!(n>0)) return;
          if(!BOL[b.evento_id] || n<BOL[b.evento_id]) BOL[b.evento_id]=n; }); }
        var PROD={};
        var pr=await fetch(SB+'/rest/v1/productoras?select=id,nombre_comercial&limit=1000',{headers:hdr()});
        if(pr.ok){ (await pr.json()).forEach(function(x){ PROD[x.id]=x.nombre_comercial; }); }
        TODOS=TODOS.concat(EVS.map(function(e){
          return normalizaEvento(e, PROD[e.productora_id], BOL[e.id]);
        }));
        TODOS.sort(function(a,b){ return String(b.updated_at||'').localeCompare(String(a.updated_at||'')); });
      }
    }catch(_){ /* si los eventos no cargan, la lista de experiencias sigue sirviendo */ }
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  pinta();
}

/* Los estados se suman: tocar uno lo enciende, tocarlo otra vez lo apaga, y
   ninguno encendido quiere decir todos. */
Array.prototype.forEach.call($('festados').querySelectorAll('button[data-e]'),function(b){
  b.onclick=function(){
    var e=b.getAttribute('data-e'), i=F.estados.indexOf(e);
    if(i<0) F.estados.push(e); else F.estados.splice(i,1);
    b.classList.toggle('on', i<0);
    pinta();
  };
});
$('fCartera').onclick=function(){
  F.cartera=!F.cartera;
  this.classList.toggle('on',F.cartera);
  pinta();
};

['vLista','vFotos'].forEach(function(id){
  $(id).onclick=function(){
    VISTA = id==='vFotos' ? 'fotos' : 'lista';
    try{ localStorage.setItem('cpp_prod_vista',VISTA); }catch(_){}
    pinta();
  };
});
