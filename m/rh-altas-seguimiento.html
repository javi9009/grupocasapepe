<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimiento de Altas · Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}.ttl{font-weight:600;font-size:15px}.ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:12px;color:var(--soft);font-weight:600}
.bar select,.bar input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
.bar .status{margin-left:auto;font-size:12px;color:var(--soft)}.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
.wrap{padding:4px 16px 40px;max-width:1000px;margin:0 auto}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.nm{font-weight:700;font-size:15px}
.sub{font-size:12px;color:var(--soft)}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--soft);font-weight:600}
.pill.id{background:#faf5ea;color:#8a6d1f;border-color:#e7d4a0}
.pill.loc{background:#eaf6f0;color:#176b4e;border-color:#bfe0d0}
.spacer{flex:1}
.steps{display:flex;gap:0;margin:14px 0 6px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:84px;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--bd);z-index:0}
.step:first-child::before{display:none}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--bd);margin:0 auto 5px;position:relative;z-index:1;font-size:11px;line-height:16px;color:#fff}
.lbl{font-size:10px;color:var(--soft);line-height:1.2}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step.done::before{background:var(--accent)}
.step.cur .dot{background:var(--gold);border-color:var(--gold)}
.step.cur .lbl{color:var(--txt);font-weight:700}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;align-items:center}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--txt);font-weight:600}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.go:disabled{opacity:.5;cursor:default}
.btn.mini{padding:5px 9px;font-size:12px;font-weight:500}
.done-badge{color:var(--accent);font-weight:700;font-size:13px}
.bita{margin-top:8px;border-top:1px solid var(--bd);padding-top:8px;font-size:12px;color:var(--soft);display:none}
.bita.show{display:block}.bita .it{padding:2px 0}
.empty{text-align:center;color:var(--soft);padding:40px}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(h)h.style.display="none";});}</script>
<header><a href="/">← Panel</a><span class="ttl">Seguimiento de Altas <b>Grupo Casa Pepe</b></span><span style="font-size:11px;color:#cdbf9c;margin-left:auto">Supabase en vivo</span></header>
<div class="bar">
<label>Ubicación</label><select id="fUbic"><option value="">Todas</option><option>CDMX</option><option>Puebla</option><option>Virreyes</option><option>Corp</option></select>
<label><input type="checkbox" id="fAll"> Ver también las integradas</label>
<label>Buscar</label><input id="fTxt" placeholder="nombre…">
<span class="status" id="status"></span>
</div>
<div class="wrap" id="wrap"><div class="empty">Cargando…</div></div>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t)H.Authorization='Bearer '+_t;}}catch(e){}
const $=id=>document.getElementById(id);
const ETAPAS=[['solicitada','Solicitada'],['info_recibida','Info recibida'],['aceptada','Aceptada'],['activa','ID · Activa'],['notificada','Notificada'],['expediente','Expediente'],['integrada','Integrada']];
const PROP={'45e69775-d877-4507-a9e1-a45bd3400dc5':'CDMX','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'Virreyes','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'Puebla','fde2f615-2c65-40fa-9df3-6336b5ab312c':'Corp'};
let data=[];
function status(t,c){const s=$('status');s.textContent=t||'';s.className='status'+(c?' '+c:'');}
function ubic(e){return e.sede&&['CDMX','Puebla','Virreyes','Corp'].includes(e.sede)?e.sede:(PROP[e.property_id]||e.sede||'—');}
function idx(et){const i=ETAPAS.findIndex(x=>x[0]===et);return i<0?0:i;}
async function sb(p,o){const r=await fetch(SB+p,{headers:H,...o});if(!r.ok){status('⚠ error','err');throw new Error(await r.text());}const c=await r.text();return c?JSON.parse(c):null;}
async function load(){
 status('cargando…');
 try{data=await sb('/employees?select=id,empleado_id,nombre,nombre_display,email,sede,property_id,estatus,alta_etapa,alta_historial,puesto,area&alta_etapa=not.is.null&order=fecha_alta.desc.nullslast')||[];}
 catch(e){data=[];}
 render();status('✓','ok');
}
function vis(){const u=$('fUbic').value,q=$('fTxt').value.trim().toLowerCase(),all=$('fAll').checked;
 return data.filter(e=>(all||e.alta_etapa!=='integrada')&&(!u||ubic(e)===u)&&(!q||[e.nombre,e.nombre_display,e.email].some(v=>(v||'').toLowerCase().includes(q))))
  .sort((a,b)=>idx(a.alta_etapa)-idx(b.alta_etapa));}
function stepsHtml(et){const ci=idx(et);return '<div class="steps">'+ETAPAS.map((x,i)=>{const cls=i<ci?'done':(i===ci?'cur':'');const mark=i<ci?'✓':'';return `<div class="step ${cls}"><div class="dot">${mark}</div><div class="lbl">${x[1]}</div></div>`;}).join('')+'</div>';}
function render(){const list=vis();const w=$('wrap');
 if(!list.length){w.innerHTML='<div class="empty">Sin altas en proceso 🎉</div>';return;}
 w.innerHTML=list.map(e=>{const ci=idx(e.alta_etapa);const nxt=ETAPAS[ci+1];const hist=Array.isArray(e.alta_historial)?e.alta_historial:[];
  const nm=[e.nombre].filter(Boolean).join(' ')||e.nombre_display||'—';
  return `<div class="card" data-id="${e.id}">
   <div class="top"><span class="nm">${nm}</span>
    <span class="pill loc">${ubic(e)}</span>
    <span class="pill id">${e.empleado_id||'sin ID'}</span>
    <span class="spacer"></span><span class="sub">${e.puesto||'(puesto pendiente)'} · ${e.email||''}</span></div>
   ${stepsHtml(e.alta_etapa)}
   <div class="acts">
    ${nxt?`<button class="btn go" data-go="${e.id}">Avanzar a: ${nxt[1]} →</button>`:'<span class="done-badge">✓ Integrada</span>'}
    <button class="btn mini" data-bita="${e.id}">Ver bitácora (${hist.length})</button>
   </div>
   <div class="bita" id="b-${e.id}">${hist.length?hist.map(h=>`<div class="it">• ${ (ETAPAS.find(x=>x[0]===h.etapa)||[])[1]||h.etapa } — ${(h.fecha||'').toString().slice(0,16).replace('T',' ')} · ${h.por||''}</div>`).join(''):'<div class="it">Sin movimientos.</div>'}</div>
  </div>`;}).join('');
 w.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>avanzar(b.dataset.go,b));
 w.querySelectorAll('[data-bita]').forEach(b=>b.onclick=()=>$('b-'+b.dataset.bita).classList.toggle('show'));
}
async function avanzar(id,btn){btn.disabled=true;status('avanzando…');
 try{await sb('/rpc/alta_avanzar',{method:'POST',body:JSON.stringify({p_id:id})});await load();status('✓ etapa avanzada','ok');}
 catch(e){status('⚠ no se pudo','err');btn.disabled=false;alert('No se pudo avanzar: '+(e.message||'error')+'\n(¿tienes permisos de coordinador/admin?)');}
}
['fUbic','fTxt','fAll'].forEach(id=>$(id).addEventListener('input',render));
load();
</script></body></html>
