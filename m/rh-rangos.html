<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rangos Salariales · Grupo Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:12px;color:var(--soft);font-weight:600}
.bar select,.bar input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
.bar .add{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 13px;font-weight:700;cursor:pointer}
.bar .status{margin-left:auto;font-size:12px;color:var(--soft);min-width:90px;text-align:right}
.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
.wrap{overflow-x:auto;padding:0 16px 30px}
table{border-collapse:collapse;width:100%;min-width:1000px;background:var(--surface);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--bd);padding:4px 6px;vertical-align:middle;text-align:left}
thead th{background:#efe6d4;color:var(--txt);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--bd)}
td input:focus,td select:focus{border-color:var(--accent);background:#fcf8f0;outline:none}
td.num input{text-align:right;font-variant-numeric:tabular-nums}
td.mid{background:#f6fbf8}
.del{color:var(--bad);cursor:pointer;font-weight:700;border:none;background:none;font-size:15px}
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#cdbf9c;color:#2b2017;font-size:10px;font-weight:700;cursor:pointer;margin-left:4px;vertical-align:middle}
.legend{padding:4px 16px 8px;font-size:11px;color:var(--soft)}
#pop{position:fixed;display:none;max-width:260px;background:#2b2017;color:#f4ecdd;font-size:12px;line-height:1.4;padding:9px 11px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50}
#pop b{color:var(--gold)}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(h)h.style.display="none";});}</script>
<header>
<a href="/">← Panel</a>
<span class="ttl">Rangos Salariales <b>Grupo Casa Pepe</b></span>
<span style="font-size:11px;color:#cdbf9c;margin-left:auto">Edita: Roberto · Supabase en vivo</span>
</header>

<div class="bar">
<label>Ubicación</label><select id="fUbic"><option value="">Todas</option></select>
<label>Área</label><select id="fArea"><option value="">Todas</option></select>
<label>Buscar</label><input id="fTxt" placeholder="puesto, nivel, código…">
<button class="add" id="addBtn">＋ Nuevo rango</button>
<span class="status" id="status"></span>
</div>
<div class="legend">Banda salarial por puesto/área. El salario de cada colaborador se elegirá de aquí. Da clic en <span class="help">?</span> para ver qué hay detrás de cada columna. Todo se guarda al instante.</div>

<div class="wrap"><table>
<thead><tr id="thead"></tr></thead>
<tbody id="tbody"></tbody>
</table></div>

<div id="pop"></div>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id);
let data=[];

const COLS=[
 {k:'codigo',t:'Código',type:'text',help:'Clave interna del rango (opcional). Sirve para referenciarlo desde otras sábanas.'},
 {k:'area',t:'Área',type:'text',help:'Área de la empresa a la que aplica esta banda (Front Desk, A&B, etc.).'},
 {k:'puesto',t:'Puesto',type:'text',help:'Puesto al que aplica la banda salarial.'},
 {k:'nivel',t:'Nivel',type:'text',help:'Nivel o seniority dentro del puesto (Jr, Sr, Jefe…). Opcional.'},
 {k:'ubicacion',t:'Ubicación',type:'text',help:'Sede a la que aplica (CDMX, Puebla, Virreyes). Un mismo puesto puede tener bandas distintas por sede.'},
 {k:'sueldo_min',t:'Sueldo mín',type:'num',help:'Piso de la banda: sueldo mensual bruto mínimo para el puesto.'},
 {k:'sueldo_sugerido',t:'Sugerido',type:'num',mid:true,help:'Sueldo objetivo/de referencia. Es el que se propondrá por defecto al asignar salario a un colaborador.'},
 {k:'sueldo_max',t:'Sueldo máx',type:'num',help:'Techo de la banda: sueldo mensual bruto máximo para el puesto.'},
 {k:'vigente_desde',t:'Vigente desde',type:'date',help:'Fecha a partir de la cual aplica esta banda.'},
 {k:'activo',t:'Activo',type:'bool',help:'Si está activo, el rango se ofrece al asignar salarios. Desactívalo para conservarlo como histórico.'},
 {k:'notas',t:'Notas',type:'text',help:'Comentarios o justificación del rango.'},
];

async function sb(path,opts){const r=await fetch(SB+path,{headers:H,...opts});if(!r.ok){const t=await r.text();status('⚠ error','err');console.warn(r.status,t);throw new Error(t)}const c=await r.text();return c?JSON.parse(c):null}
function status(t,cls){const s=$('status');s.textContent=t||'';s.className='status'+(cls?' '+cls:'')}

function fillFilters(){
 const ubic=[...new Set(data.map(r=>r.ubicacion).filter(Boolean))].sort();
 const area=[...new Set(data.map(r=>r.area).filter(Boolean))].sort();
 $('fUbic').innerHTML='<option value="">Todas</option>'+ubic.map(u=>`<option>${u}</option>`).join('');
 $('fArea').innerHTML='<option value="">Todas</option>'+area.map(a=>`<option>${a}</option>`).join('');
}
function header(){
 $('thead').innerHTML=COLS.map(c=>`<th>${c.t}<span class="help" data-h="${c.help.replace(/"/g,'&quot;')}">?</span></th>`).join('')+'<th></th>';
}
function visible(){
 const u=$('fUbic').value,a=$('fArea').value,q=$('fTxt').value.trim().toLowerCase();
 return data.filter(r=>(!u||r.ubicacion===u)&&(!a||r.area===a)&&(!q||[r.codigo,r.puesto,r.nivel,r.area].some(v=>(v||'').toLowerCase().includes(q))));
}
function cellInput(r,c){
 if(c.type==='bool') return `<input type="checkbox" ${r[c.k]?'checked':''} data-id="${r.id}" data-k="${c.k}" style="width:auto">`;
 if(c.type==='num') return `<input type="number" step="1" value="${r[c.k]??''}" data-id="${r.id}" data-k="${c.k}">`;
 if(c.type==='date') return `<input type="date" value="${r[c.k]||''}" data-id="${r.id}" data-k="${c.k}">`;
 return `<input type="text" value="${(r[c.k]??'').toString().replace(/"/g,'&quot;')}" data-id="${r.id}" data-k="${c.k}">`;
}
function render(){
 const rows=visible();
 $('tbody').innerHTML=rows.map(r=>'<tr>'+COLS.map(c=>`<td class="${c.type==='num'?'num ':''}${c.mid?'mid':''}">${cellInput(r,c)}</td>`).join('')+`<td><button class="del" data-del="${r.id}" title="Eliminar">×</button></td>`).join('');
 bind();
}
function bind(){
 document.querySelectorAll('#tbody input').forEach(el=>{
  el.onchange=async()=>{
   const id=el.dataset.id,k=el.dataset.k;
   let v= el.type==='checkbox'?el.checked : (el.type==='number'? (el.value===''?null:Number(el.value)) : (el.value===''?null:el.value));
   status('guardando…');
   try{ await sb('/rangos_salariales?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({[k]:v,updated_by:'panel',updated_at:new Date().toISOString()})});
        const row=data.find(x=>x.id===id); if(row) row[k]=v; status('✓ guardado','ok'); if(k==='area'||k==='ubicacion') fillFilters();
   }catch(e){ status('⚠ no se guardó','err'); }
  };
 });
 document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
  if(!confirm('¿Eliminar este rango?'))return; status('eliminando…');
  await sb('/rangos_salariales?id=eq.'+b.dataset.del,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}});
  data=data.filter(x=>x.id!==b.dataset.del); render(); status('✓ guardado','ok');
 });
}
$('addBtn').onclick=async()=>{
 status('creando…');
 const nuevo={area:$('fArea').value||'',ubicacion:$('fUbic').value||'',puesto:'(nuevo puesto)',activo:true,vigente_desde:new Date().toISOString().slice(0,10),updated_by:'panel'};
 const ins=await sb('/rangos_salariales',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(nuevo)});
 data.unshift(ins[0]); fillFilters(); render(); status('✓ guardado','ok');
};
['fUbic','fArea','fTxt'].forEach(id=>$(id).addEventListener('input',render));

// Popover de ayuda (?)
const pop=$('pop');
document.addEventListener('click',e=>{
 const h=e.target.closest('.help');
 if(h && h.dataset.h){ pop.innerHTML='<b>¿Qué es?</b><br>'+h.dataset.h; pop.style.display='block';
   const r=h.getBoundingClientRect(); pop.style.left=Math.min(r.left, window.innerWidth-280)+'px'; pop.style.top=(r.bottom+6)+'px'; e.stopPropagation(); }
 else if(!e.target.closest('#pop')){ pop.style.display='none'; }
});

(async()=>{ header(); try{ data=await sb('/rangos_salariales?select=*&order=area,puesto,ubicacion'); }catch(e){ data=[]; } fillFilters(); render(); status('✓ guardado','ok'); })();
</script></body></html>
