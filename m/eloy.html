<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Eloy Queda · Mantenimiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<style>
  :root{--bg:#0f1512;--card:#152019;--me:#1f6f4a;--eloy:#20304a;--ink:#eaf3ee;--ink2:#9db3a6;
    --line:#26362c;--brand:#1aa06a;}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  header .back{color:var(--ink2);text-decoration:none;font-size:24px;line-height:1}
  header .ava{width:38px;height:38px;border-radius:50%;background:var(--eloy);display:grid;place-items:center;font-size:20px}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--ink2)}
  header select{margin-left:auto;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 9px;font:inherit;font-size:13px}
  #feed{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
  .b{max-width:82%;padding:10px 13px;border-radius:16px;font-size:14.5px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word}
  .b.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:5px}
  .b.eloy{align-self:flex-start;background:var(--eloy);border-bottom-left-radius:5px}
  .b .who{font-size:11px;color:var(--ink2);font-weight:700;margin-bottom:3px}
  .b img{max-width:100%;border-radius:10px;margin-top:6px;display:block}
  .tk{align-self:center;background:#173a26;border:1px solid #1e5a38;color:#bff0d4;font-size:12.5px;
    padding:8px 12px;border-radius:999px;font-weight:700}
  .typing{align-self:flex-start;color:var(--ink2);font-size:13px;padding:4px 6px}
  .resumen{align-self:stretch;background:var(--card);border:1px solid var(--brand);border-radius:16px;padding:14px 15px;margin-top:2px}
  .resumen h3{margin:0 0 10px;font-size:14px;color:var(--brand);font-weight:800;letter-spacing:.02em}
  .resumen dl{display:grid;grid-template-columns:auto 1fr;gap:7px 12px;margin:0 0 12px}
  .resumen dt{color:var(--ink2);font-size:12.5px;font-weight:700}
  .resumen dd{margin:0;font-size:13.5px;color:var(--ink);word-wrap:break-word;min-width:0}
  .resumen dd.cap{text-transform:capitalize}
  .resumen img{max-width:100%;border-radius:10px;margin:2px 0 4px;display:block}
  .resumen .enviar{width:100%;background:var(--brand);border:none;border-radius:12px;color:#04120c;font-weight:900;font-size:15px;padding:13px;cursor:pointer}
  .resumen .enviar:disabled{opacity:.5}
  .resumen .cancelar{width:100%;background:none;border:none;color:var(--ink2);font-size:12.5px;padding:9px;margin-top:2px;cursor:pointer}
  #fotoTag{display:none;align-items:center;gap:8px;padding:8px 12px;background:var(--card);border-top:1px solid var(--line);color:var(--ink2);font-size:13px}
  #fotoTag button{background:none;border:none;color:var(--brand);font-weight:700;font-size:13px}
  form{display:flex;gap:8px;align-items:flex-end;padding:10px;border-top:1px solid var(--line);background:var(--card);
    padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  .foto-btn{background:var(--bg);border:1px solid var(--line);border-radius:12px;color:var(--ink2);font-size:19px;width:44px;height:44px;flex:none}
  .foto-btn.on{color:var(--brand);border-color:var(--brand)}
  textarea{flex:1;resize:none;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:14px;
    padding:11px 13px;font:inherit;font-size:14.5px;max-height:120px}
  .send{background:var(--brand);border:none;border-radius:50%;width:44px;height:44px;flex:none;font-size:19px;color:#04120c;font-weight:900}
  .send:disabled{opacity:.5}
  #login{margin:auto;text-align:center;color:var(--ink2);padding:24px}
  #login a{color:var(--brand);font-weight:700}
  /* Botón "por confirmar" en el header */
  .pendbtn{position:relative;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;display:none;align-items:center;gap:6px}
  .pendbtn.has{border-color:var(--brand);color:#bff0d4}
  .pendbtn .bdg{background:var(--brand);color:#04120c;border-radius:999px;font-size:11px;font-weight:900;min-width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
  /* Aviso de reportes por confirmar */
  .confhd{align-self:stretch;color:var(--ink2);font-size:12px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;margin:4px 2px 0}
  /* Tarjeta con botones SIEMPRE visibles; la foto se abre aparte */
  .confirm{align-self:stretch;border:1px solid var(--brand);background:#14251c;border-radius:14px;padding:12px 13px}
  .confirm .chead{display:flex;align-items:flex-start;gap:9px}
  .confirm .ci{font-size:18px;flex:none}
  .confirm .ct{font-weight:800;font-size:14px;color:#dff7ea;line-height:1.25}
  .confirm .cm{font-size:11.5px;color:var(--ink2);margin-top:2px;display:block}
  .confirm .cver{margin-top:9px}
  .confirm .cver>summary{list-style:none;cursor:pointer;color:var(--brand);font-size:12.5px;font-weight:700}
  .confirm .cver>summary::-webkit-details-marker{display:none}
  .confirm .cnote{font-size:12.5px;color:var(--ink2);margin:8px 0;background:var(--bg);border-radius:9px;padding:7px 9px}
  .confirm .cver img{max-width:100%;border-radius:10px;display:block;margin-top:8px}
  .cbtns{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap}
  .cbtns button{border:none;border-radius:11px;padding:11px 13px;font:inherit;font-weight:800;font-size:13.5px;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .cbtns button>*{pointer-events:none}
  .cbtns .ok{flex:1;background:var(--brand);color:#04120c}
  .cbtns .no{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:76px;background:#e9f5ee;color:#0f1512;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:80;opacity:0;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .toast.show{opacity:1} .toast.bad{background:#f4d9d4}
</style>
<script src="/embed-child.js"></script>
</head>
<body>
<header>
  <a class="back" href="/soypepe/index.html">‹</a>
  <div class="ava">🔧</div>
  <div><h1>Eloy Queda</h1><div class="sub">Mantenimiento</div></div>
  <button class="pendbtn" id="pendBtn" title="Reportes por confirmar" style="margin-left:auto">✅ Por confirmar<span class="bdg" id="pendBdg">0</span></button>
  <select id="prop" title="Propiedad" style="margin-left:8px">
    <option value="45e69775-d877-4507-a9e1-a45bd3400dc5">CDMX</option>
    <option value="3e10a9ea-4913-4f7c-86ef-0c829caa851d">Virreyes</option>
    <option value="febfbef6-7fd1-4b45-84d9-13533e8dcb72">Puebla</option>
  </select>
</header>

<div id="feed"><div id="login" style="display:none">Abre esto desde Soy Pepe (con tu sesión iniciada).<br><a href="/m/mensajes.html">Ir a Soy Pepe</a></div></div>

<div id="fotoTag"><span id="fotoName">📎 Foto adjunta</span><button type="button" id="fotoClear">quitar</button></div>
<input type="file" id="fotoFile" accept="image/*" style="display:none">
<form id="form" style="display:none">
  <button type="button" class="foto-btn" id="fotoToggle" title="Adjuntar foto">📷</button>
  <textarea id="txt" rows="1" placeholder="Escribe qué se descompuso…"></textarea>
  <button class="send" id="send" type="submit">➤</button>
</form>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const ELOY='eloy.queda@casapepe.mx';
let ME=null, prop=$('prop').value, pendingFoto=null, PEND=[];
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
function toast(m,ok=true){const el=$('toast');el.textContent=m;el.className='toast show'+(ok?'':' bad');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),3000);}

const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function bubble(m){
  const mine=(m.autor_email||'').toLowerCase()!==ELOY;
  const foto=(m.fotos&&m.fotos.length)?`<img src="${esc(m.fotos[0])}" alt="foto">`:'';
  return `<div class="b ${mine?'me':'eloy'}">${mine?'':'<div class="who">Eloy Queda</div>'}${esc(m.cuerpo||'')}${foto}</div>`;
}
let sending=false;
function render(msgs, ticket, resumen){
  let html = (msgs||[]).map(bubble).join('');
  if(ticket) html += `<div class="tk">✅ Ticket registrado</div>`;
  if(resumen && !ticket) html += resumenCard(resumen);
  $('feed').innerHTML = html;
  if(resumen && !ticket) wireResumen(resumen);
  appendPend();
  $('feed').scrollTop = $('feed').scrollHeight;
}

// ---- Reportes por confirmar (los que TÚ abriste y ya fueron atendidos) ----
function confirmCard(t){
  const area=t.ubic&&t.ubic.nombre?t.ubic.nombre:'—';
  const rep=t.reportado_por_nombre?(' · por '+t.reportado_por_nombre):'';
  const foto=t.foto_resuelto_url?`<img loading="lazy" src="${esc(t.foto_resuelto_url)}" alt="terminado">`:'<div class="cnote">El técnico no adjuntó foto.</div>';
  return `<div class="confirm" data-tk="${esc(t.id)}">
    <div class="chead"><span class="ci">✅</span><span style="min-width:0"><span class="ct">${esc(t.titulo||'Reporte')}</span><span class="cm">📍 ${esc(area)}${esc(rep)} · atendido, revísalo y ciérralo</span></span></div>
    <details class="cver"><summary>📷 Ver cómo quedó${t.comentario_cierre?' y nota':''}</summary>
      ${t.comentario_cierre?`<div class="cnote">🛠️ ${esc(t.comentario_cierre)}</div>`:''}
      ${foto}
    </details>
    <div class="cbtns"><button class="ok" onclick="cpConfirmar('${esc(t.id)}')">✅ Sí, quedó — finalizar</button><button class="no" onclick="cpReabrir('${esc(t.id)}')">↩︎ No quedó</button></div>
  </div>`;
}
function appendPend(){ if(!PEND.length) return; const feed=$('feed');
  feed.insertAdjacentHTML('beforeend', `<div class="confhd">✅ Por confirmar — tú los abriste y ya fueron atendidos</div>`+PEND.map(confirmCard).join('')); }
function renderPend(){ const feed=$('feed'); feed.querySelectorAll('.confirm,.confhd').forEach(n=>n.remove()); appendPend(); feed.scrollTop=feed.scrollHeight; }
function updatePendBadge(){ const b=$('pendBtn'); if(!b)return; b.style.display='inline-flex'; $('pendBdg').textContent=PEND.length; b.classList.toggle('has',PEND.length>0); }
async function loadPend(){ if(!ME)return; try{
  const {data}=await sb.from('mtto_tickets')
    .select('id,titulo,foto_resuelto_url,comentario_cierre,reportado_por_nombre,asignado_a,asignado_nombre,resuelto_at,ubic:ubicacion_id(nombre)')
    .eq('reportado_por',ME.id).eq('estado','resuelto').order('resuelto_at',{ascending:false});
  PEND=data||[]; }catch(_){ PEND=[]; } updatePendBadge(); }
function quitarPend(id){ PEND=PEND.filter(x=>x.id!==id); updatePendBadge();
  const n=document.querySelector('.confirm[data-tk="'+id+'"]'); if(n)n.remove();
  if(!PEND.length){ const h=document.querySelector('.confhd'); if(h)h.remove(); } }
async function notifTec(empId,titulo,cuerpo){ if(!empId)return; try{
  const {data:el}=await sb.from('empleado_login').select('user_id').eq('employee_id',empId).maybeSingle();
  if(el&&el.user_id){ await sb.from('notificaciones').insert({employee_id:empId,user_id:el.user_id,titulo,cuerpo,icono:'🔧',accion:{url:'/m/mis-mtto.html',tipo:'mtto_cierre'},leido:false}); }
}catch(_){} }
window.cpConfirmar=async id=>{
  const t=PEND.find(x=>x.id===id)||{};
  const {error}=await sb.from('mtto_tickets').update({estado:'cerrado',cerrado_at:new Date().toISOString(),cerrado_por:ME.id,cerrado_por_nombre:(ME.email||'')}).eq('id',id);
  if(error){ toast('No se pudo: '+error.message,false); return; }
  notifTec(t.asignado_a,'✅ Reporte confirmado',(t.titulo||'Trabajo')+' — el reportante lo dio por bueno.');
  quitarPend(id); toast('¡Listo! Reporte finalizado ✅');
};
window.cpReabrir=async id=>{
  const t=PEND.find(x=>x.id===id)||{};
  const {error}=await sb.from('mtto_tickets').update({estado:'programado',resuelto_at:null,foto_resuelto_url:null,semana_programada:mondayOf(new Date()),dia_programado:null,comentario_cierre:'El reportante indicó que no quedó bien; se reabre.'}).eq('id',id);
  if(error){ toast('No se pudo: '+error.message,false); return; }
  notifTec(t.asignado_a,'↩️ Reporte reabierto',(t.titulo||'Trabajo')+' — el reportante dice que no quedó bien.');
  quitarPend(id); toast('Se reabrió y volverá al plan del técnico.');
};
function resumenCard(r){
  const fila=(k,v,cap)=> v?`<dt>${k}</dt><dd class="${cap?'cap':''}">${esc(v)}</dd>`:'';
  const foto=r.foto?`<dt>Foto</dt><dd><img src="${esc(r.foto)}" alt="foto"></dd>`:'';
  return `<div class="resumen" id="resumenCard">
    <h3>📋 Resumen del ticket</h3>
    <dl>
      ${fila('Ubicación', r.propiedad)}
      ${fila('Área', r.area)}
      ${fila('Clasificación', r.clasificacion, true)}
      ${fila('Estado', r.estado||'nuevo', true)}
      ${fila('Título', r.titulo)}
      ${fila('Descripción', r.descripcion)}
      ${fila('Recomendación', r.recomendacion)}
      ${foto}
    </dl>
    <button class="enviar" id="enviarTicket">Enviar ticket ✅</button>
    <button class="cancelar" id="cancelarTicket">Todavía no, seguir editando</button>
  </div>`;
}
function wireResumen(r){
  const btn=$('enviarTicket');
  $('cancelarTicket').onclick=()=>{ $('resumenCard')?.remove(); };
  btn.onclick=async()=>{
    if(sending) return; sending=true;
    btn.disabled=true; btn.textContent='Enviando…';
    try{
      const d=await call('crear_ticket', { resumen:r });
      render(d.messages||[], d.ticket);
    }catch(err){
      btn.disabled=false; btn.textContent='Enviar ticket ✅';
      $('feed').insertAdjacentHTML('beforeend','<div class="b eloy">No pude registrar el ticket: '+esc(err.message)+'</div>');
      $('feed').scrollTop=$('feed').scrollHeight;
    }finally{ sending=false; }
  };
}
async function call(action, extra){
  const { data, error } = await sb.functions.invoke('eloy-queda', { body:{ action, property_id: prop, ...(extra||{}) } });
  if(error){ throw new Error(error.message); }
  if(data && data.error){ throw new Error(data.error); }
  return data;
}
async function boot(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ $('login').style.display=''; return; }
  ME=session.user; $('form').style.display='flex';
  try{ const d=await call('open'); render(d.messages||[]); }
  catch(e){ $('feed').innerHTML='<div id="login">Error: '+esc(e.message)+'</div>'; }
  try{ await loadPend(); renderPend(); }catch(_){}
}
$('pendBtn').onclick=async()=>{ await loadPend(); renderPend(); if(!PEND.length) toast('No tienes reportes por confirmar 👍'); };
$('prop').onchange=()=>{ prop=$('prop').value; };
$('txt').addEventListener('input',()=>{ $('txt').style.height='auto'; $('txt').style.height=Math.min(120,$('txt').scrollHeight)+'px'; });

// ---- foto real (bucket buzon) ----
$('fotoToggle').onclick=()=>$('fotoFile').click();
$('fotoClear').onclick=()=>{ pendingFoto=null; $('fotoTag').style.display='none'; $('fotoToggle').classList.remove('on'); };
$('fotoFile').onchange=async()=>{
  const f=$('fotoFile').files[0]; if(!f) return;
  $('fotoToggle').textContent='…';
  try{
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    const path='mtto/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.'+ext;
    const { error }=await sb.storage.from('buzon').upload(path, f, { contentType:f.type||'image/jpeg', upsert:false });
    if(error) throw error;
    pendingFoto=sb.storage.from('buzon').getPublicUrl(path).data.publicUrl;
    $('fotoName').textContent='📎 '+(f.name||'foto');
    $('fotoTag').style.display='flex'; $('fotoToggle').classList.add('on');
  }catch(e){ $('feed').insertAdjacentHTML('beforeend','<div class="b eloy">No pude subir la foto: '+esc(e && (e.message||e.error||JSON.stringify(e)))+'</div>'); $('feed').scrollTop=$('feed').scrollHeight; }
  $('fotoToggle').textContent='📷'; $('fotoFile').value='';
};

$('form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const text=$('txt').value.trim(); const foto=pendingFoto;
  if(!text && !foto) return;
  $('send').disabled=true;
  const feed=$('feed');
  feed.insertAdjacentHTML('beforeend', bubble({autor_email:ME.email,cuerpo:text||'(foto)',fotos:foto?[foto]:null}));
  feed.insertAdjacentHTML('beforeend', '<div class="typing" id="typing">Eloy está escribiendo…</div>');
  feed.scrollTop=feed.scrollHeight;
  $('txt').value=''; $('txt').style.height='auto';
  pendingFoto=null; $('fotoTag').style.display='none'; $('fotoToggle').classList.remove('on');
  try{ const d=await call('send',{ text, foto }); render(d.messages||[], d.ticket, d.resumen); }
  catch(err){ $('typing')?.remove(); feed.insertAdjacentHTML('beforeend','<div class="b eloy">Uy, algo falló: '+esc(err.message)+'</div>'); }
  finally{ $('send').disabled=false; }
});
boot();
</script>
</body>
</html>
