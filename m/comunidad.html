<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>La comunidad · Sincrético</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  LA COMUNIDAD · D1 el listado y D2 la ficha.
  Javi, 26-oct-2026.

  Sustituye a tres listados que decian casi lo mismo -Touroperadores,
  Productoras y parte de Hoteles asociados- y que por existir por separado
  hicieron que Barrio Hostel estuviera dado de alta tres veces y Cafe Cumbre
  dos. Aqui cada quien sale UNA vez, con sus pastillas de capacidad.

  TODO SE EDITA DESDE AQUI. Es la regla que Javi puso por encima de las demas:
  los portales de fuera son comodidad, no el unico sitio donde vive un dato.
  Cualquier cosa que el ateneista puede escribir en su portal, el equipo la
  puede ver y cambiar desde esta ficha -y queda anotado quien la capturo.

  EL NOMBRE Y LAS PASTILLAS NO SE PISAN. En el diseno se encabalgaban: el
  nombre a dos lineas y la pastilla de capacidad encima de la segunda. Aqui el
  nombre manda y las pastillas van debajo, en su propia linea, con min-width:0
  para que un nombre largo recorte y no empuje.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}

.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px}

.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}

.filtros{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;gap:10px;margin-bottom:10px}
.filtros input,.filtros select{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.caps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.capf{cursor:pointer;border:1.5px solid var(--linea);background:#fff;border-radius:999px;padding:6px 13px;
  font:600 11.5px Oswald;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);display:flex;gap:7px;align-items:center}
.capf i{width:7px;height:7px;border-radius:50%;background:var(--tenue)}
.capf b{font:600 11.5px Inter;color:var(--tinta)}
.capf.on{border-color:var(--tinta);background:var(--tinta);color:#fff}
.capf.on b{color:#fff}
.capf[data-k=experiencias] i{background:var(--naranja)}
.capf[data-k=eventos] i{background:var(--magenta)}
.capf[data-k=hotel] i{background:var(--cielo)}
.capf[data-k=artesania] i{background:var(--artesania)}
.capf[data-k=membresia] i{background:var(--ok)}

/* LA FILA. El nombre en su linea, las pastillas en la suya: no se pisan. */
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:center;padding:13px 15px;margin-bottom:10px;cursor:pointer}
.fila:hover{border-color:var(--tenue)}
.ini{flex:0 0 42px;height:42px;border-radius:50%;background:var(--hueso);display:grid;place-items:center;
  font:700 13px Oswald;letter-spacing:.04em;color:var(--gris)}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
.fila .num{flex:0 0 auto;font:400 13px Inter;color:var(--gris);text-align:right}
.fila .estado{flex:0 0 auto;display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:230px}
.fila .ir{flex:0 0 auto;color:var(--tenue);font-size:18px}

.p{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
/* LOS COLORES DE LAS CAPACIDADES VIVEN EN /m/cp-ui.js.
   Aqui estaban copiados, y el azul del hotel ya se habia separado del de las
   otras pantallas: #1a5f85 aqui, #2F6E93 alla. Nadie lo decidio. */
.p.activo{background:var(--ok-bg);color:var(--ok)}
.p.amedias{background:var(--alerta-bg);color:var(--alerta)}
.p.baja{background:var(--error-bg);color:var(--error)}
.p.bloquea{background:var(--error-bg);color:var(--error)}
.p.avisa{background:var(--alerta-bg);color:var(--alerta)}
.p.ok{background:var(--ok-bg);color:var(--ok)}
.p.prodf{background:#F2E7F2;color:#7A4E7A}
.estados{display:flex;flex-wrap:wrap;gap:7px;margin:0 0 12px}
.estados button{cursor:pointer;font:600 11px Oswald;letter-spacing:.07em;text-transform:uppercase;
  border:1.5px solid var(--linea);background:#fff;color:var(--gris);border-radius:999px;padding:6px 13px}
.estados button:hover{border-color:var(--gris)}
.estados button.on{border-color:var(--naranja,#C9501A);background:var(--naranja,#C9501A);color:#fff}

.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:30px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 15px Inter;color:var(--tinta);margin-bottom:5px}
.vacio span{font:400 13px/1.55 Inter}

/* ---------- la ficha ---------- */
.volver{background:none;border:0;cursor:pointer;font:600 12px Oswald;letter-spacing:.06em;color:var(--gris);padding:0;margin-bottom:10px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--linea);margin:14px 0 16px;overflow:auto}
.tab{cursor:pointer;padding:10px 13px;border-bottom:3px solid transparent;white-space:nowrap;
  font:600 12px Oswald;letter-spacing:.06em;color:var(--gris)}
.tab.on{border-bottom-color:var(--naranja);color:var(--tinta)}
.tarj{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:var(--sombra)}
.tarj h3{font:700 15px Oswald;letter-spacing:.05em;text-transform:uppercase;margin:0 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.campo{display:flex;flex-direction:column;gap:5px;min-width:0}
.campo .et{font:600 10.5px Oswald;letter-spacing:.09em;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;width:100%;background:#fff}
.campo .ay{font:400 11.5px Inter;color:var(--tenue)}
.lin{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid #F3EFE9}
.lin:first-child{border-top:0}
.lin .t{flex:1;min-width:0}
.lin .t b{display:block;font:600 13.5px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lin .t span{font:400 11.5px Inter;color:var(--gris)}
.aviso{border-radius:9px;padding:10px 12px;font:400 13px/1.55 Inter;margin-bottom:12px}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.alerta{background:var(--alerta-bg);color:var(--alerta)}
.aviso.err{background:var(--error-bg);color:var(--error)}
.aviso.info{background:var(--cielo-suave);color:#1a5f85}
.papel{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--linea)}
.papel:first-child{border-top:0}
.papel .t{flex:1;min-width:0}
.papel .t b{font:600 14px Inter}
.papel .t span{display:block;font:400 12.5px Inter;color:var(--gris);margin-top:3px}
.papel .t .cuando{color:var(--tenue);font-size:11.5px}
.papel .acc{display:flex;gap:7px;align-items:center;flex-wrap:wrap;flex:0 0 auto}
.papel .acc input[type=date]{border:1.5px solid var(--linea);border-radius:8px;padding:5px 8px;font-size:12.5px;background:#fff}
.papel label.btn{cursor:pointer;margin:0}
.btn.rojo{border-color:var(--error);color:var(--error)}
.btn.rojo:hover{background:var(--error);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font:500 13px Inter;z-index:90;display:none;box-shadow:var(--sombra)}
@media(max-width:820px){
  .filtros{grid-template-columns:1fr 1fr}
  .g2{grid-template-columns:1fr}
  .fila{flex-wrap:wrap}
  .fila .num,.fila .estado{max-width:none;width:100%;justify-content:flex-start;text-align:left}
}

/* ---------- el cajón lateral ----------
   Javi, 27-oct-2026: «puedes meter en el cajón la info que está en esta
   pantalla y así ya te evitas otra pantalla». Tocar una fila abría la ficha
   entera y te sacaba de la lista: lo que costó poner el filtro se perdía por
   ir a mirar una cosa. */
.velo{position:fixed;inset:0;background:rgba(30,26,22,.4);z-index:50;display:none}
.velo.on{display:block}
.cajon{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--papel,#FBF7F2);
  z-index:51;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;
  box-shadow:-20px 0 50px -30px rgba(30,26,22,.7)}
.cajon.on{transform:none}
.cajon .ch{padding:18px 18px 12px;border-bottom:1px solid var(--linea,#E6DFD6);background:#fff;
  position:sticky;top:0;z-index:2}
.cajon .ch h2{font-size:17px;font-weight:700;margin:0;padding-right:34px}
.cajon .cdon{color:var(--gris,#6E665C);font-size:12.5px;margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cajon .cerrar{position:absolute;top:15px;right:16px;border:1px solid var(--linea,#E6DFD6);background:#fff;
  border-radius:8px;width:29px;height:29px;cursor:pointer;color:var(--gris,#6E665C);font-size:16px;line-height:1}
.cajon .cc{padding:16px 18px 44px;display:flex;flex-direction:column;gap:13px}
.cajon .logo{width:100%;aspect-ratio:16/9;object-fit:contain;border-radius:11px;background:#fff;
  border:1px solid var(--linea,#E6DFD6);padding:10px}
.cbloque{background:#fff;border:1px solid var(--linea,#E6DFD6);border-radius:11px;padding:13px 14px}
.cbloque h3{font-family:Oswald,system-ui,sans-serif;font-weight:600;font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--gris,#6E665C);margin:0 0 9px}
.cdato{display:flex;gap:10px;padding:5px 0;font-size:13px;border-top:1px solid #F2EDE5}
.cbloque .cdato:first-of-type{border-top:0}
.cdato .k{color:var(--gris,#6E665C);flex:0 0 120px}
.cdato .v{flex:1;min-width:0;word-break:break-word}
.cacc{display:flex;flex-wrap:wrap;gap:7px}
.cacc .btn{font-size:12px;padding:8px 13px}
.cacc .rojo{border-color:#C9796C;color:#9E3B2E}
.cacc .rojo:hover{background:#F6E1DD}
.cmini{font-size:12px;color:var(--gris,#6E665C);line-height:1.5;margin-top:8px}
</style></head>
<body>
<div class="wrap" id="app"><div class="vacio"><b>Abriendo la comunidad…</b></div></div>
<div class="velo" id="velo"></div>
<aside class="cajon" id="cajon" aria-hidden="true">
  <div class="ch">
    <button class="cerrar" id="cCerrar" aria-label="Cerrar">&times;</button>
    <h2 id="cNom">—</h2>
    <div class="cdon" id="cDon"></div>
  </div>
  <div class="cc" id="cCuerpo"></div>
</aside>
<div class="toast" id="toast"></div>

<script src="/m/cp-ui.js"></script>
<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, TODOS=[], F={q:'',estados:[],ciudad:'',falta:'',cap:''}, ABIERTA=null, TAB='resumen', YO='';

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function get(q){return fetch(SB+'/rest/v1/'+q,{headers:hdr()}).then(function(r){return r.ok?r.json():[];});}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}
function ini(n){return String(n||'?').split(/\s+/).slice(0,2).map(function(w){return w[0]||'';}).join('').toUpperCase();}

/* La lista local solo aporta el ORDEN y las claves: los nombres salen de
   cp-ui.js, que es donde viven los dos -la cosa y quien la trae-. Tener
   aqui una segunda copia de los nombres es como empezaron a separarse los
   azules del hotel. */
var CAPS = (window.CP && CP.CAPS)
  ? CP.CAPS.map(function(c){ return [c[0], c[1]]; })
  /* Si cp-ui.js no cargara, la pantalla sigue en pie con las claves: un
     <script> que falta no puede dejar la comunidad en blanco. */
  : [['experiencias',''],['eventos',''],['hotel',''],['artesania',''],['membresia','']];
function capNom(k){ return CP.capNom(k); }

/* Lo que le falta, con las palabras del candado de la base: no se reinventa
   aqui ni se adivina. */
function bloquea(a){ try{ return (a.candado&&a.candado.bloquea)||[]; }catch(_){ return []; } }
function avisos(a){ try{ return (a.candado&&a.candado.avisa)||[]; }catch(_){ return []; } }
function comoVa(a){
  if(String(a.estado||'')==='baja') return ['baja','Baja'];
  if(bloquea(a).length) return ['amedias','A medias'];
  return ['activo','Activo'];
}

/* ---------- D1 · el listado ---------- */
function pasa(a){
  if(F.cap && (a.capacidades||[]).indexOf(F.cap)<0) return false;
  if(F.estados.length && F.estados.indexOf(comoVa(a)[0])<0) return false;
  if(F.ciudad && String(a.ciudad||'')!==F.ciudad) return false;
  if(F.falta && !bloquea(a).some(function(b){return b.clave===F.falta;})) return false;
  if(F.q){
    var t=(a.nombre_comercial+' '+(a.rfc||'')+' '+(a.curp||'')+' '+(a.email||'')).toLowerCase();
    if(t.indexOf(F.q.toLowerCase())<0) return false;
  }
  return true;
}
function listado(){
  var L=TODOS.filter(pasa);
  var act=TODOS.filter(function(a){return comoVa(a)[0]==='activo';}).length;
  var med=TODOS.filter(function(a){return comoVa(a)[0]==='amedias';}).length;
  var ciudades=[];
  TODOS.forEach(function(a){ if(a.ciudad && ciudades.indexOf(a.ciudad)<0) ciudades.push(a.ciudad); });
  ciudades.sort();

  var h='<div class="encab"><div><h1>La comunidad</h1>'+
    '<div class="cuenta"><b>'+TODOS.length+'</b> en la comunidad · <b>'+act+'</b> activos · <b>'+med+'</b> a medias</div></div>'+
    '<div class="der"><button class="btn" id="bLiga">Mandar liga de alta</button></div></div>'+
    '<div class="filtros">'+
      '<input id="fq" placeholder="Nombre, RFC o correo" value="'+esc(F.q)+'">'+

      '<select id="fc"><option value="">Todas las ciudades</option>'+
        ciudades.map(function(c){return '<option'+(F.ciudad===c?' selected':'')+'>'+esc(c)+'</option>';}).join('')+'</select>'+
      '<select id="ff"><option value="">Le falte lo que sea</option>'+
        ['identidad:RFC o CURP','correo:Correo','telefono:Teléfono','convenio:Convenio','cobro:Stripe'].map(function(x){
          var p=x.split(':'); return '<option value="'+p[0]+'"'+(F.falta===p[0]?' selected':'')+'>Le falta: '+p[1]+'</option>';}).join('')+'</select>'+
    '</div>'+
    /* VARIOS ESTADOS A LA VEZ. Javi, 27-oct-2026: «hazme el mismo filtro en la
       comunidad de poder seleccionar varios estados». Es el mismo caso que en
       Productos: casi nunca se quiere ver «sólo los de baja», se quiere ver
       «los que no están listos», que son dos estados. Con un desplegable de
       una opción eso no se puede pedir. Ninguno marcado es todos. */
    '<div class="estados" id="festados">'+
      [['activo','Activos'],['amedias','A medias'],['baja','Baja']].map(function(e){
        return '<button type="button" data-e="'+e[0]+'"'+(F.estados.indexOf(e[0])>=0?' class="on"':'')+'>'+e[1]+'</button>';
      }).join('')+'</div>'+
    '<div class="caps">'+CAPS.map(function(c){
      var n=TODOS.filter(function(a){return (a.capacidades||[]).indexOf(c[0])>=0;}).length;
      /* Esta lista es de GENTE, asi que el chip dice como se llama quien trae
         esa capacidad: «Productoras», no «Eventos». Decia «Eventos 6» y
         salian hoteles -el nombre prometia eventos y entregaba personas-. */
      return '<div class="capf'+(F.cap===c[0]?' on':'')+'" data-k="'+c[0]+'"><i></i>'+esc(window.CP&&CP.capQuien?CP.capQuien(c[0]):c[0])+' <b>'+n+'</b></div>';}).join('')+'</div>';

  h+='<div id="filas"></div>';
  $('app').innerHTML=h;
  enlazaFiltros();
  repinta();
  return;
}

/* EL BUSCADOR NO SE PUEDE REPINTAR A SÍ MISMO. Javi, 26-oct-2026: «pones una
   letra y te saca y hay que volver a clicar». Era eso: cada tecla repintaba
   TODO el contenedor —filtros incluidos—, así que el navegador tiraba el
   input en el que estabas escribiendo y con él el cursor. Ahora la cabecera y
   los filtros se pintan una vez, y al teclear sólo se repintan las filas. */
function repinta(){
  var caja=$('filas'); if(!caja) return;
  var L=TODOS.filter(pasa);
  /* Los contadores de capacidad no se tocan: cuentan la comunidad entera, no
     el filtro, y moverlos al teclear haría parpadear números que no cambian. */
  Array.prototype.forEach.call(document.querySelectorAll('.capf'),function(d){
    d.classList.toggle('on', F.cap===d.getAttribute('data-k'));});

  var h='';
  if(!L.length){
    h= TODOS.length
      ? '<div class="vacio"><b>Nadie cuadra con ese filtro</b><span>Hay '+TODOS.length+' en la comunidad. Quita algún filtro y vuelven a salir.</span></div>'
      : '<div class="vacio"><b>Todavía no hay nadie</b><span>En cuanto alguien se dé de alta por su liga, aparece aquí.</span></div>';
  } else {
    h=L.sort(function(a,b){return String(a.nombre_comercial||'').localeCompare(String(b.nombre_comercial||''),'es');})
      .map(function(a){
        var cv=comoVa(a), blo=bloquea(a);
        return '<div class="fila" data-id="'+a.id+'">'+
          '<div class="ini">'+esc(ini(a.nombre_comercial))+'</div>'+
          '<div class="mid">'+
            '<div class="nom"><b>'+esc(a.nombre_comercial||'(sin nombre)')+'</b>'+
              '<span class="p '+cv[0]+'">'+cv[1]+'</span></div>'+
            '<div class="pills">'+(a.capacidades||[]).map(function(k){
              return CP.pastilla(k,{quien:true});}).join(' ')+
              (a._prod?' <span class="p prodf">ficha de productora</span>':'')+'</div>'+
            '<div class="donde">'+esc(a.ciudad||'sin ciudad')+'</div>'+
          '</div>'+
          '<div class="num">'+(a.publicados||0)+' publicada'+((a.publicados||0)===1?'':'s')+'</div>'+
          '<div class="estado">'+(blo.length

async function abreCajon(id){
  var a=TODOS.filter(function(x){return x.id===id;})[0]; if(!a) return;
  CAJ=a;
  /* Una productora no tiene capacidades, ni equipo, ni convenio en estas
     tablas: todo eso cuelga de `tour_operadores` y su id no está ahí. Abrirle
     la ficha de ateneísta enseñaría secciones vacías y, peor, el botón de
     guardar escribiría contra una fila que no existe y contestaría que sí. */
  if(a._prod){ cajonProductora(a); return; }
  var cv=comoVa(a), blo=bloquea(a), avi=avisos(a);

  $('cNom').textContent=a.nombre_comercial||'(sin nombre)';
  $('cDon').innerHTML='<span class="p '+cv[0]+'">'+cv[1]+'</span> '

    get('hoteles?select=id,nombre_comercial,slug&ateneista_id=eq.'+id+'&order=nombre_comercial'),
    get('productoras?select=id,nombre_comercial&limit=1&id=eq.'+(a.productora_id||'00000000-0000-0000-0000-000000000000'))
  ]);
  var casas=r[0]||[], casa=casas[0]||null, prod=(r[1]||[])[0]||null;
  if(!CAJ || CAJ.id!==id) return;           /* lo cerró mientras cargaba */

  /* QUE CUELGA DE EL. Javi, 27-oct-2026: «no me deja borrar», y le salia el
     error crudo de Postgres -«Key is still referenced from table hoteles»-.
     La base ya lo impedia; lo que faltaba era decirlo antes y con palabras.
     No solo los productos: tambien sus casas, que es lo que le fallo. */
  var cuelga=[];
  if((a.productos||0)>0) cuelga.push('tiene '+a.productos+' producto'+(a.productos===1?'':'s'));
  if(casas.length) cuelga.push('tiene '+casas.length+' casa'+(casas.length===1?'':'s')+' colgando');

  function dato(k,v){ return (v==null||v==='') ? '' :
    '<div class="cdato"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

  var h='';
  if(a.logo_url) h+='<img class="logo" src="'+esc(a.logo_url)+'" alt="" onerror="this.remove()">';

  /* Lo primero, lo que lo frena: es la razón por la que alguien abre esto. */
  h+='<div class="cbloque"><h3>'+(blo.length?'Lo que lo frena':'Puede vender')+'</h3>'
    + (blo.length
       ? '<div class="pills">'+blo.map(function(b){return '<span class="p bloquea">🔒 '+esc(b.que)+'</span>';}).join('')+'</div>'
       : '<div class="cdato"><span class="v">Nada lo detiene. Lo que tenga publicado está a la venta.</span></div>')
    + (avi.length?'<div class="cmini">⚠ '+avi.map(function(b){return esc(b.que);}).join(' · ')+'</div>':'')
    + '</div>';

  h+='<div class="cbloque"><h3>De un vistazo</h3>'
    + dato('Productos', (a.productos||0)+' en total · '+(a.publicados||0)+' publicados')
    + dato('Cómo cobra', a.forma_pago==='stripe_connect'?'Su Stripe, en el momento de la venta'
            :(a.forma_pago==='dos_cobros'?'Anticipo con nosotros, resto en destino'
            :(a.forma_pago?esc(a.forma_pago):'sin definir')))
    + dato('Convenio', a.contrato_firmado_at?('firmado el '+String(a.contrato_firmado_at).slice(0,10)):'sin firmar')
    + dato('Reparto', a.com_vendedor_pct!=null
            ? (a.com_vendedor_pct+'% quien vende · '+(a.com_plataforma_pct||0)+'% plataforma · '+(a.com_hotel_pct||0)+'% casa')
            : 'sin fijar · mira su convenio')
    + dato('Correo', a.email?esc(a.email):null)
    + dato('WhatsApp', a.whatsapp?esc(a.whatsapp):null)
    + dato(a.curp?'CURP':'RFC', esc(a.rfc||a.curp||'')||null)
    + (casas.length?dato(casas.length===1?'Su casa':'Sus casas',
          casas.map(function(c){return esc(c.nombre_comercial);}).join(' · ')):'')
    + (prod?dato('Su productora', esc(prod.nombre_comercial)+' · ficha aparte'):'')
    + '</div>';

  /* UNA PUERTA, NO DOS. Si tiene casa, su portal es el del hotel, y desde
     ahí llega a sus experiencias; si no, el de experiencias. */
  var acc='';
  if(casa) acc+='<a class="btn sm" target="_top" href="/hotelero.html?h='+encodeURIComponent(casa.id)+'">Su portal ↗</a>';
  else     acc+='<a class="btn sm" target="_top" href="/operador.html?op='+encodeURIComponent(a.id)+'">Su portal ↗</a>';
  acc+='<button class="btn sm" type="button" id="cFicha">Ficha completa</button>';

  h+='<div class="cbloque"><h3>Qué hacer con esto</h3><div class="cacc">'+acc+'</div>'
    + '<div class="cacc" style="margin-top:9px">'
    + (String(a.estado||'')==='baja'

        : '<button class="btn sm" type="button" id="cBaja">Archivar</button>')
    + (cuelga.length

        : '<button class="btn sm rojo" type="button" id="cBorrar">Borrar</button>')

        : (String(a.estado||'')==='baja'

           : 'Archivar lo saca de la lista y conserva su historia. Borrar no se deshace.'))
    + '</div></div>';

  $('cCuerpo').innerHTML=h;

  $('cFicha').onclick=function(){ cierraCajon(); abre(a.id); };
  if($('cBaja'))   $('cBaja').onclick=function(){ cambiaEstado(a,'baja'); };
  if($('cAlta'))   $('cAlta').onclick=function(){ cambiaEstado(a,'activo'); };
  if($('cBorrar')) $('cBorrar').onclick=function(){ borraAteneista(a); };

async function cambiaEstado(a,estado){
  var r=await fetch(SB+'/rest/v1/tour_operadores?id=eq.'+a.id,
    {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
     body:JSON.stringify({estado:estado})});
  if(!r.ok){ avisa('No se pudo: '+(await r.text()).slice(0,90)); return; }
  a.estado=estado;
  fetch(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
    body:JSON.stringify({entidad:'ateneista',entidad_id:a.id,
      que:estado==='baja'?'archivado desde el panel':'reactivado desde el panel',quien:YO})}).catch(function(){});
  avisa(estado==='baja'?'Archivado':'Reactivado');
  repinta(); abreCajon(a.id);
}

async function borraAteneista(a){
  if((a.productos||0)>0){ avisa('Tiene productos colgando; archívalo en vez de borrarlo'); return; }
  if(!confirm('¿Borrar a '+(a.nombre_comercial||'')+'? No se puede deshacer.\n\nSi solo quieres que desaparezca de la lista, usa Archivar.')) return;
  var r=await fetch(SB+'/rest/v1/tour_operadores?id=eq.'+a.id,{method:'DELETE',headers:hdr()});
  if(!r.ok){
    var t=await r.text();
    /* El 23503 es «esto todavia lo usa otra tabla». Se dice con palabras. */
    avisa(t.indexOf('23503')>=0
      ? 'No se puede borrar: todavía hay cosas colgando de él. Archívalo.'
      : 'No se pudo borrar: '+t.slice(0,110));
    return;
  }
  TODOS=TODOS.filter(function(x){return x.id!==a.id;});
  cierraCajon(); avisa('Borrado'); listado();
}

var BUCKET='tercero-docs';   /* privado. Cada empresa alcanza su carpeta; la casa lee todo. */
var PAPELES=[
  {t:'identificacion',   n:'Identificación de quien responde', p:'INE, pasaporte o tarjeta de residente.'},
  {t:'constancia_fiscal',n:'Constancia de situación fiscal',   p:'La del SAT. Conviene que tenga menos de tres meses.'},
  {t:'poliza_rc',        n:'Póliza de responsabilidad civil',  p:'La carátula basta: aseguradora, número y vigencia.'},
  {t:'rnt',              n:'Registro Nacional de Turismo',     p:'La constancia que devolvió el registro.'},
  {t:'forma_migratoria', n:'Forma migratoria',                 p:'Sólo si no es mexicano. Con el pasaporte solo no basta.'},
  {t:'contrato_firmado', n:'Convenio firmado',                 p:'Lo sube la casa cuando lo firma.'}
];
var DOCS=[], FIRMADAS={};

function docDe(t){ for(var i=0;i<DOCS.length;i++) if(DOCS[i].tipo===t) return DOCS[i]; return null; }

/* La url guardada puede ser una liga de fuera -así lo dejaba su portal, que
   sólo pedía un enlace de Drive- o una ruta del bucket privado. Se distinguen
   por el http: no se adivina. */
function esRuta(u){ return !!u && !/^https?:\/\//i.test(String(u)); }
async function ligaDe(u){
  if(!u) return '';
  if(!esRuta(u)) return u;
  var ruta=String(u);
  if(ruta.indexOf(BUCKET+'/')===0) ruta=ruta.slice(BUCKET.length+1);
  if(FIRMADAS[ruta]) return FIRMADAS[ruta];
  try{
    var r=await fetch(SB+'/storage/v1/object/sign/'+BUCKET+'/'+ruta,
      {method:'POST',headers:hdr(),body:JSON.stringify({expiresIn:3600})});
    if(!r.ok) return '';
    var j=await r.json();
    var l=j&&j.signedURL?(SB+'/storage/v1'+j.signedURL):'';
    if(l) FIRMADAS[ruta]=l;
    return l;
  }catch(_){ return ''; }
}

async function pintaPapeles(){
  var caja=$('papeles'); if(!caja) return;
  var hoy=new Date().toISOString().slice(0,10);
  var filas=await Promise.all(PAPELES.map(async function(pp){
    var d=docDe(pp.t);
    var venc=d&&d.vigencia&&d.vigencia<hoy;
    var et = !d ? '<span class="p amedias">falta</span>'
           : (venc ? '<span class="p err">vencido</span>' : '<span class="p ok">listo</span>');
    var liga=d?await ligaDe(d.url):'';
    return '<div class="papel">'+
      '<div class="t"><b>'+esc(pp.n)+'</b> '+et+
        '<span>'+esc(pp.p)+'</span>'+
        (d?'<span class="cuando">Subido el '+String(d.created_at||'').slice(0,10)+
            (d.created_by?' por '+esc(d.created_by):'')+'</span>':'')+
      '</div>'+
      '<div class="acc">'+
        (liga?'<a class="btn sm gris" href="'+esc(liga)+'" target="_blank" rel="noopener">Abrir ↗</a>'
             :(d?'<span class="ay">no se pudo abrir</span>':''))+
        '<input type="date" data-vig="'+pp.t+'" value="'+esc(d&&d.vigencia||'')+'" title="Vigencia">'+
        '<label class="btn sm">'+(d?'Cambiar':'Subir')+
          '<input type="file" hidden data-sube="'+pp.t+'" accept="image/*,application/pdf"></label>'+
      '</div>'+
    '</div>';
  }));
  caja.innerHTML=filas.join('');
  Array.prototype.forEach.call(caja.querySelectorAll('[data-sube]'),function(inp){
    inp.onchange=function(){ if(inp.files&&inp.files[0]) subePapel(inp.getAttribute('data-sube'),inp.files[0]); };});
  Array.prototype.forEach.call(caja.querySelectorAll('[data-vig]'),function(inp){
    inp.onchange=function(){ guardaVigencia(inp.getAttribute('data-vig'),inp.value||null); };});
}

async function subePapel(tipo,file){
  if(!ABIERTA) return;
  if(file.size>15*1024*1024){ avisa('Ese archivo pasa de 15 MB. Mándalo más ligero.'); return; }
  var ext=((file.name||'x.pdf').split('.').pop()||'pdf').toLowerCase().replace(/[^a-z0-9]/g,'');
  var ruta='comunidad/'+ABIERTA.id+'/'+tipo+'-'+Date.now()+'.'+ext;
  avisa('Subiendo…');
  try{
    var r=await fetch(SB+'/storage/v1/object/'+BUCKET+'/'+ruta,{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+tok(),'x-upsert':'true',
               'Content-Type':file.type||'application/octet-stream'},body:file});
    if(!r.ok) throw new Error('el archivo no se guardó ('+r.status+')');
    var d=docDe(tipo), vigInp=$('papeles').querySelector('[data-vig="'+tipo+'"]');
    var cuerpo={url:ruta, nombre_archivo:file.name||null,
                vigencia:(vigInp&&vigInp.value)||null, created_by:YO||'el equipo'};
    var rr = d
      ? await fetch(SB+'/rest/v1/tour_operador_docs?id=eq.'+d.id,
          {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),body:JSON.stringify(cuerpo)})
      : await fetch(SB+'/rest/v1/tour_operador_docs',
          {method:'POST',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
           body:JSON.stringify(Object.assign({operador_id:ABIERTA.id,tipo:tipo},cuerpo))});
    if(!rr.ok) throw new Error('se subió el archivo pero no se apuntó ('+rr.status+')');
    var fila=(await rr.json())[0];
    if(d) DOCS=DOCS.map(function(x){return x.id===d.id?fila:x;}); else DOCS.push(fila);
    await fetch(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
      body:JSON.stringify({entidad:'ateneista',entidad_id:ABIERTA.id,que:'papel subido: '+tipo,
        quien:YO||'el equipo',detalle:{tipo:tipo,archivo:file.name||null}})}).catch(function(){});
    FIRMADAS={};
    await pintaPapeles();
    avisa('Guardado a nombre de '+(ABIERTA.nombre_comercial||'—')+' · subió '+(YO||'el equipo'));
  }catch(e){ avisa('No se pudo subir: '+((e&&e.message)||e)); }
}

async function guardaVigencia(tipo,vig){
  var d=docDe(tipo);
  if(!d){ avisa('Primero sube el archivo; luego le pones vigencia.'); return; }
  try{
    var r=await fetch(SB+'/rest/v1/tour_operador_docs?id=eq.'+d.id,
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),body:JSON.stringify({vigencia:vig})});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    d.vigencia=vig; await pintaPapeles(); avisa('Vigencia guardada');
  }catch(e){ avisa('No se pudo guardar la vigencia: '+((e&&e.message)||e)); }
}

/* BORRAR UNA FICHA NO ES UN DELETE. Javi, 26-oct-2026.
   La base NO lo frena: sinc_reservas.op_experiencia_id está en ON DELETE SET
   NULL, así que borrar una ficha con reservas no da error — deja las reservas
   vivas y sin saber de qué eran. Una venta que no sabe qué vendió es el mismo
   fallo que nos hizo dar por perdida la de Jorge Ruvalcaba. Así que se cuenta
   antes, y si hay reservas se dice que no con el número delante. */
async function borraProducto(id){
  var e=(DET.productos||[]).filter(function(x){return String(x.id)===String(id);})[0];
  if(!e) return;
  if(e.estado==='publicada'){ avisa('Está publicada. Quítala de la venta y luego se borra.'); return; }

  var res=null, sal=null;
  try{
    var r1=await fetch(SB+'/rest/v1/sinc_reservas?select=id&op_experiencia_id=eq.'+id+'&limit=1',
      {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
    if(!r1.ok) throw new Error('no pudimos contar sus reservas ('+r1.status+')');
    res=Number((r1.headers.get('content-range')||'/0').split('/')[1]||0);
    var r2=await fetch(SB+'/rest/v1/sinc_salidas?select=id&experiencia_id=eq.'+id,{headers:hdr()});
    sal=r2.ok?(await r2.json()).length:0;
  }catch(err){
    /* No se borra a ciegas: si no pudimos comprobar, no sabemos qué se lleva
       por delante. */
    avisa('No se borró: '+((err&&err.message)||err)+'. Sin poder comprobarlo, no lo toco.');
    return;
  }

  if(res>0){
    alert('«'+(e.nombre||'esta ficha')+'» tiene '+res+' reserva'+(res===1?'':'s')+' colgando.\n\n'+
          'Si la borras, esas reservas se quedan sin saber de qué eran. Pásala a anulada en vez de borrarla.');
    return;
  }

  var txt=prompt('Vas a borrar «'+(e.nombre||'esta ficha')+'».'+
    (sal?'\nSe van con ella '+sal+' salida'+(sal===1?'':'s')+' programada'+(sal===1?'':'s')+'.':'')+
    '\n\nEsto no se deshace. ¿Por qué se borra?');

ATA.cobro=function(){
  /* Cambiar la forma de cobro reescribe la pestaña: con su Stripe no se le
     piden los datos del banco, y al revés. Se repinta en el momento para que
     no tenga que guardar para enterarse. */
  var fp=document.querySelector('[data-c="forma_pago"]');
  if(fp) fp.onchange=function(){ ABIERTA.forma_pago=fp.value; ficha(); };

  $('bGuardaCobro').onclick=async function(){
    var b={};
    Array.prototype.forEach.call(document.querySelectorAll('[data-c]'),function(el){
      var k=el.getAttribute('data-c'), v=el.value;
      b[k] = v==='' ? null : (/_pct$/.test(k) ? Number(v) : v);});
    /* LA CLABE SON 18 DÍGITOS Y NO SE NEGOCIA. Una mal tecleada no da error al
       guardar: da error el día de la transferencia, con el dinero fuera. */
    if(b.clabe){
      var limpia=String(b.clabe).replace(/\D/g,'');
      if(limpia.length!==18){ avisa('La CLABE tiene '+limpia.length+' dígitos y tienen que ser 18. No se guardó nada.'); return; }
      b.clabe=limpia;
    }
    this.disabled=true; var ok=await guarda(b); this.disabled=false;
    if(ok){ await recarga(); await abre(ABIERTA.id); }
  };

  /* Comprobar contra Stripe: la ficha puede decir «vinculado» y Stripe decir
     que todavía no cobra. Manda Stripe. */
  var br=$('bStripeRevisar');
  if(br) br.onclick=async function(){
    this.disabled=true; var t=this.textContent; this.textContent='Preguntando a Stripe…';
    try{
      var r=await fetch(SB+'/functions/v1/stripe-revision',{method:'POST',headers:hdr(),
        body:JSON.stringify({accion:'revisar'})}).then(function(x){return x.json();});
      if(!r||!r.ok) avisa((r&&r.error)||'No se pudo comprobar.');
      else { await recarga(); await abre(ABIERTA.id); return; }
    }catch(e){ avisa('No se pudo comprobar: '+((e&&e.message)||e)); }
    this.disabled=false; this.textContent=t;
  };

  var bp=$('bStripePegar');
  if(bp) bp.onclick=async function(){
    var v=($('acctPegar').value||'').trim();
    if(!/^acct_[A-Za-z0-9]{8,}$/.test(v)){ avisa('Eso no tiene forma de cuenta de Stripe. Empieza por «acct_».'); return; }
    this.disabled=true; var t=this.textContent; this.textContent='Comprobando…';
    try{
      var r=await fetch(SB+'/functions/v1/stripe-revision',{method:'POST',headers:hdr(),
        body:JSON.stringify({accion:'pegar',tipo:'touroperador',id:ABIERTA.id,cuenta:v})})
        .then(function(x){return x.json();});
      if(!r||!r.ok){ avisa((r&&r.error)||'No se pudo guardar la cuenta.'); }
      else { await recarga(); await abre(ABIERTA.id); return; }
    }catch(e){ avisa('No se pudo guardar: '+((e&&e.message)||e)); }
    this.disabled=false; this.textContent=t;
  };
};

/* ---------- arranque ---------- */
/* LAS PRODUCTORAS VIVEN EN OTRA TABLA. Javi, 27-oct-2026: «no veo en
   comunidad a ninguna productora... ¿dónde están?».
   Estaban en `productoras`, veinte de ellas, y esta pantalla sólo leía
   `v_ateneistas`, que se arma sobre `tour_operadores`. El chip que decía
   «PRODUCTORAS 5» no las contaba a ellas: contaba los cinco ateneístas con la
   casilla de eventos puesta. La vista intenta emparejarlas por correo, y de
   las veinte sólo coinciden tres.
   Aquí se LEEN y se enseñan; no se fusiona nada. Mezclar las dos tablas es
   una decisión de datos que toca eventos, espacios, contratos y tokens de
   portal, y se toma despierto. Mientras tanto, al menos se ven, que es la
   diferencia entre una lista incompleta y una lista mentirosa. */
async function recarga(){
  var r=await Promise.all([
    get('v_ateneistas?select=*&order=nombre_comercial'),
    get('productoras?select=id,nombre_comercial,ciudad,estado,email,whatsapp,rfc,tipo,rol_ateneo,tour_operador_id,created_at&order=nombre_comercial')
  ]);
  var ate=r[0]||[], pro=r[1]||[];
  /* La que ya está ligada a un ateneísta no se repite: sería la misma persona
     dos veces y con dos fichas distintas. */
  var ligadas={}; pro.forEach(function(p){ if(p.tour_operador_id) ligadas[p.tour_operador_id]=true; });
  var sueltas=pro.filter(function(p){ return !p.tour_operador_id; }).map(function(p){
    return { id:p.id, _prod:true, nombre_comercial:p.nombre_comercial, ciudad:p.ciudad,
             estado:(p.estado==='activo'?'activo':'borrador'), email:p.email, whatsapp:p.whatsapp,
             rfc:p.rfc, tipo:p.tipo, created_at:p.created_at,
             capacidades:['eventos'], productos:0, publicados:0,
             candado:{bloquea: p.estado==='activo' ? [] : [{clave:'alta', que:'su alta sin terminar'}]} };
  });
  TODOS = ate.concat(sueltas);
}
(async function(){
  ses=sesionPanel();
  try{ YO=(ses&&ses.user&&ses.user.email)||''; }catch(_){}
  await recarga();
  if(!TODOS.length){
    $('app').innerHTML='<div class="vacio"><b>No pudimos traer la comunidad</b>'+
      '<span>Puede ser tu sesión. Vuelve a entrar al panel y abre otra vez esta pantalla.<br>'+
      'Si sigue vacía después de entrar, avísanos: no es lo mismo que no haya nadie.</span></div>';
    return;
  }
  listado();

  /* UNA LIGA QUE LLEVA A QUIEN DICE. Javi, 26-oct-2026: «cuando le da a ver
     Capital Bus te manda a ateneístas y no a su ficha directa».
     Desde Productos, el botón «Ver a …» traía ?id=<el operador> desde hace
     tiempo, y esta pantalla nunca miró la liga: abría el listado y ya. Es el
     peor tipo de enlace roto, porque carga bien: parece que llegaste y no
     llegaste, y encima tienes que buscar a mano a quien ya habías señalado.
     Ahora se lee. Si quien pide la liga no está en la comunidad -se dio de
     baja, o es de otra lista- se dice y se queda el listado: callarse sería
     volver a lo de antes. */
  var pide=''; try{ pide=new URLSearchParams(location.search).get('id')||''; }catch(_){}
  if(pide){
    if(TODOS.some(function(x){return x.id===pide;})) abre(pide);
    else avisa('Esa liga apunta a alguien que no está en la comunidad.');
  }
})();
</script>
