<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sábana de inventario · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.spacer{margin-left:auto}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 60px}
.center{text-align:center;color:var(--muted);padding:28px 10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--rule);font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:7px 11px;border-bottom:1px solid var(--rule);white-space:nowrap}
th{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700;background:var(--surface-3);position:sticky;top:0;z-index:1}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-3)}
.prod{white-space:normal;min-width:220px;font-weight:600}
.prod small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.btn{font:inherit;font-size:13.5px;font-weight:600;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);border-radius:9px;padding:8px 13px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{font-size:12.5px;padding:5px 10px}
select,input{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink)}
.barra{display:flex;gap:9px;flex-wrap:wrap;align-items:center;padding:4px 0 2px}
.barra input{flex:1 1 210px;max-width:300px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow)}
.kpi .n{font-size:1.45rem;font-weight:800;line-height:1.1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:2px}
.avisos{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:11px;padding:10px 13px;margin-top:12px;font-size:13.5px}
.avisos.mal{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}.c-n{background:var(--none-bg);color:var(--none)}
/* Los tramos: uno por inventario. El abierto va primero porque es el que se mira. */
.tramos{display:flex;gap:7px;flex-wrap:wrap;padding:10px 0 2px}
.tramo{border:1px solid var(--rule);background:var(--surface);border-radius:10px;padding:8px 12px;cursor:pointer;text-align:left}
.tramo:hover{border-color:var(--accent)}
.tramo.on{border-color:var(--accent);background:var(--accent-soft)}
.tramo b{display:block;font-size:13px}
.tramo small{color:var(--muted);font-size:11px}
td.dif.mas{color:var(--ok);font-weight:700}
td.dif.menos{color:var(--bad);font-weight:700}
tr.bajo td.fin{color:var(--bad);font-weight:800}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.45);display:none;z-index:60;align-items:center;justify-content:center;padding:16px}
.modal-bg.on{display:flex}
.modal{background:var(--ground);border-radius:14px;max-width:760px;width:100%;max-height:88vh;overflow:auto;padding:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:70;font-size:13.5px}
.toast.on{opacity:1;transform:translateX(-50%)}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand">📊 Sábana de inventario<small>Casa Pepe · entradas, salidas y saldos de cada bodega, corte a corte</small></div>
  <div class="spacer"></div>
  <span id="sedeBox"></span>
</div></div>

<div class="wrap" id="view"><div class="center">Cargando…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"\']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","\'":"&#39;"}[c]));
const num=n=>n==null?"—":Number(n).toLocaleString("es-MX",{maximumFractionDigits:3});
const fcorta=f=>f?new Date(f+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}):"";
const flarga=f=>f?new Date(f+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"long",year:"numeric"}):"";
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3000);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

let USER=null,EMAIL="",PROPS=[],SEDE=null,PUEDE=false;
let BODEGAS=[],BOD=null,SABANA=[],TRAMO=null,CONTEOS=[];
let F={q:"",solo:""};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; EMAIL=(USER.email||"").toLowerCase();
  try{ const {data}=await sb.rpc("permiso_efectivo",{p_email:EMAIL,p_pagina:"PAG-SERV-SABANA"}); PUEDE=(data==="editar"); }catch(_){}

  let props=(await sb.from("properties").select("id,nombre,pl_loc").not("pl_loc","is",null)).data||[];
  try{ const f=await cpAcceso.filtra(props,p=>p.nombre); if(f&&f.length) props=f; }catch(_){}
  PROPS=props.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!PROPS.length){ $("view").innerHTML='<div class="center">No tienes ninguna sede asignada.</div>'; return; }
  SEDE=await sedeInicial();
  pintaSede(); await cargaBodegas();
}
/* Sede de arranque.
   El panel ya tiene su selector de propiedad arriba y nos pasa ?proyecto=cdmx|puebla|virreyes:
   cuando viene de ahí, esa manda y aquí NO se repite el filtro (solo se dice en qué casa estamos).
   Suelto (atajo directo, ?tab=altas): la última que eligió, la suya, o la primera con catálogo. */
let MANDA_PANEL=false;
function proyDelPanel(){
  try{
    const q=new URLSearchParams(location.search).get("proyecto")||"";
    return (window.cpAcceso&&cpAcceso.toProy(q))||"";
  }catch(_){ return ""; }
}
// Soy Pepe no pasa ?proyecto=: su selector de arriba guarda la propiedad en cp_view_prop.
// Sin esto, el módulo abría en una casa distinta de la que dice el selector.
function sedeDeSoyPepe(){
  try{ return localStorage.getItem("cp_view_prop")||""; }catch(_){ return ""; }
}
async function sedeInicial(){
  let con=new Set();
  try{ const {data}=await sb.from("cmp_v_sedes_con_catalogo").select("property_id");
       con=new Set((data||[]).map(r=>r.property_id)); }catch(_){}
  const py=proyDelPanel();
  if(py){
    const m=PROPS.find(x=>{ try{ return cpAcceso.toProy(x.pl_loc)===py; }catch(_){ return false; } });
    // Corporativo y Sincrético no tienen catálogo de compras: ahí seguimos con selector propio.
    if(m && (!con.size || con.has(m.id))){ MANDA_PANEL=true; return m.id; }
  }
  const sp=sedeDeSoyPepe();
  if(sp && PROPS.some(p=>p.id===sp) && (!con.size || con.has(sp))){ MANDA_PANEL=true; return sp; }
  try{ const g=localStorage.getItem("cp_sede_compras"); if(g && PROPS.some(p=>p.id===g)) return g; }catch(_){}
  try{
    const {data}=await sb.from("employees").select("property_id").ilike("email",EMAIL).maybeSingle();
    const mia=data&&data.property_id;
    if(mia && PROPS.some(p=>p.id===mia) && (!con.size || con.has(mia))) return mia;
  }catch(_){}
  const conCat=PROPS.find(p=>con.has(p.id));
  return (conCat||PROPS[0]).id;
}
function recuerdaSede(id){ try{ localStorage.setItem("cp_sede_compras",id); }catch(_){} }
function pintaSede(){
  const nom=((PROPS.find(p=>p.id===SEDE)||PROPS[0])||{}).nombre||"";
  if(MANDA_PANEL || PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-n">${esc(nom)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="width:auto;min-width:170px">`+
    PROPS.map(p=>`<option value="${p.id}" ${p.id===SEDE?"selected":""}>${esc(p.nombre)}</option>`).join("")+`</select>`;
  $("selSede").onchange=e=>{SEDE=e.target.value;recuerdaSede(SEDE);recargar();};
}
function pintaSede(){
  const nom=((PROPS.find(p=>p.id===SEDE)||PROPS[0])||{}).nombre||"";
  if(MANDA_PANEL || PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-n">${esc(nom)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="min-width:170px">`+
    PROPS.map(p=>`<option value="${p.id}" ${p.id===SEDE?"selected":""}>${esc(p.nombre)}</option>`).join("")+`</select>`;
  $("selSede").onchange=e=>{SEDE=e.target.value;recuerdaSede(SEDE);BOD=null;cargaBodegas();};
}

/* Solo se ofrecen las bodegas que tienen algo que enseñar: o movimientos o
   inventarios. Una bodega vacía en la lista es una pérdida de tiempo. */
async function cargaBodegas(){
  $("view").innerHTML='<div class="center">Cargando bodegas…</div>';
  const {data}=await sb.from("pos_almacenes").select("id,nombre,area")
    .eq("property_id",SEDE).eq("activo",true).order("nombre");
  BODEGAS=data||[];
  if(!BODEGAS.length){ $("view").innerHTML='<div class="center">Esta sede no tiene bodegas dadas de alta.</div>'; return; }
  if(!BOD||!BODEGAS.some(b=>b.id===BOD)) BOD=BODEGAS[0].id;
  await cargaSabana();
}

async function cargaSabana(){
  $("view").innerHTML='<div class="center">Armando la sábana…</div>';
  const [s,c]=await Promise.all([
    sb.rpc("cmp_sabana_cortes",{p_bodega:BOD}),
    sb.from("cmp_conteos").select("id,fecha_conteo,estado,contado_por_nombre")
      .eq("bodega_id",BOD).order("fecha_conteo",{ascending:false})
  ]);
  if(s.error){ $("view").innerHTML='<div class="avisos mal">No se pudo armar la sábana: '+esc(s.error.message)+'</div>'; return; }
  SABANA=s.data||[]; CONTEOS=c.data||[];
  const ks=[...new Set(SABANA.map(r=>r.tramo))].sort((a,b)=>b-a);
  if(TRAMO==null||!ks.includes(TRAMO)) TRAMO=ks[0]!=null?ks[0]:null;
  render();
}

function render(){
  if(!SABANA.length){
    $("view").innerHTML=cabecera()+'<div class="card"><div class="center">'+
      'Esta bodega todavía no tiene ni un movimiento ni un inventario.<br>'+
      'En cuanto se reciba un pedido con destino aquí, o se cierre un conteo, aparece la sábana.</div></div>';
    return;
  }
  const tramos=[...new Map(SABANA.map(r=>[r.tramo,r])).values()].sort((a,b)=>b.tramo-a.tramo);
  const filas=SABANA.filter(r=>r.tramo===TRAMO).filter(pasa);
  const t=tramos.find(x=>x.tramo===TRAMO)||{};

  const bajo=filas.filter(r=>r.bajo_minimo && r.stock_min>0);
  const conDif=filas.filter(r=>r.diferencia!=null && Math.abs(+r.diferencia)>0.0001);
  const faltan=(+t.cerrado===0||t.cerrado===false)?0:0;
  const abiertos=CONTEOS.filter(c=>c.estado!=="cerrado");

  $("view").innerHTML=cabecera()
    +`<div class="tramos">${tramos.map(x=>`
       <button class="tramo ${x.tramo===TRAMO?"on":""}" onclick="TRAMO=${x.tramo};render()">
         <b>${x.cerrado?("Corte del "+fcorta(x.hasta)):"En curso"}</b>
         <small>${x.desde?("desde el "+fcorta(x.desde)):"desde el principio"}${x.cerrado?"":" · hasta hoy"}</small>
       </button>`).join("")}</div>

    <div class="kpis">
      <div class="kpi"><div class="n">${filas.length}</div><div class="l">productos en la bodega</div></div>
      <div class="kpi"><div class="n" style="color:${bajo.length?"var(--bad)":"var(--ok)"}">${bajo.length}</div><div class="l">bajo el mínimo · hay que pedir</div></div>
      <div class="kpi"><div class="n">${t.cerrado?conDif.length:"—"}</div><div class="l">con diferencia en el conteo</div></div>
      <div class="kpi"><div class="n">${t.cerrado?flarga(t.hasta):"abierto"}</div><div class="l">${t.cerrado?("contó "+esc((t.quien||"—").split("@")[0])):"sin cerrar todavía"}</div></div>
    </div>

    ${abiertos.length?`<div class="avisos">Hay ${abiertos.length} conteo(s) de esta bodega <b>sin cerrar</b>
      (${abiertos.slice(0,3).map(c=>fcorta(c.fecha_conteo)).join(", ")}${abiertos.length>3?"…":""}).
      Mientras no se cierren, lo que se contó no corrige el stock ni abre un corte nuevo.</div>`:""}

    ${!t.cerrado&&tramos.length===1?`<div class="avisos">Esta bodega todavía no tiene ningún inventario cerrado,
      así que la columna <b>inicial</b> arranca en cero y lo que ves es solo lo que ha entrado y salido.
      Al cerrar el primer conteo, la sábana parte de lo contado.</div>`:""}

    ${bajo.length?`<div class="avisos mal"><b>${bajo.length} producto(s) por debajo del mínimo.</b>
      ${esc(bajo.slice(0,6).map(r=>r.producto+" ("+num(r.teorico)+" de "+num(r.stock_min)+")").join(" · "))}${bajo.length>6?" …":""}</div>`:""}

    <div class="barra" style="margin-top:12px">
      <input id="q" placeholder="Buscar producto…" value="${esc(F.q)}"
             oninput="F.q=this.value;clearTimeout(window.__t);window.__t=setTimeout(render,250)">
      <select onchange="F.solo=this.value;render()">
        <option value="">Todos los productos</option>
        <option value="bajo"${F.solo==="bajo"?" selected":""}>Solo bajo mínimo</option>
        <option value="mov"${F.solo==="mov"?" selected":""}>Solo con movimiento</option>
        <option value="dif"${F.solo==="dif"?" selected":""}>Solo con diferencia</option>
      </select>
      <button class="btn ghost sm" onclick="descarga()">Descargar CSV</button>
    </div>

    <div class="card"><div class="scroll" style="max-height:calc(100vh - 430px)"><table>
      <thead><tr>
        <th class="prod">Producto</th><th class="num">Mínimo</th>
        <th class="num">Inicial</th><th class="num">Entradas</th><th class="num">Salidas</th>
        <th class="num">Teórico</th><th class="num">Contado</th><th class="num">Diferencia</th>
      </tr></thead>
      <tbody>${filas.length?filas.map(fila).join(""):'<tr><td colspan="8" class="center">Nada con ese filtro</td></tr>'}</tbody>
    </table></div></div>`;
}

function cabecera(){
  const b=BODEGAS.find(x=>x.id===BOD)||{};
  return `<div class="barra">
    <select onchange="BOD=this.value;TRAMO=null;cargaSabana()" style="min-width:230px">
      ${BODEGAS.map(x=>`<option value="${x.id}"${x.id===BOD?" selected":""}>${esc(x.nombre)}</option>`).join("")}
    </select>
    <span class="chip c-n">${esc(b.area||"bodega")}</span>
  </div>`;
}

function pasa(r){
  if(F.solo==="bajo" && !(r.bajo_minimo&&r.stock_min>0)) return false;
  if(F.solo==="mov"  && !(+r.entradas||+r.salidas)) return false;
  if(F.solo==="dif"  && !(r.diferencia!=null&&Math.abs(+r.diferencia)>0.0001)) return false;
  if(F.q && !String(r.producto||"").toLowerCase().includes(F.q.toLowerCase())) return false;
  return true;
}

function fila(r){
  const d=r.diferencia;
  const cls=d==null?"":(+d>0?"mas":(+d<0?"menos":""));
  const bajo=r.bajo_minimo&&r.stock_min>0;
  return `<tr class="${bajo?"bajo":""}">
    <td class="prod">${esc(r.producto)}<small>${esc(r.unidad||"")}${r.area?" · "+esc(r.area):""}</small></td>
    <td class="num">${r.stock_min>0?num(r.stock_min):"—"}</td>
    <td class="num">${num(r.inicial)}</td>
    <td class="num">${+r.entradas?("+"+num(r.entradas)):"—"}</td>
    <td class="num">${+r.salidas?("−"+num(r.salidas)):"—"}</td>
    <td class="num fin">${num(r.teorico)}</td>
    <td class="num">${r.contado==null?"—":num(r.contado)}</td>
    <td class="num dif ${cls}">${d==null?"—":((+d>0?"+":"")+num(d))}</td>
  </tr>`;
}

/* El CSV es para cruzarlo a mano contra el conteo en papel, que es lo que de verdad
   se hace el día del inventario. Punto y coma y BOM: así Excel en español lo abre
   en columnas sin que nadie tenga que importar nada. */
function descarga(){
  const b=BODEGAS.find(x=>x.id===BOD)||{};
  const t=SABANA.find(r=>r.tramo===TRAMO)||{};
  const filas=SABANA.filter(r=>r.tramo===TRAMO).filter(pasa);
  const cab=["Producto","Unidad","Área","Mínimo","Inicial","Entradas","Salidas","Teórico","Contado","Diferencia"];
  const esc2=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const cuerpo=filas.map(r=>[r.producto,r.unidad,r.area,r.stock_min,r.inicial,r.entradas,r.salidas,r.teorico,r.contado,r.diferencia].map(esc2).join(";"));
  const txt="\ufeff"+[cab.map(esc2).join(";")].concat(cuerpo).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([txt],{type:"text/csv;charset=utf-8"}));
  a.download="sabana-"+(b.nombre||"bodega").replace(/[^a-z0-9]+/gi,"-").toLowerCase()
    +"-"+(t.cerrado?t.hasta:"en-curso")+".csv";
  a.click(); URL.revokeObjectURL(a.href);
  toast("CSV descargado");
}

boot();
</script>
</body></html>
