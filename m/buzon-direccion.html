<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Buzón de Dirección · Casa Pepe</title>
<style>
:root{--bg:#faf7f1;--card:#fff;--txt:#16130f;--txt2:#5f5e5a;--bd:#e7e1d5;--accent:#16130f;--gold:#C9A227}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--bd);background:#fff;position:sticky;top:0;z-index:5}
.top h1{margin:0;font-size:19px}.top .sub{font-size:12.5px;color:var(--txt2)}
.btn{display:inline-block;padding:8px 12px;border:1px solid var(--bd);border-radius:9px;background:#fff;color:var(--txt);text-decoration:none;font-size:13px;font-weight:600;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:18px 16px 60px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.filters select,.filters input{padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:#fff;font-size:13px}
.kpis{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.kpi{flex:1;min-width:120px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px;text-align:center}
.kpi .v{font-size:22px;font-weight:800}.kpi .l{font-size:11px;color:var(--txt2);text-transform:uppercase;letter-spacing:.4px}
.item{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.item.nuevo{border-left:4px solid var(--gold)}
.item .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.item .nm{font-weight:800}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.tag.mejora{background:#eef4ff;color:#2e6fda}.tag.cita{background:#fff3d6;color:#8a6d1a}
.tag.sede{background:#f0efe9;color:#5f5e5a}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;margin-left:auto}
.st.nuevo{background:#fde8e8;color:#b03434}.st.leido{background:#eef;color:#556}.st.agendado{background:#e7f7ee;color:#1d9e75}.st.cerrado{background:#eee;color:#888}
.msg{font-size:14px;line-height:1.5;margin:6px 0;white-space:pre-wrap}
.cita-when{font-size:13px;font-weight:700;color:#8a6d1a;background:#fff8e8;border:1px solid #f0e3b8;border-radius:10px;padding:8px 10px;margin:8px 0}
.meta{font-size:12px;color:var(--txt2)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.acts .btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.acts .btn.cal{background:#1a73e8;color:#fff;border-color:#1a73e8}
.empty{text-align:center;color:var(--txt2);padding:40px 10px}
</style></head><body>
<div class="top">
  <div><h1>📬 Buzón de Dirección</h1><div class="sub">Ideas de mejora y solicitudes de cita del equipo · directo para Javi</div></div>
  <a href="/" class="btn">← Panel</a>
</div>
<div class="wrap">
  <div class="kpis">
    <div class="kpi"><div class="v" id="k-nuevos">—</div><div class="l">Nuevos</div></div>
    <div class="kpi"><div class="v" id="k-citas">—</div><div class="l">Citas pendientes</div></div>
    <div class="kpi"><div class="v" id="k-mejoras">—</div><div class="l">Ideas de mejora</div></div>
  </div>
  <div class="filters">
    <select id="f-tipo"><option value="">Todo</option><option value="mejora">Ideas / mejoras</option><option value="cita">Citas</option></select>
    <select id="f-estado"><option value="">Todos los estados</option><option value="nuevo">Nuevos</option><option value="leido">Leídos</option><option value="agendado">Agendados</option><option value="cerrado">Cerrados</option></select>
    <input id="f-txt" placeholder="Buscar nombre o texto…">
  </div>
  <div id="list"><div class="empty">Cargando…</div></div>
</div>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t)H.Authorization='Bearer '+_t;}}catch(e){}
const $=id=>document.getElementById(id);
let data=[];
function esc(s){s=(s==null?'':String(s));return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fdate(iso){return iso?new Date(iso).toLocaleString('es-MX',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';}
function frel(iso){if(!iso)return'';const s=Math.round((Date.now()-new Date(iso))/1000);if(s<3600)return'hace '+Math.max(1,Math.round(s/60))+' min';if(s<86400)return'hace '+Math.round(s/3600)+' h';return'hace '+Math.round(s/86400)+' d';}
function gcal(it){
  const t=encodeURIComponent('Cita con '+(it.nombre_display||'colaborador')+' · Casa Pepe');
  const z=x=>new Date(x).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const dt=z(it.cita_inicio)+'/'+z(it.cita_fin||it.cita_inicio);
  const det=encodeURIComponent('Reunión solicitada desde SoyPepe.'+(it.mensaje?('\n\nMotivo: '+it.mensaje):'')+(it.email?('\n\nContacto: '+it.email):''));
  const loc=encodeURIComponent('Oficina Casa Pepe');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+t+'&dates='+dt+'&details='+det+'&location='+loc;
}
async function patch(id,body){await fetch(SB+'/buzon_direccion?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({...body,updated_at:new Date().toISOString()})});const r=data.find(x=>x.id===id);if(r)Object.assign(r,body);render();}
function kpis(){
  $('k-nuevos').textContent=data.filter(x=>x.estado==='nuevo').length;
  $('k-citas').textContent=data.filter(x=>x.tipo==='cita'&&x.estado!=='cerrado').length;
  $('k-mejoras').textContent=data.filter(x=>x.tipo==='mejora').length;
}
function render(){
  kpis();
  const ft=$('f-tipo').value,fe=$('f-estado').value,fx=$('f-txt').value.trim().toLowerCase();
  const rows=data.filter(x=>(!ft||x.tipo===ft)&&(!fe||x.estado===fe)&&(!fx||((x.nombre_display||'')+' '+(x.mensaje||'')+' '+(x.sede||'')).toLowerCase().includes(fx)));
  if(!rows.length){$('list').innerHTML='<div class="empty">Sin mensajes por aquí.</div>';return;}
  $('list').innerHTML=rows.map(it=>{
    const cita=it.tipo==='cita';
    let acts='';
    if(it.estado==='nuevo')acts+='<button class="btn" data-act="leido" data-id="'+it.id+'">Marcar leído</button>';
    if(cita){acts+='<a class="btn cal" href="'+gcal(it)+'" target="_blank" rel="noopener">📅 Agendar en mi calendario</a>';
      if(it.estado!=='agendado')acts+='<button class="btn go" data-act="agendado" data-id="'+it.id+'">Confirmar cita</button>';}
    if(it.estado!=='cerrado')acts+='<button class="btn" data-act="cerrado" data-id="'+it.id+'">Cerrar</button>';
    return '<div class="item '+(it.estado==='nuevo'?'nuevo':'')+'">'
      +'<div class="h"><span class="nm">'+esc(it.nombre_display||'Colaborador')+'</span>'
      +'<span class="tag '+it.tipo+'">'+(cita?'🗓️ Cita':'💡 Mejora')+'</span>'
      +(it.sede?'<span class="tag sede">'+esc(it.sede)+'</span>':'')
      +'<span class="st '+it.estado+'">'+it.estado+'</span></div>'
      +(cita?'<div class="cita-when">Propone verse: '+fdate(it.cita_inicio)+'</div>':'')
      +(it.mensaje?'<div class="msg">'+esc(it.mensaje)+'</div>':(cita?'':'<div class="meta">(sin texto)</div>'))
      +'<div class="meta">'+esc(it.email||'')+' · '+frel(it.created_at)+'</div>'
      +'<div class="acts">'+acts+'</div></div>';
  }).join('');
  $('list').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>patch(b.dataset.id,{estado:b.dataset.act}));
}
['f-tipo','f-estado','f-txt'].forEach(id=>$(id).addEventListener('input',render));
(async()=>{
  try{const r=await fetch(SB+'/buzon_direccion?select=*&order=created_at.desc&limit=500',{headers:H});data=await r.json();if(!Array.isArray(data))data=[];}catch(e){data=[];}
  render();
})();
</script>
</body></html>
