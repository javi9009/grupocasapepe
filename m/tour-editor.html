<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sincrético · Ficha del producto</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1360px;margin:0 auto;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1360px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.wrap{max-width:1360px;margin:0 auto;padding:14px 16px 90px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .l{font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.kpi .v{font-size:23px;font-weight:800;margin-top:2px}
.kpi.mal .v{color:var(--bad)}.kpi.ojo .v{color:var(--warn)}.kpi.bien .v{color:var(--ok)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.45}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filtros select,.filtros input{border:1px solid var(--rule);border-radius:8px;padding:7px 10px;font:inherit;font-size:13px;background:var(--surface)}
.pastilla{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:12.5px;cursor:pointer}
.pastilla.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
th,td{text-align:left;padding:9px 11px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-3);position:sticky;top:44px;z-index:5}
tr:last-child td{border-bottom:0}
tr.sel td{background:var(--accent-soft)}
.nom{font-weight:600;cursor:pointer}
.nom:hover{color:var(--accent)}
.sku{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--muted)}
.luz{display:inline-flex;gap:3px}
.luz i{width:9px;height:9px;border-radius:50%;background:var(--rule);display:inline-block}
.luz i.ok{background:var(--ok)}
.luz i.no{background:var(--bad-bg);box-shadow:inset 0 0 0 1.5px var(--bad)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:12.5px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:4px 10px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:default}
.mini{color:var(--muted);font-size:12px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:11px}
.fld label{display:block;font-size:10.5px;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:13.5px;background:var(--surface)}
.ancho{grid-column:1/-1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:60}
.toast.err{background:var(--bad)}
.aviso{background:var(--warn-bg);border:1px solid #E6D3AE;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6B4C10;line-height:1.5;margin-bottom:12px}
.vacio{padding:26px;text-align:center;color:var(--muted)}
#ficha{display:none}
.dos{display:grid;grid-template-columns:1fr 300px;gap:14px}
@media(max-width:1000px){.dos{grid-template-columns:1fr}}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px}
</style></head><body>
<div class="top">
  <div><h1>🧾 Ficha del producto</h1><div class="sub" id="sub">Cargando…</div></div>
  <div><button class="btn ghost" id="btnRecarga">Recargar</button></div>
</div>
<nav class="secnav"><div class="secnav-in" id="nav" role="tablist"></div></nav>
<div class="wrap">

  <div id="lista">
    <div class="kpis" id="kpis"></div>
    <div id="avisoHuerfanos"></div>
    <div class="filtros" id="filtros"></div>
    <div style="overflow:auto">
      <table>
        <thead><tr><th>Producto</th><th>SKU</th><th>Familia</th><th class="n">PVP</th><th>Ficha</th><th>Costeo</th><th>Guion</th><th>ADN</th><th>Turitop</th><th></th></tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
  </div>

  <div id="ficha">
    <div class="ft" style="justify-content:space-between;margin-bottom:12px">
      <button class="btn ghost" id="fVolver">← Volver a la lista</button>
      <span id="fLuz"></span>
    </div>
    <div class="dos">
      <div>
        <div class="card">
          <h3 id="fNom">—</h3>
          <div class="hint" id="fSub"></div>
          <div class="fgrid">
            <div class="fld"><label>Nombre</label><input data-t="nombre"></div>
            <div class="fld"><label>SKU</label><input data-t="sku" class="sku"><div class="mini" id="fSkuAviso"></div></div>
            <div class="fld"><label>Familia</label><select data-t="familia"><option>Tour</option><option>Walking tour</option><option>Taller</option><option>Mexican Challenge</option></select></div>
            <div class="fld"><label>Estatus</label><select data-t="estatus"><option value="activo">Activo</option><option value="borrador">Borrador</option><option value="pausado">Pausado</option><option value="descontinuado">Descontinuado</option></select></div>
            <div class="fld"><label>PVP (MXN)</label><input type="number" data-t="pvp" step="10"></div>
            <div class="fld"><label>Touroperador (si es de tercero)</label><input data-t="touroperador"></div>
            <div class="fld"><label>Duración (min)</label><input type="number" data-t="duracion_min" step="15"></div>
            <div class="fld"><label>Grupo mínimo</label><input type="number" data-t="grupo_minimo"></div>
            <div class="fld"><label>Personas máximo</label><input type="number" data-t="personas_max"></div>
            <div class="fld ancho"><label>Sale de</label><input data-t="lugar_inicio"></div>
            <div class="fld ancho"><label>Días y horario</label><input data-t="fechas_salida"></div>
          </div>
          <label class="chk" style="margin-top:12px"><input type="checkbox" data-t="es_componente"> <span><b>No se vende suelto</b><div class="mini">Es una dinámica o pieza dentro de otro tour. No lleva SKU ni ficha de venta, y deja de contar como pendiente.</div></span></label>
        </div>

        <div class="card">
          <h3>El ADN</h3>
          <div class="hint">Los cinco elementos. La dinámica no es opcional: sin ella el tour está incompleto.</div>
          <div class="fgrid">
            <div class="fld"><label>Protagonista</label><input data-t="protagonista"></div>
            <div class="fld"><label>Elemento gastronómico</label><input data-t="elemento_gastronomico"></div>
            <div class="fld"><label>Tangible / souvenir</label><input data-t="tangible_souvenir"></div>
            <div class="fld"><label>Dinámica</label><input data-t="dinamica"></div>
            <div class="fld ancho"><label>Storytelling</label><textarea data-t="storytelling" rows="3"></textarea></div>
          </div>
        </div>

        <div class="card">
          <h3>La ceremonia</h3>
          <div class="fgrid">
            <div class="fld"><label>Inicia en</label><input data-t="cer_inicio_lugar"></div>
            <div class="fld"><label>A las</label><input data-t="cer_inicio_hora" placeholder="10:30"></div>
            <div class="fld"><label>Termina en</label><input data-t="cer_final_lugar"></div>
            <div class="fld"><label>A las</label><input data-t="cer_final_hora"></div>
            <div class="fld ancho"><label>Para qué (fin teleológico)</label><input data-t="cer_fin_teleologico"></div>
          </div>
        </div>

        <div class="card">
          <h3>Venta</h3>
          <div class="fgrid">
            <div class="fld"><label>Compañía Turitop</label><select data-t="turitop_company"><option value="">—</option><option>C1036</option><option>C1499</option></select></div>
            <div class="fld"><label>Producto Turitop</label><input data-t="turitop_product_id"></div>
            <div class="fld"><label>Base de comisión</label><select data-t="base_comision"><option value="">—</option><option value="pvp">PVP · tour propio</option><option value="comision">Comisión · tour de tercero</option></select></div>
            <div class="fld"><label>Comisión que recibimos (%)</label><input type="number" data-t="comision_recibida_pct" step="0.1"></div>
          </div>
          <div class="ft"><button class="btn" id="fGuardar">Guardar ficha</button></div>
        </div>
      </div>

      <aside>
        <div class="card">
          <b>Qué le falta</b>
          <div id="fCheck" style="margin-top:9px"></div>
        </div>
        <div class="card" id="cardVincular">
          <b>Ficha de venta</b>
          <div id="fVinculo" style="margin-top:9px"></div>
        </div>
        <div class="card">
          <b>Costeo</b>
          <div id="fCosteo" style="margin-top:9px"></div>
        </div>
      </aside>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>
<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var F=[],cur=null,filtro='pendientes',q='',fam='';
  var PREFIJO={'Tour':'TUR','Walking tour':'WLK','Taller':'TAL','Mexican Challenge':'MCH'};

  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(){return {'apikey':KEY,'Authorization':'Bearer '+tok(),'Content-Type':'application/json'};}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2800);}
  function money(n){return n==null||n===''?'—':'$'+Number(n).toLocaleString('es-MX');}

  var PIEZAS=[['tiene_sku','SKU'],['tiene_ficha','Ficha de venta'],['tiene_precio','Precio'],['tiene_costeo','Costeo'],['tiene_guion','Guion base'],['adn_completo','ADN completo'],['tiene_turitop','Turitop']];

  function pendientes(f){
    if(f.es_componente)return [];
    return PIEZAS.filter(function(p){return !f[p[0]];}).map(function(p){return p[1];});
  }

  async function carga(){
    var r=await fetch(SB+'/rest/v1/v_ficha_producto?select=*&order=familia,nombre',{headers:hdr()});
    if(!r.ok){$('sub').textContent='No se pudo cargar (revisa tu sesión en el panel).';return;}
    F=await r.json();
    var comp=F.filter(function(f){return f.es_componente;}).length;
    $('sub').textContent=F.length+' productos · '+comp+' marcados como pieza de otro tour';
    pintaKpis();pintaFiltros();pinta();
  }

  function pintaKpis(){
    var v=F.filter(function(f){return !f.es_componente;});
    function n(k){return v.filter(function(f){return !f[k];}).length;}
    var completos=v.filter(function(f){return pendientes(f).length===0;}).length;
    $('kpis').innerHTML=
      '<div class="kpi bien"><div class="l">Fichas completas</div><div class="v">'+completos+'<span style="font-size:14px;color:var(--muted)"> / '+v.length+'</span></div></div>'+
      '<div class="kpi '+(n('tiene_sku')?'mal':'bien')+'"><div class="l">Sin SKU</div><div class="v">'+n('tiene_sku')+'</div></div>'+
      '<div class="kpi '+(n('tiene_ficha')?'mal':'bien')+'"><div class="l">Sin ficha de venta</div><div class="v">'+n('tiene_ficha')+'</div></div>'+
      '<div class="kpi ojo"><div class="l">Sin costeo</div><div class="v">'+n('tiene_costeo')+'</div></div>'+
      '<div class="kpi ojo"><div class="l">Sin guion base</div><div class="v">'+n('tiene_guion')+'</div></div>'+
      '<div class="kpi ojo"><div class="l">ADN incompleto</div><div class="v">'+n('adn_completo')+'</div></div>';
    var sinFicha=v.filter(function(f){return !f.tiene_ficha;});
    $('avisoHuerfanos').innerHTML=sinFicha.length
      ? '<div class="aviso"><b>'+sinFicha.length+' productos no existen en el catálogo de venta.</b> No se pueden vender ni aparecer en el concierge. Ábrelos y dale a «Crear su ficha de venta», o márcalos como pieza de otro tour si no se venden sueltos. '+
        '<button class="btn sm" id="btnTodos" style="margin-left:6px">Crear las '+sinFicha.length+' fichas de golpe</button></div>'
      : '';
    var b=$('btnTodos');
    if(b)b.onclick=function(){creaTodas(sinFicha);};
  }

  function pintaFiltros(){
    var fams=[''].concat(Array.from(new Set(F.map(function(f){return f.familia;}).filter(Boolean))));
    $('filtros').innerHTML=
      '<span class="pastilla'+(filtro==='pendientes'?' on':'')+'" data-f="pendientes">Con algo pendiente</span>'+
      '<span class="pastilla'+(filtro==='sinficha'?' on':'')+'" data-f="sinficha">Sin ficha de venta</span>'+
      '<span class="pastilla'+(filtro==='completos'?' on':'')+'" data-f="completos">Completos</span>'+
      '<span class="pastilla'+(filtro==='todos'?' on':'')+'" data-f="todos">Todos</span>'+
      '<select id="fFam" style="margin-left:8px">'+fams.map(function(x){return '<option value="'+esc(x)+'"'+(fam===x?' selected':'')+'>'+(x||'Todas las familias')+'</option>';}).join('')+'</select>'+
      '<input id="fQ" placeholder="Buscar…" value="'+esc(q)+'" style="min-width:180px">';
    Array.prototype.forEach.call($('filtros').querySelectorAll('.pastilla'),function(p){p.onclick=function(){filtro=p.getAttribute('data-f');pintaFiltros();pinta();};});
    $('fFam').onchange=function(){fam=$('fFam').value;pinta();};
    $('fQ').oninput=function(){q=$('fQ').value.toLowerCase();pinta();};
  }

  function pinta(){
    var v=F.filter(function(f){
      if(fam&&f.familia!==fam)return false;
      if(q&&String(f.nombre||'').toLowerCase().indexOf(q)<0&&String(f.sku||'').toLowerCase().indexOf(q)<0)return false;
      if(filtro==='pendientes')return !f.es_componente&&pendientes(f).length>0;
      if(filtro==='sinficha')return !f.es_componente&&!f.tiene_ficha;
      if(filtro==='completos')return !f.es_componente&&pendientes(f).length===0;
      return true;
    });
    if(!v.length){$('tb').innerHTML='<tr><td colspan="10" class="vacio">Nada aquí con ese filtro.</td></tr>';return;}
    $('tb').innerHTML=v.map(function(f){
      function luz(k){return f[k]?'<i class="ok"></i>':'<i class="no"></i>';}
      var estado=f.es_componente?'<span class="tag">pieza</span>'
        :(pendientes(f).length===0?'<span class="tag ok">completa</span>':'<span class="tag warn">'+pendientes(f).length+' pendiente'+(pendientes(f).length===1?'':'s')+'</span>');
      return '<tr data-id="'+f.tour_id+'">'+
        '<td><span class="nom">'+esc(f.nombre)+'</span><div class="mini">'+esc(f.touroperador||f.operador||'Propio')+'</div></td>'+
        '<td class="sku">'+(f.sku?esc(f.sku):'<span class="tag bad">falta</span>')+'</td>'+
        '<td class="mini">'+esc(f.familia||'—')+'</td>'+
        '<td class="n">'+money(f.pvp)+(f.pvp_provisional?' <span class="tag warn">prov.</span>':'')+'</td>'+
        '<td>'+(f.es_componente?'<span class="mini">—</span>':(f.tiene_ficha?'<span class="tag ok">'+esc(f.exp_sku||'sí')+'</span>':'<span class="tag bad">no existe</span>'))+'</td>'+
        '<td>'+luz('tiene_costeo')+'</td><td>'+luz('tiene_guion')+'</td><td>'+luz('adn_completo')+'</td><td>'+luz('tiene_turitop')+'</td>'+
        '<td>'+estado+'</td></tr>';
    }).join('');
    Array.prototype.forEach.call($('tb').querySelectorAll('tr[data-id]'),function(tr){
      tr.onclick=function(){abre(tr.getAttribute('data-id'));};
    });
  }

  async function creaTodas(lista){
    if(!confirm('Se le va a dar SKU y ficha de venta a '+lista.length+' productos, usando el prefijo de su familia (Tour → TUR, Walking tour → WLK, Taller → TAL, Mexican Challenge → MCH).\n\nLos que no se vendan sueltos conviene marcarlos antes como pieza de otro tour.\n\n¿Seguimos?'))return;
    var ok=0,mal=0;
    for(var i=0;i<lista.length;i++){
      var f=lista[i];
      var r=await fetch(SB+'/rest/v1/rpc/ficha_unica_crear',{method:'POST',headers:hdr(),body:JSON.stringify({p_tour_id:f.tour_id,p_prefijo:PREFIJO[f.familia]||'TUR'})});
      if(r.ok)ok++;else mal++;
      $('sub').textContent='Creando fichas… '+(i+1)+' de '+lista.length;
    }
    toast(ok+' fichas creadas'+(mal?' · '+mal+' fallaron':''),mal>0);
    await carga();
  }

  /* ---------- ficha ---------- */
  function abre(id){
    cur=F.filter(function(f){return f.tour_id===id;})[0];
    if(!cur)return;
    $('lista').style.display='none';$('ficha').style.display='block';window.scrollTo(0,0);
    fetch(SB+'/rest/v1/tours?select=*&id=eq.'+id,{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
      var t=a[0];if(!t)return;
      cur._t=t;
      $('fNom').textContent=t.nombre;
      $('fSub').textContent=(cur.familia||'')+(cur.sku?' · '+cur.sku:' · sin SKU');
      Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(el){
        var c=el.getAttribute('data-t'),v=t[c];
        if(el.type==='checkbox'){el.checked=v===true;return;}
        el.value=v==null?'':v;
      });
      pintaLado();
    });
  }
  $('fVolver').onclick=function(){$('ficha').style.display='none';$('lista').style.display='block';};

  function pintaLado(){
    var p=pendientes(cur);
    $('fLuz').innerHTML=cur.es_componente?'<span class="tag">pieza de otro tour</span>'
      :(p.length?'<span class="tag warn">'+p.length+' pendiente'+(p.length===1?'':'s')+'</span>':'<span class="tag ok">ficha completa</span>');
    $('fCheck').innerHTML=cur.es_componente
      ? '<div class="mini">No se vende suelto, así que no se le pide nada.</div>'
      : PIEZAS.map(function(x){return '<div class="chk">'+(cur[x[0]]?'<span class="tag ok">listo</span>':'<span class="tag warn">falta</span>')+' <span class="mini">'+x[1]+'</span></div>';}).join('');
    $('cardVincular').style.display=cur.es_componente?'none':'';
    $('fVinculo').innerHTML=cur.tiene_ficha
      ? '<div class="mini">Vinculada a <b>'+esc(cur.exp_sku)+'</b> · '+esc(cur.exp_nombre)+'<br>Estatus: '+esc(cur.exp_estatus||'—')+'</div>'+
        (cur.precio_concuerda?'':'<div class="aviso" style="margin-top:8px">El precio no coincide: aquí '+money(cur.pvp)+' y en la ficha de venta '+money(cur.exp_pvp)+'.</div>')
      : '<div class="mini">Este producto no existe en el catálogo de venta, así que no se puede vender.</div>'+
        '<div class="ft" style="justify-content:flex-start"><button class="btn sm" id="btnCrear">Crear su ficha de venta</button></div>';
    var b=$('btnCrear');
    if(b)b.onclick=async function(){
      b.disabled=true;
      var pref=PREFIJO[($('ficha').querySelector('[data-t="familia"]').value)]||'TUR';
      var r=await fetch(SB+'/rest/v1/rpc/ficha_unica_crear',{method:'POST',headers:hdr(),body:JSON.stringify({p_tour_id:cur.tour_id,p_prefijo:pref})});
      b.disabled=false;
      if(!r.ok){toast('No se pudo: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json();var s=(j&&j[0])||{};
      toast('Ficha creada'+(s.nuevo_sku?' · '+s.nuevo_sku:''));
      await carga();abre(cur.tour_id);
    };
    fetch(SB+'/rest/v1/tour_costos?select=concepto,monto&tour_id=eq.'+cur.tour_id,{headers:hdr()})
      .then(function(r){return r.ok?r.json():[];})
      .then(function(c){
        $('fCosteo').innerHTML=c.length
          ? '<div class="mini">'+c.length+' líneas cargadas</div><table style="margin-top:6px;border:0"><tbody>'+
            c.slice(0,8).map(function(x){return '<tr><td class="mini" style="padding:4px 0;border:0">'+esc(x.concepto||'')+'</td><td class="n" style="padding:4px 0;border:0">'+money(x.monto)+'</td></tr>';}).join('')+'</tbody></table>'
          : '<div class="mini">Sin costeo. No sabemos cuánto deja este tour.</div>';
      });
  }

  $('fGuardar').onclick=async function(){
    if(!cur)return;var body={};
    Array.prototype.forEach.call(document.querySelectorAll('[data-t]'),function(el){
      var c=el.getAttribute('data-t');
      if(el.type==='checkbox'){body[c]=!!el.checked;return;}
      var v=el.value.trim();
      if(['pvp','duracion_min','grupo_minimo','personas_max','comision_recibida_pct'].indexOf(c)>=0)body[c]=v===''?null:Number(v);
      else body[c]=v===''?null:v;
    });
    $('fGuardar').disabled=true;
    var r=await fetch(SB+'/rest/v1/tours?id=eq.'+cur.tour_id,{method:'PATCH',headers:hdr(),body:JSON.stringify(body)});
    if(r.ok&&cur.experiencia_id){
      // la ficha de venta va detrás: nombre y precio no pueden divergir
      await fetch(SB+'/rest/v1/experiencias?id=eq.'+cur.experiencia_id,{method:'PATCH',headers:hdr(),
        body:JSON.stringify({nombre:body.nombre,pvp:body.pvp,sku:body.sku||undefined})});
    }
    $('fGuardar').disabled=false;
    if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,110),true);return;}
    toast('Guardado');
    await carga();abre(cur.tour_id);
  };

  $('btnRecarga').onclick=carga;
  $('nav').innerHTML='<button role="tab" aria-selected="true">Fichas</button>';
  carga();
})();
</script>
</body></html>
