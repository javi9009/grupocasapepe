<!doctype html>
<html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Candidatos · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --azul:#2f6690;--azul-bg:#e1ecf5;--mora:#6b4a9e;--mora-bg:#ece3f6;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{padding:16px 16px 4px;max-width:1180px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;max-width:1180px;margin:0 auto;padding:0 16px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:12px 13px;cursor:pointer;box-shadow:var(--shadow)}
.tile:hover{border-color:var(--rule-2)}
.tile.on{outline:2px solid var(--accent);outline-offset:-2px}
.tile .n{font-size:24px;font-weight:800;line-height:1}
.tile .l{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:999px;display:inline-block}
.d-nuevo{background:var(--azul)}.d-contactado{background:var(--warn)}.d-entrevista{background:var(--mora)}.d-contratado{background:var(--ok)}.d-descartado{background:var(--faint)}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin-top:12px}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.bar{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.bar input{min-width:220px;flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:14px 15px;margin-bottom:11px;box-shadow:var(--shadow)}
.rowtop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.nm{font-weight:700;font-size:16px}
.meta{color:var(--muted);font-size:13px;margin-top:3px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2)}
.chip.puesto{background:var(--accent-soft);color:var(--ok)}
.chip.msg{background:var(--warn-bg);color:var(--warn)}
.chip.tel{background:var(--surface-2);color:var(--ink-2)}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:4px 11px;white-space:nowrap}
.b-nuevo{background:var(--azul-bg);color:var(--azul)}.b-contactado{background:var(--warn-bg);color:var(--warn)}.b-entrevista{background:var(--mora-bg);color:var(--mora)}.b-contratado{background:var(--ok-bg);color:var(--ok)}.b-descartado{background:var(--none-bg);color:var(--none)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.actions label{font-size:12px;color:var(--muted)}
select.estado{font:inherit;font-size:14px;font-weight:600;padding:7px 9px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-3);color:var(--ink)}
a.mail{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
a.mail:hover{text-decoration:underline}
.notas{margin-top:10px}
.notas textarea{width:100%;min-height:38px;font:inherit;font-size:13px;padding:8px 10px;border:1px dashed var(--rule-2);border-radius:8px;background:var(--surface-3);color:var(--ink-2);resize:vertical}
.notas .nota-view{font-size:13px;color:var(--ink-2);background:var(--surface-3);border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.ro{opacity:.6;pointer-events:none}
.empty{color:var(--muted);text-align:center;padding:48px 16px}
.loading{color:var(--muted);text-align:center;padding:40px}
.saving{font-size:12px;color:var(--faint)}
.hint{max-width:1180px;margin:0 auto;padding:0 16px 8px;color:var(--faint);font-size:12px}
</style><link rel="icon" type="image/png" href="/dash-192.png">
</head><body>

<div class="top">
  <h1>🧑‍💼 Candidatos</h1>
  <div class="sub">Postulaciones que llegan de Indeed al correo de reclutamiento. Mueve a cada quien por su etapa.</div>
</div>
<div class="tiles" id="tiles"></div>
<div class="hint" id="rolehint"></div>

<nav class="secnav"><div class="secnav-in" id="tabs"></div></nav>
<div class="bar">
  <input id="q" placeholder="Buscar por nombre o puesto…">
  <select id="fpuesto"><option value="">Todos los puestos</option></select>
</div>

<div class="wrap"><div id="list" class="loading">Cargando candidatos…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cp-acceso.js"></script>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ESTADOS=[
  {k:'nuevo',l:'Nuevos'},
  {k:'contactado',l:'Contactados'},
  {k:'entrevista',l:'Entrevista'},
  {k:'contratado',l:'Contratados'},
  {k:'descartado',l:'Descartados'},
];
const ELABEL={nuevo:'Nuevo',contactado:'Contactado',entrevista:'Entrevista',contratado:'Contratado',descartado:'Descartado'};

let ROWS=[], FILTRO='nuevo', PUESTO='', PUEDE_EDITAR=false, EMAIL=null;

function fechaTxt(s){ if(!s) return ''; try{ return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }catch(_){ return ''; } }
function diasDesde(s){ if(!s) return null; try{ return Math.floor((Date.now()-new Date(s).getTime())/86400000); }catch(_){ return null; } }

async function nivelPagina(){
  try{
    const s=await sb.auth.getSession();
    EMAIL=(s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email)||null;
    if(!EMAIL) return 'none';
    const r=await sb.rpc('permiso_efectivo',{p_email:EMAIL,p_pagina:'PAG-RH-CANDIDATOS'});
    if(r.error) return 'ver';
    return r.data||'none';
  }catch(_){ return 'ver'; }
}

async function load(){
  const nivel=await nivelPagina();
  PUEDE_EDITAR = (nivel==='editar');
  $('rolehint').textContent = PUEDE_EDITAR ? '' : 'Modo lectura: puedes revisar candidatos pero solo RH y gerencia cambian su etapa.';

  const { data, error } = await sb.from('rh_candidatos')
    .select('id,nombre,puesto,ciudad,proyecto,tipo,estado,email_contacto,telefono,gmail_url,fecha_postulacion,notas,estado_at,estado_por')
    .order('fecha_postulacion',{ascending:false});
  if(error){ $('list').className='empty'; $('list').textContent='No se pudo cargar (¿tienes acceso a este módulo?): '+error.message; return; }
  let rows=data||[];
  try{ rows = await cpAcceso.filtra(rows, x=>x.proyecto); }catch(_){}
  ROWS=rows;

  // catálogo de puestos
  const ps=[...new Set(ROWS.map(r=>r.puesto).filter(Boolean))].sort();
  $('fpuesto').innerHTML='<option value="">Todos los puestos</option>'+ps.map(p=>'<option>'+esc(p)+'</option>').join('');

  render();
}

function conteos(){
  const c={}; ESTADOS.forEach(e=>c[e.k]=0); let tot=0;
  ROWS.forEach(r=>{ if(c[r.estado]!=null)c[r.estado]++; tot++; });
  c.__tot=tot; return c;
}

function render(){
  const c=conteos();
  $('tiles').innerHTML = ESTADOS.map(e=>
    '<div class="tile'+(FILTRO===e.k?' on':'')+'" data-k="'+e.k+'"><div class="n">'+c[e.k]+'</div>'
    +'<div class="l"><span class="dot d-'+e.k+'"></span>'+e.l+'</div></div>'
  ).join('');
  $('tabs').innerHTML = '<button data-k="" aria-selected="'+(FILTRO===''?'true':'false')+'">Todos ('+c.__tot+')</button>'+
    ESTADOS.map(e=>'<button data-k="'+e.k+'" aria-selected="'+(FILTRO===e.k?'true':'false')+'">'+e.l+' ('+c[e.k]+')</button>').join('');

  const q=($('q').value||'').toLowerCase().trim();
  let rows=ROWS.filter(r=>
    (FILTRO===''||r.estado===FILTRO) &&
    (PUESTO===''||r.puesto===PUESTO) &&
    (!q || ((r.nombre||'')+' '+(r.puesto||'')).toLowerCase().includes(q))
  );
  const L=$('list'); L.className='';
  if(!rows.length){ L.className='empty'; L.textContent='No hay candidatos en esta vista.'; return; }
  L.innerHTML=rows.map(card).join('');
  wireCards();
}

function card(r){
  const d=diasDesde(r.fecha_postulacion);
  const anti = d!=null ? (d===0?'hoy':(d+' d')) : '';
  const msgChip = (r.notas&&/mensaje\(s\)/.test(r.notas)) ? '<span class="chip msg">✉️ escribió</span>' : '';
  const telChip = r.telefono ? '<span class="chip tel">📱 '+esc(r.telefono)+'</span>' : '';
  const optSel = ESTADOS.map(e=>'<option value="'+e.k+'"'+(r.estado===e.k?' selected':'')+'>'+ELABEL[e.k]+'</option>').join('');
  const notaVal = r.notas||'';
  const notaBlock = PUEDE_EDITAR
    ? '<div class="notas"><textarea data-nota="'+r.id+'" placeholder="Notas (teléfono, impresión, cita…)">'+esc(notaVal)+'</textarea></div>'
    : (notaVal?('<div class="notas"><div class="nota-view">'+esc(notaVal)+'</div></div>'):'');
  const sel = PUEDE_EDITAR
    ? '<label>Etapa</label><select class="estado" data-id="'+r.id+'">'+optSel+'</select><span class="saving" data-sav="'+r.id+'"></span>'
    : '';
  return '<div class="card" data-card="'+r.id+'">'
    +'<div class="rowtop"><div><div class="nm">'+esc(r.nombre)+'</div>'
      +'<div class="meta">'+esc(r.ciudad||'')+(anti?(' · hace '+anti):'')+' · '+fechaTxt(r.fecha_postulacion)+'</div>'
      +'<div class="chips"><span class="chip puesto">'+esc(r.puesto||'Sin puesto')+'</span>'+msgChip+telChip+'</div>'
    +'</div><span class="badge b-'+r.estado+'">'+ELABEL[r.estado]+'</span></div>'
    +'<div class="actions">'+sel
      +(r.gmail_url?' <a class="mail" href="'+esc(r.gmail_url)+'" target="_blank" rel="noopener">✉️ Ver correo / CV ↗</a>':'')
    +'</div>'
    +notaBlock
    +'</div>';
}

function wireCards(){
  document.querySelectorAll('select.estado').forEach(sel=>{
    sel.onchange=async function(){
      const id=sel.getAttribute('data-id'); const nuevo=sel.value;
      const sav=document.querySelector('[data-sav="'+id+'"]'); if(sav)sav.textContent='Guardando…';
      const { error }=await sb.from('rh_candidatos').update({estado:nuevo,estado_por:EMAIL,estado_at:new Date().toISOString()}).eq('id',id);
      if(error){ if(sav)sav.textContent='Error'; alert('No se pudo guardar: '+error.message); return; }
      const row=ROWS.find(x=>String(x.id)===String(id)); if(row){row.estado=nuevo;row.estado_at=new Date().toISOString();}
      render();
    };
  });
  document.querySelectorAll('textarea[data-nota]').forEach(ta=>{
    ta.onblur=async function(){
      const id=ta.getAttribute('data-nota'); const row=ROWS.find(x=>String(x.id)===String(id));
      const val=ta.value; if(row && (row.notas||'')===val) return;
      const { error }=await sb.from('rh_candidatos').update({notas:val}).eq('id',id);
      if(error){ alert('No se pudo guardar la nota: '+error.message); return; }
      if(row) row.notas=val;
    };
  });
}

$('tiles').addEventListener('click',e=>{ const t=e.target.closest('.tile'); if(!t)return; FILTRO=t.getAttribute('data-k'); render(); });
$('tabs').addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b)return; FILTRO=b.getAttribute('data-k'); render(); });
$('q').addEventListener('input',render);
$('fpuesto').addEventListener('change',function(){ PUESTO=this.value; render(); });

load();
</script>
</body></html>
