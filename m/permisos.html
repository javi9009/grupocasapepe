<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Permisos y documentación · Casa Pepe</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
--ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
--rule:#E2DCCF;--rule-2:#D2C8B6;--accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;
--none:#66707A;--none-bg:#E9E4DA;
--shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--ground);color:var(--ink);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid #C9A227;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:#C9A227}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto;align-items:center}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav .sp{margin-left:auto;display:flex;gap:8px;align-items:center;padding:6px 0}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 40px}
.aviso{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:10px;padding:10px 14px;margin:12px 0;font-weight:600;display:none}
.aviso small{display:block;font-weight:400;color:var(--ink-2);margin-top:2px}
h2.sec{font-size:15px;margin:22px 0 4px}
.secdesc{font-size:12.5px;color:var(--muted);margin:0 0 10px}
h3.grp{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:16px 0 6px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:8px}
table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--rule);padding:7px 9px;text-align:left;vertical-align:top}
thead th{background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tr:last-child td{border-bottom:0}
tr.vencido td{background:var(--bad-bg)}
tr.vencido td:first-child{border-left:4px solid var(--bad)}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:4px 5px;font:inherit;font-size:13px;color:var(--ink)}
td input:hover,td select:hover{border-color:var(--rule)}
td input:focus,td select:focus{border-color:var(--accent);background:var(--surface-3);outline:none}
.tag{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.vig{background:var(--ok-bg);color:var(--ok)}.tag.tram{background:var(--warn-bg);color:var(--warn)}.tag.ven{background:var(--bad);color:#fff}.tag.nd{background:var(--none-bg);color:var(--none)}
.venc-note{font-size:11px;color:var(--bad);font-weight:700;margin-top:3px}
.doc{display:inline-block;font-size:11.5px;background:var(--surface-3);border:1px solid var(--rule);border-radius:14px;padding:2px 9px;margin:0 4px 4px 0;cursor:pointer;color:var(--ink-2);max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.doc:hover{border-color:var(--accent);color:var(--accent)}
.doc.ext{border-style:dashed}
.up{font-size:11.5px;border:1px dashed var(--rule-2);background:none;border-radius:14px;padding:2px 9px;cursor:pointer;color:var(--muted)}
.up:hover{color:var(--accent);border-color:var(--accent)}
.up.urgent{border-color:var(--bad);color:var(--bad);font-weight:700;border-style:solid}
.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--accent);font-weight:600}.status.err{color:var(--bad);font-weight:700}
.empty{padding:20px;color:var(--faint);text-align:center}
dialog{border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:18px;max-width:420px;width:92%}
dialog::backdrop{background:rgba(31,27,22,.35)}
dialog h3{margin:0 0 12px;font-size:15px}
dialog label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:9px 0 3px}
dialog input,dialog select{width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;font:inherit;background:#fff;color:var(--ink)}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
@media(max-width:760px){th.hidemov,td.hidemov{display:none}}
</style></head><body>
<header><span class="ttl">📋 <b>Permisos</b> y documentación de la propiedad</span></header>
<nav class="secnav"><div class="secnav-in" id="tabs">
  <span class="sp"><span class="status" id="st"></span><button class="btn" id="bNuevo" type="button">＋ Añadir</button></span>
</div></nav>
<div class="wrap">
  <div class="aviso" id="aviso"></div>
  <div id="cont"><div class="empty">Cargando…</div></div>
</div>

<dialog id="dlg">
  <h3>Nuevo registro</h3>
  <label>Tipo</label>
  <select id="n_cat"><option value="permiso">Permiso (vence / se renueva)</option><option value="documentacion">Documentación de la propiedad (no vence)</option></select>
  <label>Nombre</label><input id="n_nom" placeholder="p. ej. Licencia de funcionamiento">
  <label>Grupo</label><input id="n_grp" list="grpList" placeholder="p. ej. Protección Civil"><datalist id="grpList"></datalist>
  <label>Responsable</label><input id="n_resp">
  <label>Renovación</label>
  <select id="n_ren"><option>Anual</option><option>Cada año</option><option>Cada 2 años</option><option>2 años</option><option>3 años</option><option>Cada 5 años</option><option>Única</option><option>Otro</option></select>
  <label>Fecha de inicio</label><input id="n_ini" placeholder="texto libre (p. ej. 01 oct 2025)">
  <label>Vigencia (vence el)</label><input id="n_vig" type="date">
  <label>Costo</label><input id="n_costo" placeholder="$ 0.00">
  <div class="dlgbtns"><button class="btn ghost" type="button" id="n_cancel">Cancelar</button><button class="btn" type="button" id="n_save">Guardar</button></div>
</dialog>

<input type="file" id="fUp" style="display:none">
<script src="/cp-acceso.js"></script>
<script>
const SB_BASE='https://rehophywchakfapivsbh.supabase.co', SB=SB_BASE+'/rest/v1', BUCKET='permisos';
const KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t)H.Authorization='Bearer '+_t;}}catch(e){}
const $=id=>document.getElementById(id);
function status(t,c){const s=$('st');s.textContent=t||'';s.className='status'+(c?' '+c:'');if(t&&c==='ok')setTimeout(()=>{if(s.textContent===t)s.textContent='';},2500);}
async function sb(p,o){const r=await fetch(SB+p,{headers:H,...o});if(!r.ok){throw new Error(await r.text())}const c=await r.text();return c?JSON.parse(c):null}

const UBIS=[['cdmx','CDMX'],['puebla','Puebla']];
let UBI='cdmx', ROWS=[], PERM_UBIS=null;
const hoy=new Date();hoy.setHours(0,0,0,0);
function fdate(s){if(!s)return null;const d=new Date(s+'T00:00:00');return isNaN(d)?null:d;}
function esVencido(r){ if(r.estatus==='vencido')return true; const d=fdate(r.vigencia); return !!(d&&d<hoy); }
function fmt(s){ if(!s)return '—'; const d=fdate(s); if(!d)return s; return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',year:'numeric'}); }

/* ---------- tabs de ubicación (respetan cascada de ubicación) ---------- */
async function buildTabs(){
  try{ PERM_UBIS=await cpAcceso.ubicaciones(); }catch(e){ PERM_UBIS=null; }
  const list=UBIS.filter(u=>!PERM_UBIS||PERM_UBIS.includes(u[0]));
  const use=list.length?list:UBIS;
  const tabs=$('tabs'); const sp=tabs.querySelector('.sp');
  use.forEach(([k,lbl],i)=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=lbl; b.dataset.k=k;
    b.setAttribute('aria-selected', i===0?'true':'false');
    b.onclick=()=>{ UBI=k; tabs.querySelectorAll('button[data-k]').forEach(x=>x.setAttribute('aria-selected', x.dataset.k===k?'true':'false')); load(); };
    tabs.insertBefore(b,sp);
  });
  UBI=use[0][0];
}

/* ---------- carga y render ---------- */
async function load(){
  status('cargando…');
  try{ ROWS=await sb('/permisos?select=*&ubicacion=eq.'+UBI+'&order=grupo,nombre')||[]; status('',''); }
  catch(e){ status('⚠ no se pudo cargar','err'); ROWS=[]; }
  render();
}
function render(){
  const cont=$('cont'); cont.innerHTML='';
  const venc=ROWS.filter(esVencido);
  const av=$('aviso');
  if(venc.length){ av.style.display='block'; av.innerHTML='⚠ '+venc.length+' registro'+(venc.length>1?'s':'')+' vencido'+(venc.length>1?'s':'')+' en '+(UBI==='cdmx'?'CDMX':'Puebla')+': '+venc.map(v=>v.nombre).join(' · ')+'<small>Admin: renueva el trámite y sube aquí el documento actualizado.</small>'; }
  else av.style.display='none';
  [['permiso','Permisos','Vencen y se renuevan: cuando la vigencia pasa o el estatus es «vencido», la fila se marca en rojo para que admin suba el documento renovado.'],
   ['documentacion','Documentación de la propiedad','Actas, contratos, escrituras e identificaciones. No vencen; se conservan como archivo maestro.']].forEach(([cat,titulo,desc])=>{
    const rows=ROWS.filter(r=>r.categoria===cat);
    const h=document.createElement('h2'); h.className='sec'; h.textContent=(cat==='permiso'?'🪪 ':'🏛 ')+titulo; cont.appendChild(h);
    const p=document.createElement('p'); p.className='secdesc'; p.textContent=desc; cont.appendChild(p);
    if(!rows.length){ const d=document.createElement('div'); d.className='card'; d.innerHTML='<div class="empty">Sin registros.</div>'; cont.appendChild(d); return; }
    const grupos=[...new Set(rows.map(r=>r.grupo||'General'))];
    grupos.forEach(g=>{
      const h3=document.createElement('h3'); h3.className='grp'; h3.textContent=g; cont.appendChild(h3);
      const card=document.createElement('div'); card.className='card';
      const t=document.createElement('table');
      t.innerHTML='<thead><tr><th style="width:22%">Nombre</th><th class="hidemov">Responsable</th><th>Renovación</th><th class="hidemov">Inicio</th><th>Vigencia</th><th class="hidemov">Costo</th><th>Estatus</th><th style="width:24%">Documentos</th></tr></thead>';
      const tb=document.createElement('tbody');
      rows.filter(r=>(r.grupo||'General')===g).forEach(r=>tb.appendChild(fila(r)));
      t.appendChild(tb); card.appendChild(t); cont.appendChild(card);
    });
  });
  const dl=$('grpList'); dl.innerHTML=[...new Set(ROWS.map(r=>r.grupo).filter(Boolean))].map(g=>'<option value="'+g.replace(/"/g,'&quot;')+'">').join('');
}
function fila(r){
  const tr=document.createElement('tr'); tr.dataset.id=r.id;
  const bad=esVencido(r); if(bad)tr.className='vencido';
  const tags={vigente:'<span class="tag vig">Vigente</span>',en_tramite:'<span class="tag tram">En trámite</span>',vencido:'<span class="tag ven">VENCIDO</span>'};
  tr.innerHTML=
   '<td><b>'+esc(r.nombre)+'</b>'+(r.observaciones?'<div style="font-size:11px;color:var(--muted)">'+esc(r.observaciones)+'</div>':'')+(bad&&r.categoria==='permiso'?'<div class="venc-note">⚠ Vencido — renovar y subir documento</div>':'')+'</td>'+
   '<td class="hidemov"><input data-f="responsable" value="'+esca(r.responsable)+'"></td>'+
   '<td><input data-f="renovacion" value="'+esca(r.renovacion)+'" style="max-width:95px"></td>'+
   '<td class="hidemov"><input data-f="fecha_inicio" value="'+esca(r.fecha_inicio)+'" style="max-width:110px"></td>'+
   '<td><input type="date" data-f="vigencia" value="'+(r.vigencia||'')+'" style="max-width:130px">'+(r.vigencia?'<div style="font-size:11px;color:'+(bad?'var(--bad)':'var(--muted)')+'">'+fmt(r.vigencia)+'</div>':'')+'</td>'+
   '<td class="hidemov"><input data-f="costo" value="'+esca(r.costo)+'" style="max-width:100px"></td>'+
   '<td><select data-f="estatus"><option value="">—</option><option value="vigente">Vigente</option><option value="en_tramite">En trámite</option><option value="vencido">Vencido</option></select><div>'+(tags[r.estatus]||'<span class="tag nd">—</span>')+'</div></td>'+
   '<td class="docs"></td>';
  tr.querySelector('select[data-f=estatus]').value=r.estatus||'';
  tr.querySelectorAll('input[data-f],select[data-f]').forEach(i=>{
    i.addEventListener('wheel',()=>i.blur());
    i.onchange=async()=>{ const f=i.dataset.f; let v=i.value; if(v==='')v=null;
      try{
        const res=await fetch(SB+'/permisos?id=eq.'+r.id,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({[f]:v,updated_at:new Date().toISOString()})});
        const j=res.ok?await res.json():[];
        if(!res.ok||!j.length){ status('⚠ NO se guardó (¿sesión expirada?) — recarga e inténtalo','err'); return; }
        r[f]=v; status('✓ guardado','ok');
        const nb=esVencido(r); tr.className=nb?'vencido':''; render(); // re-render sólo tras cambio confirmado
      }catch(e){ status('⚠ NO se guardó','err'); }
    };
  });
  const td=tr.querySelector('.docs');
  (r.archivos||[]).forEach(a=>{
    const s=document.createElement('span'); s.className='doc'+(a.u?' ext':''); s.title=a.n||''; s.textContent=(a.u?'🔗 ':'📄 ')+(a.n||'documento');
    s.onclick=async()=>{ if(a.u){ window.open(a.u,'_blank'); return; }
      s.textContent='…';
      try{const rr=await fetch(SB_BASE+'/storage/v1/object/sign/'+BUCKET+'/'+a.p,{method:'POST',headers:{...H},body:JSON.stringify({expiresIn:3600})});if(!rr.ok)throw 0;const j=await rr.json();window.open(SB_BASE+'/storage/v1'+j.signedURL,'_blank');}
      catch(e){ alert('No se pudo abrir. Inicia sesión en el panel.'); }
      s.textContent=(a.u?'🔗 ':'📄 ')+(a.n||'documento'); };
    td.appendChild(s);
  });
  const up=document.createElement('button'); up.type='button'; up.className='up'+(bad?' urgent':''); up.textContent=bad?'⬆ Subir renovado':'＋ Subir';
  up.onclick=()=>{ const f=$('fUp'); f.onchange=()=>subir(r,f); f.value=''; f.click(); };
  td.appendChild(up);
  return tr;
}
async function subir(r,inp){
  const f=inp.files&&inp.files[0]; if(!f)return;
  status('subiendo…');
  const safe=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\s+/g,'_').replace(/[^A-Za-z0-9._()-]/g,'');
  const path=UBI+'/'+(r.monday_id||r.id)+'/'+Date.now()+'_'+safe;
  try{
    const rr=await fetch(SB_BASE+'/storage/v1/object/'+BUCKET+'/'+path,{method:'POST',headers:{Authorization:H.Authorization,apikey:KEY,'x-upsert':'true','Content-Type':f.type||'application/octet-stream'},body:f});
    if(!rr.ok)throw new Error(await rr.text());
    const nuevos=(r.archivos||[]).concat([{n:f.name,p:path}]);
    const res=await fetch(SB+'/permisos?id=eq.'+r.id,{method:'PATCH',headers:{...H,Prefer:'return=representation'},body:JSON.stringify({archivos:nuevos,updated_at:new Date().toISOString()})});
    const j=res.ok?await res.json():[];
    if(!res.ok||!j.length)throw new Error('no guardó');
    r.archivos=nuevos; status('✓ documento subido','ok'); render();
  }catch(e){ status('⚠ no se subió — inicia sesión','err'); }
}
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function esca(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

/* ---------- alta ---------- */
$('bNuevo').onclick=()=>$('dlg').showModal();
$('n_cancel').onclick=()=>$('dlg').close();
$('n_save').onclick=async()=>{
  const nom=$('n_nom').value.trim(); if(!nom){alert('Escribe el nombre.');return;}
  const body={ubicacion:UBI,categoria:$('n_cat').value,nombre:nom,grupo:$('n_grp').value.trim()||null,
    responsable:$('n_resp').value.trim()||null,renovacion:$('n_ren').value,fecha_inicio:$('n_ini').value.trim()||null,
    vigencia:$('n_vig').value||null,costo:$('n_costo').value.trim()||null,estatus:'vigente'};
  try{
    const res=await fetch(SB+'/permisos',{method:'POST',headers:{...H,Prefer:'return=representation'},body:JSON.stringify(body)});
    const j=res.ok?await res.json():[];
    if(!res.ok||!j.length)throw new Error('no');
    $('dlg').close(); ['n_nom','n_grp','n_resp','n_ini','n_vig','n_costo'].forEach(k=>$(k).value='');
    status('✓ creado','ok'); load();
  }catch(e){ alert('No se pudo crear (¿sesión expirada?).'); }
};

document.addEventListener('visibilitychange',()=>{ if(!document.hidden && !document.activeElement.closest?.('td')) load(); });
(async()=>{ await buildTabs(); load(); })();
</script>
</body></html>
