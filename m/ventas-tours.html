<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas de Tours · Sincrético</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--mut:#8d8170;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a;--red:#E1251B}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#16130f;color:#f4ecdd;padding:12px 18px;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:700;font-size:16px}header .ttl b{color:var(--red)}
header .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.wrap{max-width:1060px;margin:16px auto;padding:0 16px 60px}
.filter{background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px}
.filter input{padding:6px 8px;border:1px solid var(--bd);border-radius:7px;font-size:13px}
.filter button{padding:6px 12px;border:none;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer}
.filter .go{background:var(--accent);color:#fff}.filter .ch{background:#efe6d4;color:var(--txt)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .n{font-size:26px;font-weight:800;margin-top:4px;line-height:1}.kpi .s{font-size:12px;color:var(--soft);margin-top:4px}
.kpi.red{border-left:4px solid var(--red)}.kpi.green{border-left:4px solid var(--accent)}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.up{color:var(--accent);font-weight:700}.down{color:var(--bad);font-weight:700}.new{color:var(--gold);font-weight:700;font-size:11px}
.fcrow{display:flex;justify-content:space-between;font-size:13px;padding:3px 0}
.fcbar{height:22px;background:#eee;border-radius:6px;overflow:hidden;position:relative;margin-top:8px}
.fcbar span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#37b88a)}
.fcbar b{position:absolute;left:10px;top:0;line-height:22px;color:#fff;font-size:12px;font-weight:700}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px;white-space:nowrap}
.tag.paid{background:#eaf6f0;color:#176b4c}.tag.part{background:#fbf0db;color:#8a5a00}.tag.pend{background:#eef0f2;color:#566}.tag.open{background:#eaf6f0;color:#176b4c}.tag.full{background:#fbeaea;color:#9a2b2b}.tag.mitos{background:#fbeeee;color:#9a2b2b}
.muted{color:var(--mut)}.scroll{max-height:340px;overflow:auto}
/* calendario grid horizontal */
.calwrap{overflow-x:auto;padding-bottom:6px}
.calrow{display:flex;gap:12px;min-width:max-content}
.daycol{min-width:236px;max-width:236px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:8px}
.daycol h3{margin:0 0 8px;font-size:12px;color:var(--txt);text-transform:capitalize;border-bottom:2px solid var(--gold);padding-bottom:5px}
.evc{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:7px 9px;margin-bottom:7px}
.evc .h{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.evc .p{font-size:12.5px;margin-top:2px}
.evc .c{font-size:11px;color:var(--mut);margin-top:2px}
.evc.mit{border-left:3px solid var(--red)}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener('DOMContentLoaded',function(){var h=document.querySelector('header');if(h)h.style.display='none';});}</script>
<header>
  <a href="/">← Panel</a>
  <span class="ttl">Ventas de Tours · <b>Sincrético</b></span>
  <span class="right"><span id="upd" style="font-size:11px;color:#cdbf9c"></span><a id="reload" style="cursor:pointer">↻ Actualizar</a></span>
</header>
<div class="wrap">
  <div class="filter">
    <span>📅 Filtrar ventas:</span>
    <label>Desde <input type="date" id="f-from"></label>
    <label>Hasta <input type="date" id="f-to"></label>
    <button class="go" id="f-go">Aplicar</button>
    <button class="ch" id="f-mes">Este mes</button>
    <span class="muted" id="f-lbl"></span>
  </div>
  <div id="wrap"><div class="card">Cargando datos de Turitop…</div></div>
</div>

<script>
const FN='https://rehophywchakfapivsbh.supabase.co/functions/v1/turitop-ventas';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
// Reporte de socios · Experiencias CDMX, MXN por mes
const FORECAST_TOUR=[218178,274955,155707,142969,170284,173921,325512,223616,119118,188511,213682,114561]; // Plan AF26
const AA_TOUR_REV  =[203905,256967,145521,133616,155946,177450,183750,170100,148050,157500,156450,146008]; // Real 2025
const $=id=>document.getElementById(id);
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=String(s);return t.value;};
const mx=n=>'$'+Math.round(n||0).toLocaleString('es-MX');
function fdate(iso){try{return new Date(iso).toLocaleString('es-MX',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function dayKey(iso){try{return new Date(iso).toLocaleDateString('es-MX',{weekday:'long',day:'2-digit',month:'short'});}catch(e){return iso;}}
function hm(iso){if(!iso)return'';try{return new Date(iso).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});}catch(e){return'';}}
function stTag(s){s=(s||'').toLowerCase();if(s.includes('partial'))return'<span class="tag part">parcial</span>';if(s.includes('paid'))return'<span class="tag paid">pagado</span>';return'<span class="tag pend">'+(s||'—')+'</span>';}
function deltaCell(now,aa){const d=now-aa;if(aa===0)return now>0?'<span class="new">nuevo</span>':'—';const s=d>=0?'+':'';return '<span class="'+(d>=0?'up':'down')+'">'+s+d+'</span> <span class="muted">('+aa+' AA)</span>';}

async function load(from,to){
  $('wrap').innerHTML='<div class="card">Cargando datos de Turitop…</div>';
  const payload={}; if(from)payload.from=from; if(to)payload.to=to;
  let j; try{const r=await fetch(FN,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(payload)});j=await r.json();}
  catch(e){$('wrap').innerHTML='<div class="card">⚠ No se pudo conectar: '+e.message+'</div>';return;}
  if(!j.ok){$('wrap').innerHTML='<div class="card">⚠ '+(j.error||'Error')+'</div>';return;}
  $('upd').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  $('f-from').value=j.rango.from;$('f-to').value=j.rango.to;
  $('f-lbl').textContent='· '+j.rango.from+' a '+j.rango.to+' · '+(j.reservas_rango||0)+' reservas';
  const esMes=(j.rango.from===j.mes+'-01'); const mIdx=parseInt(j.mes.slice(5,7),10)-1;
  const fc=FORECAST_TOUR[mIdx]||0, aaRev=AA_TOUR_REV[mIdx]||0;
  const pct=fc?Math.min(100,Math.round((j.total_venta/fc)*100)):0;
  let h='<div class="kpis">';
  h+='<div class="kpi green"><div class="l">Venta total (periodo)</div><div class="n">'+mx(j.total_venta)+'</div><div class="s">'+(j.total_personas||0)+' personas · '+(j.reservas_rango||0)+' reservas</div></div>';
  h+='<div class="kpi"><div class="l">Vendido hoy</div><div class="n">'+mx(j.dia_venta)+'</div><div class="s">'+(j.dia_personas||0)+' personas · '+(j.dia?j.dia.length:0)+' reservas</div></div>';
  h+='<div class="kpi red"><div class="l">Próxima función Mitos</div><div class="n">'+(j.proxima_funcion?(50-(j.proxima_funcion.cupos_restantes||0)):'—')+'</div><div class="s">vendidos · '+(j.proxima_funcion?fdate(j.proxima_funcion.fecha):'—')+'</div></div>';
  h+='<div class="kpi"><div class="l">Experiencias activas</div><div class="n">'+(j.productos?j.productos.length:0)+'</div><div class="s">en catálogo Turitop</div></div>';
  h+='</div>';
  if(esMes){h+='<div class="card"><h2>Ventas de tours vs forecast · '+j.mes+'</h2>'+
    '<div class="fcrow"><span>🟢 Real a la fecha (Turitop)</span><b>'+mx(j.total_venta)+'</b></div>'+
    '<div class="fcrow"><span>🎯 Forecast del mes (Plan AF26)</span><b>'+mx(fc)+'</b></div>'+
    '<div class="fcrow"><span>📅 Año pasado · mismo mes 2025</span><b>'+mx(aaRev)+'</b></div>'+
    '<div class="fcbar"><span style="width:'+pct+'%"></span><b>'+pct+'% del forecast</b></div>'+
    '<div class="muted" style="font-size:11px;margin-top:6px">Forecast y Año pasado = Experiencias CDMX del reporte de socios.</div></div>';}
  h+='<div class="card"><h2>Tours más vendidos · '+j.rango.from+' a '+j.rango.to+'</h2><table><thead><tr><th>Tour / Experiencia</th><th>Vendidos</th><th>vs AA</th><th>Reservas</th><th>Ticket prom.</th><th>Venta total</th></tr></thead><tbody>';
  (j.por_tour||[]).forEach(t=>{h+='<tr><td>'+dec(t.tour)+'</td><td>'+t.personas+'</td><td>'+deltaCell(t.personas,t.aa_personas||0)+'</td><td>'+t.reservas+'</td><td>'+mx(t.ticket_promedio)+'</td><td><b>'+mx(t.venta)+'</b></td></tr>';});
  if(!(j.por_tour||[]).length)h+='<tr><td colspan="6" class="muted">Sin ventas en el periodo</td></tr>';
  h+='</tbody></table></div>';
  h+='<div class="card"><h2>Ventas de hoy · detalle ('+j.fecha+')</h2><div class="scroll"><table><thead><tr><th>Salida</th><th>Tour</th><th>Pers.</th><th>Monto</th><th>Vendedor</th><th>Estado</th></tr></thead><tbody>';
  (j.dia||[]).forEach(d=>{h+='<tr><td>'+(d.hora_evento?fdate(d.hora_evento):'—')+'</td><td>'+dec(d.tour)+'</td><td>'+d.personas+'</td><td><b>'+mx(d.monto)+'</b></td><td>'+dec(d.vendedor)+'</td><td>'+stTag(d.status)+'</td></tr>';});
  if(!(j.dia||[]).length)h+='<tr><td colspan="6" class="muted">Sin ventas registradas hoy todavía</td></tr>';
  h+='</tbody></table></div></div>';
  // Calendario grid por día
  h+='<div class="card"><h2>Calendario de experiencias · próximos 14 días</h2><div class="calwrap"><div class="calrow">';
  const byDay={},order=[]; (j.calendario||[]).forEach(e=>{const k=dayKey(e.fecha);if(!byDay[k]){byDay[k]=[];order.push(k);}byDay[k].push(e);});
  if(!order.length)h+='<div class="muted">Sin eventos próximos</div>';
  order.forEach(k=>{h+='<div class="daycol"><h3>'+k+'</h3>';
    byDay[k].forEach(e=>{const isM=e.product_id==='P124';const ret=e.regreso?hm(e.regreso):null;
      h+='<div class="evc'+(isM?' mit':'')+'"><div class="h">'+hm(e.salida)+(ret?' – '+ret:'')+'</div><div class="p">'+dec(e.producto)+(isM?' <span class="tag mitos">Mitos</span>':'')+'</div><div class="c">'+(e.full?'<span class="tag full">lleno</span>':(e.cupos_restantes!=null?e.cupos_restantes+' cupos libres':'abierto'))+'</div></div>';});
    h+='</div>';});
  h+='</div></div><div class="muted" style="font-size:11px;margin-top:8px">Hora de salida – regreso (según duración del tour en Turitop). Desliza horizontal para ver más días.</div></div>';
  $('wrap').innerHTML=h;
}
$('f-go').onclick=()=>load($('f-from').value,$('f-to').value);
$('f-mes').onclick=()=>load();
$('reload').onclick=()=>load($('f-from').value||undefined,$('f-to').value||undefined);
load();
</script>
</body></html>
