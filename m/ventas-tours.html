<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ventas de Tours · Mitos en el Ring</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--mut:#8d8170;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a;--red:#E1251B}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#16130f;color:#f4ecdd;padding:12px 18px;border-bottom:3px solid var(--red);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:700;font-size:16px}header .ttl b{color:var(--red)}
header .right{margin-left:auto;display:flex;gap:12px;align-items:center}
.wrap{max-width:1000px;margin:18px auto;padding:0 16px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:14px 16px}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.kpi .n{font-size:30px;font-weight:800;margin-top:4px;line-height:1}
.kpi .s{font-size:12px;color:var(--soft);margin-top:4px}
.kpi.next{border-left:4px solid var(--red)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:720px){.cards{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.card h2{font-size:13px;margin:0 0 12px;color:var(--accent);text-transform:uppercase;letter-spacing:.05em}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}
.row:last-child{border-bottom:none}.row .v{font-weight:700;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--bd);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
tr.next td{background:#fbeeee;font-weight:600}
.bar{height:7px;background:#eee;border-radius:4px;overflow:hidden;min-width:50px;display:inline-block;vertical-align:middle}
.bar span{display:block;height:100%;background:var(--accent)}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.tag.open{background:#eaf6f0;color:#176b4c}.tag.full{background:#fbeaea;color:#9a2b2b}
.muted{color:var(--mut)}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener('DOMContentLoaded',function(){var h=document.querySelector('header');if(h)h.style.display='none';});}</script>
<header>
  <a href="/">← Panel</a>
  <span class="ttl">Ventas de Tours · <b>Mitos en el Ring</b></span>
  <span class="right"><span id="upd" style="font-size:11px;color:#cdbf9c"></span><a id="reload" style="cursor:pointer">↻ Actualizar</a></span>
</header>
<div class="wrap" id="wrap"><div class="card">Cargando datos de Turitop…</div></div>

<script>
const FN='https://rehophywchakfapivsbh.supabase.co/functions/v1/turitop-ventas';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const $=id=>document.getElementById(id);
const dec=s=>{const t=document.createElement('textarea');t.innerHTML=String(s);return t.value;};
function fdate(iso){try{return new Date(iso).toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}catch(e){return iso;}}
function listBy(by){const e=Object.entries(by||{}).sort((a,b)=>b[1]-a[1]); if(!e.length) return '<div class="muted" style="font-size:13px">— sin registros —</div>'; return e.map(([k,v])=>'<div class="row"><span>'+dec(k)+'</span><span class="v">'+v+'</span></div>').join('');}

async function load(){
  $('wrap').innerHTML='<div class="card">Cargando datos de Turitop…</div>';
  let j; try{ const r=await fetch(FN,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},body:'{}'}); j=await r.json(); }
  catch(e){ $('wrap').innerHTML='<div class="card">⚠ No se pudo conectar: '+e.message+'</div>'; return; }
  if(!j.ok){ $('wrap').innerHTML='<div class="card">⚠ '+(j.error||'Error')+'<div class="muted" style="margin-top:6px;font-size:12px">'+JSON.stringify(j.detail||j.body||'').slice(0,200)+'</div></div>'; return; }
  const fns=(j.funciones||[]); const cap=Math.max(50,...fns.map(f=>Number(f.cupos_restantes)||0));
  const conV=fns.map(f=>{const rest=Number(f.cupos_restantes);return {...f,cap,vendidos:isFinite(rest)?Math.max(0,cap-rest):null};});
  const prox=j.proxima_funcion?conV.find(f=>f.time===j.proxima_funcion.time)||conV[0]:conV[0];
  $('upd').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  let h='<div class="kpis">';
  h+='<div class="kpi"><div class="l">Vendidos hoy</div><div class="n">'+(j.hoy?j.hoy.tickets:0)+'</div><div class="s">'+(j.hoy?j.hoy.reservas:0)+' reservas · '+j.fecha+'</div></div>';
  h+='<div class="kpi"><div class="l">Vendidos este mes</div><div class="n">'+(j.mes_total?j.mes_total.tickets:0)+'</div><div class="s">'+(j.mes_total?j.mes_total.reservas:0)+' reservas · '+j.mes+'</div></div>';
  h+='<div class="kpi next"><div class="l">Próxima función</div><div class="n">'+(prox?prox.vendidos:'—')+'</div><div class="s">vendidos · '+(prox?fdate(prox.fecha):'—')+' · '+(prox?prox.cupos_restantes:'—')+' cupos libres</div></div>';
  h+='<div class="kpi"><div class="l">Agentes activos (7d)</div><div class="n">'+(j.agentes_7d?Object.keys(j.agentes_7d.by||{}).length:0)+'</div><div class="s">'+(j.agentes_7d?j.agentes_7d.tickets:0)+' tickets en 7 días</div></div>';
  h+='</div>';
  h+='<div class="cards">';
  h+='<div class="card"><h2>Vendidos del mes · por tour</h2>'+listBy(j.mes_total&&j.mes_total.by)+'</div>';
  h+='<div class="card"><h2>Revendedores / agentes · últimos 7 días</h2>'+listBy(j.agentes_7d&&j.agentes_7d.by)+'</div>';
  h+='</div>';
  h+='<div class="card"><h2>Funciones de Mitos · vendidos vs cupos</h2><table><thead><tr><th>Función</th><th>Estado</th><th>Vendidos</th><th>Cupos libres</th><th>Ocupación</th></tr></thead><tbody>';
  conV.forEach(f=>{const pct=f.cap?Math.round(((f.vendidos||0)/f.cap)*100):0;const isNext=prox&&f.time===prox.time;
    h+='<tr'+(isNext?' class="next"':'')+'><td>'+fdate(f.fecha)+(isNext?' · <b>próxima</b>':'')+'</td><td><span class="tag '+(f.full?'full':'open')+'">'+(f.full?'lleno':(f.status||'abierta'))+'</span></td><td>'+(f.vendidos!=null?f.vendidos:'—')+'</td><td>'+(f.cupos_restantes!=null?f.cupos_restantes:'—')+'</td><td><span class="bar"><span style="width:'+pct+'%"></span></span> '+pct+'%</td></tr>';});
  h+='</tbody></table><div class="muted" style="font-size:11px;margin-top:8px">Datos en vivo de Turitop · "Vendidos por función" = capacidad − cupos libres.</div></div>';
  $('wrap').innerHTML=h;
}
$('reload').onclick=load; load();
</script>
</body></html>
