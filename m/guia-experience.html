<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía del Guía · Experience</title>
<style>
:root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--red:#cf6a5a;--blue:#6a93cf}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
header{position:sticky;top:0;z-index:10;background:#15110b;border-bottom:1px solid var(--line);padding:11px 15px;display:flex;align-items:center;gap:10px}
header b{color:var(--gold2)}header .bk{color:var(--muted);cursor:pointer;font-size:13px}
main{padding:14px 15px 80px;max-width:840px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cover{height:96px;background:linear-gradient(135deg,#3a2c12,#7a5a1e);display:flex;align-items:flex-end;color:#fff;font-weight:700;padding:9px;background-size:cover;background-position:center;text-shadow:0 1px 4px #000}
.meta{padding:8px 10px;font-size:12px;color:var(--muted)}
.gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:330px;width:100%}
.gate h2{color:var(--gold2);margin:0 0 6px;font-size:17px}.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin:6px 0}
.gate button{width:100%;background:var(--gold);color:#1a1206;border:0;border-radius:9px;padding:11px;font-weight:700;cursor:pointer;margin-top:6px}
.err{color:var(--red);font-size:12px;min-height:14px}.muted{color:var(--muted);font-size:12px}
#doc{background:#fff;color:#1a1a1a;padding:26px 22px;border-radius:10px;font-size:14px;line-height:1.6}
#doc h1{font-size:20px;margin:0 0 2px;color:#7a5a1e}#doc .sub{color:#777;font-size:12px;margin-bottom:14px}
#doc h3{font-size:14px;margin:16px 0 4px;border-bottom:1px solid #ddd;padding-bottom:3px;color:#3a2c12}
#doc .stop{margin:10px 0;padding-left:12px;border-left:3px solid #e0c98a}
#doc .hora{display:inline-block;background:#f0e6cf;color:#7a5a1e;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px;margin-right:6px}
#doc .narr{font-style:italic;color:#555;margin-top:3px}#doc a{color:#1565c0}
.hide{display:none}
</style></head><body data-v="guia-exp-1">
<div class="gate" id="gate" style="display:none"><div class="box"><h2>Guía del Guía</h2><p class="muted" id="gmsg">Módulo del equipo de Experience. Inicia sesión.</p><input id="lemail" type="email" placeholder="correo"><input id="lpass" type="password" placeholder="contraseña"><div class="err" id="lerr"></div><button id="lbtn">Entrar</button></div></div>
<header><span class="bk" id="bk">← </span><span>🗺️ Guía del Guía <b>· Experience</b></span></header>
<main><div id="view" class="muted">Cargando…</div></main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const ADMIN=['javi@casapepe.mx','contabilidad@casapepe.mx','administracion@casapepe.mx'];
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let TOURS=[],REGLAS=[],T=null;
$('bk').onclick=()=>{if(T){T=null;renderTours();}};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const email=(session?.user?.email||'').toLowerCase();
  if(!email){$('gate').style.display='flex';return;}
  // gate Experience: admin OR jefe sincretico OR empleado area experience
  let ok=ADMIN.includes(email);
  if(!ok){const {data:j}=await sb.from('org_jefes').select('area_key').eq('jefe_email',email);ok=(j||[]).some(x=>x.area_key==='sincretico');}
  if(!ok){const {data:e}=await sb.from('employees').select('area').ilike('email',email).limit(1);ok=(e||[]).some(x=>(x.area||'').toLowerCase().includes('experien'));}
  if(!ok){$('gate').style.display='flex';$('gmsg').textContent='Este módulo es solo para el equipo de Experience.';return;}
  $('gate').style.display='none';
  const [{data:tours},{data:vers},{data:reglas}]=await Promise.all([
    sb.from('tours').select('id,nombre').order('nombre'),
    sb.from('guia_versiones').select('id,tour_id,nombre,autor,cover_url'),
    sb.from('guia_reglas').select('*').eq('ambito','global').order('orden')
  ]);
  REGLAS=reglas||[];const byT={};(vers||[]).forEach(v=>{(byT[v.tour_id]=byT[v.tour_id]||[]).push(v);});
  TOURS=(tours||[]).map(t=>({...t,versiones:byT[t.id]||[]})).filter(t=>t.versiones.length);
  renderTours();
}
$('lbtn').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});if(error){$('lerr').textContent=error.message;return;}boot();};

function cs(u){return u?`style="background-image:url('${esc(u)}')"`:'';}
function renderTours(){
  $('bk').style.visibility='hidden';
  $('view').innerHTML='<div class="grid">'+TOURS.map(t=>{const c=(t.versiones.find(v=>v.cover_url)||{}).cover_url;return `<div class="card" data-t="${t.id}"><div class="cover" ${cs(c)}>${esc(t.nombre)}</div><div class="meta">${t.versiones.length} versión(es)</div></div>`;}).join('')+'</div>'||'Sin guías aún.';
  $('view').querySelectorAll('.card').forEach(c=>c.onclick=()=>renderVers(c.dataset.t));
}
function renderVers(id){
  T=TOURS.find(x=>x.id===id);$('bk').style.visibility='visible';
  $('view').innerHTML='<h3 style="color:var(--gold2)">'+esc(T.nombre)+'</h3><div class="grid">'+T.versiones.map(v=>`<div class="card" data-v="${v.id}"><div class="cover" ${cs(v.cover_url)}>${esc(v.nombre)}</div><div class="meta">${v.autor?('por '+esc(v.autor)):'—'}</div></div>`).join('')+'</div>';
  $('view').querySelectorAll('.card').forEach(c=>c.onclick=()=>openDoc(c.dataset.v));
}
function mapsRoute(PAR){const stops=PAR.map(p=>{const u=(p.maps_url||'').trim();const cm=u.match(/(-?\d+\.\d+),(-?\d+\.\d+)/);return cm?cm[1]+','+cm[2]:encodeURIComponent((p.nombre||'')+', Ciudad de México');}).filter(Boolean);return stops.length<2?null:'https://www.google.com/maps/dir/'+stops.join('/');}
async function openDoc(vid){
  const v=T.versiones.find(x=>x.id===vid);
  const [{data:g},{data:par},{data:mom},{data:vf}]=await Promise.all([
    sb.from('guia_tour').select('*').eq('version_id',vid).maybeSingle(),
    sb.from('guia_paradas').select('*').eq('version_id',vid).order('orden'),
    sb.from('guia_momentos').select('*').eq('version_id',vid).order('orden'),
    sb.from('guia_versiones').select('documento_html').eq('id',vid).single()
  ]);
  const G=g||{},PAR=par||[],MOM=mom||[];const route=mapsRoute(PAR);
  const COS=((await sb.from('tour_costos').select('concepto,cantidad,costo_unitario,tipo_costo').eq('tour_id',T.id).order('orden')).data)||[];const TP=((await sb.from('tours').select('pvp').eq('id',T.id).maybeSingle()).data)||{};
  const cvT=COS.filter(c=>(c.tipo_costo||'variable')==='variable').reduce((s,c)=>s+(c.cantidad||0)*(c.costo_unitario||0),0);
  const costoH=COS.length?'<h3>Costos y PVP</h3><ul>'+COS.map(c=>'<li>'+esc(c.concepto)+' — $'+c.costo_unitario+' ('+esc(c.tipo_costo||'variable')+')</li>').join('')+'<li><b>Costo variable/pax ≈ $'+cvT+'</b>'+(TP.pvp?' · <b>PVP propuesto $'+TP.pvp+'</b>':'')+'</li></ul>':'';
  const reglas=REGLAS.map(r=>`<li>${esc(r.regla)}</li>`).join('');
  const paradas=PAR.map((p,i)=>`<div class="stop">${p.opcional?'<span style="background:#eee;color:#888;border-radius:4px;padding:0 6px;font-size:11px">opcional</span>':''}<div>${p.hora_aprox?`<span class="hora">${esc(p.hora_aprox)}</span>`:''}<b>${i+1}. ${esc(p.nombre)||'Parada'}</b>${p.protagonista?` — <i>${esc(p.protagonista)}</i>`:''}</div>${p.descripcion?`<div>${esc(p.descripcion)}</div>`:''}${p.descripcion_en?`<div style="color:#8a7a55">${esc(p.descripcion_en)}</div>`:''}${p.narrativa?`<div class="narr">“${esc(p.narrativa)}”</div>`:''}${p.narrativa_en?`<div class="narr" style="color:#8a7a55">“${esc(p.narrativa_en)}”</div>`:''}${p.maps_url?`<div><a href="${esc(p.maps_url)}" target="_blank">📍 Maps</a></div>`:''}</div>`).join('');
  const moms=MOM.map(m=>`<li><b>${esc(m.titulo)}</b>${m.descripcion?' — '+esc(m.descripcion):''}</li>`).join('');
  $('view').innerHTML='<div id="doc"><h1>'+esc(T.nombre)+'</h1><div class="sub">Guía del Guía · versión "'+esc(v.nombre)+'"'+(v.autor?(' · por '+esc(v.autor)):'')+' · tiempo máx '+(G.tiempo_max_min||150)+' min</div>'
    +(reglas?'<h3>Reglas base</h3><ul>'+reglas+'</ul>':'')
    +'<h3>Itinerario</h3><p>'+(esc(G.itinerario)||'—')+'</p>'
    +((G.maps_url||route)?'<p style="background:#f5efdf;border:1px solid #e0c98a;border-radius:8px;padding:8px 12px"><a href="'+esc(G.maps_url||route)+'" target="_blank">🗺️ Abrir / descargar la ruta en Google Maps</a><br><span style="font-size:11px;color:#888">Ábrela en tu cel y sigue las paradas.</span></p>':'')+costoH
    +'<h3>Paradas</h3>'+(paradas||'<p>—</p>')
    +(moms?'<h3>Los 10 Imperdibles · Momentos WOW</h3><ul>'+moms+'</ul>':'')+'</div>';
}
boot();
</script></body></html>
