// con filas opcionales acotadas a una sede). Si la carga falla, todos ven "Ser Casa Pepe".
let OBLIG_ROWS = [];
function oblFor(u) {
  if (!u) return [];
  const area = u.puesto || "Colaborador", sede = u.sede || "";
  const out = [];
  OBLIG_ROWS.forEach((r) => {
    if (String(r.puesto) !== area) return;
    if (r.sede && r.sede !== sede) return;
    if (out.indexOf(r.categoria_id) === -1) out.push(r.categoria_id);
  });
  if (!out.length) out.push("pepe");
  return out.filter((cid) => CATEGORIES.some((c) => c.id === cid && !c.construccion));
}

function shuffle(a) { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

// Baja las preguntas de UN tema, la primera vez que entras a él. Después quedan en memoria.
// Pide hasta 300 y de ahí el juego saca 5 al azar: suficiente variedad, descarga chica.
async function asegurarCat(catId) {
  const cat = CATEGORIES.find((c) => c.id === catId);
  if (!cat || cat.questions.length) return cat;
  const traer = async (idioma) => {
    const url = SBU + "/rest/v1/pq_preguntas?select=id,enunciado,opciones,correcta,explicacion,segundos,proyectos"
      + "&activa=is.true&categoria_id=eq." + encodeURIComponent(catId)
      + "&idioma=eq." + idioma + "&limit=300";
    const p = await fetch(url, { headers: SBH }).then(r => r.json()).catch(() => []);
    if (!Array.isArray(p)) return [];
    const out = [];
    p.forEach((q) => {
      const o = Array.isArray(q.opciones) ? q.opciones : [];
      if (!q.enunciado || o.length < 2) return;
      const a = Number(q.correcta);
      if (!(a >= 0 && a < o.length)) return;
      if (!tocaAqui(q.proyectos)) return;
      out.push({ qid: q.id, seg: q.segundos, q: q.enunciado, o: o, a: a, exp: q.explicacion || "" });
    });
    return out;
  };
  let qs = await traer(PQLANG);
  let idioma = PQLANG;
  if (!qs.length && PQLANG !== PQCFG.idioma_base) { qs = await traer(PQCFG.idioma_base); idioma = PQCFG.idioma_base; }
  cat.questions = qs;
  cat.idioma = idioma;
  if (qs.length) cat.construccion = false;
  return cat;
}

function pickQuestions(catId, n) {
  const cat = CATEGORIES.find((c) => c.id === catId);
  if (!cat || cat.questions.length === 0) return [];
  return shuffle(cat.questions).slice(0, n).map((q) => {
    const correct = q.o[q.a];
    const opts = shuffle(q.o);
    return { qid: q.qid, q: q.q, options: opts, a: opts.indexOf(correct), segundos: q.seg || q.segundos, ...explicar(q.q) };
  });
}

    try { if (opp && /^[0-9a-f-]{36}$/i.test(opp.id)) fetch(SBU + "/rest/v1/notificaciones", { method: "POST", headers: { ...SBH, "Content-Type": "application/json" }, body: JSON.stringify({ employee_id: opp.id, titulo: "\u2694\uFE0F Te retaron en PepeQuiz", cuerpo: ((me && me.nombre) || "Alguien") + " te ret\u00f3 en " + ((activeCat && activeCat.nombre) || "PepeQuiz") + ". \u00a1Entra a responder!", icono: "\u2694\uFE0F" }) }); } catch (e) {}
    setScreen("duel"); };

  const finishGym = (earned, correctCount, qs, answers) => {
    updateMe({ walletHist: me.walletHist + earned, walletMes: me.walletMes + earned });
    try { fetch(SBU + "/rest/v1/pq_puntos", { method: "POST", headers: { ...SBH, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ employee_id: meId, pts_hist: me.walletHist + earned, pts_mes: me.walletMes + earned, updated_at: new Date().toISOString() }) }); } catch (e) {}
    // registrar progreso si es categoría obligatoria
    const isObl = obligatorios.includes(activeCat.id);
    let aprobadoAhora = false;
    if (isObl) {
      setProgress((p) => {
        const prev = p[meId]?.[activeCat.id]?.best || 0;
        const best = Math.max(prev, correctCount);
        aprobadoAhora = best > APROBADO_MIN; // >8
        return { ...p, [meId]: { ...(p[meId] || {}), [activeCat.id]: { best, estado: aprobadoAhora ? "aprobado" : "pendiente" } } };
      });
    }
    setLastResult({ mode: "gym", earned, correctCount, isObl, cat: activeCat, qs, answers });
    setScreen("result");
  };

  const finishDuel = (myScore, oppScore) => {
    const won = myScore > oppScore, tie = myScore === oppScore;
    const diff = Math.abs(myScore - oppScore); // margen del marcador
    // Cada quien suma SOLO lo que logró en su test.
    // Además, el PERDEDOR pierde la diferencia de su cartera. El ganador NO la recibe.
    let myDelta = myScore;
    let oppDelta = oppScore;
    if (won) {
      oppDelta -= diff;  // el rival (perdedor) pierde la diferencia
    } else if (!tie) {
      myDelta -= diff;   // tú (perdedor) pierdes la diferencia
    }
    updateMe({ walletHist: Math.max(0, me.walletHist + myDelta), walletMes: Math.max(0, me.walletMes + myDelta) });
    try { if (meId && /^[0-9a-f-]{36}$/i.test(meId)) fetch(SBU + "/rest/v1/pq_puntos", { method: "POST", headers: { ...SBH, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ employee_id: meId, pts_hist: Math.max(0, me.walletHist + myDelta), pts_mes: Math.max(0, me.walletMes + myDelta), updated_at: new Date().toISOString() }) }); } catch (e) {}
    try {
      const _r = ((me && me.nombre) || "T\u00fa") + " " + myScore + " vs " + ((opponent && opponent.nombre) || "rival") + " " + oppScore + " \u00b7 " + (won ? ("gan\u00f3 " + ((me && me.nombre) || "t\u00fa")) : (tie ? "empate" : ("gan\u00f3 " + ((opponent && opponent.nombre) || "rival"))));
      const _n = (eid) => { if (eid && /^[0-9a-f-]{36}$/i.test(eid)) fetch(SBU + "/rest/v1/notificaciones", { method: "POST", headers: { ...SBH, "Content-Type": "application/json" }, body: JSON.stringify({ employee_id: eid, titulo: "\u2694\uFE0F Resultado de reto", cuerpo: _r, icono: "\u2694\uFE0F" }) }); };
      _n(opponent && opponent.id); _n(meId);
    } catch (e) {}
    setUsers((us) => us.map((u) => (u.id === opponent.id ? { ...u, walletHist: Math.max(0, u.walletHist + oppDelta), walletMes: Math.max(0, u.walletMes + oppDelta) } : u)));
    setLastResult({ mode: "duel", myScore, oppScore, won, tie, diff, myDelta, opp: opponent });
    setScreen("result");
  };

  return (
    <div style={S.app}>
      <Style />
      <div style={S.phone}>
        {me && <TopBar me={me} onHome={() => setScreen("home")} onLogout={() => setScreen("home")} />}
        <div style={S.body}>
          {(screen === "loading" || screen === "cargandocat") && <Cargando />}
          {(screen === "noauth") && <div style={{padding:"48px 20px",textAlign:"center",color:"#a99a82"}}>Inicia sesi\u00f3n en SoyPepe para jugar PepeQuiz.</div>}
          {screen === "home" && <Home me={me} pendientes={pendientes} obligatorios={obligatorios}
            onGym={startGym} onDuel={startDuel} onRank={() => setScreen("rank")} onPrueba={() => setScreen("prueba")} onAdmin={() => setScreen("admin")} />}
          {screen === "prueba" && <Prueba me={me} obligatorios={obligatorios} prog={myProg}
            onTrain={async (catId) => { setMode("gym"); setActiveCat(CATEGORIES.find((c) => c.id === catId)); setScreen("cargandocat"); try { await asegurarCat(catId); } catch (e) {} setScreen("gym"); }} />}
          {screen === "rank" && <Ranking users={users} meId={meId} />}
          {screen === "admin" && <Admin users={users} progress={progress} />}
          {screen === "catselect" && <CatSelect mode={mode} obligatorios={obligatorios} prog={myProg} onPick={onCatChosen} />}
          {screen === "gym" && <GymGame cat={activeCat} isObl={obligatorios.includes(activeCat.id)} onFinish={finishGym} />}
          {screen === "duelselect" && <DuelSelect me={me} cat={activeCat} users={users} onPick={onOppChosen} />}
          {screen === "duel" && <DuelGame cat={activeCat} opponent={opponent} onFinish={finishDuel} />}
          {screen === "result" && <Result res={lastResult} onAgain={() => setScreen("home")} onReview={() => setScreen("review")} />}
          {screen === "review" && <Review res={lastResult} onBack={() => setScreen("result")} onHome={() => setScreen("home")} />}
        </div>
      </div>
    </div>
  );
}

function Cargando() {
  const FRASES_ES = [
    "El Quetzalcóatl ya casi lo alcanza…",
    "Cuidado con el agave…",
    "Ajustando la máscara…",
    "El público se levanta…",
    "Ya casi sube al ring…",
  ];
  const FRASES_EN = [
    "The Quetzalcóatl is closing in…",
    "Watch out for the agave…",
    "Adjusting the mask…",
    "The crowd is on its feet…",
    "Almost in the ring…",
  ];
  const frases = PQLANG === "en" ? FRASES_EN : FRASES_ES;
  const [pct, setPct] = useState(6);
  const [i, setI] = useState(0);

  useEffect(() => {
    // avanza rápido al principio y se va frenando: nunca llega solo al 100
    const t = setInterval(() => setPct(p => (p >= 94 ? 94 : p + Math.max(0.6, (96 - p) * 0.055))), 110);
    const f = setInterval(() => setI(x => (x + 1) % frases.length), 1600);
    return () => { clearInterval(t); clearInterval(f); };
  }, []);

  // El agave está clavado a media pista. El Quetzalcóatl lo salta al pasar.
  const AGAVE = 38;
  const x = 4 + pct * 0.50;              // el perseguidor: nunca alcanza el borde
  const huye = x + 34;                   // el que escapa va bien por delante: se ve la persecución
  const salta = Math.abs(x - AGAVE) < 10;
  const alto = salta ? Math.round(28 * (1 - Math.pow((x - AGAVE) / 10, 2))) : 0;

  return (
    <div style={{ padding: "56px 22px 40px", textAlign: "center" }}>
      <style>{`
        @keyframes pqCorre { 0%,100%{transform:scaleX(-1) translateY(0) rotate(3deg)} 50%{transform:scaleX(-1) translateY(-5px) rotate(-3deg)} }
        @keyframes pqHuye  { 0%,100%{transform:translateY(0) rotate(2deg) scaleX(1)} 50%{transform:translateY(-7px) rotate(-2deg) scaleX(1)} }
        @keyframes pqPolvo { 0%{opacity:.5; transform:translateX(0) scale(.7)} 100%{opacity:0; transform:translateX(-18px) scale(1.3)} }
        @keyframes pqLuz   { 0%,100%{opacity:.35} 50%{opacity:.75} }
      `}</style>

      <div style={{ position: "relative", height: 96, maxWidth: 320, margin: "0 auto 6px" }}>
        {/* el agave: fijo, es el obstáculo */}
        <img src="/stickers/agave.webp" alt="" style={{ position: "absolute", left: "calc(" + AGAVE + "% - 21px)", bottom: 0,
              height: 42, width: "auto", filter: "drop-shadow(0 4px 8px rgba(0,0,0,.5))" }} />

        {/* el que escapa */}
        <img src="/stickers/escapan.webp" alt="" style={{ position: "absolute", left: "calc(" + huye + "% - 26px)", bottom: 4,
              height: 62, width: "auto", transition: "left .35s linear",
              animation: "pqHuye .58s ease-in-out infinite", filter: "drop-shadow(0 6px 10px rgba(0,0,0,.45))" }} />

        {/* el Quetzalcóatl que persigue */}
        <div style={{ position: "absolute", left: "calc(" + x + "% - 30px)", bottom: 4 + alto, transition: "left .35s linear, bottom .2s ease-out" }}>
          <div style={{ position: "absolute", left: 6, bottom: 2, width: 14, height: 6, borderRadius: 8,
                        background: "#E9B44C", opacity: alto ? 0 : 1, animation: "pqPolvo .7s linear infinite", left: 2 }} />
          <img src="/stickers/quetzal.webp" alt="" style={{ height: 72, width: "auto", display: "block",
                animation: "pqCorre .5s ease-in-out infinite", filter: "drop-shadow(0 6px 10px rgba(0,0,0,.45))" }} />
        </div>
      </div>

      <div style={{ maxWidth: 320, margin: "0 auto", height: 12, borderRadius: 99, background: "#ffffff12",
                    border: "1px solid #ffffff1c", overflow: "hidden", position: "relative" }}>
        <div style={{ height: "100%", width: pct + "%", borderRadius: 99, transition: "width .35s linear",
                      background: "linear-gradient(90deg,#D2632F,#E9B44C)" }} />
      </div>

      <div style={{ marginTop: 16, fontFamily: "'Clarendon','Roboto Slab',Georgia,serif", fontSize: 17, color: "#f6efe4" }}>
        {L("Cargando tu perfil…")}
      </div>
      <div style={{ marginTop: 6, fontSize: 13.5, color: "#a99a82", minHeight: 20, animation: "pqLuz 1.6s ease-in-out infinite" }}>
        {frases[i]}
      </div>
    </div>
  );
}

function Auditoria({ qid, enunciado, onCerrar }) {
  const [motivo, setMotivo] = useState(null);
  const [nota, setNota] = useState("");
  const [enviando, setEnviando] = useState(false);
  const [hecho, setHecho] = useState(null);
  const es = PQLANG !== "en";

  const enviar = async (m) => {
    setEnviando(true);
    try {
      const r = await pqRpc("pq_auditar", { p_pregunta: qid, p_motivo: m, p_nota: nota || null });
      setHecho(r && r.ok ? (r.fuera_del_juego ? "fuera" : "ok") : "error");
    } catch (e) { setHecho("error"); }
    setEnviando(false);
  };

  const fondo = { position: "fixed", inset: 0, background: "rgba(10,7,5,.78)", zIndex: 90,
                  display: "flex", alignItems: "flex-end", justifyContent: "center" };
  const hoja = { width: "100%", maxWidth: 560, background: "#1a1512", borderTop: "1px solid #ffffff1f",
                 borderRadius: "22px 22px 0 0", padding: "20px 18px 26px", maxHeight: "86vh", overflowY: "auto" };
  const fila = (on) => ({ display: "flex", alignItems: "center", gap: 11, width: "100%", cursor: "pointer",
    font: "inherit", textAlign: "left", padding: "13px 14px", marginBottom: 8, borderRadius: 14, fontSize: 14.5,
    border: "1px solid " + (on ? "#E9B44C" : "#ffffff1a"), background: on ? "#E9B44C1f" : "#ffffff08",
    color: on ? "#E9B44C" : "#e7dcc9" });

  if (hecho) {
    return (
      <div style={fondo} onClick={onCerrar}>
        <div style={hoja} onClick={(e) => e.stopPropagation()}>
          <div style={{ fontSize: 34, textAlign: "center" }}>{hecho === "error" ? "😕" : "✅"}</div>
          <div style={{ textAlign: "center", fontSize: 16, color: "#f6efe4", marginTop: 10, fontWeight: 700 }}>
            {hecho === "error" ? (es ? "No se pudo guardar" : "Could not save")
              : hecho === "fuera" ? (es ? "Marcada y fuera del juego" : "Flagged and out of play")
              : (es ? "Marcada para revisión" : "Flagged for review")}
          </div>
          <div style={{ textAlign: "center", fontSize: 13, color: "#a99a82", marginTop: 8, lineHeight: 1.5 }}>
            {hecho === "fuera"
              ? (es ? "Deja de aparecer desde ahora. No se borró nada: se puede regresar desde la bandeja de auditoría."
                    : "It stops showing from now on. Nothing was deleted: it can be brought back from the audit inbox.")
              : hecho === "ok"
              ? (es ? "Sigue en juego hasta que alguien la corrija." : "It stays in play until someone fixes it.")
              : (es ? "Revisa tu conexión e inténtalo otra vez." : "Check your connection and try again.")}
          </div>
          <button style={{ ...fila(false), justifyContent: "center", marginTop: 16 }} onClick={onCerrar}>
            {es ? "Seguir jugando" : "Keep playing"}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div style={fondo} onClick={onCerrar}>
      <div style={hoja} onClick={(e) => e.stopPropagation()}>
        <div style={{ fontFamily: "'Clarendon','Roboto Slab',Georgia,serif", fontSize: 19, color: "#f6efe4" }}>
          {es ? "¿Qué tiene esta pregunta?" : "What's wrong with this one?"}
        </div>
        <div style={{ fontSize: 12.5, color: "#a99a82", margin: "6px 0 14px", lineHeight: 1.45 }}>
          {es ? "El juego está en pausa. Nadie más ve esto." : "The game is paused. Nobody else sees this."}
        </div>
        <div style={{ background: "#ffffff08", border: "1px solid #ffffff14", borderRadius: 12,
                      padding: "10px 12px", fontSize: 13, color: "#cabfae", marginBottom: 14, lineHeight: 1.45 }}>
          {enunciado}
        </div>
        {MOTIVOS.map((m) => (
          <button key={m.id} style={fila(motivo === m.id)} onClick={() => setMotivo(m.id)}>
            <span style={{ fontSize: 18 }}>{m.ic}</span>
            <span style={{ flex: 1 }}>{es ? m.es : m.en}</span>
            {m.saca && <span style={{ fontSize: 11, color: "#d2632f", fontWeight: 700 }}>{es ? "la saca" : "removes it"}</span>}
          </button>
        ))}
        <textarea value={nota} onChange={(e) => setNota(e.target.value)}
          placeholder={es ? "Nota para quien la corrija (opcional)" : "Note for whoever fixes it (optional)"}
          style={{ width: "100%", boxSizing: "border-box", minHeight: 64, marginTop: 6, padding: "11px 12px",
                   borderRadius: 12, border: "1px solid #ffffff1a", background: "#ffffff08", color: "#fff",
                   font: "inherit", fontSize: 14, outline: "none", resize: "vertical" }} />
        <div style={{ display: "flex", gap: 9, marginTop: 14 }}>
          <button style={{ ...fila(false), flex: 1, justifyContent: "center", marginBottom: 0 }} onClick={onCerrar}>
            {es ? "Cancelar" : "Cancel"}
          </button>
          <button
            disabled={!motivo || enviando}
            onClick={() => motivo && enviar(motivo)}
            style={{ flex: 1.4, cursor: motivo ? "pointer" : "not-allowed", font: "inherit", fontSize: 14.5,
                     fontWeight: 800, padding: "13px 14px", borderRadius: 14, border: "none",
                     background: motivo ? "#E9B44C" : "#ffffff14", color: motivo ? "#1a1512" : "#8b7f6f" }}>
            {enviando ? (es ? "Guardando…" : "Saving…") : (es ? "Marcar" : "Flag it")}
          </button>
        </div>
      </div>
    </div>
  );
}

function RelojBarra() {
  // El reloj tiene que verse mientras lees las opciones, no sólo arriba de la tarjeta.
  const [, forzar] = useState(0);
  useEffect(() => {
    const f = () => forzar((n) => n + 1);
    RELOJ.subs.push(f);
    return () => { RELOJ.subs = RELOJ.subs.filter((x) => x !== f); };
  }, []);
  if (RELOJ.t === null) return null;
  const w = RELOJ.w || 10;
  const r = Math.max(0, Math.min(1, RELOJ.t / w));

/* ===================== GYM ===================== */
function GymGame({ cat, isObl, onFinish }) {
  const [qs] = useState(() => pickQuestions(cat.id, GYM_QS));
  const [auditando, setAuditando] = useState(false);
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [earned, setEarned] = useState(0);
  const [correct, setCorrect] = useState(0);
  const win = () => (qs[idx] && qs[idx].segundos) || GYM_WINDOW; // el tiempo lo marca la longitud del texto
  const [tLeft, setTLeft] = useState(win);
  const [pop, setPop] = useState(null);
  const [cuenta, setCuenta] = useState(5);   // 5-4-3-2-1, sólo al empezar la ronda
  const answers = useRef([]); // [{picked}] por pregunta, para el repaso
  const timer = useRef(null);

  useEffect(() => {   // la cuenta atrás de aviso
    if (cuenta === null) return;
    const t = setTimeout(() => setCuenta((c) => (c > 1 ? c - 1 : null)), 1000);
    return () => clearTimeout(t);
  }, [cuenta]);

  useEffect(() => {
    if (auditando || cuenta !== null) { clearInterval(timer.current); return; }  // se para mientras auditas o cuentas
    timer.current = setInterval(() => {
      setTLeft((t) => { if (t <= 0.1) { clearInterval(timer.current); handle(-1, 0); return 0; } return +(t - 0.1).toFixed(1); });
    }, 100);
    return () => clearInterval(timer.current);
    // eslint-disable-next-line
  }, [idx, auditando, cuenta]);

  useEffect(() => { setTLeft(win()); /* eslint-disable-next-line */ }, [idx]);

  useEffect(() => { relojPub(cuenta !== null ? null : tLeft, win(), cat.color); /* eslint-disable-next-line */ }, [tLeft, cuenta]);
  useEffect(() => relojOff, []);

  const handle = (choice, ratioOv) => {
    if (picked !== null) return;
    clearInterval(timer.current);
    const ratio = ratioOv !== undefined ? ratioOv : tLeft / win();
    const ok = choice === qs[idx].a;
    const pts = ok ? gymPts(ratio) : 0;
    answers.current[idx] = { picked: choice }; // -1 si se acabó el tiempo
    const _m = pqMult(cat.idioma || "es");
    setPicked(choice); setEarned((e) => e + pts); if (ok) setCorrect((c) => c + 1);
    setPop(ok ? `+${Math.round(pts * _m)}` : "✗");
    setTimeout(() => {
      setPop(null);
      if (idx + 1 < qs.length) { setIdx(idx + 1); setPicked(null); }
      else onFinish(Math.round((earned + pts) * pqMult(cat.idioma || "es")), correct + (ok ? 1 : 0), qs, answers.current);
    }, 1050);
  };

  const cur = qs[idx];
  return (
    <div style={S.screen}>
      <GameHeader cat={cat} idx={idx} total={qs.length} right={
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <BotonAuditar onAbrir={() => setAuditando(true)} />
          <TimerRing ratio={tLeft / win()} color={cat.color} label={Math.ceil(tLeft)} />
        </div>} />
      {auditando && qs[idx] && <Auditoria qid={qs[idx].qid} enunciado={qs[idx].q} onCerrar={() => setAuditando(false)} />}
      {isObl && <div style={S.oblNote}>{L("★ Quiz obligatorio · necesitas más de 8 aciertos para aprobar")}</div>}
      <div style={S.scoreRow}><span style={S.muted}>{L("Cartera del test")}</span><strong style={{ color: "#E9B44C" }}>{earned} pts · {correct}/{idx} ✓</strong></div>
      {cuenta !== null
        ? <Preparate cat={cat} n={cuenta} frase={frasePrev(cat.id, idx)} />
        : <QuestionCard cur={cur} picked={picked} onPick={(i) => handle(i)} color={cat.color} />}
      {pop && <Pop txt={pop} good={pop[0] === "+"} />}
    </div>
  );
}

/* ===================== DUEL GAME ===================== */
function DuelGame({ cat, opponent, onFinish }) {
  const [qs] = useState(() => pickQuestions(cat.id, DUEL_QS));
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [my, setMy] = useState(0);
  const [opp, setOpp] = useState(0);
  const [tLeft, setTLeft] = useState(ventana(qs[0], DUEL_WINDOW));
  const [pop, setPop] = useState(null);
  const [oppPop, setOppPop] = useState(null);
  const timer = useRef(null);
  const [cuenta, setCuenta] = useState(5);   // 5-4-3-2-1, sólo al empezar la ronda
  const skill = BOT_SKILL[opponent.id] ?? 0.78;

  useEffect(() => {
    if (cuenta === null) return;
    const t = setTimeout(() => setCuenta((c) => (c > 1 ? c - 1 : null)), 1000);
    return () => clearTimeout(t);
  }, [cuenta]);

  useEffect(() => { setTLeft(ventana(qs[idx], DUEL_WINDOW)); /* eslint-disable-next-line */ }, [idx]);

  useEffect(() => {
    if (cuenta !== null) { clearInterval(timer.current); return; }
    timer.current = setInterval(() => {
      setTLeft((t) => { if (t <= 0.1) { clearInterval(timer.current); resolve(-1, ventana(qs[idx], DUEL_WINDOW)); return 0; } return +(t - 0.1).toFixed(1); });
    }, 100);
    return () => clearInterval(timer.current);
    // eslint-disable-next-line
  }, [idx, cuenta]);

  useEffect(() => { relojPub(cuenta !== null ? null : tLeft, ventana(qs[idx], DUEL_WINDOW), cat.color); /* eslint-disable-next-line */ }, [tLeft, cuenta]);
  useEffect(() => relojOff, []);

  const resolve = (choice, elapsedOv) => {
    if (picked !== null) return;
    clearInterval(timer.current);
    const elapsed = elapsedOv !== undefined ? elapsedOv : ventana(qs[idx], DUEL_WINDOW) - tLeft;
    const ok = choice === qs[idx].a;
    const myPts = ok ? duelPts(elapsed) : 0;
    const oppOk = Math.random() < skill;
    const oPts = oppOk ? duelPts(1.5 + Math.random() * 5) : 0;
    setPicked(choice); setMy((s) => s + myPts); setOpp((s) => s + oPts);
    setPop(ok ? `+${myPts}` : "✗"); setOppPop(oppOk ? `+${oPts}` : "✗");
    setTimeout(() => {
      setPop(null); setOppPop(null);
      if (idx + 1 < qs.length) { setIdx(idx + 1); setPicked(null); }
      else onFinish(my + myPts, opp + oPts);
    }, 1250);
  };

  const cur = qs[idx];
  return (
    <div style={S.screen}>
      <div style={S.versusRow}>
        <PlayerChip avatar="🙋" name="Tú" score={my} pop={pop} side="left" color={cat.color} />
        <div style={S.vsCenter}><TimerRing ratio={tLeft / ventana(qs[idx], DUEL_WINDOW)} color="#E9B44C" label={Math.ceil(tLeft)} /><div style={S.vsTxt}>VS</div></div>
        <PlayerChip avatar={opponent.avatar} name={opponent.nombre} score={opp} pop={oppPop} side="right" color="#3E7CB1" />
      </div>
      <GameHeader cat={cat} idx={idx} total={qs.length} compact />
      {cuenta !== null
        ? <Preparate cat={cat} n={cuenta} frase={frasePrev(cat.id, idx)} />
        : <QuestionCard cur={cur} picked={picked} onPick={(i) => resolve(i)} color={cat.color} />}
    </div>
  );
}

/* ===================== REVIEW (repaso post-Gym) ===================== */
function Review({ res, onBack, onHome }) {
  if (!res || !res.qs) return null;
  const { qs, answers, cat } = res;
  return (
    <div style={S.screen}>
      <h2 style={S.h2}>Repaso · {cat.emoji} {cat.name}</h2>
      <p style={S.muted}>{L("Revisa cada respuesta y profundiza con el enlace. Así afianzas el conocimiento.")}</p>
      <div style={S.revList}>
        {qs.map((q, i) => {
          const picked = answers[i]?.picked;
          const acerto = picked === q.a;
          return (
            <div key={i} style={{ ...S.revCard, borderColor: acerto ? "#7BD389" : "#E0654A" }}>
              <div style={S.revHead}>
                <span style={{ ...S.revTag, background: acerto ? "#234d2c" : "#4d2326", color: acerto ? "#cdeccf" : "#f3b8ab" }}>{acerto ? "Acertaste" : "Fallaste"}</span>
                <span style={S.revNum}>Pregunta {i + 1}</span>
              </div>
              <p style={S.revQ}>{q.q}</p>
              <div style={S.revOpts}>
                {q.options.map((opt, j) => {
                  const isCorrect = j === q.a;
                  const isPicked = j === picked;
                  let st = { ...S.revOpt };
                  if (isCorrect) st = { ...S.revOpt, ...S.revOptGood };
                  else if (isPicked) st = { ...S.revOpt, ...S.revOptBad };
                  return (
                    <div key={j} style={st}>
                      <span style={{ width: 16, fontWeight: 800 }}>{String.fromCharCode(65 + j)}</span>
                      {opt}
                      {isCorrect && <span style={S.revMark}>✓</span>}
                      {isPicked && !isCorrect && <span style={S.revMark}>{L("tu respuesta")}</span>}
                    </div>
                  );
                })}
              </div>
              {q.explicacion
                ? <div style={S.revExpl}>💡 {q.explicacion}</div>
                : <div style={{ ...S.revExpl, color: "#ffffff66" }}>{L("💡 Explicación por agregar.")}</div>}
              {q.fuente_url && (
                <a href={q.fuente_url} target="_blank" rel="noopener noreferrer" style={S.revLink}>
                  🔗 {q.fuente_label || L("Más información")} →
                </a>
              )}
            </div>
          );
        })}
      </div>
      <div style={S.homeRow}>
        <button style={S.smallBtn} onClick={onBack}>{L("← Resultado")}</button>
        <button style={S.primaryBtn} onClick={onHome}>{L("Volver al inicio")}</button>
      </div>
    </div>
  );
}

function Ranking({ users, meId }) {
  const [plaza, setPlaza] = useState("Todas");
  const [periodo, setPeriodo] = useState("mes");   // mes por defecto
  const [pts, setPts] = useState(null);            // {employee_id: pts} del periodo elegido
  const anio = new Date().getFullYear();

  useEffect(() => {
    let vivo = true;
    setPts(null);
    pqRpc("pq_ranking", { periodo }).then((r) => {
      if (!vivo) return;
      const m = {};
      (Array.isArray(r) ? r : []).forEach((x) => { m[x.employee_id] = Number(x.pts) || 0; });
      setPts(m);
    }).catch(() => vivo && setPts({}));
    return () => { vivo = false; };
  }, [periodo]);

  const esCDMX = (u) => (u.sede === "CDMX" || u.sede === "Virreyes");
  const board = (pts === null ? [] : users.map((u) => ({ ...u, p: pts[u.id] || 0 })))
    .filter((u) => u.p > 0)                       // quien no ha jugado no sale en la tabla
    .filter((u) => plaza === "Todas" || (plaza === "CDMX" ? esCDMX(u) : u.sede === plaza))
    .sort((a, b) => b.p - a.p);

  const chipR = (on) => ({ display: "flex", alignItems: "center", gap: 7, flex: "0 0 auto", cursor: "pointer",
    font: "inherit", padding: "7px 13px", borderRadius: 20, fontSize: 13, fontWeight: 700,
    border: "1px solid " + (on ? "#E9B44C" : "#ffffff22"),
    background: on ? "#E9B44C22" : "transparent", color: on ? "#E9B44C" : "#cdbfa8" });
  const medals = ["🥇", "🥈", "🥉"];
  const periodos = [
    { k: "semana", t: L("Esta semana") },
    { k: "mes",    t: L("Este mes") },
    { k: "anio",   t: String(anio) },
    { k: "hist",   t: L("Histórico") },
  ];

  return (
    <div style={S.screen}>
      <h2 style={S.h2}>Los Vasconcelistas</h2>
      <p style={S.muted}>{L("El que más sabe de la casa. Los puntos del mes no se acumulan al siguiente; premios al cierre.")}</p>

      <div style={{ display: "flex", gap: 7, overflowX: "auto", padding: "2px 0 8px" }}>
        {periodos.map((x) => (
          <button key={x.k} style={chipR(periodo === x.k)} onClick={() => setPeriodo(x.k)}>{x.t}</button>
        ))}
      </div>
      <div style={{ display: "flex", gap: 7, overflowX: "auto", padding: "0 0 10px" }}>
        <button style={chipR(plaza === "Todas")} onClick={() => setPlaza("Todas")}>{L("General")}</button>
        <button style={chipR(plaza === "CDMX")} onClick={() => setPlaza("CDMX")}><Sticker sede="CDMX" size={20} /> CDMX</button>
        <button style={chipR(plaza === "Puebla")} onClick={() => setPlaza("Puebla")}><Sticker sede="Puebla" size={20} /> Puebla</button>
      </div>

      {pts === null && <p style={S.muted}>{L("Contando puntos…")}</p>}
      {pts !== null && board.length === 0 &&
        <p style={S.muted}>{L("Todavía nadie ha jugado en este periodo. El primero que entre encabeza la tabla.")}</p>}

      <div style={S.rankList}>
        {board.map((p, i) => (
          <div key={p.id} style={{ ...S.rankRow, ...(p.id === meId ? S.rankMe : {}) }}>
            <div style={S.rankPos}>{medals[i] || i + 1}</div>
            <div style={S.rankAv}>{p.avatar}</div>
            <div style={{ flex: 1, fontWeight: p.id === meId ? 800 : 600 }}>
              <span style={{ display: "flex", alignItems: "center", gap: 7 }}>{p.nombre}{p.id === meId && (" " + L("(tú)"))}<Sticker sede={p.sede} size={20} /></span>
              <div style={S.rankRole}>{p.puesto}</div>
            </div>
            <div style={S.rankPts}>{p.p} pts</div>
          </div>
        ))}
      </div>
      <div style={S.premioBox}>🎁 <strong>{L("Premios")}</strong> · por definir (mensual / semestral / anual)</div>
    </div>
  );
}

function Admin({ users, progress }) {
  return (
    <div style={S.screen}>
      <h2 style={S.h2}>{L("Equipo · estado de prueba")}</h2>
      <p style={S.muted}>{L("Vista de operación/RRHH: avance de onboarding por colaborador.")}</p>
      <div style={S.rankList}>
        {users.map((u) => {
          const obl = oblFor(u);
          const prog = progress[u.id] || {};
          const done = obl.filter((c) => prog[c]?.estado === "aprobado").length;
          const ok = obl.length > 0 && done === obl.length;
          return (
            <div key={u.id} style={S.adminRow}>
              <div style={S.rankAv}>{u.avatar}</div>
              <div style={{ flex: 1 }}>
                <div style={{ fontWeight: 700, color: "#fff" }}>{u.nombre} <span style={S.rankRole}>· {u.puesto}</span></div>
                <div style={S.muted}>{u.enPrueba ? `Prueba: ${done}/${obl.length} quizzes` : "Planta"}</div>
              </div>
              {u.enPrueba && <span style={{ ...S.okBadge, background: ok ? "#234d2c" : "#3a2a12", color: ok ? "#cdeccf" : "#f0d9a0" }}>{ok ? "Completa ✓" : "En curso"}</span>}
            </div>
          );
        })}
      </div>
    </div>
  );
}
