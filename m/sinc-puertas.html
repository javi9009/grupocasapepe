<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sincrético · Puertas</title>
<!--
  PUERTAS · los ateneístas que no pueden entrar.
  ---------------------------------------------------------------------------
  Javi, 29-oct-2026, tras el barrido: «ármame una pantalla con los ateneístas
  con problemas para ir abriéndoles la puerta y que se resuelvan».

  Lo que esta pantalla arregla no es un dato: es una ASIMETRÍA. Para entrar al
  portal hacen falta dos cosas que viven en sitios distintos —la ficha en
  `tour_operadores` y una fila en `tour_operador_usuarios` que diga qué correo
  es de qué ficha— y nadie obliga a que existan las dos. Se puede crear una
  ficha sin llave y una cuenta sin ficha, y no hay ningún aviso: nos enteramos
  cuando la persona llama diciendo que no puede entrar. Le pasó a Dina de
  Tekpan, y había catorce más detrás.

  Tres montones, y cada uno se arregla distinto:

    SIN LLAVE  · la ficha existe y nadie tiene llave. Si la ficha trae correo,
                 se abre de un botón. Si no, hay que pedírselo primero: la
                 pantalla lo dice en vez de ofrecer un botón que no funciona.
    SOLICITUD  · pidió darse de alta y nunca se le creó ficha.
    SIN FICHA  · tiene cuenta y contraseña, y no hay ficha detrás: entra y el
                 sistema no sabe de quién es.

  Abrir la puerta son dos movimientos separados a propósito: primero la llave
  (la fila de usuario), y sólo después el correo. Así se puede arreglar el
  censo sin escribirle a nadie, que es lo que hace falta con los de prueba y
  con los que ya hablaste por otro lado.
-->
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1080px;margin:0 auto}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5;max-width:68ch}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin-top:10px}
.secnav-in{max-width:1080px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav .n{display:inline-block;min-width:19px;padding:1px 6px;margin-left:6px;border-radius:999px;background:var(--surface-2);font-size:11px;font-weight:700;color:var(--ink-2)}
.wrap{max-width:1080px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.5}
.panel{display:none}.panel.on{display:block}
.fila{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule);flex-wrap:wrap}
.fila:first-of-type{border-top:0}
.fila .quien{flex:1 1 260px;min-width:0}
.fila .quien b{display:block;font-size:14px}
.fila .quien .m{font-size:12.5px;color:var(--muted);line-height:1.45;margin-top:2px;word-break:break-word}
.fila .acc{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.btn{cursor:pointer;font:inherit;font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:default;filter:none}
.btn.gris{background:var(--surface);color:var(--ink-2);border-color:var(--rule)}
.btn.gris:hover{background:var(--surface-3)}
.p{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.p.activo{background:var(--ok-bg);color:var(--ok)}
.p.borrador,.p.en_revision,.p.nueva{background:var(--warn-bg);color:var(--warn)}
.p.otro{background:var(--none-bg);color:var(--none)}
.aviso{border-radius:10px;padding:11px 13px;font-size:13px;line-height:1.5;margin-bottom:12px}
.aviso.info{background:#E7EFF6;color:#1C4E80}
.aviso.mal{background:var(--bad-bg);color:var(--bad)}
.aviso.bien{background:var(--ok-bg);color:var(--ok)}
.vacio{color:var(--faint);font-size:13px;padding:16px 0;text-align:center}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:60;background:var(--ink);color:#fff;
  padding:11px 17px;border-radius:10px;font-size:13.5px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);max-width:90vw}
</style></head><body>

<div class="top">
  <h1>Puertas</h1>
  <div class="sub">Quien no puede entrar aunque debería. Para entrar al portal hacen falta dos cosas:
    su ficha y una llave que diga qué correo es de qué ficha. Aquí salen los que tienen una y no la otra.</div>
</div>

<div class="secnav"><div class="secnav-in" id="nav"></div></div>

<div class="wrap">
  <div id="cargando" class="vacio">Mirando quién se quedó fuera…</div>
  <div id="panels"></div>
</div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(i){return document.getElementById(i);};
var SES=null, DATOS=[], ACT='sin_llave';

var GRUPOS=[
  ['sin_llave','Sin llave',
   'Tienen ficha y nadie puede entrar. Si la ficha trae correo, se abre de un botón: se crea su usuario y ya puede entrar. Si no trae correo, hay que pedírselo antes — no hay forma de abrirle una puerta a nadie sin saber su correo.'],
  ['solicitud','Solicitudes colgadas',
   'Pidieron darse de alta y nunca se les creó ficha. Lo que les falta no es una llave: es el alta entera. Lo más limpio es mandarles el enlace para que la hagan ellos, que es quien sabe sus datos.'],
  ['cuenta_huerfana','Cuentas sin ficha',
   'Tienen cuenta y contraseña, y no hay ficha detrás. Entran y el sistema no sabe de quién son. Si alguno debía ser ateneísta, mándale el alta; si era un huésped o una prueba, déjalo.']
];

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function hdr(extra){
  var h={'apikey':KEY,'Authorization':'Bearer '+((SES&&SES.access_token)||KEY),'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
var TFLASH=null;
function flash(t){
  var d=$('flash');
  if(!d){ d=document.createElement('div'); d.id='flash'; d.className='flash'; document.body.appendChild(d); }
  d.textContent=t; d.style.display='block';
  clearTimeout(TFLASH); TFLASH=setTimeout(function(){ d.style.display='none'; },4200);
}

/* La sesión la guarda el marco del panel; aquí sólo se lee. Sin ella la lista
   no se puede pedir —es de casa— y se dice, en vez de enseñar una pantalla
   vacía que parece que no hay nadie atascado. */
function sesion(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k=localStorage.key(i);
      if(k && k.indexOf('-auth-token')>0){
        var v=JSON.parse(localStorage.getItem(k));
        if(v && v.access_token) return v;
        if(v && v.currentSession && v.currentSession.access_token) return v.currentSession;
      }
    }
  }catch(_){}
  return null;
}

async function carga(){
  var r=await fetch(SB+'/rest/v1/rpc/sinc_puertas',{method:'POST',headers:hdr(),body:'{}'});
  if(!r.ok){
    var t=(await r.text()).slice(0,160);
    $('cargando').innerHTML='<div class="aviso mal">No pudimos leer la lista. '+esc(t)+'</div>';
    return;
  }
  DATOS=await r.json();
  pinta();
}

function cuenta(g){ return DATOS.filter(function(x){return x.grupo===g;}).length; }

function pinta(){
  $('cargando').style.display='none';
  $('nav').innerHTML=GRUPOS.map(function(g){
    return '<button data-g="'+g[0]+'" aria-selected="'+(g[0]===ACT)+'">'+esc(g[1])+
      '<span class="n">'+cuenta(g[0])+'</span></button>';}).join('');
  Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
    b.onclick=function(){ ACT=b.getAttribute('data-g'); pinta(); };});

  $('panels').innerHTML=GRUPOS.map(function(g){
    var l=DATOS.filter(function(x){return x.grupo===g[0];});
    return '<div class="panel'+(g[0]===ACT?' on':'')+'" data-p="'+g[0]+'">'+
      '<div class="card"><h3>'+esc(g[1])+'</h3><div class="hint">'+esc(g[2])+'</div>'+
      (l.length ? l.map(fila).join('') : '<div class="vacio">Aquí no queda nadie. Bien.</div>')+
      '</div></div>';}).join('');
  ata();
}

function fila(x){
  var est=String(x.estado||'');
  var clase=/activo/.test(est)?'activo':(/borrador|revision|nueva/.test(est)?'borrador':'otro');
  var sinCorreo=!x.email;
  var acc='';
  if(x.grupo==='sin_llave'){
    acc = sinCorreo
      ? '<span class="m" style="color:var(--bad)">Falta su correo</span>'
      : '<button class="btn" data-abrir="'+esc(x.id)+'">Darle la llave</button>'+
        '<button class="btn gris" data-mail="'+esc(x.id)+'">Mandarle el enlace</button>';
  } else if(x.grupo==='solicitud' || x.grupo==='cuenta_huerfana'){
    acc = sinCorreo ? '<span class="m" style="color:var(--bad)">Sin correo</span>'
                    : '<button class="btn gris" data-alta="'+esc(x.email)+'">Copiar su enlace de alta</button>';
  }
  return '<div class="fila">'+
    '<div class="quien"><b>'+esc(x.nombre||'(sin nombre)')+'</b>'+
      '<span class="m"><span class="p '+clase+'">'+esc(est||'—')+'</span> '+
      esc(x.email||'sin correo')+' · '+esc(x.fecha||'')+'<br>'+esc(x.detalle||'')+'</span></div>'+
    '<div class="acc">'+acc+'</div></div>';
}

function ata(){
  /* DARLE LA LLAVE. Es una fila en tour_operador_usuarios con su correo. No
     manda ningún correo a propósito: arreglar el censo y avisar a la persona
     son dos decisiones distintas y no tienen por qué ir juntas. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-abrir]'),function(b){
    b.onclick=async function(){
      var id=b.getAttribute('data-abrir');
      var x=DATOS.filter(function(y){return String(y.id)===id;})[0];
      if(!x) return;
      if(!confirm('Le damos la llave a «'+x.nombre+'» con el correo '+x.email+'.\n\nNo se le manda nada todavía.')) return;
      b.disabled=true; b.textContent='Abriendo…';
      var r=await fetch(SB+'/rest/v1/tour_operador_usuarios',{method:'POST',
        headers:hdr({'Prefer':'resolution=merge-duplicates,return=minimal'}),
        body:JSON.stringify({operador_id:x.id, email:String(x.email).toLowerCase(),
          nombre:x.nombre, rol:'coordinador', activo:true})});
      if(!r.ok){ b.disabled=false; b.textContent='Darle la llave';
        flash('No se pudo: '+(await r.text()).slice(0,110)); return; }
      flash('Llave dada a '+x.nombre+'. Ya puede entrar.');
      await carga();
    };});

  /* EL ENLACE DE LA CONTRASEÑA. Lo manda la misma función del alta, así que
     el correo que recibe es el de siempre y no uno inventado aquí. Si todavía
     no tiene llave, la función crea la cuenta pero el portal seguirá sin
     saber de quién es: por eso el botón de la llave va primero. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-mail]'),function(b){
    b.onclick=async function(){
      var id=b.getAttribute('data-mail');
      var x=DATOS.filter(function(y){return String(y.id)===id;})[0];
      if(!x) return;
      if(!confirm('Le mandamos a '+x.email+' el enlace para poner su contraseña.\n\n¿Seguro?')) return;
      b.disabled=true; b.textContent='Mandando…';
      var r=await fetch(SB+'/functions/v1/ateneista-aviso',{method:'POST',headers:hdr(),
        body:JSON.stringify({accion:'contrasena', id:x.id})});
      var j=null; try{ j=await r.json(); }catch(_){}
      b.disabled=false; b.textContent='Mandarle el enlace';
      flash(r.ok && j && j.correo ? ('Enlace enviado a '+x.email)
                                  : ('No salió: '+((j&&(j.error||j.motivo))||('HTTP '+r.status))));
    };});

  /* Para una solicitud o una cuenta huérfana no hay ficha que abrir: lo que
     falta es el alta entera, y ésa la hace la persona. Se copia su enlace
     para pegárselo donde se le esté escribiendo. */
  Array.prototype.forEach.call(document.querySelectorAll('[data-alta]'),function(b){
    b.onclick=function(){
      var liga=location.origin+'/ateneista';
      try{ navigator.clipboard.writeText(liga); flash('Copiado: '+liga); }
      catch(_){ flash(liga); }
    };});
}

SES=sesion();
carga();
</script>
</body></html>
