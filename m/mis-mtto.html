<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mis trabajos · Mantenimiento</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<style>
  :root{--bg:#0f1512;--card:#152019;--ink:#eaf3ee;--ink2:#9db3a6;--line:#26362c;--brand:#1aa06a;
    --ok:#2fbf7a;--ok-bg:#123a26;--warn:#e6b53d;--warn-bg:#3a2f12;--bad:#e8705f;--bad-bg:#3a1c17;--blue:#20304a;--blue2:#2b3f63}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 0}
  header{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--card)}
  header .back{color:var(--ink2);text-decoration:none;font-size:24px;line-height:1}
  header .ava{width:38px;height:38px;border-radius:50%;background:var(--blue);display:grid;place-items:center;font-size:20px}
  header h1{font-size:16px;margin:0;font-weight:700}
  header .sub{font-size:12px;color:var(--ink2)}
  main{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  .topbar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
  .btn{border:none;border-radius:11px;padding:11px 13px;font:inherit;font-weight:700;font-size:14px;cursor:pointer;background:var(--brand);color:#04120c}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.blue{background:var(--blue);color:#dbe7ff} .btn.warn{background:var(--warn);color:#231a05} .btn.bad{background:var(--bad);color:#2a0f0b}
  .btn.sm{padding:8px 11px;font-size:13px;border-radius:9px} .btn:disabled{opacity:.5}
  .wk{display:flex;align-items:center;gap:6px;margin-left:auto}
  .wk b{font-size:13px}
  .arrow{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:9px;width:34px;height:34px;font-size:15px;cursor:pointer}
  .seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:10px}
  .seg button{flex:1;background:none;border:none;color:var(--ink2);font:inherit;font-weight:700;font-size:14px;padding:10px;cursor:pointer}
  .seg button.on{background:var(--brand);color:#04120c}
  .filts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .filts .f{background:var(--card);border:1px solid var(--line);color:var(--ink2);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
  .filts .f.on{background:var(--blue2);color:#dbe7ff;border-color:var(--blue2)}
  .cap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px;color:var(--ink2)} .cap b{color:var(--ink)}
  .sechd{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);margin:14px 2px 8px}
  .task{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px}
  .task.act{border-color:var(--brand)} .task.pau{border-color:var(--warn)}
  .task .h{display:flex;align-items:flex-start;gap:9px}
  .task .ic{font-size:20px;flex:none}
  .task .nm{font-weight:700;font-size:15px;line-height:1.25}
  .task .meta{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .chip{font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
  .c-react{background:var(--bad-bg);color:var(--bad)} .c-correc{background:var(--warn-bg);color:var(--warn)} .c-prev{background:var(--ok-bg);color:var(--ok)}
  .c-info{background:#20304a;color:#cfe0ff}
  .desc{font-size:13px;color:var(--ink2);margin-top:8px;white-space:pre-wrap}
  .note{font-size:12.5px;border-radius:9px;padding:8px 10px;margin-top:8px;line-height:1.4}
  .note.reco{background:#132a20;color:#bfe6d2;border:1px solid #1e4a37}
  .note.risk{background:var(--bad-bg);color:#f0b3aa;border:1px solid #5a2a24}
  .foto{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
  .ficha{margin-top:8px}
  .ficha summary{cursor:pointer;color:var(--brand);font-size:12.5px;font-weight:700;list-style:none}
  .ficha summary::-webkit-details-marker{display:none}
  .ficha .txt{font-size:12.5px;color:var(--ink2);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin-top:6px;white-space:pre-wrap}
  .timer{margin-top:9px;font-size:12.5px;font-weight:700;padding:7px 10px;border-radius:9px}
  .timer.run{background:var(--ok-bg);color:var(--ok)} .timer.pau{background:var(--warn-bg);color:var(--warn)}
  .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .state{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--ink2)}
  .empty{text-align:center;color:var(--ink2);padding:34px 16px}
  .msg{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:#e9f5ee;color:#0f1512;padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:70;opacity:0;transition:.2s;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  .msg.show{opacity:1} .msg.bad{background:#f4d9d4}
  #login{margin:40px auto;text-align:center;color:var(--ink2);padding:24px} #login a{color:var(--brand);font-weight:700}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
  input,select,textarea{width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;font-size:14px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;place-items:end center;z-index:50}
  .modal-bg.on{display:grid}
  .modal{background:var(--card);border-radius:16px 16px 0 0;width:100%;max-width:520px;padding:16px;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 6px;font-size:16px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .verWrap select{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-weight:700;font-size:13px;width:auto}
</style>
<script src="/embed-child.js"></script>
</head>
<body>
<header>
  <a class="back" href="/soypepe/index.html">‹</a>
  <div class="ava">🔧</div>
  <div><h1>Mis trabajos</h1><div class="sub" id="sub">Plan de mantenimiento</div></div>
</header>
<main>
  <div id="login" style="display:none">Abre esto desde Soy Pepe con tu sesión iniciada.<br><a href="/soypepe/index.html">Ir a Soy Pepe</a></div>
  <div id="app" style="display:none">
    <div class="topbar">
      <a class="btn blue sm" href="/m/lecturas.html">📷 Lecturas</a>
      <button class="btn ghost sm" id="btnAdd" onclick="addTrabajo()">＋ Añadir</button>
      <span class="verWrap" id="verWrap"></span>
      <div class="wk"><button class="arrow" onclick="shiftWk(-1)">‹</button><b id="wkLbl"></b><button class="arrow" onclick="shiftWk(1)">›</button></div>
    </div>
    <div class="seg"><button id="segHoy" class="on" onclick="setView('hoy')">Hoy</button><button id="segSem" onclick="setView('semana')">Esta semana</button></div>
    <div class="filts" id="filts"></div>
    <div class="cap" id="cap"></div>
    <div id="list"></div>
  </div>
</main>
<input type="file" id="picker" accept="image/*" capture="environment" style="display:none">
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="msg" id="msg"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const OFN={albanileria:'🧱 Albañilería',carpinteria:'🪵 Carpintería',electricidad:'⚡ Electricidad',plomeria:'🚿 Plomería',pintura:'🎨 Pintura',climatizacion:'❄️ Climatización',gas_calderas:'🔥 Gas/Calderas',cerrajeria:'🔑 Cerrajería',herreria:'🔩 Herrería',jardineria:'🌿 Jardinería',limpieza_profunda:'🧽 Limpieza profunda',electronica_it:'🖥️ IT',general:'🧰 General'};
const CLS={reactivo:['c-react','Reactivo'],correctivo:['c-correc','Correctivo'],preventivo:['c-prev','Preventivo']};
const DIAS=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
const hoyMX=()=>new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
function addDays(mon,n){const d=new Date(mon+'T00:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}
function rango(mon){const M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];const d=new Date(mon+'T00:00:00'),e=new Date(d);e.setDate(e.getDate()+6);return d.getDate()+' '+M[d.getMonth()]+' – '+e.getDate()+' '+M[e.getMonth()];}
function dowIdx(dateStr){const d=new Date(dateStr+'T00:00:00');return (d.getDay()+6)%7;}
function fmtDur(mins){mins=Math.max(0,Math.round(mins));const h=Math.floor(mins/60),m=mins%60;return h?`${h}h ${m}m`:`${m}m`;}

function guessOficio(r){ if(r.oficio)return r.oficio; const t=((r.titulo||'')+' '+(r.descripcion||'')).toLowerCase();
  if(/pint|barniz/.test(t))return 'pintura';
  if(/caldera|boiler|calent|\bgas\b/.test(t))return 'gas_calderas';
  if(/aire|clima|refriger|extractor|ventil|minisplit/.test(t))return 'climatizacion';
  if(/fuga|gotera|regadera|tuber|coladera|inodoro|lavabo|drenaje|plomer|agua caliente/.test(t))return 'plomeria';
  if(/foco|\bluz\b|lampar|luminaria|contacto|apagador|electric|corto|cablead|breaker|pastilla/.test(t))return 'electricidad';
  if(/cerradura|chapa|candado|llavin/.test(t))return 'cerrajeria';
  if(/madera|puerta|mueble|repisa|cajon|carpint|litera|closet|zoclo/.test(t))return 'carpinteria';
  if(/herrer|soldad|barandal|reja|\bmetal|estructura/.test(t))return 'herreria';
  if(/muro|pared|\bpiso\b|azulejo|impermeab|yeso|resane|junta|cemento|alban/.test(t))return 'albanileria';
  if(/jard|planta|poda|riego|maceta/.test(t))return 'jardineria';
  if(/wifi|internet|\bred\b|camara|cctv|router|antena|pantalla|impresora/.test(t))return 'electronica_it';
  if(/profund|limpieza profunda/.test(t))return 'limpieza_profunda';
  return 'general'; }
const RECO={
 electricidad:'Corta el breaker del circuito antes de tocar. Revisa continuidad con multímetro; cambia el cable/contacto dañado y aísla bien.',
 plomeria:'Cierra la llave de paso. Revisa empaques/juntas; cambia el sello o el flexible. Seca y prueba que no gotee.',
 gas_calderas:'Cierra el gas y ventila. Busca fugas con agua jabonosa; no enciendas nada hasta confirmar que no hay fuga.',
 pintura:'Lija y limpia, cubre lo que no se pinta, aplica dos manos delgadas y deja secar entre capas.',
 carpinteria:'Revisa bisagras/tornillería, ajusta o reemplaza; lija y sella la madera expuesta.',
 climatizacion:'Limpia o cambia filtros, revisa el drenaje y que no gotee; confirma que enfríe/caliente antes de cerrar.',
 cerrajeria:'Lubrica el mecanismo; si no cierra, ajusta el cerrojo o cambia la chapa y prueba con la llave.',
 albanileria:'Retira material suelto, limpia y humedece; aplica mezcla/resane parejo y deja fraguar.',
 herreria:'Lija óxido, aplica anticorrosivo y pintura; revisa soldaduras y anclajes.',
 jardineria:'Poda, riega y revisa el drenaje.',
 limpieza_profunda:'Limpia a fondo baño, pisos y muebles; revisa focos, contactos, regadera y cerraduras, y reporta lo que necesite reparación.',
 electronica_it:'Reinicia el equipo, revisa cables y conexión; si sigue, anota modelo y falla.',
 general:'Prueba primero la solución más simple y verifica que quede funcionando.'};
function guessReco(t){ if(t.recomendacion)return t.recomendacion; return RECO[t.oficio||guessOficio(t)]||RECO.general; }
function guessRiesgo(t){ if(t.riesgo_nota!=null)return t.riesgo_nota; const of=t.oficio||guessOficio(t); const tx=((t.titulo||'')+' '+(t.descripcion||'')).toLowerCase();
  if(of==='electricidad'||/electric|corto|cable|contacto|breaker/.test(tx))return 'Riesgo eléctrico: corta la energía del circuito y usa desarmador/guantes aislados. No trabajes con manos mojadas.';
  if(of==='gas_calderas'||/gas|caldera|boiler/.test(tx))return 'Riesgo de gas/fuego: cierra el gas, ventila y no generes chispas. Ten el extintor a la mano.';
  if(/azotea|domo|altura|escalera|andamio|techo|tinaco/.test(tx))return 'Trabajo en altura: usa escalera estable o arnés y que alguien te acompañe. No subas si llueve.';
  if(of==='climatizacion'||/refriger|extractor/.test(tx))return 'Desconecta el equipo antes de abrirlo; cuidado con aspas y refrigerante.';
  if(/quimic|cloro|acido|solvente/.test(tx))return 'Usa guantes y ventila; nunca mezcles químicos.';
  return ''; }

let ME=null, EMP=null, EMPNAME=null, PROPID=null, WK=mondayOf(new Date()), VIEW='hoy', FILT='', curId=null, curAction=null, SUP=false, VIEWEMP=null, VIEWNAME='tú', TECLIST=[], TICKS=[], ENTR=[], TIMER=null, WORKSET=new Set();

function toast(t,ok=true){const m=$('msg');m.textContent=t;m.className='msg show'+(ok?'':' bad');setTimeout(()=>m.classList.remove('show'),3200);}
function modal(h){$('modal').innerHTML=h;$('modalBg').classList.add('on');}
function closeModal(){$('modalBg').classList.remove('on');}
$('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')closeModal();});
window.closeModal=closeModal;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').style.display='block';return;}
  ME=session.user; $('app').style.display='block';
  const {data:el}=await sb.from('empleado_login').select('employee_id,nombre_display,nombre_completo').eq('user_id',ME.id).maybeSingle();
  if(!el){$('login').style.display='block';$('app').style.display='none';return;}
  EMP=el.employee_id; VIEWEMP=EMP;
  const {data:emp}=await sb.from('employees').select('nombre,nombre_display,property_id,rol').eq('id',EMP).maybeSingle();
  PROPID=emp?emp.property_id:null; EMPNAME=emp?(emp.nombre_display||emp.nombre):(el.nombre_display||'');
  $('sub').textContent=EMPNAME+' · plan';
  const CORP=['javi@casapepe.mx','hola.puebla@casapepe.mx'];
  const RS=['Director','Gerente Operativo','Gerente Administrativo','Gerencia','Dueño','Owner'];
  SUP=(emp&&RS.includes(emp.rol))||CORP.includes((ME.email||'').toLowerCase());
  if(SUP){ TECLIST=await loadTecs(); renderVerSelector(); }
  renderFilts();
  render();
}
window.shiftWk=n=>{WK=addDays(WK,n*7);render();};
window.setView=v=>{VIEW=v;$('segHoy').className=v==='hoy'?'on':'';$('segSem').className=v==='semana'?'on':'';render();};
window.setFilt=f=>{FILT=f===FILT?'':f;renderFilts();paint();};
function renderFilts(){
  const fs=[['','Todos'],['reactivo','Reactivo'],['correctivo','Correctivo'],['preventivo','Preventivo']];
  $('filts').innerHTML=fs.map(f=>`<button class="f ${FILT===f[0]?'on':''}" onclick="setFilt('${f[0]}')">${f[1]}</button>`).join('');
}

async function loadTecs(){
  const {data:t1}=await sb.from('employees').select('id,nombre,nombre_display').ilike('puesto','%mantenimiento%').eq('estatus','activo');
  const {data:perm}=await sb.from('usuario_permisos').select('email').in('pagina_codigo',['PAG-SP-LECTURAS','PAG-SP-MISMTTO']);
  const emails=[...new Set((perm||[]).map(p=>p.email).filter(Boolean))];
  let t2=[]; if(emails.length){const r=await sb.from('employees').select('id,nombre,nombre_display').in('email',emails).eq('estatus','activo');t2=r.data||[];}
  const map={}; [...(t1||[]),...t2].forEach(e=>{if(e.id!==EMP)map[e.id]=e;});
  return Object.values(map).sort((a,b)=>((a.nombre_display||a.nombre)||'').localeCompare((b.nombre_display||b.nombre)||''));
}
function renderVerSelector(){
  if(!SUP){$('verWrap').innerHTML='';return;}
  const opts=[`<option value="${EMP}">Mi plan</option>`].concat(TECLIST.map(t=>`<option value="${t.id}">${esc(t.nombre_display||t.nombre)}</option>`));
  $('verWrap').innerHTML=`<select onchange="setVer(this.value)">${opts.join('')}</select>`;
}
window.setVer=v=>{VIEWEMP=v;const t=TECLIST.find(x=>x.id===v);VIEWNAME=(v===EMP)?'tú':(t?(t.nombre_display||t.nombre):'');render();};

async function render(){
  $('wkLbl').textContent=rango(WK);
  const ro=SUP&&VIEWEMP&&VIEWEMP!==EMP;
  $('btnAdd').style.display=ro?'none':'';
  const who=VIEWEMP||EMP;
  const {data,error}=await sb.from('mtto_tickets')
    .select('*, ubic:ubicacion_id(nombre,ficha_texto,recomendacion)')
    .eq('asignado_a',who).eq('semana_programada',WK)
    .in('estado',['validado','programado','en_proceso','pausado','resuelto']).order('prioridad');
  if(error){$('list').innerHTML='<div class="empty">Error: '+esc(error.message)+'</div>';return;}
  TICKS=data||[];
  WORKSET=new Set();
  try{ const {data:hor}=await sb.from('horarios').select('fecha').eq('employee_id',who).gte('fecha',WK).lte('fecha',addDays(WK,6));
    (hor||[]).forEach(h=>{ if(h.fecha) WORKSET.add(h.fecha.slice(0,10)); }); }catch(_){}
  // entrantes: reactivos sin dueño de mi propiedad (solo en mi propio plan)
  ENTR=[];
  if(!ro && PROPID){
    const {data:en}=await sb.from('mtto_tickets').select('*, ubic:ubicacion_id(nombre)')
      .eq('property_id',PROPID).is('asignado_a',null).eq('clasificacion','reactivo')
      .in('estado',['nuevo','validado','programado']).order('reportado_at',{ascending:false});
    ENTR=en||[];
  }
  paint();
  scheduleTimer();
}

function paint(){
  const ro=SUP&&VIEWEMP&&VIEWEMP!==EMP;
  const today=hoyMX();
  let rows=TICKS.slice();
  if(FILT) rows=rows.filter(t=>t.clasificacion===FILT);
  const enr=FILT&&FILT!=='reactivo'?[]:ENTR;
  const activas=rows.filter(t=>['en_proceso','pausado'].includes(t.estado));
  let html='';
  // cabecera resumen
  const pend=rows.filter(t=>['validado','programado','en_proceso','pausado'].includes(t.estado));
  const trabajadoMin=rows.reduce((s,t)=>s+workedMin(t),0);
  $('cap').innerHTML=`${ro?`👁️ Plan de <b>${esc(VIEWNAME)}</b><br>`:''}${VIEW==='hoy'?'Hoy':'Semana '+rango(WK)} · <b>${pend.length}</b> por hacer · trabajado <b>${fmtDur(trabajadoMin)}</b>`;

  // ENTRANTES (reactivos del día para tomar)
  if(!ro && enr.length){ html+=`<div class="sechd">🔔 Reactivos del día · tómalos para tu plan</div>`+enr.map(t=>entrCard(t)).join(''); }

  // Tareas activas siempre arriba
  if(activas.length){ html+=`<div class="sechd">⏱️ En curso</div>`+activas.map(t=>card(t,ro)).join(''); }

  if(VIEW==='hoy'){
    const hoyRows=rows.filter(t=>!['en_proceso','pausado','resuelto'].includes(t.estado) && (t.dia_programado===today || !t.dia_programado));
    html+=`<div class="sechd">📋 Para hacer hoy</div>`;
    html+=hoyRows.length?hoyRows.map(t=>card(t,ro)).join(''):'<div class="empty">Nada por hacer hoy. Revisa «Esta semana» o toma un reactivo.</div>';
    const term=rows.filter(t=>t.estado==='resuelto'&&t.resuelto_at&&t.resuelto_at.slice(0,10)===today);
    if(term.length) html+=`<div class="sechd">✅ Terminados hoy</div>`+term.map(t=>card(t,ro)).join('');
  } else {
    // Semana: sin día + por día
    const sinDia=rows.filter(t=>!['en_proceso','pausado','resuelto'].includes(t.estado)&&!t.dia_programado);
    html+=`<div class="sechd">🗂️ Por hacer (sin día)</div>`;
    html+=sinDia.length?sinDia.map(t=>card(t,ro)).join(''):'<div class="empty" style="padding:16px">Todo agendado 👍</div>';
    for(let d=0;d<7;d++){ const ds=addDays(WK,d);
      const dr=rows.filter(t=>t.dia_programado===ds&&!['en_proceso','pausado'].includes(t.estado));
      if(dr.length) html+=`<div class="sechd">${DIAS[d]} ${ds.slice(8,10)}</div>`+dr.map(t=>card(t,ro)).join('');
    }
  }
  if(!TICKS.length && !enr.length) html='<div class="empty">No tienes trabajos asignados esta semana.<br>Cuando el coordinador lance la asignación, aparecerán aquí.</div>';
  $('list').innerHTML=html;
}

function workedMin(t){ let m=t.minutos_acumulados||0; if(t.estado==='en_proceso'&&t.iniciado_at){ m+=(Date.now()-new Date(t.iniciado_at).getTime())/60000; } return m; }

function entrCard(t){
  const cl=CLS[t.clasificacion]||['c-info',t.clasificacion];
  return `<div class="task"><div class="h"><span class="ic">🔧</span>
    <div style="flex:1"><div class="nm">${esc(t.titulo||'Reactivo')}</div>
      <div class="meta"><span class="chip ${cl[0]}">${cl[1]}</span><span>📍 ${esc(t.ubic?t.ubic.nombre:'—')}</span>${t.reportado_por_nombre?`<span>por ${esc(t.reportado_por_nombre)}</span>`:''}</div></div></div>
    ${t.descripcion?`<div class="desc">${esc(t.descripcion)}</div>`:''}
    <div class="acts"><button class="btn sm" onclick="tomar('${t.id}')">✋ Tomar para hoy</button></div></div>`;
}

function card(t,ro){
  const cl=CLS[t.clasificacion]||['c-info',t.clasificacion||''];
  const reco=guessReco(t), riesgo=guessRiesgo(t);
  const foto=t.foto_url?`<img class="foto" src="${esc(t.foto_url)}" alt="foto">`:'';
  const ficha=t.ubic&&(t.ubic.recomendacion||t.ubic.ficha_texto)?`<details class="ficha"><summary>Ficha del lugar</summary><div class="txt">${esc(t.ubic.recomendacion||t.ubic.ficha_texto)}</div></details>`:'';
  let timer='';
  if(t.estado==='en_proceso'&&t.iniciado_at){ timer=`<div class="timer run">▶ Trabajando · ${fmtDur(workedMin(t))} (de ${t.minutos_estimados||'?'} min)</div>`; }
  else if(t.estado==='pausado'){ const pd=t.pausado_at?(Date.now()-new Date(t.pausado_at).getTime())/60000:0; timer=`<div class="timer pau">⏸ En pausa · ${fmtDur(pd)} detenida${t.pausa_motivo?` · ${esc(t.pausa_motivo)}`:''}<br>trabajado hasta ahora: ${fmtDur(workedMin(t))}</div>`; }
  let acts='',extra='';
  if(t.estado==='resuelto'){ extra=`<span class="state">✅ Terminado${t.reportado_por?' · espera cierre':''}</span>`; }
  else if(t.estado==='en_proceso'){ acts=`<button class="btn" style="flex:1" onclick="terminar('${t.id}')">📸 Terminar</button><button class="btn warn sm" onclick="pausar('${t.id}')">⏸ Pausar</button>`; }
  else if(t.estado==='pausado'){ acts=`<button class="btn" style="flex:1" onclick="reanudar('${t.id}')">▶️ Reanudar</button><button class="btn ghost sm" onclick="terminar('${t.id}')">📸 Terminar</button>`; }
  else { // validado/programado
    if(t.requiere_compra){ extra=`<div class="note risk">🛒 Espera la compra para poder iniciar</div>`; }
    const dbtn=t.dia_programado?`📅 ${DIAS[dowIdx(t.dia_programado)]}`:'＋ Día';
    acts=`<button class="btn" style="flex:1" onclick="iniciar('${t.id}')">▶️ Iniciar</button><button class="btn ghost sm" onclick="agendar('${t.id}')">${dbtn}</button>`;
  }
  const cls=t.estado==='en_proceso'?'task act':(t.estado==='pausado'?'task pau':'task');
  return `<div class="${cls}"><div class="h"><span class="ic">${t.origen==='mto_profundo'?'🧽':(t.clasificacion==='preventivo'?'🛠️':'🔧')}</span>
    <div style="flex:1"><div class="nm">${esc(t.titulo||'Trabajo')}</div>
      <div class="meta"><span class="chip ${cl[0]}">${cl[1]}</span><span>📍 ${esc(t.ubic?t.ubic.nombre:'—')}</span><span>⏱️ ${t.minutos_estimados||'?'} min</span>${t.oficio?`<span class="chip c-info">${esc(OFN[t.oficio]||t.oficio)}</span>`:''}${t.es_para_dos?'<span class="chip c-info">👥 2</span>':''}${t.dia_programado?`<span class="chip c-info">📅 ${DIAS[dowIdx(t.dia_programado)]}</span>`:''}</div></div>
    <span class="state">${esc(t.estado)}</span></div>
    ${t.descripcion?`<div class="desc">${esc(t.descripcion)}</div>`:''}
    ${reco?`<div class="note reco">💡 ${esc(reco)}</div>`:''}
    ${riesgo?`<div class="note risk">⚠️ Prevención de riesgo: ${esc(riesgo)}</div>`:''}
    ${foto}${ficha}${timer}
    <div class="acts">${acts}${extra&&!acts?'':''}</div>${(extra&&!acts)?`<div style="margin-top:10px">${extra}</div>`:''}
  </div>`;
}

// ---- timer refresh ----
function scheduleTimer(){ if(TIMER)clearInterval(TIMER); const hasActive=TICKS.some(t=>['en_proceso','pausado'].includes(t.estado)); if(hasActive) TIMER=setInterval(paint,30000); }

// ---- acciones ----
window.tomar=async id=>{
  const t=ENTR.find(x=>x.id===id)||{};
  const patch={asignado_a:EMP,asignado_nombre:EMPNAME,semana_programada:WK,dia_programado:hoyMX(),estado:'programado'};
  if(!t.oficio)patch.oficio=guessOficio(t);
  patch.recomendacion=t.recomendacion||RECO[patch.oficio||t.oficio]||RECO.general;
  patch.riesgo_nota=t.riesgo_nota!=null?t.riesgo_nota:guessRiesgo(Object.assign({},t,{oficio:patch.oficio}));
  const {error}=await sb.from('mtto_tickets').update(patch).eq('id',id);
  if(error)return toast(error.message,false);
  await ev(id,'programado',{tomado:true,tecnico:EMPNAME}); toast('Tomado para hoy ✋'); render();
};
window.iniciar=async id=>{
  const {data:t}=await sb.from('mtto_tickets').select('requiere_compra,minutos_acumulados').eq('id',id).single();
  if(t&&t.requiere_compra){
    const {data:sum}=await sb.from('mtto_suministros').select('estatus,entregado_at').eq('ticket_id',id);
    const ok=(sum||[]).some(x=>x.entregado_at||['comprado','recibido','entregado'].includes(x.estatus));
    if(!ok)return toast('Falta la compra para iniciar',false);
  }
  const {error}=await sb.from('mtto_tickets').update({estado:'en_proceso',iniciado_at:new Date().toISOString(),dia_programado:hoyMX()}).eq('id',id);
  if(error)return toast(error.message,false);
  await ev(id,'iniciado'); toast('Iniciado ⏱️'); render();
};
window.reanudar=async id=>{
  const {error}=await sb.from('mtto_tickets').update({estado:'en_proceso',iniciado_at:new Date().toISOString(),pausado_at:null,pausa_motivo:null}).eq('id',id);
  if(error)return toast(error.message,false); await ev(id,'reanudado'); toast('Reanudado ▶️'); render();
};
window.pausar=id=>{ curId=id;
  modal(`<h3>Pausar trabajo</h3><p style="color:var(--ink2);font-size:13px;margin:0 0 6px">Se guarda el tiempo trabajado y queda en pausa.</p>
   <label>Motivo</label>
   <div style="display:flex;flex-direction:column;gap:7px;margin-top:6px">
     <button class="btn ghost sm" onclick="doPausa('Fui a atender otra cosa')">Fui a atender otra cosa</button>
     <button class="btn ghost sm" onclick="doPausa('Necesita insumos')">Necesita insumos</button>
     <button class="btn ghost sm" onclick="doPausa('Necesita herramienta')">Necesita herramienta</button>
     <button class="btn ghost sm" onclick="pedirCompra('${id}')">🛒 Requiere una compra (pedir a administración)</button>
   </div>
   <label style="margin-top:10px">Otro motivo</label><input id="pMot" placeholder="escribe el motivo">
   <button class="btn sm" style="margin-top:10px;width:100%" onclick="doPausa($('pMot').value.trim()||'Pausado')">Pausar</button>`);
};
window.doPausa=async(motivo)=>{
  const id=curId; if(!id)return;
  const {data:t}=await sb.from('mtto_tickets').select('minutos_acumulados,iniciado_at').eq('id',id).single();
  let acc=t.minutos_acumulados||0; if(t.iniciado_at) acc+=Math.max(0,(Date.now()-new Date(t.iniciado_at).getTime())/60000);
  const {error}=await sb.from('mtto_tickets').update({estado:'pausado',minutos_acumulados:Math.round(acc),iniciado_at:null,pausado_at:new Date().toISOString(),pausa_motivo:motivo}).eq('id',id);
  if(error)return toast(error.message,false);
  await ev(id,'pausado',{motivo,minutos_acumulados:Math.round(acc)}); closeModal(); toast('En pausa ⏸ ('+fmtDur(acc)+' trabajado)'); render();
};

// compra desde pausa (o desde ticket)
window.pedirCompra=id=>{ curId=id;
  modal(`<h3>Solicitar compra</h3><p style="color:var(--ink2);font-size:12.5px;margin:0 0 6px">Se avisa a administración y el trabajo queda a la espera.</p>
   <label>¿Qué se necesita?</label><textarea id="scDesc" rows="2" placeholder="Material / refacción / herramienta"></textarea>
   <label>Link (opcional)</label><input id="scLink" placeholder="https://…">
   <label>Costo estimado (opcional)</label><input id="scCosto" type="number" min="0" placeholder="MXN">
   <button class="btn sm" style="margin-top:12px;width:100%" onclick="enviarCompra('${id}')">Enviar solicitud y pausar</button>`);
};
window.enviarCompra=async id=>{
  const desc=$('scDesc').value.trim(); if(!desc)return toast('Describe qué se necesita',false);
  const link=$('scLink').value.trim()||null, costo=parseFloat($('scCosto').value)||null;
  const {data:t}=await sb.from('mtto_tickets').select('titulo,property_id,minutos_acumulados,iniciado_at').eq('id',id).single();
  const {error:se}=await sb.from('mtto_suministros').insert({property_id:t.property_id,ticket_id:id,descripcion:desc,material:desc.slice(0,80),link,costo,estatus:'solicitado',semana:WK,solicitado_por:ME.id,solicitado_por_nombre:ME.email,subido_por:ME.id,subido_por_nombre:ME.email});
  if(se)return toast(se.message,false);
  // pausar guardando tiempo
  let acc=t.minutos_acumulados||0; if(t.iniciado_at)acc+=Math.max(0,(Date.now()-new Date(t.iniciado_at).getTime())/60000);
  await sb.from('mtto_tickets').update({requiere_compra:true,estado:'pausado',minutos_acumulados:Math.round(acc),iniciado_at:null,pausado_at:new Date().toISOString(),pausa_motivo:'Requiere compra: '+desc.slice(0,60)}).eq('id',id);
  await ev(id,'compra_solicitada',{descripcion:desc,link,costo});
  // notificar a Roberto/Clau segun propiedad
  const {data:cfg}=await sb.from('mtto_config').select('compras_emp_id,compras_user_id,compras_nombre').eq('property_id',t.property_id).maybeSingle();
  if(cfg&&cfg.compras_user_id){ await sb.from('notificaciones').insert({employee_id:cfg.compras_emp_id,user_id:cfg.compras_user_id,
    titulo:'🛒 Compra de mantenimiento',cuerpo:(t.titulo?t.titulo+': ':'')+desc+(link?'  · '+link:'')+(costo?'  · ~$'+costo:''),icono:'🛒',accion:{url:'/mantenimiento.html',tipo:'mtto_compra',ticket:id},leido:false}); }
  closeModal(); toast('Solicitud enviada a administración 🛒'); render();
};

window.terminar=id=>{ curId=id; curAction='terminar'; $('picker').value=''; $('picker').click(); };
$('picker').onchange=async()=>{
  const f=$('picker').files[0]; if(!f||!curId)return; const id=curId;
  toast('Subiendo foto…');
  try{
    const blob=await resize(f);
    const path='mtto/resuelto-'+Date.now()+'-'+id.slice(0,8)+'.jpg';
    const {error:ue}=await sb.storage.from('buzon').upload(path,blob,{contentType:'image/jpeg',upsert:false}); if(ue)throw ue;
    const foto=sb.storage.from('buzon').getPublicUrl(path).data.publicUrl;
    // pedir comentario
    modal(`<h3>Terminar trabajo</h3><img src="${esc(foto)}" style="max-width:100%;border-radius:10px;margin:6px 0">
      <label>Comentario (opcional)</label><textarea id="tCom" rows="3" placeholder="Cómo quedó, qué usaste, pendientes…"></textarea>
      <button class="btn sm" style="margin-top:12px;width:100%" onclick="doTerminar('${id}','${esc(foto)}')">✅ Marcar terminado</button>`);
  }catch(e){ toast('No se pudo subir: '+(e.message||e),false); curId=null; }
};
window.doTerminar=async(id,foto)=>{
  const com=$('tCom')?$('tCom').value.trim():'';
  const {data:t}=await sb.from('mtto_tickets').select('*').eq('id',id).single();
  const now=new Date(); let acc=t.minutos_acumulados||0; if(t.iniciado_at)acc+=Math.max(0,(now-new Date(t.iniciado_at))/60000);
  if(!t.minutos_acumulados&&!t.iniciado_at&&t.iniciado_at===null&&acc===0&&t.estado!=='pausado') acc=t.minutos_estimados||0;
  const mins=Math.round(acc)||null;
  const reportado=t.reportado_por;
  const patch={foto_resuelto_url:foto,resuelto_at:now.toISOString(),minutos_reales:mins,comentario_cierre:com||null,pausado_at:null,iniciado_at:null};
  if(reportado){ patch.estado='resuelto'; } else { patch.estado='cerrado'; patch.cerrado_at=now.toISOString(); patch.cerrado_por=ME.id; patch.cerrado_por_nombre=ME.email; }
  const {error}=await sb.from('mtto_tickets').update(patch).eq('id',id); if(error)return toast(error.message,false);
  if(t.preventivo_catalogo_id){ await sb.from('mtto_preventivos_catalogo').update({ultimo_realizado:hoyMX()}).eq('id',t.preventivo_catalogo_id);
    await sb.from('mtto_preventivo_log').insert({catalogo_id:t.preventivo_catalogo_id,property_id:t.property_id,fecha:hoyMX(),por_id:ME.id,por_nombre:ME.email,minutos_reales:mins,evidencia_url:foto,nota:com||null}); }
  if(t.origen==='mto_profundo'){ await sb.from('mtto_profundo_plan').update({estado:'hecho',fecha_realizada:hoyMX(),ultimo_realizado:hoyMX()}).eq('ticket_id',id); }
  await ev(id, reportado?'resuelto':'cerrado_conforme', {minutos_reales:mins,comentario:com});
  if(reportado){ await sb.from('notificaciones').insert({user_id:reportado,titulo:'✅ Tu reporte fue atendido',cuerpo:(t.titulo||'Trabajo')+' — revísalo y ciérralo de conforme.',icono:'✅',accion:{url:'/soypepe/index.html',tipo:'mtto_resuelto',ticket:id},leido:false}); }
  closeModal(); toast('Terminado ✅'+(mins?' · '+fmtDur(mins):'')); render();
};

window.agendar=id=>{ curId=id; const today=hoyMX(); const btns=[];
  for(let d=0;d<7;d++){ const ds=addDays(WK,d);
    const esWork = WORKSET.size? WORKSET.has(ds) : d<6;   // sin horario cargado: Lun-Sáb
    if(!esWork || ds<today) continue;
    btns.push(`<button class="btn ghost sm" onclick="setDia('${id}','${ds}')">${DIAS[d]} ${ds.slice(8,10)}${ds===today?' · hoy':''}</button>`);
  }
  modal(`<h3>Agendar a un día</h3>
   <button class="btn" style="width:100%;margin-bottom:10px" onclick="setDia('${id}','${today}')">⭐ Traer a hoy</button>
   <p style="color:var(--ink2);font-size:13px;margin:0 0 8px">O muévelo a otro día que trabajas (sin tu descanso).</p>
   <div class="row2">${btns.join('')||'<div class="empty" style="padding:8px">No quedan días esta semana</div>'}</div>
   <button class="btn ghost sm" style="margin-top:8px;width:100%" onclick="setDia('${id}','')">Quitar día (a «por hacer»)</button>`);
};
window.setDia=async(id,ds)=>{ const {error}=await sb.from('mtto_tickets').update({dia_programado:ds||null}).eq('id',id);
  if(error)return toast(error.message,false); closeModal(); toast(ds?('Agendado '+DIAS[dowIdx(ds)]):'Día quitado'); render(); };

window.addTrabajo=async()=>{
  const {data:ubis}=await sb.from('mtto_ubicaciones').select('id,nombre').eq('property_id',PROPID).eq('activo',true).order('orden');
  modal(`<h3>Añadir trabajo</h3>
    <label>¿Qué hay que hacer?</label><input id="atTit" placeholder="Ej. Cambiar chapa de la 210">
    <div class="row2"><div><label>Tipo</label><select id="atClas"><option value="correctivo">Correctivo</option><option value="reactivo">Reactivo</option><option value="preventivo">Preventivo</option></select></div>
      <div><label>Minutos</label><input id="atMin" type="number" min="1" value="45"></div></div>
    <label>Área / habitación</label><select id="atUbic"><option value="">(sin área)</option>${(ubis||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select>
    <label>¿Cuándo?</label><select id="atCuando"><option value="ya">▶️ Iniciar ya</option><option value="hoy">Para hoy</option><option value="semana">Anotar (esta semana)</option></select>
    <button class="btn sm" style="margin-top:14px;width:100%" onclick="saveTrabajo()">Guardar</button>`);
};
window.saveTrabajo=async()=>{
  const tit=$('atTit').value.trim(); if(!tit)return toast('Escribe qué hay que hacer',false);
  const clas=$('atClas').value, cuando=$('atCuando').value;
  const base={titulo:tit,descripcion:tit,clasificacion:clas};
  const of=guessOficio(base);
  const rec={property_id:PROPID,origen:'manual',clasificacion:clas,ubicacion_id:$('atUbic').value||null,titulo:tit.slice(0,80),descripcion:tit,
    minutos_estimados:parseInt($('atMin').value)||null,oficio:of,recomendacion:RECO[of]||RECO.general,riesgo_nota:guessRiesgo(base),
    asignado_a:EMP,asignado_nombre:EMPNAME,semana_programada:WK,reportado_por:ME.id,reportado_por_nombre:ME.email,reportado_at:new Date().toISOString(),eloy_completo:true};
  if(cuando==='ya'){ rec.estado='en_proceso'; rec.iniciado_at=new Date().toISOString(); rec.dia_programado=hoyMX(); }
  else if(cuando==='hoy'){ rec.estado='programado'; rec.dia_programado=hoyMX(); }
  else { rec.estado='programado'; }
  const {error}=await sb.from('mtto_tickets').insert(rec);
  if(error)return toast(error.message,false); closeModal(); toast(cuando==='ya'?'Creado e iniciado ⏱️':'Trabajo añadido'); render();
};

async function resize(file){
  const bmp=await createImageBitmap(file);
  const max=1280,sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*sc),h=Math.round(bmp.height*sc);
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(bmp,0,0,w,h);
  return await new Promise(res=>c.toBlob(res,'image/jpeg',0.85));
}
async function ev(ticket_id,tipo,payload){ try{ await sb.from('mtto_ticket_eventos').insert({ticket_id,tipo,actor_id:ME.id,actor_nombre:ME.email,payload:payload||{}}); }catch(_){} }

boot();
</script>
