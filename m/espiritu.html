<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espíritu · Frases Casa Pepe</title>
<style>
:root{--ground:#F4F1EA;--bg2:#fff;--bd:rgba(0,0,0,.12);--txt:#2c2c2a;--txt2:#5f5e5a;--txt3:#8a897f;--accent:#137A56;--gold:#C9A227;--bad:#b03434}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ground);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:20px;margin:.2rem 0}
h1 b{color:var(--gold)}
.sub{color:var(--txt2);font-size:13px;margin-bottom:12px}
.secnav{position:sticky;top:0;z-index:5;background:var(--ground);padding:10px 0;border-bottom:1px solid var(--bd);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.secnav input,.secnav select{padding:8px 10px;border:1px solid var(--bd);border-radius:9px;background:var(--bg2);color:var(--txt);font-size:13px}
.secnav input.q{flex:1;min-width:150px}
.chipbar{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--bg2);color:var(--txt2);border-radius:20px;padding:5px 11px;font-size:12px;font-weight:600;cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.stat{color:var(--txt2);font-size:12.5px;margin:6px 2px 10px}
.stat b{color:var(--txt)}
.card{background:var(--bg2);border:1px solid var(--bd);border-radius:12px;padding:12px 13px;margin-bottom:10px}
.card.apr{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.frase{font-size:15px;font-weight:600;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;background:#eee;color:#555}
.tag.cat{background:#e7f1ec;color:#136}
.tag.fue{background:#f3eede;color:#7a5c00}
.tag.niv-atrevido{background:#fbe4e4;color:#9a2b2b}
.tag.niv-suave{background:#eef;color:#456}
.tag.tono{background:#eee;color:#555}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--bd);background:var(--bg2);color:var(--txt);font-size:12.5px;font-weight:600;padding:7px 11px}
button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
button.on{background:var(--gold);color:#3a2b00;border-color:var(--gold)}
button.del{color:var(--bad);border-color:#e2b4b4}
.edit input,.edit select,.edit textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;font-size:13px;margin-top:6px;background:var(--ground)}
.edit label{font-size:11px;color:var(--txt3);font-weight:700;display:block;margin-top:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hidden{display:none}
#msg{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(30px);background:#2c2c2a;color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;transition:all .2s;z-index:99}
#msg.show{opacity:1;transform:translateX(-50%) translateY(0)}
.addbtn{position:fixed;right:16px;bottom:16px;background:var(--accent);color:#fff;border:none;border-radius:30px;padding:13px 18px;font-size:14px;font-weight:700;box-shadow:0 6px 20px rgba(19,122,86,.35);z-index:20}
.authbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:20px;text-align:center;color:var(--txt2)}
</style></head>
<body>
<div class="wrap">
  <h1>✨ Espíritu <b>Casa Pepe</b></h1>
  <div class="sub">Frases (refranes, personajes, memes) por momento del colaborador. Pule aquí: aprueba, edita, borra o agrega.</div>
  <div id="auth" class="authbox hidden">Inicia sesión en el dashboard para editar el Espíritu.</div>
  <div id="app" class="hidden">
    <div class="secnav">
      <input class="q" id="q" placeholder="🔎 Buscar frase o fuente…">
      <select id="fcat"><option value="">Todas las categorías</option></select>
      <select id="ffue"><option value="">Todas las fuentes</option></select>
      <select id="fniv"><option value="">Nivel: todos</option><option value="suave">suave</option><option value="atrevido">atrevido</option></select>
    </div>
    <div class="chipbar">
      <span class="chip on" data-apr="">Todas</span>
      <span class="chip" data-apr="si">✓ Aprobadas</span>
      <span class="chip" data-apr="no">Pendientes</span>
    </div>
    <div class="stat" id="stat"></div>
    <div id="list"></div>
  </div>
</div>
<button class="addbtn hidden" id="addBtn">＋ Nueva frase</button>
<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
let DATA=[], CATS=[], FUES=[], FILTER={q:'',cat:'',fue:'',niv:'',apr:''}, ISADMIN=false;
const CAT_LABEL={prisa:'⏳ Prisa',seguridad:'💪 Seguridad',duda:'🤔 Duda',cliente:'🛎️ Cliente',logro:'🏆 Logro',crecer:'📈 Crecer',vacaciones:'🌴 Vacaciones',equipo:'🤝 Equipo',bienvenida:'🌅 Bienvenida',cierre:'🌇 Cierre',resiliencia:'🔁 Resiliencia',motivacion:'🔥 Motivación',puntualidad:'⏰ Puntualidad',gratitud:'🙏 Gratitud',calma:'😮‍💨 Calma',celebracion:'🎉 Celebración'};

function toast(t){const m=$('msg');m.textContent=t;m.classList.add('show');clearTimeout(m._t);m._t=setTimeout(()=>m.classList.remove('show'),2200);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function boot(){
  const s=await sb.auth.getSession();
  if(!s.data||!s.data.session){ $('auth').classList.remove('hidden'); return; }
  try{ const {data}=await sb.rpc('es_admin_seguridad'); ISADMIN=!!data; }catch(e){ ISADMIN=false; }
  $('app').classList.remove('hidden');
  if(ISADMIN) $('addBtn').classList.remove('hidden');
  await load();
  $('q').oninput=e=>{FILTER.q=e.target.value.toLowerCase();render();};
  $('fcat').onchange=e=>{FILTER.cat=e.target.value;render();};
  $('ffue').onchange=e=>{FILTER.fue=e.target.value;render();};
  $('fniv').onchange=e=>{FILTER.niv=e.target.value;render();};
  document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');FILTER.apr=c.dataset.apr;render();});
  $('addBtn').onclick=addNew;
}

async function load(){
  const {data,error}=await sb.from('espiritu').select('*').order('categoria').order('frase');
  if(error){toast('Error al cargar');return;}
  DATA=data||[];
  CATS=[...new Set(DATA.map(d=>d.categoria))].sort();
  FUES=[...new Set(DATA.map(d=>d.fuente))].filter(Boolean).sort();
  $('fcat').innerHTML='<option value="">Todas las categorías</option>'+CATS.map(c=>`<option value="${c}">${CAT_LABEL[c]||c}</option>`).join('');
  $('ffue').innerHTML='<option value="">Todas las fuentes</option>'+FUES.map(f=>`<option value="${esc(f)}">${esc(f)}</option>`).join('');
  render();
}

function filtered(){
  return DATA.filter(d=>{
    if(FILTER.cat&&d.categoria!==FILTER.cat)return false;
    if(FILTER.fue&&d.fuente!==FILTER.fue)return false;
    if(FILTER.niv&&d.nivel!==FILTER.niv)return false;
    if(FILTER.apr==='si'&&!d.aprobado)return false;
    if(FILTER.apr==='no'&&d.aprobado)return false;
    if(FILTER.q){const h=(d.frase+' '+(d.fuente||'')).toLowerCase();if(!h.includes(FILTER.q))return false;}
    return true;
  });
}

function render(){
  const rows=filtered();
  const apr=DATA.filter(d=>d.aprobado).length;
  $('stat').innerHTML=`Mostrando <b>${rows.length}</b> de <b>${DATA.length}</b> · Aprobadas en total: <b>${apr}</b> · Pendientes: <b>${DATA.length-apr}</b>`;
  $('list').innerHTML=rows.map(cardHTML).join('')||'<div class="sub">Sin frases con esos filtros.</div>';
  rows.forEach(r=>wire(r.id));
}

function cardHTML(d){
  return `<div class="card ${d.aprobado?'apr':''}" id="c-${d.id}">
    <div class="view" id="v-${d.id}">
      <div class="frase">${esc(d.frase)}</div>
      <div class="meta">
        <span class="tag cat">${CAT_LABEL[d.categoria]||d.categoria}</span>
        <span class="tag fue">${esc(d.fuente||'—')}</span>
        <span class="tag tono">${esc(d.tono||'')}</span>
        <span class="tag niv-${d.nivel}">${d.nivel}</span>
      </div>
      ${ISADMIN?`<div class="acts">
        <button class="${d.aprobado?'on':'pri'}" data-a="apr">${d.aprobado?'✓ Aprobada':'Aprobar'}</button>
        <button data-a="edit">✏️ Editar</button>
        <button class="del" data-a="del">🗑️ Borrar</button>
      </div>`:''}
    </div>
    <div class="edit hidden" id="e-${d.id}"></div>
  </div>`;
}

const TONOS=['chusco','motivador','calido','serio','picaro'];
function editHTML(d){
  return `<label>Frase</label><textarea id="ef-${d.id}" rows="2">${esc(d.frase)}</textarea>
  <div class="row2">
    <div><label>Fuente</label><input id="eu-${d.id}" value="${esc(d.fuente||'')}"></div>
    <div><label>Categoría</label><select id="ec-${d.id}">${Object.keys(CAT_LABEL).map(c=>`<option value="${c}" ${c===d.categoria?'selected':''}>${CAT_LABEL[c]}</option>`).join('')}</select></div>
  </div>
  <div class="row2">
    <div><label>Tono</label><select id="et-${d.id}">${TONOS.map(t=>`<option ${t===d.tono?'selected':''}>${t}</option>`).join('')}</select></div>
    <div><label>Nivel</label><select id="en-${d.id}"><option value="suave" ${d.nivel==='suave'?'selected':''}>suave</option><option value="atrevido" ${d.nivel==='atrevido'?'selected':''}>atrevido</option></select></div>
  </div>
  <label>Uso sugerido</label><input id="eus-${d.id}" value="${esc(d.uso_sugerido||'')}">
  <div class="acts"><button class="pri" data-a="save">Guardar</button><button data-a="cancel">Cancelar</button></div>`;
}

function wire(id){
  const c=$('c-'+id); if(!c)return;
  c.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(id,b.dataset.a));
}
async function act(id,a){
  const d=DATA.find(x=>x.id===id); if(!d)return;
  if(a==='apr'){ await rpc('espiritu_set_aprobado',{p_id:id,p_val:!d.aprobado}); d.aprobado=!d.aprobado; render(); toast(d.aprobado?'Aprobada ✓':'Marcada pendiente'); return; }
  if(a==='edit'){ $('v-'+id).classList.add('hidden'); const e=$('e-'+id); e.classList.remove('hidden'); e.innerHTML=editHTML(d); e.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(id,b.dataset.a)); return; }
  if(a==='cancel'){ $('e-'+id).classList.add('hidden'); $('v-'+id).classList.remove('hidden'); return; }
  if(a==='del'){ if(!confirm('¿Borrar esta frase?\n\n"'+d.frase+'"'))return; await rpc('espiritu_delete',{p_id:id}); DATA=DATA.filter(x=>x.id!==id); render(); toast('Borrada'); return; }
  if(a==='save'){
    const p={p_id:id,p_frase:$('ef-'+id).value,p_fuente:$('eu-'+id).value,p_categoria:$('ec-'+id).value,p_tono:$('et-'+id).value,p_nivel:$('en-'+id).value,p_uso:$('eus-'+id).value};
    await rpc('espiritu_update',p);
    Object.assign(d,{frase:p.p_frase.trim()||d.frase,fuente:p.p_fuente,categoria:p.p_categoria,tono:p.p_tono,nivel:p.p_nivel,uso_sugerido:p.p_uso});
    render(); toast('Guardada ✓');
  }
}
async function rpc(fn,args){ const {error}=await sb.rpc(fn,args); if(error){toast('Error: '+error.message);throw error;} }

async function addNew(){
  const frase=prompt('Nueva frase:'); if(!frase||!frase.trim())return;
  const cat=prompt('Categoría ('+Object.keys(CAT_LABEL).join(', ')+'):','motivacion'); if(!cat)return;
  const fuente=prompt('Fuente (Refrán mexicano / Cantinflas / Meme-Gen Z / Casa Pepe…):','')||'';
  const nivel=(prompt('Nivel (suave/atrevido):','suave')||'suave').toLowerCase();
  try{
    const {error}=await sb.rpc('espiritu_add',{p_frase:frase,p_fuente:fuente,p_categoria:cat.trim(),p_tono:'motivador',p_nivel:nivel,p_uso:''});
    if(error)throw error;
    await load(); toast('Agregada ✓');
  }catch(e){ toast('Error: '+e.message); }
}
boot();
</script>
</body></html>
