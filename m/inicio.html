<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio · Casa Pepe</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:1.02rem;font-weight:700;margin:0}
.cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cab h1{flex:1 1 auto}
.cab .meta{color:var(--muted);font-size:.86rem}
.eyebrow{font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--faint)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--faint)}
.kpi .v{font-size:1.7rem;font-weight:700;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:5px}
.kpi .v.sk,.kpi .s.sk{color:transparent;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;border-radius:6px;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.none{background:var(--none-bg);color:var(--none)}
/* paneles */
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.kpi .v{font-size:1.5rem}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card .hd h2{flex:1}
.card .hd a{font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.card .hd a:hover{text-decoration:underline}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:0}
.row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--faint)}
.row .dot.ok{background:var(--ok)} .row .dot.warn{background:var(--warn)} .row .dot.bad{background:var(--bad)} .row .dot.acc{background:var(--accent)}
.row .bd{flex:1;min-width:0}
.row .t{font-weight:600;font-size:.92rem}
.row .d{font-size:.8rem;color:var(--muted);margin-top:1px}
.row .act{font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap;flex:0 0 auto}
.row .act:hover{text-decoration:underline}
.row .ct{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:1.05rem;flex:0 0 auto;min-width:34px;text-align:right}
.empty{color:var(--muted);font-size:.86rem;padding:10px 0}
.loading{color:var(--faint);font-size:.82rem;padding:10px 0}
/* accesos rápidos */
.acc{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.acc a{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:10px;padding:9px 13px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.85rem;box-shadow:var(--shadow)}
.acc a:hover{border-color:var(--accent);color:var(--accent)}
.acc a .em{font-size:1.05rem}
.sec-t{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--faint);margin:22px 0 2px}
.note{font-size:.76rem;color:var(--faint);margin-top:20px;border-top:1px dashed var(--rule);padding-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1 id="saludo">Hola</h1>
    <div class="meta" id="meta">Cargando…</div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="cols">
    <div class="card">
      <div class="hd"><h2>Lo que necesita tu día</h2><a href="/m/incidencias.html" target="_top">Ver pendientes →</a></div>
      <div id="dia"><div class="loading">Cargando pendientes…</div></div>
    </div>
    <div class="card">
      <div class="hd"><h2>Para ti · del día</h2><a href="/m/pepe-atender.html" target="_top">Pepe Atender →</a></div>
      <div id="para"><div class="loading">Cargando…</div></div>
    </div>
  </div>

  <div class="sec-t">Accesos rápidos</div>
  <div class="acc" id="accesos"></div>

  <div class="note" id="nota">Los indicadores se llenan con datos reales al abrir el panel con tu sesión. Los montos y la ocupación respetan tu alcance por propiedad.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>
(function(){
'use strict';
var SB_URL="https://rehophywchakfapivsbh.supabase.co";
var SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
var sb = window.supabase ? supabase.createClient(SB_URL, SB_KEY) : null;

/* --- utilidades --- */
function $(id){return document.getElementById(id);}
function money(n){ n=Number(n||0); return '$'+Math.round(n).toLocaleString('es-MX'); }
function moneyK(n){ n=Number(n||0); if(Math.abs(n)>=1000) return '$'+Math.round(n/1000).toLocaleString('es-MX')+'k'; return '$'+Math.round(n).toLocaleString('es-MX'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mxNow(){ try{ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})); }catch(_){ return new Date(); } }
function hoyISO(){ var d=mxNow(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hoyIni(){ return hoyISO()+'T00:00:00'; }
function fechaLarga(){ var d=mxNow(); var D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado']; var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return D[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]; }
function nombreDe(email){ if(!email) return ''; var a=email.split('@')[0].replace(/[._-]+/g,' ').trim(); return a.charAt(0).toUpperCase()+a.slice(1); }

/* cada widget falla solo: si revienta, pone su hueco en "—" y sigue. */
function guard(fn){ return Promise.resolve().then(fn).catch(function(e){ console.warn('inicio widget', e); }); }

/* --- saludo + meta --- */
guard(function(){
  var email=''; try{ email=(window.cpAcceso&&cpAcceso.tokEmail&&cpAcceso.tokEmail())||''; }catch(_){}
  var h=mxNow().getHours(); var sal = h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches');
  var nom=nombreDe(email);
  $('saludo').textContent = sal + (nom?(', '+nom):'');
  return (window.cpAcceso&&cpAcceso.ubicaciones?cpAcceso.ubicaciones():Promise.resolve(null)).then(function(ubi){
    var amb = (!ubi||ubi.length>1)?'Todas las propiedades':(ubi[0]||'').toUpperCase();
    $('meta').textContent = amb+' · '+fechaLarga();
  }).catch(function(){ $('meta').textContent = fechaLarga(); });
});

/* --- KPIs: se pintan como skeleton y cada uno se llena solo --- */
var KPIS=[
  {id:'ocup', l:'Ocupación prevista'},
  {id:'adr',  l:'ADR sugerido'},
  {id:'lleg', l:'Llegan hoy'},
  {id:'cobr', l:'Por cobrar'},
  {id:'feliz',l:'PepeFeliz'},
  {id:'cier', l:'Cierre del día'}
];
$('kpis').innerHTML = KPIS.map(function(k){
  return '<div class="kpi"><div class="l">'+k.l+'</div><div class="v sk" id="kv-'+k.id+'">····</div><div class="s sk" id="ks-'+k.id+'">··········</div></div>';
}).join('');
function setKpi(id,v,s){ var e=$('kv-'+id); if(e){e.classList.remove('sk'); e.innerHTML=v;} var f=$('ks-'+id); if(f){f.classList.remove('sk'); f.innerHTML=s||'';} }
/* red de seguridad: si una fuente cuelga, no dejes el skeleton girando para siempre. */
setTimeout(function(){
  document.querySelectorAll('.kpi .v.sk').forEach(function(e){ e.classList.remove('sk'); e.textContent='—'; });
  document.querySelectorAll('.kpi .s.sk').forEach(function(e){ e.classList.remove('sk'); e.textContent=''; });
  var d=$('dia'); if(d && /Cargando/.test(d.textContent)) d.innerHTML='<div class="empty">No se pudo cargar. Recarga el panel.</div>';
  var p=$('para'); if(p && /Cargando/.test(p.textContent)) p.innerHTML='<div class="empty">No se pudo cargar. Recarga el panel.</div>';
}, 6000);

if(!sb){
  KPIS.forEach(function(k){ setKpi(k.id,'—',''); });
  $('dia').innerHTML='<div class="empty">No se pudo cargar la sesión.</div>';
  $('para').innerHTML='<div class="empty">No se pudo cargar la sesión.</div>';
}

/* Pricing: ocupación prevista + ADR sugerido (última corrida, filas de hoy) */
if(sb) guard(function(){
  return sb.from('pricing_recomendaciones').select('run_date').order('run_date',{ascending:false}).limit(1)
   .then(function(r){
     var run = r.data && r.data[0] && r.data[0].run_date; if(!run){ setKpi('ocup','—'); setKpi('adr','—'); return; }
     var hoy=hoyISO();
     return sb.from('pricing_recomendaciones').select('fecha,final_recommendation,room_occupancy_pct').eq('run_date',run)
       .then(function(rr){
         var filas=(rr.data||[]).filter(function(x){ return String(x.fecha)===hoy; });
         if(!filas.length) filas=(rr.data||[]).slice(0,40);
         var occs=filas.map(function(x){return x.room_occupancy_pct;}).filter(function(x){return x!=null;});
         var adrs=filas.map(function(x){return Number(x.final_recommendation);}).filter(function(x){return x>0;});
         if(occs.length){ var o=occs.reduce(function(a,b){return a+b;},0)/occs.length; setKpi('ocup', Math.round(o*100)+'<small>%</small>','previsto · hoy'); } else setKpi('ocup','—','sin corrida de hoy');
         if(adrs.length){ var a=adrs.reduce(function(s,b){return s+b;},0)/adrs.length; setKpi('adr', money(a),'sugerido · pricing'); } else setKpi('adr','—','');
       });
   });
});

/* Dinero del día: llegan hoy + por cobrar (RPC fin_panel_dinero) */
if(sb) guard(function(){
  return sb.rpc('fin_panel_dinero',{p_property:null}).then(function(r){
    var D=r.data||{};
    var lh=D.llegan_hoy||{};
    setKpi('lleg', (lh.n!=null?lh.n:'—'), (lh.saldo?('deben '+moneyK(lh.saldo)):'reservas de hoy'));
    var porcaer=0; (D.stripe||[]).forEach(function(s){ porcaer+=Number(s.neto||0); });
    var cobr = Number(lh.saldo||0)+porcaer;
    setKpi('cobr', moneyK(cobr), (porcaer?('+ '+moneyK(porcaer)+' por caer'):'al llegar'));
  }).catch(function(){ setKpi('lleg','—'); setKpi('cobr','—'); });
});

/* PepeFeliz: nota + reseñas sin responder */
if(sb) guard(function(){
  var p1=sb.from('cp_reputacion_evolucion').select('nota,fecha_consulta').order('fecha_consulta',{ascending:false}).limit(1);
  var p2=sb.from('cp_cola_respuestas').select('*',{count:'exact',head:true});
  return Promise.all([p1.catch(function(){return{};}),p2.catch(function(){return{};})]).then(function(a){
    var nota = a[0].data && a[0].data[0] && a[0].data[0].nota;
    var pend = a[1].count;
    setKpi('feliz', (nota!=null?(Number(nota).toFixed(1)+'<small>/10</small>'):'—'), (pend!=null?(pend+' sin responder'):'reputación'));
  });
});

/* Cierre del día: última fecha operativa */
if(sb) guard(function(){
  return sb.from('v_ctb_dias_auditoria').select('fecha_operativa,validado,descuadres,poliza_id').order('fecha_operativa',{ascending:false}).limit(1)
   .then(function(r){
     var d=r.data&&r.data[0]; if(!d){ setKpi('cier','—'); return; }
     var est,tag;
     if(d.descuadres>0){est='Descuadre';tag='bad';}
     else if(d.poliza_id){est='En libro';tag='ok';}
     else if(!d.validado){est='Sin validar';tag='warn';}
     else {est='Listo';tag='ok';}
     setKpi('cier','<span class="tag '+tag+'">'+est+'</span>', String(d.fecha_operativa||'').slice(5));
   });
});

/* ---------- LO QUE NECESITA TU DÍA ---------- */
if(sb) guard(function(){
  var items=[];
  var hoy0=hoyIni();
  // próximo viernes
  var dv=mxNow(); dv.setHours(12,0,0,0); dv.setDate(dv.getDate()+((5-(dv.getDay()===0?7:dv.getDay())+7)%7));
  var fvier=dv.getFullYear()+'-'+String(dv.getMonth()+1).padStart(2,'0')+'-'+String(dv.getDate()).padStart(2,'0');

  var tareas=[
    sb.from('mtto_tickets').select('id',{count:'exact',head:true}).in('estado',['nuevo','validado','programado','en_proceso'])
      .then(function(r){ if(r.count) items.push({dot:'warn',t:'Mantenimiento abierto', d:'incidencias sin cerrar', ct:r.count, act:'Ver', href:'/mantenimiento.html'}); }).catch(function(){}),
    sb.from('cp_cola_respuestas').select('*',{count:'exact',head:true})
      .then(function(r){ if(r.count) items.push({dot:'acc',t:'Reseñas sin responder', d:'reputación · cola', ct:r.count, act:'Responder', href:'/reputacion.html'}); }).catch(function(){}),
    sb.from('incidencias').select('id',{count:'exact',head:true}).eq('resuelto',false)
      .then(function(r){ if(r.count) items.push({dot:'warn',t:'Incidencias de RH', d:'sin resolver', ct:r.count, act:'Ver', href:'/m/incidencias.html'}); }).catch(function(){}),
    sb.from('ctb_plan_pago').select('id,estatus,fecha_viernes').eq('fecha_viernes',fvier).neq('estatus','cancelado').limit(1)
      .then(function(r){ var p=r.data&&r.data[0]; if(p) items.push({dot:(p.estatus==='autorizado'?'ok':'bad'),t:'Plan de pagos del viernes', d:'estatus: '+esc(p.estatus||'—'), act:'Abrir', href:'/m/finanzas-plan-pagos.html'}); }).catch(function(){}),
    sb.from('pricing_recomendaciones').select('run_date').order('run_date',{ascending:false}).limit(1)
      .then(function(r){ var run=r.data&&r.data[0]&&r.data[0].run_date; if(!run) return;
        return sb.from('pricing_recomendaciones').select('action_flag').eq('run_date',run).then(function(rr){
          var mov=(rr.data||[]).filter(function(x){return (x.action_flag||'').toUpperCase().indexOf('MOV')>=0;}).length;
          if(mov) items.push({dot:'acc',t:'Movimientos de precio sugeridos', d:'pricing recomienda ajustar', ct:mov, act:'Ver', href:'/m/RH-PRICING.html'});
        });
      }).catch(function(){})
  ];
  return Promise.all(tareas).then(function(){
    if(!items.length){ $('dia').innerHTML='<div class="empty">Nada urgente por ahora. 👌</div>'; return; }
    $('dia').innerHTML = items.map(function(it){
      return '<div class="row"><span class="dot '+(it.dot||'')+'"></span><div class="bd"><div class="t">'+esc(it.t)+'</div><div class="d">'+esc(it.d||'')+'</div></div>'
        +(it.ct!=null?'<span class="ct">'+it.ct+'</span>':'')
        +(it.href?'<a class="act" href="'+it.href+'" target="_top">'+esc(it.act||'Abrir')+'</a>':'')+'</div>';
    }).join('');
  });
});

/* ---------- PARA TI · DEL DÍA (tickets + Ateneo/Sincrético) ---------- */
if(sb) guard(function(){
  var items=[];
  var hoy0=hoyIni();
  var tDir=['seguridad','app','hablar','mejora_general','idea','sin_clasificar'];
  var tareas=[
    // tickets a dirección de hoy
    sb.from('buzon_direccion').select('id,tipo,mensaje,sede,estado,created_at').in('tipo',tDir).gte('created_at',hoy0).order('created_at',{ascending:false}).limit(6)
      .then(function(r){ (r.data||[]).forEach(function(x){
        items.push({dot:(x.estado==='nuevo'?'bad':'acc'),t:(tituloTicket(x.tipo)), d:recorta(x.mensaje)+(x.sede?(' · '+esc(x.sede)):''), act:'Abrir', href:'/m/incidencias.html'});
      }); }).catch(function(){}),
    // cola Pepe Atender (último corte)
    sb.from('pepe_atender_corte').select('corte').order('corte',{ascending:false}).limit(1)
      .then(function(r){ var c=r.data&&r.data[0]&&r.data[0].corte; if(!c) return;
        return sb.from('pepe_atender').select('titulo,urg,tipo,hecho').eq('corte',c).eq('hecho',false).order('id').limit(5).then(function(rr){
          (rr.data||[]).forEach(function(x){ items.push({dot:(x.urg?'bad':'acc'),t:esc(x.titulo||'Asunto'), d:'Pepe Atender'+(x.tipo?(' · '+esc(x.tipo)):''), act:'Atender', href:'/m/pepe-atender.html'}); });
        });
      }).catch(function(){}),
    // tickets de huésped (app) nuevos
    sb.from('apepe_tickets').select('id,tipo,titulo,estado,created_at').eq('estado','nuevo').order('created_at',{ascending:false}).limit(5)
      .then(function(r){ (r.data||[]).forEach(function(x){ items.push({dot:'warn',t:esc(x.titulo||('Ticket '+(x.tipo||''))), d:'app del huésped · '+esc(x.tipo||''), act:'Ver', href:'/m/apepe-tickets.html'}); }); }).catch(function(){}),
    // incidencias de mantenimiento de hoy, Sincrético / por área
    sb.from('mtto_tickets').select('id,clasificacion,created_at,ubic:ubicacion_id(nombre,area_negocio)').gte('created_at',hoy0).order('created_at',{ascending:false}).limit(30)
      .then(function(r){ var sinc=(r.data||[]).filter(function(x){ var a=x.ubic&&x.ubic.area_negocio; return a&&String(a).toLowerCase().indexOf('sincret')>=0; });
        if(sinc.length) items.push({dot:'acc',t:'Incidencias Sincrético (hoy)', d:'mantenimiento del día', ct:sinc.length, act:'Ver', href:'/mantenimiento.html'});
      }).catch(function(){})
  ];
  return Promise.all(tareas).then(function(){
    if(!items.length){ $('para').innerHTML='<div class="empty">Sin tickets nuevos hoy. ✨</div>'; return; }
    $('para').innerHTML = items.slice(0,9).map(function(it){
      return '<div class="row"><span class="dot '+(it.dot||'')+'"></span><div class="bd"><div class="t">'+it.t+'</div><div class="d">'+it.d+'</div></div>'
        +(it.ct!=null?'<span class="ct">'+it.ct+'</span>':'')
        +(it.href?'<a class="act" href="'+it.href+'" target="_top">'+esc(it.act||'Abrir')+'</a>':'')+'</div>';
    }).join('');
  });
});
function tituloTicket(t){ var M={seguridad:'🔒 Seguridad',app:'📱 App',hablar:'💬 Quiere hablar',mejora_general:'💡 Mejora',idea:'💡 Idea',sin_clasificar:'📨 Sin clasificar'}; return M[t]||('📨 '+esc(t||'Ticket')); }
function recorta(s){ s=String(s||''); return esc(s.length>70?s.slice(0,70)+'…':s); }

/* ---------- ACCESOS RÁPIDOS (links reales del panel) ---------- */
$('accesos').innerHTML=[
  ['🛎️','Check-in de hoy','/m/apepe-recepcion.html'],
  ['🔧','Mantenimiento','/mantenimiento.html'],
  ['🌙','Cierre del día','/m/finanzas-cierre-dia.html'],
  ['💸','Pagos del viernes','/m/finanzas-plan-pagos.html'],
  ['🎟️','Experiencias','/m/sinc-operacion.html'],
  ['🏨','Alta de hotel','/m/hotel-alta.html'],
  ['📈','Reputación','/reputacion.html'],
  ['📨','Pepe Atender','/m/pepe-atender.html']
].map(function(a){ return '<a href="'+a[2]+'" target="_top"><span class="em">'+a[0]+'</span>'+esc(a[1])+'</a>'; }).join('');

})();
</script>
</body></html>
