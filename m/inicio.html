<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inicio · Casa Pepe</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 70px}
h1{font-size:1.55rem;font-weight:700;letter-spacing:-.01em;margin:0}
h2{font-size:1.02rem;font-weight:700;margin:0}
.cab{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.cab h1{flex:1 1 auto}
.cab .meta{color:var(--muted);font-size:.86rem}
.eyebrow{font-size:.64rem;text-transform:uppercase;letter-spacing:.13em;font-weight:700;color:var(--faint)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 15px;box-shadow:var(--shadow)}
.kpi .l{font-size:.64rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--faint)}
.kpi .v{font-size:1.7rem;font-weight:700;margin-top:5px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:.9rem;color:var(--muted);font-weight:600}
.kpi .s{font-size:.78rem;color:var(--muted);margin-top:5px}
.kpi .v.sk,.kpi .s.sk{color:transparent;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;border-radius:6px;animation:sh 1.2s infinite}
@keyframes sh{0%{background-position:200% 0}100%{background-position:-200% 0}}
.tag{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:999px;letter-spacing:.02em}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)} .tag.none{background:var(--none-bg);color:var(--none)}
/* paneles */
.cols{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-top:16px}
@media(max-width:820px){.cols{grid-template-columns:1fr}.kpi .v{font-size:1.5rem}}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card .hd{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.card .hd h2{flex:1}
.card .hd a{font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap}
.card .hd a:hover{text-decoration:underline}
.row{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-top:1px solid var(--rule)}
.row:first-of-type{border-top:0}
.row .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:6px;background:var(--faint)}
.row .dot.ok{background:var(--ok)} .row .dot.warn{background:var(--warn)} .row .dot.bad{background:var(--bad)} .row .dot.acc{background:var(--accent)}
.row .bd{flex:1;min-width:0}
.row .t{font-weight:600;font-size:.92rem}
.row .d{font-size:.8rem;color:var(--muted);margin-top:1px}
.row .act{font-size:.78rem;color:var(--accent);text-decoration:none;font-weight:600;white-space:nowrap;flex:0 0 auto}
.row .act:hover{text-decoration:underline}
.row .ct{font-family:ui-monospace,Menlo,monospace;font-weight:700;font-size:1.05rem;flex:0 0 auto;min-width:34px;text-align:right}
.empty{color:var(--muted);font-size:.86rem;padding:10px 0}
.loading{color:var(--faint);font-size:.82rem;padding:10px 0}
/* accesos rápidos */
.acc{display:flex;flex-wrap:nowrap;gap:9px;margin-top:14px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.acc a{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--rule-2);
  border-radius:10px;padding:9px 13px;text-decoration:none;color:var(--ink);font-weight:600;font-size:.85rem;white-space:nowrap;box-shadow:var(--shadow)}
.acc a:hover{border-color:var(--accent);color:var(--accent)}
.acc a .em{font-size:1.05rem}
.sec-t{font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--faint);margin:22px 0 2px}
.note{font-size:.76rem;color:var(--faint);margin-top:20px;border-top:1px dashed var(--rule);padding-top:10px}
/* Tablero del día (solo dirección) */
.tablero{margin-top:16px}
.tablero>.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:0}
.tablero>.hd h2{flex:1 1 auto}
.fechanav{display:inline-flex;align-items:center;gap:8px}
.fechanav button{border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);border-radius:8px;width:30px;height:30px;font-size:1.15rem;line-height:1;cursor:pointer;font-weight:700;padding:0}
.fechanav button:hover{border-color:var(--accent);color:var(--accent)}
.fechanav .f{min-width:120px;text-align:center;font-weight:700;font-size:.92rem;font-variant-numeric:tabular-nums}
.fechanav .f small{display:block;font-size:.6rem;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--faint)}
.tbchips{display:flex;gap:7px;margin:13px 0 2px;flex-wrap:wrap}
.tbchips button{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:5px 14px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer}
.tbchips button:hover{border-color:var(--accent);color:var(--accent)}
.tbchips button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tbcasas{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px;margin-top:12px}
.tbcasa{border:1px solid var(--rule);border-radius:14px;padding:14px;background:var(--surface-3)}
.tbcasa-hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.tbcasa-n{font-weight:700;font-size:1rem;flex:1}
.tbgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.tbmetric{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:8px 9px;min-width:0}
.tbmetric .l{font-size:.58rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--faint)}
.tbmetric .v{font-size:1.22rem;font-weight:700;line-height:1.1;margin-top:3px;font-variant-numeric:tabular-nums}
.tbmetric .v small{font-size:.7rem;color:var(--muted);font-weight:600}
.tbmetric .sub{font-size:.64rem;color:var(--muted);margin-top:3px;line-height:1.3}
.tbventas{margin-top:11px;border-top:1px solid var(--rule);padding-top:9px}
.tbln{display:flex;align-items:baseline;gap:8px;padding:3px 0;font-size:.86rem}
.tbln .k{color:var(--muted);flex:1;min-width:0}
.tbln .n{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbln.sub2{font-size:.72rem;color:var(--faint);padding-top:0;margin-top:-2px}
.tbln.tot{border-top:1px dashed var(--rule);margin-top:5px;padding-top:7px;font-size:.94rem}
.tbsk{color:transparent;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;border-radius:6px;animation:sh 1.2s infinite}
.tbnote{font-size:.72rem;color:var(--faint);margin-top:11px}
.tbretry{border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;padding:4px 11px;font-size:.76rem;font-weight:600;color:var(--accent);cursor:pointer;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1 id="saludo">Hola</h1>
    <div class="meta" id="meta">Cargando…</div>
  </div>

  <div class="acc" id="accesos" style="margin-top:14px"></div>

  <div class="kpis" id="kpis"></div>

  <section class="card tablero" id="tableroWrap" style="display:none"></section>

  <div class="cols" id="cols">
    <div class="card">
      <div class="hd"><h2>Lo que necesita tu día</h2><a href="/m/incidencias.html" onclick="return irPanel('/m/incidencias.html','Incidencias')">Ver pendientes →</a></div>
      <div id="dia"><div class="loading">Cargando pendientes…</div></div>
    </div>
    <div class="card" id="paraCard" style="display:none">
      <div class="hd"><h2>Para ti · del día</h2><a href="/m/pepe-atender.html" onclick="return irPanel('/m/pepe-atender.html','Pepe Atender')">Pepe Atender →</a></div>
      <div id="para"><div class="loading">Cargando…</div></div>
    </div>
  </div>

  <div class="note" id="nota">Los indicadores se llenan con datos reales al abrir el panel con tu sesión. Los montos y la ocupación respetan tu alcance por propiedad.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>
(function(){
'use strict';
var SB_URL="https://rehophywchakfapivsbh.supabase.co";
var SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
var sb = window.supabase ? supabase.createClient(SB_URL, SB_KEY) : null;

/* --- utilidades --- */
function $(id){return document.getElementById(id);}
function money(n){ n=Number(n||0); return '$'+Math.round(n).toLocaleString('es-MX'); }
function moneyK(n){ n=Number(n||0); if(Math.abs(n)>=1000) return '$'+Math.round(n/1000).toLocaleString('es-MX')+'k'; return '$'+Math.round(n).toLocaleString('es-MX'); }
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mxNow(){ try{ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})); }catch(_){ return new Date(); } }
function hoyISO(){ var d=mxNow(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function hoyIni(){ return hoyISO()+'T00:00:00'; }
function fechaLarga(){ var d=mxNow(); var D=['domingo','lunes','martes','miércoles','jueves','viernes','sábado']; var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  return D[d.getDay()]+', '+d.getDate()+' '+M[d.getMonth()]; }
function nombreDe(email){ if(!email) return ''; var a=email.split('@')[0].replace(/[._-]+/g,' ').trim(); return a.charAt(0).toUpperCase()+a.slice(1); }

/* cada widget falla solo: si revienta, pone su hueco en "—" y sigue. */
function guard(fn){ return Promise.resolve().then(fn).catch(function(e){ console.warn('inicio widget', e); }); }

/* --- saludo + meta --- */
guard(function(){
  var email=''; try{ email=(window.cpAcceso&&cpAcceso.tokEmail&&cpAcceso.tokEmail())||''; }catch(_){}
  var h=mxNow().getHours(); var sal = h<12?'Buenos días':(h<19?'Buenas tardes':'Buenas noches');
  var nom=nombreDe(email);
  $('saludo').textContent = sal + (nom?(', '+nom):'');
  return (window.cpAcceso&&cpAcceso.ubicaciones?cpAcceso.ubicaciones():Promise.resolve(null)).then(function(ubi){
    var amb = (!ubi||ubi.length>1)?'Todas las propiedades':(ubi[0]||'').toUpperCase();
    $('meta').textContent = amb+' · '+fechaLarga();
  }).catch(function(){ $('meta').textContent = fechaLarga(); });
});

/* --- KPIs con compuerta de confidencialidad ---
   Operativos (Llegan, PepeFeliz) los ve todo el equipo.
   Dinero / revenue (Ocupación, ADR, Por cobrar, Cierre) y la tarjeta "Para ti"
   SOLO dirección/corp (puede_ver_corp). Así la home es para todos sin filtrar
   información confidencial a puestos operativos. */
function setKpi(id,v,s){ var e=$('kv-'+id); if(e){e.classList.remove('sk'); e.innerHTML=v;} var f=$('ks-'+id); if(f){f.classList.remove('sk'); f.innerHTML=s||'';} }
function mkKpi(id,l){ return '<div class="kpi"><div class="l">'+esc(l)+'</div><div class="v sk" id="kv-'+id+'">····</div><div class="s sk" id="ks-'+id+'">··········</div></div>'; }
function safetyNet(){ setTimeout(function(){
  document.querySelectorAll('.kpi .v.sk').forEach(function(e){ e.classList.remove('sk'); e.textContent='—'; });
  document.querySelectorAll('.kpi .s.sk').forEach(function(e){ e.classList.remove('sk'); e.textContent=''; });
  var d=$('dia'); if(d && /Cargando/.test(d.textContent)) d.innerHTML='<div class="empty">No se pudo cargar. Recarga el panel.</div>';
  var p=$('para'); if(p && /Cargando/.test(p.textContent)) p.innerHTML='<div class="empty">No se pudo cargar.</div>';
}, 6000); }

var DIRp;
try{ DIRp = (sb && window.cpAcceso && cpAcceso.esDireccion) ? Promise.resolve(cpAcceso.esDireccion()).catch(function(){return false;}) : Promise.resolve(false); }
catch(_){ DIRp = Promise.resolve(false); }
window.__DIRp = DIRp;

DIRp.then(function(DIR){
  var tiles=[];
  if(DIR) tiles.push(mkKpi('ocup','Ocupación prevista'), mkKpi('adr','ADR sugerido'));
  tiles.push(mkKpi('lleg','Llegan hoy'));
  if(DIR) tiles.push(mkKpi('cobr','Por cobrar'), mkKpi('cier','Cierre del día'));
  tiles.push(mkKpi('feliz','PepeFeliz'));
  $('kpis').innerHTML = tiles.join('');
  safetyNet();

  if(!sb){ document.querySelectorAll('.kpi .v').forEach(function(e){e.classList.remove('sk');e.textContent='—';});
    document.querySelectorAll('.kpi .s').forEach(function(e){e.classList.remove('sk');e.textContent='';}); return; }

  /* Llegadas (operativo, para todos): solo el número. El saldo por cobrar solo a dirección. */
  guard(function(){
    return sb.rpc('fin_panel_dinero',{p_property:null}).then(function(r){
      var D=r.data||{}, lh=D.llegan_hoy||{};
      setKpi('lleg', (lh.n!=null?lh.n:'—'), (DIR&&lh.saldo)?('deben '+moneyK(lh.saldo)):'reservas de hoy');
      if(DIR){ var pc=0; (D.stripe||[]).forEach(function(s){ pc+=Number(s.neto||0); });
        var cobr=Number(lh.saldo||0)+pc; setKpi('cobr', moneyK(cobr), (pc?('+ '+moneyK(pc)+' por caer'):'al llegar')); }
    }).catch(function(){ setKpi('lleg','—'); if(DIR) setKpi('cobr','—'); });
  });

  /* PepeFeliz (reputación, para todos) */
  guard(function(){
    var p1=sb.from('cp_reputacion_evolucion').select('nota,fecha_consulta').order('fecha_consulta',{ascending:false}).limit(1);
    // sin responder ACCIONABLE: contestables y recientes (≤14 días), no la cola histórica completa
    var p2=sb.from('cp_cola_respuestas').select('*',{count:'exact',head:true}).eq('contestable',true).lte('dias_esperando',14);
    return Promise.all([p1.catch(function(){return{};}),p2.catch(function(){return{};})]).then(function(a){
      var nota=a[0].data&&a[0].data[0]&&a[0].data[0].nota, pend=a[1].count;
      setKpi('feliz',(nota!=null?(Number(nota).toFixed(1)+'<small>/10</small>'):'—'),(pend!=null?(pend+' x responder · 14d'):'reputación'));
    });
  });

  if(!DIR) return;  // lo confidencial, solo dirección/corp

  /* Pricing: ocupación prevista + ADR sugerido */
  guard(function(){
    return sb.from('pricing_recomendaciones').select('run_date').order('run_date',{ascending:false}).limit(1).then(function(r){
      var run=r.data&&r.data[0]&&r.data[0].run_date; if(!run){ setKpi('ocup','—'); setKpi('adr','—'); return; }
      var hoy=hoyISO();
      return sb.from('pricing_recomendaciones').select('fecha,final_recommendation,room_occupancy_pct').eq('run_date',run).then(function(rr){
        var filas=(rr.data||[]).filter(function(x){return String(x.fecha)===hoy;}); if(!filas.length) filas=(rr.data||[]).slice(0,40);
        var occs=filas.map(function(x){return x.room_occupancy_pct;}).filter(function(x){return x!=null;});
        var adrs=filas.map(function(x){return Number(x.final_recommendation);}).filter(function(x){return x>0;});
        if(occs.length){ var o=occs.reduce(function(a,b){return a+b;},0)/occs.length; setKpi('ocup',Math.round(o*100)+'<small>%</small>','previsto · hoy'); } else setKpi('ocup','—','sin corrida de hoy');
        if(adrs.length){ var a=adrs.reduce(function(s,b){return s+b;},0)/adrs.length; setKpi('adr',money(a),'sugerido · pricing'); } else setKpi('adr','—','');
      });
    });
  });

  /* Cierre del día */
  guard(function(){
    return sb.from('v_ctb_dias_auditoria').select('fecha_operativa,validado,descuadres,poliza_id').order('fecha_operativa',{ascending:false}).limit(1).then(function(r){
      var d=r.data&&r.data[0]; if(!d){ setKpi('cier','—'); return; }
      var est,tag;
      if(d.descuadres>0){est='Descuadre';tag='bad';} else if(d.poliza_id){est='En libro';tag='ok';}
      else if(!d.validado){est='Sin validar';tag='warn';} else {est='Listo';tag='ok';}
      setKpi('cier','<span class="tag '+tag+'">'+est+'</span>',String(d.fecha_operativa||'').slice(5));
    });
  });
});

/* ---------- LO QUE NECESITA TU DÍA ---------- */
if(sb) guard(function(){ return window.__DIRp.then(function(DIR){
  var items=[];
  var hoy0=hoyIni();
  // próximo viernes
  var dv=mxNow(); dv.setHours(12,0,0,0); dv.setDate(dv.getDate()+((5-(dv.getDay()===0?7:dv.getDay())+7)%7));
  var fvier=dv.getFullYear()+'-'+String(dv.getMonth()+1).padStart(2,'0')+'-'+String(dv.getDate()).padStart(2,'0');

  var tareas=[
    sb.from('mtto_tickets').select('id',{count:'exact',head:true}).in('estado',['nuevo','validado','programado','en_proceso'])
      .then(function(r){ if(r.count) items.push({dot:'warn',t:'Mantenimiento abierto', d:'incidencias sin cerrar', ct:r.count, act:'Ver', href:'/mantenimiento.html'}); }).catch(function(){}),
    sb.from('cp_cola_respuestas').select('*',{count:'exact',head:true}).eq('contestable',true).lte('dias_esperando',14)
      .then(function(r){ if(r.count) items.push({dot:'acc',t:'Reseñas sin responder', d:'contestables · últimos 14 días', ct:r.count, act:'Responder', href:'/reputacion.html'}); }).catch(function(){}),
    sb.from('incidencias').select('id',{count:'exact',head:true}).eq('resuelto',false)
      .then(function(r){ if(r.count) items.push({dot:'warn',t:'Incidencias de RH', d:'sin resolver', ct:r.count, act:'Ver', href:'/m/incidencias.html'}); }).catch(function(){})
  ];
  if(DIR){
    tareas.push(
    sb.from('ctb_plan_pago').select('id,estatus,fecha_viernes').eq('fecha_viernes',fvier).neq('estatus','cancelado').limit(1)
      .then(function(r){ var p=r.data&&r.data[0]; if(p) items.push({dot:(p.estatus==='autorizado'?'ok':'bad'),t:'Plan de pagos del viernes', d:'estatus: '+esc(p.estatus||'—'), act:'Abrir', href:'/m/finanzas-plan-pagos.html'}); }).catch(function(){}),
    sb.from('pricing_recomendaciones').select('run_date').order('run_date',{ascending:false}).limit(1)
      .then(function(r){ var run=r.data&&r.data[0]&&r.data[0].run_date; if(!run) return;
        return sb.from('pricing_recomendaciones').select('action_flag').eq('run_date',run).then(function(rr){
          var mov=(rr.data||[]).filter(function(x){return (x.action_flag||'').toUpperCase().indexOf('MOV')>=0;}).length;
          if(mov) items.push({dot:'acc',t:'Movimientos de precio sugeridos', d:'pricing recomienda ajustar', ct:mov, act:'Ver', href:'/m/RH-PRICING.html'});
        });
      }).catch(function(){})
    );
  }
  return Promise.all(tareas).then(function(){
    if(!items.length){ $('dia').innerHTML='<div class="empty">Nada urgente por ahora. 👌</div>'; return; }
    $('dia').innerHTML = items.map(function(it){
      return '<div class="row"><span class="dot '+(it.dot||'')+'"></span><div class="bd"><div class="t">'+esc(it.t)+'</div><div class="d">'+esc(it.d||'')+'</div></div>'
        +(it.ct!=null?'<span class="ct">'+it.ct+'</span>':'')
        +(it.href?'<a class="act" href="'+it.href+'" onclick="return irPanel(\''+it.href+'\')">'+esc(it.act||'Abrir')+'</a>':'')+'</div>';
    }).join('');
  });
}); });

/* ---------- PARA TI · DEL DÍA (tickets + Ateneo/Sincrético) — SOLO DIRECCIÓN/CORP ---------- */
if(sb) window.__DIRp.then(function(DIR){
 if(!DIR){ var cols=$('cols'); if(cols) cols.style.gridTemplateColumns='1fr'; return; }  // operativos: sin tarjeta "Para ti"
 var pc=$('paraCard'); if(pc) pc.style.display='';
 return guard(function(){
  var items=[];
  var hoy0=hoyIni();
  var tDir=['seguridad','app','hablar','mejora_general','idea','sin_clasificar'];
  var tareas=[
    // tickets a dirección de hoy
    sb.from('buzon_direccion').select('id,tipo,mensaje,sede,estado,created_at').in('tipo',tDir).gte('created_at',hoy0).order('created_at',{ascending:false}).limit(6)
      .then(function(r){ (r.data||[]).forEach(function(x){
        items.push({dot:(x.estado==='nuevo'?'bad':'acc'),t:(tituloTicket(x.tipo)), d:recorta(x.mensaje)+(x.sede?(' · '+esc(x.sede)):''), act:'Abrir', href:'/m/incidencias.html'});
      }); }).catch(function(){}),
    // cola Pepe Atender (último corte)
    sb.from('pepe_atender_corte').select('corte').order('corte',{ascending:false}).limit(1)
      .then(function(r){ var c=r.data&&r.data[0]&&r.data[0].corte; if(!c) return;
        return sb.from('pepe_atender').select('titulo,urg,tipo,hecho').eq('corte',c).eq('hecho',false).order('id').limit(5).then(function(rr){
          (rr.data||[]).forEach(function(x){ items.push({dot:(x.urg?'bad':'acc'),t:esc(x.titulo||'Asunto'), d:'Pepe Atender'+(x.tipo?(' · '+esc(x.tipo)):''), act:'Atender', href:'/m/pepe-atender.html'}); });
        });
      }).catch(function(){}),
    // tickets de huésped (app) nuevos
    sb.from('apepe_tickets').select('id,tipo,titulo,estado,created_at').eq('estado','nuevo').order('created_at',{ascending:false}).limit(5)
      .then(function(r){ (r.data||[]).forEach(function(x){ items.push({dot:'warn',t:esc(x.titulo||('Ticket '+(x.tipo||''))), d:'app del huésped · '+esc(x.tipo||''), act:'Ver', href:'/m/apepe-tickets.html'}); }); }).catch(function(){}),
    // incidencias de mantenimiento de Ateneo (Virreyes) creadas hoy
    sb.from('mtto_tickets').select('id',{count:'exact',head:true}).eq('property_id','3e10a9ea-4913-4f7c-86ef-0c829caa851d').gte('created_at',hoy0)
      .then(function(r){ if(r.count) items.push({dot:'acc',t:'Incidencias de Ateneo (hoy)', d:'Virreyes · mantenimiento', ct:r.count, act:'Ver', href:'/mantenimiento.html'}); }).catch(function(){})
  ];
  return Promise.all(tareas).then(function(){
    if(!items.length){ $('para').innerHTML='<div class="empty">Sin tickets nuevos hoy. ✨</div>'; return; }
    $('para').innerHTML = items.slice(0,9).map(function(it){
      return '<div class="row"><span class="dot '+(it.dot||'')+'"></span><div class="bd"><div class="t">'+it.t+'</div><div class="d">'+it.d+'</div></div>'
        +(it.ct!=null?'<span class="ct">'+it.ct+'</span>':'')
        +(it.href?'<a class="act" href="'+it.href+'" onclick="return irPanel(\''+it.href+'\')">'+esc(it.act||'Abrir')+'</a>':'')+'</div>';
    }).join('');
  });
 });
});
function tituloTicket(t){ var M={seguridad:'🔒 Seguridad',app:'📱 App',hablar:'💬 Quiere hablar',mejora_general:'💡 Mejora',idea:'💡 Idea',sin_clasificar:'📨 Sin clasificar'}; return M[t]||('📨 '+esc(t||'Ticket')); }

/* ---------- TABLERO DEL DÍA (ocupación · ADR · RevPAR · ventas) — SOLO DIRECCIÓN/CORP ----------
   Sale de la edge function dia-tablero, que lee Cloudbeds y guarda por fecha.
   LA FECHA ES LA NOCHE: "Hoy" es la noche de esta noche (en libros, sube durante
   el día); "Ayer" es anoche, ya cerrada. Virreyes no tiene tablero de hotel y sus
   tours quedan aparte, no entran aquí. Es dinero: sólo se monta para dirección. */
var TB_CASAS=[
  {proy:'cdmx',   uuid:'45e69775-d877-4507-a9e1-a45bd3400dc5', nombre:'CDMX'},
  {proy:'puebla', uuid:'febfbef6-7fd1-4b45-84d9-13533e8dcb72', nombre:'Puebla'}
];
/* El JWT de la sesión vive en localStorage bajo sb-<ref>-auth-token. La función
   exige dirección (puede_ver_corp) con el JWT real del usuario; el apikey es la
   llave publishable, como en los demás módulos que llaman a functions/v1. */
function tokJWT(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&/sb-.*-auth-token/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null'); var s=v&&(v.currentSession||v); if(s&&s.access_token) return s.access_token; } } }catch(_){} return ''; }

if(sb) window.__DIRp.then(function(DIR){
  if(!DIR) return;  // confidencial: puestos operativos no ven el tablero
  return Promise.all(TB_CASAS.map(function(c){
    return (window.cpAcceso&&cpAcceso.permite?cpAcceso.permite(c.proy):Promise.resolve(true))
      .then(function(ok){return ok?c:null;}).catch(function(){return c;});
  })).then(function(lista){
    var casas=lista.filter(Boolean);
    if(casas.length) montarTablero(casas);
  });
});

function montarTablero(casas){
  var wrap=$('tableroWrap'); if(!wrap) return;
  wrap.style.display='';
  var offset=0, pedido=0;

  var DD=['dom','lun','mar','mié','jue','vie','sáb'], MM=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function fechaDe(off){ var d=mxNow(); d.setHours(12,0,0,0); d.setDate(d.getDate()+off); return d; }
  function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  function bonita(d){ return DD[d.getDay()]+' '+d.getDate()+' '+MM[d.getMonth()]; }
  function etiqueta(off){ return off===0?'Hoy':off===-1?'Ayer':off===1?'Mañana':(off<0?('hace '+(-off)+' d'):('en '+off+' d')); }

  wrap.innerHTML =
    '<div class="hd"><h2>Tablero del día</h2>'
    +'<div class="fechanav">'
    +'<button type="button" id="tbPrev" aria-label="Día anterior">‹</button>'
    +'<span class="f"><small id="tbRel">Hoy</small><span id="tbFecha">…</span></span>'
    +'<button type="button" id="tbNext" aria-label="Día siguiente">›</button>'
    +'</div></div>'
    +'<div class="tbchips" id="tbChips"></div>'
    +'<div class="tbcasas" id="tbCasas"></div>'
    +'<div class="tbnote">La fecha es la noche; hoy va en libros y sube durante el día. Tarifas netas de impuestos. La privada se mide por cuarto y el dormitorio por cama (RevPAB). Virreyes no entra: sus tours van aparte.</div>';

  $('tbChips').innerHTML=[['-1','Ayer'],['0','Hoy'],['1','Mañana']].map(function(c){
    return '<button type="button" data-off="'+c[0]+'">'+c[1]+'</button>'; }).join('');
  $('tbChips').addEventListener('click',function(e){ var b=e.target&&e.target.closest?e.target.closest('button'):null; if(!b)return; offset=Number(b.getAttribute('data-off')); cargar(); });
  $('tbPrev').addEventListener('click',function(){ offset--; cargar(); });
  $('tbNext').addEventListener('click',function(){ offset++; cargar(); });

  function met(l,v,sub){ return '<div class="tbmetric"><div class="l">'+esc(l)+'</div><div class="v">'+v+'</div><div class="sub">'+(sub||'')+'</div></div>'; }
  function metSk(l){ return '<div class="tbmetric"><div class="l">'+esc(l)+'</div><div class="v tbsk">··</div><div class="sub tbsk">····</div></div>'; }
  function innerSk(c){ return '<div class="tbcasa-hd"><span class="tbcasa-n">'+esc(c.nombre)+'</span></div>'
      +'<div class="tbgrid">'+metSk('Ocupación')+metSk('ADR')+metSk('RevPAR')+'</div>'
      +'<div class="tbventas"><div class="tbln"><span class="k">Hospedaje</span><span class="n tbsk">·····</span></div>'
      +'<div class="tbln"><span class="k">Tours</span><span class="n tbsk">·····</span></div>'
      +'<div class="tbln tot"><span class="k">Total del día</span><span class="n tbsk">·····</span></div></div>'; }
  function cajaSk(c){ return '<div class="tbcasa" id="tbcasa-'+c.proy+'">'+innerSk(c)+'</div>'; }

  function pinta(c,P,estado){
    var el=document.getElementById('tbcasa-'+c.proy); if(!el) return;
    if(estado==='lento'){
      el.innerHTML='<div class="tbcasa-hd"><span class="tbcasa-n">'+esc(c.nombre)+'</span><span class="tag warn">actualizando</span></div>'
        +'<div class="empty">El tablero se está recalculando desde Cloudbeds (tarda la primera vez del día).</div>'
        +'<button class="tbretry" type="button" data-proy="'+c.proy+'">Reintentar</button>'; return;
    }
    if(!P || P.ok===false){
      el.innerHTML='<div class="tbcasa-hd"><span class="tbcasa-n">'+esc(c.nombre)+'</span></div>'
        +'<div class="empty">No se pudo cargar'+(P&&P.error?(' ('+esc(String(P.error).slice(0,40))+')'):'')+'.</div>'
        +'<button class="tbretry" type="button" data-proy="'+c.proy+'">Reintentar</button>'; return;
    }
    if(P.no_conectado){
      el.innerHTML='<div class="tbcasa-hd"><span class="tbcasa-n">'+esc(c.nombre)+'</span><span class="tag none">sin Cloudbeds</span></div>'
        +'<div class="empty">'+esc(P.aviso||'Esta casa aún no tiene llave de Cloudbeds.')+'</div>'; return;
    }
    var occ=P.occ||{}, adr=P.adr||{}, rev=P.revpar||{}, vn=P.vendidas||{}, ve=P.ventas||{}, cob=P.cobertura||{};
    var badge='';
    if(P.cerrado) badge='<span class="tag ok">cerrado</span>';
    else if(P.en_libros) badge='<span class="tag warn">en libros</span>';
    else badge='<span class="tag" style="background:var(--accent-soft);color:var(--accent)">hoy</span>';
    if(cob.completa===false) badge+=' <span class="tag bad" title="faltan reservas por confirmar con Cloudbeds">parcial</span>';

    var occV = occ.general!=null ? (occ.general+'<small>%</small>') : '—';
    var occSub = [occ.privadas!=null?('priv '+occ.privadas+'%'):'', occ.dorm!=null?('dorm '+occ.dorm+'%'):''].filter(Boolean).join(' · ');
    var adrV = adr.casa!=null ? money(adr.casa) : '—';
    var adrSub = [adr.privadas!=null?('priv '+money(adr.privadas)):'', adr.dorm_revpab!=null?('RevPAB '+money(adr.dorm_revpab)):''].filter(Boolean).join(' · ');
    var revV = rev.casa!=null ? money(rev.casa) : '—';
    var revSub = vn.total!=null ? (vn.total+' noches vend.') : '';

    var hosp=Number(ve.hospedaje||0);
    var toursOk=ve.tours&&ve.tours.aplica, tours=toursOk?Number(ve.tours.importe||0):0, toursRes=toursOk?Number(ve.tours.reservas||0):0;
    var total=hosp+tours;
    var tieneSplit=(ve.hospedaje_privadas!=null||ve.hospedaje_dorm!=null);

    el.innerHTML=
      '<div class="tbcasa-hd"><span class="tbcasa-n">'+esc(c.nombre)+'</span>'+badge+'</div>'
      +'<div class="tbgrid">'+met('Ocupación',occV,occSub)+met('ADR',adrV,adrSub)+met('RevPAR',revV,revSub)+'</div>'
      +'<div class="tbventas">'
      +'<div class="tbln"><span class="k">Hospedaje</span><span class="n">'+money(hosp)+'</span></div>'
      +(tieneSplit?('<div class="tbln sub2"><span class="k">privadas '+money(ve.hospedaje_privadas||0)+' · dorm '+money(ve.hospedaje_dorm||0)+'</span></div>'):'')
      +'<div class="tbln"><span class="k">Tours'+(toursRes?(' · '+toursRes+' res'):'')+'</span><span class="n">'+money(tours)+'</span></div>'
      +'<div class="tbln"><span class="k">A&amp;B</span><span class="n" style="color:var(--faint);font-weight:600">—</span></div>'
      +'<div class="tbln tot"><span class="k">Total del día</span><span class="n">'+money(total)+'</span></div>'
      +'</div>';
  }

  function pedir(uuid,fecha){
    var ctrl=new AbortController(); var to=setTimeout(function(){ ctrl.abort(); }, 45000);
    return fetch(SB_URL+'/functions/v1/dia-tablero',{
      method:'POST', signal:ctrl.signal,
      headers:{'apikey':SB_KEY,'Authorization':'Bearer '+(tokJWT()||SB_KEY),'Content-Type':'application/json'},
      body:JSON.stringify({prop:uuid,fecha:fecha})
    }).then(function(r){ clearTimeout(to); if(!r.ok) return {ok:false,error:'HTTP '+r.status}; return r.json(); })
      .catch(function(e){ clearTimeout(to); return {ok:false, _abort:(e&&e.name==='AbortError')}; });
  }

  function unaCasa(c,fecha,mi){
    return pedir(c.uuid,fecha).then(function(P){ if(mi!==pedido) return;
      pinta(c,P, (P&&P.ok===false&&P._abort)?'lento':null); });
  }

  function cargar(){
    var mi=++pedido;
    var d=fechaDe(offset), f=iso(d);
    $('tbRel').textContent=etiqueta(offset);
    $('tbFecha').textContent=bonita(d);
    Array.prototype.forEach.call($('tbChips').querySelectorAll('button'),function(b){ b.classList.toggle('on', Number(b.getAttribute('data-off'))===offset); });
    $('tbCasas').innerHTML=casas.map(cajaSk).join('');
    casas.forEach(function(c){ unaCasa(c,f,mi); });
  }

  // Reintentar por casa (recalcula sólo esa casa, en la fecha visible)
  $('tbCasas').addEventListener('click',function(e){
    var b=e.target&&e.target.closest?e.target.closest('.tbretry'):null; if(!b) return;
    var proy=b.getAttribute('data-proy'); var c=casas.filter(function(x){return x.proy===proy;})[0]; if(!c) return;
    var el=document.getElementById('tbcasa-'+c.proy); if(el) el.innerHTML=innerSk(c);
    var d=fechaDe(offset); unaCasa(c,iso(d),pedido);
  });

  cargar();
}
function recorta(s){ s=String(s||''); return esc(s.length>70?s.slice(0,70)+'…':s); }

/* Navegar DENTRO del panel (mantiene el menú lateral). Antes usaban target="_top",
   que cargaba el módulo suelto arriba del todo y se comía la barra izquierda.
   parent.select() es el router del panel: carga el módulo en el iframe. Javi, 17-oct. */
window.irPanel=function(src,tit){
  try{ var P=window.parent; if(P&&P!==window&&typeof P.select==='function'){ P.select(src,tit||'',''); return false; } }catch(_){}
  try{ (window.top||window).location.href='/index.html?abre='+encodeURIComponent(src); }catch(_){ location.href=src; }
  return false;
};

$('accesos').innerHTML=[
  ['🛎️','Check-in de hoy','/m/apepe-recepcion.html'],
  ['🔧','Mantenimiento','/mantenimiento.html'],
  ['🌙','Cierre del día','/m/finanzas-cierre-dia.html'],
  ['💸','Pagos del viernes','/m/finanzas-plan-pagos.html'],
  ['🎟️','Experiencias','/m/sinc-operacion.html'],
  ['🏨','Alta de hotel','/m/hotel-alta.html'],
  ['📈','Reputación','/reputacion.html'],
  ['📨','Pepe Atender','/m/pepe-atender.html']
].map(function(a){ return '<a href="'+a[2]+'" onclick="return irPanel(\''+a[2]+'\',\''+a[1]+'\')"><span class="em">'+a[0]+'</span>'+esc(a[1])+'</a>'; }).join('');

})();
