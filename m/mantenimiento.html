<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mantenimiento · Soy Pepe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1512">
<style>
  :root{--bg:#0f1512;--card:#152019;--card2:#1b2a20;--ink:#eaf3ee;--ink2:#9db3a6;
    --line:#26362c;--brand:#1aa06a;--brand2:#137a56;
    --react:#e0705f;--correc:#e0a155;--prev:#6fb98c;--info:#7fa6c9;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:640px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  header .back{color:var(--ink2);text-decoration:none;font-size:22px;line-height:1}
  header h1{font-size:19px;margin:0;font-weight:700}
  .prop{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:14px}
  .prop button{flex:1;border:none;background:transparent;color:var(--ink2);font-weight:600;font-size:13px;padding:8px;border-radius:999px}
  .prop button.on{background:var(--brand);color:#04120c}
  .tabs{display:flex;gap:8px;margin-bottom:14px}
  .tab{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink2);font-weight:700;
    font-size:14px;padding:11px;border-radius:12px}
  .tab.on{background:var(--brand2);color:#fff;border-color:var(--brand2)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:12px 0 5px;letter-spacing:.02em}
  input,select,textarea{font:inherit;width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;
    background:var(--bg);color:var(--ink)}
  .btn{background:var(--brand);color:#04120c;border:none;border-radius:12px;padding:13px 16px;font-weight:800;
    font-size:15px;width:100%}
  .btn.sec{background:var(--card2);color:var(--ink);border:1px solid var(--line)}
  .btn.sm{width:auto;padding:9px 13px;font-size:13px;font-weight:700}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .clas{display:flex;gap:8px;margin-top:6px}
  .clas button{flex:1;border:1px solid var(--line);background:var(--bg);color:var(--ink2);border-radius:12px;
    padding:10px 6px;font-size:12.5px;font-weight:700;line-height:1.25}
  .clas button.on[data-c="reactivo"]{background:var(--react);color:#1a0a06;border-color:var(--react)}
  .clas button.on[data-c="correctivo"]{background:var(--correc);color:#1a1206;border-color:var(--correc)}
  .clas button.on[data-c="preventivo"]{background:var(--prev);color:#04120c;border-color:var(--prev)}
  .tk{border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px;background:var(--card2)}
  .tk h3{margin:0 0 3px;font-size:15px}
  .tk .meta{color:var(--ink2);font-size:12.5px;margin-bottom:9px}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:4px 9px;border-radius:999px;color:#04120c}
  .p-react{background:var(--react)}.p-correc{background:var(--correc)}.p-prev{background:var(--prev)}
  .st{font-size:11px;font-weight:700;color:var(--ink2);border:1px solid var(--line);border-radius:6px;padding:3px 7px}
  .muted{color:var(--ink2)}.center{text-align:center;color:var(--ink2);padding:22px}
  .msg{margin-top:10px;font-size:13.5px;min-height:18px}
  .msg.ok{color:var(--prev)}.msg.err{color:var(--react)}
  a.lnk{color:var(--brand);font-weight:700;text-decoration:none}
  #login{max-width:360px;margin:12vh auto;padding:20px}
  #login h1{font-size:22px}
</style>
</head>
<body>
<div id="login" style="display:none">
  <h1>🔧 Mantenimiento</h1>
  <p class="muted">Abre esta página desde Soy Pepe (ya con tu sesión iniciada).</p>
  <a class="btn" href="/m/mensajes.html" style="display:inline-block;text-align:center;text-decoration:none">Ir a Soy Pepe</a>
</div>

<div class="wrap" id="app" style="display:none">
  <header>
    <a class="back" href="/m/mi-cuenta.html">‹</a>
    <h1>🔧 Mantenimiento</h1>
  </header>
  <div class="prop" id="prop"></div>
  <div class="tabs">
    <button class="tab on" id="tabRep" onclick="setTab('rep')">✍️ Reportar</button>
    <button class="tab" id="tabMis" onclick="setTab('mis')">🧰 Mis trabajos</button>
  </div>
  <div id="paneRep"></div>
  <div id="paneMis" style="display:none"></div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY);
const PROPS=[{id:"45e69775-d877-4507-a9e1-a45bd3400dc5",n:"CDMX"},
  {id:"3e10a9ea-4913-4f7c-86ef-0c829caa851d",n:"Virreyes"},
  {id:"febfbef6-7fd1-4b45-84d9-13533e8dcb72",n:"Puebla"}];
let PROP=PROPS[0], USER=null, CLAS='correctivo', TAB='rep';
const $=id=>document.getElementById(id);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clsPill=c=>({reactivo:'<span class="pill p-react">Reactivo</span>',correctivo:'<span class="pill p-correc">Correctivo</span>',preventivo:'<span class="pill p-prev">Preventivo</span>'}[c]||'');

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('login').style.display='';return;}
  USER=session.user; $('app').style.display='';
  $('prop').innerHTML=PROPS.map(p=>`<button data-p="${p.id}">${p.n}</button>`).join('');
  $('prop').querySelectorAll('button').forEach(b=>b.onclick=()=>setProp(b.dataset.p));
  setProp(PROP.id,true);
  if(location.hash==='#mis')setTab('mis'); else setTab('rep');
}
window.setProp=(id,silent)=>{PROP=PROPS.find(p=>p.id===id);
  $('prop').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));
  if(!silent)render();};
window.setTab=(t)=>{TAB=t;$('tabRep').classList.toggle('on',t==='rep');$('tabMis').classList.toggle('on',t==='mis');
  $('paneRep').style.display=t==='rep'?'':'none';$('paneMis').style.display=t==='mis'?'':'none';render();};
function render(){TAB==='rep'?renderRep():renderMis();}

async function renderRep(){
  const {data:ubis}=await sb.from('mtto_ubicaciones').select('id,nombre').eq('property_id',PROP.id).order('orden');
  $('paneRep').innerHTML=`<div class="card">
    <label>¿Qué pasa?</label>
    <textarea id="rDesc" rows="3" placeholder="Describe la incidencia…"></textarea>
    <label>Área / habitación</label>
    <select id="rUbic"><option value="">—</option>${(ubis||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join('')}</select>
    <label>Tipo</label>
    <div class="clas" id="rClas">
      <button data-c="reactivo">🔴 Reactivo<br><span class="muted" style="font-weight:500">pierdo la venta</span></button>
      <button data-c="correctivo" class="on">🟠 Correctivo<br><span class="muted" style="font-weight:500">pierdo calidad</span></button>
      <button data-c="preventivo">🟢 Preventivo<br><span class="muted" style="font-weight:500">previene daño</span></button>
    </div>
    <label>Foto (URL)</label>
    <input id="rFoto" placeholder="https://… (opcional)">
    <div style="height:12px"></div>
    <button class="btn" id="rSend">Enviar a mantenimiento</button>
    <div class="msg" id="rMsg"></div>
    <p class="muted" style="font-size:12.5px;margin:12px 0 0">En Pepe Chat, <b>Eloy Queda</b> hará este flujo por conversación (Fase 3).</p>
  </div>`;
  CLAS='correctivo';
  $('rClas').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    CLAS=b.dataset.c;$('rClas').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));});
  $('rSend').onclick=sendReporte;
}
async function sendReporte(){
  const desc=$('rDesc').value.trim(); const m=$('rMsg');
  if(!desc){m.textContent='Describe la incidencia';m.className='msg err';return;}
  $('rSend').disabled=true;
  const {error}=await sb.from('mtto_tickets').insert({property_id:PROP.id,origen:'reporte_chat',
    clasificacion:CLAS,ubicacion_id:$('rUbic').value||null,titulo:desc.slice(0,60),descripcion:desc,
    foto_url:$('rFoto').value.trim()||null,reportado_por:USER.id,reportado_por_nombre:USER.email,estado:'nuevo'});
  $('rSend').disabled=false;
  if(error){m.textContent=error.message;m.className='msg err';return;}
  m.textContent='✔ Reporte enviado';m.className='msg ok';$('rDesc').value='';$('rFoto').value='';
}

async function renderMis(){
  $('paneMis').innerHTML='<div class="center">Cargando…</div>';
  const {data,error}=await sb.from('mtto_tickets').select('*, ubic:ubicacion_id(nombre)')
    .eq('property_id',PROP.id).in('estado',['validado','programado','en_proceso'])
    .order('prioridad').order('reportado_at');
  if(error){$('paneMis').innerHTML='<div class="center">'+esc(error.message)+'</div>';return;}
  const rows=data||[];
  $('paneMis').innerHTML=rows.length?rows.map(t=>{
    const acc=t.estado==='en_proceso'
      ? `<button class="btn sm" onclick="resolver('${t.id}')">📷 Resolví</button>`
      : `<button class="btn sm" onclick="iniciar('${t.id}')">▶ Iniciar</button>`;
    return `<div class="tk"><h3>${esc(t.titulo||'—')}</h3>
      <div class="meta">${esc(t.ubic?.nombre||'—')} · ${clsPill(t.clasificacion)} <span class="st">${esc(t.estado)}</span>${t.minutos_estimados?` · ${t.minutos_estimados} min est.`:''}</div>
      <div class="row">${acc}${t.iniciado_at?`<span class="muted" style="font-size:12px">⏱ en curso</span>`:''}</div></div>`;
  }).join(''):'<div class="center">No tienes trabajos asignados 🎉</div>';
}
window.iniciar=async(id)=>{
  const {error}=await sb.from('mtto_tickets').update({estado:'en_proceso',iniciado_at:new Date().toISOString()}).eq('id',id);
  if(error)return alert(error.message);
  await sb.from('mtto_ticket_eventos').insert({ticket_id:id,tipo:'iniciado',actor_id:USER.id,actor_nombre:USER.email});
  renderMis();
};
window.resolver=async(id)=>{
  const foto=prompt('URL de la foto de resuelto (opcional):','')||null;
  const {data:t}=await sb.from('mtto_tickets').select('iniciado_at').eq('id',id).single();
  const now=new Date(); const mins=t?.iniciado_at?Math.max(1,Math.round((now-new Date(t.iniciado_at))/60000)):null;
  const {error}=await sb.from('mtto_tickets').update({estado:'resuelto',resuelto_at:now.toISOString(),
    minutos_reales:mins,foto_resuelto_url:foto}).eq('id',id);
  if(error)return alert(error.message);
  await sb.from('mtto_ticket_eventos').insert({ticket_id:id,tipo:'resuelto',actor_id:USER.id,actor_nombre:USER.email,payload:{minutos_reales:mins}});
  renderMis();
};
init();
</script>
</body>
</html>
