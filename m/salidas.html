<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salidas del día · Sincrético</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  SALIDAS DEL DIA. Javi, 26-oct-2026.

  La pregunta de la manana en recepcion no es "cuantas reservas hay": es
  "a que hora sale que, con quien va y quien falta por cobrar". Esta
  pantalla contesta eso y nada mas.

  Una fila por salida. Al abrirla, los nombres: quien viene, cuantos,
  si pago y de que hotel lo recogemos.

  EL DIA SE ELIGE, NO SE ADIVINA. Arranca en hoy, pero el selector manda.
  La recepcion perdia las llegadas cada tarde por mirar siempre "hoy"
  cuando lo que tenia enfrente era lo de manana temprano.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}
.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.verde{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}
.filtros{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filtros input,.filtros select{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.pill{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.al{background:var(--alerta-bg);color:var(--alerta)}
.pill.er{background:var(--error-bg);color:var(--error)}
.pill.ne{background:var(--hueso);color:var(--gris)}
.pill.na{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.pill.mg{background:var(--magenta-suave);color:#B3106F}
.pill.ci{background:var(--cielo-suave);color:#2F6E93}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:center;padding:13px 15px;margin-bottom:10px}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:34px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 16px Oswald;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;display:none;z-index:60;box-shadow:var(--sombra)}
@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}
.hora{flex:0 0 62px;text-align:center}
.hora b{display:block;font:700 19px Oswald;letter-spacing:.02em}
.hora span{font:400 11px Inter;color:var(--tenue)}
.fila{cursor:pointer;align-items:flex-start}
.fila .cifra{text-align:right;flex:0 0 auto}
.fila .cifra b{font:600 15px Inter;display:block}
.fila .cifra span{font:400 11.5px Inter;color:var(--tenue)}
.cupo{height:5px;border-radius:999px;background:var(--hueso);margin-top:7px;overflow:hidden;max-width:220px}
.cupo i{display:block;height:100%;background:var(--naranja)}
.cupo i.lleno{background:var(--ok)}
.cupo i.flojo{background:var(--alerta)}
.pax{margin-top:10px;border-top:1px solid var(--linea);padding-top:10px;display:none}
.pax.on{display:block}
.pax table{width:100%;border-collapse:collapse;font-size:13px}
.pax th{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);text-align:left;padding:5px 8px 5px 0}
.pax td{padding:6px 8px 6px 0;border-top:1px solid var(--hueso);vertical-align:top}
.dia{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dia input[type=date]{border:1.5px solid var(--linea);border-radius:9px;padding:9px 12px;background:#fff}
.dia .hoy{font:600 12.5px Oswald;letter-spacing:.05em;text-transform:uppercase;color:var(--gris)}
.pax tr.hu{cursor:pointer}
.pax tr.hu:hover td{background:var(--hueso)}
.pax tr.ficha{display:none}
.pax tr.ficha.on{display:table-row}
.pax tr.ficha td{background:var(--hueso);border-radius:0 0 9px 9px}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.datos .d span{display:block;font:600 10px Oswald;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.datos .d b{font:500 13px Inter}
.pax .acc{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.fila .ver{flex:0 0 auto}
</style></head><body>
<div class="wrap">

  <div class="encab">
    <div>
      <h1>Salidas del día</h1>
      <div class="cuenta" id="cuenta">Cargando…</div>
    </div>
    <div class="der">
      <a class="btn gris" target="_top" href="/m/sinc-operacion.html">Reservas y estados ↗</a>
    </div>
  </div>

  <div class="dia">
    <button class="btn sm gris" id="ant">‹ Día anterior</button>
    <input type="date" id="fecha">
    <button class="btn sm gris" id="sig">Día siguiente ›</button>
    <button class="btn sm" id="hoy">Hoy</button>
    <span class="hoy" id="letra"></span>
  </div>

  <div id="lista"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, SAL=null, FALLO='', RES={}, DIA='';

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}

function hoyISO(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function mueve(iso,n){ var d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function enLetra(iso){
  try{ var d=new Date(iso+'T12:00:00');
    var s=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    return s.charAt(0).toUpperCase()+s.slice(1)+(iso===hoyISO()?' · hoy':'');
  }catch(_){ return iso; }
}
function hhmm(h){ return String(h||'').slice(0,5)||'—'; }

function pinta(){
  var caja=$('lista');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos traer las salidas</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—'; return;
  }
  if(SAL===null){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  var pax=0, cobrar=0;
  SAL.forEach(function(s){ pax+=Number(s.cupo_tomado||0); cobrar+=Number(s.por_cobrar||0); });
  $('cuenta').innerHTML='<b>'+SAL.length+'</b> salidas · <b>'+pax+'</b> personas'+
    (cobrar?' · <b>'+cobrar+'</b> por cobrar':'');

  if(!SAL.length){
    caja.innerHTML='<div class="vacio"><b>Nada sale este día</b>No hay ninguna salida programada para el '+esc(DIA)+'.</div>';
    return;
  }

  caja.innerHTML=SAL.map(function(s){
    var max=Number(s.cupo_max||0), tom=Number(s.cupo_tomado||0), min=Number(s.cupo_min||0);
    var pct=max?Math.min(100,Math.round(tom*100/max)):0;
    var cl = (max&&tom>=max)?'lleno' : (min&&tom<min)?'flojo':'';
    var sinGuia = !s.guia_id;
    return '<div class="fila" data-id="'+esc(s.id)+'">'+
      '<div class="hora"><b>'+hhmm(s.hora)+'</b><span>'+(s.duracion_min?s.duracion_min+' min':'')+'</span></div>'+
      '<div class="mid">'+
        '<div class="nom"><b>'+esc(s.nombre||'(sin nombre)')+'</b></div>'+
        '<div class="pills">'+
          (s.estado==='confirmada'?'<span class="pill ok">Confirmada</span>':'<span class="pill ne">Programada</span>')+
          (sinGuia?'<span class="pill al">Sin guía</span>':'<span class="pill ci">'+esc(s.guia)+'</span>')+
          (min&&tom<min?'<span class="pill al">Falta mínimo ('+min+')</span>':'')+
          (Number(s.por_cobrar||0)?'<span class="pill er">'+s.por_cobrar+' por cobrar</span>':'')+
          (s.cut_off_pasado?'<span class="pill ne">Cerrada</span>':'')+
        '</div>'+
        '<div class="donde">'+esc(s.punto_encuentro||'sin punto de encuentro')+
          (s.touroperador?' · '+esc(s.touroperador):'')+(s.idioma?' · '+esc(s.idioma):'')+'</div>'+
        '<div class="cupo"><i class="'+cl+'" style="width:'+pct+'%"></i></div>'+
        '<div class="pax" id="pax-'+esc(s.id)+'"></div>'+
      '</div>'+
      '<div class="cifra"><b>'+tom+(max?'/'+max:'')+'</b><span>personas</span></div>'+
      (s.experiencia_id?'<div class="ver"><a class="btn sm gris" target="_top" href="/ficha.html?id='+encodeURIComponent(s.experiencia_id)+'">Ver el tour ↗</a></div>':'')+
    '</div>';
  }).join('');

  Array.prototype.forEach.call(caja.querySelectorAll('.fila'),function(el){
    el.addEventListener('click',function(e){
      if(e.target.closest('a,button')) return;
      abre(el.getAttribute('data-id'));
    });
  });
}

/* Los nombres solo se piden cuando alguien abre la salida: en un dia cargado
   son veinte consultas que nadie mira. */
async function abre(id){
  var caja=$('pax-'+id); if(!caja) return;
  if(caja.classList.contains('on')){ caja.classList.remove('on'); return; }
  caja.classList.add('on');
  if(RES[id]){ pintaPax(caja,RES[id]); return; }
  caja.innerHTML='<div style="color:var(--gris);padding:6px 0">Buscando quién viene…</div>';
  try{
    /* v_sinc_portal y no v_sinc_salidas_dia: trae el telefono, el pais, el
       idioma, el canal y el pick-up. Quien recibe al huesped necesita poder
       llamarle, no solo saber que viene. */
    var r=await fetch(SB+'/rest/v1/v_sinc_portal?select=*&salida_id=eq.'+encodeURIComponent(id)+'&order=huesped',{headers:hdr()});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    RES[id]=await r.json();
    pintaPax(caja,RES[id]);
  }catch(e){
    caja.innerHTML='<div style="color:var(--error);padding:6px 0">No pudimos traer los nombres: '+esc((e&&e.message)||e)+'</div>';
  }
}

function dato(t,v){ return v ? '<div class="d"><span>'+esc(t)+'</span><b>'+esc(v)+'</b></div>' : ''; }

function pintaPax(caja,lista){
  if(!lista.length){
    caja.innerHTML='<div style="color:var(--gris);padding:6px 0">Esta salida no tiene reservas todavía.</div>';
    return;
  }
  caja.innerHTML='<table><tr><th>Huésped</th><th>Pax</th><th>Pago</th><th>Hotel</th><th>Folio</th></tr>'+
    lista.map(function(p,i){
      var pg=String(p.pago_estado||'');
      var cl = pg==='pagado'?'ok' : pg==='en_destino'?'al' : pg?'ne':'er';
      var tel=String(p.telefono||'').replace(/[^0-9+]/g,'');
      return '<tr class="hu" data-i="'+i+'"><td><b>'+esc(p.huesped||'—')+'</b><br>'+
          '<span style="color:var(--tenue)">'+esc(p.email||'')+'</span></td>'+
        '<td>'+(p.pax||'—')+'</td>'+
        '<td><span class="pill '+cl+'">'+esc(pg||'sin pago')+'</span></td>'+
        '<td>'+esc(p.hotel||'—')+'</td>'+
        '<td style="color:var(--tenue)">'+esc(p.folio||'')+' ›</td></tr>'+
      '<tr class="ficha" id="hu-'+i+'"><td colspan="5">'+
        '<div class="datos">'+
          dato('Teléfono', p.telefono)+
          dato('País', p.pais)+
          dato('Idioma', p.idioma)+
          dato('Canal', p.canal)+
          dato('Adultos / menores', (p.adultos!=null||p.menores!=null)?((p.adultos||0)+' / '+(p.menores||0)):'')+
          dato('Pagó', p.pago_total!=null?('$'+Number(p.pago_total).toLocaleString('es-MX')+' '+(p.pago_moneda||'')):'')+
          dato('Vendió', p.touroperadora || p.anfitrion)+
          dato('Reservó', p.reservada_at?String(p.reservada_at).slice(0,10):'')+
          (p.pickup?dato('Pick-up', (p.pickup_lugar||p.hotel||'sí')+(p.pickup_hora?' · '+p.pickup_hora:'')):'')+
          dato('Notas', p.notas)+
        '</div>'+
        '<div class="acc">'+
          (tel?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(tel.replace(/^\+/,''))+'">WhatsApp ↗</a>':'')+
          (p.email?'<a class="btn sm gris" href="mailto:'+esc(p.email)+'">Escribirle</a>':'')+
          (p.id?'<a class="btn sm gris" target="_top" href="/m/sinc-operacion.html?reserva='+encodeURIComponent(p.id)+'">Ver la reserva ↗</a>':'')+
        '</div>'+
      '</td></tr>';
    }).join('')+'</table>';
  Array.prototype.forEach.call(caja.querySelectorAll('tr.hu'),function(tr){
    tr.addEventListener('click',function(e){
      if(e.target.closest('a,button')) return;
      var f=caja.querySelector('#hu-'+tr.getAttribute('data-i'));
      if(f) f.classList.toggle('on');
    });
  });
}

async function carga(){
  FALLO=''; SAL=null; RES={}; pinta();
  $('letra').textContent=enLetra(DIA);
  try{
    var r=await fetch(SB+'/rest/v1/v_sinc_salidas?select=*&fecha=eq.'+DIA+'&order=hora',{headers:hdr()});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    SAL=await r.json();
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  pinta();
  if(ABRIR){ var id=ABRIR; ABRIR=''; setTimeout(function(){
    abre(id);
    var el=document.querySelector('.fila[data-id="'+id+'"]');
    if(el){ try{ el.scrollIntoView({behavior:'smooth',block:'center'}); }catch(_){} }
  },120); }
}

function ponDia(iso){ DIA=iso; $('fecha').value=iso; carga(); }

$('fecha').addEventListener('change',function(){ if(this.value) ponDia(this.value); });
$('ant').addEventListener('click',function(){ ponDia(mueve(DIA,-1)); });
$('sig').addEventListener('click',function(){ ponDia(mueve(DIA,1)); });
$('hoy').addEventListener('click',function(){ ponDia(hoyISO()); });

ses=sesionPanel();
var qs=new URLSearchParams(location.search);
/* Se puede llegar aqui desde Inicio con una salida concreta: se abre sola,
   que es lo que esperaba quien hizo clic en ella. */
var ABRIR=qs.get('abrir')||'';
ponDia(qs.get('fecha')||hoyISO());
</script>
</body></html>
