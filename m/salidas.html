<!--
  SALIDAS DEL DIA. Javi, 26-oct-2026.

  La pregunta de la manana en recepcion no es "cuantas reservas hay": es
  "a que hora sale que, con quien va y quien falta por cobrar". Esta
  pantalla contesta eso y nada mas.

  Una fila por salida. Al abrirla, los nombres: quien viene, cuantos,
  si pago y de que hotel lo recogemos.

  EL DIA SE ELIGE, NO SE ADIVINA. Arranca en hoy, pero el selector manda.
  La recepcion perdia las llegadas cada tarde por mirar siempre "hoy"
  cuando lo que tenia enfrente era lo de manana temprano.

  EL EMBUDO, Y LO QUE SE VENDE PRIMERO. Javi, 26-nov-2026. La lista trataba
  igual a una salida con doce personas y a una que no ha vendido nada: las
  dos una fila, ordenadas por hora. Pero el dia no se trabaja por hora, se
  trabaja por lo que tiene gente dentro. Ahora arriba va lo vendido y lo
  vacio se pliega al final -sigue estando, no estorba-.
  Y de cada reserva se ve el camino entero: como se cobra, si se le aviso de
  su guia y su hora, si el guia dijo que llego, si paso el QR, y si hay
  alguna peticion de cambio de fecha o devolucion esperando respuesta.
  Tocando a una persona se abre su panel al lado y desde ahi se trabaja:
  avisarle, moverla de dia, registrar una devolucion o responder lo que haya
  pedido. Sin salir de la pantalla ni perder el dia que estabas mirando.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}
.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.verde{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}
.pill{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.al{background:var(--alerta-bg);color:var(--alerta)}
.pill.er{background:var(--error-bg);color:var(--error)}
.pill.ne{background:var(--hueso);color:var(--gris)}
.pill.na{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.pill.mg{background:var(--magenta-suave);color:#B3106F}
.pill.ci{background:var(--cielo-suave);color:#2F6E93}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:flex-start;padding:13px 15px;margin-bottom:10px;cursor:pointer}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:34px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 16px Oswald;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;display:none;z-index:160;box-shadow:var(--sombra)}
@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}
.hora{flex:0 0 62px;text-align:center}
.hora b{display:block;font:700 19px Oswald;letter-spacing:.02em}
.hora span{font:400 11px Inter;color:var(--tenue)}
.fila .cifra{text-align:right;flex:0 0 auto}
.fila .cifra b{font:600 15px Inter;display:block}
.fila .cifra span{font:400 11.5px Inter;color:var(--tenue)}
.cupo{height:5px;border-radius:999px;background:var(--hueso);margin-top:7px;overflow:hidden;max-width:220px}
.cupo i{display:block;height:100%;background:var(--naranja)}
.cupo i.lleno{background:var(--ok)}
.cupo i.flojo{background:var(--alerta)}
.pax{margin-top:10px;border-top:1px solid var(--linea);padding-top:10px;display:none}
.pax.on{display:block}
.pax table{width:100%;border-collapse:collapse;font-size:13px}
.pax th{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);text-align:left;padding:5px 8px 5px 0}
.pax td{padding:6px 8px 6px 0;border-top:1px solid var(--hueso);vertical-align:top}
.pax tr.hu{cursor:pointer}
.pax tr.hu:hover td{background:var(--hueso)}
.dia{display:flex;gap:9px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dia input[type=date]{border:1.5px solid var(--linea);border-radius:9px;padding:9px 12px;background:#fff}
.dia .hoy{font:600 12.5px Oswald;letter-spacing:.05em;text-transform:uppercase;color:var(--gris)}
.datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px 16px}
.datos .d span{display:block;font:600 10px Oswald;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.datos .d b{font:500 13px Inter}

/* EL EMBUDO. Cuatro marcas y siempre las mismas, en el mismo orden: cobro,
   aviso, guia, QR. Puestas asi se leen de un golpe y el hueco canta. */
.emb{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.paso{font:600 10px Oswald;letter-spacing:.07em;text-transform:uppercase;border-radius:7px;
  padding:3px 8px;border:1px solid var(--linea);background:#fff;color:var(--tenue);white-space:nowrap}
.paso.si{background:var(--ok-bg);border-color:#BFDFCE;color:var(--ok)}
.paso.med{background:var(--alerta-bg);border-color:#E6D3AA;color:var(--alerta)}
.paso.no{background:#fff;border-style:dashed}
.paso.urge{background:var(--error-bg);border-color:#E3C3BC;color:var(--error)}

/* Lo que no vendió: al fondo y plegado. */
.plg{background:#fff;border:1px dashed var(--linea);border-radius:12px;margin-top:6px}
.plg>summary{cursor:pointer;padding:13px 16px;font:600 12.5px Oswald;letter-spacing:.05em;
  text-transform:uppercase;color:var(--gris);list-style:none}
.plg>summary::-webkit-details-marker{display:none}
.plg .sin{display:flex;gap:12px;align-items:center;padding:9px 16px;border-top:1px solid var(--hueso);cursor:pointer}
.plg .sin b{font:700 14px Oswald;min-width:48px}
.plg .sin .n{font:500 13.5px Inter;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* EL PANEL DE LA RESERVA. Javi, 26-nov-2026: «en cada cliente genera la
   opción de abrir el menú lateral y trabajar con ellos... o sea gestionar su
   reserva». Entra por la derecha y no se lleva la pantalla por delante: al
   cerrarlo sigues en el mismo día y con la misma salida abierta. */
.capa{position:fixed;inset:0;background:rgba(30,26,22,.38);display:none;z-index:120}
.capa.on{display:block}
.lat{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);background:var(--papel);
  z-index:130;transform:translateX(102%);transition:transform .18s ease-out;
  display:flex;flex-direction:column;box-shadow:-18px 0 40px -28px rgba(30,26,22,.7)}
.lat.on{transform:none}
.lat header{padding:15px 16px 12px;border-bottom:1px solid var(--linea);background:#fff}
.lat header .t{font:700 19px Oswald;letter-spacing:.02em;line-height:1.15}
.lat header .s{font:400 12.5px Inter;color:var(--gris);margin-top:3px}
.lat .cerrar{position:absolute;top:11px;right:12px;border:none;background:var(--hueso);color:var(--gris);
  border-radius:9px;padding:7px 11px;font:600 12px Oswald;letter-spacing:.05em;cursor:pointer}
.lat .cuerpo{flex:1;overflow:auto;padding:14px 16px 26px}
.lat .bloque{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:13px 14px;margin-bottom:11px}
.lat .bloque h3{font:600 10.5px Oswald;letter-spacing:.1em;text-transform:uppercase;color:var(--gris);margin:0 0 9px}
.lat .acc{display:flex;gap:7px;flex-wrap:wrap}
.lat .acc .btn{flex:0 0 auto}
.lat .nota{font:400 12px Inter;color:var(--tenue);margin-top:8px;line-height:1.45}
@media(max-width:600px){ .lat{width:100%} }

/* EN EL TELÉFONO LA TARJETA SE ESTRUJABA. Javi, 26-nov-2026, con la captura:
   la hora, el nombre, los chips, la cuenta de personas y el botón del tour
   peleaban por el mismo renglón, y lo que perdía era el centro: «Casa Pepe
   Hostel Boutique CDMX» salía en columna, una palabra por línea, y «personas»
   se montaba encima del nombre. En una fila de flex, el hijo que puede
   encogerse se encoge hasta la letra. Aquí se le deja su propio renglón. */
@media(max-width:620px){
  .wrap{padding:14px 12px 70px}
  h1{font-size:22px}
  .fila{flex-wrap:wrap;gap:8px 10px;padding:12px 13px;align-items:center}
  .fila .hora{order:1;flex:0 0 auto;text-align:left;min-width:52px}
  .fila .hora b{font-size:17px}
  .fila .cifra{order:2;margin-left:auto;text-align:right}
  .fila .ver{order:3;flex:0 0 auto}
  .fila .mid{order:4;flex:1 1 100%;min-width:0}
  .fila .nom b{white-space:normal}
  .fila .donde{word-break:normal;overflow-wrap:anywhere}
  .cupo{max-width:none}
  /* La tabla de gente, con lo que de verdad se mira de pie en la puerta.
     La recogida y la flecha se van: el panel de cada persona las trae. */
  .pax th:nth-child(4),.pax td:nth-child(4),
  .pax th:nth-child(5),.pax td:nth-child(5){display:none}
  .pax td,.pax th{padding-right:6px}
  .dia{gap:7px}
  .dia .hoy{flex:1 1 100%;order:9}
}

<div class="wrap">

  <div class="encab">
    <div>
      <h1>Salidas del día</h1>
      <div class="cuenta" id="cuenta">Cargando…</div>
    </div>
    <div class="der">
      <a class="btn gris" target="_top" href="/m/sinc-operacion.html">Reservas y estados ↗</a>
    </div>
  </div>

  <div class="dia">
    <button class="btn sm gris" id="ant">‹ Día anterior</button>

    <button class="btn sm" id="hoy">Hoy</button>

    <div class="t" id="latT">—</div>

  </header>
  <div class="cuerpo" id="latC"></div>
</aside>

<div class="toast" id="toast"></div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, SAL=null, FALLO='', RES={}, DIA='', ABIERTAS={};

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},3200);}

function hoyISO(){ var d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); }
function mueveDia(iso,n){ var d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); }
function enLetra(iso){
  try{ var d=new Date(iso+'T12:00:00');
    var s=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    return s.charAt(0).toUpperCase()+s.slice(1)+(iso===hoyISO()?' · hoy':'');
  }catch(_){ return iso; }
}
function hhmm(h){ return String(h||'').slice(0,5)||'—'; }
function reloj(ts){ if(!ts) return ''; try{
  return new Date(ts).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(_){ return ''; } }
function pesos(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }

/* Una llamada a la base que, cuando falla, dice por qué. */
async function rpc(fn, cuerpo){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:hdr(),body:JSON.stringify(cuerpo||{})});
  var j=null; try{ j=await r.json(); }catch(_){}
  if(!r.ok){
    var m=(j&&(j.message||j.hint||j.details))||('la base respondió '+r.status);
    throw new Error(m);
  }
  return j;
}

/* El selector se arma con las ciudades que hoy tienen salida y la persona
   puede ver. Con una sola, se esconde: un desplegable de un elemento no es una
   eleccion, es un estorbo. */
function pintaCiudades(){
  var sel=$('ciudad'); if(!sel) return;
  var hay=[];
  (SAL||[]).forEach(function(s){
    var k=s.ciudad_key||''; if(k && hay.indexOf(k)<0) hay.push(k);
  });
  hay.sort();
  if(hay.length<2){ sel.style.display='none'; CIUDAD=''; return; }
  sel.style.display='';
  if(hay.indexOf(CIUDAD)<0) CIUDAD=hay[0];
  sel.innerHTML=hay.map(function(k){
      return '<option value="'+k+'"'+(k===CIUDAD?' selected':'')+'>'
        + esc(NOMBRE_CIUDAD[k]||k) +'</option>'; }).join('')
    + '<option value="">Todas</option>';
  sel.onchange=function(){ CIUDAD=this.value; pinta(); };
}

function deLaCiudad(){
  if(!SAL) return SAL;
  if(!CIUDAD) return SAL;
  return SAL.filter(function(s){ return (s.ciudad_key||'')===CIUDAD; });
}

/* Los cuatro pasos de una salida, contados sobre su gente. Un paso a medias
   -tres de doce avisados- no se pinta como hecho: se pinta como lo que es. */
function embudoSalida(s){
  var n=Number(s.reservas||0); if(!n) return '';
  function paso(hechos, et, uno){
    var cl = hechos>=n ? 'si' : (hechos>0 ? 'med' : 'no');
    return '<span class="paso '+cl+'">'+esc(et)+' '+(hechos>=n?'✓':(hechos+'/'+n))+'</span>';
  }
  var pg=Number(s.pagadas||0), de=Number(s.en_destino||0), pa=Number(s.divididas||0);
  var falta=Number(s.por_cobrar||0);
  /* «PAGADO ✓» CUANDO FALTA COBRAR ES MENTIRA. Javi, 26-nov-2026, viendo el
     Yoga de hoy: «¿por qué aparece en yoga 52 si cobra?». Las dos cosas eran
     ciertas -pagó su anticipo de $17 y quedan $52 para el punto- y juntas se
     contradecían. Mientras quede un peso por cobrar, eso es lo que se dice. */
  var cobro;
  if(falta>0){
    cobro='<span class="paso med">'+(pg>=n?'Anticipo pagado':'Pagadas '+pg+'/'+n)+
      ' · cobrar $'+falta.toLocaleString('es-MX')+'</span>';
  } else if(pg>=n){
    cobro='<span class="paso si">Pagado ✓</span>';
  } else {
    cobro='<span class="paso '+(pg?'med':'no')+'">'+
      (pg?('Pagadas '+pg+'/'+n):'Sin pagar')+
      (de?' · '+de+' en destino':'')+(pa?' · '+pa+' a medias':'')+'</span>';
  }
  /* EL AVISO SÓLO DONDE HAY RECOGIDA. Javi, 26-nov-2026: «cuando el tour no
     necesita programación, es decir no requieren pick up, evita notificar lo
     de avisado». Lo que se avisa es el guía, su teléfono y la hora a la que
     se le recoge: sin recogida no hay nada que decir, y el paso marcaba
     «Avisado 0/12» para siempre en tours donde eso no se hace nunca. */
  var pav=Number(s.por_avisar||0);
  var chipAviso = pav
    ? '<span class="paso '+(Number(s.avisados||0)>=pav?'si':(Number(s.avisados||0)?'med':'no'))+'">Avisado '+
        (Number(s.avisados||0)>=pav?'✓':(Number(s.avisados||0)+'/'+pav))+'</span>'
    : '';
  return '<div class="emb">'+cobro+
    chipAviso+
    paso(Number(s.guia_llego||0),'Guía llegó')+
    paso(Number(s.escaneados||0),'QR')+
    (Number(s.peticiones_pendientes||0)
      ? '<span class="paso urge">'+s.peticiones_pendientes+' por responder</span>' : '')+
  '</div>';
}

function filaSalida(s){
  var max=Number(s.cupo_max||0), tom=Number(s.cupo_tomado||0), min=Number(s.cupo_min||0);
  var pct=max?Math.min(100,Math.round(tom*100/max)):0;
  var cl = (max&&tom>=max)?'lleno' : (min&&tom<min)?'flojo':'';
  var sinGuia = !s.guia_id;
  return '<div class="fila" data-id="'+esc(s.id)+'">'+
    '<div class="hora"><b>'+hhmm(s.hora)+'</b><span>'+(s.duracion_min?s.duracion_min+' min':'')+'</span></div>'+
    '<div class="mid">'+
      '<div class="nom"><b>'+esc(s.nombre||'(sin nombre)')+'</b></div>'+
      '<div class="pills">'+
        (s.estado==='confirmada'?'<span class="pill ok">Confirmada</span>':'<span class="pill ne">Programada</span>')+
        (sinGuia?'<span class="pill al">Sin guía</span>':'<span class="pill ci">'+esc(s.guia)+'</span>')+
        (min&&tom<min?'<span class="pill al">Falta mínimo ('+min+')</span>':'')+
        /* Lo que falta por cobrar lo dice el chip de cobro de abajo, con su
           cifra. Decirlo dos veces en la misma fila es ruido. */
        (s.cut_off_pasado?'<span class="pill ne">Cerrada</span>':'')+
      '</div>'+
      embudoSalida(s)+
      '<div class="donde">'+esc(s.punto_encuentro||'sin punto de encuentro')+
        (s.touroperador?' · '+esc(s.touroperador):'')+(s.idioma?' · '+esc(s.idioma):'')+'</div>'+
      '<div class="cupo"><i class="'+cl+'" style="width:'+pct+'%"></i></div>'+
      '<div class="pax'+(ABIERTAS[s.id]?' on':'')+'" id="pax-'+esc(s.id)+'"></div>'+
    '</div>'+
    '<div class="cifra"><b>'+tom+(max?'/'+max:'')+'</b><span>personas</span></div>'+
    /* EL GUÍA Y LA HORA, AQUÍ. Javi, 26-nov-2026: «permíteme aquí asignar yo
       el guía y la hora». Se veía «sin guía» en la lista del día y había que
       irse a Programación a ponerlo, que es la pantalla de armar la semana,
       no la de resolver la mañana. */
    '<div class="ver"><button class="btn sm '+(sinGuia?'':'gris')+'" data-guia="'+esc(s.id)+'">'+
      (sinGuia?'Poner guía':'Guía y hora')+'</button></div>'+
  '</div>';
}

function pinta(){
  var caja=$('lista');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos traer las salidas</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—'; return;
  }
  if(SAL===null){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  var LIS=deLaCiudad();
  var conVenta=LIS.filter(function(s){ return Number(s.reservas||0)>0; });
  var vacias  =LIS.filter(function(s){ return !Number(s.reservas||0); });

  var pax=0, cobrar=0, pend=0;
  LIS.forEach(function(s){ pax+=Number(s.pax_vendidos||s.cupo_tomado||0);
    cobrar+=Number(s.por_cobrar||0); pend+=Number(s.peticiones_pendientes||0); });
  $('cuenta').innerHTML='<b>'+conVenta.length+'</b> con venta'+
    (vacias.length?' · '+vacias.length+' sin nadie':'')+
    ' · <b>'+pax+'</b> personas'+
    (cobrar?' · <b>'+cobrar+'</b> por cobrar':'')+
    (pend?' · <b style="color:var(--error)">'+pend+'</b> por responder':'')+
    (CIUDAD?' · '+esc(NOMBRE_CIUDAD[CIUDAD]||CIUDAD):'');

  if(!LIS.length){
    /* Que diga la verdad: no es lo mismo «no sale nada» que «no sale nada
       aqui, pero en la otra ciudad si». */
    caja.innerHTML='<div class="vacio"><b>Nada sale este día</b>'
      + (CIUDAD && SAL.length
         ? 'No hay salidas en '+esc(NOMBRE_CIUDAD[CIUDAD]||CIUDAD)+' el '+esc(DIA)
           +'. En las demás ciudades sí: cambia arriba para verlas.'
         : 'No hay ninguna salida programada para el '+esc(DIA)+'.')
      +'</div>';
    return;
  }

  var h='';
  if(conVenta.length) h+=conVenta.map(filaSalida).join('');
  else h+='<div class="vacio"><b>Hoy no hay ninguna venta</b>'+
    'Las '+LIS.length+' salidas del día están programadas, pero ninguna tiene gente apuntada.</div>';

  if(vacias.length){
    /* Plegadas, no escondidas: siguen contándose y se abren de un toque. */
    h+='<details class="plg"><summary>'+vacias.length+' salida'+(vacias.length===1?'':'s')+
       ' sin nadie apuntado · abrir</summary>'+
       vacias.map(function(s){
         return '<div class="sin" data-ver="'+esc(s.experiencia_id||'')+'">'+
           '<b>'+hhmm(s.hora)+'</b>'+
           '<span class="n">'+esc(s.nombre||'(sin nombre)')+'</span>'+
           (s.guia?'<span class="pill ci">'+esc(s.guia)+'</span>':'<span class="pill ne">sin guía</span>')+
         '</div>';
       }).join('')+
       '</details>';
  }
  caja.innerHTML=h;

  Array.prototype.forEach.call(caja.querySelectorAll('.fila'),function(el){
    el.addEventListener('click',function(e){
      if(e.target.closest('a,button')) return;
      abre(el.getAttribute('data-id'));
    });
  });
  Array.prototype.forEach.call(caja.querySelectorAll('[data-guia]'),function(b){
    b.onclick=function(e){ e.stopPropagation(); ponGuia(b.getAttribute('data-guia'), b); };
  });
  Array.prototype.forEach.call(caja.querySelectorAll('.sin'),function(el){
    el.addEventListener('click',function(){
      var id=el.getAttribute('data-ver');
      if(id) window.top.location.href='/ficha.html?id='+encodeURIComponent(id);
    });
  });
  /* Lo que estaba abierto sigue abierto después de repintar. */
  Object.keys(ABIERTAS).forEach(function(id){ if(ABIERTAS[id] && RES[id]){
    var c=$('pax-'+id); if(c){ c.classList.add('on'); pintaPax(c,RES[id],id); } }});
}

/* Los nombres solo se piden cuando alguien abre la salida: en un dia cargado
   son veinte consultas que nadie mira. */
async function abre(id, forzar){
  var caja=$('pax-'+id); if(!caja) return;
  if(!forzar && caja.classList.contains('on')){ caja.classList.remove('on'); ABIERTAS[id]=false; return; }
  caja.classList.add('on'); ABIERTAS[id]=true;
  if(RES[id] && !forzar){ pintaPax(caja,RES[id],id); return; }
  caja.innerHTML='<div style="color:var(--gris);padding:6px 0">Buscando quién viene…</div>';
  try{
    var r=await fetch(SB+'/rest/v1/v_sinc_dia_reservas?select=*&salida_id=eq.'+encodeURIComponent(id)+'&order=nombre',{headers:hdr()});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    RES[id]=await r.json();
    pintaPax(caja,RES[id],id);
  }catch(e){
    caja.innerHTML='<div style="color:var(--error);padding:6px 0">No pudimos traer los nombres: '+esc((e&&e.message)||e)+'</div>';
  }
}

function dato(t,v){ return v ? '<div class="d"><span>'+esc(t)+'</span><b>'+esc(v)+'</b></div>' : ''; }

function chipCobro(p){
  var c=String(p.cobro||'');
  if(c==='pagado')  return '<span class="paso si">Pagado</span>';
  if(c==='parte')   return '<span class="paso med">Falta '+pesos(p.pago_resto)+' en destino</span>';
  if(c==='destino') return '<span class="paso med">Paga en destino</span>';
  return '<span class="paso no">'+esc(c||'sin pago')+'</span>';
}
function chipsPaso(p){
  /* Sin recogida no hay aviso que dar, así que tampoco hay paso que enseñar.
     Si alguien lo marcó igual -porque le escribió de todos modos-, se respeta
     y se ve: el dato existe, y esconderlo sería desmentir a quien avisó. */
  var pideAviso = (p.requiere_aviso===true) || !!p.aviso_cliente_at;
  return chipCobro(p)+
    (pideAviso
      ? '<span class="paso '+(p.aviso_cliente_at?'si':'no')+'">Avisado'+(p.aviso_cliente_at?' ✓':'')+'</span>'
      : '')+
    '<span class="paso '+(p.llegue_aviso_at?'si':'no')+'">Guía'+(p.llegue_aviso_at?' '+reloj(p.llegue_aviso_at):'')+'</span>'+
    '<span class="paso '+(p.llego_at?'si':'no')+'">QR'+(p.llego_at?' '+reloj(p.llego_at):'')+'</span>'+
    (p.peticion_estado==='pendiente'
      ? '<span class="paso urge">'+esc(p.peticion_tipo==='fecha'?'Pide otra fecha':'Pide devolución')+'</span>'
      : p.peticion_estado
        ? '<span class="paso '+(p.peticion_estado==='aprobada'?'si':'med')+'">'+
            esc((p.peticion_tipo==='fecha'?'Fecha ':'Devolución ')+p.peticion_estado)+'</span>'
        : '');
}

function pintaPax(caja,lista,sid){
  if(!lista.length){
    caja.innerHTML='<div style="color:var(--gris);padding:6px 0">Esta salida no tiene reservas todavía.</div>';
    return;
  }
  /* RECOGIDA, NO HOTEL. Javi, 1-nov-2026: «en el hotel de recogida lo tienes
     que leer de donde reserva el huésped, no?». La columna decía «Hotel» y
     leía el hotel que VENDIÓ: en una reserva de web no hay vendedor y salía
     una raya, aunque el huésped hubiera escrito dónde se queda. Quien conduce
     necesita la dirección, no saber quién cobró la comisión. */
  caja.innerHTML='<table><tr><th>Huésped</th><th>Pax</th><th>En qué va</th><th>Recogida</th><th></th></tr>'+
    lista.map(function(p,i){
      return '<tr class="hu" data-i="'+i+'" data-s="'+esc(sid)+'">'+
        '<td><b>'+esc(p.nombre||'—')+'</b><br>'+
          '<span style="color:var(--tenue)">'+esc(p.email||p.telefono||'')+'</span></td>'+
        '<td>'+(p.pax||'—')+'</td>'+
        '<td><div class="emb">'+chipsPaso(p)+'</div></td>'+
        '<td>'+esc(p.pickup_lugar||p.hotel||'—')+
          (p.pickup_hora?'<br><span style="color:var(--tenue)">'+esc(p.pickup_hora)+'</span>':'')+'</td>'+
        '<td style="color:var(--tenue);white-space:nowrap">Gestionar ›</td></tr>';
    }).join('')+'</table>';
  Array.prototype.forEach.call(caja.querySelectorAll('tr.hu'),function(tr){
    tr.addEventListener('click',function(e){
      if(e.target.closest('a,button')) return;
      abrePanel(tr.getAttribute('data-s'), Number(tr.getAttribute('data-i')));
    });
  });
}

/* ---------- GUÍA Y HORA DE LA SALIDA ----------
   El padrón se pide una sola vez y se queda: en un día con quince salidas,
   quince consultas idénticas para la misma lista de nombres. */
var GUIAS=null;
async function traeGuias(){
  if(GUIAS) return GUIAS;
  var r=await fetch(SB+'/rest/v1/guias?select=id,nombre,activo&order=nombre&limit=500',{headers:hdr()});
  if(!r.ok) throw new Error('no pudimos traer el padrón de guías');
  GUIAS=(await r.json()).filter(function(g){ return g.activo!==false; });
  return GUIAS;
}

async function ponGuia(sid, btn){
  var s=(SAL||[]).filter(function(x){ return x.id===sid; })[0];
  if(!s) return;
  var antes=btn.textContent; btn.disabled=true; btn.textContent='…';
  try{
    var gs=await traeGuias();
    /* El diálogo de la casa pide las opciones como pares [valor, texto]. */
    var ops=[['','— sin guía —']].concat(gs.map(function(g){ return [g.id, g.nombre||'(sin nombre)']; }));
    var d=await cpPideVarios((s.nombre||'Esta salida')+' · '+hhmm(s.hora),[
      {k:'guia',et:'Quién la lleva',tipo:'select',opciones:ops,valor:s.guia_id||''},
      {k:'hora',et:'A qué hora sale',tipo:'time',valor:hhmm(s.hora)}
    ],{si:'Guardar'});
    btn.disabled=false; btn.textContent=antes;
    if(!d) return;

    var hora=String(d.hora||'').slice(0,5);
    var cambiaHora = hora && hora!==hhmm(s.hora);
    var cambiaGuia = String(d.guia||'')!==String(s.guia_id||'');
    if(!cambiaHora && !cambiaGuia) return;

    btn.disabled=true; btn.textContent='Guardando…';

    if(cambiaHora){
      var rh=await fetch(SB+'/rest/v1/sinc_salidas?id=eq.'+encodeURIComponent(sid),
        {method:'PATCH',headers:hdr(),body:JSON.stringify({hora:hora+':00'})});
      if(!rh.ok){ var jh=null; try{ jh=await rh.json(); }catch(_){}
        throw new Error((jh&&(jh.message||jh.hint))||('no se pudo cambiar la hora ('+rh.status+')')); }
    }

    if(cambiaGuia){
      /* Una salida tiene un principal: el que había se quita y entra el
         nuevo. Entra como 'propuesta', igual que desde Programación: el
         guía la confirma desde su app, no se le impone. */
      await fetch(SB+'/rest/v1/sinc_asignaciones?salida_id=eq.'+encodeURIComponent(sid)+'&rol=eq.principal',
        {method:'DELETE',headers:hdr()});
      if(d.guia){
        var hh=(cambiaHora?hora:hhmm(s.hora))||'09:00';
        var ini=new Date((s.fecha||DIA)+'T'+hh+':00-06:00');
        var fin=new Date(ini.getTime()+((Number(s.duracion_min)||180)*60000));
        var ra=await fetch(SB+'/rest/v1/sinc_asignaciones',{method:'POST',headers:hdr(),
          body:JSON.stringify({salida_id:sid, guia_id:d.guia, rol:'principal', estado:'propuesta',
            inicio:ini.toISOString(), fin:fin.toISOString(),
            horas:Math.round((Number(s.duracion_min)||180)/6)/10})});
        if(!ra.ok){
          var ja=null; try{ ja=await ra.json(); }catch(_){}
          /* El choque de agenda tiene nombre y se dice con el suyo. */
          throw new Error(/solapa|overlap|exclu/i.test(String((ja&&ja.message)||''))
            ? 'Ese guía ya tiene otra salida a esa hora.'
            : ((ja&&(ja.message||ja.hint))||('no se pudo asignar ('+ra.status+')')));
        }
      }
    }
    btn.disabled=false; btn.textContent=antes;
    avisa(cambiaGuia&&cambiaHora ? 'Guía y hora guardados.' : (cambiaGuia?'Guía guardado.':'Hora guardada.'));
    await carga(true);
  }catch(e){
    btn.disabled=false; btn.textContent=antes;
    await cpAviso('No se pudo: '+((e&&e.message)||e));
  }
}

/* ---------- EL PANEL DE LA RESERVA ---------- */
var PSAL='', PIDX=-1;

function cierraPanel(){
  $('lat').classList.remove('on'); $('capa').classList.remove('on');
  $('lat').setAttribute('aria-hidden','true'); PSAL=''; PIDX=-1;
}
$('latX').onclick=cierraPanel;
$('capa').onclick=cierraPanel;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') cierraPanel(); });

function laReserva(){ var l=RES[PSAL]||[]; return l[PIDX]||null; }

function abrePanel(sid, i){
  PSAL=sid; PIDX=i;
  var p=laReserva(); if(!p) return;
  $('lat').classList.add('on'); $('capa').classList.add('on');
  $('lat').setAttribute('aria-hidden','false');
  pintaPanel();
}

function pintaPanel(){
  var p=laReserva(); if(!p) return;
  $('latT').textContent=p.nombre||'Sin nombre';
  $('latS').textContent=[ (p.pax||0)+' pers.', p.tour||'', hhmm(p.hora_salida) ].filter(Boolean).join(' · ');
  var tel=String(p.telefono||'').replace(/[^0-9+]/g,'');

  var h='';

  /* 1 · Dónde va en el camino, y lo que se puede marcar desde aquí. */
  h+='<div class="bloque"><h3>Cómo va</h3><div class="emb">'+chipsPaso(p)+'</div>'+
     (p.aviso_cliente_at
       ? '<div class="nota">Avisado el '+esc(String(p.aviso_cliente_at).slice(0,10))+' a las '+reloj(p.aviso_cliente_at)+
         (p.aviso_cliente_por?' por '+esc(p.aviso_cliente_por):'')+'.</div>'
       : (p.requiere_aviso===true
          ? '<div class="nota">Nadie le ha dicho todavía quién es su guía, su teléfono ni a qué hora se le recoge.</div>'
          : '<div class="nota">Este tour no lleva recogida: llega por su cuenta al punto de encuentro, '+
            'así que no hay guía ni hora que avisarle. Si aun así le escribes, déjalo anotado.</div>'))+
     '<div class="acc" style="margin-top:10px">'+
       (p.aviso_cliente_at
         ? '<button class="btn sm gris" data-a="desavisar">Quitar el aviso</button>'
         : '<button class="btn sm '+(p.requiere_aviso===true?'verde':'gris')+'" data-a="avisar">Ya le avisé</button>')+
       (tel?'<a class="btn sm" target="_blank" rel="noopener" href="https://wa.me/'+esc(tel.replace(/^\+/,''))+'">WhatsApp ↗</a>':'')+
       (p.email?'<a class="btn sm gris" href="mailto:'+esc(p.email)+'">Correo</a>':'')+
     '</div></div>';

  /* 2 · La petición pendiente manda: es lo único que alguien está esperando. */
  if(p.peticion_estado==='pendiente'){
    h+='<div class="bloque" style="border-color:#E3C3BC">'+
      '<h3>'+(p.peticion_tipo==='fecha'?'Pide cambiar la fecha':'Pide una devolución')+'</h3>'+
      '<div class="datos">'+
        dato('Lo pide', p.peticion_pide)+
        dato('Fecha que pide', p.peticion_fecha)+
        dato('En plazo', p.peticion_en_plazo===true?'sí':(p.peticion_en_plazo===false?'no':''))+
        dato('Motivo', p.peticion_motivo)+
      '</div>'+
      '<div class="acc" style="margin-top:10px">'+
        '<button class="btn sm verde" data-a="aprobar">Aprobar</button>'+
        '<button class="btn sm gris" data-a="rechazar">Rechazar</button>'+
      '</div>'+
      '<div class="nota">Aprobar sólo deja dicho que sí. Mover la reserva o devolver el dinero son los botones de abajo.</div>'+
    '</div>';
  }

  /* 3 · Gestionar de verdad. */
  h+='<div class="bloque"><h3>Gestionar la reserva</h3><div class="acc">'+
      '<button class="btn sm" data-a="mover">Cambiar de día</button>'+
      '<button class="btn sm" data-a="reembolso">Devolución</button>'+
      (String(p.cobro)!=='pagado'?'<button class="btn sm gris" data-a="cobrado">Marcar cobrado</button>':'')+
      '<button class="btn sm gris" data-a="pickup">Recogida</button>'+
    '</div>'+
    '<div class="nota">El cambio de día y la devolución quedan anotados con tu nombre y la hora, '+
      'y siguen la regla del convenio: dentro de plazo se aprueban solas, fuera de plazo las decide el operador.</div>'+
  '</div>';

  /* 4 · Lo que hay que saber de esta persona. */
  h+='<div class="bloque"><h3>Sus datos</h3><div class="datos">'+
      dato('Folio', p.folio)+
      dato('Teléfono', p.telefono)+
      dato('Correo', p.email)+
      dato('País', p.pais)+
      dato('Idioma', p.idioma)+
      dato('Canal', p.canal)+
      dato('Adultos / menores', (p.adultos!=null||p.menores!=null)?((p.adultos||0)+' / '+(p.menores||0)):'')+
      dato('Hotel', p.hotel)+
      dato('Recogida', p.pickup_lugar)+
      dato('Hora de recogida', p.pickup_hora)+
      dato('Total', p.total!=null?pesos(p.total):'')+
      dato('Pagado', p.pago_total!=null?pesos(p.pago_total):'')+
      dato('Falta', (p.cobro==='parte')?pesos(p.pago_resto):'')+
      dato('Restricciones', p.restricciones)+
      dato('Notas', p.notas)+
    '</div>'+
    (p.id?'<div class="acc" style="margin-top:11px"><a class="btn sm gris" target="_top" href="/m/sinc-operacion.html?reserva='+encodeURIComponent(p.id)+'">Abrir la reserva entera ↗</a></div>':'')+
  '</div>';

  $('latC').innerHTML=h;
  Array.prototype.forEach.call($('latC').querySelectorAll('[data-a]'),function(b){
    b.onclick=function(){ accion(b.getAttribute('data-a'), b); };
  });
}

async function accion(que, btn){
  var p=laReserva(); if(!p) return;
  var antes=btn.textContent;
  function ocupa(t){ btn.disabled=true; btn.textContent=t||'…'; }
  function libera(){ btn.disabled=false; btn.textContent=antes; }
  try{
    if(que==='avisar' || que==='desavisar'){
      if(que==='avisar' && !await cpPregunta('¿Ya le dijiste a '+(p.nombre||'esta persona')+
          ' quién es su guía, su teléfono y a qué hora se le recoge?',{si:'Sí, ya le avisé'})) return;
      ocupa('Guardando…');
      await rpc('sinc_avisa_cliente',{p_reserva:p.id, p_si:(que==='avisar'), p_via:'whatsapp'});
      avisa(que==='avisar'?'Anotado: avisado.':'Quitado el aviso.');
    }
    else if(que==='mover'){
      var d=await cpPideVarios('Mover a '+(p.nombre||'esta reserva')+' a otro día',[
        {k:'fecha',et:'Nuevo día',tipo:'date',req:true,valor:p.fecha_salida||''},
        {k:'hora', et:'Hora (si cambia)',tipo:'time',valor:hhmm(p.hora_salida)},
        {k:'nota', et:'Por qué',valor:''}
      ],{si:'Mover'});
      if(!d) return;
      ocupa('Moviendo…');
      /* Primero queda dicho que se pidió -y quién-, y después se mueve. Si lo
         segundo falla, al menos consta lo primero. */
      try{ await rpc('sinc_pide',{p_reserva:p.id,p_tipo:'fecha',p_motivo:d.nota||null,p_fecha:d.fecha,p_hora:d.hora||null}); }catch(_){}
      var j=await rpc('sinc_reserva_mueve',{p_reserva:p.id,p_fecha:d.fecha,p_hora:d.hora||null,p_nota:d.nota||null});
      if(j && j.ok===false) throw new Error(j.error||'no se pudo mover');
      avisa('Movida al '+d.fecha+'.');
    }
    else if(que==='reembolso'){
      var m=await cpPide('¿Por qué se devuelve? Queda anotado con tu nombre.','',{si:'Registrar'});
      if(m===null) return;
      ocupa('Registrando…');
      var jr=await rpc('sinc_pide',{p_reserva:p.id,p_tipo:'reembolso',p_motivo:m||null});
      avisa(jr && jr.estado==='aprobada'
        ? 'Devolución aprobada y anotada. El dinero lo devuelve quien lo cobró.'
        : 'Anotada. Queda pendiente de que la responda el operador.');
    }
    else if(que==='cobrado'){
      if(!await cpPregunta('¿Marcar esta reserva como cobrada?',{si:'Sí, cobrada'})) return;
      ocupa('Guardando…');
      await rpc('sinc_reserva_marca',{p_reserva:p.id,p_estado:null,p_pago:'pagado',p_nota:'marcada en Salidas del día'});
      avisa('Marcada como cobrada.');
    }
    else if(que==='pickup'){
      var pk=await cpPideVarios('Dónde y a qué hora se recoge a '+(p.nombre||'esta persona'),[
        {k:'lugar',et:'Lugar',valor:p.pickup_lugar||''},
        {k:'hora', et:'Hora',tipo:'time',valor:p.pickup_hora||''}
      ],{si:'Guardar'});
      if(!pk) return;
      ocupa('Guardando…');
      await rpc('sinc_reserva_pickup',{p_reserva:p.id,p_lugar:(pk.lugar||'')+(pk.hora?' · '+pk.hora:'')});
      avisa('Recogida guardada.');
    }
    else if(que==='aprobar' || que==='rechazar'){
      if(!p.peticion_id) return;
      var nota=await cpPide(que==='aprobar'?'¿Algo que dejar dicho al aprobar?':'¿Por qué se rechaza?','',
        {si: que==='aprobar'?'Aprobar':'Rechazar'});
      if(nota===null) return;
      ocupa('Guardando…');
      var ja=await rpc('sinc_responde_peticion',{p_peticion:p.peticion_id,p_aprueba:(que==='aprobar'),p_nota:nota||null});
      if(ja && ja.ok===false) throw new Error(ja.error||'no se pudo responder');
      avisa(que==='aprobar'?'Aprobada.':'Rechazada.');
    }
    libera();
    /* Lo que se acaba de hacer tiene que verse: se recarga la salida y el
       panel se repinta con el dato nuevo, sin cerrar nada. */
    await abre(PSAL, true);
    await carga(true);
    var l=RES[PSAL]||[];
    var j2=-1; for(var i=0;i<l.length;i++) if(l[i].id===p.id) j2=i;
    if(j2>=0){ PIDX=j2; pintaPanel(); } else cierraPanel();
  }catch(e){
    libera();
    await cpAviso('No se pudo: '+((e&&e.message)||e));
  }
}

/* CADA UBICACION, SUS SALIDAS. Javi, 27-oct-2026: «quita de CDMX la salida de
   Malinche. solo centra por cada ubicacion las salidas de cada ciudad».
   La Malinche sale de Casa Pepe Puebla a las cuatro de la maniana y salia en
   la lista de CDMX, porque esta pantalla pedia el dia entero sin preguntar de
   donde era cada salida. Ahora la vista trae `ciudad_key` resuelta -la ciudad
   vivia en tres columnas distintas y escrita de dos maneras- y aqui se filtra:
   primero por lo que a cada quien le toca ver (cp-acceso, la misma cascada de
   todo el panel) y despues por la ciudad que elija de las que le quedan.
   TODO = ver las dos, para quien puede. */
var CIUDAD='';
var NOMBRE_CIUDAD={cdmx:'Ciudad de México', puebla:'Puebla', virreyes:'Virreyes'};

async function carga(callado){
  FALLO=''; if(!callado){ SAL=null; RES={}; pinta(); }
  $('letra').textContent=enLetra(DIA);
  try{
    /* v_sinc_dia y no v_sinc_salidas: la misma salida, más el recuento del
       camino de su gente. Así la lista se puede ordenar por venta sin pedir
       las reservas de todas. */
    var r=await fetch(SB+'/rest/v1/v_sinc_dia?select=*&fecha=eq.'+DIA+'&order=hora',{headers:hdr()});
    if(!r.ok) throw new Error('la base respondió '+r.status);
    SAL=await r.json();
    /* La cascada del panel. Si no hay sesion o la persona es de Direccion,
       `filtra` devuelve la lista entera: no cierra puertas, solo quita lo que
       no le toca. */
    try{
      if(window.cpAcceso) SAL=await cpAcceso.filtra(SAL,function(x){return x.ciudad_key||x.ciudad;});
    }catch(_){ /* el filtro nunca debe tumbar la pantalla */ }
    pintaCiudades();
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  pinta();
  if(ABRIR){ var id=ABRIR; ABRIR=''; setTimeout(function(){
    abre(id);
    var el=document.querySelector('.fila[data-id="'+id+'"]');
    if(el){ try{ el.scrollIntoView({behavior:'smooth',block:'center'}); }catch(_){} }
  },120); }
}

function ponDia(iso){ DIA=iso; $('fecha').value=iso; ABIERTAS={}; cierraPanel(); carga(); }

$('fecha').addEventListener('change',function(){ if(this.value) ponDia(this.value); });
$('ant').addEventListener('click',function(){ ponDia(mueveDia(DIA,-1)); });
$('sig').addEventListener('click',function(){ ponDia(mueveDia(DIA,1)); });
$('hoy').addEventListener('click',function(){ ponDia(hoyISO()); });

ses=sesionPanel();
var qs=new URLSearchParams(location.search);
/* Se puede llegar aqui desde Inicio con una salida concreta: se abre sola,
   que es lo que esperaba quien hizo clic en ella. */
var ABRIR=qs.get('abrir')||'';
ponDia(qs.get('fecha')||hoyISO());
</script>
