<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora de limpieza</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- BITÁCORA DE LIMPIEZA DE ÁREAS.
     No es una bandeja de pendientes: es el registro de cuándo se limpió cada área
     común, para poder saberlo de un vistazo. Un área sin limpiar ya no levanta una
     incidencia que aprobar -eso llenaba el buzón-, se ve aquí. Las áreas que llevan
     limpieza profunda además traen su estado (al día / por vencer / vencida).
     Javi, 3-oct. -->
<style>
:root{
  --ground:#F4F1EA; --blanco:#fff; --tinta:#2c2c2a; --gris:#5f5e5a; --tenue:#8a897f;
  --linea:rgba(0,0,0,.10); --verde:#1d9e75; --ambar:#C98A1A; --rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{max-width:1120px;margin:0 auto;padding:24px 16px 4px}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;
  letter-spacing:.02em;text-transform:uppercase}
.top .sub{color:var(--gris);font-size:13px;margin-top:5px}
.barra{max-width:1120px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--blanco);border:1px solid var(--linea);border-radius:99px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--gris);
  padding:6px 14px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--tinta);color:#fff}
.wrap{max-width:1120px;margin:0 auto;padding:16px 16px 60px}
table{width:100%;border-collapse:collapse;background:var(--blanco);border:1px solid var(--linea);
  border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
thead th{text-align:left;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue);
  font-weight:700;padding:11px 14px;border-bottom:1px solid var(--linea);background:#faf8f3}
tbody td{padding:11px 14px;border-bottom:1px solid var(--linea);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
.ar{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.01em}
.grp{color:var(--tenue);font-size:11.5px;margin-top:1px}
.cel b{font-weight:600}
.muted{color:var(--tenue)}
.pill{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.03em;border-radius:99px;
  padding:2px 9px;border:1px solid currentColor}
.ok{color:var(--verde)} .warn{color:var(--ambar)} .bad{color:var(--rojo)}
.dash{color:var(--tenue)}
.vacio{color:var(--tenue);font-size:13px;padding:30px 4px}
@media(max-width:620px){ .hide-sm{display:none} .top h1{font-size:21px} }
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Ama de llaves</div>
  <h1>Bitácora de limpieza</h1>
  <div class="sub" id="sub">Cuándo se limpió cada área común.</div>
</div>
<div class="barra">
  <div class="seg" id="segProp"></div>
  <div class="seg" id="segOrden">
    <button data-o="stale" class="on">Más atrasadas</button>
    <button data-o="nombre">Por área</button>
  </div>
</div>
<div class="wrap"><div id="tabla"><div class="vacio">Cargando…</div></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const PROPS=[['cdmx','CDMX','45e69775-d877-4507-a9e1-a45bd3400dc5'],
             ['puebla','Puebla','febfbef6-7fd1-4b45-84d9-13533e8dcb72'],
             ['virreyes','Virreyes','3e10a9ea-4913-4f7c-86ef-0c829caa851d']];
const FREC_DIAS={semanal:7,catorcenal:14,quincenal:15,mensual:30,bimestral:60,trimestral:90,cuatrimestral:120,semestral:180,anual:365};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hoy=()=>{const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));return d;};
function dias(a,b){ if(!a||!b) return null; return Math.round((b-a)/86400000); }
function fFecha(s){ if(!s) return null; const p=String(s).slice(0,10).split('-'); return (+p[2])+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][(+p[1])-1]; }
function haceTxt(d){ if(d==null) return '<span class="dash">sin registro</span>'; if(d<=0) return 'hoy'; if(d===1) return 'ayer'; return 'hace '+d+' días'; }

let PROP='cdmx', ORDEN='stale';
(function initProp(){ const q=new URLSearchParams(location.search).get('prop'); if(q&&PROPS.some(p=>p[0]===q))PROP=q; })();

function pintaSeg(){
  $('#segProp').innerHTML=PROPS.map(p=>'<button data-p="'+p[0]+'"'+(p[0]===PROP?' class="on"':'')+'>'+p[1]+'</button>').join('');
  $('#segProp').querySelectorAll('button').forEach(b=>b.onclick=()=>{PROP=b.dataset.p;pintaSeg();cargar();});
  $('#segOrden').querySelectorAll('button').forEach(b=>b.onclick=()=>{ORDEN=b.dataset.o;$('#segOrden').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();});
}

let AREAS=[], ULT={};
async function cargar(){
  $('#tabla').innerHTML='<div class="vacio">Cargando…</div>';
  const pid=(PROPS.find(p=>p[0]===PROP)||[])[2];
  const {data:ar}=await sb.from('hk_areas')
    .select('id,codigo,nombre,grupo,piso,orden,prof_frecuencia,prof_ultima,prof_programada')
    .eq('property_id',pid).eq('activo',true).eq('tipo','zona_comun').order('orden');
  AREAS=ar||[];
  // Última limpieza de cada área: los últimos 70 días del registro, nos quedamos con la más reciente.
  const desde=new Date(hoy()); desde.setDate(desde.getDate()-70);
  const {data:lim}=await sb.from('hk_v_limpiezas')
    .select('area_id,fecha,terminado_at,colaborador,estatus_area')
    .eq('property_id',pid).gte('fecha',desde.toISOString().slice(0,10)).order('fecha',{ascending:false});
  ULT={};
  (lim||[]).forEach(r=>{ if(!ULT[r.area_id]) ULT[r.area_id]=r; });
  render();
}

function estadoProfunda(a){
  if(!a.prof_frecuencia) return null;
  const h=hoy();
  let prox=a.prof_programada?new Date(a.prof_programada+'T00:00:00'):null;
  if(!prox && a.prof_ultima && FREC_DIAS[a.prof_frecuencia]){
    prox=new Date(a.prof_ultima+'T00:00:00'); prox.setDate(prox.getDate()+FREC_DIAS[a.prof_frecuencia]);
  }
  const d = prox? dias(h,prox) : null; // días hasta la próxima (negativo = vencida)
  let cls='ok', txt='al día';
  if(d==null){ cls='warn'; txt='sin programar'; }
  else if(d<0){ cls='bad'; txt='vencida hace '+(-d)+' d'; }
  else if(d<=3){ cls='warn'; txt='en '+d+' d'; }
  return {cls,txt,frecuencia:a.prof_frecuencia,ultima:a.prof_ultima,proxima:prox?prox.toISOString().slice(0,10):null};
}

function render(){
  if(!AREAS.length){ $('#tabla').innerHTML='<div class="vacio">No hay áreas comunes registradas en esta propiedad.</div>'; return; }
  const h=hoy();
  const filas=AREAS.map(a=>{
    const u=ULT[a.id]||null;
    const dUlt = u? dias(new Date((u.fecha)+'T00:00:00'),h) : null;
    const prof=estadoProfunda(a);
    return {a,u,dUlt,prof};
  });
  filas.sort((x,y)=>{
    if(ORDEN==='nombre') return (x.a.orden||99)-(y.a.orden||99);
    const dx=(x.dUlt==null?99999:x.dUlt), dy=(y.dUlt==null?99999:y.dUlt);
    return dy-dx;
  });
  const conProf=filas.filter(f=>f.prof).length;
  const sinHoy=filas.filter(f=>f.dUlt==null || f.dUlt>7).length;
  $('#sub').innerHTML=filas.length+' áreas · '+conProf+' con limpieza profunda · '
    +(sinHoy?('<b>'+sinHoy+'</b> sin limpiar en 7+ días'):'todas limpiadas esta semana ✓');
  const rows=filas.map(f=>{
    const u=f.u;
    const ultCel = u
      ? '<b>'+fFecha(u.fecha)+'</b> · '+haceTxt(f.dUlt)+(u.colaborador?'<div class="grp">'+esc(u.colaborador)+'</div>':'')
      : '<span class="dash">sin registro (70 días)</span>';
    const p=f.prof;
    const profCel = p
      ? '<span class="pill '+p.cls+'">'+esc(p.txt)+'</span>'
        +'<div class="grp">'+esc(p.frecuencia)+(p.ultima?(' · última '+fFecha(p.ultima)):'')+'</div>'
      : '<span class="dash">—</span>';
    return '<tr>'
      +'<td><div class="ar">'+esc(a_nombre(f.a))+'</div>'+(f.a.grupo?'<div class="grp">'+esc(f.a.grupo)+'</div>':'')+'</td>'
      +'<td class="cel">'+ultCel+'</td>'
      +'<td class="cel hide-sm">'+profCel+'</td>'
      +'</tr>';
  }).join('');
  $('#tabla').innerHTML='<table><thead><tr>'
    +'<th>Área</th><th>Última limpieza</th><th class="hide-sm">Limpieza profunda</th>'
    +'</tr></thead><tbody>'+rows+'</tbody></table>';
}
function a_nombre(a){ return (a.codigo && a.nombre && a.codigo!==a.nombre) ? a.nombre : (a.nombre||a.codigo||'—'); }

pintaSeg();
sb.auth.getSession().then(({data})=>{ if(!data||!data.session){ $('#tabla').innerHTML='<div class="vacio">Abre esta pantalla desde el panel (necesita tu sesión).</div>'; return; } cargar(); });
</script>
</body></html>
