<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pepepesos · Casa Pepe</title>
<style>
  :root{--bg:#f6f1e7;--card:#fff;--bd:#e3dbcb;--txt:#2b2318;--muted:#8b7f6f;--gold:#C9A227;--green:#137A56;--red:#b03434}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px}
  .wrap{max-width:620px;margin:0 auto;padding:16px 14px 40px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
  h1{font-size:20px;margin:0 0 2px}
  h2{font-size:15px;margin:0 0 10px;font-weight:800}
  .sub{color:var(--muted);font-size:13px;line-height:1.5}
  .saldo{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px}
  .saldo small{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:0}
  .fila{display:flex;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
  .fila:first-of-type{border-top:0}
  .fila .t{flex:1;min-width:0}
  .nm{font-weight:700}
  .mu{color:var(--muted);font-size:12.5px;line-height:1.45}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:#fff;padding:9px 14px;font-weight:700;color:var(--txt)}
  button.p{background:var(--gold);border-color:var(--gold);color:#16130f}
  button:disabled{opacity:.5;cursor:default}
  .pill{display:inline-block;font-size:11.5px;font-weight:800;border-radius:20px;padding:2px 9px;border:1px solid}
  .pend{color:#8a6d1f;border-color:#e4cf8d;background:#fdf6e3}
  .ok{color:var(--green);border-color:#a8d9c5;background:#eaf7f1}
  .no{color:var(--red);border-color:#e8bcbc;background:#fbeeee}
  .neg{color:var(--red)} .pos{color:var(--green)}
  .err{background:#fbeeee;border:1px solid #e8bcbc;color:#7e2323;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;white-space:pre-wrap}
  .barra{height:8px;border-radius:5px;background:#eee5d4;overflow:hidden;margin-top:7px}
  .barra i{display:block;height:100%;background:var(--gold)}
  textarea{width:100%;font:inherit;border:1px solid var(--bd);border-radius:10px;padding:9px;resize:vertical;min-height:60px}
</style>
</head><body>
<div class="wrap" id="app"><div class="card"><div class="sub">Cargando…</div></div></div>

<script>
const SBU='https://rehophywchakfapivsbh.supabase.co';
const SBK='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
let LANG='es';
try{ const u=new URLSearchParams(location.search).get('lang'); const g=localStorage.getItem('pq_lang');
  LANG=(u==='es'||u==='en')?u:((g==='es'||g==='en')?g:'es'); }catch(e){}
const T={
  titulo:['Pepepesos','Pepepesos'],
  vale:['1 pepepeso = 1 peso','1 pepepeso = 1 peso'],
  disponible:['disponibles','available'],
  apartado:['apartado en solicitudes','held in requests'],
  cambia:['Cambia tus puntos','Turn points into pepepesos'],
  reglaPts:['Cada 10,000 puntos de PepeQuiz valen 100 pepepesos.','Every 10,000 PepeQuiz points are worth 100 pepepesos.'],
  tienes:['Tienes','You have'],
  puntos:['puntos sin cambiar','points not yet exchanged'],
  faltan:['Te faltan {n} puntos para el siguiente cambio.','You need {n} more points for the next exchange.'],
  cambiar:['Cambiar {n} puntos por {p} pepepesos','Exchange {n} points for {p} pepepesos'],
  enque:['En qué los puedes gastar','What you can spend them on'],
  pedir:['Pedir','Request'],
  cotiza:['A cotizar','To be quoted'],
  cuesta:['Cuesta','Costs'],
  misSol:['Mis solicitudes','My requests'],
  sinSol:['Todavía no has pedido nada.','You have not requested anything yet.'],
  movs:['Movimientos','Movements'],
  sinMov:['Aún no tienes movimientos. Juega PepeQuiz y cambia tus puntos.','No movements yet. Play PepeQuiz and exchange your points.'],
  premio:['El premio de esta semana','This week’s prize'],
  misPremios:['Premios que has ganado','Prizes you have won'],
  nota:['Cuéntanos qué necesitas (fechas, para quién…)','Tell us what you need (dates, who for…)'],
  enviar:['Enviar solicitud','Send request'],
  cancelar:['Cancelar','Cancel'],
  sinSesion:['Inicia sesión en SoyPepe para ver tus pepepesos.','Sign in to SoyPepe to see your pepepesos.'],
  pendiente:['Pendiente','Pending'], aprobada:['Aprobada','Approved'], rechazada:['Rechazada','Rejected'],
  gracias:['Listo. Queda pendiente de aprobación.','Done. Waiting for approval.'],
};
const L=(k,r)=>{ let s=T[k]?T[k][LANG==='en'?1:0]:k; if(r) for(const a in r) s=s.replace('{'+a+'}', r[a]); return s; };
const num=n=>Number(n||0).toLocaleString('es-MX');

function tok(){ try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
  if(k&&/auth-token/.test(k)){ const v=JSON.parse(localStorage.getItem(k)||'null'); const s=v&&(v.currentSession||v);
    if(s&&s.access_token) return s.access_token; } } }catch(e){} return ''; }
const H=()=>({'Content-Type':'application/json','apikey':SBK,'Authorization':'Bearer '+(tok()||SBK)});
const api=(p,o)=>fetch(SBU+'/rest/v1/'+p,Object.assign({headers:H()},o||{})).then(async r=>{
  const t=await r.text(); let j=null; try{ j=t?JSON.parse(t):null; }catch(e){ j={raw:t}; }
  if(!r.ok) throw new Error((j&&(j.message||j.error))||('HTTP '+r.status)); return j; });
const rpc=(f,b)=>api('rpc/'+f,{method:'POST',body:JSON.stringify(b||{})});

let S={saldo:null,cat:[],sol:[],mov:[],premio:[],ganados:[],err:''};

async function cargar(){
  S.err='';
  if(!tok()){ S.err=L('sinSesion'); return pintar(); }
  try{
    const s=await rpc('pp_saldo',{});
    if(s&&s.error){ S.err=s.error; return pintar(); }
    S.saldo=s;
    const [cat,sol,mov,pre,gan]=await Promise.all([
      api('pp_catalogo?select=id,nombre,tipo,plaza,costo,nota&activo=is.true&order=orden.asc').catch(()=>[]),
      api('pp_solicitud?select=id,concepto,monto,estado,nota,nota_resol,creado&employee_id=eq.'+s.employee_id+'&order=creado.desc&limit=20').catch(()=>[]),
      api('pp_movimiento?select=delta,tipo,concepto,creado&employee_id=eq.'+s.employee_id+'&order=creado.desc&limit=30').catch(()=>[]),
      rpc('pq_premio_de_semana',{}).catch(()=>[]),
      api('pq_premio_ganado?select=semana_inicio,estado,premio_id&employee_id=eq.'+s.employee_id+'&order=semana_inicio.desc&limit=10').catch(()=>[]),
    ]);
    S.cat=cat||[]; S.sol=sol||[]; S.mov=mov||[]; S.premio=Array.isArray(pre)?pre:[]; S.ganados=gan||[];
    if(S.ganados.length){
      const ids=S.ganados.map(g=>g.premio_id).join(',');
      const ps=await api('pq_premio?select=id,titulo&id=in.('+ids+')').catch(()=>[]);
      const m={}; (ps||[]).forEach(p=>{m[p.id]=p.titulo;});
      S.ganados.forEach(g=>{ g.titulo=m[g.premio_id]||'Premio'; });
    }
  }catch(e){ S.err=e.message; }
  pintar();
}

async function cambiar(){
  const r=await rpc('pp_canjear_puntos',{p_bloques:1}).catch(e=>({error:e.message}));
  if(r&&r.error){ alert(r.error); return; }
  cargar();
}

function pedir(c){
  const box=document.getElementById('ped-'+c.id);
  box.innerHTML='<textarea id="nota-'+c.id+'" placeholder="'+L('nota')+'"></textarea>'
    +'<div style="display:flex;gap:8px;margin-top:8px"><button class="p" id="go-'+c.id+'">'+L('enviar')+'</button>'
    +'<button id="ca-'+c.id+'">'+L('cancelar')+'</button></div>';
  document.getElementById('ca-'+c.id).onclick=()=>{ box.innerHTML=''; };
  document.getElementById('go-'+c.id).onclick=async()=>{
    const nota=document.getElementById('nota-'+c.id).value.trim();
    const r=await rpc('pp_pedir',{p_catalogo:c.id,p_nota:nota||null}).catch(e=>({error:e.message}));
    if(r&&r.error){ alert(r.error); return; }
    alert(L('gracias')); cargar();
  };
}

function pintar(){
  const s=S.saldo, el=document.getElementById('app'); let h='';
  if(S.err) h+='<div class="err">'+S.err+'</div>';
  if(!s){ el.innerHTML=h||'<div class="card"><div class="sub">…</div></div>'; return; }

  h+='<div class="card">'
   + '<h1>'+L('titulo')+'</h1><div class="sub">'+L('vale')+'</div>'
   + '<div class="saldo" style="margin-top:12px">'+num(s.disponible)+' <small>'+L('disponible')+'</small></div>'
   + (s.apartado>0?'<div class="mu" style="margin-top:5px">'+num(s.apartado)+' '+L('apartado')+'</div>':'')
   + '</div>';

  const falta=10000-(s.puntos_disponibles%10000||0);
  h+='<div class="card"><h2>'+L('cambia')+'</h2><div class="sub">'+L('reglaPts')+'</div>'
   + '<div style="margin-top:10px;font-weight:800">'+L('tienes')+' '+num(s.puntos_disponibles)+' '+L('puntos')+'</div>'
   + '<div class="barra"><i style="width:'+Math.min(100,Math.round(((s.puntos_disponibles%10000)/10000)*100))+'%"></i></div>'
   + (s.bloques>0
      ? '<button class="p" style="margin-top:12px;width:100%" id="btnCambiar">'+L('cambiar',{n:num(10000),p:100})+'</button>'
      : '<div class="mu" style="margin-top:8px">'+L('faltan',{n:num(falta)})+'</div>')
   + '</div>';

  if(S.premio.length){
    h+='<div class="card"><h2>🏆 '+L('premio')+'</h2>';
    S.premio.forEach(p=>{ h+='<div class="fila"><div class="t"><div class="nm">'+esc(p.titulo)+'</div>'
      +(p.descripcion?'<div class="mu">'+esc(p.descripcion)+'</div>':'')+'</div></div>'; });
    h+='</div>';
  }

  if(S.ganados.length){
    h+='<div class="card"><h2>'+L('misPremios')+'</h2>';
    S.ganados.forEach(g=>{ h+='<div class="fila"><div class="t"><div class="nm">'+esc(g.titulo)+'</div>'
      +'<div class="mu">'+g.semana_inicio+'</div></div><span class="pill '+(g.estado==='entregado'?'ok':'pend')+'">'+esc(g.estado)+'</span></div>'; });
    h+='</div>';
  }

  h+='<div class="card"><h2>'+L('enque')+'</h2>';
  S.cat.forEach(c=>{
    h+='<div class="fila"><div class="t"><div class="nm">'+esc(c.nombre)+'</div>'
      +(c.nota?'<div class="mu">'+esc(c.nota)+'</div>':'')
      +'<div class="mu">'+(c.costo>0?(L('cuesta')+' '+num(c.costo)+' pepepesos'):L('cotiza'))+'</div>'
      +'<div id="ped-'+c.id+'"></div></div>'
      +'<button data-ped="'+c.id+'">'+L('pedir')+'</button></div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>'+L('misSol')+'</h2>';
  if(!S.sol.length) h+='<div class="sub">'+L('sinSol')+'</div>';
  S.sol.forEach(x=>{
    const cls=x.estado==='aprobada'?'ok':(x.estado==='rechazada'?'no':'pend');
    h+='<div class="fila"><div class="t"><div class="nm">'+esc(x.concepto)+'</div>'
      +'<div class="mu">'+x.creado.slice(0,10)+(x.monto>0?' · '+num(x.monto)+' pepepesos':'')
      +(x.nota_resol?' · '+esc(x.nota_resol):'')+'</div></div>'
      +'<span class="pill '+cls+'">'+L(x.estado)+'</span></div>';
  });
  h+='</div>';

  h+='<div class="card"><h2>'+L('movs')+'</h2>';
  if(!S.mov.length) h+='<div class="sub">'+L('sinMov')+'</div>';
  S.mov.forEach(m=>{
    h+='<div class="fila"><div class="t"><div class="nm">'+esc(m.concepto)+'</div>'
      +'<div class="mu">'+m.creado.slice(0,10)+'</div></div>'
      +'<div class="nm '+(m.delta<0?'neg':'pos')+'">'+(m.delta>0?'+':'')+num(m.delta)+'</div></div>';
  });
  h+='</div>';

  el.innerHTML=h;
  const b=document.getElementById('btnCambiar'); if(b) b.onclick=cambiar;
  el.querySelectorAll('[data-ped]').forEach(btn=>{
    btn.onclick=()=>{ const c=S.cat.find(x=>x.id===btn.getAttribute('data-ped')); if(c) pedir(c); };
  });
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
cargar();
</script>
</body></html>
