<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de mando · Casa Pepe</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- EL TABLERO DE CUADRITOS.
     Cuando una subcategoría tiene cosas dentro no abre una pantalla: abre esto,
     que es su índice en cuadros -como el centro de mando de Sincrético, que es
     el que le gusta a Javi-. Es uno solo para todas: se le pasa el código del
     nodo (?nodo=MENU2-OPE-HOT) y él pregunta a la base qué cuelga de ahí y qué
     puede ver quien está mirando. Al tocar un cuadro se lo dice al panel, para
     que el menú de la izquierda se mueva con él en vez de quedarse marcando
     otra cosa. Javi, 30-sep. -->
<style>
:root{
  --ground:#F4F1EA; --blanco:#fff; --tinta:#2c2c2a; --gris:#5f5e5a; --tenue:#888780;
  --linea:rgba(0,0,0,.10);
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{max-width:1120px;margin:0 auto;padding:26px 16px 4px}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:26px;
  letter-spacing:.02em;text-transform:uppercase}
.top .sub{color:var(--gris);font-size:13px;margin-top:5px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 60px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.cuadro{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:18px 16px;
  text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:7px;min-height:118px;
  box-shadow:var(--sombra);cursor:pointer;transition:transform .12s ease,border-color .12s ease}
.cuadro:hover{transform:translateY(-2px);border-color:var(--col)}
.cuadro .ic{font-size:26px;line-height:1}
.cuadro .nm{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:15px;letter-spacing:.01em;
  text-transform:uppercase;line-height:1.15}
.cuadro .de{color:var(--gris);font-size:12px;line-height:1.35;margin-top:auto}
.cuadro.pend{opacity:.62;cursor:default}
.cuadro.pend:hover{transform:none;border-color:var(--linea)}
.cuadro .et{align-self:flex-start;font-size:9.5px;letter-spacing:.07em;text-transform:uppercase;
  border:1px solid currentColor;border-radius:99px;padding:1px 6px;color:var(--tenue)}
.vacio{color:var(--tenue);font-size:13px;padding:30px 4px}
</style>
</head>
<body>
<div class="top">
  <div class="migaja" id="migaja"></div>
  <h1 id="titulo">…</h1>
  <div class="sub" id="sub">Toca un cuadro para entrar.</div>
</div>
<div class="wrap"><div class="rejilla" id="rejilla"></div></div>

<script>
(function(){
  'use strict';
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var COL={socios:'#C9A227',operacion:'#1d9e75',experiencias:'#F2682A',ateneo:'#7A4FBF',
           revenue:'#1F6FB2',espiritu:'#E2188E',rh:'#8C6212',briefing:'#3C3630'};

  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function sesion(){
    try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
      if(k&&/sb-.*-auth-token/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null');
        var s=v&&(v.currentSession||v); if(s&&s.access_token) return s; } } }catch(_){}
    return null;
  }
  var SES=sesion();
  function hdr(extra){ return Object.assign({apikey:KEY,
    Authorization:'Bearer '+((SES&&SES.access_token)||KEY)}, extra||{}); }

  var NODO=(new URLSearchParams(location.search).get('nodo')||'').trim();

  /* Parte el emoji del nombre: el icono va en su sitio y el texto limpio. */
  function parte(n){
    var m=String(n.nombre||'').match(/^\s*([‼-㊙\uD83C-􏰀-\uDFFF←-⇿☀-➿][️‍\uD83C-􏰀-\uDFFF]*)\s*(.*)$/);
    return { ic:(n.icono||(m?m[1]:'•')), tx:(m?m[2]:String(n.nombre||'')) };
  }

  async function traer(){
    var todas=[], permisos={};
    try{
      var r=await fetch(SB+'/rest/v1/paginas?select=codigo,nombre,ruta,icono,color,parent_codigo,orden,tipo,activo'
        +'&app=eq.dashboard&activo=is.true&order=orden', {headers:hdr()});
      todas = r.ok ? (await r.json()||[]) : [];
    }catch(_){}
    try{
      var p=await fetch(SB+'/rest/v1/rpc/mis_paginas',{method:'POST',
        headers:hdr({'Content-Type':'application/json'}),body:'{}'});
      if(p.ok) (await p.json()||[]).forEach(function(x){ permisos[x.codigo]=x.nivel; });
    }catch(_){}
    return {todas:todas, permisos:permisos};
  }

  function pinta(d){
    var porCod={}, hijos={};
    d.todas.forEach(function(n){ porCod[n.codigo]=n; });
    d.todas.forEach(function(n){ (hijos[n.parent_codigo]=hijos[n.parent_codigo]||[]).push(n); });

    /* Sin permisos declarados (gerencia, o la RPC no contestó) se enseña todo:
       más vale un índice de más que un panel vacío al que no sabes por qué no
       entras. Quien no tenga permiso topará con la pantalla, no con el índice. */
    var abierto = Object.keys(d.permisos).length===0;
    function puede(n){
      if(n.tipo==='contenedor') return (hijos[n.codigo]||[]).some(puede);
      if(abierto) return true;
      var v=d.permisos[n.codigo]; return !!(v && v!=='none');
    }

    var nodo=porCod[NODO];
    if(!nodo){ document.getElementById('titulo').textContent='No encuentro esa sección';
      document.getElementById('rejilla').innerHTML='<div class="vacio">El menú cambió de sitio. Vuelve a elegir en la izquierda.</div>'; return; }

    var p=parte(nodo);
    document.title = p.tx+' · Casa Pepe';
    document.getElementById('titulo').textContent = p.tx;
    var mig=[], c=porCod[nodo.parent_codigo], v=0;
    while(c && v++<6){ mig.unshift(parte(c).tx); c=porCod[c.parent_codigo]; }
    document.getElementById('migaja').textContent = mig.join(' · ');

    var col = COL[nodo.color] || COL.operacion;
    var lista=(hijos[NODO]||[]).filter(puede).sort(function(a,b){return (a.orden||99)-(b.orden||99);});
    if(!lista.length){
      document.getElementById('rejilla').innerHTML='<div class="vacio">Aquí todavía no hay nada, o no tienes acceso a lo que hay.</div>';
      return;
    }
    document.getElementById('sub').textContent = lista.length===1
      ? 'Una pantalla dentro.' : ('Toca un cuadro para entrar · '+lista.length+' dentro.');

    document.getElementById('rejilla').innerHTML = lista.map(function(n){
      var q=parte(n), nietos=(hijos[n.codigo]||[]).filter(puede).length;
      var pend = (n.tipo==='pendiente') || (!n.ruta && !nietos);
      return '<a class="cuadro'+(pend?' pend':'')+'" data-cod="'+esc(n.codigo)+'"'
        +' style="--col:'+col+'"'+(pend?'':' href="#"')+'>'
        +'<span class="ic">'+esc(q.ic)+'</span>'
        +'<span class="nm">'+esc(q.tx)+'</span>'
        +(pend?'<span class="et">pendiente</span>'
              :'<span class="de">'+(nietos? (nietos+' pantallas dentro') : 'Abrir')+'</span>')
        +'</a>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.cuadro[data-cod]'), function(a){
      if(a.classList.contains('pend')) return;
      a.onclick=function(ev){
        ev.preventDefault();
        var cod=a.getAttribute('data-cod');
        /* Se lo decimos al panel para que el menú se mueva con nosotros. Si
           estamos sueltos -sin panel- abrimos a pelo, que es mejor que nada. */
        try{ if(window.parent && window.parent!==window){
          window.parent.postMessage({tipo:'cp-menu2-abre', codigo:cod},'*'); return; } }catch(_){}
        var n=porCod[cod];
        if(n && n.ruta) location.href=n.ruta;
        else location.href='/m/hub.html?nodo='+encodeURIComponent(cod);
      };
    });
  }

  traer().then(pinta).catch(function(){
    document.getElementById('rejilla').innerHTML='<div class="vacio">No pudimos cargar esta sección.</div>';
  });
})();
</script>
</body></html>
