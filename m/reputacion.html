<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reputación · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;--accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#fff;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:920px;margin:0 auto;padding:16px 16px 60px}
.top{position:sticky;top:0;background:var(--ground);z-index:9;padding:8px 0 12px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:13px;margin:2px 0 0}
select,button{font:inherit}
select{padding:8px 12px;border:1px solid var(--rule-2);border-radius:9px;background:#fff;color:inherit}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.grid{display:grid;gap:14px;margin-top:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:14px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:800;line-height:1}
.kpi .l{font-size:12px;color:var(--muted);margin-top:6px}
.delta{font-size:13px;font-weight:700}
.up{color:var(--ok)}.down{color:var(--bad)}.flat{color:var(--muted)}
.obj{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule)}
.obj:first-of-type{border-top:0}
.obj .nm{flex:1;font-weight:600;text-transform:capitalize}
.bar{flex:2;height:8px;background:var(--surface-2);border-radius:5px;overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;border-radius:5px}
.pill{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.no{background:var(--bad-bg);color:var(--bad)}
.tema{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:14px}
.tema:first-of-type{border-top:0}
.tema .t{flex:1;text-transform:capitalize}
.tema .s{font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px}
.tema .s.pos{background:var(--ok-bg);color:var(--ok)}.tema .s.neg{background:var(--bad-bg);color:var(--bad)}.tema .s.neu{background:var(--surface-2);color:var(--muted)}
.tema .n{color:var(--muted);font-size:12px;min-width:88px;text-align:right}
.rank{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--rule)}
.rank:first-of-type{border-top:0}
.rank .pos{width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center}
.rank .nm{flex:1;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--rule)}
th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.muted{color:var(--muted)}.mini{font-size:12px;color:var(--faint)}
.two{grid-template-columns:1fr 1fr}
@media(max-width:640px){.two{grid-template-columns:1fr}}
@media print{.top{position:static}.btn{display:none}body{background:#fff}}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <div style="flex:1">
      <h1>Reputación <span id="plaza" style="color:var(--accent)"></span></h1>
      <div class="sub" id="sub">Resumen para el equipo · valoraciones y comentarios</div>
    </div>
    <select id="propSel" onchange="cargar()"></select>
    <button class="btn ghost" onclick="window.print()">🖨️ Imprimir</button>
  </div>
  <div id="cont"><div class="card" style="margin-top:14px">Cargando…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const PROPS=[{id:1,proy:'cdmx',n:'CDMX'},{id:2,proy:'puebla',n:'Puebla'}];
const TEMA_LBL={ubicacion:'Ubicación',staff_trato:'Trato del personal',staff_info:'Info del personal',limpieza_general:'Limpieza general',limpieza_banos:'Limpieza de baños',instalaciones:'Instalaciones',camas_confort:'Camas / confort',ambiente_social:'Ambiente social',actividades:'Actividades',desayuno:'Desayuno',precio_valor:'Precio / valor',precio_extras:'Extras',ruido_interno:'Ruido interno',ruido_externo:'Ruido externo',seguridad:'Seguridad',wifi:'WiFi',clima:'Clima',checkin:'Check-in',mezcla_huesped:'Perfil de huésped',reserva_ota:'Reserva OTA',descanso:'Descanso'};
function tokEmail(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v);var e=s&&s.user&&s.user.email;if(e)return String(e).toLowerCase();}}}catch(_){}return'';}
function esc(x){return String(x==null?'':x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function mesLbl(){return new Date().toLocaleDateString('es-MX',{day:'numeric',month:'long',year:'numeric'});}

async function initProps(){
  let allow=null;
  const em=tokEmail();
  if(em){ try{ const {data}=await sb.rpc('mis_ubicaciones',{p_email:em}); if(Array.isArray(data)&&data.length) allow=data; }catch(_){} }
  const vis=PROPS.filter(p=>!allow||allow.indexOf(p.proy)>=0);
  const list=vis.length?vis:PROPS;
  $('propSel').innerHTML=list.map(p=>'<option value="'+p.id+'">Casa Pepe '+p.n+'</option>').join('');
  cargar();
}

async function cargar(){
  const pid=+$('propSel').value||1;
  $('cont').innerHTML='<div class="card" style="margin-top:14px">Cargando…</div>';
  let d; try{ const r=await sb.rpc('reputacion_equipo',{p_prop:pid}); d=r.data; if(r.error) throw r.error; }catch(e){ $('cont').innerHTML='<div class="card" style="margin-top:14px;color:var(--bad)">No se pudo cargar: '+esc(e.message||e)+'</div>'; return; }
  if(!d||d.error){ $('cont').innerHTML='<div class="card" style="margin-top:14px">Sin datos para esta propiedad.</div>'; return; }
  $('plaza').textContent='· '+d.plaza;
  $('sub').textContent='Resumen para el equipo · '+mesLbl();
  render(d);
}

function render(d){
  const bk=(d.plataformas||[]).find(x=>x.plataforma==='booking')||{};
  const hw=(d.plataformas||[]).find(x=>x.plataforma==='hostelworld')||{};
  const arrow=v=>v==null?'':(v>0?'<span class="delta up">▲ +'+v+'</span>':(v<0?'<span class="delta down">▼ '+v+'</span>':'<span class="delta flat">= 0</span>'));

  // KPIs
  const nb=(d.notas&&d.notas.booking)||{}; const nh=(d.notas&&d.notas.hostelworld)||{};
  let h='<div class="grid kpis">';
  h+='<div class="card kpi"><div class="v">'+(nb.nota!=null?nb.nota:'—')+'<span style="font-size:16px;color:var(--muted)">/10</span></div><div class="l"><b>Booking · nota real</b><br><span class="mini">'+(nb.resenas||0)+' reseñas de memoria · las de 2026 promedian '+(bk.rating_2026!=null?bk.rating_2026:'—')+' '+arrow(bk.delta)+'</span></div></div>';
  h+='<div class="card kpi"><div class="v">'+(d.n_30d||0)+'</div><div class="l">comentarios en 30 días</div></div>';
  h+='<div class="card kpi"><div class="v" style="font-size:24px">'+(nh.nota!=null?(nh.nota+'/10'):'—')+'</div><div class="l"><b>Hostelworld · nota real</b><br><span class="mini">'+(nh.resenas||0)+' reseñas (cuenta las últimas ~25)</span></div></div>';
  h+='</div>';

  h+='<div class="grid two">';
  // Objetivos
  h+='<div class="card"><h3>Objetivos vs. hoy (Booking)</h3>';
  if((d.objetivos||[]).length){ d.objetivos.forEach(o=>{
    const act=o.actual, obj=Number(o.objetivo), pct=act?Math.min(100,Math.round(act/10*100)):0;
    const col=o.cumple?'var(--ok)':'var(--bad)';
    h+='<div class="obj"><span class="nm">'+esc(o.categoria)+'</span><span class="bar"><i style="width:'+pct+'%;background:'+col+'"></i></span><span style="min-width:82px;text-align:right">'+(act!=null?act:'—')+' <span class="muted">/ '+obj+'</span></span><span class="pill '+(o.cumple?'ok':'no')+'">'+(o.cumple?'✓':'−'+(act!=null?(Math.round((obj-act)*100)/100):''))+'</span></div>';
  }); } else h+='<div class="muted">Sin objetivos configurados.</div>';
  h+='<div class="mini" style="margin-top:8px">Meta = objetivo del año. Rojo = por debajo.</div></div>';

  // Personas mencionadas
  h+='<div class="card"><h3>Personas más mencionadas (6 meses)</h3>';
  if((d.menciones||[]).length){ d.menciones.forEach((m,i)=>{ h+='<div class="rank"><span class="pos">'+(i+1)+'</span><span class="nm">'+esc(m.nombre)+'</span><span class="muted">'+m.menciones+' menc.</span></div>'; }); h+='<div class="mini" style="margin-top:8px">Extraído del texto de las reseñas (nombres de la plantilla). Los huéspedes rara vez nombran al staff en Booking, así que la lista es corta.</div>'; }
  else h+='<div class="muted">Nadie mencionado por nombre en el periodo.</div>';
  h+='</div></div>';

  // Temas (cómo vamos)
  const temas=(d.temas||[]);
  const pos=temas.filter(t=>t.sentimiento==='positivo').slice(0,7);
  const neg=temas.filter(t=>t.sentimiento==='negativo').slice(0,7);
  h+='<div class="grid two">';
  h+='<div class="card"><h3>Lo que más gusta (12m · 30d)</h3>'+(pos.length?pos.map(t=>tema(t,'pos')).join(''):'<div class="muted">—</div>')+'</div>';
  h+='<div class="card"><h3>A vigilar (12m · 30d)</h3>'+(neg.length?neg.map(t=>tema(t,'neg')).join(''):'<div class="muted">Sin temas negativos relevantes.</div>')+'</div>';
  h+='</div>';

  // Vs competencia (Hostelworld, por categoría)
  const comp=(d.competencia||[]);
  if(comp.length){
    h+='<div class="card" style="margin-top:14px"><h3>Vs. competencia · Hostelworld (por categoría)</h3>';
    comp.forEach(function(c){ var win=c.gap>=0; h+='<div class="obj"><span class="nm">'+esc(c.categoria)+'</span><span class="bar"><i style="width:'+Math.min(100,Math.round((c.nosotros||0)/10*100))+'%;background:'+(win?'var(--ok)':'var(--bad)')+'"></i></span><span style="min-width:104px;text-align:right">'+c.nosotros+' <span class="muted">vs '+c.compset+'</span></span><span class="pill '+(win?'ok':'no')+'">'+(win?'▲ +'+c.gap:'▼ '+c.gap)+'</span></div>'; });
    h+='<div class="mini" style="margin-top:8px">Nuestra nota vs el promedio del compset en Hostelworld. Rojo = vamos por debajo (ahí nos ganan). Última captura disponible.</div></div>';
  }
  // Plataformas vs 2025
  h+='<div class="card" style="margin-top:14px"><h3>Booking y Hostelworld · 2026 vs 2025</h3><table><tr><th>Plataforma</th><th>2025</th><th>2026</th><th>Cambio</th><th>Reseñas 2026</th></tr>';
  (d.plataformas||[]).forEach(p=>{ h+='<tr><td style="text-transform:capitalize">'+esc(p.plataforma)+'</td><td>'+(p.rating_2025!=null?p.rating_2025:'—')+'</td><td><b>'+(p.rating_2026!=null?p.rating_2026:'—')+'</b></td><td>'+arrow(p.delta)+'</td><td>'+(p.n_2026||0)+'</td></tr>'; });
  h+='</table><div class="mini" style="margin-top:8px">Promedio de las reseñas del año (escala 0–10). Hostelworld tiene muy pocas reseñas capturadas: tómalo como referencia, no como serie.</div></div>';

  $('cont').innerHTML=h;
}
function tema(t,cls){
  const lbl=TEMA_LBL[t.tema]||t.tema.replace(/_/g,' ');
  return '<div class="tema"><span class="t">'+esc(lbl)+'</span><span class="s '+cls+'">'+(cls==='pos'?'👍':'⚠')+'</span><span class="n">'+t.n_12m+' año · '+t.n_30d+' mes</span></div>';
}
initProps();
</script>
</body></html>
