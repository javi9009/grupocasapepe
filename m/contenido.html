<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fototeca y contenido · Casa Pepe</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--ink:#1F1B16;--muted:#6B6459;--rule:#E2DCCF;
      --accent:#C9501A;--on-accent:#fff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100dvh;max-height:100dvh;overflow:hidden}
body{background:var(--ground);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;
  display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:10px;padding:7px 14px;
  border-bottom:1px solid var(--rule);background:var(--surface);flex-wrap:wrap}
.ttl{font-weight:800;font-size:15px;white-space:nowrap}
.ttl span{font-size:17px;margin-right:4px}
.tabs{display:flex;gap:6px}
.tabs button{font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;
  border:1.5px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.tabs button.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.sp{flex:1}
.bar a{color:var(--muted);text-decoration:none;font-weight:600;font-size:12px;
  padding:6px 10px;border-radius:8px;white-space:nowrap;border:1px solid transparent}
.bar a:hover{color:var(--accent);border-color:var(--rule)}
.pie{flex:none;padding:6px 14px;border-top:1px solid var(--rule);background:var(--surface);
  color:var(--muted);font-size:11.5px}
.frame{flex:1;min-height:0;border:0;width:100%;display:none;background:var(--ground)}
.frame.on{display:block}
</style>
<link rel="stylesheet" href="/cp-movil.css"><link rel="icon" type="image/png" href="/dash-192.png">
<script src="/uso.js" defer></script>
</head><body>

<!-- UNA SOLA PUERTA PARA LAS IMÁGENES DEL GRUPO. Javi, 21-nov-2026: «la
     fototeca y el centro de contenido deberían de estar unificados, ¿puedes
     hacer ese match de páginas?».
     Eran dos entradas del menú para el mismo trabajo -dónde viven las
     imágenes de la casa- y quien buscaba una foto tenía que acordarse de en
     cuál de las dos. Siguen siendo dos estanterías distintas, porque lo son:
     la FOTOTECA son fotos sueltas que se eligen desde la carta y se editan
     aquí; el BANCO DE MARCA son los logos, flyers y campañas, que viven en su
     propio sitio. Se unifica la puerta, no el contenido: meterlos en la misma
     tabla habría sido revolver un catálogo con un archivo. -->

<!-- EL TÍTULO LO PONE EL PANEL. Javi, 21-nov-2026: «configura mejor el header
     de aquí, alineado con el resto de funcionalidades de la página».
     Esta barra repetía «📸 Fototeca y contenido» justo debajo de la miga de
     pan del panel, que ya lo dice, y le ponía al lado un botón naranja grande
     para abrir en otra pestaña que ninguna otra pantalla tiene. Aquí dentro
     sólo hace falta lo que el panel no puede poner: elegir estantería. -->
<div class="bar">
  <div class="tabs">
    <button type="button" id="tFoto" class="sel">Fototeca</button>
    <button type="button" id="tBanco">Banco de marca</button>
  </div>
  <span class="sp"></span>
  <a id="fuera" href="/m/fototeca.html?suelta=1" target="_blank" rel="noopener"
     title="Abrir en una pestaña aparte">Abrir aparte ↗</a>
</div>

<iframe class="frame on" id="fFoto"  src="/m/fototeca.html" title="Fototeca"></iframe>
<iframe class="frame"    id="fBanco" title="Banco de marca"
        referrerpolicy="no-referrer-when-downgrade"></iframe>

<div class="pie" id="pie">Las fotos que cualquier casa puede poner en su carta. Se eligen desde cada platillo.</div>

<script>
(function(){
  var BANCO = 'https://contenidopepe.netlify.app';
  var tF=document.getElementById('tFoto'),  tB=document.getElementById('tBanco');
  var fF=document.getElementById('fFoto'),  fB=document.getElementById('fBanco');
  var fuera=document.getElementById('fuera'), pie=document.getElementById('pie');
  var cargadoBanco=false;

  function ve(cual){
    var foto = cual==='foto';
    tF.classList.toggle('sel', foto);  tB.classList.toggle('sel', !foto);
    fF.classList.toggle('on', foto);   fB.classList.toggle('on', !foto);
    /* El banco no se carga hasta que se pide: es un sitio entero y abrirlo
       siempre costaría la espera a quien sólo venía por una foto de café. */
    if(!foto && !cargadoBanco){ fB.src = BANCO; cargadoBanco = true; }
    fuera.href = foto ? '/m/fototeca.html?suelta=1' : BANCO;
    pie.textContent = foto
      ? 'Las fotos que cualquier casa puede poner en su carta. Se eligen desde cada platillo.'
      : 'Logos, flyers, campañas y las fotos de los hoteles y las experiencias.';
    try{ history.replaceState(null,'', location.pathname + (foto?'':'?ver=banco')); }catch(_){}
  }
  tF.onclick=function(){ ve('foto'); };
  tB.onclick=function(){ ve('banco'); };
  if(new URLSearchParams(location.search).get('ver')==='banco') ve('banco');
})();
</script>
</body></html>
