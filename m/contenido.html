<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Contenido · Casa Pepe</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--ink:#1F1B16;--muted:#6B6459;--rule:#E2DCCF;--accent:#137A56;--on-accent:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100dvh;max-height:100dvh;overflow:hidden}
body{background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;display:flex;flex-direction:column}
.bar{flex:none;display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.bar .ttl{font-weight:800;font-size:16px}
.bar .ttl span{font-size:18px;margin-right:4px}
.bar .sp{flex:1}
.bar a{background:var(--accent);color:var(--on-accent);text-decoration:none;font-weight:600;font-size:13px;padding:8px 13px;border-radius:9px;white-space:nowrap}
.bar a:hover{filter:brightness(1.08)}
.frame{flex:1;min-height:0;border:0;width:100%;display:block;background:var(--ground)}
</style><link rel="icon" type="image/png" href="/dash-192.png">
</head><body>
<div class="bar">
  <span class="ttl"><span>📸</span>Centro de Contenido</span>
  <span class="sp"></span>
  <a href="https://contenidopepe.netlify.app" target="_blank" rel="noopener">Abrir en pestaña nueva ↗</a>
</div>
<iframe class="frame" src="https://contenidopepe.netlify.app" title="Centro de Contenido Casa Pepe" referrerpolicy="no-referrer-when-downgrade"></iframe>
</body></html>
