<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Siguientes módulos</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1100px;margin:0 auto}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px}
.wrap{max-width:1100px;margin:0 auto;padding:12px 16px 90px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.bar input,.bar select{padding:8px 10px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-size:13px}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 14px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.grupo{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.it{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px;display:flex;gap:12px;align-items:flex-start}
.it.p1{border-left:3px solid var(--bad)}
.it.p2{border-left:3px solid var(--warn)}
.it.p3{border-left:3px solid var(--none)}
.it.hecho{opacity:.6}
.it .cuerpo{flex:1;min-width:0}
.it h3{margin:0 0 3px;font-size:14.5px;font-weight:700;line-height:1.3}
.it .det{color:var(--ink-2);font-size:13px;line-height:1.45;white-space:pre-wrap}
.it .pie{margin-top:7px;display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:10.5px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.mini{color:var(--muted);font-size:11.5px}
.mover{display:flex;flex-direction:column;gap:3px}
.mover button{border:1px solid var(--rule);background:var(--surface-3);color:var(--muted);border-radius:6px;width:26px;height:22px;font-size:11px;cursor:pointer;line-height:1}
.mover button:hover{color:var(--ink);border-color:var(--rule-2)}
.empty{padding:36px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--rule-2);border-radius:10px}
.ovbg{position:fixed;inset:0;background:rgba(31,27,22,.45);z-index:48;display:none}
.ovbg.on{display:block}
.ov{position:fixed;inset:auto 0 0 0;margin:0 auto;max-width:560px;background:var(--surface);border-radius:14px 14px 0 0;z-index:49;padding:16px 16px 22px;box-shadow:0 -8px 30px rgba(31,27,22,.25);max-height:92vh;overflow:auto;display:none}
.ov.on{display:block}
.ov h2{margin:0 0 12px;font-size:16px}
.campo{margin-bottom:11px}
.campo label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:4px;font-weight:700}
.campo input,.campo select,.campo textarea{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:7px;font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.campo textarea{min-height:72px;resize:vertical}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;display:none}
.toast.err{background:var(--bad)}
@media(max-width:560px){.dos{grid-template-columns:1fr}}
</style>
</head><body>

<!-- La fila de lo que viene. Javi, 13-oct-2026: «una lista de temas pendientes
     a elaborar o que tengo en fila para que no se me olvide».
     Vive en roadmap_items, no en un documento: un documento se queda viejo en
     silencio y nadie se entera. Aquí se mueve de estado y se ve cuándo se tocó. -->

<div class="top">
  <h1>🧭 Siguientes módulos</h1>
  <div class="sub" id="sub">Cargando…</div>
</div>

<div class="wrap">
  <div class="bar">
    <button class="btn" id="btnNuevo">+ Añadir</button>
    <select id="fArea"><option value="">Todas las áreas</option></select>
    <select id="fEstado">
      <option value="vivos">Lo que queda</option>
      <option value="">Todo</option>
      <option value="en_fila">En fila</option>
      <option value="en_curso">En curso</option>
      <option value="pausado">Pausado</option>
      <option value="hecho">Hecho</option>
    </select>
    <input id="fQ" placeholder="Buscar…" style="min-width:180px">
    <button class="btn ghost sm" id="btnCsv">Bajar en CSV</button>
    <button class="btn ghost sm" id="btnRecarga">Actualizar</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="lista"></div>
</div>

<div class="ovbg" id="ovbg"></div>
<div class="ov" id="ov">
  <h2 id="ovTit">Nuevo</h2>
  <div class="campo"><label for="cTit">Qué hay que hacer</label>
    <input id="cTit" maxlength="200" placeholder="Integrar la venta de tours a la venta diaria"></div>
  <div class="campo"><label for="cDet">En una o dos líneas, qué significa</label>
    <textarea id="cDet" maxlength="1000" placeholder="Para que dentro de tres meses se entienda sin preguntarte."></textarea></div>
  <div class="dos">
    <div class="campo"><label for="cArea">Área</label><input id="cArea" list="areas" maxlength="60" placeholder="Sincrético"><datalist id="areas"></datalist></div>
    <div class="campo"><label for="cEstado">Estado</label><select id="cEstado">
      <option value="en_fila">En fila</option><option value="en_curso">En curso</option>
      <option value="pausado">Pausado</option><option value="hecho">Hecho</option></select></div>
  </div>
  <div class="dos">
    <div class="campo"><label for="cPri">Prioridad</label><select id="cPri">
      <option value="1">Alta</option><option value="2" selected>Media</option><option value="3">Baja</option></select></div>
    <div class="campo"><label for="cNotas">Notas</label><input id="cNotas" maxlength="300" placeholder="opcional"></div>
  </div>
  <div style="display:flex;gap:8px;margin-top:6px">
    <button class="btn" id="cGuardar" style="flex:1">Guardar</button>
    <button class="btn ghost" id="cCerrar">Cerrar</button>
    <button class="btn ghost sm" id="cBorrar" style="color:var(--bad);border-color:var(--bad);display:none">Borrar</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/cp-acceso.js"></script>
<script>/* Sin sesión no hay datos: se avisa y se vuelve al panel. */
if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var R=[], EDITA=null;

  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(extra){var h={'apikey':KEY,'Authorization':'Bearer '+tok(),'Content-Type':'application/json'};for(var k in (extra||{}))h[k]=extra[k];return h;}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2800);}
  function fdt(s){ if(!s) return '—'; try{ return new Date(s).toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }catch(e){ return s; } }

  var EST={en_fila:'En fila',en_curso:'En curso',pausado:'Pausado',hecho:'Hecho'};
  var TONO={en_curso:'warn',hecho:'ok',pausado:'',en_fila:''};
  var PRI={1:'Alta',2:'Media',3:'Baja'};

  async function load(){
    var r=await fetch(SB+'/rest/v1/roadmap_items?select=*&order=prioridad,orden,created_at',{headers:hdr()});
    if(!r.ok){ $('sub').textContent='No se pudo cargar (revisa tu sesión en el panel).';
      $('lista').innerHTML='<div class="empty">La consulta no devolvió permiso. No quiere decir que la lista esté vacía.</div>'; return; }
    R=await r.json();
    var areas=[]; R.forEach(function(x){ if(x.area && areas.indexOf(x.area)<0) areas.push(x.area); });
    areas.sort();
    var sel=$('fArea'), antes=sel.value;
    sel.innerHTML='<option value="">Todas las áreas</option>'+areas.map(function(a){return '<option value="'+esc(a)+'">'+esc(a)+'</option>';}).join('');
    if(antes) sel.value=antes;
    $('areas').innerHTML=areas.map(function(a){return '<option value="'+esc(a)+'">';}).join('');
    pinta();
  }

  function visibles(){
    var q=($('fQ').value||'').trim().toLowerCase(), e=$('fEstado').value, a=$('fArea').value;
    return R.filter(function(x){
      if(e==='vivos'){ if(x.estado==='hecho') return false; } else if(e && x.estado!==e) return false;
      if(a && x.area!==a) return false;
      if(q && [x.titulo,x.detalle,x.area,x.notas].join(' ').toLowerCase().indexOf(q)<0) return false;
      return true;
    });
  }

  function pinta(){
    var l=visibles();
    var n=function(e){ return R.filter(function(x){return x.estado===e;}).length; };
    $('kpis').innerHTML=[
      [n('en_fila'),'En fila',''],[n('en_curso'),'En curso','warn'],
      [n('pausado'),'Pausado',''],[n('hecho'),'Hecho','']
    ].map(function(k){return '<div class="kpi'+(k[2]?' '+k[2]:'')+'"><b>'+k[0]+'</b><span>'+k[1]+'</span></div>';}).join('');
    $('sub').textContent=R.length+' temas · '+(R.length-n('hecho'))+' por delante';

    if(!l.length){ $('lista').innerHTML='<div class="empty">Nada con esos filtros. Añade el primero con «+ Añadir».</div>'; return; }

    /* Se agrupa por estado y dentro por prioridad: lo que está en curso manda,
       y lo hecho baja al final para que no estorbe pero tampoco se borre. */
    var orden=['en_curso','en_fila','pausado','hecho'], html='';
    orden.forEach(function(e){
      var g=l.filter(function(x){return x.estado===e;});
      if(!g.length) return;
      html+='<div class="grupo">'+EST[e]+' · '+g.length+'</div>';
      g.forEach(function(x,i){
        html+='<div class="it p'+x.prioridad+(x.estado==='hecho'?' hecho':'')+'">'+
          '<div class="mover"><button data-sube="'+x.id+'"'+(i===0?' disabled':'')+' aria-label="Subir">▲</button>'+
          '<button data-baja="'+x.id+'"'+(i===g.length-1?' disabled':'')+' aria-label="Bajar">▼</button></div>'+
          '<div class="cuerpo">'+
            '<h3>'+esc(x.titulo)+'</h3>'+
            (x.detalle?'<div class="det">'+esc(x.detalle)+'</div>':'')+
            '<div class="pie">'+
              (x.area?'<span class="tag">'+esc(x.area)+'</span>':'')+
              '<span class="tag'+(x.prioridad===1?' bad':(x.prioridad===2?' warn':''))+'">'+PRI[x.prioridad]+'</span>'+
              '<span class="tag'+(TONO[x.estado]?' '+TONO[x.estado]:'')+'">'+EST[x.estado]+'</span>'+
              (x.notas?'<span class="mini">'+esc(x.notas)+'</span>':'')+
              '<span class="mini">· tocado el '+fdt(x.updated_at)+'</span>'+
            '</div></div>'+
          '<button class="btn ghost sm" data-edita="'+x.id+'">Abrir</button></div>';
      });
    });
    $('lista').innerHTML=html;
    Array.prototype.forEach.call($('lista').querySelectorAll('[data-edita]'),function(b){ b.onclick=function(){ abre(b.getAttribute('data-edita')); }; });
    Array.prototype.forEach.call($('lista').querySelectorAll('[data-sube]'),function(b){ b.onclick=function(){ mueve(b.getAttribute('data-sube'),-1); }; });
    Array.prototype.forEach.call($('lista').querySelectorAll('[data-baja]'),function(b){ b.onclick=function(){ mueve(b.getAttribute('data-baja'),1); }; });
  }

  /* Subir y bajar intercambia el orden con el vecino del mismo estado y la
     misma prioridad. Más simple que arrastrar y funciona igual en el teléfono. */
  async function mueve(id,dir){
    var x=R.filter(function(r){return r.id===id;})[0]; if(!x) return;
    var g=R.filter(function(r){return r.estado===x.estado && r.prioridad===x.prioridad;})
          .sort(function(a,b){return (a.orden-b.orden)||(a.created_at<b.created_at?-1:1);});
    var i=g.findIndex(function(r){return r.id===id;}); var j=i+dir;
    if(i<0||j<0||j>=g.length) return;
    var y=g[j], a=x.orden, b=y.orden;
    if(a===b){ a=i*10; b=j*10; }
    await Promise.all([ guarda(x.id,{orden:b}), guarda(y.id,{orden:a}) ]);
    await load();
  }

  async function guarda(id,campos){
    var r=await fetch(SB+'/rest/v1/roadmap_items?id=eq.'+id,{method:'PATCH',
      headers:hdr({'Prefer':'return=minimal'}), body:JSON.stringify(campos)});
    if(!r.ok) toast('No se pudo guardar',true);
    return r.ok;
  }

  /* ---------- la hoja de edición ---------- */
  function cierra(){ $('ov').classList.remove('on'); $('ovbg').classList.remove('on'); EDITA=null; }
  $('ovbg').onclick=cierra; $('cCerrar').onclick=cierra;
  document.addEventListener('keydown',function(e){ if(e.key==='Escape') cierra(); });

  function abre(id){
    EDITA = id ? (R.filter(function(r){return r.id===id;})[0]||null) : null;
    $('ovTit').textContent = EDITA ? 'Editar' : 'Nuevo tema';
    $('cTit').value   = EDITA?EDITA.titulo:'';
    $('cDet').value   = EDITA&&EDITA.detalle?EDITA.detalle:'';
    $('cArea').value  = EDITA&&EDITA.area?EDITA.area:'';
    $('cEstado').value= EDITA?EDITA.estado:'en_fila';
    $('cPri').value   = EDITA?String(EDITA.prioridad):'2';
    $('cNotas').value = EDITA&&EDITA.notas?EDITA.notas:'';
    $('cBorrar').style.display = EDITA?'':'none';
    $('ov').classList.add('on'); $('ovbg').classList.add('on');
    setTimeout(function(){ $('cTit').focus(); },50);
  }
  $('btnNuevo').onclick=function(){ abre(null); };

  $('cGuardar').onclick=async function(){
    var t=($('cTit').value||'').trim();
    if(!t) return toast('Ponle al menos un título',true);
    var campos={titulo:t,
      detalle:($('cDet').value||'').trim()||null,
      area:($('cArea').value||'').trim()||null,
      estado:$('cEstado').value,
      prioridad:Number($('cPri').value),
      notas:($('cNotas').value||'').trim()||null};
    var b=$('cGuardar'); b.disabled=true;
    try{
      if(EDITA){ if(!await guarda(EDITA.id,campos)) return; }
      else{
        campos.orden = 100 + R.length*10;
        try{ campos.creado_por = (JSON.parse(atob(tok().split('.')[1]||''))||{}).email||null; }catch(_){}
        var r=await fetch(SB+'/rest/v1/roadmap_items',{method:'POST',headers:hdr({'Prefer':'return=minimal'}),body:JSON.stringify(campos)});
        if(!r.ok) return toast('No se pudo crear',true);
      }
      cierra(); toast('Guardado'); await load();
    } finally { b.disabled=false; }
  };

  $('cBorrar').onclick=async function(){
    if(!EDITA) return;
    if(!confirm('¿Borrar «'+EDITA.titulo+'»? Si solo ya no toca, mejor márcalo como hecho.')) return;
    var r=await fetch(SB+'/rest/v1/roadmap_items?id=eq.'+EDITA.id,{method:'DELETE',headers:hdr()});
    if(!r.ok) return toast('No se pudo borrar',true);
    cierra(); toast('Borrado'); await load();
  };

  /* El CSV lleva las mismas columnas que se ven, para que cuadre con la
     pantalla y no haya dos versiones de la verdad. */
  $('btnCsv').onclick=function(){
    var cab=['Qué','Detalle','Área','Prioridad','Estado','Notas','Creado','Última vez'];
    var filas=visibles().map(function(x){ return [x.titulo,x.detalle||'',x.area||'',PRI[x.prioridad],EST[x.estado],x.notas||'',
      (x.created_at||'').slice(0,10),(x.updated_at||'').slice(0,10)]; });
    var csv=[cab].concat(filas).map(function(f){
      return f.map(function(c){ c=(c==null?'':String(c));
        return /[",\n;]/.test(c) ? '"'+c.replace(/"/g,'""')+'"' : c; }).join(',');
    }).join('\n');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}));
    a.download='siguientes-modulos-'+new Date().toISOString().slice(0,10)+'.csv';
    a.click(); URL.revokeObjectURL(a.href);
  };

  ['fQ','fArea','fEstado'].forEach(function(id){
    var el=$(id); el.addEventListener(el.tagName==='INPUT'?'input':'change',pinta);
  });
  $('btnRecarga').onclick=load;
  load();
})();
</script>
</body></html>
