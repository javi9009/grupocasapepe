<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta · Grupo Casa Pepe</title>
<style>
:root{--bg:#16130f;--surface:#241f18;--card:#2d271e;--txt:#f4ecdd;--soft:#c9bca6;--mut:#8d8170;--accent:#1d9e75;--gold:#C9A227;--bd:#3a3228;--bad:#d4564f;--warn:#b8821a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;line-height:1.5}
header{background:#0e0c09;border-bottom:2px solid var(--gold);padding:11px 16px;display:flex;align-items:center;gap:12px}
header .b{font-weight:700;color:var(--gold);font-size:15px}
header .out{margin-left:auto;font-size:12px;color:var(--soft);background:none;border:1px solid var(--bd);border-radius:7px;padding:5px 10px;cursor:pointer}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
.card h2{margin:0 0 4px;font-size:16px}.card .sub{font-size:12px;color:var(--mut);margin-bottom:12px}
label{display:block;font-size:12px;font-weight:600;color:var(--soft);margin:10px 0 4px}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:9px;background:var(--bg);color:var(--txt);font-size:15px}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.primary{background:var(--accent);color:#fff}
.btn.gold{background:var(--gold);color:#16130f}
.btn:disabled{opacity:.5;cursor:default}
.msg{font-size:13px;margin-top:10px;padding:9px 11px;border-radius:8px;display:none}
.msg.show{display:block}.msg.ok{background:#16352a;color:#7fe0b0;border:1px solid #1d9e75}
.msg.err{background:#3a1f1f;color:#e89a95;border:1px solid var(--bad)}
.checin{text-align:center;padding:6px 0}
.checin .llegue{background:var(--accent);color:#fff;border:none;border-radius:16px;width:170px;height:170px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 8px 30px rgba(29,158,117,.35)}
.checin .llegue:active{transform:scale(.97)}
.checin .geo{font-size:12px;color:var(--mut);margin-top:10px}
.row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}
.row:last-child{border-bottom:none}
.row .d{color:var(--soft)}.row .t{font-variant-numeric:tabular-nums;font-weight:600}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
.tag.ok{background:#16352a;color:#7fe0b0}.tag.tarde{background:#3a2e16;color:#e0b84a}.tag.falta{background:#3a1f1f;color:#e89a95}
.doc{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);font-size:14px}
.doc:last-child{border-bottom:none}
.doc a{color:var(--accent);text-decoration:none;font-weight:600;margin-left:auto}
.muted{color:var(--mut);font-size:13px}
#app{display:none}
.hi{font-size:13px;color:var(--soft)}.hi b{color:var(--txt)}
</style></head><body>
<header><span class="b">Mi cuenta · Casa Pepe</span><button class="out" id="logout" style="display:none">Cerrar sesión</button></header>
<div class="wrap">

  <!-- LOGIN -->
  <div class="card" id="login">
    <h2>Entra a tu cuenta</h2>
    <div class="sub">Acceso de colaboradores · Grupo Casa Pepe</div>
    <label>Correo</label>
    <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com">
    <label>Contraseña</label>
    <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
    <button class="btn primary" id="enter">Entrar</button>
    <div class="msg" id="loginmsg"></div>
  </div>

  <!-- APP -->
  <div id="app">
    <div class="hi" id="hi"></div>

    <div class="card">
      <h2>Reloj checador</h2>
      <div class="sub" id="checsub">Marca tu llegada al estar en el lugar de trabajo.</div>
      <div class="checin">
        <button class="llegue" id="llegue">✋<br>Llegué</button>
        <div class="geo" id="geo"></div>
      </div>
      <div class="msg" id="checmsg"></div>
    </div>

    <div class="card">
      <h2>Mi horario · esta semana</h2>
      <div class="sub">Solo lectura</div>
      <div id="horario"><div class="muted">Cargando…</div></div>
    </div>

    <div class="card">
      <h2>Mi asistencia · reciente</h2>
      <div id="asis"><div class="muted">Cargando…</div></div>
    </div>

    <div class="card">
      <h2>Mis documentos</h2>
      <div class="sub">Solo lectura</div>
      <div id="docs"><div class="muted">Cargando…</div></div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
let EMP=null, CFG=null;

function msg(el,t,cls){el.textContent=t;el.className='msg show '+(cls||'');}
function hide(el){el.className='msg';}
function fmtFecha(f){const d=new Date(f+'T00:00:00');return DOW[d.getDay()]+' '+d.getDate();}
function hhmm(t){return t?t.slice(0,5):'';}
function mxToday(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})).toISOString().slice(0,10);}
function mxNow(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));}
function quincena(){const d=mxNow();return d.toISOString().slice(0,7)+(d.getDate()<=15?'-Q1':'-Q2');}
function dist(la1,lo1,la2,lo2){const R=6371000,r=x=>x*Math.PI/180;const dla=r(la2-la1),dlo=r(lo2-lo1);const a=Math.sin(dla/2)**2+Math.cos(r(la1))*Math.cos(r(la2))*Math.sin(dlo/2)**2;return 2*R*Math.asin(Math.sqrt(a));}

async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('login').style.display=''; $('app').style.display='none'; $('logout').style.display='none'; return; }
  $('login').style.display='none'; $('app').style.display=''; $('logout').style.display='';
  // mapear usuario -> empleado
  const {data:link}=await sb.from('empleado_login').select('employee_id').eq('user_id',session.user.id).maybeSingle();
  if(!link){ $('hi').innerHTML='<b>Tu cuenta aún no está vinculada a un colaborador.</b> Pídele a gerencia que la vincule.'; return; }
  const eid=link.employee_id;
  const {data:emp}=await sb.from('v_empleados_publico').select('nombre,puesto,area').eq('id',eid).maybeSingle();
  EMP={id:eid,...(emp||{})};
  $('hi').innerHTML='Hola, <b>'+(EMP.nombre||'colaborador')+'</b> · '+(EMP.puesto||'')+(EMP.area?' · '+EMP.area:'');
  const {data:cfg}=await sb.from('checador_config').select('*').eq('id',1).maybeSingle();
  CFG=cfg||{lat:19.43033,lng:-99.13449,radio_m:50,tolerancia_min:15};
  $('checsub').textContent='Marca tu llegada estando a ≤'+CFG.radio_m+' m de '+(CFG.lugar||'tu lugar de trabajo')+'.';
  loadHorario(); loadAsis(); loadDocs();
}

async function loadHorario(){
  const t=mxToday(); const d=new Date(t+'T00:00:00'); const k=(d.getDay()+6)%7; const lun=new Date(d); lun.setDate(d.getDate()-k);
  const d0=lun.toISOString().slice(0,10); const fin=new Date(lun); fin.setDate(lun.getDate()+6); const d6=fin.toISOString().slice(0,10);
  const {data}=await sb.from('horarios').select('fecha,hora_inicio,hora_fin,actividad,ubicacion').eq('employee_id',EMP.id).gte('fecha',d0).lte('fecha',d6).order('fecha');
  if(!data||!data.length){$('horario').innerHTML='<div class="muted">Sin turnos asignados esta semana.</div>';return;}
  $('horario').innerHTML=data.map(a=>{
    const hh=a.hora_inicio?hhmm(a.hora_inicio)+'–'+hhmm(a.hora_fin):(a.actividad||'Descanso');
    return '<div class="row"><span class="d">'+fmtFecha(a.fecha)+(a.actividad&&a.hora_inicio?' · '+a.actividad:'')+'</span><span class="t">'+hh+'</span></div>';
  }).join('');
}
async function loadAsis(){
  const {data}=await sb.from('asistencias').select('fecha,check_in,estatus,minutos_retraso,dentro_geocerca').order('check_in',{ascending:false}).limit(12);
  if(!data||!data.length){$('asis').innerHTML='<div class="muted">Aún no tienes registros de asistencia.</div>';return;}
  $('asis').innerHTML=data.map(a=>{
    const h=new Date(a.check_in).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
    const cls=a.estatus==='a_tiempo'?'ok':(a.estatus==='tarde'?'tarde':'falta');
    const et=a.estatus==='a_tiempo'?'A tiempo':(a.estatus==='tarde'?('Tarde +'+(a.minutos_retraso||0)+'m'):(a.estatus||'—'));
    return '<div class="row"><span class="d">'+fmtFecha(a.fecha)+' · '+h+'</span><span class="tag '+cls+'">'+et+'</span></div>';
  }).join('');
}
async function loadDocs(){
  const {data,error}=await sb.from('documentos_empleado').select('tipo,url,filename').eq('employee_id',EMP.id);
  if(error||!data||!data.length){$('docs').innerHTML='<div class="muted">Tus documentos (contrato, ID) aparecerán aquí conforme gerencia los cargue.</div>';return;}
  $('docs').innerHTML=data.map(d=>'<div class="doc"><span>'+(d.tipo||'Documento')+'</span><a href="'+d.url+'" target="_blank" rel="noopener">Ver ↗</a></div>').join('');
}

// LOGIN
$('enter').onclick=async()=>{
  hide($('loginmsg')); $('enter').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pass').value});
  $('enter').disabled=false;
  if(error){msg($('loginmsg'),'No pudimos entrar: '+(error.message||'revisa tus datos'),'err');return;}
  init();
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('enter').click()});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};

// CHECADOR
$('llegue').onclick=()=>{
  hide($('checmsg')); $('geo').textContent='Obteniendo tu ubicación…'; $('llegue').disabled=true;
  if(!navigator.geolocation){msg($('checmsg'),'Tu dispositivo no permite ubicación.','err');$('llegue').disabled=false;return;}
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude:lat,longitude:lng,accuracy}=pos.coords;
    const d=Math.round(dist(lat,lng,CFG.lat,CFG.lng));
    $('geo').textContent='Estás a ~'+d+' m del lugar (precisión GPS ±'+Math.round(accuracy)+' m).';
    const dentro=d<=CFG.radio_m;
    if(!dentro){msg($('checmsg'),'⚠ Estás a '+d+' m. Debes estar a ≤'+CFG.radio_m+' m del lugar para marcar.','err');$('llegue').disabled=false;return;}
    // turno de hoy
    const today=mxToday();
    const {data:tn}=await sb.from('horarios').select('hora_inicio').eq('employee_id',EMP.id).eq('fecha',today).not('hora_inicio','is',null).order('hora_inicio').limit(1);
    let hora_turno=null,retraso=null,estatus='sin_turno';
    if(tn&&tn.length){
      hora_turno=tn[0].hora_inicio;
      const [h,m]=hora_turno.split(':').map(Number);
      const now=mxNow(); const minNow=now.getHours()*60+now.getMinutes();
      retraso=minNow-(h*60+m);
      estatus = retraso<=CFG.tolerancia_min ? 'a_tiempo' : 'tarde';
    }
    const {error}=await sb.from('asistencias').insert({
      employee_id:EMP.id, fecha:today, check_in:new Date().toISOString(),
      lat,lng,distancia_m:d,dentro_geocerca:true,hora_turno,minutos_retraso:retraso,estatus,quincena:quincena()
    });
    $('llegue').disabled=false;
    if(error){msg($('checmsg'),'No se pudo registrar: '+error.message,'err');return;}
    const txt = estatus==='a_tiempo' ? '✅ ¡Llegada registrada a tiempo!' : (estatus==='tarde' ? '🟡 Registrada — '+retraso+' min tarde respecto a tu turno '+hhmm(hora_turno)+'.' : '✅ Llegada registrada (sin turno hoy).');
    msg($('checmsg'),txt,'ok'); loadAsis();
  },err=>{
    $('llegue').disabled=false; $('geo').textContent='';
    msg($('checmsg'),'No pudimos obtener tu ubicación: '+(err.message||'permiso denegado')+'. Activa el GPS y permite la ubicación.','err');
  },{enableHighAccuracy:true,timeout:12000,maximumAge:0});
};

init();
</script>
</body></html>
