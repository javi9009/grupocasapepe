<!doctype html>
<html lang="es">
<head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huéspedes · Casa Pepe</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  LAS TRES PANTALLAS DEL HUÉSPED. Javi, 20-oct-2026:
    «La parte de check-in huéspedes gestiona los que llegan hoy, mañana o
     pasado —la mayor cantidad de las interacciones—, pero no tenemos ningún
     lugar donde trabajar con los huéspedes que acaban de reservar, o con los
     que llegan en un mes y se les declinó la tarjeta, o con los que están en
     casa. Tenemos que separar en tres pantallas.»

  Post-booking · Pre-check-in · Estancia. Esta sirve la primera y la tercera;
  la del medio es apepe-recepcion.html, que ya existía y no se toca.

  SE SOLAPAN A PROPÓSITO. Quien llega pasado mañana está en post-booking Y en
  pre-check-in; quien llegó hoy está en estancia. Entre las tres no se escapa
  ningún huésped, que es justo el punto.
-->
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:6px 11px;font-size:13px}
.sedes{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.sedes .sd{font:inherit;font-size:12.5px;font-weight:600;border:1.5px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 13px;cursor:pointer}
.sedes .sd span{color:var(--faint);font-weight:700;margin-left:3px}
.sedes .sd[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.sedes .sd[aria-selected="true"] span{color:rgba(255,255,255,.7)}
.daycards{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin:6px 0 2px}
@media(max-width:1000px){ .daycards{grid-template-columns:repeat(3,1fr)} }
@media(max-width:640px){ .daycards{grid-template-columns:repeat(2,1fr)} }
.dc{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);font:inherit}
.dc:hover{border-color:var(--accent)}
.dc[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.dc .dl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.dc .dn{font-size:26px;font-weight:700;line-height:1.05;margin-top:5px}
.dc .ds{font-size:11.5px;color:var(--muted);margin-top:3px}
.dc.rojo[aria-selected="true"]{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg),var(--shadow)} .dc.rojo .dn{color:var(--bad)}
.dc.oro[aria-selected="true"]{border-color:var(--warn);box-shadow:0 0 0 2px var(--warn-bg),var(--shadow)} .dc.oro .dn{color:var(--warn)}
.dc.azul[aria-selected="true"]{border-color:#2B6CB0;box-shadow:0 0 0 2px #E4F1FA,var(--shadow)} .dc.azul .dn{color:#2B6CB0}
.buscador{margin:12px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.buscador input{flex:1;min-width:200px;font:inherit;padding:9px 12px;border:1.5px solid var(--rule);border-radius:9px;background:var(--surface)}
.buscador input:focus{outline:0;border-color:var(--accent)}
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;align-items:flex-start;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.row:hover{border-color:var(--accent)}
.row .flag{width:30px;flex:0 0 auto}
.row .flag img{width:28px;height:21px;object-fit:cover;border-radius:3px;display:block;box-shadow:0 0 0 1px rgba(30,26,22,.12)}
.row .nm{font-weight:600}
.row .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.row .grow{flex:1;min-width:0}
.mk{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tg{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--none-bg);color:var(--none);white-space:nowrap}
.tg.nr{background:var(--bad-bg);color:var(--bad)}
.tg.sal{background:var(--warn-bg);color:var(--warn)}
.tg.des{background:var(--ok-bg);color:var(--ok)}
.tg.fid{background:#FBE1EC;color:#B0246A}
.tg.ota{background:#E4F1FA;color:#2B6CB0}
.tg.ok{background:var(--ok-bg);color:var(--ok)}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
.cargando{text-align:center;color:var(--muted);padding:34px 10px;line-height:1.6}
.cargando .pulso{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-right:7px;animation:cpPulso 1.1s ease-in-out infinite}
@keyframes cpPulso{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.acty{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
/* ficha */
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,27,22,.4);display:none}
.ov.on{display:block}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:460px;background:var(--surface);box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);overflow:auto}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:2}
.ph h2{font-size:16px;margin:0;flex:1}
.px{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;font-size:17px;cursor:pointer;color:var(--ink)}
.pb{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f .v{font-weight:600;margin-top:1px;word-break:break-word}
.f.full{grid-column:1/-1}
.sec{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.ac{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.note{font-size:12.5px;color:var(--muted)}
.caj{border:1px solid var(--rule);border-radius:12px;background:var(--surface);margin-top:10px;overflow:hidden}
.caj>summary{display:flex;align-items:center;gap:9px;padding:12px 13px;cursor:pointer;list-style:none;font-size:13.5px;font-weight:600}
.caj>summary::-webkit-details-marker{display:none}
.caj .cb{padding:0 13px 13px}
.caj .cr{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div style="flex:1;min-width:200px">
    <h1 id="titulo">Huéspedes</h1>
    <div class="sub" id="sub">Cargando…</div>
  </div>
  <button class="btn ghost sm" id="refrescar">↻ Refrescar</button>
</div></div>

<div class="wrap">
  <div id="avisoTop" class="acty" style="display:none"></div>
  <div class="sedes" id="sedes"></div>
  <div class="daycards" id="kpis"></div>
  <div class="buscador">
    <input id="q" placeholder="Buscar por nombre, correo o número de reserva">
  </div>
  <div class="list" id="list"><div class="cargando"><span class="pulso"></span>Buscando a los huéspedes…</div></div>
</div>

<div class="ov" id="ov"><div class="panel">
  <div class="ph"><h2 id="pTitulo">Detalle</h2><button class="px" id="pCerrar">×</button></div>
  <div class="pb" id="pBody"></div>
</div></div>

<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var CB_PID={cdmx:'10668',puebla:'201759'};

  /* Qué pantalla es esta. Una sola página, dos caras, porque la lógica de
     listar, filtrar y abrir la ficha es la misma y no tiene sentido tenerla
     escrita dos veces y que se vayan separando con el tiempo. */
  var VISTA=(location.search.match(/[?&]vista=([a-z]+)/)||[])[1];
  if(VISTA!=='estancia') VISTA='postbooking';
  var CFG={
    postbooking:{
      titulo:'Post-booking · reservas por llegar',
      sub:'Reservaron y todavía no han llegado. Aquí se trabaja el saldo, el no-reembolsable y el check-in anticipado.',
      filtros:[
        {k:'todos',   lbl:'Todas',           ds:'reservas vivas'},
        {k:'saldo',   lbl:'Con saldo',       ds:'falta por cobrar', col:'rojo'},
        {k:'nr',      lbl:'No reembolsable', ds:'el dinero ya es nuestro', col:'oro'},
        {k:'nrcierra',lbl:'Cierra esta noche',ds:'cobrar hoy', col:'rojo'},
        {k:'sincheck',lbl:'Sin check-in',    ds:'no lo han hecho', col:'azul'},
        {k:'nuevas',  lbl:'Recién reservado',ds:'últimos 3 días'},
        {k:'habitual',lbl:'Ya vinieron',     ds:'cliente que repite'}
      ]
    },
    estancia:{
      titulo:'Estancia · huéspedes en casa',
      sub:'Sólo los que están en casa ahora mismo. Quién se va hoy, quién mañana y qué pidió.',
      filtros:[
        {k:'todos',    lbl:'En casa',      ds:'ahora mismo'},
        {k:'llegahoy', lbl:'Llegaron hoy', ds:'primer día', col:'azul'},
        {k:'salehoy',  lbl:'Se van hoy',   ds:'salida de hoy', col:'oro'},
        {k:'salemanana',lbl:'Se van mañana',ds:'avisar del checkout'},
        {k:'peticion', lbl:'Con petición', ds:'pidieron algo', col:'rojo'},
        {k:'habitual', lbl:'Ya vinieron',  ds:'cliente que repite'}
      ]
    }
  }[VISTA];

  var DATA=[], FILTRO='todos', SEDE='todas', Q='';

  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function fdate(s){ if(!s) return '—'; var p=String(s).split('T')[0].split('-');
    return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s; }
  function money(n,m){ try{ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0})+' '+(m||'MXN'); }
    catch(e){ return '$'+n; } }
  function bandera(cc){ cc=String(cc||'').toUpperCase(); if(!/^[A-Z]{2}$/.test(cc)) return '';
    return '<img src="https://flagcdn.com/w80/'+cc.toLowerCase()+'.png" alt="'+cc+'" loading="lazy">'; }
  function ligaCB(res,sede){
    var pid=CB_PID[String(sede||'cdmx').toLowerCase()], id=String(res||'').trim();
    if(!pid||!id) return '';
    return 'https://hotels.cloudbeds.com/connect/'+pid+'#/reservations/'+encodeURIComponent(/^r/i.test(id)?id:('r'+id));
  }
  function sessTok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k&&/sb-.*-auth-token/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null');
      var s=v&&(v.currentSession||v); if(s&&s.access_token) return s.access_token; } } }catch(e){} return ''; }
  function aviso(txt,sinSesion){
    var e=$('avisoTop'); if(!e) return;
    e.innerHTML=esc(txt)+(sinSesion?'<br><b>Esta pantalla no encuentra tu sesión.</b> Sal y vuelve a entrar a SoyPepe.':'');
    e.style.display='block';
  }
  function avisoFuera(){ var e=$('avisoTop'); if(e) e.style.display='none'; }

  var FIDLBL={fiel_gold:'Fiel Gold',gold:'Gold',bronce:'Bronce',residente:'Residente',recurrente:'Ya vino'};

  /* --- lo que hace que una fila entre en un filtro --- */
  function cumple(r,k){
    if(k==='todos') return true;
    if(k==='saldo') return Number(r.saldo||0)>0;
    if(k==='nr') return !!(r.no_reembolsable||r.nr_por_plazo);
    if(k==='nrcierra') return !!r.nr_por_plazo;
    if(k==='sincheck') return !r.hecho;
    if(k==='nuevas') return r.creada && (r.creada>=hace(3));
    if(k==='habitual') return !!(r.fid&&(r.fid.tier||r.fid.est>1));
    if(k==='llegahoy') return !!r.llega_hoy;
    if(k==='salehoy') return !!r.sale_hoy;
    if(k==='salemanana') return !!r.sale_manana;
    if(k==='peticion') return !!((r.peticiones&&r.peticiones.length)||r.peticion_nota);
    return true;
  }
  function hace(n){
    var d=new Date(); d.setDate(d.getDate()-n);
    return d.toISOString().slice(0,10);
  }
  function deSede(r){ return SEDE==='todas' || String(r.sede||'').toLowerCase()===SEDE; }
  function deBusqueda(r){
    if(!Q) return true;
    var t=(String(r.nombre||'')+' '+String(r.email||'')+' '+String(r.reservation_id||'')).toLowerCase();
    return t.indexOf(Q)>=0;
  }
  function visibles(){ return DATA.filter(function(r){ return deSede(r)&&cumple(r,FILTRO)&&deBusqueda(r); }); }

  /* --- pintar --- */
  function pintaSedes(){
    var c=$('sedes'); if(!c) return;
    var n={todas:0,cdmx:0,puebla:0};
    DATA.forEach(function(r){ n.todas++; var s=String(r.sede||'').toLowerCase(); if(n[s]!=null) n[s]++; });
    c.innerHTML=[['todas','Todas'],['cdmx','CDMX'],['puebla','Puebla']].map(function(p){
      return '<button class="sd" data-s="'+p[0]+'" aria-selected="'+(SEDE===p[0])+'">'+p[1]+
        '<span>'+n[p[0]]+'</span></button>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-s]'),function(b){
      b.onclick=function(){ SEDE=b.getAttribute('data-s'); render(); };
    });
  }
  function pintaKpis(){
    var c=$('kpis'); if(!c) return;
    c.innerHTML=CFG.filtros.map(function(f){
      var n=DATA.filter(function(r){ return deSede(r)&&cumple(r,f.k); }).length;
      return '<button class="dc '+(f.col||'')+'" data-f="'+f.k+'" aria-selected="'+(FILTRO===f.k)+'">'+
        '<div class="dl">'+esc(f.lbl)+'</div><div class="dn">'+n+'</div><div class="ds">'+esc(f.ds)+'</div></button>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-f]'),function(b){
      b.onclick=function(){ FILTRO=b.getAttribute('data-f'); render(); };
    });
  }
  function etiquetas(r){
    var t=[];
    if(r.fuente) t.push('<span class="tg ota">'+esc(r.fuente)+'</span>');
    /* Lo decide la pestaña de non refundables, no esta pantalla: de origen o
       se le cierra el plazo, y en qué va el cobro. Así las dos dicen lo mismo. */
    if(r.no_reembolsable) t.push('<span class="tg nr">No reembolsable</span>');
    else if(r.nr_por_plazo) t.push('<span class="tg nr">Cierra esta noche</span>');
    if(r.nr_estado && r.nr_estado!=='pendiente') t.push('<span class="tg '+
      (r.nr_estado==='cobrado'?'ok':(r.nr_estado==='no_paso'?'nr':'sal'))+'">'+
      esc(NRLBL[r.nr_estado]||r.nr_estado)+'</span>');
    if((r.no_reembolsable||r.nr_por_plazo) && r.nr_tarjeta===false)
      t.push('<span class="tg nr">Sin tarjeta</span>');
    if(Number(r.saldo||0)>0) t.push('<span class="tg sal">Faltan '+money(r.saldo,r.moneda)+'</span>');
    else if(VISTA==='postbooking') t.push('<span class="tg ok">Pagada</span>');
    if(r.desayuno) t.push('<span class="tg des">Con desayuno</span>');
    t.push('<span class="tg">'+(r.es_dorm?'Dormitorio':'Privada')+'</span>');
    if(r.fid&&(r.fid.tier||r.fid.est>1)) t.push('<span class="tg fid">'+esc(FIDLBL[r.fid.tier]||'Ya vino')+
      (r.fid.est?' · '+r.fid.est:'')+'</span>');
    if(r.fid&&r.fid.viajero) t.push('<span class="tg fid">Pepe Viajero</span>');
    if(VISTA==='postbooking'){
      if(r.hecho) t.push('<span class="tg ok">Check-in hecho</span>');
      if(r.creada&&r.creada>=hace(3)) t.push('<span class="tg">Recién reservada</span>');
    }else{
      if(r.llega_hoy) t.push('<span class="tg ota">Llegó hoy</span>');
      if(r.sale_hoy) t.push('<span class="tg sal">Se va hoy</span>');
      else if(r.sale_manana) t.push('<span class="tg sal">Se va mañana</span>');
      (r.peticiones||[]).forEach(function(p){ t.push('<span class="tg nr">'+esc(PETLBL[p]||p)+'</span>'); });
      if(r.peticion_nota) t.push('<span class="tg nr">'+esc(r.peticion_nota)+'</span>');
    }
    return t.join('');
  }
  /* «en 3 días» se lee mejor que una fecha suelta cuando lo que decides es a
     quién escribirle hoy. */
  function cuantoFalta(r){
    var d=r.dias_para_llegar;
    if(d==null) return '';
    if(d===0) return ' · llega hoy';
    if(d===1) return ' · mañana';
    return ' · en '+d+' días';
  }
  var NRLBL={cobrado:'Cobrado',no_paso:'No pasó la tarjeta',avisado:'Avisado',perdonado:'Perdonado'};
  var PETLBL={cama_baja:'Cama baja',cama_alta:'Cama alta',no_ruidosa:'Cuarto no ruidoso',
    piso_bajo:'Planta baja',salida_tarde:'Salida tarde',llegada_tarde:'Llega de madrugada'};

  function render(){
    pintaSedes(); pintaKpis();
    var L=$('list'), filas=visibles();
    if(!filas.length){
      L.innerHTML='<div class="empty">Ningún huésped en este filtro.</div>';
      $('sub').textContent=CFG.sub; return;
    }
    L.innerHTML=filas.map(function(r,i){
      var cuando = VISTA==='estancia'
        ? ('Llegó '+fdate(r.desde)+' · se va '+fdate(r.hasta)+(r.noches?(' · '+r.noches+' noche'+(r.noches===1?'':'s')):''))
        : ('Llega '+fdate(r.desde)+' → '+fdate(r.hasta)+cuantoFalta(r));
      return '<div class="row" data-i="'+i+'">'+
        '<div class="flag">'+(bandera(r.pais)||'')+'</div>'+
        '<div class="grow">'+
          '<div class="nm">'+esc(r.nombre||'—')+'</div>'+
          '<div class="meta">'+esc(cuando)+'</div>'+
          '<div class="meta">'+esc(r.habitacion||'—')+' · '+r.pax+' p · '+esc(String(r.sede||'').toUpperCase())+'</div>'+
          '<div class="mk">'+etiquetas(r)+'</div>'+
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('[data-i]'),function(d){
      d.onclick=function(){ abrir(filas[+d.getAttribute('data-i')]); };
    });
    $('sub').textContent=filas.length+' de '+DATA.length+' · '+CFG.sub;
  }

  /* --- la ficha --- */
  var COR=[];
  function cargaCorreos(){
    if(COR.length) return Promise.resolve(COR);
    return fetch(SB+'/rest/v1/apepe_correos?select=clave,nombre,activo&order=n',
      {headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY)}})
      .then(function(r){ return r.ok?r.json():[]; })
      .then(function(j){ var vis={}; COR=(j||[]).filter(function(c){
        if(c.activo===false||vis[c.clave]) return false; vis[c.clave]=1; return true; }); return COR; })
      .catch(function(){ return []; });
  }
  function campo(k,v,full){ return '<div class="f'+(full?' full':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  async function abrir(r){
    $('pTitulo').textContent=r.nombre||'Detalle';
    $('ov').classList.add('on');
    var B=$('pBody');
    B.innerHTML='<div class="cargando"><span class="pulso"></span>Cargando la reserva…</div>';

    var pr=null;
    try{
      pr=await fetch(SB+'/functions/v1/apepe-reserva',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY),'Content-Type':'application/json'},
        body:JSON.stringify({rid:r.reservation_id,prop:r.sede||'cdmx'})}).then(function(x){return x.json();});
    }catch(e){}
    var rv=(pr&&pr.ok)?pr.reserva:null;

    var h='<div class="grid2">'+
      campo('Nombre',esc((rv&&rv.nombre)||r.nombre||'—'),true)+
      campo('Habitación',esc(r.habitacion||'—')+(r.cuartos>1?('<div class="note">'+r.cuartos+' cuartos</div>'):''))+
      campo('Personas',r.pax+' '+(r.pax===1?'persona':'personas')+
        (r.menores>0?('<div class="note">'+r.adultos+' adulto'+(r.adultos===1?'':'s')+' y '+r.menores+' menor'+(r.menores===1?'':'es')+'</div>'):''))+
      campo('Llegada',fdate(r.desde)+(r.hora_estimada?('<div class="note">sobre las '+esc(r.hora_estimada)+'</div>'):''))+
      campo('Salida',fdate(r.hasta)+'<div class="note">'+(r.noches||'—')+' noche'+(r.noches===1?'':'s')+'</div>')+
      campo('Tarifa',esc(r.tarifa||'—')+
        (r.no_reembolsable?'<div class="note" style="color:#9E3B2E">No reembolsable de origen</div>':
         (r.nr_por_plazo?'<div class="note" style="color:#9E3B2E">Se le cierra el plazo esta noche</div>':''))+
        (r.nr_estado?('<div class="note">Cobro: '+esc(NRLBL[r.nr_estado]||r.nr_estado)+
          (r.nr_tarjeta===false?' · sin tarjeta en garantía':'')+'</div>'):'')) +
      campo('Desayuno',r.desayuno?'Incluido en la tarifa':'No consta en la tarifa')+
      campo('Pago',(Number(r.saldo||0)>0?('Faltan '+money(r.saldo,r.moneda)):'Pagada')+
        '<div class="note">'+money(r.pagado,r.moneda)+' de '+money(r.total,r.moneda)+'</div>')+
      campo('Fuente',esc(r.fuente||'—'))+
      campo('Nacionalidad',esc((rv&&rv.nacionalidad)||r.pais||'—'))+
      campo('Correo',esc((rv&&rv.email)||r.email||'—'),true)+
      campo('Celular',esc((rv&&rv.telefono)||'—'))+
      campo('Reservó el',fdate(r.creada))+
    '</div>';

    var u=ligaCB(r.reservation_id,r.sede||'cdmx');
    if(u) h+='<div class="sec"><a href="'+esc(u)+'" target="_blank" rel="noopener" '+
      'style="color:var(--accent);font-weight:600;text-decoration:none">Abrir la reserva '+
      esc(r.reservation_id)+' en Cloudbeds ↗</a></div>';

    if(r.checkin_id){
      h+='<div class="sec"><h3>Check-in</h3><div class="note">Ya hizo su check-in online'+
        (r.n_acompanantes?(' · '+r.n_acompanantes+' acompañante'+(r.n_acompanantes===1?'':'s')):'')+
        '. La ficha completa, con documentos y firma, está en <a href="/m/apepe-recepcion.html" '+
        'style="color:var(--accent);font-weight:600;text-decoration:none">Pre-check-in</a>.</div></div>';
    }else if(VISTA==='postbooking'){
      h+='<div class="sec"><h3>Check-in</h3><div class="note">Todavía no lo ha hecho. '+
        'Mándale el correo de confirmación o el de «ya casi llegas» y le llega su liga.</div></div>';
    }

    /* Las notas que recepción dejó en Cloudbeds: ahí vive lo de «sin desayuno»,
       «cliente frecuente no mover» y lo que se le entregó. */
    var notas=(pr&&Array.isArray(pr.notas))?pr.notas:[];
    if(notas.length){
      h+='<div class="sec"><h3>Notas de Cloudbeds</h3>';
      notas.forEach(function(n){
        var sys=n.tipo==='firma';
        h+='<div class="ac"'+(sys?' style="opacity:.55"':'')+'><div style="font-size:13px;white-space:pre-wrap">'+
          esc(n.texto)+'</div><div class="note" style="margin-top:3px">'+esc(n.autor||'')+
          (n.fecha?(' · '+esc(n.fecha)):'')+'</div></div>';
      });
      h+='</div>';
    }

    /* MANDARLE UN CORREO. Mismo cajón y misma función que en Pre-check-in:
       si pones una dirección, sale a esa y no al huésped. */
    h+='<details class="caj"><summary><span>✉️</span><span>Mandarle un correo</span>'+
      '<span class="cr">el texto se edita en «Editar correos»</span></summary><div class="cb">'+
      '<div class="f full"><div class="k">Qué correo</div><div class="v">'+
        '<select id="coQue" style="width:100%;padding:9px 11px;border:1.5px solid var(--rule);border-radius:10px;font:inherit;font-size:14px">'+
        '<option value="">Cargando…</option></select></div></div>'+
      '<div class="f full" style="margin-top:8px"><div class="k">A</div><div class="v">'+
        '<input id="coA" placeholder="'+esc(r.email||'el correo de la reserva')+'" '+
        'style="width:100%;padding:9px 11px;border:1.5px solid var(--rule);border-radius:10px;font:inherit;font-size:14px">'+
        '<div class="note" style="margin-top:4px">Déjalo vacío para que vaya a quien reservó.</div></div></div>'+
      '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px">'+
        '<button class="btn sm" id="coEnviar">Mandar</button>'+
        '<span id="coAviso" class="note"></span></div>'+
      '</div></details>';

    B.innerHTML=h;

    cargaCorreos().then(function(lista){
      var s=$('coQue'); if(!s) return;
      s.innerHTML=lista.length
        ? lista.map(function(c){ return '<option value="'+esc(c.clave)+'">'+esc(c.nombre)+'</option>'; }).join('')
        : '<option value="">No hay correos configurados</option>';
    });
    var b=$('coEnviar');
    if(b) b.onclick=async function(){
      var clave=($('coQue')||{}).value||'', a=(($('coA')||{}).value||'').trim(), av=$('coAviso'), tok=sessTok();
      if(!clave){ av.textContent='Elige qué correo mandar.'; return; }
      if(!tok){ av.textContent='Esta pantalla no encuentra tu sesión.'; return; }
      if(clave==='upgrade'){ av.textContent='El de upgrade se manda desde Pre-check-in, que es donde se elige el cuarto.'; return; }
      b.disabled=true; av.textContent='Mandando…';
      try{
        var res=await fetch(SB+'/functions/v1/apepe-correo-enviar',{method:'POST',
          headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
          body:JSON.stringify({reservation_id:String(r.reservation_id),
            prop:String(r.sede||'cdmx').toLowerCase(),clave:clave,a:a||undefined})
        }).then(function(x){return x.json();});
        av.innerHTML=(res&&res.ok)
          ? 'Mandado a <b>'+esc(res.a)+'</b>'+(res.modo==='prueba'?' · en modo prueba: al huésped no le llegó':' ✓')
          : esc((res&&res.error)||'No se pudo mandar.');
      }catch(e){ av.textContent='Error de conexión.'; }
      b.disabled=false;
    };
  }
  $('pCerrar').onclick=function(){ $('ov').classList.remove('on'); };
  $('ov').onclick=function(ev){ if(ev.target===$('ov')) $('ov').classList.remove('on'); };

  /* --- carga --- */
  async function cargar(){
    avisoFuera();
    $('list').innerHTML='<div class="cargando"><span class="pulso"></span>Buscando a los huéspedes…</div>';
    try{
      var res=await fetch(SB+'/functions/v1/apepe-huespedes',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY),'Content-Type':'application/json'},
        body:JSON.stringify({vista:VISTA,prop:'all'})}).then(function(x){return x.json();});
      if(!res||res.ok===false){
        DATA=[]; aviso((res&&res.error)||'No se pudo cargar.', !sessTok());
        $('list').innerHTML='<div class="empty">No se pudo cargar la lista. Dale a ↻ Refrescar.</div>';
        $('sub').textContent='No se pudo cargar'; return;
      }
      DATA=Array.isArray(res.filas)?res.filas:[];
    }catch(e){
      DATA=[]; aviso('No se pudo cargar. Revisa tu internet y dale a Refrescar.');
      $('list').innerHTML='<div class="empty">No se pudo cargar la lista. Dale a ↻ Refrescar.</div>';
      $('sub').textContent='No se pudo cargar'; return;
    }
    /* Quien lleva una sola casa ve sólo la suya; de eso se encarga cpAcceso.
       Fail-open: una fila sin sede nunca se esconde. */
    try{ if(window.cpAcceso&&cpAcceso.filtra){ DATA=await cpAcceso.filtra(DATA,function(x){return x.sede;}); } }catch(e){}
    render();
  }

  $('titulo').textContent=CFG.titulo;
  document.title=CFG.titulo+' · Casa Pepe';
  $('sub').textContent=CFG.sub;
  $('refrescar').onclick=cargar;
  $('q').oninput=function(){ Q=this.value.trim().toLowerCase(); render(); };
  cargar();
})();
</script>
</body>
</html>
