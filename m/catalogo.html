<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de compras · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.spacer{margin-left:auto}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:.95rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:1.4rem;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}.c-n{background:var(--none-bg);color:var(--none)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=checkbox]{width:auto}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.center{text-align:center;color:var(--muted);padding:36px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.avisos{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.filtros > div{min-width:150px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style></head>
<body>

<div class="top"><div class="top-in">
  <div class="brand">📚 Catálogo de compras<small>Casa Pepe · productos, precios y proveedores</small></div>
  <div class="spacer"></div>
  <span id="sedeBox"></span>
</div></div>

<div class="secnav"><div class="secnav-in" id="tabs"></div></div>
<div class="wrap" id="view"><div class="center">Cargando…</div></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n==null?"—":Number(n).toLocaleString("es-MX");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3000);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

const AREAS=["A&B","Cuartos","Tours","Administración","Mantenimiento","Tienda"];
const TIPOS=["consumible","blanco","menaje","activo","uniforme","herramienta","refaccion"];
const UNIDADES=["pza","ml","l","gr","kg","rollo","m","paq"];
const PRESENTACIONES=["pieza","paquete","bolsa","botella","garrafón","caja","bote","galón","vidón","costal","rollo","kit"];

let USER=null,EMAIL="",PROPS=[],SEDE=null,TAB="productos",PUEDE=false;
let PRODS=[],PROVS=[],BODEGAS=[],CUENTAS=[],CONFIG=[],PRESCACHE={};
let F={area:"",tipo:"",bodega:"",q:"",solo:"todos"};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; EMAIL=(USER.email||"").toLowerCase();
  try{ const {data}=await sb.rpc("permiso_efectivo",{p_email:EMAIL,p_pagina:"PAG-SERV-CATALOGO"}); PUEDE=(data==="editar"); }catch(_){}

  let props=(await sb.from("properties").select("id,nombre,pl_loc").not("pl_loc","is",null)).data||[];
  try{ props=await cpAcceso.filtra(props,p=>p.nombre); }catch(_){}
  PROPS=props.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!PROPS.length){ $("view").innerHTML='<div class="center">No tienes ninguna sede asignada.</div>'; return; }
  SEDE=PROPS[0].id;
  pintaSede(); pintaTabs(); await recargar();
}
function pintaSede(){
  if(PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-n">${esc(PROPS[0].nombre)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="width:auto;min-width:170px">`+
    PROPS.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("")+`</select>`;
  $("selSede").onchange=e=>{SEDE=e.target.value;recargar();};
}
function pintaTabs(){
  const t=[["productos","📦 Productos"],["precios","🏷️ Precios y presentaciones"],["proveedores","🚚 Proveedores"]];
  $("tabs").innerHTML=t.map(([k,l])=>`<button aria-selected="${TAB===k}" onclick="irTab('${k}')">${esc(l)}</button>`).join("");
}
function irTab(k){TAB=k;pintaTabs();render();}

async function recargar(){
  $("view").innerHTML='<div class="center">Cargando…</div>';
  const [pro,cap,prov,bod,cue,cfg]=await Promise.all([
    sb.from("cmp_productos").select("*").eq("property_id",SEDE).order("nombre"),
    sb.from("cmp_v_captura_pendiente").select("producto_id").eq("property_id",SEDE),
    sb.from("cmp_v_proveedores_sede").select("*").eq("property_id",SEDE).order("proveedor"),
    sb.from("pos_almacenes").select("id,nombre,area").eq("property_id",SEDE).eq("activo",true).order("nombre"),
    sb.from("cmp_v_cuentas").select("*").order("grupo_compra"),
    sb.from("cmp_v_proveedores_config").select("*").order("nombre")
  ]);
  PRODS=pro.data||[]; PROVS=prov.data||[]; BODEGAS=bod.data||[]; CUENTAS=cue.data||[]; CONFIG=cfg.data||[];
  const sinPrecio=new Set((cap.data||[]).map(x=>x.producto_id));
  PRODS.forEach(p=>p._sinPrecio=sinPrecio.has(p.id));
  render();
}
function render(){
  if(TAB==="productos")  return vProductos();
  if(TAB==="precios")    return vPrecios();
  if(TAB==="proveedores")return vProveedores();
}

/* ───────── Productos ───────── */
function filtra(){
  return PRODS.filter(p=>{
    if(F.area && p.area!==F.area) return false;
    if(F.tipo && p.tipo!==F.tipo) return false;
    if(F.bodega && p.bodega_id!==F.bodega) return false;
    if(F.solo==="sinprecio" && !p._sinPrecio) return false;
    if(F.solo==="sinminimo" && p.stock_min!=null) return false;
    if(F.solo==="inactivos" && p.activo) return false;
    if(F.solo!=="inactivos" && !p.activo) return false;
    if(F.q && !p.nombre.toLowerCase().includes(F.q.toLowerCase())) return false;
    return true;
  });
}
function vProductos(){
  const l=filtra();
  const sinPrecio=PRODS.filter(p=>p.activo&&p._sinPrecio).length;
  const sinMin=PRODS.filter(p=>p.activo&&p.stock_min==null&&["consumible","blanco","refaccion","herramienta"].includes(p.tipo)).length;
  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${PRODS.filter(p=>p.activo).length}</div><div class="l">productos activos</div></div>
      <div class="kpi"><div class="n" style="color:var(--warn)">${sinPrecio}</div><div class="l">sin precio cargado</div></div>
      <div class="kpi"><div class="n" style="color:var(--muted)">${sinMin}</div><div class="l">sin stock mínimo</div></div>
    </div>
    <div class="filtros">
      <div><label>Buscar</label><input id="fq" value="${esc(F.q)}" placeholder="nombre…" oninput="F.q=this.value;render()"></div>
      <div><label>Área</label><select id="fa" onchange="F.area=this.value;render()">
        <option value="">Todas</option>${AREAS.map(a=>`<option ${F.area===a?"selected":""}>${a}</option>`).join("")}</select></div>
      <div><label>Tipo</label><select onchange="F.tipo=this.value;render()">
        <option value="">Todos</option>${TIPOS.map(t=>`<option ${F.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label>Bodega</label><select onchange="F.bodega=this.value;render()">
        <option value="">Todas</option>${BODEGAS.map(b=>`<option value="${b.id}" ${F.bodega===b.id?"selected":""}>${esc(b.nombre)}</option>`).join("")}</select></div>
      <div style="min-width:auto">${PUEDE?`<button class="btn" onclick="editaProducto()">＋ Nuevo producto</button>`:""}</div>
    </div>
    <div class="chips">
      ${[["todos","Todos"],["sinprecio","Sin precio"],["sinminimo","Sin mínimo"],["inactivos","Dados de baja"]]
        .map(([k,l2])=>`<span class="pill ${F.solo===k?"on":""}" onclick="F.solo='${k}';render()">${l2}</span>`).join("")}
      <span class="muted small">${l.length} resultado(s)</span>
    </div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Producto</th><th>Área · tipo</th><th>Bodega</th><th>Cuenta</th><th class="num">Mínimo</th><th>Precio</th><th></th></tr></thead>
      <tbody>${l.length?l.slice(0,400).map(filaProd).join(""):'<tr><td colspan="7" class="center">Sin resultados</td></tr>'}</tbody>
    </table></div></div>
    ${l.length>400?'<div class="small muted" style="margin-top:8px">Mostrando los primeros 400. Afina el filtro.</div>':""}`;
}
function filaProd(p){
  const b=BODEGAS.find(x=>x.id===p.bodega_id), c=CUENTAS.find(x=>x.id===p.cuenta_id);
  return `<tr>
    <td><b>${esc(p.nombre)}</b>${p.categoria?`<div class="small muted">${esc(p.categoria)}</div>`:""}</td>
    <td class="small">${esc(p.area)}<div class="muted">${esc(p.tipo)}</div></td>
    <td class="small">${esc(b?b.nombre:"—")}</td>
    <td class="small">${c?esc(c.codigo):"—"}<div class="muted">${c?esc(c.grupo_compra):""}</div></td>
    <td class="num">${p.stock_min!=null?num(p.stock_min)+" "+esc(p.unidad_base):'<span class="chip c-n">sin mínimo</span>'}</td>
    <td>${p._sinPrecio?'<span class="chip c-warn">falta</span>':'<span class="chip c-ok">ok</span>'}</td>
    <td class="num">
      <button class="btn ghost sm" onclick="verPresentaciones('${p.id}')">Precios</button>
      ${PUEDE?`<button class="btn ghost sm" onclick="editaProducto('${p.id}')">✎</button>`:""}
    </td></tr>`;
}
function editaProducto(id){
  const p=id?PRODS.find(x=>x.id===id):{area:"A&B",tipo:"consumible",unidad_base:"pza",activo:true};
  modal(`<h3 style="margin:0 0 8px">${id?"Editar producto":"Nuevo producto"}</h3>
    <div class="grid2">
      <div class="full"><label>Nombre</label><input id="pNombre" value="${esc(p.nombre||"")}"></div>
      <div><label>Área</label><select id="pArea">${AREAS.map(a=>`<option ${p.area===a?"selected":""}>${a}</option>`).join("")}</select></div>
      <div><label>Tipo</label><select id="pTipo">${TIPOS.map(t=>`<option ${p.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label>Categoría</label><input id="pCat" value="${esc(p.categoria||"")}" placeholder="Limpieza, Blancos, Papelería…"></div>
      <div><label>Unidad base</label><select id="pUni">${UNIDADES.map(u=>`<option ${p.unidad_base===u?"selected":""}>${u}</option>`).join("")}</select></div>
      <div><label>Unidad como la escriben</label><input id="pUniTxt" value="${esc(p.unidad_texto||"")}" placeholder="Galón 5Lt, Vidón…"></div>
      <div><label>Stock mínimo (en unidad base)</label><input id="pMin" type="number" step="0.01" min="0" value="${p.stock_min!=null?p.stock_min:""}"></div>
      <div><label>Bodega</label><select id="pBod"><option value="">— sin bodega —</option>${BODEGAS.map(b=>`<option value="${b.id}" ${p.bodega_id===b.id?"selected":""}>${esc(b.nombre)}</option>`).join("")}</select></div>
      <div><label>Cuenta contable</label><select id="pCta"><option value="">— sin cuenta —</option>${CUENTAS.map(c=>`<option value="${c.id}" ${p.cuenta_id===c.id?"selected":""}>${esc(c.grupo_compra)} · ${esc(c.codigo)} ${esc(c.cuenta)}</option>`).join("")}</select></div>
      <div class="full"><label>Notas</label><input id="pNotas" value="${esc(p.notas||"")}"></div>
      <div class="full"><label><input type="checkbox" id="pAct" ${p.activo!==false?"checked":""}> Activo</label></div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="guardaProducto(${id?"'"+id+"'":"null"})">Guardar</button></div>`);
}
async function guardaProducto(id){
  const nombre=$("pNombre").value.trim();
  if(!nombre) return toast("El nombre es obligatorio");
  const rec={property_id:SEDE,nombre,area:$("pArea").value,tipo:$("pTipo").value,
    categoria:$("pCat").value.trim()||null,unidad_base:$("pUni").value,
    unidad_texto:$("pUniTxt").value.trim()||null,
    stock_min:$("pMin").value!==""?parseFloat($("pMin").value):null,
    bodega_id:$("pBod").value||null,cuenta_id:$("pCta").value||null,
    notas:$("pNotas").value.trim()||null,activo:$("pAct").checked};
  const r=id? await sb.from("cmp_productos").update(rec).eq("id",id)
            : await sb.from("cmp_productos").insert(rec);
  if(r.error) return toast(r.error.message);
  toast("Guardado"); closeModal(); await recargar();
}

/* ───────── Precios y presentaciones ───────── */
let PSEL=null;
function vPrecios(){
  const sinPrecio=PRODS.filter(p=>p.activo&&p._sinPrecio);
  const porArea={}; sinPrecio.forEach(p=>{(porArea[p.area]=porArea[p.area]||[]).push(p);});
  $("view").innerHTML=`
    <div class="avisos">Cada jefe de área captura aquí el precio de lo suyo. En cuanto un producto tiene al menos una presentación con precio, deja de aparecer en esta lista y ya se puede pedir.</div>
    <div class="kpis" style="margin-top:12px">
      <div class="kpi"><div class="n" style="color:var(--warn)">${sinPrecio.length}</div><div class="l">productos por costear</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${PRODS.filter(p=>p.activo&&!p._sinPrecio).length}</div><div class="l">ya con precio</div></div>
    </div>
    ${Object.keys(porArea).sort().map(a=>`
      <div class="card"><h3>${esc(a)} <span class="chip c-warn">${porArea[a].length}</span></h3><div class="scroll"><table>
        <thead><tr><th>Producto</th><th>Bodega</th><th>Unidad</th><th></th></tr></thead>
        <tbody>${porArea[a].slice(0,150).map(p=>{
          const b=BODEGAS.find(x=>x.id===p.bodega_id);
          return `<tr><td><b>${esc(p.nombre)}</b><div class="small muted">${esc(p.categoria||p.tipo)}</div></td>
            <td class="small">${esc(b?b.nombre:"—")}</td>
            <td class="small">${esc(p.unidad_texto||p.unidad_base)}</td>
            <td class="num"><button class="btn sm" onclick="verPresentaciones('${p.id}')">Capturar precio</button></td></tr>`;
        }).join("")}</tbody></table></div>
        ${porArea[a].length>150?'<div class="small muted" style="padding:8px 14px">Mostrando 150 de '+porArea[a].length+'.</div>':""}
      </div>`).join("") || '<div class="card"><div class="center">Todo el catálogo tiene precio. 🎉</div></div>'}`;
}
async function verPresentaciones(prodId){
  PSEL=prodId;
  const p=PRODS.find(x=>x.id===prodId);
  const {data}=await sb.from("cmp_v_presentaciones").select("*").eq("producto_id",prodId).order("precio_unidad_base");
  const l=data||[];
  modal(`<h3 style="margin:0 0 4px">${esc(p.nombre)}</h3>
    <div class="small muted" style="margin-bottom:10px">${esc(p.area)} · ${esc(p.tipo)} · se cuenta en ${esc(p.unidad_texto||p.unidad_base)}</div>
    <div class="card" style="margin-top:0"><div class="scroll"><table>
      <thead><tr><th>Presentación</th><th>Proveedor</th><th class="num">Precio</th><th class="num">Por ${esc(p.unidad_base)}</th><th></th></tr></thead>
      <tbody>${l.length?l.map(x=>`<tr>
        <td>${esc(x.tipo)} ${num(x.contenido)} ${esc(x.unidad_contenido)} ${x.preferida?'<span class="chip c-acc">preferida</span>':""}</td>
        <td class="small">${esc(x.proveedor||"—")}</td>
        <td class="num">${money(x.precio)}</td>
        <td class="num small">${x.precio_unidad_base!=null?"$"+x.precio_unidad_base:"—"}</td>
        <td class="num">${PUEDE?`<button class="btn ghost sm" onclick="editaPres('${prodId}','${x.id}')">✎</button>
             <button class="btn ghost sm" onclick="borraPres('${x.id}','${prodId}')">✕</button>`:""}</td>
      </tr>`).join(""):'<tr><td colspan="5" class="center">Sin presentaciones. Agrega la primera.</td></tr>'}</tbody>
    </table></div></div>
    <div class="small muted" style="margin-top:8px">La columna "por ${esc(p.unidad_base)}" compara proveedores aunque vendan en tamaños distintos.</div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button>
      ${PUEDE?`<button class="btn" onclick="editaPres('${prodId}')">＋ Agregar presentación</button>`:""}</div>`);
}
async function editaPres(prodId,presId){
  const p=PRODS.find(x=>x.id===prodId);
  let x={tipo:"pieza",contenido:1,unidad_contenido:p.unidad_base,preferida:false,activo:true};
  if(presId){ const {data}=await sb.from("cmp_presentaciones").select("*").eq("id",presId).single(); if(data) x=data; }
  modal(`<h3 style="margin:0 0 8px">${presId?"Editar":"Nueva"} presentación · ${esc(p.nombre)}</h3>
    <div class="grid3">
      <div><label>Tipo</label><select id="xTipo">${PRESENTACIONES.map(t=>`<option ${x.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label>Contenido</label><input id="xCont" type="number" step="0.001" min="0.001" value="${x.contenido}"></div>
      <div><label>Unidad</label><select id="xUni">${UNIDADES.map(u=>`<option ${x.unidad_contenido===u?"selected":""}>${u}</option>`).join("")}</select></div>
    </div>
    <div class="grid2">
      <div><label>Precio</label><input id="xPrecio" type="number" step="0.01" min="0" value="${x.precio!=null?x.precio:""}"></div>
      <div><label>Proveedor</label><select id="xProv"><option value="">— sin proveedor —</option>
        ${PROVS.map(v=>`<option value="${v.proveedor_id}" ${x.proveedor_id===v.proveedor_id?"selected":""}>${esc(v.proveedor)}</option>`).join("")}</select></div>
      <div><label>Clave del proveedor</label><input id="xSku" value="${esc(x.sku_proveedor||"")}"></div>
      <div><label>Precio actualizado</label><input id="xFecha" type="date" value="${x.precio_actualizado||new Date().toISOString().slice(0,10)}"></div>
      <div class="full"><label><input type="checkbox" id="xPref" ${x.preferida?"checked":""}> Es la presentación que se usa para pedir</label></div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="verPresentaciones('${prodId}')">Cancelar</button>
      <button class="btn" onclick="guardaPres('${prodId}',${presId?"'"+presId+"'":"null"})">Guardar</button></div>`);
}
async function guardaPres(prodId,presId){
  const rec={producto_id:prodId,tipo:$("xTipo").value,contenido:parseFloat($("xCont").value),
    unidad_contenido:$("xUni").value,precio:$("xPrecio").value!==""?parseFloat($("xPrecio").value):null,
    proveedor_id:$("xProv").value||null,sku_proveedor:$("xSku").value.trim()||null,
    precio_actualizado:$("xFecha").value||null,preferida:$("xPref").checked,activo:true};
  if(!(rec.contenido>0)) return toast("El contenido debe ser mayor que cero");
  if(rec.preferida){ await sb.from("cmp_presentaciones").update({preferida:false}).eq("producto_id",prodId).neq("id",presId||"00000000-0000-0000-0000-000000000000"); }
  const r=presId? await sb.from("cmp_presentaciones").update(rec).eq("id",presId)
                : await sb.from("cmp_presentaciones").insert(rec);
  if(r.error) return toast(r.error.message);
  toast("Precio guardado"); await recargar(); verPresentaciones(prodId);
}
async function borraPres(id,prodId){
  if(!confirm("¿Borrar esta presentación?")) return;
  const {error}=await sb.from("cmp_presentaciones").delete().eq("id",id);
  if(error) return toast(error.message);
  await recargar(); verPresentaciones(prodId);
}

/* ───────── Proveedores ───────── */
let FP="todos";
function vProveedores(){
  const enSede=new Set(PROVS.map(p=>p.proveedor_id));
  let l=CONFIG.slice();
  if(FP==="sede") l=l.filter(p=>enSede.has(p.proveedor_id));
  if(FP==="incompletos") l=l.filter(p=>(p.faltantes_para_pedir||[]).length>0);
  if(FP==="sinrfc") l=l.filter(p=>p.falta_rfc_para_recibir);
  if(FP==="listos") l=l.filter(p=>p.estado==="alta");
  const listos=CONFIG.filter(p=>p.estado==="alta").length;
  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${CONFIG.length}</div><div class="l">proveedores en el catálogo</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${listos}</div><div class="l">listos para pedir</div></div>
      <div class="kpi"><div class="n" style="color:var(--warn)">${CONFIG.filter(p=>p.falta_rfc_para_recibir).length}</div><div class="l">sin RFC (no se puede recibir)</div></div>
      <div class="kpi"><div class="n">${PROVS.length}</div><div class="l">ligados a esta sede</div></div>
    </div>
    <div class="chips">
      ${[["todos","Todos"],["sede","De esta sede"],["listos","Listos"],["incompletos","Incompletos"],["sinrfc","Sin RFC"]]
        .map(([k,t])=>`<span class="pill ${FP===k?"on":""}" onclick="FP='${k}';render()">${t}</span>`).join("")}
      <span class="spacer"></span>
      ${PUEDE?`<button class="btn sm" onclick="editaProv()">＋ Nuevo proveedor</button>`:""}
    </div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Proveedor</th><th>Sedes</th><th>Contacto</th><th>RFC</th><th>Estado</th><th></th></tr></thead>
      <tbody>${l.length?l.slice(0,300).map(filaProv).join(""):'<tr><td colspan="6" class="center">Sin resultados</td></tr>'}</tbody>
    </table></div></div>`;
}
function filaProv(p){
  const falt=(p.faltantes_para_pedir||[]);
  return `<tr>
    <td><b>${esc(p.nombre)}</b><div class="small muted">${esc(p.categoria||"")}</div></td>
    <td class="small">${esc(p.sedes||"—")}</td>
    <td class="small">${esc(p.telefono||p.mail||"—")}</td>
    <td class="small">${p.rfc?esc(p.rfc):'<span class="chip c-warn">falta</span>'}</td>
    <td>${p.estado==="alta"?'<span class="chip c-ok">listo</span>':`<span class="chip c-warn">falta ${esc(falt.join(" y "))}</span>`}
        ${p.activo===false?'<span class="chip c-n">sin movimiento 3m</span>':""}</td>
    <td class="num">${PUEDE?`<button class="btn ghost sm" onclick="editaProv('${p.proveedor_id}')">✎</button>
        <button class="btn ghost sm" onclick="bajaProv('${p.proveedor_id}')">Baja</button>`:""}</td>
  </tr>`;
}
async function editaProv(id){
  let p={categoria:"Proveedor comercial"};
  let ligas=[];
  if(id){
    const r=await sb.from("proveedores").select("*").eq("id",id).single(); if(r.data) p=r.data;
    const r2=await sb.from("cmp_proveedor_propiedad").select("*").eq("proveedor_id",id); ligas=r2.data||[];
  }
  const liga=ligas.find(x=>x.property_id===SEDE);
  const sedeNom=(PROPS.find(x=>x.id===SEDE)||{}).nombre||"";
  modal(`<h3 style="margin:0 0 8px">${id?"Editar proveedor":"Nuevo proveedor"}</h3>
    <div class="grid2">
      <div class="full"><label>Nombre o razón social</label><input id="vNombre" value="${esc(p.nombre||"")}"></div>
      <div><label>RFC</label><input id="vRfc" value="${esc(p.rfc||"")}" placeholder="obligatorio para recibir"></div>
      <div><label>Categoría</label><input id="vCat" value="${esc(p.categoria||"")}"></div>
      <div><label>Persona de contacto</label><input id="vContacto" value="${esc(p.contacto||"")}"></div>
      <div><label>Teléfono</label><input id="vTel" value="${esc(p.telefono||"")}"></div>
      <div><label>Correo</label><input id="vMail" type="email" value="${esc(p.mail||"")}"></div>
      <div><label>Días de crédito</label><input id="vCred" type="number" min="0" value="${p.credito_dias!=null?p.credito_dias:""}"></div>
    </div>
    <div class="card" style="margin-top:12px"><h3>Condiciones en ${esc(sedeNom)}</h3><div style="padding:12px 14px">
      <label><input type="checkbox" id="vLiga" ${liga?"checked":""}> Este proveedor surte a ${esc(sedeNom)}</label>
      <div class="grid2">
        <div><label>Qué surte</label><input id="vSum" value="${esc(liga?liga.suministra||"":"")}"></div>
        <div><label>Área</label><input id="vArea" value="${esc(liga?liga.area||"":"")}" placeholder="A&B, Cuartos…"></div>
        <div><label>Días de pedido</label><input id="vDp" value="${esc(liga?liga.dias_pedido||"":"")}" placeholder="Lunes y jueves"></div>
        <div><label>Días de entrega</label><input id="vDe" value="${esc(liga?liga.dias_entrega||"":"")}"></div>
        <div><label>Responsable interno</label><input id="vResp" value="${esc(liga?liga.responsable||"":"")}"></div>
        <div><label>Pedido promedio</label><input id="vProm" value="${esc(liga?liga.pedido_promedio||"":"")}"></div>
      </div>
    </div></div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="guardaProv(${id?"'"+id+"'":"null"})">Guardar</button></div>`);
}
async function guardaProv(id){
  const nombre=$("vNombre").value.trim(); if(!nombre) return toast("El nombre es obligatorio");
  const rec={nombre,rfc:$("vRfc").value.trim().toUpperCase()||null,categoria:$("vCat").value.trim()||null,
    contacto:$("vContacto").value.trim()||null,telefono:$("vTel").value.trim()||null,
    mail:$("vMail").value.trim()||null,
    credito_dias:$("vCred").value!==""?parseInt($("vCred").value):null,
    actualizado_por:EMAIL,actualizado_at:new Date().toISOString()};
  let pid=id;
  if(id){ const r=await sb.from("proveedores").update(rec).eq("id",id); if(r.error) return toast(r.error.message); }
  else { rec.creado_por=EMAIL; const r=await sb.from("proveedores").insert(rec).select().single();
         if(r.error) return toast(r.error.message); pid=r.data.id; }

  const liga={proveedor_id:pid,property_id:SEDE,suministra:$("vSum").value.trim()||null,
    area:$("vArea").value.trim()||null,dias_pedido:$("vDp").value.trim()||null,
    dias_entrega:$("vDe").value.trim()||null,responsable:$("vResp").value.trim()||null,
    pedido_promedio:$("vProm").value.trim()||null};
  if($("vLiga").checked){
    const r=await sb.from("cmp_proveedor_propiedad").upsert(liga,{onConflict:"proveedor_id,property_id"});
    if(r.error) toast("Proveedor guardado, pero la sede falló: "+r.error.message);
  } else {
    await sb.from("cmp_proveedor_propiedad").delete().eq("proveedor_id",pid).eq("property_id",SEDE);
  }
  toast("Guardado"); closeModal(); await recargar();
}
async function bajaProv(id){
  const motivo=prompt("¿Por qué se da de baja este proveedor?"); if(!motivo) return;
  const {error}=await sb.from("proveedores").update({estado:"baja",baja_motivo:motivo,
    baja_at:new Date().toISOString(),baja_por:EMAIL}).eq("id",id);
  if(error) return toast(error.message);
  toast("Proveedor dado de baja"); await recargar();
}

boot();
</script>
</body></html>
