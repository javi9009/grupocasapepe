<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proveedores y stocks · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.spacer{margin-left:auto}
.altacard{border:1px solid var(--rule-2);border-radius:12px;padding:14px;margin-top:12px}
.altahd{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.altagrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.altafoto{max-width:220px;border-radius:10px;margin-top:10px;display:block}
.altabtns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ctaextra{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.ctaextra select{flex:1}
.provfila{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.provfila select{flex:1}
.provfila input{width:120px}
.provfila .pvModo{flex:0 0 100px;width:100px}
.provfila .pvEq{flex:0 0 130px;white-space:nowrap}
.filtros{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.filtros select,.filtros input{width:auto;min-width:150px}
.pill{cursor:pointer;border:1px dashed var(--rule-2);border-radius:999px;background:transparent;
  font:inherit;font-size:12.5px;color:var(--muted);padding:3px 10px;white-space:nowrap;line-height:1.4}
.pill:hover{border-style:solid;background:var(--bg2);color:var(--ink)}
.pill.sug{border-style:solid;border-color:var(--accent);color:var(--accent)}
.pill.sug:hover{background:var(--accent);color:var(--on-accent)}
table.incom td{vertical-align:top}
.picklinea{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;border-bottom:1px solid var(--rule-1);cursor:pointer}
.picklinea input{width:auto;margin:2px 0 0}
.picklinea:hover{background:var(--bg2)}
.inlinefix{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.inlinefix .inlinein{width:auto;min-width:130px;max-width:220px;padding:4px 6px;font-size:13px;margin:0}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:.95rem;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:1.4rem;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}.c-n{background:var(--none-bg);color:var(--none)}
.c-acc{background:var(--accent-soft);color:var(--accent)}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
input[type=checkbox]{width:auto}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:780px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.muted{color:var(--muted)}.small{font-size:12.5px}
.center{text-align:center;color:var(--muted);padding:36px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.avisos{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px}
.filtros > div{min-width:150px}
@media(max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
</style><link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand">📦 Proveedores y stocks<small>Casa Pepe · catálogo de compras, precios, proveedores e inventario</small></div>
  <div class="spacer"></div>
  <span id="sedeBox"></span>
</div></div>

<div class="secnav"><div class="secnav-in" id="tabs"></div></div>
<div class="wrap" id="view"><div class="center">Cargando…</div></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>/* Sin sesion no hay datos: se avisa y se vuelve al panel. */
if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n==null?"—":Number(n).toLocaleString("es-MX");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3000);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

const AREAS=["A&B","Cuartos","Tours","Administración","Mantenimiento","Tienda"];
const TIPOS=["consumible","blanco","menaje","activo","uniforme","herramienta","refaccion"];
const UNIDADES=["pza","ml","l","gr","kg","rollo","m","paq"];
const PRESENTACIONES=["pieza","paquete","bolsa","botella","garrafón","caja","bote","galón","vidón","costal","rollo","kit"];

let USER=null,EMAIL="",PROPS=[],SEDE=null,TAB="productos",PUEDE=false;
let PRODS=[],PROVS=[],BODEGAS=[],CUENTAS=[],CONFIG=[],PRESCACHE={},COSTO={};
let FPR={estado:"pendientes",area:"",bodega:"",cuenta:"",q:""};
let VARP={};
let PASILLOS=[],PASMAP={};   // arbol de pasillos: lista ordenada y mapa por id
let STOCK=[],CONTEOS=[],CONCIL=[],ALTAS=[];
let INCOM=[],FI={ubic:"",orden:"uso",area:"",prov:"",falta:"",q:""};
let PROV_TODOS=[],BOD_TODAS=[];
let F={area:"",tipo:"",bodega:"",q:"",solo:"todos"};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; EMAIL=(USER.email||"").toLowerCase();
  try{ const {data}=await sb.rpc("permiso_efectivo",{p_email:EMAIL,p_pagina:"PAG-SERV-CATALOGO"}); PUEDE=(data==="editar"); }catch(_){}

  let props=(await sb.from("properties").select("id,nombre,pl_loc").not("pl_loc","is",null)).data||[];
  // Fail-open como cp-acceso: si el filtro de ubicación deja la lista en cero,
  // es un fallo del filtro, no que la persona no tenga casas. Mejor enseñarlas todas.
  try{ const f=await cpAcceso.filtra(props,p=>p.nombre); if(f&&f.length) props=f; }catch(_){}
  PROPS=props.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!PROPS.length){ $("view").innerHTML='<div class="center">No tienes ninguna sede asignada.</div>'; return; }
  SEDE=await sedeInicial();
  const qt=new URLSearchParams(location.search).get("tab");
  if(qt) TAB=qt;   // el aviso de Don José entra directo a ?tab=altas
  pintaSede(); pintaTabs(); await recargar();
}
/* Sede de arranque.
   El panel ya tiene su selector de propiedad arriba y nos pasa ?proyecto=cdmx|puebla|virreyes:
   cuando viene de ahí, esa manda y aquí NO se repite el filtro (solo se dice en qué casa estamos).
   Suelto (atajo directo, ?tab=altas): la última que eligió, la suya, o la primera con catálogo. */
let MANDA_PANEL=false;
function proyDelPanel(){
  try{
    const q=new URLSearchParams(location.search).get("proyecto")||"";
    return (window.cpAcceso&&cpAcceso.toProy(q))||"";
  }catch(_){ return ""; }
}
// Soy Pepe no pasa ?proyecto=: su selector de arriba guarda la propiedad en cp_view_prop.
// Sin esto, el módulo abría en una casa distinta de la que dice el selector.
function sedeDeSoyPepe(){
  try{ return localStorage.getItem("cp_view_prop")||""; }catch(_){ return ""; }
}
async function sedeInicial(){
  let con=new Set();
  try{ const {data}=await sb.from("cmp_v_sedes_con_catalogo").select("property_id");
       con=new Set((data||[]).map(r=>r.property_id)); }catch(_){}
  const py=proyDelPanel();
  if(py){
    const m=PROPS.find(x=>{ try{ return cpAcceso.toProy(x.pl_loc)===py; }catch(_){ return false; } });
    // Corporativo y Sincrético no tienen catálogo de compras: ahí seguimos con selector propio.
    if(m && (!con.size || con.has(m.id))){ MANDA_PANEL=true; return m.id; }
  }
  const sp=sedeDeSoyPepe();
  if(sp && PROPS.some(p=>p.id===sp) && (!con.size || con.has(sp))){ MANDA_PANEL=true; return sp; }
  try{ const g=localStorage.getItem("cp_sede_compras"); if(g && PROPS.some(p=>p.id===g)) return g; }catch(_){}
  try{
    const {data}=await sb.from("employees").select("property_id").ilike("email",EMAIL).maybeSingle();
    const mia=data&&data.property_id;
    if(mia && PROPS.some(p=>p.id===mia) && (!con.size || con.has(mia))) return mia;
  }catch(_){}
  const conCat=PROPS.find(p=>con.has(p.id));
  return (conCat||PROPS[0]).id;
}
function recuerdaSede(id){ try{ localStorage.setItem("cp_sede_compras",id); }catch(_){} }
function pintaSede(){
  const nom=((PROPS.find(p=>p.id===SEDE)||PROPS[0])||{}).nombre||"";
  if(MANDA_PANEL || PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-n">${esc(nom)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="width:auto;min-width:170px">`+
    PROPS.map(p=>`<option value="${p.id}" ${p.id===SEDE?"selected":""}>${esc(p.nombre)}</option>`).join("")+`</select>`;
  $("selSede").onchange=e=>{SEDE=e.target.value;recuerdaSede(SEDE);recargar();};
}
function pintaTabs(){
  const pend=ALTAS.filter(a=>a.estado==='nueva'||a.estado==='en_revision').length;
  const inc=INCOM.filter(x=>(x.faltantes||[]).length).length;
  const t=[["productos","📦 Productos"],["altas","🆕 Productos nuevos"+(pend?" ("+pend+")":"")],
           ["incompletos","🧩 Incompletos"+(inc?" ("+inc+")":"")],
           ["precios","🏷️ Precios"],["proveedores","🚚 Proveedores"],
           ["stock","🏬 Stock por bodega"],["conteos","🧮 Conteos"],["concilia","🍽️ Conciliación A&B"]];
  $("tabs").innerHTML=t.map(([k,l])=>`<button aria-selected="${TAB===k}" onclick="irTab('${k}')">${esc(l)}</button>`).join("");
}
function irTab(k){TAB=k;pintaTabs();render();}

async function recargar(){
  $("view").innerHTML='<div class="center">Cargando…</div>';
  const [pro,cap,prov,bod,cue,cfg,stk,cts,alt,inc,pvt,bdt,cos,pat,varp,pas]=await Promise.all([
    sb.from("cmp_productos").select("*").eq("property_id",SEDE).order("nombre"),
    sb.from("cmp_v_captura_pendiente").select("producto_id").eq("property_id",SEDE),
    sb.from("cmp_v_proveedores_sede").select("*").eq("property_id",SEDE).order("proveedor"),
    sb.from("cmp_v_bodegas").select("id,nombre,ruta,padre_id,nivel,area,raiz").eq("property_id",SEDE).eq("activo",true).order("ruta"),
    sb.from("cmp_v_cuentas").select("*").order("grupo_compra"),
    sb.from("cmp_v_proveedores_config").select("*").order("nombre"),
    sb.from("cmp_v_valor_stock").select("*").eq("property_id",SEDE),
    sb.from("cmp_conteos").select("*").eq("property_id",SEDE).order("periodo_fin",{ascending:false}).limit(40),
    // Las solicitudes de producto nuevo son una sola bandeja: Roberto ve las de las tres casas.
    sb.from("cmp_altas_producto").select("*").order("created_at",{ascending:false}).limit(120),
    // Los incompletos también se ven de todas las casas: quien los completa trabaja en bloque.
    cargaIncompletos(),
    // Para editar en línea productos de cualquier casa hacen falta sus proveedores y bodegas.
    sb.from("cmp_v_proveedores_sede").select("property_id,proveedor_id,proveedor,estado").order("proveedor"),
    sb.from("cmp_v_bodegas").select("id,nombre,ruta,area,property_id,nivel").eq("activo",true).order("ruta"),
    // el costo vigente de cada producto: sale de su presentación preferida, o de la más barata
    sb.from("cmp_v_costo_producto").select("*"),
    sb.from("cmp_presentaciones").select("producto_id,precio_actualizado").not("precio","is",null),
    // Cómo se ha movido el costo real: mediana del último trimestre contra el anterior.
    sb.from("cmp_v_precio_variacion").select("*"),
    // El arbol de pasillos y subpasillos (anaqueles) es del Grupo, no de la sede.
    sb.from("cmp_v_pasillos").select("id,nombre,padre_id,nivel,ruta,orden_ruta,raiz,productos").order("orden_ruta")
  ]);
  PRODS=pro.data||[]; PROVS=prov.data||[]; BODEGAS=(bod.data||[]).map(b=>Object.assign({},b,{nombre:b.ruta||b.nombre,hoja:b.nombre})); CUENTAS=cue.data||[]; CONFIG=cfg.data||[]; STOCK=stk.data||[]; CONTEOS=cts.data||[]; ALTAS=alt.data||[]; INCOM=(inc||[]).filter(x=>(x.faltantes||[]).length); PROV_TODOS=pvt.data||[]; BOD_TODAS=(bdt.data||[]).map(b=>Object.assign({},b,{nombre:b.ruta||b.nombre}));
  const sinPrecio=new Set((cap.data||[]).map(x=>x.producto_id));
  COSTO={}; (cos.data||[]).forEach(c=>COSTO[c.producto_id]=c);
  VARP={}; (varp.data||[]).forEach(v=>VARP[v.producto_id]=v);
  PASILLOS=pas.data||[]; PASMAP={}; PASILLOS.forEach(x=>PASMAP[x.id]=x);
  const at={}; (pat.data||[]).forEach(x=>{
    if(x.precio_actualizado && (!at[x.producto_id] || x.precio_actualizado>at[x.producto_id])) at[x.producto_id]=x.precio_actualizado;
  });
  PRODS.forEach(p=>{p._sinPrecio=sinPrecio.has(p.id); p._precioAt=at[p.id]?String(at[p.id]).slice(0,10):"";});
  pintaTabs();
  render();
}
function render(){
  if(TAB==="productos")  return vProductos();
  if(TAB==="altas")      return vAltas();
  if(TAB==="incompletos")return vIncompletos();
  if(TAB==="precios")    return vPrecios();
  if(TAB==="proveedores")return vProveedores();
  if(TAB==="stock")      return vStock();
  if(TAB==="conteos")    return vConteos();
  if(TAB==="concilia")   return vConcilia();
}

/* ───────── Productos ───────── */
function filtra(){
  return PRODS.filter(p=>{
    if(F.area && p.area!==F.area) return false;
    if(F.tipo && p.tipo!==F.tipo) return false;
    if(F.bodega && p.bodega_id!==F.bodega) return false;
    if(F.solo==="sinprecio" && !p._sinPrecio) return false;
    if(F.solo==="sinminimo" && p.stock_min!=null) return false;
    if(F.solo==="inactivos" && p.activo) return false;
    if(F.solo!=="inactivos" && !p.activo) return false;
    if(F.q && !p.nombre.toLowerCase().includes(F.q.toLowerCase())) return false;
    return true;
  });
}
function vProductos(){
  const l=filtra();
  const sinPrecio=PRODS.filter(p=>p.activo&&p._sinPrecio).length;
  const sinMin=PRODS.filter(p=>p.activo&&p.stock_min==null&&["consumible","blanco","refaccion","herramienta"].includes(p.tipo)).length;
  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${PRODS.filter(p=>p.activo).length}</div><div class="l">productos activos</div></div>
      <div class="kpi"><div class="n" style="color:var(--warn)">${sinPrecio}</div><div class="l">sin precio cargado</div></div>
      <div class="kpi"><div class="n" style="color:var(--muted)">${sinMin}</div><div class="l">sin stock mínimo</div></div>
    </div>
    <div class="filtros">
      <div><label>Buscar</label><input id="fq" value="${esc(F.q)}" placeholder="nombre…" oninput="F.q=this.value;render()"></div>
      <div><label>Área</label><select id="fa" onchange="F.area=this.value;render()">
        <option value="">Todas</option>${AREAS.map(a=>`<option ${F.area===a?"selected":""}>${a}</option>`).join("")}</select></div>
      <div><label>Tipo</label><select onchange="F.tipo=this.value;render()">
        <option value="">Todos</option>${TIPOS.map(t=>`<option ${F.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label>Bodega</label><select onchange="F.bodega=this.value;render()">
        <option value="">Todas</option>${BODEGAS.map(b=>`<option value="${b.id}" ${F.bodega===b.id?"selected":""}>${esc(b.nombre)}</option>`).join("")}</select></div>
      <div style="min-width:auto">${PUEDE?`<button class="btn" onclick="editaProducto()">＋ Nuevo producto</button>`:""}</div>
    </div>
    <div class="chips">
      ${[["todos","Todos"],["sinprecio","Sin precio"],["sinminimo","Sin mínimo"],["inactivos","Dados de baja"]]
        .map(([k,l2])=>`<span class="pill ${F.solo===k?"on":""}" onclick="F.solo='${k}';render()">${l2}</span>`).join("")}
      <span class="muted small">${l.length} resultado(s)</span>

/* Un producto puede caer en más de una cuenta (un mismo jabón: limpieza o amenidades).
   cuenta_id es la de siempre; estas son las otras que el contador puede elegir. */
/* El pasillo es un arbol: el desplegable agrupa por el de arriba y sangra los de dentro.
   Un producto puede colgar del pasillo raiz si no toca subpasillo. */
function optPasillo(sel){
  const raices=PASILLOS.filter(x=>x.nivel===1);
  return `<option value="">— sin pasillo —</option>`+raices.map(r=>{
    const rama=PASILLOS.filter(x=>x.ruta===r.ruta || x.ruta.startsWith(r.ruta+" › "));
    return `<optgroup label="${esc(r.nombre)}">`+rama.map(x=>{
      const sangria="\u00a0\u00a0".repeat(Math.max(0,x.nivel-1));
      const et = x.nivel===1 ? x.nombre+" (todo el pasillo)" : sangria+"› "+x.nombre;
      return `<option value="${x.id}" ${sel===x.id?"selected":""}>${esc(et)}</option>`;
    }).join("")+`</optgroup>`;
  }).join("");
}
const pasRuta=id=>((PASMAP[id]||{}).ruta||"");
const optCuenta=sel=>CUENTAS.map(c=>`<option value="${c.id}" ${sel===c.id?"selected":""}>${esc(c.grupo_compra)} · ${esc(c.codigo)} ${esc(c.cuenta)}</option>`).join("");
function addCtaExtra(sel){
  const box=$("pCtaExtra"); if(!box) return;
  const row=document.createElement("div");
  row.className="ctaextra";
  row.innerHTML=`<select class="ctaX"><option value="">— elegir —</option>${optCuenta(typeof sel==="string"?sel:null)}</select>
    <button type="button" class="btn ghost sm" title="Quitar">✕</button>`;
  row.querySelector("button").onclick=()=>row.remove();
  box.appendChild(row);
}
const ctasExtra=()=>[...document.querySelectorAll("#pCtaExtra .ctaX")].map(s=>s.value).filter(Boolean)
  .filter((v,i,a)=>a.indexOf(v)===i && v!==$("pCta").value);

/* Proveedores asociados: cada uno con su precio. Una fila = una presentación. */
function addProvPrecio(x){
  const box=$("pProvs"); if(!box) return;
  x=x||{};
  const row=document.createElement("div");
  row.className="provfila";
  row.dataset.pres=x.id||"";
  row.innerHTML=`<select class="pvProv"><option value="">— elegir proveedor —</option>${
      PROVS.filter(v=>v.estado!=="baja"||v.proveedor_id===x.proveedor_id)
           .map(v=>`<option value="${v.proveedor_id}" ${x.proveedor_id===v.proveedor_id?"selected":""}>${esc(v.proveedor)}</option>`).join("")}</select>
    <input class="pvPrecio" type="number" step="0.01" min="0" placeholder="precio" value="${x.precio!=null?x.precio:""}">
    <select class="pvModo"><option value="neto">sin IVA</option><option value="bruto">con IVA</option></select>
    <span class="pvEq small muted"></span>
    <button type="button" class="btn ghost sm" title="Quitar">✕</button>`;
  row.querySelector("button").onclick=()=>row.remove();
  row.querySelector(".pvPrecio").oninput=calcIva;
  row.querySelector(".pvModo").onchange=calcIva;
  box.appendChild(row);
  calcIva();
}
/* El precio se guarda SIEMPRE sin IVA (así lo suma el pedido aparte).
   Aquí se puede capturar como venga del proveedor y se ve el equivalente al lado. */
const IVAS=[[16,"16% — lo normal"],[8,"8% — frontera"],[0,"0% — alimentos y exentos"]];
function ivaProd(){ const e=$("pIva"); return e?(parseFloat(e.value)||0):16; }
function netoDeFila(f){
  const v=parseFloat(f.querySelector(".pvPrecio").value);
  if(isNaN(v)) return null;
  const t=ivaProd()/100;
  return f.querySelector(".pvModo").value==="bruto" ? +(v/(1+t)).toFixed(4) : v;
}
function calcIva(){
  const t=ivaProd()/100;
  document.querySelectorAll("#pProvs .provfila").forEach(f=>{
    const eq=f.querySelector(".pvEq"); if(!eq) return;
    const n=netoDeFila(f);
    if(n==null){ eq.textContent=""; return; }
    eq.textContent = t===0 ? "sin IVA"
      : (f.querySelector(".pvModo").value==="bruto" ? "= "+money(n)+" sin IVA" : "= "+money(n*(1+t))+" con IVA");
  });
}
async function guardaProducto(id){
  const nombre=$("pNombre").value.trim();
  if(!nombre) return toast("El nombre es obligatorio");
  const cant=parseFloat($("pCant").value);
  if(!(cant>0)) return toast("La cantidad por envase debe ser mayor que cero");
  const viejo=id?PRODS.find(x=>x.id===id):null;
  const rec={property_id:SEDE,nombre,area:$("pArea").value,
    // tipo y categoría ya no se piden en la ficha: se conservan, y lo nuevo nace como consumible.
    tipo:(viejo&&viejo.tipo)||"consumible",
    categoria:(viejo&&viejo.categoria)||null,
    unidad_base:$("pUni").value,
    stock_min:$("pMin").value!==""?parseFloat($("pMin").value):null,
    bodega_id:$("pBod").value||null,cuenta_id:$("pCta").value||null,
    cuentas_extra:ctasExtra(), tasa_iva_default:ivaProd(),
    pasillo_id:$("pPas").value||null,
    notas:$("pNotas").value.trim()||null,activo:$("pAct").checked};
  const r=id? await sb.from("cmp_productos").update(rec).eq("id",id).select("id").single()
            : await sb.from("cmp_productos").insert(rec).select("id").single();
  if(r.error) return toast(r.error.message);
  const prodId=id||(r.data&&r.data.id);

  // Proveedores y precios: se sincronizan con las presentaciones del producto.
  const filas=[...document.querySelectorAll("#pProvs .provfila")].map(f=>({
    presId:f.dataset.pres||null,
    prov:f.querySelector(".pvProv").value||null,
    precio:netoDeFila(f)
  })).filter(x=>x.prov||x.presId);
  const vivas=filas.filter(x=>x.presId).map(x=>x.presId);
  const {data:actuales}=await sb.from("cmp_presentaciones").select("id").eq("producto_id",prodId);
  for(const a of (actuales||[])) if(!vivas.includes(a.id)) await sb.from("cmp_presentaciones").delete().eq("id",a.id);
  let primera=true;
  for(const f of filas){
    if(!f.prov) continue;
    const pr={producto_id:prodId, proveedor_id:f.prov, precio:f.precio,
      contenido:cant, unidad_contenido:$("pUni").value,
      tipo:cant===1?"pieza":"paquete", preferida:primera, activo:true,
      precio_actualizado:new Date().toISOString().slice(0,10)};
    const e = f.presId ? (await sb.from("cmp_presentaciones").update(pr).eq("id",f.presId)).error
                       : (await sb.from("cmp_presentaciones").insert(pr)).error;
    if(e) return toast("Producto guardado, pero un precio no: "+e.message);
    primera=false;
  }
  toast("Guardado"); closeModal(); await recargar();
}

/* Supabase corta en 1000 filas por consulta: se pide por páginas hasta agotar,
   porque son ~2.500 productos con algún hueco. */
async function cargaIncompletos(){
  const out=[]; const paso=1000;
  for(let i=0;i<6;i++){
    const {data,error}=await sb.from("cmp_v_productos_incompletos").select("*")
      .order("veces_recibido",{ascending:false}).order("id")
      .range(i*paso,(i+1)*paso-1);
    if(error||!data||!data.length) break;
    out.push(...data);
    if(data.length<paso) break;
  }
  return out;
}
/* ───────── Productos incompletos ─────────
   La lista de trabajo para terminar de cablear el catálogo. Ordena por uso real
   (las veces que el insumo se recibió en Poster) para que se empiece por lo que
   de verdad se compra, no por orden alfabético. */
const FALTA_L={proveedor:"proveedor",precio:"precio",cantidad:"cantidad",minimo:"mínimo",cuenta:"cuenta",bodega:"bodega",pasillo:"pasillo"};
function incFiltrados(){
  let l=INCOM.slice();
  if(FI.ubic)  l=l.filter(x=>x.property_id===FI.ubic);
  if(FI.area)  l=l.filter(x=>(x.cuenta_grupo||"(sin cuenta)")===FI.area);
  if(FI.prov==="__sin") l=l.filter(x=>!(x.proveedores||[]).length);
  else if(FI.prov)      l=l.filter(x=>(x.proveedores||[]).includes(FI.prov));
  if(FI.falta==="__huerfano") l=l.filter(x=>x.huerfano);
  else if(FI.falta)           l=l.filter(x=>(x.faltantes||[]).includes(FI.falta));
  if(FI.q){ const q=sinTilde(FI.q); l=l.filter(x=>sinTilde(x.nombre).includes(q)); }
  if(FI.orden==="nombre")     l.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  else if(FI.orden==="huecos")l.sort((a,b)=>(b.faltantes||[]).length-(a.faltantes||[]).length||b.veces_recibido-a.veces_recibido);
  else l.sort((a,b)=>b.veces_recibido-a.veces_recibido||a.nombre.localeCompare(b.nombre));
  return l;
}
function setFI(k,v){ FI[k]=v; vIncompletos(); }

        <th>Producto</th><th>Casa</th><th class="num">Uso</th><th>Pasillo</th>
        <th>Proveedor</th><th class="num">Precio</th><th>Contenido</th>

      </tr></thead>
      <tbody>${l.length?l.slice(0,400).map(filaInc).join(""):'<tr><td colspan="11" class="center">Nada con ese filtro. 👌</td></tr>'}</tbody>
    </table></div></div>
    ${l.length>400?'<div class="small muted" style="margin-top:8px">Mostrando los primeros 400. Afina el filtro.</div>':""}`;

/* Cada celda dice en qué estado está su dato:
     en firme  -> texto plano, no se toca
     sugerido  -> pastilla con lo que sabemos del historial, para confirmar de un toque
     vacío     -> pastilla con guion, para elegirlo ahí mismo */
function celda(x,campo,firme,sugerido){
  if(firme!=null && firme!=="") return firme;
  if(!PUEDE) return '<span class="muted">—</span>';
  const ttl = sugerido ? "Sugerido por el historial: toca para confirmar o cambiar" : "Toca para elegir";
  return `<button class="pill${sugerido?" sug":""}" title="${esc(ttl)}" onclick="editaInc('${x.id}','${campo}',this)">${sugerido||"—"}</button>`;
}
function filaInc(x){
  return `<tr data-inc="${x.id}">${celdasInc(x)}</tr>`;
}

  const prov  = (x.proveedores||[]).length ? esc(x.proveedores.join(", ")) : null;

  const prec  = x.precio_min!=null ? money(x.precio_min) : null;
  const pcSug = x.costo_sugerido!=null ? money(x.costo_sugerido) : null;
  const cont  = x.contenido!=null ? num(x.contenido)+" "+esc(x.unidad_base||"") : null;
  const min   = x.stock_min!=null ? num(x.stock_min)+" "+esc(x.unidad_base||"") : null;
  const cta   = x.cuenta_grupo ? esc(x.cuenta_grupo)+`<div class="muted">${esc(x.cuenta_codigo||"")}</div>` : null;

    <td class="small">${celda(x,"proveedor",prov,prSug)}</td>
    <td class="num small">${celda(x,"precio",prec,pcSug)}</td>
    <td class="small">${celda(x,"cantidad",cont,null)}</td>
    <td class="num small">${celda(x,"minimo",min,null)}</td>
    <td class="small">${celda(x,"bodega",x.bodega_nombre?esc(x.bodega_nombre):null,null)}</td>
    <td class="small">${celda(x,"cuenta",cta,null)}</td>

/* Rellenar sin abrir la ficha: se toca el hueco y sale el campo justo ahí.

const provsDe=pid=>PROV_TODOS.filter(v=>v.property_id===pid && v.estado!=="baja");
const bodsDe =pid=>BOD_TODAS.filter(b=>b.property_id===pid);
function editaInc(id,campo,btn){

  const cont=document.createElement("span");

      l.map(v=>`<option value="${v.proveedor_id}" ${v.proveedor_id===x.proveedor_id_sugerido?"selected":""}>${esc(v.proveedor)}</option>`).join("");
    if(!l.length) el.innerHTML=`<option value="">— ${esc(x.sede)} no tiene proveedores dados de alta —</option>`;
  } else if(campo==="cuenta"){
    el=document.createElement("select");

  } else if(campo==="pasillo"){

      bodsDe(x.property_id).map(b=>`<option value="${b.id}">${esc(b.nombre)}</option>`).join("");
  } else {
    el=document.createElement("input");

    el.placeholder = campo==="precio" ? "precio sin IVA" : campo==="cantidad" ? "por envase" : "mínimo";
    if(campo==="precio" && x.costo_sugerido!=null) el.value=(+x.costo_sugerido).toFixed(2);
    if(campo==="cantidad") el.value="1";
  }
  el.className="inlinein";
  const btnOk=document.createElement("button");
  btnOk.className="btn sm"; btnOk.textContent="✓";
  btnOk.onclick=()=>guardaInc(id,campo,el.value,cerrar);
  const btnNo=document.createElement("button");
  btnNo.className="btn ghost sm"; btnNo.textContent="✕"; btnNo.onclick=cerrar;
  cont.append(el,btnOk,btnNo);
  btn.replaceWith(cont);
  el.focus();
  el.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();btnOk.click();} if(e.key==="Escape") cerrar(); };
  if(el.tagName==="SELECT") el.onchange=()=>btnOk.click();
}
async function guardaInc(id,campo,valor,cerrar){
  const x=INCOM.find(y=>y.id===id); if(!x) return;
  if(valor===""||valor==null) return toast("Elige un valor o cierra con ✕.");
  const num1=parseFloat(valor);
  try{
    if(campo==="minimo"||campo==="cuenta"||campo==="bodega"||campo==="pasillo"){
      const patch = campo==="minimo" ? {stock_min:num1}
                  : campo==="cuenta" ? {cuenta_id:valor}
                  : campo==="pasillo"? {pasillo_id:valor} : {bodega_id:valor};
      const {error}=await sb.from("cmp_productos").update(patch).eq("id",id);
      if(error) return toast(error.message);
      if(campo==="minimo") x.stock_min=num1;
      if(campo==="bodega"){ const b=bodsDe(x.property_id).find(z=>z.id===valor); x.bodega_id=valor; x.bodega_nombre=b&&b.nombre; }
      if(campo==="pasillo"){ x.pasillo_id=valor; x.pasillo_ruta=pasRuta(valor); }
      if(campo==="cuenta"){
        const c=CUENTAS.find(z=>z.id===valor);
        x.cuenta_id=valor; x.cuenta_grupo=c&&c.grupo_compra; x.cuenta_codigo=c&&c.codigo;
      }
    } else {
      // proveedor, precio y cantidad viven en la presentación
      const {data:ps}=await sb.from("cmp_presentaciones").select("*").eq("producto_id",id).order("precio").limit(1);
      const cur=(ps||[])[0]||null;
      const rec = campo==="proveedor" ? {proveedor_id:valor}
                : campo==="precio"    ? {precio:num1, precio_actualizado:new Date().toISOString().slice(0,10)}
                                      : {contenido:num1, tipo:num1===1?"pieza":"paquete"};
      if(cur){
        const {error}=await sb.from("cmp_presentaciones").update(rec).eq("id",cur.id);
        if(error) return toast(error.message);
      }else{
        const base={producto_id:id, contenido:1, unidad_contenido:x.unidad_base||"pza",
                    tipo:"pieza", preferida:true, activo:true};
        const {error}=await sb.from("cmp_presentaciones").insert(Object.assign(base,rec));
        if(error) return toast(error.message);
      }
      if(campo==="proveedor"){
        const v=provsDe(x.property_id).find(z=>z.proveedor_id===valor);
        x.proveedores=[v?v.proveedor:"(proveedor)"]; x.n_prov=1;
      }
      if(campo==="precio")   { x.precio_min=num1; x.n_precio=1; }
      if(campo==="cantidad") { x.contenido=num1; }
    }
  }catch(e){ return toast(String(e.message||e)); }
  x.faltantes=(x.faltantes||[]).filter(f=>f!==campo);
  x.huerfano = !x.n_prov && !x.n_precio && x.contenido==null && x.stock_min==null;
  cerrar();
  const tr=document.querySelector(`tr[data-inc="${id}"]`);
  if(tr) tr.innerHTML=celdasInc(x);
  pintaTabs();   // la fila se queda a la vista, ya en texto, para ver que quedó lista
  toast(x.faltantes.length?"Guardado":"Producto completo ✅");
}

function chipVar(prodId){
  const v=VARP[prodId]; if(!v) return "";
  if(v.capturas_dudosas) return ` <span class="chip c-warn" title="En el historial hay capturas por unidad y por envase mezcladas: el % no sería de fiar.">capturas mezcladas</span>`;
  if(v.var_pct==null) return "";
  const n=+v.var_pct;
  if(Math.abs(n)<3) return ` <span class="chip" title="${v.puntos} compras registradas">estable</span>`;
  const cl=n>0?"c-warn":"c-ok";
  return ` <span class="chip ${cl}" title="Mediana de los últimos 90 días contra la del trimestre anterior · ${v.puntos} compras">${n>0?"↑":"↓"}${Math.abs(n)}%</span>`;
}

/* Una curva sencilla, sin librerías: los puntos de Poster en orden. */
function curvaSVG(l){
  const pts=l.filter(x=>x.fuente==="poster"&&x.costo_unidad!=null)
             .map(x=>({d:x.fecha,v:+x.costo_unidad})).reverse();
  if(pts.length<3) return "";
  const W=560,H=120,P=8;
  const vs=pts.map(p=>p.v), lo=Math.min(...vs), hi=Math.max(...vs), rg=(hi-lo)||1;
  const d=pts.map((p,i)=>{
    const x=P+(i*(W-2*P))/(pts.length-1||1);
    const y=H-P-((p.v-lo)/rg)*(H-2*P);
    return (i?"L":"M")+x.toFixed(1)+" "+y.toFixed(1);
  }).join(" ");
  return `<div class="card" style="margin-top:0;padding:10px">
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:120px" role="img" aria-label="Evolución del costo">
      <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    </svg>
    <div class="small muted" style="display:flex;justify-content:space-between">
      <span>${esc(pts[0].d)} · ${money(pts[0].v)}</span>
      <span>${esc(pts[pts.length-1].d)} · ${money(pts[pts.length-1].v)}</span>
    </div></div>`;
}

  const dentro=new Set(STOCK.filter(x=>x.bodega_id===bodId).map(x=>x.producto_id));
  modal(`<h3 style="margin:0 0 4px">Productos de ${esc(b.nombre)}</h3>
    <div class="small muted" style="margin-bottom:10px">Marca lo que también se guarda aquí. Sin proveedor ni precio: eso va después.
      Si no existe en el catálogo, créalo abajo.</div>
    <input id="bqBusca" placeholder="Buscar en el catálogo…" oninput="pintaPick('${bodId}')">
    <div class="small muted" style="margin:6px 0"><span id="bqCuenta"></span></div>
    <div class="scroll" style="max-height:44vh"><div id="bqLista"></div></div>
    <div class="foot" style="flex-wrap:wrap">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn ghost" onclick="nuevoEnBodega('${bodId}')">＋ Crear producto nuevo aquí</button>
      <button class="btn" onclick="guardaPoblar('${bodId}')">Añadir los marcados</button>
    </div>`);
  window._BDENTRO=dentro;
  pintaPick(bodId);
}
function pintaPick(bodId){
  const q=sinTilde(($("bqBusca")||{}).value||"");
  const dentro=window._BDENTRO||new Set();
  const l=PRODS.filter(p=>p.activo!==false && !dentro.has(p.id) && (!q || sinTilde(p.nombre).includes(q)));
  $("bqCuenta").textContent = q ? l.length+" en el catálogo sin esta bodega" : l.length+" productos se pueden añadir · escribe para filtrar";
  $("bqLista").innerHTML = l.slice(0,200).map(p=>`
    <label class="picklinea">
      <input type="checkbox" ${BPICK.has(p.id)?"checked":""} onchange="BPICK.has('${p.id}')?BPICK.delete('${p.id}'):BPICK.add('${p.id}')">
      <span><b>${esc(p.nombre)}</b><span class="small muted"> · ${esc(p.area||"")}${p.pasillo_id?" · "+esc(pasRuta(p.pasillo_id)):(p.categoria?" · "+esc(p.categoria):"")}</span></span>
    </label>`).join("") || '<div class="center muted" style="padding:14px">Nada que añadir con esa búsqueda.</div>';
  if(l.length>200) $("bqLista").innerHTML+='<div class="small muted" style="padding:8px">Mostrando 200. Afina la búsqueda.</div>';
}
async function guardaPoblar(bodId){
  const ids=[...BPICK];
  if(!ids.length) return toast("No marcaste ninguno.");
  const {data,error}=await sb.rpc("cmp_bodega_agrega",{p_bodega:bodId,p_productos:ids});
  if(error) return toast(error.message);
  closeModal(); toast((data||0)+" producto"+((data||0)===1?"":"s")+" en la bodega");
  FBOD=bodId; await recargar();
}
function nuevoEnBodega(bodId){
  const b=BODEGAS.find(x=>x.id===bodId)||{};
  modal(`<h3 style="margin:0 0 8px">Producto nuevo en ${esc(b.nombre||"")}</h3>
    <div class="small muted" style="margin-bottom:10px">Lo mínimo para poder contarlo. El proveedor y el precio se cargan después en Incompletos.</div>
    <div class="grid2">
      <div class="full"><label>Nombre</label><input id="nbNom" placeholder="Ej. Jerga gruesa"></div>
      <div><label>Se mide en</label><select id="nbUni">${UNIDADES.map(u=>`<option>${u}</option>`).join("")}</select></div>
      <div><label>Área</label><select id="nbArea">${AREAS.map(a=>`<option ${b.area===a?"selected":""}>${a}</option>`).join("")}</select></div>
      <div class="full"><label>Pasillo <span class="muted small">opcional</span></label>
        <select id="nbPas">${optPasillo(null)}</select></div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="poblarBodega('${bodId}')">Volver</button>
      <button class="btn" onclick="guardaNuevoEnBodega('${bodId}')">Crear y meter aquí</button></div>`);
}
async function guardaNuevoEnBodega(bodId){
  const nombre=($("nbNom").value||"").trim();
  if(!nombre) return toast("Ponle nombre.");
  const b=BODEGAS.find(x=>x.id===bodId)||{};
  const {data,error}=await sb.from("cmp_productos").insert({
    property_id:SEDE, nombre, area:$("nbArea").value, tipo:"consumible",
    pasillo_id:$("nbPas").value||null,
    unidad_base:$("nbUni").value, bodega_id:bodId, activo:true
  }).select("id").single();
  if(error) return toast(error.message);
  const r=await sb.rpc("cmp_bodega_agrega",{p_bodega:bodId,p_productos:[data.id]});
  if(r.error) return toast("Creado, pero no entró a la bodega: "+r.error.message);
  closeModal(); toast("«"+nombre+"» creado y metido en "+(b.nombre||"la bodega"));
  FBOD=bodId; await recargar();
}
async function quitaDeBodega(bodId,prodId){
  const {data,error}=await sb.rpc("cmp_bodega_quita",{p_bodega:bodId,p_producto:prodId});
  if(error) return toast(error.message);
  if(data!=="ok") return toast(data);
  toast("Fuera de esta bodega"); await recargar();
}
function editaBodega(id){
  const b=id?BODEGAS.find(x=>x.id===id):{tipo:"almacen",activo:true};
  modal(`<h3 style="margin:0 0 8px">${id?"Editar bodega":"Nueva bodega"}</h3>
    <div class="grid2">
      <div class="full"><label>Nombre</label><input id="bNom" value="${esc(b.nombre||"")}"></div>
      <div><label>Tipo</label><select id="bTipo">${["almacen","cocina","barra","otro"].map(t=>`<option ${b.tipo===t?"selected":""}>${t}</option>`).join("")}</select></div>
      <div><label>Área</label><select id="bArea">${AREAS.map(a=>`<option ${b.area===a?"selected":""}>${a}</option>`).join("")}</select></div>
      <div class="full"><label>Depende de <span class="muted small">(déjalo vacío si es una bodega principal)</span></label>
        <select id="bPadre"><option value="">— es una bodega principal —</option>${
          BODEGAS.filter(x=>x.id!==id).map(x=>`<option value="${x.id}" ${b.padre_id===x.id?"selected":""}>${esc(x.nombre)}</option>`).join("")}</select></div>
      <div><label><input type="checkbox" id="bServ" ${b.es_servicio?"checked":""}> Bodega de servicio (de aquí descuentan las ventas)</label></div>
      <div><label><input type="checkbox" id="bBlan" ${b.es_blancos?"checked":""}> Bodega de blancos</label></div>
      <div class="full"><label>Responsable</label><input id="bJefe" value="${esc(b.jefe_nombre||"")}"></div>
    </div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn" onclick="guardaBodega(${id?"'"+id+"'":"null"})">Guardar</button></div>`);
}
async function guardaBodega(id){
  const nombre=$("bNom").value.trim(); if(!nombre) return toast("El nombre es obligatorio");
  const rec={property_id:SEDE,nombre,tipo:$("bTipo").value,area:$("bArea").value,
    padre_id:($("bPadre")&&$("bPadre").value)||null,
    es_servicio:$("bServ").checked,es_blancos:$("bBlan").checked,
    jefe_nombre:$("bJefe").value.trim()||null,activo:true};
  const r=id? await sb.from("pos_almacenes").update(rec).eq("id",id)
            : await sb.from("pos_almacenes").insert(rec);
  if(r.error) return toast(r.error.message);
  toast("Bodega guardada"); closeModal(); await recargar();
}

/* ───────── Conteos periódicos ───────── */
async function abrirConteo(bodegaId){
  const {data,error}=await sb.rpc("cmp_abrir_conteo",{p_bodega:bodegaId,p_fecha:new Date().toISOString().slice(0,10),p_nombre:EMAIL});
  if(error) return toast(error.message);
  toast("Conteo abierto"); await recargar(); TAB="conteos"; pintaTabs(); capturaConteo(data);
}
function vConteos(){
  $("view").innerHTML=`
    <div class="avisos">Un conteo por bodega y quincena (del 1 al 15 y del 16 a fin de mes). Al cerrarlo, la diferencia contra el sistema entra al kardex como ajuste y queda la merma valorizada.</div>
    <div class="card"><h3>Conteos</h3><div class="scroll"><table>
      <thead><tr><th>Bodega</th><th>Periodo</th><th>Estado</th><th>Contó</th><th class="num">Líneas</th><th></th></tr></thead>
      <tbody>${CONTEOS.length?CONTEOS.map(c=>{
        const b=BODEGAS.find(x=>x.id===c.bodega_id);
        return `<tr><td><b>${esc(b?b.nombre:"—")}</b></td>
          <td class="small">${c.periodo_inicio} → ${c.periodo_fin}</td>
          <td>${c.estado==="cerrado"?'<span class="chip c-ok">cerrado</span>':'<span class="chip c-warn">abierto</span>'}</td>
          <td class="small">${esc(c.contado_por_nombre||"")}</td>
          <td class="num" id="cn-${c.id}">…</td>
          <td class="num"><button class="btn ghost sm" onclick="capturaConteo('${c.id}')">${c.estado==="cerrado"?"Ver":"Capturar"}</button></td></tr>`;
      }).join(""):'<tr><td colspan="6" class="center">Aún no hay conteos. Ábrelo desde la pestaña Stock, botón «Contar».</td></tr>'}</tbody>
    </table></div></div>`;
  CONTEOS.forEach(async c=>{ const {count}=await sb.from("cmp_conteo_items").select("id",{count:"exact",head:true}).eq("conteo_id",c.id);
    const el=$("cn-"+c.id); if(el) el.textContent=count||0; });
}
async function capturaConteo(id){
  const c=CONTEOS.find(x=>x.id===id)||{};
  const {data}=await sb.from("cmp_v_conteo_vs_anterior").select("*").eq("conteo_id",id).order("producto");
  const l=data||[];
  const cerrado=c.estado==="cerrado";
  modal(`<h3 style="margin:0 0 4px">Conteo · ${esc((BODEGAS.find(b=>b.id===c.bodega_id)||{}).nombre||"")}</h3>
    <div class="small muted" style="margin-bottom:8px">${c.periodo_inicio} → ${c.periodo_fin}${c.periodo_anterior?" · anterior: "+c.periodo_anterior:""}</div>
    <div class="card" style="margin-top:0"><div class="scroll"><table>
      <thead><tr><th>Producto</th><th class="num">Sistema</th><th class="num">Teórico</th><th class="num">Contado</th><th class="num">vs anterior</th><th class="num">Merma $</th></tr></thead>
      <tbody>${l.map(x=>`<tr data-p="${x.producto_id}">
        <td>${esc(x.producto)}<div class="small muted">${esc(x.familia||"")} · ${esc(x.unidad_base)}</div></td>
        <td class="num">${num(x.cantidad_sistema)}</td>
        <td class="num small">${x.cantidad_teorica!=null?num(x.cantidad_teorica):"—"}</td>
        <td class="num">${cerrado?num(x.cantidad_contada):`<input class="mini cc" type="number" step="0.01" min="0" value="${x.cantidad_contada!=null?x.cantidad_contada:""}">`}</td>
        <td class="num small" style="color:${(+x.vs_anterior||0)<0?"var(--bad)":"var(--muted)"}">${x.vs_anterior!=null?num(x.vs_anterior):"—"}</td>
        <td class="num small">${x.merma_valor!=null?money(x.merma_valor):"—"}</td></tr>`).join("")}
      </tbody></table></div></div>
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button>
      ${cerrado?"":`<button class="btn ghost" onclick="guardaConteo('${id}',false)">Guardar avance</button>
        <button class="btn" onclick="guardaConteo('${id}',true)">Cerrar conteo y ajustar</button>`}</div>`);
}
async function guardaConteo(id,cerrar){
  for(const tr of document.querySelectorAll('#modal tbody tr[data-p]')){
    const inp=tr.querySelector(".cc"); if(!inp||inp.value==="") continue;
    await sb.from("cmp_conteo_items").update({cantidad_contada:parseFloat(inp.value)})
      .eq("conteo_id",id).eq("producto_id",tr.dataset.p);
  }
  if(cerrar){
    const {data,error}=await sb.rpc("cmp_cerrar_conteo",{p_conteo:id,p_nombre:EMAIL});
    if(error) return toast(error.message);
    toast(`Conteo cerrado · ${data} ajuste(s) al inventario`);
  } else toast("Avance guardado");
  closeModal(); await recargar();
}

/* ───────── Conciliación A&B ───────── */
async function vConcilia(){
  const {data}=await sb.from("cmp_v_conciliacion_ayb").select("*").eq("property_id",SEDE).order("semana",{ascending:false}).limit(60);
  const l=data||[];
  $("view").innerHTML=`
    <div class="avisos">Compras de alimentos y bebidas de la semana contra lo que las ventas dicen que debió consumirse. La diferencia es lo que se compró de más (o de menos) respecto al consumo teórico.</div>
    <div class="card"><h3>Semana a semana</h3><div class="scroll"><table>
      <thead><tr><th>Semana</th><th>Familia</th><th class="num">Compras</th><th class="num">Consumo teórico</th><th class="num">Diferencia</th><th class="num">Venta A&B</th><th class="num">Compras / venta</th></tr></thead>
      <tbody>${l.length?l.map(x=>`<tr>
        <td class="small">${x.semana}</td><td>${esc(x.familia||"")}</td>
        <td class="num">${money(x.compras_valor)}</td>
        <td class="num">${money(x.consumo_valor)}</td>
        <td class="num" style="color:${(+x.diferencia_valor||0)>0?"var(--warn)":"var(--muted)"}">${money(x.diferencia_valor)}</td>
        <td class="num">${money(x.venta_total)}</td>
        <td class="num">${x.compras_pct_venta!=null?x.compras_pct_venta+"%":"—"}</td></tr>`).join("")
        :'<tr><td colspan="7" class="center">Todavía no hay movimientos de compra registrados para conciliar.</td></tr>'}</tbody>
    </table></div></div>`;
}

boot();
</script>
</body></html>
