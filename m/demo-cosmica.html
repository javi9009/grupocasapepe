<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba · Portal Menú Cósmica</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.osw{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
.aviso{background:var(--alerta-bg);color:var(--alerta);font-family:Oswald;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.08em;text-align:center;padding:7px 14px;border-bottom:1px solid #E7D7B4}

nav{background:var(--tinta);padding:13px 18px}
nav .in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:14px}
nav .marca{font-family:Oswald;font-weight:700;font-size:18px;color:#fff;letter-spacing:.05em;text-transform:uppercase}
nav .sep{color:#6E665C}
nav .sub{font-family:'Lobster Two',cursive;font-size:16px;color:var(--rosa)}
nav .user{margin-left:auto;color:#C9C2B8;font-size:12.5px}

.wrap{max-width:900px;margin:0 auto;padding:24px 18px 80px}

/* barra de pasos */
.pasos{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap}
.paso{flex:1;min-width:120px;border-top:3px solid var(--linea);padding-top:8px}
.paso.on{border-top-color:var(--naranja)}
.paso.hecho{border-top-color:var(--ok)}
.paso .n{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.09em;color:var(--gris);text-transform:uppercase}
.paso .t{font-family:Oswald;font-weight:600;font-size:13px;margin-top:2px}
.paso.on .t{color:var(--naranja-oscuro)}

.tarj{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:22px 24px;margin-bottom:16px}
.tarj h2{font-size:18px;font-weight:600}
.tarj p{color:var(--tinta-2);font-size:14.5px;line-height:1.6;margin:10px 0 0}
.tarj .ayuda{color:var(--gris);font-size:13px;margin-top:6px;line-height:1.5}

.opciones{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:18px}
.op{background:var(--papel);border:1.5px solid var(--linea);border-radius:12px;padding:16px 17px;cursor:pointer;
  text-align:left;font:inherit;color:inherit;transition:border-color .12s,transform .12s}
.op:hover{border-color:var(--naranja);transform:translateY(-2px)}
.op[aria-pressed="true"]{border-color:var(--naranja);background:var(--naranja-suave)}
.op .t{font-family:Oswald;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.op .d{color:var(--gris);font-size:12.8px;line-height:1.5;margin-top:5px}

.campo{margin-top:16px}
.campo label{font-family:Oswald;font-weight:600;font-size:11px;letter-spacing:.09em;color:var(--gris);
  text-transform:uppercase;display:block;margin-bottom:5px}
.campo input,.campo select{width:100%;border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;
  font:inherit;background:var(--blanco);color:var(--tinta)}
.campo input:focus,.campo select:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}

.menu-sec{margin-top:18px}
.menu-sec h3{font-size:12px;color:var(--gris);letter-spacing:.09em}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin-top:9px}
.item{background:var(--papel);border:1.5px solid var(--linea);border-radius:10px;padding:11px 13px;cursor:pointer;
  text-align:left;font:inherit;color:inherit}
.item[aria-pressed="true"]{border-color:var(--ok);background:var(--ok-bg)}
.item .n{font-size:13.5px;font-weight:600;line-height:1.3}
.item .p{font-family:Oswald;font-weight:600;font-size:13px;color:var(--gris);margin-top:4px}

.resumen{background:var(--cielo-suave);border:1px solid #C9E2F2;border-radius:12px;padding:16px 18px;margin-top:16px}
.resumen h3{font-size:12px;color:#1F5B7A;letter-spacing:.09em}
.resumen ul{margin:9px 0 0;padding-left:19px;font-size:13.5px;line-height:1.65;color:var(--tinta-2)}
.resumen li b{font-weight:600}

.btn{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
  padding:11px 20px;border-radius:9px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn.fan{background:transparent;color:var(--naranja-oscuro)}
.btn.mag{border-color:var(--magenta);background:var(--magenta)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
.total{font-family:Oswald;font-weight:700;font-size:22px;margin-left:auto;align-self:center}
.nota{background:var(--hueso);border:1px solid var(--linea);border-radius:10px;padding:12px 14px;
  font-size:13px;line-height:1.55;color:var(--tinta-2);margin-top:14px}
</style>
</head><body>

<div class="aviso">Pantalla de prueba · el menú es el real de La Cósmica · el alta no guarda nada</div>

<nav><div class="in">
  <span class="marca">La Cósmica</span><span class="sep">·</span>
  <span class="sub">menú de experiencias</span>
  <span class="user">Entras con tu usuario de touroperador de la plataforma</span>
</div></nav>

<div class="wrap">
  <div class="pasos" id="pasos"></div>
  <div id="vista"></div>
</div>

<script>
(function(){
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mx(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function sesion(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
var SES=sesion();
function hdr(){return {'apikey':KEY,'Authorization':'Bearer '+((SES&&SES.access_token)||KEY)};}

var PASOS=[['Cuenta','Quién eres'],['Experiencia','¿Ya la tienes?'],['Dónde','¿Sale de la Cósmica?'],
           ['Menú','Qué se sirve'],['Listo','Lo que se precarga']];
var S={paso:0, tieneExp:null, expElegida:'', nombreNueva:'', enCosmica:null, sel:{}, menu:[], exps:[]};

function pintaPasos(){
  document.getElementById('pasos').innerHTML=PASOS.map(function(p,i){
    var cls = i===S.paso?'paso on':(i<S.paso?'paso hecho':'paso');
    return '<div class="'+cls+'"><div class="n">Paso '+(i+1)+'</div><div class="t">'+esc(p[0])+'</div></div>';
  }).join('');
}

function ir(n){ S.paso=n; pintaPasos(); pinta(); window.scrollTo({top:0,behavior:'smooth'}); }

function pinta(){
  var v=document.getElementById('vista');
  if(S.paso===0){
    v.innerHTML='<div class="tarj"><h2>Entra o date de alta</h2>'+
      '<p>Se entra con el <b>mismo usuario de touroperador</b> de la plataforma. Si ya tienes cuenta para subir tus tours, esa misma sirve aquí; no hay un alta aparte.</p>'+
      '<div class="campo"><label>Correo</label><input type="email" id="mail" placeholder="tu@operadora.mx" value="hola@operadora.mx"></div>'+
      '<div class="campo"><label>Operadora</label><input id="op" value="Operadora de muestra"></div>'+
      '<div class="btns"><button class="btn" id="b0">Entrar</button>'+
      '<button class="btn fan" id="b0b">Crear cuenta de touroperador</button></div>'+
      '<div class="nota">El alta de touroperador es la misma de siempre: expediente, contrato y cuenta de cobro. Este portal solo le añade el menú.</div></div>';
    document.getElementById('b0').onclick=function(){ir(1);};
    document.getElementById('b0b').onclick=function(){ir(1);};
    return;
  }
  if(S.paso===1){
    var lista=S.exps.map(function(e){return '<option value="'+esc(e.nombre)+'">'+esc(e.nombre)+'</option>';}).join('');
    v.innerHTML='<div class="tarj"><h2>¿Ya tienes tu experiencia creada?</h2>'+
      '<p>Antes de elegir el menú hay que saber a qué experiencia se le cuelga. Si todavía no existe, la creamos ahora y el menú se le queda pegado.</p>'+
      '<div class="opciones">'+
        '<button class="op" data-v="si" aria-pressed="'+(S.tieneExp==='si')+'"><div class="t">Sí, ya está creada</div>'+
          '<div class="d">La eliges de tu catálogo y el menú se le suma como un paso más.</div></button>'+
        '<button class="op" data-v="no" aria-pressed="'+(S.tieneExp==='no')+'"><div class="t">Todavía no</div>'+
          '<div class="d">La damos de alta aquí mismo, con lo mínimo, y luego la terminas.</div></button>'+
      '</div>'+
      '<div id="sub"></div>'+
      '<div class="btns"><button class="btn fan" id="atras">Atrás</button>'+
        '<button class="btn" id="sig" disabled>Continuar</button></div></div>';
    function sub(){
      var s=document.getElementById('sub');
      if(S.tieneExp==='si'){
        s.innerHTML='<div class="campo"><label>Cuál de tus experiencias</label><select id="pick">'+lista+'</select></div>';
        S.expElegida=S.expElegida||(S.exps[0]&&S.exps[0].nombre)||'';
        var p=document.getElementById('pick'); if(p){p.value=S.expElegida; p.onchange=function(){S.expElegida=p.value;};}
      }else if(S.tieneExp==='no'){
        s.innerHTML='<div class="campo"><label>Nombre de la experiencia nueva</label>'+
          '<input id="nom" placeholder="Taller de barro en el Centro" value="'+esc(S.nombreNueva)+'"></div>'+
          '<div class="nota">Con el nombre basta para seguir. El resto de la ficha —relato, paradas, precio— lo llenas después en el editor de siempre.</div>';
        var n=document.getElementById('nom'); if(n)n.oninput=function(){S.nombreNueva=n.value;};
      }else s.innerHTML='';
      document.getElementById('sig').disabled = !S.tieneExp;
    }
    Array.prototype.forEach.call(v.querySelectorAll('.op'),function(b){
      b.onclick=function(){
        S.tieneExp=b.dataset.v;
        Array.prototype.forEach.call(v.querySelectorAll('.op'),function(o){
          o.setAttribute('aria-pressed',String(o===b));});
        sub();
      };
    });
    sub();
    document.getElementById('atras').onclick=function(){ir(0);};
    document.getElementById('sig').onclick=function(){ir(2);};
    return;
  }
  if(S.paso===2){
    v.innerHTML='<div class="tarj"><h2>¿La experiencia se hace en La Cósmica?</h2>'+
      '<p>Esto cambia el orden de todo. Si la experiencia <b>sale o termina en La Cósmica</b>, primero eliges el menú y después te mandamos a armar la experiencia con esa selección ya cargada y con los puntos de inicio y final puestos.</p>'+
      '<div class="opciones">'+
        '<button class="op" data-v="si" aria-pressed="'+(S.enCosmica===true)+'"><div class="t">Sí, en La Cósmica</div>'+
          '<div class="d">Eliges menú → te llevamos a armar la experiencia con todo precargado.</div></button>'+
        '<button class="op" data-v="no" aria-pressed="'+(S.enCosmica===false)+'"><div class="t">No, en otro lugar</div>'+
          '<div class="d">El menú se suma a tu experiencia como un extra y sigues con el alta normal.</div></button>'+
      '</div>'+
      '<div class="btns"><button class="btn fan" id="atras">Atrás</button>'+
        '<button class="btn" id="sig" disabled>Continuar</button></div></div>';
    Array.prototype.forEach.call(v.querySelectorAll('.op'),function(b){
      b.onclick=function(){
        S.enCosmica = b.dataset.v==='si';
        Array.prototype.forEach.call(v.querySelectorAll('.op'),function(o){
          o.setAttribute('aria-pressed',String(o===b));});
        document.getElementById('sig').disabled=false;
      };
    });
    document.getElementById('atras').onclick=function(){ir(1);};
    document.getElementById('sig').onclick=function(){ir(3);};
    return;
  }
  if(S.paso===3){
    var orden=['paquete','montaje','comida','bebidas','taller','bienvenida','especial'];
    var titulos={paquete:'Paquetes',montaje:'Montaje',comida:'Alimentos',bebidas:'Bebidas',
                 taller:'Talleres',bienvenida:'Solo bienvenida',especial:'Menú especial'};
    var secs=orden.filter(function(k){return S.menu.some(function(m){return m.seccion===k;});});
    v.innerHTML='<div class="tarj"><h2>El menú</h2>'+
      '<p>Lo que se le sirve a tu grupo. Puedes elegir varias cosas; el total se calcula por persona.</p>'+
      secs.map(function(k){
        var items=S.menu.filter(function(m){return m.seccion===k;});
        return '<div class="menu-sec"><h3>'+esc(titulos[k]||k)+'</h3><div class="items">'+
          items.map(function(m){
            return '<button class="item" data-id="'+esc(m.id)+'" aria-pressed="'+(!!S.sel[m.id])+'">'+
              '<div class="n">'+esc(m.nombre)+'</div>'+
              '<div class="p">'+(m.precio_mxn?mx(m.precio_mxn):'a cotizar')+'</div></button>';
          }).join('')+'</div></div>';
      }).join('')+
      '<div class="btns"><button class="btn fan" id="atras">Atrás</button>'+
        '<button class="btn" id="sig">Continuar</button>'+
        '<span class="total" id="tot"></span></div></div>';
    function tot(){
      var t=Object.keys(S.sel).reduce(function(a,id){
        var m=S.menu.find(function(x){return String(x.id)===String(id);});
        return a+(m&&Number(m.precio_mxn)||0);},0);
      document.getElementById('tot').textContent = t?mx(t)+' / persona':'';
    }
    Array.prototype.forEach.call(v.querySelectorAll('.item'),function(b){
      b.onclick=function(){
        var id=b.dataset.id;
        if(S.sel[id])delete S.sel[id]; else S.sel[id]=true;
        b.setAttribute('aria-pressed',String(!!S.sel[id]));
        tot();
      };
    });
    tot();
    document.getElementById('atras').onclick=function(){ir(2);};
    document.getElementById('sig').onclick=function(){ir(4);};
    return;
  }
  /* paso 4 · lo que se precarga */
  var elegidos=Object.keys(S.sel).map(function(id){
    var m=S.menu.find(function(x){return String(x.id)===String(id);}); return m?m.nombre:null;}).filter(Boolean);
  var total=Object.keys(S.sel).reduce(function(a,id){
    var m=S.menu.find(function(x){return String(x.id)===String(id);});return a+(m&&Number(m.precio_mxn)||0);},0);
  var exp = S.tieneExp==='si' ? S.expElegida : (S.nombreNueva||'(experiencia nueva sin nombre)');
  v.innerHTML='<div class="tarj"><h2>Listo. Esto es lo que se lleva a la ficha</h2>'+
    '<p>No hay que volver a teclear nada: la experiencia se abre con la selección puesta.</p>'+
    '<div class="resumen"><h3>Se precarga</h3><ul>'+
      '<li>Experiencia: <b>'+esc(exp)+'</b>'+(S.tieneExp==='no'?' — se crea ahora, en borrador':'')+'</li>'+
      '<li>Menú elegido: <b>'+(elegidos.length?esc(elegidos.join(' · ')):'ninguno')+'</b></li>'+
      (total?'<li>Costo del menú: <b>'+mx(total)+' por persona</b></li>':'')+
      (S.enCosmica
        ? '<li>Punto de inicio y de final: <b>La Cósmica</b>, puestos automáticamente</li>'+
          '<li>El paso de menú queda marcado como hecho dentro de la ficha</li>'
        : '<li>El menú entra como <b>extra</b> de tu experiencia; los puntos de inicio y final los pones tú</li>')+
    '</ul></div>'+
    '<div class="btns">'+
      '<button class="btn mag">'+(S.enCosmica?'Ir a armar la experiencia':'Ir al alta de la experiencia')+'</button>'+
      '<button class="btn fan" id="atras">Atrás</button>'+
      '<button class="btn fan" id="otra">Empezar de nuevo</button></div>'+
    '<div class="nota">En la versión real, ese botón abre el editor de ficha con estos datos ya escritos y el paso de menú resuelto. Aquí no guarda nada: es la maqueta del flujo.</div></div>';
  document.getElementById('atras').onclick=function(){ir(3);};
  document.getElementById('otra').onclick=function(){S={paso:0,tieneExp:null,expElegida:'',nombreNueva:'',enCosmica:null,sel:{},menu:S.menu,exps:S.exps};ir(0);};
}

Promise.all([
  fetch(SB+'/rest/v1/cosmica_productos?select=id,seccion,nombre,precio_mxn,orden&activo=is.true&order=seccion.asc,orden.asc',{headers:hdr()})
    .then(function(r){return r.ok?r.json():[];}),
  fetch(SB+'/rest/v1/v_demo_experiencias?select=nombre,estado&order=nombre.asc',{headers:hdr()})
    .then(function(r){return r.ok?r.json():[];})
]).then(function(res){
  S.menu=res[0]||[]; S.exps=res[1]||[];
  pintaPasos(); pinta();
});
})();
</script>
</body></html>
