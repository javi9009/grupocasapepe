<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos a proveedor · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.spacer{margin-left:auto}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:.95rem;border-bottom:1px solid var(--rule)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:1.4rem;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;letter-spacing:.03em}
.scroll{overflow-x:auto}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.c-bor{background:var(--none-bg);color:var(--none)}.c-sol{background:var(--warn-bg);color:var(--warn)}
.c-apr{background:var(--accent-soft);color:var(--accent)}.c-env{background:var(--surface-2);color:var(--ink-2)}
.c-rec{background:var(--ok-bg);color:var(--ok)}.c-can{background:var(--bad-bg);color:var(--bad)}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
input.mini{padding:4px 7px;font-size:13px;width:86px;text-align:right}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.center{text-align:center;color:var(--muted);padding:36px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.avisos{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.over > i{background:var(--bad)}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}
</style></head>
<body>

<div class="top"><div class="top-in">
  <div class="brand">🧾 Pedidos a proveedor<small>Casa Pepe · Servicio</small></div>
  <div class="spacer"></div>
  <span id="sedeBox"></span>
  <button class="btn" id="btnNuevo" onclick="nuevoPedido()">＋ Nuevo pedido</button>
</div></div>

<div class="secnav"><div class="secnav-in" id="tabs"></div></div>
<div class="wrap" id="view"><div class="center">Cargando…</div></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n==null?"—":Number(n).toLocaleString("es-MX");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3000);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

const EST=[["borrador","Borrador","c-bor"],["solicitado","Solicitado","c-sol"],["aprobado","Aprobado","c-apr"],
  ["rechazado","Rechazado","c-can"],["enviado","Enviado","c-env"],["recibido_parcial","Recibido parcial","c-rec"],
  ["recibido","Recibido","c-rec"],["cancelado","Cancelado","c-can"]];
const estMeta=e=>EST.find(x=>x[0]===e)||[e,e,"c-bor"];
const chipEst=e=>{const m=estMeta(e);return `<span class="chip ${m[2]}">${esc(m[1])}</span>`;};

let USER=null, EMAIL="", PROPS=[], SEDE=null, TAB="sugeridos";
let PUEDE_APROBAR=false, PUEDE_EDITAR=false;
let SUG=[], PEDIDOS=[], PROVS=[], BODEGAS=[], CUENTAS=[], PRODS=[];
let SEL={};   // producto_id -> piezas seleccionadas en la pestaña Sugeridos

/* ───────────────── arranque ───────────────── */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; EMAIL=(USER.email||"").toLowerCase();

  PUEDE_EDITAR  = await nivel("PAG-SERV-PEDIDOS") === "editar";
  PUEDE_APROBAR = await nivel("PAG-SERV-PEDIDOS-APR") === "editar";

  let props=(await sb.from("properties").select("id,nombre,pl_loc").not("pl_loc","is",null)).data||[];
  try{ props = await cpAcceso.filtra(props, p=>p.nombre); }catch(_){}
  PROPS=props.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!PROPS.length){ $("view").innerHTML='<div class="center">No tienes ninguna sede asignada.</div>'; return; }
  SEDE=PROPS[0].id;
  pintaSede(); pintaTabs();

  const q=new URLSearchParams(location.search); if(q.get("tab")) TAB=q.get("tab");
  if(TAB==="aprobar" && !PUEDE_APROBAR) TAB="sugeridos";
  await recargar();
}
async function nivel(pagina){
  try{
    const {data}=await sb.rpc("permiso_efectivo",{p_email:EMAIL,p_pagina:pagina});
    return (data||"none");
  }catch(_){ return "none"; }
}
function pintaSede(){
  if(PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-env">${esc(PROPS[0].nombre)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="width:auto;min-width:170px">`+
    PROPS.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("")+`</select>`;
  $("selSede").onchange=e=>{SEDE=e.target.value; SEL={}; recargar();};
}
function pintaTabs(){
  const t=[["sugeridos","📉 Sugeridos por mínimo"],["pedidos","🧾 Pedidos"]];
  if(PUEDE_APROBAR) t.push(["aprobar","✔️ Por aprobar"]);
  t.push(["recepcion","📦 Recepción"]);
  t.push(["presupuesto","📊 Presupuesto"]);
  $("tabs").innerHTML=t.map(([k,l])=>
    `<button data-t="${k}" aria-selected="${TAB===k}" onclick="irTab('${k}')">${esc(l)}</button>`).join("");
  $("btnNuevo").style.display = PUEDE_EDITAR ? "" : "none";
}
function irTab(k){ TAB=k; pintaTabs(); render(); }

async function recargar(){
  $("view").innerHTML='<div class="center">Cargando…</div>';
  const sede=PROPS.find(p=>p.id===SEDE);
  const [sug,ped,prov,bod,cue,pro]=await Promise.all([
    sb.from("cmp_v_pedido_sugerido").select("*").eq("property_id",SEDE).gt("faltante",0).order("faltante",{ascending:false}),
    sb.from("cmp_pedidos").select("*, items:cmp_pedido_items(*, prod:producto_id(nombre,unidad_base), pres:presentacion_id(tipo,contenido,unidad_contenido))")
      .eq("property_id",SEDE).order("created_at",{ascending:false}).limit(200),
    sb.from("cmp_v_proveedores_sede").select("*").eq("property_id",SEDE),
    sb.from("pos_almacenes").select("id,nombre,area").eq("property_id",SEDE).eq("activo",true).order("nombre"),
    sb.from("cmp_v_cuentas").select("*").order("grupo_compra"),
    sb.from("cmp_productos").select("id,nombre,area,unidad_base,tipo,bodega_id,cuenta_id").eq("property_id",SEDE).eq("activo",true).order("nombre")
  ]);
  SUG=sug.data||[]; PEDIDOS=ped.data||[]; PROVS=prov.data||[]; BODEGAS=bod.data||[]; CUENTAS=cue.data||[]; PRODS=pro.data||[];
  window.__sede=sede;
  render();
}

/* ───────────────── vistas ───────────────── */
function render(){
  if(TAB==="sugeridos")   return vSugeridos();
  if(TAB==="pedidos")     return vPedidos();
  if(TAB==="aprobar")     return vAprobar();
  if(TAB==="recepcion")   return vRecepcion();
  if(TAB==="presupuesto") return vPresupuesto();
}

/* ── Sugeridos ── */
function vSugeridos(){
  if(!SUG.length){ $("view").innerHTML='<div class="card"><div class="center">Nada por debajo del mínimo. Todo el stock está por encima de su punto de reorden.</div></div>'; return; }
  const sinPrecio=SUG.filter(s=>!s.presentacion_id).length;
  const conPrecio=SUG.filter(s=>s.presentacion_id);
  const importe=conPrecio.reduce((a,s)=>a+(+s.importe_estimado||0),0);

  const porArea={};
  SUG.forEach(s=>{ (porArea[s.area]=porArea[s.area]||[]).push(s); });

  let filas="";
  Object.keys(porArea).sort().forEach(area=>{
    filas+=`<tr class="grp"><td colspan="7">${esc(area)}</td></tr>`;
    porArea[area].forEach(s=>{
      const pid=s.producto_id;
      const sel=SEL[pid]!=null?SEL[pid]:(s.piezas_a_pedir||"");
      const puede=!!s.presentacion_id;
      filas+=`<tr>
        <td style="width:34px">${puede?`<input type="checkbox" style="width:auto" ${SEL[pid]!=null?"checked":""} onchange="marcar('${pid}',this.checked)">`:""}</td>
        <td><b>${esc(s.nombre)}</b><div class="small muted">${esc(s.bodega||"")}${s.categoria?" · "+esc(s.categoria):""}</div></td>
        <td class="num">${num(s.existencia)} / ${num(s.stock_min)}<div class="small muted">faltan ${num(s.faltante)} ${esc(s.unidad_base)}</div></td>
        <td>${puede?esc(s.presentacion)+" "+num(s.contenido)+" "+esc(s.unidad_contenido):'<span class="chip c-sol">sin presentación</span>'}</td>
        <td>${esc(s.proveedor||"—")}</td>
        <td class="num">${puede?`<input class="mini" type="number" min="0" step="1" value="${sel}" oninput="cantidad('${pid}',this.value)">`:""}</td>
        <td class="num">${s.importe_estimado!=null?money(s.importe_estimado):"—"}</td>
      </tr>`;
    });
  });

  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--warn)">${SUG.length}</div><div class="l">productos bajo mínimo</div></div>
      <div class="kpi"><div class="n">${money(importe)}</div><div class="l">costo estimado de reponer</div></div>
      <div class="kpi"><div class="n" style="color:var(--bad)">${sinPrecio}</div><div class="l">sin precio ni proveedor</div></div>
    </div>
    ${sinPrecio?`<div class="avisos">${sinPrecio} de estos productos no tienen presentación ni precio cargado, así que no se pueden pedir todavía. El jefe de área los captura en el catálogo.</div>`:""}
    <div class="card">
      <h3>Qué hay que reponer</h3>
      <div class="scroll"><table>
        <thead><tr><th></th><th>Producto</th><th class="num">Existencia / mínimo</th><th>Presentación</th><th>Proveedor</th><th class="num">Piezas</th><th class="num">Importe</th></tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>
    <div class="foot">
      <span class="muted small" id="selInfo"></span>
      <button class="btn" id="btnArmar" onclick="armarDesdeSugeridos()" ${PUEDE_EDITAR?"":"disabled"}>Armar pedidos con lo seleccionado</button>
    </div>`;
  infoSel();
}
function marcar(pid,on){
  const s=SUG.find(x=>x.producto_id===pid);
  if(on) SEL[pid]=s.piezas_a_pedir||1; else delete SEL[pid];
  infoSel();
}
function cantidad(pid,v){ const n=parseFloat(v); if(n>0){SEL[pid]=n;} else {delete SEL[pid];} infoSel(); }
function infoSel(){
  const el=$("selInfo"); if(!el) return;
  const ids=Object.keys(SEL);
  if(!ids.length){ el.textContent="Nada seleccionado"; return; }
  const provs=new Set(ids.map(id=>(SUG.find(s=>s.producto_id===id)||{}).proveedor_id||"sin"));
  el.textContent=`${ids.length} producto(s) · ${provs.size} pedido(s) por proveedor`;
}

async function armarDesdeSugeridos(){
  const ids=Object.keys(SEL);
  if(!ids.length) return toast("Selecciona al menos un producto");
  const grupos={};
  for(const id of ids){
    const s=SUG.find(x=>x.producto_id===id); if(!s||!s.presentacion_id) continue;
    const k=s.proveedor_id||"sin";
    (grupos[k]=grupos[k]||{proveedor_id:s.proveedor_id,proveedor:s.proveedor,lineas:[]}).lineas.push({s,cant:SEL[id]});
  }
  const claves=Object.keys(grupos);
  if(!claves.length) return toast("Los seleccionados no tienen presentación con precio");
  if(!confirm(`Se crearán ${claves.length} pedido(s) en borrador, uno por proveedor. ¿Continuar?`)) return;

  let creados=0;
  for(const k of claves){
    const g=grupos[k];
    const prim=g.lineas[0].s;
    const {data:ped,error}=await sb.from("cmp_pedidos").insert({
      property_id:SEDE, area:prim.area, proveedor_id:g.proveedor_id||null,
      bodega_destino_id:prim.bodega_id||null, cuenta_id:prim.cuenta_id||null,
      origen:"stock_minimo", estado:"borrador",
      solicitado_por:USER.id, solicitado_por_nombre:EMAIL
    }).select().single();
    if(error){ toast("Error: "+error.message); continue; }
    const items=g.lineas.map(l=>({
      pedido_id:ped.id, producto_id:l.s.producto_id, presentacion_id:l.s.presentacion_id,
      cantidad_solicitada:l.cant, precio_unitario:l.s.precio
    }));
    const r2=await sb.from("cmp_pedido_items").insert(items);
    if(r2.error) toast("Error en líneas: "+r2.error.message); else creados++;
  }
  SEL={}; toast(`${creados} pedido(s) creados en borrador`); TAB="pedidos"; pintaTabs(); await recargar();
}

/* ── Pedidos ── */
let FEST="vivos";
function vPedidos(){
  const vivos=PEDIDOS.filter(p=>!["recibido","cancelado","rechazado"].includes(p.estado));
  const lista=FEST==="vivos"?vivos:(FEST==="todos"?PEDIDOS:PEDIDOS.filter(p=>p.estado===FEST));
  const cnt={}; EST.forEach(e=>cnt[e[0]]=PEDIDOS.filter(p=>p.estado===e[0]).length);
  const barra=[["vivos",`En curso (${vivos.length})`]].concat(EST.filter(e=>cnt[e[0]]>0).map(e=>[e[0],`${e[1]} (${cnt[e[0]]})`])).concat([["todos","Todos"]]);
  $("view").innerHTML=`
    <div class="chips" style="margin-top:6px">${barra.map(f=>`<span class="pill ${FEST===f[0]?"on":""}" onclick="FEST='${f[0]}';render()">${esc(f[1])}</span>`).join("")}</div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Folio</th><th>Área · proveedor</th><th>Solicitó</th><th class="num">Líneas</th><th class="num">Total</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${lista.length?lista.map(filaPedido).join(""):'<tr><td colspan="7" class="center">Sin pedidos con ese filtro</td></tr>'}</tbody>
    </table></div></div>`;
}
function filaPedido(p){
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  const f=p.created_at?new Date(p.created_at).toLocaleDateString("es-MX",{day:"2-digit",month:"short"}):"";
  return `<tr>
    <td><b>${esc(p.folio)}</b><div class="small muted">${f}</div></td>
    <td>${esc(p.area||"")}<div class="small muted">${esc(prov?prov.proveedor:"— sin proveedor —")}</div></td>
    <td class="small">${esc(p.solicitado_por_nombre||"—")}</td>
    <td class="num">${(p.items||[]).length}</td>
    <td class="num">${money(p.total)}</td>
    <td>${chipEst(p.estado)}</td>
    <td class="num"><button class="btn ghost sm" onclick="verPedido('${p.id}')">Abrir</button></td>
  </tr>`;
}

/* ── Detalle del pedido ── */
function verPedido(id){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  const bod=BODEGAS.find(b=>b.id===p.bodega_destino_id);
  const cta=CUENTAS.find(c=>c.id===p.cuenta_id);
  const editable=p.estado==="borrador"&&PUEDE_EDITAR;

  const lineas=(p.items||[]).map(i=>{
    const pres=i.pres?`${i.pres.tipo} ${num(i.pres.contenido)} ${i.pres.unidad_contenido}`:"—";
    return `<tr>
      <td>${esc(i.prod?i.prod.nombre:"—")}<div class="small muted">${esc(pres)}</div></td>
      <td class="num">${num(i.cantidad_solicitada)}</td>
      <td class="num">${money(i.precio_unitario)}</td>
      <td class="num">${money(i.importe)}</td>
      ${editable?`<td class="num"><button class="btn ghost sm" onclick="borraLinea('${i.id}','${p.id}')">✕</button></td>`:""}
    </tr>`;
  }).join("");

  const avisoProv = !p.proveedor_id ? `<div class="avisos">Este pedido no tiene proveedor. No puede solicitarse hasta asignarlo.</div>`
    : (prov && prov.activo===false ? `<div class="avisos">Este proveedor no ha tenido movimiento en los últimos 3 meses.</div>` : "");

  let acciones="";
  if(p.estado==="borrador"&&PUEDE_EDITAR)
    acciones=`<button class="btn ghost" onclick="agregarLinea('${p.id}')">＋ Agregar producto</button>
              <button class="btn ghost danger" onclick="cambiaEstado('${p.id}','cancelado')">Cancelar</button>
              <button class="btn" onclick="cambiaEstado('${p.id}','solicitado')">Solicitar</button>`;
  else if(p.estado==="solicitado"&&PUEDE_APROBAR)

    acciones=`<button class="btn" onclick="abrirRecepcion('${p.id}')">Registrar recepción</button>`;

    ${avisoProv}
    ${editable?`<div class="grid2">
      <div><label>Proveedor</label><select id="edProv">${optProv(p.proveedor_id)}</select></div>
      <div><label>Bodega destino</label><select id="edBod">${optBod(p.bodega_destino_id)}</select></div>
      <div><label>Cuenta contable</label><select id="edCta">${optCta(p.cuenta_id)}</select></div>
      <div><label>Fecha requerida</label><input type="date" id="edFecha" value="${p.fecha_requerida||""}"></div>
      <div class="full"><label>Notas</label><input id="edNotas" value="${esc(p.notas||"")}"></div>
      <div class="full"><button class="btn ghost sm" onclick="guardaCab('${p.id}')">Guardar encabezado</button></div>
    </div>`:""}

      <thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">Importe</th>${editable?"<th></th>":""}</tr></thead>

      <tfoot><tr><th colspan="3" class="num">Total</th><th class="num">${money(p.total)}</th>${editable?"<th></th>":""}</tr></tfoot>
    </table></div></div>
    ${bitacora(p)}
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button>${acciones}</div>`);
}
function bitacora(p){
  const l=[];
  if(p.solicitado_at) l.push(`Solicitado por ${esc(p.solicitado_por_nombre||"")} el ${new Date(p.solicitado_at).toLocaleString("es-MX")}`);
  if(p.aprobado_at)   l.push(`Aprobado por ${esc(p.aprobado_por_nombre||"")} el ${new Date(p.aprobado_at).toLocaleString("es-MX")}`);
  if(p.rechazo_motivo)l.push(`Rechazado: ${esc(p.rechazo_motivo)}`);
  if(p.enviado_at)    l.push(`Enviado a ${esc(p.enviado_a_mail||"")} el ${new Date(p.enviado_at).toLocaleString("es-MX")}`);
  if(p.recibido_at)   l.push(`Recibido y firmado por ${esc(p.recibido_por_nombre||"")} el ${new Date(p.recibido_at).toLocaleString("es-MX")}`);
  if(p.total_recibo!=null) l.push(`Ticket: ${money(p.total_recibo)} · diferencia ${money((+p.total_recibo)-(+p.total))}`);
  return l.length?`<div class="card"><h3>Bitácora</h3><div style="padding:10px 14px" class="small muted">${l.join("<br>")}</div></div>`:"";
}
const optProv=v=>`<option value="">— elegir —</option>`+PROVS.filter(p=>p.estado!=="baja").map(p=>`<option value="${p.proveedor_id}" ${p.proveedor_id===v?"selected":""}>${esc(p.proveedor)}${p.suministra?" · "+esc(p.suministra):""}</option>`).join("");
const optBod=v=>`<option value="">— elegir —</option>`+BODEGAS.map(b=>`<option value="${b.id}" ${b.id===v?"selected":""}>${esc(b.nombre)}</option>`).join("");
const optCta=v=>`<option value="">— elegir —</option>`+CUENTAS.map(c=>`<option value="${c.id}" ${c.id===v?"selected":""}>${esc(c.grupo_compra)} · ${esc(c.codigo)} ${esc(c.cuenta)}</option>`).join("");

async function nuevoPedido(){

async function cargaPres(){

/* ── Envío al proveedor ── */
function textoPedido(p){
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id)||{};
  const sede=(PROPS.find(x=>x.id===p.property_id)||{}).nombre||"";
  const l=[`Pedido ${p.folio} — ${sede}`,``,`Proveedor: ${prov.proveedor||""}`,
    p.fecha_requerida?`Fecha requerida: ${p.fecha_requerida}`:"",``,`Detalle:`];
  (p.items||[]).forEach(i=>{
    const pres=i.pres?` (${i.pres.tipo} ${i.pres.contenido} ${i.pres.unidad_contenido})`:"";
    l.push(`· ${i.cantidad_solicitada} × ${i.prod?i.prod.nombre:""}${pres}`);
  });
  l.push(``,`Total estimado: ${money(p.total)}`,``,
    `Favor de confirmar disponibilidad y fecha de entrega.`,``,`Casa Pepe — ${sede}`);
  return l.filter(x=>x!==undefined).join("\n");
}
function prepararEnvio(id){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id)||{};
  const cuerpo=textoPedido(p);
  const mail=prov.mail||"";
  const asunto=`Pedido ${p.folio} — Casa Pepe`;
  modal(`<h3 style="margin:0 0 8px">Enviar ${esc(p.folio)} a ${esc(prov.proveedor||"")}</h3>
    <div class="grid2">
      <div><label>Correo del proveedor</label><input id="enMail" value="${esc(mail)}" placeholder="correo@proveedor.mx"></div>
      <div><label>Teléfono</label><input value="${esc(prov.telefono||"")}" readonly></div>
    </div>
    <label>Texto del pedido</label>
    <textarea id="enCuerpo" rows="12">${esc(cuerpo)}</textarea>
    <div class="avisos">El envío automático por correo todavía no está conectado. Copia el texto o ábrelo en tu cliente de correo, y luego marca el pedido como enviado para que quede registrado.</div>
    <div class="foot">
      <button class="btn ghost" onclick="copiar()">Copiar texto</button>
      <a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener"
         href="mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent(asunto)}&body=${encodeURIComponent(cuerpo)}">Abrir en correo</a>
      <button class="btn" onclick="marcarEnviado('${id}')">Marcar como enviado</button>
    </div>`);
}
function copiar(){ const t=$("enCuerpo"); t.select(); document.execCommand("copy"); toast("Texto copiado"); }
async function marcarEnviado(id){
  const mail=$("enMail").value.trim();
  if(!mail) return toast("Escribe el correo al que lo mandaste");
  const {error}=await sb.from("cmp_pedidos").update({estado:"enviado",enviado_at:new Date().toISOString(),enviado_a_mail:mail}).eq("id",id);
  if(error) return toast(error.message);
  await sb.from("cmp_pedido_eventos").insert({pedido_id:id,evento:"envio",estado_nuevo:"enviado",actor_id:USER.id,actor_nombre:EMAIL,detalle:mail});
  toast("Marcado como enviado"); closeModal(); await recargar();
}

async function pintaPresupuestoCelda(p){
  if(!p.cuenta_id) return;
  const cta=CUENTAS.find(c=>c.id===p.cuenta_id); if(!cta) return;
  const sede=PROPS.find(x=>x.id===p.property_id); if(!sede||!sede.pl_loc) return;
  const {data}=await sb.from("cmp_v_presupuesto").select("disponible_ytd,mes")
    .eq("loc",sede.pl_loc).eq("cuenta",cta.codigo).eq("anio",new Date().getFullYear())
    .order("mes",{ascending:false}).limit(1);
  const el=$("pp-"+p.id); if(!el||!data||!data.length) return;
  const d=+data[0].disponible_ytd;
  el.innerHTML=`<span style="color:${d<0?"var(--bad)":"var(--ok)"}">${money(d)}</span><div class="small muted">${esc(cta.codigo)}</div>`;
}

    <div class="card"><h3>Recibidos recientes</h3><div class="scroll"><table>

      }).join(""):'<tr><td colspan="5" class="center">Aún no hay recepciones</td></tr>'}</tbody>
    </table></div></div>`;
}
function abrirRecepcion(id){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const filas=(p.items||[]).map(i=>{
    const pres=i.pres?`${i.pres.tipo} ${num(i.pres.contenido)} ${i.pres.unidad_contenido}`:"—";
    const rec=i.cantidad_recibida!=null?i.cantidad_recibida:i.cantidad_solicitada;
    const pre=i.precio_recibido!=null?i.precio_recibido:(i.precio_unitario||"");
    return `<tr data-item="${i.id}">
      <td>${esc(i.prod?i.prod.nombre:"")}<div class="small muted">${esc(pres)}</div></td>
      <td class="num">${num(i.cantidad_solicitada)}</td>
      <td class="num"><input class="mini rc" type="number" min="0" step="0.01" value="${rec}" oninput="calcRec()"></td>
      <td class="num"><input class="mini rp" type="number" min="0" step="0.01" value="${pre}" oninput="calcRec()"></td>
      <td class="num sub">—</td>
      <td><input class="nota" placeholder="nota"></td>
    </tr>`;
  }).join("");
  modal(`<h3 style="margin:0 0 4px">Recepción de ${esc(p.folio)}</h3>
    <div class="small muted" style="margin-bottom:8px">Corrige cantidades si trajeron de más o de menos, y captura el precio del ticket si cambió.</div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Producto</th><th class="num">Pedido</th><th class="num">Recibido</th><th class="num">Precio ticket</th><th class="num">Importe</th><th>Nota</th></tr></thead>
      <tbody id="recBody">${filas}</tbody>
      <tfoot><tr><th colspan="4" class="num">Suma de líneas</th><th class="num" id="recSuma">—</th><th></th></tr></tfoot>
    </table></div></div>
    <div class="grid2">
      <div><label>Total del ticket (lo que dice el papel)</label><input id="recTotal" type="number" step="0.01" oninput="calcRec()"></div>
      <div><label>Diferencia contra las líneas</label><input id="recDif" readonly></div>
      <div><label>Foto del ticket</label><input id="recFoto" type="file" accept="image/*,application/pdf"></div>
      <div><label>Firma de quien recibe</label><input id="recFirma" value="${esc(EMAIL)}"></div>
      <div class="full"><label>Notas de la recepción</label><input id="recNotas"></div>
    </div>
    <div class="foot">
      <button class="btn ghost" onclick="closeModal()">Cancelar</button>
      <button class="btn ghost" onclick="guardaRecepcion('${id}','recibido_parcial')">Guardar como parcial</button>
      <button class="btn" onclick="guardaRecepcion('${id}','recibido')">Firmar recepción completa</button>
    </div>`);
  calcRec();
}
function calcRec(){
  let suma=0;
  document.querySelectorAll("#recBody tr").forEach(tr=>{
    const c=parseFloat(tr.querySelector(".rc").value)||0;
    const p=parseFloat(tr.querySelector(".rp").value)||0;
    const s=c*p; suma+=s;
    tr.querySelector(".sub").textContent=money(s);
  });
  const el=$("recSuma"); if(el) el.textContent=money(suma);
  const t=parseFloat($("recTotal").value);
  const d=$("recDif");
  if(d){ if(isNaN(t)){ d.value=""; } else { const dif=t-suma; d.value=money(dif)+(Math.abs(dif)>0.5?"  ← revisar":""); } }
}
async function guardaRecepcion(id,estadoFinal){
  const p=PEDIDOS.find(x=>x.id===id);
  const firma=$("recFirma").value.trim();
  if(!firma) return toast("Falta la firma de quien recibe");
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  if(prov && !prov.rfc) return toast("No se puede recibir: al proveedor le falta el RFC");

  // 1) líneas
  for(const tr of document.querySelectorAll("#recBody tr")){
    const itemId=tr.dataset.item;
    const patch={
      cantidad_recibida:parseFloat(tr.querySelector(".rc").value)||0,
      precio_recibido:parseFloat(tr.querySelector(".rp").value)||null,
      nota_recepcion:tr.querySelector(".nota").value||null
    };
    const {error}=await sb.from("cmp_pedido_items").update(patch).eq("id",itemId);
    if(error){ return toast("Error en una línea: "+error.message); }
  }

  // 2) foto del ticket
  let fotoUrl=null;
  const f=$("recFoto").files[0];
  if(f){
    const path=`pedidos/${p.folio}-${Date.now()}-${f.name.replace(/[^A-Za-z0-9._-]/g,"_")}`;
    const up=await sb.storage.from("comprobantes").upload(path,f,{upsert:false});
    if(up.error) toast("No se pudo subir la foto: "+up.error.message); else fotoUrl=path;
  }

  // 3) encabezado
  const patch={estado:estadoFinal, recibido_at:new Date().toISOString(), recibido_por:USER.id,
    recibido_por_nombre:firma, firma_url:firma,
    total_recibo:parseFloat($("recTotal").value)||null,
    conciliado_nota:$("recNotas").value||null};
  if(fotoUrl) patch.foto_recibo_url=fotoUrl;
  const t=parseFloat($("recTotal").value);
  if(!isNaN(t)){ patch.conciliado = Math.abs(t-(+p.total))<=0.5; if(patch.conciliado) patch.conciliado_at=new Date().toISOString(); }

  const {error}=await sb.from("cmp_pedidos").update(patch).eq("id",id);
  if(error) return toast(error.message);
  toast("Recepción firmada. La mercancía entró a stock."); closeModal(); await recargar();
}

/* ── Presupuesto ── */
async function vPresupuesto(){
  const sede=PROPS.find(x=>x.id===SEDE);
  if(!sede||!sede.pl_loc){ $("view").innerHTML='<div class="card"><div class="center">Esta sede no está mapeada al P&G.</div></div>'; return; }
  const anio=new Date().getFullYear();
  const {data}=await sb.from("cmp_v_presupuesto").select("*").eq("loc",sede.pl_loc).eq("anio",anio).order("mes",{ascending:false});
  const rows=data||[];
  if(!rows.length){ $("view").innerHTML='<div class="card"><div class="center">Sin plan cargado para esta sede.</div></div>'; return; }
  const mesMax=Math.max(...rows.map(r=>r.mes));
  const ult=rows.filter(r=>r.mes===mesMax);
  const factor=ult.length?ult[0].factor_ytd:null;

  const filas=ult.filter(r=>r.plan_ytd!=null).sort((a,b)=>(+a.disponible_ytd)-(+b.disponible_ytd)).map(r=>{
    const plan=+r.plan_ajustado_ytd||0, real=+r.real_ytd||0;
    const pct=plan>0?Math.min(100,Math.round(real/plan*100)):0;
    const over=real>plan;
    return `<tr>
      <td>${esc(r.cuenta_nombre)}<div class="small muted">${esc(r.cuenta)} · ${esc(r.departamento||"")}</div></td>
      <td class="num">${money(r.plan_ytd)}</td>
      <td class="num">${money(r.plan_ajustado_ytd)}</td>
      <td class="num">${money(r.real_ytd)}</td>
      <td class="num" style="color:${(+r.disponible_ytd)<0?"var(--bad)":"var(--ok)"};font-weight:600">${money(r.disponible_ytd)}</td>
      <td style="min-width:110px"><div class="bar ${over?"over":""}"><i style="width:${pct}%"></i></div></td>
    </tr>`;
  }).join("");

  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${factor!=null?Math.round(factor*100)+"%":"—"}</div><div class="l">venta real vs plan (acumulado)</div></div>
      <div class="kpi"><div class="n">${mesMax}</div><div class="l">último mes con datos</div></div>
      <div class="kpi"><div class="n">${esc(sede.nombre)}</div><div class="l">sede</div></div>
    </div>
    <div class="avisos">El plan se ajusta por el factor de ventas: si la venta va al ${factor!=null?Math.round(factor*100):"—"}% del plan, el gasto autorizado baja en la misma proporción. Se mide contra el acumulado del año, no contra el mes suelto.</div>
    <div class="card"><h3>Cuentas de compra — acumulado a mes ${mesMax}</h3><div class="scroll"><table>
      <thead><tr><th>Cuenta</th><th class="num">Plan</th><th class="num">Plan ajustado</th><th class="num">Real</th><th class="num">Disponible</th><th>Consumo</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="6" class="center">Sin cuentas con plan</td></tr>'}</tbody>
    </table></div></div>`;
}

boot();
</script>
</body></html>
