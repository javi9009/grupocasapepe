      }).select().single();
      if(error){ toast(error.message); continue; }
      const r=await sb.from("cmp_pedido_items").insert(items.map(x=>({
        pedido_id:ped.id, producto_id:x.producto_id, presentacion_id:x.presentacion_id,
        cantidad_solicitada:x.cant, precio_unitario:x.precio, tasa_iva:x.tasa })));
      if(r.error) toast(r.error.message); else { hechos++; ultimo=ped.id; }
    }
    CART=[]; closeModal(); toast(`${hechos} pedido(s) creados`);
    await recargar(); TAB="pedidos"; pintaTabs(); render();
    if(hechos===1&&ultimo&&MODO!=="pedir") verPedido(ultimo);

}

  modal(`<h3 style="margin:0 0 4px">Agregar al pedido</h3>

    <div class="grid2">
      <div><label>Cantidad <span id="lnUnid" class="small" style="color:var(--bad);font-weight:700"></span></label>

        <div id="lnAviso" class="small" style="color:var(--bad);margin-top:4px"></div></div>
      <div><label>Precio unitario</label><input id="lnPrecio" type="number" min="0" step="0.01"></div>
      <div><label>IVA</label><select id="lnIva"><option value="16">16%</option><option value="8">8%</option><option value="0">0% / exento</option></select></div>

function modoLinea(m){
  window.__modo=m;
  $("boxCat").style.display = m==="cat"?"":"none";
  $("boxLib").style.display = m==="libre"?"":"none";
  $("mCat").classList.toggle("on",m==="cat");
  $("mLib").classList.toggle("on",m==="libre");
}
function filtraProd(){
  const q=($("busca").value||"").toLowerCase();
  const vistos={}; 
  (window.__cat||[]).forEach(c=>{ if(!vistos[c.producto_id]) vistos[c.producto_id]=c; });
  const l=Object.values(vistos).filter(c=>c.producto.toLowerCase().includes(q));
  $("lnProd").innerHTML=l.length?l.map(c=>`<option value="${c.producto_id}">${esc(c.producto)}</option>`).join("")
    :`<option value="">— este proveedor no tiene productos que coincidan —</option>`;
  $("lnProd").onchange=cargaPres;
  if(l.length){ $("lnProd").value=l[0].producto_id; }
  cargaPres();
}
function cargaPres(){
  const pid=$("lnProd").value;
  const l=(window.__cat||[]).filter(c=>c.producto_id===pid);
  $("lnPres").innerHTML=l.map(x=>`<option value="${x.presentacion_id}" data-precio="${x.precio!=null?x.precio:""}">${esc(x.presentacion)} ${num(x.contenido)} ${esc(x.unidad_contenido)}${x.precio!=null?" · "+money(x.precio):""}${x.preferida?" · preferida":""}</option>`).join("")
    || `<option value="">—</option>`;
  $("lnPres").onchange=()=>{const o=$("lnPres").selectedOptions[0]; if(o&&o.dataset.precio)$("lnPrecio").value=o.dataset.precio; calcLinea();};
  pintaUnid();
  const pref=l.find(x=>x.preferida)||l[0];
  if(pref){
    $("lnPres").value=pref.presentacion_id;
    if(pref.precio!=null)$("lnPrecio").value=pref.precio;
    // Los alimentos básicos van a tasa 0; se propone la del producto, no un 16 fijo.
    if(pref.tasa_iva_default!=null) $("lnIva").value=String(pref.tasa_iva_default);
  }
  calcLinea();
}
/* La unidad, en rojo, pegada a la casilla. El 250 de epazote no salía de la nada:
   la etiqueta decía "Cantidad" a secas y nadie podía saber que el producto estaba
   en kilos. Ahora lo dice mientras se teclea, y si la cifra se dispara lo avisa ahí. */
function pintaUnid(){
  const et=$("lnUnid"), av=$("lnAviso"); if(!et) return;
  const prod=PRODS.find(x=>x.id===(($("lnProd")||{}).value));
  const u=prod&&prod.unidad_base?String(prod.unidad_base).toLowerCase():"";
  et.textContent=u?("· en "+(UNID[u]||u.toUpperCase())):"";
  const a=avisaCantidad(prod,parseFloat(($("lnCant")||{}).value),parseFloat(($("lnPrecio")||{}).value)||0);
  if(av) av.innerHTML=a?("⚠ "+a.texto+" "+esc(a.sugerencia)):"";
}
function calcLinea(){
  const c=parseFloat($("lnCant").value)||0, pr=parseFloat($("lnPrecio").value)||0, iva=parseFloat($("lnIva").value)||0;
  const base=c*pr; $("lnTotal").value=money(base+base*iva/100);
}
async function guardaLinea(pedidoId){
  const cant=parseFloat($("lnCant").value);
  if(!(cant>0)) return toast("Escribe una cantidad");
  if(window.__modo!=="libre"){
    const prod=PRODS.find(x=>x.id===$("lnProd").value);
    const a=avisaCantidad(prod,cant,parseFloat($("lnPrecio").value)||0);
    if(a && !confirm(`${prod.nombre} se pide en ${a.unidad}.\n\n`
         +`Estás pidiendo ${a.cant} ${(prod.unidad_base||"")}. ${a.sugerencia}\n\n`
         +`¿Lo dejo en ${a.cant}?`)) return;
  }
  const rec={pedido_id:pedidoId, cantidad_solicitada:cant,
    precio_unitario:parseFloat($("lnPrecio").value)||null,
    tasa_iva:parseFloat($("lnIva").value)||0};
  if(window.__modo==="libre"){
    const d=$("lnDesc").value.trim(); if(!d) return toast("Escribe qué se compra");
    rec.descripcion=d;
  }else{
    const pid=$("lnProd").value; if(!pid) return toast("Elige un producto");
    rec.producto_id=pid; rec.presentacion_id=$("lnPres").value||null;
  }
  const {error}=await sb.from("cmp_pedido_items").insert(rec);
  if(error) return toast(error.message);
  await refrescaPedido(pedidoId); verPedido(pedidoId);
}
async function borraLinea(id,pedidoId){
  const {error}=await sb.from("cmp_pedido_items").delete().eq("id",id);
  if(error) return toast(error.message);
  await refrescaPedido(pedidoId); verPedido(pedidoId);
}

/* Corregir una cantidad, un precio o el IVA de una línea que ya existe.
   Guarda el campo suelto y vuelve a leer ESE pedido —no los doscientos— para que
   el importe de la línea y los totales de abajo salgan de la base, que es quien
   los recalcula, y no de una suma hecha aquí que luego no cuadre con el asiento. */
async function guardaCampo(itemId,col,el,pedidoId){
  const crudo=String(el.value||"").trim();
  const v=crudo===""?null:parseFloat(crudo.replace(",","."));
  if(col==="cantidad_solicitada" && !(v>0)) return toast("La cantidad tiene que ser mayor que cero");
  if(col==="cantidad_solicitada"){
    const p0=PEDIDOS.find(x=>x.id===pedidoId)||{};
    const it=(p0.items||[]).find(x=>x.id===itemId);
    const a=it&&it.prod?avisaCantidad(it.prod,v,+it.precio_unitario):null;
    if(a && !confirm(`${it.prod.nombre} se pide en ${a.unidad}.\n\n`
         +`Estás poniendo ${a.cant} ${(it.prod.unidad_base||"")}. ${a.sugerencia}\n\n`
         +`¿Lo dejo en ${a.cant}?`)) { el.value=antes; return; }
  }
  if(v!=null && (isNaN(v)||v<0)) return toast("Ese número no se entiende");
  const antes=el.defaultValue;
  el.disabled=true;
  const {error}=await sb.from("cmp_pedido_items").update({[col]:v}).eq("id",itemId);
  el.disabled=false;
  if(error){ el.value=antes; return toast(error.message); }
  await refrescaPedido(pedidoId); verPedido(pedidoId);
  toast("Guardado");
}

/* Relee un solo pedido y lo sustituye en la lista que ya tenemos en memoria.
   recargar() baja el catálogo entero y tarda; para corregir un número no hace falta. */
async function refrescaPedido(id){
  const {data,error}=await sb.from("cmp_pedidos")
    .select("*, items:cmp_pedido_items(*, prod:producto_id(nombre,unidad_base), pres:presentacion_id(tipo,contenido,unidad_contenido))")
    .eq("id",id).maybeSingle();
  if(error||!data) return recargar();
  const k=PEDIDOS.findIndex(x=>x.id===id);
  if(k>=0) PEDIDOS[k]=data; else PEDIDOS.unshift(data);
  render();
}

async function cambiaEstado(id,estado,extra){

/* Aprobar el borrador de un tirón: lo solicita y lo aprueba. Quien puede aprobar
   no tiene por qué dar la vuelta de mandárselo a sí mismo. */
/* Pasar a pendiente de recibir. Es el único salto que hay que dar a mano, y lo da
   compras. Si el pedido venía de borrador se marca de paso como solicitado, para
   que la bitácora no diga que se aprobó algo que nadie llegó a pedir. */

  if(!(await faltaAvisa(id))) return;

    patch.solicitado_por=p.solicitado_por||USER.id;
    patch.solicitado_por_nombre=p.solicitado_por_nombre||EMAIL; }
  const {error}=await sb.from("cmp_pedidos").update(patch).eq("id",id);
  if(error) return toast(error.message);

function telWhats(t){
  let d=String(t||"").split(/[\/,;]/)[0].replace(/\D/g,"");   // si hay dos, el primero
  if(!d) return "";
  if(d.length>10 && d.startsWith("52"))  d=d.slice(2);        // ya traía la LADA
  if(d.length===11 && d.startsWith("1")) d=d.slice(1);        // el 1 de los móviles
  if(d.length===13 && d.startsWith("044")) d=d.slice(3);
  if(d.length===13 && d.startsWith("045")) d=d.slice(3);
  if(d.length>10) d=d.slice(-10);                             // último recurso
  return d.length===10 ? "52"+d : "";
}

let RECFOTO=null;
function recFotoElegida(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;

/* Al recibir la factura, el contador elige la cuenta. Arriba salen las del propio pedido
   (la del producto y sus cuentas alternativas); abajo, el resto por si hace falta otra. */
function ctasDelPedido(p){
  const ids=new Set(); if(p.cuenta_id) ids.add(p.cuenta_id);
  (p.items||[]).forEach(i=>{
    const pr=PRODS.find(x=>x.id===i.producto_id); if(!pr) return;
    if(pr.cuenta_id) ids.add(pr.cuenta_id);
    (pr.cuentas_extra||[]).forEach(c=>ids.add(c));
  });
  return ids;
}
function optCtaPedido(p){
  const ids=ctasDelPedido(p);
  const prop=CUENTAS.filter(c=>ids.has(c.id)), resto=CUENTAS.filter(c=>!ids.has(c.id));
  const op=c=>`<option value="${c.id}" ${c.id===p.cuenta_id?"selected":""}>${esc(c.grupo_compra)} · ${esc(c.codigo)} ${esc(c.cuenta)}</option>`;
  return `<option value="">— sin cuenta —</option>`+
    (prop.length?`<optgroup label="Las de este pedido">${prop.map(op).join("")}</optgroup>`:"")+
    (resto.length?`<optgroup label="Otras cuentas">${resto.map(op).join("")}</optgroup>`:"");
}
function calcRec(){
  let suma=0;
  document.querySelectorAll("#recBody tr").forEach(tr=>{
    const c=parseFloat(tr.querySelector(".rc").value)||0;
    const p=parseFloat(tr.querySelector(".rp").value)||0;
    const s=c*p; suma+=s;
    tr.querySelector(".sub").textContent=money(s);
  });
  const el=$("recSuma"); if(el) el.textContent=money(suma);
}
/* ── Firmas de la entrega ──
   Recibir mercancía es un acto entre dos personas: el que la trae y el que la
   mete a la bodega. Por eso la pantalla de firmas viene después de cuadrar
   cantidades: primero se revisa el papel, luego se firma lo revisado. */
let RECAP=null;
function pideFirmas(id,estadoFinal){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  if(prov && !prov.rfc) return toast("No se puede recibir: al proveedor le falta el RFC");

  // Se guarda lo capturado ANTES de cambiar la pantalla: el modal se reescribe.
  const lineas=[...document.querySelectorAll("#recBody tr")].map(tr=>({
    id:tr.dataset.item,
    cantidad_recibida:parseFloat(tr.querySelector(".rc").value)||0,
    precio_recibido:parseFloat(tr.querySelector(".rp").value)||null,
    nota_recepcion:tr.querySelector(".nota").value||null,
    nombre:(tr.querySelector("td")||{}).textContent||""
  }));
  // El total es la suma de las líneas y nada más: ya no se captura aparte el
  // total del papel para restarlo. El precio de la factura es el nuevo precio
  // por unidad, y si cambia se compara contra el anterior, línea por línea.
  const suma=lineas.reduce((a,l)=>a+(l.cantidad_recibida||0)*(+l.precio_recibido||0),0);
  RECAP={id, estadoFinal, lineas, suma, foto:RECFOTO,
    total:suma,
    notas:$("recNotas")?$("recNotas").value:"",
    cuenta_id:($("recCta")&&$("recCta").value)||p.cuenta_id||null};

  /* Pedir sin precio está bien: el precio llega con la factura. Recibir sin
     precio no: la mercancía entra a bodega valorada en cero y el gasto no llega
     a contabilidad. No se bloquea —a veces la factura llega después que el
     camión— pero se dice claro y queda en la lista de cabos sueltos
     (cmp_v_recibido_sin_precio). */
  const sinPrecio=RECAP.lineas.filter(l=>l.cantidad_recibida>0 && !(+l.precio_recibido>0));
  const avisoPrecio = sinPrecio.length ? `<div class="avisos" style="border-color:var(--warn)">
      <b>${sinPrecio.length} línea(s) van sin precio</b>: ${esc(sinPrecio.slice(0,4).map(l=>l.nombre.split("\n")[0].trim()).join(", "))}${sinPrecio.length>4?"…":""}.
      Si tienes la factura delante, vuelve atrás y captúralo: así entra a inventario con su valor y el gasto
      llega a contabilidad. Si la factura todavía no llega, sigue —queda apuntado como pendiente de precio.</div>` : "";

  modal(`<h3 style="margin:0 0 4px">Firmas de la entrega · ${esc(p.folio)}</h3>
    <div class="small muted" style="margin-bottom:10px">
      ${esc(prov?prov.proveedor:"sin proveedor")} · ${RECAP.lineas.length} línea(s) · ${money(RECAP.suma)}
      ${estadoFinal==="recibido_parcial"?" · <b>entrega incompleta</b>":""}</div>
    ${avisoPrecio}
    <div class="avisos">Lo que hace falta son los dos nombres: quien trae la mercancía y quien
      la recibe. <b>Quien recibe da fe de que entró y es el responsable.</b> Las firmas son
      opcionales — en el teléfono se pueden hacer con el dedo; desde la computadora, no hacen falta.</div>
    <div class="grid2">
      <div>
        <label>Quién trae la mercancía</label>
        <input id="recEntrego" placeholder="Nombre de quien trae la mercancía" autocomplete="off">
        <canvas class="pad" id="padEntrega"></canvas>
        <div class="small muted">Firma con el dedo si quieres · <a href="javascript:void(0)" onclick="limpiaPad('padEntrega')">Borrar</a></div>
      </div>
      <div>
        <label>Firma del colaborador que recibe</label>
        <input id="recFirma" value="${esc(EMAIL)}" autocomplete="off">
        <canvas class="pad" id="padRecibe"></canvas>
        <div class="small muted">Firma con el dedo · <a href="javascript:void(0)" onclick="limpiaPad('padRecibe')">Borrar</a></div>
      </div>
    </div>
    <div class="foot">
      <button class="btn ghost" onclick="abrirRecepcion('${id}')">← Volver a las cantidades</button>
      <button class="btn" id="btnFirmar" onclick="guardaRecepcion()">Firmar y recibir</button>
    </div>`);
  // Tras pintar: el canvas necesita su ancho real para no salir borroso ni vacío.
  requestAnimationFrame(()=>{ montaPad("padEntrega"); montaPad("padRecibe"); });
}
const TINTA={};
function montaPad(pid){
  const c=$(pid); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.max(1,r.width*dpr); c.height=Math.max(1,r.height*dpr);
  const x=c.getContext("2d"); x.scale(dpr,dpr);
  x.lineWidth=2.2; x.lineCap="round"; x.lineJoin="round"; x.strokeStyle="#16130f";
  TINTA[pid]=false;
  let trazando=false;
  const pos=e=>{ const b=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-b.left,t.clientY-b.top]; };
  const ini=e=>{ e.preventDefault(); trazando=true; TINTA[pid]=true; const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); };
  const mov=e=>{ if(!trazando) return; e.preventDefault(); const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); };
  const fin=()=>{ trazando=false; };
  c.addEventListener("pointerdown",ini); c.addEventListener("pointermove",mov);
  c.addEventListener("pointerup",fin);   c.addEventListener("pointerleave",fin);
  c.addEventListener("touchstart",ini,{passive:false}); c.addEventListener("touchmove",mov,{passive:false});
  c.addEventListener("touchend",fin);
}
function limpiaPad(pid){
  const c=$(pid); if(!c) return;
  c.getContext("2d").clearRect(0,0,c.width,c.height); TINTA[pid]=false;
}
const pngDe=pid=>new Promise(r=>{ const c=$(pid); if(!c) return r(null); c.toBlob(r,"image/png"); });

async function subeComprobante(blob,nombre,folio){
  const path=`pedidos/${folio}-${Date.now()}-${nombre.replace(/[^A-Za-z0-9._-]/g,"_")}`;
  const up=await sb.storage.from("comprobantes").upload(path,blob,{upsert:false});
  if(up.error){ toast("No se pudo subir "+nombre+": "+up.error.message); return null; }
  return path;
}

async function guardaRecepcion(){
  if(!RECAP) return;
  const p=PEDIDOS.find(x=>x.id===RECAP.id); if(!p) return;
  const entrego=($("recEntrego").value||"").trim();
  const firma=($("recFirma").value||"").trim();
  /* La firma con el dedo dejó de ser obligatoria (Javi, 21-oct-2026): en la
     computadora no hay dedo que firme, y lo que de verdad importa es que quede
     por escrito QUIÉN recibió. Esa persona da fe de que la mercancía entró, y es
     la responsable. En el móvil se sigue pudiendo firmar y la firma se guarda. */
  if(!entrego) return toast("Falta el nombre de quien trae la mercancía");
  if(!firma)   return toast("Falta el nombre de quien la recibe: es quien da fe de que entró");

  const btn=$("btnFirmar"); if(btn){ btn.disabled=true; btn.textContent="Guardando…"; }
  try{
    // 1) líneas
    for(const l of RECAP.lineas){
      const {error}=await sb.from("cmp_pedido_items").update({
        cantidad_recibida:l.cantidad_recibida,
        precio_recibido:l.precio_recibido,
        nota_recepcion:l.nota_recepcion}).eq("id",l.id);
      if(error) throw new Error("Error en una línea: "+error.message);
    }

    // 2) foto del ticket y las dos firmas
    const [bEnt,bRec]=await Promise.all([pngDe("padEntrega"),pngDe("padRecibe")]);
    const fotoUrl   = RECAP.foto ? await subeComprobante(RECAP.foto,RECAP.foto.name,p.folio) : null;
    const firmaEnt  = bEnt ? await subeComprobante(bEnt,"firma-entrega.png",p.folio) : null;
    const firmaRec  = bRec ? await subeComprobante(bRec,"firma-recibe.png",p.folio)  : null;

    // 3) encabezado
    const patch={estado:RECAP.estadoFinal, recibido_at:new Date().toISOString(), recibido_por:USER.id,
      recibido_por_nombre:firma, entrego_nombre:entrego,
      total_recibo:isNaN(RECAP.total)?null:RECAP.total,
      conciliado_nota:RECAP.notas||null,
      cuenta_id:RECAP.cuenta_id||null};
    if(fotoUrl)  patch.foto_recibo_url=fotoUrl;
    if(firmaEnt) patch.firma_entrega_url=firmaEnt;
    if(firmaRec) patch.firma_url=firmaRec;
    if(!isNaN(RECAP.total)){
      patch.conciliado = Math.abs(RECAP.total-(+p.total))<=0.5;
      if(patch.conciliado) patch.conciliado_at=new Date().toISOString();
    }
    const {error}=await sb.from("cmp_pedidos").update(patch).eq("id",RECAP.id);
    if(error) throw new Error(error.message);

    await sb.from("cmp_pedido_eventos").insert({pedido_id:RECAP.id,evento:"recepcion",
      estado_nuevo:RECAP.estadoFinal,actor_id:USER.id,actor_nombre:firma,
      detalle:"Entregó "+entrego});

    // El recibo se arma con las firmas que acaban de dibujarse, sin ir a buscarlas.
    const recibo={folio:p.folio, entrego, firma, estadoFinal:RECAP.estadoFinal,
      lineas:RECAP.lineas, suma:RECAP.suma, total:RECAP.total, notas:RECAP.notas,
      proveedor:(PROVS.find(x=>x.proveedor_id===p.proveedor_id)||{}).proveedor||"",
      bodega:(BODEGAS.find(b=>b.id===p.bodega_destino_id)||{}).nombre||"",
      sede:(PROPS.find(x=>x.id===p.property_id)||{}).nombre||"",
      pngEntrega:$("padEntrega")?$("padEntrega").toDataURL("image/png"):null,
      pngRecibe:$("padRecibe")?$("padRecibe").toDataURL("image/png"):null};
    RECAP=null; RECFOTO=null;
    closeModal(); await recargar();
    reciboPDF(recibo);
    toast("Recepción firmada. La mercancía entró a stock.");
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent="Firmar y recibir"; }
    toast(e.message||"No se pudo guardar");
  }
}
/* El recibo que se imprime o se guarda en PDF: mismas dos firmas, en papel. */
function reciboPDF(r){
  const filas=r.lineas.map(l=>`<tr>
      <td>${esc((l.nombre||"").split("\n")[0])}</td>
      <td class="num">${num(l.cantidad_recibida)}</td>
      <td class="num">${money(l.precio_recibido)}</td>
      <td class="num">${money((+l.cantidad_recibida||0)*(+l.precio_recibido||0))}</td></tr>`).join("");
  const w=window.open("","_blank");
  if(!w) return toast("El navegador bloqueó la ventana del recibo. Permítelo para guardarlo en PDF.");
  w.document.write(`<!doctype html><html lang="es"><head><meta charset="utf-8">
    <title>Recibo ${esc(r.folio)}</title>
    <style>
      body{font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:#1f1b16;margin:28px;max-width:720px}
      h1{font-size:19px;margin:0 0 2px} .m{color:#6b625a;font-size:12px}
      table{width:100%;border-collapse:collapse;margin-top:16px}
      th,td{border-bottom:1px solid #e6ded2;padding:7px 6px;text-align:left}
      th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:#6b625a}
      .num{text-align:right}
      .tot{margin-top:12px;text-align:right;font-size:15px;font-weight:600}
      .firmas{display:flex;gap:28px;margin-top:40px}
      .fbox{flex:1;text-align:center}
      .fbox img{height:74px;display:block;margin:0 auto 2px}
      .fline{border-top:1px solid #1f1b16;padding-top:5px;font-size:12px}
      .nota{margin-top:18px;font-size:12px;color:#6b625a}
      @media print{body{margin:14mm}}
    </style></head><body>
    <h1>Recibo de entrega · ${esc(r.folio)}</h1>
    <div class="m">${esc(r.sede)} · ${esc(r.proveedor||"sin proveedor")} · entró en ${esc(r.bodega||"—")}<br>
      ${new Date().toLocaleString("es-MX")}${r.estadoFinal==="recibido_parcial"?" · <b>entrega incompleta</b>":""}</div>
    <table><thead><tr><th>Producto</th><th class="num">Recibido</th><th class="num">Precio</th><th class="num">Importe</th></tr></thead>
      <tbody>${filas}</tbody></table>
    <div class="tot">Suma de líneas: ${money(r.suma)}${!isNaN(r.total)&&r.total!=null?` · Ticket: ${money(r.total)}`:""}</div>
    ${r.notas?`<div class="nota">Notas: ${esc(r.notas)}</div>`:""}
    <div class="firmas">
      <div class="fbox">${r.pngEntrega?`<img src="${r.pngEntrega}" alt="firma">`:"<div style='height:74px'></div>"}
        <div class="fline">${esc(r.entrego)}<br><span class="m">Entregó (repartidor)</span></div></div>
      <div class="fbox">${r.pngRecibe?`<img src="${r.pngRecibe}" alt="firma">`:"<div style='height:74px'></div>"}
        <div class="fline">${esc(r.firma)}<br><span class="m">Recibió (Casa Pepe)</span></div></div>
    </div>
    <script>window.onload=function(){setTimeout(function(){window.print();},350);}<\/script>
    </body></html>`);
  w.document.close();
}

/* ── Presupuesto ── */
async function vPresupuesto(){
  const sede=PROPS.find(x=>x.id===SEDE);
  if(!sede||!sede.pl_loc){ $("view").innerHTML='<div class="card"><div class="center">Esta sede no está mapeada al P&G.</div></div>'; return; }
  const anio=new Date().getFullYear();
  const {data}=await sb.from("cmp_v_presupuesto").select("*").eq("loc",sede.pl_loc).eq("anio",anio).order("mes",{ascending:false});
  const rows=data||[];
  if(!rows.length){ $("view").innerHTML='<div class="card"><div class="center">Sin plan cargado para esta sede.</div></div>'; return; }
  const mesMax=Math.max(...rows.map(r=>r.mes));
  const ult=rows.filter(r=>r.mes===mesMax);
  const factor=ult.length?ult[0].factor_ytd:null;

  const filas=ult.filter(r=>r.plan_ytd!=null).sort((a,b)=>(+a.disponible_ytd)-(+b.disponible_ytd)).map(r=>{
    const plan=+r.plan_ajustado_ytd||0, real=+r.real_ytd||0;
    const pct=plan>0?Math.min(100,Math.round(real/plan*100)):0;
    const over=real>plan;
    return `<tr>
      <td>${esc(r.cuenta_nombre)}<div class="small muted">${esc(r.cuenta)} · ${esc(r.departamento||"")}</div></td>
      <td class="num">${money(r.plan_ytd)}</td>
      <td class="num">${money(r.plan_ajustado_ytd)}</td>
      <td class="num">${money(r.real_ytd)}</td>
      <td class="num" style="color:${(+r.disponible_ytd)<0?"var(--bad)":"var(--ok)"};font-weight:600">${money(r.disponible_ytd)}</td>
      <td style="min-width:110px"><div class="bar ${over?"over":""}"><i style="width:${pct}%"></i></div></td>
    </tr>`;
  }).join("");

  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${factor!=null?Math.round(factor*100)+"%":"—"}</div><div class="l">venta real vs plan (acumulado)</div></div>
      <div class="kpi"><div class="n">${mesMax}</div><div class="l">último mes con datos</div></div>
      <div class="kpi"><div class="n">${esc(sede.nombre)}</div><div class="l">sede</div></div>
    </div>
    <div class="avisos">El plan se ajusta por el factor de ventas: si la venta va al ${factor!=null?Math.round(factor*100):"—"}% del plan, el gasto autorizado baja en la misma proporción. Se mide contra el acumulado del año, no contra el mes suelto.</div>
    <div class="card"><h3>Cuentas de compra — acumulado a mes ${mesMax}</h3><div class="scroll"><table>
      <thead><tr><th>Cuenta</th><th class="num">Plan</th><th class="num">Plan ajustado</th><th class="num">Real</th><th class="num">Disponible</th><th>Consumo</th></tr></thead>
      <tbody>${filas||'<tr><td colspan="6" class="center">Sin cuentas con plan</td></tr>'}</tbody>
    </table></div></div>`;
}

boot();
