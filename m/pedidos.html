<!doctype html><html lang="es"><head>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pedidos a proveedor · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.spacer{margin-left:auto}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.card h3{margin:0;padding:12px 14px;font-size:.95rem;border-bottom:1px solid var(--rule)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:1.4rem;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Celda que se escribe encima. Se ve como texto hasta que la tocas: la tabla no
   se convierte en un formulario lleno de cajitas, pero el número se deja corregir. */
input.celda{width:84px;text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;
  font-family:inherit;color:var(--ink);background:transparent;border:1px solid transparent;
  border-radius:7px;padding:3px 6px;-moz-appearance:textfield}
input.celda::-webkit-outer-spin-button,input.celda::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input.celda:hover{border-color:var(--rule);background:var(--surface-2)}
input.celda:focus{outline:none;border-color:var(--ink);background:var(--surface)}
input.celda:disabled{opacity:.5}
tr.grp td{background:var(--surface-2);font-weight:700;font-size:12.5px;letter-spacing:.03em}
.scroll{overflow-x:auto}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;white-space:nowrap}
.c-bor{background:var(--none-bg);color:var(--none)}.c-sol{background:var(--warn-bg);color:var(--warn)}
.c-apr{background:var(--accent-soft);color:var(--accent)}.c-env{background:var(--surface-2);color:var(--ink-2)}
.c-rec{background:var(--ok-bg);color:var(--ok)}.c-can{background:var(--bad-bg);color:var(--bad)}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px}
.vistas{display:flex;gap:6px;margin:0 0 8px}
.nuevoprod{margin-top:14px;padding:12px;border:1px dashed var(--rule-2);border-radius:12px;font-size:13.5px;color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.nuevoprod .btn{text-decoration:none}
.cpfil{display:flex;gap:8px;align-items:center}
.cpfil input{flex:2 1 180px}
.cpfil select{flex:1 1 150px}
@media(max-width:520px){.cpfil{flex-wrap:wrap}.cpfil input,.cpfil select{flex:1 1 100%}}
/* El arbol de pasillos: raices cerradas con + y subpasillos dentro */
.arbol{margin:8px 0 10px}
.arbRama{margin-bottom:2px}
.arbTodo{display:inline-block;margin-bottom:6px;border:1px solid var(--rule);background:var(--surface);
  border-radius:20px;padding:4px 12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.arbTodo.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.arbRaiz{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--rule);
  background:none;padding:8px 2px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer}
.arbRaiz.abierta,.arbRaiz.on{color:var(--accent)}
.arbMas{display:inline-block;width:18px;color:var(--muted);font-weight:700}
.arbRaiz.abierta .arbMas,.arbRaiz.on .arbMas{color:var(--accent)}
.arbN{color:var(--muted);font-weight:600;font-size:12px}
.arbHijos{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 10px 20px}
.arbHijo{border:1px solid var(--rule);background:var(--surface);border-radius:16px;padding:4px 10px;
  font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.arbHijo.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
input.mini{padding:4px 7px;font-size:13px;width:86px;text-align:right}
canvas.pad{width:100%;height:132px;background:#fff;border:1px dashed var(--rule);border-radius:10px;touch-action:none;display:block;margin-top:6px}
.fotobox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
/* Los dos caminos de la foto: la cámara y el carrete. El input nativo va
   escondido porque en el teléfono sale como el "Examinar…" de toda la vida. */
.fotos{display:flex;gap:8px;margin-top:4px}
.fbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:14px 10px;border:1px solid var(--accent);border-radius:12px;background:var(--accent);
  color:var(--on-accent);font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
  line-height:1.25;text-align:center}
.fbtn.ghost{background:var(--surface);color:var(--muted);border:1px dashed var(--rule)}
.fbtn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.fbtn:active{transform:scale(.98)}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
.modal-bg.on{display:flex}
.modal{background:var(--surface);border-radius:14px;max-width:820px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid2 .full{grid-column:1/-1}
.muted{color:var(--muted)}.small{font-size:12.5px}
.center{text-align:center;color:var(--muted);padding:36px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:60;max-width:90vw}
.toast.on{opacity:1}
.avisos{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:12px}
.bar{height:8px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--accent)}
.bar.over > i{background:var(--bad)}
/* ---------- tablero vertical por etapa (mismo lenguaje que el funnel de altas) ----------
   Tres columnas anchas, no seis estrechas: la tarjeta del pedido lleva proveedor,
   quién lo pidió y el importe, y eso no cabe en 244px sin partirse en dos filas. */
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:4px 2px 12px}
.filtros input,.filtros select{font:inherit;font-size:13.5px;padding:7px 9px;border:1px solid var(--rule);border-radius:9px;background:var(--surface);color:var(--ink)}
.filtros #fTxt{flex:1 1 230px;max-width:320px}
.tablero{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 30px;align-items:flex-start}
.col{flex:1 1 0;min-width:300px;max-width:520px;background:var(--surface-3);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 230px)}
.col .cab{padding:11px 14px 9px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--surface-3);border-radius:12px 12px 0 0;z-index:1}
.col .cab h2{font-size:13px;font-weight:700;margin:0;line-height:1.2}
.col .cab .dd{font-size:11.5px;color:var(--muted);margin-top:2px}
.col .cab .cuenta{font-size:20px;font-weight:800;color:var(--accent);line-height:1;float:right;margin-left:10px}
.col.fin .cab .cuenta{color:var(--muted)}
.col .cuerpo{padding:10px;overflow-y:auto;display:flex;flex-direction:column;gap:9px;flex:1;min-height:46px}
.col .nada{color:var(--faint);font-size:12px;text-align:center;padding:16px 6px}
.tj{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:11px 12px;cursor:pointer;box-shadow:var(--shadow)}
.tj:hover{border-color:var(--accent)}
.tj[draggable="true"]{cursor:grab}
.tj.arrastrando{opacity:.4;cursor:grabbing}
.cuerpo.encima{background:var(--accent-soft);outline:2px dashed var(--accent);outline-offset:-5px;border-radius:9px}
.tj .t1{display:flex;align-items:baseline;gap:8px}
.tj .t1 b{font-size:13.5px;font-weight:800}
.tj .t1 .imp{margin-left:auto;font-size:14px;font-weight:800;font-variant-numeric:tabular-nums}
.tj .prov{font-size:12.5px;margin-top:3px;font-weight:600}
.tj .don{color:var(--muted);font-size:11.5px;margin-top:2px}
.tj .datos{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tj .falta{margin-top:7px;font-size:11.5px;color:var(--bad);line-height:1.35}
.etq{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 7px;white-space:nowrap}
.etq.g{background:var(--ok-bg);color:var(--ok)}.etq.a{background:var(--warn-bg);color:var(--warn)}
.etq.r{background:var(--bad-bg);color:var(--bad)}.etq.n{background:var(--surface-2);color:var(--muted)}
@media(max-width:860px){.tablero{display:block}.col{max-width:none;margin-bottom:14px;max-height:none}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:10px}
.pcard{border:1px solid var(--rule);border-radius:10px;padding:10px;background:var(--surface-3)}
.pcard .pnom{font-weight:600;font-size:.9rem;line-height:1.25}
.estrella{cursor:pointer;color:var(--faint);margin-right:4px;font-size:.95rem}
.estrella.on{color:#C9A227}
.pcard .pprec{font-weight:700;margin:6px 0 4px}
.pcard .padd{display:flex;gap:6px;margin-top:8px}.pcard .padd .mini{width:64px}
.pcard select{font-size:12px;padding:4px 6px}
.pcard.sinprecio{border-style:dashed;border-color:var(--rule-2)}
.acc{border:1px solid var(--rule);border-radius:10px;margin-top:8px;background:var(--surface);overflow:hidden}
.acch{width:100%;display:flex;align-items:center;gap:10px;background:none;border:0;font:inherit;padding:11px 13px;cursor:pointer;text-align:left}
.acch:hover{background:var(--surface-2)}
.accmas{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-weight:700}
.accnom{font-weight:600;flex:1}.accn{font-size:12px;color:var(--muted)}
.acc .pgrid{padding:0 12px 12px;margin-top:0}
@media(max-width:640px){.farrow{display:none}}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

<body>

<div class="top"><div class="top-in">
  <div class="brand">🧾 Pedidos a proveedor<small>Casa Pepe · Servicio</small></div>
  <div class="spacer"></div>
  <span id="sedeBox"></span>
  <button class="btn" id="btnNuevo" onclick="nuevoPedido()">＋ Nuevo pedido</button>
</div></div>

<div class="secnav"><div class="secnav-in" id="tabs"></div></div>
<div class="wrap" id="view"><div class="center">Cargando…</div></div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/cp-acceso.js"></script>
<script>/* Sin sesion no hay datos: se avisa y se vuelve al panel. */
if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
const num=n=>n==null?"—":Number(n).toLocaleString("es-MX");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),3000);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

/* El pedido tiene TRES etapas y no más: lo pides, está pendiente de recibir, llegó.
   Por dentro la base sigue guardando los ocho estados de siempre —el histórico y la
   contabilidad cuelgan de ellos—, pero el que trabaja solo ve tres. Borrador y
   solicitado son lo mismo para quien mira: alguien pidió algo. Aprobado, enviado y
   parcial también: está comprometido con el proveedor y aún no está en la bodega. */
const ETAPA=[
  {k:"solicitado", l:"Solicitado",           d:"Lo pidió el colaborador",
   est:["borrador","solicitado"],                 ts:p=>p.solicitado_at||p.created_at},
  {k:"pendiente",  l:"Pendiente de recibir",  d:"Aprobado y en manos del proveedor",
   est:["aprobado","enviado","recibido_parcial"], ts:p=>p.aprobado_at||p.solicitado_at||p.created_at},
  {k:"recibido",   l:"Recibido",              d:"Llegó y está en stock",
   est:["recibido"],                              ts:p=>p.recibido_at}
];
const etapaDe=e=>ETAPA.find(x=>x.est.includes(e))||null;

const EST=[["borrador","Solicitado","c-sol"],["solicitado","Solicitado","c-sol"],
  ["aprobado","Pendiente de recibir","c-apr"],["enviado","Pendiente de recibir","c-apr"],
  ["recibido_parcial","Llegó incompleto","c-rec"],["recibido","Recibido","c-rec"],
  ["rechazado","Rechazado","c-can"],["cancelado","Cancelado","c-can"]];
const estMeta=e=>EST.find(x=>x[0]===e)||[e,e,"c-bor"];
const chipEst=e=>{const m=estMeta(e);return `<span class="chip ${m[2]}">${esc(m[1])}</span>`;};

let USER=null, EMAIL="", PROPS=[], SEDE=null, TAB="funnel";
let PUEDE_APROBAR=false, PUEDE_EDITAR=false;
let SUG=[], PEDIDOS=[], PROVS=[], BODEGAS=[], CUENTAS=[], PRODS=[], SOLMTTO=[];
let MISAREAS=[], CATPROV=[], MODO="", ABIERTAS={}, ERRCARGA=[];
let PASILLOS={};   // id -> {nombre, ruta, nivel, raiz} del arbol de pasillos
let ULTPROV={};    // producto_id -> con quién se recibió la última vez en esta sede
let SEL={};   // producto_id -> piezas seleccionadas en la pestaña Sugeridos
let ENVIANDO=false; // candado anti doble-envío (evita pedidos duplicados por doble toque)

/* ───────────────── arranque ───────────────── */
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; EMAIL=(USER.email||"").toLowerCase();

  PUEDE_EDITAR  = await nivel("PAG-SERV-PEDIDOS") === "editar";
  try{ const {data}=await sb.rpc("cmp_mis_areas",{p_email:EMAIL}); MISAREAS=data||[]; }catch(_){ MISAREAS=[]; }
  PUEDE_APROBAR = await nivel("PAG-SERV-PEDIDOS-APR") === "editar";

  let props=(await sb.from("properties").select("id,nombre,pl_loc").not("pl_loc","is",null)).data||[];
  // Fail-open como cp-acceso: si el filtro de ubicación deja la lista en cero,
  // es un fallo del filtro, no que la persona no tenga casas. Mejor enseñarlas todas.
  try{ const f=await cpAcceso.filtra(props,p=>p.nombre); if(f&&f.length) props=f; }catch(_){}
  PROPS=props.sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if(!PROPS.length){ $("view").innerHTML='<div class="center">No tienes ninguna sede asignada.</div>'; return; }
  SEDE=await sedeInicial();
  pintaSede(); pintaTabs();

  const q=new URLSearchParams(location.search);
  MODO = q.get("modo")||"";            // ?modo=pedir -> vista simple de Soy Pepe
  if(MODO==="pedir") TAB="pedir";
  else if(q.get("tab")) TAB=q.get("tab");
  if(TAB==="aprobar") TAB="funnel";   // la pestaña ya no existe
  await recargar();
}
async function nivel(pagina){
  try{
    const {data}=await sb.rpc("permiso_efectivo",{p_email:EMAIL,p_pagina:pagina});
    return (data||"none");
  }catch(_){ return "none"; }
}
/* Sede de arranque.
   El panel ya tiene su selector de propiedad arriba y nos pasa ?proyecto=cdmx|puebla|virreyes:
   cuando viene de ahí, esa manda y aquí NO se repite el filtro (solo se dice en qué casa estamos).
   Suelto (Soy Pepe, atajo directo): la última que eligió, la suya, o la primera con catálogo. */
let MANDA_PANEL=false;
function proyDelPanel(){
  try{
    const q=new URLSearchParams(location.search).get("proyecto")||"";
    return (window.cpAcceso&&cpAcceso.toProy(q))||"";
  }catch(_){ return ""; }
}
// Soy Pepe no pasa ?proyecto=: su selector de arriba guarda la propiedad en cp_view_prop.
// Sin esto, el módulo abría en una casa distinta de la que dice el selector.
function sedeDeSoyPepe(){
  try{ return localStorage.getItem("cp_view_prop")||""; }catch(_){ return ""; }
}
async function sedeInicial(){
  let con=new Set();
  try{ const {data}=await sb.from("cmp_v_sedes_con_catalogo").select("property_id");
       con=new Set((data||[]).map(r=>r.property_id)); }catch(_){}
  const py=proyDelPanel();
  if(py){
    const m=PROPS.find(x=>{ try{ return cpAcceso.toProy(x.pl_loc)===py; }catch(_){ return false; } });
    // Corporativo y Sincrético no tienen catálogo de compras: ahí seguimos con selector propio.
    if(m && (!con.size || con.has(m.id))){ MANDA_PANEL=true; return m.id; }
  }
  const sp=sedeDeSoyPepe();
  if(sp && PROPS.some(p=>p.id===sp) && (!con.size || con.has(sp))){ MANDA_PANEL=true; return sp; }
  try{ const g=localStorage.getItem("cp_sede_compras"); if(g && PROPS.some(p=>p.id===g)) return g; }catch(_){}
  try{
    const {data}=await sb.from("employees").select("property_id").ilike("email",EMAIL).maybeSingle();
    const mia=data&&data.property_id;
    if(mia && PROPS.some(p=>p.id===mia) && (!con.size || con.has(mia))) return mia;
  }catch(_){}
  const conCat=PROPS.find(p=>con.has(p.id));
  return (conCat||PROPS[0]).id;
}
function recuerdaSede(id){ try{ localStorage.setItem("cp_sede_compras",id); }catch(_){} }
function pintaSede(){
  const nom=((PROPS.find(p=>p.id===SEDE)||PROPS[0])||{}).nombre||"";
  if(MANDA_PANEL || PROPS.length===1){ $("sedeBox").innerHTML=`<span class="chip c-env">${esc(nom)}</span>`; return; }
  $("sedeBox").innerHTML=`<select id="selSede" style="width:auto;min-width:170px">`+

  $("selSede").onchange=e=>{SEDE=e.target.value; recuerdaSede(SEDE); SEL={}; recargar();};

async function recargar(){
  $("view").innerHTML='<div class="center">Cargando…</div>';
  const sede=PROPS.find(p=>p.id===SEDE);
  const [sug,ped,prov,bod,cue,pro,sm,cp,pas,ult] = await Promise.all([
    sb.from("cmp_v_pedido_sugerido").select("*").eq("property_id",SEDE).gt("faltante",0).order("faltante",{ascending:false}),
    sb.from("cmp_pedidos").select("*, items:cmp_pedido_items(*, prod:producto_id(nombre,unidad_base), pres:presentacion_id(tipo,contenido,unidad_contenido))")
      .eq("property_id",SEDE).order("created_at",{ascending:false}).limit(200),
    sb.from("cmp_v_proveedores_sede").select("*").eq("property_id",SEDE),
    sb.from("pos_almacenes").select("id,nombre,area").eq("property_id",SEDE).eq("activo",true).order("nombre"),
    sb.from("cmp_v_cuentas").select("*").order("grupo_compra"),
    cargaProductos(),
    sb.from("cmp_v_solicitudes_mtto").select("*").eq("property_id",SEDE).order("created_at",{ascending:false}),
    sb.from("cmp_v_catalogo_proveedor").select("*").eq("property_id",SEDE),
    // El arbol de pasillos y subpasillos (anaqueles) es del Grupo, no de la sede.
    sb.from("cmp_v_pasillos").select("id,nombre,padre_id,nivel,ruta,orden_ruta,raiz").order("orden_ruta"),
    // Con quién se compró de verdad la última vez: manda sobre el más barato.
    sb.from("cmp_v_ultimo_proveedor").select("*").eq("property_id",SEDE)
  ]);
  SUG=sug.data||[]; PEDIDOS=ped.data||[]; PROVS=prov.data||[]; BODEGAS=bod.data||[]; CUENTAS=cue.data||[]; PRODS=Array.isArray(pro)?pro:(pro.data||[]); SOLMTTO=sm.data||[]; CATPROV=cp.data||[];
  // Un error de carga no debe disfrazarse de "no hay catálogo": se guarda para decirlo en pantalla.
  PASILLOS={}; (pas&&pas.data||[]).forEach(x=>PASILLOS[x.id]=x);
  ULTPROV={}; (ult&&ult.data||[]).forEach(x=>ULTPROV[x.producto_id]=x);
  ERRCARGA=[["precios",cp],["proveedores",prov],["bodegas",bod],["cuentas",cue]]
    .filter(([,r])=>r&&r.error).map(([q,r])=>q+": "+(r.error.message||r.error.code||"error"));
  if(!PRODS.length) ERRCARGA.push("productos: no llegó el catálogo");
  window.__sede=sede;
  render();
}

/* Supabase corta cada consulta en 1.000 filas y CDMX tiene más de 3.000
   productos: sin paginar, dos terceras partes del catálogo no aparecían al
   pedir. Se pide por páginas hasta agotar. */
async function cargaProductos(){
  const cols="id,nombre,area,areas_extra,categoria,familia,unidad_base,unidad_texto,tipo,tasa_iva_default,bodega_id,cuenta_id,cuentas_extra,pasillo_id,favorito";
  const out=[]; const paso=1000;
  for(let i=0;i<30;i++){
    const {data,error}=await sb.from("cmp_productos").select(cols)
      .eq("property_id",SEDE).eq("activo",true).order("nombre").order("id")
      .range(i*paso,(i+1)*paso-1);
    if(error||!data||!data.length) break;
    out.push(...data);
    if(data.length<paso) break;
  }
  return out;
}

/* ── Funnel ── */
const dias=t=>t?Math.floor((Date.now()-new Date(t).getTime())/86400000):null;

function vFunnel(){

  }
  /* Los filtros se aplican ANTES de repartir por columnas, para que los números de
     las cabeceras y los KPIs cuenten lo que se está viendo y no el total de la sede:

  const VIS=PEDIDOS.filter(pasaFiltro);

      Math.round((new Date(p.recibido_at)-new Date(p.solicitado_at))/86400000):null).filter(x=>x!=null);
  const cicloProm=ciclo.length?Math.round(ciclo.reduce((a,b)=>a+b,0)/ciclo.length):null;
  const conDif=cerrados.filter(p=>p.total_recibo!=null&&Math.abs((+p.total_recibo)-(+p.total))>0.5).length;

  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${cols[0].length}</div><div class="l">esperando que compras los revise</div></div>
      <div class="kpi"><div class="n">${money(comprometido)}</div><div class="l">comprometido sin recibir</div></div>
      <div class="kpi"><div class="n" style="color:${atorados?"var(--bad)":"var(--ok)"}">${atorados}</div><div class="l">atorados más de 7 días</div></div>
      <div class="kpi"><div class="n">${cicloProm!=null?cicloProm+" d":"—"}</div><div class="l">de solicitud a recepción</div></div>
      <div class="kpi"><div class="n" style="color:${conDif?"var(--warn)":"var(--muted)"}">${conDif}</div><div class="l">recibidos con diferencia de precio</div></div>
    </div>
    ${barraFiltros()}
    <div class="tablero">${ETAPA.map((e,i)=>`
      <div class="col ${i===2?"fin":""}">
        <div class="cab">
          <div class="cuenta">${cols[i].length}</div>
          <h2>${esc(e.l)}</h2><div class="dd">${esc(e.d)}</div>
        </div>
        <div class="cuerpo" data-etapa="${e.k}">${cols[i].length?cols[i].map(p=>tjPedido(p,e)).join(""):'<div class="nada">Vacía</div>'}</div>
      </div>`).join("")}</div>
    <div class="small muted" style="padding:0 2px 10px">Toca un pedido para abrirlo, revisarlo y mandárselo al proveedor.${
      PUEDE_APROBAR?" Arrástralo a <b>Pendiente de recibir</b> y queda aprobado; arrástralo de vuelta para deshacerlo.":""}</div>`;
  $("view").querySelectorAll(".tj").forEach(c=>c.onclick=()=>verPedido(c.dataset.id));
  enganchaArrastre();

/* ─────────── Filtros del tablero ───────────
   Tres preguntas que uno se hace mirando el tablero: de qué área es esto, a quién se
   le compra, y qué lleva parado demasiado. Más un buscador para cuando ya sabes el
   folio o el producto. Los filtros no viven en la URL ni se guardan: son para mirar
   un momento y soltar. */
let FIL={area:"",prov:"",edad:"",txt:""};
function pasaFiltro(p){
  if(FIL.area && (p.area||"")!==FIL.area) return false;
  if(FIL.prov && String(p.proveedor_id||"")!==FIL.prov) return false;
  if(FIL.edad){
    const e=etapaDe(p.estado); const d=dias(e&&e.ts(p));
    if(d==null) return false;
    if(FIL.edad==="hoy"   && d!==0)  return false;
    if(FIL.edad==="s7"    && d>7)    return false;
    if(FIL.edad==="v7"    && d<=7)   return false;
    if(FIL.edad==="v15"   && d<=15)  return false;
    if(FIL.edad==="v30"   && d<=30)  return false;
  }
  if(FIL.txt){
    const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
    const saco=[p.folio, p.area, p.solicitado_por_nombre, p.notas, prov&&prov.proveedor]
      .concat((p.items||[]).map(i=>i.prod?i.prod.nombre:i.descripcion))
      .join(" ").toLowerCase();
    if(!saco.includes(FIL.txt.toLowerCase())) return false;
  }
  return true;
}
function ponFiltro(k,v){ FIL[k]=v; render(); }
function limpiaFiltros(){ FIL={area:"",prov:"",edad:"",txt:""}; render(); }
function barraFiltros(){
  const vivos=PEDIDOS.filter(p=>!["cancelado","rechazado"].includes(p.estado));
  const areas=[...new Set(vivos.map(p=>p.area).filter(Boolean))].sort();
  const provs=[...new Set(vivos.map(p=>p.proveedor_id).filter(Boolean))]
    .map(id=>[id,(PROVS.find(x=>x.proveedor_id===id)||{}).proveedor||"—"])
    .sort((a,b)=>a[1].localeCompare(b[1],"es"));
  const op=(v,l,cur)=>`<option value="${esc(v)}"${String(cur)===String(v)?" selected":""}>${esc(l)}</option>`;
  const n=PEDIDOS.filter(pasaFiltro).length, hay=FIL.area||FIL.prov||FIL.edad||FIL.txt;
  return `<div class="filtros">
    <input id="fTxt" placeholder="Buscar folio, producto, quién pidió…" value="${esc(FIL.txt)}"
           oninput="FIL.txt=this.value;clearTimeout(window.__ft);window.__ft=setTimeout(render,250)">
    <select onchange="ponFiltro('area',this.value)">
      ${op("","Todas las áreas",FIL.area)}${areas.map(a=>op(a,a,FIL.area)).join("")}</select>
    <select onchange="ponFiltro('prov',this.value)">
      ${op("","Todos los proveedores",FIL.prov)}${provs.map(x=>op(x[0],x[1],FIL.prov)).join("")}</select>
    <select onchange="ponFiltro('edad',this.value)">
      ${op("","Cualquier antigüedad",FIL.edad)}${op("hoy","De hoy",FIL.edad)}${op("s7","De la última semana",FIL.edad)}
      ${op("v7","Parados +7 días",FIL.edad)}${op("v15","Parados +15 días",FIL.edad)}${op("v30","Parados +30 días",FIL.edad)}</select>
    ${hay?`<button class="btn ghost sm" onclick="limpiaFiltros()">Quitar filtros · ${n} pedido${n===1?"":"s"}</button>`:""}
  </div>`;
}

/* La tarjeta dice lo que hace falta para decidir sin abrirla: de quién es, a quién
   se le compra, cuánto, y qué le falta para poder salir. */
function tjPedido(p,e){
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  const d=dias(e.ts(p));
  const n=(p.items||[]).length;
  const quien=(p.solicitado_por_nombre||"").split("@")[0];
  const sinPrecio=(p.items||[]).some(i=>i.precio_unitario==null);
  const etqs=[];
  if(d!=null&&d>7&&e.k!=="recibido") etqs.push(`<span class="etq r">${d} días parado</span>`);
  else if(d!=null)                   etqs.push(`<span class="etq n">${d===0?"hoy":d+" d"}</span>`);
  if(p.estado==="recibido_parcial")  etqs.push('<span class="etq a">llegó incompleto</span>');
  if(p.estado==="enviado")           etqs.push('<span class="etq g">ya se le mandó</span>');
  if(p.fecha_requerida&&e.k==="pendiente") etqs.push(`<span class="etq n">llega ${esc(fechaCorta(p.fecha_requerida))}</span>`);
  const faltan=[];
  if(!p.proveedor_id) faltan.push("falta el proveedor");
  if(!n)              faltan.push("no tiene ni una línea");
  if(sinPrecio&&n)    faltan.push("hay líneas sin precio");
  const mover=PUEDE_APROBAR&&e.k!=="recibido";
  return `<div class="tj" data-id="${p.id}" data-etapa="${e.k}"${mover?' draggable="true"':''}>
    <div class="t1"><b>${esc(p.folio)}</b><span class="imp">${money(p.total)}</span></div>
    <div class="prov">${esc(prov?prov.proveedor:"— sin proveedor —")}</div>
    <div class="don">${esc(p.area||"")}${quien?" · lo pidió "+esc(quien):""} · ${n} línea${n===1?"":"s"}</div>
    <div class="datos">${etqs.join("")}</div>
    ${faltan.length?`<div class="falta">⚠ ${esc(faltan.join(" · "))}</div>`:""}
  </div>`;
}
/* ─────────── Arrastrar un pedido de una columna a otra ───────────
   Soltarlo en "Pendiente de recibir" ES aprobarlo: el gesto y la decisión son la
   misma cosa, y así no hay que abrir el pedido para darle a un botón. Arrastrar
   hacia atrás lo devuelve a Solicitado, que es como se deshace una aprobación
   dada por error. Lo de llevarlo a "Recibido" no se hace arrastrando: ahí hay que
   contar lo que llegó y decir quién lo recibe, así que abre la recepción.
   Solo arrastra quien puede aprobar; para los demás las tarjetas no son arrastrables.
   En el móvil esto no existe —el dedo no dispara drag&drop—, por eso el botón del
   detalle sigue estando: son dos caminos a lo mismo, no uno en lugar del otro. */
let ARRASTRA=null;
function enganchaArrastre(){
  const v=$("view"); if(!v) return;
  v.querySelectorAll('.tj[draggable="true"]').forEach(c=>{
    c.addEventListener("dragstart",e=>{
      ARRASTRA={id:c.dataset.id, de:c.dataset.etapa};
      c.classList.add("arrastrando");
      try{ e.dataTransfer.setData("text/plain",c.dataset.id);
           e.dataTransfer.effectAllowed="move"; }catch(_){}
    });
    c.addEventListener("dragend",()=>{ c.classList.remove("arrastrando"); ARRASTRA=null;
      v.querySelectorAll(".cuerpo.encima").forEach(x=>x.classList.remove("encima")); });
  });
  v.querySelectorAll(".cuerpo[data-etapa]").forEach(z=>{
    z.addEventListener("dragover",e=>{
      if(!ARRASTRA||!destinoValido(ARRASTRA.de,z.dataset.etapa)) return;
      e.preventDefault(); e.dataTransfer.dropEffect="move"; z.classList.add("encima");
    });
    z.addEventListener("dragleave",()=>z.classList.remove("encima"));
    z.addEventListener("drop",e=>{
      e.preventDefault(); z.classList.remove("encima");
      if(!ARRASTRA) return;
      const de=ARRASTRA.de, a=z.dataset.etapa, id=ARRASTRA.id; ARRASTRA=null;
      if(de===a||!destinoValido(de,a)) return;
      sueltaPedido(id,de,a);
    });
  });
}
const destinoValido=(de,a)=>
  (de==="solicitado"&&a==="pendiente") ||
  (de==="pendiente"&&a==="solicitado") ||
  (de==="pendiente"&&a==="recibido");

async function sueltaPedido(id,de,a){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  if(de==="solicitado"&&a==="pendiente") return aprobar(id);
  if(de==="pendiente"&&a==="recibido")   return abrirRecepcion(id);
  if(de==="pendiente"&&a==="solicitado"){
    if(!confirm(`${p.folio} vuelve a Solicitado.\n\nDeja de estar aprobado y no se puede recibir hasta que lo apruebes otra vez. ¿Lo devuelvo?`)) return;
    const {error}=await sb.from("cmp_pedidos")
      .update({estado:"solicitado", aprobado_at:null, aprobado_por:null, aprobado_por_nombre:null})
      .eq("id",id);
    if(error) return toast(error.message);
    await sb.from("cmp_pedido_eventos").insert({pedido_id:id, evento:"devuelto",
      estado_nuevo:"solicitado", actor_id:USER.id, actor_nombre:EMAIL,
      detalle:"Devuelto a Solicitado desde el tablero"});
    toast("Devuelto a Solicitado"); await recargar();
  }
}
const fechaCorta=f=>f?new Date(f+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short"}):"";

/* ── Sugeridos ── */
function vSugeridos(){
  if(!SUG.length){ $("view").innerHTML='<div class="card"><div class="center">Nada por debajo del mínimo. Todo el stock está por encima de su punto de reorden.</div></div>'; return; }
  const sinPrecio=SUG.filter(s=>!s.presentacion_id).length;
  const conPrecio=SUG.filter(s=>s.presentacion_id);
  const importe=conPrecio.reduce((a,s)=>a+(+s.importe_estimado||0),0);

  const porArea={};
  SUG.forEach(s=>{ (porArea[s.area]=porArea[s.area]||[]).push(s); });

  let filas="";
  Object.keys(porArea).sort().forEach(area=>{
    filas+=`<tr class="grp"><td colspan="7">${esc(area)}</td></tr>`;
    porArea[area].forEach(s=>{
      const pid=s.producto_id;
      const sel=SEL[pid]!=null?SEL[pid]:(s.piezas_a_pedir||"");
      const puede=!!s.presentacion_id;
      filas+=`<tr>
        <td style="width:34px">${puede?`<input type="checkbox" style="width:auto" ${SEL[pid]!=null?"checked":""} onchange="marcar('${pid}',this.checked)">`:""}</td>
        <td><b>${esc(s.nombre)}</b><div class="small muted">${esc(s.bodega||"")}${s.categoria?" · "+esc(s.categoria):""}</div></td>
        <td class="num">${num(s.existencia)} / ${num(s.stock_min)}<div class="small muted">faltan ${num(s.faltante)} ${esc(s.unidad_base)}</div></td>
        <td>${puede?esc(s.presentacion)+" "+num(s.contenido)+" "+esc(s.unidad_contenido):'<span class="chip c-sol">sin presentación</span>'}</td>
        <td>${esc(s.proveedor||"—")}</td>
        <td class="num">${puede?`<input class="mini" type="number" min="0" step="1" value="${sel}" oninput="cantidad('${pid}',this.value)">`:""}</td>
        <td class="num">${s.importe_estimado!=null?money(s.importe_estimado):"—"}</td>
      </tr>`;
    });
  });

  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--warn)">${SUG.length}</div><div class="l">productos bajo mínimo</div></div>
      <div class="kpi"><div class="n">${money(importe)}</div><div class="l">costo estimado de reponer</div></div>
      <div class="kpi"><div class="n" style="color:var(--bad)">${sinPrecio}</div><div class="l">sin precio ni proveedor</div></div>
    </div>
    ${sinPrecio?`<div class="avisos">${sinPrecio} de estos productos no tienen presentación ni precio cargado, así que no se pueden pedir todavía. El jefe de área los captura en el catálogo.</div>`:""}
    <div class="card">
      <h3>Qué hay que reponer</h3>
      <div class="scroll"><table>
        <thead><tr><th></th><th>Producto</th><th class="num">Existencia / mínimo</th><th>Presentación</th><th>Proveedor</th><th class="num">Piezas</th><th class="num">Importe</th></tr></thead>
        <tbody>${filas}</tbody></table></div>
    </div>
    <div class="foot">
      <span class="muted small" id="selInfo"></span>
      <button class="btn" id="btnArmar" onclick="armarDesdeSugeridos()" ${PUEDE_EDITAR?"":"disabled"}>Armar pedidos con lo seleccionado</button>
    </div>`;
  infoSel();
}
function marcar(pid,on){
  const s=SUG.find(x=>x.producto_id===pid);
  if(on) SEL[pid]=s.piezas_a_pedir||1; else delete SEL[pid];
  infoSel();
}
function cantidad(pid,v){ const n=parseFloat(v); if(n>0){SEL[pid]=n;} else {delete SEL[pid];} infoSel(); }
function infoSel(){
  const el=$("selInfo"); if(!el) return;
  const ids=Object.keys(SEL);
  if(!ids.length){ el.textContent="Nada seleccionado"; return; }
  const provs=new Set(ids.map(id=>(SUG.find(s=>s.producto_id===id)||{}).proveedor_id||"sin"));
  el.textContent=`${ids.length} producto(s) · ${provs.size} pedido(s) por proveedor`;
}

async function armarDesdeSugeridos(){
  const ids=Object.keys(SEL);
  if(!ids.length) return toast("Selecciona al menos un producto");
  const grupos={};
  for(const id of ids){
    const s=SUG.find(x=>x.producto_id===id); if(!s||!s.presentacion_id) continue;
    const k=s.proveedor_id||"sin";
    (grupos[k]=grupos[k]||{proveedor_id:s.proveedor_id,proveedor:s.proveedor,lineas:[]}).lineas.push({s,cant:SEL[id]});
  }
  const claves=Object.keys(grupos);
  if(!claves.length) return toast("Los seleccionados no tienen presentación con precio");
  if(!confirm(`Se crearán ${claves.length} pedido(s) en borrador, uno por proveedor. ¿Continuar?`)) return;
  if(ENVIANDO) return;  // evita que un doble toque cree pedidos duplicados
  ENVIANDO=true;
  try{
    let creados=0;
    for(const k of claves){
      const g=grupos[k];
      const prim=g.lineas[0].s;
      const {data:ped,error}=await sb.from("cmp_pedidos").insert({
        property_id:SEDE, area:prim.area, proveedor_id:g.proveedor_id||null,
        bodega_destino_id:prim.bodega_id||null, cuenta_id:prim.cuenta_id||null,
        origen:"stock_minimo", estado:"borrador",
        solicitado_por:USER.id, solicitado_por_nombre:EMAIL
      }).select().single();
      if(error){ toast("Error: "+error.message); continue; }
      const items=g.lineas.map(l=>({
        pedido_id:ped.id, producto_id:l.s.producto_id, presentacion_id:l.s.presentacion_id,
        cantidad_solicitada:l.cant, precio_unitario:l.s.precio
      }));
      const r2=await sb.from("cmp_pedido_items").insert(items);
      if(r2.error) toast("Error en líneas: "+r2.error.message); else creados++;
    }
    SEL={}; toast(`${creados} pedido(s) creados en borrador`); TAB="pedidos"; pintaTabs(); await recargar();
  } finally { ENVIANDO=false; }
}

/* ── Pedidos ── */
let FEST="vivos";
function vPedidos(){
  // Los filtros son las tres etapas, no los ocho estados de la base: si no, salen
  // "Solicitado" y "Pendiente de recibir" repetidos, que es lo que confundía.
  const vivos=PEDIDOS.filter(p=>!["recibido","cancelado","rechazado"].includes(p.estado));
  const et=ETAPA.find(x=>x.k===FEST);
  const lista = et ? PEDIDOS.filter(p=>et.est.includes(p.estado))
              : FEST==="cancelado" ? PEDIDOS.filter(p=>["cancelado","rechazado"].includes(p.estado))
              : FEST==="todos" ? PEDIDOS : vivos;
  const cnt=k=>PEDIDOS.filter(p=>(ETAPA.find(x=>x.k===k)||{est:[]}).est.includes(p.estado)).length;
  const canc=PEDIDOS.filter(p=>["cancelado","rechazado"].includes(p.estado)).length;
  const barra=[["vivos",`En curso (${vivos.length})`]]
    .concat(ETAPA.filter(e=>cnt(e.k)>0).map(e=>[e.k,`${e.l} (${cnt(e.k)})`]))
    .concat(canc?[["cancelado",`Cancelados (${canc})`]]:[]).concat([["todos","Todos"]]);
  $("view").innerHTML=`
    <div class="chips" style="margin-top:6px">${barra.map(f=>`<span class="pill ${FEST===f[0]?"on":""}" onclick="FEST='${f[0]}';render()">${esc(f[1])}</span>`).join("")}</div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Folio</th><th>Área · proveedor</th><th>Solicitó</th><th class="num">Líneas</th><th class="num">Total</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${lista.length?lista.map(filaPedido).join(""):'<tr><td colspan="7" class="center">Sin pedidos con ese filtro</td></tr>'}</tbody>
    </table></div></div>`;
}
function filaPedido(p){
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  const f=p.created_at?new Date(p.created_at).toLocaleDateString("es-MX",{day:"2-digit",month:"short"}):"";
  return `<tr>
    <td><b>${esc(p.folio)}</b><div class="small muted">${f}</div></td>
    <td>${esc(p.area||"")}<div class="small muted">${esc(prov?prov.proveedor:"— sin proveedor —")}</div></td>
    <td class="small">${esc(p.solicitado_por_nombre||"—")}</td>
    <td class="num">${(p.items||[]).length}</td>
    <td class="num">${money(p.total)}</td>
    <td>${chipEst(p.estado)}${p.info_pendiente?' <span class="chip c-sol">info pendiente</span>':""}</td>
    <td class="num"><button class="btn ghost sm" onclick="verPedido('${p.id}')">Abrir</button></td>
  </tr>`;
}

/* Mandar el pedido al proveedor, arriba del todo y desde el primer momento.
   Antes vivía detrás de "Preparar envío" y solo salía una vez aprobado, que es al
   revés de como se compra: primero le escribes al proveedor para ver si lo tiene,
   y luego lo dejas apuntado. Aquí están los dos caminos, WhatsApp y correo, con el
   teléfono y el correo editables —se guardan en la ficha del proveedor al usarlos—
   porque de 422 proveedores solo 27 tienen teléfono y ninguno tiene correo. */
function bloqueEnvio(p,prov){
  if(!p.proveedor_id) return "";
  if(!["borrador","solicitado","aprobado","enviado","recibido_parcial"].includes(p.estado)) return "";
  prov=prov||{};
  return `<div class="card" style="margin-top:10px;border-color:#bfe0d0;background:var(--accent-soft)">
    <h3>Mandárselo a ${esc(prov.proveedor||"el proveedor")}</h3>
    <div style="padding:10px 14px">
      <div class="grid2">
        <div><label>WhatsApp <span class="small muted">(10 dígitos, México)</span></label>
          <input id="enTel" value="${esc(prov.telefono||"")}" placeholder="55 1234 5678" inputmode="tel"
                 oninput="pintaEnvio('${p.id}')"></div>
        <div><label>Correo <span class="small muted">(si lo tiene)</span></label>
          <input id="enMail" value="${esc(prov.mail||"")}" placeholder="pedidos@proveedor.mx"
                 oninput="pintaEnvio('${p.id}')"></div>
      </div>
      <div id="enBotones" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center"></div>
      <details style="margin-top:10px"><summary class="small muted" style="cursor:pointer">Ver o cambiar el texto</summary>
        <textarea id="enCuerpo" rows="9" style="margin-top:8px"
                  oninput="pintaEnvio('${p.id}')">${esc(textoWhats(p))}</textarea>
        <button class="btn ghost sm" onclick="copiar()">Copiar texto</button>
      </details>
    </div></div>`;
}
/* Los botones se repintan conforme escriben: sin teléfono válido no se ofrece el
   de WhatsApp, y sin correo no se ofrece el de correo. */
function pintaEnvio(id){
  const box=$("enBotones"); if(!box) return;
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const txt =(($("enCuerpo")||{}).value)||textoWhats(p);
  const tel =telWhats((($("enTel")||{}).value)||"");
  const mail=((($("enMail")||{}).value)||"").trim();
  const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail);
  /* Sin target="_blank": whatsapp:// no es una página, se lo pasa al sistema. Con
     _blank dejaría una pestaña en blanco abierta cada vez. */
  const wa=tel
    ? `<a class="btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px"
          href="${urlWhats(tel,txt)}" onclick="guardaContacto('${id}')">
         <svg viewBox="0 0 24 24" style="width:18px;height:18px;fill:currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15l-1.3 4.7 4.8-1.3A10 10 0 1 0 12 2Zm5.6 14.1c-.2.6-1.2 1.2-1.7 1.2-.4 0-1 .1-3.2-.8-2.7-1.1-4.4-3.9-4.5-4-.1-.2-1-1.4-1-2.7 0-1.2.7-1.8.9-2.1.2-.3.5-.3.6-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.4.5c-.1.2-.3.3-.1.6.1.3.6 1.1 1.4 1.8 1 .9 1.8 1.1 2 1.3.3.1.4.1.6-.1l.8-.9c.2-.2.4-.2.6-.1l1.8.9c.2.1.4.2.5.3 0 .1 0 .6-.2 1.1Z"/></svg>
         Mandar por WhatsApp</a>`
    : `<span class="small muted">Escribe el WhatsApp a 10 dígitos y aparece el botón.</span>`;
  const em=ok
    ? `<a class="btn ghost" style="text-decoration:none" target="_blank" rel="noopener"
          onclick="guardaContacto('${id}')"
          href="mailto:${encodeURIComponent(mail)}?subject=${encodeURIComponent("Pedido "+p.folio+" — Casa Pepe")}&body=${encodeURIComponent(txt)}">✉️ Mandar por correo</a>`
    : "";
  const marca=(tel||ok)&&p.estado!=="enviado"
    ? `<button class="btn ghost sm" onclick="marcarEnviado('${id}')">Ya se lo mandé</button>` : "";
  box.innerHTML=wa+em+marca+(tel?`<span class="small muted" style="flex-basis:100%">
      Se abre tu WhatsApp con el mensaje ya escrito al +${esc(tel)}. Revísalo antes de darle enviar.
      · <a href="${urlWhatsWeb(tel,txt)}" target="_blank" rel="noopener" onclick="guardaContacto('${id}')">¿No se abre? Usar WhatsApp Web</a>
    </span>`:"");
}
/* Si corrigieron el teléfono o el correo aquí, que queden en la ficha y no haya
   que volver a escribirlos el mes que viene. */
async function guardaContacto(id){
  const p=PEDIDOS.find(x=>x.id===id); if(!p||!p.proveedor_id) return;
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id)||{};
  const tel =((($("enTel") ||{}).value)||"").trim();
  const mail=((($("enMail")||{}).value)||"").trim();
  const patch={};
  if(tel  && tel !==(prov.telefono||"")) patch.telefono=tel;
  if(mail && mail!==(prov.mail    ||"")) patch.mail=mail;
  if(!Object.keys(patch).length) return;
  const {error}=await sb.from("proveedores").update(patch).eq("id",p.proveedor_id);
  if(!error){ Object.assign(prov,patch); toast("Guardado en la ficha del proveedor"); }
}

/* ─────────── El aviso de los 250 kilos de epazote ───────────
   Pasa constantemente: el producto está en KILOS, la gente piensa en gramos y
   teclea 250. No son 250 gramos de epazote, son un cuarto de tonelada. Hasta hoy
   nadie lo veía hasta que llegaba el camión: hay 500 kg de blueberry aprobados
   ($229.411) y media tonelada de longaniza ya metida en el stock de Puebla.
   La regla es deliberadamente simple y NO bloquea: a partir de 20 kg o 20 litros
   se avisa, se dice en cuánto sale, y se ofrece el número que casi siempre era el
   bueno —el mismo dividido entre mil—. Quien de verdad compra 25 kg de cebolla
   lee el aviso, ve que la cifra cuadra y sigue; no se le impide nada. */
const UNID={kg:"KILOGRAMOS",l:"LITROS",ml:"MILILITROS",gr:"GRAMOS",pza:"PIEZAS",paq:"PAQUETES"};
function avisaCantidad(prod,cant,precio){
  if(!prod||!(cant>0)) return null;
  const u=(prod.unidad_base||"").toLowerCase();
  const gordo = (u==="kg"||u==="l") ? cant>=20 : (u==="pza" ? cant>=200 : false);
  if(!gordo) return null;
  const chico=+(cant/1000).toFixed(3);
  const imp=precio>0?cant*precio:0;
  return {
    unidad:UNID[u]||u.toUpperCase(),
    cant, chico,
    texto:`Ojo: ${esc(prod.nombre)} se pide en ${UNID[u]||u}. Estás pidiendo `
          +`<b>${num(cant)} ${u}</b>`+(imp?` — son ${money(imp)}`:"")+`.`,
    sugerencia:(u==="kg"||u==="l")
      ? `Si lo que querías eran ${num(cant)} ${u==="kg"?"gramos":"mililitros"}, la cantidad es ${num(chico)} ${u}.`
      : `Revisa que sean de verdad ${num(cant)} piezas.`
  };
}
/* El mismo aviso, pintado dentro del pedido, para que quien aprueba lo vea sin
   tener que repasar línea por línea. */
function avisosLineas(p){
  const l=(p.items||[]).map(i=>i.prod?avisaCantidad(i.prod,+i.cantidad_solicitada,+i.precio_unitario):null).filter(Boolean);
  if(!l.length) return "";
  return `<div class="avisos" style="border-color:var(--bad);background:var(--bad-bg)">
    <b>Revisa estas cantidades antes de mandarlo:</b>
    ${l.map(a=>`<div style="margin-top:6px">${a.texto} ${esc(a.sugerencia)}</div>`).join("")}</div>`;
}

/* ── Detalle del pedido ── */
function verPedido(id){
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return;
  const prov=PROVS.find(x=>x.proveedor_id===p.proveedor_id);
  const bod=BODEGAS.find(b=>b.id===p.bodega_destino_id);
  const cta=CUENTAS.find(c=>c.id===p.cuenta_id);
  /* Ahora hay tres etapas, y "Solicitado" es donde se trabaja: cuando el pedido le
     llega a compras, ahí se le cambian cantidades, precios, proveedor, bodega y
     cuenta, y desde ahí mismo se le manda al proveedor. Por eso el encabezado es
     editable en toda la etapa Solicitado —borrador y solicitado— y no solo en
     borrador como antes, que obligaba a devolver el pedido para corregir una cifra. */
  const etapa=etapaDe(p.estado);
  const editable=["borrador","solicitado"].includes(p.estado)&&PUEDE_EDITAR;
  /* El destino se puede corregir después de mandarlo. Quien pide no siempre sabe
     a qué bodega entra ni a qué cuenta va; quien aprueba sí. Antes el encabezado
     solo se tocaba en borrador, así que un pedido mal destinado ya no había
     manera de enderezarlo y la mercancía entraba donde no era.
     Se corrige solo el destino —bodega y cuenta—: ni el proveedor ni las líneas,
     que a esas alturas ya están comprometidos con el proveedor. */
  const corrige = !editable && PUEDE_APROBAR &&
                  ["aprobado","enviado","recibido_parcial"].includes(p.estado);
  /* Las cantidades y los precios se corrigen en la propia tabla. Antes solo se podía
     borrar la línea entera y volverla a meter: si alguien teclaba 2.500 kilos de nopal
     en vez de 2,5 —pasó de verdad, PC-2610-0118, $95.000— no había forma de arreglar
     el número. Se toca en toda la etapa Solicitado, que es justo cuando compras lo
     revisa y donde se cazan esos ceros de más. */
  const tocaLineas = editable;

  const lineas=(p.items||[]).map(i=>{
    const pres=i.pres?`${i.pres.tipo} ${num(i.pres.contenido)} ${i.pres.unidad_contenido}`:"—";
    const campo=(col,val,paso,suf)=>tocaLineas
      ? `<input type="number" step="${paso}" min="0" class="celda" value="${val==null?"":val}"
               onchange="guardaCampo('${i.id}','${col}',this,'${p.id}')">${suf||""}`
      : (col==="precio_unitario" ? money(val) : num(val)+(suf||""));
    return `<tr>
      <td>${esc(i.prod?i.prod.nombre:(i.descripcion||"—"))}<div class="small muted">${i.prod?esc(pres):(i.suministro_id?"solicitud de mantenimiento":"texto libre")}</div></td>
      <td class="num">${campo("cantidad_solicitada",i.cantidad_solicitada,"any")}</td>
      <td class="num">${campo("precio_unitario",i.precio_unitario,"0.01")}</td>
      <td class="num small">${campo("tasa_iva",i.tasa_iva,"0.01","%")}</td>
      <td class="num">${money(i.importe)}</td>
      ${tocaLineas?`<td class="num"><button class="btn ghost sm" onclick="borraLinea('${i.id}','${p.id}')">✕</button></td>`:""}
    </tr>`;
  }).join("");

  const avisoProv = p.info_pendiente ? `<div class="avisos">Información pendiente: falta ${esc((p.info_faltante||[]).join(", "))}. No puede solicitarse hasta completarlo.</div>`
    : !p.proveedor_id ? `<div class="avisos">Este pedido no tiene proveedor. No puede solicitarse hasta asignarlo.</div>`
    : (prov && prov.activo===false ? `<div class="avisos">Este proveedor no ha tenido movimiento en los últimos 3 meses.</div>` : "");
  const avisoFijo = avisoOtroProveedor(p);

  /* Un solo botón para mover el pedido, no tres. Antes había "Solicitar",
     "Solicitar y aprobar" y "Aprobar" para la misma decisión, repartidos entre dos
     etapas que el que compra vive como una. Ahora: lo revisas y lo pasas a
     pendiente de recibir. Y mandárselo al proveedor no espera a aprobarlo: está
     arriba del todo desde el primer momento, que es como se pide de verdad —primero
     le escribes al proveedor, después lo dejas apuntado. */
  let acciones="";
  if(etapa&&etapa.k==="solicitado"&&PUEDE_EDITAR)
    acciones=`<button class="btn ghost" onclick="agregarLinea('${p.id}')">＋ Agregar producto</button>
              <button class="btn ghost danger" onclick="cambiaEstado('${p.id}','cancelado')">Cancelar pedido</button>
              ${PUEDE_APROBAR?`<button class="btn" onclick="aprobar('${p.id}')">Pasar a pendiente de recibir</button>`:""}`;
  else if(etapa&&etapa.k==="solicitado"&&PUEDE_APROBAR)
    acciones=`<button class="btn" onclick="aprobar('${p.id}')">Pasar a pendiente de recibir</button>`;
  else if(etapa&&etapa.k==="pendiente")
    acciones=`<button class="btn ghost" onclick="ordenQR('${p.id}')">📄 Orden con QR</button>
              <button class="btn" onclick="abrirRecepcion('${p.id}')">Registrar recepción</button>`;

  modal(`
    <h3 style="margin:0 0 4px">${esc(p.folio)} ${chipEst(p.estado)}</h3>
    <div class="small muted" style="margin-bottom:10px">${esc(p.area||"")} · ${esc(prov?prov.proveedor:"sin proveedor")} · destino ${esc(bod?bod.nombre:"—")} · cuenta ${esc(cta?cta.codigo+" "+cta.cuenta:"—")}</div>
    ${avisoProv}
    ${avisoFijo}
    ${avisosLineas(p)}
    ${bloqueEnvio(p,prov)}
    ${editable?`<div class="grid2">
      <div><label>Área</label><select id="edArea" onchange="edCascada('${p.id}')">${optArea(p.area)}</select></div>
      <div><label>Proveedor</label><select id="edProv" onchange="cabAuto('${p.id}')">${optProv(p.proveedor_id,p.area)}</select></div>
      <div><label>Cuenta contable</label><select id="edCta" onchange="cabAuto('${p.id}')">${optCta(p.cuenta_id,p.area)}</select></div>
      <div><label>Bodega destino</label><select id="edBod" onchange="cabAuto('${p.id}')">${optBod(p.bodega_destino_id,p.area)}</select></div>
      <div><label>Fecha requerida</label><input type="date" id="edFecha" value="${p.fecha_requerida||""}" onchange="cabAuto('${p.id}')"></div>
      <div class="full"><label>Notas</label><input id="edNotas" value="${esc(p.notas||"")}" oninput="cabAuto('${p.id}')"></div>
      <div class="full small muted">Se guarda solo. <span id="cabEstado"></span></div>
    </div>`:""}
    ${corrige?`<div class="card" style="margin-top:10px">
      <h3>Corregir el destino</h3>
      <div style="padding:10px 14px">
        <div class="small muted" style="margin-bottom:8px">El pedido ya salió, así que el proveedor y las líneas
          quedan como están. Lo que sí se puede enderezar es a qué bodega entra la mercancía y a qué cuenta va el gasto.</div>
        <div class="grid2">
          <div><label>Bodega destino</label><select id="coBod">${optBod(p.bodega_destino_id,null)}</select></div>
          <div><label>Cuenta contable</label><select id="coCta">${optCta(p.cuenta_id,null)}</select></div>
        </div>
        <button class="btn ghost sm" style="margin-top:10px" onclick="corrigeDestino('${p.id}')">Guardar el destino</button>
        <span class="small muted" id="coEstado" style="margin-left:8px"></span>
      </div></div>`:""}
    <div class="card" style="margin-top:12px"><div class="scroll"><table>
      <thead><tr><th>Producto</th><th class="num">Cantidad</th><th class="num">Precio</th><th class="num">IVA</th><th class="num">Importe</th>${tocaLineas?"<th></th>":""}</tr></thead>
      <tbody>${lineas||`<tr><td colspan="6" class="center">Sin líneas</td></tr>`}</tbody>
      <tfoot>
        <tr><th colspan="4" class="num">Subtotal</th><th class="num">${money(p.subtotal)}</th>${tocaLineas?"<th></th>":""}</tr>
        <tr><th colspan="4" class="num">IVA</th><th class="num">${money(p.impuestos)}</th>${tocaLineas?"<th></th>":""}</tr>
        <tr><th colspan="4" class="num">Total</th><th class="num">${money(p.total)}</th>${tocaLineas?"<th></th>":""}</tr>
      </tfoot>
    </table></div></div>
    ${bitacora(p)}
    <div class="foot"><button class="btn ghost" onclick="closeModal()">Cerrar</button>${acciones}</div>`);
  if($("enBotones")) pintaEnvio(p.id);
}
/* Si el pedido va a un proveedor distinto del que de verdad ha traído ese
   producto, se dice en voz alta: es el error que se cuela sin avisar. */
function avisoOtroProveedor(p){
  if(!p.proveedor_id) return "";
  const l=(p.items||[]).map(i=>{
    const u=ULTPROV[i.producto_id];
    if(!u || u.proveedor_id===p.proveedor_id) return null;
    const n=(PROVS.find(x=>x.proveedor_id===u.proveedor_id)||{}).proveedor;
    return `${esc(i.prod?i.prod.nombre:(i.descripcion||""))} lo trajo <b>${esc(n||"otro proveedor")}</b>`;
  }).filter(Boolean);
  if(!l.length) return "";
  return `<div class="avisos">La última entrega de ${l.length===1?"este producto":"estos productos"} fue con otro proveedor:
    ${l.join(" · ")}. Si es a propósito, sigue; si no, cambia el proveedor del pedido.</div>`;
}
function bitacora(p){
  const l=[];
  if(p.solicitado_at) l.push(`Solicitado por ${esc(p.solicitado_por_nombre||"")} el ${new Date(p.solicitado_at).toLocaleString("es-MX")}`);
  if(p.aprobado_at)   l.push(`Aprobado por ${esc(p.aprobado_por_nombre||"")} el ${new Date(p.aprobado_at).toLocaleString("es-MX")}`);
  if(p.rechazo_motivo)l.push(`Rechazado: ${esc(p.rechazo_motivo)}`);
  if(p.enviado_at)    l.push(`Enviado a ${esc(p.enviado_a_mail||"")} el ${new Date(p.enviado_at).toLocaleString("es-MX")}`);

/* El encabezado se guarda solo.
   Antes había que acordarse de pulsar "Guardar encabezado": si elegías el
   proveedor y dabas directo a "Solicitar aprobación", el pedido salía sin
   proveedor y se quedaba atorado sin decir por qué. Eso es lo que le pasaba a
   Clau en Puebla. Ahora cada cambio se guarda a los 400 ms, y antes de cualquier
   cambio de estado se fuerza el guardado. */
async function cabPatch(id,{callado}={}){
  if(!$("edArea")) return {ok:true};          // encabezado no editable: nada que guardar
  const patch={area:$("edArea").value,proveedor_id:$("edProv").value||null,bodega_destino_id:$("edBod").value||null,
    cuenta_id:$("edCta").value||null,fecha_requerida:$("edFecha").value||null,notas:$("edNotas").value||null};
  const {error}=await sb.from("cmp_pedidos").update(patch).eq("id",id);
  const av=$("cabEstado");
  if(error){ if(av) av.textContent="no se pudo guardar"; toast(error.message); return {ok:false}; }
  const p=PEDIDOS.find(x=>x.id===id); if(p) Object.assign(p,patch);
  if(av && !callado){ av.textContent="guardado ✓"; setTimeout(()=>{ if(av.textContent==="guardado ✓") av.textContent=""; },1600); }
  return {ok:true};
}
let CAB_T=null;
function cabAuto(id){
  clearTimeout(CAB_T);
  const av=$("cabEstado"); if(av) av.textContent="guardando…";
  CAB_T=setTimeout(()=>cabPatch(id),400);
}
/* Corregir el destino de un pedido que ya salió. Solo bodega y cuenta, y solo
   quien puede aprobar. Queda en la bitácora para que se sepa quién lo movió. */
async function corrigeDestino(id){

async function guardaCab(id){

/* Lo que de verdad impide mandar un pedido. El precio NO entra aquí: muchas
   líneas se piden sin precio y el precio llega con la factura, al recibir. */
async function faltaAvisa(id){
  clearTimeout(CAB_T);
  const r=await cabPatch(id,{callado:true});
  if(!r.ok) return false;
  const p=PEDIDOS.find(x=>x.id===id); if(!p) return true;
  const f=[];
  if(!p.proveedor_id)        f.push("proveedor");
  if(!p.bodega_destino_id)   f.push("bodega destino");
  if(!p.cuenta_id)           f.push("cuenta contable");
  if(!(p.items||[]).length)  f.push("al menos una línea");
  if(f.length){ toast("Antes de mandarlo falta: "+f.join(", ")+"."); return false; }
  const sin=(p.items||[]).filter(i=>!(+i.precio_unitario>0));
  if(sin.length) toast(`${sin.length} línea(s) van sin precio. Se pide igual: el precio se captura al recibir la factura.`);
  return true;
}

// Se pide todo lo que esté activo en el catálogo, sin filtrar por tipo: si se compra,

// El mismo catálogo visto de tres maneras: favoritos, por pasillo o por proveedor.
// En "proveedor" un producto que venden dos aparece en los dos, con el precio de cada uno.
// "Favoritos" es la lista de trabajo de la casa: lo que de verdad se pide y los
// ingredientes del menú. El catálogo completo sigue entero en "Por pasillo" —
// ahí están las 334 botellas de tequila de Alianza para cuando se busca una.
const SINPROV="Sin proveedor asignado";
function itemsVista(){
  let base=catalogo();
  if(VISTA==="favoritos") base=base.filter(x=>x.p.favorito);
  if(VISTA!=="proveedor") return base.map(x=>Object.assign({},x,{grupo:pasilloDe(x.p), key:x.p.id}));
  const out=[];
  base.forEach(x=>{
    if(!x.ops.length){ out.push(Object.assign({},x,{grupo:SINPROV, key:x.p.id})); return; }
    x.ops.forEach(o=>out.push({p:x.p, ops:[o], mejor:o, grupo:o.proveedor||SINPROV, key:x.p.id+"-"+o.presentacion_id}));
  });
  return out;
}
function cpCats(){
  const m={};
  itemsVista().forEach(x=>{ m[x.grupo]=(m[x.grupo]||0)+1; });

}
/* Por pasillo ya no hay desplegable: con 80 pasillos y subpasillos la lista era
   interminable y había que bajar a ciegas. Ahora los pasillos de arriba salen
   cerrados con un ＋; lo abres solo si te interesa y ahí eliges el subpasillo.
   Por proveedor sí se queda el desplegable: es una lista plana. */
let ARB_RAIZ="", ARB_KEYS=[], ARB_RAICES=[];
function cpPintaCats(){
  const cats=cpCats(), tot=cats.reduce((a,c)=>a+c[1],0);
  const s=$("cpSel"), arb=$("cpArbol");
  if(VISTA==="proveedor"){
    if(arb){ arb.innerHTML=""; arb.style.display="none"; }
    if(s){
      s.style.display="";
      s.innerHTML=`<option value="">Todos los proveedores (${tot})</option>`
        +cats.map(([k,n])=>`<option value="${esc(k)}"${CATFIL===k?" selected":""}>${esc(k)} (${n})</option>`).join("");
    }
    return;
  }
  if(s){ s.style.display="none"; s.innerHTML=""; }
  if(!arb) return;
  arb.style.display="";

  // Se agrupa por el pasillo de arriba; los subpasillos son los hijos.
  const porRaiz={}, orden=[];
  cats.forEach(([k,n])=>{
    const r=k.split(" › ")[0];
    if(!porRaiz[r]){ porRaiz[r]=[]; orden.push(r); }
    porRaiz[r].push([k,n]);
  });
  orden.sort((a,b)=>a===SINPROV?1:b===SINPROV?-1:a.localeCompare(b));

  /* Los nombres se pasan por índice, no metidos en el onclick: un pasillo con
     apóstrofo ("Vinos d'Oc") rompería el atributo. */
  ARB_KEYS=[]; ARB_RAICES=orden.slice();
  const cabeza=`<button class="arbTodo${CATFIL?"":" on"}" onclick="cpEligePasillo(-1)">Todo (${tot})</button>`;
  const ramas=orden.map((r,ir)=>{
    const hijos=porRaiz[r], suma=hijos.reduce((a,x)=>a+x[1],0);
    const abierta=ARB_RAIZ===r || (CATFIL && CATFIL.split(" › ")[0]===r);
    // Un pasillo sin subpasillos se elige directo, sin ＋.
    if(hijos.length===1 && hijos[0][0]===r){
      const i=ARB_KEYS.push(r)-1;
      return `<div class="arbRama"><button class="arbRaiz${CATFIL===r?" on":""}" onclick="cpEligePasillo(${i})">
        <span class="arbMas">·</span>${esc(r)} <span class="arbN">${suma}</span></button></div>`;
    }
    return `<div class="arbRama">
      <button class="arbRaiz${abierta?" abierta":""}" onclick="cpAbreRaiz(${ir})">
        <span class="arbMas">${abierta?"－":"＋"}</span>${esc(r)} <span class="arbN">${suma}</span></button>
      ${abierta?`<div class="arbHijos">${hijos.map(([k,n])=>{
        const et=k.split(" › ").slice(1).join(" › ")||k;
        const i=ARB_KEYS.push(k)-1;
        return `<button class="arbHijo${CATFIL===k?" on":""}" onclick="cpEligePasillo(${i})">${esc(et)} <span class="arbN">${n}</span></button>`;
      }).join("")}</div>`:""}
    </div>`;
  }).join("");
  arb.innerHTML=`<div class="arbol">${cabeza}${ramas}</div>`;
}
function cpAbreRaiz(ir){ const r=ARB_RAICES[ir]; if(r==null) return; ARB_RAIZ=(ARB_RAIZ===r?"":r); cpPintaCats(); }
function cpEligePasillo(i){
  const k = i<0 ? "" : (ARB_KEYS[i]||"");
  CATFIL=k; ARB_RAIZ = k ? k.split(" › ")[0] : ""; ABIERTAS={};
  cpPintaCats(); cpPintaGrid();
}
const catDe=pid=>{const p=PRODS.find(x=>x.id===pid); return p?pasilloDe(p):null;};
/* El pasillo se muestra con su ruta: "Bebidas › Alcohólicas › Cerveza".
   Si el producto todavía no tiene pasillo, se cae a la categoría de siempre. */
function pasilloDe(p){
  const x=p&&p.pasillo_id&&PASILLOS[p.pasillo_id];
  return x ? x.ruta : (p&&(p.categoria||p.area)||"Sin pasillo");
}
/* El orden de las opciones dice qué se pide por defecto. Manda con quién se
   recibió de verdad la última vez: si el abrelatas lo trajo El Titán, el
   siguiente abrelatas se pide a El Titán aunque otro lo tenga más barato.
   El más barato sigue estando en la lista, marcado, para cambiarlo a mano. */
function cpOpciones(prodId){
  const p=PRODS.find(x=>x.id===prodId)||{};
  const u=ULTPROV[prodId];
  const ops=CATPROV.filter(c=>c.producto_id===prodId&&c.precio!=null)
    .map(c=>{const base=cvtBase(c.contenido,c.unidad_contenido,p.unidad_base);
             return Object.assign({},c,{porUnidad: base>0? c.precio/base : null});})
    .sort((a,b)=>(a.porUnidad==null?1:b.porUnidad==null?-1:a.porUnidad-b.porUnidad));
  if(ops.length) ops[0].barato=true;
  if(!u) return ops;
  // Primero la presentación exacta que se recibió; si ya no existe, cualquiera del mismo proveedor.
  let i=ops.findIndex(o=>o.presentacion_id===u.presentacion_id);
  if(i<0) i=ops.findIndex(o=>o.proveedor_id===u.proveedor_id);
  if(i<0) return ops;
  ops[i].fijo=true; ops[i].veces=u.veces;
  return [ops[i]].concat(ops.filter((_,j)=>j!==i));
}
function cvtBase(cant,de,a){
  if(de===a) return cant;
  if(de==="l"&&a==="ml") return cant*1000;
  if(de==="ml"&&a==="l") return cant/1000;
  if(de==="kg"&&a==="gr") return cant*1000;
  if(de==="gr"&&a==="kg") return cant/1000;
  return cant;
}
function cpPintaGrid(){

  // Sin catálogo cargado en la sede: decirlo, no dejar la pantalla muda.
  if(!todo.length){

    g.innerHTML=`<div class="avisos">${
      ERRCARGA.length
      ? `No se pudo cargar el catálogo de <b>${esc(sede)}</b> (${esc(ERRCARGA.join(" · "))}).
         Recarga la página; si sigue igual, avísale a administración — no es que no haya productos.`
      : hay
      ? `El catálogo de <b>${esc(sede)}</b> no tiene productos pedibles de tus áreas (${esc(MISAREAS.join(" · "))}).`
      : `<b>${esc(sede)}</b> todavía no tiene catálogo de compras cargado. Pídeselo a administración o cambia de sede arriba.`}</div>`;
    return;
  }

  let items=todo;
  if(CATFIL) items=items.filter(x=>x.grupo===CATFIL);

  if(!items.length){
    g.innerHTML=`<div class="avisos">Ningún producto de tus áreas coincide con «${esc(q||CATFIL)}».
      <a href="javascript:void(0)" onclick="cpLimpiaFil()">Ver todo el catálogo</a></div>`;
    return;
  }

  // Con búsqueda o grupo elegido se muestra plano; si no, se navega con +

    const mas=items.length>120?`<div class="avisos">Mostrando 120 de ${items.length}. Afina la búsqueda o elige ${VISTA==="proveedor"?"proveedor":"pasillo"}.</div>`:"";
    g.innerHTML=`<div class="pgrid">${items.slice(0,120).map(tarjeta).join("")}</div>${mas}`;
    return;
  }

  const grupos={};
  items.forEach(x=>{ (grupos[x.grupo]=grupos[x.grupo]||[]).push(x); });
  const claves=Object.keys(grupos).sort((a,b)=>a===SINPROV?1:b===SINPROV?-1:a.localeCompare(b));
  if(!Object.keys(ABIERTAS).length && claves.length) ABIERTAS[claves[0]]=true; // la primera abierta, para ver producto sin buscar
  g.innerHTML=claves.map(k=>{
    const ab=!!ABIERTAS[k], l=grupos[k];
    const sinPrecio=l.filter(x=>!x.mejor).length;
    return `<div class="acc">

        <span class="accn">${l.length}${sinPrecio?` · ${sinPrecio} sin precio`:""}</span>
      </button>
      ${ab?`<div class="pgrid">${l.slice(0,120).map(tarjeta).join("")}</div>
           ${l.length>120?`<div class="avisos">Mostrando 120 de ${l.length}. Usa el buscador para afinar.</div>`:""}`:""}
    </div>`;
  }).join("");
}
function cpLimpiaFil(){ CATFIL=""; ARB_RAIZ=""; const b=$("cpBusca"); if(b) b.value=""; cpPintaCats(); cpPintaGrid(); }
/* La estrella la maneja el equipo: la lista de favoritos la curan ellos, no yo.
   Se pinta al momento y se guarda detrás; si falla, se devuelve como estaba. */
async function marcaFav(pid){

  toast(p.favorito?"⭐ "+p.nombre+" en favoritos":"Fuera de favoritos: "+p.nombre);
}
function tarjeta(x){
  const p=x.p, ops=x.ops, b=x.mejor, k=x.key||p.id;
  const sug=(SUG.find(s=>s.producto_id===p.id)||{}).piezas_a_pedir;
  const bajo=(SUG.find(s=>s.producto_id===p.id)||{}).faltante>0;
  // En la vista por proveedor cada tarjeta ya es de un proveedor: se muestra el pasillo.
  const pie=VISTA==="proveedor"?esc(pasilloDe(p)):(b?esc(b.proveedor):"");
  return `<div class="pcard${b?"":" sinprecio"}">
    <div class="pnom"><span class="estrella${p.favorito?" on":""}" title="${p.favorito?"Quitar de favoritos":"Marcar como favorito"}"

    <div class="small muted">${esc(p.unidad_texto||p.unidad_base)}${bajo?` · <b style="color:var(--warn)">bajo mínimo</b>`:""}</div>
    ${b? `<div class="pprec">${money(b.precio)} <span class="small muted">${esc(b.presentacion)} ${num(b.contenido)}${esc(b.unidad_contenido)}</span></div>
          ${b.fijo?`<div class="small" style="color:var(--ok)">✓ el de siempre${b.veces>1?` · ${b.veces} entregas`:""}</div>`:""}
          ${ops.length>1?`<select id="op-${k}" class="small">${ops.map(o=>
              `<option value="${o.presentacion_id}">${esc(o.proveedor)} · ${money(o.precio)}${o.fijo?" · el de siempre":o.barato?" · más barato":""}</option>`).join("")}</select>`
            :`<input type="hidden" id="op-${k}" value="${b.presentacion_id}"><div class="small muted">${pie}</div>`}`
       : `<div class="pprec small" style="color:var(--warn)">Sin precio cargado</div>
          <input type="hidden" id="op-${k}" value="">
          <div class="small muted">Se pide igual; administración le pone proveedor.</div>`}
    <div class="padd">
      <input class="mini" id="qt-${k}" type="number" min="1" step="1" value="${sug||1}">
      <button class="btn sm" onclick="cpAdd('${p.id}','${k}')">Agregar</button>
    </div></div>`;
}
function cpAdd(prodId,key){
  const p=PRODS.find(x=>x.id===prodId); if(!p) return;
  const k=key||prodId;
  const presId=($("op-"+k)||{}).value||"";
  const cant=parseFloat(($("qt-"+k)||{}).value)||1;
  const c=presId?CATPROV.find(x=>x.presentacion_id===presId):null;
  const clave=presId||("np-"+prodId);
  const ya=CART.find(x=>x.clave===clave);
  if(ya){ ya.cant=cant; toast(`Actualizado a ${num(cant)} en el carrito`); }
  else CART.push({clave, producto_id:prodId, presentacion_id:presId||null,
    proveedor_id:c?c.proveedor_id:null, proveedor:c?c.proveedor:"Por asignar",
    producto:p.nombre, precio:c?c.precio:null, area:p.area,
    tasa:p.tasa_iva_default!=null?p.tasa_iva_default:16, cant});
  cpPintaCart();
}
function cpQuita(i){ CART.splice(i,1); cpPintaCart(); }
/* Ajuste de cantidad en el carrito con + / − (o tecleando). Fija la cantidad,
   no la suma, para que "pido 5" sea 5. El mínimo es 1; para quitar, la ✕. */
function cpSetCant(i,v){ let n=parseFloat(v); if(!(n>0)) n=1; CART[i].cant=n; cpPintaCart(); }
function cpInc(i){ cpSetCant(i,(+CART[i].cant||0)+1); }
function cpDec(i){ cpSetCant(i,(+CART[i].cant||0)-1); }
function cpTotales(){
  const sinPrecio=CART.filter(x=>x.precio==null).length;
  const sub=CART.reduce((a,x)=>a+x.cant*(+x.precio||0),0);
  const iva=CART.reduce((a,x)=>a+x.cant*(+x.precio||0)*(x.tasa/100),0);
  return {sub,iva,total:sub+iva,sinPrecio};
}
function cpPintaCart(){
  const box=$("cpCart"); if(!box) return;
  const t=cpTotales();
  $("cpCrear").disabled=!CART.length; $("cpGuardar").disabled=!CART.length;
  if(!CART.length){ box.innerHTML=`<div class="small muted" style="margin-top:10px">Tu carrito está vacío.</div>`; return; }
  const provs=[...new Set(CART.map(x=>x.proveedor))];
  box.innerHTML=`${t.sinPrecio?`<div class="avisos">${t.sinPrecio} producto(s) sin precio: el pedido saldrá marcado como <b>info pendiente</b> para que administración le ponga proveedor y costo.</div>`:""}
    <div class="card"><h3>🛒 Carrito · ${CART.length} producto(s) · ${provs.length} proveedor(es)</h3>
    <div class="scroll"><table><tbody>
      ${CART.map((x,i)=>`<tr><td>${esc(x.producto)}<div class="small muted">${esc(x.proveedor)} · IVA ${num(x.tasa)}%</div></td>
        <td class="num" style="white-space:nowrap">
          <button class="btn ghost sm" onclick="cpDec(${i})" aria-label="menos">−</button>
          <input type="number" inputmode="decimal" min="0" step="1" value="${x.cant}" onchange="cpSetCant(${i},this.value)" style="width:52px;text-align:center;padding:4px;border:1px solid #d9cfc0;border-radius:8px;background:#fff">
          <button class="btn ghost sm" onclick="cpInc(${i})" aria-label="más">+</button>
          <div class="small muted">× ${money(x.precio)}</div></td>
        <td class="num">${money(x.cant*(+x.precio||0))}</td>
        <td class="num"><button class="btn ghost sm" onclick="cpQuita(${i})">✕</button></td></tr>`).join("")}
    </tbody><tfoot>
      <tr><th colspan="2" class="num">Subtotal</th><th class="num">${money(t.sub)}</th><th></th></tr>
      <tr><th colspan="2" class="num">IVA</th><th class="num">${money(t.iva)}</th><th></th></tr>
      <tr><th colspan="2" class="num">Total</th><th class="num">${money(t.total)}</th><th></th></tr>
    </tfoot></table></div></div>`;
}

async function cargaPlantillas(){
  const {data}=await sb.from("cmp_plantillas").select("*, items:cmp_plantilla_items(*)")
    .eq("property_id",SEDE).eq("activo",true).in("area",MISAREAS);
  PLANTILLAS=data||[];
  const box=$("cpPlant"); if(!box) return;
  box.innerHTML=PLANTILLAS.length?`<div class="chips" style="margin-bottom:8px">
    <span class="small muted">Pedido base:</span>
    ${PLANTILLAS.map(p=>`<span class="pill" onclick="cpCargaBase('${p.id}')">⭐ ${esc(p.nombre)} (${(p.items||[]).length})</span>`).join("")}</div>`:"";
}
function cpCargaBase(id){
  const pl=PLANTILLAS.find(x=>x.id===id); if(!pl) return;
  (pl.items||[]).forEach(it=>{
    const c=CATPROV.find(x=>x.presentacion_id===it.presentacion_id)||CATPROV.find(x=>x.producto_id===it.producto_id);
    if(!c||!MISAREAS.includes(c.area)) return;
    const ya=CART.find(x=>x.clave===c.presentacion_id);
    if(ya) ya.cant+=(+it.cantidad||1);
    else CART.push({clave:c.presentacion_id,producto_id:c.producto_id,presentacion_id:c.presentacion_id,proveedor_id:c.proveedor_id,
      proveedor:c.proveedor,producto:c.producto,precio:c.precio,area:c.area,
      tasa:c.tasa_iva_default!=null?c.tasa_iva_default:16,cant:+it.cantidad||1});
  });
  toast(`Cargado "${pl.nombre}"`); cpPintaCart();
}
async function cpGuardarBase(){
  const nombre=prompt("Nombre del pedido base (ej. \"Barra semanal\")"); if(!nombre) return;
  const {data,error}=await sb.from("cmp_plantillas").insert({property_id:SEDE,nombre:nombre.trim(),
    area:CART[0].area,creado_por:USER.id,creado_por_nombre:EMAIL}).select().single();
  if(error) return toast(error.message);
  const r=await sb.from("cmp_plantilla_items").insert(CART.map(x=>({plantilla_id:data.id,
    producto_id:x.producto_id,presentacion_id:x.presentacion_id,cantidad:x.cant})));

/* Checkout: aquí sale la recomendación de presupuesto */
/* A dónde llega el pedido. Antes se heredaba en silencio de la bodega del
   primer producto y no había forma de cambiarlo al pedir: si la caja de agua
   iba esta vez a la barra en vez de a la bodega general, había que entrar
   después a editar el encabezado. Ahora se elige al confirmar, con la del
   producto puesta por defecto. */
let BODEGA_PEDIDO=null;
function optBodegaPedido(cart){
  const areas=[...new Set((cart||[]).map(x=>x.area).filter(Boolean))];
  const prod=PRODS.find(p=>p.id===((cart||[])[0]||{}).producto_id)||{};
  const sug=prod.bodega_id||null;
  // Primero las bodegas del área del pedido; el resto, agrupadas aparte.
  const dentro=BODEGAS.filter(b=>!b.area||!areas.length||areas.includes(b.area));
  const fuera =BODEGAS.filter(b=>!dentro.includes(b));
  const op=b=>`<option value="${b.id}" ${b.id===sug?"selected":""}>${esc(b.nombre)}</option>`;
  return `<option value="">— se decide al aprobar —</option>`
    + dentro.map(op).join("")
    + (fuera.length?`<optgroup label="Otras áreas">${fuera.map(op).join("")}</optgroup>`:"");
}

async function cpCheckout(){
  const t=cpTotales();
  const grupos={}; CART.forEach(x=>{(grupos[x.proveedor_id]=grupos[x.proveedor_id]||{n:x.proveedor,items:[]}).items.push(x);});
  const cuentas={};
  CART.forEach(x=>{ const p=PRODS.find(y=>y.id===x.producto_id); if(p&&p.cuenta_id)
    cuentas[p.cuenta_id]=(cuentas[p.cuenta_id]||0)+x.cant*(+x.precio||0)*(1+x.tasa/100); });
  BODEGA_PEDIDO=null;
  let avisos="";
  for(const cid of Object.keys(cuentas)){
    const cta=CUENTAS.find(c=>c.id===cid);
    let disp=null;
    try{ const {data}=await sb.rpc("cmp_disponible_cuenta",{p_property:SEDE,p_cuenta:cid}); disp=data; }catch(_){}
    const monto=cuentas[cid];
    if(disp==null){ avisos+=`<div class="small muted">${esc(cta?cta.cuenta:"")}: sin plan cargado, no puedo comparar.</div>`; continue; }
    const queda=disp-monto;
    avisos+=`<div class="${queda<0?"avisos":"card"}" style="padding:10px 12px;margin-top:8px">
      <b>${esc(cta?cta.cuenta:"")}</b><br>
      Disponible del año: ${money(disp)} · este pedido: ${money(monto)} ·
      ${queda<0?`<b>te pasas por ${money(Math.abs(queda))}</b>. Considera pedir menos o dejarlo para el próximo mes.`
                :`quedarían ${money(queda)}.`}</div>`;
  }
  modal(`<h3 style="margin:0 0 8px">Revisar el pedido</h3>
    ${Object.values(grupos).map(g=>`<div class="card"><h3>${esc(g.n)}</h3><div style="padding:10px 14px" class="small">
      ${g.items.map(x=>`${num(x.cant)} × ${esc(x.producto)} · ${money(x.cant*(+x.precio||0))}`).join("<br>")}
    </div></div>`).join("")}
    <div class="card"><h3>Total</h3><div style="padding:10px 14px">
      Subtotal ${money(t.sub)} · IVA ${money(t.iva)} · <b>${money(t.total)}</b></div></div>
    <h3 style="margin:14px 0 0;font-size:.95rem">Presupuesto</h3>
    ${avisos||'<div class="small muted">Sin cuentas asociadas a estos productos.</div>'}
    <h3 style="margin:14px 0 0;font-size:.95rem">¿A dónde llega?</h3>
    <div class="small muted" style="margin:2px 0 6px">La bodega donde se recibe y se da de alta en stock.
      Viene puesta la del producto; cámbiala si esta vez llega a otro sitio.</div>
    <select id="cpBodega" style="width:100%">${optBodegaPedido(CART)}</select>
    <h3 style="margin:14px 0 0;font-size:.95rem">Notas / indicaciones <span class="small muted">(opcional)</span></h3>
    <textarea id="cpNota" class="bfin" rows="2" placeholder="Describe el pedido: marca, maduración, presentación, para qué es, urgencia…" style="width:100%;margin-top:6px;resize:vertical"></textarea>
    <div class="foot"><button class="btn ghost" onclick="cpVolver()">Volver al carrito</button>
      <button class="btn" id="btnCpConfirmar" onclick="cpCrear()">Confirmar y crear ${Object.keys(grupos).length} pedido(s)</button></div>`);
}
function cpVolver(){
  if(MODO==="pedir"){ closeModal(); render(); }

    `<div class="foot"><button class="btn ghost" onclick="closeModal()">Cancelar</button>

async function cpCrear(){
  if(ENVIANDO) return;  // evita que un doble toque cree pedidos duplicados
  ENVIANDO=true;
  const btn=document.getElementById("btnCpConfirmar"); if(btn) btn.disabled=true;
  try{
    const nota=(document.getElementById("cpNota")?.value||"").trim()||null;
    // Lo que se eligió en «¿A dónde llega?». Si lo dejan vacío, se cae a la
    // bodega del producto, como antes.
    BODEGA_PEDIDO=(document.getElementById("cpBodega")?.value||"")||null;
    const grupos={};
    CART.forEach(x=>{ (grupos[x.proveedor_id]=grupos[x.proveedor_id]||[]).push(x); });
    let hechos=0, ultimo=null;
    for(const k of Object.keys(grupos)){
      const items=grupos[k];
      const prod=PRODS.find(p=>p.id===items[0].producto_id)||{};
      const {data:ped,error}=await sb.from("cmp_pedidos").insert({
        property_id:SEDE, area:items[0].area, origen:"manual", estado:"borrador",
        proveedor_id:k&&k!=="null"?k:null, cuenta_id:prod.cuenta_id||null,
        bodega_destino_id: BODEGA_PEDIDO || prod.bodega_id || null,
