<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horarios · Grupo Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a;--rest:#5a4a30}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;padding:10px 16px 0}
.tab{border:1px solid var(--bd);background:var(--surface);color:var(--soft);border-radius:8px 8px 0 0;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.bar{display:flex;align-items:center;gap:8px;padding:10px 16px;flex-wrap:wrap}
.bar button{border:1px solid var(--bd);background:var(--surface);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;color:var(--txt)}
.bar .week{font-weight:700;min-width:175px;text-align:center}
.bar .nav{font-size:15px;font-weight:700}
.bar .copy{background:var(--gold);color:#2b2017;border-color:var(--gold);font-weight:700}
.bar .sep{width:1px;height:22px;background:var(--bd);margin:0 2px}
.bar .status{font-size:12px;color:var(--soft);margin-left:auto;min-width:90px;text-align:right}
.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
#alerts{margin:0 16px 8px;font-size:12.5px}
#alerts .a{background:#fff4e0;border-left:3px solid var(--warn);padding:6px 10px;border-radius:6px;margin-top:5px}
#alerts .a.bad{background:#fbe9e9;border-left-color:var(--bad)}
.legend{padding:0 16px 6px;font-size:11px;color:var(--soft)}
.wrap{overflow-x:auto;padding:0 16px 10px}
table{border-collapse:collapse;width:100%;min-width:900px;background:var(--surface);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--bd);vertical-align:top;padding:0}
thead th{background:#efe6d4;color:var(--txt);font-size:12px;padding:8px 6px;text-align:center}
thead th .num{font-size:16px;font-weight:700}
thead th.today{background:var(--accent);color:#fff}
.puesto{padding:9px 10px;min-width:165px;background:#faf5ea;font-weight:600;font-size:13px}
.puesto .area{display:block;font-size:10px;color:var(--soft);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.puesto .hrs{font-size:10px;color:var(--soft);font-weight:500}
.puesto.rest{background:#23201a;color:#f4ecdd}.puesto.rest .area{color:#cdbf9c}
.cell{min-width:118px;padding:5px;cursor:pointer}
.cell:hover{background:#fcf8f0}
.cell.over{background:#dff0e8;outline:2px dashed var(--accent)}
.concept{font-size:10px;color:var(--gold);font-weight:700;background:#fff7e6;border-radius:4px;padding:2px 5px;margin-bottom:4px;display:block}
.chip{display:flex;flex-direction:column;background:#eaf6f0;border:1px solid #bfe0d0;border-left:3px solid var(--accent);border-radius:6px;padding:4px 6px;margin-bottom:4px;font-size:12px;cursor:grab}
.chip.rest{background:#ece7df;border-left-color:var(--rest)}
.chip.anim{background:#fde9ec;border-left-color:var(--bad)}
.chip b{font-weight:700}.chip .t{font-size:10px;color:var(--soft)}
.chip .x{float:right;color:var(--bad);font-weight:700;cursor:pointer;margin-left:6px}
.add{color:var(--soft);font-size:11px;opacity:0;text-align:center;padding:3px}
.cell:hover .add{opacity:.8}
.resumen{margin:14px 16px 40px;background:var(--surface);border:1px solid var(--bd);border-radius:10px;padding:14px 16px}
.resumen h3{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.rrow{display:flex;justify-content:space-between;background:var(--bg);border-radius:6px;padding:7px 10px;font-size:12px}
.rrow b{font-weight:700}.rrow .v{color:var(--soft);font-variant-numeric:tabular-nums}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20}
.modal.show{display:flex}
.card{background:#fff;border-radius:12px;padding:18px;width:340px;max-width:92vw;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card h3{margin:0 0 4px;font-size:15px}.card .sub{font-size:12px;color:var(--soft);margin-bottom:12px}
.card label{display:block;font-size:12px;font-weight:600;margin:8px 0 3px}
.card input,.card select{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;font-size:14px;font-family:inherit}
.card .row{display:flex;gap:8px}.card .row>div{flex:1}
.card .acts{display:flex;gap:8px;margin-top:14px}
.card .acts button{flex:1;padding:10px;border-radius:8px;border:none;font-weight:700;cursor:pointer}
.card .ok{background:var(--accent);color:#fff}.card .cancel{background:#eee;color:var(--txt)}
.card .restbtn{background:var(--rest);color:#fff;width:100%;padding:9px;border:none;border-radius:8px;font-weight:600;cursor:pointer;margin-top:8px}
@media print{header,.tabs,.bar,.add,.legend,#alerts{display:none!important}.wrap{overflow:visible}.cell{cursor:default}body{background:#fff}}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener('DOMContentLoaded',function(){var h=document.querySelector('header');if(h)h.style.display='none';});}</script>
<header>
  <a href="/">← Panel</a>
  <span class="ttl">Horarios <b>Grupo Casa Pepe</b></span>
  <a href="/m/rh-alta-trabajador.html">＋ Alta de trabajador</a>
  <span style="font-size:11px;color:#cdbf9c;margin-left:auto">Supabase · en vivo</span>
</header>
<div class="tabs" id="tabs"></div>
<div class="bar">
  <button class="nav" id="prev">◀</button>
  <span class="week" id="weeklbl">—</span>
  <button class="nav" id="next">▶</button>
  <button id="thisweek">Hoy</button>
  <button class="copy" id="copy">⧉ Copiar semana anterior</button>
  <span class="sep"></span>
  <button id="restore">↻ Restaurar</button>
  <button id="print">🖨 PDF</button>
  <button id="export">⬇ JSON</button>
  <button id="csv">⬇ Turnos CSV</button>
  <button id="import">↥ Cargar JSON</button>
  <input type="file" id="importfile" accept=".json" style="display:none">
  <span class="status" id="status"></span>
</div>
<div id="alerts"></div>
<div class="legend" id="legend"></div>
<div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="resumen"><h3>Resumen por persona · días trabajados / descanso / horas</h3><div class="rgrid" id="rgrid"></div></div>

<div class="modal" id="modal"><div class="card">
  <h3 id="m-title">Agregar</h3>
  <div class="sub" id="m-sub"></div>
  <div id="m-concept-wrap" style="display:none"><label>Concepto / Actividad</label><input id="m-concept" placeholder="Ej. Walking Tour"><label>Lugar (opcional)</label><input id="m-ubic" placeholder="Ej. Chapultepec"></div>
  <label>Persona</label>
  <select id="m-emp"></select>
  <input id="m-name" placeholder="…o escribe un nombre" style="margin-top:6px">
  <div class="row" id="m-hours"><div><label>Entra</label><input id="m-ini" type="time"></div><div><label>Sale</label><input id="m-fin" type="time"></div></div>
  <button class="restbtn" id="m-rest">Marcar como descanso</button>
  <div class="acts"><button class="cancel" id="m-cancel">Cancelar</button><button class="ok" id="m-ok">Guardar</button></div>
</div></div>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const CDMX='45e69775-d877-4507-a9e1-a45bd3400dc5', VIR='3e10a9ea-4913-4f7c-86ef-0c829caa851d';
const TABS=[
 {id:'front',label:'Front / Recepción',prop:CDMX,areas:['Front Desk','Experiencias','Prevención','A&B · Animación']},
 {id:'ab',label:'A&B',prop:CDMX,areas:['A&B']},
 {id:'cuartos',label:'Cuartos',prop:CDMX,areas:['Cuartos / Housekeeping']},
 {id:'virreyes',label:'Virreyes / Sincrético',prop:VIR,areas:['Virreyes / Sincrético']},
];
const DOW=['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'];
let tab=TABS[0], weekStart=mondayOf(new Date()), puestos=[], asigs=[], roster=[], modalCtx=null;

const $=id=>document.getElementById(id);
function pad(n){return String(n).padStart(2,'0')}
function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function mondayOf(d){d=new Date(d);const k=(d.getDay()+6)%7;d.setDate(d.getDate()-k);d.setHours(0,0,0,0);return d}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function weekDates(m){return [...Array(7)].map((_,i)=>addDays(m,i))}
function lbl(d){return d.getDate()+' '+['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][d.getMonth()]}
function durH(ini,fin){if(!ini||!fin)return 0;const[a,b]=ini.split(':').map(Number),[c,d]=fin.split(':').map(Number);let m=(c*60+d)-(a*60+b);if(m<=0)m+=1440;return m/60}
function status(t,cls){const s=$('status');s.textContent=t||'';s.className='status'+(cls?' '+cls:'')}
async function sb(path,opts){const r=await fetch(SB+path,{headers:H,...opts});if(!r.ok){let t='';try{t=await r.text()}catch(_){}status('⚠ error',' err');console.warn('sb '+r.status,path,t);throw new Error((()=>{try{return JSON.parse(t).message||t}catch(_){return t||('HTTP '+r.status)}})())}const ct=await r.text();if(!ct)return null;try{return JSON.parse(ct)}catch(_){return null}}

function tabFromUrl(){const p=new URLSearchParams(location.search).get('tab');return TABS.find(t=>t.id===p)||TABS.find(t=>t.id==='cuartos')}

async function loadRoster(){try{roster=await sb('/v_empleados_publico?select=id,empleado_id,nombre,area,puesto&estatus=eq.activo&order=nombre');}catch(e){roster=[]}}

async function loadData(){
  status('cargando…');
  const dates=weekDates(weekStart), d0=fmt(dates[0]), d6=fmt(dates[6]);
  const areaQ='area=in.('+tab.areas.map(a=>'"'+encodeURIComponent(a)+'"').join(',')+')';
  let ps=await sb(`/horario_puestos?select=*&property_id=eq.${tab.prop}&${areaQ}&order=area,orden`);
  puestos=ps.filter(p=>{const m=p.metadata||{};return (!m.desde||m.desde<=d6)&&(!m.hasta||m.hasta>=d0)});
  asigs=await sb(`/horarios?select=*&property_id=eq.${tab.prop}&fecha=gte.${d0}&fecha=lte.${d6}`);
  const pids=new Set(puestos.map(p=>p.id));
  asigs=asigs.filter(a=>pids.has(a.puesto_id));
  render(); status('✓ guardado',' ok');
}

function isRest(p){return /DESCANSO/i.test(p.codigo)}
function isAnim(p){return /ANIMACION/i.test(p.codigo)}
function isExp(p){return /EXPERIENCIA|WT|LUCHAS|XOXIMILCO/i.test(p.codigo)}

function render(){
  const dates=weekDates(weekStart), todayStr=fmt(new Date());
  $('weeklbl').textContent=lbl(dates[0])+' – '+lbl(dates[6]);
  let th='<tr><th style="min-width:165px">Puesto</th>';
  dates.forEach(d=>{th+=`<th class="${fmt(d)===todayStr?'today':''}"><div>${DOW[d.getDay()]}</div><span class="num">${d.getDate()}</span></th>`});
  $('thead').innerHTML=th+'</tr>';
  let html='';
  puestos.forEach(p=>{
    const rest=isRest(p), hrs=p.hora_inicio?p.hora_inicio.slice(0,5)+'–'+(p.hora_fin||'').slice(0,5):'';
    html+=`<tr><td class="puesto${rest?' rest':''}"><span class="area">${p.area.replace('Cuartos / Housekeeping','Cuartos')}</span>${p.nombre}${hrs?`<span class="hrs">${hrs}</span>`:''}</td>`;
    dates.forEach(d=>{
      const ds=fmt(d), cell=asigs.filter(a=>a.puesto_id===p.id&&a.fecha===ds);
      let inner='';
      // concepto fijo por día (experiencias) tomado del primer registro con actividad
      const concept=cell.find(a=>a.actividad && !isAnim(p));
      if(isExp(p)&&concept){inner+=`<span class="concept">📍 ${concept.actividad}${concept.ubicacion?' · '+concept.ubicacion:''}</span>`}
      cell.forEach(a=>{
        const esDescanso = rest || (!a.hora_inicio && (a.actividad||'').toLowerCase().includes('descanso'));
        let t;
        if(isAnim(p)) t=(a.actividad||'—')+(a.notas?' · '+a.notas:'');
        else if(a.hora_inicio) t=a.hora_inicio.slice(0,5)+'–'+(a.hora_fin||'').slice(0,5);
        else if(esDescanso) t='Descanso';
        else t=a.actividad||'— sin hora';
        const cls=esDescanso?'rest':(isAnim(p)?'anim':'');
        inner+=`<div class="chip ${cls}" draggable="true" data-id="${a.id}"><span class="x" data-del="${a.id}">×</span><b>${a.nombre_display||a.actividad||'—'}</b><span class="t">${t}</span></div>`;
      });
      html+=`<td><div class="cell" data-puesto="${p.id}" data-fecha="${ds}">${inner}<div class="add">+ agregar</div></div></td>`;
    });
    html+='</tr>';
  });
  if(!puestos.length) html=`<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--soft)">Sin puestos para esta área en esta semana.</td></tr>`;
  $('tbody').innerHTML=html;
  bindCells(); renderResumen(); renderAlerts();
  $('legend').textContent='✋ Arrastra para reasignar · click en celda para agregar · × para quitar · Todo se guarda al instante en Supabase.';
}

function renderResumen(){
  const by={};
  asigs.forEach(a=>{const n=(a.nombre_display||'').trim();if(!n)return;
    by[n]=by[n]||{dias:new Set(),desc:0,horas:0};
    const p=puestos.find(x=>x.id===a.puesto_id)||{};
    if(isRest(p)||(!a.hora_inicio&&(a.actividad||'').toLowerCase().includes('descanso'))) by[n].desc++;
    else {by[n].dias.add(a.fecha); by[n].horas+=durH(a.hora_inicio&&a.hora_inicio.slice(0,5),a.hora_fin&&a.hora_fin.slice(0,5))}});
  const names=Object.keys(by).sort();
  $('rgrid').innerHTML = names.length? names.map(n=>`<div class="rrow"><b>${n}</b><span class="v">${by[n].dias.size}t · ${by[n].desc}d · ${by[n].horas.toFixed(0)}h</span></div>`).join('') : '<div style="color:var(--soft);font-size:12px">Sin asignaciones esta semana.</div>';
}

function renderAlerts(){
  const day={},per={},anim={};
  asigs.forEach(a=>{const n=(a.nombre_display||'').trim();if(!n)return;
    const p=puestos.find(x=>x.id===a.puesto_id)||{};const rest=isRest(p)||(!a.hora_inicio&&(a.actividad||'').toLowerCase().includes('descanso'));
    per[n]=per[n]||{wd:new Set(),r:0};rest?per[n].r++:per[n].wd.add(a.fecha);
    if(!rest){const k=n+'|'+a.fecha;day[k]=(day[k]||0)+1}
    if(isAnim(p)){anim[n]=anim[n]||{dias:new Set(),horas:0};anim[n].dias.add(a.fecha);anim[n].horas+=durH(...(a.notas||'').split('-').map(s=>s.trim()))}});
  const al=[];
  Object.entries(day).forEach(([k,v])=>{if(v>1){const[n,f]=k.split('|');al.push(`<div class="a bad">⚠ <b>${n}</b> ${v} turnos el ${f.slice(8)}/${f.slice(5,7)} (doble asignación).</div>`)}});
  Object.entries(per).forEach(([n,o])=>{if(o.wd.size>=7&&o.r===0)al.push(`<div class="a bad">🔴 <b>${n}</b> trabaja los 7 días, sin descanso.</div>`)});
  Object.entries(anim).forEach(([n,o])=>{if(o.dias.size>5)al.push(`<div class="a bad">⚠ <b>${n}</b> ${o.dias.size} días de animación (máx 5/sem).</div>`)});
  $('alerts').innerHTML=al.join('');
}

function bindCells(){
  document.querySelectorAll('[data-del]').forEach(x=>x.onclick=async e=>{e.stopPropagation();if(!confirm('¿Quitar?'))return;status('guardando…');await sb('/horarios?id=eq.'+x.dataset.del,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}});loadData()});
  document.querySelectorAll('.cell').forEach(c=>{
    c.onclick=e=>{if(e.target.closest('.chip'))return;openAdd(c.dataset.puesto,c.dataset.fecha)};
    c.ondragover=e=>{e.preventDefault();c.classList.add('over')};
    c.ondragleave=()=>c.classList.remove('over');
    c.ondrop=async e=>{e.preventDefault();c.classList.remove('over');const id=e.dataTransfer.getData('id');if(!id)return;status('guardando…');await sb('/horarios?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({puesto_id:c.dataset.puesto,fecha:c.dataset.fecha})});loadData()};
  });
  document.querySelectorAll('.chip').forEach(ch=>{
    ch.ondragstart=e=>e.dataTransfer.setData('id',ch.dataset.id);
    ch.onclick=e=>{if(e.target.closest('.x'))return;e.stopPropagation();const a=asigs.find(x=>x.id===ch.dataset.id);if(a)openEdit(a)};
  });
}

function fillRoster(selId){
  const opts=['<option value="">— elige del catálogo —</option>'].concat(roster.map(r=>`<option value="${r.id}" ${r.id===selId?'selected':''} data-n="${r.nombre}">${r.nombre} · ${r.puesto||''}</option>`));
  $('m-emp').innerHTML=opts.join('');
  $('m-emp').onchange=()=>{const o=$('m-emp').selectedOptions[0];$('m-name').value=o&&o.dataset.n?o.dataset.n:''};
}
function setTypeUI(p){
  const flex=isExp(p)||isAnim(p);
  $('m-concept-wrap').style.display=flex?'block':'none';
  $('m-hours').style.display=isRest(p)?'none':'flex';
  $('m-rest').style.display=isRest(p)?'none':'block';
}
function openAdd(puestoId,fecha){
  const p=puestos.find(x=>x.id===puestoId);modalCtx={p,fecha,editId:null};
  const d=new Date(fecha+'T00:00:00');
  $('m-title').textContent='Agregar a '+p.nombre;$('m-sub').textContent=DOW[d.getDay()]+' '+lbl(d);
  fillRoster(); $('m-name').value=''; setTypeUI(p);
  let ini='',fin='';
  const hpd=(p.metadata||{}).horarios_por_dia;
  if(hpd){const k=['dom','lun','mar','mie','jue','vie','sab'][d.getDay()];if(hpd[k]){const m=hpd[k].split('-');ini=m[0].trim();fin=(m[1]||'').trim()}}
  if(!ini && !isAnim(p)){ini=p.hora_inicio?p.hora_inicio.slice(0,5):'';fin=p.hora_fin?p.hora_fin.slice(0,5):''}
  $('m-ini').value=ini;$('m-fin').value=fin;$('m-concept').value=isExp(p)?(p.nombre||''):'';$('m-ubic').value='';
  $('modal').classList.add('show');setTimeout(()=>$('m-emp').focus(),50);
}
function openEdit(a){
  const p=puestos.find(x=>x.id===a.puesto_id);modalCtx={p,fecha:a.fecha,editId:a.id};
  const d=new Date(a.fecha+'T00:00:00');
  $('m-title').textContent='Editar · '+p.nombre;$('m-sub').textContent=DOW[d.getDay()]+' '+lbl(d);
  fillRoster(a.employee_id); $('m-name').value=a.nombre_display||''; setTypeUI(p);
  $('m-rest').style.display='none';
  $('m-concept').value=a.actividad||'';$('m-ubic').value=a.ubicacion||'';
  if(isAnim(p)){const t=(a.notas||'').split('-');$('m-ini').value=(t[0]||'').trim();$('m-fin').value=(t[1]||'').trim()}
  else {$('m-ini').value=a.hora_inicio?a.hora_inicio.slice(0,5):'';$('m-fin').value=a.hora_fin?a.hora_fin.slice(0,5):''}
  $('modal').classList.add('show');
}
async function saveAdd(rest){
  const p=modalCtx.p, name=$('m-name').value.trim(), empOpt=$('m-emp').value;
  const flex=isExp(p)||isAnim(p);
  if(!name && !rest && !flex){alert('Elige o escribe una persona.');return}
  const body={property_id:tab.prop,puesto_id:p.id,nombre_display:name||null,fecha:modalCtx.fecha,employee_id:empOpt||null,actividad:null,ubicacion:null,hora_inicio:null,hora_fin:null,notas:null};
  if(isExp(p)){body.actividad=$('m-concept').value.trim()||null;body.ubicacion=$('m-ubic').value.trim()||null;body.hora_inicio=$('m-ini').value||null;body.hora_fin=$('m-fin').value||null}
  else if(isAnim(p)){body.actividad=$('m-concept').value.trim()||'Animación';body.notas=($('m-ini').value&&$('m-fin').value)?($('m-ini').value+'-'+$('m-fin').value):null}
  else if(rest){body.actividad='Descanso'}
  else {body.hora_inicio=$('m-ini').value||null;body.hora_fin=$('m-fin').value||null}
  // Nunca enviar cadenas vacías a columnas uuid/time (PostgREST las rechaza con 400)
  Object.keys(body).forEach(k=>{ if(body[k]==='') body[k]=null; });
  status('guardando…');
  const path=modalCtx.editId?'/horarios?id=eq.'+modalCtx.editId:'/horarios';
  try{ await sb(path,{method:modalCtx.editId?'PATCH':'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(body)}); }
  catch(e){ alert('No se pudo guardar: '+(e.message||'error')); return; }
  $('modal').classList.remove('show');loadData();
}

async function copyPrev(){
  const p0=fmt(addDays(weekStart,-7)), p6=fmt(addDays(weekStart,-1));
  if(asigs.length && !confirm('Esta semana ya tiene '+asigs.length+' asignaciones. ¿Copiar la anterior encima?'))return;
  const prev=await sb(`/horarios?select=*&property_id=eq.${tab.prop}&fecha=gte.${p0}&fecha=lte.${p6}`);
  const pids=new Set(puestos.map(x=>x.id));
  const rows=prev.filter(a=>pids.has(a.puesto_id)).map(a=>({property_id:a.property_id,puesto_id:a.puesto_id,employee_id:a.employee_id,nombre_display:a.nombre_display,fecha:fmt(addDays(new Date(a.fecha+'T00:00:00'),7)),hora_inicio:a.hora_inicio,hora_fin:a.hora_fin,actividad:a.actividad,ubicacion:a.ubicacion,notas:a.notas}));
  if(!rows.length){alert('La semana anterior no tiene datos para copiar.');return}
  status('copiando '+rows.length+'…');
  await sb('/horarios',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(rows)});loadData();
}

function exportJSON(){
  const data={property:tab.label,prop_id:tab.prop,tab:tab.id,semana:fmt(weekStart),exported:new Date().toISOString(),puestos,asignaciones:asigs};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`horario-${tab.id}-${fmt(weekStart)}.json`;a.click();
}

// Importa el formato del módulo viejo {property,semana,horario:{CODE:{fecha:[{apodo,actividad,notas}]}},conceptos} y lo migra a Supabase
async function importJSON(file){
  const txt=await file.text(); let j; try{j=JSON.parse(txt)}catch(e){alert('JSON inválido');return}
  const codeMap={};puestos.forEach(p=>codeMap[p.codigo]=p.id);
  // refrescar puestos de todo el property para mapear códigos de otras áreas
  const allP=await sb(`/horario_puestos?select=id,codigo&property_id=eq.${tab.prop}`);
  allP.forEach(p=>codeMap[p.codigo]=p.id);
  const rows=[]; const hor=j.horario||j.horario_completo||{};
  Object.entries(hor).forEach(([code,days])=>{const pid=codeMap[code];if(!pid)return;
    Object.entries(days||{}).forEach(([fecha,list])=>{(list||[]).forEach(it=>{
      rows.push({property_id:tab.prop,puesto_id:pid,nombre_display:(it.apodo||it.nombre||'').toString(),fecha,actividad:it.actividad||null,notas:it.notas||null});
    })});
  });
  if(!rows.length){alert('No encontré asignaciones mapeables en ese JSON (¿códigos de puesto?).');return}
  if(!confirm('Voy a importar '+rows.length+' asignaciones a Supabase. ¿Continuar?'))return;
  status('importando '+rows.length+'…');
  await sb('/horarios',{method:'POST',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify(rows)});
  alert('Importadas '+rows.length+' asignaciones.');loadData();
}

function exportCSV(){
  const dn=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const rows=asigs.map(a=>{
    const p=puestos.find(x=>x.id===a.puesto_id)||{};
    const ini=a.hora_inicio?a.hora_inicio.slice(0,5):'';
    const fin=a.hora_fin?a.hora_fin.slice(0,5):'';
    const hh=ini&&fin?durH(ini,fin).toFixed(1):'';
    const d=new Date(a.fecha+'T00:00:00');
    return {persona:(a.nombre_display||'').trim(),fecha:a.fecha,dia:dn[d.getDay()],area:(p.area||''),puesto:(p.nombre||''),ini,fin,hh,act:(a.actividad||'').replace(/[\n\r,]/g,' ')};
  }).filter(r=>r.persona).sort((x,y)=>x.persona.localeCompare(y.persona)||x.fecha.localeCompare(y.fecha));
  if(!rows.length){alert('No hay turnos para descargar en esta semana/área.');return}
  const head=['Persona','Fecha','Día','Área','Puesto','Entrada','Salida','Horas','Actividad'];
  const esc=v=>'"'+String(v).replace(/"/g,'""')+'"';
  const csv=[head.join(',')].concat(rows.map(r=>[r.persona,r.fecha,r.dia,r.area,r.puesto,r.ini,r.fin,r.hh,r.act].map(esc).join(','))).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const link=document.createElement('a');link.href=URL.createObjectURL(blob);
  link.download='turnos_'+tab.id+'_'+fmt(weekDates(weekStart)[0])+'.csv';link.click();
}
function renderTabs(){$('tabs').innerHTML=TABS.map(t=>`<div class="tab${t.id===tab.id?' active':''}" data-tab="${t.id}">${t.label}</div>`).join('');
  document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>{tab=TABS.find(t=>t.id===el.dataset.tab);history.replaceState(0,0,'?tab='+tab.id);renderTabs();loadData()})}

$('prev').onclick=()=>{weekStart=addDays(weekStart,-7);loadData()};
$('next').onclick=()=>{weekStart=addDays(weekStart,7);loadData()};
$('thisweek').onclick=()=>{weekStart=mondayOf(new Date());loadData()};
$('copy').onclick=copyPrev;
$('restore').onclick=loadData;
$('print').onclick=()=>window.print();
$('export').onclick=exportJSON;
$('csv').onclick=exportCSV;
$('import').onclick=()=>$('importfile').click();
$('importfile').onchange=e=>{if(e.target.files[0])importJSON(e.target.files[0]);e.target.value=''};
$('m-ok').onclick=()=>saveAdd(false);
$('m-rest').onclick=()=>saveAdd(true);
$('m-cancel').onclick=()=>$('modal').classList.remove('show');
$('modal').onclick=e=>{if(e.target.id==='modal')$('modal').classList.remove('show')};

(async()=>{tab=tabFromUrl();renderTabs();await loadRoster();await loadData();})();
