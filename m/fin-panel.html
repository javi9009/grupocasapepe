<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel de contabilidad · Casa Pepe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#EDEFF1; --surface:#FFFFFF; --surface-2:#E4E8EB; --surface-3:#F5F7F8;
  --ink:#14181C; --ink-2:#3A434B; --muted:#5A646E; --faint:#8A939C;
  --rule:#D3D9DE; --rule-2:#BEC7CE;
  --accent:#0F6E63; --accent-soft:#DCEAE7; --on-accent:#FFFFFF;
  --ok:#1D6B4A;  --ok-bg:#DFEDE6;
  --warn:#8C6212; --warn-bg:#F2E9D8;
  --bad:#9E3B2E;  --bad-bg:#F3E1DE;
  --none:#66707A; --none-bg:#E6EAED;
  --info:#2A5B7E; --info-bg:#DEE8EF;
  --sev1:#1D6B4A; --sev1-bg:#E6F2EC;
  --sev2:#8C6212; --sev2-bg:#F5EBD9;
  --sev3:#A8402F; --sev3-bg:#F6E2DE;
  --sev4:#7E1D12; --sev4-bg:#F0CFC9;
  --shadow:0 1px 1px rgba(20,24,28,.04), 0 10px 26px -20px rgba(20,24,28,.45);
  --rojo-fuerte:#A31810; --rojo-suave:#F7DDD9; --rojo-suave-b:#E0A79E; --rojo-suave-t:#8C463C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1114; --surface:#171B1F; --surface-2:#1F252A; --surface-3:#13171A;
  --ink:#E7EBEF; --ink-2:#C2CAD1; --muted:#98A2AC; --faint:#6D7780;
  --rule:#282F35; --rule-2:#39424A;
  --accent:#57C5B6; --accent-soft:#122A28; --on-accent:#0E1114;
  --ok:#69C89C; --ok-bg:#12261D; --warn:#D6A34E; --warn-bg:#2A2113;
  --bad:#DE8073; --bad-bg:#2B1815; --none:#98A2AC; --none-bg:#1F252A;
  --info:#7FB2D6; --info-bg:#13212B;
  --sev1:#7BD1A4; --sev1-bg:#12291F;
  --sev2:#D6A34E; --sev2-bg:#2C2214;
  --sev3:#E38071; --sev3-bg:#2E1815;
  --sev4:#F2705A; --sev4-bg:#3C1611;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
  --rojo-fuerte:#C4342A; --rojo-suave:#3A1C18; --rojo-suave-b:#5C302A; --rojo-suave-t:#C99A91;
}}
:root[data-theme="dark"]{
  --ground:#0E1114; --surface:#171B1F; --surface-2:#1F252A; --surface-3:#13171A;
  --ink:#E7EBEF; --ink-2:#C2CAD1; --muted:#98A2AC; --faint:#6D7780;
  --rule:#282F35; --rule-2:#39424A;
  --accent:#57C5B6; --accent-soft:#122A28; --on-accent:#0E1114;
  --ok:#69C89C; --ok-bg:#12261D; --warn:#D6A34E; --warn-bg:#2A2113;
  --bad:#DE8073; --bad-bg:#2B1815; --none:#98A2AC; --none-bg:#1F252A;
  --info:#7FB2D6; --info-bg:#13212B;
  --sev1:#7BD1A4; --sev1-bg:#12291F;
  --sev2:#D6A34E; --sev2-bg:#2C2214;
  --sev3:#E38071; --sev3-bg:#2E1815;
  --sev4:#F2705A; --sev4-bg:#3C1611;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
  --rojo-fuerte:#C4342A; --rojo-suave:#3A1C18; --rojo-suave-b:#5C302A; --rojo-suave-t:#C99A91;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.012em;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700;line-height:1.15}
h2{font-size:1.2rem;font-weight:700;line-height:1.2}
p{margin:0}
.mono,.n,th,.chip,.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;color:var(--faint)}

.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
.cab{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:4px}
.cab h1{flex:1 1 auto}
select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--rule-2);
  border-radius:8px;padding:7px 10px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:15px 16px;margin-top:14px;box-shadow:var(--shadow)}
.card h2{font-size:1.05rem;margin-bottom:2px}
.sub{color:var(--muted);font-size:.84rem;margin-bottom:10px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
/* La tira de días, igual que en auditoría: el color lo manda el dinero. */
.tira{display:flex;gap:4px;overflow-x:auto;padding:3px 0 6px;scrollbar-width:thin}
.d{flex:0 0 auto;width:30px;height:30px;border-radius:7px;border:1px solid var(--rule-2);
  background:var(--surface-3);color:var(--muted);font-family:"IBM Plex Mono",monospace;
  font-size:.72rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  position:relative;padding:0}
.d:hover{outline:2px solid var(--accent);outline-offset:1px}
.d.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.d.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.d.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.d.nd{opacity:.5}
.d.alerta::after{content:'!';position:absolute;top:-5px;right:-2px;font-size:.66rem;font-weight:700;color:var(--sev2)}
.d.forzado::before{content:'';position:absolute;top:-2px;left:-2px;width:5px;height:5px;border-radius:50%;background:var(--bad)}
.ley{display:flex;gap:12px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);margin-top:2px}
.ley i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:-1px}
.btn{font:inherit;font-size:.82rem;font-weight:600;background:var(--surface-2);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:8px;padding:6px 12px;cursor:pointer;text-decoration:none;
  display:inline-block;margin-top:8px}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  font-weight:600;padding:5px 6px;border-bottom:1px solid var(--rule)}
td{padding:6px;border-bottom:1px solid var(--rule)}
tr:last-child td{border-bottom:0}
.falta{color:var(--bad);font-weight:600}
.cero{color:var(--muted)}
.grande{font-family:"IBM Plex Mono",monospace;font-size:1.45rem;font-weight:500;letter-spacing:-.02em}
.aviso{background:var(--warn-bg);border-left:3px solid var(--warn);border-radius:0 8px 8px 0;
  padding:9px 12px;font-size:.82rem;color:var(--ink-2);margin-top:10px}
.empty{color:var(--muted);font-size:.88rem;padding:10px 0}
.pill{font-family:"IBM Plex Mono",monospace;font-size:.68rem;border-radius:999px;padding:2px 8px;
  background:var(--surface-2);color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="cab">
    <h1>Panel de contabilidad</h1>
    <select id="selProp"><option value="">Todas mis casas</option></select>
  </div>
  <p class="sub">El dinero que entra, el que está por caer y el que hay que pagar. Todo en una pantalla.</p>
  <div id="gate"></div>
  <div id="panel" hidden>
    <div class="cols" id="tiras"></div>
    <div class="cols">
      <div class="card" id="cPagos"></div>
      <div class="card" id="cCae"></div>
    </div>
    <div class="card" id="cCobra"></div>
  </div>
</div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const m0=n=>Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data;}
const TOL=1;
let PROPS=[], SEL='', DIN=null;

function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function rango(){const h=new Date();const d=new Date();d.setDate(d.getDate()-29);return{desde:ymd(d),hasta:ymd(h)};}
const DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function fLargo(f){const d=new Date(f+'T12:00:00');return DIAS[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1);}

/* El color del día es el mismo criterio que usa la pantalla de auditoría: si
   aquí dijera otra cosa, el resumen y el detalle se contradirían y el resumen
   dejaría de servir para decidir dónde entrar. */
function claseAud(r){
  if(!r) return 'nd';
  if(Number(r[5])>0) return 'nd';
  if(!(Number(r[1])>0)) return 'nd';
  let c;
  if(Number(r[7]||0)>=TOL || Number(r[8]||0)>0) c='bad';
  else if(Number(r[6]||0)>0) c='warn';
  else c='ok';
  if(Math.abs(Number(r[11]||0))>=TOL) c='bad';
  if(Number(r[12]||0)>0) c+=' forzado';
  const na=Number(r[13]||0); if(na>=1&&na<=3) c+=' alerta';
  return c;
}
function claseCaja(r){
  if(!r) return 'nd';
  const hubo=!!r[4], dif=(r[5]==null)?null:Number(r[5]), ac=Number(r[6]||0);
  if(!hubo && dif===null) return 'nd';
  if(dif!==null && Math.abs(dif)>=1) return 'bad';
  if(Math.abs(ac)>=1) return 'warn';
  return 'ok';
}

function tira(filas, clase, href, titulo){
  const por={}; (filas||[]).forEach(r=>{por[r[0]]=r;});
  const r=rango(); const out=[];
  for(let d=new Date(r.desde+'T12:00:00'); ymd(d)<=r.hasta; d.setDate(d.getDate()+1)){
    const f=ymd(d), fila=por[f];
    out.push('<button class="d '+clase(fila)+'" data-f="'+f+'" data-h="'+href+'" '+
      'title="'+esc(fLargo(f)+' · '+titulo)+'">'+String(d.getDate()).padStart(2,'0')+'</button>');
  }
  return '<div class="tira">'+out.join('')+'</div>';
}

async function pintaTiras(){
  const r=rango();
  const casas = SEL ? PROPS.filter(p=>p.id===SEL) : PROPS;
  const trozos=[];
  for(const p of casas){
    let aud=[], caja=[];
    try{ const x=await rpc('aud_panel_mes',{p_property:p.id,p_desde:r.desde,p_hasta:r.hasta}); aud=Array.isArray(x)?x:[]; }catch(e){}
    try{ const x=await rpc('aud_caja_mes',{p_property:p.id,p_desde:r.desde,p_hasta:r.hasta}); caja=Array.isArray(x)?x:[]; }catch(e){}
    trozos.push('<div class="card"><h2>Auditoría · '+esc(p.nombre)+'</h2>'
      +'<div class="sub">Últimos 30 días. Toca un día y se abre su cuadre.</div>'
      +tira(aud,claseAud,'/finanzas-auditoria.html','cuadre del día')
      +'<div class="ley"><span><i style="background:var(--ok)"></i>todo confirmado</span>'
      +'<span><i style="background:var(--warn)"></i>falta estado de cuenta</span>'
      +'<span><i style="background:var(--bad)"></i>descuadre</span>'
      +'<span><i style="background:var(--none)"></i>sin movimiento</span></div>'
      +'<a class="btn" href="/finanzas-auditoria.html?prop='+encodeURIComponent(p.id)+'">Ir a auditoría →</a></div>');
    trozos.push('<div class="card"><h2>Efectivo · '+esc(p.nombre)+'</h2>'
      +'<div class="sub">El arqueo de caja, día a día.</div>'
      +tira(caja,claseCaja,'/finanzas-caja.html','arqueo del día')
      +'<div class="ley"><span><i style="background:var(--ok)"></i>cuadra</span>'
      +'<span><i style="background:var(--warn)"></i>pendiente de justificar</span>'
      +'<span><i style="background:var(--bad)"></i>diferencia</span></div>'
      +'<a class="btn" href="/finanzas-caja.html?prop='+encodeURIComponent(p.id)+'">Ir al cuadre de efectivo →</a></div>');
  }
  $('tiras').innerHTML=trozos.join('');
  $('tiras').querySelectorAll('.d').forEach(b=>b.onclick=()=>{
    location.href=b.dataset.h+'?fecha='+b.dataset.f;
  });
}

function pintaPagos(){
  const l=(DIN&&DIN.pagos)||[];
  const falta=l.reduce((t,x)=>t+Number(x.falta||0),0);
  const pagado=l.reduce((t,x)=>t+Number(x.pagado||0),0);
  let h='<h2>Pagos críticos del mes</h2>'
    +'<div class="sub">Lo comprometido contra lo que ya salió. En rojo, lo que todavía no se ha pagado.</div>';
  if(!l.length){ $('cPagos').innerHTML=h+'<div class="empty">Este mes no hay nada presupuestado todavía.</div>'; return; }
  h+='<div class="grande'+(falta>0?' falta':'')+'">$'+m0(falta)+'</div>'
    +'<div class="sub">sin pagar · ya salieron $'+m0(pagado)+'</div>'
    +'<table><thead><tr><th>Concepto</th><th class="n">Presupuestado</th><th class="n">Pagado</th><th class="n">Falta</th></tr></thead><tbody>'
    +l.map(x=>'<tr><td>'+esc(x.concepto)+'</td>'
      +'<td class="n">'+m0(x.presupuestado)+'</td>'
      +'<td class="n">'+m0(x.pagado)+'</td>'
      +'<td class="n '+(Number(x.falta)>0?'falta':'cero')+'">'+(Number(x.falta)>0?m0(x.falta):'—')+'</td></tr>').join('')
    +'</tbody></table>'
    +'<a class="btn" href="/finanzas-pagos.html">Ir a pagos críticos →</a>';
  $('cPagos').innerHTML=h;
}

/* Lo que está por caer. Stripe sí se sabe: la fecha la pone el propio cargo
   (available_on), no la inventamos nosotros. Las terminales NO: la fecha en
   que el banco deposita un corte no está en ninguna tabla, y de la terminal
   Banorte nunca se ha subido un corte. Así que de ellas se dice lo que se
   cobró y hasta qué día hay datos, y se avisa de lo que falta — poner un
   número inventado en un panel de contabilidad es peor que no poner nada. */
function pintaCae(){
  const st=(DIN&&DIN.stripe)||[], te=(DIN&&DIN.terminales)||[], hoy=DIN&&DIN.hoy;
  const porF={};
  st.forEach(x=>{ (porF[x.fecha]=porF[x.fecha]||[]).push(x); });
  const fechas=Object.keys(porF).sort();
  let h='<h2>Lo que está por caer</h2>'
    +'<div class="sub">Stripe deposita en Banorte 0389. La fecha la marca el propio cargo.</div>';
  if(!fechas.length) h+='<div class="empty">Stripe no tiene nada pendiente de soltar estos días.</div>';
  else{
    h+='<table><thead><tr><th>Cuándo</th><th>Cuenta</th><th>De qué</th><th class="n">Neto</th></tr></thead><tbody>';
    fechas.forEach(f=>{
      const dia=(f===hoy)?'hoy':fLargo(f);
      porF[f].forEach((x,i)=>{
        h+='<tr><td>'+(i===0?'<b>'+esc(dia)+'</b>':'')+'</td>'
          +'<td><span class="pill">'+esc(x.cuenta)+'</span></td>'
          +'<td>'+esc(x.origen==='cloudbeds'?'hospedaje':(x.origen==='turitop'?'tours':x.origen))+'</td>'
          +'<td class="n">$'+m(x.neto)+'</td></tr>';
      });
    });
    const tot=st.reduce((t,x)=>t+Number(x.neto||0),0);
    h+='<tr><td colspan="3"><b>Total en 4 días</b></td><td class="n"><b>$'+m(tot)+'</b></td></tr></tbody></table>';
  }
  if(te.length){
    const ult=te.map(x=>x.ultimo_dia).sort().pop();
    h+='<div class="sub" style="margin-top:14px">Terminales · últimos 7 días cobrados</div>'
      +'<table><tbody>'+te.map(x=>'<tr><td>'+esc({tpv_netpay:'TPV NetPay (recepción)',tpv_banorte:'TPV Banorte (terraza)',efectivo:'Efectivo'}[x.instrumento]||x.instrumento)
        +'</td><td class="n">$'+m(x.monto)+'</td></tr>').join('')+'</tbody></table>'
      +'<div class="aviso"><b>De las terminales no se puede decir cuánto cae hoy.</b> '
      +'La fecha en que el banco deposita un corte no está guardada en ninguna parte, y de la terminal '
      +'Banorte no se ha subido nunca un corte. Lo de arriba es lo <i>cobrado</i>, con datos hasta el '
      +esc(ult||'—')+'.</div>';
  }
  $('cCae').innerHTML=h;
}

function pintaCobra(){
  const ll=(DIN&&DIN.llegan_hoy)||{n:0,saldo:0};
  const nv=(DIN&&DIN.noches_vendidas)||[];
  const pr=(DIN&&DIN.promedios)||{};
  const hoy=DIN&&DIN.hoy;
  const est=Number(pr.terraza||0)+Number(pr.tours||0);
  let h='<h2>Lo que se cobra</h2>'
    +'<div class="sub">Hospedaje de las llegadas de hoy, y la estimación de terraza y tours.</div>'
    +'<div class="cols">'
    +'<div><div class="eyebrow">Llegan hoy</div><div class="grande">'+m0(ll.n)+'</div>'
      +'<div class="sub">reservas · deben <b>$'+m(ll.saldo)+'</b> al llegar</div></div>'
    +'<div><div class="eyebrow">Terraza · promedio del día</div><div class="grande">$'+m0(pr.terraza)+'</div>'
      +'<div class="sub">media de los últimos 30 días</div></div>'
    +'<div><div class="eyebrow">Tours · promedio del día</div><div class="grande">$'+m0(pr.tours)+'</div>'
      +'<div class="sub">media de los últimos 30 días</div></div>'
    +'<div><div class="eyebrow">Estimado terraza + tours</div><div class="grande">$'+m0(est)+'</div>'
      +'<div class="sub">lo que suele entrar en un día como hoy</div></div>'
    +'</div>';
  if(nv.length){
    h+='<div class="sub" style="margin-top:14px">Noches vendidas</div><table><tbody>'
      +nv.map(x=>'<tr><td>'+esc(x.fecha===hoy?'hoy':fLargo(x.fecha))+'</td><td class="n">'+m0(x.noches)+' noches</td></tr>').join('')
      +'</tbody></table>';
  }
  h+='<div class="aviso"><b>Mañana y pasado no se pueden cobrar todavía.</b> '
    +'La copia local de Cloudbeds sólo guarda reservas que ya llegaron o ya salieron: de las llegadas '
    +'futuras no tenemos el importe. Lo de arriba es lo de hoy, y las noches vendidas, que sí se saben.</div>';
  $('cCobra').innerHTML=h;
}

async function cargaDinero(){
  try{ DIN=await rpc('fin_panel_dinero',{p_property:SEL||null}); }catch(e){ DIN={error:String(e.message||e)}; }
  if(DIN&&DIN.error){
    $('cPagos').innerHTML='<div class="empty">'+esc(DIN.error==='sin_acceso'?'No tienes acceso al panel de auditoría.':DIN.error)+'</div>';
    $('cCae').innerHTML=''; $('cCobra').innerHTML=''; return;
  }
  pintaPagos(); pintaCae(); pintaCobra();
}

async function arranque(){
  const g=$('gate');
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ g.innerHTML='<div class="empty">Entra al panel con tu cuenta de Casa Pepe para ver este resumen.</div>'; return; }
  let acc=null;
  try{ acc=await rpc('aud_panel_acceso'); }catch(e){}
  PROPS=(acc&&acc.propiedades)||[];
  if(!PROPS.length){ g.innerHTML='<div class="empty">Tu cuenta no tiene ninguna casa auditada asignada.</div>'; return; }
  const s=$('selProp');
  PROPS.forEach(p=>{ const o=document.createElement('option'); o.value=p.id; o.textContent=p.nombre; s.appendChild(o); });
  /* Si sólo lleva una casa, el selector sobra: enseñarle elegir entre una cosa
     es hacerle perder un clic. */
  if(PROPS.length===1){ SEL=PROPS[0].id; s.hidden=true; }
  s.onchange=async()=>{ SEL=s.value; await pintaTiras(); await cargaDinero(); };
  g.hidden=true; $('panel').hidden=false;
  await pintaTiras();
  await cargaDinero();
}
