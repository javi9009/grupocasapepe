<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sincrético · Pedidos de la tienda</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#B3106F;--accent-soft:#FBDCEE;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1180px;margin:0 auto}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px;margin-top:3px;line-height:1.5;max-width:74ch}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin-top:10px}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:11px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav button .n{font-size:11px;color:var(--faint);margin-left:5px}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:7px 8px;border-bottom:1px solid var(--rule)}
td{padding:9px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
th.n,td.n{text-align:right}
tr.off td{opacity:.5}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.mini{font-size:11.5px;color:var(--muted);line-height:1.45}
.vacio{padding:36px 10px;text-align:center;color:var(--faint)}
.vacio b{display:block;color:var(--muted);font-size:14px;margin-bottom:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ok);color:#fff;padding:11px 18px;border-radius:9px;font-weight:700;font-size:13px;display:none;z-index:90}
.toast.err{background:var(--bad)}
/* Los dos relevos, en una celda: quién la sacó del almacén y quién se la dio
   al huésped. Lo que falta se ve de un vistazo. */
.relevo{display:flex;flex-direction:column;gap:3px}
.relevo span{font-size:11.5px;color:var(--muted)}
.relevo span.hecho{color:var(--ok);font-weight:600}
</style>
</head>
<body>
<div class="top">
  <h1>🧾 Pedidos de la tienda</h1>
  <div class="sub">Lo que el huésped pide desde la app. El cobro lo confirma Stripe, no esta pantalla:
    aquí sólo se marcan los dos relevos — <b>almacén</b> la saca y se la da a front, y <b>front</b> se la
    entrega al huésped.</div>
</div>

<div class="secnav"><div class="secnav-in" id="nav"></div></div>

<div class="wrap">
  <div class="kpis" id="kpis"></div>
  <div class="card">
    <div id="tabla"><div class="vacio">Cargando…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';

  /* Las pestañas son el camino del pedido, no categorías: lo que hay que hacer
     está siempre en las dos primeras. */
  var VISTAS=[
    {k:'pendientes', t:'Por surtir',  f:function(p){ return p.estado!=='cancelado' && !p.en_front_at; }},
    {k:'en_front',   t:'En recepción',f:function(p){ return p.estado!=='cancelado' && p.en_front_at && !p.entregado_at; }},
    {k:'entregados', t:'Entregados',  f:function(p){ return !!p.entregado_at; }},
    {k:'todos',      t:'Todos',       f:function(){ return true; }}
  ];
  var vista='pendientes', P=[];

  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){return n==null||n===''?'—':'$'+Number(n).toLocaleString('es-MX');}
  function toast(t,e){var x=$('toast');x.textContent=t;x.className='toast'+(e?' err':'');
    x.style.display='block';setTimeout(function(){x.style.display='none';},2800);}
  function cuando(iso){
    if(!iso) return '';
    try{ var d=new Date(iso);
      return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '
        +('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    }catch(e){ return ''; }
  }
  function quien(e){ return String(e||'').split('@')[0]; }

  function sesion(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&/sb-.*-auth-token/.test(k)){
          var v=JSON.parse(localStorage.getItem(k)||'null');
          var s=v&&(v.currentSession||v);
          if(s&&s.access_token)return s;
        }
      }
    }catch(_){}
    return null;
  }
  var SES=sesion();
  function hdr(x){return Object.assign({'apikey':KEY,
    'Authorization':'Bearer '+((SES&&SES.access_token)||KEY),
    'Content-Type':'application/json'},x||{});}
  async function get(p){ var r=await fetch(SB+'/rest/v1/'+p,{headers:hdr()}); return r.ok?await r.json():[]; }
  async function rpc(f,b){ var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:hdr(),body:JSON.stringify(b||{})});
    return r.ok?await r.json():{ok:false,error:'HTTP '+r.status}; }

  function pagoTag(p){
    if(p.estado==='cancelado') return '<span class="tag bad">cancelado</span>';
    if(p.pago_estado==='pagado') return '<span class="tag ok">pagado</span>';
    if(p.pago_estado==='reembolsado') return '<span class="tag bad">reembolsado</span>';
    if(p.pago_estado==='fallido') return '<span class="tag bad">pago fallido</span>';
    if(p.pago_estado==='caducado') return '<span class="tag bad">caducó</span>';
    return '<span class="tag warn">por pagar</span>';
  }

  function pintaKpis(){
    var vivos=P.filter(function(p){return p.estado!=='cancelado';});
    var porSurtir=vivos.filter(function(p){return !p.en_front_at;}).length;
    var enFront=vivos.filter(function(p){return p.en_front_at&&!p.entregado_at;}).length;
    var porCobrar=vivos.filter(function(p){return p.pago_estado!=='pagado';});
    var hoy=new Date(); hoy.setHours(0,0,0,0);
    var cobradoHoy=P.filter(function(p){ return p.pagado_at && new Date(p.pagado_at)>=hoy; })
                    .reduce(function(a,p){return a+Number(p.total_mxn||0);},0);
    $('kpis').innerHTML=
      '<div class="kpi"><b>'+porSurtir+'</b><span>por surtir en almacén</span></div>'+
      '<div class="kpi"><b>'+enFront+'</b><span>esperando en recepción</span></div>'+
      '<div class="kpi"><b>'+porCobrar.length+'</b><span>sin pagar</span></div>'+
      '<div class="kpi"><b>'+money(cobradoHoy)+'</b><span>cobrado hoy</span></div>';
  }

  function pintaNav(){
    $('nav').innerHTML=VISTAS.map(function(v){
      var n=P.filter(v.f).length;
      return '<button data-k="'+v.k+'" aria-selected="'+(v.k===vista)+'">'+esc(v.t)
        +'<span class="n">'+n+'</span></button>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
      b.onclick=function(){ vista=b.getAttribute('data-k'); pintaNav(); pintaTabla(); };
    });
  }

  function pintaTabla(){
    var v=VISTAS.filter(function(x){return x.k===vista;})[0];
    var l=P.filter(v.f);
    if(!l.length){
      $('tabla').innerHTML='<div class="vacio"><b>Nada por aquí</b>No hay pedidos en este paso.</div>';
      return;
    }
    $('tabla').innerHTML='<table><thead><tr>'
      +'<th>Folio</th><th>Piezas</th><th>Huésped</th><th>Entrega</th><th class="n">Total</th>'
      +'<th>Pago</th><th>Relevos</th><th></th></tr></thead><tbody>'
      +l.map(function(p){
        var acc='';
        if(p.estado!=='cancelado'){
          if(!p.en_front_at) acc='<button class="btn sm" data-paso="en_front" data-id="'+esc(p.id)+'">Entregado a front</button>';
          else if(!p.entregado_at) acc='<button class="btn sm" data-paso="entregado" data-id="'+esc(p.id)+'">Entregado al huésped</button>';
        }
        return '<tr'+(p.estado==='cancelado'?' class="off"':'')+'>'
          +'<td><b>'+esc(p.folio||'')+'</b><div class="mini">'+esc(cuando(p.created_at))+'</div></td>'
          +'<td>'+esc(p.piezas||'—')+'</td>'
          +'<td>'+esc(p.huesped||'—')
            +(p.casa?('<div class="mini">'+esc(p.casa)+(p.cuarto?(' · cuarto '+esc(p.cuarto)):'')+'</div>')
                    :(p.cuarto?('<div class="mini">cuarto '+esc(p.cuarto)+'</div>'):''))
            +(p.nota?('<div class="mini">«'+esc(p.nota)+'»</div>'):'')+'</td>'
          +'<td>'+entregaTag(p)+'</td>'
          +'<td class="n">'+money(p.total_mxn)+'</td>'
          +'<td>'+pagoTag(p)+(p.pagado_at?('<div class="mini">'+esc(cuando(p.pagado_at))+'</div>'):'')+'</td>'
          +'<td><div class="relevo">'
            +'<span class="'+(p.en_front_at?'hecho':'')+'">'+(p.en_front_at
                ? ('✓ a front · '+esc(quien(p.en_front_por))+' · '+esc(cuando(p.en_front_at)))
                : '· almacén, pendiente')+'</span>'
            +'<span class="'+(p.entregado_at?'hecho':'')+'">'+(p.entregado_at
                ? ('✓ al huésped · '+esc(quien(p.entregado_por))+' · '+esc(cuando(p.entregado_at)))
                : '· front, pendiente')+'</span>'
          +'</div></td>'
          +'<td class="n">'+acc+'</td></tr>';
      }).join('')+'</tbody></table>';

    Array.prototype.forEach.call($('tabla').querySelectorAll('[data-paso]'),function(b){
      b.onclick=async function(){
        b.disabled=true; var old=b.textContent; b.textContent='Un momento…';
        var r=await rpc('arte_pedido_paso',{p_id:b.getAttribute('data-id'),p_paso:b.getAttribute('data-paso')});
        if(r&&r.ok){ await carga(); pintaKpis(); pintaNav(); pintaTabla(); toast('Marcado'); }
        else { toast((r&&r.error)||'No se pudo marcar',true); b.disabled=false; b.textContent=old; }
      };
    });
  }

  /* La hora que se le prometió al huésped, en hora de México. Si ya pasó y la
     pieza no está en recepción, va en rojo: eso es lo que hay que mover hoy. */
  function horaMX(iso){
    try{
      var d=new Date(iso);
      var hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
      var dia=d.toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
      var h=d.toLocaleTimeString('es-MX',{timeZone:'America/Mexico_City',hour:'2-digit',minute:'2-digit',hour12:false});
      if(dia===hoy) return h;
      var m=new Date(Date.now()+86400000).toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
      if(dia===m) return 'mañana '+h;
      return d.toLocaleDateString('es-MX',{timeZone:'America/Mexico_City',day:'numeric',month:'short'})+' '+h;
    }catch(_){ return '—'; }
  }
  function entregaTag(p){
    if(p.estado==='cancelado') return '<span class="mini">—</span>';
    if(p.entregado_at) return '<span class="mini">✓ '+esc(horaMX(p.entregado_at))+'</span>';
    if(!p.entrega_estimada) return '<span class="mini">—</span>';
    var t=esc(horaMX(p.entrega_estimada));
    return p.va_tarde
      ? '<b style="color:#9E3B2E">'+t+'</b><div class="mini" style="color:#9E3B2E">va tarde</div>'
      : '<b>'+t+'</b><div class="mini">prometida</div>';
  }

  async function carga(){ P=await get('v_arte_pedidos?select=*&order=created_at.desc&limit=300'); }

  (async function(){
    await carga();
    pintaKpis(); pintaNav(); pintaTabla();
    /* La pantalla se queda abierta en recepción todo el día: se refresca sola
       para que no haya que acordarse de recargar. */
    setInterval(async function(){
      try{ await carga(); pintaKpis(); pintaNav(); pintaTabla(); }catch(_){}
    }, 60000);
  })();
})();
</script>
</body>
</html>
