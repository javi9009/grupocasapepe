<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planes de carrera · RH · Grupo Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header.top{background:var(--ground);border-bottom:1px solid var(--rule)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:14px;padding-bottom:12px;flex-wrap:wrap}
header.top h1{margin:0;font-size:1.05rem;font-weight:700;letter-spacing:-.01em}
header.top .sub{color:var(--muted);font-size:.8rem}
#estado{margin-left:auto;font-size:.78rem;color:var(--muted)}
#estado.ok{color:var(--ok)} #estado.err{color:var(--bad)}

.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.secnav .cnt{display:inline-block;margin-left:6px;background:var(--warn-bg);color:var(--warn);
  border:1px solid var(--warn);border-radius:999px;font-size:.6rem;font-weight:700;padding:0 6px;vertical-align:1px}

.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 15px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.mini{padding:4px 9px;font-size:.76rem;border-radius:5px}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--rule)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
select,input{font:inherit;padding:7px 9px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);color:var(--ink)}
select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  box-shadow:var(--shadow);padding:16px;margin:14px 0}
.card h2{margin:0 0 2px;font-size:.95rem;font-weight:700}
.card .meta{color:var(--muted);font-size:.78rem}
.vacia{color:var(--muted);font-style:italic;margin:10px 0}
.faint{color:var(--faint)}
.pill{display:inline-block;border-radius:999px;font-size:.66rem;font-weight:700;padding:1px 8px;
  border:1px solid var(--rule-2);background:var(--surface-2);color:var(--ink-2)}
.pill.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pill.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.pill.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}

/* la pila: un segmento por requisito */
.pila{display:flex;gap:3px;margin:10px 0 6px}
.pila .seg{flex:1;height:26px;border-radius:5px;border:1px solid var(--rule);
  background:var(--none-bg);display:flex;align-items:center;justify-content:center;
  font-size:.64rem;font-weight:700;color:var(--faint);text-align:center;overflow:hidden;padding:0 3px}
.pila .seg.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pila .seg.parcial{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:.72rem;color:var(--muted);margin-top:4px}

.barra{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:8px 0 4px}
.barra > i{display:block;height:100%;background:var(--accent)}

table{width:100%;border-collapse:collapse;font-size:.83rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--rule)}
th{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.mesgrid{display:grid;gap:3px;margin-top:4px}
.mesgrid .mc{aspect-ratio:1;border:1px solid var(--rule);border-radius:5px;background:var(--surface-3);
  display:flex;align-items:center;justify-content:center;font-size:.62rem;color:var(--faint);cursor:pointer}
.mesgrid .mc.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.mesgrid .mc.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.mesgrid .mc:hover{border-color:var(--accent)}
.tabla-mes th.mes{font-size:.6rem;text-align:center;padding:2px}
.oculto{display:none}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.scroll{overflow-x:auto}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <h1>Planes de carrera</h1>
    <span class="sub" id="subtit">Del oficio a la jefatura, y de ahí a la gerencia</span>
    <select id="fSede" data-cp-ubic style="margin-left:8px">
      <option value="">Todas las sedes</option>
      <option value="CDMX">CDMX</option>
      <option value="Puebla">Puebla</option>
      <option value="Virreyes">Virreyes</option>
      <option value="Corp">Corp</option>
    </select>
    <span id="estado"></span>
  </div>
</header>

<nav class="secnav" aria-label="Secciones">
  <div class="secnav-in" id="tabs">
    <button data-t="planes"   aria-selected="true">Planes activos</button>
    <button data-t="validar"  aria-selected="false">Bonos por validar<span class="cnt oculto" id="cntVal">0</span></button>
    <button data-t="addendum" aria-selected="false">Addendums<span class="cnt oculto" id="cntAdd">0</span></button>
    <button data-t="modelo"   aria-selected="false">Los tres caminos</button>
  </div>
</nav>

<main class="wrap" id="vista"><p class="vacia">Cargando…</p></main>

<script src="/cp-acceso.js"></script>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let ME='';
try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);
  const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);
  if(_t){H.Authorization='Bearer '+_t;try{ME=(JSON.parse(atob(_t.split('.')[1])).email||'').toLowerCase();}catch(e){}}}}catch(e){}

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mxn=n=>(Number(n)||0).toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
const hoyMes=()=>new Date().toISOString().slice(0,7);
function estado(t,c){const e=$('estado');e.textContent=t||'';e.className=c||'';}
async function api(p,o){const r=await fetch(SB+p,{headers:H,...o});
  if(!r.ok){estado('⚠ '+r.status,'err');throw new Error(await r.text());}
  const c=await r.text();return c?JSON.parse(c):null;}

let TIPOS=[],REQS=[],PILA=[],TRAMOS=[],EMPS=[],RANGOS=[],PROP=[],ADD=[],TAB='planes';

async function cargar(){
  estado('cargando…');
  const [t,r,p,tr,e,rg] = await Promise.all([
    api('/carrera_tipos?select=*&activo=eq.true&order=orden'),
    api('/carrera_requisitos?select=*&order=tipo_codigo,orden'),
    api('/carrera_pila?select=*&order=nombre,orden'),
    api('/carrera_bono_tramos?select=*&order=escalon'),
    api('/employees?select=id,nombre,rol,puesto,area,sede,categoria,tramo,salario_bruto,estatus&estatus=eq.activo&order=nombre'),
    api('/rangos_salariales?select=puesto,sede,area,junior&activo=not.is.false&order=puesto')
  ]);
  TIPOS=t||[];REQS=r||[];PILA=p||[];TRAMOS=tr||[];EMPS=e||[];RANGOS=rg||[];
  await cargarColas();
  estado('');
}
async function cargarColas(){
  try{
    PROP=await api('/bonos_quincena?select=*&estatus=eq.propuesto&order=created_at.desc')||[];
    ADD =await api('/contrato_addendums?select=*&order=created_at.desc')||[];
  }catch(_){PROP=[];ADD=[];}
  const nv=PROP.length, na=ADD.filter(a=>a.estatus==='pendiente').length;
  $('cntVal').textContent=nv; $('cntVal').classList.toggle('oculto',!nv);
  $('cntAdd').textContent=na; $('cntAdd').classList.toggle('oculto',!na);
}

/* ── filtro por ubicación (cascada cp-acceso) ─────────────────────────────── */
async function porSede(lista,get){
  const sel=$('fSede').value;
  let L=lista;
  if(sel) L=L.filter(x=>(get(x)||'')===sel);
  if(window.cpAcceso) L=await cpAcceso.filtra(L,get);
  return L;
}

/* ── la pila ──────────────────────────────────────────────────────────────── */
function planes(){
  const m={};
  PILA.forEach(r=>{
    if(!m[r.plan_id]) m[r.plan_id]={...r,reqs:[]};
    m[r.plan_id].reqs.push(r);
  });
  return Object.values(m);
}
function pilaHTML(p){
  return '<div class="pila">'+p.reqs.map(r=>
    `<div class="seg ${r.cumplido?'ok':''}" title="${esc(r.requisito_nombre)}${r.valor!=null?' · '+r.valor:''}">${esc(r.requisito_nombre.split(' ')[0])}</div>`
  ).join('')+'</div>';
}
function mesesTranscurridos(p){
  const a=new Date(p.inicio), b=new Date();
  return Math.max(0,(b.getFullYear()-a.getFullYear())*12+(b.getMonth()-a.getMonth()));
}
function tramoVigente(planId){ return TRAMOS.filter(t=>t.plan_id===planId&&t.estatus==='vigente')[0]||null; }

/* ── vistas ───────────────────────────────────────────────────────────────── */
async function vPlanes(){
  const L=await porSede(planes(),x=>x.sede);
  const v=$('vista');
  v.innerHTML=`
   <div class="card">
    <h2>Nuevo plan</h2>
    <p class="meta">El bono cubre la brecha hasta el nivel 1 del puesto destino y sube por hitos:
      25% con 1 requisito cerrado, 50% con 3, 75% con 4 y 100% con los cinco.
      <strong>Nunca entra al sueldo base</strong> — si hay desvinculación antes del ascenso, no se integró a la nómina.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px">
      <select id="nEmp"><option value="">— colaborador —</option>${EMPS.map(e=>`<option value="${e.id}" data-sede="${esc(e.sede||'')}">${esc(e.nombre)} · ${esc(e.rol||e.puesto||'')} · ${esc(e.sede||'')}</option>`).join('')}</select>
      <select id="nTipo"><option value="">— camino —</option>${TIPOS.map(t=>`<option value="${t.codigo}">${esc(t.nombre)} · ${t.meses} meses</option>`).join('')}</select>
      <select id="nDest"><option value="">— puesto destino —</option></select>
      <input id="nIni" type="date" value="${new Date().toISOString().slice(0,10)}">
      <button class="btn" id="nGo">Crear plan</button>
    </div>
    <p class="meta" id="nBrecha" style="margin-top:8px"></p>
   </div>
   ${L.length?L.map(p=>tarjetaPlan(p)).join(''):'<p class="vacia">Sin planes de carrera abiertos en esta vista.</p>'}`;

  const dest=$('nDest'), emp=$('nEmp');
  const llenaDest=()=>{
    const o=emp.selectedOptions[0], sede=o?o.dataset.sede:'';
    const rs=RANGOS.filter(r=>!sede||r.sede===sede||r.sede==='Corp');
    dest.innerHTML='<option value="">— puesto destino —</option>'+
      rs.map(r=>`<option value="${esc(r.puesto)}" data-n1="${r.junior||''}">${esc(r.puesto)} · ${esc(r.sede)} · N1 ${r.junior?mxn(r.junior):'sin tabulador'}</option>`).join('');
    brecha();
  };
  const brecha=()=>{
    const o=emp.selectedOptions[0], d=dest.selectedOptions[0];
    if(!o||!d||!d.value){$('nBrecha').textContent='';return;}
    const e=EMPS.find(x=>x.id===emp.value)||{};
    const n1=Number(d.dataset.n1||0), sal=Number(e.salario_bruto||0);
    const br=Math.max(n1-sal,0);
    $('nBrecha').innerHTML= n1? `Hoy gana <strong>${mxn(sal)}</strong> · nivel 1 del destino <strong>${mxn(n1)}</strong> · brecha a cubrir con bono <strong>${mxn(br)}</strong> al mes (escalones de ${mxn(br*.25)} / ${mxn(br*.5)} / ${mxn(br*.75)} / ${mxn(br)}).`
      : 'Ese puesto no tiene tabulador cargado — hay que darle su fila en Rangos salariales antes de abrir el plan.';
  };
  emp.onchange=llenaDest; dest.onchange=brecha;
  $('nGo').onclick=async()=>{
    if(!emp.value||!$('nTipo').value||!dest.value){alert('Falta colaborador, camino o puesto destino.');return;}
    const e=EMPS.find(x=>x.id===emp.value)||{};
    if(!confirm('¿Abrir el plan de carrera de '+(e.nombre||'')+' hacia '+dest.value+'?')) return;
    estado('creando…');
    try{
      await api('/rpc/crear_plan_carrera',{method:'POST',body:JSON.stringify({
        p_employee_id:emp.value,p_tipo:$('nTipo').value,p_puesto_destino:dest.value,
        p_sede:e.sede||null,p_inicio:$('nIni').value||null})});
      estado('✓ plan creado','ok'); await cargar(); render();
    }catch(err){alert('No se pudo crear: '+err.message);}
  };
  L.forEach(p=>{
    const b=document.querySelector('[data-detalle="'+p.plan_id+'"]');
    if(b) b.onclick=()=>vDetalle(p.plan_id);
  });
}

function tarjetaPlan(p){
  const n=p.reqs.filter(r=>r.cumplido).length, tot=p.reqs.length;
  const tr=tramoVigente(p.plan_id);
  const mt=mesesTranscurridos(p), pct=Math.min(100,Math.round(mt/(p.meses||1)*100));
  return `<div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2>${esc(p.nombre)}</h2>
      <span class="pill">${esc(p.plan_nombre)}</span>
      <span class="pill ${p.estatus==='aprobado'?'ok':(mt>p.meses?'bad':'')}">${esc(p.estatus)}</span>
      <button class="btn ghost mini" data-detalle="${p.plan_id}" style="margin-left:auto">Seguimiento mes a mes</button>
    </div>
    <p class="meta">${esc(p.area||'')} · ${esc(p.sede||'')} → <strong>${esc(p.puesto_destino||'')}</strong> ·
      mes ${mt} de ${p.meses} · cierra ${esc(p.fin_previsto||'')}</p>
    ${pilaHTML(p)}
    <div class="leyenda"><span><strong>${n} de ${tot}</strong> requisitos cerrados</span>
      <span>Brecha ${mxn(p.brecha)} al mes</span>
      <span>${tr?('Bono vigente <strong>'+mxn(tr.monto_mensual)+'</strong> ('+tr.pct+'% de la brecha)'):'Sin bono activado todavía'}</span></div>
    <div class="barra"><i style="width:${pct}%"></i></div>
    <p class="meta">Tiempo transcurrido del camino. Al aprobar el plan, el bono se retira y el sueldo base sube a ${mxn(p.salario_destino_n1)}.</p>
  </div>`;
}

async function vDetalle(planId){
  const p=planes().find(x=>x.plan_id===planId); if(!p) return;
  const av=await api('/carrera_avance?select=*&plan_id=eq.'+planId+'&order=mes')||[];
  const tr=TRAMOS.filter(t=>t.plan_id===planId);
  const meses=[];
  const d=new Date(p.inicio);
  for(let i=0;i<(p.meses||6);i++){ meses.push(new Date(d.getFullYear(),d.getMonth()+i,1).toISOString().slice(0,7)); }
  const val=(rq,ms)=>av.find(a=>a.requisito_codigo===rq&&a.mes===ms);

  $('vista').innerHTML=`
  <div class="card">
    <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap">
      <h2>${esc(p.nombre)} · ${esc(p.plan_nombre)}</h2>
      <button class="btn ghost mini" id="volver" style="margin-left:auto">← Planes</button>
    </div>
    <p class="meta">${esc(p.sede||'')} → ${esc(p.puesto_destino||'')} · de ${mxn(p.salario_origen)} a ${mxn(p.salario_destino_n1)} · inicio ${esc(p.inicio)}</p>
    ${pilaHTML(p)}
    <div class="scroll"><table class="tabla-mes"><thead><tr><th>Requisito</th><th class="num">Mínimo</th>
      ${meses.map(m=>`<th class="mes">${m.slice(5)}<br><span class="faint">${m.slice(2,4)}</span></th>`).join('')}</tr></thead><tbody>
      ${p.reqs.map(r=>`<tr>
        <td>${esc(r.requisito_nombre)}<br><span class="faint" style="font-size:.7rem">${esc(r.medida==='meses_ganados'?('en ventana de '+r.ventana_meses+' meses'):r.medida)}</span></td>
        <td class="num">${r.minimo??'—'}</td>
        ${meses.map(m=>{const a=val(r.requisito,m);
          const cls=a?(a.cumplido?'ok':'no'):'';
          return `<td style="padding:2px"><div class="mc ${cls}" data-req="${esc(r.requisito)}" data-mes="${m}" title="${esc(r.requisito_nombre)} · ${m}">${a&&a.valor!=null?a.valor:(a?(a.cumplido?'✓':'✕'):'')}</div></td>`;
        }).join('')}
      </tr>`).join('')}
    </tbody></table></div>
    <p class="meta">Toca una celda para registrar el resultado de ese mes. Lo que el reloj y los bonos ya miden se llena solo; el test y la encuesta los captura el jefe.</p>
  </div>
  <div class="card">
    <h2>Escalones del bono</h2>
    <p class="meta">La brecha es ${mxn(p.brecha)} al mes. El escalón sube solo conforme cierra requisitos.</p>
    <table><thead><tr><th>Escalón</th><th>Requisitos cerrados</th><th class="num">% de la brecha</th><th class="num">Bono mensual</th><th>Estado</th></tr></thead><tbody>
    ${tr.map(t=>`<tr><td>${t.escalon}</td><td>${t.requisitos_min} de 5</td><td class="num">${t.pct}%</td>
      <td class="num"><strong>${mxn(t.monto_mensual)}</strong></td>
      <td><span class="pill ${t.estatus==='vigente'?'ok':(t.estatus==='superado'?'':'warn')}">${esc(t.estatus)}</span></td></tr>`).join('')}
    </tbody></table>
    <p class="meta">Al aprobar el plan el bono se retira y el sueldo base pasa a ${mxn(p.salario_destino_n1)}.
      Mientras tanto no forma parte del salario integrado.</p>
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost mini" id="recalc">Recalcular escalón</button>
      <button class="btn mini" id="proponer">Proponer el bono del escalón vigente</button>
    </div>
  </div>`;

  $('volver').onclick=()=>{TAB='planes';render();};
  document.querySelectorAll('.mc').forEach(c=>c.onclick=async()=>{
    const rq=c.dataset.req, ms=c.dataset.mes;
    const r=p.reqs.find(x=>x.requisito===rq)||{};
    const v=prompt(r.requisito_nombre+' · '+ms+'\n\nResultado del mes (número). Deja vacío para borrar.\nMínimo para cumplir: '+(r.minimo??'—'));
    if(v===null) return;
    estado('guardando…');
    try{
      if(v===''){ await api('/carrera_avance?plan_id=eq.'+planId+'&mes=eq.'+ms+'&requisito_codigo=eq.'+rq,{method:'DELETE',headers:{...H,Prefer:'return=minimal'}}); }
      else{
        const num=Number(v);
        await api('/carrera_avance',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},
          body:JSON.stringify({plan_id:planId,mes:ms,requisito_codigo:rq,valor:num,
            cumplido:(r.minimo!=null? num>=Number(r.minimo) : num>0),origen:'jefe'})});
      }
      await api('/rpc/recalcular_tramo_carrera',{method:'POST',body:JSON.stringify({p_plan:planId})});
      estado('✓ guardado','ok'); await cargar(); vDetalle(planId);
    }catch(e){alert('No se pudo guardar: '+e.message);}
  });
  $('recalc').onclick=async()=>{
    estado('recalculando…');
    await api('/rpc/recalcular_tramo_carrera',{method:'POST',body:JSON.stringify({p_plan:planId})});
    await cargar(); vDetalle(planId); estado('✓','ok');
  };
  $('proponer').onclick=async()=>{
    const t=tramoVigente(planId);
    if(!t){alert('Todavía no hay escalón vigente: no ha cerrado ningún requisito.');return;}
    const q=quincenaActual();
    if(!confirm('¿Proponer el bono de '+mxn(t.monto_mensual)+' para '+p.nombre+' en la quincena '+q+'?\n\nQueda en "Bonos por validar" hasta que se apruebe en el briefing.')) return;
    try{
      await api('/bonos_quincena',{method:'POST',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({quincena:q,employee_id:p.employee_id,nombre:'Plan de carrera · escalón '+t.escalon+' ('+t.pct+'%)',
          monto:t.monto_mensual,otorgado_por:ME||null,estatus:'propuesto',plan_id:planId,
          nota:'Camino '+p.plan_nombre+' → '+p.puesto_destino})});
      await cargarColas(); estado('✓ propuesto — queda por validar','ok');
    }catch(e){alert('No se pudo proponer: '+e.message);}
  };
}
function quincenaActual(){
  const d=new Date(), q=d.getDate()<=15?'Q1':'Q2';
  return d.toISOString().slice(0,7)+'-'+q;
}

/* ── bonos por validar (briefing) ─────────────────────────────────────────── */
async function vValidar(){
  const nom={}; EMPS.forEach(e=>nom[e.id]=e);
  const L=await porSede(PROP,x=>(nom[x.employee_id]||{}).sede);
  $('vista').innerHTML=`
  <div class="card">
    <h2>Bonos por validar</h2>
    <p class="meta">Lo que los jefes asignaron y todavía no es de nadie. Se revisa en el briefing:
      al validar se genera el addendum al contrato y el colaborador lo firma en SoyPepe.
      Hasta entonces no entra a la quincena.</p>
    ${L.length?`<div class="scroll"><table><thead><tr><th>Colaborador</th><th>Bono</th><th class="num">Monto</th>
      <th>Quincena</th><th>Lo asignó</th><th></th></tr></thead><tbody>
      ${L.map(b=>{const e=nom[b.employee_id]||{};return `<tr>
        <td><strong>${esc(e.nombre||'—')}</strong><br><span class="faint" style="font-size:.72rem">${esc(e.rol||'')} · ${esc(e.sede||'')}</span></td>
        <td>${esc(b.nombre)}${b.nota?'<br><span class="faint" style="font-size:.72rem">'+esc(b.nota)+'</span>':''}</td>
        <td class="num"><strong>${mxn(b.monto)}</strong></td>
        <td>${esc(b.quincena||'')}</td>
        <td class="faint" style="font-size:.75rem">${esc(b.otorgado_por||'—')}</td>
        <td style="white-space:nowrap">
          <button class="btn mini" data-ok="${b.id}">Validar</button>
          <button class="btn mini danger" data-no="${b.id}">Rechazar</button></td>
      </tr>`;}).join('')}
    </tbody></table></div>`:'<p class="vacia">Nada pendiente de validar. Todo lo asignado ya pasó por briefing.</p>'}
  </div>`;

  document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{
    const row=PROP.find(x=>x.id===b.dataset.ok); const e=nom[row.employee_id]||{};
    if(!confirm('Validar el bono "'+row.nombre+'" de '+mxn(row.monto)+' para '+(e.nombre||'')+'?\n\nSe genera el addendum al contrato para su firma.')) return;
    estado('validando…');
    try{
      await api('/bonos_quincena?id=eq.'+row.id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({estatus:'validado',validado_por:ME||null,validado_at:new Date().toISOString(),
          briefing_fecha:new Date().toISOString().slice(0,10)})});
      await api('/contrato_addendums',{method:'POST',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({employee_id:row.employee_id,origen:row.plan_id?'plan_carrera':'bono',
          bono_quincena_id:row.id,plan_id:row.plan_id||null,concepto:row.nombre,monto:row.monto,
          periodicidad:'mensual',vigencia_desde:new Date().toISOString().slice(0,10),
          created_by:ME||null,estatus:'pendiente'})});
      try{await api('/notificaciones',{method:'POST',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({employee_id:row.employee_id,titulo:'📄 Addendum por firmar',
          cuerpo:'Se validó tu bono "'+row.nombre+'" por '+mxn(row.monto)+'. Firma el addendum en SoyPepe para que se aplique.',icono:'📄'})});}catch(_){}
      await cargarColas(); render(); estado('✓ validado · addendum generado','ok');
    }catch(err){alert('No se pudo validar: '+err.message);}
  });
  document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{
    const row=PROP.find(x=>x.id===b.dataset.no);
    const mot=prompt('Motivo del rechazo (lo verá quien lo propuso):'); if(mot===null) return;
    try{
      await api('/bonos_quincena?id=eq.'+row.id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},
        body:JSON.stringify({estatus:'rechazado',validado_por:ME||null,validado_at:new Date().toISOString(),motivo_rechazo:mot||null})});
      await cargarColas(); render(); estado('rechazado','ok');
    }catch(err){alert('No se pudo: '+err.message);}
  });
}

async function vAddendum(){
  const nom={}; EMPS.forEach(e=>nom[e.id]=e);
  const L=await porSede(ADD,x=>(nom[x.employee_id]||{}).sede);
  $('vista').innerHTML=`
  <div class="card">
    <h2>Addendums al contrato</h2>
    <p class="meta">Cada bono validado genera su addendum. Mientras esté pendiente de firma no se integra
      a la nómina — y por eso tampoco se integra al salario si hay una desvinculación.</p>
    ${L.length?`<div class="scroll"><table><thead><tr><th>Colaborador</th><th>Concepto</th><th class="num">Monto</th>
      <th>Vigencia</th><th>Estado</th></tr></thead><tbody>
      ${L.map(a=>{const e=nom[a.employee_id]||{};return `<tr>
        <td><strong>${esc(e.nombre||'—')}</strong><br><span class="faint" style="font-size:.72rem">${esc(e.sede||'')}</span></td>
        <td>${esc(a.concepto)}<br><span class="faint" style="font-size:.72rem">${esc(a.origen==='plan_carrera'?'plan de carrera':'bono por objetivos')}</span></td>
        <td class="num">${mxn(a.monto)}</td>
        <td>${esc(a.vigencia_desde||'')}</td>
        <td><span class="pill ${a.estatus==='firmado'?'ok':'warn'}">${a.estatus==='firmado'?('firmado '+String(a.firmado_at||'').slice(0,10)):'pendiente de firma'}</span></td>
      </tr>`;}).join('')}
    </tbody></table></div>`:'<p class="vacia">Todavía no hay addendums generados.</p>'}
  </div>`;
}

function vModelo(){
  $('vista').innerHTML=`
  <div class="card">
    <h2>Los tres caminos</h2>
    <p class="meta">Una sola vara para todo el Grupo: los mismos cinco requisitos, con el umbral más alto
      conforme sube el escalón. El sueldo del destino se alcanza con bono durante el camino y sólo se
      convierte en sueldo base al aprobar el plan.</p>
    <div class="grid2" style="margin-top:12px">
    ${TIPOS.map(t=>{const rs=REQS.filter(r=>r.tipo_codigo===t.codigo);return `
      <div style="border:1px solid var(--rule);border-radius:8px;padding:12px;background:var(--surface-3)">
        <strong>${esc(t.nombre)}</strong> <span class="pill">${t.meses} meses</span>
        <p class="meta" style="margin:6px 0 8px">${esc(t.descripcion||'')}</p>
        <table><tbody>${rs.map(r=>`<tr><td>${esc(r.nombre)}</td><td class="num"><strong>${
          r.medida==='meses_ganados'?(r.minimo+' de '+r.ventana_meses+' meses'):
          (r.medida==='bono'?'ganado':(r.minimo+' o más'))}</strong></td></tr>`).join('')}</tbody></table>
      </div>`;}).join('')}
    </div>
    <p class="meta" style="margin-top:12px"><strong>La rampa del bono:</strong> 25% de la brecha con 1 requisito
      cerrado · 50% con 3 · 75% con 4 · 100% con los cinco. Al llegar al 100% el colaborador ya cobra lo que
      gana un nivel 1 del puesto destino, pero por la vía del bono.</p>
    <p class="meta"><strong>Ojo:</strong> la categoría <em>Subjefe de área</em> existe en el organigrama pero
      no tiene fila en el tabulador, así que hoy no se puede calcular su brecha. Hay que darle de alta su
      rango antes de abrir planes hacia subjefatura.</p>
  </div>`;
}

/* ── router ───────────────────────────────────────────────────────────────── */
function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.t===TAB?'true':'false'));
  if(TAB==='planes') vPlanes();
  else if(TAB==='validar') vValidar();
  else if(TAB==='addendum') vAddendum();
  else vModelo();
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;render();});
$('fSede').onchange=render;

cargar().then(render).catch(e=>{
  $('vista').innerHTML='<p class="vacia">No se pudo cargar. Si acabas de entrar, recarga el panel para renovar la sesión.</p>';
});
</script>
</body>
</html>
