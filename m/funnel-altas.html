<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funnel de Altas · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--ground);color:var(--ink);font-size:15px}
.top{padding:16px 16px 2px;max-width:1600px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px}
.bar{max-width:1600px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.bar input#fTxt{min-width:220px;flex:1;max-width:340px}
.bar .chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px}
.bar .status{margin-left:auto;font-size:12px;color:var(--muted)}.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
/* ---------- tablero vertical por etapa ---------- */
.tablero{display:flex;gap:12px;overflow-x:auto;padding:8px 16px 40px;max-width:1600px;margin:0 auto;align-items:flex-start}
.col{flex:0 0 244px;background:var(--surface-3);border:1px solid var(--rule);border-radius:12px;display:flex;flex-direction:column;max-height:calc(100vh - 180px)}
.col .cab{padding:10px 12px 8px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:inherit;border-radius:12px 12px 0 0;z-index:1}
.col .cab .num{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);font-weight:700}
.col .cab h2{font-size:13px;font-weight:700;margin:2px 0 0;line-height:1.2}
.col .cab .cuenta{font-size:19px;font-weight:800;margin-top:2px;color:var(--accent)}
.col.done .cab .cuenta{color:var(--muted)}
.col .cuerpo{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1;min-height:40px}
.col .nada{color:var(--faint);font-size:12px;text-align:center;padding:14px 6px}
.tj{background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--rule);border-radius:10px;padding:10px 11px;cursor:pointer;box-shadow:var(--shadow)}
.tj:hover{box-shadow:0 3px 10px -2px rgba(31,27,22,.25)}
.tj.nos{border-left-color:var(--accent)}
.tj.ella{border-left-color:#D98324}
.tj.ok{border-left-color:var(--faint)}
/* columnas coloreadas por quién tiene atorada esa etapa */
.col.nos .cab{background:var(--accent-soft)}
.col.nos .cab .num{color:var(--ok)}
.col.ella .cab{background:#FBEBD9}
.col.ella .cab .num{color:#B5651D}
.tj b{font-size:13px;font-weight:700;display:block;line-height:1.25}
.tj .don{color:var(--muted);font-size:11.5px;margin-top:2px}
.tj .datos{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.etq{display:inline-block;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 7px;white-space:nowrap}
.etq.g{background:var(--ok-bg);color:var(--ok)}.etq.a{background:var(--warn-bg);color:var(--warn)}.etq.r{background:var(--bad-bg);color:var(--bad)}
.tj .avance{display:flex;gap:3px;margin-top:8px}
.tj .avance i{flex:1;height:4px;border-radius:2px;background:var(--rule)}
.tj .avance i.on{background:var(--accent)}
.tj .falta{margin-top:7px;font-size:11px;color:var(--bad);line-height:1.35}
/* ---------- ficha lateral ---------- */
.velo{position:fixed;inset:0;background:rgba(31,27,22,.38);z-index:50;display:none}
.velo.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ground);z-index:51;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;box-shadow:-20px 0 50px -30px rgba(31,27,22,.7)}
.panel.on{transform:none}
.panel .ph{padding:16px 18px 12px;border-bottom:1px solid var(--rule);background:var(--surface);position:sticky;top:0;z-index:2}
.panel .ph h2{font-size:17px;font-weight:800;margin:0;padding-right:34px}
.panel .ph .don{color:var(--muted);font-size:12.5px;margin-top:3px}
.panel .cerrar{position:absolute;top:14px;right:16px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;width:29px;height:29px;cursor:pointer;color:var(--muted);font-size:16px;line-height:1}
.pc{padding:14px 16px 48px;display:flex;flex-direction:column;gap:14px}
.bloque{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 14px;box-shadow:var(--shadow)}
.bloque h3{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin:0 0 10px;font-weight:800}
.bloque.sig{border-color:#bfe0d0;background:var(--accent-soft)}
.bloque.sig h3{color:var(--ok)}
.sig .quetoca{font-size:14px;font-weight:700;margin:0 0 4px}
.sig .quien{font-size:12px;color:var(--muted);margin:0 0 10px}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:11px;color:var(--muted);font-weight:600}
.fld input,.fld select{padding:8px;border:1px solid var(--rule);border-radius:8px;font-size:13px;background:var(--surface);color:var(--ink);width:100%}
.fld.ro input{background:var(--surface-3);color:var(--muted)}
.docrow{display:flex;gap:7px;flex-wrap:wrap}
.doc{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--rule);text-decoration:none;color:var(--ink-2);background:var(--surface-3)}
.doc.no{color:var(--bad);opacity:.6}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.btn{border:1px solid var(--rule-2);background:var(--surface);border-radius:8px;padding:9px 13px;font-size:13px;cursor:pointer;color:var(--ink);font-weight:600}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.gold{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.mini{padding:6px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.lock{font-size:12px;color:var(--warn);background:var(--warn-bg);border:1px solid #ecd9a6;border-radius:8px;padding:7px 10px;margin-bottom:8px}
.hint{font-size:11.5px;color:var(--faint);margin:6px 0 0;line-height:1.4}
.bonos{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.bono{font-size:12px;background:var(--surface-3);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;display:flex;gap:8px;justify-content:space-between}
.savebar{position:sticky;bottom:0;background:var(--ground);border-top:1px solid var(--rule);padding:10px 16px;display:flex;gap:10px;align-items:center}
.savebar .msg{font-size:12px;color:var(--muted)}
.loading,.empty{text-align:center;color:var(--muted);padding:34px}
</style>

</head><body>
<div class="top"><h1>🧭 Funnel de altas</h1><div class="sub">Cada colaborador en su etapa. Toca una tarjeta para abrir su ficha a la derecha y capturar lo que toca; al completarlo, pasa solo a la siguiente etapa.</div></div>
<div class="bar">
  <input id="fTxt" placeholder="Buscar por nombre…">
  <select id="fUbic"><option value="">Todas las ubicaciones</option><option value="cdmx">CDMX</option><option value="puebla">Puebla</option><option value="virreyes">Virreyes</option><option value="corp">Corp</option></select>
  <label class="chk"><input type="checkbox" id="fAll"> Ver también las completas</label>
  <span class="status" id="status"></span>
</div>
<div class="tablero" id="tablero"><div class="loading">Cargando…</div></div>

<input type="file" id="docFile" accept="image/*,application/pdf" hidden>
<div class="velo" id="velo"></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="ph"><button class="cerrar" id="pCerrar">×</button><h2 id="pNom">—</h2><div class="don" id="pDon"></div></div>
  <div class="pc" id="pc"></div>
</aside>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const SBU='https://rehophywchakfapivsbh.supabase.co';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v.session||v);if(s&&s.access_token)return s.access_token;}}}catch(e){}return '';}
function H(){return {apikey:KEY,Authorization:'Bearer '+(tok()||KEY),'Content-Type':'application/json'};}
const $=id=>document.getElementById(id);
const PROPCODE={'45e69775-d877-4507-a9e1-a45bd3400dc5':'cdmx','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'virreyes','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'puebla','fde2f615-2c65-40fa-9df3-6336b5ab312c':'corp'};
const CODEPROP={cdmx:'45e69775-d877-4507-a9e1-a45bd3400dc5',virreyes:'3e10a9ea-4913-4f7c-86ef-0c829caa851d',puebla:'febfbef6-7fd1-4b45-84d9-13533e8dcb72',corp:'fde2f615-2c65-40fa-9df3-6336b5ab312c'};
const LOCNOM={cdmx:'CDMX',virreyes:'Virreyes',puebla:'Puebla',corp:'Corp'};
const CATS=[['tecnico','Técnico'],['auxiliar','Auxiliar'],['practicante','Becario'],['subjefe','Subjefe de área'],['jefe_area','Jefe de área'],['subgerencia','Subgerente'],['gerente_general','Gerente General'],['gerencia_regional','Gerencia Regional'],['direccion','Dirección']];
const TRAMOS=['Prácticas','Junior','Junior 2','Senior'];
// por = quién debe ACTUAR para COMPLETAR esa etapa: 'nos' (RH) = verde, 'ella' (trabajador) = naranja.
const ETAPAS=[
 {k:'solicito',  n:'Etapa 0', l:'Solicitó acceso', who:'El trabajador', por:'ella', sig:()=>true},
 {k:'autorizado',n:'Etapa 1', l:'Alta + usuario',  who:'RH autoriza', por:'nos', sig:s=>s.autorizado},
 {k:'datos',     n:'Etapa 2', l:'Subió sus datos', who:'El trabajador', por:'ella', sig:s=>s.datos_ok},
 {k:'validado',  n:'Etapa 3', l:'Validación interna', who:'RH captura', por:'nos', sig:s=>s.validado_ok},
 {k:'cont_env',  n:'Etapa 4', l:'Contrato enviado', who:'RH genera', por:'nos', sig:s=>s.contrato_enviado},
 {k:'cont_fir',  n:'Etapa 5', l:'Contrato firmado', who:'El trabajador firma', por:'ella', sig:s=>s.contrato_firmado},
 {k:'imss',      n:'Etapa 6', l:'Alta IMSS',       who:'RH', por:'nos', sig:s=>s.imss_ok},
 {k:'horario',   n:'Etapa 7', l:'Horario lanzado', who:'El jefe directo', por:'nos', sig:s=>s.horario_ok},
 {k:'integrado', n:'Etapa 8', l:'Integrado',       who:'—', por:'nos', sig:s=>s.integrado}
];
/* Dónde SE COLOCA la tarjeta = la última etapa cumplida (donde está hoy). curIdx = lo que SIGUE. */
function placeIdx(sig){for(let i=1;i<ETAPAS.length;i++){if(!ETAPAS[i].sig(sig))return i-1;}return ETAPAS.length-1;}
/* Quién la tiene atorada: el actor de la etapa que sigue. Integrado = nadie. */
function blocker(sig){ if(sig.integrado) return 'ok'; return ETAPAS[curIdx(sig)].por; }
let DATA=[], CAP={global:false,props:[],edita_delic:false}, ROLES=[], OPEN=null;

function status(t,c){const s=$('status');s.textContent=t||'';s.className='status'+(c?' '+c:'');}
async function rpc(fn,body){const r=await fetch(SB+'/rpc/'+fn,{method:'POST',headers:H(),body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null;}
async function edge(fn,body){const r=await fetch(SBU+'/functions/v1/'+fn,{method:'POST',headers:H(),body:JSON.stringify(body||{})});const t=await r.text();let j=null;try{j=t?JSON.parse(t):null;}catch(e){}if(!r.ok)throw new Error((j&&j.error)||t||('HTTP '+r.status));return j;}
async function rest(path){const r=await fetch(SB+path,{headers:H()});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
function curIdx(sig){for(let i=0;i<ETAPAS.length;i++){if(!ETAPAS[i].sig(sig))return i;}return ETAPAS.length-1;}

async function load(){
 status('cargando…');
 try{
   const d=await rpc('funnel_lista',{p_ver_integradas:$('fAll').checked});
   if(!d||d.puede===false){$('tablero').innerHTML='<div class="empty">No tienes acceso al funnel de altas.<br><span class="hint">Pídele a Javi que te agregue.</span></div>';status('');return;}
   CAP={global:!!d.global,props:d.props||[],edita_delic:!!d.edita_delic};DATA=d.rows||[];
   rpc('funnel_imss_sync',{}).catch(()=>{});
   if(!ROLES.length){try{ROLES=(await rest('/roles_catalogo?select=rol&order=rol')).map(x=>x.rol).filter(Boolean);}catch(e){}}
   render();status('✓','ok');
 }catch(e){status('⚠ error','err');$('tablero').innerHTML='<div class="empty">No se pudo cargar. '+esc((e.message||'').slice(0,120))+'</div>';}
}
function vis(){const u=$('fUbic').value,q=$('fTxt').value.trim().toLowerCase();
 return DATA.filter(e=>(!u||PROPCODE[e.property_id]===u)&&(!q||[e.nombre,e.email].some(v=>(v||'').toLowerCase().includes(q))));}

function faltan(s){const f=[];if(!s.autorizado)f.push('autorizar');else{if(!s.datos_ok)f.push('datos');if(!s.validado_ok)f.push('validación');if(!s.contrato_firmado)f.push('contrato');if(!s.imss_ok)f.push('IMSS');if(!s.horario_ok)f.push('horario');}return f;}
function tjHtml(e){const s=e.sig,ci=curIdx(s),fl=faltan(s),bl=blocker(s);
 const bars=ETAPAS.map((x,i)=>'<i class="'+(x.sig(s)?'on':'')+'"></i>').join('');
 const chips=[];
 if(!s.datos_ok)chips.push('<span class="etq r">sin expediente</span>');
 if(s.autorizado&&!s.validado_ok)chips.push('<span class="etq a">por validar</span>');
 if(s.validado_ok&&!s.contrato_firmado)chips.push('<span class="etq a">sin contrato</span>');
 if(s.contrato_firmado&&!s.imss_ok)chips.push('<span class="etq r">sin IMSS</span>');
 if(s.integrado)chips.push('<span class="etq g">integrado</span>');
 return `<div class="tj ${bl}" data-id="${e.id}"><b>${esc(e.nombre)}</b>
   <div class="don">${esc(LOCNOM[PROPCODE[e.property_id]]||e.sede||'—')} · ${esc(e.puesto||'sin puesto')}</div>
   ${chips.length?`<div class="datos">${chips.join('')}</div>`:''}
   <div class="avance">${bars}</div>
   ${fl.length?`<div class="falta">Falta: ${fl.join(', ')}</div>`:''}</div>`;
}
function render(){const list=vis();const cols=ETAPAS.map(()=>[]);
 list.forEach(e=>{cols[placeIdx(e.sig)].push(e);});
 const last=ETAPAS.length-1;
 $('tablero').innerHTML=ETAPAS.map((x,i)=>{
   const colcls = i===last ? 'done' : (ETAPAS[i+1].por==='ella'?'ella':'nos');
   return `<div class="col ${colcls}">
   <div class="cab"><div class="num">${x.n} · ${i===last?'listo':(colcls==='ella'?'espera al trabajador':'te toca a ti')}</div><h2>${x.l}</h2><div class="cuenta">${cols[i].length}</div></div>
   <div class="cuerpo">${cols[i].length?cols[i].map(tjHtml).join(''):'<div class="nada">Vacía</div>'}</div>
 </div>`;}).join('');
 $('tablero').querySelectorAll('.tj').forEach(c=>c.onclick=()=>openPanel(c.dataset.id));
}

/* ---------- ficha lateral ---------- */
function openUrl(u){try{window.open(u,'_blank');}catch(e){location.href=u;}}
let UP={id:null,campo:null};
async function verDoc(v){ if(!v)return; if(/^https?:\/\//.test(v)){openUrl(v);return;} try{const r=await fetch(SBU+'/storage/v1/object/sign/empleados/'+encodeURI(v),{method:'POST',headers:H(),body:JSON.stringify({expiresIn:3600})});const j=await r.json(); if(j&&j.signedURL){openUrl(SBU+'/storage/v1'+j.signedURL);} else alert('No se pudo abrir el archivo.'); }catch(e){alert('No se pudo abrir el archivo.');} }
function subirDoc(id,campo){ UP={id:id,campo:campo}; const fi=$('docFile'); fi.value=''; fi.click(); }
$('docFile').onchange=async function(){ const f=this.files[0]; if(!f||!UP.id||!UP.campo)return; const ext=(f.name.split('.').pop()||'pdf').toLowerCase(); const path='expediente/'+UP.id+'/'+UP.campo+'_'+Date.now()+'.'+ext; status('subiendo archivo…'); try{ const rr=await fetch(SBU+'/storage/v1/object/empleados/'+encodeURI(path),{method:'POST',headers:{Authorization:H().Authorization,apikey:KEY,'x-upsert':'true'},body:f}); if(!rr.ok)throw new Error(await rr.text()); const r=await rpc('funnel_doc',{p_id:UP.id,p_campo:UP.campo,p_url:path}); if(r&&r.ok){ status('✓ archivo subido','ok'); openPanel(UP.id); } else { status('⚠ '+((r&&r.error)||'no se pudo'),'err'); alert((r&&r.error)||'No se pudo guardar el archivo.'); } }catch(e){ status('⚠ no se pudo subir','err'); alert('No se pudo subir: '+(e.message||'error').slice(0,120)); } };
function closePanel(){$('panel').classList.remove('on');$('velo').classList.remove('on');OPEN=null;}
$('pCerrar').onclick=closePanel;$('velo').onclick=closePanel;

function opt(val,cur,lbl){return `<option value="${esc(val)}" ${String(cur||'')===String(val)?'selected':''}>${esc(lbl||val)}</option>`;}
function inp(id,val,type){return `<input id="${id}" type="${type||'text'}" value="${esc(val||'')}">`;}
function fld(label,inner,cls){return `<div class="fld ${cls||''}"><label>${label}</label>${inner}</div>`;}

async function openPanel(id){
 OPEN=id;$('panel').classList.add('on');$('velo').classList.add('on');
 $('pNom').textContent='…';$('pDon').textContent='';$('pc').innerHTML='<div class="hint">Cargando ficha…</div>';
 let f,nom=null;
 try{f=await rpc('funnel_ficha',{p_id:id});}catch(e){$('pc').innerHTML='<div class="hint">No se pudo cargar.</div>';return;}
 if(!f){$('pc').innerHTML='<div class="hint">Sin acceso a esta ficha.</div>';return;}
 if(f.ve_salario){try{nom=await rpc('funnel_nomina',{p_id:id});}catch(e){}}
 const row=DATA.find(x=>x.id===id)||{};const s=row.sig||{};const ci=curIdx(s);const pe=placeIdx(s);
 $('pNom').textContent=f.nombre||'—';
 $('pDon').textContent=(LOCNOM[PROPCODE[f.property_id]]||f.sede||'—')+' · '+(f.empleado_id||'sin folio')+' · '+ETAPAS[pe].l;
 $('pc').innerHTML=drawerHtml(f,nom,s,ci);
 wire(id,f,nom);
}

function siguienteHtml(f,s,ci){
 const et=ETAPAS[ci];let body='',quien=et.who;
 if(!s.autorizado){body=`<p class="quetoca">Autorizar el alta</p><p class="quien">Tú confirmas que entra a trabajar; se le crea su usuario y se le manda su contraseña.</p><div class="acts"><button class="btn go" data-act="autorizar">Autorizar alta →</button></div>`;}
 else if(!s.datos_ok){body=`<p class="quetoca">Esperando que suba su información</p><p class="quien">Le llegó la liga a su correo para crear su contraseña y llenar RFC, CURP, NSS y subir sus documentos. ¿No le llegó? Reenvíasela.</p><div class="acts"><button class="btn" data-act="reenviar">Reenviar correo de acceso ✉️</button></div>`;}
 else if(!s.validado_ok){body=`<p class="quetoca">Validar y capturar sus datos</p><p class="quien">Ya mandó su información. Revisa abajo y completa rol, puesto, categoría, salario, propiedad y equipo para poder continuar al contrato.</p>`;}
 else if(!s.contrato_firmado){body=`<p class="quetoca">${s.contrato_enviado?'Esperando su firma del contrato':'Generar el contrato y avisarle'}</p><p class="quien">${s.contrato_enviado?'El contrato ya está en su buzón de SoyPepe para firmar.':'Genera el contrato desde el machote (cae en su buzón de SoyPepe) y mándale el correo para que entre y firme.'}</p><div class="acts"><button class="btn gold" data-act="contrato">Abrir Contratos ↗</button><button class="btn go" data-act="aviso-contrato">Avisar que ya puede firmar ✉️</button></div>`;}
 else if(!s.imss_ok){body=`<p class="quetoca">Darlo de alta en el IMSS</p><p class="quien">Captura la fecha de alta; se quita de los pendientes de Roberto/Claudia.</p><div class="acts"><input id="imssFast" type="date" style="padding:8px;border:1px solid var(--rule);border-radius:8px"> <button class="btn go mini" data-act="imss">Marcar alta IMSS</button></div>`;}
 else if(!s.horario_ok){body=`<p class="quetoca">Lanzar su horario</p><p class="quien">El jefe directo${f.jefe?(' ('+esc(f.jefe.nombre)+')'):''} elige el plan de incorporación (arma la rotación y los objetivos) y luego pone los días.</p><div class="acts"><button class="btn gold" data-act="lanzar">Lanzar plan de incorporación</button><button class="btn mini" data-act="horario">Abrir horario ↗</button></div>`;}
 else{body=`<p class="quetoca">Todo listo</p><p class="quien">Expediente, contrato, IMSS y horario completos.</p><div class="acts"><button class="btn go" data-act="integrar">Marcar integrado ✓</button></div>`;}
 return `<div class="bloque sig"><h3>Lo que sigue · ${esc(et.n)}</h3>${body}</div>`;
}

function val(id){const el=$(id);return el?el.value:undefined;}
function wire(id,f,nom){
 const pc=$('pc');
 pc.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>accion(b.dataset.act,id,b));
 pc.querySelectorAll('[data-ver]').forEach(b=>b.onclick=()=>verDoc(b.dataset.ver));
 pc.querySelectorAll('[data-subir]').forEach(b=>b.onclick=()=>subirDoc(id,b.dataset.subir));
 const sv=$('fx_save');if(sv)sv.onclick=async function(){sv.disabled=true;const msg=$('fx_msg');msg.textContent='Guardando…';
   const patch={};
   [['telefono','fx_telefono'],['fecha_nacimiento','fx_fecha_nacimiento'],['nacionalidad','fx_nacionalidad'],['estado_civil','fx_estado_civil'],['direccion','fx_direccion'],['contacto_nombre','fx_contacto_nombre'],['contacto_cel','fx_contacto_cel'],
    ['rfc','fx_rfc'],['curp','fx_curp'],['nss','fx_nss'],['afore','fx_afore'],['banco','fx_banco'],['clabe','fx_clabe'],['titular_cuenta','fx_titular_cuenta'],
    ['puesto','fx_puesto'],['tramo','fx_tramo'],['area','fx_area'],['area_2','fx_area_2'],['horas_semanales','fx_horas_semanales'],['fecha_inicio_labores','fx_fecha_inicio_labores'],
    ['tipo_contrato','fx_tipo_contrato'],['contrato_categoria','fx_contrato_categoria'],['exento_checador','fx_exento_checador'],['imss_alta_fecha','fx_imss_alta_fecha']
   ].forEach(p=>{const v=val(p[1]);if(v!==undefined)patch[p[0]]=v;});
   const sede=val('fx_sede');if(sede){patch.sede=LOCNOM[sede];patch.property_id=CODEPROP[sede];}
   if(f.edita_delic){['rol','categoria'].forEach(k=>{const v=val('fx_'+k);if(v!==undefined)patch[k]=v;});
     if(nom&&nom.ve)[['salario_bruto','fx_salario_bruto'],['sueldo_base','fx_sueldo_base'],['salario_diario','fx_salario_diario'],['neto_fijo','fx_neto_fijo'],['esquema_pago','fx_esquema_pago'],['salario_desde','fx_salario_desde'],['bono_puntualidad','fx_bono_puntualidad'],['bono_puntualidad_monto','fx_bono_puntualidad_monto']].forEach(p=>{const v=val(p[1]);if(v!==undefined)patch[p[0]]=v;});}
   try{const r=await rpc('funnel_guardar',{p_id:id,p_patch:patch});if(r&&r.ok){msg.textContent='✓ Guardado';await load();}else{msg.textContent='⚠ '+((r&&r.error)||'no se pudo');sv.disabled=false;}}
   catch(e){msg.textContent='⚠ '+(e.message||'error').slice(0,70);sv.disabled=false;}
 };
 const add=$('fb_add');if(add)add.onclick=async function(){const m=$('fb_msg');const nm=val('fb_nombre'),mo=val('fb_monto');if(!nm||!mo){m.textContent='Pon nombre y monto';return;}add.disabled=true;m.textContent='…';try{const r=await rpc('funnel_add_bono',{p_id:id,p_nombre:nm,p_tipo:val('fb_tipo')||'bono',p_monto:Number(mo),p_periodicidad:val('fb_periodicidad'),p_desde:null});if(r&&r.ok){openPanel(id);}else{m.textContent='⚠ '+((r&&r.error)||'');add.disabled=false;}}catch(e){m.textContent='⚠ '+(e.message||'').slice(0,50);add.disabled=false;}};
}
async function accion(act,id,btn){
 if(act==='autorizar'){
   const row=DATA.find(x=>x.id===id)||{};
   let correo=(row.email||'').trim();
   if(!correo){ correo=(prompt('Correo del trabajador (ahí le llega su acceso para crear contraseña):')||'').trim(); if(!correo)return;
     try{const rs=await rpc('funnel_set_email',{p_id:id,p_email:correo}); if(!(rs&&rs.ok)){alert((rs&&rs.error)||'Correo no válido.');return;}}catch(e){alert('No se pudo guardar el correo.');return;} }
   if(!confirm('¿Autorizar el alta de '+(row.nombre||'la persona')+'?\n\nSe crea su usuario y se le manda el correo para crear su contraseña y completar sus datos.'))return;
   btn.disabled=true;status('autorizando…');
   try{const r=await edge('funnel-autorizar',{employee_id:id});
     if(r&&r.ok){status(r.mail_enviado?'✓ Autorizada · correo enviado':'✓ Autorizada','ok');await load();openPanel(id);}
     else{status('⚠ '+((r&&r.error)||'no se pudo'),'err');alert((r&&r.error)||'No se pudo autorizar.');btn.disabled=false;}}
   catch(e){status('⚠ error','err');alert('No se pudo autorizar: '+(e.message||'').slice(0,140));btn.disabled=false;}
   return;
 }
 if(act==='contrato'){openUrl('/m/contratos.html');return;}
 if(act==='reenviar'){ if(!confirm('¿Reenviar el correo de acceso (crear contraseña + llenar sus datos)?'))return; btn.disabled=true;status('reenviando…');
   try{const r=await edge('funnel-autorizar',{employee_id:id}); if(r&&r.ok){status(r.mail_enviado?'✓ Correo reenviado':'✓ hecho (sin correo)','ok');}else{status('⚠ '+((r&&r.error)||''),'err');alert((r&&r.error)||'No se pudo.');btn.disabled=false;}}
   catch(e){status('⚠ error','err');alert('No se pudo: '+(e.message||'').slice(0,120));btn.disabled=false;} return; }
 if(act==='aviso-contrato'){ if(!confirm('¿Mandarle el correo avisando que ya está su contrato y que entre a firmar?'))return; btn.disabled=true;status('enviando correo…');
   try{const r=await edge('funnel-aviso-contrato',{employee_id:id}); if(r&&r.ok){status(r.mail_enviado?'✓ Correo enviado':'✓ hecho (sin correo)','ok');}else{status('⚠ '+((r&&r.error)||''),'err');alert((r&&r.error)||'No se pudo.');btn.disabled=false;}}
   catch(e){status('⚠ error','err');alert('No se pudo: '+(e.message||'').slice(0,120));btn.disabled=false;} return; }
 if(act==='horario'){openUrl('/m/rh-horario.html');return;}
 if(act==='imss'){const fe=val('imssFast');if(!fe){alert('Elige la fecha de alta.');return;}btn.disabled=true;try{const r=await rpc('funnel_guardar',{p_id:id,p_patch:{imss_alta_fecha:fe}});if(r&&r.ok){await load();openPanel(id);}else{alert('No se pudo: '+((r&&r.error)||''));btn.disabled=false;}}catch(e){alert('No se pudo: '+e.message);btn.disabled=false;}return;}
 if(act==='lanzar'){if(!confirm('¿Lanzar el plan de incorporación? Arma la rotación de turnos y los objetivos del periodo de prueba según su rol.'))return;btn.disabled=true;try{const r=await rpc('funnel_lanzar_horario',{p_id:id,p_inicio:val('fx_fecha_inicio_labores')||null});if(r&&r.ok){alert('Plan listo: '+r.semanas+' semanas y '+r.hitos+' objetivos. Ahora ponle los días en Horario.');await load();openPanel(id);}else{alert('No se pudo: '+((r&&r.error)||''));btn.disabled=false;}}catch(e){alert('No se pudo: '+e.message);btn.disabled=false;}return;}
 if(act==='integrar'){if(!confirm('¿Marcar como integrado? Queda activo y termina el funnel.'))return;btn.disabled=true;try{await rpc('funnel_integrar',{p_id:id});await load();closePanel();}catch(e){alert('No se pudo: '+e.message);btn.disabled=false;}return;}
}

try{var pg=(localStorage.getItem('cpp_proyecto')||'').toLowerCase();if(['cdmx','puebla','virreyes','corp'].includes(pg))$('fUbic').value=pg;}catch(e){}
['fUbic','fTxt'].forEach(id=>$(id).addEventListener('input',render));
$('fAll').addEventListener('change',load);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();});
load();
