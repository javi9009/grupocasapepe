<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funnel de Altas · Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a;--shadow:0 1px 3px rgba(43,32,23,.08)}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}.ttl{font-weight:600;font-size:15px}.ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:12px;color:var(--soft);font-weight:600}
.bar select,.bar input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
.bar .status{margin-left:auto;font-size:12px;color:var(--soft)}.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
.wrap{padding:4px 16px 60px;max-width:1040px;margin:0 auto}
/* resumen del funnel */
.funnel{display:flex;gap:6px;overflow-x:auto;padding:6px 0 10px}
.fcol{flex:1;min-width:92px;background:#fff;border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.fcol .n{font-size:20px;font-weight:800;color:var(--gold)}
.fcol .l{font-size:10px;color:var(--soft);line-height:1.15;margin-top:2px}
.fcol.k .n{color:var(--accent)}
/* tarjetas */
.card{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ava{width:34px;height:34px;border-radius:50%;background:#efe6d4;display:flex;align-items:center;justify-content:center;font-size:17px;flex:0 0 auto}
.nm{font-weight:700;font-size:15px}.sub{font-size:12px;color:var(--soft)}
.pill{font-size:11px;padding:2px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--soft);font-weight:600;white-space:nowrap}
.pill.id{background:#faf5ea;color:#8a6d1f;border-color:#e7d4a0}
.pill.loc{background:#eaf6f0;color:#176b4e;border-color:#bfe0d0}
.spacer{flex:1}
.steps{display:flex;gap:0;margin:14px 0 8px;overflow-x:auto;padding-bottom:4px}
.step{flex:1;min-width:72px;text-align:center;position:relative}
.step::before{content:"";position:absolute;top:9px;left:-50%;width:100%;height:2px;background:var(--bd);z-index:0}
.step:first-child::before{display:none}
.dot{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--bd);margin:0 auto 5px;position:relative;z-index:1;font-size:11px;line-height:16px;color:#fff}
.lbl{font-size:9.5px;color:var(--soft);line-height:1.15}
.step.done .dot{background:var(--accent);border-color:var(--accent)}
.step.done::before{background:var(--accent)}
.step.cur .dot{background:var(--gold);border-color:var(--gold)}
.step.cur .lbl{color:var(--txt);font-weight:700}
/* chips de consumidores */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 8px}
.chip{font-size:11px;padding:3px 9px;border-radius:8px;font-weight:600;border:1px solid}
.chip.g{background:#eaf6f0;color:#176b4e;border-color:#bfe0d0}
.chip.a{background:#fbf3e0;color:#8a6410;border-color:#ecd9a6}
.chip.r{background:#fbeaea;color:#8f2a2a;border-color:#eccaca}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;align-items:center}
.btn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;color:var(--txt);font-weight:600}
.btn.go{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.gold{background:var(--gold);color:#fff;border-color:var(--gold)}
.btn.mini{padding:5px 9px;font-size:12px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.done-badge{color:var(--accent);font-weight:700;font-size:13px}
/* ficha expandida */
.ficha{margin-top:10px;border-top:1px solid var(--bd);padding-top:12px;display:none}
.ficha.show{display:block}
.grp{margin:0 0 14px}
.grp h4{margin:0 0 8px;font-size:12px;color:var(--gold);text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--bd);padding-bottom:4px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--soft);font-weight:600}
.fld input,.fld select{padding:7px 8px;border:1px solid var(--bd);border-radius:7px;font-size:13px;background:#fff;color:var(--txt)}
.fld.ro input{background:#f6f1e6;color:var(--soft)}
.docrow{display:flex;gap:8px;flex-wrap:wrap}
.doc{font-size:12px;padding:4px 9px;border-radius:7px;border:1px solid var(--bd);text-decoration:none;color:var(--txt);background:#faf6ec}
.doc.no{color:#b08;opacity:.55;color:var(--bad)}
.save-row{display:flex;gap:8px;align-items:center;margin-top:6px}
.save-row .msg{font-size:12px;color:var(--soft)}
.lock{font-size:11px;color:var(--warn);background:#fbf3e0;border:1px solid #ecd9a6;border-radius:7px;padding:6px 9px}
.empty{text-align:center;color:var(--soft);padding:44px}
.hint{font-size:11px;color:var(--soft);margin:2px 0 0}
.bonos{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.bono{font-size:12px;background:#faf6ec;border:1px solid var(--bd);border-radius:7px;padding:5px 9px;display:flex;gap:8px;justify-content:space-between}
</style>
<link rel="icon" type="image/png" href="/dash-192.png"><link rel="apple-touch-icon" href="/dash-192.png">
</head><body>
<script>if(window.self!==window.top){document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(h)h.style.display="none";});}</script>
<header><a href="/">← Panel</a><span class="ttl">Funnel de Altas <b>Grupo Casa Pepe</b></span><span style="font-size:11px;color:#cdbf9c;margin-left:auto">Supabase en vivo</span></header>
<div class="bar">
<label>Ubicación</label><select id="fUbic"><option value="">Todas</option><option value="cdmx">CDMX</option><option value="puebla">Puebla</option><option value="virreyes">Virreyes</option><option value="corp">Corp</option></select>
<label><input type="checkbox" id="fAll"> Ver también las integradas</label>
<label>Buscar</label><input id="fTxt" placeholder="nombre…">
<span class="status" id="status"></span>
</div>
<div class="wrap"><div class="funnel" id="funnel"></div><div id="list"><div class="empty">Cargando…</div></div></div>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v.session||v);if(s&&s.access_token)return s.access_token;}}}catch(e){}return '';}
function H(){return {apikey:KEY,Authorization:'Bearer '+(tok()||KEY),'Content-Type':'application/json'};}
const $=id=>document.getElementById(id);
const PROPCODE={'45e69775-d877-4507-a9e1-a45bd3400dc5':'cdmx','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'virreyes','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'puebla','fde2f615-2c65-40fa-9df3-6336b5ab312c':'corp'};
const CODEPROP={cdmx:'45e69775-d877-4507-a9e1-a45bd3400dc5',virreyes:'3e10a9ea-4913-4f7c-86ef-0c829caa851d',puebla:'febfbef6-7fd1-4b45-84d9-13533e8dcb72',corp:'fde2f615-2c65-40fa-9df3-6336b5ab312c'};
const LOCNOM={cdmx:'CDMX',virreyes:'Virreyes',puebla:'Puebla',corp:'Corp'};
const CATS=[['tecnico','Técnico'],['auxiliar','Auxiliar'],['practicante','Becario'],['subjefe','Subjefe de área'],['jefe_area','Jefe de área'],['subgerencia','Subgerente'],['gerente_general','Gerente General'],['gerencia_regional','Gerencia Regional'],['direccion','Dirección']];
const TRAMOS=['Prácticas','Junior','Junior 2','Senior'];
// Las 9 etapas y la señal que las marca completas
const ETAPAS=[
 {k:'solicito',  l:'Solicitó acceso', sig:()=>true},
 {k:'autorizado',l:'Alta + usuario',  sig:s=>s.autorizado},
 {k:'datos',     l:'Subió datos',     sig:s=>s.datos_ok},
 {k:'validado',  l:'Validación',      sig:s=>s.validado_ok},
 {k:'cont_env',  l:'Contrato',        sig:s=>s.contrato_enviado},
 {k:'cont_fir',  l:'Firmado',         sig:s=>s.contrato_firmado},
 {k:'imss',      l:'Alta IMSS',       sig:s=>s.imss_ok},
 {k:'horario',   l:'Horario',         sig:s=>s.horario_ok},
 {k:'integrado', l:'Integrado',       sig:s=>s.integrado}
];
let DATA=[], CAP={global:false,props:[]}, ROLES=[];

function status(t,c){const s=$('status');s.textContent=t||'';s.className='status'+(c?' '+c:'');}
async function rpc(fn,body){const r=await fetch(SB+'/rpc/'+fn,{method:'POST',headers:H(),body:JSON.stringify(body||{})});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):null;}
async function rest(path){const r=await fetch(SB+path,{headers:H()});if(!r.ok)throw new Error(await r.text());const t=await r.text();return t?JSON.parse(t):[];}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);}
function curIdx(sig){let i=0;for(;i<ETAPAS.length;i++){if(!ETAPAS[i].sig(sig))return i;}return ETAPAS.length-1;}

async function load(){
 status('cargando…');
 try{
   const d=await rpc('funnel_lista',{p_ver_integradas:$('fAll').checked});
   if(!d||d.puede===false){$('list').innerHTML='<div class="empty">No tienes acceso al funnel de altas.<br><span class="hint">Pídele a Javi que te agregue.</span></div>';$('funnel').innerHTML='';status('');return;}
   CAP={global:!!d.global,props:d.props||[]};DATA=d.rows||[];
   rpc('funnel_imss_sync',{}).catch(()=>{});           // marca pendientes de IMSS (idempotente)
   if(!ROLES.length){try{ROLES=(await rest('/roles_catalogo?select=rol&order=rol')).map(x=>x.rol).filter(Boolean);}catch(e){}}
   render();status('✓','ok');
 }catch(e){status('⚠ error','err');$('list').innerHTML='<div class="empty">No se pudo cargar. '+esc((e.message||'').slice(0,120))+'</div>';}
}
function vis(){const u=$('fUbic').value,q=$('fTxt').value.trim().toLowerCase();
 return DATA.filter(e=>(!u||PROPCODE[e.property_id]===u)&&(!q||[e.nombre,e.email].some(v=>(v||'').toLowerCase().includes(q))))
   .sort((a,b)=>curIdx(a.sig)-curIdx(b.sig)||(a.nombre||'').localeCompare(b.nombre||''));}

function resumen(list){
 const cnt=ETAPAS.map(()=>0);list.forEach(e=>{cnt[curIdx(e.sig)]++;});
 $('funnel').innerHTML=ETAPAS.map((x,i)=>`<div class="fcol ${i===ETAPAS.length-1?'k':''}"><div class="n">${cnt[i]}</div><div class="l">${x.l}</div></div>`).join('');
}
function chip(estado,txt){return `<span class="chip ${estado}">${txt}</span>`;}
function chips(s){
 const docs=s.docs||0;
 return '<div class="chips">'
  +chip(s.datos_ok?'g':'r','Datos '+(s.datos_ok?'✓':'✗'))
  +chip(docs>=6?'g':docs>0?'a':'r','Documentos '+docs+'/7')
  +chip(s.validado_ok?'g':'a','Nómina '+(s.validado_ok?'✓':'pend'))
  +chip(s.contrato_firmado?'g':s.contrato_enviado?'a':'r','Contrato '+(s.contrato_firmado?'firmado':s.contrato_enviado?'enviado':'—'))
  +chip(s.imss_ok?'g':'r','IMSS '+(s.imss_ok?'✓':'pend'))
  +chip(s.horario_ok?'g':'a','Horario '+(s.horario_ok?'✓':'pend'))
  +chip(s.horario_ok?'g':'a','Desempeño '+(s.horario_ok?'armado':'pend'))
  +'</div>';}
function stepper(s){const ci=curIdx(s);return '<div class="steps">'+ETAPAS.map((x,i)=>{const done=x.sig(s);const cls=done?'done':(i===ci?'cur':'');return `<div class="step ${cls}"><div class="dot">${done?'✓':''}</div><div class="lbl">${x.l}</div></div>`;}).join('')+'</div>';}

function accionesHtml(e){const s=e.sig,ci=curIdx(s),a=[];
 if(!s.autorizado) a.push(`<button class="btn go" data-act="autorizar" data-id="${e.id}">Autorizar alta →</button>`);
 else {
   a.push(`<button class="btn ${ci===3?'gold':''}" data-act="ficha" data-id="${e.id}">Validar / ver ficha</button>`);
   if(s.validado_ok && !s.contrato_firmado) a.push(`<button class="btn mini" data-act="contrato" data-id="${e.id}">Contrato ↗</button>`);
   if(s.contrato_firmado && !s.imss_ok) a.push(`<button class="btn mini gold" data-act="ficha" data-id="${e.id}">Marcar IMSS</button>`);
   if(s.contrato_firmado && !s.horario_ok) a.push(`<button class="btn mini" data-act="ficha" data-id="${e.id}">Lanzar horario</button>`);
   if(ci>=8 && !s.integrado) a.push(`<button class="btn go mini" data-act="integrar" data-id="${e.id}">Marcar integrado ✓</button>`);
 }
 if(s.integrado) a.push('<span class="done-badge">✓ Integrado</span>');
 return '<div class="acts">'+a.join('')+'</div>';}

function render(){const list=vis();resumen(list);const w=$('list');
 if(!list.length){w.innerHTML='<div class="empty">Sin altas en proceso 🎉</div>';return;}
 w.innerHTML=list.map(e=>`<div class="card" data-card="${e.id}">
   <div class="top"><span class="ava">${esc(e.avatar_emoji||'🧑')}</span>
     <div><div class="nm">${esc(e.nombre)}</div><div class="sub">${esc(e.puesto||'(puesto pendiente)')} · ${esc(e.email||'')}</div></div>
     <span class="spacer"></span>
     <span class="pill loc">${esc(LOCNOM[PROPCODE[e.property_id]]||e.sede||'—')}</span>
     <span class="pill id">${esc(e.empleado_id||'sin folio')}</span></div>
   ${stepper(e.sig)}${chips(e.sig)}${accionesHtml(e)}
   <div class="ficha" id="f-${e.id}"></div>
 </div>`).join('');
 w.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>accion(b.dataset.act,b.dataset.id,b));
}

function openUrl(u){try{window.open(u,'_blank');}catch(e){location.href=u;}}
async function accion(act,id,btn){
 if(act==='autorizar'){openUrl('/m/autorizar-altas.html');return;}
 if(act==='contrato'){openUrl('/m/contratos.html');return;}
 if(act==='integrar'){if(!confirm('¿Marcar como integrado? Queda activo y termina el funnel.'))return;btn.disabled=true;try{await rpc('funnel_integrar',{p_id:id});await load();}catch(e){alert('No se pudo: '+e.message);btn.disabled=false;}return;}
 if(act==='ficha'){toggleFicha(id);return;}
}

async function toggleFicha(id){const box=$('f-'+id);if(box.classList.contains('show')){box.classList.remove('show');box.innerHTML='';return;}
 box.classList.add('show');box.innerHTML='<div class="hint">Cargando ficha…</div>';
 let f,nom=null;
 try{f=await rpc('funnel_ficha',{p_id:id});}catch(e){box.innerHTML='<div class="hint">No se pudo cargar.</div>';return;}
 if(!f){box.innerHTML='<div class="hint">Sin acceso a esta ficha.</div>';return;}
 if(f.ve_salario){try{nom=await rpc('funnel_nomina',{p_id:id});}catch(e){}}
 box.innerHTML=fichaHtml(f,nom);wireFicha(box,id,f,nom);
}

function opt(val,cur,lbl){return `<option value="${esc(val)}" ${String(cur||'')===String(val)?'selected':''}>${esc(lbl||val)}</option>`;}
function inp(id,val,type){return `<input id="${id}" type="${type||'text'}" value="${esc(val||'')}">`;}
function fld(label,inner,ro){return `<div class="fld ${ro?'ro':''}"><label>${label}</label>${inner}</div>`;}

function fichaHtml(f,nom){
 const rolOpts='<option value=""></option>'+ROLES.map(r=>opt(r,f.rol)).join('')+(f.rol&&ROLES.indexOf(f.rol)<0?opt(f.rol,f.rol):'');
 const catOpts='<option value=""></option>'+CATS.map(c=>opt(c[0],f.categoria,c[1])).join('');
 const tramoOpts='<option value=""></option>'+TRAMOS.map(t=>opt(t,f.tramo)).join('');
 const sedeOpts=['cdmx','puebla','virreyes','corp'].map(c=>opt(c,PROPCODE[f.property_id],LOCNOM[c])).join('');
 const d=f.docs||{};
 const dl=(nm,u)=>u?`<a class="doc" href="${esc(u)}" target="_blank">${nm} ✓</a>`:`<span class="doc no">${nm} ✗</span>`;
 let h='';
 // IDENTIDAD (datos del trabajador)
 h+=`<div class="grp"><h4>Identidad y contacto</h4><div class="fields">
   ${fld('Nombre',inp('fx_nombre',f.nombre),true)}
   ${fld('Apellido',inp('fx_apellido',f.apellido),true)}
   ${fld('Teléfono',inp('fx_telefono',f.telefono))}
   ${fld('Correo',inp('fx_email',f.email),true)}
   ${fld('Fecha de nacimiento',inp('fx_fecha_nacimiento',f.fecha_nacimiento,'date'))}
   ${fld('Nacionalidad',inp('fx_nacionalidad',f.nacionalidad))}
   ${fld('Estado civil',inp('fx_estado_civil',f.estado_civil))}
   ${fld('Dirección',inp('fx_direccion',f.direccion))}
   ${fld('Contacto emergencia',inp('fx_contacto_nombre',f.contacto_nombre))}
   ${fld('Cel. emergencia',inp('fx_contacto_cel',f.contacto_cel))}
 </div></div>`;
 // DOCUMENTOS / IDENTIFICADORES
 h+=`<div class="grp"><h4>Documentos e identificadores (nómina / ficha 360)</h4><div class="fields">
   ${fld('RFC',inp('fx_rfc',f.rfc))}
   ${fld('CURP',inp('fx_curp',f.curp))}
   ${fld('NSS',inp('fx_nss',f.nss))}
   ${fld('AFORE',inp('fx_afore',f.afore))}
   ${fld('Banco',inp('fx_banco',f.banco))}
   ${fld('CLABE',inp('fx_clabe',f.clabe))}
   ${fld('Titular de la cuenta',inp('fx_titular_cuenta',f.titular_cuenta))}
 </div><div class="docrow" style="margin-top:8px">
   ${dl('INE/ID',d.id_oficial)}${dl('Domicilio',d.domicilio)}${dl('Acta',d.acta)}${dl('RFC',d.rfc)}${dl('NSS',d.nss)}${dl('Estudios',d.estudios)}${dl('CV',d.cv)}${dl('Cédula IMSS',d.imss_cedula)}
 </div><p class="hint">Los papeles los sube el propio trabajador desde SoyPepe; aquí los revisas y completas lo que falte.</p></div>`;
 // LABORAL (validación interna -> desempeño)
 const SE=!!f.edita_delic; // puede editar lo delicado (rol/categoría/sueldo)
 h+=`<div class="grp"><h4>Laboral (desempeño · incidencias · equipo)</h4><div class="fields">
   ${SE?fld('Rol','<select id="fx_rol">'+rolOpts+'</select>'):fld('Rol 🔒',inp('x',f.rol),true)}
   ${fld('Puesto',inp('fx_puesto',f.puesto))}
   ${SE?fld('Categoría','<select id="fx_categoria">'+catOpts+'</select>'):fld('Categoría 🔒',inp('x',f.categoria),true)}
   ${fld('Tramo','<select id="fx_tramo">'+tramoOpts+'</select>')}
   ${fld('Área',inp('fx_area',f.area))}
   ${fld('Área 2',inp('fx_area_2',f.area_2))}
   ${fld('Propiedad / sede','<select id="fx_sede">'+sedeOpts+'</select>')}
   ${fld('Horas semanales',inp('fx_horas_semanales',f.horas_semanales,'number'))}
   ${fld('Inicio de labores',inp('fx_fecha_inicio_labores',f.fecha_inicio_labores,'date'))}
   ${fld('Tipo de contrato','<select id="fx_tipo_contrato">'+opt('',f.tipo_contrato,'—')+opt('determinado',f.tipo_contrato)+opt('indeterminado',f.tipo_contrato)+opt('prueba',f.tipo_contrato)+'</select>')}
   ${fld('Categoría de contrato','<select id="fx_contrato_categoria">'+opt('',f.contrato_categoria,'—')+opt('operativo',f.contrato_categoria)+opt('confianza',f.contrato_categoria)+'</select>')}
   ${fld('Exento de checador','<select id="fx_exento_checador">'+opt('false',String(!!f.exento_checador))+opt('true',String(!!f.exento_checador),'true')+'</select>')}
 </div><p class="hint">El jefe directo${f.jefe?(': '+esc(f.jefe.nombre)):' (sin asignar — ponlo en el Organigrama)'} evalúa y aprueba su horario.</p></div>`;
 // NOMINA (solo si ve salarios)
 if(f.ve_salario && nom && nom.ve){
   const si=(lb,id,v,t)=>SE?fld(lb,inp(id,v,t)):fld(lb+' 🔒',inp('x',v,t),true);
   h+=`<div class="grp"><h4>Nómina y salario 🔒</h4>${SE?'':'<div class="lock">🔒 Solo lectura: no tienes el candado de “salarios”. Lo edita dirección/contabilidad.</div>'}<div class="fields">
     ${si('Salario bruto','fx_salario_bruto',nom.salario_bruto,'number')}
     ${si('Sueldo base','fx_sueldo_base',nom.sueldo_base,'number')}
     ${si('Salario diario','fx_salario_diario',nom.salario_diario,'number')}
     ${si('Neto fijo','fx_neto_fijo',nom.neto_fijo,'number')}
     ${si('Esquema de pago','fx_esquema_pago',nom.esquema_pago)}
     ${si('Salario desde','fx_salario_desde',nom.salario_desde,'date')}
     ${SE?fld('Bono puntualidad','<select id="fx_bono_puntualidad">'+opt('false',String(!!nom.bono_puntualidad))+opt('true',String(!!nom.bono_puntualidad),'true')+'</select>'):fld('Bono puntualidad 🔒',inp('x',nom.bono_puntualidad?'sí':'no'),true)}
     ${si('Monto bono puntualidad','fx_bono_puntualidad_monto',nom.bono_puntualidad_monto,'number')}
   </div></div>`;
   // BONOS / OBJETIVOS
   const bl=(nom.bonos||[]).map(b=>`<div class="bono"><span>${esc(b.nombre)} · ${esc(b.tipo)} · ${esc(b.periodicidad)}</span><b>$${esc(b.monto)}</b></div>`).join('')||'<div class="hint">Sin bonos asignados.</div>';
   h+=`<div class="grp"><h4>Bonos y objetivos</h4><div class="bonos">${bl}</div>
     ${SE?`<div class="fields">
       ${fld('Nuevo bono: nombre',inp('fb_nombre',''))}
       ${fld('Tipo',inp('fb_tipo','bono'))}
       ${fld('Monto',inp('fb_monto','','number'))}
       ${fld('Periodicidad','<select id="fb_periodicidad">'+opt('mensual','mensual')+opt('quincenal','')+opt('unico','','único')+'</select>')}
     </div>
     <div class="save-row"><button class="btn mini" id="fb_add">+ Agregar bono</button><span class="msg" id="fb_msg"></span></div>`:''}
     <p class="hint">Los objetivos del periodo de prueba (quizzes y checkpoints del jefe) se crean solos al lanzar el plan de incorporación.</p></div>`;
 } else if(f.ve_salario===false){
   h+='<div class="grp"><h4>Nómina</h4><div class="lock">🔒 No tienes visibilidad de sueldos en esta propiedad.</div></div>';
 }
 // IMSS
 h+=`<div class="grp"><h4>Alta IMSS</h4><div class="fields">
   ${fld('Fecha de alta IMSS',inp('fx_imss_alta_fecha',f.imss_alta_fecha,'date'))}
 </div><p class="hint">${f.imss_alta_fecha?('Dado de alta'+(f.imss_alta_por?(' por '+esc(f.imss_alta_por)):'')+'.'):'Pendiente. Mientras no tenga fecha, le aparece a Roberto/Claudia como tema pendiente.'}</p></div>`;
 // INCORPORACION / HORARIO
 const plan=f.plan;
 h+=`<div class="grp"><h4>Incorporación y horario</h4>`;
 if(plan){h+=`<p class="hint">Plan <b>${esc(plan.estado)}</b> · inicio ${esc(plan.inicio||'—')} · ${esc(plan.semanas)} semanas de rotación · ${esc(plan.hitos)} objetivos.</p>`;}
 else{h+=`<p class="hint">Aún no tiene plan de incorporación.</p>`;}
 h+=`<div class="acts">
    <button class="btn gold" id="fh_lanzar">${plan?'Re-generar plan':'Lanzar plan de incorporación'}</button>
    <button class="btn mini" id="fh_horario">Abrir horario ↗</button>
   </div><p class="hint">El plan arma la rotación de turnos y los objetivos según el rol; luego el jefe pone los días en Horario.</p></div>`;
 // GUARDAR
 h+=`<div class="save-row"><button class="btn go" id="fx_save">Guardar ficha</button><span class="msg" id="fx_msg"></span></div>`;
 return h;
}

function val(id){const el=$(id);return el?el.value:undefined;}
function wireFicha(box,id,f,nom){
 box.querySelector('#fx_save').onclick=async function(){
   const b=box.querySelector('#fx_save');b.disabled=true;const msg=box.querySelector('#fx_msg');msg.textContent='Guardando…';
   const patch={};
   ['nombre','apellido'].forEach(()=>{}); // read-only
   [['telefono','fx_telefono'],['fecha_nacimiento','fx_fecha_nacimiento'],['nacionalidad','fx_nacionalidad'],['estado_civil','fx_estado_civil'],['direccion','fx_direccion'],['contacto_nombre','fx_contacto_nombre'],['contacto_cel','fx_contacto_cel'],
    ['rfc','fx_rfc'],['curp','fx_curp'],['nss','fx_nss'],['afore','fx_afore'],['banco','fx_banco'],['clabe','fx_clabe'],['titular_cuenta','fx_titular_cuenta'],
    ['rol','fx_rol'],['puesto','fx_puesto'],['categoria','fx_categoria'],['tramo','fx_tramo'],['area','fx_area'],['area_2','fx_area_2'],
    ['horas_semanales','fx_horas_semanales'],['fecha_inicio_labores','fx_fecha_inicio_labores'],['tipo_contrato','fx_tipo_contrato'],['contrato_categoria','fx_contrato_categoria'],
    ['exento_checador','fx_exento_checador'],['imss_alta_fecha','fx_imss_alta_fecha']
   ].forEach(p=>{const v=val(p[1]);if(v!==undefined)patch[p[0]]=v;});
   const sede=val('fx_sede');if(sede){patch.sede=LOCNOM[sede];patch.property_id=CODEPROP[sede];}
   if(f.edita_delic&&nom&&nom.ve){
    [['salario_bruto','fx_salario_bruto'],['sueldo_base','fx_sueldo_base'],['salario_diario','fx_salario_diario'],['neto_fijo','fx_neto_fijo'],['esquema_pago','fx_esquema_pago'],['salario_desde','fx_salario_desde'],['bono_puntualidad','fx_bono_puntualidad'],['bono_puntualidad_monto','fx_bono_puntualidad_monto']].forEach(p=>{const v=val(p[1]);if(v!==undefined)patch[p[0]]=v;});
   }
   try{const r=await rpc('funnel_guardar',{p_id:id,p_patch:patch});if(r&&r.ok){msg.textContent='✓ Guardado';await load();}else{msg.textContent='⚠ '+((r&&r.error)||'no se pudo');b.disabled=false;}}
   catch(e){msg.textContent='⚠ '+(e.message||'error').slice(0,80);b.disabled=false;}
 };
 const add=box.querySelector('#fb_add');if(add)add.onclick=async function(){const m=box.querySelector('#fb_msg');const nombre=val('fb_nombre');const monto=val('fb_monto');if(!nombre||!monto){m.textContent='Pon nombre y monto';return;}add.disabled=true;m.textContent='…';try{const r=await rpc('funnel_add_bono',{p_id:id,p_nombre:nombre,p_tipo:val('fb_tipo')||'bono',p_monto:Number(monto),p_periodicidad:val('fb_periodicidad'),p_desde:null});if(r&&r.ok){m.textContent='✓ agregado';toggleFicha(id);toggleFicha(id);}else{m.textContent='⚠ '+((r&&r.error)||'');add.disabled=false;}}catch(e){m.textContent='⚠ '+(e.message||'').slice(0,60);add.disabled=false;}};
 const lan=box.querySelector('#fh_lanzar');if(lan)lan.onclick=async function(){if(!confirm('¿Lanzar el plan de incorporación? Arma la rotación de turnos y los objetivos del periodo de prueba según su rol.'))return;lan.disabled=true;const msg=box.querySelector('#fx_msg');try{const r=await rpc('funnel_lanzar_horario',{p_id:id,p_inicio:val('fx_fecha_inicio_labores')||null});if(r&&r.ok){alert('Plan listo: '+r.semanas+' semanas de rotación y '+r.hitos+' objetivos. Ahora ponle los días en Horario.');await load();}else{alert('No se pudo: '+((r&&r.error)||''));lan.disabled=false;}}catch(e){alert('No se pudo: '+e.message);lan.disabled=false;}};
 const hor=box.querySelector('#fh_horario');if(hor)hor.onclick=()=>openUrl('/m/rh-horario.html');
}

// sincroniza con el selector global del panel
try{var pg=(localStorage.getItem('cpp_proyecto')||'').toLowerCase();if(['cdmx','puebla','virreyes','corp'].includes(pg))$('fUbic').value=pg;}catch(e){}
['fUbic','fTxt','fAll'].forEach(id=>$(id).addEventListener('input',render));
$('fAll').addEventListener('change',load);
load();
</script></body></html>
