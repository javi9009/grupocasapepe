<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-suave:#FBDCEE;
  --cielo:#8DC8EA;   --cielo-suave:#E4F1FA;
  --tinta:#1E1A16;   --tinta-2:#3C3630;  --gris:#6E665C;  --tenue:#A9A096;
  --linea:#E2DCCF;   --ground:#F4F1EA;   --blanco:#FFFFFF; --hueso:#F4EFE8;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}

/* La barra lleva solo el título: el panel ya pone su menú lateral. */
.top{max-width:1120px;margin:0 auto;padding:22px 16px 6px;text-align:center}
.top h1{margin:0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:27px;letter-spacing:.02em;text-transform:uppercase}
.top .sub{color:var(--gris);font-size:13px;margin-top:5px}

.wrap{max-width:1120px;margin:0 auto;padding:18px 16px 90px}

/* El menú al centro, en cuadros. Se acomoda solo: 4, 3, 2 o 1 por fila. */
.rejilla{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(214px,1fr));
  gap:14px;
  justify-content:center;
}
@media(min-width:1000px){.rejilla{grid-template-columns:repeat(4,1fr)}}

.cuadro{
  background:var(--blanco); border:1px solid var(--linea); border-radius:14px;
  box-shadow:var(--sombra); padding:18px 18px 15px;
  display:flex; flex-direction:column; min-height:172px;
  cursor:pointer; position:relative; text-align:left;
  font:inherit; color:inherit; width:100%;
  transition:border-color .12s, transform .12s, box-shadow .12s;
}
.cuadro:hover{border-color:var(--naranja); transform:translateY(-2px)}
.cuadro:focus-visible{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.cuadro .ico{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:Oswald,sans-serif;font-weight:700;font-size:16px;margin-bottom:11px;
  background:var(--naranja-suave); color:var(--naranja-oscuro);
}
.cuadro.c-magenta .ico{background:var(--magenta-suave);color:#B3106F}
.cuadro.c-cielo   .ico{background:var(--cielo-suave);color:#1F5B7A}
.cuadro.c-verde   .ico{background:var(--ok-bg);color:var(--ok)}
.cuadro h2{margin:0;font-family:Oswald,sans-serif;font-weight:600;font-size:15.5px;text-transform:uppercase;letter-spacing:.045em}
.cuadro .dime{color:var(--gris);font-size:12.5px;line-height:1.45;margin-top:5px;flex:1}
.cuadro .cifra{font-family:Oswald,sans-serif;font-weight:700;font-size:22px;line-height:1;margin-top:10px}
.cuadro .cifra small{font-family:Inter,sans-serif;font-weight:500;font-size:11.5px;color:var(--gris);display:block;margin-top:4px;letter-spacing:0}
.cuadro .ampliar{
  margin-top:12px;font-family:Oswald,sans-serif;font-weight:600;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.07em;color:var(--naranja-oscuro);
  display:flex;align-items:center;gap:5px;
}
.cuadro .ampliar i{font-style:normal;transition:transform .15s;display:inline-block}
.cuadro[aria-expanded="true"]{grid-column:1/-1;min-height:0;border-color:var(--naranja);cursor:default}
.cuadro[aria-expanded="true"]:hover{transform:none}
.cuadro[aria-expanded="true"] .ampliar i{transform:rotate(180deg)}
.cuadro[aria-expanded="true"] .dime{flex:0}
.cuadro[aria-expanded="true"] .cifra{display:none}

.detalle{display:none;margin-top:16px;border-top:1px solid var(--linea);padding-top:15px}
.cuadro[aria-expanded="true"] .detalle{display:block}

/* Cada cosa que hay dentro del cuadro */
.fila{
  display:flex;gap:13px;align-items:flex-start;
  padding:11px 12px;border-radius:10px;border:1px solid transparent;
  text-decoration:none;color:inherit;
}
a.fila:hover{background:var(--hueso);border-color:var(--linea)}
.fila .n{flex:1;min-width:0}
.fila .n b{font-weight:600;font-size:13.5px;display:block}
.fila .n span{color:var(--gris);font-size:12.5px;line-height:1.45;display:block;margin-top:2px}
.etq{
  font-family:Oswald,sans-serif;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;
  border-radius:999px;padding:3px 10px;white-space:nowrap;align-self:center;
  background:var(--ok-bg);color:var(--ok);
}
.etq.falta{background:var(--alerta-bg);color:var(--alerta)}
.etq.nada{background:#EDE8DE;color:var(--gris)}

.nota{
  background:var(--cielo-suave);border:1px solid #C9E2F2;border-radius:10px;
  padding:12px 14px;font-size:12.8px;line-height:1.55;color:var(--tinta-2);margin-top:12px;
}
.nota b{font-weight:600}
.sub-t{font-family:Oswald,sans-serif;font-weight:600;font-size:11.5px;text-transform:uppercase;
  letter-spacing:.08em;color:var(--gris);margin:16px 0 4px}
.sub-t:first-child{margin-top:0}
ul.simple{margin:6px 0 0;padding-left:19px;font-size:13px;line-height:1.6;color:var(--tinta-2)}
ul.simple li{margin-bottom:2px}
ul.simple code{background:var(--hueso);border-radius:4px;padding:1px 5px;font-size:12px}
.cerrar{
  position:absolute;top:13px;right:14px;border:1px solid var(--linea);background:var(--blanco);
  border-radius:8px;width:28px;height:28px;cursor:pointer;color:var(--gris);font-size:16px;line-height:1;
  display:none;
}
.cuadro[aria-expanded="true"] .cerrar{display:block}
.cerrar:hover{border-color:var(--naranja);color:var(--naranja-oscuro)}
</style>
</head><body>

    }
  ];

  /* La propuesta de estadísticas. Se lee, no se calcula todavía: primero
     acordamos qué miramos, luego lo construimos. */
  var STATS=[
    ['Venta de tours','Reservas, pax, ingreso bruto y ticket medio, con filtro por cualquier campo y por fecha. Y cuántas salidas salieron de verdad contra las que se cayeron.'],
    ['Venta de productos Cósmica','Qué se suma a los tours: paquetes, montajes, talleres, alimentos y bebidas.'],
    ['Venta de coworking a guías','Lo que el Ateneo factura a los guías independientes que lo usan.'],
    ['Éxito en captación de touroperadores','Cuántos prospectos pasan de una etapa a la siguiente, y en cuánto tiempo.'],
    ['Ventas de concierge','Ventas atribuidas por persona y por casa, con su ratio de conversión y su bono.'],
    ['Por producto','Ranking por ingreso, por pax y por margen. Y la lista que duele: los que no vendieron nada.'],
    ['Por canal','Recepción, web directa, touroperador, hotel. Con la comisión que pagó cada canal.'],
    ['Curva de reserva','Con cuántos días de antelación reserva la gente. Es lo que dice si hay que empujar una salida.'],
    ['Capacidad','Cupo ofertado contra cupo vendido, por tour y por día de la semana.'],
    ['Impacto','Derrama a la comunidad, por objetivo de la ONU y por prestador. Esto ya se calcula.']
  ];

  function filaHTML(x){
    var etq = x.falta
      ? '<span class="etq falta">'+esc(x.falta)+'</span>'
      : (x.href?'<span class="etq">abrir</span>':'<span class="etq nada">—</span>');
    var cuerpo='<div class="n"><b>'+x.n+'</b><span>'+x.d+'</span></div>'+etq;
    if(!x.href)return '<div class="fila">'+cuerpo+'</div>';
    var extra = x.externo ? ' target="_blank" rel="noopener"' : (x.top?' target="_top"':'');
    return '<a class="fila" href="'+esc(x.href)+'"'+extra+'>'+cuerpo+'</a>';
  }

  function detalleHTML(m){
    if(m.propuesta){
      return '<div class="detalle">'+
        '<div class="sub-t">Lo que propongo mirar</div>'+
        '<div>'+STATS.map(function(s){
          return '<div class="fila"><div class="n"><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>'+
                 '<span class="etq falta">por construir</span></div>';
        }).join('')+'</div>'+
        '<div class="nota">Los diez se pueden calcular con la base que ya hay: la reserva guarda canal, vendedor, país, idioma, comisión, neto del operador y lo de Stripe. Lo que falta no es estructura, <b>son reservas</b> — hoy hay cero, así que todo saldría en blanco. En cuanto Stripe cobre la primera, estos cuadros empiezan a tener números. Las cinco primeras son las que pediste; las otras cinco salen de la misma consulta.</div>'+
      '</div>';
    }
    var cuerpo='';
    if(m.grupos){
      cuerpo=m.grupos.map(function(g){
        return '<div class="sub-t">'+esc(g.t)+'</div>'+g.items.map(filaHTML).join('');
      }).join('');
    }else{
      cuerpo=(m.dentro||[]).map(filaHTML).join('');
    }
    return '<div class="detalle">'+cuerpo+
      (m.nota?'<div class="nota">'+m.nota+'</div>':'')+
    '</div>';
  }

  function pinta(){
    document.getElementById('rejilla').innerHTML=MENU.map(function(m){
      /* div y no button: dentro van enlaces, y un <a> dentro de un <button> es
         HTML inválido — el navegador deshace la anidación y los enlaces dejan
         de funcionar. Con role y tabindex se comporta igual para el teclado. */
      return '<div class="cuadro '+(m.color||'')+'" data-id="'+m.id+'" role="button" tabindex="0" aria-expanded="false">'+
        '<button type="button" class="cerrar" data-cerrar="1" aria-label="Cerrar">&times;</button>'+
        '<span class="ico">'+m.ico+'</span>'+
        '<h2>'+m.titulo+'</h2>'+
        '<div class="dime">'+m.dime+'</div>'+
        '<div class="cifra" id="c-'+m.id+'">&nbsp;<small>'+esc(m.pie||'')+'</small></div>'+
        '<div class="ampliar">Ampliar <i>▾</i></div>'+
        detalleHTML(m)+
      '</div>';
    }).join('');

    Array.prototype.forEach.call(document.querySelectorAll('.cuadro'),function(b){
      function alterna(ev){
        /* Si se tocó un enlace, que navegue y punto: ni abre ni cierra. */
        if(ev.target.closest('a'))return;
        var abierto=b.getAttribute('aria-expanded')==='true';
        // dentro del detalle se navega, no se cierra el cuadro
        if(abierto && !ev.target.closest('[data-cerrar]'))return;
        Array.prototype.forEach.call(document.querySelectorAll('.cuadro'),function(o){
          o.setAttribute('aria-expanded','false');
        });
        if(!abierto){
          b.setAttribute('aria-expanded','true');
          b.scrollIntoView({behavior:'smooth',block:'nearest'});
        }
      }
      b.addEventListener('click',alterna);
      b.addEventListener('keydown',function(ev){
        if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();alterna(ev);}
      });
    });
  }

  async function cifras(){
    for(var i=0;i<MENU.length;i++){
      (function(m){
        if(!m.cifra)return;
        m.cifra().then(function(n){
          var e=document.getElementById('c-'+m.id);
          if(!e)return;
          if(n===null||n===undefined){e.innerHTML='<small>'+esc(m.pie||'')+'</small>';return;}
          var txt=Number(n).toLocaleString('es-MX');
          var pie=esc(m.pie||'');
          if(m.segundo){
            m.segundo().then(function(t){
              e.innerHTML=txt+'<small>'+pie+(t!=null?' · '+Number(t).toLocaleString('es-MX')+' '+esc(m.pie2||''):'')+'</small>';
            });
          }else{
            e.innerHTML=txt+'<small>'+pie+'</small>';
          }
        });
      })(MENU[i]);
    }
  }

  pinta();
  cifras();
})();
</script>
</body></html>
