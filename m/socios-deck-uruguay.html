(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO', DOC='/m/socios-deck-uruguay.html';
  function tok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!k||!/^sb-.*-auth-token$/.test(k)) continue; var raw=localStorage.getItem(k)||''; if(raw.indexOf('base64-')===0){ raw=atob(raw.slice(7)); } var v=JSON.parse(raw); var s=v.currentSession||v; if(s&&s.access_token) return s.access_token; } }catch(e){} return ''; }

  fetch(SB+'/functions/v1/doc-privado?f='+encodeURIComponent(DOC),{headers:{apikey:KEY,Authorization:'Bearer '+t}})

})();
