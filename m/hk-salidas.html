<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Salidas de hoy · Housekeeping</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;
  --accent:#137A56;--soft:#DCEFE6;--warn:#8C6212;--warn-bg:#F3EAD6;--ok:#1D6B4A;--ok-bg:#E1F0E7;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5;padding:16px 14px 40px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;margin:0}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.top{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.top .g{flex:1;min-width:0}
.btn{border:0;border-radius:10px;background:var(--accent);color:#fff;font:inherit;font-weight:700;padding:10px 15px;cursor:pointer}
.btn:active{filter:brightness(.94)} .btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--rule);font-weight:600}
.btn.sm{padding:8px 13px;font-size:13.5px}
/* La tarjeta es grande a propósito: se toca con guantes y con el carrito al lado. */
.row{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:13px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.row .nm{font-weight:700;font-size:16px}
.row .me{color:var(--muted);font-size:13px;margin-top:2px}
.row .ac{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.ya{border-color:var(--accent);background:#F7FBF9}
.pill{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.esp{background:var(--warn-bg);color:var(--warn)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.gris{background:#E9E4DA;color:#66707A}
.msg{font-size:13px;margin-top:8px}
.msg.ok{color:var(--ok)} .msg.bad{color:#9E3B2E}
.empty{background:#FBF8F1;border:1px dashed #D2C8B6;border-radius:14px;padding:28px 16px;color:var(--muted);text-align:center}
.nota{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:11px 13px;font-size:13px;margin-bottom:14px;line-height:1.45}
select,input[type=text]{font:inherit;padding:9px 11px;border:1px solid var(--rule);border-radius:10px;background:var(--surface);color:var(--ink)}
</style>
</head>
<body><div class="wrap">
  <div class="top">
    <div class="g">
      <h1>🧹 Salidas de hoy</h1>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <select id="prop"><option value="cdmx">CDMX</option><option value="puebla">Puebla</option></select>
    <button class="btn ghost sm" id="bRef">↻</button>
  </div>

  <div class="nota">Si entras a limpiar y el huésped <b>dejó sus cosas</b>, toca su botón.
    Recepción decide qué le ofrece y te avisa. Tú no le digas precios.</div>

  <div id="lista"><div class="empty">Cargando…</div></div>
</div>

<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){ return document.getElementById(i); };
  var DATOS=null;
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function tok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i);
    if(k&&/sb-.*-auth-token/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null'); var s=v&&(v.currentSession||v);
      if(s&&s.access_token) return s.access_token; } } }catch(e){} return ''; }

  function fn(body){
    return fetch(SB+'/functions/v1/apepe-salida-tarde',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+(tok()||KEY),'Content-Type':'application/json'},
      body:JSON.stringify(body)}).then(function(r){ return r.json(); });
  }

  var EST={marcada:['esp','Avisado · espera recepción'],ofrecida:['esp','Recepción ya le ofreció'],
           elegida:['ok','Ya eligió'],cobrada:['ok','Pagado'],cerrada:['gris','Cerrado']};

  function pinta(){
    var L=$('lista');
    if(!DATOS||!DATOS.ok){ L.innerHTML='<div class="empty">No se pudo cargar. Entra con tu cuenta y vuelve a intentar.</div>'; return; }
    var s=DATOS.salidas||[];
    $('sub').textContent=s.length+' salida'+(s.length===1?'':'s')+' · son las '+DATOS.hora;
    if(!s.length){ L.innerHTML='<div class="empty">Hoy no sale nadie.</div>'; return; }
    L.innerHTML=s.map(function(x,i){
      var m=x.marca, e=m?(EST[m.estado]||['gris',m.estado]):null;
      /* Quien ya hizo checkout no tiene cosas que dejar: se enseña apagado para que
         no se toque por error. */
      var fuera=/checked_out/i.test(x.estado_cb);
      return '<div class="row'+(m?' ya':'')+'">'+
        '<div class="nm">'+esc(x.nombre||('Reserva '+x.reservation_id))+'</div>'+
        '<div class="me">'+esc(x.reservation_id)+(fuera?' · ya hizo checkout':'')+'</div>'+
        '<div class="ac">'+
          (m ? '<span class="pill '+e[0]+'">'+esc(e[1])+'</span>'
             : (fuera ? '<span class="pill gris">Se fue</span>'
                      : '<button class="btn sm" data-m="'+i+'">Dejó sus cosas</button>'))+
        '</div>'+
        '<div class="msg" id="ms'+i+'"></div></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('[data-m]'),function(b){
      b.onclick=function(){ marcar(s[+b.getAttribute('data-m')], b, +b.getAttribute('data-m')); };
    });
  }

  function marcar(x, btn, i){
    var m=$('ms'+i);
    if(!tok()){ m.className='msg bad'; m.textContent='Entra con tu cuenta para avisar.'; return; }
    if(!confirm('¿Las cosas de '+(x.nombre||'este huésped')+' siguen en el cuarto?\n\nSe le avisa a recepción.')) return;
    btn.disabled=true; btn.textContent='Avisando…';
    fn({op:'marcar', reservation_id:x.reservation_id, prop:$('prop').value,
        nombre:x.nombre, huesped:x.nombre}).then(function(r){
      if(r&&r.ok){ m.className='msg ok'; m.textContent=r.mensaje||'Avisado.'; setTimeout(cargar,900); }
      else { btn.disabled=false; btn.textContent='Dejó sus cosas';
        m.className='msg bad'; m.textContent=(r&&r.error)||'No se pudo avisar.'; }
    }).catch(function(){ btn.disabled=false; btn.textContent='Dejó sus cosas';
      m.className='msg bad'; m.textContent='Sin conexión. Inténtalo otra vez.'; });
  }

  function cargar(){
    $('sub').textContent='Cargando…';
    fn({op:'dia', prop:$('prop').value}).then(function(r){ DATOS=r; pinta(); })
      .catch(function(){ DATOS=null; pinta(); });
  }
  $('bRef').onclick=cargar;
  $('prop').onchange=cargar;
  cargar();
})();
</script>
</body></html>
