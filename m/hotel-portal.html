<title>Portal del hotelero</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1280px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sel{margin-left:auto}
.top select{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.secnav button svg{width:15px;height:15px}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nivel{max-width:1280px;margin:0 auto;padding:12px 16px 0;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nv{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.nv.on{border-color:var(--ink);background:var(--ink);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.panel{display:none}.panel.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.fld .ay{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mini{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .et{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .vl{font-size:26px;font-weight:800;margin-top:4px;line-height:1.05}
.kpi .nt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}

.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hc{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.hc:hover{border-color:var(--ink)}
.hc .hn{font-weight:700;font-size:14px}
.hc .hm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hc.nuevo{border-style:dashed;display:grid;place-items:center;min-height:96px;color:var(--accent);font-weight:700}
/* buffet */
.bufbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vistas{margin-left:auto;display:flex;gap:4px;border:1px solid var(--rule);border-radius:9px;padding:3px;background:var(--surface)}
.vistas button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.vistas button.on{background:var(--ink);color:#fff}
.buf{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media(max-width:980px){.buf{grid-template-columns:minmax(0,1fr)}}
.bg{display:grid;gap:10px}
.bg.foto{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.bg.lista{grid-template-columns:1fr}
.it{position:relative;background:var(--surface);border:1.5px solid var(--rule);border-radius:11px;overflow:hidden;cursor:pointer;display:block;text-align:left}
.it:hover{border-color:var(--ink)}
.it.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bg.foto .im{display:block;width:100%;height:96px;background:var(--surface-2) center/cover no-repeat}
.bg.foto .tx{display:block;padding:9px 11px 11px}
.bg.lista .it{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:8px 12px 8px 8px}
.bg.lista .im{display:block;width:52px;height:40px;border-radius:7px;background:var(--surface-2) center/cover no-repeat}
.bg.lista .tx{display:block}
.it .nm{display:block;font-weight:700;font-size:12.8px;line-height:1.25}
.it .de{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.it .tp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.it .tick{position:absolute;top:7px;right:7px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.bg.lista .it .tick{position:static}
.it.on .tick{display:grid}
.it .tick svg{width:13px;height:13px}
.panelsel{position:sticky;top:58px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.panelsel h4{margin:0 0 3px;font-size:13.5px}
.selist{list-style:none;margin:10px 0 0;padding:0;max-height:52vh;overflow:auto}
.selist li{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:12.5px}
.selist li:first-child{border-top:0}
.selist li b{flex:1;font-weight:600}
.selist li button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.vacio{padding:26px 10px;text-align:center;color:var(--faint);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pronto{border:1px dashed var(--rule);border-radius:11px;padding:16px 18px;background:var(--surface-3);color:var(--muted);font-size:12.5px;line-height:1.5}
/* Un <svg> sin width/height se estira al tamaño del contenedor: las
   palomitas de los pasos salían gigantes. Tamaño base y punto. */
.wrap svg{width:15px;height:15px;display:block;flex:none}
.it .tick svg{width:13px;height:13px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;display:none;z-index:40}
.toast.err{background:var(--bad)}
</style><link rel="icon" type="image/png" href="/dash-192.png">

    CAT.evento=v.map(function(x){return {id:x.id,n:x.nombre,d:x.precio?('$'+x.precio):'',f:''};});
    var m=await get('mapa_puntos?select=id,nombre,ciudad&activo=is.true&limit=400&order=nombre')||[];
    CAT.mapa=m.map(function(x){return {id:x.id,n:x.nombre,d:x.ciudad||'',f:''};});
    CAT.tienda=[];
  }

  async function cargaSel(){
    SEL={}; var d=destino(); if(!d) return;
    var r=await get('hotel_intangibles?select=tipo,ref_id&activo=is.true&hotel_id=eq.'+d.id)||[];
    r.forEach(function(x){ SEL[x.tipo+':'+x.ref_id]=true; });
  }

  /* ---------- niveles y pestañas ---------- */
  function pintaNivel(){
    var h='<button class="nv'+(nivel==='grupo'?' on':'')+'" data-n="grupo">'+esc(G.nombre_comercial||'El grupo')+'</button>';
    HOT.forEach(function(x){ h+='<button class="nv'+(nivel==='hotel'&&Hsel&&Hsel.id===x.id?' on':'')+'" data-h="'+x.id+'">'+esc(x.nombre_comercial)+'</button>'; });
    if(!HOT.length) h+='<span class="mini">Todavía sin propiedades debajo. Se crean en «Mis hoteles».</span>';
    $('nivel').innerHTML=h;
    $('nivel').querySelectorAll('.nv').forEach(function(b){b.onclick=async function(){
      if(b.getAttribute('data-n')==='grupo'){ nivel='grupo'; Hsel=null; }
      else { nivel='hotel'; Hsel=HOT.filter(function(x){return x.id===b.getAttribute('data-h');})[0]; }
      await cargaSel(); pintaNivel(); pintaNav(); ve(SECS[nivel][0].k);
    };});
  }
  function pintaNav(){
    $('nav').innerHTML=SECS[nivel].map(function(s){return '<button role="tab" data-k="'+s.k+'">'+ic(s.g)+esc(s.t)+'</button>';}).join('');
    $('nav').querySelectorAll('button').forEach(function(b){b.onclick=function(){ve(b.getAttribute('data-k'));};});
  }
  function ve(k){
    sec=k;
    Array.prototype.forEach.call($('nav').children,function(b){b.setAttribute('aria-selected',b.getAttribute('data-k')===k?'true':'false');});
    pinta();
  }

  /* ---------- las secciones ---------- */
  function pinta(){
    var d=destino(), w=$('wrap');
    if(sec==='cuenta')    return w.innerHTML=vCuenta();
    if(sec==='impacto')   return w.innerHTML=vImpacto();
    if(sec==='hoteles')   return vHoteles(w);
    if(sec==='intang')    return vBuffet(w,['experiencia','evento','tienda'],'Mis intangibles',
      'Todo lo que un huésped te puede comprar además de la cama. Lo que marques aquí queda disponible en '+(nivel==='grupo'?'todas tus casas; después cada una quita lo que no le cuadre.':'esta casa.'));
    if(sec==='mapa')      return vBuffet(w,['mapa'],'Mi mapa',
      'Los lugares que recomiendas. No se venden: por eso van aparte de los intangibles. '+(nivel==='grupo'?'Pon aquí los del grupo; luego cada hotel deja solo los suyos — el Oxxo de la Roma no le sirve a quien duerme en el Centro.':'Quita los que no le sirvan a un huésped de esta casa.'));
    if(sec==='general')   return w.innerHTML=vGeneral();
    if(sec==='anfitrion') return w.innerHTML=vAnfitrion();
    w.innerHTML=vPronto();
    if(sec==='general'||sec==='anfitrion') ataGuarda();
  }

  function vCuenta(){
    var p=[['Quién eres',!!G.nombre_comercial],['Contacto',!!(G.contacto||G.email)],
      ['Tu equipo',!!G.equipo_alcance],['Lo formal',!!(G.rfc&&G.licencia_tipo)],
      ['Cómo te pagamos',!!(G.clabe||G.stripe_account_id)],['Firmamos',!!G.contrato_firmado_at]];
    var hechos=p.filter(function(x){return x[1];}).length;
    return '<div class="card"><h3>Mi cuenta</h3>'
      +'<div class="hint">Los seis pasos hasta el acuerdo. Van '+hechos+' de 6.</div>'
      + p.map(function(x,i){return '<div style="display:flex;gap:11px;align-items:center;padding:10px 0;border-top:'+(i?'1px solid var(--rule)':'0')+'">'
          +'<span style="width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:'+(x[1]?'var(--ok-bg)':'var(--surface-2)')+';color:'+(x[1]?'var(--ok)':'var(--faint)')+'">'+(x[1]?ic('ok'):(i+1))+'</span>'
          +'<b style="flex:1;font-size:13.5px">'+x[0]+'</b>'
          +'<span class="mini">'+(x[1]?'Listo':'Pendiente')+'</span></div>';}).join('')
      +'<div class="ft"><a class="btn ghost sm" href="/m/hoteles.html" style="text-decoration:none">Abrir la ficha completa</a></div></div>';
  }

  function vImpacto(){
    var k=[['Propiedades',HOT.length||1,'En este grupo'],
      ['Intangibles puestos',Object.keys(SEL).filter(function(x){return x.indexOf('mapa:')!==0;}).length,'Disponibles para el huésped'],
      ['Puntos en el mapa',Object.keys(SEL).filter(function(x){return x.indexOf('mapa:')===0;}).length,'Lugares recomendados'],
      ['Cuartos',HOT.reduce(function(a,h){return a+(h.cuartos||0);},0)||(G.cuartos||0),'Suma del grupo']];
    return '<div class="kpis">'+k.map(function(x){return '<div class="kpi"><div class="et">'+x[0]+'</div><div class="vl">'+x[1]+'</div><div class="nt">'+x[2]+'</div></div>';}).join('')+'</div>'
      +'<div class="card"><h3>Lo que todavía no mide</h3><div class="pronto">Ventas, ocupación y el ingreso por huésped entran aquí en cuanto estén conectados el PMS y la pasarela. Hoy solo se cuenta lo que ya tienes puesto.</div></div>';
  }

  function vHoteles(w){
    w.innerHTML='<div class="card"><h3>Mis hoteles</h3>'
      +'<div class="hint">Se crean de uno en uno, igual que una experiencia. Cada uno lleva su propio Cloudbeds y su propia gente; los intangibles y el mapa los hereda del grupo.</div>'
      +'<div class="hgrid" id="hg"></div></div>';
    var h=HOT.map(function(x){return '<button class="hc" data-h="'+x.id+'"><div class="hn">'+esc(x.nombre_comercial)+'</div>'
      +'<div class="hm">'+esc(x.ciudad||'sin ciudad')+(x.cuartos?' · '+x.cuartos+' cuartos':'')+'<br>'+esc(x.pms||'sin PMS')+' · '+esc(x.estado||'')+'</div></button>';}).join('');
    h+='<button class="hc nuevo" id="nuevoH">+ Nuevo hotel</button>';
    $('hg').innerHTML=h;
    $('hg').querySelectorAll('.hc[data-h]').forEach(function(b){b.onclick=async function(){
      nivel='hotel'; Hsel=HOT.filter(function(x){return x.id===b.getAttribute('data-h');})[0];
      await cargaSel(); pintaNivel(); pintaNav(); ve('general');
    };});
    $('nuevoH').onclick=async function(){
      var n=prompt('Nombre del hotel'); if(!n) return;
      var slug=n.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,36);
      var r=await fetch(SB+'/rest/v1/hoteles',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
        body:JSON.stringify({nombre_comercial:n,slug:slug+'-'+Math.random().toString(36).slice(2,6),estado:'borrador',grupo_id:G.grupo_id||null,ciudad:G.ciudad||null})});
      if(!r.ok){toast('No se pudo crear: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json(); GRUPOS.push(j[0]); HOT.push(j[0]); toast('Hotel creado'); pintaNivel(); pinta();
    };
  }

  /* ---------- el buffet: foto o listado, lo escogido a la derecha ---------- */
  function vBuffet(w,tipos,titulo,ayuda){
    var esMapa = tipos.length===1 && tipos[0]==='mapa';
    var cs = esMapa ? [] : TIPOS.filter(function(t){return tipos.indexOf(t.k)>=0;});
    w.innerHTML='<div class="card"><h3>'+esc(titulo)+'</h3><div class="hint">'+ayuda+'</div>'
      +'<div class="bufbar">'
      + (cs.length ? '<button class="chip'+(filtro==='todos'?' on':'')+'" data-f="todos">Todo</button>'
          + cs.map(function(t){return '<button class="chip'+(filtro===t.k?' on':'')+'" data-f="'+t.k+'">'+esc(t.t)+'</button>';}).join('') : '')
      +'<input id="bq" placeholder="Buscar…" style="font:inherit;padding:7px 11px;border:1px solid var(--rule);border-radius:8px;min-width:170px">'
      +'<span class="vistas"><button data-v="foto" class="'+(vista==='foto'?'on':'')+'">Fotos</button><button data-v="lista" class="'+(vista==='lista'?'on':'')+'">Listado</button></span>'
      +'</div>'
      +'<div class="buf"><div class="bg '+vista+'" id="bg"></div><div><div class="panelsel" id="ps"></div></div></div></div>';
    w.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){filtro=c.getAttribute('data-f');vBuffet(w,tipos,titulo,ayuda);};});
    w.querySelectorAll('.vistas button').forEach(function(b){b.onclick=function(){vista=b.getAttribute('data-v');vBuffet(w,tipos,titulo,ayuda);};});
    $('bq').oninput=function(){rejilla(tipos);};
    rejilla(tipos); panelSel(tipos);
  }

  function items(tipos){
    var q=($('bq')&&$('bq').value||'').toLowerCase().trim();
    var out=[];
    tipos.forEach(function(t){
      if(filtro!=='todos' && tipos.length>1 && filtro!==t) return;
      (CAT[t]||[]).forEach(function(x){ if(!q||x.n.toLowerCase().indexOf(q)>=0) out.push({t:t,x:x}); });
    });
    return out;
  }

  function rejilla(tipos){
    var L=items(tipos), g=$('bg'); if(!g) return;
    if(!L.length){ g.innerHTML='<div class="vacio">Nada que mostrar todavía.</div>'; return; }
    g.innerHTML=L.map(function(o){
      var on=!!SEL[o.t+':'+o.x.id];
      var im='<span class="im"'+(o.x.f?' style="background-image:url('+JSON.stringify(o.x.f)+')"':'')+'></span>';
      return '<button class="it'+(on?' on':'')+'" data-t="'+o.t+'" data-i="'+o.x.id+'">'+im
        +'<span class="tx"><span class="nm">'+esc(o.x.n)+'</span>'
        + (o.x.d?'<span class="de">'+esc(o.x.d)+'</span>':'')
        + (tipos.length>1?'<span class="tp">'+esc(o.t)+'</span>':'')+'</span>'
        +'<span class="tick">'+ic('ok')+'</span></button>';
    }).join('');
    g.querySelectorAll('.it').forEach(function(b){b.onclick=function(){
      var k=b.getAttribute('data-t')+':'+b.getAttribute('data-i');
      if(SEL[k]) delete SEL[k]; else SEL[k]=true;
      b.classList.toggle('on'); panelSel(tipos); guardaSel(b.getAttribute('data-t'),b.getAttribute('data-i'),!!SEL[k]);
    };});
  }

  function panelSel(tipos){
    var p=$('ps'); if(!p) return;
    var L=[]; tipos.forEach(function(t){ (CAT[t]||[]).forEach(function(x){ if(SEL[t+':'+x.id]) L.push({t:t,x:x}); }); });
    var d=destino();
    p.innerHTML='<h4>Lo que tienes puesto</h4><div class="mini">'+L.length+' en '+esc(d?(d.nombre_comercial||''):'')+'</div>'
      + (L.length
          ? '<ul class="selist">'+L.map(function(o){return '<li><b>'+esc(o.x.n)+'</b><button data-t="'+o.t+'" data-i="'+o.x.id+'" title="Quitar">&times;</button></li>';}).join('')+'</ul>'
          : '<div class="vacio">Marca lo que quieras ofrecer y aparecerá aquí.</div>')
      + (nivel==='hotel' ? '<div class="mini" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)">Esta es la selección de <b>'+esc(d.nombre_comercial)+'</b>. Lo que quites aquí no toca a las demás casas.</div>' : '');
    p.querySelectorAll('button[data-i]').forEach(function(b){b.onclick=function(){
      var t=b.getAttribute('data-t'), i=b.getAttribute('data-i');
      delete SEL[t+':'+i]; guardaSel(t,i,false); rejilla(tipos); panelSel(tipos);
    };});
  }

  async function guardaSel(tipo,ref,on){
    var d=destino(); if(!d) return;
    if(on){
      var h=hdr(); h['Prefer']='resolution=merge-duplicates';
      await fetch(SB+'/rest/v1/hotel_intangibles',{method:'POST',headers:h,
        body:JSON.stringify([{hotel_id:d.id,tipo:tipo,ref_id:ref,activo:true}])});
    } else {
      await fetch(SB+'/rest/v1/hotel_intangibles?hotel_id=eq.'+d.id+'&tipo=eq.'+tipo+'&ref_id=eq.'+ref,
        {method:'PATCH',headers:hdr(),body:JSON.stringify({activo:false})});
    }
  }

  /* ---------- la casa por dentro ---------- */
  function vGeneral(){
    var d=destino();
    return '<div class="card"><h3>La casa</h3>'
      +'<div class="hint">Lo que el huésped necesita saber antes de llegar y lo que busca cuando ya está dentro.</div>'
      +'<div class="fgrid">'
      +f('Nombre','nombre_comercial',d)+f('Ciudad','ciudad',d)+f('Cuartos','cuartos',d,'number')
      +f('Dirección','direccion',d)+f('Check-in','checkin_hora',d,'time')+f('Check-out','checkout_hora',d,'time')
      +'</div></div>'
      +'<div class="card"><h3>Guardar maletas</h3>'
      +'<div class="hint">Antes del check-in y después del check-out. Es la primera pregunta que hace todo el mundo.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>¿Guardan maletas?</label><select data-c="storage_activo"><option value="false">No</option><option value="true">Sí</option></select></div>'
      +'<div class="fld" style="grid-column:2/-1"><label>Cómo funciona</label><input data-c="storage_texto" value="'+esc(d.storage_texto||'')+'" placeholder="Dónde, hasta qué hora, si cuesta"></div>'
      +'</div></div>'
      +'<div class="card"><h3>Cómo se llega</h3>'
      +'<div class="fgrid"><div class="fld" style="grid-column:1/-1"><label>Instrucciones de llegada</label><input data-c="llegada_texto" value="'+esc(d.llegada_texto||'')+'" placeholder="Del aeropuerto, del metro, dónde está la puerta"></div></div>'
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>';
  }
  function f(lab,c,d,tipo){
    var v=d[c]; if((c==='checkin_hora'||c==='checkout_hora')&&v) v=String(v).slice(0,5);
    return '<div class="fld"><label>'+lab+'</label><input data-c="'+c+'" type="'+(tipo||'text')+'" value="'+esc(v==null?'':v)+'"></div>';
  }

  function vAnfitrion(){
    var d=destino();
    return '<div class="card"><h3>Mi anfitrión</h3>'
      +'<div class="hint">El que le contesta al huésped en el chat. No es un robot de preguntas frecuentes: tiene una cabeza, y esa cabeza se la das tú. Dile de qué lee y con qué tono habla, y responderá como alguien de esta casa.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>¿Está encendido?</label><select data-c="anfitrion_activo"><option value="false">Todavía no</option><option value="true">Sí</option></select></div>'
      +'<div class="fld"><label>Cómo se llama</label><input data-c="anfitrion_nombre" value="'+esc(d.anfitrion_nombre||'')+'" placeholder="El nombre con el que se presenta"></div>'
      +'<div class="fld" style="grid-column:1/-1"><label>Su tono</label><input data-c="anfitrion_tono" value="'+esc(d.anfitrion_tono||'')+'" placeholder="Cercano y breve · culto sin ser pedante · nunca vende de más"></div>'
      +'</div></div>'
      +'<div class="card"><h3>De qué lee</h3>'
      +'<div class="hint">Libros, obras, textos de la casa. Lo que le des aquí es lo que tiene en la cabeza cuando contesta. Una línea por fuente.</div>'
      +'<div class="fld"><textarea data-c="anfitrion_fuentes" rows="7" placeholder="El laberinto de la soledad, Octavio Paz&#10;Nuestra carta de servicios&#10;La historia del edificio">'+esc(d.anfitrion_fuentes||'')+'</textarea></div>'
      +'</div>'
      +'<div class="card"><h3>Lo que nunca hace</h3>'
      +'<div class="hint">Más importante que lo anterior. Dónde no se mete y qué no promete.</div>'
      +'<div class="fld"><textarea data-c="anfitrion_nunca" rows="4" placeholder="No da precios de cuartos&#10;No promete upgrades&#10;Si no sabe, pasa con recepción">'+esc(d.anfitrion_nunca||'')+'</textarea></div>'
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>'
      +'<div class="card"><h3>Todavía no habla</h3><div class="pronto">Esto guarda su cabeza. Conectarlo al chat del huésped es el paso siguiente, y no está hecho.</div></div>';
  }

  function vPronto(){
    var T={espacios:['Mis espacios','Los sitios de tu casa que se pueden ocupar: salas, terraza, patio, azotea. Cada uno decide cómo cobra a un tercero que monte algo ahí — precio fijo con fianza, o un porcentaje de lo que venda el evento. Las tablas ya están (ev_espacios con hotel_id y modo de cobro); falta la pantalla.'],
      exps:['Mis experiencias','Las que tú creas, igual que las crea un touroperador: ficha, costeo, salidas, guía. Al publicarla escoges si es solo para tus huéspedes o abierta a cualquiera. Te quedas el 75%, y si además la vende tu concierge sumas el 10 de quien vende y el 5 de la casa: 90.'],
      eventos:['Mis eventos','Los que montas en tus espacios, solo para huéspedes o abiertos. Te quedas el 65%, y 80 si lo vendes tú en tu casa.'],
      ventas:['Mis ventas','Lo vendido, las próximas salidas y el desglose por concierge: quién vendió qué y cuánto se le debe.'],
      rest:['Restaurante y menú','La carta de esta casa, sus horarios y el room service. Sale del mismo recetario que ya existe en A&B.'],
      mapa:['Su mapa',''],intang:['Sus intangibles','']};
    var t=T[sec]||['Pronto',''];
    return '<div class="card"><h3>'+esc(t[0])+'</h3><div class="pronto">'+esc(t[1])+'</div></div>';
  }

  function ataGuarda(){
    var b=$('gGen'); if(!b) return;
    b.onclick=async function(){
      var d=destino(), body={};
      document.querySelectorAll('[data-c]').forEach(function(el){
        var c=el.getAttribute('data-c'), v=el.value;
        if(c==='cuartos') body[c]= v===''?null:Number(v);
        else if(c==='storage_activo'||c==='anfitrion_activo') body[c]= v==='true';
        else body[c]= v===''?null:v;
      });
      var h=hdr(); h['Prefer']='return=representation';
      var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+d.id,{method:'PATCH',headers:h,body:JSON.stringify(body)});
      if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json();
      if(!j||!j.length){toast('No se guardó: tu usuario no puede editar esta ficha.',true);return;}
      for(var i=0;i<GRUPOS.length;i++) if(GRUPOS[i].id===d.id) GRUPOS[i]=j[0];
      if(Hsel&&Hsel.id===d.id) Hsel=j[0]; if(G.id===d.id) G=j[0];
      toast('Guardado');
    };
  }
  /* pinta() arma el HTML y despues hay que atar el boton: se hace aqui para
     no repetirlo en cada vista. */
  var _pinta=pinta;
  pinta=function(){ _pinta(); ataGuarda();
    var d=destino();
    ['storage_activo','anfitrion_activo'].forEach(function(c){
      var el=document.querySelector('[data-c="'+c+'"]'); if(el) el.value = d[c]===true?'true':'false';
    });
  };

  load();
})();
</script>
</body></html>
