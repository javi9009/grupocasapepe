<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal del hotelero</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1280px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sel{margin-left:auto}
.top select{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.secnav button svg{width:15px;height:15px}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nivel{max-width:1280px;margin:0 auto;padding:12px 16px 0;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nv{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.nv.on{border-color:var(--ink);background:var(--ink);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.panel{display:none}.panel.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.fld .ay{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mini{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .et{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .vl{font-size:26px;font-weight:800;margin-top:4px;line-height:1.05}
.kpi .nt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
/* rejilla de hoteles tipo "crear experiencia" */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hc{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.hc:hover{border-color:var(--ink)}
.hc .hn{font-weight:700;font-size:14px}
.hc .hm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hc.nuevo{border-style:dashed;display:grid;place-items:center;min-height:96px;color:var(--accent);font-weight:700}
/* buffet */
.bufbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vistas{margin-left:auto;display:flex;gap:4px;border:1px solid var(--rule);border-radius:9px;padding:3px;background:var(--surface)}
.vistas button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.vistas button.on{background:var(--ink);color:#fff}
.buf{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media(max-width:980px){.buf{grid-template-columns:minmax(0,1fr)}}
.bg{display:grid;gap:10px}
.bg.foto{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.bg.lista{grid-template-columns:1fr}
.it{position:relative;background:var(--surface);border:1.5px solid var(--rule);border-radius:11px;overflow:hidden;cursor:pointer;display:block;text-align:left}
.it:hover{border-color:var(--ink)}
.it.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bg.foto .im{display:block;width:100%;height:96px;background:var(--surface-2) center/cover no-repeat}
.bg.foto .tx{display:block;padding:9px 11px 11px}
.bg.lista .it{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:8px 12px 8px 8px}
.bg.lista .im{display:block;width:52px;height:40px;border-radius:7px;background:var(--surface-2) center/cover no-repeat}
.bg.lista .tx{display:block}
.it .nm{display:block;font-weight:700;font-size:12.8px;line-height:1.25}
.it .de{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.it .tp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.it .tick{position:absolute;top:7px;right:7px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.bg.lista .it .tick{position:static}
.it.on .tick{display:grid}
.it .tick svg{width:13px;height:13px}
.panelsel{position:sticky;top:58px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.panelsel h4{margin:0 0 3px;font-size:13.5px}
.selist{list-style:none;margin:10px 0 0;padding:0;max-height:52vh;overflow:auto}
.selist li{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:12.5px}
.selist li:first-child{border-top:0}
.selist li b{flex:1;font-weight:600}
.selist li button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.vacio{padding:26px 10px;text-align:center;color:var(--faint);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pronto{border:1px dashed var(--rule);border-radius:11px;padding:16px 18px;background:var(--surface-3);color:var(--muted);font-size:12.5px;line-height:1.5}
/* Un <svg> sin width/height se estira al tamaño del contenedor: las
   palomitas de los pasos salían gigantes. Tamaño base y punto. */
.wrap svg{width:15px;height:15px;display:block;flex:none}
.it .tick svg{width:13px;height:13px}
.it .acc{display:flex;gap:6px;margin-top:9px}
.it .acc button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 10px;
  font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.it .acc .bsel{border-color:var(--accent);color:var(--accent)}
.it .acc .bsel.on{background:var(--accent);color:#fff}
.it .acc button:hover{border-color:var(--ink)}
.it .eco{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
.it .eco b{color:var(--ink)}
.vistas{margin-left:0}
.modal{position:fixed;inset:0;background:rgba(31,27,22,.72);display:none;place-items:center;z-index:60;padding:26px}
.modal.on{display:grid}
.modal .mc{background:var(--surface);border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal img{display:block;width:100%;height:210px;object-fit:cover}
.modal .imvacia{height:150px;display:grid;place-items:center;background:var(--surface-2);color:var(--faint);font-size:12.5px}
.modal .mb{padding:16px 18px 18px}
.modal h4{margin:0 0 4px;font-size:17px}
.modal .swn{position:absolute;top:11px;left:13px;background:rgba(31,27,22,.72);color:#fff;font-size:11.5px;
  font-weight:700;padding:4px 10px;border-radius:999px;z-index:2}
.tabla3{margin-top:13px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tabla3 div{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--rule);font-size:13px}
.tabla3 div:first-child{border-top:0;background:var(--surface-3)}
.tabla3 span{flex:1;color:var(--muted)}
.tabla3 b{font-size:14.5px}
.tabla3 i{font-style:normal;font-size:11px;color:var(--faint);min-width:30px;text-align:right}
.yaesta{margin-top:11px;background:var(--ok-bg);color:var(--ok);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600}
.swb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.swb button{border:1.5px solid var(--rule);background:var(--surface);border-radius:11px;padding:13px 10px;
  font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.swb .sx{color:var(--bad);border-color:#E6B8B2}
.swb .sx:hover{background:var(--bad-bg)}
.swb .ss{color:#fff;background:var(--accent);border-color:var(--accent)}
.swb .ss:hover{filter:brightness(1.08)}
.cn{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule);border-radius:11px;margin-bottom:9px}
.cn .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.cn .ci svg{width:19px;height:19px}
.cn .cn1{display:block;font-weight:700;font-size:13.5px}
.cn .cn2{display:block;font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.via{border:1px solid var(--rule);border-radius:12px;margin-bottom:11px;overflow:hidden;background:var(--surface)}
.viac{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:13px 15px;cursor:pointer}
.viac .vi{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted)}
.viac .vn{display:block;font-weight:700;font-size:14px}
.viac .vd{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.barra{width:112px;height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;flex:none}
.barra i{display:block;height:100%;border-radius:99px}
.viaq{display:none;border-top:1px solid var(--rule)}
.via.ab .viaq{display:block}
.q{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 15px;border-top:1px solid var(--rule)}
.q:first-child{border-top:0}
.q .qt{display:block;font-size:13px;line-height:1.45}
.q .qa{display:block;font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.resp{display:flex;gap:3px;border:1px solid var(--rule);border-radius:9px;padding:3px;background:var(--surface-3)}
.resp button{border:0;background:none;font:inherit;font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:7px;cursor:pointer;color:var(--muted);white-space:nowrap}
.resp button.on[data-v="si"]{background:var(--ok);color:#fff}
.resp button.on[data-v="parcial"]{background:var(--warn);color:#fff}
.resp button.on[data-v="no"]{background:var(--bad);color:#fff}
.resp button.on[data-v="na"]{background:var(--faint);color:#fff}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;display:none;z-index:40}
.toast.err{background:var(--bad)}
</style><link rel="icon" type="image/png" href="/dash-192.png">

  /* ---------- arranque ---------- */
  async function load(){
    var hs=await get('hoteles?select=*&order=nombre_comercial');
    if(!hs){ $('sub').textContent='No se pudo cargar. Abre esta pantalla desde el panel.'; return; }
    GRUPOS=hs;
    $('selGrupo').innerHTML=hs.map(function(h){return '<option value="'+h.id+'">'+esc(h.nombre_comercial||'(sin nombre)')+(h.es_grupo?' · grupo':'')+'</option>';}).join('');
    $('selGrupo').onchange=function(){ abre(this.value); };
    /* Se entra desde "Su portal" en la ficha: ?h=<id> fija el hotel y
       esconde el selector, porque el portal es privado de esa casa. */
    var q=new URLSearchParams(location.search).get('h');
    if(q && hs.some(function(x){return x.id===q;})){
      $('selGrupo').style.display='none';
      await abre(q);
    } else await abre(hs[0] && hs[0].id);
  }

  async function abre(id){
    G=GRUPOS.filter(function(h){return h.id===id;})[0]; if(!G) return;
    HOT=GRUPOS.filter(function(h){return h.grupo_id && G.grupo_id && h.grupo_id===G.grupo_id && h.id!==G.id;});
    if(!HOT.length) HOT=GRUPOS.filter(function(h){return h.id!==G.id && h.es_del_grupo===G.es_del_grupo && G.es_grupo;});
    Hsel=null; nivel='grupo';
    $('tit').textContent=G.nombre_comercial||'Portal del hotelero';
    $('sub').textContent=(G.es_grupo?'Grupo · ':'')+(G.ciudad||'')+(HOT.length?' · '+HOT.length+' propiedades':'');
    if(!CAT.experiencia.length) await cargaCatalogo();
    await cargaSel();
    pintaNivel(); pintaNav(); ve(SECS[nivel][0].k);
  }

  async function cargaCatalogo(){
    /* El PVP y los porcentajes vienen de la experiencia y de su operador: lo
       que ve el hotelero es dinero real, no un ejemplo. */
    var ops={}; (await get('tour_operadores?select=id,com_vendedor_pct,com_hotel_pct')||[])
      .forEach(function(o){ops[o.id]=o;});
    var e=await get('experiencias?select=id,nombre,foto_url,duracion,pvp,operador_id&limit=300&order=nombre')||[];
    CAT.experiencia=e.map(function(x){var o=ops[x.operador_id]||{};
      return {id:x.id,n:x.nombre,d:x.duracion||'',f:x.foto_url||'',pvp:Number(x.pvp)||0,
              vend:o.com_vendedor_pct==null?10:Number(o.com_vendedor_pct),
              hot:o.com_hotel_pct==null?5:Number(o.com_hotel_pct)};});
    var v=await get('eventos?select=id,nombre,precio&limit=300&order=nombre')||[];
    CAT.evento=v.map(function(x){return {id:x.id,n:x.nombre,d:'',f:'',pvp:Number(x.precio)||0,vend:10,hot:5};});
    var m=await get('mapa_puntos?select=id,nombre,ciudad&activo=is.true&limit=400&order=nombre')||[];
    CAT.mapa=m.map(function(x){return {id:x.id,n:x.nombre,d:x.ciudad||'',f:'',pvp:0,vend:0,hot:0};});
    CAT.tienda=[];
  }

  async function cargaSel(){
    SEL={}; var d=destino(); if(!d) return;
    var r=await get('hotel_intangibles?select=tipo,ref_id&activo=is.true&hotel_id=eq.'+d.id)||[];
    r.forEach(function(x){ SEL[x.tipo+':'+x.ref_id]=true; });
  }

  /* ---------- niveles y pestañas ---------- */
  function pintaNivel(){
    var h='<button class="nv'+(nivel==='grupo'?' on':'')+'" data-n="grupo">'+esc(G.nombre_comercial||'El grupo')+'</button>';
    HOT.forEach(function(x){ h+='<button class="nv'+(nivel==='hotel'&&Hsel&&Hsel.id===x.id?' on':'')+'" data-h="'+x.id+'">'+esc(x.nombre_comercial)+'</button>'; });
    if(!HOT.length) h+='<span class="mini">Todavía sin propiedades debajo. Se crean en «Mis hoteles».</span>';
    $('nivel').innerHTML=h;
    $('nivel').querySelectorAll('.nv').forEach(function(b){b.onclick=async function(){
      if(b.getAttribute('data-n')==='grupo'){ nivel='grupo'; Hsel=null; }
      else { nivel='hotel'; Hsel=HOT.filter(function(x){return x.id===b.getAttribute('data-h');})[0]; }
      await cargaSel(); pintaNivel(); pintaNav(); ve(SECS[nivel][0].k);
    };});
  }
  function pintaNav(){
    $('nav').innerHTML=SECS[nivel].map(function(s){return '<button role="tab" data-k="'+s.k+'">'+ic(s.g)+esc(s.t)+'</button>';}).join('');

  }

  function puntos(v){
    var hechas=0,suma=0;
    v.q.forEach(function(q){ var r=RESP[q[0]]; if(!r||r==='na') return; hechas++; suma+=VAL[r].p; });
    return {hechas:hechas, total:v.q.length, pct: hechas? Math.round(suma/hechas*100) : null};
  }
  function color(p){ return p==null?'var(--surface-2)' : p>=70?'var(--ok)' : p>=40?'var(--warn)' : 'var(--bad)'; }

  function pintaImpacto(w){
    var d=destino();
    var tot=VIAS.map(puntos), conD=tot.filter(function(x){return x.pct!=null;});
    var global = conD.length ? Math.round(conD.reduce(function(a,x){return a+x.pct;},0)/conD.length) : null;
    var respondidas = VIAS.reduce(function(a,v){return a+v.q.filter(function(q){return RESP[q[0]];}).length;},0);
    var totalQ = VIAS.reduce(function(a,v){return a+v.q.length;},0);

    w.innerHTML='<div class="kpis">'
      +'<div class="kpi"><div class="et">Dónde estás</div><div class="vl" style="color:'+color(global)+'">'+(global==null?'—':global+'%')+'</div><div class="nt">Media de las cinco vías</div></div>'
      +'<div class="kpi"><div class="et">Contestadas</div><div class="vl">'+respondidas+' / '+totalQ+'</div><div class="nt">Se puede dejar a medias y seguir luego</div></div>'
      +'<div class="kpi"><div class="et">Cuartos</div><div class="vl">'+(d.cuartos||'—')+'</div><div class="nt">El impacto se mide por cuarto, no en total</div></div>'
      +'<div class="kpi"><div class="et">Intangibles</div><div class="vl">'+Object.keys(SEL).filter(function(x){return x.indexOf("mapa:")!==0;}).length+'</div><div class="nt">Lo que ofreces además de la cama</div></div>'
      +'</div>'
      +'<div class="card"><h3>Tu impacto, por las cinco vías de Glasgow</h3>'
      +'<div class="hint">La Declaración de Glasgow pide cinco cosas a quien hospeda: medir, descarbonizar, regenerar, colaborar y financiar. Contesta lo que sepas hoy; lo que no, déjalo. Vale más un «no» honesto que un «sí» de adorno — esto lo acaba viendo un huésped.</div>'
      + VIAS.map(function(v,i){
          var p=tot[i];
          return '<div class="via'+(i===0?' ab':'')+'"><div class="viac">'
            +'<span class="vi" style="'+(p.pct!=null?'background:'+color(p.pct)+';color:#fff':'')+'">'+ic(v.g)+'</span>'
            +'<span><span class="vn">'+esc(v.n)+'</span><span class="vd">'+esc(v.d)+'</span></span>'
            +'<span style="display:flex;align-items:center;gap:9px">'
            +'<span class="barra"><i style="width:'+(p.pct==null?0:p.pct)+'%;background:'+color(p.pct)+'"></i></span>'
            +'<b style="font-size:12.5px;min-width:34px;text-align:right">'+(p.pct==null?'—':p.pct+'%')+'</b></span></div>'
            +'<div class="viaq">'+ v.q.map(function(q){
                return '<div class="q"><span><span class="qt">'+esc(q[1])+'</span><span class="qa">'+esc(q[2])+'</span></span>'
                  +'<span class="resp">'+['si','parcial','no','na'].map(function(k){
                      return '<button data-q="'+q[0]+'" data-v="'+k+'" class="'+(RESP[q[0]]===k?'on':'')+'">'+VAL[k].t+'</button>';
                    }).join('')+'</span></div>';
              }).join('') +'</div></div>';
        }).join('')
      +'</div>';
    w.querySelectorAll('.viac').forEach(function(c){c.onclick=function(e){ if(e.target.closest('.resp'))return; c.parentNode.classList.toggle('ab'); };});
    w.querySelectorAll('.resp button').forEach(function(b){b.onclick=async function(){
      var q=b.getAttribute('data-q'), v=b.getAttribute('data-v');
      RESP[q]=v; await guardaResp(q,v); pintaImpacto(w);
      var el=document.querySelector('[data-q="'+q+'"]'); if(el) el.closest('.via').classList.add('ab');
    };});
  }

  async function guardaResp(q,v){
    var d=destino(); var h=hdr(); h['Prefer']='resolution=merge-duplicates';
    var r=await fetch(SB+'/rest/v1/hotel_impacto',{method:'POST',headers:h,
      body:JSON.stringify([{hotel_id:d.id,pregunta:q,valor:v,updated_at:new Date().toISOString()}])});
    if(!r.ok) toast('No se guardó: '+(await r.text()).slice(0,100),true);
  }

  function vHoteles(w){
    w.innerHTML='<div class="card"><h3>Mis hoteles</h3>'
      +'<div class="hint">Se crean de uno en uno, igual que una experiencia. Cada uno lleva su propio Cloudbeds y su propia gente; los intangibles y el mapa los hereda del grupo.</div>'

  /* ---------- el buffet: foto o listado, lo escogido a la derecha ---------- */
  function vBuffet(w,tipos,titulo,ayuda){
    var esMapa = tipos.length===1 && tipos[0]==='mapa';
    var cs = esMapa ? [] : TIPOS.filter(function(t){return tipos.indexOf(t.k)>=0;});
    w.innerHTML='<div class="card"><h3>'+esc(titulo)+'</h3><div class="hint">'+ayuda+'</div>'
      +'<div class="bufbar">'
      + (cs.length ? '<button class="chip'+(filtro==='todos'?' on':'')+'" data-f="todos">Todo</button>'
          + cs.map(function(t){return '<button class="chip'+(filtro===t.k?' on':'')+'" data-f="'+t.k+'">'+esc(t.t)+'</button>';}).join('') : '')
      +'<input id="bq" placeholder="Buscar…" style="font:inherit;padding:7px 11px;border:1px solid var(--rule);border-radius:8px;min-width:170px">'
      +'<button class="btn sm" id="bSwipe" style="margin-left:auto">Revisar de una en una</button>'
      +'<span class="vistas"><button data-v="foto" class="'+(vista==='foto'?'on':'')+'">Fotos</button><button data-v="lista" class="'+(vista==='lista'?'on':'')+'">Listado</button></span>'
      +'</div>'
      +'<div class="buf"><div class="bg '+vista+'" id="bg"></div><div><div class="panelsel" id="ps"></div></div></div></div>';
    w.querySelectorAll('.chip').forEach(function(c){c.onclick=function(){filtro=c.getAttribute('data-f');vBuffet(w,tipos,titulo,ayuda);};});
    w.querySelectorAll('.vistas button').forEach(function(b){b.onclick=function(){vista=b.getAttribute('data-v');vBuffet(w,tipos,titulo,ayuda);};});
    $('bq').oninput=function(){rejilla(tipos);};
    $('bSwipe').onclick=function(){swipe(tipos);};
    rejilla(tipos); panelSel(tipos);
  }

  function items(tipos){
    var q=($('bq')&&$('bq').value||'').toLowerCase().trim();
    var out=[];
    tipos.forEach(function(t){
      if(filtro!=='todos' && tipos.length>1 && filtro!==t) return;
      (CAT[t]||[]).forEach(function(x){ if(!q||x.n.toLowerCase().indexOf(q)>=0) out.push({t:t,x:x}); });
    });
    return out;
  }

  function dinero(n){ return '$'+Math.round(n).toLocaleString('es-MX'); }
  function econo(o){
    if(!o.x.pvp) return '';
    return '<span class="eco"><b>'+dinero(o.x.pvp)+'</b> PVP · '
      + dinero(o.x.pvp*o.x.vend/100)+' a quien la vende · '
      + dinero(o.x.pvp*o.x.hot/100)+' a tu casa</span>';
  }

  function rejilla(tipos){
    var L=items(tipos), g=$('bg'); if(!g) return;
    if(!L.length){ g.innerHTML='<div class="vacio">Nada que mostrar todavía.</div>'; return; }
    g.innerHTML=L.map(function(o){
      var on=!!SEL[o.t+':'+o.x.id];
      var im='<span class="im"'+(o.x.f?' style="background-image:url('+JSON.stringify(o.x.f)+')"':'')+'></span>';
      return '<div class="it'+(on?' on':'')+'" data-t="'+o.t+'" data-i="'+o.x.id+'">'+im
        +'<span class="tx"><span class="nm">'+esc(o.x.n)+'</span>'
        + (o.x.d?'<span class="de">'+esc(o.x.d)+'</span>':'')
        + econo(o)
        +'<span class="acc">'
        +'<button class="bsel'+(on?' on':'')+'" data-sel="1">'+(on?'Quitar':'Añadir')+'</button>'
        +'<button class="bver" data-ver="1">Ver ficha</button>'
        +'</span></span>'
        +'<span class="tick">'+ic('ok')+'</span></div>';
    }).join('');
    g.querySelectorAll('.it').forEach(function(b){
      var t=b.getAttribute('data-t'), i=b.getAttribute('data-i');
      b.querySelector('[data-sel]').onclick=function(e){e.stopPropagation();marca(t,i,tipos);};
      b.querySelector('[data-ver]').onclick=function(e){e.stopPropagation();ficha(t,i,tipos);};
      b.onclick=function(){ficha(t,i,tipos);};
    });
  }

  function marca(t,i,tipos){
    var k=t+':'+i;
    if(SEL[k]) delete SEL[k]; else SEL[k]=true;
    guardaSel(t,i,!!SEL[k]); rejilla(tipos); panelSel(tipos);
  }

  function dato(t,i){ return (CAT[t]||[]).filter(function(x){return x.id===i;})[0]; }

  /* La ficha: la foto grande, lo que cuesta y lo que deja. El mismo botón que
     en la tarjeta, para que no haya que cerrar y buscarla otra vez. */
  function ficha(t,i,tipos){
    var x=dato(t,i); if(!x) return; var on=!!SEL[t+':'+i];
    $('modal').innerHTML='<div class="mc">'
      + (x.f?'<img src="'+esc(x.f)+'" alt="'+esc(x.n)+'">':'<div class="imvacia">Sin foto todavía</div>')
      +'<div class="mb"><h4>'+esc(x.n)+'</h4>'
      + (x.d?'<div class="mini">'+esc(x.d)+'</div>':'')
      + (x.pvp?'<div class="tabla3">'
          +'<div><span>Lo que paga el huésped</span><b>'+dinero(x.pvp)+'</b></div>'
          +'<div><span>A quien la vende</span><b>'+dinero(x.pvp*x.vend/100)+'</b><i>'+x.vend+'%</i></div>'
          +'<div><span>A tu casa</span><b>'+dinero(x.pvp*x.hot/100)+'</b><i>'+x.hot+'%</i></div>'
          +'</div>':'<div class="mini" style="margin-top:10px">Esto no se vende: va en el mapa.</div>')
      +'<div class="ft"><button class="btn ghost" id="mX">Cerrar</button>'
      +'<button class="btn" id="mSel">'+(on?'Quitar de mi casa':'Añadir a mi casa')+'</button></div>'
      +'</div></div>';
    var M=$('modal'); M.classList.add('on');
    $('mX').onclick=function(){M.classList.remove('on');};
    M.onclick=function(e){ if(e.target===M) M.classList.remove('on'); };
    $('mSel').onclick=function(){ marca(t,i,tipos); M.classList.remove('on'); };
  }

  /* Swipe: de uno en uno, fuera o dentro. Para ciento y pico de experiencias
     es mas rapido que leer una rejilla entera. */
  var SW=[],swi=0,swTipos=null;
  function swipe(tipos){
    swTipos=tipos; SW=items(tipos); swi=0;
    if(!SW.length){ toast('No hay nada que revisar'); return; }
    $('modal').classList.add('on'); pintaSwipe();
  }
  function pintaSwipe(){
    var M=$('modal');
    if(swi>=SW.length){
      M.innerHTML='<div class="mc"><div class="mb" style="text-align:center;padding:34px 24px">'
        +'<h4>Listo</h4><div class="mini">Revisaste las '+SW.length+'. Tienes '+Object.keys(SEL).length+' puestas.</div>'
        +'<div class="ft" style="justify-content:center"><button class="btn" id="mX">Cerrar</button></div></div></div>';
      $('mX').onclick=function(){M.classList.remove('on');rejilla(swTipos);panelSel(swTipos);};
      return;
    }
    var o=SW[swi], on=!!SEL[o.t+':'+o.x.id];
    M.innerHTML='<div class="mc">'
      +'<div class="swn">'+(swi+1)+' de '+SW.length+'</div>'
      + (o.x.f?'<img src="'+esc(o.x.f)+'" alt="'+esc(o.x.n)+'">':'<div class="imvacia">Sin foto todavía</div>')
      +'<div class="mb"><h4>'+esc(o.x.n)+'</h4>'
      + (o.x.d?'<div class="mini">'+esc(o.x.d)+'</div>':'')
      + (o.x.pvp?'<div class="tabla3">'
          +'<div><span>Lo que paga el huésped</span><b>'+dinero(o.x.pvp)+'</b></div>'
          +'<div><span>A quien la vende</span><b>'+dinero(o.x.pvp*o.x.vend/100)+'</b><i>'+o.x.vend+'%</i></div>'
          +'<div><span>A tu casa</span><b>'+dinero(o.x.pvp*o.x.hot/100)+'</b><i>'+o.x.hot+'%</i></div>'
          +'</div>':'')
      + (on?'<div class="yaesta">Ya la tienes puesta</div>':'')
      +'<div class="swb">'
      +'<button class="sx" id="swNo">✕ No va</button>'
      +'<button class="ss" id="swSi">✓ La quiero</button>'
      +'</div>'
      +'<div style="text-align:center;margin-top:9px"><button class="btn ghost sm" id="swFin">Dejarlo aquí</button></div>'
      +'</div></div>';
    $('swNo').onclick=function(){ if(on) marcaSilencio(o,false); swi++; pintaSwipe(); };
    $('swSi').onclick=function(){ if(!on) marcaSilencio(o,true); swi++; pintaSwipe(); };
    $('swFin').onclick=function(){ M.classList.remove('on'); rejilla(swTipos); panelSel(swTipos); };
  }
  function marcaSilencio(o,on){
    var k=o.t+':'+o.x.id;
    if(on) SEL[k]=true; else delete SEL[k];
    guardaSel(o.t,o.x.id,on);
  }

  function panelSel(tipos){
    var p=$('ps'); if(!p) return;
    var L=[]; tipos.forEach(function(t){ (CAT[t]||[]).forEach(function(x){ if(SEL[t+':'+x.id]) L.push({t:t,x:x}); }); });
    var d=destino();
    p.innerHTML='<h4>Lo que tienes puesto</h4><div class="mini">'+L.length+' en '+esc(d?(d.nombre_comercial||''):'')+'</div>'
      + (L.length
          ? '<ul class="selist">'+L.map(function(o){return '<li><b>'+esc(o.x.n)+'</b><button data-t="'+o.t+'" data-i="'+o.x.id+'" title="Quitar">&times;</button></li>';}).join('')+'</ul>'
          : '<div class="vacio">Marca lo que quieras ofrecer y aparecerá aquí.</div>')
      + (nivel==='hotel' ? '<div class="mini" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)">Esta es la selección de <b>'+esc(d.nombre_comercial)+'</b>. Lo que quites aquí no toca a las demás casas.</div>' : '');
    p.querySelectorAll('button[data-i]').forEach(function(b){b.onclick=function(){
      var t=b.getAttribute('data-t'), i=b.getAttribute('data-i');
      delete SEL[t+':'+i]; guardaSel(t,i,false); rejilla(tipos); panelSel(tipos);
    };});
  }

  async function guardaSel(tipo,ref,on){
    var d=destino(); if(!d) return;
    if(on){
      var h=hdr(); h['Prefer']='resolution=merge-duplicates';
      await fetch(SB+'/rest/v1/hotel_intangibles',{method:'POST',headers:h,
        body:JSON.stringify([{hotel_id:d.id,tipo:tipo,ref_id:ref,activo:true}])});
    } else {
      await fetch(SB+'/rest/v1/hotel_intangibles?hotel_id=eq.'+d.id+'&tipo=eq.'+tipo+'&ref_id=eq.'+ref,
        {method:'PATCH',headers:hdr(),body:JSON.stringify({activo:false})});
    }
  }

  /* ---------- mis espacios ---------- */
  var ESP=[];
  async function vEspacios(w){
    var d=destino();
    w.innerHTML='<div class="card"><h3>Mis espacios</h3>'
      +'<div class="hint">Los sitios de tu casa que se pueden ocupar: salas, terraza, patio, azotea. De cada uno decides cómo le cobras a alguien de fuera que monte algo ahí: precio fijo con fianza, o un porcentaje de lo que venda el evento.</div>'

    var h=ESP.map(function(x){
      var cobro = x.cobro_tercero_modo==='porcentaje' ? (x.cobro_tercero_pct||0)+'% de su venta'
                : x.cobro_tercero_modo==='fijo' ? ('$'+(x.tarifa_hora||0)+'/h'+(x.tarifa_dia?' · $'+x.tarifa_dia+'/día':'')+(x.fianza_monto?' · fianza $'+x.fianza_monto:''))
                : 'sin precio todavía';
      return '<button class="hc" data-e="'+x.id+'"><div class="hn">'+esc(x.nombre||'(sin nombre)')+'</div>'
        +'<div class="hm">'+(x.capacidad?x.capacidad+' de pie':'sin aforo')+(x.capacidad_sentado?' · '+x.capacidad_sentado+' sentados':'')+'<br>'
        + esc(cobro)+'<br>'+(x.activo?'Publicado':'Apagado')+(x.abierto_terceros?' · abierto a terceros':' · solo para ti')+'</div></button>';
    }).join('');
    h+='<button class="hc nuevo" id="nuevoE">+ Nuevo espacio</button>';
    $('eg').innerHTML=h;
    $('eg').querySelectorAll('.hc[data-e]').forEach(function(b){b.onclick=function(){fichaEspacio(b.getAttribute('data-e'));};});
    $('nuevoE').onclick=async function(){
      var n=prompt('¿Cómo se llama el espacio?'); if(!n) return;
      var sl=n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
      var r=await fetch(SB+'/rest/v1/ev_espacios',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
        body:JSON.stringify({nombre:n,slug:sl+'-'+Math.random().toString(36).slice(2,5),hotel_id:d.id,sede:(d.slug||null),activo:false})});
      if(!r.ok){toast('No se pudo crear: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json(); toast('Espacio creado'); await vEspacios(w); fichaEspacio(j[0].id);
    };
  }

  /* La ficha del espacio es la del Ateneo entera — mismos campos, misma tabla.
     Lo único propio del hotel es de quién es y si lo abre a terceros. */
  function fichaEspacio(id){
    var x=ESP.filter(function(e){return e.id===id;})[0]; if(!x) return;
    var d=destino();
    function f(lab,c,t,ay,ph){ var v=x[c];
      return '<div class="fld"><label>'+lab+'</label><input data-e="'+c+'" type="'+(t||'text')+'"'+(t==='number'?' step="any"':'')
        +' value="'+esc(v==null?'':v)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'+(ay?'<div class="ay">'+ay+'</div>':'')+'</div>'; }
    $('efi').innerHTML=
      '<div class="card"><h3>'+esc(x.nombre)+'</h3>'
      +'<div class="hint">Lo que ve quien quiera montar algo aquí. Cuanto más completo, menos correos de ida y vuelta.</div>'
      +'<div class="fgrid">'
      + f('Nombre','nombre') + f('Cómo lo llaman','alias',null,'El nombre de la casa, si es otro')
      + f('Aforo de pie','capacidad','number') + f('Aforo sentado','capacidad_sentado','number')
      + f('Metros cuadrados','metros2','number') + f('Dónde está','lugar_numero',null,'Piso, azotea, patio trasero')
      +'</div>'
      +'<div class="fld" style="margin-top:12px"><label>Cómo es</label><textarea data-e="descripcion" rows="3" placeholder="Qué se ve, qué luz tiene, qué se siente estando ahí">'+esc(x.descripcion||'')+'</textarea></div>'
      +'<div class="fgrid" style="margin-top:12px">'
      + f('Horario de servicio','horario_servicio',null,null,'L–D 9:00 a 23:00')
      +'<div class="fld"><label>Dirección</label><input data-e="direccion" value="'+esc(x.direccion||d.direccion||'')+'"><div class="ay">Heredada de la casa; cámbiala si la entrada es otra</div></div>'
      +'</div></div>'

      +'<div class="card"><h3>¿Lo abres a gente de fuera?</h3>'
      +'<div class="hint">Puedes guardártelo para tus propios eventos, o publicarlo para que una productora monte algo aquí y te pague por ello.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>Abierto a terceros</label><select data-e="abierto_terceros"><option value="false">No, solo lo uso yo</option><option value="true">Sí, que me lo renten</option></select></div>'
      +'<div class="fld"><label>¿A la venta?</label><select data-e="activo"><option value="false">Todavía no</option><option value="true">Sí, publicado</option></select></div>'
      +'<div class="fld"><label>Se puede reservar desde la app</label><select data-e="reservable_app"><option value="false">No, se pide y se cotiza</option><option value="true">Sí, directo</option></select></div>'
      +'</div></div>'

      +'<div class="card"><h3>Cuánto cuesta</h3>'
      +'<div class="hint">O le cobras la renta del espacio, o te llevas un porcentaje de lo que venda su evento. No las dos.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>Forma de cobro</label><select data-e="cobro_tercero_modo" id="modoE"><option value="">— sin definir —</option><option value="fijo">Renta del espacio</option><option value="porcentaje">Un porcentaje de su venta</option></select></div>'
      +'</div>'
      +'<div class="fgrid" id="boxFijo" style="margin-top:12px">'
      + f('Por hora','tarifa_hora','number') + f('Por día','tarifa_dia','number')
      + f('Hora extra','tarifa_hora_extra','number') + f('Por mes','tarifa_mes','number','Para estancias largas')
      +'</div>'
      +'<div class="fgrid" id="boxPct" style="margin-top:12px">'
      + f('Tu porcentaje','cobro_tercero_pct','number','De lo que venda el evento, antes de comisiones')
      +'</div></div>'

      +'<div class="card"><h3>La fianza y la letra chica</h3>'
      +'<div class="hint">Lo que te protege si el espacio no queda como estaba, y lo que pasa si cancelan.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>Tipo de fianza</label><select data-e="fianza_tipo"><option value="">— sin fianza —</option><option value="monto">Monto fijo</option><option value="tarjeta">Retención en tarjeta</option><option value="pagare">Pagaré</option></select></div>'
      + f('Monto de la fianza','fianza_monto','number','Se devuelve si todo queda bien')
      + f('Anticipo para apartar %','reserva_anticipo_pct','number')
      + f('Cancela sin costo hasta (horas antes)','cancela_horas','number')
      + f('Penalización si cancela después %','cancela_penaliza_pct','number')
      +'<div class="fld"><label>¿Necesita protección civil?</label><select data-e="requiere_proteccion_civil"><option value="false">No</option><option value="true">Sí</option></select><div class="ay">Aforo grande o público de pie suele pedirlo</div></div>'
      +'</div>'
      +'<div class="fld" style="margin-top:12px"><label>Reglas de la casa</label><textarea data-e="reglas" rows="3" placeholder="Hasta qué hora hay música, si se puede clavar en la pared, quién limpia">'+esc(x.reglas||'')+'</textarea></div>'
      +'<div class="fld" style="margin-top:12px"><label>Notas internas</label><textarea data-e="observaciones" rows="2" placeholder="Lo que no ve el cliente">'+esc(x.observaciones||'')+'</textarea></div>'
      +'<div class="ft"><button class="btn" id="gEsp">Guardar</button></div></div>';

    ['abierto_terceros','activo','reservable_app','requiere_proteccion_civil'].forEach(function(c){
      var el=document.querySelector('[data-e="'+c+'"]'); if(el) el.value = x[c]===true?'true':'false';
    });
    var ft=document.querySelector('[data-e="fianza_tipo"]'); if(ft) ft.value=x.fianza_tipo||'';
    var sel=$('modoE'); sel.value=x.cobro_tercero_modo||'';
    function cajas(){ $('boxFijo').style.display = sel.value==='fijo'?'grid':'none';
                      $('boxPct').style.display  = sel.value==='porcentaje'?'grid':'none'; }
    sel.onchange=cajas; cajas();

    $('gEsp').onclick=async function(){
      var BOOL={abierto_terceros:1,activo:1,reservable_app:1,requiere_proteccion_civil:1};
      var NUM={capacidad:1,capacidad_sentado:1,metros2:1,tarifa_hora:1,tarifa_dia:1,tarifa_hora_extra:1,
               tarifa_mes:1,cobro_tercero_pct:1,fianza_monto:1,reserva_anticipo_pct:1,cancela_horas:1,cancela_penaliza_pct:1};
      var b={};
      document.querySelectorAll('[data-e]').forEach(function(el){
        var c=el.getAttribute('data-e'), v=el.value;
        if(BOOL[c]) b[c]= v==='true';
        else if(NUM[c]) b[c]= v===''?null:Number(v);
        else b[c]= v===''?null:v;
      });
      var h=hdr(); h['Prefer']='return=representation';
      var r=await fetch(SB+'/rest/v1/ev_espacios?id=eq.'+id,{method:'PATCH',headers:h,body:JSON.stringify(b)});
      if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,120),true);return;}
      var j=await r.json();
      if(!j||!j.length){toast('No se guardó: tu usuario no puede editar este espacio.',true);return;}
      toast('Guardado'); await vEspacios($('wrap')); fichaEspacio(id);
    };
  }

  /* ---------- las tres puertas de la casa ---------- */
  function vEnlaces(w){
    var d=destino(), base=location.origin, sl=encodeURIComponent(d.slug||'');
    var L=[
      {g:'users', t:'Para tu equipo', u:base+'/soypepe.html?h='+sl,
       d:'Donde ficha, ve su horario, sus tareas del día y sus procedimientos. Cada persona entra con su propia liga; no se comparte en un grupo de WhatsApp.',
       q:'Pégalo en el alta de cada colaborador'},
      {g:'bed', t:'Para tus huéspedes', u:base+'/h/'+sl,
       d:'El check-in, el mapa, las experiencias y todo lo que le puedes vender. Es también tu portal público: quien no está hospedado entra igual y puede comprar.',
       q:'Va en el QR de recepción, en el correo de reserva y en tu bio'},
      {g:'shield', t:'Para ti y tu dirección', u:base+'/m/hotel-portal.html?h='+d.id,
       d:'Este portal. Tus módulos, tus hoteles, tus intangibles, tus ventas. Solo para quien lleva el negocio.',
       q:'No lo repartas: aquí se ven números'}
    ];
    w.innerHTML='<div class="card"><h3>Sus enlaces</h3>'
      +'<div class="hint">Tres puertas, una por cada clase de persona. Las tres llevan tu marca, no la nuestra: quien las abre ve tu logo y tus colores.</div>'
      + L.map(function(x){return '<div class="cn" style="grid-template-columns:34px 1fr;align-items:start;padding:14px 15px">'
          +'<span class="ci">'+ic(x.g)+'</span>'
          +'<span><span class="cn1">'+esc(x.t)+'</span>'
          +'<span class="cn2">'+esc(x.d)+'</span>'
          +'<span style="display:flex;gap:7px;margin-top:9px;flex-wrap:wrap;align-items:center">'
          +'<input readonly value="'+esc(x.u)+'" style="flex:1;min-width:210px;font:inherit;font-size:12.5px;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface-3)">'
          +'<button class="btn ghost sm" data-u="'+esc(x.u)+'">Copiar</button>'
          +'<a class="btn ghost sm" href="'+esc(x.u)+'" target="_blank" rel="noopener" style="text-decoration:none">Abrir</a></span>'
          +'<span class="mini" style="display:block;margin-top:6px">'+esc(x.q)+'</span></span></div>';}).join('')
      +'</div>'
      +'<div class="card"><h3>Tu marca en esas tres puertas</h3>'
      +'<div class="hint">El huésped y tu equipo no tienen por qué saber qué hay detrás. Pon tu logo y tus dos colores y las tres pantallas se visten con ellos.</div>'
      +'<div class="fgrid">'
      +'<div class="fld" style="grid-column:1/-1"><label>Logo (URL de la imagen)</label><input data-c="marca_logo_url" value="'+esc(d.marca_logo_url||'')+'" placeholder="https://…/logo.png"></div>'
      +'<div class="fld"><label>Color principal</label><input data-c="marca_color" value="'+esc(d.marca_color||'')+'" placeholder="#1F3A5F"></div>'
      +'<div class="fld"><label>Color de acento</label><input data-c="marca_color2" value="'+esc(d.marca_color2||'')+'" placeholder="#D08A3E"></div>'
      +'</div>'
      +'<div style="margin-top:14px;border:1px solid var(--rule);border-radius:11px;overflow:hidden">'
      +'<div style="background:'+esc(d.marca_color||'#1F1B16')+';color:#fff;padding:13px 16px;display:flex;align-items:center;gap:11px">'
      + (d.marca_logo_url?'<img src="'+esc(d.marca_logo_url)+'" alt="" style="height:26px">':'<b style="font-size:15px">'+esc(d.nombre_comercial||'')+'</b>')
      +'<span style="margin-left:auto;font-size:12px;opacity:.85">así se ve tu cabecera</span></div>'
      +'<div style="padding:14px 16px;background:var(--surface-3)"><button class="btn" style="background:'+esc(d.marca_color2||'#137A56')+';border-color:'+esc(d.marca_color2||'#137A56')+'">Hacer check-in</button></div>'
      +'</div>'
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>'
      +'<div class="card"><h3>Lo que falta</h3><div class="pronto">Las tres ligas ya se arman con el slug de la casa. Las pantallas del equipo y del huésped todavía no leen estos colores: eso es lo siguiente.</div></div>';
    w.querySelectorAll('button[data-u]').forEach(function(b){b.onclick=function(){
      navigator.clipboard.writeText(b.getAttribute('data-u')).then(function(){toast('Copiado');},function(){toast('No pude copiar',true);});
    };});
  }

  function vPronto(){
    var T={espacios:['Mis espacios','Los sitios de tu casa que se pueden ocupar: salas, terraza, patio, azotea. Cada uno decide cómo cobra a un tercero que monte algo ahí — precio fijo con fianza, o un porcentaje de lo que venda el evento. Las tablas ya están (ev_espacios con hotel_id y modo de cobro); falta la pantalla.'],
      exps:['Mis experiencias','Las que tú creas, igual que las crea un touroperador: ficha, costeo, salidas, guía. Al publicarla escoges si es solo para tus huéspedes o abierta a cualquiera. Te quedas el 75%, y si además la vende tu concierge sumas el 10 de quien vende y el 5 de la casa: 90.'],
      eventos:['Mis eventos','Los que montas en tus espacios, solo para huéspedes o abiertos. Te quedas el 65%, y 80 si lo vendes tú en tu casa.'],
      ventas:['Mis ventas','Lo vendido, las próximas salidas y el desglose por concierge: quién vendió qué y cuánto se le debe.'],
      rest:['Restaurante y menú','La carta de esta casa, sus horarios y el room service. Sale del mismo recetario que ya existe en A&B.'],
      mapa:['Su mapa',''],intang:['Sus intangibles','']};
    var t=T[sec]||['Pronto',''];
    return '<div class="card"><h3>'+esc(t[0])+'</h3><div class="pronto">'+esc(t[1])+'</div></div>';
  }

  function ataGuarda(){
    var b=$('gGen'); if(!b) return;
    b.onclick=async function(){
      var d=destino(), body={};
      document.querySelectorAll('[data-c]').forEach(function(el){
        var c=el.getAttribute('data-c'), v=el.value;
        if(c==='cuartos') body[c]= v===''?null:Number(v);
        else if(c==='storage_activo'||c==='anfitrion_activo') body[c]= v==='true';
        else body[c]= v===''?null:v;
      });
      var h=hdr(); h['Prefer']='return=representation';
      var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+d.id,{method:'PATCH',headers:h,body:JSON.stringify(body)});
      if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json();
      if(!j||!j.length){toast('No se guardó: tu usuario no puede editar esta ficha.',true);return;}
      for(var i=0;i<GRUPOS.length;i++) if(GRUPOS[i].id===d.id) GRUPOS[i]=j[0];
      if(Hsel&&Hsel.id===d.id) Hsel=j[0]; if(G.id===d.id) G=j[0];
      toast('Guardado');
    };
  }
  /* pinta() arma el HTML y despues hay que atar el boton: se hace aqui para
     no repetirlo en cada vista. */
  var _pinta=pinta;
  pinta=function(){ _pinta(); ataGuarda();
    var d=destino();
    ['storage_activo','anfitrion_activo'].forEach(function(c){
      var el=document.querySelector('[data-c="'+c+'"]'); if(el) el.value = d[c]===true?'true':'false';
    });
  };

  load();
})();
</script>
</body></html>
