<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Incidencias · Grupo Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--mut:#8d8170;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--warn:#b8821a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:12px 18px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:16px}header .ttl b{color:var(--gold)}
header .right{margin-left:auto;display:flex;gap:14px;align-items:center}
.wrap{max-width:1000px;margin:18px auto;padding:0 16px 60px}
.kpis{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--bd);border-radius:12px;padding:12px 16px;min-width:120px}
.kpi .n{font-size:24px;font-weight:800}.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.kpi.grave .n{color:var(--bad)}.kpi.alta .n{color:var(--warn)}
.grp{background:var(--surface);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px;overflow:hidden}
.grp h2{margin:0;font-size:14px;padding:12px 16px;background:#efe6d4;display:flex;align-items:center;gap:10px}
.grp h2 .c{margin-left:auto;font-size:12px;color:var(--mut);font-weight:600}
.row{padding:11px 16px;border-top:1px solid var(--bd);display:flex;gap:12px;align-items:flex-start;font-size:13px}
.row .who{font-weight:700;min-width:120px}
.row .desc{flex:1;color:var(--txt)}
.row .meta{color:var(--mut);font-size:11px;white-space:nowrap}
.row.done{opacity:.5}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px;white-space:nowrap}
.tag.grave{background:#fbeaea;color:#9a2b2b}.tag.alta{background:#fbf0db;color:#8a5a00}.tag.media{background:#eef0f2;color:#566}.tag.baja{background:#eef6f1;color:#176b4c}
.btn{font-size:11px;border:1px solid var(--bd);background:#fff;border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--soft)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.empty,.gate{text-align:center;color:var(--mut);padding:60px 20px}
.empty b,.gate b{color:var(--txt);display:block;font-size:16px;margin-bottom:6px}
.filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.filters button{font-size:12px;border:1px solid var(--bd);background:#fff;border-radius:20px;padding:5px 12px;cursor:pointer;color:var(--soft)}
.filters button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
</style></head><body>
<header>
  <a href="/">← Panel</a>
  <span class="ttl">Incidencias · <b>Grupo Casa Pepe</b></span>
  <span class="right"><span id="updated" style="font-size:11px;color:#cdbf9c"></span><a id="reload" style="cursor:pointer">↻ Actualizar</a></span>
</header>
<div class="wrap" id="wrap"><div class="empty">Cargando…</div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO');
const $=id=>document.getElementById(id);
// Solo estas cuentas ven incidencias
const VIEWERS=['javi@casapepe.mx'];
let FILTER='abiertas';

const SEV_ORDER={grave:0,alta:1,media:2,baja:3};
const TIPO_LABEL={checada_otro_dispositivo:'Checada desde otro dispositivo',falta:'Faltas',retardo:'Retardos'};
function fdt(t){return new Date(t).toLocaleString('es-MX',{timeZone:'America/Mexico_City',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});}

async function load(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('wrap').innerHTML='<div class="gate"><b>Entra desde el panel</b>Abre grupocasapepe.netlify.app e inicia sesión.</div>';return;}
  const email=(session.user.email||'').toLowerCase();
  if(!VIEWERS.includes(email)){$('wrap').innerHTML='<div class="gate"><b>Sin acceso</b>Las incidencias solo las pueden ver Javi y Deisy.</div>';return;}
  const {data,error}=await sb.from('incidencias').select('*').order('created_at',{ascending:false}).limit(300);
  if(error){$('wrap').innerHTML='<div class="gate"><b>No se pudo cargar</b>'+error.message+'</div>';return;}
  $('updated').textContent='Actualizado '+new Date().toLocaleTimeString('es-MX',{timeZone:'America/Mexico_City',hour:'2-digit',minute:'2-digit'});
  render(data||[]);
}

function render(all){
  const abiertas=all.filter(i=>!i.resuelto);
  const grave=abiertas.filter(i=>i.severidad==='grave').length;
  const alta=abiertas.filter(i=>i.severidad==='alta').length;
  let rows = FILTER==='abiertas'?abiertas : FILTER==='todas'?all : abiertas.filter(i=>i.severidad==='grave');
  // KPIs + filtros
  let html='<div class="kpis">'
    +'<div class="kpi"><div class="n">'+abiertas.length+'</div><div class="l">Abiertas</div></div>'
    +'<div class="kpi grave"><div class="n">'+grave+'</div><div class="l">Graves</div></div>'
    +'<div class="kpi alta"><div class="n">'+alta+'</div><div class="l">Altas</div></div>'
    +'<div class="kpi"><div class="n">'+all.length+'</div><div class="l">Total</div></div></div>';
  html+='<div class="filters">'
    +'<button data-f="abiertas" class="'+(FILTER==='abiertas'?'on':'')+'">Abiertas</button>'
    +'<button data-f="graves" class="'+(FILTER==='graves'?'on':'')+'">Solo graves</button>'
    +'<button data-f="todas" class="'+(FILTER==='todas'?'on':'')+'">Todas</button></div>';
  if(!rows.length){ html+='<div class="empty"><b>Sin incidencias '+(FILTER==='todas'?'registradas':'abiertas')+'. 🎉</b>Aquí aparecerán las que vayamos definiendo (checadas irregulares, faltas, retardos, etc.).</div>'; $('wrap').innerHTML=html; bind(all); return; }
  // Agrupar por tipo
  const groups={};
  rows.forEach(i=>{(groups[i.tipo]=groups[i.tipo]||[]).push(i);});
  Object.keys(groups).sort().forEach(tipo=>{
    const items=groups[tipo].sort((a,b)=>(SEV_ORDER[a.severidad]??9)-(SEV_ORDER[b.severidad]??9));
    html+='<div class="grp"><h2>'+(TIPO_LABEL[tipo]||tipo)+'<span class="c">'+items.length+'</span></h2>';
    items.forEach(i=>{
      const sev=i.severidad||'media';
      html+='<div class="row'+(i.resuelto?' done':'')+'">'
        +'<span class="tag '+sev+'">'+sev+'</span>'
        +'<span class="who">'+(i.nombre_display||'—')+'</span>'
        +'<span class="desc">'+(i.descripcion||'')+'</span>'
        +'<span class="meta">'+fdt(i.created_at)+'</span>'
        +(i.resuelto?'<span class="meta">✓ resuelto</span>':'<button class="btn" data-done="'+i.id+'">Marcar resuelto</button>')
        +'</div>';
    });
    html+='</div>';
  });
  $('wrap').innerHTML=html; bind(all);
}

function bind(all){
  document.querySelectorAll('.filters button').forEach(b=>b.onclick=()=>{FILTER=b.dataset.f;render(all);});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=async()=>{
    b.disabled=true;b.textContent='…';
    const {error}=await sb.from('incidencias').update({resuelto:true}).eq('id',b.dataset.done);
    if(error){b.disabled=false;b.textContent='Error';return;}
    load();
  });
}
$('reload').onclick=load;
load();
</script>
</body></html>
