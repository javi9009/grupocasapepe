<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencias · Casa Pepe</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}.muted{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px 9px 0 0;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;position:relative}
  .tab.on{color:var(--gold2);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
  .tab .cnt{display:inline-block;min-width:18px;text-align:center;background:#3a2c12;color:var(--gold2);border-radius:10px;font-size:11px;padding:0 5px;margin-left:5px}
  main{padding:14px 16px 60px;max-width:920px;margin:0 auto}
  .sec{display:none}.sec.on{display:block}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .item .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .item .nm{font-weight:600;font-size:15px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .pill.r{color:#e6bfbf;border-color:#5a2f2a}.pill.s{color:#cdb4e0;border-color:#4a3a5a}.pill.g{color:#bfe6c4;border-color:#2f5a35}
  .det{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
  .apaso{color:var(--muted)}.apaso.done{color:var(--green)}.apaso.cur{color:var(--gold2);font-weight:700}
  .adet{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:none}.adet.show{display:block}
  .arow{font-size:12.5px;padding:5px 0;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px dashed #2a2014}
  .arow b{color:var(--txt);font-weight:600}.arow.cur b{color:var(--gold2)}.arow.done .ast{color:var(--green)}
  .ast{width:16px;text-align:center;font-weight:700}
  .help2{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#3a2c12;color:var(--gold2);font-size:10px;font-weight:700;cursor:help}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;margin:6px 0 10px;font-size:12.5px}
  .kv span b{color:var(--txt)}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:12px}
  .btn.ok{background:#23402a;color:#bfe6c4;border:1px solid #3f6043}
  .btn.warn{background:#3a2c12;color:var(--gold2);border:1px solid #5a431f}
  .btn.no{background:#3a2a2a;color:#e6bfbf;border:1px solid #5a2f2a}
  .btn.lnk{background:var(--panel2);color:var(--blue);border:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:46px}
  .subbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .subv{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
  .subv.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .tbl th{text-align:left;padding:8px;border-bottom:1px solid var(--line);color:var(--gold2);font-weight:600;white-space:nowrap}
  .tbl td{padding:8px;border-bottom:1px solid #2a2014;vertical-align:top}
  .tbl tr.warn3 td{background:#3a2c1226}.tbl tr.bad td{background:#3a2a2a33}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:320px;width:90%;text-align:center}
  .gate h2{color:var(--gold2);margin:0 0 10px}.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:10px}
  .gate .err{color:var(--red);font-size:12px;min-height:14px}.gate button{width:100%;background:var(--gold);color:#1a1206;border:0;border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23402a;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="gate" id="gate" style="display:none"><div class="box"><h2>Incidencias</h2><p class="muted" id="gmsg">Inicia sesión.</p><input type="email" id="lemail" placeholder="correo"><input type="password" id="lpass" placeholder="contraseña"><div class="err" id="lerr"></div><button id="lbtn">Entrar</button></div></div>
<header>
  <div class="brand"><h1>⚠️ Incidencias</h1><span class="muted" id="scope"></span><span class="spacer"></span><span class="muted" id="me"></span></div>
  <div class="tabs" id="grpTabs">
    <button class="tab on" data-g="vacaciones">🏖️ Vacaciones <span class="cnt" id="c-solic">0</span></button>
    <button class="tab" data-g="retrasos">⏱️ Retrasos <span class="cnt" id="c-asis">0</span></button>
    <button class="tab" data-g="contratos">📄 Contratos <span class="cnt" id="c-altas">0</span></button>
    <button class="tab" data-g="briefing">📋 Briefing</button>
  </div>
</header>
<main>
  <div id="subbar" class="subbar"></div>
  <div id="content"><div class="empty">Cargando…</div></div>
</main>
<div class="toast" id="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const ADMINS=['javi@casapepe.mx','camicarva119@gmail.com','hola.puebla@casapepe.mx','administracion@casapepe.mx','contabilidad@casapepe.mx'];
const ALL_ASIS=['hola.puebla@casapepe.mx'];
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=d=>d?new Date(d).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—';
let ME='',JEFES=[{jefe_email:'housekeeping.cdmx@casapepe.mx',area_key:'limpieza_cdmx'},{jefe_email:'jhose.mta234@icloud.com',area_key:'limpieza_puebla'}],MY=[],isAdmin=false,allAsis=false,EMP={};
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#23402a':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
function areaKey(area,sede){area=(area||'').toLowerCase();sede=sede||'';
  if(sede==='Puebla')return 'puebla';
  if(sede==='Corp/Admin'){if(area.includes('contab')||area.includes('tesor'))return 'contabilidad';return 'direccion';}
  if(area.includes('front')||area.includes('segur')||area.includes('prevenc'))return 'front_cdmx';
  if(area.includes('recamar')||area.includes('housekeeping')||area.includes('cuartos')||area.includes('limpieza')||area.includes('mantenim'))return ('limpieza_'+(((sede||'')+'').toLowerCase().indexOf('puebla')>=0?'puebla':'cdmx'));
  if(area.includes('experien'))return 'sincretico';
  return 'operativa';}
const inScope=e=>{if(allAsis||isAdmin)return true;const k=areaKey(e.area,e.sede);return MY.includes(k);};

const GROUPS={vacaciones:{subs:[['solicitudes','Solicitudes'],['estado','Estado actual']]},retrasos:{subs:[['validar','Pendientes de validar'],['quincena','Listado quincena']]},contratos:{subs:[['altas','Altas solicitadas'],['emitir','Próximos a emitir']]},briefing:{subs:[['resumen','Resumen'],['temas','Temas']]}};
let GRP='vacaciones',SUBV='solicitudes';
function ensureMainShell(){const m=document.querySelector('main');if(!document.getElementById('subbar')||!document.getElementById('content')){m.innerHTML='<div id="subbar" class="subbar"></div><div id="content"></div>';}}
function renderSubbar(){const sb2=$('subbar');if(!sb2)return;if(GRP==='briefing'){sb2.innerHTML='';return;}sb2.innerHTML=GROUPS[GRP].subs.map(x=>'<button class="subv '+(x[0]===SUBV?'on':'')+'" data-sv="'+x[0]+'">'+x[1]+'</button>').join('');sb2.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{SUBV=b.dataset.sv;renderSubbar();renderContent();});}
function renderContent(){const c=$('content');if(!c)return;if(GRP==='vacaciones'&&SUBV==='solicitudes'){c.innerHTML='<div id="solic"><div class="empty">Cargando…</div></div>';loadSolic();}else if(GRP==='vacaciones'&&SUBV==='estado'){c.innerHTML='<div id="vacEstado"><div class="empty">Cargando…</div></div>';loadVacEstado();}else if(GRP==='retrasos'&&SUBV==='validar'){c.innerHTML='<div id="asis"><div class="empty">Cargando…</div></div>';loadAsis();}else if(GRP==='retrasos'&&SUBV==='quincena'){c.innerHTML='<div id="retQuin"><div class="empty">Cargando…</div></div>';loadRetrasosQuincena();}else if(GRP==='contratos'&&SUBV==='altas'){c.innerHTML='<div id="altas"><div class="empty">Cargando…</div></div>';loadAltas();}else if(GRP==='contratos'&&SUBV==='emitir'){c.innerHTML='<div id="contEmitir"><div class="empty">Cargando…</div></div>';loadContratosEmitir();}}
function selectGroup(g){GRP=g;SUBV=GROUPS[g].subs[0][0];document.querySelectorAll('#grpTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.g===g));if(g==='briefing'){var s2=$('subbar');if(s2)s2.innerHTML='';if(window.__brf&&window.__brf.activate){window.__brf.activate();}else{ensureMainShell();var cc=$('content');if(cc)cc.innerHTML='<div class="empty">Briefing cargando…</div>';}return;}ensureMainShell();renderSubbar();renderContent();}
document.querySelectorAll('#grpTabs .tab').forEach(t=>t.onclick=()=>selectGroup(t.dataset.g));

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const email=(session&&session.user&&session.user.email||'').toLowerCase();
  if(!email){$('gate').style.display='flex';return;}
  ME=email;$('me').textContent=ME;$('gate').style.display='none';
  const {data:j}=await sb.from('org_jefes').select('*');JEFES=j||[];
  isAdmin=ADMINS.includes(ME);allAsis=ALL_ASIS.includes(ME);
  MY=JEFES.filter(x=>(x.jefe_email||'').toLowerCase()===ME).map(x=>x.area_key);
  $('scope').textContent=(allAsis||isAdmin)?'· ves todo':(MY.length?('· '+MY.join(', ')):'· tu equipo');
  await loadEmployees(); loadSolic(); loadAsis(); loadAltas(); selectGroup('vacaciones');
}
$('lbtn').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});if(error){$('lerr').textContent=error.message;return;}boot();};

async function loadEmployees(){const {data}=await sb.from('employees').select('id,nombre,apellido,puesto,area,sede');(data||[]).forEach(e=>EMP[e.id]=e);}
const persona=r=>{const e=EMP[r.employee_id]||{};return (e.nombre||r.nombre_display||'—')+(e.apellido?(' '+e.apellido):'');};
const areaDe=r=>{const e=EMP[r.employee_id]||{};return (e.area||'')+(e.sede?(' · '+e.sede):'');};

// ---- 1) SOLICITUDES (vacaciones y otras) ----
async function loadSolic(){
  const {data}=await sb.from('incidencias').select('*').eq('resuelto',false).not('tipo','in','(alta_colaborador,validacion_asistencia)').order('created_at',{ascending:false});
  let rows=(data||[]).filter(r=>{const e=EMP[r.employee_id]||{};return (allAsis||isAdmin)?true:inScope(e);});
  {const _cs=$('c-solic');if(_cs)_cs.textContent=rows.length;}
  const c=$('solic'); if(!c)return;
  if(!rows.length){c.innerHTML='<div class="empty">Sin solicitudes pendientes 🎉</div>';return;}
  c.innerHTML=rows.map((r,i)=>{const md=r.metadata||{};
    return `<div class="item" data-i="${i}"><div class="top"><span class="nm">${esc(persona(r))}</span>
      <span class="pill g">${esc(r.tipo)}</span><span class="pill">${esc(areaDe(r))}</span></div>
      <div class="det">${esc(r.descripcion||'')}</div>
      ${md.inicio?`<div class="det">📅 ${esc(md.inicio)} → ${esc(md.fin||'')} · ${esc(md.dias||'')} día(s) · estado: ${esc(md.estado||'')}</div>`:''}
      <div class="acts"><button class="btn ok" data-a="aprobar">Aprobar</button><button class="btn no" data-a="rechazar">Rechazar</button></div></div>`;
  }).join('');
  c.querySelectorAll('.item').forEach(it=>{const r=rows[+it.dataset.i];it.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>resolverSolic(r,b.dataset.a,it));});
}
async function resolverSolic(r,a,it){
  const resp=prompt(a==='aprobar'?'Mensaje para el colaborador (se le mostrará en SoyPepe · opcional):':'Motivo del rechazo (se le mostrará al colaborador):','');
  if(resp===null) return; // canceló
  const respTxt=(resp||'').trim()||null;
  const md=Object.assign({},r.metadata||{},{estado:a==='aprobar'?'aprobada':'rechazada',resuelto_por:ME,respuesta:respTxt});
  const {error}=await sb.from('incidencias').update({resuelto:true,metadata:md}).eq('id',r.id);
  if(error)return toast('Error: '+error.message,false);
  // Sincroniza la solicitud de vacaciones y descuenta saldo si se aprueba
  if(r.tipo==='vacaciones' && md.inicio){
    try{
      const nuevo=a==='aprobar'?'aprobada':'rechazada';
      const {data:solRows}=await sb.from('vacaciones_solicitudes').select('id,saldo_id,dias_solicitados,estado').eq('employee_id',r.employee_id).eq('fecha_inicio',md.inicio).eq('fecha_fin',md.fin).in('estado',['pendiente','pre_aprobada']);
      const sol=(solRows||[])[0];
      if(sol){
        // El trigger vac_aprobada_sync descuenta el saldo y pinta 'Vacaciones' en horarios automáticamente
        await sb.from('vacaciones_solicitudes').update({estado:nuevo,respuesta:respTxt,resuelto_at:new Date().toISOString()}).eq('id',sol.id);
      }else{ toast('Ojo: no encontré la solicitud ligada en vacaciones — revisa RH.',false); }
    }catch(e){ toast('Incidencia resuelta, pero no se sincronizó vacaciones: '+e.message,false); }
  }
  it.style.opacity=.4;it.querySelectorAll('button').forEach(b=>b.disabled=true);toast(a==='aprobar'?'Aprobada ✓':'Rechazada');
  $('c-solic').textContent=Math.max(0,(+$('c-solic').textContent||1)-1);
}

// ---- 2) RETRASOS / FALTAS (validaciones de asistencia) ----
async function loadAsis(){
  const desde=new Date(Date.now()-14*864e5).toISOString().slice(0,10);
  // Solo quien llegó tarde (retardo) o no checó a su hora (falta) — no listamos a quien checó bien.
  const {data,error}=await sb.from('asistencias').select('*').gte('fecha',desde).in('estatus',['retardo','falta']).order('fecha',{ascending:false});
  if(error){const _ae=$('asis');if(_ae)_ae.innerHTML='<div class="empty">Error: '+error.message+'</div>';return;}
  let rows=(data||[]).filter(r=>{if(r.validado_por)return false;if(r.requiere_validacion&&r.validacion_estatus&&r.validacion_estatus!=='pendiente')return false;const e=EMP[r.employee_id]||{};return inScope(e);});
  {const _cs=$('c-asis');if(_cs)_cs.textContent=rows.length;}
  const c=$('asis'); if(!c)return;
  if(!rows.length){c.innerHTML='<div class="empty">Sin retrasos ni faltas por validar 🎉</div>';return;}
  c.innerHTML=rows.map((r,i)=>{const esFalta=(r.estatus==='falta')||!r.check_in;
    const etq=esFalta?'No checó / falta':('Retardo '+(r.minutos_retraso||0)+' min');
    return `<div class="item" data-i="${i}"><div class="top"><span class="nm">${esc(persona(r))}</span>
      <span class="pill ${esFalta?'s':'r'}">${etq}</span>
      <span class="pill">${esc(areaDe(r))}</span></div>
      <div class="det">${esc(r.fecha)} · turno ${esc(r.hora_turno||'—')}–${esc(r.salida_turno||'—')} · entrada ${hhmm(r.check_in)} · salida ${hhmm(r.check_out)}</div>
      <div class="acts"><button class="btn ok" data-a="hora">Validar a la hora</button><button class="btn warn" data-a="retardo">Validar con retardo</button><button class="btn no" data-a="rechazar">Rechazar (falta)</button></div></div>`;
  }).join('');
  c.querySelectorAll('.item').forEach(it=>{const r=rows[+it.dataset.i];it.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>validar(r,b.dataset.a,it));});
}
async function validar(r,a,it){
  let upd={validado_por:ME,validado_at:new Date().toISOString(),requiere_validacion:false};
  if(a==='hora'){upd.validacion_estatus='aprobado';upd.estatus='a_tiempo';upd.minutos_retraso=0;if(!r.check_in&&r.hora_turno)upd.check_in=r.fecha+'T'+r.hora_turno;}
  else if(a==='retardo'){upd.validacion_estatus='aprobado';upd.estatus='retardo';if(!r.check_in&&r.hora_turno)upd.check_in=r.fecha+'T'+r.hora_turno;}
  else {upd.validacion_estatus='rechazado';upd.estatus='falta';}
  const {error}=await sb.from('asistencias').update(upd).eq('id',r.id);
  if(error)return toast('Error: '+error.message,false);
  try{await sb.from('incidencias').update({resuelto:true}).eq('tipo','validacion_asistencia').eq('metadata->>asistencia_id',r.id);}catch(e){}
  it.style.opacity=.4;it.querySelectorAll('button').forEach(b=>b.disabled=true);toast(a==='rechazar'?'Marcado falta':'Validado ✓');
  $('c-asis').textContent=Math.max(0,(+$('c-asis').textContent||1)-1);
}

// ---- 3) ALTAS DE COLABORADORES (pipeline con etapas, ? y links) ----
const ALTA_ETAPAS=[['solicitada','Solicitada'],['info_recibida','Info recibida'],['activa','ID · Activa'],['aceptada','Contrato'],['notificada','Notificada'],['expediente','Expediente'],['integrada','Integrada']];
const ALTA_PROP={'45e69775-d877-4507-a9e1-a45bd3400dc5':'CDMX','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'Virreyes','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'Puebla','fde2f615-2c65-40fa-9df3-6336b5ab312c':'Corp'};
const ALTA_HELP={solicitada:'El colaborador (en SoyPepe) o un admin (botón + Alta) inició la solicitud de alta.',info_recibida:'El candidato subió su información personal y documentos (contrato, INE, RFC, NSS, comprobantes).',activa:'El sistema generó el ID fijo del colaborador en ID maestro y lo marcó como activo. Debe existir en ID maestro ANTES de poder generar o editar el contrato.',aceptada:'Con el ID ya creado, se genera el contrato desde el machote (editable y firmable) y se manda a firma del trabajador.',notificada:'Se envió la notificación de bienvenida al colaborador por SoyPepe.',expediente:'La información se cargó al expediente y demás sábanas (Base, Nómina).',integrada:'El colaborador ya aparece en horarios y queda cableado (login, accesos, PepeQuiz).'};
const altaIdx=et=>{const i=ALTA_ETAPAS.findIndex(x=>x[0]===et);return i<0?0:i;};
const altaUbic=e=>(['CDMX','Puebla','Virreyes','Corp'].includes(e.sede)?e.sede:(ALTA_PROP[e.property_id]||e.sede||'—'));
function altaLink(et,e,docs,notif){
  if(et==='info_recibida'){const d=Object.entries(docs||{});return d.length?d.map(([k,p])=>`<button class="btn lnk" data-doc="${esc(p)}">📄 ${esc(k)}</button>`).join(' '):'<span class="muted">sin documentos</span>';}
  if(et==='aceptada')return `<a class="btn lnk" href="/m/contratos.html?emp=${e.id}">Generar / editar contrato →</a>`;
  if(et==='expediente')return `<a class="btn lnk" href="/m/rh-expediente.html" target="_blank">Abrir expediente →</a>`;
  if(et==='activa')return e.empleado_id?`<span class="pill">ID: ${esc(e.empleado_id)}</span>`:'<span class="muted">ID al activar</span>';
  if(et==='notificada')return notif?`<span class="muted">🔔 ${esc(notif)}</span>`:'<span class="muted">se envía al avanzar</span>';
  if(et==='integrada')return `<a class="btn lnk" href="/m/rh-horario.html" target="_blank">Ver horario →</a>`;
  return '';
}
async function loadAltas(){
  const puedeAltas=isAdmin||MY.length>0;
  if(!puedeAltas){const _c1=$('c-altas');if(_c1)_c1.textContent='0';const _a1=$('altas');if(_a1)_a1.innerHTML='<div class="empty">Solo administración gestiona altas.</div>';return;}
  const {data:emps}=await sb.from('employees').select('id,empleado_id,nombre,nombre_display,email,sede,area,property_id,estatus,alta_etapa,alta_historial,puesto').not('alta_etapa','is',null);
  const {data:incs}=await sb.from('incidencias').select('metadata').eq('tipo','alta_colaborador');
  const {data:nots}=await sb.from('notificaciones').select('employee_id,cuerpo,created_at').ilike('titulo','%ienvenid%').order('created_at',{ascending:false});
  const docsByEmail={};(incs||[]).forEach(r=>{const m=r.metadata||{};if(m.email)docsByEmail[(m.email||'').toLowerCase()]=m.docs||{};});
  const notByEmp={};(nots||[]).forEach(n=>{if(n.employee_id&&!notByEmp[n.employee_id])notByEmp[n.employee_id]=n.cuerpo;});
  let rows=(emps||[]).filter(e=>e.alta_etapa!=='integrada'&&(isAdmin||inScope({area:e.area||'',sede:e.sede}))).sort((a,b)=>altaIdx(a.alta_etapa)-altaIdx(b.alta_etapa));
  {const _cs=$('c-altas');if(_cs)_cs.textContent=rows.length;}
  const c=$('altas'); if(!c)return;
  if(!rows.length){c.innerHTML='<div class="empty">Sin altas en proceso 🎉</div>';return;}
  c.innerHTML=rows.map(e=>{const ci=altaIdx(e.alta_etapa);const nxt=ALTA_ETAPAS[ci+1];const docs=docsByEmail[(e.email||'').toLowerCase()]||{};const notif=notByEmp[e.id];
    const steps=ALTA_ETAPAS.map((x,j)=>`<span class="apaso ${j<ci?'done':(j===ci?'cur':'')}">${j<ci?'✓':'○'} ${x[1]}</span>`).join(' › ');
    const det=ALTA_ETAPAS.map((x,j)=>{const cls=j<ci?'done':(j===ci?'cur':'');const st=j<ci?'✓':(j===ci?'●':'○');
      return `<div class="arow ${cls}"><span class="ast">${st}</span><b>${x[1]}</b><span class="help2" title="${esc(ALTA_HELP[x[0]]||'')}">?</span>${altaLink(x[0],e,docs,notif)}</div>`;}).join('');
    return `<div class="item" data-id="${e.id}">
      <div class="top"><span class="nm">${esc(e.nombre||e.nombre_display||'—')}</span>
      <span class="pill g">${esc(altaUbic(e))}</span><span class="pill">${esc(e.empleado_id||'sin ID')}</span>
      <span class="pill">${esc(e.puesto||'puesto pendiente')}</span></div>
      <div class="det">${steps}</div>
      <div class="acts">${nxt?`<button class="btn ok" data-go="${e.id}">Avanzar a: ${nxt[1]} →</button>`:'<span style="color:var(--green);font-weight:700">✓ Integrada</span>'}<button class="btn warn" data-det="${e.id}">Editar etapas / docs ▾</button>${ci>0?`<button class="btn" data-rev="${e.id}" data-prev="${ALTA_ETAPAS[ci-1][0]}">↩ Revertir a: ${ALTA_ETAPAS[ci-1][1]}</button>`:''}<button class="btn" data-cancel="${e.id}" style="color:#b03434;border-color:#e0b3b3">✕ Cancelar alta</button></div>
      <div class="adet" id="ad-${e.id}">${det}</div></div>`;
  }).join('');
  c.querySelectorAll('[data-det]').forEach(b=>b.onclick=()=>$('ad-'+b.dataset.det).classList.toggle('show'));
  c.querySelectorAll('[data-doc]').forEach(b=>b.onclick=async()=>{const {data,error}=await sb.storage.from('altas-nuevas').createSignedUrl(b.dataset.doc,120);if(error||!data){toast('No se pudo abrir el doc',false);return;}window.open(data.signedUrl,'_blank');});
  c.querySelectorAll('[data-go]').forEach(b=>b.onclick=async()=>{b.disabled=true;toast('Avanzando…');const {error}=await sb.rpc('alta_avanzar',{p_id:b.dataset.go});if(error){b.disabled=false;return toast('No se pudo: '+error.message,false);}toast('Etapa avanzada ✓');loadAltas();});
  c.querySelectorAll('[data-rev]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Revertir a la etapa anterior?'))return;b.disabled=true;const {error}=await sb.rpc('revertir_alta',{p_id:b.dataset.rev,p_etapa:b.dataset.prev});if(error){b.disabled=false;return toast('No se pudo: '+error.message,false);}toast('Etapa revertida ✓');loadAltas();});
  c.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Cancelar esta alta? Sale del proceso (no se borra).'))return;b.disabled=true;const {error}=await sb.rpc('cancelar_alta',{p_id:b.dataset.cancel});if(error){b.disabled=false;return toast('No se pudo: '+error.message,false);}toast('Alta cancelada ✓');loadAltas();});
}

async function loadVacEstado(){
  const c=$('vacEstado'); if(!c)return;
  const hoy=new Date().toISOString().slice(0,10);
  let saldos=[],sols=[];
  try{ const r=await sb.from('vacaciones_saldo').select('*'); saldos=r.data||[]; }catch(e){}
  try{ const r=await sb.from('vacaciones_solicitudes').select('*').eq('estado','aprobada').gte('fecha_fin',hoy).order('fecha_inicio',{ascending:true}); sols=r.data||[]; }catch(e){}
  const vis=id=>isAdmin||allAsis||inScope(EMP[id]||{});
  saldos=saldos.filter(x=>vis(x.employee_id));
  sols=sols.filter(x=>vis(x.employee_id));
  const dEntre=d=>{try{return Math.ceil((new Date(d)-new Date(hoy))/864e5);}catch(_){return 999;}};
  const planHTML=sols.length?('<table class="tbl"><thead><tr><th>Colaborador</th><th>Área</th><th>Desde</th><th>Hasta</th><th>Días</th><th>Faltan</th></tr></thead><tbody>'+sols.map(x=>{const dd=dEntre(x.fecha_inicio);const cls=dd<=7?'warn3':'';return `<tr class="${cls}"><td>${esc(persona(x))}</td><td>${esc(areaDe(x))}</td><td>${esc(x.fecha_inicio)}</td><td>${esc(x.fecha_fin)}</td><td>${esc(x.dias_solicitados||'')}</td><td>${dd<0?'en curso':(dd+' d')}</td></tr>`;}).join('')+'</tbody></table>'):'<div class="empty">Sin ausencias planeadas.</div>';
  const sv=saldos.filter(x=>x.estado==='vigente').sort((a,b)=>String(a.fecha_fin_periodo).localeCompare(String(b.fecha_fin_periodo)));
  const saldoHTML=sv.length?('<table class="tbl"><thead><tr><th>Colaborador</th><th>Área</th><th>Corresponden</th><th>Tomados</th><th>Pendientes</th><th>Vence</th></tr></thead><tbody>'+sv.map(x=>{const vd=dEntre(x.fecha_fin_periodo);const pend=+x.dias_pendientes||0;const cls=(pend>0&&vd<=60)?'warn3':'';return `<tr class="${cls}"><td>${esc(persona(x))}</td><td>${esc(areaDe(x))}</td><td>${esc(x.dias_corresponden||0)}</td><td>${esc(x.dias_tomados||0)}</td><td><b>${pend}</b></td><td>${esc(x.fecha_fin_periodo||'')}${(pend>0&&vd<=60)?' ⚠':''}</td></tr>`;}).join('')+'</tbody></table>'):'<div class="empty">Sin saldos vigentes.</div>';
  c.innerHTML='<div class="item"><div class="nm">🗓️ Próximas ausencias planeadas</div><div class="det">Vacaciones aprobadas y aún no tomadas — para proyectar coberturas (quién se va y cuándo).</div>'+planHTML+'</div>'
    +'<div class="item"><div class="nm">💼 Saldos de vacaciones</div><div class="det">Días que corresponden, tomados, pendientes y vencimiento del periodo. ⚠ = vence pronto con días sin tomar. Clic en encabezado para ordenar.</div>'+saldoHTML+'</div>';
  if(window.tablekit)window.tablekit();
}
async function loadRetrasosQuincena(){
  const c=$('retQuin'); if(!c)return;
  const now=new Date(); const y=now.getFullYear(); const m=String(now.getMonth()+1).padStart(2,'0'); const q=now.getDate()<=15?'Q1':'Q2';
  const quincena=y+'-'+m+'-'+q;
  let data=[];
  try{ const r=await sb.from('asistencias').select('employee_id,estatus,fecha,minutos_retraso').eq('quincena',quincena).in('estatus',['retardo','falta']); data=r.data||[]; }catch(e){}
  const agg={};
  data.forEach(r=>{ if(!(isAdmin||allAsis||inScope(EMP[r.employee_id]||{})))return; const a=agg[r.employee_id]||(agg[r.employee_id]={ret:0,fal:0,min:0,faltas:[]}); if(r.estatus==='retardo'){a.ret++;a.min+=(r.minutos_retraso||0);} else {a.fal++;a.faltas.push(r.fecha);} });
  let rows=Object.keys(agg).map(id=>Object.assign({employee_id:id},agg[id])).sort((a,b)=>(b.ret+b.fal)-(a.ret+a.fal)||b.ret-a.ret);
  const tabla=rows.length?('<table class="tbl"><thead><tr><th>Colaborador</th><th>Área</th><th>Retardos</th><th>Min. acum.</th><th>Faltas</th></tr></thead><tbody>'+rows.map(r=>{const cls=r.ret>=3?'bad':(r.ret>0?'warn3':'');return `<tr class="${cls}"><td>${esc(persona(r))}</td><td>${esc(areaDe(r))}</td><td><b>${r.ret}</b>${r.ret>=3?' 🚩':''}</td><td>${r.min}</td><td>${r.fal?('<b>'+r.fal+'</b>'):'0'}</td></tr>`;}).join('')+'</tbody></table>'):'<div class="empty">Sin retardos ni faltas en la quincena 🎉</div>';
  const faltasList=rows.filter(r=>r.fal>0).map(r=>`<div class="arow"><b>${esc(persona(r))}</b> · ${r.faltas.map(esc).join(', ')}</div>`).join('');
  c.innerHTML='<div class="item"><div class="top"><span class="nm">⏱️ Retardos y faltas · quincena '+esc(quincena)+'</span></div><div class="det">Regla: máximo <b>3 retardos</b> por quincena. 🚩 = alcanzó o superó el límite. Clic en un encabezado para ordenar de más a menos.</div>'+tabla+'</div>'
    +(faltasList?('<div class="item"><div class="nm">🚫 Faltas de la quincena</div>'+faltasList+'</div>'):'');
  if(window.tablekit)window.tablekit();
}
async function loadContratosEmitir(){
  const c=$('contEmitir'); if(!c)return;
  let emps=[],cons=[];
  try{ const r=await sb.from('employees').select('id,empleado_id,nombre,nombre_display,area,sede,property_id,alta_etapa,puesto').in('alta_etapa',['activa','aceptada']); emps=r.data||[]; }catch(e){}
  try{ const r=await sb.from('contratos').select('employee_id,estatus'); cons=r.data||[]; }catch(e){}
  const firmado={}; cons.forEach(k=>{ if(k.estatus==='firmado') firmado[k.employee_id]=true; });
  let rows=(emps||[]).filter(e=>!firmado[e.id] && (isAdmin||inScope({area:e.area||'',sede:e.sede})));
  if(!rows.length){c.innerHTML='<div class="empty">No hay contratos próximos por emitir 🎉</div>';return;}
  c.innerHTML='<div class="det" style="margin-bottom:8px">Colaboradores con ID activo cuyo contrato aún no está firmado. El botón abre <b>Contratos & Aceptación</b> (la misma página) para editar y enviar — sin funciones duplicadas.</div>'+rows.map(e=>{const et=(e.alta_etapa==='aceptada'?'En contrato':'Listo para contrato');
    return `<div class="item"><div class="top"><span class="nm">${esc(e.nombre||e.nombre_display||'—')}</span><span class="pill g">${esc(altaUbic(e))}</span><span class="pill">${esc(e.empleado_id||'sin ID')}</span><span class="pill">${esc(e.puesto||'')}</span><span class="pill s">${et}</span></div><div class="acts"><a class="btn lnk" href="/m/contratos.html?emp=${e.id}">→ Editar / emitir contrato</a></div></div>`;}).join('');
}

<script>
(function(){
 var SBU='https://rehophywchakfapivsbh.supabase.co';
 var PK='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
 var EP=SBU+'/functions/v1/briefing';
 var ACC=null,BRF=null,EDIT=false,SUB='resumen';
 var SEC=[['ventas','📈 Ventas vs objetivo y AA'],['tours','🎟️ Tours, experiencias y movimiento'],['satisfaccion','⭐ Satisfacción y comentarios'],['personal','🧑‍🤝‍🧑 Personal (asistencias, altas/bajas)'],['renovaciones','📝 Renovaciones próximas'],['mantenimiento','🔧 Mantenimiento'],['atenciones','✅ Atención y trabajos resueltos'],['eventos','📅 Eventos del calendario']];
 var AAL=[['rh_admin','RH / Admin'],['revenue','Revenue management'],['ayb','A&B'],['experiencias','Experiencias / Sincrético'],['mantenimiento','Mantenimiento']];
 function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}
 function tok(){try{var raw=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(!raw)return null;var o=JSON.parse(raw);var s=(o&&o.access_token)?o:((o&&(o.currentSession||o.session))||o);return (s&&s.access_token)?s.access_token:null;}catch(e){return null;}}
 async function api(action,extra){var t=tok();if(!t)throw new Error('sin sesion');var r=await fetch(EP,{method:'POST',headers:{'Content-Type':'application/json','apikey':PK,'Authorization':'Bearer '+t},body:JSON.stringify(Object.assign({action:action},extra||{}))});return await r.json();}
 function tabs(){return document.querySelector('.tabs');}
 function main(){return document.querySelector('main')||document.body;}
 function activate(){SUB='resumen';BRF=null;renderMain();}
 function subbar(){var arr=[['resumen','Resumen'],['temas','Temas']];
  return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px">'+arr.map(function(p){return '<button data-bf="sub" data-k="'+p[0]+'" style="background:'+(SUB===p[0]?'#1d9e75':'transparent')+';color:'+(SUB===p[0]?'#04140d':'inherit')+';border:1px solid #2c5345;border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-weight:'+(SUB===p[0]?'600':'400')+'">'+p[1]+'</button>';}).join('')+'</div>';}
 function renderMain(){var m=main();m.innerHTML=subbar()+'<div id="bf-body" style="max-width:900px"><div style="opacity:.6;padding:20px">Cargando…</div></div>';renderBody();}
 async function renderBody(){var b=document.getElementById('bf-body');if(!b)return;
  if(SUB==='resumen'){if(!BRF){try{BRF=(await api('resumen')).briefing;}catch(e){b.innerHTML='Error';return;}}b.innerHTML=BRF?secHTML():'<div style="opacity:.6;padding:20px">Aún no hay resumen. <button class=bfbtn data-bf="regen">Generar ahora</button></div>';}
  else if(SUB==='alertas'){if(!BRF){try{BRF=(await api('resumen')).briefing;}catch(e){}}b.innerHTML=alHTML();}
  else if(SUB==='temas'){try{b.innerHTML=temasHTML((await api('temas_list')).temas||[]);}catch(e){b.innerHTML='Error';}}
  else if(SUB==='salarios'){try{var j=await api('salarios_list');b.innerHTML=j.ok?salHTML(j.colaboradores||[]):'<div style="opacity:.6;padding:20px">No autorizado</div>';}catch(e){b.innerHTML='Error';}}}
 function secHTML(){var r=(BRF&&BRF.resumen)||{};
  var head='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px"><div><b>Resumen semanal</b> <span style="opacity:.6">'+esc(BRF?(BRF.semana_inicio+' → '+BRF.semana_fin):'')+'</span><div style="opacity:.55;font-size:12px">'+(BRF&&BRF.editado?('Editado'+(BRF.editado_por?(' por '+esc(BRF.editado_por)):'')):('Generado: '+esc(BRF?BRF.generado_por:'')))+'</div></div><div style="display:flex;gap:6px">'+(ACC.es_direccion?('<button class=bfbtn2 data-bf="edit">'+(EDIT?'Cancelar':'✏️ Editar')+'</button>'+(EDIT?'<button class=bfbtn data-bf="save">Guardar</button>':'')+'<button class=bfbtn2 data-bf="regen">↻ Regenerar</button>'):'')+'</div></div>';
  var body=SEC.map(function(p){var d=r[p[0]]||{};var t=d.texto||'—';var nota=d.nota?'<div style="color:#d8b24a;font-size:11px;margin-top:4px">⚠ fuente por conectar — edítalo a mano</div>':'';var inner=EDIT?('<textarea id="bf-ed-'+p[0]+'" class=bfta>'+esc(t)+'</textarea>'):('<div style="white-space:pre-wrap;line-height:1.45">'+esc(t)+'</div>');return '<div class=bfc><div style="font-weight:600;font-size:13px;opacity:.9;margin-bottom:4px">'+p[1]+'</div>'+inner+nota+'</div>';}).join('');
  return head+body;}
 function alHTML(){var al=(BRF&&BRF.alertas)||{};return AAL.map(function(p){var arr=al[p[0]]||[];var items=arr.length?arr.map(function(a){return '<div style="border-left:3px solid '+((a.severidad==='alta')?'#e0533b':'#d8b24a')+';padding:6px 10px;margin:6px 0;background:#0000001a;border-radius:6px;font-size:13px">'+esc(a.texto)+' <span style="opacity:.55">'+esc((a.quien?(a.quien+' · '):'')+(a.fecha||''))+'</span></div>';}).join(''):'<div style="opacity:.55">Sin alertas.</div>';return '<div class=bfc><div style="font-weight:600;font-size:13px;margin-bottom:4px">'+p[1]+'</div>'+items+'</div>';}).join('');}
 function temasHTML(list){var opts=AAL.concat([['direccion','Dirección'],['operativa','Operativa'],['otros','Otra']]).map(function(p){return '<option value="'+p[0]+'">'+p[1]+'</option>';}).join('');
  var form='<div class=bfc><div style="font-weight:600;font-size:13px;margin-bottom:6px">Subir "Tema para briefing"</div><div style="display:flex;gap:8px;flex-wrap:wrap"><select id=bf-t-area class=bfin style="flex:1;min-width:140px">'+opts+'</select><select id=bf-t-bloque class=bfin style="flex:1;min-width:140px"><option value=tema>Tema</option><option value=resumen>Para el Resumen</option><option value=alerta>Alerta</option></select></div><input id=bf-t-tema class=bfin placeholder="Título del tema" style="margin-top:6px;width:100%"><textarea id=bf-t-cont class=bfta placeholder="Detalle…" style="margin-top:6px"></textarea><div style="margin-top:6px"><button class=bfbtn data-bf="addtema">Subir tema</button></div></div>';
  var items=(list&&list.length)?list.map(function(t){return '<div class=bfc><div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><b>'+esc(t.tema||'(sin título)')+'</b><span style="opacity:.55;font-size:12px">'+esc((t.area||'')+' · '+(t.bloque||'')+' · '+(t.fecha||''))+'</span></div>'+(t.contenido?'<div style="white-space:pre-wrap;line-height:1.4;margin-top:4px">'+esc(t.contenido)+'</div>':'')+'<div style="opacity:.55;font-size:12px;margin-top:4px">'+esc(t.autor||'')+'</div></div>';}).join(''):'<div style="opacity:.55;padding:8px">Aún no hay temas.</div>';
  return form+items;}
 function salHTML(list){var rows=(list&&list.length)?list.map(function(c){return '<tr><td style="padding:6px;border-bottom:1px solid #ffffff14">'+esc(c.nombre_display||c.nombre||'')+'<div style="opacity:.55;font-size:12px">'+esc((c.puesto||'')+' · '+(c.area||'')+' · '+(c.sede||''))+'</div></td><td style="padding:6px;border-bottom:1px solid #ffffff14;width:170px"><div style="display:flex;gap:6px"><input id="bf-sal-'+c.id+'" class=bfin type=number value="'+(c.salario_bruto!=null?c.salario_bruto:'')+'" style="width:110px"><button class=bfbtn2 data-bf="setsal" data-id="'+c.id+'">✔</button></div></td></tr>';}).join(''):'<tr><td style="opacity:.55;padding:6px">Sin colaboradores.</td></tr>';
  return '<div class=bfc><div style="font-weight:600;font-size:13px">Salarios e info de colaboradores</div><div style="opacity:.55;font-size:12px;margin-bottom:6px">Solo dirección y Roberto · salario bruto mensual.</div><table style="width:100%;border-collapse:collapse;font-size:13px"><tr><th style="text-align:left;padding:6px;border-bottom:1px solid #ffffff22">Colaborador</th><th style="text-align:left;padding:6px;border-bottom:1px solid #ffffff22">Salario bruto</th></tr>'+rows+'</table></div>';}
 async function doRegen(){var b=document.getElementById('bf-body');if(b)b.innerHTML='<div style="opacity:.6;padding:20px">Regenerando…</div>';try{BRF=(await api('generar')).briefing;SUB='resumen';renderMain();}catch(e){alert('Error');}}
 async function doSave(){var r={};SEC.forEach(function(p){var ta=document.getElementById('bf-ed-'+p[0]);if(ta)r[p[0]]=Object.assign({},(BRF.resumen&&BRF.resumen[p[0]])||{},{texto:ta.value});});try{await api('resumen_guardar',{semana_inicio:BRF.semana_inicio,resumen:r});BRF.resumen=r;BRF.editado=true;EDIT=false;renderBody();}catch(e){alert('No se pudo guardar');}}
 async function doAddTema(){var area=document.getElementById('bf-t-area').value,bloque=document.getElementById('bf-t-bloque').value,tema=document.getElementById('bf-t-tema').value.trim(),cont=document.getElementById('bf-t-cont').value.trim();if(!tema&&!cont){alert('Escribe el tema');return;}try{await api('tema_add',{area:area,bloque:bloque,tema:tema,contenido:cont});SUB='temas';renderMain();}catch(e){alert('No se pudo subir');}}
 async function doSetSal(id){var inp=document.getElementById('bf-sal-'+id);var v=Number(inp.value);if(!isFinite(v)){alert('Monto inválido');return;}inp.disabled=true;try{await api('salario_set',{employee_id:id,salario_bruto:v});inp.style.borderColor='#1d9e75';}catch(e){alert('No se pudo');}finally{inp.disabled=false;}}
