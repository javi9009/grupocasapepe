<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Incidencias · Casa Pepe</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}.muted{color:var(--muted);font-size:12px}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px 9px 0 0;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;position:relative}
  .tab.on{color:var(--gold2);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
  .tab .cnt{display:inline-block;min-width:18px;text-align:center;background:#3a2c12;color:var(--gold2);border-radius:10px;font-size:11px;padding:0 5px;margin-left:5px}
  main{padding:14px 16px 60px;max-width:920px;margin:0 auto}
  .sec{display:none}.sec.on{display:block}
  .item{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
  .item .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .item .nm{font-weight:600;font-size:15px}
  .pill{font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted)}
  .pill.r{color:#e6bfbf;border-color:#5a2f2a}.pill.s{color:#cdb4e0;border-color:#4a3a5a}.pill.g{color:#bfe6c4;border-color:#2f5a35}
  .det{color:var(--muted);font-size:12.5px;margin:6px 0 10px}
  .apaso{color:var(--muted)}.apaso.done{color:var(--green)}.apaso.cur{color:var(--gold2);font-weight:700}
  .adet{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;display:none}.adet.show{display:block}
  .arow{font-size:12.5px;padding:5px 0;color:var(--muted);display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px dashed #2a2014}
  .arow b{color:var(--txt);font-weight:600}.arow.cur b{color:var(--gold2)}.arow.done .ast{color:var(--green)}
  .ast{width:16px;text-align:center;font-weight:700}
  .help2{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#3a2c12;color:var(--gold2);font-size:10px;font-weight:700;cursor:help}
  .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:4px 14px;margin:6px 0 10px;font-size:12.5px}
  .kv span b{color:var(--txt)}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .btn{border:0;border-radius:8px;padding:8px 12px;font-weight:600;cursor:pointer;font-size:12px}
  .btn.ok{background:#23402a;color:#bfe6c4;border:1px solid #3f6043}
  .btn.warn{background:#3a2c12;color:var(--gold2);border:1px solid #5a431f}
  .btn.no{background:#3a2a2a;color:#e6bfbf;border:1px solid #5a2f2a}
  .btn.lnk{background:var(--panel2);color:var(--blue);border:1px solid var(--line)}
  .empty{text-align:center;color:var(--muted);padding:46px}
  .subbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .subv{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:12.5px;font-weight:600}
  .subv.on{background:var(--gold);color:#1a1206;border-color:var(--gold)}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px}
  .tbl th{text-align:left;padding:8px;border-bottom:1px solid var(--line);color:var(--gold2);font-weight:600;white-space:nowrap}
  .tbl td{padding:8px;border-bottom:1px solid #2a2014;vertical-align:top}
  .tbl tr.warn3 td{background:#3a2c1226}.tbl tr.bad td{background:#3a2a2a33}.tbl tr.rneg td{background:#00000055}
  .tj{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
  .tj-ama{background:#3a2c12;color:#f0c674;border:1px solid #5a431f}.tj-roj{background:#3a2a2a;color:#e6bfbf;border:1px solid #5a2f2a}.tj-neg{background:#0c0c0c;color:#f3ead9;border:1px solid #555}.tj-ok{color:var(--muted)}
  .tblwrap{overflow-x:auto}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:320px;width:90%;text-align:center}
  .gate h2{color:var(--gold2);margin:0 0 10px}.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:10px}
  .gate .err{color:var(--red);font-size:12px;min-height:14px}.gate button{width:100%;background:var(--gold);color:#1a1206;border:0;border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23402a;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60}.toast.show{opacity:1}

  .rq{background:var(--panel2,#221d16);border:1px solid var(--line,#34291c);border-radius:12px;padding:12px 14px;margin:0 0 14px}
  .rqh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .rqh b{font-size:14px;color:var(--txt,#f3ead9)}
  .rq .mut{color:var(--muted,#a99a82);font-size:12px;font-weight:400}
  .rqt{width:100%;border-collapse:collapse;font-size:12.5px}
  .rqt th{text-align:left;color:var(--muted,#a99a82);font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line,#34291c);white-space:nowrap}
  .rqt td{padding:5px 8px;border-bottom:1px solid rgba(255,255,255,.05)}
  .rqt td.ar{color:var(--muted,#a99a82);font-size:11.5px}
  .rqt td.n{text-align:right;font-variant-numeric:tabular-nums;font-weight:700}
.tk-head{padding:14px 16px 4px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}.tk-head b{font-size:15px;color:var(--txt,#f3ead9)}.tk-mut{color:var(--muted,#a99a82);font-size:12px}.tk-empty{padding:26px 16px;color:var(--muted,#a99a82);text-align:center}.tk-filters{display:flex;gap:7px;flex-wrap:wrap;padding:10px 16px 2px;align-items:center}.tk-chip{font-size:12px;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--line,#34291c);background:transparent;color:var(--muted,#a99a82);cursor:pointer}.tk-chip.on{background:var(--gold,#d9a441);color:#1a1a1a;border-color:var(--gold,#d9a441)}.tk-list{padding:6px 12px 24px;display:grid;gap:10px}.tk-card{background:var(--panel2,#221d16);border:1px solid var(--line,#34291c);border-radius:12px;padding:12px 14px}.tk-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}.tk-badge{font-size:11.5px;font-weight:700;padding:2px 9px;border-radius:20px;background:rgba(217,164,65,.15);color:#e7c072}.tk-badge.tk-app{background:rgba(106,147,207,.16);color:#9db8e6}.tk-badge.tk-hablar{background:rgba(159,122,234,.16);color:#c3a7ea}.tk-badge.tk-mejora_general{background:rgba(95,174,107,.16);color:#8fd39b}.tk-badge.tk-idea{background:rgba(217,164,65,.16);color:#e7c072}.tk-est{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}.tk-e-nuevo{background:rgba(95,174,107,.16);color:#8fd39b}.tk-e-leido{background:rgba(169,154,130,.16);color:#a99a82}.tk-e-cerrado{background:rgba(169,154,130,.12);color:#b7ab95}.tk-msg{color:var(--txt,#f3ead9);font-size:14px;line-height:1.4;white-space:pre-wrap}.tk-meta{color:var(--muted,#a99a82);font-size:11.5px;margin-top:6px}.tk-ans{margin-top:8px;background:rgba(95,174,107,.08);border-left:3px solid #5fae6b;border-radius:6px;padding:7px 10px}.tk-ans .lbl{color:#8fd39b;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em}.tk-ans .txt{color:var(--txt,#f3ead9);font-size:13px;margin-top:2px;white-space:pre-wrap}.tk-acts{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap}.tk-btn{background:none;border:1px solid var(--line,#34291c);color:var(--muted,#a99a82);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}.tk-btn.primary{background:#1d9e75;border-color:#1d9e75;color:#fff}.tk-btn.danger{border-color:rgba(207,90,90,.5);color:#e59b9b}.tk-reply{margin-top:9px}.tk-reply textarea{width:100%;background:#0f0b16;border:1px solid var(--line,#34291c);border-radius:8px;color:var(--txt,#f3ead9);padding:9px;font:inherit;font-size:13px;min-height:64px;resize:vertical}.tk-reply textarea:focus{outline:none;border-color:#1d9e75}</style>
</head>
<body>
<div class="gate" id="gate" style="display:none"><div class="box"><h2>Incidencias</h2><p class="muted" id="gmsg">Inicia sesión.</p><input type="email" id="lemail" placeholder="correo"><input type="password" id="lpass" placeholder="contraseña"><div class="err" id="lerr"></div><button id="lbtn">Entrar</button></div></div>
<header>
  <div class="brand"><h1>⚠️ Incidencias</h1><span class="muted" id="scope"></span><span class="spacer"></span><span class="muted" id="me"></span></div>
  <div class="tabs" id="grpTabs">
    <button class="tab on" data-g="vacaciones">🏖️ Vacaciones <span class="cnt" id="c-solic">0</span></button>
    <button class="tab" data-g="retrasos">⏱️ Retrasos <span class="cnt" id="c-asis">0</span></button>
    <button class="tab" data-g="contratos">📄 Contratos <span class="cnt" id="c-altas">0</span></button>
    <button class="tab" data-g="briefing">📋 Briefing</button>
  </div>
</header>
<main>
  <div id="subbar" class="subbar"></div>
  <div id="content"><div class="empty">Cargando…</div></div>
</main>
<div class="toast" id="toast"></div>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const ADMINS=['javi@casapepe.mx','camicarva119@gmail.com','hola.puebla@casapepe.mx','administracion@casapepe.mx','contabilidad@casapepe.mx'];
const ALL_ASIS=['hola.puebla@casapepe.mx'];
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=d=>d?new Date(d).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}):'—';
let ME='',JEFES=[{jefe_email:'housekeeping.cdmx@casapepe.mx',area_key:'limpieza_cdmx'},{jefe_email:'jhose.mta234@icloud.com',area_key:'limpieza_puebla'}],MY=[],isAdmin=false,allAsis=false,EMP={};
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#23402a':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}
function areaKey(area,sede){area=(area||'').toLowerCase();sede=sede||'';
  if(sede==='Puebla')return 'puebla';
  if(sede==='Corp/Admin'){if(area.includes('contab')||area.includes('tesor'))return 'contabilidad';return 'direccion';}
  if(area.includes('front')||area.includes('segur')||area.includes('prevenc'))return 'front_cdmx';
  if(area.includes('recamar')||area.includes('housekeeping')||area.includes('cuartos')||area.includes('limpieza')||area.includes('mantenim'))return ('limpieza_'+(((sede||'')+'').toLowerCase().indexOf('puebla')>=0?'puebla':'cdmx'));
  if(area.includes('experien'))return 'sincretico';
  return 'operativa';}
const inScope=e=>{if(allAsis||isAdmin)return true;const k=areaKey(e.area,e.sede);return MY.includes(k);};

const GROUPS={vacaciones:{subs:[['solicitudes','Solicitudes'],['estado','Estado actual']]},retrasos:{subs:[['validar','Pendientes de validar'],['quincena','Listado quincena'],['extra','Salidas tardías'],['puntualidad','Puntualidad (bono)']]},contratos:{subs:[['altas','Altas solicitadas'],['emitir','Próximos a emitir']]},briefing:{subs:[['resumen','Resumen'],['temas','Temas']]}};
let GRP='vacaciones',SUBV='solicitudes';
function ensureMainShell(){const m=document.querySelector('main');if(!document.getElementById('subbar')||!document.getElementById('content')){m.innerHTML='<div id="subbar" class="subbar"></div><div id="content"></div>';}}
function renderSubbar(){const sb2=$('subbar');if(!sb2)return;if(GRP==='briefing'){sb2.innerHTML='';return;}sb2.innerHTML=GROUPS[GRP].subs.map(x=>'<button class="subv '+(x[0]===SUBV?'on':'')+'" data-sv="'+x[0]+'">'+x[1]+'</button>').join('');sb2.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{SUBV=b.dataset.sv;renderSubbar();renderContent();});}
function renderContent(){const c=$('content');if(!c)return;if(GRP==='vacaciones'&&SUBV==='solicitudes'){c.innerHTML='<div id="solic"><div class="empty">Cargando…</div></div>';loadSolic();}else if(GRP==='vacaciones'&&SUBV==='estado'){c.innerHTML='<div id="vacEstado"><div class="empty">Cargando…</div></div>';loadVacEstado();}else if(GRP==='retrasos'&&SUBV==='validar'){c.innerHTML='<div id="asis"><div class="empty">Cargando…</div></div>';loadAsis();}else if(GRP==='retrasos'&&SUBV==='quincena'){c.innerHTML='<div id="retQuin"><div class="empty">Cargando…</div></div>';loadRetrasosQuincena();}else if(GRP==='retrasos'&&SUBV==='extra'){c.innerHTML='<div id="salTard"><div class="empty">Cargando…</div></div>';loadSalidasTardias();}else if(GRP==='retrasos'&&SUBV==='puntualidad'){c.innerHTML='<div id="punt"><div class="empty">Cargando…</div></div>';loadPuntualidad();}else if(GRP==='contratos'&&SUBV==='altas'){c.innerHTML='<div id="altas"><div class="empty">Cargando…</div></div>';loadAltas();}else if(GRP==='contratos'&&SUBV==='emitir'){c.innerHTML='<div id="contEmitir"><div class="empty">Cargando…</div></div>';loadContratosEmitir();}}
function selectGroup(g){GRP=g;SUBV=GROUPS[g].subs[0][0];document.querySelectorAll('#grpTabs .tab').forEach(t=>t.classList.toggle('on',t.dataset.g===g));if(g==='briefing'){var s2=$('subbar');if(s2)s2.innerHTML='';if(window.__brf&&window.__brf.activate){window.__brf.activate();}else{ensureMainShell();var cc=$('content');if(cc)cc.innerHTML='<div class="empty">Briefing cargando…</div>';}return;}ensureMainShell();renderSubbar();renderContent();}
document.querySelectorAll('#grpTabs .tab').forEach(t=>t.onclick=()=>selectGroup(t.dataset.g));

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const email=(session&&session.user&&session.user.email||'').toLowerCase();
  if(!email){$('gate').style.display='flex';return;}
  ME=email;$('me').textContent=ME;$('gate').style.display='none';
  const {data:j}=await sb.from('org_jefes').select('*');JEFES=j||[];
  isAdmin=ADMINS.includes(ME);allAsis=ALL_ASIS.includes(ME);
  MY=JEFES.filter(x=>(x.jefe_email||'').toLowerCase()===ME).map(x=>x.area_key);
  $('scope').textContent=(allAsis||isAdmin)?'· ves todo':(MY.length?('· '+MY.join(', ')):'· tu equipo');
  await loadEmployees(); loadSolic(); loadAsis(); loadAltas(); selectGroup('vacaciones');
}
$('lbtn').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});if(error){$('lerr').textContent=error.message;return;}boot();};

async function loadEmployees(){const {data}=await sb.from('employees').select('id,nombre,apellido,puesto,area,sede,estatus');(data||[]).forEach(e=>EMP[e.id]=e);}
const persona=r=>{const e=EMP[r.employee_id]||{};return (e.nombre||r.nombre_display||'—')+(e.apellido?(' '+e.apellido):'');};
const areaDe=r=>{const e=EMP[r.employee_id]||{};return (e.area||'')+(e.sede?(' · '+e.sede):'');};
const esBaja=id=>{const e=EMP[id];return !!(e&&e.estatus==='baja');};

// ---- 1) SOLICITUDES (vacaciones y otras) ----
async function loadSolic(){
  const {data}=await sb.from('incidencias').select('*').eq('resuelto',false).not('tipo','in','(alta_colaborador,validacion_asistencia)').order('created_at',{ascending:false});
  let rows=(data||[]).filter(r=>{if(esBaja(r.employee_id))return false;const e=EMP[r.employee_id]||{};return (allAsis||isAdmin)?true:inScope(e);});
  {const _cs=$('c-solic');if(_cs)_cs.textContent=rows.length;}
  const c=$('solic'); if(!c)return;
  if(!rows.length){c.innerHTML='<div class="empty">Sin solicitudes pendientes 🎉</div>';return;}
  c.innerHTML=rows.map((r,i)=>{const md=r.metadata||{};
    return `<div class="item" data-i="${i}"><div class="top"><span class="nm">${esc(persona(r))}</span>
      <span class="pill g">${esc(r.tipo)}</span><span class="pill">${esc(areaDe(r))}</span></div>
      <div class="det">${esc(r.descripcion||'')}</div>
      ${md.inicio?`<div class="det">📅 ${esc(md.inicio)} → ${esc(md.fin||'')} · ${esc(md.dias||'')} día(s) · estado: ${esc(md.estado||'')}</div>`:''}
      <div class="acts"><button class="btn ok" data-a="aprobar">Aprobar</button><button class="btn no" data-a="rechazar">Rechazar</button></div></div>`;
  }).join('');
  c.querySelectorAll('.item').forEach(it=>{const r=rows[+it.dataset.i];it.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>resolverSolic(r,b.dataset.a,it));});
}
async function resolverSolic(r,a,it){
  const resp=prompt(a==='aprobar'?'Mensaje para el colaborador (se le mostrará en SoyPepe · opcional):':'Motivo del rechazo (se le mostrará al colaborador):','');
  if(resp===null) return; // canceló
  const respTxt=(resp||'').trim()||null;
  const md=Object.assign({},r.metadata||{},{estado:a==='aprobar'?'aprobada':'rechazada',resuelto_por:ME,respuesta:respTxt});
  const {error}=await sb.from('incidencias').update({resuelto:true,metadata:md}).eq('id',r.id);
  if(error)return toast('Error: '+error.message,false);
  // Sincroniza la solicitud de vacaciones y descuenta saldo si se aprueba
  if(r.tipo==='vacaciones' && md.inicio){
    try{
      const nuevo=a==='aprobar'?'aprobada':'rechazada';
      const {data:solRows}=await sb.from('vacaciones_solicitudes').select('id,saldo_id,dias_solicitados,estado').eq('employee_id',r.employee_id).eq('fecha_inicio',md.inicio).eq('fecha_fin',md.fin).in('estado',['pendiente','pre_aprobada']);
      const sol=(solRows||[])[0];
      if(sol){
        // El trigger vac_aprobada_sync descuenta el saldo y pinta 'Vacaciones' en horarios automáticamente
        await sb.from('vacaciones_solicitudes').update({estado:nuevo,respuesta:respTxt,resuelto_at:new Date().toISOString()}).eq('id',sol.id);
      }else{ toast('Ojo: no encontré la solicitud ligada en vacaciones — revisa RH.',false); }
    }catch(e){ toast('Incidencia resuelta, pero no se sincronizó vacaciones: '+e.message,false); }
  }
  it.style.opacity=.4;it.querySelectorAll('button').forEach(b=>b.disabled=true);toast(a==='aprobar'?'Aprobada ✓':'Rechazada');
  $('c-solic').textContent=Math.max(0,(+$('c-solic').textContent||1)-1);
}

// ---- 2) RETRASOS / FALTAS (validaciones de asistencia) ----
function qBounds(){const d=new Date();const p=n=>(n<10?'0':'')+n;const y=d.getFullYear(),mo=d.getMonth(),dd=d.getDate();const ini=y+'-'+p(mo+1)+'-'+(dd<=15?'01':'16');const fin=dd<=15?(y+'-'+p(mo+1)+'-15'):(y+'-'+p(mo+1)+'-'+p(new Date(y,mo+1,0).getDate()));return {ini,fin};}
async function resumenQuincena(){try{
  const b=qBounds();

async function loadPuntualidad(){
  const c=$('punt'); if(!c) return;
  const q=_quincena();
  const hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
  const fin=(q.fin<hoy)?q.fin:hoy;
  let hor=[],asis=[];
  try{ const r=await sb.from('horarios').select('employee_id,fecha,hora_inicio,actividad').gte('fecha',q.ini).lte('fecha',fin); hor=r.data||[]; }catch(e){}
  try{ const r=await sb.from('asistencias').select('employee_id,fecha,estatus,check_in,hora_turno').gte('fecha',q.ini).lte('fecha',fin); asis=r.data||[]; }catch(e){}
  const AS={}; asis.forEach(r=>{ AS[r.employee_id+'|'+r.fecha]=r; });
  const SCH={}; // emp -> {fecha:hora_inicio}  (solo días laborales programados, sin descansos)
  hor.forEach(r=>{ if(!r.employee_id) return; const rest=(!r.hora_inicio && /descanso/i.test(r.actividad||'')); if(rest) return;
    (SCH[r.employee_id]=SCH[r.employee_id]||{}); if(!(r.fecha in SCH[r.employee_id]) || (r.hora_inicio&&!SCH[r.employee_id][r.fecha])) SCH[r.employee_id][r.fecha]=r.hora_inicio||null; });
  const A={};
  Object.keys(SCH).forEach(emp=>{
    if(esBaja(emp)) return; if(!(isAdmin||allAsis||inScope(EMP[emp]||{}))) return;
    const dias=Object.keys(SCH[emp]); if(!dias.length) return;
    let malos=0, det=[];
    dias.forEach(f=>{
      const hi=SCH[emp][f], a=AS[emp+'|'+f];
      if(!a){ malos++; det.push(f+' (sin registro)'); return; }
      if(a.estatus==='falta'){ malos++; det.push(f+' (falta)'); return; }
      if(a.estatus==='retardo'){ malos++; det.push(f+' (retardo)'); return; }
      const ci=_hmLocal(a.check_in), tt=_tmin(hi||a.hora_turno);
      if(ci!=null && tt!=null && ci>tt){ malos++; det.push(f+' (llegó tarde)'); return; }
    });
    A[emp]={dias:dias.length, malos, det};
  });
  const ok=[],no=[];
  Object.keys(A).forEach(id=>{ const a=Object.assign({employee_id:id},A[id]); if(a.malos===0)ok.push(a); else no.push(a); });

  const filtro='<input id="fPersonaP" placeholder="🔎 Filtrar persona…" style="width:100%;box-sizing:border-box;background:#0000001f;border:1px solid var(--line,#34291c);color:inherit;border-radius:8px;padding:8px 10px;font:inherit;margin-bottom:8px">';

    +'<div class="det">Bono de puntualidad · quincena <b>'+q.ini+'</b> a <b>'+q.fin+'</b> (evaluado hasta <b>'+fin+'</b>). Gana quien cumplió <b>TODOS sus días programados</b> (según su horario, sin contar descansos) y entró <b>a la hora exacta o antes</b> — <b>sin tolerancia</b>. Un día sin checar, una falta, un retardo o cualquier minuto tarde lo saca.</div>'
    +'<div class="item"><div class="top"><span class="nm">✅ Van por el bono ('+ok.length+')</span></div>'+(ok.length?ok.map(a=>'<div class="det" data-nm="'+esc(persona(a)).toLowerCase()+'" style="margin:3px 0 0">🟢 <b>'+esc(persona(a))+'</b> · '+a.dias+' día(s) programado(s), todos a la hora · '+esc(areaDe(a))+'</div>').join(''):'<div class="det">Aún nadie con quincena perfecta.</div>')+'</div>'
    +(no.length?('<div class="item"><div class="top"><span class="nm">❌ Perdieron el bono ('+no.length+')</span></div>'+no.map(a=>'<div class="det" data-nm="'+esc(persona(a)).toLowerCase()+'" style="margin:3px 0 0">🔴 <b>'+esc(persona(a))+'</b> · '+a.malos+'/'+a.dias+' día(s) con problema: '+esc(a.det.slice(0,8).join(', '))+'</div>').join('')):'');
  const f=$('fPersonaP'); if(f) f.oninput=()=>{ const t=f.value.toLowerCase().trim(); c.querySelectorAll('[data-nm]').forEach(el=>{ el.style.display=(!t||(el.dataset.nm||'').includes(t))?'':'none'; }); };
}
async function loadContratosEmitir(){
  const c=$('contEmitir'); if(!c)return;
  const hoy=new Date(); const hoyS=hoy.toISOString().slice(0,10); const limS=new Date(Date.now()+60*864e5).toISOString().slice(0,10);
  let emps=[],cons=[];
  try{ const r=await sb.from('employees').select('id,empleado_id,nombre,nombre_display,area,sede,property_id,alta_etapa,puesto,estatus'); emps=r.data||[]; }catch(e){}
  try{ const r=await sb.from('contratos').select('employee_id,estatus,vigencia_fin'); cons=r.data||[]; }catch(e){}
  const empById={}; emps.forEach(e=>empById[e.id]=e);
  const maxVig={},tieneFirmado={};
  cons.forEach(k=>{ if(k.estatus==='firmado'){ tieneFirmado[k.employee_id]=true; if(k.vigencia_fin&&(!maxVig[k.employee_id]||k.vigencia_fin>maxVig[k.employee_id])) maxVig[k.employee_id]=k.vigencia_fin; } });
  const rows=[];
  // 1) renovaciones: contrato firmado cuyo último vencimiento cae dentro de 60 días (o ya venció)
  Object.keys(maxVig).forEach(id=>{ const e=empById[id]; if(!e)return; if(e.estatus&&e.estatus!=='activo'&&e.estatus!=='pendiente_alta')return; if(maxVig[id]<=limS) rows.push({e:e,tipo:'renovar',fecha:maxVig[id]}); });
  // 2) primer contrato: alta activa/aceptada sin ningún contrato firmado
  emps.forEach(e=>{ if(['activa','aceptada'].indexOf(e.alta_etapa)>=0 && !tieneFirmado[e.id] && e.estatus!=='baja') rows.push({e:e,tipo:'nuevo',fecha:hoyS}); });
  let vis=rows.filter(r=>isAdmin||inScope({area:r.e.area||'',sede:r.e.sede}));
  vis.sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
  if(!vis.length){c.innerHTML='<div class="empty">No hay contratos por emitir en los próximos 60 días 🎉</div>';return;}
  c.innerHTML='<div class="det" style="margin-bottom:8px">Contratos que deben emitirse en los próximos <b>60 días</b>: renovaciones por vencimiento y altas nuevas sin contrato. El botón abre <b>Contratos & Aceptación</b> (la misma página) para editar y enviar — sin funciones duplicadas.</div>'+vis.map(r=>{const e=r.e;const dd=Math.ceil((new Date(r.fecha)-hoy)/864e5);const venc=r.tipo==='renovar';const etq=venc?(dd<0?('Vencido hace '+(-dd)+' d'):('Vence en '+dd+' d')):'Nuevo · sin contrato';const bc=dd<0?'border-color:#5a2f2a':(dd<=15?'border-color:#5a431f':'');
    return `<div class="item" style="${bc}"><div class="top"><span class="nm">${esc(e.nombre||e.nombre_display||'—')}</span><span class="pill g">${esc(altaUbic(e))}</span><span class="pill">${esc(e.empleado_id||'sin ID')}</span><span class="pill">${esc(e.puesto||'')}</span><span class="pill ${venc?'r':'s'}">${etq}${venc?(' · '+esc(r.fecha)):''}</span></div><div class="acts"><a class="btn lnk" href="/m/contratos.html?emp=${e.id}">→ Editar / emitir contrato</a></div></div>`;}).join('');
}
