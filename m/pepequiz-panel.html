<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PepeQuiz · Panel</title>
<style>
:root{
  --crema:#f6f1e7; --tinta:#2b2318; --oro:#C9A227; --verde:#137A56; --rojo:#b03434;
  --borde:#e4dccb; --suave:#7a6f5d; --blanco:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--crema); color:var(--tinta);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.45; -webkit-text-size-adjust:100%;
}
a{color:var(--verde)}
h1,h2,h3{margin:0}
/* ---- barra superior ---- */
.top{padding:16px 18px 10px;max-width:1180px;margin:0 auto}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.2px}
.top .sub{color:var(--suave);font-size:12.5px;margin-top:2px}
.sesion{font-size:12px;color:var(--suave);margin-top:6px}
.sesion b{color:var(--tinta)}
/* ---- pestañas ---- */
.secnav{position:sticky;top:0;z-index:30;background:var(--crema);border-bottom:1px solid var(--borde)}
.secnav .wrap{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.secnav button{
  appearance:none;border:0;background:transparent;color:var(--suave);
  font:inherit;font-weight:700;padding:11px 12px;cursor:pointer;white-space:nowrap;
  border-bottom:3px solid transparent;
}
.secnav button:hover{color:var(--tinta)}
.secnav button.on{color:var(--tinta);border-bottom-color:var(--oro)}
.secnav .pill{display:inline-block;margin-left:6px;background:var(--rojo);color:#fff;border-radius:999px;font-size:11px;font-weight:800;padding:1px 7px;vertical-align:1px}
.secnav .pill.cero{background:#cfc7b6;color:#4a4335}
/* ---- contenedor ---- */
main{max-width:1180px;margin:0 auto;padding:16px 12px 80px}
.card{background:var(--blanco);border:1px solid var(--borde);border-radius:14px;padding:14px;margin-bottom:12px}
.card.tight{padding:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 200px;min-width:0}
.muted{color:var(--suave)}
.small{font-size:12px}
.mono{font-variant-numeric:tabular-nums}
hr.sep{border:0;border-top:1px solid var(--borde);margin:12px 0}
/* ---- controles ---- */
label.f{display:block;font-size:11.5px;font-weight:700;color:var(--suave);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{
  width:100%;font:inherit;color:var(--tinta);background:#fffdf8;
  border:1px solid var(--borde);border-radius:10px;padding:8px 10px;outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,162,39,.18)}
textarea{resize:vertical;min-height:64px}
select{background-image:none}
.btn{
  appearance:none;font:inherit;font-weight:700;cursor:pointer;
  border:1px solid var(--borde);background:#fffdf8;color:var(--tinta);
  border-radius:10px;padding:8px 13px;
}
.btn:hover{background:#f3ecdd}
.btn:disabled{opacity:.5;cursor:default}
.btn.oro{background:var(--oro);border-color:var(--oro);color:#241d10}
.btn.oro:hover{filter:brightness(1.06)}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
.btn.verde:hover{filter:brightness(1.08)}
.btn.rojo{background:var(--rojo);border-color:var(--rojo);color:#fff}
.btn.rojo:hover{filter:brightness(1.08)}
.btn.gh{background:transparent}
.btn.sm{padding:5px 9px;font-size:12.5px;border-radius:9px}
/* ---- chips ---- */
.chip{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f0e9d9;color:#5b5240;border:1px solid var(--borde)}
.chip.oro{background:#fbf1cf;border-color:#e9d68e;color:#6b5510}
.chip.verde{background:#dff0e8;border-color:#a9d8c3;color:#0e5a40}
.chip.rojo{background:#f7dede;border-color:#e2b6b6;color:#8a2626}
.chip.gris{background:#eceadf;color:#6b6455}
/* ---- opciones de pregunta ---- */
.ops{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:5px}
.ops li{display:flex;gap:8px;align-items:flex-start;padding:6px 9px;border:1px solid var(--borde);border-radius:10px;background:#fffdf8}
.ops li.ok{border-color:#a9d8c3;background:#eef8f3}
.ops .letra{font-weight:800;color:var(--suave);min-width:16px}
.ops li.ok .letra{color:var(--verde)}
.ops .mark{margin-left:auto;color:var(--verde);font-weight:800;font-size:12px;white-space:nowrap}
/* ---- rejillas ---- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.kpi{background:var(--blanco);border:1px solid var(--borde);border-radius:14px;padding:12px 14px}
.kpi .n{font-size:26px;font-weight:800;line-height:1.1}
.kpi .t{font-size:12px;color:var(--suave);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
/* ---- tablas ---- */
.tabla-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--suave);border-bottom:1px solid var(--borde);padding:7px 8px;white-space:nowrap}
td{border-bottom:1px solid #f0ece1;padding:7px 8px;vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
/* ---- editor ---- */
.editor{margin-top:10px;border-top:1px dashed var(--borde);padding-top:10px}
.opedit{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.opedit input[type=radio]{width:auto;flex:0 0 auto;accent-color:var(--verde);transform:scale(1.15)}
.opedit .grow{flex:1}
/* ---- avisos ---- */
#avisos{position:fixed;right:12px;bottom:12px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:min(460px,calc(100vw - 24px))}
.aviso{background:#fff;border:1px solid var(--borde);border-left:5px solid var(--suave);border-radius:12px;padding:10px 12px;box-shadow:0 6px 22px rgba(43,35,24,.14);font-size:13px}
.aviso.err{border-left-color:var(--rojo)}
.aviso.ok{border-left-color:var(--verde)}
.aviso b{display:block;margin-bottom:2px}
.aviso .x{float:right;cursor:pointer;color:var(--suave);font-weight:800;margin-left:8px}
.aviso pre{margin:4px 0 0;white-space:pre-wrap;word-break:break-word;font-size:12px;color:#6a3030;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
/* ---- varios ---- */
.vacio{padding:26px 14px;text-align:center;color:var(--suave)}
.cargando{padding:22px;text-align:center;color:var(--suave)}
.aviso-linea{background:#fbf1cf;border:1px solid #e9d68e;color:#6b5510;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.nota{background:#faf6ec;border:1px dashed var(--borde);border-radius:10px;padding:8px 10px;font-size:13px}
.semana{border:1px solid var(--borde);border-radius:14px;background:var(--blanco);padding:12px}
.semana h3{font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--suave)}
.semana.hoy{border-color:var(--oro);box-shadow:0 0 0 3px rgba(201,162,39,.15)}
.premio{border:1px solid var(--borde);border-radius:11px;padding:9px 10px;margin-top:8px;background:#fffdf8}
.premio.off{opacity:.55}
.acciones{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
@media (max-width:560px){
  .top{padding:12px 12px 8px}
  .top h1{font-size:18px}
  main{padding:12px 10px 70px}
}
</style>
</head>
<body>

<header class="top">
  <h1>PepeQuiz · Panel</h1>
  <div class="sub">Incidencias del juego, banco de preguntas, premios de la semana y pepepesos.</div>
  <div class="sesion" id="sesion">Buscando sesión…</div>
</header>

<nav class="secnav"><div class="wrap" id="tabs">
  <button type="button" data-t="inc" class="on">Incidencias <span class="pill cero" id="pill-inc">0</span></button>
  <button type="button" data-t="banco">Banco</button>
  <button type="button" data-t="premios">Premios</button>
  <button type="button" data-t="pesos">Pepepesos</button>
</div></nav>

<main id="vista"><div class="cargando">Cargando…</div></main>
<div id="avisos"></div>

<script>
"use strict";
/* ============================================================
   PepeQuiz · Panel de administración
   Módulo /m/ del dashboard del Grupo Casa Pepe.
   Todo lee la sesión de SoyPepe desde localStorage.
   ============================================================ */

var SBU = "https://rehophywchakfapivsbh.supabase.co";
var SBK = "sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";

/* ---------- sesión ---------- */
function leerSesion(){
  try{
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf("auth-token") > -1){
        var v = JSON.parse(localStorage.getItem(k) || "null");
        var s = v && (v.currentSession || v);
        if(s && s.access_token) return s;
      }
    }
  }catch(e){}
  return null;
}
var SESION = leerSesion();
var TOKEN  = SESION ? SESION.access_token : "";
var EMAIL  = (SESION && SESION.user && SESION.user.email) || "";

function H(extra){
  var h = { "apikey": SBK, "Authorization": "Bearer " + (TOKEN || SBK) };
  if(extra) for(var k in extra) h[k] = extra[k];
  return h;
}

/* ---------- avisos (errores de verdad) ---------- */
function aviso(titulo, detalle, tipo, ms){
  var cont = document.getElementById("avisos");
  var d = document.createElement("div");
  d.className = "aviso " + (tipo || "");
  d.innerHTML = '<span class="x">×</span><b></b>' + (detalle ? "<pre></pre>" : "");
  d.querySelector("b").textContent = titulo;
  if(detalle) d.querySelector("pre").textContent = String(detalle);
  d.querySelector(".x").onclick = function(){ d.remove(); };
  cont.appendChild(d);
  var t = ms === 0 ? 0 : (ms || (tipo === "err" ? 16000 : 5000));
  if(t) setTimeout(function(){ d.remove(); }, t);
  return d;
}
function ok(msg){ aviso(msg, "", "ok"); }
function fallo(donde, e){ aviso("No se pudo " + donde, (e && e.message) ? e.message : String(e), "err", 0); }

/* ---------- REST ---------- */
function req(path, opts){
  opts = opts || {};
  var conf = { method: opts.method || "GET", headers: H(opts.headers) };
  if(opts.body !== undefined){ conf.body = opts.body; conf.headers["Content-Type"] = "application/json"; }
  var resp;
  return fetch(SBU + "/rest/v1/" + path, conf).then(function(r){
    resp = r;
    return r.text();
  }).then(function(txt){
    var data = null;
    if(txt){ try{ data = JSON.parse(txt); }catch(e){ data = txt; } }
    if(!resp.ok){
      var m;
      if(data && typeof data === "object"){
        m = [data.message, data.details, data.hint, data.code].filter(Boolean).join(" · ");
      }
      if(!m) m = (typeof data === "string" && data) ? data : ("HTTP " + resp.status + " " + resp.statusText);
      var err = new Error(m + "  [HTTP " + resp.status + "]");
      err.status = resp.status;
      err.code = data && data.code;
      throw err;
    }
    return { data: data, headers: resp.headers };
  });
}
function get(path){ return req(path).then(function(r){ return r.data; }); }

function contar(path){
  return fetch(SBU + "/rest/v1/" + path, { headers: H({ "Prefer": "count=exact", "Range": "0-0" }) })
    .then(function(r){
      var cr = r.headers.get("content-range") || "";
      var n = parseInt((cr.split("/")[1] || "0"), 10);
      return isNaN(n) ? 0 : n;
    }).catch(function(){ return 0; });
}

/* RPC. Devuelve el jsonb; si el jsonb trae {error:...} lo lanza como error real. */
function rpc(fn, body){
  return req("rpc/" + fn, { method: "POST", body: JSON.stringify(body || {}) }).then(function(r){
    var d = r.data;
    if(d && !Array.isArray(d) && typeof d === "object" && d.error){
      throw new Error(String(d.error));
    }
    return d;
  });
}

/* ---------- utilidades ---------- */
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function nodo(html){
  var t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function fecha(s){
  if(!s) return "—";
  var d = new Date(s);
  if(isNaN(d)) return String(s);
  return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" }) +
         " · " + d.toLocaleTimeString("es-MX", { hour:"2-digit", minute:"2-digit" });
}
function fechaCorta(s){
  if(!s) return "—";
  var d = new Date(String(s).length === 10 ? s + "T12:00:00" : s);
  if(isNaN(d)) return String(s);
  return d.toLocaleDateString("es-MX", { day:"2-digit", month:"short", year:"numeric" });
}
function isoDia(d){
  var y = d.getFullYear(), m = ("0" + (d.getMonth()+1)).slice(-2), dd = ("0" + d.getDate()).slice(-2);
  return y + "-" + m + "-" + dd;
}
/* lunes de la semana de una fecha (yyyy-mm-dd o Date) */
function lunesDe(v){
  var d = (v instanceof Date) ? new Date(v.getTime()) : new Date(String(v).slice(0,10) + "T12:00:00");
  if(isNaN(d)) d = new Date();
  d.setHours(12,0,0,0);
  var w = (d.getDay() + 6) % 7;      // 0 = lunes
  d.setDate(d.getDate() - w);
  return isoDia(d);
}
function sumaDias(iso, n){
  var d = new Date(iso + "T12:00:00");
  d.setDate(d.getDate() + n);
  return isoDia(d);
}
var LETRAS = ["A","B","C","D","E","F"];

var MOTIVOS = {
  simplificar:       "Simplificar el texto",
  no_relacionado:    "Tema no relacionado",
  muy_cuantitativa:  "Muy cuantitativa",
  procedimiento:     "Habla de un procedimiento",
  confusa_extremos:  "Confusa · separar más las opciones",
  quitar_categoria:  "Quitar de esta categoría",
  borrar:            "Borrar la pregunta",
  otro:              "Otro"
};
var TIPOS_PREMIO = ["descanso","boletos","tour","pepepesos","otro"];

/* ---------- estado compartido ---------- */
/* Permisos reales del usuario, tal como los resuelve la base.
   Sirven para no enseñar una lista vacía cuando lo que pasa es que no hay permiso. */
var PERM = { auditor: null, editor: null, premiador: null };
function bannerPermiso(quien, texto){
  if(PERM[quien] === false){
    return nodo('<div class="aviso-linea"><b>Sin permiso.</b> ' + esc(texto) + "</div>");
  }
  return null;
}

var CATS = [];          // pq_categorias
var CATMAP = {};        // id -> fila
var EMPS = [];          // v_empleados_publico
var EMPMAP = {};        // id -> nombre
var PENDIENTES = 0;

function nombreCat(id){ return (CATMAP[id] && CATMAP[id].nombre) || id || "—"; }
function nombreEmp(id){ return EMPMAP[id] || (id ? String(id).slice(0,8) + "…" : "—"); }

function cargarBase(){
  return Promise.all([
    get("pq_categorias?select=id,nombre,nombre_en,en_pepequiz,orden&order=en_pepequiz.desc,orden.asc,nombre.asc"),
    get("v_empleados_publico?select=id,nombre,nombre_display&order=nombre_display.asc.nullslast")
  ]).then(function(r){
    CATS = r[0] || [];
    CATS.forEach(function(c){ CATMAP[c.id] = c; });
    EMPS = r[1] || [];
    EMPS.forEach(function(e){ EMPMAP[e.id] = e.nombre_display || e.nombre || ""; });
  });
}

function cargarPermisos(){
  return Promise.all([
    rpc("pq_auditor", {}).catch(function(){ return null; }),
    rpc("pq_editor", {}).catch(function(){ return null; }),
    rpc("pq_premiador", {}).catch(function(){ return null; })
  ]).then(function(r){
    PERM.auditor = r[0]; PERM.editor = r[1]; PERM.premiador = r[2];
  });
}

function optsCategorias(sel, incluirTodas){
  var h = "";
  if(incluirTodas) h += '<option value="">Todas las categorías</option>';
  var dentro = CATS.filter(function(c){ return c.en_pepequiz; });
  var fuera  = CATS.filter(function(c){ return !c.en_pepequiz; });
  function grupo(nom, arr){
    if(!arr.length) return "";
    var s = '<optgroup label="' + esc(nom) + '">';
    arr.forEach(function(c){
      s += '<option value="' + esc(c.id) + '"' + (c.id === sel ? " selected" : "") + '>' + esc(c.nombre) + "</option>";
    });
    return s + "</optgroup>";
  }
  h += grupo("En PepeQuiz", dentro);
  h += grupo("Apagadas / fuera del juego", fuera);
  return h;
}

/* ============================================================
   TARJETA DE PREGUNTA — se usa igual en Incidencias y en Banco
   ============================================================ */
/*
  p: {id, enunciado, opciones[], correcta, explicacion, categoria_id, idioma, activa, dificultad}
  cfg: { extras: nodo|null, onCambio: fn(p) }
*/
function tarjetaPregunta(p, cfg){
  cfg = cfg || {};
  var wrap = nodo('<div class="preg"></div>');

  function pintar(){
    var ops = Array.isArray(p.opciones) ? p.opciones : [];
    var h = '';
    h += '<div class="row small" style="gap:6px;margin-bottom:6px">';
    h +=   '<span class="chip">' + esc(nombreCat(p.categoria_id)) + '</span>';
    h +=   '<span class="chip gris">' + esc((p.idioma || "es").toUpperCase()) + '</span>';
    h +=   (p.activa ? '<span class="chip verde">Activa</span>' : '<span class="chip rojo">Apagada</span>');
    if(p.dificultad) h += '<span class="chip gris">Dif. ' + esc(p.dificultad) + '</span>';
    h += '</div>';
    h += '<div class="enun" style="font-weight:700;font-size:14.5px"></div>';
    h += '<ul class="ops">';
    ops.forEach(function(o, i){
      h += '<li class="' + (i === p.correcta ? "ok" : "") + '"><span class="letra">' + LETRAS[i] + '</span>' +
           '<span class="txt">' + esc(o) + '</span>' +
           (i === p.correcta ? '<span class="mark">✓ correcta</span>' : "") + "</li>";
    });
    h += "</ul>";
    if(p.explicacion) h += '<div class="nota" style="margin-top:8px"><b>Explicación:</b> ' + esc(p.explicacion) + "</div>";
    h += '<div class="acciones"></div>';
    h += '<div class="editor" hidden></div>';
    wrap.innerHTML = h;
    wrap.querySelector(".enun").textContent = p.enunciado || "";

    var acc = wrap.querySelector(".acciones");

    var bEd = nodo('<button class="btn sm">Editar</button>');
    bEd.onclick = function(){ abrirEditor(); };
    acc.appendChild(bEd);

    var selCat = nodo('<select class="btn sm" style="width:auto;max-width:230px;padding:5px 8px">' + optsCategorias(p.categoria_id, false) + "</select>");
    selCat.title = "Cambiar de categoría";
    selCat.onchange = function(){
      var nueva = selCat.value;
      if(nueva === p.categoria_id) return;
      guardar({ categoria_id: nueva }, "cambiar la categoría").then(function(){
        ok("Movida a " + nombreCat(nueva));
      }).catch(function(){ selCat.value = p.categoria_id; });
    };
    acc.appendChild(selCat);

    var bAct = nodo('<button class="btn sm ' + (p.activa ? "" : "verde") + '">' + (p.activa ? "Desactivar" : "Activar") + "</button>");
    bAct.onclick = function(){
      guardar({ activa: !p.activa }, (p.activa ? "desactivar" : "activar") + " la pregunta")
        .then(function(){ ok(p.activa ? "Pregunta activa" : "Pregunta apagada"); });
    };
    acc.appendChild(bAct);

    if(cfg.extras){ cfg.extras.forEach(function(b){ acc.appendChild(b); }); }
  }

  function guardar(patch, donde){
    return req("pq_preguntas?id=eq." + encodeURIComponent(p.id), {
      method: "PATCH",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify(patch)
    }).then(function(r){
      var fila = (r.data && r.data[0]) || null;
      if(fila) for(var k in fila) p[k] = fila[k];
      else for(var k2 in patch) p[k2] = patch[k2];
      pintar();
      if(cfg.onCambio) cfg.onCambio(p);
      return p;
    }).catch(function(e){ fallo(donde || "guardar la pregunta", e); throw e; });
  }

  function abrirEditor(){
    var ed = wrap.querySelector(".editor");
    if(!ed.hidden){ ed.hidden = true; ed.innerHTML = ""; return; }
    ed.hidden = false;
    var ops = Array.isArray(p.opciones) ? p.opciones.slice(0,4) : ["","","",""];
    while(ops.length < 4) ops.push("");
    var h = '';
    h += '<label class="f">Enunciado</label><textarea class="e-enun"></textarea>';
    h += '<label class="f" style="margin-top:10px">Opciones · marca la correcta</label>';
    for(var i=0;i<4;i++){
      h += '<div class="opedit">' +
             '<input type="radio" name="c-' + esc(p.id) + '" value="' + i + '"' + (i === p.correcta ? " checked" : "") + '>' +
             '<span class="letra" style="font-weight:800;color:#7a6f5d">' + LETRAS[i] + '</span>' +
             '<span class="grow"><input type="text" class="e-op" data-i="' + i + '"></span>' +
           "</div>";
    }
    h += '<label class="f" style="margin-top:10px">Explicación</label><textarea class="e-exp" style="min-height:52px"></textarea>';
    h += '<div class="row" style="margin-top:10px">' +
           '<div class="grow" style="max-width:280px"><label class="f">Categoría</label><select class="e-cat">' + optsCategorias(p.categoria_id, false) + '</select></div>' +
           '<div style="width:120px"><label class="f">Idioma</label><select class="e-idi">' +
             '<option value="es"' + (p.idioma !== "en" ? " selected" : "") + '>es</option>' +
             '<option value="en"' + (p.idioma === "en" ? " selected" : "") + '>en</option></select></div>' +
         "</div>";
    h += '<div class="acciones"><button class="btn verde e-save">Guardar cambios</button><button class="btn gh e-cancel">Cancelar</button></div>';
    ed.innerHTML = h;
    ed.querySelector(".e-enun").value = p.enunciado || "";
    ed.querySelector(".e-exp").value  = p.explicacion || "";
    Array.prototype.forEach.call(ed.querySelectorAll(".e-op"), function(inp){
      inp.value = ops[Number(inp.dataset.i)] || "";
    });
    ed.querySelector(".e-cancel").onclick = function(){ ed.hidden = true; ed.innerHTML = ""; };
    ed.querySelector(".e-save").onclick = function(){
      var nuevas = Array.prototype.map.call(ed.querySelectorAll(".e-op"), function(i){ return i.value.trim(); });
      var enun = ed.querySelector(".e-enun").value.trim();
      if(!enun){ aviso("Falta el enunciado", "", "err", 6000); return; }
      if(nuevas.some(function(x){ return !x; })){ aviso("Las cuatro opciones tienen que tener texto", "", "err", 6000); return; }
      var rad = ed.querySelector('input[type=radio]:checked');
      var patch = {
        enunciado: enun,
        opciones: nuevas,
        correcta: rad ? Number(rad.value) : 0,
        explicacion: ed.querySelector(".e-exp").value.trim() || null,
        categoria_id: ed.querySelector(".e-cat").value,
        idioma: ed.querySelector(".e-idi").value
      };
      ed.querySelector(".e-save").disabled = true;
      guardar(patch, "guardar la pregunta").then(function(){ ok("Pregunta guardada"); })
        .catch(function(){ if(ed.querySelector(".e-save")) ed.querySelector(".e-save").disabled = false; });
    };
  }

  pintar();
  wrap.__preg = p;
  return wrap;
}

   1 · INCIDENCIAS

var incEstado = { estado: "abierta", motivo: "", cat: "" };
var incDatos = [];

function pintaIncidencias(){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("auditor", "No tienes la auditoría de PepeQuiz (PAG-PQ-AUDIT), así que esta lista te va a salir vacía.");
  if(bp) v.appendChild(bp);

  var head = nodo(
    '<div class="card">' +
      '<div class="row">' +
        '<div class="grow"><label class="f">Estado</label><select id="f-estado">' +
          '<option value="abierta">Pendientes</option>' +
          '<option value="cerradas">Resueltas y descartadas</option>' +
          '<option value="todas">Todas</option>' +
        '</select></div>' +
        '<div class="grow"><label class="f">Motivo</label><select id="f-motivo"><option value="">Todos los motivos</option></select></div>' +
        '<div class="grow"><label class="f">Categoría</label><select id="f-cat">' + optsCategorias("", true) + '</select></div>' +
        '<div style="align-self:flex-end"><button class="btn" id="f-refresh">Actualizar</button></div>' +
      '</div>' +
      '<div class="row small muted" style="margin-top:10px" id="inc-resumen"></div>' +
    "</div>"
  );
  v.appendChild(head);

  var selM = head.querySelector("#f-motivo");
  Object.keys(MOTIVOS).forEach(function(k){
    selM.insertAdjacentHTML("beforeend", '<option value="' + k + '">' + esc(MOTIVOS[k]) + "</option>");
  });
  head.querySelector("#f-estado").value = incEstado.estado;
  selM.value = incEstado.motivo;
  head.querySelector("#f-cat").value = incEstado.cat;

  head.querySelector("#f-estado").onchange = function(){ incEstado.estado = this.value; cargarIncidencias(); };
  selM.onchange = function(){ incEstado.motivo = this.value; listaIncidencias(); };
  head.querySelector("#f-cat").onchange = function(){ incEstado.cat = this.value; listaIncidencias(); };
  head.querySelector("#f-refresh").onclick = function(){ cargarIncidencias(); };

  var lista = nodo('<div id="inc-lista"><div class="cargando">Cargando incidencias…</div></div>');
  v.appendChild(lista);

  cargarIncidencias();
}

function cargarIncidencias(){
  var cont = document.getElementById("inc-lista");
  if(cont) cont.innerHTML = '<div class="cargando">Cargando incidencias…</div>';
  var estado = incEstado.estado === "abierta" ? "abierta" : null;   // null = todas
  rpc("pq_auditorias", { p_estado: estado, p_limite: 500 })
    .then(function(d){
      incDatos = Array.isArray(d) ? d : [];
      if(incEstado.estado === "cerradas"){
        incDatos = incDatos.filter(function(a){ return a.estado !== "abierta"; });
      }
      // completar con explicación / categoría real de la pregunta
      var ids = incDatos.map(function(a){ return a.pregunta_id; }).filter(Boolean);
      if(!ids.length) return {};
      var unicos = ids.filter(function(x,i){ return ids.indexOf(x) === i; }).slice(0,300);
      return get("pq_preguntas?select=id,categoria_id,idioma,explicacion,dificultad,activa&id=in.(" + unicos.join(",") + ")")
        .then(function(rows){
          var m = {};
          (rows || []).forEach(function(r){ m[r.id] = r; });
          return m;
        }).catch(function(){ return {}; });
    })
    .then(function(m){
      incDatos.forEach(function(a){
        var e = m && m[a.pregunta_id];
        a._preg = {
          id: a.pregunta_id,
          enunciado: a.enunciado,
          opciones: a.opciones,
          correcta: a.correcta,
          activa: a.activa,
          categoria_id: (e && e.categoria_id) || a.categoria,
          idioma: (e && e.idioma) || a.idioma || "es",
          explicacion: e ? e.explicacion : null,
          dificultad: e ? e.dificultad : null
        };
      });
      listaIncidencias();
      refrescaPendientes();
    })
    .catch(function(e){
      if(cont) cont.innerHTML = '<div class="card"><div class="vacio">No se pudieron cargar las incidencias.</div></div>';
      fallo("cargar las incidencias", e);
    });
}

function refrescaPendientes(){
  rpc("pq_auditorias", { p_estado: "abierta", p_limite: 500 }).then(function(d){
    PENDIENTES = Array.isArray(d) ? d.length : 0;
    var p = document.getElementById("pill-inc");
    if(p){ p.textContent = PENDIENTES; p.className = "pill" + (PENDIENTES ? "" : " cero"); }
  }).catch(function(){});
}

function listaIncidencias(){
  var cont = document.getElementById("inc-lista");
  if(!cont) return;
  var arr = incDatos.filter(function(a){
    if(incEstado.motivo && a.motivo !== incEstado.motivo) return false;
    if(incEstado.cat){
      var c = (a._preg && a._preg.categoria_id) || a.categoria;
      if(c !== incEstado.cat) return false;
    }
    return true;
  });

  var res = document.getElementById("inc-resumen");
  if(res){
    var abiertas = incDatos.filter(function(a){ return a.estado === "abierta"; }).length;
    res.innerHTML = "<span><b>" + arr.length + "</b> incidencia" + (arr.length === 1 ? "" : "s") + " en pantalla</span>" +
                    '<span style="margin-left:14px">Pendientes en total: <b>' + abiertas + "</b></span>";
  }

  cont.innerHTML = "";
  if(!arr.length){
    cont.appendChild(nodo('<div class="card"><div class="vacio">Nada marcado con estos filtros. Buena señal.</div></div>'));
    return;
  }

  arr.forEach(function(a){
    var card = nodo('<div class="card"></div>');
    var cab = nodo(
      '<div class="row small" style="justify-content:space-between;margin-bottom:8px">' +
        '<div class="row" style="gap:6px">' +
          '<span class="chip oro">' + esc(MOTIVOS[a.motivo] || a.motivo) + "</span>" +
          (a.estado === "abierta" ? '<span class="chip rojo">Pendiente</span>'
            : '<span class="chip ' + (a.estado === "resuelta" ? "verde" : "gris") + '">' + esc(a.estado) + "</span>") +
        "</div>" +
        '<div class="muted">' + esc(a.email || "") + " · " + esc(fecha(a.creado)) + "</div>" +
      "</div>"
    );
    card.appendChild(cab);
    if(a.nota){
      var n = nodo('<div class="nota" style="margin-bottom:9px"><b>Comentario:</b> <span></span></div>');
      n.querySelector("span").textContent = a.nota;
      card.appendChild(n);
    }

    var extras = [];
    if(a.estado === "abierta"){
      var bRes = nodo('<button class="btn sm verde">Resolver</button>');
      bRes.onclick = function(){ resolverIncidencia(a, "resuelta", bRes); };
      extras.push(bRes);
      var bDes = nodo('<button class="btn sm">Descartar</button>');
      bDes.onclick = function(){ resolverIncidencia(a, "descartada", bDes); };
      extras.push(bDes);
    }else{
      var bRe = nodo('<button class="btn sm">Reabrir</button>');
      bRe.onclick = function(){ resolverIncidencia(a, "abierta", bRe); };
      extras.push(bRe);
    }

    card.appendChild(tarjetaPregunta(a._preg, { extras: extras }));
    cont.appendChild(card);
  });
}

/* pq_auditoria_resolver(p_id uuid, p_estado text, p_reactivar boolean).
   Si algún día cambia la firma, se reintenta con {p_id, p_accion} y se enseña lo que devuelva. */
function resolverIncidencia(a, estado, boton){
  if(boton) boton.disabled = true;
  rpc("pq_auditoria_resolver", { p_id: a.id, p_estado: estado, p_reactivar: false })
    .catch(function(e){
      var m = String(e && e.message || "");
      if(/PGRST202|Could not find|does not exist|function/i.test(m)){
        return rpc("pq_auditoria_resolver", { p_id: a.id, p_accion: estado });
      }
      throw e;
    })
    .then(function(){
      a.estado = estado;
      ok(estado === "abierta" ? "Incidencia reabierta" : ("Incidencia " + estado));
      cargarIncidencias();
    })
    .catch(function(e){
      if(boton) boton.disabled = false;
      fallo("resolver la incidencia", e);
    });
}

var banco = { cat: "", idioma: "es", q: "", offset: 0, limit: 50, filas: [], total: 0 };

function pintaBanco(){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("editor", "Puedes mirar el banco, pero no guardar cambios: te falta permiso de edición del quiz.");
  if(bp) v.appendChild(bp);
  if(!banco.cat){
    var prim = CATS.filter(function(c){ return c.en_pepequiz; })[0] || CATS[0];
    banco.cat = prim ? prim.id : "";
  }
  var head = nodo(
    '<div class="card">' +
      '<div class="row">' +
        '<div class="grow"><label class="f">Categoría</label><select id="b-cat">' + optsCategorias(banco.cat, false) + "</select></div>" +
        '<div style="width:130px"><label class="f">Idioma</label><select id="b-idi">' +
          '<option value="es">Español</option><option value="en">Inglés</option></select></div>' +
        '<div class="grow"><label class="f">Buscar en el enunciado</label><input type="search" id="b-q" placeholder="palabra o frase"></div>' +
        '<div style="align-self:flex-end"><button class="btn oro" id="b-buscar">Buscar</button></div>' +
        '<div style="align-self:flex-end"><button class="btn" id="b-nueva">+ Pregunta nueva</button></div>' +
      "</div>" +
      '<div class="row small muted" style="margin-top:10px" id="b-conteo">…</div>' +
    "</div>"
  );
  v.appendChild(head);
  head.querySelector("#b-idi").value = banco.idioma;
  head.querySelector("#b-q").value = banco.q;

  head.querySelector("#b-cat").onchange = function(){ banco.cat = this.value; banco.offset = 0; cargarBanco(); };
  head.querySelector("#b-idi").onchange = function(){ banco.idioma = this.value; banco.offset = 0; cargarBanco(); };
  head.querySelector("#b-buscar").onclick = function(){ banco.q = head.querySelector("#b-q").value.trim(); banco.offset = 0; cargarBanco(); };
  head.querySelector("#b-q").onkeydown = function(ev){ if(ev.key === "Enter"){ banco.q = this.value.trim(); banco.offset = 0; cargarBanco(); } };
  head.querySelector("#b-nueva").onclick = nuevaPregunta;

  v.appendChild(nodo('<div id="b-nuevo"></div>'));
  v.appendChild(nodo('<div id="b-lista"><div class="cargando">Cargando…</div></div>'));
  v.appendChild(nodo('<div class="row" style="justify-content:center;margin-top:6px" id="b-pag"></div>'));
  cargarBanco();
}

function filtroBanco(extra){
  var f = "categoria_id=eq." + encodeURIComponent(banco.cat) + "&idioma=eq." + encodeURIComponent(banco.idioma);
  if(banco.q) f += "&enunciado=ilike." + encodeURIComponent("*" + banco.q + "*");
  if(extra) f += extra;
  return f;
}

function cargarBanco(){
  var lista = document.getElementById("b-lista");
  if(lista) lista.innerHTML = '<div class="cargando">Cargando…</div>';
  var sel = "select=id,enunciado,opciones,correcta,explicacion,categoria_id,idioma,activa,dificultad,fecha_alta";
  Promise.all([
    contar("pq_preguntas?" + filtroBanco("&activa=is.true") + "&select=id"),
    contar("pq_preguntas?" + filtroBanco("") + "&select=id"),
    get("pq_preguntas?" + sel + "&" + filtroBanco("") +
        "&order=fecha_alta.desc&limit=" + banco.limit + "&offset=" + banco.offset)
  ]).then(function(r){
    var activas = r[0], total = r[1];
    banco.total = total;
    banco.filas = r[2] || [];
    var c = document.getElementById("b-conteo");
    if(c){
      c.innerHTML = "<span><b>" + activas + "</b> activas</span>" +
                    '<span style="margin-left:14px"><b>' + total + "</b> en total" + (banco.q ? " con esa búsqueda" : "") + "</span>" +
                    '<span style="margin-left:14px">' + esc(nombreCat(banco.cat)) + " · " + esc(banco.idioma.toUpperCase()) + "</span>";
    }
    pintaListaBanco();
  }).catch(function(e){
    if(lista) lista.innerHTML = '<div class="card"><div class="vacio">No se pudo cargar el banco.</div></div>';
    fallo("cargar el banco", e);
  });
}

function pintaListaBanco(){
  var lista = document.getElementById("b-lista");
  lista.innerHTML = "";
  if(!banco.filas.length){
    lista.appendChild(nodo('<div class="card"><div class="vacio">No hay preguntas con estos filtros.</div></div>'));
  }else{
    banco.filas.forEach(function(p){
      var card = nodo('<div class="card"></div>');
      card.appendChild(tarjetaPregunta(p, {}));
      lista.appendChild(card);
    });
  }
  var pag = document.getElementById("b-pag");
  pag.innerHTML = "";
  var desde = banco.total ? banco.offset + 1 : 0;
  var hasta = Math.min(banco.offset + banco.limit, banco.total);
  var prev = nodo('<button class="btn sm">← Anteriores</button>');
  prev.disabled = banco.offset <= 0;
  prev.onclick = function(){ banco.offset = Math.max(0, banco.offset - banco.limit); cargarBanco(); window.scrollTo(0,0); };
  var sig = nodo('<button class="btn sm">Siguientes →</button>');
  sig.disabled = hasta >= banco.total;
  sig.onclick = function(){ banco.offset += banco.limit; cargarBanco(); window.scrollTo(0,0); };
  pag.appendChild(prev);
  pag.appendChild(nodo('<span class="small muted mono" style="align-self:center">' + desde + "–" + hasta + " de " + banco.total + "</span>"));
  pag.appendChild(sig);
}

function nuevaPregunta(){
  var cont = document.getElementById("b-nuevo");
  if(cont.firstChild){ cont.innerHTML = ""; return; }
  var card = nodo(
    '<div class="card" style="border-color:#e9d68e;background:#fffdf4">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<b>Pregunta nueva en ' + esc(nombreCat(banco.cat)) + " · " + esc(banco.idioma.toUpperCase()) + "</b>" +
        '<span class="chip rojo">Nace apagada</span>' +
      "</div>" +
      '<label class="f">Enunciado</label><textarea class="n-enun"></textarea>' +
      '<label class="f" style="margin-top:10px">Opciones · marca la correcta</label>' +
      '<div class="n-ops"></div>' +
      '<label class="f" style="margin-top:10px">Explicación</label><textarea class="n-exp" style="min-height:52px"></textarea>' +
      '<div class="acciones"><button class="btn verde n-save">Crear</button><button class="btn gh n-cancel">Cancelar</button></div>' +
    "</div>"
  );
  var ops = card.querySelector(".n-ops");
  for(var i=0;i<4;i++){
    ops.insertAdjacentHTML("beforeend",
      '<div class="opedit">' +
        '<input type="radio" name="n-correcta" value="' + i + '"' + (i === 0 ? " checked" : "") + ">" +
        '<span class="letra" style="font-weight:800;color:#7a6f5d">' + LETRAS[i] + "</span>" +
        '<span class="grow"><input type="text" class="n-op"></span>' +
      "</div>");
  }
  card.querySelector(".n-cancel").onclick = function(){ cont.innerHTML = ""; };
  card.querySelector(".n-save").onclick = function(){
    var enun = card.querySelector(".n-enun").value.trim();
    var textos = Array.prototype.map.call(card.querySelectorAll(".n-op"), function(i){ return i.value.trim(); });
    if(!enun){ aviso("Falta el enunciado", "", "err", 6000); return; }
    if(textos.some(function(t){ return !t; })){ aviso("Las cuatro opciones tienen que tener texto", "", "err", 6000); return; }
    var rad = card.querySelector('input[name="n-correcta"]:checked');
    var fila = {
      categoria_id: banco.cat,
      idioma: banco.idioma,
      enunciado: enun,
      opciones: textos,
      correcta: rad ? Number(rad.value) : 0,
      explicacion: card.querySelector(".n-exp").value.trim() || null,
      activa: false
    };
    card.querySelector(".n-save").disabled = true;
    req("pq_preguntas", { method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(fila) })
      .then(function(){ cont.innerHTML = ""; ok("Pregunta creada, apagada hasta que la revises"); banco.offset = 0; cargarBanco(); })
      .catch(function(e){ card.querySelector(".n-save").disabled = false; fallo("crear la pregunta", e); });
  };
  cont.appendChild(card);
}

   3 · PREMIOS
   ============================================================ */
var premios = { filas: [], estaSemana: [], ganados: [] };

function pintaPremios(){
  var v = document.getElementById("vista");
  v.innerHTML = '<div class="cargando">Cargando premios…</div>';
  var lunesHoy = lunesDe(new Date());
  Promise.all([
    get("pq_premio?select=*&order=ciclo_semana.asc.nullsfirst,orden.asc"),
    rpc("pq_premio_de_semana", {}).catch(function(e){ fallo("leer el premio de esta semana", e); return []; }),
    get("pq_premio_ganado?select=*&order=semana_inicio.desc&limit=100").catch(function(){ return []; })
  ]).then(function(r){
    premios.filas = r[0] || [];
    premios.estaSemana = Array.isArray(r[1]) ? r[1] : (r[1] ? [r[1]] : []);
    premios.ganados = r[2] || [];
    dibujaPremios(lunesHoy);
  }).catch(function(e){
    v.innerHTML = '<div class="card"><div class="vacio">No se pudieron cargar los premios.</div></div>';
    fallo("cargar los premios", e);
  });
}

function dibujaPremios(lunesHoy){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("premiador", "No tienes permiso de premios (PAG-PQ-PREMIOS): puedes ver, no guardar ni cerrar la semana.");
  if(bp) v.appendChild(bp);

  /* --- esta semana + cerrar --- */
  var esta = nodo('<div class="card"></div>');
  var titulos = premios.estaSemana.length
    ? premios.estaSemana.map(function(p){ return esc(p.titulo) + (p.pepepesos > 0 ? " · " + p.pepepesos + " pepepesos" : ""); }).join(" · ")
    : "<span class='muted'>Ningún premio configurado para esta semana</span>";
  esta.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-start">' +
      '<div class="grow"><div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Esta semana · lunes ' +
        esc(fechaCorta(lunesHoy)) + "</div>" +
        '<div style="font-size:16px;font-weight:800;margin-top:3px">' + titulos + "</div></div>" +
    "</div>" +
    '<hr class="sep">' +
    '<div class="row">' +
      '<div style="width:190px"><label class="f">Semana a cerrar</label><input type="date" id="cs-fecha" value="' + esc(lunesHoy) + '"></div>' +
      '<div style="align-self:flex-end"><button class="btn oro" id="cs-btn">Cerrar la semana</button></div>' +
      '<div class="small muted grow" style="align-self:flex-end">Le da el premio al número 1 de esa semana y, si el premio es dinero, le abona los pepepesos.</div>' +
    "</div>" +
    '<div id="cs-res"></div>';
  v.appendChild(esta);

  var inpF = esta.querySelector("#cs-fecha");
  inpF.onchange = function(){ this.value = lunesDe(this.value); };
  esta.querySelector("#cs-btn").onclick = function(){
    var f = lunesDe(inpF.value || lunesHoy);
    if(!confirm("Cerrar la semana del lunes " + f + ".\n\nSe le asigna el premio al número 1 de esa semana. ¿Seguimos?")) return;
    var b = this; b.disabled = true;
    rpc("pq_cerrar_semana", { p_fecha: f }).then(function(d){
      b.disabled = false;
      var box = esta.querySelector("#cs-res");
      var prem = (d && Array.isArray(d.premios)) ? d.premios.map(function(x){ return x.premio; }).join(" · ") : "—";
      box.innerHTML = '<div class="nota" style="margin-top:10px">' +
        "<b>Semana " + esc(fechaCorta(d.semana)) + " cerrada.</b><br>" +
        "Ganador: <b>" + esc(nombreEmp(d.ganador)) + "</b> con <b>" + esc(d.puntos) + "</b> puntos.<br>" +
        "Premios: " + esc(prem) + "</div>";
      ok("Semana cerrada");
      pintaPremios();
    }).catch(function(e){ b.disabled = false; fallo("cerrar la semana", e); });
  };

  /* --- las cuatro semanas del ciclo --- */
  v.appendChild(nodo('<div class="row small muted" style="margin:4px 2px 8px">El ciclo es de cuatro semanas y se repite: la quinta semana vuelve a ser la primera. Un premio con fecha concreta manda sobre el del ciclo esa semana.</div>'));

  var g = nodo('<div class="grid4"></div>');
  [1,2,3,4].forEach(function(n){
    var sem = nodo('<div class="semana"><h3>Semana ' + n + " del ciclo</h3></div>");
    var deEsta = premios.filas.filter(function(p){ return p.semana_iso == null && p.ciclo_semana === n; });
    if(!deEsta.length) sem.appendChild(nodo('<div class="muted small" style="margin-top:8px">Sin premio.</div>'));
    deEsta.forEach(function(p){ sem.appendChild(cajaPremio(p)); });
    var b = nodo('<button class="btn sm" style="margin-top:9px">+ Añadir a esta semana</button>');
    b.onclick = function(){ formPremio(sem, { ciclo_semana: n, semana_iso: null }); };
    sem.appendChild(b);
    g.appendChild(sem);
  });
  v.appendChild(g);

  /* --- semanas concretas del calendario --- */
  var fijos = premios.filas.filter(function(p){ return p.semana_iso != null; })
                           .sort(function(a,b){ return a.semana_iso < b.semana_iso ? 1 : -1; });
  var cf = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Premios de una semana concreta</b></div>' +
                '<div class="small muted" style="margin-top:2px">Mandan sobre el premio del ciclo esa semana. Aquí vive el de lanzamiento.</div>' +
                '<div class="fijos"></div></div>');
  var cont = cf.querySelector(".fijos");
  if(!fijos.length) cont.appendChild(nodo('<div class="muted small" style="margin-top:8px">Ninguno.</div>'));
  fijos.forEach(function(p){ cont.appendChild(cajaPremio(p, true)); });
  var bF = nodo('<button class="btn sm" style="margin-top:10px">+ Añadir a una semana del calendario</button>');
  bF.onclick = function(){ formPremio(cont, { ciclo_semana: null, semana_iso: lunesDe(new Date()) }); };
  cf.appendChild(bF);
  v.appendChild(cf);

  /* --- historial --- */
  var hist = nodo('<div class="card"><b>Quién ha ganado</b><div class="tabla-wrap" style="margin-top:8px"></div></div>');
  var w = hist.querySelector(".tabla-wrap");
  if(!premios.ganados.length){
    w.appendChild(nodo('<div class="vacio">Todavía no se ha cerrado ninguna semana.</div>'));
  }else{
    var pm = {};
    premios.filas.forEach(function(p){ pm[p.id] = p; });
    var t = '<table><thead><tr><th>Semana</th><th>Ganador</th><th>Premio</th><th>Estado</th><th>Entregado</th></tr></thead><tbody>';
    premios.ganados.forEach(function(g2){
      var p = pm[g2.premio_id];
      t += "<tr>" +
        "<td>" + esc(fechaCorta(g2.semana_inicio)) + "</td>" +
        "<td>" + esc(nombreEmp(g2.employee_id)) + "</td>" +
        "<td>" + esc(p ? p.titulo : "(premio borrado)") + (p && p.pepepesos > 0 ? ' <span class="chip oro">' + p.pepepesos + " pp</span>" : "") + "</td>" +
        '<td><span class="chip ' + (g2.estado === "entregado" ? "verde" : "gris") + '">' + esc(g2.estado) + "</span></td>" +
        "<td>" + esc(g2.entregado_at ? fechaCorta(g2.entregado_at) : "—") + "</td>" +
      "</tr>";
    });
    t += "</tbody></table>";
    w.innerHTML = t;
  }
  v.appendChild(hist);
}

function cajaPremio(p, conFecha){
  var box = nodo('<div class="premio' + (p.activo ? "" : " off") + '"></div>');
  function ver(){
    box.innerHTML =
      '<div style="font-weight:700">' + esc(p.titulo) + "</div>" +
      (p.descripcion ? '<div class="small muted">' + esc(p.descripcion) + "</div>" : "") +
      '<div class="row small" style="gap:5px;margin-top:6px">' +
        '<span class="chip">' + esc(p.tipo) + "</span>" +
        (p.pepepesos > 0 ? '<span class="chip oro">' + p.pepepesos + " pepepesos</span>" : "") +
        (conFecha && p.semana_iso ? '<span class="chip verde">lunes ' + esc(fechaCorta(p.semana_iso)) + "</span>" : "") +
        (p.activo ? "" : '<span class="chip rojo">Apagado</span>') +
      "</div>" +
      '<div class="acciones"></div>';
    var acc = box.querySelector(".acciones");
    var be = nodo('<button class="btn sm">Editar</button>');
    be.onclick = function(){ editar(); };
    acc.appendChild(be);
    var ba = nodo('<button class="btn sm">' + (p.activo ? "Apagar" : "Encender") + "</button>");
    ba.onclick = function(){ patchPremio(p.id, { activo: !p.activo }); };
    acc.appendChild(ba);
    var bb = nodo('<button class="btn sm rojo">Borrar</button>');
    bb.onclick = function(){
      if(!confirm("Borrar el premio «" + p.titulo + "»?")) return;
      req("pq_premio?id=eq." + encodeURIComponent(p.id), { method: "DELETE" })
        .then(function(){ ok("Premio borrado"); pintaPremios(); })
        .catch(function(e){ fallo("borrar el premio", e); });
    };
    acc.appendChild(bb);
  }
  function editar(){
    box.innerHTML = camposPremio(p);
    var b = nodo('<div class="acciones"><button class="btn verde s">Guardar</button><button class="btn gh c">Cancelar</button></div>');
    box.appendChild(b);
    b.querySelector(".c").onclick = ver;
    b.querySelector(".s").onclick = function(){
      var d = leeCamposPremio(box);
      if(!d) return;
      patchPremio(p.id, d);
    };
  }
  ver();
  return box;
}

function camposPremio(p){
  p = p || {};
  return '' +
    '<label class="f">Título</label><input type="text" class="p-tit" value="' + esc(p.titulo || "") + '">' +
    '<label class="f" style="margin-top:8px">Descripción</label><input type="text" class="p-des" value="' + esc(p.descripcion || "") + '">' +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Tipo</label><select class="p-tip">' +
        TIPOS_PREMIO.map(function(t){ return '<option value="' + t + '"' + (p.tipo === t ? " selected" : "") + ">" + t + "</option>"; }).join("") +
      "</select></div>" +
      '<div><label class="f">Pepepesos (0 si no es dinero)</label><input type="number" class="p-pp" min="0" step="1" value="' + esc(p.pepepesos || 0) + '"></div>' +
      '<div><label class="f">Orden</label><input type="number" class="p-ord" step="1" value="' + esc(p.orden || 0) + '"></div>' +
      '<div><label class="f">Activo</label><select class="p-act"><option value="1"' + (p.activo === false ? "" : " selected") + '>Sí</option><option value="0"' + (p.activo === false ? " selected" : "") + ">No</option></select></div>" +
    "</div>";
}
function leeCamposPremio(box){
  var tit = box.querySelector(".p-tit").value.trim();
  if(!tit){ aviso("El premio necesita título", "", "err", 6000); return null; }
  return {
    titulo: tit,
    descripcion: box.querySelector(".p-des").value.trim() || null,
    tipo: box.querySelector(".p-tip").value,
    pepepesos: Number(box.querySelector(".p-pp").value) || 0,
    orden: Number(box.querySelector(".p-ord").value) || 0,
    activo: box.querySelector(".p-act").value === "1"
  };
}
function patchPremio(id, patch){
  req("pq_premio?id=eq." + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(patch) })
    .then(function(){ ok("Premio guardado"); pintaPremios(); })
    .catch(function(e){ fallo("guardar el premio", e); });
}

/* alta de premio: base = {ciclo_semana, semana_iso} */
function formPremio(contenedor, base){
  var box = nodo('<div class="premio" style="border-color:#e9d68e;background:#fffdf4"></div>');
  var h = camposPremio({ tipo: "otro", pepepesos: 0, orden: 0, activo: true });
  if(base.semana_iso != null){
    h += '<label class="f" style="margin-top:8px">Lunes de la semana</label><input type="date" class="p-sem" value="' + esc(base.semana_iso) + '">';
  }
  box.innerHTML = h;
  if(base.semana_iso != null){
    var inp = box.querySelector(".p-sem");
    inp.onchange = function(){ this.value = lunesDe(this.value); };
  }
  var acc = nodo('<div class="acciones"><button class="btn verde s">Crear premio</button><button class="btn gh c">Cancelar</button></div>');
  box.appendChild(acc);
  acc.querySelector(".c").onclick = function(){ box.remove(); };
  acc.querySelector(".s").onclick = function(){
    var d = leeCamposPremio(box);
    if(!d) return;
    d.ciclo_semana = base.ciclo_semana;
    d.semana_iso = base.semana_iso != null ? lunesDe(box.querySelector(".p-sem").value) : null;
    acc.querySelector(".s").disabled = true;
    req("pq_premio", { method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(d) })
      .then(function(){ ok("Premio creado"); pintaPremios(); })
      .catch(function(e){ acc.querySelector(".s").disabled = false; fallo("crear el premio", e); });
  };
  contenedor.appendChild(box);
}

/* ============================================================
   4 · PEPEPESOS
   ============================================================ */
var pp = { solicitudes: [], catalogo: [], catmap: {}, saldos: [] };

function pintaPepepesos(){
  var v = document.getElementById("vista");
  v.innerHTML = '<div class="cargando">Cargando pepepesos…</div>';
  Promise.all([
    get("pp_solicitud?select=*&estado=eq.pendiente&order=creado.asc"),
    get("pp_catalogo?select=*&order=orden.asc,nombre.asc"),
    todosMovimientos()
  ]).then(function(r){
    pp.solicitudes = r[0] || [];
    pp.catalogo = r[1] || [];
    pp.catmap = {};
    pp.catalogo.forEach(function(c){ pp.catmap[c.id] = c; });
    var acum = {};
    (r[2] || []).forEach(function(m){ acum[m.employee_id] = (acum[m.employee_id] || 0) + (Number(m.delta) || 0); });
    pp.saldos = Object.keys(acum).map(function(id){ return { id: id, saldo: acum[id], nombre: nombreEmp(id) }; })
      .sort(function(a,b){ return b.saldo - a.saldo; });
    dibujaPepepesos();
  }).catch(function(e){
    v.innerHTML = '<div class="card"><div class="vacio">No se pudieron cargar los pepepesos.</div></div>';
    fallo("cargar los pepepesos", e);
  });
}

function todosMovimientos(){
  var todos = [], paso = 1000;
  function tramo(off){
    return get("pp_movimiento?select=employee_id,delta&order=creado.asc&limit=" + paso + "&offset=" + off)
      .then(function(rows){
        rows = rows || [];
        todos = todos.concat(rows);
        if(rows.length === paso && off < 20000) return tramo(off + paso);
        return todos;
      });
  }
  return tramo(0).catch(function(e){ fallo("leer los movimientos", e); return []; });
}

function dibujaPepepesos(){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("premiador", "No tienes permiso de premios (PAG-PQ-PREMIOS): puedes ver, no aprobar ni tocar el catálogo.");
  if(bp) v.appendChild(bp);
  v.appendChild(nodo('<div class="aviso-linea"><b>1 pepepeso = 1 peso.</b> Lo del catálogo con costo 0 es «a cotizar»: al aprobar hay que escribir el monto real.</div>'));

  /* --- solicitudes --- */
  var s = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Solicitudes pendientes</b>' +
               '<span class="chip ' + (pp.solicitudes.length ? "rojo" : "gris") + '">' + pp.solicitudes.length + "</span></div><div class=\"cuerpo\"></div></div>");
  var cuerpo = s.querySelector(".cuerpo");
  if(!pp.solicitudes.length){
    cuerpo.appendChild(nodo('<div class="vacio">Nada pendiente.</div>'));
  }else{
    pp.solicitudes.forEach(function(so){ cuerpo.appendChild(filaSolicitud(so)); });
  }
  v.appendChild(s);

  /* --- catálogo --- */
  var c = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Catálogo</b>' +
               '<button class="btn sm" id="cat-nuevo">+ Nuevo</button></div><div class="lista"></div></div>');
  var lc = c.querySelector(".lista");
  if(!pp.catalogo.length) lc.appendChild(nodo('<div class="vacio">Catálogo vacío.</div>'));
  pp.catalogo.forEach(function(it){ lc.appendChild(filaCatalogo(it)); });
  c.querySelector("#cat-nuevo").onclick = function(){ formCatalogo(lc); };
  v.appendChild(c);

  /* --- saldos --- */
  var sa = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Saldos</b>' +
                '<button class="btn sm oro" id="ajuste">Abonar o ajustar</button></div>' +
                '<div id="ajuste-box"></div><div class="tabla-wrap" style="margin-top:8px"></div></div>');
  var w = sa.querySelector(".tabla-wrap");
  if(!pp.saldos.length){
    w.appendChild(nodo('<div class="vacio">Nadie tiene movimientos todavía.</div>'));
  }else{
    var t = '<table><thead><tr><th>Colaborador</th><th style="text-align:right">Saldo</th></tr></thead><tbody>';
    pp.saldos.forEach(function(x){
      t += "<tr><td>" + esc(x.nombre) + '</td><td class="num"><b>' + x.saldo + "</b></td></tr>";
    });
    t += "</tbody></table>";
    w.innerHTML = t;
  }
  sa.querySelector("#ajuste").onclick = function(){ formAjuste(sa.querySelector("#ajuste-box")); };
  v.appendChild(sa);
}

function filaSolicitud(so){
  var cat = so.catalogo_id ? pp.catmap[so.catalogo_id] : null;
  var aCotizar = (Number(so.monto) === 0) || (cat && Number(cat.costo) === 0);
  var box = nodo('<div class="premio"></div>');
  box.innerHTML =
    '<div class="row" style="justify-content:space-between">' +
      "<div><b>" + esc(nombreEmp(so.employee_id)) + "</b> · " + esc(so.concepto) + "</div>" +
      '<div class="small muted">' + esc(fecha(so.creado)) + "</div>" +
    "</div>" +
    '<div class="row small" style="gap:6px;margin-top:6px">' +
      '<span class="chip ' + (aCotizar ? "oro" : "") + '">' + (aCotizar ? "A cotizar" : (so.monto + " pepepesos")) + "</span>" +
      (cat ? '<span class="chip gris">' + esc(cat.tipo) + (cat.plaza ? " · " + esc(cat.plaza) : "") + "</span>" : "") +
    "</div>" +
    (so.nota ? '<div class="nota" style="margin-top:7px"><b>Su nota:</b> ' + esc(so.nota) + "</div>" : "") +
    '<div class="grid2" style="margin-top:9px">' +
      '<div><label class="f">Monto en pepepesos</label><input type="number" class="s-monto" min="0" step="1" value="' + esc(so.monto || 0) + '"></div>' +
      '<div><label class="f">Nota de resolución</label><input type="text" class="s-nota" placeholder="opcional"></div>' +
    "</div>" +
    '<div class="acciones"><button class="btn verde s-ok">Aprobar</button><button class="btn rojo s-no">Rechazar</button></div>';

  function resolver(aprobar){
    var monto = Number(box.querySelector(".s-monto").value);
    if(aprobar && (!monto || monto <= 0)){
      if(!confirm("El monto es 0. Se aprueba sin descontar pepepesos. ¿Seguimos?")) return;
    }
    var nota = box.querySelector(".s-nota").value.trim() || null;
    box.querySelector(".s-ok").disabled = true;
    box.querySelector(".s-no").disabled = true;
    rpc("pp_resolver", { p_solicitud: so.id, p_aprobar: !!aprobar, p_nota: nota, p_monto: aprobar ? monto : null })
      .then(function(){ ok(aprobar ? "Solicitud aprobada" : "Solicitud rechazada"); pintaPepepesos(); })
      .catch(function(e){
        box.querySelector(".s-ok").disabled = false;
        box.querySelector(".s-no").disabled = false;
        fallo("resolver la solicitud", e);
      });
  }
  box.querySelector(".s-ok").onclick = function(){ resolver(true); };
  box.querySelector(".s-no").onclick = function(){ resolver(false); };
  return box;
}

function filaCatalogo(it){
  var box = nodo('<div class="premio' + (it.activo ? "" : " off") + '"></div>');
  function ver(){
    box.innerHTML =
      '<div class="row" style="justify-content:space-between">' +
        "<div><b>" + esc(it.nombre) + "</b></div>" +
        '<div><span class="chip ' + (Number(it.costo) === 0 ? "oro" : "") + '">' +
          (Number(it.costo) === 0 ? "A cotizar" : (it.costo + " pp")) + "</span></div>" +
      "</div>" +
      '<div class="row small" style="gap:5px;margin-top:5px">' +
        '<span class="chip gris">' + esc(it.tipo) + "</span>" +
        (it.plaza ? '<span class="chip gris">' + esc(it.plaza) + "</span>" : "") +
        '<span class="chip gris">orden ' + esc(it.orden) + "</span>" +
        (it.activo ? "" : '<span class="chip rojo">Apagado</span>') +
      "</div>" +
      (it.nota ? '<div class="small muted" style="margin-top:5px">' + esc(it.nota) + "</div>" : "") +
      '<div class="acciones"></div>';
    var acc = box.querySelector(".acciones");
    var be = nodo('<button class="btn sm">Editar</button>'); be.onclick = editar; acc.appendChild(be);
    var ba = nodo('<button class="btn sm">' + (it.activo ? "Apagar" : "Encender") + "</button>");
    ba.onclick = function(){ patchCat(it.id, { activo: !it.activo }); };
    acc.appendChild(ba);
    var bb = nodo('<button class="btn sm rojo">Borrar</button>');
    bb.onclick = function(){
      if(!confirm("Borrar «" + it.nombre + "» del catálogo?")) return;
      req("pp_catalogo?id=eq." + encodeURIComponent(it.id), { method: "DELETE" })
        .then(function(){ ok("Borrado del catálogo"); pintaPepepesos(); })
        .catch(function(e){ fallo("borrar del catálogo", e); });
    };
    acc.appendChild(bb);
  }
  function editar(){
    box.innerHTML = camposCatalogo(it);
    var acc = nodo('<div class="acciones"><button class="btn verde s">Guardar</button><button class="btn gh c">Cancelar</button></div>');
    box.appendChild(acc);
    acc.querySelector(".c").onclick = ver;
    acc.querySelector(".s").onclick = function(){
      var d = leeCamposCatalogo(box);
      if(d) patchCat(it.id, d);
    };
  }
  ver();
  return box;
}
function camposCatalogo(it){
  it = it || {};
  return '' +
    '<label class="f">Nombre</label><input type="text" class="c-nom" value="' + esc(it.nombre || "") + '">' +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Tipo</label><input type="text" class="c-tip" value="' + esc(it.tipo || "otro") + '"></div>' +
      '<div><label class="f">Plaza</label><input type="text" class="c-pla" value="' + esc(it.plaza || "") + '" placeholder="cdmx / puebla / vacío"></div>' +
      '<div><label class="f">Costo en pepepesos (0 = a cotizar)</label><input type="number" class="c-cos" min="0" step="1" value="' + esc(it.costo != null ? it.costo : 0) + '"></div>' +
      '<div><label class="f">Orden</label><input type="number" class="c-ord" step="1" value="' + esc(it.orden || 0) + '"></div>' +
    "</div>" +
    '<label class="f" style="margin-top:8px">Nota</label><input type="text" class="c-not" value="' + esc(it.nota || "") + '">' +
    '<div style="margin-top:8px;max-width:160px"><label class="f">Activo</label><select class="c-act">' +
      '<option value="1"' + (it.activo === false ? "" : " selected") + '>Sí</option>' +
      '<option value="0"' + (it.activo === false ? " selected" : "") + ">No</option></select></div>";
}
function leeCamposCatalogo(box){
  var nom = box.querySelector(".c-nom").value.trim();
  if(!nom){ aviso("Falta el nombre", "", "err", 6000); return null; }
  var tip = box.querySelector(".c-tip").value.trim() || "otro";
  return {
    nombre: nom,
    tipo: tip,
    plaza: box.querySelector(".c-pla").value.trim() || null,
    costo: Number(box.querySelector(".c-cos").value) || 0,
    nota: box.querySelector(".c-not").value.trim() || null,
    orden: Number(box.querySelector(".c-ord").value) || 0,
    activo: box.querySelector(".c-act").value === "1"
  };
}
function patchCat(id, patch){
  req("pp_catalogo?id=eq." + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(patch) })
    .then(function(){ ok("Catálogo guardado"); pintaPepepesos(); })
    .catch(function(e){ fallo("guardar el catálogo", e); });
}
function formCatalogo(cont){
  var box = nodo('<div class="premio" style="border-color:#e9d68e;background:#fffdf4"></div>');
  box.innerHTML = camposCatalogo({ tipo: "otro", costo: 0, orden: 0, activo: true });
  var acc = nodo('<div class="acciones"><button class="btn verde s">Crear</button><button class="btn gh c">Cancelar</button></div>');
  box.appendChild(acc);
  acc.querySelector(".c").onclick = function(){ box.remove(); };
  acc.querySelector(".s").onclick = function(){
    var d = leeCamposCatalogo(box);
    if(!d) return;
    acc.querySelector(".s").disabled = true;
    req("pp_catalogo", { method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(d) })
      .then(function(){ ok("Añadido al catálogo"); pintaPepepesos(); })
      .catch(function(e){ acc.querySelector(".s").disabled = false; fallo("añadir al catálogo", e); });
  };
  cont.insertBefore(box, cont.firstChild);
}

function formAjuste(cont){
  if(cont.firstChild){ cont.innerHTML = ""; return; }
  var box = nodo('<div class="premio" style="border-color:#e9d68e;background:#fffdf4;margin-top:10px"></div>');
  box.innerHTML =
    '<div class="grid2">' +
      '<div><label class="f">Colaborador</label><select class="a-emp"></select></div>' +
      '<div><label class="f">Pepepesos (negativo para descontar)</label><input type="number" class="a-delta" step="1" value="0"></div>' +
    "</div>" +
    '<label class="f" style="margin-top:8px">Concepto</label><input type="text" class="a-con" placeholder="por qué se abona o se descuenta">' +
    '<div class="acciones"><button class="btn verde s">Aplicar</button><button class="btn gh c">Cancelar</button></div>';
  var sel = box.querySelector(".a-emp");
  sel.innerHTML = '<option value="">— elige —</option>' + EMPS.map(function(e){
    return '<option value="' + esc(e.id) + '">' + esc(e.nombre_display || e.nombre || e.id) + "</option>";
  }).join("");
  box.querySelector(".c").onclick = function(){ cont.innerHTML = ""; };
  box.querySelector(".s").onclick = function(){
    var emp = sel.value, delta = Number(box.querySelector(".a-delta").value), con = box.querySelector(".a-con").value.trim();
    if(!emp){ aviso("Elige al colaborador", "", "err", 6000); return; }
    if(!delta){ aviso("El movimiento no puede ser 0", "", "err", 6000); return; }
    if(!con){ aviso("Escribe el concepto", "", "err", 6000); return; }
    box.querySelector(".s").disabled = true;
    req("pp_movimiento", {
      method: "POST",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify({ employee_id: emp, delta: delta, tipo: "ajuste", concepto: con })
    }).then(function(){ ok("Movimiento aplicado"); pintaPepepesos(); })
      .catch(function(e){ box.querySelector(".s").disabled = false; fallo("aplicar el movimiento", e); });
  };
  cont.appendChild(box);
}

/* ============================================================
   ARRANQUE Y PESTAÑAS
   ============================================================ */
var PINTORES = { inc: pintaIncidencias, banco: pintaBanco, premios: pintaPremios, pesos: pintaPepepesos };
var TAB = "inc";

function irA(t){
  TAB = t;
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.classList.toggle("on", b.dataset.t === t);
  });
  (PINTORES[t] || pintaIncidencias)();
}

document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-t]");
  if(b) irA(b.dataset.t);
});

(function arranca(){
  var ses = document.getElementById("sesion");
  if(!TOKEN){
    ses.innerHTML = "Sin sesión.";
    document.getElementById("vista").innerHTML =
      '<div class="card"><div class="vacio">' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:6px">Inicia sesión en SoyPepe</div>' +
      "<div>Este panel usa tu sesión para leer y escribir. Entra a SoyPepe y vuelve a abrir esta pantalla.</div>" +
      "</div></div>";
    return;
  }
  ses.innerHTML = "Sesión de <b>" + esc(EMAIL || "usuario") + "</b>";
  Promise.all([cargarBase(), cargarPermisos()]).then(function(){
    refrescaPendientes();
    irA("inc");                      // Incidencias siempre abre primero
  }).catch(function(e){
    fallo("cargar categorías y colaboradores", e);
    irA("inc");
  });
})();
</script>
