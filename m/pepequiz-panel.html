/* Los temas de tours traen miles de preguntas repartidas entre sus tours.
   Este selector las separa tour por tour. */
function cargarTours(){
  var wrap = document.getElementById("b-tour-wrap");
  var sel = document.getElementById("b-tour");
  if(!wrap || !sel) return;
  get("v_pq_tour_conteo?select=tour_id,nombre,n&categoria_id=eq." + encodeURIComponent(banco.cat) +
      "&idioma=eq." + encodeURIComponent(banco.idioma) + "&order=nombre.asc")
    .then(function(rows){
      banco.tours = rows || [];
      if(!banco.tours.length){ wrap.style.display = "none"; sel.innerHTML = ""; return; }
      wrap.style.display = "";
      var total = banco.tours.reduce(function(a,t){ return a + (t.n||0); }, 0);
      var h = '<option value="">Todos los tours · ' + total + '</option>';
      banco.tours.forEach(function(t){
        h += '<option value="' + esc(t.tour_id) + '"' + (banco.tour === t.tour_id ? " selected" : "") + ">" +
             esc(t.nombre) + " · " + t.n + "</option>";
      });
      sel.innerHTML = h;
    })
    .catch(function(){ wrap.style.display = "none"; });
}

function filtroBanco(extra){
  var f = "categoria_id=eq." + encodeURIComponent(banco.cat) + "&idioma=eq." + encodeURIComponent(banco.idioma);
  if(banco.tour) f += "&tour_id=eq." + encodeURIComponent(banco.tour);
  if(banco.q) f += "&enunciado=ilike." + encodeURIComponent("*" + banco.q + "*");
  if(extra) f += extra;
  return f;
}
/* Con un tour elegido se lee de la vista que ya trae el cruce pregunta-tour. */
function fuenteBanco(){ return banco.tour ? "v_pq_banco?" : "pq_preguntas?"; }

function cargarBanco(){
  var lista = document.getElementById("b-lista");
  if(lista) lista.innerHTML = '<div class="cargando">Cargando…</div>';
  var sel = "select=id,enunciado,opciones,correcta,explicacion,categoria_id,idioma,activa,dificultad,fecha_alta,espejo_id";
  var F = fuenteBanco();
  Promise.all([
    contar(F + filtroBanco("&activa=is.true") + "&select=id"),
    contar(F + filtroBanco("") + "&select=id"),
    get(F + sel + "&" + filtroBanco("") +
        "&order=fecha_alta.desc&limit=" + banco.limit + "&offset=" + banco.offset)
  ]).then(function(r){
    var activas = r[0], total = r[1];
    banco.total = total;
    banco.filas = r[2] || [];
    var c = document.getElementById("b-conteo");
    if(c){
      var tn = banco.tour ? (banco.tours.filter(function(t){ return t.tour_id === banco.tour; })[0] || {}).nombre : "";
      c.innerHTML = "<span><b>" + activas + "</b> activas</span>" +
                    '<span style="margin-left:14px"><b>' + total + "</b> en total" + (banco.q ? " con esa búsqueda" : "") + "</span>" +
                    '<span style="margin-left:14px">' + esc(nombreCat(banco.cat)) + " · " + esc(banco.idioma.toUpperCase()) +
                    (tn ? " · " + esc(tn) : "") + "</span>";
    }
    pintaListaBanco();
  }).catch(function(e){
    if(lista) lista.innerHTML = '<div class="card"><div class="vacio">No se pudo cargar el banco.</div></div>';
    fallo("cargar el banco", e);
  });
}

function pintaListaBanco(){
  var lista = document.getElementById("b-lista");
  lista.innerHTML = "";
  if(!banco.filas.length){
    lista.appendChild(nodo('<div class="card"><div class="vacio">No hay preguntas con estos filtros.</div></div>'));
  }else{
    banco.filas.forEach(function(p){
      var card = nodo('<div class="card"></div>');
      card.appendChild(tarjetaPregunta(p, {}));
      lista.appendChild(card);
    });
  }
  var pag = document.getElementById("b-pag");
  pag.innerHTML = "";
  var desde = banco.total ? banco.offset + 1 : 0;
  var hasta = Math.min(banco.offset + banco.limit, banco.total);
  var prev = nodo('<button class="btn sm">← Anteriores</button>');
  prev.disabled = banco.offset <= 0;
  prev.onclick = function(){ banco.offset = Math.max(0, banco.offset - banco.limit); cargarBanco(); window.scrollTo(0,0); };
  var sig = nodo('<button class="btn sm">Siguientes →</button>');
  sig.disabled = hasta >= banco.total;
  sig.onclick = function(){ banco.offset += banco.limit; cargarBanco(); window.scrollTo(0,0); };
  pag.appendChild(prev);
  pag.appendChild(nodo('<span class="small muted mono" style="align-self:center">' + desde + "–" + hasta + " de " + banco.total + "</span>"));
  pag.appendChild(sig);
}

function nuevaPregunta(){
  var cont = document.getElementById("b-nuevo");
  if(cont.firstChild){ cont.innerHTML = ""; return; }
  var card = nodo(
    '<div class="card" style="border-color:#e9d68e;background:#fffdf4">' +
      '<div class="row" style="justify-content:space-between;margin-bottom:8px">' +
        '<b>Pregunta nueva en ' + esc(nombreCat(banco.cat)) + " · " + esc(banco.idioma.toUpperCase()) + "</b>" +
        '<span class="chip rojo">Nace apagada</span>' +
      "</div>" +
      '<label class="f">Enunciado</label><textarea class="n-enun"></textarea>' +
      '<label class="f" style="margin-top:10px">Opciones · marca la correcta</label>' +
      '<div class="n-ops"></div>' +
      '<label class="f" style="margin-top:10px">Explicación</label><textarea class="n-exp" style="min-height:52px"></textarea>' +
      '<div class="acciones"><button class="btn verde n-save">Crear</button><button class="btn gh n-cancel">Cancelar</button></div>' +
    "</div>"
  );
  var ops = card.querySelector(".n-ops");
  for(var i=0;i<4;i++){
    ops.insertAdjacentHTML("beforeend",
      '<div class="opedit">' +
        '<input type="radio" name="n-correcta" value="' + i + '"' + (i === 0 ? " checked" : "") + ">" +
        '<span class="letra" style="font-weight:800;color:#7a6f5d">' + LETRAS[i] + "</span>" +
        '<span class="grow"><input type="text" class="n-op"></span>' +
      "</div>");
  }
  card.querySelector(".n-cancel").onclick = function(){ cont.innerHTML = ""; };
  card.querySelector(".n-save").onclick = function(){
    var enun = card.querySelector(".n-enun").value.trim();
    var textos = Array.prototype.map.call(card.querySelectorAll(".n-op"), function(i){ return i.value.trim(); });
    if(!enun){ aviso("Falta el enunciado", "", "err", 6000); return; }
    if(textos.some(function(t){ return !t; })){ aviso("Las cuatro opciones tienen que tener texto", "", "err", 6000); return; }
    var rad = card.querySelector('input[name="n-correcta"]:checked');
    var fila = {
      categoria_id: banco.cat,
      idioma: banco.idioma,
      enunciado: enun,
      opciones: textos,
      correcta: rad ? Number(rad.value) : 0,
      explicacion: card.querySelector(".n-exp").value.trim() || null,
      activa: false
    };
    card.querySelector(".n-save").disabled = true;
    req("pq_preguntas", { method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(fila) })
      .then(function(){ cont.innerHTML = ""; ok("Pregunta creada, apagada hasta que la revises"); banco.offset = 0; cargarBanco(); })
      .catch(function(e){ card.querySelector(".n-save").disabled = false; fallo("crear la pregunta", e); });
  };
  cont.appendChild(card);
}

/* ============================================================
   PREMIOS · el catálogo y los dos calendarios
   ------------------------------------------------------------
   Javi, 20-oct-2026, pidiendo este módulo entero:
     «Separa dentro de cada categoría de premios: premios seleccionados, que se
      seleccionan de los que se crean en crear premio, y calendario de premios.
      Para los huéspedes es un calendario diario y para los trabajadores uno
      semanal. Permíteme asignar por semana el premio de los pepes para que no
      se repita.»

   Tres piezas y una sola verdad:
     · CREAR PREMIO  → premio_catalogo. Qué es el premio: su nombre en los dos
       idiomas, su letra chica y con qué se entrega. Esto se escribe una vez.
     · PREMIOS SELECCIONADOS → las mismas fichas, pero mirando cada cuánto
       puede volver a salir, en qué casa vale, cuántas unidades y si está
       encendido para los calendarios que vengan. El título y la descripción
       NO se tocan aquí: vienen de Crear premio.
     · CALENDARIO → premio_asignacion. Qué se da cada día (huésped) o cada
       semana (pepes). La propuesta la hace la base; aquí se mira, se cambia lo
       que haga falta y se guarda. Nada se guarda solo.
   ============================================================ */

var DIAS_NOM = { 1:"Lunes", 2:"Martes", 3:"Miércoles", 4:"Jueves", 5:"Viernes", 6:"Sábado", 0:"Domingo" };
var DOW_ORDEN = [1,2,3,4,5,6,0];           /* la semana empieza en lunes */

var PERIODOS = [
  ["cualquiera", "Sin límite"],
  ["semanal",    "No antes de 1 semana"],
  ["quincenal",  "No antes de 2 semanas"],
  ["mensual",    "No antes de 1 mes"],
  ["unico",      "Una sola vez"]
];
var TIPOS_CAT = [
  ["vnums",     "Carta de Vnums"],
  ["cortesia",  "Cortesía"],
  ["dia_libre", "Día libre"],
  ["pepepesos", "Pepepesos"],
  ["otro",      "Otro"]
];
var SEDES_CAT = [["", "Las dos casas"], ["cdmx", "CDMX"], ["puebla", "Puebla"]];

var CATP = [];        /* premio_catalogo */
var CARTAS = [];      /* vnum_premios, para colgar la carta de un premio */
var CALEND = null;    /* el calendario que se está editando ahora mismo */

function cargaCatalogoPremios(){
  return Promise.all([
    get("premio_catalogo?select=*&order=para.asc,orden.asc,nombre.asc"),
    get("vnum_premios?select=slug,nombre&activo=is.true&order=orden.asc").catch(function(){ return []; })
  ]).then(function(r){ CATP = r[0] || []; CARTAS = r[1] || []; });
}
function premiosDe(para){ return CATP.filter(function(p){ return p.para === para; }); }
function opciones(pares, val){
  return pares.map(function(p){
    return '<option value="' + esc(p[0]) + '"' + (String(val || "") === p[0] ? " selected" : "") + ">" + esc(p[1]) + "</option>";
  }).join("");
}
/* El emoji puede ser un emoji de verdad o la ruta de un sticker. */
function iconoPremio(p){
  var e = (p && p.emoji) || "";
  if(/^\/|^https?:/.test(e)) return '<img src="' + esc(e) + '" alt="" style="width:20px;height:20px;object-fit:contain;vertical-align:-4px">';
  return esc(e || "🎁");
}
function patchCatalogo(id, patch, luego){
  return req("premio_catalogo?id=eq." + encodeURIComponent(id), {
    method: "PATCH", headers: { Prefer: "return=representation" }, body: JSON.stringify(patch)
  }).then(function(){
    CATP.forEach(function(p){ if(p.id === id){ for(var k in patch) p[k] = patch[k]; } });
    ok("Guardado");
    if(luego) luego();
  }).catch(function(e){ fallo("guardar el premio", e); });
}

/* ============================================================
   PESTAÑA · CREAR PREMIO
   Aquí se define qué es el premio. Lo que se crea aquí aparece para elegir en
   los dos calendarios, según sea de huésped o de pepe.
   ============================================================ */
function pintaCrearPremio(){
  var v = document.getElementById("vista");
  v.innerHTML = '<div class="cargando">Cargando los premios…</div>';
  cargaCatalogoPremios().then(dibujaCrearPremio).catch(function(e){
    v.innerHTML = '<div class="card"><div class="vacio">No se pudo cargar el catálogo.</div></div>';
    fallo("cargar el catálogo de premios", e);
  });
}

function dibujaCrearPremio(){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("premiador", "No tienes permiso de premios: puedes ver, no crear ni cambiar.");
  if(bp) v.appendChild(bp);

  var cab = nodo('<div class="card"></div>');
  cab.innerHTML =
    '<div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Crear premio</div>' +
    '<div class="small muted" style="margin-top:4px">Qué es el premio y cómo se lo cuenta al que se lo gana. ' +
      'De aquí salen los dos calendarios: lo de <b>huésped</b> va a Premio del día y lo de <b>pepe</b> a Premios.</div>' +
    '<div id="cp-nuevo" style="margin-top:10px"></div>';
  v.appendChild(cab);
  var bN = nodo('<button class="btn oro">+ Crear un premio</button>');
  bN.disabled = (PERM.premiador === false);
  bN.onclick = function(){ bN.style.display = "none"; formCatalogoPremio(cab.querySelector("#cp-nuevo"), bN); };
  cab.querySelector("#cp-nuevo").appendChild(bN);

  [["huesped", "Premios de huésped", "Se entregan como carta de Vnums en su billetera."],
   ["equipo",  "Premios de pepe",    "Se entregan a mano, y los de pepepesos se abonan solos."]
  ].forEach(function(gr){
    var c = nodo('<div class="card"></div>');
    c.innerHTML = '<div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">' +
      esc(gr[1]) + "</div>" + '<div class="small muted" style="margin-top:3px">' + esc(gr[2]) + "</div>" +
      '<div class="lista" style="margin-top:8px"></div>';
    var L = c.querySelector(".lista");
    var filas = premiosDe(gr[0]);
    if(!filas.length) L.appendChild(nodo('<div class="vacio">Todavía no hay ninguno.</div>'));
    filas.forEach(function(p){ L.appendChild(fichaCatalogoPremio(p)); });
    v.appendChild(c);
  });
}

function fichaCatalogoPremio(p){
  var box = nodo('<div class="premio' + (p.activo ? "" : " off") + '"></div>');
  function ver(){
    box.innerHTML =
      '<div style="font-weight:700">' + iconoPremio(p) + " " + esc(p.nombre) +
        (p.activo ? "" : ' <span class="chip rojo">Apagado</span>') + "</div>" +
      (p.nombre_en ? '<div class="small muted">' + esc(p.nombre_en) + "</div>" : '<div class="small" style="color:var(--rojo,#8a2626)">Sin nombre en inglés</div>') +
      (p.detalle ? '<div class="small muted" style="margin-top:4px">' + esc(p.detalle) + "</div>" : "") +
      '<div class="row small" style="gap:5px;margin-top:6px;flex-wrap:wrap">' +
        '<span class="chip">' + esc(p.tipo || "otro") + "</span>" +
        (p.vnum_slug ? '<span class="chip verde">carta ' + esc(p.vnum_slug) + "</span>"
                     : (p.para === "huesped" ? '<span class="chip rojo">sin carta: no se puede calendarizar</span>' : "")) +
      "</div><div class='acciones'></div>";
    var acc = box.querySelector(".acciones");
    var be = nodo('<button class="btn sm">Editar</button>');
    be.disabled = (PERM.premiador === false);
    be.onclick = editar;
    acc.appendChild(be);
    var ba = nodo('<button class="btn sm">' + (p.activo ? "Apagar" : "Encender") + "</button>");
    ba.disabled = (PERM.premiador === false);
    ba.onclick = function(){ patchCatalogo(p.id, { activo: !p.activo }, pintaCrearPremio); };
    acc.appendChild(ba);
  }
  function editar(){
    box.innerHTML = camposCatalogoPremio(p);
    var b = nodo('<div class="acciones"><button class="btn verde s">Guardar</button><button class="btn gh c">Cancelar</button></div>');
    box.appendChild(b);
    b.querySelector(".c").onclick = ver;
    b.querySelector(".s").onclick = function(){
      var d = leeCamposCatalogoPremio(box);
      if(!d) return;
      patchCatalogo(p.id, d, pintaCrearPremio);
    };
  }
  ver();
  return box;
}

function camposCatalogoPremio(p){
  p = p || {};
  return '' +
    '<div class="grid2">' +
      '<div><label class="f">Nombre</label><input class="c-nom" value="' + esc(p.nombre || "") + '"></div>' +
      '<div><label class="f">Nombre en inglés</label><input class="c-nomen" value="' + esc(p.nombre_en || "") + '"></div>' +
    "</div>" +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Letra chica</label><input class="c-det" value="' + esc(p.detalle || "") + '"></div>' +
      '<div><label class="f">Letra chica en inglés</label><input class="c-deten" value="' + esc(p.detalle_en || "") + '"></div>' +
    "</div>" +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Para quién</label><select class="c-para">' +
        opciones([["huesped", "Huésped"], ["equipo", "Pepe"]], p.para || "huesped") + "</select></div>" +
      '<div><label class="f">Qué se entrega</label><select class="c-tipo">' + opciones(TIPOS_CAT, p.tipo) + "</select></div>" +
    "</div>" +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Carta de Vnums</label><select class="c-carta"><option value="">— ninguna —</option>' +
        CARTAS.map(function(x){ return '<option value="' + esc(x.slug) + '"' + (x.slug === p.vnum_slug ? " selected" : "") + ">" + esc(x.nombre) + "</option>"; }).join("") +
        '</select><div class="small muted" style="margin-top:3px">Sin carta, un premio de huésped no se puede poner en el calendario.</div></div>' +
      '<div><label class="f">Emoji o sticker</label><input class="c-emo" value="' + esc(p.emoji || "") + '"></div>' +
    "</div>";
}
function leeCamposCatalogoPremio(box){
  var nom = box.querySelector(".c-nom").value.trim();
  if(!nom){ aviso("El premio necesita un nombre", "", "err", 6000); return null; }
  return {
    nombre: nom,
    nombre_en: box.querySelector(".c-nomen").value.trim() || null,
    detalle: box.querySelector(".c-det").value.trim() || null,
    detalle_en: box.querySelector(".c-deten").value.trim() || null,
    para: box.querySelector(".c-para").value,
    tipo: box.querySelector(".c-tipo").value,
    vnum_slug: box.querySelector(".c-carta").value || null,
    emoji: box.querySelector(".c-emo").value.trim() || null
  };
}
function formCatalogoPremio(cont, botonVolver){
  var box = nodo('<div class="premio"></div>');
  box.innerHTML = camposCatalogoPremio({});
  var b = nodo('<div class="acciones"><button class="btn verde s">Crear</button><button class="btn gh c">Cancelar</button></div>');
  box.appendChild(b);
  b.querySelector(".c").onclick = function(){ box.remove(); if(botonVolver) botonVolver.style.display = ""; };
  b.querySelector(".s").onclick = function(){
    var d = leeCamposCatalogoPremio(box);
    if(!d) return;
    d.slug = (d.para === "huesped" ? "h-" : "e-") + Date.now().toString(36);
    d.activo = true; d.orden = 500; d.cada_cuanto = "cualquiera"; d.cantidad = 1;
    b.querySelector(".s").disabled = true;
    req("premio_catalogo", { method: "POST", headers: { Prefer: "return=representation" }, body: JSON.stringify(d) })
      .then(function(){ ok("Premio creado"); pintaCrearPremio(); })
      .catch(function(e){ b.querySelector(".s").disabled = false; fallo("crear el premio", e); });
  };
  cont.appendChild(box);
}

/* ============================================================
   LAS DOS PESTAÑAS DE CALENDARIO
   La misma pantalla con distinta cadencia: los huéspedes por día, los pepes
   por semana. Arriba los premios seleccionados, abajo el calendario.
   ============================================================ */
function pintaPremios(){     /* pestaña «Premios» · los pepes */
  vistaReto({ reto: "quiz_equipo_semana", para: "equipo", cadencia: "semanal",
    titulo: "Premios de los pepes",
    bajada: "Uno por semana, para quien más puntos haga. Se lo lleva el número 1 del lunes al domingo." });
}
function pintaPremioDia(){   /* pestaña «Premio del día» · los huéspedes */
  vistaReto({ reto: "quiz_huesped_dia", para: "huesped", cadencia: "diario",
    titulo: "Premio del día del huésped",
    bajada: "Uno por día. La carta entra sola en su billetera de Vnums poco después de medianoche, hora de Ciudad de México. Se cierra por sede: uno en CDMX y otro en Puebla." });
}

function vistaReto(cfg){
  var v = document.getElementById("vista");
  v.innerHTML = '<div class="cargando">Cargando…</div>';
  Promise.all([
    cargaCatalogoPremios(),
    rpc("premio_calendario_ver", { p_reto: cfg.reto, p_desde: null, p_semanas: 8 })
  ]).then(function(r){
    var c = r[1] || {};
    if(c.ok === false){ v.innerHTML = '<div class="card"><div class="vacio">' + esc(c.motivo || "No se pudo cargar") + "</div></div>"; return; }
    CALEND = { cfg: cfg, desde: c.desde, puede: c.puede === true, filas: (c.filas || []).slice() };
    dibujaReto();
  }).catch(function(e){
    v.innerHTML = '<div class="card"><div class="vacio">No se pudo cargar el calendario.</div></div>';
    fallo("cargar el calendario de premios", e);
  });
}

function dibujaReto(){
  var cfg = CALEND.cfg;
  var v = document.getElementById("vista");
  v.innerHTML = "";
  if(!CALEND.puede){
    v.appendChild(nodo('<div class="aviso-linea"><b>Sin permiso.</b> Puedes mirar el calendario, no cambiarlo.</div>'));
  }
  v.appendChild(seccionSeleccionados(cfg));
  v.appendChild(seccionCalendario(cfg));
  if(cfg.para === "equipo") v.appendChild(seccionCerrarSemana());
  v.appendChild(seccionGanadores(cfg));
}

/* --- 1. PREMIOS SELECCIONADOS -------------------------------
   Las mismas fichas de Crear premio, con lo que decide cómo entran al
   calendario. El título y la descripción no se tocan aquí a propósito: si se
   pudieran cambiar en dos sitios, acabarían diciendo cosas distintas. */
function seccionSeleccionados(cfg){
  var c = nodo('<div class="card"></div>');
  c.innerHTML =
    '<div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Premios seleccionados</div>' +
    '<div class="small muted" style="margin-top:3px">De los que hay en <b>Crear premio</b>, éstos son los que entran en el calendario. ' +
      'El nombre y la letra chica se cambian allí.</div>' +
    '<div class="tabla-wrap" style="margin-top:9px"></div>';
  var w = c.querySelector(".tabla-wrap");
  var filas = premiosDe(cfg.para);
  if(!filas.length){ w.appendChild(nodo('<div class="vacio">No hay premios de este tipo. Créalos en «Crear premio».</div>')); return c; }

  var t = nodo('<table><thead><tr>' +
    "<th>Premio</th><th>Cada cuánto</th><th>Dónde vale</th><th>Unidades</th><th>Qué es</th><th>Encendido</th><th></th>" +
    "</tr></thead><tbody></tbody></table>");
  var tb = t.querySelector("tbody");
  filas.forEach(function(p){
    var tr = nodo("<tr" + (p.activo ? "" : ' style="opacity:.55"') + "></tr>");
    tr.innerHTML =
      "<td><b>" + iconoPremio(p) + " " + esc(p.nombre) + "</b>" +
        (p.detalle ? '<div class="small muted">' + esc(p.detalle) + "</div>" : "") +
        (cfg.para === "huesped" && !p.vnum_slug ? '<div class="small" style="color:#8a2626">Sin carta de Vnums: no entra al calendario</div>' : "") +
      "</td>" +
      '<td><select class="s-cada">' + opciones(PERIODOS, p.cada_cuanto || "cualquiera") + "</select></td>" +
      '<td><select class="s-sede">' + opciones(SEDES_CAT, p.sede || "") + "</select></td>" +
      '<td><input class="s-uni" type="number" min="1" max="99" value="' + (p.cantidad == null ? 1 : p.cantidad) + '" style="width:72px"></td>' +
      '<td><select class="s-tipo">' + opciones(TIPOS_CAT, p.tipo) + "</select></td>" +
      '<td><select class="s-act">' + opciones([["si", "Encendido"], ["no", "Apagado"]], p.activo ? "si" : "no") + "</select></td>" +
      '<td><button class="btn sm oro s-ok">Guardar</button></td>';
    var b = tr.querySelector(".s-ok");
    b.disabled = !CALEND.puede;
    b.onclick = function(){
      b.disabled = true;
      patchCatalogo(p.id, {
        cada_cuanto: tr.querySelector(".s-cada").value,
        sede: tr.querySelector(".s-sede").value || null,
        cantidad: Number(tr.querySelector(".s-uni").value || 1),
        tipo: tr.querySelector(".s-tipo").value,
        activo: tr.querySelector(".s-act").value === "si"
      }, function(){ b.disabled = false; });
    };
    tb.appendChild(tr);
  });
  w.appendChild(t);
  return c;
}

/* --- 2. EL CALENDARIO --------------------------------------- */
function seccionCalendario(cfg){
  var c = nodo('<div class="card"></div>');
  c.innerHTML =
    '<div class="row" style="justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap">' +
      "<div>" +
        '<div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Calendario de premios · ' +
          (cfg.cadencia === "diario" ? "día a día" : "semana a semana") + "</div>" +
        '<div class="small muted" style="margin-top:3px">' + esc(cfg.bajada) + "</div>" +
      "</div>" +
      '<div class="row" style="gap:7px">' +
        '<button class="btn" id="cal-prop">Proponme un calendario</button>' +
        '<button class="btn oro" id="cal-guardar">Guardar calendario</button>' +
      "</div>" +
    "</div>" +
    '<div class="small muted" id="cal-aviso" style="margin-top:7px"></div>' +
    '<div id="cal-cuerpo" style="margin-top:10px"></div>';

  var bp = c.querySelector("#cal-prop"), bg = c.querySelector("#cal-guardar");
  bp.disabled = !CALEND.puede; bg.disabled = !CALEND.puede;

  bp.onclick = function(){
    bp.disabled = true; bp.textContent = "Pensando…";
    rpc("premio_calendario_proponer", { p_reto: cfg.reto, p_desde: null, p_semanas: 8 }).then(function(r){
      bp.disabled = false; bp.textContent = "Proponme un calendario";
      if(!r || r.ok === false){ fallo("proponer el calendario", new Error((r && r.motivo) || "")); return; }
      CALEND.filas = (r.filas || []).map(function(f){ return f; });
      var apretados = CALEND.filas.filter(function(f){ return f.apretado; }).length;
      dibujaReto();
      var av = document.getElementById("cal-aviso");
      if(av) av.innerHTML = apretados
        ? '<b>Propuesta lista, pero apretada.</b> ' + apretados + ' de ' + CALEND.filas.length +
          ' huecos repiten antes de lo que pide su periodicidad: hay pocos premios encendidos para tantas semanas. ' +
          'Enciende alguno más o bájale el «cada cuánto». <b>Todavía no se ha guardado.</b>'
        : '<b>Propuesta lista.</b> Ninguno se repite antes de tiempo. Cámbiale lo que quieras y dale a guardar. <b>Todavía no se ha guardado.</b>';
    }).catch(function(e){ bp.disabled = false; bp.textContent = "Proponme un calendario"; fallo("proponer el calendario", e); });
  };

  bg.onclick = function(){
    bg.disabled = true; bg.textContent = "Guardando…";
    rpc("premio_calendario_guardar", { p_reto: cfg.reto, p_filas: CALEND.filas }).then(function(r){
      bg.disabled = false; bg.textContent = "Guardar calendario";
      if(!r || r.ok === false){ fallo("guardar el calendario", new Error((r && r.motivo) || "")); return; }
      ok("Calendario guardado · " + r.puestos + " puestos" + (r.vaciados ? ", " + r.vaciados + " vacíos" : ""));
      vistaReto(cfg);
    }).catch(function(e){ bg.disabled = false; bg.textContent = "Guardar calendario"; fallo("guardar el calendario", e); });
  };

  var cuerpo = c.querySelector("#cal-cuerpo");
  if(cfg.cadencia === "diario") cuerpo.appendChild(calendarioDiario(cfg));
  else cuerpo.appendChild(calendarioSemanal(cfg));
  return c;
}

function selectPremio(cfg, fila){
  var elegibles = premiosDe(cfg.para).filter(function(p){
    if(cfg.para === "huesped" && !p.vnum_slug) return false;
    return p.activo || p.id === fila.premio_id;     /* el apagado que ya estaba puesto se sigue viendo */
  });
  var s = nodo('<select style="width:100%"><option value="">— cae al patrón —</option></select>');
  elegibles.forEach(function(p){
    var o = document.createElement("option");
    o.value = p.id; o.textContent = (p.activo ? "" : "· apagado · ") + p.nombre;
    if(p.id === fila.premio_id) o.selected = true;
    s.appendChild(o);
  });
  s.disabled = !CALEND.puede;
  s.onchange = function(){
    fila.premio_id = s.value || null;
    var p = CATP.filter(function(x){ return x.id === s.value; })[0];
    fila.nombre = p ? p.nombre : null;
    fila.emoji = p ? p.emoji : null;
  };
  return s;
}

function calendarioDiario(cfg){
  var g = nodo('<div class="grid2"></div>');
  var porSemana = {};
  CALEND.filas.forEach(function(f){
    var k = f.semana || lunesDe(f.fecha);
    (porSemana[k] = porSemana[k] || []).push(f);
  });
  var hoy = isoDia(new Date());
  Object.keys(porSemana).sort().forEach(function(sem){
    var card = nodo('<div class="semana"><h3>Semana del ' + esc(fechaCorta(sem)) + "</h3></div>");
    DOW_ORDEN.forEach(function(dw){
      var f = porSemana[sem].filter(function(x){ return Number(x.dow) === dw; })[0];
      if(!f) return;
      var esHoy = (f.fecha === hoy);
      var fila = nodo('<div class="row" style="align-items:center;gap:8px;margin-top:7px"></div>');
      fila.innerHTML = '<div style="width:92px;flex:none;font-size:12.5px' + (esHoy ? ";font-weight:800;color:var(--oro,#C9501A)" : "") + '">' +
        esc(DIAS_NOM[dw]) + (esHoy ? " · hoy" : "") + "</div>";
      var hueco = nodo('<div class="grow"></div>');
      hueco.appendChild(selectPremio(cfg, f));
      fila.appendChild(hueco);
      card.appendChild(fila);
    });
    g.appendChild(card);
  });
  if(!Object.keys(porSemana).length) g.appendChild(nodo('<div class="vacio">Sin calendario. Dale a «Proponme un calendario».</div>'));
  return g;
}

function calendarioSemanal(cfg){
  var cont = nodo("<div></div>");
  var lunHoy = lunesDe(new Date());
  if(!CALEND.filas.length){ cont.appendChild(nodo('<div class="vacio">Sin calendario. Dale a «Proponme un calendario».</div>')); return cont; }
  CALEND.filas.slice().sort(function(a, b){ return a.semana < b.semana ? -1 : 1; }).forEach(function(f){
    var esta = (f.semana === lunHoy);
    var fila = nodo('<div class="row" style="align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--linea,#e6dfd6)"></div>');
    fila.innerHTML = '<div style="width:190px;flex:none;font-size:13px' + (esta ? ";font-weight:800;color:var(--oro,#C9501A)" : "") + '">' +
      "Lunes " + esc(fechaCorta(f.semana)) + (esta ? " · esta semana" : "") + "</div>";
    var hueco = nodo('<div class="grow"></div>');
    hueco.appendChild(selectPremio(cfg, f));
    fila.appendChild(hueco);
    cont.appendChild(fila);
  });
  return cont;
}

/* --- 3. CERRAR LA SEMANA (sólo pepes) ----------------------- */
function seccionCerrarSemana(){
  var lunesHoy = lunesDe(new Date());
  var c = nodo('<div class="card"></div>');
  c.innerHTML =
    '<div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Cerrar la semana</div>' +
    '<div class="row" style="margin-top:8px">' +
      '<div style="width:190px"><label class="f">Semana a cerrar</label><input type="date" id="cs-fecha" value="' + esc(lunesHoy) + '"></div>' +
      '<div style="align-self:flex-end"><button class="btn oro" id="cs-btn">Cerrar la semana</button></div>' +
      '<div class="small muted grow" style="align-self:flex-end">Le da el premio al número 1 de esa semana y, si el premio es dinero, le abona los pepepesos.</div>' +
    "</div><div id=\"cs-res\"></div>";
  var inpF = c.querySelector("#cs-fecha");
  inpF.onchange = function(){ this.value = lunesDe(this.value); };
  var b = c.querySelector("#cs-btn");
  b.disabled = !CALEND.puede;
  b.onclick = function(){
    var f = lunesDe(inpF.value || lunesHoy);
    if(!confirm("Cerrar la semana del lunes " + f + ".\n\nSe le asigna el premio al número 1 de esa semana. ¿Seguimos?")) return;
    b.disabled = true;
    rpc("pq_cerrar_semana", { p_fecha: f }).then(function(d){
      b.disabled = false;
      var prem = (d && Array.isArray(d.premios)) ? d.premios.map(function(x){ return x.premio; }).join(" · ") : "—";
      c.querySelector("#cs-res").innerHTML = '<div class="nota" style="margin-top:10px">' +
        "<b>Semana " + esc(fechaCorta(d.semana)) + " cerrada.</b><br>" +
        "Ganador: <b>" + esc(nombreEmp(d.ganador)) + "</b> con <b>" + esc(d.puntos) + "</b> puntos.<br>" +
        "Premios: " + esc(prem) + "</div>";
      ok("Semana cerrada");
    }).catch(function(e){ b.disabled = false; fallo("cerrar la semana", e); });
  };
  return c;
}

/* --- 4. QUIÉN SE LO LLEVÓ ----------------------------------- */
function seccionGanadores(cfg){
  var c = nodo('<div class="card"><div class="small muted" style="font-weight:700;text-transform:uppercase;letter-spacing:.4px">Quién se lo llevó</div><div class="cuerpo" style="margin-top:8px"></div></div>');
  var w = c.querySelector(".cuerpo");
  w.innerHTML = '<div class="small muted">Cargando…</div>';
  if(cfg.para === "huesped"){
    get("pq_premio_ganado_dia?select=fecha,sede,nombre,pts,slug,nota&order=fecha.desc&limit=30").then(function(g){
      if(!g || !g.length){ w.innerHTML = '<div class="vacio">Todavía no se ha cerrado ningún día.</div>'; return; }
      w.innerHTML = g.map(function(x){
        return '<div class="row" style="justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--linea,#e6dfd6)">' +
          "<span>" + esc(fechaCorta(x.fecha)) + ' · <span class="muted">' + esc(x.sede) + "</span></span>" +
          '<span class="grow" style="font-weight:700">' + esc(x.nombre || "—") + "</span>" +
          "<span>" + (x.pts == null ? "" : x.pts + " pts") +
          (x.nota ? ' · <span class="muted">' + esc(x.nota) + "</span>" : "") + "</span></div>";
      }).join("");
    }).catch(function(){ w.innerHTML = '<div class="vacio">No se pudo cargar.</div>'; });
  }else{
    Promise.all([
      get("pq_premio_ganado?select=*&order=semana_inicio.desc&limit=60").catch(function(){ return []; }),
      get("pq_premio?select=id,titulo,pepepesos").catch(function(){ return []; })
    ]).then(function(r){
      var g = r[0] || [], pm = {};
      (r[1] || []).forEach(function(p){ pm[p.id] = p; });
      if(!g.length){ w.innerHTML = '<div class="vacio">Todavía no se ha cerrado ninguna semana.</div>'; return; }
      var t = '<div class="tabla-wrap"><table><thead><tr><th>Semana</th><th>Ganador</th><th>Premio</th><th>Estado</th></tr></thead><tbody>';
      g.forEach(function(x){
        var p = pm[x.premio_id];
        t += "<tr><td>" + esc(fechaCorta(x.semana_inicio)) + "</td><td>" + esc(nombreEmp(x.employee_id)) + "</td>" +
          "<td>" + esc(p ? p.titulo : "(premio borrado)") + (p && p.pepepesos > 0 ? ' <span class="chip oro">' + p.pepepesos + " pp</span>" : "") + "</td>" +
          '<td><span class="chip ' + (x.estado === "entregado" ? "verde" : "gris") + '">' + esc(x.estado) + "</span></td></tr>";
      });
      w.innerHTML = t + "</tbody></table></div>";
    }).catch(function(){ w.innerHTML = '<div class="vacio">No se pudo cargar.</div>'; });
  }
  return c;
}
/* ============================================================
   4 · PEPEPESOS
   ============================================================ */
var pp = { solicitudes: [], catalogo: [], catmap: {}, saldos: [] };

function pintaPepepesos(){
  var v = document.getElementById("vista");
  v.innerHTML = '<div class="cargando">Cargando pepepesos…</div>';
  Promise.all([
    get("pp_solicitud?select=*&estado=eq.canjeado&order=creado.asc"),
    get("pp_catalogo?select=*&order=orden.asc,nombre.asc"),
    todosMovimientos()
  ]).then(function(r){
    pp.solicitudes = r[0] || [];
    pp.catalogo = r[1] || [];
    pp.catmap = {};
    pp.catalogo.forEach(function(c){ pp.catmap[c.id] = c; });
    var acum = {};
    (r[2] || []).forEach(function(m){ acum[m.employee_id] = (acum[m.employee_id] || 0) + (Number(m.delta) || 0); });
    pp.saldos = Object.keys(acum).map(function(id){ return { id: id, saldo: acum[id], nombre: nombreEmp(id) }; })
      .sort(function(a,b){ return b.saldo - a.saldo; });
    dibujaPepepesos();
  }).catch(function(e){
    v.innerHTML = '<div class="card"><div class="vacio">No se pudieron cargar los pepepesos.</div></div>';
    fallo("cargar los pepepesos", e);
  });
}

function todosMovimientos(){
  var todos = [], paso = 1000;
  function tramo(off){
    return get("pp_movimiento?select=employee_id,delta&order=creado.asc&limit=" + paso + "&offset=" + off)
      .then(function(rows){
        rows = rows || [];
        todos = todos.concat(rows);
        if(rows.length === paso && off < 20000) return tramo(off + paso);
        return todos;
      });
  }
  return tramo(0).catch(function(e){ fallo("leer los movimientos", e); return []; });
}

function dibujaPepepesos(){
  var v = document.getElementById("vista");
  v.innerHTML = "";
  var bp = bannerPermiso("premiador", "No tienes permiso de premios (PAG-PQ-PREMIOS): puedes ver, no aprobar ni tocar el catálogo.");
  if(bp) v.appendChild(bp);
  v.appendChild(nodo('<div class="aviso-linea"><b>1 pepepeso = 1 peso.</b> El Pepe canjea solo, y sólo cuando ya le alcanza: aquí no se aprueba nada, se entrega. Cada canje trae su folio.</div>'));

  /* --- solicitudes --- */
  var s = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Canjes por entregar</b>' +
               '<span class="chip ' + (pp.solicitudes.length ? "rojo" : "gris") + '">' + pp.solicitudes.length + "</span></div><div class=\"cuerpo\"></div></div>");
  var cuerpo = s.querySelector(".cuerpo");
  if(!pp.solicitudes.length){
    cuerpo.appendChild(nodo('<div class="vacio">No hay canjes por entregar.</div>'));
  }else{
    pp.solicitudes.forEach(function(so){ cuerpo.appendChild(filaSolicitud(so)); });
  }
  v.appendChild(s);

  /* --- catálogo --- */
  var c = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Catálogo</b>' +
               '<button class="btn sm" id="cat-nuevo">+ Nuevo</button></div><div class="lista"></div></div>');
  var lc = c.querySelector(".lista");
  if(!pp.catalogo.length) lc.appendChild(nodo('<div class="vacio">Catálogo vacío.</div>'));
  pp.catalogo.forEach(function(it){ lc.appendChild(filaCatalogo(it)); });
  c.querySelector("#cat-nuevo").onclick = function(){ formCatalogo(lc); };
  v.appendChild(c);

  /* --- saldos --- */
  var sa = nodo('<div class="card"><div class="row" style="justify-content:space-between"><b>Saldos</b>' +
                '<button class="btn sm oro" id="ajuste">Abonar o ajustar</button></div>' +
                '<div id="ajuste-box"></div><div class="tabla-wrap" style="margin-top:8px"></div></div>');
  var w = sa.querySelector(".tabla-wrap");
  if(!pp.saldos.length){
    w.appendChild(nodo('<div class="vacio">Nadie tiene movimientos todavía.</div>'));
  }else{
    var t = '<table><thead><tr><th>Colaborador</th><th style="text-align:right">Saldo</th></tr></thead><tbody>';
    pp.saldos.forEach(function(x){
      t += "<tr><td>" + esc(x.nombre) + '</td><td class="num"><b>' + x.saldo + "</b></td></tr>";
    });
    t += "</tbody></table>";
    w.innerHTML = t;
  }
  sa.querySelector("#ajuste").onclick = function(){ formAjuste(sa.querySelector("#ajuste-box")); };
  v.appendChild(sa);
}

function filaSolicitud(so){
  var cat = so.catalogo_id ? pp.catmap[so.catalogo_id] : null;
  var box = nodo('<div class="premio"></div>');
  box.innerHTML =
    '<div class="row" style="justify-content:space-between">' +
      "<div><b>" + esc(nombreEmp(so.employee_id)) + "</b> · " + esc(so.concepto) + "</div>" +
      '<div class="small muted">' + esc(fecha(so.creado)) + "</div>" +
    "</div>" +
    '<div class="row small" style="gap:6px;margin-top:6px">' +
      '<span class="chip oro"><b>' + esc(so.folio || "sin folio") + "</b></span>" +
      '<span class="chip">' + so.monto + " pepepesos</span>" +
      (cat ? '<span class="chip gris">' + esc(cat.tipo) + (cat.plaza ? " · " + esc(cat.plaza) : "") + "</span>" : "") +
    "</div>" +
    (so.nota ? '<div class="nota" style="margin-top:7px"><b>Su nota:</b> ' + esc(so.nota) + "</div>" : "") +
    '<div class="grid2" style="margin-top:9px">' +
      '<div><label class="f">Nota</label><input type="text" class="s-nota" placeholder="opcional"></div>' +
    "</div>" +
    '<div class="acciones"><button class="btn verde s-ok">Marcar entregado</button><button class="btn rojo s-no">Cancelar y devolver</button></div>';

  function resolver(entregar){
    if(!entregar && !confirm("Se le devuelven " + so.monto + " pepepesos. ¿Seguimos?")) return;
    var nota = box.querySelector(".s-nota").value.trim() || null;
    box.querySelector(".s-ok").disabled = true;
    box.querySelector(".s-no").disabled = true;
    rpc(entregar ? "pp_entregar" : "pp_cancelar_canje", { p_id: so.id, p_nota: nota })
      .then(function(){ ok(entregar ? "Entregado" : "Cancelado y devuelto"); pintaPepepesos(); })
      .catch(function(e){
        box.querySelector(".s-ok").disabled = false;
        box.querySelector(".s-no").disabled = false;
        fallo("resolver el canje", e);
      });
  }
  box.querySelector(".s-ok").onclick = function(){ resolver(true); };
  box.querySelector(".s-no").onclick = function(){ resolver(false); };
  return box;
}

function filaCatalogo(it){
  var box = nodo('<div class="premio' + (it.activo ? "" : " off") + '"></div>');
  function ver(){
    box.innerHTML =
      '<div class="row" style="justify-content:space-between">' +
        "<div><b>" + esc(it.nombre) + "</b></div>" +
        '<div><span class="chip ' + (Number(it.costo) === 0 ? "oro" : "") + '">' +
          (it.costo + " pp") + "</span></div>" +
      "</div>" +
      '<div class="row small" style="gap:5px;margin-top:5px">' +
        '<span class="chip gris">' + esc(it.tipo) + "</span>" +
        (it.plaza ? '<span class="chip gris">' + esc(it.plaza) + "</span>" : "") +
        '<span class="chip gris">orden ' + esc(it.orden) + "</span>" +
        (it.activo ? "" : '<span class="chip rojo">Apagado</span>') +
      "</div>" +
      (it.nota ? '<div class="small muted" style="margin-top:5px">' + esc(it.nota) + "</div>" : "") +
      '<div class="acciones"></div>';
    var acc = box.querySelector(".acciones");
    var be = nodo('<button class="btn sm">Editar</button>'); be.onclick = editar; acc.appendChild(be);
    var ba = nodo('<button class="btn sm">' + (it.activo ? "Apagar" : "Encender") + "</button>");
    ba.onclick = function(){ patchCat(it.id, { activo: !it.activo }); };
    acc.appendChild(ba);
    var bb = nodo('<button class="btn sm rojo">Borrar</button>');
    bb.onclick = function(){
      if(!confirm("Borrar «" + it.nombre + "» del catálogo?")) return;
      req("pp_catalogo?id=eq." + encodeURIComponent(it.id), { method: "DELETE" })
        .then(function(){ ok("Borrado del catálogo"); pintaPepepesos(); })
        .catch(function(e){ fallo("borrar del catálogo", e); });
    };
    acc.appendChild(bb);
  }
  function editar(){
    box.innerHTML = camposCatalogo(it);
    var acc = nodo('<div class="acciones"><button class="btn verde s">Guardar</button><button class="btn gh c">Cancelar</button></div>');
    box.appendChild(acc);
    acc.querySelector(".c").onclick = ver;
    acc.querySelector(".s").onclick = function(){
      var d = leeCamposCatalogo(box);
      if(d) patchCat(it.id, d);
    };
  }
  ver();
  return box;
}
function camposCatalogo(it){
  it = it || {};
  return '' +
    '<label class="f">Nombre</label><input type="text" class="c-nom" value="' + esc(it.nombre || "") + '">' +
    '<div class="grid2" style="margin-top:8px">' +
      '<div><label class="f">Tipo</label><input type="text" class="c-tip" value="' + esc(it.tipo || "otro") + '"></div>' +
      '<div><label class="f">Plaza</label><input type="text" class="c-pla" value="' + esc(it.plaza || "") + '" placeholder="cdmx / puebla / vacío"></div>' +
      '<div><label class="f">Costo en pepepesos (0 = a cotizar)</label><input type="number" class="c-cos" min="0" step="1" value="' + esc(it.costo != null ? it.costo : 0) + '"></div>' +
      '<div><label class="f">Orden</label><input type="number" class="c-ord" step="1" value="' + esc(it.orden || 0) + '"></div>' +
    "</div>" +
    '<label class="f" style="margin-top:8px">Nota</label><input type="text" class="c-not" value="' + esc(it.nota || "") + '">' +
    '<div style="margin-top:8px;max-width:160px"><label class="f">Activo</label><select class="c-act">' +
      '<option value="1"' + (it.activo === false ? "" : " selected") + '>Sí</option>' +
      '<option value="0"' + (it.activo === false ? " selected" : "") + ">No</option></select></div>";
}
function leeCamposCatalogo(box){
  var nom = box.querySelector(".c-nom").value.trim();
  if(!nom){ aviso("Falta el nombre", "", "err", 6000); return null; }
  var tip = box.querySelector(".c-tip").value.trim() || "otro";
  return {
    nombre: nom,
    tipo: tip,
    plaza: box.querySelector(".c-pla").value.trim() || null,
    costo: Number(box.querySelector(".c-cos").value) || 0,
    nota: box.querySelector(".c-not").value.trim() || null,
    orden: Number(box.querySelector(".c-ord").value) || 0,
    activo: box.querySelector(".c-act").value === "1"
  };
}
function patchCat(id, patch){
  req("pp_catalogo?id=eq." + encodeURIComponent(id), { method: "PATCH", body: JSON.stringify(patch) })
    .then(function(){ ok("Catálogo guardado"); pintaPepepesos(); })
    .catch(function(e){ fallo("guardar el catálogo", e); });
}
function formCatalogo(cont){
  var box = nodo('<div class="premio" style="border-color:#e9d68e;background:#fffdf4"></div>');
  box.innerHTML = camposCatalogo({ tipo: "otro", costo: 0, orden: 0, activo: true });
  var acc = nodo('<div class="acciones"><button class="btn verde s">Crear</button><button class="btn gh c">Cancelar</button></div>');
  box.appendChild(acc);
  acc.querySelector(".c").onclick = function(){ box.remove(); };
  acc.querySelector(".s").onclick = function(){
    var d = leeCamposCatalogo(box);
    if(!d) return;
    acc.querySelector(".s").disabled = true;
    req("pp_catalogo", { method: "POST", headers: { "Prefer": "return=representation" }, body: JSON.stringify(d) })
      .then(function(){ ok("Añadido al catálogo"); pintaPepepesos(); })
      .catch(function(e){ acc.querySelector(".s").disabled = false; fallo("añadir al catálogo", e); });
  };
  cont.insertBefore(box, cont.firstChild);
}

function formAjuste(cont){
  if(cont.firstChild){ cont.innerHTML = ""; return; }
  var box = nodo('<div class="premio" style="border-color:#e9d68e;background:#fffdf4;margin-top:10px"></div>');
  box.innerHTML =
    '<div class="grid2">' +
      '<div><label class="f">Colaborador</label><select class="a-emp"></select></div>' +
      '<div><label class="f">Pepepesos (negativo para descontar)</label><input type="number" class="a-delta" step="1" value="0"></div>' +
    "</div>" +
    '<label class="f" style="margin-top:8px">Concepto</label><input type="text" class="a-con" placeholder="por qué se abona o se descuenta">' +
    '<div class="acciones"><button class="btn verde s">Aplicar</button><button class="btn gh c">Cancelar</button></div>';
  var sel = box.querySelector(".a-emp");
  sel.innerHTML = '<option value="">— elige —</option>' + EMPS.map(function(e){
    return '<option value="' + esc(e.id) + '">' + esc(e.nombre_display || e.nombre || e.id) + "</option>";
  }).join("");
  box.querySelector(".c").onclick = function(){ cont.innerHTML = ""; };
  box.querySelector(".s").onclick = function(){
    var emp = sel.value, delta = Number(box.querySelector(".a-delta").value), con = box.querySelector(".a-con").value.trim();
    if(!emp){ aviso("Elige al colaborador", "", "err", 6000); return; }
    if(!delta){ aviso("El movimiento no puede ser 0", "", "err", 6000); return; }
    if(!con){ aviso("Escribe el concepto", "", "err", 6000); return; }
    box.querySelector(".s").disabled = true;
    req("pp_movimiento", {
      method: "POST",
      headers: { "Prefer": "return=representation" },
      body: JSON.stringify({ employee_id: emp, delta: delta, tipo: "ajuste", concepto: con })
    }).then(function(){ ok("Movimiento aplicado"); pintaPepepesos(); })
      .catch(function(e){ box.querySelector(".s").disabled = false; fallo("aplicar el movimiento", e); });
  };
  cont.appendChild(box);
}

/* ============================================================
   ARRANQUE Y PESTAÑAS
   ============================================================ */
var PINTORES = { inc: pintaIncidencias, banco: pintaBanco, crear: pintaCrearPremio,
                 premios: pintaPremios, dia: pintaPremioDia, pesos: pintaPepepesos };
var TAB = "inc";

function irA(t){
  TAB = t;
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"), function(b){
    b.classList.toggle("on", b.dataset.t === t);
  });
  (PINTORES[t] || pintaIncidencias)();
}

document.getElementById("tabs").addEventListener("click", function(ev){
  var b = ev.target.closest("button[data-t]");
  if(b) irA(b.dataset.t);
});

(function arranca(){
  var ses = document.getElementById("sesion");
  if(!TOKEN){
    ses.innerHTML = "Sin sesión.";
    document.getElementById("vista").innerHTML =
      '<div class="card"><div class="vacio">' +
      '<div style="font-size:16px;font-weight:800;margin-bottom:6px">Inicia sesión en SoyPepe</div>' +
      "<div>Este panel usa tu sesión para leer y escribir. Entra a SoyPepe y vuelve a abrir esta pantalla.</div>" +
      "</div></div>";
    return;
  }
  ses.innerHTML = "Sesión de <b>" + esc(EMAIL || "usuario") + "</b>";
  Promise.all([cargarBase(), cargarPermisos()]).then(function(){
    refrescaPendientes();
    /* El Generador de premios viejo manda aquí con ?t=crear, y así cualquier
       liga guardada sigue llevando a donde esperaba. */
    var pedida = (location.search.match(/[?&]t=([a-z]+)/) || [])[1];
    irA(PINTORES[pedida] ? pedida : "inc");     // si no, Incidencias primero
  }).catch(function(e){
    fallo("cargar categorías y colaboradores", e);
    irA("inc");
  });
})();
