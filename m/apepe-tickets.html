<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Avisos del chat · Huéspedes</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="/dash-192.png">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --error:#9E3B2E; --error-bg:#F6E1DD; --cielo-suave:#E4F1FA; --cielo:#2A6588;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4); --radio:12px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;
  font-size:15px;line-height:1.55}
.top{background:var(--papel);border-bottom:1px solid var(--linea);padding:16px 18px 0}
.top-in{max-width:1180px;margin:0 auto}
.top h1{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;font-size:22px;margin:0}
.top .sub{color:var(--gris);font-size:13px;margin:5px 0 0;max-width:76ch;line-height:1.55}
.nav{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{border:0;background:none;font:inherit;font-size:13.5px;color:var(--gris);
  padding:9px 14px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.nav button[aria-selected=true]{color:var(--tinta);border-bottom-color:var(--naranja);font-weight:600}
.nav button .n{background:var(--hueso);border-radius:999px;padding:1px 7px;font-size:11.5px;margin-left:6px}
.nav button[aria-selected=true] .n{background:var(--naranja-suave);color:var(--naranja-oscuro)}

.wrap{max-width:1180px;margin:0 auto;padding:16px 18px 80px}
.barra{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--linea);background:var(--blanco);border-radius:999px;padding:7px 14px;
  font:inherit;font-size:13px;cursor:pointer;color:var(--tinta-2)}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.mini{color:var(--gris);font-size:12.5px;margin-left:auto}

.t{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:15px 16px;margin-bottom:11px;display:flex;gap:14px;align-items:flex-start}
.t.p1{border-left:4px solid var(--error)}
.t.p2{border-left:4px solid var(--alerta)}
.t.p3{border-left:4px solid var(--linea)}
.t .qu{flex:1;min-width:0}
.t .folio{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;color:var(--tenue)}
.t h3{font-family:Oswald,sans-serif;font-weight:600;font-size:16px;text-transform:uppercase;
  margin:2px 0 4px;line-height:1.2}
.t .det{font-size:13.5px;color:var(--tinta-2);line-height:1.55}
.t .meta{font-size:12.5px;color:var(--gris);margin-top:7px;display:flex;gap:10px;flex-wrap:wrap}
.et{display:inline-block;font-family:Oswald,sans-serif;font-weight:600;font-size:10.5px;
  letter-spacing:.09em;text-transform:uppercase;padding:3px 9px;border-radius:5px;
  background:var(--hueso);color:var(--gris)}
.et.inc{background:var(--error-bg);color:var(--error)}
.et.cam{background:var(--cielo-suave);color:var(--cielo)}
.et.que{background:var(--alerta-bg);color:var(--alerta)}
.et.ok{background:var(--ok-bg);color:var(--ok)}
.acc{display:flex;flex-direction:column;gap:6px;flex:0 0 auto}
.btn{border:1px solid var(--linea);background:var(--blanco);border-radius:9px;font:inherit;
  font-size:12.5px;padding:8px 13px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--hueso)}
.btn.nar{background:var(--naranja);border-color:var(--naranja);color:#fff}
.btn.nar:hover{background:var(--naranja-oscuro)}
.btn:disabled{opacity:.5;cursor:default}
.chat{margin-top:10px;border-top:1px dashed var(--linea);padding-top:10px;display:none}
.chat.on{display:block}
.msg{font-size:13px;line-height:1.5;margin:6px 0;padding:8px 11px;border-radius:10px;max-width:85%}
.msg.user{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.msg.assistant{background:var(--hueso);color:var(--tinta-2);margin-left:auto}
.msg b{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;opacity:.7}
.vacio{padding:50px 20px;text-align:center;color:var(--tenue)}
.vacio b{display:block;font-family:Oswald,sans-serif;text-transform:uppercase;font-size:14px;
  letter-spacing:.05em;color:var(--gris);margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--tinta);
  color:#fff;padding:11px 18px;border-radius:10px;font-size:13.5px;display:none;z-index:80}
.toast.err{background:var(--error)}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <h1>Avisos del chat</h1>
  <div class="sub">Lo que Don José detecta hablando con el huésped y no puede resolver él.
    Aquí se reparte y se cierra. El chat que lo originó está en cada aviso: no te fíes solo
    del resumen, léelo.</div>
  <div class="nav" id="nav"></div>
</div></div>

<div class="wrap">
  <div class="barra" id="barra"></div>
  <div id="lista"></div>
  <div class="vacio" id="vacio" style="display:none"><b>Nada por aquí</b>Cuando un huésped cuente algo que haya que atender, aparece solo.</div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cp-acceso.js"></script>
<script>if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var sb=supabase.createClient(SB,KEY);

/* La sesión del panel se reusa: quien está en recepción no vuelve a entrar. */
(function(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v);
  if(s&&s.access_token){sb.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});break;}}}}catch(_){}})();

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function toast(t,e){var x=$('toast');x.textContent=t;x.className='toast'+(e?' err':'');
  x.style.display='block';setTimeout(function(){x.style.display='none';},e?4800:2600);}
function cuando(ts){
  if(!ts)return '';
  var d=new Date(ts), ahora=new Date();
  var min=Math.round((ahora-d)/60000);
  if(min<1)return 'ahora mismo';
  if(min<60)return 'hace '+min+' min';
  if(min<1440)return 'hace '+Math.round(min/60)+' h';
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

var TIPOS={
  incidencia:   ['inc','Incidencia'],
  cambio_reserva:['cam','Cambio de reserva'],
  queja:        ['que','Queja o compensación']
};
var SECS=[['abiertos','Por atender'],['curso','En curso'],['cerrados','Cerrados']];
var sec='abiertos', tipoSel='', DATOS=[];

async function carga(){
  var r=await sb.from('apepe_tickets').select('*')
    .order('estado',{ascending:true})
    .order('prioridad',{ascending:true})
    .order('created_at',{ascending:false})
    .limit(300);
  if(r.error){ toast(r.error.message,true); DATOS=[]; }
  else DATOS=r.data||[];
  pinta();
}

function deSec(t){
  if(sec==='abiertos')return t.estado==='nuevo';
  if(sec==='curso')return t.estado==='en_curso';
  return t.estado==='resuelto'||t.estado==='descartado';
}
function visibles(){
  return DATOS.filter(function(t){
    if(!deSec(t))return false;
    if(tipoSel&&t.tipo!==tipoSel)return false;
    return true;
  });
}

function pintaNav(){
  var n={abiertos:DATOS.filter(function(t){return t.estado==='nuevo';}).length,
         curso:DATOS.filter(function(t){return t.estado==='en_curso';}).length,
         cerrados:DATOS.filter(function(t){return t.estado==='resuelto'||t.estado==='descartado';}).length};
  $('nav').innerHTML=SECS.map(function(s){
    return '<button data-s="'+s[0]+'" aria-selected="'+(s[0]===sec)+'">'+esc(s[1])+
           '<span class="n">'+(n[s[0]]||0)+'</span></button>';}).join('');
  Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
    b.onclick=function(){ sec=b.getAttribute('data-s'); pinta(); };
  });
}

function pintaBarra(){
  var l=[['','Todos']].concat(Object.keys(TIPOS).map(function(k){return [k,TIPOS[k][1]];}));
  $('barra').innerHTML=l.map(function(x){
    var n=DATOS.filter(function(t){return deSec(t)&&(!x[0]||t.tipo===x[0]);}).length;
    return '<button class="chip'+(tipoSel===x[0]?' on':'')+'" data-t="'+esc(x[0])+'">'+
           esc(x[1])+' · '+n+'</button>';
  }).join('')+'<span class="mini" id="cuenta"></span>';
  Array.prototype.forEach.call($('barra').querySelectorAll('.chip'),function(b){
    b.onclick=function(){ tipoSel=b.getAttribute('data-t'); pinta(); };
  });
}

function pinta(){
  pintaNav(); pintaBarra();
  var l=visibles();
  var c=$('cuenta'); if(c)c.textContent=l.length+(l.length===1?' aviso':' avisos');
  $('vacio').style.display=l.length?'none':'';
  $('lista').innerHTML=l.map(tarjeta).join('');
  Array.prototype.forEach.call($('lista').querySelectorAll('[data-acc]'),function(b){
    b.onclick=function(){ accion(b.getAttribute('data-id'), b.getAttribute('data-acc'), b); };
  });
  Array.prototype.forEach.call($('lista').querySelectorAll('[data-chat]'),function(b){
    b.onclick=function(){
      var el=document.getElementById('chat-'+b.getAttribute('data-chat'));
      if(!el)return;
      var on=el.classList.toggle('on');
      b.textContent=on?'Ocultar el chat':'Ver el chat';
    };
  });
}

function tarjeta(t){
  var ti=TIPOS[t.tipo]||['','—'];
  var cerrado=t.estado==='resuelto'||t.estado==='descartado';
  var msgs=Array.isArray(t.conversacion)?t.conversacion:[];
  return '<div class="t p'+(t.prioridad||2)+'">'+
    '<div class="qu">'+
      '<div class="folio">'+esc(t.folio||'')+'</div>'+
      '<h3>'+esc(t.titulo||'')+'</h3>'+
      (t.detalle?'<div class="det">'+esc(t.detalle)+'</div>':'')+
      '<div class="meta">'+
        '<span class="et '+ti[0]+'">'+esc(ti[1])+'</span>'+
        (t.prioridad===1?'<span class="et inc">Urgente</span>':'')+
        (t.huesped?'<span>'+esc(t.huesped)+'</span>':'')+
        '<span>'+esc(cuando(t.created_at))+'</span>'+
        (t.asignado_nombre?'<span class="et">'+esc(t.asignado_nombre)+'</span>':'')+
        (cerrado?'<span class="et ok">'+(t.estado==='resuelto'?'Resuelto':'Descartado')+
          (t.resuelto_por?' · '+esc(t.resuelto_por):'')+'</span>':'')+
      '</div>'+
      (msgs.length
        ? '<button class="btn" data-chat="'+esc(t.id)+'" style="margin-top:9px">Ver el chat</button>'+
          '<div class="chat" id="chat-'+esc(t.id)+'">'+msgs.map(function(m){
            return '<div class="msg '+(m.role==='user'?'user':'assistant')+'">'+
              '<b>'+(m.role==='user'?'El huésped':'Don José')+'</b>'+esc(m.content||'')+'</div>';
          }).join('')+'</div>'
        : '')+
    '</div>'+
    '<div class="acc">'+
      (t.estado==='nuevo'
        ? '<button class="btn nar" data-acc="tomar" data-id="'+esc(t.id)+'">Lo tomo</button>' : '')+
      (!cerrado
        ? '<button class="btn" data-acc="resolver" data-id="'+esc(t.id)+'">Resuelto</button>'+
          '<button class="btn" data-acc="descartar" data-id="'+esc(t.id)+'">No aplica</button>'
        : '<button class="btn" data-acc="reabrir" data-id="'+esc(t.id)+'">Reabrir</button>')+
    '</div></div>';
}

async function quienSoy(){
  try{
    var u=(await sb.auth.getUser()).data.user;
    return (u&&(u.user_metadata&&u.user_metadata.nombre))||(u&&u.email)||'recepción';
  }catch(_){ return 'recepción'; }
}

async function accion(id,acc,btn){
  btn.disabled=true;
  var yo=await quienSoy();
  var ahora=new Date().toISOString();
  var cambios={};
  if(acc==='tomar')      cambios={estado:'en_curso', asignado_nombre:yo, visto_at:ahora};
  if(acc==='resolver')   cambios={estado:'resuelto',  resuelto_at:ahora, resuelto_por:yo};
  if(acc==='descartar')  cambios={estado:'descartado',resuelto_at:ahora, resuelto_por:yo};
  if(acc==='reabrir')    cambios={estado:'nuevo', resuelto_at:null, resuelto_por:null, asignado_nombre:null};
  var r=await sb.from('apepe_tickets').update(cambios).eq('id',id);
  btn.disabled=false;
  if(r.error){ toast(r.error.message,true); return; }
  toast(acc==='tomar'?'Tuyo: queda en curso'
       :acc==='resolver'?'Cerrado'
       :acc==='descartar'?'Descartado'
       :'Reabierto');
  await carga();
}

carga();
/* Recepción deja esta pantalla abierta toda la guardia: se refresca sola. */
setInterval(carga, 60000);
})();
</script>
</body>
</html>
