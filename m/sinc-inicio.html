<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inicio · Sincrético</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  INICIO DE SINCRETICO. Javi, 26-oct-2026.

  No es un tablero de indicadores: es la lista de lo que hay que hacer hoy.
  Cada numero lleva a la pantalla donde se arregla, y ninguno se queda en
  "informativo".

  El orden es el de la urgencia real: primero lo que sale hoy, luego lo que
  lleva dias esperando una firma nuestra, luego lo que esta a medias.

  CERO Y ERROR NO SE VEN IGUAL. Un cuadro que no pudo leerse lo dice en rojo
  con el motivo; un cuadro en cero dice que esta en cero. Confundirlos fue
  lo que hizo parecer perdida una venta que estaba ahi.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}
.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.verde{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}
.filtros{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filtros input,.filtros select{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.pill{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.al{background:var(--alerta-bg);color:var(--alerta)}
.pill.er{background:var(--error-bg);color:var(--error)}
.pill.ne{background:var(--hueso);color:var(--gris)}
.pill.na{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.pill.mg{background:var(--magenta-suave);color:#B3106F}
.pill.ci{background:var(--cielo-suave);color:#2F6E93}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:center;padding:13px 15px;margin-bottom:10px}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:34px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 16px Oswald;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;display:none;z-index:60;box-shadow:var(--sombra)}
@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}
.saludo{font:400 italic 22px "Lobster Two";color:var(--magenta);margin:-2px 0 2px}
.rej{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:22px}
.cu{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  padding:15px 16px;text-decoration:none;color:inherit;display:block}
.cu:hover{border-color:var(--tenue)}
.cu .t{font:600 11px Oswald;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.cu .n{font:700 34px Oswald;letter-spacing:.01em;line-height:1.05;margin:6px 0 2px}
.cu .p{font:400 12.5px Inter;color:var(--gris)}
.cu.urge{border-color:#E7B3AA;background:linear-gradient(0deg,#FFF7F5,#fff)}
.cu.urge .n{color:var(--error)}
.cu.malo .n{font-size:17px;color:var(--error);line-height:1.3}
.cu.bien .n{color:var(--ok)}
h2{font:700 15px Oswald;letter-spacing:.07em;text-transform:uppercase;margin:24px 0 10px}
.hora{flex:0 0 58px;text-align:center}
.hora b{display:block;font:700 18px Oswald}
.hora span{font:400 11px Inter;color:var(--tenue)}
.fila .cifra{text-align:right;flex:0 0 auto}
.fila .cifra b{font:600 15px Inter;display:block}
.fila .cifra span{font:400 11.5px Inter;color:var(--tenue)}
.atajos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
a.fila{text-decoration:none;color:inherit}
a.fila:hover{border-color:var(--tenue)}
</style></head><body>
<div class="wrap">

  <div class="encab">
    <div>
      <div class="saludo" id="saludo">How to be a Mexican?</div>
      <h1>Sincrético</h1>
      <div class="cuenta" id="cuenta">Cargando…</div>
    </div>
    <div class="der">
      <a class="btn naranja" target="_top" href="/ficha2.html">Nueva experiencia</a>
    </div>
  </div>

  <div class="rej" id="rej"></div>

  <h2>Lo que sale hoy</h2>
  <div id="hoy"></div>

  <div class="atajos">
    <a class="btn sm gris" target="_top" href="/m/comunidad.html">La comunidad</a>
    <a class="btn sm gris" target="_top" href="/m/productos.html">Productos</a>
    <a class="btn sm gris" target="_top" href="/m/salidas.html">Salidas</a>
    <a class="btn sm gris" target="_top" href="/m/sinc-ventas.html">Ventas</a>
    <a class="btn sm gris" target="_top" href="/m/aprobacion.html">Aprobación</a>
    <a class="btn sm gris" target="_top" href="/m/hoteles.html">Hoteles asociados</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, YO='';

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function hoyISO(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function haceDias(n){var d=new Date();d.setDate(d.getDate()-n);d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10);}
function dinero(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function hhmm(h){return String(h||'').slice(0,5)||'—';}

async function trae(q){
  var r=await fetch(SB+'/rest/v1/'+q,{headers:hdr()});
  if(!r.ok) throw new Error('respondió '+r.status);
  return r.json();
}

/* Cada cuadro se pide por su cuenta y falla por su cuenta: que no se pueda
   leer la cola no debe dejar en blanco las salidas de hoy. */
function cuadro(o){
  var cl = o.error?'malo' : o.urge?'urge' : o.bien?'bien':'';
  var n = o.error ? 'No se pudo leer' : o.n;
  var p = o.error ? esc(o.error) : esc(o.p||'');
  return '<a class="cu '+cl+'" target="_top" href="'+o.href+'">'+
    '<div class="t">'+esc(o.t)+'</div><div class="n">'+esc(String(n))+'</div><div class="p">'+p+'</div></a>';
}

async function carga(){
  var rej=$('rej'); rej.innerHTML='<div class="vacio" style="grid-column:1/-1">Cargando…</div>';
  var hoy=hoyISO();
  var cuadros=[];

  /* 1 · salidas de hoy */
  var salidas=null, errSal='';
  try{ salidas=await trae('v_sinc_salidas?select=*&fecha=eq.'+hoy+'&order=hora'); }
  catch(e){ errSal=(e&&e.message)||String(e); }
  if(errSal){ cuadros.push(cuadro({t:'Sale hoy',href:'/m/salidas.html',error:errSal})); }
  else{
    var pax=0, cobrar=0, sinGuia=0;
    salidas.forEach(function(s){ pax+=Number(s.cupo_tomado||0); cobrar+=Number(s.por_cobrar||0); if(!s.guia_id) sinGuia++; });
    cuadros.push(cuadro({t:'Sale hoy',n:salidas.length,href:'/m/salidas.html',
      p: salidas.length ? pax+' personas'+(sinGuia?' · '+sinGuia+' sin guía':'') : 'nada programado para hoy',
      urge: !!sinGuia}));
    if(cobrar) cuadros.push(cuadro({t:'Por cobrar hoy',n:cobrar,href:'/m/salidas.html',
      p:'reservas que llegan sin pagar',urge:true}));
  }

  /* 2 · la cola */
  try{
    var c=await Promise.all([
      trae('op_experiencias?select=id,updated_at&estado=eq.en_revision'),
      trae('eventos?select=id,created_at&estado=eq.propuesto'),
      trae('tour_operadores?select=id&estado=eq.en_revision')
    ]);
    var tot=c[0].length+c[1].length+c[2].length;
    var viejos=c[0].concat(c[1]).filter(function(x){
      var t=x.updated_at||x.created_at; if(!t) return false;
      return (Date.now()-new Date(t).getTime())>48*3600000; }).length;
    cuadros.push(cuadro({t:'Esperando tu firma',n:tot,href:'/m/aprobacion.html',
      p: tot ? (viejos?viejos+' llevan más de 48 h':'ninguno pasa de 48 h') : 'la cola está limpia',
      urge: !!viejos, bien: tot===0}));
  }catch(e){ cuadros.push(cuadro({t:'Esperando tu firma',href:'/m/aprobacion.html',error:(e&&e.message)||String(e)})); }

  /* 3 · la comunidad */
  try{
    var com=await trae('v_ateneistas?select=id,estado,candado&limit=1000');
    var med=com.filter(function(a){ try{ return ((a.candado&&a.candado.bloquea)||[]).length>0; }catch(_){ return false; } }).length;
    cuadros.push(cuadro({t:'La comunidad',n:com.length,href:'/m/comunidad.html',
      p: med ? med+' a medias' : 'todos completos', urge: med>com.length/2}));
  }catch(e){ cuadros.push(cuadro({t:'La comunidad',href:'/m/comunidad.html',error:(e&&e.message)||String(e)})); }

  /* 4 · productos */
  try{
    var pub=await fetch(SB+'/rest/v1/op_experiencias?select=id&estado=eq.publicada',
      {headers:Object.assign(hdr(),{Prefer:'count=exact',Range:'0-0'})});
    var n=Number((pub.headers.get('content-range')||'/0').split('/')[1]||0);
    cuadros.push(cuadro({t:'A la venta',n:n,href:'/m/productos.html',p:'productos publicados'}));
  }catch(e){ cuadros.push(cuadro({t:'A la venta',href:'/m/productos.html',error:(e&&e.message)||String(e)})); }

  /* 5 · ventas de la semana */
  try{
    var v=await trae('v_sinc_ventas?select=id,pago_total,reservada_at&reservada_at=gte.'+haceDias(7)+'T00:00:00');
    var suma=v.reduce(function(a,x){ return a+Number(x.pago_total||0); },0);
    cuadros.push(cuadro({t:'Últimos 7 días',n:v.length,href:'/m/sinc-ventas.html',p:dinero(suma)+' reservados'}));
  }catch(e){ cuadros.push(cuadro({t:'Últimos 7 días',href:'/m/sinc-ventas.html',error:(e&&e.message)||String(e)})); }

  rej.innerHTML=cuadros.join('');

  /* la lista de hoy, abajo */
  var caja=$('hoy');
  if(errSal){
    caja.innerHTML='<div class="vacio"><b>No pudimos traer las salidas</b>'+esc(errSal)+'</div>';
  } else if(!salidas.length){
    caja.innerHTML='<div class="vacio"><b>Hoy no sale nada</b>No hay salidas programadas para hoy.</div>';
  } else {
    /* Cada salida se abre: lleva a Salidas del dia con esa misma fila
       desplegada, que es donde estan los nombres y los telefonos. Una lista
       que no se puede abrir obliga a buscar otra vez lo que ya estas viendo. */
    caja.innerHTML=salidas.map(function(s){
      return '<a class="fila" target="_top" href="/m/salidas.html?fecha='+hoy+'&abrir='+encodeURIComponent(s.id)+'">'+
        '<div class="hora"><b>'+hhmm(s.hora)+'</b><span>'+(s.duracion_min?s.duracion_min+"'":'')+'</span></div>'+
        '<div class="mid"><div class="nom"><b>'+esc(s.nombre||'(sin nombre)')+'</b></div>'+
          '<div class="pills">'+
            (s.guia_id?'<span class="pill ci">'+esc(s.guia)+'</span>':'<span class="pill al">Sin guía</span>')+
            (Number(s.por_cobrar||0)?'<span class="pill er">'+s.por_cobrar+' por cobrar</span>':'')+
          '</div>'+
          '<div class="donde">'+esc(s.punto_encuentro||'sin punto de encuentro')+'</div></div>'+
        '<div class="cifra"><b>'+Number(s.cupo_tomado||0)+(s.cupo_max?'/'+s.cupo_max:'')+'</b><span>personas</span></div>'+
      '</a>';
    }).join('');
  }

  var d=new Date();
  $('cuenta').textContent=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})+
    (YO?' · '+YO:'');
}

ses=sesionPanel();
try{ YO=(ses&&ses.user&&ses.user.email)||''; }catch(_){}
carga();
</script>
</body></html>
