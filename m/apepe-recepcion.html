<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in de huéspedes · Recepción</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daycards{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0}
@media(max-width:1100px){ .daycards{grid-template-columns:repeat(4,1fr)} }
@media(max-width:900px){ .daycards{grid-template-columns:repeat(3,1fr)} }
.dc{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);font:inherit;transition:border-color .1s}
.dc:hover{border-color:var(--accent)}
.dc[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.dc .dl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.dc .dn{font-size:26px;font-weight:700;line-height:1.05;margin-top:5px;color:var(--ink)}
.dc .dn small{font-size:15px;font-weight:600;color:var(--muted)}
.dc .ds{font-size:11.5px;color:var(--muted);margin-top:3px}
.dc .ds b{color:var(--warn)}
.dc-wb[aria-selected="true"]{border-color:#B0246A;box-shadow:0 0 0 2px #FBE1EC,var(--shadow)} .dc-wb .dn{color:#B0246A}
.dc-up[aria-selected="true"]{border-color:#2B6CB0;box-shadow:0 0 0 2px #E4F1FA,var(--shadow)} .dc-up .dn{color:#2B6CB0}
.tag-up{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#E4F1FA;color:#2B6CB0}
.dc-ns[aria-selected="true"]{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad-bg),var(--shadow)} .dc-ns .dn{color:var(--bad)}
.tag-wb{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#FBE1EC;color:#B0246A}
.tag-nr{background:var(--bad-bg);color:var(--bad)} .tag-ns{background:var(--warn-bg);color:var(--warn)}
@media(max-width:640px){ .daycards{grid-template-columns:repeat(2,1fr)} }
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.row:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.verde{background:var(--ok)} .dot.naranja{background:var(--warn)} .dot.gris{background:var(--none)} .dot.fisico{background:#2B6CB0}
.row .nm{font-weight:600}
.row .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.row .grow{flex:1;min-width:0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.verde{background:var(--ok-bg);color:var(--ok)} .pill.naranja{background:var(--warn-bg);color:var(--warn)} .pill.gris{background:var(--none-bg);color:var(--none)} .pill.fisico{background:#E4F1FA;color:#2B6CB0}
.mk{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 1px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;line-height:1.55;letter-spacing:.01em}
.src svg{width:11px;height:11px;display:block;flex:0 0 auto}
.src.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff}
.src.rep{background:#F3EAD6;color:#8C6212;border:1px solid #E4D3A8}
.src.cor{background:#F3EAD6;color:#8C6212}
.kpi.fisico .n{color:#2B6CB0}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
/* detalle overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,27,22,.4);display:none}
.ov.on{display:block}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:460px;background:var(--surface);box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);overflow:auto;padding:0}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:14px 16px;display:flex;align-items:center;gap:10px}
.ph h2{font-size:16px;margin:0;flex:1}
.px{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;font-size:17px;cursor:pointer;color:var(--ink)}
.pb{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f .v{font-weight:600;margin-top:1px;word-break:break-word}
.f.full{grid-column:1/-1}
.sec{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.ac{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.firma{border:1px solid var(--rule);border-radius:8px;background:var(--surface-3);max-width:100%;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.no{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.acty{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.perfil{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.perfil .flag{font-size:30px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px}
.chip.lvl{background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div style="flex:1;min-width:150px">
      <h1>🛎️ Check-in de huéspedes</h1>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <button class="btn ghost sm" id="btnRefrescar">↻ Refrescar</button>
  </div>
</header>

<div class="wrap">
  <div class="card" style="background:#fff;border:1px solid var(--linea,#E2DCCF);border-radius:14px;padding:12px 14px;margin-bottom:14px">
    <div style="font-family:Oswald,sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;color:var(--gris,#6B6459);font-weight:700;margin-bottom:8px">📲 Link de check-in por reserva</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="lkRid" placeholder="ID de reserva (Cloudbeds)" style="flex:1;min-width:180px;padding:10px 12px;border:1.5px solid var(--linea,#E2DCCF);border-radius:10px;font:inherit;font-size:14px">
      <select id="lkProp" style="padding:10px 12px;border:1.5px solid var(--linea,#E2DCCF);border-radius:10px;font:inherit;font-size:14px"><option value="cdmx">CDMX</option><option value="puebla">Puebla</option></select>
      <button class="btn" id="lkBtn" style="padding:10px 16px">Generar y copiar</button>
    </div>
    <div id="lkAviso" style="font-size:13px;color:var(--gris,#6B6459);margin-top:8px"></div>
  </div>
  <div class="daycards" id="daycards">
    <button class="dc" data-f="hoy" aria-selected="true"><div class="dl">Hoy</div><div class="dn" id="dHoy">—</div><div class="ds" id="sHoy">&nbsp;</div></button>
    <button class="dc" data-f="manana" aria-selected="false"><div class="dl">Mañana</div><div class="dn" id="dMan">—</div><div class="ds" id="sMan">&nbsp;</div></button>
    <button class="dc" data-f="pasado" aria-selected="false"><div class="dl">Pasado mañana</div><div class="dn" id="dPas">—</div><div class="ds" id="sPas">&nbsp;</div></button>
    <button class="dc" data-f="prox" aria-selected="false"><div class="dl">Próximamente</div><div class="dn" id="dPro">—</div><div class="ds" id="sPro">&nbsp;</div></button>
    <button class="dc dc-up" data-f="upgrades" aria-selected="false"><div class="dl">⬆️ Upgrades</div><div class="dn" id="dUp">—</div><div class="ds" id="sUp">por cobrar</div></button>
    <button class="dc dc-wb" data-f="winback" aria-selected="false"><div class="dl">💌 Winback</div><div class="dn" id="dWb">—</div><div class="ds" id="sWb">solicitudes</div></button>
    <button class="dc dc-ns" data-f="nsnr" aria-selected="false"><div class="dl">🚫 No-show / NR</div><div class="dn" id="dNs">—</div><div class="ds" id="sNs">ayer + cancel.</div></button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="ov" id="ov"><div class="panel">
  <div class="ph"><h2 id="pTitulo">Detalle</h2><button class="px" id="pCerrar" aria-label="Cerrar">×</button></div>
  <div class="pb" id="pBody"></div>
</div></div>

<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var DATA=[], FILTRO='hoy', WB=[], MOV=[], WBSET={}, UP=[], UPSET={};
  function ymd(off){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+off);
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function esDia(r,key){ var s=String(r.desde||'').slice(0,10);
    if(key==='hoy') return s<=ymd(0);          // hoy + rezagados que aún no llegan
    if(key==='manana') return s===ymd(1);
    if(key==='pasado') return s===ymd(2);
    return s>ymd(2); }                          // próximamente (siguientes días)
  function cuenta(key){ var t=0,h=0,sin=0; DATA.forEach(function(r){ if(!esDia(r,key)) return; t++;
    if(r.semaforo==='gris') sin++; else h++; }); return {t:t,h:h,sin:sin}; }
  var DIALBL={hoy:'Hoy',manana:'Mañana',pasado:'Pasado mañana',prox:'Próximamente'};

  function rpc(fn,body){
    return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY),'Content-Type':'application/json'},
      body:JSON.stringify(body||{})}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fdate(s){ if(!s) return '—'; var p=String(s).split('T')[0].split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s; }
  function fdt(s){ if(!s) return '—'; var d=new Date(s); return isNaN(d.getTime())?s:d.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  var LBL={verde:'Validado',naranja:'Por validar',gris:'Sin check-in',fisico:'Check-in físico'};

  async function cargar(){
    $('sub').textContent='Cargando…';
    try{
      var rf=await fetch(SB+'/functions/v1/apepe-recepcion',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY),'Content-Type':'application/json'},body:JSON.stringify({dias:10})});
      var res=await rf.json();
      DATA=Array.isArray(res)?res:[];
    }catch(e){ DATA=[]; $('sub').textContent='No se pudo cargar. Reintenta con Refrescar.'; return; }
    $('sub').textContent='Al día · '+new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    // movimientos (winbacks + no-shows/cancelados) — no bloquea la lista si falla
    try{
      var rm=await fetch(SB+'/functions/v1/apepe-recepcion-mov',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+(sessTok()||KEY),'Content-Type':'application/json'},body:JSON.stringify({prop:'all'})});
      var mj=await rm.json();
      WB=(mj&&Array.isArray(mj.winbacks))?mj.winbacks:[]; MOV=(mj&&Array.isArray(mj.movimientos))?mj.movimientos:[];
      UP=(mj&&Array.isArray(mj.upgrades))?mj.upgrades:[];
      WBSET={}; WB.forEach(function(w){ if(w.reservation_id) WBSET[String(w.reservation_id)]=w; });
      UPSET={}; UP.forEach(function(u){ if(u.estado==='por_cobrar'&&u.reservation_id) UPSET[String(u.reservation_id)]=u; });
    }catch(e){ WB=[]; MOV=[]; UP=[]; WBSET={}; UPSET={}; }
    render();
  }
  function render(){
    // 1) llenar las 4 cajas con su conteo de check-in
    var box={hoy:['dHoy','sHoy'],manana:['dMan','sMan'],pasado:['dPas','sPas'],prox:['dPro','sPro']};
    for(var key in box){ var c=cuenta(key);
      $(box[key][0]).innerHTML=c.h+' <small>/ '+c.t+'</small>';
      $(box[key][1]).innerHTML=c.sin?('<b>'+c.sin+'</b> sin check-in'):(c.t?'todos con check-in':'&nbsp;'); }
    // 2) resaltar la caja seleccionada
    Array.prototype.forEach.call(document.querySelectorAll('#daycards .dc'),function(b){ b.setAttribute('aria-selected', b.getAttribute('data-f')===FILTRO?'true':'false'); });
    // cuentas de los dos cuadritos nuevos
    if($('dWb')) $('dWb').textContent=WB.length;
    if($('dUp')){ var pc=UP.filter(function(u){return u.estado==='por_cobrar';}).length;
      $('dUp').textContent=pc;
      if($('sUp')) $('sUp').innerHTML=pc?('<b>'+pc+'</b> sin cobrar'):'nada pendiente'; }
    if($('dNs')){ var ns=MOV.filter(function(m){return m.tipo==='noshow';}).length, nc=MOV.filter(function(m){return m.tipo==='cancelado';}).length;
      $('dNs').textContent=MOV.length; if($('sNs')) $('sNs').innerHTML=ns+' NS · '+nc+' cancel.'; }
    // 3) lista según el filtro
    var L=$('list');
    if(FILTRO==='upgrades'){ pintarUpgrades(L); return; }
    if(FILTRO==='winback'){ pintarWinback(L); return; }
    if(FILTRO==='nsnr'){ pintarMov(L); return; }
    var arr=DATA.filter(function(r){ return esDia(r,FILTRO); });
    if(!arr.length){ L.innerHTML='<div class="empty">No hay llegadas '+DIALBL[FILTRO].toLowerCase()+'.</div>'; return; }
    L.innerHTML=arr.map(function(r,i){
      var idx=DATA.indexOf(r);
      var acc=r.n_acompanantes?(' · +'+r.n_acompanantes+' acomp.'):'';
      var done=r.semaforo!=='gris';
      var wbTag=WBSET[String(r.reservation_id)]?' <span class="tag-wb">💌 winback</span>':'';
      var u=UPSET[String(r.reservation_id)];
      if(u) wbTag+=' <span class="tag-up">⬆️ upgrade '+money2(u.monto)+' por cobrar</span>';
      return '<div class="row" data-i="'+idx+'">'+
        '<span class="dot '+r.semaforo+'"></span>'+
        '<div class="grow"><div class="nm">'+esc(r.nombre||'—')+wbTag+'</div>'+
          '<div class="mk">'+marcadores(r)+'</div>'+
          '<div class="meta">Llega '+fdate(r.desde)+' → '+fdate(r.hasta)+acc+'</div></div>'+
        '<span class="pill '+r.semaforo+'">'+(done?'✓ ':'')+LBL[r.semaforo]+'</span></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('.row'),function(el){
      el.onclick=function(){ abrir(DATA[+el.getAttribute('data-i')]); };
    });
  }
  function money2(n){ try{ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }catch(e){ return '$'+n; } }
  /* El winback se quedaba a la mitad: el huésped aceptaba, alguien cancelaba en
     Booking… y ahí moría. La función que crea la reserva directa existía, pero
     nadie la llamaba: esta pestaña era de sólo mirar. Liz canceló la de Ramírez
     Lizbeth el 28-sep y el sistema no creó nada, porque no había por dónde
     decirle que ya estaba cancelada. Este es ese botón. Javi, 28-sep. */
  /* Los upgrades que el huésped cerró en la app y aquí se cobran y se aplican.
     Hasta hoy esta pantalla no existía: el huésped confirmaba, la app le prometía
     "se paga en recepción al llegar", se guardaba en 'por_cobrar'… y nadie lo veía
     nunca. La función que mueve el cuarto en Cloudbeds existía desde el principio,
     pero ninguna pantalla la llamaba. Por eso el cuarto no cambiaba. Javi, 28-sep. */
  function pintarUpgrades(L){
    if(!UP.length){ L.innerHTML='<div class="empty">Nadie ha cerrado un upgrade en la app todavía.</div>'; return; }
    var EST={por_cobrar:'Por cobrar',aplicado:'Aplicado ✓',aplicado_sin_cargo:'Movido · falta el cargo',error:'No se pudo',bloqueado:'Bloqueado',simulado:'Sin aplicar'};
    var PILL={por_cobrar:'naranja',aplicado:'verde',aplicado_sin_cargo:'naranja',error:'gris',bloqueado:'gris',simulado:'gris'};
    L.innerHTML=UP.map(function(u,i){
      var pend=u.estado==='por_cobrar';
      var noche=u.por_noche?(' · '+money2(u.por_noche)+'/noche'+(u.noches?(' × '+u.noches):'')):'';
      return '<div class="row" style="cursor:default;align-items:flex-start">'+
        '<span class="dot" style="background:#2B6CB0"></span>'+
        '<div class="grow"><div class="nm">'+esc(u.nombre||('Reserva '+u.reservation_id))+' <span class="tag-up">⬆️ upgrade</span></div>'+
          '<div class="meta">'+esc(u.de)+' → <b>'+esc(u.a)+'</b> · '+esc((u.property||'').toUpperCase())+'</div>'+
          (u.desde?('<div class="meta">Llega '+fdate(u.desde)+' → '+fdate(u.hasta)+'</div>'):'')+
          '<div class="meta">'+(pend?'Cobrar':'Se cobró')+' <b>'+money2(u.monto)+'</b>'+noche+'</div>'+
          (u.problemas&&u.problemas.length?('<div class="meta" style="color:var(--bad)">'+esc(u.problemas.join(' · '))+'</div>'):'')+
          (u.aplicado_por?('<div class="meta">Aplicó '+esc(u.aplicado_por)+' · '+fdt(u.fecha)+'</div>'):'')+
          (pend
            ? '<div class="meta" style="margin-top:7px">Cóbralo y dale aquí: se mueve el cuarto en Cloudbeds y se carga al folio.</div>'+
              '<button class="btn" data-up="'+i+'" style="margin-top:6px">Ya lo cobré · aplicar el upgrade</button>'+
              '<div class="meta" id="upm'+i+'" style="margin-top:5px"></div>'
            : '')+
        '</div>'+
        '<span class="pill '+(PILL[u.estado]||'gris')+'">'+esc(EST[u.estado]||u.estado)+'</span></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('[data-up]'),function(b){
      b.onclick=function(){ aplicaUpgrade(UP[+b.getAttribute('data-up')], b); };
    });
  }

  /* Mover el cuarto. Lo hace apepe-upgrade-aplicar, que exige sesión con permiso de
     recepción: nunca se dispara desde el teléfono del huésped, que es justo por lo
     que este botón tiene que vivir aquí. */
  async function aplicaUpgrade(u, btn){
    var msg=document.getElementById('upm'+btn.getAttribute('data-up'));
    var tok=sessTok();
    function di(t,mal){ if(msg){ msg.textContent=t; msg.style.color = mal?'var(--bad)':'var(--ok)'; } }
    if(!tok){ di('Inicia sesión en el panel para poder aplicarlo.',true); return; }
    if(!confirm('¿Ya cobraste '+money2(u.monto)+' a '+(u.nombre||'este huésped')+'?\n\n'+
        'Al aceptar se mueve la reserva a '+u.a+' en Cloudbeds y se carga el monto al folio.')) return;
    btn.disabled=true; var old=btn.textContent; btn.textContent='Aplicando…'; di('');
    try{

    if(!rid){ av.textContent='Escribe el ID de la reserva de Cloudbeds.'; return; }
    var tok=sessTok(); if(!tok){ av.textContent='Inicia sesión en el panel para generar el link.'; return; }
    av.textContent='Generando…';
    try{ var r=await fetch(SB+'/functions/v1/apepe-checkin-link',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({reservation_id:rid,prop:prop,accion:'link'})}).then(function(x){return x.json();});
      if(r&&r.link){ try{ await navigator.clipboard.writeText(r.link); }catch(e){} av.innerHTML='Link copiado ✓ <a href="'+esc(r.link)+'" target="_blank" rel="noopener" style="word-break:break-all;color:var(--accent,#137A56)">'+esc(r.link)+'</a>'; }
      else av.textContent=(r&&r.error)||'No se pudo generar el link.';
    }catch(e){ av.textContent='Error de conexión.'; } }
  $('lkBtn').onclick=linkTop;
  $('lkRid').addEventListener('keydown',function(e){ if(e.key==='Enter') linkTop(); });

  $('btnRefrescar').onclick=cargar;
  $('pCerrar').onclick=function(){ $('ov').classList.remove('on'); };
  $('ov').onclick=function(e){ if(e.target===$('ov')) $('ov').classList.remove('on'); };

  cargar();
})();
</script>
</body>
</html>
