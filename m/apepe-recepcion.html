<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in de huéspedes · Recepción</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;box-shadow:var(--shadow)}
.kpi .n{font-size:24px;font-weight:700;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-top:4px}
.kpi.naranja .n{color:var(--warn)} .kpi.verde .n{color:var(--ok)} .kpi.gris .n{color:var(--none)}
.secnav{position:sticky;top:52px;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin:0 -16px}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:11px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.row:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.verde{background:var(--ok)} .dot.naranja{background:var(--warn)} .dot.gris{background:var(--none)} .dot.fisico{background:#2B6CB0}
.row .nm{font-weight:600}
.row .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.row .grow{flex:1;min-width:0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.verde{background:var(--ok-bg);color:var(--ok)} .pill.naranja{background:var(--warn-bg);color:var(--warn)} .pill.gris{background:var(--none-bg);color:var(--none)} .pill.fisico{background:#E4F1FA;color:#2B6CB0}
.kpi.fisico .n{color:#2B6CB0}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
/* detalle overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,27,22,.4);display:none}
.ov.on{display:block}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:460px;background:var(--surface);box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);overflow:auto;padding:0}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:14px 16px;display:flex;align-items:center;gap:10px}
.ph h2{font-size:16px;margin:0;flex:1}
.px{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;font-size:17px;cursor:pointer;color:var(--ink)}
.pb{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f .v{font-weight:600;margin-top:1px;word-break:break-word}
.f.full{grid-column:1/-1}
.sec{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.ac{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.firma{border:1px solid var(--rule);border-radius:8px;background:var(--surface-3);max-width:100%;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.no{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.acty{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div style="flex:1;min-width:150px">
      <h1>🛎️ Check-in de huéspedes</h1>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <button class="btn ghost sm" id="btnRefrescar">↻ Refrescar</button>
  </div>
</header>

<div class="wrap">
  <div class="kpis">
    <div class="kpi verde"><div class="n" id="kHecho">—</div><div class="l">Check-in hecho</div></div>
    <div class="kpi naranja"><div class="n" id="kNaranja">—</div><div class="l">Por validar</div></div>
    <div class="kpi gris"><div class="n" id="kGris">—</div><div class="l">Sin check-in</div></div>
    <div class="kpi"><div class="n" id="kTotal">—</div><div class="l">Total llegadas</div></div>
  </div>

  <nav class="secnav"><div class="secnav-in" id="tabs">
    <button data-f="hoy" aria-selected="true">Hoy</button>
    <button data-f="manana" aria-selected="false">Mañana</button>
    <button data-f="pasado" aria-selected="false">Pasado mañana</button>
    <button data-f="prox" aria-selected="false">Próximamente</button>
  </div></nav>

  <div class="list" id="list"></div>
</div>

<div class="ov" id="ov"><div class="panel">
  <div class="ph"><h2 id="pTitulo">Detalle</h2><button class="px" id="pCerrar" aria-label="Cerrar">×</button></div>
  <div class="pb" id="pBody"></div>
</div></div>

<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var DATA=[], FILTRO='hoy';
  function ymd(off){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+off);
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function enDia(r){ var s=String(r.desde||'').slice(0,10);
    if(FILTRO==='hoy') return s<=ymd(0);        // hoy + rezagados que aún no llegan
    if(FILTRO==='manana') return s===ymd(1);
    if(FILTRO==='pasado') return s===ymd(2);
    return s>ymd(2); }                            // próximamente (siguientes días)
  var DIALBL={hoy:'Hoy',manana:'Mañana',pasado:'Pasado mañana',prox:'Próximamente'};

  function rpc(fn,body){
    return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(body||{})}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fdate(s){ if(!s) return '—'; var p=String(s).split('T')[0].split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s; }
  function fdt(s){ if(!s) return '—'; var d=new Date(s); return isNaN(d.getTime())?s:d.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  var LBL={verde:'Validado',naranja:'Por validar',gris:'Sin check-in',fisico:'Check-in físico'};

  async function cargar(){
    $('sub').textContent='Cargando…';
    try{
      var rf=await fetch(SB+'/functions/v1/apepe-recepcion',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({dias:10})});
      var res=await rf.json();
      DATA=Array.isArray(res)?res:[];
    }catch(e){ DATA=[]; $('sub').textContent='No se pudo cargar. Reintenta con Refrescar.'; return; }
    render();
  }
  function render(){
    var arr=DATA.filter(enDia);
    var c={verde:0,naranja:0,gris:0,fisico:0};
    arr.forEach(function(r){ c[r.semaforo]=(c[r.semaforo]||0)+1; });
    var hecho=(c.verde||0)+(c.naranja||0)+(c.fisico||0);
    $('kHecho').textContent=hecho; $('kNaranja').textContent=c.naranja||0; $('kGris').textContent=c.gris||0; $('kTotal').textContent=arr.length;
    $('sub').textContent=DIALBL[FILTRO]+' · '+hecho+' de '+arr.length+' con check-in'+((c.naranja||0)?(' · '+c.naranja+' por validar'):'');
    var L=$('list');
    if(!arr.length){ L.innerHTML='<div class="empty">No hay llegadas en esta vista.</div>'; return; }
    L.innerHTML=arr.map(function(r,i){
      var idx=DATA.indexOf(r);
      var acc=r.n_acompanantes?(' · +'+r.n_acompanantes+' acomp.'):'';
      return '<div class="row" data-i="'+idx+'">'+
        '<span class="dot '+r.semaforo+'"></span>'+
        '<div class="grow"><div class="nm">'+esc(r.nombre||'—')+'</div>'+
          '<div class="meta">'+esc(r.nacionalidad||r.fuente||'—')+' · Llega '+fdate(r.desde)+' → '+fdate(r.hasta)+acc+'</div></div>'+
        '<span class="pill '+r.semaforo+'">'+LBL[r.semaforo]+'</span></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('.row'),function(el){
      el.onclick=function(){ abrir(DATA[+el.getAttribute('data-i')]); };
    });
  }

  async function abrir(r){
    $('pTitulo').textContent=r.nombre||'Detalle';
    var B=$('pBody');
    $('ov').classList.add('on');
    if(!r.checkin_id){
      var fisico=(r.semaforo==='fisico');
      B.innerHTML='<div class="grid2">'+
        campo('Reserva','Llega '+fdate(r.desde)+' → '+fdate(r.hasta),true)+
        campo('Fuente',esc(r.fuente||r.nacionalidad||'—'))+
        campo('Estado',fisico?'Check-in físico (recepción)':'Sin check-in')+'</div>'+
        (fisico
          ? '<div class="acty" style="background:#E4F1FA;color:#2B6CB0">Ya hizo su check-in en recepción (marcado en Cloudbeds). No hizo el check-in online en la app.</div>'
          : '<div class="acty">Este huésped aún no ha hecho su check-in.</div>');
      return;
    }
    B.innerHTML='<div class="note">Cargando detalle…</div>';
    var d;
    try{ d=await rpc('apepe_recepcion_detalle',{p_id:r.checkin_id}); }catch(e){ B.innerHTML='<div class="acty">No se pudo cargar el detalle.</div>'; return; }
    if(!d){ B.innerHTML='<div class="acty">Sin datos.</div>'; return; }
    var dd=d.doc_datos||{}, acs=Array.isArray(d.acompanantes)?d.acompanantes:[];
    var valido=(d.estado==='validado');
    var html='<div class="grid2">'+
      campo('Nombre',esc(d.nombre||'—'),true)+
      campo('Nacionalidad',esc(d.nacionalidad||'—'))+
      campo('Documento',esc((d.doc_tipo||'—')+(d.doc_numero?(' · '+d.doc_numero):'')))+
      campo('Nacimiento',dd.nacimiento?fdate(dd.nacimiento):'—')+
      campo('Estancia',fdate(d.desde)+' → '+fdate(d.hasta)+' ('+(d.noches||'—')+' noches)')+
      campo('Correo',esc(dd.email||'—'))+
      campo('Celular',esc(dd.tel||'—'))+
    '</div>';
    html+='<div class="sec"><h3>Contrato</h3>'+
      '<span class="badge '+(d.consentimiento?'ok':'no')+'">'+(d.consentimiento?'✓ Aceptó términos y condiciones':'Sin aceptar')+'</span>';
    if(d.firma) html+='<div style="margin-top:10px"><div class="k" style="font-size:10.5px;text-transform:uppercase;color:var(--muted)">Firma</div><img class="firma" src="'+esc(d.firma)+'" alt="Firma"></div>';
    html+='</div>';
    if(acs.length){
      html+='<div class="sec"><h3>Acompañantes ('+acs.length+')</h3>';
      acs.forEach(function(a){
        var t=[]; if(a.menor) t.push('menor'+(a.edad?(' · '+a.edad+'a'):'')); if(a.app&&a.email) t.push('app: '+esc(a.email));
        html+='<div class="ac"><b>'+esc(a.nombre||'—')+'</b>'+(t.length?(' <span class="note">('+t.join(' · ')+')</span>'):'')+
          (a.id_foto?'<img class="firma" style="margin-top:8px;max-height:150px" src="'+esc(a.id_foto)+'" alt="ID acompañante">':'<div class="note" style="margin-top:4px;color:var(--bad)">Sin foto de ID</div>')+'</div>';
      });
      html+='</div>';
    }
    html+='<div class="sec"><h3>Validación</h3>';
    if(valido){
      html+='<span class="badge ok">✓ Validado</span> <span class="note">'+esc(d.validado_por||'')+' · '+fdt(d.validado_at)+'</span>';
    } else {
      html+='<div class="note" style="margin-bottom:10px">Hecho el '+fdt(d.created_at)+'. Revisa foto, firma y datos; al validar, el semáforo pasa a verde.</div>'+
        '<button class="btn" id="btnValidar">✓ Validar check-in</button>';
    }
    html+='</div>';
    B.innerHTML=html;
    var bv=$('btnValidar');
    if(bv) bv.onclick=function(){ validar(d.id, bv); };
  }
  function campo(k,v,full){ return '<div class="f'+(full?' full':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  async function validar(id,btn){
    btn.disabled=true; btn.textContent='Validando…';
    var por='Recepción';
    try{ if(window.cpAcceso&&cpAcceso.tokEmail){ por=cpAcceso.tokEmail()||por; } }catch(e){}
    try{
      await rpc('apepe_checkin_validar',{p_id:id,p_por:por});
      $('ov').classList.remove('on');
      await cargar();
    }catch(e){ btn.disabled=false; btn.textContent='✓ Validar check-in'; alert('No se pudo validar. Reintenta.'); }
  }

  // tabs
  Array.prototype.forEach.call($('tabs').children,function(b){
    b.onclick=function(){
      FILTRO=b.getAttribute('data-f');
      Array.prototype.forEach.call($('tabs').children,function(x){ x.setAttribute('aria-selected', x===b?'true':'false'); });
      render();
    };
  });
  $('btnRefrescar').onclick=cargar;
  $('pCerrar').onclick=function(){ $('ov').classList.remove('on'); };
  $('ov').onclick=function(e){ if(e.target===$('ov')) $('ov').classList.remove('on'); };

  cargar();
})();
</script>
</body>
</html>
