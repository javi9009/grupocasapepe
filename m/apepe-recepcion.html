<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in de huéspedes · Recepción</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;font-size:14px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 40px}
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:19px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:12.5px;margin-top:1px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.daycards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.dc{text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:13px 15px;cursor:pointer;box-shadow:var(--shadow);font:inherit;transition:border-color .1s}
.dc:hover{border-color:var(--accent)}
.dc[aria-selected="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--shadow)}
.dc .dl{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
.dc .dn{font-size:26px;font-weight:700;line-height:1.05;margin-top:5px;color:var(--ink)}
.dc .dn small{font-size:15px;font-weight:600;color:var(--muted)}
.dc .ds{font-size:11.5px;color:var(--muted);margin-top:3px}
.dc .ds b{color:var(--warn)}
@media(max-width:640px){ .daycards{grid-template-columns:repeat(2,1fr)} }
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;align-items:center;gap:13px;cursor:pointer;box-shadow:var(--shadow)}
.row:hover{border-color:var(--accent)}
.dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.dot.verde{background:var(--ok)} .dot.naranja{background:var(--warn)} .dot.gris{background:var(--none)} .dot.fisico{background:#2B6CB0}
.row .nm{font-weight:600}
.row .meta{color:var(--muted);font-size:12.5px;margin-top:1px}
.row .grow{flex:1;min-width:0}
.pill{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.verde{background:var(--ok-bg);color:var(--ok)} .pill.naranja{background:var(--warn-bg);color:var(--warn)} .pill.gris{background:var(--none-bg);color:var(--none)} .pill.fisico{background:#E4F1FA;color:#2B6CB0}
.mk{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 1px}
.src{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;line-height:1.55;letter-spacing:.01em}
.src svg{width:11px;height:11px;display:block;flex:0 0 auto}
.src.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff}
.src.rep{background:#F3EAD6;color:#8C6212;border:1px solid #E4D3A8}
.src.cor{background:#F3EAD6;color:#8C6212}
.kpi.fisico .n{color:#2B6CB0}
.empty{text-align:center;color:var(--muted);padding:36px 10px}
/* detalle overlay */
.ov{position:fixed;inset:0;z-index:40;background:rgba(31,27,22,.4);display:none}
.ov.on{display:block}
.panel{position:absolute;top:0;right:0;height:100%;width:100%;max-width:460px;background:var(--surface);box-shadow:-10px 0 40px -20px rgba(0,0,0,.5);overflow:auto;padding:0}
.ph{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--rule);padding:14px 16px;display:flex;align-items:center;gap:10px}
.ph h2{font-size:16px;margin:0;flex:1}
.px{border:0;background:var(--surface-2);border-radius:8px;width:32px;height:32px;font-size:17px;cursor:pointer;color:var(--ink)}
.pb{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.f .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.f .v{font-weight:600;margin-top:1px;word-break:break-word}
.f.full{grid-column:1/-1}
.sec{margin-top:16px;border-top:1px solid var(--rule);padding-top:12px}
.sec h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 8px}
.ac{border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-bottom:7px}
.firma{border:1px solid var(--rule);border-radius:8px;background:var(--surface-3);max-width:100%;display:block}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px}
.badge.ok{background:var(--ok-bg);color:var(--ok)} .badge.no{background:var(--bad-bg);color:var(--bad)}
.note{font-size:12.5px;color:var(--muted)}
.acty{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:10px 12px;font-size:13px;margin-top:12px}
.perfil{display:flex;align-items:center;gap:10px;margin:0 0 4px}
.perfil .flag{font-size:30px;line-height:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink);border-radius:999px;padding:4px 10px}
.chip.lvl{background:var(--accent-soft);color:var(--accent)}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div style="flex:1;min-width:150px">
      <h1>🛎️ Check-in de huéspedes</h1>
      <div class="sub" id="sub">Cargando…</div>
    </div>
    <button class="btn ghost sm" id="btnRefrescar">↻ Refrescar</button>
  </div>
</header>

<div class="wrap">
  <div class="card" style="background:#fff;border:1px solid var(--linea,#E2DCCF);border-radius:14px;padding:12px 14px;margin-bottom:14px">
    <div style="font-family:Oswald,sans-serif;text-transform:uppercase;font-size:12.5px;letter-spacing:.04em;color:var(--gris,#6B6459);font-weight:700;margin-bottom:8px">📲 Link de check-in por reserva</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
      <input id="lkRid" placeholder="ID de reserva (Cloudbeds)" style="flex:1;min-width:180px;padding:10px 12px;border:1.5px solid var(--linea,#E2DCCF);border-radius:10px;font:inherit;font-size:14px">
      <select id="lkProp" style="padding:10px 12px;border:1.5px solid var(--linea,#E2DCCF);border-radius:10px;font:inherit;font-size:14px"><option value="cdmx">CDMX</option><option value="puebla">Puebla</option></select>
      <button class="btn" id="lkBtn" style="padding:10px 16px">Generar y copiar</button>
    </div>
    <div id="lkAviso" style="font-size:13px;color:var(--gris,#6B6459);margin-top:8px"></div>
  </div>
  <div class="daycards" id="daycards">
    <button class="dc" data-f="hoy" aria-selected="true"><div class="dl">Hoy</div><div class="dn" id="dHoy">—</div><div class="ds" id="sHoy">&nbsp;</div></button>
    <button class="dc" data-f="manana" aria-selected="false"><div class="dl">Mañana</div><div class="dn" id="dMan">—</div><div class="ds" id="sMan">&nbsp;</div></button>
    <button class="dc" data-f="pasado" aria-selected="false"><div class="dl">Pasado mañana</div><div class="dn" id="dPas">—</div><div class="ds" id="sPas">&nbsp;</div></button>
    <button class="dc" data-f="prox" aria-selected="false"><div class="dl">Próximamente</div><div class="dn" id="dPro">—</div><div class="ds" id="sPro">&nbsp;</div></button>
  </div>

  <div class="list" id="list"></div>
</div>

<div class="ov" id="ov"><div class="panel">
  <div class="ph"><h2 id="pTitulo">Detalle</h2><button class="px" id="pCerrar" aria-label="Cerrar">×</button></div>
  <div class="pb" id="pBody"></div>
</div></div>

<script src="/cp-acceso.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var DATA=[], FILTRO='hoy';
  function ymd(off){ var d=new Date(); d.setHours(12,0,0,0); d.setDate(d.getDate()+off);
    return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function esDia(r,key){ var s=String(r.desde||'').slice(0,10);
    if(key==='hoy') return s<=ymd(0);          // hoy + rezagados que aún no llegan
    if(key==='manana') return s===ymd(1);
    if(key==='pasado') return s===ymd(2);
    return s>ymd(2); }                          // próximamente (siguientes días)
  function cuenta(key){ var t=0,h=0,sin=0; DATA.forEach(function(r){ if(!esDia(r,key)) return; t++;
    if(r.semaforo==='gris') sin++; else h++; }); return {t:t,h:h,sin:sin}; }
  var DIALBL={hoy:'Hoy',manana:'Mañana',pasado:'Pasado mañana',prox:'Próximamente'};

  function rpc(fn,body){
    return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(body||{})}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function fdate(s){ if(!s) return '—'; var p=String(s).split('T')[0].split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):s; }
  function fdt(s){ if(!s) return '—'; var d=new Date(s); return isNaN(d.getTime())?s:d.toLocaleString('es-MX',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}); }
  var LBL={verde:'Validado',naranja:'Por validar',gris:'Sin check-in',fisico:'Check-in físico'};

  async function cargar(){
    $('sub').textContent='Cargando…';
    try{
      var rf=await fetch(SB+'/functions/v1/apepe-recepcion',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({dias:10})});
      var res=await rf.json();
      DATA=Array.isArray(res)?res:[];
    }catch(e){ DATA=[]; $('sub').textContent='No se pudo cargar. Reintenta con Refrescar.'; return; }
    $('sub').textContent='Al día · '+new Date().toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
    render();
  }
  function render(){
    // 1) llenar las 4 cajas con su conteo de check-in
    var box={hoy:['dHoy','sHoy'],manana:['dMan','sMan'],pasado:['dPas','sPas'],prox:['dPro','sPro']};
    for(var key in box){ var c=cuenta(key);
      $(box[key][0]).innerHTML=c.h+' <small>/ '+c.t+'</small>';
      $(box[key][1]).innerHTML=c.sin?('<b>'+c.sin+'</b> sin check-in'):(c.t?'todos con check-in':'&nbsp;'); }
    // 2) resaltar la caja seleccionada
    Array.prototype.forEach.call(document.querySelectorAll('#daycards .dc'),function(b){ b.setAttribute('aria-selected', b.getAttribute('data-f')===FILTRO?'true':'false'); });
    // 3) lista del día seleccionado
    var arr=DATA.filter(function(r){ return esDia(r,FILTRO); });
    var L=$('list');
    if(!arr.length){ L.innerHTML='<div class="empty">No hay llegadas '+DIALBL[FILTRO].toLowerCase()+'.</div>'; return; }
    L.innerHTML=arr.map(function(r,i){
      var idx=DATA.indexOf(r);
      var acc=r.n_acompanantes?(' · +'+r.n_acompanantes+' acomp.'):'';
      var done=r.semaforo!=='gris';
      return '<div class="row" data-i="'+idx+'">'+
        '<span class="dot '+r.semaforo+'"></span>'+
        '<div class="grow"><div class="nm">'+esc(r.nombre||'—')+'</div>'+
          '<div class="mk">'+marcadores(r)+'</div>'+
          '<div class="meta">Llega '+fdate(r.desde)+' → '+fdate(r.hasta)+acc+'</div></div>'+
        '<span class="pill '+r.semaforo+'">'+(done?'✓ ':'')+LBL[r.semaforo]+'</span></div>';
    }).join('');
    Array.prototype.forEach.call(L.querySelectorAll('.row'),function(el){
      el.onclick=function(){ abrir(DATA[+el.getAttribute('data-i')]); };
    });
  }

  var SVG_GLOBO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/></svg>';
  var SVG_IG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>';
  var SVG_REGALO='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="8" width="18" height="4"/><path d="M5 12v9h14v-9M12 8v13M12 8S10 3 7.5 4.5 12 8 12 8zM12 8s2-5 4.5-3.5S12 8 12 8z"/></svg>';
  function srcBadge(f){
    var s=String(f||'').toLowerCase();
    function b(bg,fg,txt,ic){ return '<span class="src" style="background:'+bg+';color:'+fg+'">'+(ic||'')+esc(txt)+'</span>'; }
    if(s.indexOf('website')>=0||s.indexOf('booking engine')>=0||s==='web'||s.indexOf('directo')>=0) return b('#137A56','#fff','Web',SVG_GLOBO);
    if(s.indexOf('booking')>=0) return b('#003580','#fff','Booking');
    if(s.indexOf('hostelworld')>=0) return b('#F04E36','#fff','Hostelworld');
    if(s.indexOf('expedia')>=0) return b('#FFC72C','#1F1B16','Expedia');
    if(s.indexOf('airbnb')>=0) return b('#FF5A5F','#fff','Airbnb');
    if(s.indexOf('intercambio')>=0||s.indexOf('canje')>=0||s.indexOf('instagram')>=0) return '<span class="src ig">'+SVG_IG+'Intercambio</span>';
    if(s.indexOf('cortes')>=0||s.indexOf('equipo pepe')>=0||s.indexOf('comp')===0) return '<span class="src cor">'+SVG_REGALO+'Cortesía</span>';
    if(s.indexOf('walk')>=0) return b('#6B6459','#fff','Walk-in');
    if(s.indexOf('phone')>=0||s.indexOf('tel')>=0) return b('#6B6459','#fff','Teléfono');
    if(s.indexOf('residencia')>=0) return b('#3A3630','#fff','Residencias');
    if(s.indexOf('extens')>=0) return b('#6B6459','#fff','Extensión');
    return '<span class="src" style="background:var(--surface-2);color:var(--ink)">'+esc(f||'—')+'</span>';
  }
  function repiteBadge(r){
    var f=r&&r.fid; if(!(f&&f.est>1)) return '';
    return '<span class="src rep" title="Ya se ha quedado con nosotros">★ Repite'+(f.est?(' · '+f.est+'×'):'')+'</span>';
  }
  function marcadores(r){ return srcBadge(r.fuente)+repiteBadge(r); }
  function bandera(cc){ cc=String(cc||'').toUpperCase(); if(!/^[A-Z]{2}$/.test(cc)) return '';
    return String.fromCodePoint(0x1F1E6+cc.charCodeAt(0)-65)+String.fromCodePoint(0x1F1E6+cc.charCodeAt(1)-65); }
  function perfilHtml(rv,ly){
    var b=bandera(rv&&rv.pais), chips=[];
    if(rv){ if(rv.tipo_viaje) chips.push('<span class="chip">'+esc(rv.tipo_viaje)+(rv.pax?(' · '+rv.pax+'p'):'')+'</span>');
      if(rv.fuente) chips.push('<span class="chip">'+esc(rv.fuente)+'</span>'); }
    if(ly&&ly.fiable){ if(ly.nivel) chips.push('<span class="chip lvl">'+esc(ly.nivel)+'</span>');
      if(ly.viajero) chips.push('<span class="chip lvl">Pepe Viajero</span>');
      if(ly.residente) chips.push('<span class="chip lvl">Pepe Residente</span>'); }
    var hist=(ly&&ly.fiable&&ly.reservas)?('<div class="note" style="margin-top:2px">'+ly.reservas+' estancia'+(ly.reservas===1?'':'s')+' · '+ly.noches+' noche'+(ly.noches===1?'':'s')+' con nosotros <span style="opacity:.7">(aprox. por nombre, últimos meses)</span></div>'):'';
    if(!chips.length && !b && !hist) return '';
    return '<div class="perfil">'+(b?('<span class="flag">'+b+'</span>'):'')+'<div class="chips">'+chips.join('')+'</div></div>'+hist+'<div style="height:10px"></div>';
  }
  function sessTok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(k&&/sb-.*-auth-token/.test(k)){ var v=JSON.parse(localStorage.getItem(k)||'null'); var s=v&&(v.currentSession||v); if(s&&s.access_token) return s.access_token; } } }catch(e){} return ''; }
  async function enviarLink(rid,prop,btn){
    var av=$('linkAviso'); var tok=sessTok();
    if(!tok){ av.textContent='Inicia sesión en el panel para poder mandar el correo.'; return; }
    btn.disabled=true; var old=btn.textContent; btn.textContent='Enviando…';
    try{
      var r=await fetch(SB+'/functions/v1/apepe-checkin-link',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
        body:JSON.stringify({reservation_id:rid,prop:prop,accion:'enviar'})}).then(function(x){return x.json();});
      if(r&&r.ok&&r.correo_enviado&&r.modo==='prueba'){ av.innerHTML='🧪 <b>Prueba</b> enviada a <b>'+esc(r.a)+'</b>. Al huésped aún NO se le manda nada (envío en modo prueba).'; btn.disabled=false; btn.textContent=old; }
      else if(r&&r.ok&&r.correo_enviado){ av.innerHTML='✓ Enviado a <b>'+esc(r.a)+'</b>'; btn.textContent='Enviado ✓'; }
      else { av.innerHTML=esc((r&&r.error)||'No se pudo enviar.')+(r&&r.link?'<br><span class="note">Usa “Copiar link” y mándalo por WhatsApp.</span>':''); btn.disabled=false; btn.textContent=old; }
    }catch(e){ av.textContent='Error de conexión.'; btn.disabled=false; btn.textContent=old; }
  }
  async function copiarLink(rid,prop){
    var av=$('linkAviso'); var tok=sessTok();
    if(!tok){ av.textContent='Inicia sesión en el panel.'; return; }
    try{
      var r=await fetch(SB+'/functions/v1/apepe-checkin-link',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},
        body:JSON.stringify({reservation_id:rid,prop:prop,accion:'link'})}).then(function(x){return x.json();});
      if(r&&r.link){ try{ await navigator.clipboard.writeText(r.link); av.innerHTML='Link copiado ✓ <span style="color:var(--accent);word-break:break-all">'+esc(r.link)+'</span>'; }catch(e){ av.innerHTML='Copia este link:<br><span style="word-break:break-all">'+esc(r.link)+'</span>'; } }
      else { av.textContent=(r&&r.error)||'No se pudo generar el link.'; }
    }catch(e){ av.textContent='Error de conexión.'; }
  }
  function comentariosHtml(pr){
    if(!pr) return '';
    var out='';
    var rs=Array.isArray(pr.resenas)?pr.resenas:[];
    if(rs.length){
      out+='<div class="sec"><h3>Reseñas previas <span class="note" style="font-weight:400">(posible coincidencia por nombre — sin confirmar)</span></h3>';
      rs.forEach(function(x){
        var col = x.flag==='malo' ? {bg:'#F4E2DE',bd:'#9E3B2E',ic:'⚠️',tip:'Trátalo excelente — dale la vuelta a su experiencia'} :
                  x.flag==='top'  ? {bg:'#F3EAD6',bd:'#8C6212',ic:'⭐',tip:'Quedó feliz — consiéntelo'} :
                                    {bg:'#EFE9DD',bd:'#D2C8B6',ic:'💬',tip:''};
        out+='<div style="border:1px solid '+col.bd+';background:'+col.bg+';border-radius:8px;padding:9px 11px;margin-top:8px">'+
          '<div style="font-weight:600">'+col.ic+' '+esc(String(x.rating10))+'/10 · '+esc(x.plataforma)+' <span class="note" style="font-weight:400">'+fdate(x.fecha)+'</span></div>'+
          (col.tip?'<div class="note" style="color:'+col.bd+';margin-top:1px">'+col.tip+'</div>':'')+
          (x.texto?'<div style="margin-top:5px;font-size:13px">“'+esc(x.texto)+'”</div>':'')+
        '</div>';
      });
      out+='</div>';
    }
    var notas=Array.isArray(pr.notas)?pr.notas:[];
    if(notas.length){
      out+='<div class="sec"><h3>Notas de Cloudbeds</h3>';
      notas.forEach(function(n){
        var sys=n.tipo==='firma';
        out+='<div class="ac" style="'+(sys?'opacity:.55':'')+'"><div style="font-size:13px;white-space:pre-wrap">'+esc(n.texto)+'</div>'+
          '<div class="note" style="margin-top:3px">'+esc(n.autor||'')+(n.fecha?(' · '+esc(n.fecha)):'')+(sys?' · firma de kiosco':'')+'</div></div>';
      });
      out+='</div>';
    }
    return out;
  }
  async function abrir(r){
    $('pTitulo').textContent=r.nombre||'Detalle';
    var B=$('pBody');
    $('ov').classList.add('on');
    var perfil='',coment='';
    if(r.reservation_id){
      B.innerHTML='<div class="note">Cargando perfil…</div>';
      try{ var pr=await fetch(SB+'/functions/v1/apepe-reserva',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({rid:r.reservation_id,prop:r.sede||'cdmx'})}).then(function(x){return x.json();});
        if(pr&&pr.ok){ perfil=perfilHtml(pr.reserva,pr.loyalty); coment=comentariosHtml(pr); }
      }catch(e){}
    }
    if(!r.checkin_id){
      var fisico=(r.semaforo==='fisico');
      var h0=perfil+coment+'<div class="grid2">'+
        campo('Reserva','Llega '+fdate(r.desde)+' → '+fdate(r.hasta),true)+
        campo('Fuente',esc(r.fuente||r.nacionalidad||'—'))+
        campo('Estado',fisico?'Check-in físico (recepción)':'Sin check-in')+'</div>'+
        (fisico
          ? '<div class="acty" style="background:#E4F1FA;color:#2B6CB0">Ya hizo su check-in en recepción (marcado en Cloudbeds). No hizo el check-in online en la app.</div>'
          : '<div class="acty">Este huésped aún no ha hecho su check-in.</div>');
      if(r.reservation_id){
        h0+='<div class="sec"><h3>Link de check-in online</h3>'+
          '<div class="note">Mándale al huésped su link para que haga el check-in desde su teléfono antes de llegar.</div>'+
          '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px">'+
            '<button class="btn" id="btnEnviarLink">📲 Enviar por correo</button>'+
            '<button class="btn ghost" id="btnCopiarLink">Copiar link</button>'+
          '</div><div class="note" id="linkAviso" style="margin-top:9px"></div></div>';
      }
      B.innerHTML=h0;
      var be=$('btnEnviarLink'); if(be) be.onclick=function(){ enviarLink(r.reservation_id,r.sede||'cdmx',be); };
      var bc=$('btnCopiarLink'); if(bc) bc.onclick=function(){ copiarLink(r.reservation_id,r.sede||'cdmx'); };
      return;
    }
    B.innerHTML='<div class="note">Cargando detalle…</div>';
    var d;
    try{ d=await rpc('apepe_recepcion_detalle',{p_id:r.checkin_id}); }catch(e){ B.innerHTML='<div class="acty">No se pudo cargar el detalle.</div>'; return; }
    if(!d){ B.innerHTML='<div class="acty">Sin datos.</div>'; return; }
    var dd=d.doc_datos||{}, acs=Array.isArray(d.acompanantes)?d.acompanantes:[];
    var valido=(d.estado==='validado');
    // documentos: URLs firmadas del bucket privado (o base64 si aún no se archivó)
    var docs={};
    try{ docs=await fetch(SB+'/functions/v1/apepe-doc',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify({accion:'ver',checkin_id:r.checkin_id})}).then(function(x){return x.json();}); }catch(e){}
    var firmaSrc=(docs&&docs.firma_url)||d.firma||'';
    var idSrc=(docs&&docs.id_principal_url)||'';
    var contratoUrl=(docs&&docs.contrato_url)||'';
    var acompUrls=(docs&&Array.isArray(docs.acomp))?docs.acomp:[];
    var html='<div class="grid2">'+
      campo('Nombre',esc(d.nombre||'—'),true)+
      campo('Nacionalidad',esc(d.nacionalidad||'—'))+
      campo('Documento',esc((d.doc_tipo||'—')+(d.doc_numero?(' · '+d.doc_numero):'')))+
      campo('Nacimiento',dd.nacimiento?fdate(dd.nacimiento):'—')+
      campo('Estancia',fdate(d.desde)+' → '+fdate(d.hasta)+' ('+(d.noches||'—')+' noches)')+
      campo('Correo',esc(dd.email||'—'))+
      campo('Celular',esc(dd.tel||'—'))+
    '</div>';
    html+='<div class="sec"><h3>Contrato e identidad</h3>'+
      '<span class="badge '+(d.consentimiento?'ok':'no')+'">'+(d.consentimiento?'✓ Aceptó términos y condiciones':'Sin aceptar')+'</span>';
    if(contratoUrl) html+=' <a class="btn ghost" style="padding:4px 11px;margin-left:6px;text-decoration:none;display:inline-block" href="'+esc(contratoUrl)+'" target="_blank" rel="noopener">📄 Contrato firmado (PDF)</a>';
    var kst='font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)';
    if(idSrc) html+='<div style="margin-top:10px"><div class="k" style="'+kst+'">Documento (ID)</div><img class="firma" style="margin-top:6px;max-height:200px" src="'+esc(idSrc)+'" alt="Documento"></div>';
    if(firmaSrc) html+='<div style="margin-top:10px"><div class="k" style="'+kst+'">Firma</div><img class="firma" style="margin-top:6px" src="'+esc(firmaSrc)+'" alt="Firma"></div>';
    html+='</div>';
    if(acs.length){
      html+='<div class="sec"><h3>Acompañantes ('+acs.length+')</h3>';
      acs.forEach(function(a,i){
        var t=[]; if(a.menor) t.push('menor'+(a.edad?(' · '+a.edad+'a'):'')); if(a.app&&a.email) t.push('app: '+esc(a.email));
        var au=(acompUrls[i]&&acompUrls[i].url)||a.id_foto||'';
        html+='<div class="ac"><b>'+esc(a.nombre||'—')+'</b>'+(t.length?(' <span class="note">('+t.join(' · ')+')</span>'):'')+
          (au?'<img class="firma" style="margin-top:8px;max-height:150px" src="'+esc(au)+'" alt="ID acompañante">':'<div class="note" style="margin-top:4px;color:var(--bad)">Sin foto de ID</div>')+'</div>';
      });
      html+='</div>';
    }
    html+='<div class="sec"><h3>Validación</h3>';
    if(valido){
      html+='<span class="badge ok">✓ Validado</span> <span class="note">'+esc(d.validado_por||'')+' · '+fdt(d.validado_at)+'</span>';
    } else {
      html+='<div class="note" style="margin-bottom:10px">Hecho el '+fdt(d.created_at)+'. Revisa foto, firma y datos; al validar, el semáforo pasa a verde.</div>'+
        '<button class="btn" id="btnValidar">✓ Validar check-in</button>';
    }
    html+='</div>';
    B.innerHTML=perfil+coment+html;
    var bv=$('btnValidar');
    if(bv) bv.onclick=function(){ validar(d.id, bv); };
  }
  function campo(k,v,full){ return '<div class="f'+(full?' full':'')+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>'; }

  async function validar(id,btn){
    btn.disabled=true; btn.textContent='Validando…';
    var por='Recepción';
    try{ if(window.cpAcceso&&cpAcceso.tokEmail){ por=cpAcceso.tokEmail()||por; } }catch(e){}
    try{
      await rpc('apepe_checkin_validar',{p_id:id,p_por:por});
      $('ov').classList.remove('on');
      await cargar();
    }catch(e){ btn.disabled=false; btn.textContent='✓ Validar check-in'; alert('No se pudo validar. Reintenta.'); }
  }

  // cajas por día (selector)
  Array.prototype.forEach.call(document.querySelectorAll('#daycards .dc'),function(b){
    b.onclick=function(){ FILTRO=b.getAttribute('data-f'); render(); window.scrollTo(0,0); };
  });
  async function linkTop(){ var rid=($('lkRid').value||'').trim(); var prop=$('lkProp').value||'cdmx'; var av=$('lkAviso');
    if(!rid){ av.textContent='Escribe el ID de la reserva de Cloudbeds.'; return; }
    var tok=sessTok(); if(!tok){ av.textContent='Inicia sesión en el panel para generar el link.'; return; }
    av.textContent='Generando…';
    try{ var r=await fetch(SB+'/functions/v1/apepe-checkin-link',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+tok,'Content-Type':'application/json'},body:JSON.stringify({reservation_id:rid,prop:prop,accion:'link'})}).then(function(x){return x.json();});
      if(r&&r.link){ try{ await navigator.clipboard.writeText(r.link); }catch(e){} av.innerHTML='Link copiado ✓ <a href="'+esc(r.link)+'" target="_blank" rel="noopener" style="word-break:break-all;color:var(--accent,#137A56)">'+esc(r.link)+'</a>'; }
      else av.textContent=(r&&r.error)||'No se pudo generar el link.';
    }catch(e){ av.textContent='Error de conexión.'; } }
  $('lkBtn').onclick=linkTop;
  $('lkRid').addEventListener('keydown',function(e){ if(e.key==='Enter') linkTop(); });
  $('btnRefrescar').onclick=cargar;
  $('pCerrar').onclick=function(){ $('ov').classList.remove('on'); };
  $('ov').onclick=function(e){ if(e.target===$('ov')) $('ov').classList.remove('on'); };

  cargar();
})();
</script>
</body>
