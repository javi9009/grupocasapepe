<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lector de boletos · Casa Pepe</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;
--rule:#E2DCCF;--rule-2:#D2C8B6;--accent:#137A56;--on-accent:#fff;
--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;
--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 70px}
h1{font-size:1.3rem;margin:0 0 2px}
.sub{color:var(--muted);font-size:.86rem;margin-bottom:14px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
#lector{width:100%;border-radius:12px;overflow:hidden;background:#000;min-height:40px}
.btn{border:0;border-radius:11px;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.p{background:var(--accent);color:var(--on-accent)}
.btn.o{background:var(--surface);color:var(--ink-2);border:1px solid var(--rule-2)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.man{display:flex;gap:8px;margin-top:14px}
.man input{flex:1;font:inherit;padding:11px 12px;border:1px solid var(--rule-2);border-radius:11px;background:var(--surface);text-transform:uppercase}
.nota{font-size:.78rem;color:var(--faint);margin-top:8px;min-height:1em}
.res{margin-top:14px;border-radius:14px;border:1px solid var(--rule);padding:18px;text-align:center}
.res .big{font-size:1.6rem;font-weight:800}
.res .det{font-size:.95rem;margin-top:8px;line-height:1.45}
.res .pie{font-size:.8rem;color:var(--muted);margin-top:8px}
.res .tipo{display:inline-block;font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin-bottom:8px}
.res.ok{background:var(--ok-bg);border-color:var(--ok)} .res.ok .big{color:var(--ok)}
.res.warn{background:var(--warn-bg);border-color:var(--warn)} .res.warn .big{color:var(--warn)}
.res.bad{background:var(--bad-bg);border-color:var(--bad)} .res.bad .big{color:var(--bad)}
.res .tipo.tour{background:#DCEFE6;color:var(--accent)} .res .tipo.cine{background:#EDE4F3;color:#6B3FA0}
.res .tipo.vnum{background:#FBE4D8;color:#C9501A}
.res .btn{margin-top:12px}
.res .btn.p{background:#C9501A;color:#fff}
.mini{color:var(--muted)}
.hist{margin-top:18px}
.hist h3{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);margin:0 0 6px}
.hrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--rule);font-size:.85rem}
.hrow:first-of-type{border-top:0}
.hdot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.hdot.ok{background:var(--ok)}.hdot.rep{background:var(--warn)}.hdot.no{background:var(--bad)}
.hrow .hq{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hrow .ht{color:var(--muted);font-size:.78rem}
.gate{background:var(--warn-bg);border:1px solid #E6D3AC;border-radius:12px;padding:14px;color:var(--warn);font-size:.9rem}
</style>
  <link rel="stylesheet" href="/cp-movil.css">
</head>
<body>
<div class="wrap">
  <h1>🎫 Lector de boletos</h1>
  <div class="sub">Un solo lector para todo: boletos de eventos (cine/teatro), de tours y las cartas de premio de los Vnums. Apunta al QR y te dice solo de qué es.</div>
  <div id="gate" style="display:none"></div>
  <div class="card" id="scanCard">
    <div id="lector"></div>
    <div class="btns">
      <button class="btn p" id="bStart">▶ Iniciar cámara</button>
      <button class="btn o" id="bStop" style="display:none">⏹ Detener</button>
    </div>
    <div class="nota" id="nota">Dale a «Iniciar cámara» y apunta al QR. Si pide permiso de cámara, acéptalo.</div>
    <div class="man">
      <input id="man" type="text" placeholder="¿Sin cámara? Escribe el código" autocapitalize="characters" autocomplete="off">
      <button class="btn o" id="bMan">Verificar</button>
    </div>
    <div id="res" class="res" style="display:none"></div>
  </div>
  <div class="hist card" id="histCard" style="margin-top:14px;display:none">
    <h3>Últimos escaneos</h3>
    <div id="hist"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cp-acceso.js"></script>
<script>
(function(){
'use strict';
var SB_URL='https://rehophywchakfapivsbh.supabase.co';
var SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var sb = window.supabase ? supabase.createClient(SB_URL, SB_KEY) : null;
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

if(!sb){ $('gate').style.display='block'; $('gate').textContent='No cargó la conexión. Revisa tu internet y recarga.'; $('scanCard').style.display='none'; }

/* Si el QR trae una URL (por eso a veces abre el explorador), sacamos de ella
   los posibles códigos: los valores de los parámetros y los trozos de la ruta.
   Si es un código pelado, ese mismo. Se prueban de más probable a menos. */
function candidatos(txt){
  txt=String(txt||'').trim();
  var out=[];
  if(/^https?:\/\//i.test(txt)){
    try{ var u=new URL(txt);
      u.searchParams.forEach(function(v){ if(v) out.push(v); });
      u.pathname.split('/').filter(Boolean).forEach(function(s){ out.push(decodeURIComponent(s)); });
    }catch(_){}
  } else { out.push(txt); }
  out.push(txt);
  var seen={}, res=[];
  out.forEach(function(s){ s=String(s||'').trim(); if(s && s.length>=3 && s.length<=80 && !/\.(html?|php)$/i.test(s) && !seen[s.toUpperCase()]){ seen[s.toUpperCase()]=1; res.push(s.toUpperCase()); } });
  return res;
}

var HIST=[], ultimo='', ultimoAt=0;

/* ¿El validador reconoció este código como suyo? ok=válido; ya_usado /
   reserva_cancelada = existe pero no deja pasar; lo demás = no es de ese sistema. */
function reconocido(r){ return r && (r.ok===true || r.motivo==='ya_usado' ||
  r.motivo==='reserva_cancelada' || r.motivo==='reserva_devuelta' || r.motivo==='devolucion_parcial'); }

async function tryRpc(fn, codigo){
  try{ var r=await sb.rpc(fn,{p_codigo:codigo}); if(r.error) return null; return r.data||null; }
  catch(e){ return null; }
}

/* Las cartas de premio (Vnums) son el TERCER tipo de QR que anda en la casa, y
   el lector no las conocía: decía «no válido» a una margarita de bienvenida
   perfectamente buena. Javi, 4-nov-2026 (código VPJXQLHF, de Juan Carlos).
   vnum_ver sólo MIRA, no quema la carta: cobrarla es un botón aparte, porque
   quien está en la puerta de un tour no debería gastar una carta sin querer.
   Si el guión no tiene permiso de Vnums, la función revienta con 42501 y desde
   aquí no se puede saber si el código era una carta: se dice en el pie. */
var SIN_PERMISO_VNUM=false;
async function tryVnum(codigo){
  try{
    var r=await sb.rpc('vnum_ver',{p_codigo:codigo});
    if(r.error){ if(/permiso/i.test(r.error.message||'')) SIN_PERMISO_VNUM=true; return null; }
    var d=r.data||null;
    return (d && d.ok===true) ? d : null;
  }catch(e){ if(/permiso/i.test(e.message||'')) SIN_PERMISO_VNUM=true; return null; }
}

async function verifica(texto){
  var cands=candidatos(texto);
  if(!cands.length) return;
  var key=cands[0];
  var ahora=Date.now();
  if(key===ultimo && ahora-ultimoAt<4000) return;  // el lector dispara varias veces sobre el mismo QR
  ultimo=key; ultimoAt=ahora;
  $('res').style.display='block'; $('res').className='res'; $('res').innerHTML='<div class="mini">Comprobando…</div>';

  var hit=null, tipo=null;
  for(var i=0;i<cands.length && !hit;i++){
    var c=cands[i];
    var t=await tryRpc('sinc_verificar_boleto', c);      // tours (Margarita, etc.)
    if(reconocido(t)){ hit=t; tipo='tour'; break; }
    var k=await tryRpc('cine_verificar_boleto', c);      // eventos (cine/teatro)
    if(reconocido(k)){ hit=k; tipo='cine'; break; }
    var v=await tryVnum(c);                              // cartas de premio (Vnums)
    if(v){ hit=v; tipo='vnum'; break; }
  }
  pinta(hit, tipo, cands[0]);
}

function pinta(r, tipo, codigo){
  var el=$('res'); el.style.display='block';
  var tag = tipo==='tour' ? '<span class="tipo tour">Tour</span>' : (tipo==='cine' ? '<span class="tipo cine">Cine / Evento</span>' : (tipo==='vnum' ? '<span class="tipo vnum">Carta de premio</span>' : ''));
  if(tipo==='vnum'){ pintaVnum(r); return; }
  if(r && r.ok){
    el.className='res ok';
    var nom = esc(r.titular||r.evento||'');
    var det = tipo==='cine'
      ? esc((r.evento||'')+'')+'<br>'+esc((r.fecha||'')+' '+((r.hora||'').slice(0,5)))
      : '<b>'+esc(r.titular||'—')+'</b><br>'+esc(r.experiencia||'');
    el.innerHTML=tag+'<div class="big">✅ Boleto válido</div><div class="det">'+det+'</div><div class="pie">Marcado como usado · ¡Deja pasar!</div>';
    HIST.unshift({q:(r.titular||r.evento||codigo), cls:'ok', txt:'válido'});
  } else if(r && r.motivo==='ya_usado'){
    el.className='res warn';
    el.innerHTML=tag+'<div class="big">⚠️ Ya se usó</div><div class="det"><b>'+esc(r.titular||r.evento||'—')+'</b><br>'+esc(r.experiencia||'')+'</div><div class="pie">Se escaneó el '+esc(String(r.usado_at||'').replace('T',' ').slice(0,16))+(r.usado_por?' · '+esc(r.usado_por):'')+'</div>';
    HIST.unshift({q:(r.titular||r.evento||codigo), cls:'rep', txt:'ya usado'});
  } else if(r && (r.motivo==='reserva_devuelta'||r.motivo==='devolucion_parcial')){
    /* Javi, 1-nov-2026: «si se reembolsa el QR no debería de funcionar y
       mencionar que fue reembolsada». Antes pasaba en verde: devolver el
       dinero no cancela la reserva, y el lector sólo miraba la cancelación. */
    var ent = r.motivo==='reserva_devuelta';
    el.className='res bad';
    el.innerHTML=tag+'<div class="big">⛔ '+(ent?'Reserva devuelta':'Devolución parcial')+'</div>'+
      '<div class="det"><b>'+esc(r.titular||'—')+'</b><br>'+esc(r.experiencia||'')+'</div>'+
      '<div class="pie">'+(ent?'Este boleto no sirve: la reserva se devolvió y el dinero ya volvió al huésped.':'A esta reserva se le devolvió una parte. Antes de dejar pasar, consúltalo.')+'</div>';
    HIST.unshift({q:(r.titular||codigo), cls:'no', txt:ent?'devuelta':'devolución parcial'});
  } else if(r && r.motivo==='reserva_cancelada'){
    el.className='res bad';
    el.innerHTML=tag+'<div class="big">⛔ Reserva cancelada</div><div class="det"><b>'+esc(r.titular||'—')+'</b><br>'+esc(r.experiencia||'')+'</div><div class="pie">Este boleto existió, pero la reserva se canceló.</div>';
    HIST.unshift({q:(r.titular||codigo), cls:'no', txt:'cancelada'});
  } else {
    el.className='res bad';
    el.innerHTML='<div class="big">⛔ No válido</div><div class="pie">Ese código no es de boletos, ni de tours, ni una carta de premio'+
      (SIN_PERMISO_VNUM ? ' que tú puedas ver (las cartas de los Vnums las cobra barra o recepción, en 🪙 Cobrar)' : '')+
      '. Revisa que sea un QR de Casa Pepe.</div>';
    HIST.unshift({q:esc(codigo||'—'), cls:'no', txt:'no existe'});
  }
  pintaHist();
}

/* La carta se mira primero y se cobra con un botón. En la pantalla de Cobrar
   (/m/vnum-cobrar.html) se cobra de un tiro al escanear, porque ahí el mesero
   ya va a eso; aquí no, porque este lector se usa en la puerta. */
var VNUM_ACTUAL=null;
function pintaVnum(d){
  VNUM_ACTUAL=d;
  var el=$('res'); el.style.display='block';
  var tag='<span class="tipo vnum">Carta de premio</span>';
  var quien='<b>'+esc(d.premio||'Carta')+'</b><br>'+esc(d.nombre||'')+
            (d.donde?'<br>Se entrega en '+esc(d.donde):'');
  if(d.estado==='activa'){
    el.className='res ok';
    el.innerHTML=tag+'<div class="big">🪙 Carta buena</div><div class="det">'+quien+'</div>'+
      '<button class="btn p" id="bVnum">Cobrar esta carta</button>'+
      '<div class="pie">Todavía no se ha gastado. Dále a cobrar cuando se la entregues.</div>';
    $('bVnum').onclick=function(){ cobraVnum(d.codigo); };
    HIST.unshift({q:(d.nombre||d.codigo), cls:'ok', txt:'carta sin cobrar'});
  } else if(d.estado==='usada'){
    el.className='res warn';
    el.innerHTML=tag+'<div class="big">⚠️ Ya se cobró</div><div class="det">'+quien+'</div>'+
      '<div class="pie">Se cobró el '+esc(String(d.usada_at||'').replace('T',' ').slice(0,16))+
      (d.usada_por?' · '+esc(d.usada_por):'')+'</div>';
    HIST.unshift({q:(d.nombre||d.codigo), cls:'rep', txt:'carta ya cobrada'});
  } else {
    el.className='res bad';
    el.innerHTML=tag+'<div class="big">⛔ '+(d.estado==='caducada'?'Carta caducada':'Carta anulada')+'</div>'+
      '<div class="det">'+quien+'</div>'+
      '<div class="pie">'+(d.estado==='caducada'?'Se le pasó el plazo.':'Esta carta se dio de baja.')+'</div>';
    HIST.unshift({q:(d.nombre||d.codigo), cls:'no', txt:'carta '+esc(d.estado||'')});
  }
  pintaHist();
}

async function cobraVnum(codigo){
  var el=$('res'); el.className='res'; el.innerHTML='<div class="mini">Cobrando…</div>';
  try{
    var r=await sb.rpc('vnum_cobrar',{p_codigo:codigo});
    if(r.error) throw r.error;
    var d=r.data||{};
    if(d.ok){
      el.className='res ok';
      el.innerHTML='<span class="tipo vnum">Carta de premio</span>'+
        '<div class="big">✅ Cobrada</div>'+
        '<div class="det"><b>'+esc(d.premio||'')+'</b><br>'+esc(d.nombre||'')+'</div>'+
        '<div class="pie">'+esc(d.mensaje||'¡Salud!')+'</div>';
      HIST.unshift({q:(d.nombre||codigo), cls:'ok', txt:'carta cobrada'});
      if(navigator.vibrate) try{ navigator.vibrate(60); }catch(_){}
    } else if(d.motivo==='otra_casa'){
      el.className='res bad';
      el.innerHTML='<div class="big">⛔ Es de otra casa</div><div class="pie">Esta carta se ganó en '+esc(d.casa||'otra casa')+'.</div>';
      HIST.unshift({q:(d.nombre||codigo), cls:'no', txt:'otra casa'});
    } else {
      el.className='res warn';
      el.innerHTML='<div class="big">⚠️ No se pudo cobrar</div><div class="pie">'+esc(d.motivo||'')+'</div>';
      HIST.unshift({q:(d.nombre||codigo), cls:'rep', txt:esc(d.motivo||'')});
    }
  }catch(e){
    el.className='res bad';
    el.innerHTML='<div class="big">No se pudo cobrar</div><div class="pie">'+esc(e.message||e)+'</div>';
  }
  pintaHist();
}

function pintaHist(){
  if(!HIST.length) return;
  $('histCard').style.display='block';
  $('hist').innerHTML=HIST.slice(0,8).map(function(h){
    return '<div class="hrow"><span class="hdot '+h.cls+'"></span><span class="hq">'+esc(h.q)+'</span><span class="ht">'+esc(h.txt)+'</span></div>';
  }).join('');
}

/* Cámara */
var SCAN=null;
$('bMan').onclick=function(){ var c=$('man').value.trim(); if(c){ verifica(c); $('man').value=''; } };
$('man').onkeydown=function(ev){ if(ev.key==='Enter') $('bMan').click(); };
$('bStart').onclick=async function(){
  if(typeof Html5Qrcode==='undefined'){ $('nota').textContent='No cargó el lector de QR. Revisa la conexión y recarga.'; return; }
  try{
    SCAN=new Html5Qrcode('lector');
    $('bStart').style.display='none'; $('bStop').style.display='';
    $('nota').textContent='Apunta al QR del boleto.';
    await SCAN.start({facingMode:'environment'},{fps:10,qrbox:240},function(txt){ verifica(txt); },function(){});
  }catch(e){
    $('nota').textContent='No se pudo abrir la cámara: '+(e.message||e)+'. Da permiso de cámara y entra por HTTPS.';
    $('bStart').style.display=''; $('bStop').style.display='none';
  }
};
$('bStop').onclick=async function(){
  if(SCAN){ try{await SCAN.stop();}catch(_){} try{SCAN.clear();}catch(_){} SCAN=null; }
  $('bStart').style.display=''; $('bStop').style.display='none'; $('nota').textContent='';
};
})();
</script>
</body></html>
