<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alta de hotel o grupo</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#C9501A; --naranja-suave:#FDE7DC; --azul:#1A7FB5; --azul-suave:#DFEAF6;
  --verde:#1D6B4A; --verde-suave:#E1F0E7; --ambar:#8C6212; --ambar-suave:#F6EBD5;
  --rojo:#9E3B2E; --rojo-suave:#F6E1DD; --morado:#6B2E86; --morado-suave:#EDE4F6;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--hueso);color:var(--tinta);font:400 15px/1.55 Inter,system-ui,sans-serif}
.barra{background:var(--tinta);color:#fff;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.barra b{font:700 17px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.barra span{font-size:13px;color:#C9C2B8}
.env{max-width:1060px;margin:0 auto;padding:22px 20px 70px}
.caja{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);padding:20px 22px;margin-bottom:18px}
h2{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 3px}
.ay{font-size:13.5px;color:var(--gris);margin:0 0 16px;line-height:1.55}

/* lista de altas */
.lista{display:grid;gap:9px}
.alta{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;border:1px solid var(--linea);
  border-radius:11px;padding:12px 15px;background:#fff}
.alta .nm{font:600 14px/1.2 Oswald,sans-serif;text-transform:uppercase}
.alta .ds{font-size:12px;color:var(--gris);margin-top:3px}
.mas{margin-top:12px;display:inline-flex;align-items:center;gap:9px;border:2px dashed var(--linea);background:#fff;
  border-radius:11px;padding:13px 20px;font:600 13px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;
  color:var(--verde);cursor:pointer;width:100%;justify-content:center}
.mas:hover{border-color:var(--verde);background:var(--verde-suave)}

/* pasos */
.pasos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.ps{flex:1;min-width:120px;border:0;border-top:3px solid var(--linea);background:transparent;text-align:left;
  padding:9px 2px 0;cursor:pointer;font:inherit}
.ps b{display:block;font:600 10px/1.3 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--tenue)}
.ps span{display:block;font-size:12.5px;color:var(--gris);margin-top:2px;line-height:1.3}
.ps.on{border-top-color:var(--verde)} .ps.on b{color:var(--verde)} .ps.on span{color:var(--tinta);font-weight:600}
.ps.ya{border-top-color:#9BC4B3} .ps.ya b{color:var(--verde)}

/* el picker de modulos */
.fam{margin-bottom:22px}
.famcab{display:flex;align-items:baseline;gap:11px;margin:0 0 4px}
.famcab h3{font:700 13px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0}
.famcab .tg{font-size:12px;color:var(--gris)}
.famcab button{margin-left:auto;border:1px solid var(--linea);background:#fff;border-radius:8px;padding:5px 11px;
  font:600 10px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:var(--gris);cursor:pointer}
.famcab button:hover{border-color:var(--verde);color:var(--verde)}
.famdice{font-size:12.5px;color:var(--gris);margin:0 0 10px;line-height:1.5}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:8px}
.m{display:grid;grid-template-columns:22px 1fr;gap:11px;align-items:start;border:1.5px solid var(--linea);
  border-radius:10px;padding:11px 13px;background:#fff;cursor:pointer}
.m:hover{border-color:var(--verde)}
.m.on{border-color:var(--verde);background:var(--verde-suave)}
.m input{width:17px;height:17px;margin-top:2px}
.m .nm{font:600 12.5px/1.25 Oswald,sans-serif;text-transform:uppercase}
.m .ds{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
.m .sub{font-size:11px;color:var(--tenue);margin-top:4px;line-height:1.4}
.int{display:inline-block;font:600 9px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;
  border-radius:99px;padding:4px 8px;margin-top:7px}
.int.no{background:var(--hueso);color:var(--gris)}
.int.pms{background:var(--azul-suave);color:#1F5B7A}
.int.pos{background:var(--ambar-suave);color:var(--ambar)}
.int.pago{background:var(--naranja-suave);color:var(--naranja)}
.int.banco{background:var(--morado-suave);color:var(--morado)}

/* resumen pegajoso */
.res{position:sticky;bottom:0;background:var(--tinta);color:#fff;border-radius:12px;padding:15px 18px;margin-top:8px;
  box-shadow:0 -6px 24px -14px rgba(30,26,22,.5)}
.res .l1{display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.res .n{font:700 24px/1 Oswald,sans-serif}
.res .t{font-size:12.5px;color:#C9C2B8}
.res .conx{display:flex;gap:7px;flex-wrap:wrap;margin-top:11px}
.res .cx{font:600 10px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;border-radius:99px;padding:6px 11px;background:rgba(255,255,255,.14)}
.res .cx.si{background:#fff;color:var(--tinta)}
.bt{border:2px solid var(--verde);background:var(--verde);color:#fff;border-radius:9px;padding:11px 20px;
  font:600 12.5px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;margin-left:auto}
.bt.g{border-color:#fff;background:transparent;color:#fff}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 10px/1.3 Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--gris);
  text-align:left;padding:0 10px 9px;border-bottom:1px solid var(--linea)}
td{padding:11px 10px;border-bottom:1px solid #F2EDE5;vertical-align:top}
tr:last-child td{border-bottom:0}
td b{font:600 13px/1.25 Oswald,sans-serif;text-transform:uppercase}
.pz{display:inline-block;font:600 9.5px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;border-radius:99px;padding:4px 9px}
.pz.a{background:var(--verde-suave);color:var(--verde)}
.pz.b{background:var(--naranja-suave);color:var(--naranja)}
.pz.c{background:var(--azul-suave);color:#1F5B7A}
.pz.e{background:var(--hueso);color:var(--gris)}
.nota{background:var(--hueso);border-radius:9px;padding:12px 15px;font-size:13px;color:var(--tinta-2);line-height:1.55;margin-top:14px}
.nota b{color:var(--tinta)}
.oculto{display:none}
.scroll{overflow-x:auto}.scroll table{min-width:620px}
label.campo{display:block;font:600 10.5px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);margin:0 0 5px}
.rej{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.rej{grid-template-columns:1fr}}
input[type=text],select{width:100%;font:400 14.5px Inter;border:1.5px solid var(--linea);border-radius:9px;padding:10px 11px;background:#fff;color:var(--tinta)}
.radios{display:grid;gap:9px;margin-top:4px}
.rd{display:grid;grid-template-columns:20px 1fr;gap:11px;align-items:start;border:1.5px solid var(--linea);border-radius:10px;padding:12px 14px;cursor:pointer}
.rd.on{border-color:var(--verde);background:var(--verde-suave)}
.rd .nm{font:600 13px/1.2 Oswald,sans-serif;text-transform:uppercase}
.rd .ds{font-size:12px;color:var(--gris);margin-top:3px;line-height:1.45}
</style>
</head>
<body>
<div class="barra"><b>Alta de hotel o grupo</b>
  <span>Como la de experiencias: un «+» y se crea uno nuevo.</span></div>

<div class="env">

  <!-- ========== LA LISTA ========== -->
  <div class="caja" id="vLista">
    <h2>Altas en marcha</h2>
    <p class="ay">Lo mismo que la lista de experiencias o de eventos, pero lo que se crea es un hotel.</p>
    <div class="lista" id="lista"></div>
    <button class="mas" id="bMas">+ Nuevo hotel o grupo</button>
  </div>

  <!-- ========== EL ALTA ========== -->
  <div class="oculto" id="vAlta">
    <div class="caja">
      <div class="pasos" id="pasos"></div>
      <div id="paso"></div>
    </div>
  </div>

</div>

<script>
/* EL ALTA DE UN HOTEL O UN GRUPO. Javi, 10-oct-2026:
 *
 *  · «Primero el hotel deberia de escoger que modulos quiere ANTES de firmar.»
 *    Da la vuelta al orden que teniamos: no se firma y luego se configura, se
 *    elige y de lo elegido sale el contrato. Tiene sentido comercial —vende el
 *    producto antes de pedir la firma— y tecnico: el contrato dice que modulos
 *    cubre y que integraciones hacen falta.
 *
 *  · «¿Podrias crear una pantalla en la que pudiera escoger los modulos que le
 *    interesan y poner si algunos necesitan integracion y cuales no? Por
 *    ejemplo room service si pero reloj checador no.» Esa es la pantalla del
 *    paso 2, y es el corazon de todo esto: cada modulo declara que necesita, y
 *    el paso 3 se calcula solo.
 *
 *  · «La firma del convenio suele ser tambien la de la cuenta de Stripe,
 *    entonces no deberia de ser varios Stripe sino 1. Pero puedes dejar la
 *    opcion de que cada hotel cobre con su Stripe.» Corregido: UNO por grupo
 *    por defecto, varios como excepcion. Yo lo tenia al reves.
 *
 *  · «La pantalla deberia ser como la de experiencias o eventos, que le damos a
 *    + y creamos un hotel nuevo, con la salvedad de poder copiar el anterior en
 *    los intangibles.»
 *
 * Los modulos salen del catalogo de verdad de Casa Pepe (tabla `modulos`), no
 * de una lista inventada: es lo que ya existe y funciona en casa.
 */
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ---------- las integraciones ---------- */
var INT={
  no:   {n:'sin integración', c:'no',    q:null},
  pms:  {n:'PMS',             c:'pms',   q:'Cloudbeds u otro PMS'},
  pos:  {n:'punto de venta',  c:'pos',   q:'el POS del restaurante'},
  pago: {n:'cobro',           c:'pago',  q:'Stripe'},
  banco:{n:'banco',           c:'banco', q:'el banco, para dispersar'}
};

/* ---------- el catálogo de módulos ----------
   familia = la cáscara donde vive. Cada módulo dice qué integración pide. */
var FAM=[
 {k:'huesped', n:'Para el huésped', tg:'la app', dice:'Lo que ve quien se hospeda o quien compra. Es la APePe con su marca.'},
 {k:'trabaja', n:'Para el equipo',  tg:'SoyPepe', dice:'Lo que usa su gente todos los días desde el teléfono.'},
 {k:'admin',   n:'Para la dirección', tg:'el dashboard', dice:'Lo que mira quien lleva la casa o el grupo.'}
];
var MODS=[
 /* ---- huésped ---- */
 {f:'huesped', n:'Welcome', i:'no',   d:'La bienvenida y cómo funciona la casa.'},
 {f:'huesped', n:'Check-in del hotel', i:'pms', d:'Hace su check-in desde el teléfono.',
   sub:'Incluye upgrade de cuarto, extensión de estancia y nueva reserva.'},
 {f:'huesped', n:'Mapa del barrio', i:'no', d:'Los lugares que el hotel elige, con buscador.'},
 {f:'huesped', n:'Experiencias', i:'pago', d:'Tours del buffet, o los suyos.'},
 {f:'huesped', n:'Conciertos y eventos', i:'pago', d:'La cartelera que quiera vender.'},
 {f:'huesped', n:'Restaurante', i:'pos', d:'La carta, para consultarla o pedir en la mesa.'},
 {f:'huesped', n:'Room service', i:'pos', d:'La misma carta, a la habitación.'},
 {f:'huesped', n:'Tienda', i:'pago', d:'Artesanía y productos, suyos o del buffet.'},
 {f:'huesped', n:'Comunidades', i:'no', d:'Con quién colabora y por qué.'},
 {f:'huesped', n:'Juegos y promos', i:'no', d:'Pepe GO, Pepe Quiz, Holafly y las que añada.'},
 {f:'huesped', n:'Rentar un espacio', i:'pago', d:'Salas por horas, a quien sea.'},
 {f:'huesped', n:'Lo que tu plan incluye', i:'no', d:'Para socios o estancias con servicios incluidos.'},
 {f:'huesped', n:'Programa de lealtad', i:'no', d:'Los Vnums: el huésped que se fue vuelve por aquí.'},

 /* ---- equipo ---- */
 {f:'trabaja', n:'Reloj checador', i:'no', d:'Llegué / me voy, desde el teléfono.'},
 {f:'trabaja', n:'Mi horario', i:'no', d:'El turno de cada quien y los cambios.'},
 {f:'trabaja', n:'Mis vacaciones', i:'no', d:'Pedir y aprobar días.'},
 {f:'trabaja', n:'Ama de llaves', i:'pms', d:'Qué cuartos limpiar hoy y en qué estado están.'},
 {f:'trabaja', n:'Mantenimiento', i:'no', d:'Tickets, preventivos, programación semanal y lecturas.'},
 {f:'trabaja', n:'Bitácora e incidencias', i:'no', d:'Lo que pasa en el turno, con foto.'},
 {f:'trabaja', n:'PepeQuiz', i:'no', d:'Capacitación por puesto, con su banco de preguntas.'},
 {f:'trabaja', n:'Comidas del personal', i:'pos', d:'Qué consume cada quien del comedor.'},
 {f:'trabaja', n:'Pedidos y compras', i:'no', d:'Pedir material desde el piso.'},
 {f:'trabaja', n:'Reporte del día', i:'no', d:'El cierre de turno de cada área.'},
 {f:'trabaja', n:'Valoraciones y rankings', i:'no', d:'Cómo va cada quien y cada área.'},
 {f:'trabaja', n:'Mi nómina', i:'banco', d:'Su recibo y su dispersión.'},

 /* ---- dirección ---- */
 {f:'admin', n:'Revenue y pricing', i:'pms', d:'Tarifa por día, compset y ocupación.'},
 {f:'admin', n:'Cuadre diario', i:'pos', d:'Caja, terminal y depósito, contra el ticket.'},
 {f:'admin', n:'Finanzas y P&G', i:'banco', d:'Flujo, aging y el reporte del mes.'},
 {f:'admin', n:'Recursos humanos', i:'no', d:'Altas, expedientes, horarios y procedimientos.'},
 {f:'admin', n:'Ventas de experiencias', i:'pago', d:'Qué se vendió, de quién y cuánto deja.'},
 {f:'admin', n:'Eventos y espacios', i:'pago', d:'Validar lo que piden las productoras y apartar salas.'},
 {f:'admin', n:'Incidencias y control', i:'no', d:'Lo que se escaló y quién lo resolvió.'},
 {f:'admin', n:'Configurador de la app', i:'no', d:'Módulos, vistas, catálogo y marca.'},
 {f:'admin', n:'Accesos del equipo', i:'no', d:'Quién ve qué, por casa y por línea.'},
 {f:'admin', n:'Socios y gobierno', i:'no', d:'Reparto, asambleas, títulos. Capa aparte, a nombre.'}
];

/* ---------- lo que ya hay ---------- */
var ALTAS=[
 {n:'Grupo Casa Pepe', ds:'3 líneas · 3 casas · todos los módulos', est:'a', estt:'operando'},
 {n:'Barrio Hostel', ds:'CDMX · 21 cuartos · 29 intangibles curados', est:'b', estt:'configurando'},
 {n:'MX Hoteles', ds:'CDMX · cadena', est:'e', estt:'solicitada'},
 {n:'Hoteles Kali', ds:'5 hoteles · CDMX y Puebla', est:'e', estt:'propuesta'}
];

var PASO=1, S={tipo:'grupo', nombre:'', ciudad:'CDMX', on:{}, stripe:'grupo', copia:''};
MODS.forEach(function(m,i){ S.on[i]=false; });

function pintaLista(){
  $('lista').innerHTML=ALTAS.map(function(a){
    return '<div class="alta"><div><div class="nm">'+esc(a.n)+'</div><div class="ds">'+esc(a.ds)+'</div></div>'
      +'<span class="pz '+a.est+'">'+esc(a.estt)+'</span></div>';
  }).join('');
}

var PASOS=[
 ['1','Quién eres'],
 ['2','Qué módulos quieres'],
 ['3','Qué hay que conectar'],
 ['4','El contrato'],
 ['5','Tus casas']
];
function pintaPasos(){
  $('pasos').innerHTML=PASOS.map(function(p,i){
    var n=i+1, cls = n===PASO?'on':(n<PASO?'ya':'');
    return '<button class="ps '+cls+'" data-paso="'+n+'"><b>Paso '+p[0]+'</b><span>'+esc(p[1])+'</span></button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-paso]'),function(b){
    b.onclick=function(){ PASO=+b.getAttribute('data-paso'); pinta(); };
  });
}

function cuenta(){
  var n=0, nec={};
  MODS.forEach(function(m,i){ if(S.on[i]){ n++; if(m.i!=='no') nec[m.i]=true; } });
  return {n:n, nec:Object.keys(nec)};
}

function pinta(){
  pintaPasos();
  var c=cuenta(), h='';

  if(PASO===1){
    h='<h2>¿Quién eres?</h2><p class="ay">Un grupo con varias casas, o un hotel suelto. Se puede empezar suelto y crecer a grupo después.</p>'
     +'<div class="radios">'
     +'<label class="rd'+(S.tipo==='grupo'?' on':'')+'"><input type="radio" name="tp" value="grupo"'+(S.tipo==='grupo'?' checked':'')+'>'
       +'<span><span class="nm">Un grupo</span><span class="ds">Varias casas bajo la misma marca. El logo, los módulos y el catálogo se ponen una vez y bajan a todas.</span></span></label>'
     +'<label class="rd'+(S.tipo==='hotel'?' on':'')+'"><input type="radio" name="tp" value="hotel"'+(S.tipo==='hotel'?' checked':'')+'>'
       +'<span><span class="nm">Un hotel suelto</span><span class="ds">Una sola casa. Lo mismo, sin la capa de arriba.</span></span></label>'
     +'</div>'
     +'<div class="rej" style="margin-top:18px">'
       +'<div><label class="campo">Nombre</label><input type="text" id="fNom" value="'+esc(S.nombre)+'" placeholder="Hoteles Kali"></div>'
       +'<div><label class="campo">Ciudad principal</label><select id="fCd">'
         +['CDMX','Puebla','Otra'].map(function(x){return '<option'+(S.ciudad===x?' selected':'')+'>'+x+'</option>';}).join('')
       +'</select></div>'
     +'</div>'
     +'<div class="nota">Con esto ya existe como <b>solicitada</b>: puede configurar y ver su app en borrador. Para cobrar hará falta el paso 4.</div>';
  }

  if(PASO===2){
    h='<h2>¿Qué módulos quieres?</h2>'
     +'<p class="ay">Esto va <b>antes</b> de firmar: de lo que elijas salen las integraciones que hacen falta y el contrato que se firma. '
     +'Cada módulo dice si necesita conectarse con algo o no.</p>'
     + FAM.map(function(f){
        var ms=MODS.map(function(m,i){return {m:m,i:i};}).filter(function(x){return x.m.f===f.k;});
        var enc=ms.filter(function(x){return S.on[x.i];}).length;
        return '<div class="fam"><div class="famcab"><h3>'+esc(f.n)+'</h3>'
          +'<span class="tg">'+esc(f.tg)+' · '+enc+' de '+ms.length+'</span>'
          +'<button data-todo="'+f.k+'">'+(enc===ms.length?'quitar todos':'poner todos')+'</button></div>'
          +'<p class="famdice">'+esc(f.dice)+'</p><div class="mods">'
          + ms.map(function(x){
              var m=x.m, it=INT[m.i];
              return '<label class="m'+(S.on[x.i]?' on':'')+'"><input type="checkbox" data-m="'+x.i+'"'+(S.on[x.i]?' checked':'')+'>'
                +'<span><span class="nm">'+esc(m.n)+'</span>'
                +'<span class="ds">'+esc(m.d)+'</span>'
                +(m.sub?'<span class="sub">'+esc(m.sub)+'</span>':'')
                +'<span class="int '+it.c+'">'+esc(it.n)+'</span></span></label>';
            }).join('')
          +'</div></div>';
       }).join('')
     + resumen(c);
  }

  if(PASO===3){
    h='<h2>Qué hay que conectar</h2><p class="ay">Esto no lo eliges: sale de los módulos que pusiste. Lo que no aparece aquí, no hace falta.</p>';
    if(!c.n) h+='<div class="nota">Todavía no has elegido módulos. Vuelve al paso 2.</div>';
    else {
      h+='<div class="scroll"><table><tr><th>Hay que conectar</th><th>Para qué</th><th>Quién lo hace</th></tr>'
        + Object.keys(INT).filter(function(k){return k!=='no' && c.nec.indexOf(k)>=0;}).map(function(k){
            var usa=MODS.filter(function(m,i){return S.on[i] && m.i===k;}).map(function(m){return m.n;});
            return '<tr><td><b>'+esc(INT[k].q)+'</b></td><td>'+esc(usa.join(' · '))+'</td>'
              +'<td>'+(k==='pago'?'él, con una liga que le mandamos':'él, con su proveedor')+'</td></tr>';
          }).join('')
        +'</table></div>';
      var sinInt=MODS.filter(function(m,i){return S.on[i] && m.i==='no';}).length;
      h+='<div class="nota"><b>'+sinInt+' de los '+c.n+' módulos que elegiste no necesitan conectar nada.</b> '
        +'Esos funcionan el mismo día que firme. Los demás esperan a su proveedor, y mientras tanto quedan apagados solos — no rotos.</div>';
      if(c.nec.indexOf('pago')>=0){
        h+='<h2 style="margin-top:24px">¿Una cuenta de cobro o varias?</h2>'
         +'<p class="ay">La firma del convenio suele ser la misma sociedad que la cuenta de Stripe, así que lo normal es una sola.</p>'
         +'<div class="radios">'
         +'<label class="rd'+(S.stripe==='grupo'?' on':'')+'"><input type="radio" name="st" value="grupo"'+(S.stripe==='grupo'?' checked':'')+'>'
           +'<span><span class="nm">Una, del grupo</span><span class="ds">Todo lo que vendan las casas cae en la misma cuenta. Es lo habitual y lo que menos trámite da.</span></span></label>'
         +'<label class="rd'+(S.stripe==='casa'?' on':'')+'"><input type="radio" name="st" value="casa"'+(S.stripe==='casa'?' checked':'')+'>'
           +'<span><span class="nm">Una por casa</span><span class="ds">Para grupos donde cada propiedad es su propia sociedad, con su RFC y su banco.</span></span></label>'
         +'</div>';
      }
      h+=resumen(c);
    }
  }

  if(PASO===4){
    h='<h2>El contrato</h2><p class="ay">Se firma <b>después</b> de elegir, no antes: lo que firma es exactamente lo que escogió.</p>'
     +'<div class="scroll"><table>'
     +'<tr><th>Qué se firma</th><th>Cuándo</th><th>Qué cubre</th></tr>'
     +'<tr><td><b>Convenio general del grupo</b></td><td><span class="pz a">ahora</span></td>'
       +'<td>Los '+c.n+' módulos elegidos, la comisión, el uso de la marca y la cuenta de cobro.</td></tr>'
     +'<tr><td><b>Adendum por casa</b></td><td><span class="pz e">cuando den de alta cada hotel</span></td>'
       +'<td>Solo si esa casa tiene algo propio: su PMS, su sociedad o su cuenta de cobro.</td></tr>'
     +'</table></div>'
     +'<div class="nota">Firmado el convenio, el grupo pasa de <b>solicitada</b> a <b>verificada</b> y ya puede cobrar y aparecer en la red. '
      +'Hasta entonces podía configurar todo lo que quisiera, pero no cobrar.</div>'
     + resumen(c);
  }

  if(PASO===5){
    h='<h2>Tus casas</h2><p class="ay">Una app por casa, porque cada una tiene su PMS y su gente. Pero no se empieza de cero: se copia la anterior.</p>'
     +'<div class="scroll"><table>'
     +'<tr><th>Lo que se pone una vez, arriba</th><th>Lo que se repite en cada casa</th></tr>'
     +'<tr><td>El logo y la paleta<br>Los módulos encendidos<br>El catálogo base del buffet<br>El convenio y la cuenta de cobro</td>'
       +'<td>Su dirección y sus cuartos<br>Su PMS<br>Su equipo<br>Los lugares de <em>su</em> barrio</td></tr>'
     +'</table></div>'
     +'<div class="nota"><b>Y lo que hace que esto no canse:</b> al dar de alta la segunda casa, un botón que dice '
      +'«ponme lo mismo que [la primera]». Copia su plato del buffet entero y después se quita lo que no cuadre. '
      +'Igual que en el buffet de intangibles.</div>'
     +'<button class="mas" style="margin-top:16px">+ Añadir una casa</button>'
     + resumen(c);
  }

  $('paso').innerHTML=h;
  cablea();
}

function resumen(c){
  var faltan=c.nec.map(function(k){return INT[k].q;});
  return '<div class="res"><div class="l1">'
    +'<span class="n">'+c.n+'</span><span class="t">módulos elegidos</span>'
    +(PASO<5?'<button class="bt" id="bSig">Siguiente paso →</button>':'<button class="bt" id="bSig">Terminar</button>')
    +'</div>'
    +(faltan.length
      ? '<div class="conx"><span class="cx">hay que conectar:</span>'+faltan.map(function(q){return '<span class="cx si">'+esc(q)+'</span>';}).join('')+'</div>'
      : '<div class="conx"><span class="cx si">no hace falta conectar nada</span></div>')
    +'</div>';
}

function cablea(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-m]'),function(c){
    c.onchange=function(){ S.on[+c.getAttribute('data-m')]=c.checked; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-todo]'),function(b){
    b.onclick=function(){
      var f=b.getAttribute('data-todo');
      var ms=MODS.map(function(m,i){return {m:m,i:i};}).filter(function(x){return x.m.f===f;});
      var todos=ms.every(function(x){return S.on[x.i];});
      ms.forEach(function(x){ S.on[x.i]=!todos; });
      pinta();
    };
  });
  Array.prototype.forEach.call(document.getElementsByName('tp'),function(r){
    r.onchange=function(){ S.tipo=r.value; pinta(); };
  });
  Array.prototype.forEach.call(document.getElementsByName('st'),function(r){
    r.onchange=function(){ S.stripe=r.value; pinta(); };
  });
  if($('fNom')) $('fNom').oninput=function(){ S.nombre=$('fNom').value; };
  if($('fCd'))  $('fCd').onchange=function(){ S.ciudad=$('fCd').value; };
  if($('bSig')) $('bSig').onclick=function(){ if(PASO<5){ PASO++; pinta(); window.scrollTo({top:0,behavior:'smooth'}); } };
}

$('bMas').onclick=function(){
  $('vLista').classList.add('oculto');
  $('vAlta').classList.remove('oculto');
  pinta();
};
pintaLista();
</script>
</body>
</html>
