<!DOCTYPE html>
<html lang="es">
<head>
<script src="/m/cp-marco.js"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Socios · Grupo Casa Pepe</title>
<style>
  :root{ --bg2:#f7f6f1; --txt:#2c2c2a; --accent:#1d9e75; --bd:rgba(0,0,0,.10); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg2);color:var(--txt)}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd)}
  .bar a{color:var(--accent);text-decoration:none;font-size:13px}
  .bar a:hover{text-decoration:underline}
  .bar .t{font-weight:500;font-size:14px;color:var(--txt)}
  .bar .tabs{font-size:11px;color:#888780;letter-spacing:.3px}
  iframe{display:block;width:100%;height:calc(100vh - 46px);border:0;background:#fffaf2}
</style>
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
</head>
<body>
  <div class="bar">
    <a href="/">← Panel</a>
    <span class="t">Reporte de Socios</span>
    <span class="tabs">Lectura · Resumen · Ventas · Indicadores · Deuda · Satisfacción · Corporativo · Refundación</span>
    <a href="https://reportesocios.netlify.app" target="_blank" rel="noopener" style="margin-left:auto">Abrir en pestaña ↗</a>
  </div>
  <iframe src="https://reportesocios.netlify.app" title="Reporte de Socios Casa Pepe" loading="eager"></iframe>
<script>/* Bitacora de accesos: deja constancia de quien abre esta pantalla, cuanto se
   queda y si fue saltando de una a otra. Si no esta en la lista de corporativo
   (public.aud_corporativo), la base levanta un ticket de seguridad en
   Incidencias > Tickets, a la vista de direccion. */
(function(){try{
 var K='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO', T=null;
 try{var r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(r){var j=JSON.parse(r);
   T=j.access_token||(j.currentSession&&j.currentSession.access_token)||(j.session&&j.session.access_token)||null;}}catch(e){}
 if(!T)return;
 var S=null; try{ S=sessionStorage.getItem('cp-visita');
   if(!S){ S=Date.now().toString(36)+Math.random().toString(36).slice(2,8); sessionStorage.setItem('cp-visita',S); } }catch(e){}
 var AU='https://rehophywchakfapivsbh.supabase.co/rest/v1/rpc/';
 var HD={apikey:K,Authorization:'Bearer '+T,'Content-Type':'application/json'};
 var ID=null, visto=0, ult=Date.now();
 function tic(){ var n=Date.now(); if(document.visibilityState!=='hidden'){ visto+=Math.min(n-ult,60000); } ult=n; }
 function cierra(ka){ tic(); if(ID==null)return; try{ fetch(AU+'aud_cierra',{method:'POST',headers:HD,keepalive:!!ka,
   body:JSON.stringify({p_id:ID,p_segundos:Math.round(visto/1000)})}); }catch(e){} }
 fetch(AU+'aud_registra',{method:'POST',headers:HD,body:JSON.stringify(
   {p_area:'socios',p_objeto:'Socios · panel (m)',p_ticket:true,p_sesion:S})})
  .then(function(x){return x.ok?x.json():null;}).then(function(v){ID=v;}).catch(function(){});
 setInterval(function(){ cierra(false); },30000);
 document.addEventListener('visibilitychange',function(){ tic(); if(document.visibilityState==='hidden')cierra(true); });
 window.addEventListener('pagehide',function(){ cierra(true); });
}catch(e){}})();</script>
</body>
</html>
