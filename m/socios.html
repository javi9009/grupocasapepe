<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Socios · Grupo Casa Pepe</title>
<style>
  :root{ --bg2:#f7f6f1; --txt:#2c2c2a; --accent:#1d9e75; --bd:rgba(0,0,0,.10); }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg2);color:var(--txt)}
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:#fff;border-bottom:1px solid var(--bd)}
  .bar a{color:var(--accent);text-decoration:none;font-size:13px}
  .bar a:hover{text-decoration:underline}
  .bar .t{font-weight:500;font-size:14px;color:var(--txt)}
  .bar .tabs{font-size:11px;color:#888780;letter-spacing:.3px}
  iframe{display:block;width:100%;height:calc(100vh - 46px);border:0;background:#fffaf2}
</style>
</head>
<body>
  <div class="bar">
    <a href="/">← Panel</a>
    <span class="t">Reporte de Socios</span>
    <span class="tabs">Lectura · Resumen · Ventas · Indicadores · Deuda · Satisfacción · Corporativo · Refundación</span>
    <a href="https://reportesocios.netlify.app" target="_blank" rel="noopener" style="margin-left:auto">Abrir en pestaña ↗</a>
  </div>
  <iframe src="https://reportesocios.netlify.app" title="Reporte de Socios Casa Pepe" loading="eager"></iframe>
</body>
</html>
