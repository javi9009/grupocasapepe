<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Compras · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#fff;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.top{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:1080px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-weight:700;font-size:1.15rem}.brand small{display:block;font-weight:400;font-size:.7rem;color:var(--muted)}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
.btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:7px 13px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.btn:hover{filter:brightness(1.08)}.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:4px 9px;font-size:13px}.btn[disabled]{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pill{border:1px solid var(--rule);background:var(--surface);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--muted)}
.pill.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-top:14px;overflow:hidden}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:6px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
.kpi .n{font-size:1.5rem;font-weight:700}.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:700}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px}
.c-sol{background:var(--warn-bg);color:var(--warn)}.c-aut{background:var(--accent-soft);color:var(--accent)}
.c-com{background:var(--none-bg);color:var(--none)}.c-ent{background:var(--ok-bg);color:var(--ok)}.c-can{background:var(--bad-bg);color:var(--bad)}
.scroll{overflow-x:auto}.muted{color:var(--muted)}.lnk{color:var(--accent);cursor:pointer}
.row-actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px;font-weight:600}
input,select,textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface);color:var(--ink)}
.modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.4);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}.modal{background:var(--surface);border-radius:14px;max-width:460px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-grid .full{grid-column:1/-1}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;opacity:0;transition:.2s;z-index:60}.toast.on{opacity:1}
.center{text-align:center;color:var(--muted);padding:40px}
</style></head>
<body>
<div class="top"><div class="top-in">
  <div class="brand">🛒 Compras<small>Casa Pepe · Servicios</small></div>
  <div class="chips" id="propChips" style="margin-left:auto"></div>
  <button class="btn sm" onclick="nueva()">＋ Nueva</button>
</div></div>
<div class="wrap" id="view"><div class="center">Cargando…</div></div>
<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=s=>document.getElementById(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX");
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200);}
function modal(h){$("modal").innerHTML=h;$("modalBg").classList.add("on");}
function closeModal(){$("modalBg").classList.remove("on");}
$("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
const PROPN={"45e69775-d877-4507-a9e1-a45bd3400dc5":"CDMX","febfbef6-7fd1-4b45-84d9-13533e8dcb72":"Puebla","3e10a9ea-4913-4f7c-86ef-0c829caa851d":"Virreyes"};
const ESTA=[["solicitado","Por comprar","c-sol"],["autorizado","Autorizadas","c-aut"],["comprado","Compradas","c-com"],["entregado","Entregadas","c-ent"],["cancelado","Canceladas","c-can"]];
const estMeta=e=>ESTA.find(x=>x[0]===e)||["",""+e,""];
let ROWS=[], FPROP="", FEST="pend", USER=null;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $("view").innerHTML='<div class="center">Abre este módulo desde el panel con tu sesión iniciada.</div>'; return; }
  USER=session.user; load();
}
async function load(){
  const {data,error}=await sb.from("mtto_suministros")
    .select("*, tk:ticket_id(titulo, ubic:ubicacion_id(nombre))")
    .order("created_at",{ascending:false});
  if(error){ $("view").innerHTML='<div class="center">Error: '+esc(error.message)+'</div>'; return; }
  ROWS=data||[]; render();
}
function render(){
  const props=[...new Set(ROWS.map(r=>r.property_id))];
  $("propChips").innerHTML=(props.length>1?[["","Todas"]].concat(props.map(p=>[p,PROPN[p]||"?"])):[]).map(p=>`<span class="pill ${FPROP===p[0]?'on':''}" onclick="FPROP='${p[0]}';render()">${esc(p[1])}</span>`).join("");
  let rows=ROWS.slice();
  if(FPROP)rows=rows.filter(r=>r.property_id===FPROP);
  const cnt={}; ESTA.forEach(e=>cnt[e[0]]=0); rows.forEach(r=>{cnt[r.estatus]=(cnt[r.estatus]||0)+1;});
  const pend=rows.filter(r=>!["entregado","cancelado"].includes(r.estatus));
  const pendCosto=pend.reduce((s,r)=>s+(+r.costo||0),0);
  const view=FEST==="pend"?pend:(FEST==="todas"?rows:rows.filter(r=>r.estatus===FEST));
  const filtBar=[["pend","Pendientes ("+pend.length+")"]].concat(ESTA.map(e=>[e[0],estMeta(e[0])[1]+" ("+(cnt[e[0]]||0)+")"])).concat([["todas","Todas"]]);
  $("view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n" style="color:var(--warn)">${pend.length}</div><div class="l">compras pendientes</div></div>
      <div class="kpi"><div class="n">${money(pendCosto)}</div><div class="l">monto pendiente</div></div>
      <div class="kpi"><div class="n" style="color:var(--ok)">${cnt.entregado||0}</div><div class="l">entregadas</div></div>
    </div>
    <div class="chips" style="margin-top:14px">${filtBar.map(f=>`<span class="pill ${FEST===f[0]?'on':''}" onclick="FEST='${f[0]}';render()">${esc(f[1])}</span>`).join("")}</div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Solicitud</th><th>Sede · área</th><th>Solicitó</th><th class="num">Costo</th><th>Estatus</th><th></th></tr></thead>
      <tbody>${view.length?view.map(rowH).join(""):'<tr><td colspan="6" class="center">Sin compras con ese filtro</td></tr>'}</tbody>
    </table></div></div>`;
}
function rowH(r){
  const m=estMeta(r.estatus);
  const fecha=r.created_at?new Date(r.created_at).toLocaleDateString("es-MX",{day:"2-digit",month:"short"}):"";
  const area=r.tk&&r.tk.ubic?r.tk.ubic.nombre:"";
  return `<tr>
    <td><b>${esc(r.material||r.descripcion||"Compra")}</b>${r.link?` <a class="lnk" href="${esc(r.link)}" target="_blank">🔗</a>`:""}${r.tk?`<div class="muted" style="font-size:12px">para: ${esc(r.tk.titulo||"")}</div>`:""}</td>
    <td>${esc(PROPN[r.property_id]||"")}${area?` · ${esc(area)}`:""}<div class="muted" style="font-size:12px">${fecha}</div></td>
    <td>${esc(r.solicitado_por_nombre||"—")}</td>
    <td class="num">${r.costo?money(r.costo):"—"}</td>
    <td><span class="chip ${m[2]}">${esc(m[1])}</span></td>
    <td><div class="row-actions">${acciones(r)}</div></td></tr>`;
}
function acciones(r){
  const b=[];
  if(r.estatus==="solicitado")b.push(`<button class="btn sm" onclick="avanzar('${r.id}','autorizado')">Autorizar</button>`);
  if(r.estatus==="autorizado")b.push(`<button class="btn sm" onclick="avanzar('${r.id}','comprado')">Marcar comprada</button>`);
  if(r.estatus==="comprado")b.push(`<button class="btn sm" onclick="avanzar('${r.id}','entregado')">Entregada</button>`);
  b.push(`<button class="btn ghost sm" onclick="editar('${r.id}')">✎</button>`);
  b.push(`<button class="btn ghost sm" onclick="borrar('${r.id}')">✕</button>`);
  return b.join("");
}
async function avanzar(id,est){
  const patch={estatus:est}; if(est==="entregado")patch.entregado_at=new Date().toISOString();
  const {error}=await sb.from("mtto_suministros").update(patch).eq("id",id);
  if(error)return toast(error.message); toast("Actualizada"); load();
}
async function borrar(id){ if(!confirm("¿Borrar esta compra?"))return;
  const {error}=await sb.from("mtto_suministros").delete().eq("id",id);
  if(error)return toast(error.message); toast("Borrada"); load(); }
async function editar(id){
  const r=ROWS.find(x=>x.id===id); if(!r)return;
  modal(`<h3 style="margin:0 0 8px">Editar compra</h3>
    <label>Descripción / material</label><input id="eM" value="${esc(r.material||r.descripcion||"")}">
    <div class="form-grid"><div><label>Costo</label><input id="eC" type="number" step="0.01" value="${r.costo||""}"></div>
    <div><label>Estatus</label><select id="eE">${ESTA.map(e=>`<option value="${e[0]}" ${r.estatus===e[0]?"selected":""}>${e[1]}</option>`).join("")}</select></div></div>
    <label>Link (opcional)</label><input id="eL" value="${esc(r.link||"")}">
    <div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveEdit('${id}')">Guardar</button></div>`);
}
async function saveEdit(id){
  const est=$("eE").value; const patch={material:$("eM").value.trim()||null,descripcion:$("eM").value.trim()||null,costo:parseFloat($("eC").value)||null,estatus:est,link:$("eL").value.trim()||null};
  if(est==="entregado")patch.entregado_at=new Date().toISOString();
  const {error}=await sb.from("mtto_suministros").update(patch).eq("id",id);
  if(error)return toast(error.message); closeModal(); toast("Guardada"); load();
}
async function nueva(){
  const props=[...new Set(ROWS.map(r=>r.property_id))]; const defProp=FPROP||props[0]||"45e69775-d877-4507-a9e1-a45bd3400dc5";
  modal(`<h3 style="margin:0 0 8px">Nueva compra</h3>
    <label>¿Qué se compra?</label><input id="nM" placeholder="Material o insumo">
    <div class="form-grid"><div><label>Sede</label><select id="nP">${Object.keys(PROPN).map(p=>`<option value="${p}" ${p===defProp?"selected":""}>${PROPN[p]}</option>`).join("")}</select></div>
    <div><label>Costo estimado</label><input id="nC" type="number" step="0.01"></div></div>
    <label>Link (opcional)</label><input id="nL" placeholder="https://…">
    <div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveNueva()">Crear solicitud</button></div>`);
}
async function saveNueva(){
  const mat=$("nM").value.trim(); if(!mat)return toast("Escribe qué se compra");
  const rec={property_id:$("nP").value,material:mat,descripcion:mat,costo:parseFloat($("nC").value)||null,link:$("nL").value.trim()||null,
    estatus:"solicitado",semana:new Date().toISOString().slice(0,10),solicitado_por:USER.id,solicitado_por_nombre:USER.email,subido_por:USER.id,subido_por_nombre:USER.email};
  const {error}=await sb.from("mtto_suministros").insert(rec);
  if(error)return toast(error.message); closeModal(); toast("Solicitud creada"); load();
}
boot();
</script>
</body></html>
