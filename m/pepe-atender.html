<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pepe Atender · Soy Pepe</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F1EA">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>

:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --none:#66707A; --none-bg:#E9E4DA;
  --sans:"Helvetica Neue",Helvetica,Arial,system-ui,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;margin:0}
.wrap{max-width:830px;margin:0 auto;padding:0 16px 100px}

.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{max-width:830px;margin:0 auto;padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-family:var(--serif);font-weight:600;font-size:1.5rem;margin:0;letter-spacing:-.01em}
.stamp{font-size:.7rem;text-transform:uppercase;letter-spacing:.09em;color:var(--faint);margin-top:2px}
.top-actions{margin-left:auto;display:flex;gap:8px}

/* submenu sticky arriba — estandar casapepe-ui */
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:830px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.btn{font:inherit;font-weight:600;font-size:.9rem;border-radius:6px;cursor:pointer;padding:9px 15px;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);display:inline-flex;align-items:center;gap:7px}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule-2)}
.btn.ghost:hover{background:var(--accent-soft);filter:none}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.live{background:var(--bad);border-color:var(--bad);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.btn.live .dot{animation:pulse 1.1s infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.btn.live .dot{animation:none}}

.grupo{margin-top:24px}
.grupo-h{margin-bottom:9px}
.grupo-h h2{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;margin:0;font-weight:700;color:var(--ink-2)}
.grupo-h .regla{font-size:.78rem;color:var(--muted);font-family:var(--serif);margin-top:2px}
.grupo-h .n{font-size:.72rem;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:7px;font-weight:400}

.item{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:13px 15px 13px 18px;
  position:relative;overflow:hidden;display:flex;gap:13px;align-items:flex-start}
.item + .item{margin-top:7px}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--rule-2)}
.item[data-urg="hoy"]::before{background:var(--bad)}
.item[data-urg="crit"]::before{background:var(--warn)}
.item[data-urg="sem"]::before{background:var(--rule-2)}
.item.hecho{opacity:.42}
.item.hecho .qué{text-decoration:line-through}
.item-body{flex:1;min-width:0}
.qué{font-weight:600;margin:0 0 3px;font-size:.97rem}
.quién{font-family:var(--serif);font-size:.94rem;color:var(--ink-2);margin:0}
.cuándo{font-size:.75rem;color:var(--muted);margin-top:7px;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pill{font-size:.66rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;
  border-radius:999px;padding:2px 8px;border:1px solid}
.pill.hoy{color:var(--bad);background:var(--bad-bg);border-color:var(--bad)}
.pill.crit{color:var(--warn);background:var(--warn-bg);border-color:var(--warn)}
.pill.sem{color:var(--none);background:var(--none-bg);border-color:var(--rule-2)}

.check{flex:none;width:20px;height:20px;border:1.5px solid var(--rule-2);border-radius:4px;background:var(--surface-3);
  cursor:pointer;margin-top:2px;padding:0;color:var(--accent);font-size:13px;line-height:1;font-weight:700}
.check[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.check:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.mas-btn{border:1px solid var(--rule-2);background:var(--surface-3);color:var(--accent);font:inherit;
  font-size:.72rem;font-weight:600;border-radius:999px;padding:2px 10px;cursor:pointer;line-height:1.6}
.mas-btn:hover{background:var(--accent-soft)}
.mas-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mas{margin-top:11px;padding-top:11px;border-top:1px dashed var(--rule-2)}
.mas[hidden]{display:none}
.mas dl{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;margin:0 0 9px;font-size:.83rem}
.mas dt{color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-size:.66rem;padding-top:3px;white-space:nowrap}
.mas dd{margin:0;color:var(--ink-2);word-break:break-word}
.mas .detalle{font-family:var(--serif);font-size:.92rem;color:var(--ink-2);margin:0 0 10px}
.abrir{display:inline-flex;align-items:center;gap:5px;font-size:.8rem;font-weight:600;color:var(--accent);
  text-decoration:none;border-bottom:1px solid var(--accent-soft);padding-bottom:1px}
.abrir:hover{border-bottom-color:var(--accent)}
.abrir:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* paloma mensajera — borrador listo para autorizar */
.paloma-btn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent);font:inherit;
  font-size:.72rem;font-weight:700;border-radius:999px;padding:2px 11px 2px 8px;cursor:pointer;line-height:1.6;
  display:inline-flex;align-items:center;gap:5px}
.paloma-btn:hover{background:var(--accent);color:var(--on-accent)}
.paloma-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.paloma-btn .ave{font-size:.9rem;line-height:1}
.carta{margin-top:11px;border:1px solid var(--accent);border-radius:8px;overflow:hidden;background:var(--surface-3)}
.carta[hidden]{display:none}
.carta-h{background:var(--accent-soft);padding:8px 13px;border-bottom:1px solid var(--rule-2);
  font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent);
  display:flex;align-items:center;gap:7px}
.carta-campos{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;padding:11px 13px 0;font-size:.8rem}
.carta-campos dt{color:var(--faint);text-transform:uppercase;letter-spacing:.07em;font-size:.64rem;padding-top:3px;white-space:nowrap}
.carta-campos dd{margin:0;color:var(--ink-2);word-break:break-word}
.carta-cuerpo{font-family:var(--serif);font-size:.93rem;line-height:1.62;color:var(--ink);
  white-space:pre-wrap;padding:11px 13px;margin:0}
.carta-pie{padding:0 13px 12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.carta-nota{font-size:.74rem;color:var(--warn);background:var(--warn-bg);border:1px solid var(--rule-2);
  border-radius:6px;padding:7px 11px;margin:0 13px 11px}
.mini{font:inherit;font-size:.76rem;font-weight:600;border-radius:6px;padding:6px 12px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
.mini.ghost{background:transparent;color:var(--accent);border-color:var(--rule-2)}
.mini:hover{filter:brightness(1.08)}
.mini.ghost:hover{background:var(--accent-soft);filter:none}
.mini:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.procesado{margin-top:26px;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:13px 16px}
.procesado h3{margin:0 0 7px;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.procesado p{margin:0;font-family:var(--serif);font-size:.9rem;color:var(--ink-2)}

.dictado{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--rule-2);box-shadow:0 -8px 24px -18px rgba(31,27,22,.5)}
.dictado-in{max-width:830px;margin:0 auto;padding:13px 16px;display:flex;gap:11px;align-items:flex-start}
.dictado[hidden]{display:none}
#texto{flex:1;min-height:64px;max-height:180px;overflow-y:auto;font:inherit;font-size:.93rem;
  border:1px solid var(--rule);border-radius:6px;padding:9px 11px;background:var(--surface-3);color:var(--ink);resize:vertical;width:100%}
#texto:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dictado-cols{display:flex;flex-direction:column;gap:7px}
.aviso{font-size:.76rem;color:var(--muted);padding:9px 12px;background:var(--warn-bg);border:1px solid var(--rule-2);
  border-radius:6px;margin-top:14px}
.aviso[hidden]{display:none}
.pie{margin-top:26px;padding-top:14px;border-top:1px solid var(--rule);font-size:.78rem;color:var(--faint)}
@media(max-width:620px){
  .top-actions{margin-left:0;width:100%}
  .top-actions .btn{flex:1;justify-content:center}
  .dictado-in{flex-direction:column}
  .dictado-cols{flex-direction:row}
  .mas dl{grid-template-columns:1fr}
  .mas dt{padding-top:6px}
}

/* --- estados propios del modulo conectado --- */
.aviso-carga{padding:26px 16px;text-align:center;color:var(--muted);font-family:var(--serif);font-size:.95rem}
.vacio{background:var(--surface);border:1px solid var(--rule);border-radius:8px;padding:22px 18px;
  text-align:center;color:var(--muted);font-family:var(--serif);margin-top:22px}
.err{background:var(--bad-bg);border:1px solid var(--bad);color:var(--bad);border-radius:8px;
  padding:13px 15px;margin-top:22px;font-size:.9rem}
.err a{color:var(--bad);font-weight:600}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div>
      <h1>&#128330; Pepe Atender</h1>
      <div class="stamp" id="sello">Cargando&hellip;</div>
    </div>
    <div class="top-actions">
      <button class="btn" id="btnLeer"><span id="leerTxt">Escuchar</span></button>
      <button class="btn ghost" id="btnDictar"><span class="dot"></span><span id="dictarTxt">Dictar</span></button>
    </div>
  </div>
</header>

<nav class="secnav">
  <div class="secnav-in" role="tablist">
    <button role="tab" id="tabTipo" aria-selected="true">Por tipolog&iacute;a</button>
    <button role="tab" id="tabUrg" aria-selected="false">Por urgencia</button>
  </div>
</nav>

<main class="wrap">
  <div class="aviso" id="avisoVoz" hidden></div>
  <div class="aviso-carga" id="cargando">Leyendo tu bandeja&hellip;</div>
  <div id="lista"></div>
  <div class="procesado" id="resumen" hidden></div>
  <p class="pie" id="pie" hidden>Marca con la casilla lo que ya resolviste &mdash; se guarda en tu cuenta.</p>
</main>

<div class="dictado" id="panelDictado" hidden>
  <div class="dictado-in">
    <textarea id="texto" placeholder="Dicta o escribe tus instrucciones&hellip;" aria-label="Instrucciones"></textarea>
    <div class="dictado-cols">
      <button class="btn" id="btnCopiar">Copiar</button>
      <button class="btn ghost" id="btnLimpiar">Limpiar</button>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY);

/* Las categorias son las reglas de triaje que definio Javi. El orden manda. */
const TIPOS = [
  {id:"legal",        t:"Suspensi\u00f3n de servicio o tema legal", r:"Te lo reporto y lo dejo le\u00eddo"},
  {id:"reunion",      t:"Convocar reuniones",                   r:"Marcar le\u00eddo y notificar"},
  {id:"archivos",     t:"Compartir archivos",                   r:"Marcar le\u00eddo y notificar"},
  {id:"documentacion",t:"Env\u00edo de documentaci\u00f3n",        r:"Marcar le\u00eddo y notificar"},
  {id:"copia4",       t:"M\u00e1s de 4 personas en copia",         r:"Marcar le\u00eddo y notificar"},
  {id:"gobierno",     t:"Gobierno, ligado a tus empresas",      r:"Marcar le\u00eddo y notificar"},
  {id:"responder",    t:"Preparar respuesta para que autorices",r:"No se env\u00eda nada sin tu visto bueno"},
  {id:"sinregla",     t:"Sin regla asignada \u2014 decide t\u00fa", r:"Por tus reglas ser\u00edan basura, pero son avisos de tus propios servicios. Falta que me digas d\u00f3nde van."}
];
const URGS = [
  {id:"hoy",  t:"Corre hoy",   r:"Vence hoy o ma\u00f1ana"},
  {id:"crit", t:"Cr\u00edtico", r:"D\u00edas, no semanas"},
  {id:"sem",  t:"Esta semana",  r:"Sin fecha dura"}
];
const URG_ETIQ = {hoy:"Hoy", crit:"Cr\u00edtico", sem:"Esta semana"};
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS  = ["domingo","lunes","martes","mi\u00e9rcoles","jueves","viernes","s\u00e1bado"];

let ASUNTOS = [], CORTE = null, vista = "tipo";
const $ = id => document.getElementById(id);
const lista = $("lista");

/* ---------- carga ---------- */
async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ falla("Abre esta pantalla desde Soy Pepe, ya con tu sesi\u00f3n iniciada."); return; }

  const {data:cortes, error:e1} = await sb.from('pepe_atender_corte')
    .select('*').order('corte',{ascending:false}).limit(1);
  if(e1){ falla("No pude leer el corte: " + e1.message); return; }
  CORTE = (cortes && cortes[0]) || null;

  let q = sb.from('pepe_atender').select('*').order('id');
  if(CORTE) q = q.eq('corte', CORTE.corte);
  const {data:filas, error:e2} = await q;
  if(e2){ falla("No pude leer tus asuntos: " + e2.message); return; }

  ASUNTOS = (filas||[]).map(f => ({
    id:f.id, tipo:f.tipo, urg:f.urg, qu\u00e9:f.titulo, qui\u00e9n:f.quien,
    cu\u00e1ndo:f.cuando, de:f.remitente, asunto:f.asunto, tid:f.thread_id,
    detalle:f.detalle, borrador:f.borrador, hecho:!!f.hecho
  }));

  $("cargando").hidden = true;
  $("sello").textContent = CORTE ? ("Corte " + fechaLarga(CORTE.corte)) : "Sin corte todav\u00eda";
  pintaResumen();
  $("pie").hidden = false;
  pinta();
}

function fechaLarga(iso){
  const [a,m,d] = String(iso).split("-").map(Number);
  const f = new Date(Date.UTC(a, m-1, d));
  return DIAS[f.getUTCDay()] + " " + d + " de " + MESES[m-1] + ", " + a;
}

function falla(msg){
  $("cargando").hidden = true;
  const e = document.createElement("div");
  e.className = "err";
  e.textContent = msg;
  lista.appendChild(e);
}

function pintaResumen(){
  if(!CORTE || (!CORTE.nota_cerrado && !CORTE.nota_filtro)) return;
  const box = $("resumen");
  box.hidden = false;
  if(CORTE.nota_cerrado){
    const h = document.createElement("h3"); h.textContent = "Lo que ya cerr\u00f3";
    const p = document.createElement("p"); p.textContent = CORTE.nota_cerrado;
    box.append(h, p);
  }
  if(CORTE.nota_filtro){
    const h = document.createElement("h3");
    h.style.marginTop = CORTE.nota_cerrado ? "12px" : "0";
    h.textContent = "Lo que filtr\u00e9";
    const p = document.createElement("p"); p.textContent = CORTE.nota_filtro;
    box.append(h, p);
  }
}

/* ---------- pintado ---------- */
function pinta(){
  lista.textContent = "";
  const grupos = vista === "tipo" ? TIPOS : URGS;
  const campo  = vista === "tipo" ? "tipo" : "urg";
  let total = 0;
  grupos.forEach(g => {
    const items = ASUNTOS.filter(a => a[campo] === g.id);
    if(!items.length) return;
    total += items.length;
    const sec = document.createElement("section");
    sec.className = "grupo";
    const h = document.createElement("div");
    h.className = "grupo-h";
    const h2 = document.createElement("h2"); h2.textContent = g.t;
    const n  = document.createElement("span"); n.className = "n"; n.textContent = items.length;
    h2.appendChild(n);
    const regla = document.createElement("div"); regla.className = "regla"; regla.textContent = g.r;
    h.append(h2, regla);
    sec.appendChild(h);
    items.forEach(a => sec.appendChild(tarjeta(a)));
    lista.appendChild(sec);
  });
  if(!total){
    const v = document.createElement("div");
    v.className = "vacio";
    v.textContent = "No hay nada esperando. Tu bandeja est\u00e1 al corriente.";
    lista.appendChild(v);
  }
}

function tarjeta(a){
  const el = document.createElement("article");
  el.className = "item" + (a.hecho ? " hecho" : "");
  el.dataset.urg = a.urg;

  const chk = document.createElement("button");
  chk.className = "check";
  chk.setAttribute("aria-pressed", a.hecho ? "true" : "false");
  chk.setAttribute("aria-label", "Marcar como resuelto: " + a["qu\u00e9"]);
  chk.textContent = a.hecho ? "\u2713" : "";
  chk.onclick = async () => {
    a.hecho = !a.hecho;
    el.classList.toggle("hecho", a.hecho);
    chk.setAttribute("aria-pressed", a.hecho ? "true" : "false");
    chk.textContent = a.hecho ? "\u2713" : "";
    const {error} = await sb.from('pepe_atender').update({hecho:a.hecho}).eq('id', a.id);
    if(error){
      a.hecho = !a.hecho;
      el.classList.toggle("hecho", a.hecho);
      chk.setAttribute("aria-pressed", a.hecho ? "true" : "false");
      chk.textContent = a.hecho ? "\u2713" : "";
      aviso("No se pudo guardar la marca. Vuelve a intentar.");
    }
  };

  const body = document.createElement("div");
  body.className = "item-body";
  const p1 = document.createElement("p"); p1.className = "qu\u00e9";   p1.textContent = a["qu\u00e9"];
  const p2 = document.createElement("p"); p2.className = "qui\u00e9n"; p2.textContent = a["qui\u00e9n"] || "";

  const meta = document.createElement("div");
  meta.className = "cu\u00e1ndo";
  if(vista === "tipo"){
    const pill = document.createElement("span");
    pill.className = "pill " + a.urg;
    pill.textContent = URG_ETIQ[a.urg];
    meta.appendChild(pill);
  }
  const fecha = document.createElement("span");
  fecha.textContent = a["cu\u00e1ndo"] || "";
  meta.appendChild(fecha);

  /* + info */
  const mas = document.createElement("div");
  mas.className = "mas"; mas.hidden = true;
  const dl = document.createElement("dl");
  [["De", a.de], ["Asunto", a.asunto]].forEach(([k,v]) => {
    if(!v) return;
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = v;
    dl.append(dt, dd);
  });
  const det = document.createElement("p"); det.className = "detalle"; det.textContent = a.detalle || "";
  mas.append(dl, det);
  if(a.tid){
    const link = document.createElement("a");
    link.className = "abrir";
    link.href = "https://mail.google.com/mail/u/0/#all/" + a.tid;
    link.target = "_blank"; link.rel = "noopener";
    link.textContent = "Abrir en Gmail \u2197";
    mas.appendChild(link);
  }
  const btnMas = document.createElement("button");
  btnMas.className = "mas-btn"; btnMas.type = "button";
  btnMas.setAttribute("aria-expanded", "false");
  btnMas.textContent = "+ info";
  btnMas.onclick = () => {
    const abierto = !mas.hidden;
    mas.hidden = abierto;
    btnMas.setAttribute("aria-expanded", abierto ? "false" : "true");
    btnMas.textContent = abierto ? "+ info" : "\u2212 info";
  };
  meta.appendChild(btnMas);

  body.append(p1, p2, meta, mas);

  /* paloma mensajera: el borrador listo para que lo autorices */
  if(a.borrador && a.borrador.texto){
    const b = a.borrador;
    const carta = document.createElement("div");
    carta.className = "carta"; carta.hidden = true;

    const ch = document.createElement("div");
    ch.className = "carta-h";
    ch.innerHTML = '<span aria-hidden="true">\ud83d\udd4a\ufe0f</span>';
    ch.appendChild(document.createTextNode("Borrador preparado \u2014 no se ha enviado"));

    const campos = document.createElement("dl");
    campos.className = "carta-campos";
    [["Para", b.para], ["Copia", b.copia], ["Asunto", b.asunto]].forEach(([k,v]) => {
      if(!v) return;
      const dt = document.createElement("dt"); dt.textContent = k;
      const dd = document.createElement("dd"); dd.textContent = v;
      campos.append(dt, dd);
    });
    const cuerpo = document.createElement("p");
    cuerpo.className = "carta-cuerpo"; cuerpo.textContent = b.texto;
    carta.append(ch, campos, cuerpo);

    if(b.falta){
      const nota = document.createElement("p");
      nota.className = "carta-nota"; nota.textContent = b.falta;
      carta.appendChild(nota);
    }

    const pie = document.createElement("div");
    pie.className = "carta-pie";
    const copiar = document.createElement("button");
    copiar.type = "button"; copiar.className = "mini ghost"; copiar.textContent = "Copiar texto";
    copiar.onclick = async () => {
      try{ await navigator.clipboard.writeText(b.texto); copiar.textContent = "Copiado"; }
      catch(e){ copiar.textContent = "No se pudo copiar"; }
      setTimeout(() => { copiar.textContent = "Copiar texto"; }, 1800);
    };
    const revisar = document.createElement("a");
    revisar.className = "mini";
    revisar.href = "https://mail.google.com/mail/u/0/#drafts";
    revisar.target = "_blank"; revisar.rel = "noopener";
    revisar.textContent = "Revisar y enviar en Gmail \u2197";
    pie.append(copiar, revisar);
    carta.appendChild(pie);

    const btnPaloma = document.createElement("button");
    btnPaloma.className = "paloma-btn"; btnPaloma.type = "button";
    btnPaloma.setAttribute("aria-expanded", "false");
    btnPaloma.setAttribute("aria-label", "Ver el borrador de respuesta: " + a["qu\u00e9"]);
    btnPaloma.innerHTML = '<span class="ave" aria-hidden="true">\ud83d\udd4a\ufe0f</span>';
    const et = document.createElement("span");
    et.textContent = "Ver borrador";
    btnPaloma.appendChild(et);
    btnPaloma.onclick = () => {
      const abierto = !carta.hidden;
      carta.hidden = abierto;
      btnPaloma.setAttribute("aria-expanded", abierto ? "false" : "true");
      et.textContent = abierto ? "Ver borrador" : "Ocultar borrador";
    };
    meta.appendChild(btnPaloma);
    body.appendChild(carta);
  }

  el.append(chk, body);
  return el;
}

const tabTipo = $("tabTipo"), tabUrg = $("tabUrg");
function cambia(v){
  vista = v;
  tabTipo.setAttribute("aria-selected", v === "tipo" ? "true" : "false");
  tabUrg.setAttribute("aria-selected",  v === "urg"  ? "true" : "false");
  pinta();
}
tabTipo.onclick = () => cambia("tipo");
tabUrg.onclick  = () => cambia("urg");

function aviso(t){ const a = $("avisoVoz"); a.hidden = false; a.textContent = t; }

/* ---------- Escuchar ---------- */
const btnLeer = $("btnLeer"), leerTxt = $("leerTxt");
const tieneVoz = "speechSynthesis" in window;
let leyendo = false;

function vozEs(){
  const vs = speechSynthesis.getVoices() || [];
  return vs.find(v => /es[-_]MX/i.test(v.lang)) || vs.find(v => /^es/i.test(v.lang)) || null;
}
function frases(){
  const cab = CORTE ? ("Pepe Atender. Corte del " + fechaLarga(CORTE.corte) + ".") : "Pepe Atender.";
  const out = [cab];
  const grupos = vista === "tipo" ? TIPOS : URGS;
  const campo  = vista === "tipo" ? "tipo" : "urg";
  grupos.forEach(g => {
    const items = ASUNTOS.filter(a => a[campo] === g.id && !a.hecho);
    if(!items.length) return;
    out.push(g.t + ". " + items.length + (items.length === 1 ? " asunto." : " asuntos."));
    items.forEach(a => out.push(a["qu\u00e9"] + ". " + (a["qui\u00e9n"]||"") + " " + (a["cu\u00e1ndo"]||"") + "."
      + (a.borrador && a.borrador.texto ? " Ya tengo el borrador de respuesta listo, sin enviar." : "")));
  });
  if(out.length === 1) out.push("No queda nada pendiente. Todo est\u00e1 marcado como resuelto.");
  return out;
}
function paraLectura(){
  speechSynthesis.cancel();
  leyendo = false;
  leerTxt.textContent = "Escuchar";
  btnLeer.classList.remove("live");
}
btnLeer.onclick = () => {
  if(!tieneVoz){ aviso("Este navegador no puede leer en voz alta. Abre la p\u00e1gina en Chrome o Safari."); return; }
  if(leyendo){ paraLectura(); return; }
  const partes = frases(), v = vozEs();
  leyendo = true;
  leerTxt.textContent = "Detener";
  btnLeer.classList.add("live");
  partes.forEach((t, n) => {
    const u = new SpeechSynthesisUtterance(t);
    u.lang = "es-MX";
    if(v) u.voice = v;
    u.rate = 1.02;
    if(n === partes.length - 1) u.onend = paraLectura;
    speechSynthesis.speak(u);
  });
};
if(tieneVoz) speechSynthesis.onvoiceschanged = () => {};

/* ---------- Dictar ---------- */
const RC = window.SpeechRecognition || window.webkitSpeechRecognition;
const btnDictar = $("btnDictar"), dictarTxt = $("dictarTxt");
const panel = $("panelDictado"), texto = $("texto");
let rec = null, grabando = false, base = "";

const LSD = "pepeAtender.dictado.v1";
try{ texto.value = localStorage.getItem(LSD) || ""; }catch(e){}
if(texto.value.trim()) panel.hidden = false;
texto.addEventListener("input", () => { try{ localStorage.setItem(LSD, texto.value); }catch(e){} });

function paraDictado(){
  grabando = false;
  dictarTxt.textContent = "Dictar";
  btnDictar.classList.remove("live");
  btnDictar.classList.add("ghost");
  try{ localStorage.setItem(LSD, texto.value); }catch(e){}
}
btnDictar.onclick = () => {
  if(!RC){
    panel.hidden = false;
    aviso("Este navegador no reconoce voz. Puedes escribir tus instrucciones abajo; el dictado funciona en Chrome de escritorio y Android.");
    texto.focus();
    return;
  }
  if(grabando){ try{ rec.stop(); }catch(e){} paraDictado(); return; }
  panel.hidden = false;
  base = texto.value ? texto.value.replace(/\s+$/, "") + "\n" : "";
  rec = new RC();
  rec.lang = "es-MX"; rec.continuous = true; rec.interimResults = true;
  rec.onresult = e => {
    let fin = "", prov = "";
    for(let i = e.resultIndex; i < e.results.length; i++){
      const t = e.results[i][0].transcript;
      if(e.results[i].isFinal) fin += t + " "; else prov += t;
    }
    if(fin) base += fin;
    texto.value = base + prov;
    texto.scrollTop = texto.scrollHeight;
  };
  rec.onerror = ev => {
    paraDictado();
    aviso(ev.error === "not-allowed"
      ? "El navegador bloque\u00f3 el micr\u00f3fono. Dale permiso y vuelve a intentar."
      : "Se cort\u00f3 el dictado. Vuelve a presionar Dictar para seguir.");
  };
  rec.onend = () => { if(grabando) paraDictado(); };
  try{
    rec.start(); grabando = true;
    dictarTxt.textContent = "Detener";
    btnDictar.classList.remove("ghost");
    btnDictar.classList.add("live");
    $("avisoVoz").hidden = true;
  }catch(e){ paraDictado(); }
};

$("btnCopiar").onclick = async () => {
  const b = $("btnCopiar");
  try{ await navigator.clipboard.writeText(texto.value); b.textContent = "Copiado"; }
  catch(e){ texto.select(); b.textContent = "Copia con Ctrl+C"; }
  setTimeout(() => { b.textContent = "Copiar"; }, 1800);
};
$("btnLimpiar").onclick = () => {
  texto.value = ""; base = "";
  try{ localStorage.removeItem(LSD); }catch(e){}
  texto.focus();
};

init();
</script>
