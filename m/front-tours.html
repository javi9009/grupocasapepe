<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tours de mis huéspedes</title>
<link rel="stylesheet" href="/cp-movil.css">
<style>
/* LOS TOURS DE MI CASA, SIN ENTRAR A SINCRÉTICO.
   Javi, 11-nov-2026, trayendo la petición de Ale: «en la programación del
   hotel (en este caso Casa Pepe Puebla) pero aplicando a todos, pongas un
   botón que diga mis tours, todos los tours de mis clientes. Así puede ver
   las salidas de los huéspedes. Y poner las funciones que se requieran al
   abrir la ficha del cliente (info, cancelar, solicitar devolución, cambio
   de día etc)». Y al preguntarle dónde: «En Mi Hotel, no tiene por qué verlo
   en Sincrético».
   Ahí está la razón de que esta pantalla exista en vez de ser un atajo a la
   de Salidas: quien está en recepción no tiene por qué aprenderse el módulo
   de la touroperadora para saber a qué hora sale su huésped de mañana. Lo
   que pregunta es de su casa, así que vive en su casa.
   «Todo lo que vendió su casa», dijo Javi: no sólo los que duermen aquí,
   también lo que vendieron sus concierges a gente de fuera.
   Las acciones no son nuevas: son las mismas funciones que ya usa Sincrético
   —marcar, mover, reembolsar—. Lo que cambia es quién puede llegar a ellas. */
:root{ --crema:#F4F1EA; --tinta:#2C2620; --linea:#E2DCD1; --naranja:#C04E2B;
       --gris:#6E655C; --ok:#1E7A4B; --ok-bg:#E4F0E9; --warn:#A8690C;
       --warn-bg:#FBF0DC; --bad:#B3261E; --bad-bg:#FBE6E4; }
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);
  font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{background:#fff;border-bottom:1px solid var(--linea);padding:14px 18px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.01em}
.top .sp{flex:1}
select,input{padding:8px 11px;border:1px solid var(--linea);border-radius:9px;
  font:inherit;background:#fff;color:inherit;max-width:100%}
.wrap{padding:16px 18px 40px;max-width:1180px;margin:0 auto}
.secnav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.secnav button{border:1px solid var(--linea);background:#fff;color:var(--gris);
  border-radius:999px;padding:7px 15px;font:inherit;font-weight:600;cursor:pointer}
.secnav button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--linea);border-radius:13px;padding:13px 15px}
.kpi b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.kpi span{font-size:10.5px;color:var(--gris);text-transform:uppercase;letter-spacing:.06em}
.card{background:#fff;border:1px solid var(--linea);border-radius:13px;overflow:hidden}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:720px}
th{background:var(--crema);text-align:left;padding:10px 12px;font-size:10.5px;
  text-transform:uppercase;letter-spacing:.06em;color:var(--gris);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--linea);vertical-align:top}
tr.clic{cursor:pointer}
tr.clic:hover td{background:#FBF9F5}
.mini{font-size:11.5px;color:var(--gris)}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:10.5px;font-weight:700;border-radius:999px;
  padding:3px 9px;letter-spacing:.03em;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)}
.p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)}
.p-gris{background:#EFEAE2;color:var(--gris)}
.empty{padding:34px 16px;text-align:center;color:var(--gris)}
/* la ficha */
.velo{position:fixed;inset:0;background:rgba(44,38,32,.45);display:none;z-index:40}
.velo.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:#fff;
  z-index:41;transform:translateX(100%);transition:transform .18s ease;
  display:flex;flex-direction:column}
.panel.on{transform:none}
.ph{padding:15px 18px;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px}
.ph h2{margin:0;font-size:15px;flex:1}
.px{border:0;background:transparent;font-size:22px;cursor:pointer;color:var(--gris);line-height:1}
.pb{padding:16px 18px;overflow:auto;flex:1}
.sec{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris);
  margin:18px 0 7px;font-weight:700}
.fila{display:flex;gap:12px;padding:6px 0;border-bottom:1px solid #F2EEE7;font-size:13px}
.fila b{min-width:118px;color:var(--gris);font-weight:600}
.fila span{flex:1}
.btn{border:1px solid var(--linea);background:#fff;color:var(--tinta);border-radius:9px;
  padding:9px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--naranja)}
.btn.grave{color:var(--bad);border-color:#EBD2CF}
.btn[disabled]{opacity:.5;cursor:default}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.nota{background:var(--warn-bg);border:1px solid #EEDFC0;border-radius:10px;
  padding:10px 12px;font-size:12.5px;margin-top:12px}
</style>
<script src="/uso.js" defer></script>
</head>
<body>

<div class="top">
  <h1>🎟️ Tours de mis huéspedes</h1>
  <span class="sp"></span>
  <select id="fCasa"><option value="">Todas mis casas</option></select>
  <input id="fBusca" placeholder="Huésped, folio o tour">
</div>

<div class="wrap">
  <div class="secnav" id="nav"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card tablewrap">
    <table><thead><tr>
      <th>Sale</th><th>Tour</th><th>Huésped</th><th class="n">Pax</th>
      <th>Recogida</th><th>Pago</th><th>Estado</th>
    </tr></thead><tbody id="tb"></tbody></table>
    <div class="empty" id="vacio" style="display:none">Nada por aquí.</div>
  </div>
  <p class="mini" style="margin-top:12px">
    Aquí está todo lo que vendió tu casa: los tours de quien duerme contigo y
    los que vendieron tus concierges a gente de fuera.
  </p>
</div>

<div class="velo" id="velo"></div>
<div class="panel" id="panel">
  <div class="ph"><h2 id="pTit">Ficha</h2><button class="px" id="pX">×</button></div>
  <div class="pb" id="pCuerpo"></div>
</div>

<script src="/cp-acceso.js"></script>
<script src="/cp-dialogo.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  function $(i){ return document.getElementById(i); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(v){ var n=Number(v||0);
    return '$'+n.toLocaleString('es-MX',{maximumFractionDigits:0}); }
  function hm(h){ return h?String(h).slice(0,5):''; }

  /* El dia se toma en hora de CDMX, no en la del equipo. Si el navegador esta
     en otro huso -o alguien abre esto de viaje- «hoy» no debe cambiar. */
  function hoyCdmx(){
    try{ return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',
      year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
    catch(_){ var d=new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
  }
  function fd(s){
    if(!s) return '—';
    var p=String(s).slice(0,10).split('-');
    var M=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
    return p[2].replace(/^0/,'')+' '+M[+p[1]-1]+' '+p[0];
  }

  function hdr(){
    var tk=null;
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(k&&/sb-.*-auth-token/.test(k)){
          var v=JSON.parse(localStorage.getItem(k)||'null');
          var ss=v&&(v.currentSession||v);
          if(ss&&ss.access_token){ tk=ss.access_token; break; }
        }
      }
    }catch(_){ }
    return {apikey:KEY, Authorization:'Bearer '+(tk||KEY), 'Content-Type':'application/json'};
  }
  async function rpc(fn,body){
    var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:hdr(),
      body:JSON.stringify(body||{})});
    if(!r.ok) throw new Error(await r.text());
    var t=await r.text();
    return t?JSON.parse(t):null;
  }

  var TODO=[], VISTA='proximos', ABIERTA=null;

  var PESTANAS=[
    {k:'hoy',      t:'Hoy'},
    {k:'proximos', t:'Próximos'},
    {k:'pasados',  t:'Ya salieron'},
    {k:'todos',    t:'Todos'}
  ];

  function pago(x){
    var e=String(x.pago_estado||'');
    if(e==='pagado') return '<span class="pill p-ok">pagada</span>';
    if(e==='pendiente'||e==='sin_cobro') return '<span class="pill p-warn">'+esc(e==='sin_cobro'?'sin cobro':'pendiente')+'</span>';
    if(e==='fallido') return '<span class="pill p-bad">falló</span>';
    if(/reembols/.test(e)) return '<span class="pill p-gris">'+esc(e.replace(/_/g,' '))+'</span>';
    return '<span class="pill p-gris">'+esc(e||'—')+'</span>';
  }
  function estado(x){
    var e=String(x.estado_tour||'');
    if(e==='cancelada') return '<span class="pill p-bad">cancelada</span>';
    if(e==='confirmada') return '<span class="pill p-ok">confirmada</span>';
    return '<span class="pill p-gris">'+esc(e||'—')+'</span>';
  }

  /* LA RECOGIDA ES EL DATO DE RECEPCION. Lo demas se puede mirar luego; esto
     decide si alguien tiene que estar en la puerta a las seis de la manana. */
  function recogida(x){
    if(x.pickup && x.pickup_lugar)
      return '<b>'+esc(x.pickup_lugar)+'</b>'+(x.pickup_hora?'<br><span class="mini">'+hm(x.pickup_hora)+'</span>':'');
    if(x.recogida_en) return esc(x.recogida_en);
    return '<span class="mini">—</span>';
  }

  function deLaCasa(){
    var c=$('fCasa').value;
    return TODO.filter(function(x){ return !c || x.hotel===c; });
  }

  function visibles(){
    var hoy=hoyCdmx(), q=$('fBusca').value.trim().toLowerCase();
    return deLaCasa().filter(function(x){
      var f=String(x.fecha_salida||'').slice(0,10);
      if(VISTA==='hoy'      && f!==hoy) return false;
      if(VISTA==='proximos' && !(f>=hoy)) return false;
      if(VISTA==='pasados'  && !(f<hoy)) return false;
      if(q){
        var paja=[x.huesped,x.folio,x.tour,x.anfitrion,x.codigo_venta].join(' ').toLowerCase();
        if(paja.indexOf(q)<0) return false;
      }
      return true;
    }).sort(function(a,b){
      var fa=String(a.fecha_salida||'')+String(a.hora_salida||''),
          fb=String(b.fecha_salida||'')+String(b.hora_salida||'');
      return VISTA==='pasados' ? (fa<fb?1:-1) : (fa>fb?1:-1);
    });
  }

  function pinta(){
    $('nav').innerHTML=PESTANAS.map(function(p){
      return '<button data-k="'+p.k+'"'+(p.k===VISTA?' class="on"':'')+'>'+esc(p.t)+'</button>';
    }).join('');
    Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
      b.onclick=function(){ VISTA=b.getAttribute('data-k'); pinta(); };
    });

    var l=visibles(), hoy=hoyCdmx();
    var deHoy=deLaCasa().filter(function(x){ return String(x.fecha_salida||'').slice(0,10)===hoy
                                              && x.estado_tour!=='cancelada'; });
    var pax=l.reduce(function(s,x){ return s+Number(x.pax||0); },0);
    var conPickup=deHoy.filter(function(x){ return x.pickup; }).length;

    $('kpis').innerHTML=
      '<div class="kpi"><b>'+deHoy.length+'</b><span>Salen hoy</span></div>'+
      '<div class="kpi"><b>'+deHoy.reduce(function(s,x){return s+Number(x.pax||0);},0)+'</b><span>Personas hoy</span></div>'+
      '<div class="kpi"><b>'+conPickup+'</b><span>Con recogida hoy</span></div>'+
      '<div class="kpi"><b>'+l.length+'</b><span>En esta vista · '+pax+' pax</span></div>';

    $('tb').innerHTML=l.map(function(x){
      return '<tr class="clic" data-id="'+esc(x.id)+'"'+
        (x.estado_tour==='cancelada'?' style="opacity:.55"':'')+'>'+
        '<td><b>'+fd(x.fecha_salida)+'</b>'+(x.hora_salida?'<br><span class="mini">'+hm(x.hora_salida)+'</span>':'')+'</td>'+
        '<td>'+esc(x.tour||'—')+(x.touroperadora?'<br><span class="mini">'+esc(x.touroperadora)+'</span>':'')+'</td>'+
        '<td><b>'+esc(x.huesped||'—')+'</b><br><span class="mini">'+esc(x.folio||'')+
          (x.anfitrion?' · '+esc(x.anfitrion):'')+'</span></td>'+
        '<td class="n">'+(x.pax||0)+'</td>'+
        '<td>'+recogida(x)+'</td>'+
        '<td>'+pago(x)+'</td>'+
        '<td>'+estado(x)+'</td></tr>';
    }).join('');
    $('vacio').style.display=l.length?'none':'';

    Array.prototype.forEach.call($('tb').querySelectorAll('tr.clic'),function(tr){
      tr.onclick=function(){ abre(tr.getAttribute('data-id')); };
    });
  }

  function fila(k,v){ return '<div class="fila"><b>'+esc(k)+'</b><span>'+v+'</span></div>'; }

  function abre(id){
    var x=TODO.filter(function(v){ return String(v.id)===String(id); })[0];
    if(!x) return;
    ABIERTA=x;
    $('pTit').textContent=x.huesped||'Ficha';
    var puedeTocar = x.estado_tour!=='cancelada';
    var yaSalio = String(x.fecha_salida||'').slice(0,10) < hoyCdmx();

    $('pCuerpo').innerHTML=
      '<div class="sec">La salida</div>'+
      fila('Tour', esc(x.tour||'—'))+
      fila('Sale', '<b>'+fd(x.fecha_salida)+'</b>'+(x.hora_salida?' · '+hm(x.hora_salida):''))+
      fila('Personas', esc(String(x.pax||0))+
        ((x.adultos||x.menores)?' <span class="mini">('+(x.adultos||0)+' adultos, '+(x.menores||0)+' menores)</span>':''))+
      fila('Opera', esc(x.touroperadora||'—'))+
      fila('Recogida', recogida(x))+
      fila('Estado', estado(x)+' '+pago(x))+

      '<div class="sec">El cliente</div>'+
      fila('Huésped', '<b>'+esc(x.huesped||'—')+'</b>')+
      fila('Folio', esc(x.folio||'—'))+
      fila('Correo', x.email?esc(x.email):'<span class="mini">—</span>')+
      fila('Teléfono', x.telefono?esc(x.telefono):'<span class="mini">—</span>')+
      fila('Idioma', esc(x.idioma||'—')+(x.pais?' · '+esc(x.pais):''))+
      fila('Casa', esc(x.hotel||'—')+(x.anfitrion?'<br><span class="mini">vendió '+esc(x.anfitrion)+'</span>':''))+

      '<div class="sec">El dinero</div>'+
      fila('Precio', money(x.total||x.bruto))+
      fila('Pagado', money(x.pago_total))+
      fila('Para tu casa', money(x.al_hotel))+
      (x.notas?'<div class="sec">Notas</div><div class="mini">'+esc(x.notas)+'</div>':'')+

      '<div class="sec">Qué puedes hacer</div>'+
      (yaSalio
        ? '<div class="nota">Este tour ya salió. Si hay que devolver dinero se puede, pero cambiarlo de día o cancelarlo ya no tiene sentido.</div>'
        : '')+
      '<div class="acciones">'+
        '<button class="btn" id="aMover"'+((puedeTocar&&!yaSalio)?'':' disabled')+'>Cambiar de día</button>'+
        '<button class="btn" id="aDev">Solicitar devolución</button>'+
        '<button class="btn grave" id="aCancel"'+(puedeTocar?'':' disabled')+'>Cancelar</button>'+
      '</div>';

    if($('aMover'))  $('aMover').onclick=mover;
    if($('aDev'))    $('aDev').onclick=devolver;
    if($('aCancel')) $('aCancel').onclick=cancelar;

    $('velo').classList.add('on'); $('panel').classList.add('on');
  }
  function cierra(){ $('velo').classList.remove('on'); $('panel').classList.remove('on'); ABIERTA=null; }
  $('pX').onclick=cierra; $('velo').onclick=cierra;

  /* LAS TRES ACCIONES. No son nuevas: son las mismas funciones que usa
     Sincretico. Lo unico que cambia es que ahora se llega a ellas desde la
     casa. Y nada de pop-ups del navegador: cp-dialogo. */
  async function cancelar(){
    var m=await cpPide('¿Por qué se cancela?','',{si:'Cancelar el tour',no:'Dejarlo',marca:'El huésped ya no puede ir'});
    if(m===null||!String(m).trim()) return;
    try{
      await rpc('sinc_reserva_marca',{p_reserva:ABIERTA.id,p_estado:'cancelada',p_pago:null,p_nota:String(m).trim()});
      await cpAviso('Cancelada. Si había cobro, la devolución se pide aparte.');
      cierra(); carga();
    }catch(e){ await cpAviso('No se pudo cancelar: '+e.message); }
  }

  async function mover(){
    var f=await cpPide('¿A qué día lo movemos?','',{si:'Ver si hay sitio',no:'Dejarlo',marca:'2026-11-20'});
    if(f===null||!/^\d{4}-\d{2}-\d{2}$/.test(String(f).trim())) {
      if(f!==null) await cpAviso('Escribe la fecha como 2026-11-20.');
      return;
    }
    f=String(f).trim();
    try{
      /* Primero se mira si hay sitio ese dia, y se dice la hora que hay. No se
         inventa ninguna: la que manda es la de la programacion. */
      var h=await rpc('sinc_disponibilidad',{p_op_exp:ABIERTA.op_experiencia_id,p_desde:f,p_hasta:f});
      var op=(h&&h.length)?h[0]:null;
      if(!op){ await cpAviso('Ese día no hay salida de este tour.'); return; }
      var hora=op.hora||op.hora_salida||ABIERTA.hora_salida;
      var ok=await cpPregunta('Hay salida el '+fd(f)+(hora?' a las '+hm(hora):'')+'. ¿Lo movemos?',
                              {si:'Moverlo',no:'Dejarlo'});
      if(!ok) return;
      await rpc('sinc_reserva_mueve',{p_reserva:ABIERTA.id,p_fecha:f,p_hora:hora||null,p_nota:null});
      await cpAviso('Movido al '+fd(f)+'.');
      cierra(); carga();
    }catch(e){ await cpAviso('No se pudo mover: '+e.message); }
  }

  async function devolver(){
    var pagado=Number(ABIERTA.pago_total||0);
    if(!(pagado>0)){ await cpAviso('Esta reserva no tiene cobro, así que no hay nada que devolver.'); return; }
    var m=await cpPide('¿Cuánto devolvemos? (pagó '+money(pagado)+')',String(Math.round(pagado)),
                       {si:'Siguiente',no:'Dejarlo',marca:String(Math.round(pagado))});
    if(m===null) return;
    var mxn=Number(String(m).replace(/[^0-9.]/g,''));
    if(!(mxn>0)||mxn>pagado){ await cpAviso('El importe tiene que estar entre 1 y '+money(pagado)+'.'); return; }
    var mot=await cpPide('¿Por qué se devuelve?','',{si:'Solicitar',no:'Dejarlo',marca:'Cancelación del huésped'});
    if(mot===null||!String(mot).trim()) return;
    try{
      await rpc('sinc_reembolso_registrar',{p_reserva:ABIERTA.id,p_mxn:mxn,
        p_motivo:String(mot).trim(),p_stripe:null,
        p_quien:(window.cpAcceso&&cpAcceso.tokEmail&&cpAcceso.tokEmail())||'front'});
      await cpAviso('Devolución solicitada por '+money(mxn)+'. Queda registrada para que la revisen.');
      cierra(); carga();
    }catch(e){ await cpAviso('No se pudo solicitar: '+e.message); }
  }

  async function carga(){
    try{
      var r=await fetch(SB+'/rest/v1/v_sinc_portal?select=*&order=fecha_salida.desc&limit=3000',
                        {headers:hdr()});
      if(!r.ok) throw new Error('La base respondió '+r.status);
      var todo=await r.json();

      /* SOLO LO DE SU CASA. Lo que no tiene casa -una venta que entro sola por
         la web, sin hotel ni concierge- no es de nadie aqui, y mezclarlo haria
         que recepcion esperara a gente que no duerme con ellos. */
      todo=todo.filter(function(x){ return !!x.hotel && !x.intento; });

      /* Y encima, la cascada de ubicacion: quien solo tiene Puebla no ve CDMX
         aunque la casa venga en el dato. */
      try{ todo=await cpAcceso.filtra(todo,function(x){ return x.hotel; }); }catch(_){ }
      TODO=todo;

      var casas={}; TODO.forEach(function(x){ casas[x.hotel]=1; });
      var ks=Object.keys(casas).sort();
      $('fCasa').innerHTML='<option value="">'+(ks.length>1?'Todas mis casas':'Mi casa')+'</option>'+
        ks.map(function(c){ return '<option>'+esc(c)+'</option>'; }).join('');
      /* Con una sola casa el selector no decide nada: estorba. */
      $('fCasa').style.display = ks.length>1 ? '' : 'none';
      if(ks.length===1) $('fCasa').value='';

      pinta();
    }catch(e){
      /* Que la pantalla no se quede muda. Sin sesion, o si la base contesta
