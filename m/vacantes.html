<!doctype html>
<html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vacantes · Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;
  --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;
  --rule:#E2DCCF;--rule-2:#D2C8B6;
  --accent:#137A56;--accent-soft:#DCEFE6;--on-accent:#FFFFFF;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--none:#66707A;--none-bg:#E9E4DA;
  --azul:#2f6690;--azul-bg:#e1ecf5;--mora:#6b4a9e;--mora-bg:#ece3f6;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
.top{padding:16px 16px 4px;max-width:1240px;margin:0 auto}
h1{font-size:21px;margin:0 0 2px}.sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1240px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 12px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.bar{max-width:1240px;margin:0 auto;padding:12px 16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar input,.bar select{font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px 48px}
.btn{font:inherit;font-size:13px;font-weight:700;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:9px;padding:8px 13px;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--accent)}
.btn.soft{background:var(--surface-2);color:var(--ink-2);border-color:var(--rule-2)}
.btn.sm{font-size:12px;padding:6px 10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:13px 14px;margin-bottom:11px;box-shadow:var(--shadow)}
.nm{font-weight:700;font-size:15px}
.meta{color:var(--muted);font-size:12.5px;margin-top:2px}
.chip{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--surface-2);color:var(--ink-2);margin-right:5px}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
select.estado,select.mini{font:inherit;font-size:13px;font-weight:600;padding:6px 8px;border:1px solid var(--rule-2);border-radius:8px;background:var(--surface-3);color:var(--ink)}
input.num{width:54px;font:inherit;font-size:14px;text-align:center;padding:6px;border:1px solid var(--rule-2);border-radius:7px;background:var(--surface-3)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{border:1px solid var(--rule);padding:7px 9px;text-align:center}
th{background:var(--surface-2);font-size:12px;color:var(--ink-2)}
td.rol{text-align:left;font-weight:600;background:var(--surface-3)}
.empty{color:var(--muted);text-align:center;padding:42px 16px}
.loading{color:var(--muted);text-align:center;padding:36px}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.col h3{font-size:12.5px;margin:0 0 8px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.col .cnt{background:var(--surface-2);border-radius:999px;font-size:11px;padding:1px 8px;color:var(--muted)}
.vac{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:10px 11px;margin-bottom:9px;box-shadow:var(--shadow)}
.stseg{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.stseg i{display:block;height:100%;background:var(--accent)}
.cand{border-top:1px solid var(--rule);padding:8px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
a.mail{color:var(--accent);text-decoration:none;font-weight:600;font-size:13px}
.rolehint{max-width:1240px;margin:0 auto;padding:0 16px 6px;color:var(--warn);font-size:12px}
dialog{border:0;border-radius:14px;padding:0;max-width:440px;width:92%;box-shadow:0 20px 60px -20px rgba(0,0,0,.5)}
dialog .dh{padding:14px 16px;border-bottom:1px solid var(--rule);font-weight:700}
dialog .db{padding:14px 16px;display:grid;gap:10px}
dialog label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
dialog input,dialog select{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
dialog .df{padding:12px 16px;border-top:1px solid var(--rule);display:flex;justify-content:flex-end;gap:8px}
/* ---- funnel por candidato ---- */
.vblock{background:var(--surface);border:1px solid var(--rule);border-radius:13px;padding:13px 14px;margin-bottom:14px;box-shadow:var(--shadow)}
.vhead{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}
.fcols{display:grid;grid-template-columns:repeat(5,minmax(180px,1fr));gap:10px;margin-top:10px;overflow-x:auto;padding-bottom:4px}
.fcol{background:var(--surface-3);border:1px solid var(--rule);border-radius:10px;padding:8px}
.fcol h4{font-size:11.5px;margin:0 0 6px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.ccard{background:var(--surface);border:1px solid var(--rule);border-radius:9px;padding:7px 8px;margin-bottom:6px}
</style></head>
<body>
<div class="top">
  <h1>🧭 Vacantes</h1>
  <div class="sub">Previsión de plantilla, seguimiento de vacantes y candidatos — al lado de Contratos.</div>
</div>
<div class="rolehint" id="rolehint"></div>
<nav class="secnav"><div class="secnav-in" id="secnav">
  <button data-s="pipe" aria-selected="true">Vacantes</button>
  <button data-s="manning">Manning</button>
  <button data-s="gaps">Posiciones no cubiertas</button>
  <button data-s="temp">Temporadas</button>
</div></nav>

<!-- ===== PIPELINE ===== -->
<section id="s-pipe">
  <div class="bar">
    <select id="fsede"><option value="">Todas las sedes</option></select>
    <select id="farea"><option value="">Todas las áreas</option></select>
    <button class="btn ghost" id="btnNuevaVac">＋ Nueva vacante</button>
    <span class="meta" id="pipeSaving"></span>
  </div>
  <div class="wrap"><div id="board"><div class="loading">Cargando…</div></div></div>
</section>

<!-- ===== MANNING ===== -->
<section id="s-manning" hidden>
  <div class="bar">
    <select id="mSede"><option value="">Todas las sedes</option></select>
    <span class="meta">Define, por área y rol, cuántas personas se requieren en cada temporada.</span>
    <button class="btn ghost sm" id="btnAddRol">＋ Agregar rol</button>
  </div>
  <div class="wrap" id="manningWrap"><div class="loading">Cargando…</div></div>
</section>

<!-- ===== GAPS ===== -->
<section id="s-gaps" hidden>
  <div class="bar">
    <select id="gSede"><option value="">Todas las sedes</option></select>
    <span class="meta" id="gTempNote"></span>
  </div>
  <div class="wrap" id="gapsWrap"><div class="loading">Cargando…</div></div>
</section>

<!-- ===== TEMPORADAS ===== -->
<section id="s-temp" hidden>
  <div class="bar">
    <span class="meta">Periodos del año (recurrentes). Mínimo 2 y máximo 6 meses. Pueden cruzar fin de año.</span>
    <button class="btn ghost sm" id="btnAddTemp">＋ Agregar temporada</button>
  </div>
  <div class="wrap" id="tempWrap"><div class="loading">Cargando…</div></div>
</section>

<dialog id="dlg"><form method="dialog" id="dlgForm">
  <div class="dh" id="dlgTitle"></div>
  <div class="db" id="dlgBody"></div>
  <div class="df"><button class="btn soft" value="cancel" type="submit">Cancelar</button><button class="btn" id="dlgOk" value="ok" type="button">Guardar</button></div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/cp-acceso.js"></script>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PROP={cdmx:'45e69775-d877-4507-a9e1-a45bd3400dc5',puebla:'febfbef6-7fd1-4b45-84d9-13533e8dcb72',virreyes:'3e10a9ea-4913-4f7c-86ef-0c829caa851d'};
const PROP_NOM={'45e69775-d877-4507-a9e1-a45bd3400dc5':'CDMX','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'Puebla','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'Virreyes','fde2f615-2c65-40fa-9df3-6336b5ab312c':'Corporativo'};
/* una ciudad agrupa varias propiedades (CDMX = Centro + Virreyes + Corporativo) */
const PROP_CIUDAD={'45e69775-d877-4507-a9e1-a45bd3400dc5':'cdmx','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'cdmx','fde2f615-2c65-40fa-9df3-6336b5ab312c':'cdmx','febfbef6-7fd1-4b45-84d9-13533e8dcb72':'puebla'};
const CIUDADES=[['cdmx','Ciudad de México'],['puebla','Puebla']];
const CIUDAD_NOM={cdmx:'Ciudad de México',puebla:'Puebla'};
/* Nivel vacante (requisición): fase de reclutamiento. Mover esto NO mueve a los candidatos. */
const VAC_FASES=[['abierta','Reclutamiento · abierta','#8C6212'],['publicada','Reclutamiento · publicada','#2f6690'],['en_seleccion','En selección','#6b4a9e'],['cubierta','Cubierta','#1D6B4A'],['cerrada','Cerrada','#66707A']];
const FASE_LBL=Object.fromEntries(VAC_FASES.map(s=>[s[0],s[1]]));
/* Funnel del candidato: se avanza persona por persona hasta selección. Incorporación vive en Contratos. */
const CSTAGES=[['nuevo','Nuevo','#8C6212'],['entrevista_jefe','Entrevista Jefe de Área','#2f6690'],['entrevista_admin','Entrevista Administración','#2f6690'],['propuesta','Propuesta de contrato','#6b4a9e'],['seleccionado','Seleccionado','#1D6B4A']];
const CST_ALL=['nuevo','entrevista_jefe','entrevista_admin','propuesta','seleccionado','descartado'];
const CST_LBL={nuevo:'Nuevo',entrevista_jefe:'Entrevista Jefe de Área',entrevista_admin:'Entrevista Administración',propuesta:'Propuesta de contrato',seleccionado:'Seleccionado',descartado:'Descartado'};
let EMAIL=null,PUEDE=false;
let VACS=[],VC=[],CANDS=[],MAN=[],TEMPS=[],EMPS=[];

async function nivel(){try{const s=await sb.auth.getSession();EMAIL=(s.data&&s.data.session&&s.data.session.user&&s.data.session.user.email)||null;if(!EMAIL)return 'none';const r=await sb.rpc('permiso_efectivo',{p_email:EMAIL,p_pagina:'PAG-CTRL-VACANTES'});if(r.error)return 'ver';return r.data||'none';}catch(_){return 'ver';}}

/* --------- temporada vigente --------- */
function hoyMD(){const d=new Date();return [d.getMonth()+1,d.getDate()];}
function enTemporada(t,md){const[m,dd]=md;const a=t.mes_desde*100+t.dia_desde, b=t.mes_hasta*100+t.dia_hasta, x=m*100+dd;
  if(a<=b) return x>=a&&x<=b; return x>=a||x<=b; /* cruza fin de año */}
function tempVigente(){const md=hoyMD();const c=TEMPS.filter(t=>t.activo&&enTemporada(t,md));
  const ord={alta:3,media:2,baja:1}; c.sort((p,q)=>(ord[q.tipo]||0)-(ord[p.tipo]||0)); return c[0]||null;}

/* --------- carga --------- */
async function cargar(){
  const nv=await nivel(); PUEDE=(nv==='editar');
  $('rolehint').textContent=PUEDE?'':'Modo lectura: puedes revisar, pero solo RH, gerencia, contabilidad o la jefa de área mueven las vacantes.';
  const [rv,rc,rvc,rm,rt,re]=await Promise.all([
    sb.from('rh_vacantes').select('*').order('created_at',{ascending:false}),
    sb.from('rh_candidatos').select('id,nombre,puesto,ciudad,proyecto,estado,telefono,cv_url').neq('estado','descartado'),
    sb.from('rh_vacante_candidatos').select('*'),
    sb.from('rh_manning').select('*'),
    sb.from('rh_temporadas').select('*').eq('activo',true).order('orden'),
    sb.from('employees').select('id,nombre,nombre_display,area,puesto,sede,property_id,estatus').eq('estatus','activo')
  ]);
  VACS=rv.data||[];CANDS=rc.data||[];VC=rvc.data||[];MAN=rm.data||[];TEMPS=rt.data||[];EMPS=re.data||[];
  /* compat: normaliza etapas viejas al esquema nuevo (solo en memoria; se persiste al mover) */
  const NFASE={con_candidatos:'en_seleccion',en_entrevistas:'en_seleccion',validada:'publicada',seleccionada:'en_seleccion',contratada:'cubierta'};
  const NCST={entrevista:'entrevista_jefe',contratado:'seleccionado'};
  VACS.forEach(v=>{if(NFASE[v.estatus])v.estatus=NFASE[v.estatus];});
  VC.forEach(x=>{if(NCST[x.estatus])x.estatus=NCST[x.estatus];});
  llenaFiltros();
  pintaPipe();pintaManning();pintaGaps();pintaTemp();
}
function llenaFiltros(){
  const propOpts='<option value="">Todas las sedes</option>'+Object.entries(PROP).map(([k,v])=>`<option value="${v}">${PROP_NOM[v]}</option>`).join('');
  const ciudadOpts='<option value="">Todas las ciudades</option>'+CIUDADES.map(([k,l])=>`<option value="${k}">${esc(l)}</option>`).join('');
  $('fsede').innerHTML=ciudadOpts; /* vacantes se filtran por CIUDAD, no por propiedad */
  ['mSede','gSede'].forEach(id=>{const el=$(id);if(el)el.innerHTML=propOpts;});
  const areas=[...new Set([...EMPS.map(e=>e.area),...VACS.map(v=>v.area),...MAN.map(m=>m.area)].filter(Boolean))].sort();
  $('farea').innerHTML='<option value="">Todas las áreas</option>'+areas.map(a=>`<option>${esc(a)}</option>`).join('');
}

/* ===================== PIPELINE ===================== */
function ciudadDeVac(v){return PROP_CIUDAD[v.property_id]||'';}
function candsDeVac(vid){return VC.filter(x=>x.vacante_id===vid).map(x=>({vc:x,c:CANDS.find(c=>c.id===x.candidato_id)})).filter(o=>o.c);}
function pintaPipe(){
  const fc=$('fsede').value, fa=$('farea').value;
  const vs=VACS.filter(v=>(!fc||ciudadDeVac(v)===fc)&&(!fa||v.area===fa));
  const board=$('board');
  if(!vs.length){board.innerHTML='<div class="empty">Sin vacantes'+(fc||fa?' con ese filtro':'')+'. Crea una con “＋ Nueva vacante”.</div>';return;}
  board.innerHTML=vs.map(vacBloque).join('');
  board.querySelectorAll('[data-mv]').forEach(sel=>sel.onchange=()=>moverVac(sel.dataset.mv,sel.value));
  board.querySelectorAll('[data-jalar]').forEach(b=>b.onclick=()=>jalarCands(b.dataset.jalar));
  board.querySelectorAll('[data-cst]').forEach(sel=>sel.onchange=()=>candEstatus(sel.dataset.cst,sel.value));
  board.querySelectorAll('[data-exp]').forEach(b=>b.onclick=()=>{const d=$('fn-'+b.dataset.exp);if(d)d.hidden=!d.hidden;});
  board.querySelectorAll('[data-addc]').forEach(b=>b.onclick=()=>dlgAddCand(VACS.find(x=>x.id===b.dataset.addc)));
}
function vacBloque(v){
  const cs=candsDeVac(v.id);
  const cnt=k=>cs.filter(o=>o.vc.estatus===k).length;
  const activos=cs.filter(o=>o.vc.estatus!=='descartado');
  const descart=cs.filter(o=>o.vc.estatus==='descartado');
  const pct=v.posiciones?Math.round(100*(v.posiciones_cubiertas||0)/v.posiciones):0;
  const ciudad=CIUDAD_NOM[ciudadDeVac(v)]||'';
  const faseSel=PUEDE?`<select class="mini" data-mv="${v.id}">${VAC_FASES.map(s=>`<option value="${s[0]}"${s[0]===v.estatus?' selected':''}>${esc(s[1])}</option>`).join('')}</select>`:`<span class="chip">${esc(FASE_LBL[v.estatus]||v.estatus)}</span>`;
  const resumen=CSTAGES.map(([k,l,c])=>`<span class="chip"><span class="dot" style="background:${c}"></span> ${esc(l)}: ${cnt(k)}</span>`).join('');
  const funnel=CSTAGES.map(([k,l,c])=>{
    const list=activos.filter(o=>o.vc.estatus===k);
    const jalar=(k==='nuevo'&&PUEDE)?`<button class="btn ghost sm" data-jalar="${v.id}" style="margin-left:auto">⇣ Jalar</button>`:'';
    return `<div class="fcol"><h4><span class="dot" style="background:${c}"></span>${esc(l)} <span class="cnt">${list.length}</span>${jalar}</h4>${list.map(ccard).join('')||'<div class="meta" style="padding:4px 2px">—</div>'}</div>`;
  }).join('');
  return `<div class="vblock">
    <div class="vhead">
      <div style="flex:1;min-width:200px">
        <div class="nm">${esc(v.puesto)} ${faseSel}</div>
        <div class="meta">${esc(v.area)}${ciudad?(' · '+esc(ciudad)):''}${v.property_id?(' · '+(PROP_NOM[v.property_id]||'')):''} · ${v.posiciones_cubiertas||0}/${v.posiciones} cubiertas · ${v.origen==='solicitud_area'?'solicitud área':'previsión'}</div>
        <div class="stseg" style="max-width:280px"><i style="width:${pct}%"></i></div>
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn soft sm" data-exp="${v.id}">Ver funnel (${activos.length})</button>
        ${PUEDE?`<button class="btn ghost sm" data-addc="${v.id}">＋ Candidato</button>`:''}
      </div>
    </div>
    <div style="margin-top:8px">${resumen}</div>
    <div id="fn-${v.id}" hidden>
      <div class="fcols">${funnel}</div>
      ${descart.length?`<div class="meta" style="margin-top:8px">Descartados (${descart.length}): ${esc(descart.map(o=>o.c.nombre).join(', '))}</div>`:''}
    </div>
  </div>`;
}
function ccard(o){
  const c=o.c, vc=o.vc;
  const sel=PUEDE?`<select class="mini" data-cst="${vc.id}" style="width:100%;margin-top:5px">${CST_ALL.map(s=>`<option value="${s}"${s===vc.estatus?' selected':''}>${esc(CST_LBL[s]||s)}</option>`).join('')}</select>`:`<span class="chip">${esc(CST_LBL[vc.estatus]||vc.estatus)}</span>`;
  return `<div class="ccard"><div style="display:flex;gap:6px;align-items:baseline;justify-content:space-between"><b style="font-size:12.5px">${esc(c.nombre||'—')}</b>${c.cv_url?`<a class="mail" href="${esc(c.cv_url)}" target="_blank" style="font-size:12px">Ver en Indeed ↗</a>`:''}</div><div class="meta">${esc(c.puesto||'')}${c.telefono?(' · '+esc(c.telefono)):''}</div>${sel}</div>`;
}
async function moverVac(id,nuevo){
  if(!PUEDE)return; $('pipeSaving').textContent='Guardando…';
  const upd={estatus:nuevo,updated_at:new Date().toISOString()};
  upd.cerrada_at=(nuevo==='cubierta'||nuevo==='cerrada')?new Date().toISOString():null;
  const {error}=await sb.from('rh_vacantes').update(upd).eq('id',id);
  $('pipeSaving').textContent=error?'Error':'Guardado'; if(!error){const v=VACS.find(x=>x.id===id);if(v)v.estatus=nuevo;pintaPipe();} setTimeout(()=>$('pipeSaving').textContent='',1500);
}
async function jalarCands(vid){
  if(!PUEDE)return; const v=VACS.find(x=>x.id===vid); if(!v)return;
  const key=(v.puesto||'').toLowerCase();
  const ya=new Set(VC.filter(x=>x.vacante_id===vid).map(x=>x.candidato_id));
  const match=CANDS.filter(c=>!ya.has(c.id)&&(((c.puesto||'').toLowerCase().includes(key))||key.includes((c.puesto||'').toLowerCase())) );
  if(!match.length){$('pipeSaving').textContent='No hay CVs nuevos que coincidan con “'+v.puesto+'”';setTimeout(()=>$('pipeSaving').textContent='',2500);return;}
  const rows=match.map(c=>({vacante_id:vid,candidato_id:c.id,estatus:'nuevo'}));
  const {error}=await sb.from('rh_vacante_candidatos').insert(rows);
  if(error){$('pipeSaving').textContent='Error: '+error.message;return;}
  if(v.estatus==='abierta'){await sb.from('rh_vacantes').update({estatus:'publicada'}).eq('id',vid);v.estatus='publicada';}
  await cargar(); setTab('pipe'); const d=$('fn-'+vid); if(d)d.hidden=false;
}
async function candEstatus(vcId,nuevo){
  if(!PUEDE)return;
  const vc=VC.find(x=>x.id===vcId); if(!vc)return;
  const prev=vc.estatus;
  const {error}=await sb.from('rh_vacante_candidatos').update({estatus:nuevo,updated_at:new Date().toISOString()}).eq('id',vcId);
  if(error){$('pipeSaving').textContent='Error: '+error.message;setTimeout(()=>$('pipeSaving').textContent='',2500);return;}
  vc.estatus=nuevo;
  const v=VACS.find(x=>x.id===vc.vacante_id);
  if(v){
    let cub=v.posiciones_cubiertas||0;
    const wasSel=prev==='seleccionado', isSel=nuevo==='seleccionado';
    if(isSel&&!wasSel)cub=Math.min(cub+1,v.posiciones);
    if(!isSel&&wasSel)cub=Math.max(cub-1,0);
    let est=v.estatus;
    if(v.posiciones>0&&cub>=v.posiciones)est='cubierta';
    else if(['entrevista_jefe','entrevista_admin','propuesta','seleccionado'].includes(nuevo))est='en_seleccion';
    else if(est==='cubierta')est='en_seleccion';
    const upd={posiciones_cubiertas:cub,estatus:est,cerrada_at:est==='cubierta'?new Date().toISOString():null};
    await sb.from('rh_vacantes').update(upd).eq('id',v.id);
    v.posiciones_cubiertas=cub; v.estatus=est;
  }
  pintaPipe(); const d=$('fn-'+(v&&v.id)); if(d)d.hidden=false;
}

/* ===================== MANNING ===================== */
function pintaManning(){
  const sede=$('mSede').value||null;
  const temps=TEMPS;
  if(!temps.length){$('manningWrap').innerHTML='<div class="empty">Primero define temporadas en la pestaña Temporadas.</div>';return;}
  // filas = (area,puesto) presentes en manning (de esa sede) o en empleados
  const prop=sede||null;
  const key=m=>m.area+'||'+m.puesto;
  const rows={};
  MAN.filter(m=>((prop&&m.property_id===prop)|| (!prop&&!m.property_id))).forEach(m=>{rows[key(m)]={area:m.area,puesto:m.puesto};});
  EMPS.filter(e=>(!prop||e.property_id===prop)).forEach(e=>{if(e.area&&e.puesto)rows[e.area+'||'+e.puesto]={area:e.area,puesto:e.puesto};});
  const lista=Object.values(rows).sort((a,b)=>(a.area+a.puesto).localeCompare(b.area+b.puesto));
  const byArea={};lista.forEach(r=>{(byArea[r.area]=byArea[r.area]||[]).push(r);});
  const val=(area,puesto,tid)=>{const m=MAN.find(x=>x.area===area&&x.puesto===puesto&&x.temporada_id===tid&&((prop&&x.property_id===prop)||(!prop&&!x.property_id)));return m?m.posiciones_requeridas:'';};
  let h='';
  Object.keys(byArea).sort().forEach(area=>{
    h+=`<div class="card"><div class="nm">${esc(area)}</div><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th style="text-align:left">Rol</th>${temps.map(t=>`<th>${esc(tipoEmoji(t.tipo))} ${esc(t.nombre)}</th>`).join('')}</tr></thead><tbody>`;
    byArea[area].forEach(r=>{
      h+=`<tr><td class="rol">${esc(r.puesto)}</td>${temps.map(t=>`<td><input class="num" type="number" min="0" value="${val(r.area,r.puesto,t.id)}" ${PUEDE?'':'disabled'} data-man='${esc(JSON.stringify({area:r.area,puesto:r.puesto,tid:t.id,prop}))}'></td>`).join('')}</tr>`;
    });
    h+='</tbody></table></div></div>';
  });
  $('manningWrap').innerHTML=h||'<div class="empty">Sin roles aún. Agrega uno con “Agregar rol”.</div>';
  $('manningWrap').querySelectorAll('[data-man]').forEach(inp=>inp.onchange=()=>guardaManning(JSON.parse(inp.dataset.man),inp.value));
}
function tipoEmoji(t){return t==='alta'?'🔴':t==='baja'?'🟢':'🟡';}
async function guardaManning(k,valor){
  if(!PUEDE)return; const n=parseInt(valor,10);
  const existe=MAN.find(x=>x.area===k.area&&x.puesto===k.puesto&&x.temporada_id===k.tid&&((k.prop&&x.property_id===k.prop)||(!k.prop&&!x.property_id)));
  if(valor===''||isNaN(n)){ if(existe){await sb.from('rh_manning').delete().eq('id',existe.id);MAN=MAN.filter(x=>x.id!==existe.id);} return; }
  if(existe){await sb.from('rh_manning').update({posiciones_requeridas:n,updated_at:new Date().toISOString()}).eq('id',existe.id);existe.posiciones_requeridas=n;}
  else{const {data,error}=await sb.from('rh_manning').insert({area:k.area,puesto:k.puesto,temporada_id:k.tid,property_id:k.prop,posiciones_requeridas:n}).select().single();if(!error&&data)MAN.push(data);}
}

/* ===================== GAPS ===================== */
function pintaGaps(){
  const sede=$('gSede').value||null; const t=tempVigente();
  $('gTempNote').textContent=t?('Temporada vigente: '+t.nombre+' ('+t.tipo+')'):'No hay temporada vigente definida para hoy.';
  if(!t){$('gapsWrap').innerHTML='<div class="empty">Define la temporada que cubre la fecha de hoy en Temporadas.</div>';return;}
  const prop=sede||null;
  const need=MAN.filter(m=>m.temporada_id===t.id&&((prop&&m.property_id===prop)||(!prop&&(!m.property_id||true))));
  if(!need.length){$('gapsWrap').innerHTML='<div class="empty">No hay manning definido para esta temporada'+(sede?' en esta sede':'')+'. Captúralo en Manning.</div>';return;}
  const countEmp=(area,puesto)=>EMPS.filter(e=>e.area===area&&(e.puesto||'').toLowerCase()===(puesto||'').toLowerCase()&&(!prop||e.property_id===prop)).length;
  const vacAbiertas=(area,puesto)=>VACS.filter(v=>v.area===area&&(v.puesto||'').toLowerCase()===(puesto||'').toLowerCase()&&!['cubierta','cerrada'].includes(v.estatus)&&(!prop||v.property_id===prop)).reduce((n,v)=>n+(v.posiciones-v.posiciones_cubiertas),0);
  const byArea={};need.forEach(m=>{(byArea[m.area]=byArea[m.area]||[]).push(m);});
  let h='';
  Object.keys(byArea).sort().forEach(area=>{
    const filas=byArea[area].map(m=>{
      const act=countEmp(m.area,m.puesto), abierto=vacAbiertas(m.area,m.puesto);
      const falta=Math.max(0,(m.posiciones_requeridas||0)-act-abierto);
      const cls=falta>0?'bad':'ok';
      const btn=(PUEDE&&falta>0)?`<button class="btn sm" data-abrir='${esc(JSON.stringify({area:m.area,puesto:m.puesto,prop,n:falta}))}'>Abrir vacante (${falta})</button>`:'';
      return `<tr><td class="rol">${esc(m.puesto)}</td><td>${m.posiciones_requeridas}</td><td>${act}</td><td>${abierto||''}</td><td><span class="chip ${cls}">${falta>0?('faltan '+falta):'cubierto'}</span></td><td>${btn}</td></tr>`;
    }).join('');
    h+=`<div class="card"><div class="nm">${esc(area)}</div><div style="overflow-x:auto;margin-top:8px"><table><thead><tr><th style="text-align:left">Rol</th><th>Requeridos</th><th>Activos</th><th>Vacante abierta</th><th>Estado</th><th></th></tr></thead><tbody>${filas}</tbody></table></div></div>`;
  });
  $('gapsWrap').innerHTML=h;
  $('gapsWrap').querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>abrirVacante(JSON.parse(b.dataset.abrir),t));
}
async function abrirVacante(k,t){
  if(!PUEDE)return;
  const {error}=await sb.from('rh_vacantes').insert({area:k.area,puesto:k.puesto,property_id:k.prop,posiciones:k.n||1,estatus:'abierta',origen:'prevision',temporada:t?t.nombre:null,abierta_por:EMAIL});
  if(error){alert('No se pudo abrir la vacante: '+error.message);return;}
  await cargar(); setTab('pipe');
}

/* ===================== TEMPORADAS ===================== */
const MESES=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function mesesDur(t){let a=t.mes_desde, b=t.mes_hasta; let n=(b-a); if(n<0)n+=12; return n+1;}
function pintaTemp(){
  if(!TEMPS.length){$('tempWrap').innerHTML='<div class="empty">Sin temporadas. Agrega la primera.</div>';return;}
  $('tempWrap').innerHTML=TEMPS.map(t=>{
    const dur=mesesDur(t); const warn=(dur<2||dur>6)?`<span class="chip bad">${dur} meses</span>`:`<span class="chip">${dur} meses</span>`;
    return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <div><span class="nm">${tipoEmoji(t.tipo)} ${esc(t.nombre)}</span><div class="meta">${t.dia_desde} ${MESES[t.mes_desde]} → ${t.dia_hasta} ${MESES[t.mes_hasta]} · ${esc(t.tipo)} ${warn}</div></div>
      ${PUEDE?`<span><button class="btn soft sm" data-et="${t.id}">Editar</button> <button class="btn soft sm" data-del="${t.id}">Quitar</button></span>`:''}
    </div></div>`;
  }).join('');
  $('tempWrap').querySelectorAll('[data-et]').forEach(b=>b.onclick=()=>dlgTemp(TEMPS.find(x=>x.id===b.dataset.et)));
  $('tempWrap').querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('¿Quitar esta temporada? Se borra su manning asociado.'))return;await sb.from('rh_temporadas').update({activo:false}).eq('id',b.dataset.del);await cargar();setTab('temp');});
}

/* --------- diálogos --------- */
function openDlg(title,bodyHtml,onOk){$('dlgTitle').textContent=title;$('dlgBody').innerHTML=bodyHtml;$('dlg').showModal();$('dlgOk').onclick=async()=>{const ok=await onOk();if(ok!==false)$('dlg').close();};}
function dlgTemp(t){
  t=t||{tipo:'media',mes_desde:1,dia_desde:1,mes_hasta:2,dia_hasta:28,nombre:''};
  const mo=(sel)=>MESES.map((m,i)=>i?`<option value="${i}"${i===sel?' selected':''}>${m}</option>`:'').join('');
  openDlg(t.id?'Editar temporada':'Nueva temporada',
   `<div><label>Nombre</label><input id="t_nom" value="${esc(t.nombre)}" placeholder="Alta · fin de año"></div>
    <div><label>Tipo</label><select id="t_tipo">${['alta','media','baja'].map(x=>`<option${x===t.tipo?' selected':''}>${x}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Desde (día/mes)</label><div style="display:flex;gap:6px"><input id="t_dd" type="number" min="1" max="31" value="${t.dia_desde}" style="width:70px"><select id="t_md">${mo(t.mes_desde)}</select></div></div></div>
    <div style="display:flex;gap:8px"><div style="flex:1"><label>Hasta (día/mes)</label><div style="display:flex;gap:6px"><input id="t_dh" type="number" min="1" max="31" value="${t.dia_hasta}" style="width:70px"><select id="t_mh">${mo(t.mes_hasta)}</select></div></div></div>
    <div class="meta" id="t_dur"></div>`,
   async()=>{
     const o={nombre:$('t_nom').value.trim()||'Temporada',tipo:$('t_tipo').value,mes_desde:+$('t_md').value,dia_desde:+$('t_dd').value,mes_hasta:+$('t_mh').value,dia_hasta:+$('t_dh').value,activo:true};
     const dur=mesesDur(o); if(dur<2||dur>6){alert('La temporada debe durar entre 2 y 6 meses (va '+dur+').');return false;}
     if(t.id){await sb.from('rh_temporadas').update(o).eq('id',t.id);}else{await sb.from('rh_temporadas').insert({...o,orden:(TEMPS.length+1)});}
     await cargar();setTab('temp');
   });
}
function dlgAddCand(v){
  if(!v||!PUEDE)return;
  openDlg('＋ Candidato manual · '+esc(v.puesto),
   `<div><label>Nombre</label><input id="c_nom" placeholder="Nombre completo"></div>
    <div><label>Puesto</label><input id="c_pue" value="${esc(v.puesto||'')}"></div>
    <div><label>Teléfono</label><input id="c_tel" placeholder="(opcional)"></div>
    <div><label>Nota</label><input id="c_nota" placeholder="(opcional)"></div>
    <div class="meta">Se crea en la BBDD histórica de Candidatos (RH) y se liga a esta vacante en etapa “Nuevo”.</div>`,
   async()=>{
     const nom=$('c_nom').value.trim(); if(!nom){alert('Pon el nombre del candidato.');return false;}
     const {error}=await sb.rpc('vac_add_candidato',{p_vacante:v.id,p_nombre:nom,p_puesto:($('c_pue').value.trim()||v.puesto),p_telefono:($('c_tel').value.trim()||null),p_nota:($('c_nota').value.trim()||null)});
     if(error){alert('Error al crear candidato: '+error.message);return false;}
     await cargar(); setTab('pipe'); const d=$('fn-'+v.id); if(d)d.hidden=false;
   });
}
function dlgNuevaVac(){
  const areas=[...new Set([...EMPS.map(e=>e.area),...VACS.map(v=>v.area)].filter(Boolean))].sort();
  openDlg('Nueva vacante',
   `<div><label>Área</label><input id="v_area" list="v_areas" placeholder="Front Desk"><datalist id="v_areas">${areas.map(a=>`<option>${esc(a)}</option>`).join('')}</datalist></div>
    <div><label>Puesto / rol</label><input id="v_puesto" placeholder="Recepcionista"></div>
    <div><label>Sede</label><select id="v_sede"><option value="">—</option>${Object.entries(PROP).map(([k,v])=>`<option value="${v}">${PROP_NOM[v]}</option>`).join('')}</select></div>
    <div style="display:flex;gap:8px"><div><label>Posiciones</label><input id="v_pos" type="number" min="1" value="1" style="width:80px"></div><div style="flex:1"><label>Origen</label><select id="v_origen"><option value="prevision">Previsión</option><option value="solicitud_area">Solicitud del área</option></select></div></div>`,
   async()=>{
     const area=$('v_area').value.trim(),puesto=$('v_puesto').value.trim();
     if(!area||!puesto){alert('Pon área y puesto.');return false;}
     const {error}=await sb.from('rh_vacantes').insert({area,puesto,property_id:$('v_sede').value||null,posiciones:Math.max(1,+$('v_pos').value||1),estatus:'abierta',origen:$('v_origen').value,abierta_por:EMAIL});
     if(error){alert('Error: '+error.message);return false;}
     await cargar();setTab('pipe');
   });
}
function dlgAddRol(){
  const areas=[...new Set(EMPS.map(e=>e.area).filter(Boolean))].sort();
  openDlg('Agregar rol al manning',
   `<div><label>Área</label><input id="r_area" list="r_areas"><datalist id="r_areas">${areas.map(a=>`<option>${esc(a)}</option>`).join('')}</datalist></div>
    <div><label>Rol / puesto</label><input id="r_puesto"></div>
    <div class="meta">Se agrega la fila; captura las personas por temporada en la tabla.</div>`,
   async()=>{
     const area=$('r_area').value.trim(),puesto=$('r_puesto').value.trim();
     if(!area||!puesto){alert('Pon área y rol.');return false;}
     const tid=TEMPS[0]&&TEMPS[0].id; if(!tid){alert('Primero crea una temporada.');return false;}
     const prop=$('mSede').value||null;
     const {data,error}=await sb.from('rh_manning').insert({area,puesto,temporada_id:tid,property_id:prop,posiciones_requeridas:0}).select().single();
     if(error){alert('Error: '+error.message);return false;}
     if(data)MAN.push(data); pintaManning();
   });
}

/* ===================== navegación ===================== */
function setTab(s){
  document.querySelectorAll('#secnav button').forEach(b=>b.setAttribute('aria-selected', b.dataset.s===s?'true':'false'));
  ['pipe','manning','gaps','temp'].forEach(x=>{const el=$('s-'+x);if(el)el.hidden=(x!==s);});
}
document.querySelectorAll('#secnav button').forEach(b=>b.onclick=()=>setTab(b.dataset.s));
$('btnNuevaVac').onclick=dlgNuevaVac;
$('btnAddTemp').onclick=()=>dlgTemp(null);
$('btnAddRol').onclick=dlgAddRol;
['fsede','farea'].forEach(id=>$(id).onchange=pintaPipe);
$('mSede').onchange=pintaManning;
$('gSede').onchange=pintaGaps;
cargar();
</script>
