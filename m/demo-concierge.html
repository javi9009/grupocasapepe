<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba · App de concierge</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --error:#9E3B2E; --error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:12px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:15px}
h1,h2,h3,.osw{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}

.aviso{background:var(--alerta-bg);color:var(--alerta);font-family:Oswald;font-size:11.5px;
  text-transform:uppercase;letter-spacing:.08em;text-align:center;padding:7px 14px;border-bottom:1px solid #E7D7B4}

/* cabecera del concierge */
.cab{background:var(--tinta);color:#fff;padding:16px 18px}
.cab .in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.cab .ava{width:42px;height:42px;border-radius:999px;background:var(--naranja);display:grid;place-items:center;
  font-family:Oswald;font-weight:700;font-size:17px;flex:none}
.cab h1{font-size:17px;font-weight:600}
.cab .sub{color:#C9C2B8;font-size:12.5px;margin-top:2px;text-transform:none;letter-spacing:0;font-family:Inter}
.cab .cod{margin-left:auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22);
  border-radius:999px;padding:6px 14px;font-family:Oswald;font-size:12px;letter-spacing:.08em}
.cab .cod b{color:var(--naranja);font-weight:600}

/* pestañas */
.tabs{background:var(--tinta);border-top:1px solid rgba(255,255,255,.08);padding:0 18px}
.tabs .in{max-width:1080px;margin:0 auto;display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;color:#C9C2B8;font-family:Oswald;font-weight:600;font-size:12.5px;
  text-transform:uppercase;letter-spacing:.07em;padding:11px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:#fff;border-bottom-color:var(--naranja)}

.wrap{max-width:1080px;margin:0 auto;padding:20px 18px 80px}

/* carruseles */
.seccion{margin-bottom:26px}
.seccion .tit{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.seccion h2{font-size:15px;font-weight:600}
.seccion .cuenta{color:var(--gris);font-size:12.5px}
.carr{display:flex;gap:12px;overflow-x:auto;padding:3px 3px 10px;scroll-snap-type:x mandatory}
.carr::-webkit-scrollbar{height:6px}
.carr::-webkit-scrollbar-thumb{background:var(--linea);border-radius:99px}

.card{flex:0 0 232px;scroll-snap-align:start;background:var(--blanco);border:1px solid var(--linea);
  border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden;cursor:pointer;text-align:left;
  font:inherit;color:inherit;padding:0;display:flex;flex-direction:column;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--naranja)}
.card .foto{height:108px;display:grid;place-items:center;font-family:Oswald;font-weight:700;font-size:30px;color:rgba(255,255,255,.92)}
.card .cuerpo{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.card h3{font-size:13.5px;font-weight:600;text-transform:none;letter-spacing:0;font-family:Inter;line-height:1.3}
.card .meta{color:var(--gris);font-size:11.5px}
.card .pie{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;padding-top:7px}
.card .pvp{font-family:Oswald;font-weight:600;font-size:16px}
.card .tuyo{background:var(--ok-bg);color:var(--ok);border-radius:999px;padding:3px 9px;
  font-family:Oswald;font-weight:600;font-size:11px;letter-spacing:.05em;white-space:nowrap}

.etq{display:inline-block;font-family:Oswald;font-weight:600;font-size:10.5px;text-transform:uppercase;
  letter-spacing:.06em;border-radius:999px;padding:3px 9px;background:var(--hueso);color:var(--gris)}
.etq.prop{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.etq.terc{background:var(--cielo-suave);color:#1F5B7A}
.etq.demo{background:var(--magenta-suave);color:var(--magenta-oscuro)}

/* ficha / modal */
dialog{border:0;border-radius:16px;padding:0;max-width:520px;width:calc(100% - 28px);box-shadow:0 30px 80px -30px rgba(30,26,22,.6)}
dialog::backdrop{background:rgba(30,26,22,.55)}
.mod{background:var(--papel)}
.mod .top{padding:18px 20px;border-bottom:1px solid var(--linea);display:flex;gap:12px;align-items:flex-start}
.mod .top h2{font-size:17px;font-weight:600;text-transform:none;letter-spacing:0;font-family:Inter;line-height:1.3}
.mod .cerrar{margin-left:auto;border:1px solid var(--linea);background:var(--blanco);border-radius:9px;
  width:30px;height:30px;cursor:pointer;color:var(--gris);font-size:17px;line-height:1;flex:none}
.mod .cuerpo{padding:18px 20px}
.mod p{margin:0 0 12px;color:var(--tinta-2);font-size:14px;line-height:1.55}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.dato{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:10px 12px}
.dato .k{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.09em;color:var(--gris);text-transform:uppercase}
.dato .v{font-family:Oswald;font-weight:600;font-size:17px;margin-top:3px}
.gana{background:var(--ok-bg);border:1px solid #BFE0CC;border-radius:10px;padding:13px 15px;margin:14px 0}
.gana .k{font-family:Oswald;font-weight:600;font-size:11px;letter-spacing:.09em;color:var(--ok);text-transform:uppercase}
.gana .v{font-family:Oswald;font-weight:700;font-size:26px;color:var(--ok);line-height:1.1;margin-top:3px}
.gana .d{font-size:12.5px;color:var(--tinta-2);margin-top:5px}

.btn{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
  padding:11px 20px;border-radius:9px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn.mag{border-color:var(--magenta);background:var(--magenta)}
.btn.mag:hover{background:var(--magenta-oscuro);border-color:var(--magenta-oscuro)}
.btn.fan{background:transparent;color:var(--naranja-oscuro)}
.btn.tinta{background:var(--tinta);border-color:var(--tinta)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:9px;flex-wrap:wrap;margin-top:6px}

/* QR */
.qr-caja{text-align:center;padding:6px 0 2px}
.qr{width:190px;height:190px;margin:0 auto;background:var(--blanco);border:1px solid var(--linea);
  border-radius:12px;display:grid;place-items:center;padding:10px}
.qr svg{width:100%;height:100%;shape-rendering:crispEdges}
.qr-pie{font-size:12.5px;color:var(--gris);margin-top:10px;line-height:1.5}

/* mi cuenta */
.tarj{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:18px 20px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:15px 17px}
.kpi .k{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.09em;color:var(--gris);text-transform:uppercase}
.kpi .v{font-family:Oswald;font-weight:700;font-size:25px;margin-top:4px}
.kpi.ok .v{color:var(--ok)} .kpi.esp .v{color:var(--alerta)}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea)}
th{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-family:Oswald;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
  border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.esp{background:var(--alerta-bg);color:var(--alerta)}
.nota{background:var(--cielo-suave);border:1px solid #C9E2F2;border-radius:10px;padding:12px 14px;
  font-size:13px;line-height:1.55;color:var(--tinta-2);margin-top:12px}
.vacio{color:var(--gris);font-size:13.5px;padding:10px 2px}
@media(max-width:560px){.datos{grid-template-columns:1fr}}
</style>
</head><body>

<div class="aviso">Pantalla de prueba · los tours y los precios son reales, las ventas y la cartelera son de muestra</div>

<div class="cab"><div class="in">
  <div class="ava">Z</div>
  <div>
    <h1>Zuzú · Recepción</h1>
    <div class="sub">Casa Pepe CDMX · concierge de casa</div>
  </div>
  <div class="cod">Código <b>CPP-ZUZU-01</b></div>
</div></div>

<div class="tabs"><div class="in">
  <button class="tab" data-t="vender" aria-selected="true">Vender</button>
  <button class="tab" data-t="cuenta" aria-selected="false">Mi cuenta</button>
</div></div>

<div class="wrap">
  <div id="vista-vender"></div>
  <div id="vista-cuenta" hidden></div>
</div>

<dialog id="ficha"><div class="mod" id="ficha-in"></div></dialog>

<script>
(function(){
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mx(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}

function sesion(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
var SES=sesion();
function hdr(){return {'apikey':KEY,'Authorization':'Bearer '+((SES&&SES.access_token)||KEY)};}

/* El concierge que está usando la app. En la versión real sale de su sesión. */
var YO={nombre:'Zuzú', codigo:'CPP-ZUZU-01', tipo:'interno', hotel:'Casa Pepe CDMX'};

/* Cartelera: son de muestra y así se dicen. No son funciones reales en venta. */
var CARTELERA=[
  {nombre:'Concierto de muestra · Trío de cuerdas', categoria:'Concierto', pvp:450, duracion_min:90,
   operador:'Sala de muestra', muestra:true, resumen:'Ejemplo para ver cómo se vería la cartelera dentro de la app.'},
  {nombre:'Obra de muestra · Teatro de barrio', categoria:'Teatro', pvp:380, duracion_min:110,
   operador:'Foro de muestra', muestra:true, resumen:'Ejemplo de función de teatro. Los datos reales llegan cuando se conecte la cartelera.'},
  {nombre:'Danza de muestra · Folclor mexicano', categoria:'Teatro', pvp:520, duracion_min:100,
   operador:'Foro de muestra', muestra:true, resumen:'Ejemplo de espectáculo de danza para probar el carrusel.'}
];

var COLOR={'A pie':'#F2682A','Cultural':'#E2188E','Taller':'#1D6B4A','Taller o clase':'#1D6B4A',
           'Concierto':'#8C6212','Teatro':'#00689D'};
function colorDe(c){return COLOR[c]||'#6E665C';}

var EXPS=[];

async function traer(){
  var r=await fetch(SB+'/rest/v1/v_demo_experiencias?select=*&order=nombre.asc',{headers:hdr()});
  if(!r.ok)return [];
  return await r.json();
}

/* Lo que le queda al concierge por cada reserva. */
function loTuyo(e){ return Math.round((Number(e.pvp)||0) * (Number(e.concierge_pct)||10) / 100); }

/* Las galerías. Sin ventas todavía, «más vendidos» y «mejor valorados» se
   arman con un criterio explicado, no con un número inventado. */
function galerias(){
  var pub=EXPS.filter(function(e){return e.estado==='publicada' && e.pvp;});
  var favs=pub.filter(function(e){return ['Centro','Coyoacan','Mercados','Trajineras de Xoximilco','Food Tour Centro'].indexOf(e.nombre)>=0;});
  var nuevos=pub.slice().sort(function(a,b){return (b.created_at||'').localeCompare(a.created_at||'');}).slice(0,8);
  var manana=pub.filter(function(e){return e.categoria==='A pie';}).slice(0,6);
  var calidad=pub.slice().sort(function(a,b){
    var ra=(a.duracion_min||60)/(a.pvp||1), rb=(b.duracion_min||60)/(b.pvp||1); return rb-ra;}).slice(0,8);
  var vendidos=pub.slice().sort(function(a,b){return (b.pvp||0)-(a.pvp||0);}).slice(0,8);
  return [
    ['Tus favoritos','Los que marcaste para tenerlos siempre a mano.',favs],
    ['Los + vendidos','Hoy ordenados por ticket: cuando haya reservas, el orden lo dan las ventas.',vendidos],
    ['Los nuevos','Últimas fichas que entraron al catálogo.',nuevos],
    ['Salen mañana','Las salidas de mañana que todavía tienen sitio.',manana],
    ['Mejor calidad / precio','Más minutos de experiencia por peso.',calidad],
    ['Conciertos y teatro','Cartelera de muestra, para ver cómo entra en la app.',CARTELERA]
  ];
}

function cardHTML(e,i){
  var ini=(e.nombre||'?').trim().charAt(0).toUpperCase();
  var et = e.muestra ? '<span class="etq demo">muestra</span>'
        : (e.es_propio?'<span class="etq prop">propio</span>':'<span class="etq terc">'+esc(e.operador)+'</span>');
  return '<button class="card" data-exp="'+i+'">'+
    '<div class="foto" style="background:linear-gradient(135deg,'+colorDe(e.categoria)+',rgba(30,26,22,.85))">'+ini+'</div>'+
    '<div class="cuerpo">'+
      et+
      '<h3>'+esc(e.nombre)+'</h3>'+
      '<div class="meta">'+esc(e.categoria||'')+(e.duracion_min?' · '+Math.round(e.duracion_min/60)+' h':'')+'</div>'+
      '<div class="pie"><span class="pvp">'+mx(e.pvp)+'</span>'+
        '<span class="tuyo">te quedan '+mx(loTuyo(e))+'</span></div>'+
    '</div></button>';
}

var INDICE=[];
function pintaVender(){
  INDICE=[];
  var html=galerias().map(function(g){
    var items=g[2]||[];
    if(!items.length)return '';
    var cards=items.map(function(e){INDICE.push(e);return cardHTML(e,INDICE.length-1);}).join('');
    return '<div class="seccion"><div class="tit"><h2>'+esc(g[0])+'</h2>'+
      '<span class="cuenta">'+esc(g[1])+'</span></div>'+
      '<div class="carr">'+cards+'</div></div>';
  }).join('');
  document.getElementById('vista-vender').innerHTML = html ||
    '<div class="vacio">No se pudo leer el catálogo. Entra al panel y vuelve a abrir esta pantalla.</div>';
  Array.prototype.forEach.call(document.querySelectorAll('.card'),function(b){
    b.addEventListener('click',function(){abreFicha(INDICE[Number(b.dataset.exp)]);});
  });
}

/* ---- QR dibujado a mano: cuadrícula determinista a partir del texto.
   No es un QR que escanee: es el hueco visual del que sí lo será. ---- */
function qrFalso(txt){
  var n=29, celda=6, h=0;
  for(var i=0;i<txt.length;i++){h=(h*31+txt.charCodeAt(i))>>>0;}
  function rnd(x,y){var v=(h ^ (x*73856093) ^ (y*19349663))>>>0; v=(v^(v>>>13))>>>0; return (v%100)/100;}
  var r='<svg viewBox="0 0 '+(n*celda)+' '+(n*celda)+'" xmlns="http://www.w3.org/2000/svg">';
  r+='<rect width="100%" height="100%" fill="#fff"/>';
  function ojo(ox,oy){
    r+='<rect x="'+(ox*celda)+'" y="'+(oy*celda)+'" width="'+(7*celda)+'" height="'+(7*celda)+'" fill="#1E1A16"/>';
    r+='<rect x="'+((ox+1)*celda)+'" y="'+((oy+1)*celda)+'" width="'+(5*celda)+'" height="'+(5*celda)+'" fill="#fff"/>';
    r+='<rect x="'+((ox+2)*celda)+'" y="'+((oy+2)*celda)+'" width="'+(3*celda)+'" height="'+(3*celda)+'" fill="#1E1A16"/>';
  }
  for(var y=0;y<n;y++)for(var x=0;x<n;x++){
    var enOjo=(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);
    if(enOjo)continue;
    if(rnd(x,y)>0.52)r+='<rect x="'+(x*celda)+'" y="'+(y*celda)+'" width="'+celda+'" height="'+celda+'" fill="#1E1A16"/>';
  }
  ojo(0,0);ojo(n-7,0);ojo(0,n-7);
  return r+'</svg>';
}

function abreFicha(e){
  var d=document.getElementById('ficha');
  var tuyo=loTuyo(e);
  var efectivo = (YO.tipo==='interno');
  document.getElementById('ficha-in').innerHTML=
    '<div class="top">'+
      '<div><h2>'+esc(e.nombre)+'</h2>'+
      '<div style="color:var(--gris);font-size:12.5px;margin-top:3px">'+
        esc(e.categoria||'')+' · '+esc(e.operador||'')+(e.duracion_min?' · '+Math.round(e.duracion_min/60)+' h':'')+'</div></div>'+
      '<button class="cerrar" data-cierra>&times;</button>'+
    '</div>'+
    '<div class="cuerpo" id="paso">'+
      (e.resumen?'<p>'+esc(e.resumen)+'</p>':'')+
      '<div class="datos">'+
        '<div class="dato"><div class="k">Precio por persona</div><div class="v">'+mx(e.pvp)+'</div></div>'+
        '<div class="dato"><div class="k">Cupo</div><div class="v">'+(e.cupo_max||'—')+'</div></div>'+
      '</div>'+
      '<div class="gana"><div class="k">Lo que te queda a ti</div><div class="v">'+mx(tuyo)+'</div>'+
        '<div class="d">'+esc(e.concierge_pct||10)+'% de cada reserva. Se valida cuando el huésped hace el tour, y se te paga 15 días después.</div></div>'+
      '<div class="btns">'+
        '<button class="btn" data-reservar>Reservar</button>'+
        (efectivo?'<button class="btn tinta" data-efectivo>Cobrar en efectivo</button>':'')+
      '</div>'+
      (efectivo?'<div class="nota">Cobras en efectivo porque eres de casa: la caja de Casa Pepe y la de Sincrético son la misma. Un concierge de otro hotel no ve este botón.</div>':'')+
    '</div>';
  d.showModal();
  d.querySelector('[data-cierra]').onclick=function(){d.close();};
  var rb=d.querySelector('[data-reservar]'); if(rb)rb.onclick=function(){pasoQR(e,'tarjeta');};
  var eb=d.querySelector('[data-efectivo]'); if(eb)eb.onclick=function(){pasoQR(e,'efectivo');};
}

function pasoQR(e,modo){
  var folio='SIN-'+String(Math.floor(Math.random()*9000)+1000);
  var liga='https://sincretico.mx/r/'+folio+'?c='+YO.codigo;
  document.getElementById('paso').innerHTML=
    '<div class="qr-caja">'+
      '<div class="qr">'+qrFalso(liga)+'</div>'+
      '<div class="qr-pie"><b>'+esc(folio)+'</b><br>Que el huésped lo escanee: ahí mete sus datos y '+
      (modo==='efectivo'?'confirma. El cobro lo haces tú en la caja.':'paga con tarjeta.')+'</div>'+
    '</div>'+
    '<div class="datos" style="margin-top:16px">'+
      '<div class="dato"><div class="k">Experiencia</div><div class="v" style="font-size:13.5px;font-family:Inter;font-weight:600">'+esc(e.nombre)+'</div></div>'+
      '<div class="dato"><div class="k">Tu código</div><div class="v" style="font-size:15px">'+esc(YO.codigo)+'</div></div>'+
    '</div>'+
    '<div class="nota">La reserva queda atada a <b>'+esc(YO.codigo)+'</b>, así que la comisión se te atribuye sola. '+
      (modo==='efectivo'?'Al cobrar en efectivo, el movimiento entra al cuadre del día como cualquier otro ticket de la casa.':'')+
    '</div>'+
    '<div class="btns"><button class="btn fan" data-cierra2>Listo</button></div>';
  document.querySelector('[data-cierra2]').onclick=function(){document.getElementById('ficha').close();};
}

/* ---- Mi cuenta ---- */
var VENTAS=[
  {fecha:'2026-09-19', exp:'Trajineras de Xoximilco', pax:2, pvp:1000, estado:'pagado',   tour:'2026-09-28'},
  {fecha:'2026-09-17', exp:'Centro',                  pax:4, pvp:50,   estado:'realizado',tour:'2026-09-18'},
  {fecha:'2026-09-11', exp:'Food Tour Centro',        pax:2, pvp:450,  estado:'realizado',tour:'2026-09-12'},
  {fecha:'2026-09-02', exp:'Luchas Arena Coliseo',    pax:3, pvp:900,  estado:'realizado',tour:'2026-09-03'},
  {fecha:'2026-08-24', exp:'Mercados',                pax:5, pvp:50,   estado:'realizado',tour:'2026-08-25'}
];
function pintaCuenta(){
  var hoy=new Date('2026-09-21');
  var pagado=0,esperando=0,filas='';
  VENTAS.forEach(function(v){
    var com=Math.round(v.pvp*v.pax*0.10);
    var dias=Math.floor((hoy-new Date(v.tour))/86400000);
    var libre = v.estado==='realizado' && dias>=15;
    if(libre)pagado+=com; else esperando+=com;
    filas+='<tr><td>'+v.fecha+'</td><td>'+esc(v.exp)+'</td><td class="num">'+v.pax+'</td>'+
      '<td class="num">'+mx(v.pvp*v.pax)+'</td><td class="num">'+mx(com)+'</td>'+
      '<td>'+(libre?'<span class="pill ok">liberada</span>'
                   :'<span class="pill esp">'+(v.estado==='pagado'?'falta el tour':'faltan '+(15-dias)+' d')+'</span>')+'</td></tr>';
  });
  document.getElementById('vista-cuenta').innerHTML=
    '<div class="kpis">'+
      '<div class="kpi ok"><div class="k">Liberado para cobro</div><div class="v">'+mx(pagado)+'</div></div>'+
      '<div class="kpi esp"><div class="k">En espera</div><div class="v">'+mx(esperando)+'</div></div>'+
      '<div class="kpi"><div class="k">Ventas del mes</div><div class="v">'+VENTAS.length+'</div></div>'+
      '<div class="kpi"><div class="k">Tu comisión</div><div class="v">10%</div></div>'+
    '</div>'+
    '<div class="tarj" style="margin-top:14px">'+
      '<h2 style="font-size:14px;font-weight:600">Tus ventas</h2>'+
      '<table><thead><tr><th>Reservada</th><th>Experiencia</th><th>Pax</th><th>Venta</th><th>Tu parte</th><th>Estado</th></tr></thead>'+
      '<tbody>'+filas+'</tbody></table>'+
      '<div class="nota">Una comisión se libera cuando el huésped <b>hizo el tour</b> y pasaron <b>15 días</b>. '+
      'Ese plazo existe para que no se pague una venta que después se reclama.</div>'+
    '</div>';
}

/* pestañas */
Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
  b.addEventListener('click',function(){
    Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(o){
      o.setAttribute('aria-selected',String(o===b));});
    document.getElementById('vista-vender').hidden = b.dataset.t!=='vender';
    document.getElementById('vista-cuenta').hidden = b.dataset.t!=='cuenta';
  });
});

traer().then(function(rows){ EXPS=rows||[]; pintaVender(); pintaCuenta(); });
})();
</script>
