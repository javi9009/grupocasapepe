<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bitácora de mantenimientos</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- BITÁCORA DE MANTENIMIENTOS PREVENTIVOS.
     Cuándo se le dio el preventivo a cada área y a cada habitación, y cuándo toca el
     siguiente. No es una bandeja de trabajo -eso vive en Mantenimiento-: es el registro,
     para saberlo de un vistazo y poder responder "¿cuándo se revisó esto?". Javi, 3-oct. -->
<style>
:root{
  --ground:#F4F1EA; --blanco:#fff; --tinta:#2c2c2a; --gris:#5f5e5a; --tenue:#8a897f;
  --linea:rgba(0,0,0,.10); --verde:#1d9e75; --ambar:#C98A1A; --rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{max-width:1120px;margin:0 auto;padding:24px 16px 4px}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.top .sub{color:var(--gris);font-size:13px;margin-top:5px}
.barra{max-width:1120px;margin:14px auto 0;padding:0 16px;display:flex;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--blanco);border:1px solid var(--linea);border-radius:99px;padding:3px}
.seg button{border:0;background:none;font:inherit;font-size:12.5px;font-weight:600;color:var(--gris);padding:6px 14px;border-radius:99px;cursor:pointer}
.seg button.on{background:var(--tinta);color:#fff}
.wrap{max-width:1120px;margin:16px auto 0;padding:0 16px 60px}
.ubic{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);margin-bottom:12px;overflow:hidden}
.uh{display:flex;align-items:baseline;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linea);cursor:pointer}
.uh .un{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.01em}
.uh .ut{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}
.uh .ur{margin-left:auto;font-size:12px;color:var(--gris)}
.uh .cae{color:var(--tenue);font-size:13px;margin-left:6px}
.tareas{display:none}
.ubic.open .tareas{display:block}
.tr{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:9px 16px;border-bottom:1px solid var(--linea)}
.tr:last-child{border-bottom:0}
.tr .tn{font-weight:600;font-size:13px}
.tr .to{color:var(--tenue);font-size:11px;margin-top:1px}
.tr .c{font-size:12px;color:var(--gris);text-align:right;white-space:nowrap}
.tr .c .k{display:block;font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue)}
.pill{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.03em;border-radius:99px;padding:2px 9px;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--verde)} .warn{color:var(--ambar)} .bad{color:var(--rojo)}
.crit{color:var(--rojo);font-size:10px;font-weight:700;margin-left:6px}
.dash{color:var(--tenue)}
.vacio{color:var(--tenue);font-size:13px;padding:30px 4px}
@media(max-width:640px){ .tr{grid-template-columns:1fr auto;row-gap:4px} .tr .c.hide-sm{display:none} .top h1{font-size:21px} }
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Mantenimiento</div>
  <h1>Bitácora de mantenimientos</h1>
  <div class="sub" id="sub">Cuándo se dio el preventivo a cada área y habitación.</div>
</div>
<div class="barra">
  <div class="seg" id="segProp"></div>
  <div class="seg" id="segTipo">
    <button data-t="todas" class="on">Todas</button>
    <button data-t="area">Áreas</button>
    <button data-t="habitacion">Habitaciones</button>
  </div>
</div>
<div class="wrap"><div id="lista"><div class="vacio">Cargando…</div></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const PROPS=[['cdmx','CDMX','45e69775-d877-4507-a9e1-a45bd3400dc5'],
             ['puebla','Puebla','febfbef6-7fd1-4b45-84d9-13533e8dcb72'],
             ['virreyes','Virreyes','3e10a9ea-4913-4f7c-86ef-0c829caa851d']];
const FREC_DIAS={semanal:7,catorcenal:14,quincenal:15,mensual:30,bimestral:60,trimestral:90,cuatrimestral:120,semestral:180,anual:365};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function hoyD(){ return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})); }
function d2(s){ return s?new Date(String(s).slice(0,10)+'T00:00:00'):null; }
function fFecha(s){ if(!s) return null; const p=String(s).slice(0,10).split('-'); return (+p[2])+' '+MESES[(+p[1])-1]+' '+p[0].slice(2); }
function dias(a,b){ if(!a||!b)return null; return Math.round((b-a)/86400000); }
function maxD(){ let m=null; for(const x of arguments){ const d=d2(x); if(d&&(!m||d>m))m=d; } return m; }

let PROP='cdmx', TIPO='todas';
(function(){ const q=new URLSearchParams(location.search).get('prop'); if(q&&PROPS.some(p=>p[0]===q))PROP=q; })();

function pintaSeg(){
  $('#segProp').innerHTML=PROPS.map(p=>'<button data-p="'+p[0]+'"'+(p[0]===PROP?' class="on"':'')+'>'+p[1]+'</button>').join('');
  $('#segProp').querySelectorAll('button').forEach(b=>b.onclick=()=>{PROP=b.dataset.p;pintaSeg();cargar();});
  $('#segTipo').querySelectorAll('button').forEach(b=>b.onclick=()=>{TIPO=b.dataset.t;$('#segTipo').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));render();});
}

let UBIC=[], CAT=[], byUbic={}, PLAN={}, LOG={};
async function cargar(){
  $('#lista').innerHTML='<div class="vacio">Cargando…</div>';
  const pid=(PROPS.find(p=>p[0]===PROP)||[])[2];
  const [u,c,pl,lg]=await Promise.all([
    sb.from('mtto_ubicaciones').select('id,tipo,nombre,codigo,piso,orden').eq('property_id',pid).eq('activo',true).order('orden'),
    sb.from('mtto_preventivos_catalogo').select('id,ubicacion_id,tarea,periodicidad,ultimo_realizado,oficio,critico').eq('property_id',pid).eq('activo',true),
    sb.from('mtto_preventivo_plan').select('catalogo_id,semana_programada,estado,fecha_realizada').eq('property_id',pid),
    sb.from('mtto_preventivo_log').select('catalogo_id,fecha').eq('property_id',pid)
  ]);
  UBIC=u.data||[]; CAT=c.data||[];
  PLAN={}; (pl.data||[]).forEach(r=>{ (PLAN[r.catalogo_id]=PLAN[r.catalogo_id]||[]).push(r); });
  LOG={}; (lg.data||[]).forEach(r=>{ const d=d2(r.fecha); if(d&&(!LOG[r.catalogo_id]||d>LOG[r.catalogo_id]))LOG[r.catalogo_id]=d; });
  byUbic={}; CAT.forEach(t=>{ (byUbic[t.ubicacion_id]=byUbic[t.ubicacion_id]||[]).push(t); });
  render();
}

function estadoTarea(t){
  const h=hoyD();
  const plan=PLAN[t.id]||[];
  // Último: lo que diga el catálogo, la última realizada del plan, o el log.
  let ultReal=t.ultimo_realizado;
  plan.forEach(p=>{ if(p.fecha_realizada){ const m=maxD(ultReal,p.fecha_realizada); ultReal=m?m.toISOString().slice(0,10):ultReal; } });
  if(LOG[t.id]){ const m=maxD(ultReal, LOG[t.id].toISOString().slice(0,10)); ultReal=m?m.toISOString().slice(0,10):ultReal; }
  // Próximo: la siguiente planeada no realizada; si no hay, último + periodicidad.
  let prox=null;
  plan.forEach(p=>{ if(!p.fecha_realizada && p.semana_programada){ const d=d2(p.semana_programada); if(d&&(!prox||d<prox))prox=d; } });
  if(!prox && ultReal && FREC_DIAS[t.periodicidad]){ prox=d2(ultReal); prox.setDate(prox.getDate()+FREC_DIAS[t.periodicidad]); }
  const dProx = prox? dias(h,prox) : null;
  let cls='ok', txt='al día';
  if(!ultReal && !prox){ cls='warn'; txt='sin registro'; }
  else if(dProx==null){ cls='ok'; txt=ultReal?'al día':'—'; }
  else if(dProx<0){ cls='bad'; txt='vencido hace '+(-dProx)+' d'; }
  else if(dProx<=7){ cls='warn'; txt='en '+dProx+' d'; }
  const sev = cls==='bad'?0:(cls==='warn'?1:2);
  return {cls,txt,sev,ultimo:ultReal,proximo:prox?prox.toISOString().slice(0,10):null};
}

function render(){
  if(!UBIC.length){ $('#lista').innerHTML='<div class="vacio">No hay ubicaciones de mantenimiento en esta propiedad.</div>'; return; }
  const ubs=UBIC.filter(u=>TIPO==='todas'||u.tipo===TIPO);
  let totT=0, totVenc=0;
  const bloques=ubs.map(u=>{
    const tareas=(byUbic[u.id]||[]).map(t=>({t,e:estadoTarea(t)}));
    if(!tareas.length) return null;
    tareas.sort((a,b)=> a.e.sev-b.e.sev || String(a.t.tarea).localeCompare(String(b.t.tarea)));
    const venc=tareas.filter(x=>x.e.cls==='bad').length; totVenc+=venc; totT+=tareas.length;
    const resumen = venc? ('<span class="bad">'+venc+' vencido'+(venc>1?'s':'')+'</span>') : '<span class="ok">al día</span>';
    const filas=tareas.map(x=>{
      const t=x.t, e=x.e;
      return '<div class="tr">'
        +'<div><div class="tn">'+esc(t.tarea)+(t.critico?'<span class="crit">crítico</span>':'')+'</div>'
          +'<div class="to">'+esc(t.periodicidad||'')+(t.oficio?(' · '+esc(t.oficio)):'')+'</div></div>'
        +'<div class="c hide-sm"><span class="k">Último</span>'+(e.ultimo?esc(fFecha(e.ultimo)):'<span class="dash">nunca</span>')+'</div>'
        +'<div class="c hide-sm"><span class="k">Próximo</span>'+(e.proximo?esc(fFecha(e.proximo)):'<span class="dash">—</span>')+'</div>'
        +'<div class="c"><span class="pill '+e.cls+'">'+esc(e.txt)+'</span></div>'
        +'</div>';
    }).join('');
    const openCls = venc? ' open':'';
    return '<div class="ubic'+openCls+'">'
      +'<div class="uh"><span class="un">'+esc(u.nombre||u.codigo||'—')+'</span>'
        +'<span class="ut">'+(u.tipo==='habitacion'?'habitación':'área')+'</span>'
        +'<span class="ur">'+resumen+' · '+tareas.length+' tarea'+(tareas.length>1?'s':'')+'<span class="cae">▾</span></span></div>'
      +'<div class="tareas">'+filas+'</div></div>';
  }).filter(Boolean).join('');
  $('#sub').innerHTML = totT+' tareas preventivas · '+(totVenc?('<b>'+totVenc+'</b> vencidas'):'ninguna vencida ✓');
  $('#lista').innerHTML = bloques || '<div class="vacio">Sin tareas preventivas para este filtro.</div>';
  $('#lista').querySelectorAll('.uh').forEach(h=>h.onclick=()=>h.parentNode.classList.toggle('open'));
}

pintaSeg();
sb.auth.getSession().then(({data})=>{ if(!data||!data.session){ $('#lista').innerHTML='<div class="vacio">Abre esta pantalla desde el panel (necesita tu sesión).</div>'; return; } cargar(); });
</script>
</body></html>
