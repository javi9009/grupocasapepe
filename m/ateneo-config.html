<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Configuración del Ateneo</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CONFIGURACIÓN DEL ATENEO (nativo en el panel, reemplaza /ateneo/admin/).
     Pestañas: Coworking (planes ateneo_planes + espacios ateneo_lugares),
     Ateneo (contratos), Residencias (espacios), Descuentos (ateneo_cine_codigos).
     Mismo fondo crema y header que el Calendario. Javi, 4-oct. -->
<style>
:root{--ground:#F4F1EA;--blanco:#fff;--tinta:#2c2c2a;--gris:#5f5e5a;--tenue:#8a897f;
  --linea:rgba(0,0,0,.10);--cow:#1F6FB2;--res:#9A5B2E;--oro:#C98A1A;--verde:#1d9e75;--rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
.top{max-width:1100px;margin:0 auto;padding:24px 16px 0}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.secnav{max-width:1100px;margin:12px auto 0;padding:0 16px;display:flex;gap:4px;border-bottom:1px solid var(--linea);position:sticky;top:0;background:var(--ground);z-index:5;flex-wrap:wrap}
.secnav button{font:inherit;border:0;background:none;padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--gris);border-bottom:3px solid transparent;margin-bottom:-1px}
.secnav button.on{color:var(--tinta);border-bottom-color:var(--tinta)}
.wrap{max-width:1100px;margin:16px auto 0;padding:0 16px 70px}
.sec-h{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin:22px 0 10px}
.sec-h:first-child{margin-top:4px}
.sec-h h2{margin:0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:16px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);padding:13px 15px}
.card .t{font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:15px}
.card .sub{color:var(--tenue);font-size:12px;margin:2px 0 6px}
.card .row{font-size:13px;margin:2px 0}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:4px}
.acts{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
table{border-collapse:collapse;width:100%;background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;font-size:13px}
th,td{border-bottom:1px solid var(--linea);padding:8px 10px;text-align:left}
th{background:#faf8f3;font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--gris)}
tr:last-child td{border-bottom:0}
td input,td select{width:100%;font:inherit;font-size:13px;border:1px solid var(--linea);border-radius:7px;padding:6px 8px;background:#fff}
.btn{font:inherit;font-weight:600;font-size:13px;border-radius:99px;padding:7px 14px;cursor:pointer;border:1px solid var(--linea);background:#fff;color:var(--gris)}
.btn:hover{border-color:var(--tinta);color:var(--tinta)}
.btn.pri{background:var(--tinta);border-color:var(--tinta);color:#fff}
.btn.sm{padding:5px 11px;font-size:12px}
.btn.x{color:var(--rojo);border-color:#e8c7bf}
.empty{color:var(--tenue);text-align:center;padding:26px;background:#fff;border:1px dashed var(--linea);border-radius:12px}
.gate{max-width:1100px;margin:50px auto;padding:0 16px;text-align:center;color:var(--tenue)}
.note{background:#fff;border:1px solid var(--linea);border-left:3px solid var(--oro);border-radius:10px;padding:11px 13px;font-size:13px;color:var(--gris);margin-bottom:12px}
/* modal */
.rmodal{position:fixed;inset:0;background:rgba(20,16,12,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.rmodal.on{display:flex}
.rmodal-card{background:#fff;border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.5);width:100%;max-width:500px;padding:20px 20px 16px;max-height:92vh;overflow:auto}
.rmodal-card h3{margin:0 0 12px;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:18px;text-transform:uppercase}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--gris);font-weight:600;margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;font-size:14px;border:1px solid var(--linea);border-radius:9px;padding:9px 11px;background:#fff;color:var(--tinta)}
.fld textarea{min-height:72px;resize:vertical}
.chk{font-weight:400;display:flex;align-items:center;gap:7px;font-size:14px;margin:4px 0}
.chk input{width:auto}
.rm-row{display:flex;gap:10px}.rm-row .fld{flex:1}
.msg{display:none;border-radius:9px;padding:9px 11px;font-size:13px;margin-bottom:10px}
.msg.err{display:block;background:#fbe9e6;color:var(--rojo)}
.rm-acts{display:flex;align-items:center;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Ateneo</div>
  <h1>Configuración del Ateneo</h1>
</div>
<div class="secnav" id="secnav">
  <button data-t="coworking" class="on">Coworking</button>
  <button data-t="ateneo">Ateneo</button>
  <button data-t="residencias">Residencias</button>
  <button data-t="descuentos">Descuentos</button>
</div>
<div class="wrap" id="wrap"><div class="gate">Cargando…</div></div>

<div class="rmodal" id="modal"><div class="rmodal-card" id="modal-card"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dinero=n=>'$'+Number(n||0).toLocaleString('es-MX');
const PER=['mensual','dia','semana','anual'];
const PER_TXT={mensual:'al mes',dia:'por día',semana:'por semana',anual:'al año'};
let TAB='coworking', hasSession=false;

function modalOpen(html){$('modal-card').innerHTML=html;$('modal').classList.add('on');}
function modalClose(){$('modal').classList.remove('on');}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')modalClose();});

/* ===================== COWORKING: planes + espacios ===================== */
async function vCoworking(){
  const [pl,lg]=await Promise.all([
    sb.from('ateneo_planes').select('*').order('orden'),
    sb.from('ateneo_lugares').select('*').eq('categoria','coworking').order('orden')
  ]);
  const planes=pl.data||[], lug=lg.data||[];
  let h='<div class="note">Esto es lo que ve la web <b>y lo que cobra Stripe</b>. Si hay precio de lanzamiento, ese es el que se cobra.</div>';
  h+='<div class="sec-h"><h2>💳 Membresías / planes</h2><button class="btn pri sm" id="planNew">＋ Nuevo plan</button></div>';
  if(!planes.length)h+='<div class="empty">Aún no hay planes.</div>';
  else h+='<div class="grid">'+planes.map(p=>{
    const lanz=Number(p.precio_lanzamiento||0)>0, cobra=lanz?p.precio_lanzamiento:p.precio;
    return '<div class="card"><div class="t">'+esc(p.nombre)
      +(p.activo?'<span class="badge" style="background:#1f9d551a;color:#1f9d55">Activo</span>':'<span class="badge" style="background:#6b7a701a;color:#9aa79a">Oculto</span>')
      +(p.destacado?'<span class="badge" style="background:#f5c4001a;color:#b98a00">Recomendado</span>':'')+'</div>'
      +'<div class="sub">'+esc(p.slug||'')+' · '+esc(PER_TXT[p.periodo]||p.periodo||'')+'</div>'
      +'<div class="row">Lista <b>'+dinero(p.precio)+'</b>'+(lanz?' · lanz. <b style="color:var(--oro)">'+dinero(p.precio_lanzamiento)+'</b>':'')+'</div>'
      +'<div class="row">Cobra <b>'+dinero(cobra)+'</b> · '+(p.cobro_recurrente&&p.periodo==='mensual'?'suscripción':'una vez')+'</div>'
      +'<div class="acts"><button class="btn sm plEdit" data-id="'+p.id+'">✏️ Editar</button><button class="btn sm plTog" data-id="'+p.id+'">'+(p.activo?'Ocultar':'Activar')+'</button></div></div>';
  }).join('')+'</div>';
  h+='<div class="sec-h"><h2>🪑 Espacios de coworking</h2><button class="btn pri sm" id="espNew">＋ Agregar espacio</button></div>';
  h+=espaciosTabla(lug,'coworking');
  $('wrap').innerHTML=h;
  $('planNew').onclick=()=>openPlan(null);
  document.querySelectorAll('.plEdit').forEach(b=>b.onclick=()=>openPlan(planes.find(x=>x.id===b.dataset.id)));
  document.querySelectorAll('.plTog').forEach(b=>b.onclick=async()=>{const p=planes.find(x=>x.id===b.dataset.id);const{error}=await sb.from('ateneo_planes').update({activo:!p.activo}).eq('id',p.id);if(error)alert(error.message);else vCoworking();});
  bindEspacios('coworking',vCoworking);
}
function openPlan(p){
  const g=(l,v)=>'<div class="fld"><label>'+l+'</label>'+v+'</div>';
  modalOpen('<h3>'+(p?'Editar plan':'Nuevo plan')+'</h3><div class="msg err" id="pl-err"></div>'
    +g('Nombre','<input id="pl-nombre" value="'+esc(p?p.nombre:'')+'">')
    +'<div class="rm-row">'+g('Slug (para la web)','<input id="pl-slug" value="'+esc(p?p.slug:'')+'">')
      +g('Periodo','<select id="pl-per">'+PER.map(x=>'<option value="'+x+'"'+(p&&p.periodo===x?' selected':'')+'>'+PER_TXT[x]+'</option>').join('')+'</select>')+'</div>'
    +'<div class="rm-row">'+g('Precio lista','<input id="pl-precio" type="number" min="0" value="'+(p?p.precio||0:0)+'">')
      +g('Precio lanzamiento','<input id="pl-lanz" type="number" min="0" value="'+(p?p.precio_lanzamiento||'':'')+'">')+'</div>'
    +g('Qué incluye (uno por línea)','<textarea id="pl-incluye">'+esc(p&&Array.isArray(p.incluye)?p.incluye.join("\\n"):'')+'</textarea>')
    +g('Nota','<input id="pl-nota" value="'+esc(p?p.nota||'':'')+'">')
    +'<label class="chk"><input type="checkbox" id="pl-rec"'+(p&&p.cobro_recurrente?' checked':'')+'> Cobro recurrente (suscripción mensual)</label>'
    +'<label class="chk"><input type="checkbox" id="pl-dest"'+(p&&p.destacado?' checked':'')+'> Recomendado</label>'
    +'<label class="chk"><input type="checkbox" id="pl-act"'+(!p||p.activo?' checked':'')+'> Activo (visible en la web)</label>'
    +'<div class="rm-acts"><span style="flex:1"></span><button class="btn sm" id="pl-cancel">Cancelar</button><button class="btn pri sm" id="pl-save">Guardar</button></div>');
  $('pl-cancel').onclick=modalClose;
  $('pl-save').onclick=async()=>{
    const er=m=>{$('pl-err').textContent=m;$('pl-err').style.display='block';};
    const nombre=$('pl-nombre').value.trim();if(!nombre)return er('Pon un nombre.');
    const incluye=$('pl-incluye').value.split('\n').map(s=>s.trim()).filter(Boolean);
    const row={nombre,slug:$('pl-slug').value.trim()||null,periodo:$('pl-per').value,
      precio:Number($('pl-precio').value||0),precio_lanzamiento:$('pl-lanz').value?Number($('pl-lanz').value):null,
      incluye,nota:$('pl-nota').value.trim()||null,cobro_recurrente:$('pl-rec').checked,destacado:$('pl-dest').checked,activo:$('pl-act').checked};
    const res=p?await sb.from('ateneo_planes').update(row).eq('id',p.id):await sb.from('ateneo_planes').insert(row);
    if(res.error)return er('No se pudo guardar: '+res.error.message);
    modalClose();vCoworking();
  };
}

/* ===================== ESPACIOS (coworking / residencias) ===================== */
function espaciosTabla(lug,cat){
  if(!lug.length)return '<div class="empty">Aún no hay espacios.</div>';
  return '<table><thead><tr><th>Número / nombre</th><th>Tipo</th><th>Pax</th><th>Activo</th><th></th></tr></thead><tbody>'
    +lug.map(l=>'<tr data-id="'+l.id+'">'
      +'<td><input data-f="numero" value="'+esc(l.numero||'')+'"></td>'
      +'<td><input data-f="tipo" value="'+esc(l.tipo||'')+'"></td>'
      +'<td style="max-width:70px"><input data-f="capacidad" type="number" min="0" value="'+(l.capacidad!=null?l.capacidad:1)+'"></td>'
      +'<td style="max-width:70px"><input data-f="activo" type="checkbox"'+(l.activo!==false?' checked':'')+'></td>'
      +'<td style="white-space:nowrap"><button class="btn sm espSave" data-id="'+l.id+'">Guardar</button> <button class="btn sm x espDel" data-id="'+l.id+'">×</button></td></tr>').join('')
    +'</tbody></table>';
}
function bindEspacios(cat,reload){
  $('espNew')&&($('espNew').onclick=async()=>{
    const numero=prompt('Número / nombre del espacio:');if(!numero)return;
    const tipo=prompt('Tipo (ej. Coworking, Dormitorio · 6 camas, Privada…):','')||'';
    const cap=Number(prompt('Capacidad (pax / camas):','1')||1);
    const {error}=await sb.from('ateneo_lugares').insert({numero,tipo,capacidad:cap,categoria:cat,activo:true,orden:9999});
    if(error)alert(error.message);else reload();
  });
  document.querySelectorAll('.espSave').forEach(b=>b.onclick=async()=>{
    const tr=b.closest('tr');const patch={};tr.querySelectorAll('[data-f]').forEach(el=>{const f=el.getAttribute('data-f');patch[f]=el.type==='checkbox'?el.checked:(f==='capacidad'?Number(el.value||0):el.value.trim());});
    const {error}=await sb.from('ateneo_lugares').update(patch).eq('id',b.dataset.id);
    if(error)alert(error.message);else reload();
  });
  document.querySelectorAll('.espDel').forEach(b=>b.onclick=async()=>{
    if(!confirm('¿Eliminar este espacio?'))return;
    const {error}=await sb.from('ateneo_lugares').delete().eq('id',b.dataset.id);
    if(error)alert(error.message);else reload();
  });
}

/* ===================== RESIDENCIAS: espacios ===================== */
async function vResidencias(){
  const {data,error}=await sb.from('ateneo_lugares').select('*').eq('categoria','residencias').order('orden');
  if(error){$('wrap').innerHTML='<div class="gate">No se pudo leer: '+esc(error.message)+'</div>';return;}
  let h='<div class="note">Estas habitaciones alimentan el <b>calendario de residencias</b>. Pax = camas (dorm) o capacidad del cuarto (privada).</div>';
  h+='<div class="sec-h"><h2>🛏 Habitaciones de residencias</h2><button class="btn pri sm" id="espNew">＋ Agregar habitación</button></div>';
  h+=espaciosTabla(data||[],'residencias');
  $('wrap').innerHTML=h;
  bindEspacios('residencias',vResidencias);
}

/* ===================== DESCUENTOS: códigos ===================== */
const COD_TIPO={cortesia:'Cortesía (100%)',porcentaje:'% de descuento',precio_especial:'Precio especial'};
async function vDescuentos(){
  const {data,error}=await sb.from('ateneo_cine_codigos').select('*').order('created_at',{ascending:false});
  if(error){$('wrap').innerHTML='<div class="gate">No se pudo leer: '+esc(error.message)+'</div>';return;}
  const cods=data||[];
  let h='<div class="note">Códigos de descuento (cine / teatro / eventos). Si no se limitan a un evento, aplican a todos.</div>';
  h+='<div class="sec-h"><h2>🏷 Códigos de descuento</h2><button class="btn pri sm" id="codNew">＋ Nuevo código</button></div>';
  if(!cods.length)h+='<div class="empty">Aún no hay códigos.</div>';
  else h+='<div class="grid">'+cods.map(c=>'<div class="card"><div class="t">'+esc(c.codigo)
      +(c.activo?'<span class="badge" style="background:#1f9d551a;color:#1f9d55">Activo</span>':'<span class="badge" style="background:#6b7a701a;color:#9aa79a">Inactivo</span>')+'</div>'
      +'<div class="sub">'+esc(COD_TIPO[c.tipo]||c.tipo)+(c.tipo!=='cortesia'?' · '+esc(c.valor):'')+'</div>'
      +'<div class="row">Usos: '+(c.usos||0)+(c.usos_max?(' / '+c.usos_max):'')+(c.vence?(' · vence '+String(c.vence).slice(0,10)):'')+'</div>'
      +'<div class="acts"><button class="btn sm codEdit" data-id="'+c.id+'">✏️ Editar</button><button class="btn sm codTog" data-id="'+c.id+'">'+(c.activo?'Desactivar':'Activar')+'</button></div></div>').join('')+'</div>';
  $('wrap').innerHTML=h;
  $('codNew').onclick=()=>openCod(null);
  document.querySelectorAll('.codEdit').forEach(b=>b.onclick=()=>openCod(cods.find(x=>x.id===b.dataset.id)));
  document.querySelectorAll('.codTog').forEach(b=>b.onclick=async()=>{const c=cods.find(x=>x.id===b.dataset.id);const{error}=await sb.from('ateneo_cine_codigos').update({activo:!c.activo}).eq('id',c.id);if(error)alert(error.message);else vDescuentos();});
}
function openCod(c){
  const g=(l,v)=>'<div class="fld"><label>'+l+'</label>'+v+'</div>';
  modalOpen('<h3>'+(c?'Editar código':'Nuevo código')+'</h3><div class="msg err" id="cd-err"></div>'
    +'<div class="rm-row">'+g('Código','<input id="cd-cod" value="'+esc(c?c.codigo:'')+'" style="text-transform:uppercase">')
      +g('Tipo','<select id="cd-tipo">'+Object.keys(COD_TIPO).map(k=>'<option value="'+k+'"'+(c&&c.tipo===k?' selected':'')+'>'+COD_TIPO[k]+'</option>').join('')+'</select>')+'</div>'
    +g('Valor (% o precio; vacío en cortesía)','<input id="cd-val" type="number" min="0" value="'+(c&&c.valor!=null?c.valor:'')+'">')
    +'<div class="rm-row">'+g('Vence (opcional)','<input id="cd-vence" type="date" value="'+(c&&c.vence?String(c.vence).slice(0,10):'')+'">')
      +g('Usos máx (opcional)','<input id="cd-max" type="number" min="1" value="'+(c&&c.usos_max?c.usos_max:'')+'">')+'</div>'
    +'<label class="chk"><input type="checkbox" id="cd-act"'+(!c||c.activo?' checked':'')+'> Activo</label>'
    +'<div class="rm-acts"><span style="flex:1"></span><button class="btn sm" id="cd-cancel">Cancelar</button><button class="btn pri sm" id="cd-save">Guardar</button></div>');
  $('cd-cancel').onclick=modalClose;
  $('cd-save').onclick=async()=>{
    const er=m=>{$('cd-err').textContent=m;$('cd-err').style.display='block';};
    const codigo=$('cd-cod').value.trim().toUpperCase();if(!codigo)return er('Pon un código.');
    const row={codigo,tipo:$('cd-tipo').value,valor:$('cd-val').value?Number($('cd-val').value):null,
      vence:$('cd-vence').value||null,usos_max:$('cd-max').value?Number($('cd-max').value):null,activo:$('cd-act').checked};
    const res=c?await sb.from('ateneo_cine_codigos').update(row).eq('id',c.id):await sb.from('ateneo_cine_codigos').insert(row);
    if(res.error)return er('No se pudo guardar: '+res.error.message);
    modalClose();vDescuentos();
  };
}

/* ===================== ATENEO: contratos ===================== */
const CONTRATO_URL='https://grupocasapepe.netlify.app/ateneo/contrato.html';
const CT_EST={borrador:['#6b7a70','Borrador'],enviado:['#C98A1A','Enviado'],firmado:['#1f9d55','Firmado por el cliente'],contrafirmado:['#1f9d55','Firmado por ambos']};
async function vAteneo(){
  let cts=[];
  try{ const r=await sb.functions.invoke('contrato-admin',{body:{accion:'lista'}});
    if(r.error)throw r.error; cts=(r.data&&r.data.contratos)||[]; }
  catch(e){ $('wrap').innerHTML='<div class="note">Contratos de coworking del Ateneo.</div><div class="empty">No se pudieron leer los contratos: '+esc(e.message||e)+'</div>';return; }
  let h='<div class="note">Contratos de coworking del Ateneo. Puedes <b>ver</b> cada contrato, <b>reenviar</b> la liga de firma y saber <b>a quién</b> se mandó.</div>';
  h+='<div class="sec-h"><h2>📄 Contratos</h2></div>';
  if(!cts.length){h+='<div class="empty">Aún no hay contratos.</div>';$('wrap').innerHTML=h;return;}
  h+='<table><thead><tr><th>Cliente / folio</th><th>Plan</th><th>Vigencia</th><th>A quién se envió</th><th>Estado</th><th></th></tr></thead><tbody>'
    +cts.map(c=>{
      const est=CT_EST[c.estado]||['#6b7a70',c.estado||'—'];
      const quien=c.email||c.representante||'—';
      return '<tr data-folio="'+esc(c.folio)+'"><td><b>'+esc(c.cliente||c.representante||'—')+'</b><br><span style="color:var(--tenue);font-size:11px">'+esc(c.folio||'')+'</span></td>'
        +'<td>'+esc(c.plan_slug||'')+'</td>'
        +'<td>'+(c.desde?String(c.desde).slice(0,10):'')+(c.hasta?(' → '+String(c.hasta).slice(0,10)):'')+'</td>'
        +'<td>'+esc(quien)+(c.enviado_at?('<br><span style="color:var(--tenue);font-size:11px">'+String(c.enviado_at).slice(0,10)+'</span>'):'')+'</td>'
        +'<td><span class="badge" style="background:'+est[0]+'1a;color:'+est[0]+'">'+esc(est[1])+'</span></td>'
        +'<td style="white-space:nowrap">'+(c.token?'<a class="btn sm" href="'+CONTRATO_URL+'?t='+encodeURIComponent(c.token)+'" target="_blank" rel="noopener">👁 Ver</a> ':'')
          +'<button class="btn sm ctRe" data-folio="'+esc(c.folio)+'"'+(c.email?'':' title="Sin correo guardado"')+'>✉️ Reenviar</button></td></tr>';
    }).join('')+'</tbody></table>';
  $('wrap').innerHTML=h;
  document.querySelectorAll('.ctRe').forEach(b=>b.onclick=async()=>{
    const folio=b.dataset.folio;
    if(!confirm('¿Reenviar la liga de firma del contrato '+folio+'?'))return;
    b.disabled=true;b.textContent='Enviando…';
    try{ const r=await sb.functions.invoke('contrato-reenviar',{body:{folio}});
      if(r.error||!(r.data&&r.data.ok))throw new Error((r.data&&r.data.error)||(r.error&&r.error.message)||'no se pudo');
      b.textContent='✓ Enviado a '+(r.data.correo||''); }
    catch(e){ alert('No se pudo reenviar: '+(e.message||e)); b.disabled=false;b.textContent='✉️ Reenviar'; }
  });
}

/* ===================== tabs ===================== */
function render(){
  document.querySelectorAll('.secnav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  if(!hasSession){$('wrap').innerHTML='<div class="gate">Abre esta pantalla desde el panel (necesita tu sesión).</div>';return;}
  $('wrap').innerHTML='<div class="gate">Cargando…</div>';
  if(TAB==='coworking')vCoworking();
  else if(TAB==='ateneo')vAteneo();
  else if(TAB==='residencias')vResidencias();
  else vDescuentos();
}
function tabFromHash(){const h=(location.hash||'').replace('#','');return ['coworking','ateneo','residencias','descuentos'].includes(h)?h:null;}
document.querySelectorAll('.secnav button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;try{history.replaceState(null,'','#'+TAB);}catch(_){}render();});
window.addEventListener('hashchange',()=>{const h=tabFromHash();if(h){TAB=h;render();}});

sb.auth.getSession().then(({data})=>{hasSession=!!(data&&data.session);const h=tabFromHash();if(h)TAB=h;render();});
</script>
</body></html>
