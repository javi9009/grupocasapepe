<style>

:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-suave:#FBDCEE;
  --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:14px}
h1,h2,.osw{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}

.top{max-width:1500px;margin:0 auto;padding:18px 16px 4px;display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:700}
.top .sub{color:var(--gris);font-size:12.5px;margin-top:4px}
.top .der{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font-family:Oswald;font-weight:600;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;
  padding:9px 16px;border-radius:9px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn.fan{background:transparent;color:var(--naranja-oscuro)}
.btn.sm{padding:6px 11px;font-size:11.5px}

.barra{max-width:1500px;margin:0 auto;padding:10px 16px 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font-family:Oswald;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.06em;
  padding:7px 14px;border-radius:999px;border:1.5px solid var(--linea);background:var(--blanco);
  color:var(--tinta-2);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
input.busca{border:1.5px solid var(--linea);border-radius:9px;padding:8px 11px;font:inherit;
  background:var(--blanco);color:var(--tinta);min-width:220px}
input.busca:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}

.aviso{max-width:1500px;margin:12px auto 0;padding:0 16px}
.aviso .caja{background:var(--cielo-suave);border:1px solid #C9E2F2;border-radius:10px;
  padding:11px 14px;font-size:12.8px;line-height:1.55;color:var(--tinta-2)}

/* ---------- el tablero ---------- */
.tablero{display:flex;gap:13px;overflow-x:auto;padding:16px 16px 90px;
  max-width:1500px;margin:0 auto;align-items:flex-start}
.col{flex:0 0 250px;background:var(--hueso);border:1px solid var(--linea);border-radius:12px;
  display:flex;flex-direction:column;max-height:calc(100vh - 210px)}
.col.previa{background:#F1EDFA;border-color:#DCD3F0}
.col.dentro{outline:2px dashed var(--naranja);outline-offset:-3px;background:var(--naranja-suave)}
.col .cab{padding:11px 13px 9px;border-bottom:1px solid var(--linea);position:sticky;top:0;
  background:inherit;border-radius:12px 12px 0 0;z-index:1}
.col .cab .num{font-family:Oswald;font-weight:600;font-size:10px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--tenue)}
.col .cab h2{font-size:13px;font-weight:600;margin-top:2px;line-height:1.25}
.col .cab .cuenta{font-family:Oswald;font-weight:700;font-size:19px;margin-top:3px}
.col .cab .cuenta small{font-family:Inter;font-weight:400;font-size:11px;color:var(--gris);
  letter-spacing:0;text-transform:none;margin-left:5px}
.col .cuerpo{padding:9px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;flex:1}
.col .nada{color:var(--tenue);font-size:12px;text-align:center;padding:16px 6px}

.tj{background:var(--blanco);border:1px solid var(--linea);border-radius:10px;padding:10px 11px;
  cursor:grab;box-shadow:0 1px 1px rgba(30,26,22,.04)}
.tj:active{cursor:grabbing}
.tj.arrastrando{opacity:.4}
.tj b{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;
  display:block;line-height:1.25}
.tj .don{color:var(--gris);font-size:11.5px;margin-top:2px}
.tj .marcas{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px}
.tj .datos{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.etq{display:inline-block;font-family:Oswald;font-weight:600;font-size:9.5px;text-transform:uppercase;
  letter-spacing:.07em;border-radius:999px;padding:2px 8px;white-space:nowrap;
  background:var(--hueso);color:var(--gris)}
.etq.fav{background:var(--magenta-suave);color:#B3106F}
.etq.con{background:var(--cielo-suave);color:#1F5B7A}
.etq.pub{background:var(--ok-bg);color:var(--ok)}
.etq.pre{background:#EFF4FF;color:#1D4ED8}
.etq.mano{background:var(--alerta-bg);color:var(--alerta)}

/* ---------- la ficha lateral ---------- */
.velo{position:fixed;inset:0;background:rgba(30,26,22,.4);z-index:50;display:none}
.velo.on{display:block}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--papel);
  z-index:51;transform:translateX(100%);transition:transform .22s ease;overflow-y:auto;
  box-shadow:-20px 0 50px -30px rgba(30,26,22,.7)}
.panel.on{transform:none}
.panel .ph{padding:18px 18px 12px;border-bottom:1px solid var(--linea);background:var(--blanco);
  position:sticky;top:0;z-index:2}
.panel .ph h2{font-size:17px;font-weight:700;padding-right:34px}
.panel .ph .don{color:var(--gris);font-size:12.5px;margin-top:3px}
.panel .cerrar{position:absolute;top:15px;right:16px;border:1px solid var(--linea);background:var(--blanco);
  border-radius:8px;width:29px;height:29px;cursor:pointer;color:var(--gris);font-size:16px;line-height:1}
.panel .pc{padding:16px 18px 40px;display:flex;flex-direction:column;gap:16px}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:11px;padding:13px 14px}
.bloque h3{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--gris);margin:0 0 9px}
.dato{display:flex;gap:10px;padding:4px 0;font-size:13px}
.dato .k{color:var(--gris);flex:0 0 108px}
.dato .v{flex:1;min-width:0;word-break:break-word}
.dato .v a{color:var(--naranja-oscuro)}
.marcaf{display:flex;align-items:center;gap:9px;padding:7px 0;font-size:13.5px}
.marcaf input{width:17px;height:17px;accent-color:var(--naranja)}
select.sel,textarea.nota{width:100%;border:1.5px solid var(--linea);border-radius:9px;padding:9px 11px;
  font:inherit;background:var(--blanco);color:var(--tinta)}
textarea.nota{min-height:64px;resize:vertical}
select.sel:focus,textarea.nota:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.linea-t{font-size:12.5px;color:var(--tinta-2);padding:6px 0;border-bottom:1px dashed var(--linea)}
.linea-t:last-child{border-bottom:none}
.linea-t span{color:var(--tenue);display:block;font-size:11.5px}
.ok{color:var(--ok);font-size:12px}

/* propios de esta pantalla */
.pest{max-width:1500px;margin:0 auto;padding:6px 16px 0;display:flex;gap:8px}
.pest button{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;
  letter-spacing:.05em;padding:9px 16px;border:0;border-bottom:3px solid transparent;
  background:none;color:var(--gris);cursor:pointer}
.pest button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--naranja)}
.tj .falta{margin-top:7px;font-size:11.5px;color:#9E3B2E;line-height:1.4}
.tj .avance{display:flex;gap:3px;margin-top:7px}
.tj .avance i{flex:1;height:4px;border-radius:2px;background:var(--linea)}
.tj .avance i.on{background:var(--ok)}
.tj .mini2{color:var(--tenue);font-size:11px;margin-top:5px}
.tj .foto{width:100%;height:84px;object-fit:cover;border-radius:7px;margin-bottom:8px;display:block}
.acciones{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.copia{display:flex;gap:6px;margin-top:6px}
.copia input{flex:1;min-width:0;border:1.5px solid var(--linea);border-radius:8px;
  padding:7px 9px;font:inherit;font-size:12px;background:var(--hueso);color:var(--tinta-2)}
</style>

</head><body>

<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';

function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){return n==null?'—':'$'+Number(n).toLocaleString('es-MX');}
function dia(s){ if(!s)return '—'; var d=new Date(s); if(isNaN(d))return String(s).slice(0,10);
  return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+
         ' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }

/* El token de Supabase dura una hora. Se relee en cada llamada y, si aun asi
   contesta 401, se renueva con el refresh_token y se reintenta una vez: misma
   leccion que en el funnel de touroperadores, donde Javi marcaba favoritos y
   no se guardaba ni uno. */
function clave(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k))return k;}}catch(_){}return null;}
function sesion(){try{var k=clave(); if(!k)return null;
  var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); return (s&&s.access_token)?s:null;}catch(_){}return null;}
function hdr(extra){
  var S=sesion();
  var h={'apikey':KEY,'Authorization':'Bearer '+((S&&S.access_token)||KEY),
         'Content-Type':'application/json'};
  if(extra)for(var k in extra)h[k]=extra[k];
  return h;
}
var renovando=null;
async function renueva(){
  if(renovando) return renovando;
  renovando=(async function(){
    try{
      var s=sesion(); if(!s||!s.refresh_token) return null;
      var r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
        headers:{apikey:KEY,'Content-Type':'application/json'},
        body:JSON.stringify({refresh_token:s.refresh_token})});
      if(!r.ok) return null;
      var j=await r.json(); if(!j||!j.access_token) return null;
      var k=clave();
      if(k){ try{
        var v=JSON.parse(localStorage.getItem(k)||'null')||{};
        if(v.currentSession) v.currentSession=Object.assign({},v.currentSession,j);
        else v=Object.assign({},v,j);
        localStorage.setItem(k,JSON.stringify(v));
      }catch(_){} }
      return j.access_token;
    }catch(_){ return null; }
    finally{ setTimeout(function(){ renovando=null; },0); }
  })();
  return renovando;
}
async function get(p){
  var r=await fetch(SB+'/rest/v1/'+p,{headers:hdr()});
  if(r.status===401){ if(await renueva()) r=await fetch(SB+'/rest/v1/'+p,{headers:hdr()}); }
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return await r.json();
}
async function patch(tabla,filtro,cuerpo){
  var o={method:'PATCH',headers:hdr({'Prefer':'return=minimal'}),body:JSON.stringify(cuerpo)};
  var r=await fetch(SB+'/rest/v1/'+tabla+'?'+filtro,o);
  if(r.status===401){ if(await renueva()) r=await fetch(SB+'/rest/v1/'+tabla+'?'+filtro,o); }
  if(!r.ok){ var t=await r.text(); var j=null; try{j=JSON.parse(t);}catch(_){}
    throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status)); }
  return true;
}

/* Las etapas. No se teclean: salen de los hechos, y por eso no hay que
   arrastrar nada — el tablero es un espejo, no un formulario. */
var ETAPAS={
  altas:[
    {k:'pidio_entrar', n:'Pidió entrar',  d:'Llenó el alta. Falta que alguien la mire.'},
    {k:'en_tramite',   n:'En trámite',    d:'Le falta papeleo. La tarjeta dice qué.'},
    {k:'lista',        n:'Lista',         d:'Identificada, con Stripe y acuerdo firmado.'},
    {k:'vendiendo',    n:'Vendiendo',     d:'Ya tiene algo a la venta.'}
  ],
  evts:[
    {k:'borrador',          n:'Borrador',         d:'La está armando.'},
    {k:'en_revision',       n:'Nos toca mirarlo', d:'La mandó. Está esperando.'},
    {k:'listo_para_vender', n:'Listo para vender',d:'No le falta nada: se puede publicar.'},
    {k:'a_la_venta',        n:'A la venta',       d:'Publicado, con su liga.'},
    {k:'vendiendo',         n:'Vendiendo',        d:'Con boletos vendidos.'},
    {k:'realizado',         n:'Realizado',        d:'Ya pasó.'}
  ]
};
var TAB='altas', ALTAS=[], EVTS=[], abierto=null;

function barras(n,de){
  var h=''; for(var i=0;i<de;i++) h+='<i class="'+(i<n?'on':'')+'"></i>';
  return '<div class="avance">'+h+'</div>';
}

function tjAlta(o){
  return '<article class="tj" data-id="'+esc(o.id)+'">'+
    '<b>'+esc(o.nombre_comercial||'sin nombre')+'</b>'+
    '<div class="don">'+esc([o.ciudad,o.giro].filter(Boolean).join(' · ')||'—')+'</div>'+
    barras(o.listo_de_6||0,6)+
    (o.atorada_en?'<div class="mini2">Depende de <b>'+esc(o.atorada_en)+'</b></div>':'')+
    (o.n_espacios?'<div class="datos"><span class="etq">'+o.n_espacios+' sala'+(o.n_espacios>1?'s':'')+'</span>'+
      (o.n_eventos?'<span class="etq pub">'+o.n_eventos+' evento'+(o.n_eventos>1?'s':'')+'</span>':'')+'</div>':'')+
  '</article>';
}
function tjEvt(e){
  return '<article class="tj" data-id="'+esc(e.id)+'">'+
    (e.portada?'<img class="foto" src="'+esc(e.portada)+'" alt="">':'')+
    '<b>'+esc(e.titulo||'sin nombre')+'</b>'+
    '<div class="don">'+esc([e.productora,e.espacio].filter(Boolean).join(' · ')||'—')+'</div>'+
    '<div class="mini2">'+esc(dia(e.fecha_inicio))+'</div>'+
    (e.vendidos?'<div class="datos"><span class="etq pub">'+e.vendidos+' vendidos</span>'+
      (e.recaudado?'<span class="etq">'+money(e.recaudado)+'</span>':'')+'</div>':'')+
    (e.le_falta?'<div class="falta">Falta '+esc(e.le_falta)+'</div>':'')+
  '</article>';
}

function pinta(){
  var etapas=ETAPAS[TAB];
  var l=(TAB==='altas'?ALTAS:EVTS);
  $('sub').textContent = TAB==='altas'
    ? ALTAS.length+' productoras · '+ALTAS.filter(function(o){return o.etapa_auto==='vendiendo';}).length+' vendiendo'
    : EVTS.length+' eventos · '+EVTS.filter(function(e){return e.etapa_auto==='en_revision';}).length+' esperando que los miremos';
  $('caja').innerHTML = TAB==='altas'
    ? 'Las etapas <b>no se arrastran</b>: salen de los hechos —si tiene correo, si está identificada, si firmó, si enganchó su Stripe—. '+
      'La barra dice cuánto lleva de seis, y debajo de qué depende que avance. Toca una tarjeta para ver su ficha.'
    : 'Un evento no se puede poner a la venta si le falta algo: sala, día y hora, de qué va, precio o gratis, y al menos una foto. '+
      'Eso lo impide la base, no esta pantalla, así que la tarjeta te lo dice antes de que lo intentes.';

  $('tablero').innerHTML=etapas.map(function(e,i){
    var c=l.filter(function(x){return x.etapa_auto===e.k;});
    return '<section class="col" data-etapa="'+esc(e.k)+'">'+
      '<div class="cab"><div class="num">Paso '+(i+1)+'</div>'+
        '<h2>'+esc(e.n)+'</h2>'+
        '<div class="cuenta">'+c.length+'<small>'+esc(e.d)+'</small></div></div>'+
      '<div class="cuerpo">'+(c.length
        ? c.map(TAB==='altas'?tjAlta:tjEvt).join('')
        : '<div class="nada">Vacía</div>')+'</div></section>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('.tj'),function(t){
    t.onclick=function(){ abre(t.getAttribute('data-id')); };
  });
}

function dato(k,v){ return v==null||v===''?'':'<div class="dato"><span class="k">'+esc(k)+'</span><span class="v">'+v+'</span></div>'; }

function abre(id){
  var l=(TAB==='altas'?ALTAS:EVTS);
  var o=l.filter(function(x){return String(x.id)===String(id);})[0];
  if(!o)return;
  abierto=o;
  $('velo').classList.add('on'); $('panel').classList.add('on');
  $('panel').setAttribute('aria-hidden','false');
  $('pNom').textContent = TAB==='altas' ? (o.nombre_comercial||'—') : (o.titulo||'—');
  $('pDon').textContent = TAB==='altas'
    ? [o.ciudad,o.giro].filter(Boolean).join(' · ')
    : [o.productora,o.espacio].filter(Boolean).join(' · ');
  $('pCuerpo').innerHTML = TAB==='altas' ? fichaAlta(o) : fichaEvt(o);
  enlazaFicha(o);
}
function cierra(){
  $('velo').classList.remove('on'); $('panel').classList.remove('on');
  $('panel').setAttribute('aria-hidden','true'); abierto=null;
}

function fichaAlta(o){
  var liga=location.origin+(o.liga_portal||'');
  return '<div class="bloque"><h3>Quién es</h3>'+
      dato('Razón social', esc(o.razon_social||'—'))+
      dato('Identificación', o.es_extranjera?'Pasaporte ('+esc(o.pais||'extranjera')+')':'RFC')+
      dato('Correo', o.email?'<a href="mailto:'+esc(o.email)+'">'+esc(o.email)+'</a>':'—')+
      dato('WhatsApp', o.whatsapp?'<a href="https://wa.me/'+esc(String(o.whatsapp).replace(/[^0-9]/g,''))+'" target="_blank">'+esc(o.whatsapp)+'</a>':'—')+
      dato('Instagram', o.instagram?esc(o.instagram):'')+
    '</div>'+
    '<div class="bloque"><h3>Dónde opera</h3>'+
      dato('Salas', esc(o.espacios||'ninguna todavía'))+
      dato('Comisión', o.comision_pct?esc(o.comision_pct)+'%':'35%')+
    '</div>'+
    '<div class="bloque"><h3>Cómo va</h3>'+
      dato('Avance', (o.listo_de_6||0)+' de 6')+
      dato('Depende de', o.atorada_en?'<b>'+esc(o.atorada_en)+'</b>':'nada, está lista')+
      (o.le_falta?'<div class="linea-t" style="color:#9E3B2E">Le falta: '+esc(o.le_falta)+'</div>':'')+
      dato('Acuerdo', o.contrato_firmado_at?'firmado':'sin firmar')+
      dato('Stripe', o.cobro_ok?'enganchado':'sin enganchar')+
    '</div>'+
    '<div class="bloque"><h3>Su portal</h3>'+
      '<div class="copia"><input id="pLiga" readonly value="'+esc(liga)+'">'+
      '<button class="btn fan sm" id="bCopia">Copiar</button></div>'+
      '<div class="linea-t"><span>Es personal. No la pegues en un grupo.</span></div>'+
    '</div>'+
    '<div class="acciones">'+
      (o.estado!=='activo'?'<button class="btn" id="bAutoriza">Dar visto bueno</button>':'')+
      '<a class="btn fan" href="/m/ateneo-productoras.html" >Ver ficha completa</a>'+
    '</div>';
}

function fichaEvt(e){
  var puede = !e.le_falta && ['borrador','en_revision','listo_para_vender'].indexOf(e.etapa_auto)>=0;
  return (e.portada?'<img src="'+esc(e.portada)+'" alt="" style="width:100%;border-radius:11px;display:block">':'')+
    '<div class="bloque"><h3>Cuándo y dónde</h3>'+
      dato('Sala', esc(e.espacio||'sin sala')+(e.aforo_espacio?' · aforo '+e.aforo_espacio:''))+
      dato('Empieza', esc(dia(e.fecha_inicio)))+
      dato('Acaba', esc(dia(e.fecha_fin)))+
      ((e.montaje_min||e.desmontaje_min)?dato('Montaje', (e.montaje_min||0)+' min antes · '+(e.desmontaje_min||0)+' min después'):'')+
      dato('Cupo', e.cupo||e.aforo||'—')+
    '</div>'+
    '<div class="bloque"><h3>El dinero</h3>'+
      dato('Precio', e.es_gratis?'Gratis':(e.precio?money(e.precio):(e.precio_por_hora?money(e.precio_por_hora)+' por hora':'sin precio')))+
      dato('Nos toca', e.es_gratis?'20% del consumo':money(e.nos_toca)+' por boleto ('+esc(e.comision_pct)+'%)')+
      dato('Fianza', e.fianza_tipo==='monto'?money(e.fianza_monto):(e.fianza_tipo==='renta_mes'?'un mes de renta':esc(e.fianza_tipo||'—')))+
      /* Lo pedido y lo ya cobrado son dos numeros distintos, y Victor
         necesita los dos: uno le dice si el evento llena, el otro si el
         dinero entro. Mientras no haya cobro en linea para eventos, lo
         pagado lo marca el a mano en el panel del Ateneo. */
      (e.pedidos?dato('Lugares pedidos', e.pedidos+' · '+money(e.recaudado)+
          (e.solicitudes?' en '+e.solicitudes+(e.solicitudes===1?' solicitud':' solicitudes'):'')):'')+
      (e.pedidos?dato('Ya pagado', (e.pagados||0)+' · '+money(e.cobrado||0)):'')+
    '</div>'+
    (e.le_falta
      ? '<div class="bloque"><h3>Para ponerlo a la venta</h3><div class="linea-t" style="color:#9E3B2E">Falta '+esc(e.le_falta)+'</div></div>'
      : '')+
    (e.link?'<div class="bloque"><h3>Su liga</h3><div class="copia">'+
      '<input id="pLiga" readonly value="'+esc(e.link)+'">'+
      '<button class="btn fan sm" id="bCopia">Copiar</button></div></div>':'')+
    '<div class="acciones">'+
      (puede?'<button class="btn" id="bPublica">Autorizar y publicar</button>':'')+
      (e.etapa_auto==='a_la_venta'||e.etapa_auto==='vendiendo'
        ?'<button class="btn fan" id="bPausa">Quitar de la venta</button>':'')+
      '<a class="btn fan" href="/m/eventos.html">Ver en el calendario</a>'+
    '</div>';
}

function enlazaFicha(o){
  var c=$('bCopia');
  if(c) c.onclick=function(){ var i=$('pLiga'); i.select();
    try{ document.execCommand('copy'); c.textContent='Copiada'; setTimeout(function(){c.textContent='Copiar';},1500); }catch(_){} };

  var a=$('bAutoriza');
  if(a) a.onclick=async function(){
    a.disabled=true;
    try{ await patch('productoras','id=eq.'+o.id,{estado:'activo'});
      await carga(); cierra();
    }catch(e){ alert('No se pudo: '+e.message); a.disabled=false; }
  };

  var p=$('bPublica');
  if(p) p.onclick=async function(){
    p.disabled=true;
    try{ await patch('eventos','id=eq.'+o.id,{estado:'publicado'});
      await carga(); cierra();
    }catch(e){
      /* El candado de la base manda. Si rebota, se dice por que, con sus
         palabras: son las mismas que lee el productor. */
      alert(e.message); p.disabled=false;
    }
  };

  var q=$('bPausa');
  if(q) q.onclick=async function(){
    q.disabled=true;
    try{ await patch('eventos','id=eq.'+o.id,{estado:'propuesto'});
      await carga(); cierra();
    }catch(e){ alert('No se pudo: '+e.message); q.disabled=false; }
  };
}

async function carga(){
  try{
    var r=await Promise.all([
      get('v_ateneo_funnel_altas?select=*&order=created_at'),
      get('v_ateneo_funnel_eventos?select=*&order=fecha_inicio.desc.nullslast')
    ]);
    ALTAS=r[0]||[]; EVTS=r[1]||[];
  }catch(e){
    $('sub').textContent='No se pudo cargar: '+e.message;
    return;
  }
  pinta();
}

Array.prototype.forEach.call($('pest').children,function(b){
  b.onclick=function(){
    TAB=b.getAttribute('data-t');
    Array.prototype.forEach.call($('pest').children,function(x){
      x.setAttribute('aria-selected', x===b?'true':'false'); });
    pinta();
  };
});
$('pCerrar').onclick=cierra;
$('velo').onclick=cierra;
$('bRecarga').onclick=carga;
document.addEventListener('keydown',function(e){ if(e.key==='Escape') cierra(); });

carga();
})();
</script>
</body></html>
