<!doctype html>
<html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Eventos · Ateneo</title>
<style>
  :root{
    --ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;
    --ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;
    --rule:#E2DCCF;--accent:#137A56;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;flex-direction:column}
  .top{max-width:1500px;width:100%;margin:0 auto;padding:14px 16px 2px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .top h1{font-size:20px;margin:0}
  .top .hint{color:var(--muted);font-size:13px}
  .secnav{background:var(--ground);border-bottom:1px solid var(--rule)}
  .secnav-in{max-width:1500px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
  .secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  .secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .frames{flex:1;position:relative;min-height:0}
  .frames iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--ground)}
  [hidden]{display:none!important}
</style>
<link rel="icon" type="image/png" href="/dash-192.png">
</head>
<body>
<div class="top">
  <h1>🎫 Eventos</h1>
  <span class="hint">Aprobar y publicar eventos, el calendario de salas, las productoras y sus altas — todo en un lugar.</span>
</div>
<nav class="secnav"><div class="secnav-in" id="nav">
  <button data-v="aprobar" aria-selected="true">Aprobar y publicar</button>
  <button data-v="calendario" aria-selected="false">Calendario</button>
  <button data-v="productoras" aria-selected="false">Productoras</button>
  <button data-v="altas" aria-selected="false">Altas de productora</button>
</div></nav>
<div class="frames" id="frames">
  <iframe id="f-aprobar"     data-src="/m/eventos.html?embed=evt"></iframe>
  <iframe id="f-calendario"  data-src="/m/eventos.html?embed=cal" hidden></iframe>
  <iframe id="f-productoras" data-src="/m/ateneo-productoras.html?embed=1" hidden></iframe>
  <iframe id="f-altas"       data-src="/m/ateneo-funnel.html?embed=1" hidden></iframe>
</div>
<script>
(function(){
  "use strict";
  var $=function(id){return document.getElementById(id);};
  var VIEWS=['aprobar','calendario','productoras','altas'];
  function load(v){var f=$('f-'+v); if(f&&!f.src){f.src=f.getAttribute('data-src');}}
  function show(v){
    VIEWS.forEach(function(x){ $('f-'+x).hidden=(x!==v); });
    Array.prototype.forEach.call($('nav').querySelectorAll('button'),function(b){
      b.setAttribute('aria-selected', b.getAttribute('data-v')===v?'true':'false');
    });
    load(v);
    try{localStorage.setItem('ateEvtTab',v);}catch(_){}
  }
  $('nav').addEventListener('click',function(e){
    var b=e.target.closest('button[data-v]'); if(!b) return;
    show(b.getAttribute('data-v'));
  });
  var ini='aprobar';
  try{var h=(location.hash||'').replace('#',''); if(VIEWS.indexOf(h)>=0)ini=h;
      else{var s=localStorage.getItem('ateEvtTab'); if(VIEWS.indexOf(s)>=0)ini=s;}}catch(_){}
  show(ini);
})();
</script>
</body></html>
