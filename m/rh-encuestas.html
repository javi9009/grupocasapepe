<!doctype html>
<html lang="es">
<head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encuestas · Desempeño · Grupo Casa Pepe</title>
<!-- Encuestas completas que le han hecho a cada colaborador. Javi, 19-nov-2026:
     «los comentarios escritos sí van a RH; en el dashboard una pantalla que se
     llame Encuestas dentro de Desempeño y en la ficha del trabajador aparecen
     las encuestas completas que le han hecho».
     NUNCA se muestra quién opinó: de enc_invitaciones no se pide respondente_id.
     ?emp=<employee_id>  abre directo a esa persona (lo usa rh-ficha.html).
     ?embed=1            sin cabecera (para meterla en otra pantalla). -->
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --muted:#6B6459; --faint:#A49B8C; --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --azul:#2F6DB5; --azul-soft:#E6EEF9;
  --warn:#8C6212; --warn-bg:#F3EAD6; --bad:#9E3B2E;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:0 14px 40px}
header.top{padding:16px 0 10px}
header.top h1{margin:0;font-size:1.15rem}
header.top p{margin:4px 0 0;color:var(--muted);font-size:.84rem}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:14px;margin:0 0 12px}
.state{color:var(--muted);text-align:center;padding:22px}
.aviso{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:9px 12px;font-size:.82rem;margin-bottom:12px}
input.busca{width:100%;font:inherit;padding:9px 11px;border:1px solid var(--rule-2);border-radius:8px;margin-bottom:10px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--rule)}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600}
td.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover{background:var(--surface-3)}
.back{background:none;border:0;color:var(--azul);font:inherit;font-weight:600;cursor:pointer;padding:4px 0;margin-bottom:6px}
.res{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
.res div{background:var(--surface-3);border:1px solid var(--rule);border-radius:8px;padding:7px 11px;font-size:.8rem;color:var(--muted)}
.res b{display:block;font-size:1.05rem;color:var(--ink)}
.enc{border:1px solid var(--rule);border-radius:9px;margin:10px 0;overflow:hidden}
.enc .cab{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 11px;background:var(--surface-3);cursor:pointer}
.enc .cab .f{color:var(--muted);font-size:.8rem}
.enc .cab .m{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums}
.enc .cuerpo{padding:4px 11px 10px;display:none}
.enc.abierta .cuerpo{display:block}
.etq{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;border-radius:999px;padding:2px 8px;color:#fff}
.etq.par{background:var(--azul)} .etq.jef{background:var(--accent)} .etq.sub{background:#6C4FA1}
.q{display:flex;gap:10px;padding:6px 0;border-top:1px solid #f0ebe0;font-size:.82rem}
.q:first-child{border-top:0}
.q .p{flex:1;color:var(--muted)} .q .v{font-weight:700;white-space:nowrap}
.q.txt{flex-direction:column;gap:2px} .q.txt .v{font-weight:400;white-space:normal;color:var(--ink);font-style:italic}
.bloque{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);margin:10px 0 2px}
.nota{font-size:.74rem;color:var(--faint);margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<div class="wrap">
  <header class="top" id="cab">
    <h1>Encuestas</h1>
    <p>Las encuestas completas que le han hecho a cada colaborador: compañeros, su jefe y, si es jefe, su equipo. Nunca se muestra quién opinó.</p>
  </header>
  <div id="app"><div class="state">Cargando…</div></div>
</div>
<script>
const sb=supabase.createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const $=id=>document.getElementById(id);
const QS=new URLSearchParams(location.search);
if(QS.get('embed')==='1') $('cab').style.display='none';
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const TIPOS={pares:{t:'Compañero',c:'par'}, jefe:{t:'Su equipo (como jefe)',c:'sub'}, test:{t:'Su jefe',c:'jef'}};
let GENTE={}, ENC={}, PREG={}, PLANT={};

async function carga(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('app').innerHTML='<div class="card"><div class="state">Inicia sesión en la plataforma para ver esta pantalla.</div></div>'; return; }
  const [pr,ro,iv,rs,pe,ci,pl,er]=await Promise.all([
    sb.from('enc_preguntas').select('id,orden,pregunta,tipo,bloque,tipo_encuesta,activa,cuenta_promedio'),
    sb.from('enc_rondas').select('id,employee_id,tipo,lanzada_at'),
    // OJO: sin respondente_id. Quién opinó no sale de la base hacia esta pantalla.
    sb.from('enc_invitaciones').select('ronda_id,created_at,media,textos').eq('contestada',true),
    sb.from('enc_respuestas').select('ronda_id,pregunta_id,valor,texto,created_at'),
    sb.from('v_empleados_publico').select('id,nombre,nombre_display,area'),
    sb.from('eval_ciclos').select('id,employee_id,tipo_jefe,contestado_at').eq('estado','contestado'),
    sb.from('eval_plantillas').select('id,bloque,orden,pregunta,tipo'),
    sb.from('eval_respuestas').select('ciclo_id,plantilla_id,valor,texto')
  ]);
  if(!pr.data||!pr.data.length){ $('app').innerHTML='<div class="card"><div class="state">No tienes acceso a las encuestas (solo RH).</div></div>'; return; }
  (pr.data||[]).forEach(function(p){PREG[p.id]=p;});
  (pl.data||[]).forEach(function(p){PLANT[p.id]=p;});
  (pe.data||[]).forEach(function(e){GENTE[e.id]={nombre:e.nombre_display||e.nombre,area:e.area||''};});
  const add=function(emp,e){ (ENC[emp]=ENC[emp]||[]).push(e); };
  const rmap={}; (ro.data||[]).forEach(function(r){rmap[r.id]=r;});

  // 1) Encuestas de compañeros / de equipo, completas desde enc_invitaciones.textos
  const desdeTextos={};  // ronda -> fecha (día) de la primera con textos
  (iv.data||[]).forEach(function(i){
    const r=rmap[i.ronda_id]; if(!r) return;
    const resp=i.textos&&i.textos.respuestas; if(!resp||!resp.length) return;
    const d=String(i.created_at).slice(0,10);
    if(!desdeTextos[i.ronda_id]||d<desdeTextos[i.ronda_id]) desdeTextos[i.ronda_id]=d;
    add(r.employee_id,{tipo:r.tipo,fecha:d,media:i.media,items:resp.map(function(x){const p=PREG[x.p]||{};return {q:p.pregunta||('#'+x.p),bloque:p.bloque||'',orden:p.orden||0,v:x.v,t:x.t};})});
  });
  // 2) Registros antiguos (antes de guardar la encuesta completa): enc_respuestas agrupadas por ronda y día
  const grupos={};
  (rs.data||[]).forEach(function(x){
    const d=String(x.created_at).slice(0,10);
    if(desdeTextos[x.ronda_id]&&d>=desdeTextos[x.ronda_id]) return;
    const k=x.ronda_id+'|'+d; (grupos[k]=grupos[k]||[]).push(x);
  });
  Object.keys(grupos).forEach(function(k){
    const rid=k.split('|')[0], d=k.split('|')[1], r=rmap[rid]; if(!r) return;
    const xs=grupos[k], vs=xs.filter(function(x){return x.valor!=null;}).map(function(x){return Number(x.valor);});
    const hist=xs.some(function(x){ const p=PREG[x.pregunta_id]; return p&&p.activa===false; });
    add(r.employee_id,{tipo:r.tipo,fecha:d,antiguo:true,hist:hist,media:vs.length?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length*100)/100:null,
      items:xs.map(function(x){const p=PREG[x.pregunta_id]||{};return {q:p.pregunta||('#'+x.pregunta_id),bloque:p.bloque||'',orden:p.orden||0,v:x.valor,t:x.texto};})});
  });
  // 3) Test del jefe (eval_ciclos + eval_respuestas)
  const porCiclo={}; (er.data||[]).forEach(function(x){(porCiclo[x.ciclo_id]=porCiclo[x.ciclo_id]||[]).push(x);});
  (ci.data||[]).forEach(function(c){
    const xs=porCiclo[c.id]; if(!xs||!xs.length) return;
    const vs=xs.filter(function(x){return x.valor!=null;}).map(function(x){return Number(x.valor);});
    add(c.employee_id,{tipo:'test',sub:c.tipo_jefe||'',fecha:String(c.contestado_at||'').slice(0,10),media:vs.length?Math.round(vs.reduce(function(a,b){return a+b;},0)/vs.length*100)/100:null,
      items:xs.map(function(x){const p=PLANT[x.plantilla_id]||{};return {q:p.pregunta||'—',bloque:p.bloque||'',orden:p.orden||0,v:x.valor,t:x.texto};})});
  });
  Object.keys(ENC).forEach(function(k){ ENC[k].sort(function(a,b){return (b.fecha||'').localeCompare(a.fecha||'');}); });

  const emp=QS.get('emp');
  if(emp) persona(emp,true); else lista();
}

function media(arr){ const v=arr.filter(function(e){return e.media!=null;}).map(function(e){return Number(e.media);}); return v.length?(Math.round(v.reduce(function(a,b){return a+b;},0)/v.length*100)/100):null; }
function cuenta(arr,t){ return arr.filter(function(e){return e.tipo===t;}); }

function lista(){
  const ids=Object.keys(ENC).filter(function(id){return GENTE[id];}).sort(function(a,b){return (GENTE[a].nombre||'').localeCompare(GENTE[b].nombre||'');});
  let h='<div class="card"><input class="busca" id="busca" placeholder="Buscar colaborador…">'
   +'<div style="overflow-x:auto"><table><thead><tr><th>Colaborador</th><th>Área</th><th class="n">Compañeros</th><th class="n">Su jefe</th><th class="n">Su equipo</th><th class="n">Media compañeros</th></tr></thead><tbody id="tb"></tbody></table></div>'
   +'<div class="nota">Media en escala 1 a 5. Toca una fila para ver sus encuestas completas.</div></div>';
  $('app').innerHTML=h;
  const pinta=function(q){
    $('tb').innerHTML=ids.filter(function(id){return !q||(GENTE[id].nombre||'').toLowerCase().indexOf(q)>=0;}).map(function(id){
      const a=ENC[id], p=cuenta(a,'pares'), mp=media(p);
      return '<tr class="click" data-id="'+id+'"><td>'+esc(GENTE[id].nombre)+'</td><td>'+esc(GENTE[id].area)+'</td><td class="n">'+p.length+'</td><td class="n">'+cuenta(a,'test').length+'</td><td class="n">'+cuenta(a,'jefe').length+'</td><td class="n">'+(mp!=null?mp:'—')+'</td></tr>';
    }).join('')||'<tr><td colspan="6" class="state">Sin encuestas.</td></tr>';
    document.querySelectorAll('tr.click').forEach(function(tr){ tr.onclick=function(){ persona(tr.dataset.id,false); }; });
  };
  pinta(''); $('busca').oninput=function(){ pinta(this.value.trim().toLowerCase()); };
}

function persona(id,directo){
  const g=GENTE[id]||{nombre:'—',area:''}, a=ENC[id]||[];
  let h=(directo?'':'<button class="back" id="volver">← Todos</button>')
    +'<div class="card"><h2 style="margin:0;font-size:1.05rem">'+esc(g.nombre)+'</h2><div style="color:var(--muted);font-size:.82rem">'+esc(g.area)+'</div>'
    +'<div class="res"><div><b>'+cuenta(a,'pares').length+'</b>de compañeros</div><div><b>'+(media(cuenta(a,'pares'))!=null?media(cuenta(a,'pares')):'—')+'</b>media compañeros</div><div><b>'+cuenta(a,'test').length+'</b>de su jefe</div><div><b>'+cuenta(a,'jefe').length+'</b>de su equipo</div></div></div>';
  if(!a.length) h+='<div class="card"><div class="state">Todavía no le han hecho ninguna encuesta.</div></div>';
  else{
    h+='<div class="card">'+a.map(function(e,i){
      const T=TIPOS[e.tipo]||{t:e.tipo,c:'par'};
      return '<div class="enc'+(i===0?' abierta':'')+'"><div class="cab"><span class="etq '+T.c+'">'+esc(T.t)+'</span>'
        +(e.sub?'<span class="f">'+esc(e.sub)+'</span>':'')+'<span class="f">'+esc(e.fecha)+(e.hist?' · histórico (otras preguntas)':(e.antiguo?' · registro anterior':''))+'</span>'
        +'<span class="m">'+(e.media!=null?(e.hist?'general ':'')+e.media+' / 5':'')+'</span></div><div class="cuerpo">'+(e.hist?'<div class="nota" style="margin:4px 0 6px">Encuesta anterior con otras preguntas: en el cálculo cuenta solo su valoración general ('+(e.media!=null?e.media:'—')+' / 5).</div>':'')+cuerpo(e.items)+'</div></div>';
    }).join('')+'<div class="nota">Sin nombres de quién opinó. Los registros anteriores al 19-nov-2026 se reconstruyen por ronda y día: si dos personas contestaron el mismo día salen juntas.</div></div>';
  }
  $('app').innerHTML=h;
  if($('volver')) $('volver').onclick=lista;
  document.querySelectorAll('.enc .cab').forEach(function(c){ c.onclick=function(){ c.parentNode.classList.toggle('abierta'); }; });
  window.scrollTo(0,0);
}
function cuerpo(items){
  items=items.slice().sort(function(a,b){return (a.orden||0)-(b.orden||0);});
  let h='', bl=null;
  items.forEach(function(x){
    if(x.bloque&&x.bloque!==bl){ bl=x.bloque; h+='<div class="bloque">'+esc(bl)+'</div>'; }
    if(x.t&&(x.v==null)) h+='<div class="q txt"><span class="p">'+esc(x.q)+'</span><span class="v">«'+esc(x.t)+'»</span></div>';
    else h+='<div class="q"><span class="p">'+esc(x.q)+(x.t?'<br><i style="color:var(--ink)">«'+esc(x.t)+'»</i>':'')+'</span><span class="v">'+(x.v!=null?x.v+' / 5':'—')+'</span></div>';
  });
  return h;
}
// Avisa su alto a quien la embebe (rh-ficha, SoyPepe) para no dejar doble scroll.
function alto(){ try{ if(window.parent!==window) parent.postMessage({cpEncAlto:document.documentElement.scrollHeight},location.origin); }catch(_){} }
new MutationObserver(alto).observe(document.body,{childList:true,subtree:true,attributes:true});
window.addEventListener('load',alto);
carga();
</script>
</body>
</html>
