<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mensajes · Casa Pepe</title>
<style>
  :root{
    --bg:#ffffff;--bg2:#f7f6f1;--bg3:#e9e5dc;
    --txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
    --accent:#1d9e75;--accent-d:#15805e;--gold:#C9A227;--bad:#b03434;
    --bd:rgba(0,0,0,.08);--bd2:rgba(0,0,0,.06);
    --mine:#d6f3e6;--theirs:#ffffff;
    --shadow:0 1px 3px rgba(0,0,0,.06);
    --safe-b:env(safe-area-inset-bottom,0px);
    --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg3);overscroll-behavior-y:none;display:flex;flex-direction:column;height:100%}
  button{font-family:inherit}
  #wrap{flex:1;display:flex;flex-direction:column;max-width:520px;width:100%;margin:0 auto;background:var(--bg);min-height:0;position:relative}
  @media(min-width:521px){#wrap{box-shadow:0 0 40px rgba(0,0,0,.07)}}

  /* estados globales */
  .center-msg{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:32px;text-align:center;color:var(--txt2)}
  .center-msg .ico{font-size:44px}
  .center-msg .t{font-size:15px;font-weight:700;color:var(--txt)}
  .center-msg .s{font-size:13px;color:var(--txt3);max-width:260px}
  .hide{display:none!important}

  /* ===== AVATARES ===== */
  .avatar{border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:0 0 auto;background-size:cover;background-position:center;overflow:hidden;line-height:1;text-shadow:0 1px 1px rgba(0,0,0,.12)}
  .avatar.lg{width:46px;height:46px;font-size:16px}
  .avatar.md{width:40px;height:40px;font-size:14px}
  .avatar.sm{width:34px;height:34px;font-size:12px}
  .avatar.xs{width:26px;height:26px;font-size:10.5px}
  .avatar.tk{background:linear-gradient(135deg,#C9A227,#a5851d)}
  .avatar.inc{background:linear-gradient(135deg,#b03434,#8c2727)}
  .avatar.grp{background:linear-gradient(135deg,#5b6ee0,#4453b8)}

  /* ===== VISTA LISTA ===== */
  .topbar{display:flex;align-items:center;gap:8px;padding:calc(12px + var(--safe-t)) 14px 12px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:5}
  .topbar h1{margin:0;font-size:18px;font-weight:800;flex:1;color:#fff}
  .topbar h1 b{color:#fff8dd}
  .icon-btn{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.16);color:#fff;border-radius:11px;padding:8px 11px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
  .icon-btn:active{background:rgba(255,255,255,.28)}
  .back-btn{border:none;background:transparent;color:#fff;font-size:26px;cursor:pointer;padding:0 4px;line-height:1}

  .searchbar{padding:8px 12px;background:var(--bg);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:4}
  .searchbar input{width:100%;border:1px solid var(--bd);border-radius:22px;padding:9px 14px 9px 34px;font-size:14px;font-family:inherit;background:var(--bg2) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='16' height='16' viewBox='0 0 24 24' fill='none' stroke='%238e8c85' stroke-width='2' stroke-linecap='round'><circle cx='11' cy='11' r='7'/><line x1='21' y1='21' x2='16.5' y2='16.5'/></svg>") 11px center no-repeat;color:inherit}
  .searchbar input:focus{outline:none;border-color:var(--accent)}

  #chatList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .chat-row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--bd2);cursor:pointer;background:var(--bg)}
  .chat-row:active{background:var(--bg2)}
  .chat-row.active{background:var(--bg3)}
  .chat-main{flex:1;min-width:0}
  .chat-top{display:flex;align-items:baseline;gap:8px}
  .chat-name{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chat-time{font-size:11.5px;color:var(--txt3);flex:0 0 auto}
  .chat-prev{font-size:13px;color:var(--txt2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;display:flex;align-items:center;gap:6px}
  .chat-prev .pv-txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .badge{font-size:10px;font-weight:800;padding:1px 7px;border-radius:20px;flex:0 0 auto}
  .badge.tk{background:#f6edcf;color:#7a611a}
  .badge.inc{background:#f6d9d9;color:#8c2727}
  .badge.cerrado{background:#e5e3dc;color:#6b6a64}
  .badge.abierto{background:#d6f3e6;color:#137a56}
  .unread-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:0 0 auto;margin-left:auto}
  .chat-row.unread .chat-name{font-weight:800}
  .chat-row.unread .chat-prev{color:var(--txt);font-weight:600}
  mark{background:#ffe9a8;color:inherit;border-radius:3px;padding:0 1px}
  .empty-inline{padding:26px;text-align:center;color:var(--txt3);font-size:13px}

  /* ===== VISTA CONVERSACION ===== */
  #convView{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg3);z-index:6}
  #convBody{display:flex;flex-direction:column;flex:1;min-height:0}
  .conv-head{display:flex;align-items:center;gap:10px;padding:calc(9px + var(--safe-t)) 12px 9px;background:var(--accent);color:#fff;position:sticky;top:0;z-index:2}
  .conv-title{flex:1;min-width:0}
  .conv-title .n{font-weight:800;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
  .conv-title .sub{font-size:11.5px;color:rgba(255,255,255,.8);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv-actions{display:flex;gap:7px;align-items:center;padding:8px 12px;background:var(--bg2);border-bottom:1px solid var(--bd);flex-wrap:wrap}
  .conv-actions .act{border:1px solid var(--bd);background:var(--bg);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700;cursor:pointer;color:inherit}
  .conv-actions .act.warn{background:#f6edcf;border-color:#e2cf8f;color:#7a611a}
  .conv-actions .act.reopen{background:#d6f3e6;border-color:#a9dcc6;color:#137a56}
  .conv-actions .act.hi{background:var(--accent);color:#fff;border-color:var(--accent)}

  #msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 12px 6px;display:flex;flex-direction:column;gap:8px}
  .mrow{display:flex;gap:7px;align-items:flex-end;align-self:flex-start;max-width:82%}
  .mrow .bubble{max-width:100%}
  .bubble{max-width:78%;padding:8px 11px;border-radius:14px;font-size:14.5px;line-height:1.38;word-wrap:break-word;white-space:pre-wrap;box-shadow:var(--shadow);position:relative}
  .bubble .who{font-size:11.5px;font-weight:800;color:var(--accent);margin-bottom:2px}
  .bubble .time{font-size:10px;color:var(--txt3);text-align:right;margin-top:3px}
  .bubble.me{align-self:flex-end;background:var(--mine);border-bottom-right-radius:5px}
  .bubble.them{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:5px;border:1px solid var(--bd2)}
  .bubble img{max-width:100%;border-radius:9px;margin-top:5px;display:block;cursor:pointer}
  .sys{align-self:center;background:#eceae2;color:var(--txt2);font-size:12px;padding:5px 12px;border-radius:20px;max-width:88%;text-align:center}

  .composer{display:flex;align-items:flex-end;gap:8px;padding:9px 10px calc(9px + var(--safe-b));border-top:1px solid var(--bd);background:var(--bg);position:relative}
  /* menú de adjuntar (3 opciones) */
  .attach-menu{position:absolute;left:8px;bottom:calc(56px + var(--safe-b));background:var(--bg);border:1px solid var(--bd);border-radius:13px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:6px;display:flex;flex-direction:column;gap:2px;z-index:12;min-width:158px}
  .attach-menu button{border:none;background:transparent;text-align:left;padding:10px 12px;font-size:14px;font-weight:600;border-radius:9px;cursor:pointer;color:inherit;display:flex;align-items:center;gap:9px;font-family:inherit}
  .attach-menu button:active{background:var(--bg2)}
  .composer textarea{flex:1;resize:none;border:1px solid var(--bd);border-radius:20px;padding:10px 14px;font-size:15px;font-family:inherit;max-height:120px;background:var(--bg2);color:inherit;line-height:1.35}
  .composer textarea:focus{outline:none;border-color:var(--accent)}
  .c-btn{border:none;border-radius:50%;width:42px;height:42px;font-size:19px;cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
  .c-btn.attach{background:var(--bg2);border:1px solid var(--bd);color:var(--txt2)}
  .c-btn.attach.hot{background:#f6d9d9;border-color:#e0a9a9;color:#8c2727}
  .c-btn.send{background:var(--accent);color:#fff}
  .c-btn:disabled{opacity:.45}
  #photoPreview{display:flex;gap:8px;padding:0 12px 6px;flex-wrap:wrap}
  #photoPreview .pv{position:relative}
  #photoPreview img{width:56px;height:56px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
  #photoPreview .rm{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;cursor:pointer;line-height:1;z-index:2}
  #photoPreview .filechip{display:flex;align-items:center;gap:7px;padding:9px 11px;background:var(--bg2);border:1px solid var(--bd);border-radius:9px;font-size:12.5px;max-width:180px;height:56px}
  #photoPreview .filechip .ic{font-size:16px;flex:0 0 auto}
  #photoPreview .filechip .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
  /* adjunto no-imagen dentro de la burbuja */
  .bubble .filelink{display:inline-flex;align-items:center;gap:7px;margin-top:5px;padding:9px 11px;background:rgba(0,0,0,.05);border-radius:10px;text-decoration:none;color:var(--accent-d);font-size:13.5px;font-weight:700;max-width:100%}
  .bubble .filelink .ic{font-size:16px;flex:0 0 auto}
  .bubble .filelink .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ===== DIRECTORIO COLABORADORES ===== */
  #dirView{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);z-index:7}
  .dir-head{display:flex;align-items:center;gap:8px;padding:calc(12px + var(--safe-t)) 14px 12px;background:var(--accent-d);color:#fff}
  .dir-head h2{margin:0;font-size:17px;font-weight:800;flex:1;color:#fff}
  #dirList{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .ct-row{display:flex;align-items:center;gap:11px;padding:10px 10px;border-radius:12px;cursor:pointer}
  .ct-row:active{background:var(--bg2)}
  .ct-info{min-width:0;flex:1}
  .ct-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ct-mail{font-size:12px;color:var(--txt3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ct-go{color:var(--accent);font-size:18px;flex:0 0 auto}

  /* ===== MODAL NUEVO ===== */
  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
  .sheet-bg.show{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:520px;border-radius:18px 18px 0 0;max-height:82vh;display:flex;flex-direction:column;padding-bottom:var(--safe-b)}
  .sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
  .sheet-h h2{margin:0;font-size:17px;font-weight:800;flex:1}
  .sheet-h .x{border:none;background:var(--bg2);border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer;color:inherit}
  .sheet .srch{margin:0 16px 8px;padding:11px 13px;border:1px solid var(--bd);border-radius:11px;font-size:15px;font-family:inherit;background:var(--bg2);color:inherit}
  .sheet .srch:focus{outline:none;border-color:var(--accent)}
  #contactList{overflow-y:auto;padding:4px 8px 12px}

  .toast{position:fixed;left:50%;bottom:calc(20px + var(--safe-b));transform:translateX(-50%);background:#16130f;color:#fff;padding:10px 18px;border-radius:22px;font-size:13.5px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
  .toast.show{opacity:.96}
  body.embed .topbar{padding-top:12px}
  body.embed .conv-head{padding-top:9px}
  body.embed .dir-head{padding-top:12px}

  #gate{position:absolute;inset:0;z-index:30;background:var(--bg)}

  /* ===== DESKTOP: usar el ancho, 3 columnas ===== */
  @media(min-width:860px){
    #wrap{max-width:1180px;flex-direction:row;align-items:stretch;height:100%;min-height:0}
    /* !important porque #listView lleva flex:1 inline que si no gana y colapsa la columna */
    #listView{display:flex!important;flex:0 0 340px!important;width:340px!important;max-width:340px!important;min-width:340px;flex-direction:column!important;border-right:1px solid var(--bd);min-height:0;height:100%;overflow:hidden}
    #convView{display:flex!important;position:relative!important;inset:auto!important;flex:1 1 auto!important;min-width:0;height:100%;overflow:hidden}
    #dirView{display:flex!important;position:relative!important;inset:auto!important;flex:0 0 300px!important;width:300px!important;max-width:300px!important;min-width:300px;border-left:1px solid var(--bd);z-index:1;height:100%;overflow:hidden}
    /* scroll independiente por columna */
    #chatList,#msgs,#dirList{min-height:0;overflow-y:auto}
    #convView .back-btn,#btnDir,.dir-head .back-btn{display:none!important}
    .dir-head{padding-top:calc(14px + var(--safe-t))}
  }
</style>
</head>
<body>
<div id="wrap">
  <!-- Sin sesion / cargando -->
  <div id="gate" class="center-msg">
    <div class="ico">💬</div>
    <div class="t" id="gateT">Cargando mensajes…</div>
    <div class="s" id="gateS"></div>
  </div>

  <!-- VISTA LISTA -->
  <div id="listView" class="hide" style="display:flex;flex-direction:column;flex:1;min-width:0">
    <div class="topbar">
      <button class="back-btn" id="btnAppBack" title="Volver a la app" aria-label="Volver">‹</button>
      <h1>Casa <b>Pepe</b> · Mensajes</h1>
      <button class="icon-btn" id="btnDir" title="Colaboradores">👥</button>
      <button class="icon-btn" id="btnNuevo">＋ Nuevo</button>
    </div>
    <div class="searchbar">
      <input id="chatSearch" placeholder="Buscar chats, personas o palabras…" autocomplete="off">
    </div>
    <div id="chatList"></div>
    <div id="listEmpty" class="center-msg hide">
      <div class="ico">📭</div>
      <div class="t">Aún no tienes conversaciones</div>
      <div class="s">Toca <b>＋ Nuevo</b> o <b>👥 Colaboradores</b> para escribirle a alguien.</div>
    </div>
  </div>

  <!-- VISTA CONVERSACION -->
  <div id="convView" class="hide">
    <div id="convEmpty" class="center-msg">
      <div class="ico">💬</div>
      <div class="t">Selecciona una conversación</div>
      <div class="s">Elige un chat de la izquierda o toca un colaborador para empezar.</div>
    </div>
    <div id="convBody" class="hide">
      <div class="conv-head">
        <button class="back-btn" id="btnBack">‹</button>
        <div class="avatar md" id="convAv"></div>
        <div class="conv-title">
          <div class="n" id="convName">—</div>
          <div class="sub" id="convSub"></div>
        </div>
      </div>
      <div class="conv-actions hide" id="convActions"></div>
      <div id="msgs"></div>
      <div id="photoPreview"></div>
      <div class="composer">
        <div class="attach-menu hide" id="attachMenu">
          <button type="button" data-act="cam">📷 Cámara</button>
          <button type="button" data-act="foto">🖼️ Foto</button>
          <button type="button" data-act="file">📎 Archivo</button>
        </div>
        <button class="c-btn attach" id="btnAttach" title="Adjuntar">📎</button>
        <input type="file" id="fileCam"  accept="image/*" capture="environment" style="display:none">
        <input type="file" id="fileFoto" accept="image/*" multiple style="display:none">
        <input type="file" id="fileAny"  accept="*/*" multiple style="display:none">
        <textarea id="msgInput" rows="1" placeholder="Mensaje…"></textarea>
        <button class="c-btn send" id="btnSend">➤</button>
      </div>
    </div>
  </div>

  <!-- DIRECTORIO COLABORADORES -->
  <div id="dirView" class="hide">
    <div class="dir-head">
      <button class="back-btn" id="btnDirBack">‹</button>
      <h2>Colaboradores</h2>
    </div>
    <div class="searchbar">
      <input id="dirSearch" placeholder="Buscar colaborador…" autocomplete="off">
    </div>
    <div id="dirList"></div>
  </div>
</div>

<!-- MODAL NUEVO CHAT -->
<div class="sheet-bg" id="newSheet">
  <div class="sheet">
    <div class="sheet-h">
      <h2>Nuevo mensaje</h2>
      <button class="x" id="btnCloseNew">✕</button>
    </div>
    <input class="srch" id="ctSearch" placeholder="Buscar colaborador…" autocomplete="off">
    <div id="contactList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL = 'https://rehophywchakfapivsbh.supabase.co';
const SB_KEY = 'sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb = createClient(SB_URL, SB_KEY, { auth:{ flowType:'implicit', detectSessionInUrl:true, persistSession:true, autoRefreshToken:true } });

const $  = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const EMBED = qs.get('embed') === '1';
if (EMBED) document.body.classList.add('embed');

let ME = { email:null, empId:null, nombre:null };
let CURRENT = null;          // {id,tipo,estado,titulo,...}
let CURRENT_PARTS = [];      // participantes de la conv abierta
let CONTACTS = [];           // colaboradores para nuevo chat / directorio
let FOTO_BY_EMPID = {};      // employee_id -> foto_url (v_empleados_publico)
let LIST_ROWS = [];          // filas de la lista ya preparadas (para buscador)
let SEARCH_Q = '';           // texto del buscador de chats
let MSG_MATCH_IDS = new Set();// conversacion_id que coinciden por contenido de mensajes
let searchTimer = null;
let pollTimer = null;
let lastMsgCount = 0;

/* ---------- utilidades ---------- */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
/* ---------- adjuntos: imagen vs archivo ---------- */
function isImageName(s){ return /\.(jpe?g|png|gif|webp|bmp|heic|heif|svg)(\?|#|$)/i.test(String(s||'')); }
function fileNameFromUrl(u){ let s=String(u||'').split(/[?#]/)[0]; s=s.substring(s.lastIndexOf('/')+1); try{ s=decodeURIComponent(s); }catch(_){ } s=s.replace(/^\d{10,}_[a-z0-9]{5,}_/i,''); return s||'archivo'; }
function sanitizeName(n){ let base=String(n||'archivo'); const dot=base.lastIndexOf('.'); let name=base, ext=''; if(dot>0){ name=base.slice(0,dot); ext=base.slice(dot); }
  try{ name=name.normalize('NFKD'); }catch(_){ }
  name=name.replace(/[^\w\-]+/g,'_').replace(/_+/g,'_').replace(/^_|_$/g,'').slice(0,60)||'archivo';
  ext=ext.toLowerCase().replace(/[^\w.]+/g,'').slice(0,10);
  return name+ext; }
function initials(name){ return (name||'P').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'P'; }
function nowISO(){ return new Date().toISOString(); }
function fmtTime(iso){ if(!iso) return ''; const d=new Date(iso); const now=new Date();
  const sameDay = d.toDateString()===now.toDateString();
  if(sameDay) return d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
  const yd=new Date(now); yd.setDate(now.getDate()-1);
  if(d.toDateString()===yd.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-MX',{day:'2-digit',month:'2-digit'});
}
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2600); }
function show(el){ el.classList.remove('hide'); }
function hide(el){ el.classList.add('hide'); }
function rid(){ return Math.random().toString(36).slice(2,10); }

/* ---------- AVATARES ---------- */
function avatarColor(name){ const s=String(name||'P'); let h=0; for(let i=0;i<s.length;i++){ h=(h*31 + s.charCodeAt(i))>>>0; } return 'hsl('+(h%360)+' 52% 42%)'; }
// Foto del colaborador si existe (v_empleados_publico.foto_url); si no, inicial en circulo de color derivado del nombre.
function avatarHTML(nombre, foto, size){
  size = size||'lg';
  if(foto){ const u = String(foto).replace(/['"\\<>()\s]/g,''); return '<div class="avatar '+size+'" title="'+esc(nombre||'')+'" style="background-image:url(\''+esc(u)+'\')"></div>'; }
  return '<div class="avatar '+size+'" title="'+esc(nombre||'')+'" style="background:'+avatarColor(nombre)+'">'+esc(initials(nombre))+'</div>';
}
function fotoByEmpId(empId){ return (empId && FOTO_BY_EMPID[empId]) ? FOTO_BY_EMPID[empId] : null; }
function fotoByEmail(email){
  if(!email) return null;
  const p = CURRENT_PARTS.find(x=>x.email===email);
  if(p && p.employee_id && FOTO_BY_EMPID[p.employee_id]) return FOTO_BY_EMPID[p.employee_id];
  const c = CONTACTS.find(x=>x.email===email);
  if(c && c.employee_id && FOTO_BY_EMPID[c.employee_id]) return FOTO_BY_EMPID[c.employee_id];
  return null;
}
function hl(text,q){ const e=esc(text); if(!q) return e; try{ const rx=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); return e.replace(rx,'<mark>$1</mark>'); }catch(_){ return e; } }

/* ---------- arranque ---------- */
async function boot(){
  let session=null;
  try{ const { data } = await sb.auth.getSession(); session = data ? data.session : null; }catch(e){ session=null; }
  if(!session){
    $('gateT').textContent='Inicia sesión';
    $('gateS').textContent='Necesitas iniciar sesión en Casa Pepe para ver tus mensajes.';
    $('gate').querySelector('.ico').textContent='🔒';
    return;
  }
  ME.email = (session.user.email||'').toLowerCase();
  ME.nombre = ME.email.split('@')[0];
  try{
    const { data:link } = await sb.from('empleado_login')
      .select('employee_id,nombre_display,nombre_completo,nickname')
      .eq('user_id', session.user.id).maybeSingle();
    if(link){ ME.empId = link.employee_id || null; ME.nombre = link.nombre_display || link.nickname || link.nombre_completo || ME.nombre; }
  }catch(e){}

  hide($('gate'));
  wireUI();
  await loadFotos();
  loadContacts();

  const convParam = qs.get('conv');
  if(convParam){ await openConv(convParam); }
  else { showList(); }
  await loadList();
  startPoll();
}

function renderDir(q){

/* ---------- navegacion vistas ---------- */
function showList(){ CURRENT=null; hide($('convView')); hide($('dirView')); show($('listView')); }
function showConv(){ hide($('listView')); hide($('dirView')); show($('convView')); }
function showDir(){ hide($('listView')); hide($('convView')); show($('dirView')); renderDir($('dirSearch').value||''); }

/* ---------- BACK integrado (2 niveles): conversación -> lista -> app ---------- */
function goBack(){
  const desktop  = window.matchMedia('(min-width:860px)').matches;
  const convOpen = !$('convView').classList.contains('hide') && !$('convBody').classList.contains('hide');
  const dirOpen  = !$('dirView').classList.contains('hide');
  // Nivel 1 (móvil): si hay conversación/directorio abierto, regresa a la lista, no sale de la app
  if(!desktop && convOpen){ showList(); loadList(); return; }
  if(!desktop && dirOpen){ showList(); return; }
  // Nivel 2: en la lista (o en desktop) -> regresar a la app
  exitToApp();
}
function exitToApp(){
  if(EMBED){ if(history.length>1) history.back(); return; }
  if(history.length>1) history.back(); else location.href='/soypepe/';
}

/* ---------- LISTA DE CHATS ---------- */
async function loadList(){
  if(!ME.email) return;
  let convs=[];
  try{ const { data } = await sb.from('chat_conversaciones').select('*').order('ultimo_at',{ascending:false,nullsFirst:false}); convs=data||[]; }
  catch(e){ return; }
  const ids = convs.map(c=>c.id);
  const listEl=$('chatList'), emptyEl=$('listEmpty');
  if(!ids.length){ LIST_ROWS=[]; listEl.innerHTML=''; show(emptyEl); return; }
  hide(emptyEl);

  let parts=[], msgs=[];
  try{ const { data } = await sb.from('chat_participantes').select('conversacion_id,email,nombre,employee_id,last_read_at').in('conversacion_id',ids); parts=data||[]; }catch(e){}
  try{ const { data } = await sb.from('chat_mensajes').select('conversacion_id,cuerpo,autor_email,autor_nombre,created_at,fotos,accion').in('conversacion_id',ids).order('created_at',{ascending:false}); msgs=data||[]; }catch(e){}

  const partsByConv={}, lastByConv={}, myReadByConv={};
  parts.forEach(p=>{ (partsByConv[p.conversacion_id]=partsByConv[p.conversacion_id]||[]).push(p); if(p.email===ME.email) myReadByConv[p.conversacion_id]=p.last_read_at; });
  msgs.forEach(m=>{ if(!lastByConv[m.conversacion_id]) lastByConv[m.conversacion_id]=m; });

  LIST_ROWS=[];
  for(const c of convs){
    const ps = partsByConv[c.id]||[];
    const others = ps.filter(p=>p.email!==ME.email);
    let title = c.titulo;
    if(!title || c.tipo==='directo'){ title = others.map(p=>p.nombre||p.email).join(', ') || c.titulo || 'Conversación'; }
    const last = lastByConv[c.id];
    let prev = '';
    if(last){ if(last.accion) prev = last.cuerpo||''; else if(last.fotos && last.fotos.length) prev = (isImageName(last.fotos[0])?'📷 Foto':'📎 Archivo'); else prev = (last.autor_email===ME.email?'Tú: ':'') + (last.cuerpo||''); }
    const myRead = myReadByConv[c.id];
    let unread=false;
    if(last && last.autor_email!==ME.email){ if(!myRead || new Date(last.created_at) > new Date(myRead)) unread=true; }
    // avatar: SIEMPRE la persona con quien hablas (inicial/foto); el tipo va en el badge
    let avHtml;
    { const o=others[0]; const pn=o?(o.nombre||o.email):title; avHtml=avatarHTML(pn, o?fotoByEmpId(o.employee_id):null, 'lg'); }
    let badge='';
    if(c.tipo==='ticket') badge = '<span class="badge '+(c.estado==='cerrado'?'cerrado':'abierto')+'">'+(c.estado==='cerrado'?'Cerrado':'Abierto')+'</span>';
    else if(c.tipo==='incidencia') badge = '<span class="badge inc">Incidencia</span>';
    const searchText = (title+' '+others.map(p=>(p.nombre||'')+' '+(p.email||'')).join(' ')).toLowerCase();
    LIST_ROWS.push({ id:c.id, avHtml, title, timeTxt:fmtTime(c.ultimo_at||(last&&last.created_at)), badge, prev, unread, search:searchText });
  }
  renderList(SEARCH_Q);
}

function renderList(q){
  q=(q||'').trim().toLowerCase();
  const listEl=$('chatList'), emptyEl=$('listEmpty');
  if(!LIST_ROWS.length){ listEl.innerHTML=''; show(emptyEl); return; }
  hide(emptyEl);
  let rows=LIST_ROWS;
  if(q){ rows = LIST_ROWS.filter(r=> r.search.includes(q) || MSG_MATCH_IDS.has(r.id)); }
  if(!rows.length){ listEl.innerHTML='<div class="empty-inline">Sin coincidencias para "'+esc(q)+'"</div>'; return; }
  listEl.innerHTML = rows.map(r=>{
    const active = CURRENT && r.id===CURRENT.id;
    return '<div class="chat-row'+(r.unread?' unread':'')+(active?' active':'')+'" data-id="'+esc(r.id)+'">'
      + r.avHtml
      + '<div class="chat-main"><div class="chat-top"><span class="chat-name">'+hl(r.title,q)+'</span><span class="chat-time">'+esc(r.timeTxt)+'</span></div>'
      + '<div class="chat-prev">'+r.badge+'<span class="pv-txt">'+hl(r.prev,q)+'</span>'+(r.unread?'<span class="unread-dot"></span>':'')+'</div></div></div>';
  }).join('');
  listEl.querySelectorAll('.chat-row').forEach(el=> el.onclick=()=> openConv(el.dataset.id));
}

function markActiveRow(){ document.querySelectorAll('#chatList .chat-row').forEach(el=> el.classList.toggle('active', !!(CURRENT && el.dataset.id===CURRENT.id))); }

/* buscador: filtra por nombre/titulo (instantaneo) + contenido de mensajes (debounce) */
function onSearch(v){
  SEARCH_Q = v||'';
  renderList(SEARCH_Q);
  clearTimeout(searchTimer);
  const q=(v||'').trim();
  if(q.length<2){ MSG_MATCH_IDS=new Set(); renderList(SEARCH_Q); return; }
  searchTimer=setTimeout(async ()=>{
    try{
      const { data } = await sb.from('chat_mensajes').select('conversacion_id').ilike('cuerpo','%'+q+'%').limit(600);
      MSG_MATCH_IDS = new Set((data||[]).map(m=>m.conversacion_id));
    }catch(e){ MSG_MATCH_IDS=new Set(); }
    renderList(SEARCH_Q);
  }, 300);
}

/* ---------- CONVERSACION ---------- */
async function openConv(id){
  showConv();
  show($('convBody')); hide($('convEmpty'));
  let conv=null;
  try{ const { data } = await sb.from('chat_conversaciones').select('*').eq('id',id).maybeSingle(); conv=data; }catch(e){}
  if(!conv){ $('convName').textContent='Conversación no disponible'; $('convSub').textContent=''; $('convAv').outerHTML='<div class="avatar md" id="convAv" style="background:'+avatarColor('?')+'">?</div>'; $('msgs').innerHTML='<div class="sys">No tienes acceso a esta conversación o no existe.</div>'; hide($('convActions')); return; }
  CURRENT=conv;
  try{ const { data } = await sb.from('chat_participantes').select('conversacion_id,email,nombre,employee_id,last_read_at').eq('conversacion_id',id); CURRENT_PARTS=data||[]; }catch(e){ CURRENT_PARTS=[]; }

  const others = CURRENT_PARTS.filter(p=>p.email!==ME.email);
  let title = conv.titulo;
  if(!title || conv.tipo==='directo'){ title = others.map(p=>p.nombre||p.email).join(', ') || conv.titulo || 'Conversación'; }

function renderActions(conv){
  const bar=$('convActions');
  if(conv.tipo==='ticket'){
    show(bar);
    const chip = '<span class="badge '+(conv.estado==='cerrado'?'cerrado':'abierto')+'">'+(conv.estado==='cerrado'?'Cerrado':'Abierto')+'</span>';
    if(conv.estado==='abierto') bar.innerHTML = chip + '<button class="act warn" id="btnTicket">Cerrar ticket</button>';
    else bar.innerHTML = chip + '<button class="act reopen" id="btnTicket">Reabrir</button>';
    $('btnTicket').onclick = ()=> toggleTicket(conv);
  } else if(conv.tipo==='incidencia'){
    show(bar);
    bar.innerHTML = '<span class="badge inc">Incidencia</span><button class="act hi" id="btnActAttach">📎 Adjuntar foto</button>';
    $('btnActAttach').onclick = ()=> $('attachMenu').classList.remove('hide');
    $('btnAttach').classList.add('hot');
  } else {
    hide(bar); bar.innerHTML='';
    $('btnAttach').classList.remove('hot');
  }
}

async function loadMessages(id, forceScroll){
  let msgs=[];
  try{ const { data } = await sb.from('chat_mensajes').select('*').eq('conversacion_id',id).order('created_at',{ascending:true}); msgs=data||[]; }catch(e){}
  const box=$('msgs');
  const nearBottom = (box.scrollHeight - box.scrollTop - box.clientHeight) < 80;
  const grupal = CURRENT && CURRENT.tipo!=='directo';
  let html='';
  let lastDay='';
  for(const m of msgs){
    const day = new Date(m.created_at).toDateString();
    if(day!==lastDay){ lastDay=day; html += '<div class="sys">'+esc(fmtDay(m.created_at))+'</div>'; }
    if(m.accion){ html += '<div class="sys">'+esc(m.cuerpo||'')+'</div>'; continue; }
    const mine = m.autor_email===ME.email;
    let inner='';
    if(!mine && grupal) inner += '<div class="who">'+esc(m.autor_nombre||m.autor_email)+'</div>';
    if(m.cuerpo) inner += '<div>'+esc(m.cuerpo).replace(/\n/g,'<br>')+'</div>';
    if(m.fotos && m.fotos.length){ m.fotos.forEach(u=>{
      if(isImageName(u)) inner += '<img src="'+esc(u)+'" loading="lazy" onclick="window.open(this.src,\'_blank\')">';
      else inner += '<a class="filelink" href="'+esc(u)+'" target="_blank" rel="noopener"><span class="ic">📎</span><span class="nm">'+esc(fileNameFromUrl(u))+'</span></a>';
    }); }
    inner += '<div class="time">'+esc(fmtTime(m.created_at))+'</div>';
    if(mine){ html += '<div class="bubble me">'+inner+'</div>'; }
    else { // avatar (foto o inicial) del autor en TODA burbuja entrante, incl. mensajes migrados
           // del buzon/tickets antiguos: usa autor_nombre/autor_email; si no hay foto, cae a inicial de color.
      const foto=fotoByEmail(m.autor_email);
      html += '<div class="mrow">'+avatarHTML(m.autor_nombre||m.autor_email, foto, 'xs')+'<div class="bubble them">'+inner+'</div></div>';
    }
  }
  if(!msgs.length) html='<div class="sys">Aún no hay mensajes. Escribe el primero 👇</div>';
  box.innerHTML=html;
  if(forceScroll || nearBottom || msgs.length!==lastMsgCount){ box.scrollTop=box.scrollHeight; }
  lastMsgCount=msgs.length;
}

function fmtDay(iso){ const d=new Date(iso), now=new Date(); if(d.toDateString()===now.toDateString()) return 'Hoy';
  const yd=new Date(now); yd.setDate(now.getDate()-1); if(d.toDateString()===yd.toDateString()) return 'Ayer';
  return d.toLocaleDateString('es-MX',{weekday:'short',day:'2-digit',month:'short'}); }

async function markRead(id){ try{ await sb.from('chat_participantes').update({last_read_at:nowISO()}).eq('conversacion_id',id).eq('email',ME.email); }catch(e){} }

/* ---------- ENVIAR ---------- */
let PENDING=[]; // {url}
async function sendMessage(){
  if(!CURRENT) return;
  const inp=$('msgInput'); const body=inp.value.trim();
  const fotos = PENDING.map(p=>p.url);
  if(!body && !fotos.length) return;
  $('btnSend').disabled=true;
  const payload={ conversacion_id:CURRENT.id, autor_email:ME.email, autor_nombre:ME.nombre, cuerpo:body||'', fotos:fotos.length?fotos:null, accion:null };
  try{
    const { error } = await sb.from('chat_mensajes').insert(payload);
    if(error) throw error;
    inp.value=''; autoGrow(); PENDING=[]; renderPreview();
    const ts=nowISO();
    try{ await sb.from('chat_conversaciones').update({ultimo_at:ts}).eq('id',CURRENT.id); }catch(e){}
    await markRead(CURRENT.id);
    notifyOthers(body||(fotos.length?(isImageName(fotos[0])?'📷 Foto':'📎 Archivo'):''));
    await loadMessages(CURRENT.id, true);
    loadList();
  }catch(e){ toast('No se pudo enviar'); }
  $('btnSend').disabled=false;
}

async function notifyOthers(preview){
  const others = CURRENT_PARTS.filter(p=>p.email!==ME.email);
  const prev = preview.length>80 ? preview.slice(0,77)+'…' : preview;
  for(const o of others){
    try{
      await sb.from('notificaciones').insert({
        employee_id: o.employee_id||null,
        titulo: '💬 '+ME.nombre,
        cuerpo: prev,
        icono: '💬',
        accion: { url: '/m/mensajes.html?conv='+CURRENT.id },
        leido: false,
        created_at: nowISO()
      });
    }catch(e){}
  }
}

/* ---------- TICKET ---------- */
async function toggleTicket(conv){
  const nuevo = conv.estado==='cerrado' ? 'abierto' : 'cerrado';
  const accion = nuevo==='cerrado' ? 'cerrar_ticket' : 'reabrir_ticket';
  const cuerpo = nuevo==='cerrado' ? ('✅ Ticket cerrado por '+ME.nombre) : ('🔄 Ticket reabierto por '+ME.nombre);
  try{
    await sb.from('chat_conversaciones').update({estado:nuevo, ultimo_at:nowISO()}).eq('id',conv.id);
    await sb.from('chat_mensajes').insert({ conversacion_id:conv.id, autor_email:ME.email, autor_nombre:ME.nombre, cuerpo, accion });
    conv.estado=nuevo; CURRENT.estado=nuevo;
    renderActions(conv);
    await loadMessages(conv.id, true);
    loadList();
    toast(nuevo==='cerrado'?'Ticket cerrado':'Ticket reabierto');
  }catch(e){ toast('No se pudo actualizar el ticket'); }
}

/* ---------- ADJUNTAR (foto / cámara / archivo) ---------- */
async function handleFiles(files){
  if(!CURRENT){ toast('Abre una conversación primero'); return; }
  for(const f of files){
    if(!f) continue;
    const isImg = (f.type && f.type.startsWith('image/')) || isImageName(f.name);
    const safe = sanitizeName(f.name || ((isImg?'foto_':'archivo_')+rid()+(isImg?'.jpg':'')));
    const path = CURRENT.id+'/'+Date.now()+'_'+rid()+'_'+safe;
    try{
      const { error } = await sb.storage.from('buzon').upload(path, f, { contentType:f.type||'application/octet-stream', upsert:false });
      if(error) throw error;
      const { data } = sb.storage.from('buzon').getPublicUrl(path);
      PENDING.push({ url:data.publicUrl, name:(f.name||safe), isImage:isImg });
    }catch(e){ toast('No se pudo subir el archivo'); }
  }
  renderPreview();
}
function renderPreview(){
  const box=$('photoPreview');
  box.innerHTML = PENDING.map((p,i)=>{
    if(p.isImage) return '<div class="pv"><img src="'+esc(p.url)+'"><button class="rm" data-i="'+i+'">✕</button></div>';
    return '<div class="pv filechip"><span class="ic">📎</span><span class="nm">'+esc(p.name||fileNameFromUrl(p.url))+'</span><button class="rm" data-i="'+i+'">✕</button></div>';
  }).join('');
  box.querySelectorAll('.rm').forEach(b=> b.onclick=()=>{ PENDING.splice(+b.dataset.i,1); renderPreview(); });
}
/* ---------- menú de adjuntar ---------- */
function toggleAttachMenu(){ $('attachMenu').classList.toggle('hide'); }
function closeAttachMenu(){ $('attachMenu').classList.add('hide'); }

/* ---------- NUEVO CHAT (sheet) ---------- */
async function openNew(){
  $('newSheet').classList.add('show');
  $('ctSearch').value=''; $('ctSearch').focus();
  if(!CONTACTS.length){ await loadContacts(); }
  renderContacts('');
}
function renderContacts(q){
  q=(q||'').toLowerCase().trim();
  const list = CONTACTS.filter(c=> !q || contactName(c).toLowerCase().includes(q) || (c.email||'').toLowerCase().includes(q));
  const box=$('contactList');
  if(!list.length){ box.innerHTML='<div class="empty-inline">Sin resultados</div>'; return; }
  box.innerHTML = list.map(c=>{ const n=contactName(c); const foto=fotoByEmpId(c.employee_id); return '<div class="ct-row" data-email="'+esc(c.email)+'">'+avatarHTML(n,foto,'md')+'<div class="ct-info"><div class="ct-name">'+esc(n)+'</div><div class="ct-mail">'+esc(c.email)+'</div></div></div>'; }).join('');
  box.querySelectorAll('.ct-row').forEach(r=> r.onclick=()=> startChatWith(r.dataset.email));

async function startChatWith(email){
  const c = CONTACTS.find(x=>x.email===email); if(!c) return;
  $('newSheet').classList.remove('show');
  const name = contactName(c);
  // buscar directo 1:1 existente
  try{
    const { data:mine } = await sb.from('chat_conversaciones').select('id').eq('tipo','directo');
    const ids=(mine||[]).map(x=>x.id);
    if(ids.length){
      const { data:pp } = await sb.from('chat_participantes').select('conversacion_id,email').in('conversacion_id',ids);
      const byConv={}; (pp||[]).forEach(p=>{ (byConv[p.conversacion_id]=byConv[p.conversacion_id]||new Set()).add(p.email); });
      for(const cid of Object.keys(byConv)){ const s=byConv[cid]; if(s.size===2 && s.has(ME.email) && s.has(email)){ await openConv(cid); loadList(); return; } }
    }
  }catch(e){}
  // crear nuevo
  try{
    const ts=nowISO();
    const { data:conv, error } = await sb.from('chat_conversaciones')
      .insert({ tipo:'directo', estado:'abierto', created_by:ME.email, ultimo_at:ts }).select().single();
    if(error) throw error;
    await sb.from('chat_participantes').insert([
      { conversacion_id:conv.id, email:ME.email, employee_id:ME.empId, nombre:ME.nombre, last_read_at:ts },
      { conversacion_id:conv.id, email:email, employee_id:c.employee_id||null, nombre:name, last_read_at:null }
    ]);
    await openConv(conv.id);
    loadList();
  }catch(e){ toast('No se pudo iniciar el chat'); }
}

}, 8000); }

/* ---------- UI wiring ---------- */
function autoGrow(){ const t=$('msgInput'); t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; }
function wireUI(){
  $('btnAppBack').onclick = goBack;
  if(EMBED) hide($('btnAppBack'));   // en embed la app anfitriona provee su propio chrome/salida
  $('btnNuevo').onclick = openNew;
  $('btnDir').onclick = showDir;
  $('btnDirBack').onclick = ()=>{ showList(); };
  $('btnCloseNew').onclick = ()=> $('newSheet').classList.remove('show');
  $('newSheet').onclick = (e)=>{ if(e.target===$('newSheet')) $('newSheet').classList.remove('show'); };
  $('ctSearch').oninput = (e)=> renderContacts(e.target.value);
  $('dirSearch').oninput = (e)=> renderDir(e.target.value);
  $('chatSearch').oninput = (e)=> onSearch(e.target.value);
  $('btnBack').onclick = ()=>{ showList(); loadList(); };
  $('btnSend').onclick = sendMessage;
  $('btnAttach').onclick = (e)=>{ e.stopPropagation(); toggleAttachMenu(); };
  $('attachMenu').querySelectorAll('button').forEach(b=> b.onclick=()=>{ const a=b.dataset.act; closeAttachMenu(); $(a==='cam'?'fileCam':a==='foto'?'fileFoto':'fileAny').click(); });
  ['fileCam','fileFoto','fileAny'].forEach(id=>{ $(id).onchange=(e)=>{ handleFiles(Array.from(e.target.files||[])); e.target.value=''; }; });
  document.addEventListener('click', (e)=>{ if($('attachMenu').classList.contains('hide')) return; if(e.target!==$('btnAttach') && !$('attachMenu').contains(e.target)) closeAttachMenu(); });
  $('msgInput').addEventListener('input', autoGrow);
  $('msgInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); } });
}

boot();
</script>
</body></html>
