<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing · Grupo Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434;--up:#1d7a4f;--down:#b8821a}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap;font-size:12px;color:var(--soft)}
.bar .run{font-weight:700;color:var(--txt)}
.bar .seg{margin-left:auto;display:flex;gap:4px}
.bar .seg button{border:1px solid var(--bd);background:var(--surface);border-radius:7px;padding:6px 11px;cursor:pointer;font-size:12px;color:var(--txt)}
.bar .seg button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.legend{padding:0 16px 8px;font-size:11px;color:var(--soft);display:flex;gap:14px;flex-wrap:wrap}
.legend span b{font-weight:700}
.wrap{overflow-x:auto;padding:0 16px 30px}
table{border-collapse:collapse;min-width:900px;background:var(--surface);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--bd);padding:6px 8px;text-align:center;font-variant-numeric:tabular-nums}
thead th{background:#efe6d4;font-size:11px;position:sticky;top:0}
thead th .d{font-size:14px;font-weight:700}
.room{text-align:left;background:#faf5ea;font-weight:600;min-width:180px;font-size:12px}
.room small{display:block;color:var(--soft);font-weight:500}
.cell .rec{font-size:15px;font-weight:700}
.cell .cur{font-size:10px;color:var(--soft)}
.cell .occ{font-size:9px;color:var(--soft)}
.cell.mover{outline:2px solid var(--bad);outline-offset:-2px}
.cell .tag{display:inline-block;font-size:8px;padding:1px 4px;border-radius:3px;font-weight:700;text-transform:uppercase}
.tag.up{background:#dff0e8;color:var(--up)}.tag.down{background:#fbf0db;color:var(--down)}.tag.hold{background:#eee;color:var(--soft)}
.tag.cs{background:#ece3f5;color:#6b4fa0}
.empty{padding:40px 16px;text-align:center;color:var(--soft)}
.empty b{color:var(--txt)}
</style></head><body>
<header>
  <a href="/">← Panel</a>
  <span class="ttl">Pricing <b>Casa Pepe CDMX</b></span>
  <a href="https://casapeperevenue.netlify.app" target="_blank" rel="noopener" style="margin-left:auto">Calendario completo ↗</a>
</header>
<div class="bar">
  <span>Última corrida: <span class="run" id="run">—</span></span>
  <span id="meta"></span>
  <span class="seg" id="seg"></span>
</div>
<div class="legend">
  <span><b style="color:var(--up)">▲</b> subir</span>
  <span><b style="color:var(--down)">▼</b> bajar</span>
  <span><b>=</b> mantener</span>
  <span><b style="color:var(--bad)">borde rojo</b> = MOVER (Δ&gt;15%)</span>
  <span><b style="color:#6b4fa0">CS</b> = precio de compset</span>
  <span>Cada celda: <b>recomendado</b> / actual / ocupación</span>
</div>
<div class="wrap"><table id="tbl"><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="empty" id="empty" style="display:none"></div>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY};
let rows=[], seg='ALL';
const $=id=>document.getElementById(id);
const fmtMX=n=>n==null?'—':'$'+Math.round(n).toLocaleString('es-MX');

async function load(){
  // última corrida
  const last=await fetch(`${SB}/pricing_recomendaciones?select=run_date&order=run_date.desc&limit=1`,{headers:H}).then(r=>r.json());
  if(!last.length){ showEmpty('Aún no hay recomendaciones en Supabase.<br>El pipeline diario las escribirá aquí en la próxima corrida.'); return; }
  const run=last[0].run_date;
  $('run').textContent=run;
  rows=await fetch(`${SB}/pricing_recomendaciones?select=*&run_date=eq.${run}&order=fecha.asc,room_short.asc`,{headers:H}).then(r=>r.json());
  const segs=[...new Set(rows.map(r=>r.segment).filter(Boolean))];
  $('seg').innerHTML=['ALL',...segs].map(s=>`<button data-s="${s}" class="${s===seg?'active':''}">${s==='ALL'?'Todos':s}</button>`).join('');
  document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{seg=b.dataset.s;render()});
  render();
}
function showEmpty(msg){$('tbl').style.display='none';$('empty').style.display='block';$('empty').innerHTML='<b>Sin datos todavía.</b><br>'+msg;}

function render(){
  const data=rows.filter(r=>seg==='ALL'||r.segment===seg);
  if(!data.length){showEmpty('Sin recomendaciones para este segmento.');return;}
  $('tbl').style.display='';$('empty').style.display='none';
  const fechas=[...new Set(data.map(r=>r.fecha))].sort();
  const cuartos=[...new Map(data.map(r=>[r.room_id,{id:r.room_id,name:r.room_name,short:r.room_short}])).values()];
  const movers=data.filter(r=>r.action_flag&&r.action_flag.toUpperCase().includes('MOV')).length;
  $('meta').textContent=`· ${cuartos.length} cuartos · ${fechas.length} días · ${movers} MOVER`;
  const dd=d=>{const x=new Date(d+'T00:00:00');return ['DOM','LUN','MAR','MIÉ','JUE','VIE','SÁB'][x.getDay()]+' '+x.getDate();};
  let th='<tr><th class="room">Cuarto</th>'+fechas.map(f=>`<th><div class="d">${dd(f)}</div></th>`).join('')+'</tr>';
  $('thead').innerHTML=th;
  let html='';
  cuartos.forEach(c=>{
    html+=`<tr><td class="room">${c.short||''}<small>${c.name||''}</small></td>`;
    fechas.forEach(f=>{
      const r=data.find(x=>x.room_id===c.id&&x.fecha===f);
      if(!r){html+='<td></td>';return;}
      const cur=r.current_price, rec=r.final_recommendation;
      let dir='hold',arrow='=';
      if(cur!=null&&rec!=null){ if(rec>cur*1.02){dir='up';arrow='▲'} else if(rec<cur*0.98){dir='down';arrow='▼'} }
      const mover=(r.action_flag||'').toUpperCase().includes('MOV');
      const cs=r.source==='compset';
      const occ=r.room_occupancy_pct!=null?Math.round(r.room_occupancy_pct*100)+'%':'';
      html+=`<td class="cell${mover?' mover':''}" title="${(r.guardrail_note||'').replace(/"/g,'')}">
        <div class="rec">${fmtMX(rec)} <span class="tag ${dir}">${arrow}</span>${cs?' <span class="tag cs">CS</span>':''}</div>
        <div class="cur">actual ${fmtMX(cur)}</div>
        <div class="occ">occ ${occ}</div></td>`;
    });
    html+='</tr>';
  });
  $('tbody').innerHTML=html;
}
load().catch(e=>showEmpty('Error al cargar: '+e.message));
</script></body></html>
