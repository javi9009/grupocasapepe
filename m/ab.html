<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A&B</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--ink-2:#3A3630;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--bad-bg:#F4E2DE;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 90px}
.top h1{margin:0;font-size:21px;font-weight:800}
.top .sub{color:var(--muted);font-size:13px;margin:4px 0 16px;line-height:1.5;max-width:70ch}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.5}
.barra{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.barra input,.barra select{padding:8px 10px;border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:13.5px;background:var(--surface)}
.barra input.q{min-width:230px}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:default}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right;white-space:nowrap}
td input,td select{padding:6px 8px;border:1px solid var(--rule);border-radius:7px;font:inherit;font-size:13px;width:100%}
td input.n{width:84px;text-align:right}
tr.sel{background:var(--accent-soft)}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:var(--surface-2);color:var(--ink-2)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.mini{color:var(--muted);font-size:12px}
.vacio{color:var(--faint);font-size:13px;padding:16px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:60}
.toast.err{background:var(--bad)}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.op{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:15px 17px;box-shadow:var(--shadow)}
.op:hover{border-color:var(--accent)}
.op b{display:block;font-size:15px;margin-bottom:3px}
.op span{color:var(--muted);font-size:12.5px;line-height:1.45;display:block}
.op i{font-style:normal;display:block;margin-top:8px;font-size:12px;font-weight:700;color:var(--accent)}
.dos{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:12px;align-items:start}
@media(max-width:900px){.dos{grid-template-columns:minmax(0,1fr)}}
.arbol{list-style:none;margin:0;padding:0}
.arbol li{padding:6px 9px;border-radius:8px;font-size:13.5px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.arbol li:hover{background:var(--surface-3)}
.arbol li .c{color:var(--faint);font-size:12px}
.n1{font-weight:700}.n2{padding-left:16px!important}.n3{padding-left:32px!important;color:var(--ink-2)}
.aviso{background:var(--warn-bg);border:1px solid #E6D3AE;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#6B4C10;line-height:1.5;margin-bottom:12px}
</style><link rel="icon" type="image/png" href="/dash-192.png">
<script src="/tel.js" defer></script>
</head><body>
<div class="wrap">
  <div class="top"><h1 id="tit">A&amp;B</h1><div class="sub" id="sub"></div></div>
  <div id="cuerpo"><div class="vacio">Cargando…</div></div>
</div>
<div class="toast" id="toast"></div>
<script src="/cp-acceso.js"></script>
<script>if(window.cpAcceso&&!cpAcceso.exige()){throw new Error("sin sesion");}</script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';

  /* SIN BARRA DE PESTANAS ARRIBA. Javi, 4-oct-2026: «no dupliques el menu
     lateral y superior, deja solo el lateral, y cuando le das a A&B aparecen
     las opciones en el medio». El menu de la izquierda ya navega; aqui solo
     se pinta la seccion que pide ?sec=, y sin ?sec salen las opciones. */
  var SEC=(new URLSearchParams(location.search).get('sec')||'').toLowerCase();

  var SECS={
    familias:     {t:'Familias de venta', d:'El arbol por el que se ordena la carta: bebidas, destilados, rones. De aqui cuelga cada producto.'},
    ingredientes: {t:'Ingredientes',      d:'Lo que se compra y se almacena, con su unidad y el ultimo precio que pagamos.'},
    subrecetas:   {t:'Subrecetas',        d:'Lo que se prepara para usarse en otras recetas: la salsa molcajeteada, la mayonesa chipotle, el pa amb tomaquet.'},
    recetas:      {t:'Recetas',           d:'Lo que convierte ingredientes y subrecetas en un producto que se vende. De aqui sale el costo y lo que se descuenta de almacen.'},
    productos:    {t:'Productos a la venta', d:'La ficha de venta: precio, gramaje, foto, descripcion, familia, modificadores y si se puede pedir a la habitacion.'},
    modificadores:{t:'Modificadores',     d:'Lo que cambia un producto al pedirlo: michelada +$, sin pina $0. Cambian el precio y tambien lo que se descuenta.'},
    revisar:      {t:'Por revisar',       d:'Las lineas de receta que no cuadran, con el motivo. Casi todas vienen de como quedo capturado en Poster.'}
  };

  function tok(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');var s=v&&(v.currentSession||v);if(s&&s.access_token)return s.access_token;}}}catch(_){}return KEY;}
  function hdr(x){return Object.assign({'apikey':KEY,'Authorization':'Bearer '+tok(),'Content-Type':'application/json'},x||{});}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2800);}
  function money(n){return n==null?'—':'$'+Number(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
  function num(n){return n==null?'—':Number(n).toLocaleString('es-MX');}
  async function rpc(fn,body){
    var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:hdr(),body:JSON.stringify(body||{})});
    if(!r.ok) throw new Error(fn+': '+r.status+' '+(await r.text()).slice(0,160));
    var t=await r.text(); return t?JSON.parse(t):null;
  }
  async function rest(path,opts){
    var r=await fetch(SB+'/rest/v1/'+path,Object.assign({headers:hdr(opts&&opts.h)},opts||{}));
    if(!r.ok) throw new Error(path+': '+r.status+' '+(await r.text()).slice(0,160));
    var t=await r.text(); return t?JSON.parse(t):null;
  }
  async function guarda(fn,id,p){
    var r=await rpc(fn,{p_id:id||null,p:p});
    if(r&&r.error){ toast(r.error,true); return null; }
    toast('Guardado'); return r;
  }

  var SEDES=[], FAM=[];

  async function arranca(){
    try{ SEDES=await rpc('ab_sedes')||[]; }catch(_){ SEDES=[]; }
    if(!SEC){ return home(); }
    var def=SECS[SEC];
    if(!def){ $('cuerpo').innerHTML='<div class="card"><h3>Esa sección no existe</h3><div class="hint">Elige una del menú de la izquierda.</div></div>'; return; }
    $('tit').textContent=def.t; $('sub').textContent=def.d;
    try{
      if(SEC==='familias')      return familias();
      if(SEC==='ingredientes')  return ingredientes();
      if(SEC==='subrecetas')    return recetas(true);
      if(SEC==='recetas')       return recetas(false);
      if(SEC==='productos')     return productos();
      if(SEC==='modificadores') return modificadores();
      if(SEC==='revisar')       return revisar();
    }catch(e){
      $('cuerpo').innerHTML='<div class="card"><h3>No pude cargar</h3><div class="hint">'+esc(e.message)+'</div></div>';
    }
  }

  /* ---------- las opciones, en el medio ---------- */
  function home(){
    $('sub').textContent='De la compra al plato: lo que se compra, lo que se prepara, lo que se vende y lo que se descuenta de almacén cuando se vende.';
    var orden=['familias','ingredientes','subrecetas','recetas','productos','modificadores','revisar'];
    $('cuerpo').innerHTML='<div class="rejilla">'+orden.map(function(k){
      return '<a class="op" href="/m/ab.html?sec='+k+'"><b>'+esc(SECS[k].t)+'</b><span>'+esc(SECS[k].d)+'</span><i>Abrir →</i></a>';
    }).join('')+'</div>';
  }

  /* ---------- familias ---------- */
  async function familias(){
    FAM=await rpc('ab_familias_arbol')||[];
    $('cuerpo').innerHTML=
      '<div class="card"><div class="barra">'+
        '<button class="btn" id="bNueva">+ Nueva familia</button>'+
        '<span class="mini">'+FAM.length+' familias · '+FAM.reduce(function(a,f){return a+Number(f.productos||0);},0)+' productos colgados</span>'+
      '</div><ul class="arbol" id="arb"></ul></div>';
    $('arb').innerHTML=FAM.map(function(f){
      return '<li class="n'+Math.min(f.nivel+1,3)+'">'+
        '<span>'+esc(f.nombre)+(f.activo?'':' <span class="tag">apagada</span>')+'</span>'+
        '<span class="c">'+(Number(f.productos)||0)+'</span></li>';
    }).join('')||'<div class="vacio">Todavía no hay familias.</div>';
    $('bNueva').onclick=async function(){
      var n=prompt('Nombre de la familia'); if(!n) return;
      var padres=FAM.map(function(f,i){return i+') '+f.ruta;}).join('\n');
      var p=prompt('¿Cuelga de alguna? Escribe su número, o deja vacío para que sea de primer nivel.\n\n'+padres);
      var pid=(p!==null&&p!==''&&FAM[+p])?FAM[+p].id:null;
      if(await guarda('ab_familia_set',null,{nombre:n,parent_id:pid})) familias();
    };
  }

  /* ---------- ingredientes ---------- */
  async function ingredientes(){
    $('cuerpo').innerHTML=
      '<div class="card"><div class="barra">'+
        '<input class="q" id="q" placeholder="Busca un ingrediente…">'+
        '<button class="btn ghost sm" id="bNuevo">+ Nuevo</button>'+
        '<span class="mini" id="cnt"></span></div>'+
      '<div id="tb"><div class="vacio">Cargando…</div></div></div>';
    var t=null;
    $('q').oninput=function(){ clearTimeout(t); t=setTimeout(carga,260); };
    $('bNuevo').onclick=async function(){
      var n=prompt('Nombre del ingrediente'); if(!n) return;
      var u=prompt('¿En qué unidad se compra? kg, l o p','kg')||'kg';
      if(await guarda('ab_insumo_set',null,{nombre:n,unidad:u})) carga();
    };
    carga();
    async function carga(){
      var l=await rpc('ab_ingredientes',{p_q:$('q').value||null,p_limit:300})||[];
      $('cnt').textContent=l.length+(l.length===300?'+':'')+' ingredientes';
      $('tb').innerHTML=l.length?('<table><thead><tr><th>Ingrediente</th><th>Unidad</th><th>Proveedor</th>'+
        '<th class="n">Último costo</th><th>Cuándo</th><th class="n">Recetas</th><th></th></tr></thead><tbody>'+
        l.map(function(i){
          return '<tr data-id="'+i.id+'">'+
            '<td><input data-c="nombre" value="'+esc(i.nombre)+'"></td>'+
            '<td><input data-c="unidad" value="'+esc(i.unidad||'')+'" style="width:70px"></td>'+
            '<td class="mini">'+esc(i.proveedor||'—')+'</td>'+
            '<td class="n">'+(i.ultimo_costo!=null?money(i.ultimo_costo):'<span class="tag warn">sin precio</span>')+'</td>'+
            '<td class="mini">'+esc(i.costo_fecha||'—')+'</td>'+
            '<td class="n">'+num(i.usos)+'</td>'+
            '<td><button class="btn ghost sm" data-g="1">Guardar</button></td></tr>';
        }).join('')+'</tbody></table>'):'<div class="vacio">Nada con esa búsqueda.</div>';
      enlazaFilas('ab_insumo_set');
    }
  }

  /* ---------- recetas y subrecetas ---------- */
  var RSEL=null;
  async function recetas(sub){
    $('cuerpo').innerHTML=
      '<div class="dos">'+
        '<div class="card"><div class="barra">'+
          '<input class="q" id="q" placeholder="Busca…" style="min-width:150px">'+
          '<button class="btn ghost sm" id="bNueva">+ Nueva</button></div>'+
          '<div id="lista"><div class="vacio">Cargando…</div></div></div>'+
        '<div class="card" id="det"><h3>Elige una de la izquierda</h3>'+
          '<div class="hint">Verás sus renglones, con la merma y lo que cuesta cada uno.</div></div>'+
      '</div>';
    var t=null;
    $('q').oninput=function(){ clearTimeout(t); t=setTimeout(carga,260); };
    $('bNueva').onclick=async function(){
      var n=prompt(sub?'Nombre de la subreceta (p. ej. Salsa molcajeteada)':'Nombre de la receta'); if(!n) return;
      var p={nombre:n};
      if(sub){
        var r=prompt('¿Cuánto rinde? Solo el número','1000'); p.rendimiento=Number(r||1);
        p.unidad_rendimiento=prompt('¿En qué unidad? g, ml o p','g')||'g';
      }
      if(await guarda('ab_receta_set',null,p)) carga();
    };
    carga();
    async function carga(){
      var l=await rpc('ab_recetas',{p_sub:!!sub,p_q:$('q').value||null})||[];
      $('lista').innerHTML=l.length?('<table><tbody>'+l.map(function(r){
        return '<tr data-r="'+r.id+'" style="cursor:pointer">'+
          '<td><b>'+esc(r.nombre)+'</b>'+(r.producto&&!sub?'':'')+
            '<div class="mini">'+num(r.renglones)+' renglones'+
            (r.rendimiento&&r.rendimiento!=1?' · rinde '+num(r.rendimiento)+' '+esc(r.unidad_rendimiento||''):'')+'</div></td>'+
          '<td class="n">'+(r.costo_total!=null?money(r.costo_total):'<span class="tag warn">por revisar</span>')+'</td></tr>';
      }).join('')+'</tbody></table>'):'<div class="vacio">Nada todavía.</div>';
      Array.prototype.forEach.call($('lista').querySelectorAll('[data-r]'),function(tr){
        tr.onclick=function(){
          Array.prototype.forEach.call($('lista').querySelectorAll('tr'),function(x){x.classList.remove('sel');});
          tr.classList.add('sel'); abreReceta(tr.getAttribute('data-r'), l);
        };
      });
    }
  }
  async function abreReceta(id,l){
    RSEL=id;
    var r=(l||[]).filter(function(x){return x.id===id;})[0]||{};
    var it=await rpc('ab_receta_items',{p_receta:id})||[];
    var mal=await rest('ab_v_revisar?receta_id=eq.'+id+'&select=item_id,motivo')||[];
    var porItem={}; mal.forEach(function(m){ porItem[m.item_id]=m.motivo; });
    $('det').innerHTML='<h3>'+esc(r.nombre||'Receta')+'</h3>'+
      '<div class="hint">'+(r.rendimiento&&r.rendimiento!=1?('Rinde '+num(r.rendimiento)+' '+esc(r.unidad_rendimiento||'')+'. '):'')+
        'La merma sube el consumo: 10% sobre 100 g obliga a surtir 111 g.</div>'+
      (mal.length?'<div class="aviso">'+mal.length+' renglón'+(mal.length>1?'es':'')+' no cuadra'+(mal.length>1?'n':'')+'. Mientras tanto esta receta se queda sin costo, a propósito: vale más un hueco que un número inventado.</div>':'')+
      (it.length?('<table><thead><tr><th>Lleva</th><th class="n">Cantidad</th><th>Unidad</th><th class="n">Merma %</th><th class="n">Cuesta</th><th></th></tr></thead><tbody>'+
        it.map(function(x){
          return '<tr data-id="'+x.id+'">'+
            '<td>'+esc(x.de||'(vacío)')+(x.tipo==='subreceta'?' <span class="tag">subreceta</span>':'')+
              (porItem[x.id]?'<div class="mini" style="color:var(--bad)">'+esc(porItem[x.id])+'</div>':'')+'</td>'+
            '<td class="n"><input class="n" data-c="cantidad" type="number" step="0.01" value="'+(x.cantidad||0)+'"></td>'+
            '<td><input data-c="unidad" value="'+esc(x.unidad||'')+'" style="width:64px"></td>'+
            '<td class="n"><input class="n" data-c="merma_pct" type="number" step="1" value="'+(x.merma_pct||0)+'" style="width:64px"></td>'+
            '<td class="n">'+(x.costo!=null?money(x.costo):'—')+'</td>'+
            '<td><button class="btn ghost sm" data-g="1">Guardar</button> '+
                '<button class="btn ghost sm" data-del="1">Quitar</button></td></tr>';
        }).join('')+'</tbody></table>'):'<div class="vacio">Sin renglones todavía.</div>')+
      '<div style="margin-top:12px"><button class="btn ghost sm" id="bAdd">+ Añadir ingrediente o subreceta</button></div>';
    enlazaFilas('ab_receta_item_set', function(){ abreReceta(id,l); });
    $('bAdd').onclick=async function(){
      var q=prompt('¿Qué ingrediente? Escribe parte del nombre'); if(!q) return;
      var ing=await rpc('ab_ingredientes',{p_q:q,p_limit:12})||[];
      if(!ing.length) return toast('No encontré ninguno con ese nombre',true);
      var cual=ing.length===1?0:+prompt(ing.map(function(x,i){return i+') '+x.nombre;}).join('\n'));
      if(!ing[cual]) return;
      var c=prompt('¿Cuánto lleva? Solo el número','0');
      var u=prompt('¿En qué unidad? g, ml o p','g')||'g';
      if(await guarda('ab_receta_item_set',null,{receta_id:id,insumo_id:ing[cual].id,cantidad:Number(c||0),unidad:u}))
        abreReceta(id,l);
    };
  }

  /* ---------- productos ---------- */
  async function productos(){
    if(!FAM.length){ try{ FAM=await rpc('ab_familias_arbol')||[]; }catch(_){} }
    $('cuerpo').innerHTML=
      '<div class="card"><div class="barra">'+
        '<select id="sede"><option value="">Todas las sedes</option>'+
          SEDES.map(function(s){return '<option value="'+s.id+'">'+esc(s.nombre)+'</option>';}).join('')+'</select>'+
        '<select id="fam"><option value="">Todas las familias</option>'+
          FAM.map(function(f){return '<option value="'+f.id+'">'+esc(f.ruta)+'</option>';}).join('')+'</select>'+
        '<input class="q" id="q" placeholder="Busca un producto…">'+
        '<button class="btn ghost sm" id="bNuevo">+ Nuevo</button>'+
        '<button class="btn ghost sm" id="bCosto">Recalcular costos</button>'+
        '<span class="mini" id="cnt"></span></div>'+
      '<div id="tb"><div class="vacio">Cargando…</div></div></div>';
    var t=null;
    $('q').oninput=function(){ clearTimeout(t); t=setTimeout(carga,260); };
    $('sede').onchange=carga; $('fam').onchange=carga;
    $('bNuevo').onclick=async function(){
      var n=prompt('Nombre del producto'); if(!n) return;
      var p={nombre:n, property_id:$('sede').value||null, familia_id:$('fam').value||null,
             precio:Number(prompt('Precio de venta','0')||0)};
      if(await guarda('ab_producto_set',null,p)) carga();
    };
    $('bCosto').onclick=async function(){
      var r=await rpc('ab_recalcula_costos');
      if(r&&r.error) return toast(r.error,true);
      toast('Costos al día'); carga();
    };
    carga();
    async function carga(){
      var l=await rpc('ab_productos',{p_familia:$('fam').value||null,p_sede:$('sede').value||null,
                                      p_q:$('q').value||null,p_limit:300})||[];
      $('cnt').textContent=l.length+(l.length===300?'+':'')+' productos';
      $('tb').innerHTML=l.length?('<table><thead><tr><th>Producto</th><th>Familia</th><th>Sede</th>'+
        '<th class="n">Precio</th><th class="n">Gramaje</th><th class="n">Costo</th><th class="n">Margen</th>'+
        '<th>Room service</th><th></th></tr></thead><tbody>'+
        l.map(function(p){
          var m=p.margen_pct;
          var tg=m==null?'<span class="mini">—</span>'
              :'<span class="tag '+(m>=65?'ok':(m>=40?'warn':'bad'))+'">'+Math.round(m)+'%</span>';
          return '<tr data-id="'+p.id+'">'+
            '<td><input data-c="nombre" value="'+esc(p.nombre)+'">'+
              (p.es_receta?'<div class="mini">con receta</div>':'<div class="mini" style="color:var(--faint)">sin receta</div>')+'</td>'+
            '<td class="mini">'+esc(p.familia||'—')+'</td>'+
            '<td class="mini">'+esc(p.sede||'—')+'</td>'+
            '<td class="n"><input class="n" data-c="precio" type="number" step="1" value="'+(p.precio||0)+'"></td>'+
            '<td class="n"><input class="n" data-c="gramaje" value="'+esc(p.gramaje||'')+'" style="width:76px"></td>'+
            '<td class="n">'+(p.costo_teorico!=null?money(p.costo_teorico):'<span class="tag warn">—</span>')+'</td>'+
            '<td class="n">'+tg+'</td>'+
            '<td><input type="checkbox" data-c="room_service" '+(p.room_service?'checked':'')+'></td>'+
            '<td><button class="btn ghost sm" data-g="1">Guardar</button></td></tr>';
        }).join('')+'</tbody></table>'):'<div class="vacio">Nada con ese filtro.</div>';
      enlazaFilas('ab_producto_set');
    }
  }

  /* ---------- modificadores ---------- */
  async function modificadores(){
    var g=await rpc('ab_grupos_mod',{p_sede:null})||[];
    $('cuerpo').innerHTML=
      '<div class="dos">'+
        '<div class="card"><div class="barra"><button class="btn ghost sm" id="bNuevo">+ Nuevo grupo</button></div>'+
          '<div id="lista"></div></div>'+
        '<div class="card" id="det"><h3>Elige un grupo</h3>'+
          '<div class="hint">Un grupo es la pregunta («¿michelada?»); las opciones son las respuestas, cada una con lo que suma al precio y lo que gasta de almacén.</div></div>'+
      '</div>';
    $('lista').innerHTML=g.length?('<table><tbody>'+g.map(function(x){
      return '<tr data-g="'+x.id+'" style="cursor:pointer"><td><b>'+esc(x.nombre)+'</b>'+
        '<div class="mini">'+x.opciones+' opciones · en '+x.productos+' productos · '+esc(x.sede)+'</div></td></tr>';
    }).join('')+'</tbody></table>'):'<div class="vacio">Todavía no hay grupos. El primero suele ser «Michelada» o «Sin ingredientes».</div>';
    Array.prototype.forEach.call($('lista').querySelectorAll('[data-g]'),function(tr){
      tr.onclick=function(){
        Array.prototype.forEach.call($('lista').querySelectorAll('tr'),function(x){x.classList.remove('sel');});
        tr.classList.add('sel'); abreGrupo(tr.getAttribute('data-g'), g);
      };
    });
    $('bNuevo').onclick=async function(){
      var n=prompt('Nombre del grupo (p. ej. Michelada, o Sin ingredientes)'); if(!n) return;
      var max=prompt('¿Cuántas opciones puede elegir como máximo?','1');
      if(await guarda('ab_mod_grupo_set',null,{nombre:n,max_sel:Number(max||1)})) modificadores();
    };
  }
  async function abreGrupo(id,g){
    var gx=(g||[]).filter(function(x){return x.id===id;})[0]||{};
    var l=await rpc('ab_mods_de',{p_grupo:id})||[];
    $('det').innerHTML='<h3>'+esc(gx.nombre||'Grupo')+'</h3>'+
      '<div class="hint">Elige hasta '+(gx.max_sel||1)+'. Lo que pongas en «pone» se descuenta de almacén al vender; lo de «quita» deja de descontarse.</div>'+
      (l.length?('<table><thead><tr><th>Opción</th><th class="n">Precio</th><th>Pone</th><th>Quita</th><th></th></tr></thead><tbody>'+
        l.map(function(m){
          return '<tr data-id="'+m.id+'">'+
            '<td><input data-c="nombre" value="'+esc(m.nombre)+'"></td>'+
            '<td class="n"><input class="n" data-c="delta_precio" type="number" step="1" value="'+(m.delta_precio||0)+'"></td>'+
            '<td class="mini">'+esc(m.pone||'—')+(m.cantidad?' · '+num(m.cantidad)+' '+esc(m.unidad||''):'')+'</td>'+
            '<td class="mini">'+esc(m.quita||'—')+'</td>'+
            '<td><button class="btn ghost sm" data-g="1">Guardar</button> '+
                '<button class="btn ghost sm" data-del="1">Quitar</button></td></tr>';
        }).join('')+'</tbody></table>'):'<div class="vacio">Sin opciones todavía.</div>')+
      '<div style="margin-top:12px"><button class="btn ghost sm" id="bAddM">+ Añadir opción</button></div>';
    enlazaFilas('ab_mod_set', function(){ abreGrupo(id,g); });
    $('bAddM').onclick=async function(){
      var n=prompt('Nombre de la opción (p. ej. michelada cubana, o sin piña)'); if(!n) return;
      var d=prompt('¿Cuánto suma al precio? 0 si no suma','0');
      if(await guarda('ab_mod_set',null,{grupo_id:id,nombre:n,delta_precio:Number(d||0)})) abreGrupo(id,g);
    };
  }

  /* ---------- por revisar ---------- */
  async function revisar(){
    var l=await rest('ab_v_revisar?select=sede,producto,insumo,cantidad,unidad_receta,unidad_insumo,motivo&order=sede,producto&limit=600')||[];
    var por={}; l.forEach(function(r){
      var k=String(r.motivo).replace(/^dice [\d.]+ piezas/,'dice X piezas');
      (por[k]=por[k]||[]).push(r);
    });
    var claves=Object.keys(por).sort(function(a,b){return por[b].length-por[a].length;});
    $('cuerpo').innerHTML=
      '<div class="aviso">'+l.length+' renglones de receta no cuadran. Casi todo viene de cómo quedó capturado en Poster: cantidades en gramos contra ingredientes que se compran por kilo, y «piezas» que en realidad son mililitros. Mientras un renglón esté aquí, su receta se queda sin costo a propósito.</div>'+
      claves.map(function(k){
        var g=por[k];
        return '<div class="card"><h3>'+esc(k)+'</h3>'+
          '<div class="hint">'+g.length+' renglones en '+(new Set(g.map(function(x){return x.producto;}))).size+' productos</div>'+
          '<table><thead><tr><th>Sede</th><th>Producto</th><th>Ingrediente</th><th class="n">Dice</th><th>Se compra en</th></tr></thead><tbody>'+
          g.slice(0,40).map(function(r){
            return '<tr><td class="mini">'+esc(r.sede)+'</td><td>'+esc(r.producto)+'</td><td>'+esc(r.insumo||'—')+'</td>'+
              '<td class="n">'+num(r.cantidad)+' '+esc(r.unidad_receta||'')+'</td><td class="mini">'+esc(r.unidad_insumo||'—')+'</td></tr>';
          }).join('')+'</tbody></table>'+
          (g.length>40?'<div class="mini" style="margin-top:8px">y '+(g.length-40)+' más</div>':'')+
        '</div>';
      }).join('')||'<div class="card"><h3>Todo cuadra</h3><div class="hint">Ninguna línea de receta tiene problemas.</div></div>';
  }

  /* ---------- guardar filas ---------- */
  function enlazaFilas(fn,despues){
    var raiz=$('cuerpo');
    Array.prototype.forEach.call(raiz.querySelectorAll('button[data-g]'),function(b){
      b.onclick=async function(){
        var tr=b.closest('tr'), p={};
        Array.prototype.forEach.call(tr.querySelectorAll('[data-c]'),function(el){
          var c=el.getAttribute('data-c');
          p[c]= el.type==='checkbox' ? el.checked : (el.type==='number' ? Number(el.value||0) : el.value);
        });
        b.disabled=true;
        await guarda(fn, tr.getAttribute('data-id'), p);
        b.disabled=false;
        if(despues) despues();
      };
    });
    Array.prototype.forEach.call(raiz.querySelectorAll('button[data-del]'),function(b){
      b.onclick=async function(){
        var tr=b.closest('tr');
        if(!confirm('¿Quitar este renglón?')) return;
        await guarda(fn, tr.getAttribute('data-id'), {borrar:true});
        if(despues) despues();
      };
    });
  }

  arranca();
})();
</script>
</body></html>
