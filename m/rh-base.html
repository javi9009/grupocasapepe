<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base · ID maestro · Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:12px;color:var(--soft);font-weight:600}
.bar select,.bar input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
.bar .status{margin-left:auto;font-size:12px;color:var(--soft)}.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
.legend{padding:2px 16px 8px;font-size:11px;color:var(--soft)}
.wrap{overflow-x:auto;padding:0 16px 30px}
table{border-collapse:collapse;width:100%;min-width:1000px;background:var(--surface);border-radius:10px;overflow:hidden}
th,td{border:1px solid var(--bd);padding:3px 6px;text-align:left}
thead th{background:#efe6d4;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--bd)}
td input:focus,td select:focus{border-color:var(--accent);background:#fcf8f0;outline:none}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}.tag.act{background:#eaf6f0;color:#176b4c}.tag.pend{background:#fbf0db;color:#8a5a00}
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#cdbf9c;color:#2b2017;font-size:10px;font-weight:700;cursor:pointer;margin-left:4px}
#pop{position:fixed;display:none;max-width:260px;background:#2b2017;color:#f4ecdd;font-size:12px;line-height:1.4;padding:9px 11px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50}#pop b{color:var(--gold)}
</style></head><body>
<header><a href="/">← Panel</a><span class="ttl">Base · ID maestro <b>Grupo Casa Pepe</b></span><span style="font-size:11px;color:#cdbf9c;margin-left:auto">Supabase en vivo</span></header>
<div class="bar">
<label>Ubicación</label><select id="fUbic"><option value="">Todas</option></select>
<label>Área</label><select id="fArea"><option value="">Todas</option></select>
<label>Buscar</label><input id="fTxt" placeholder="nombre, ID…">
<span class="status" id="status"></span>
</div>
<div class="legend">Sábana base que marca el <b>ID</b> de cada persona. De aquí cuelgan las demás sábanas. Da clic en <span class="help">?</span> para ver qué hay detrás de cada columna.</div>
<div class="wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="pop"></div>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
const $=id=>document.getElementById(id); let data=[];
const PROP={'45e69775-d877-4507-a9e1-a45bd3400dc5':'CDMX','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'Virreyes'};
const AREAS=['Front Desk','A&B','A&B · Animación','Cuartos / Housekeeping','Recamaristas / Housekeeping','Experiencias','Virreyes / Sincrético','Prevención / Seguridad','Mantenimiento','Gerencia / Admin','Revenue','Por confirmar',''];
const COLS=[
 {k:'empleado_id',t:'ID',type:'text',w:110,help:'Identificador único del colaborador. Es la llave que une todas las sábanas. Independiente de la sede (si se cambia de ciudad conserva su ID).'},
 {k:'nombre',t:'Nombre',type:'text',help:'Nombre(s) de pila.'},
 {k:'apellido',t:'Apellidos',type:'text',help:'Apellidos. Si el nombre completo está en una sola celda, sepáralos aquí.'},
 {k:'nombre_display',t:'Alias',type:'text',help:'Cómo le dicen los Pepes. Si no tiene alias, se usa su nombre.'},
 {k:'fecha_inicio_labores',t:'Fecha de entrada',type:'date',help:'Fecha en que empezó a trabajar. Base para antigüedad, prueba/planta y vacaciones.'},
 {k:'_ubic',t:'Ubicación',type:'ubic',help:'Sede donde trabaja hoy (CDMX, Puebla, Virreyes). Editable: si se muda de sede, se cambia aquí sin perder el ID.'},
 {k:'area',t:'Área 1',type:'area',help:'Área principal de la empresa donde trabaja.'},
 {k:'area_2',t:'Área 2 (opcional)',type:'area',help:'Segunda área cuando alguien cubre o pertenece a dos equipos.'},
 {k:'estatus',t:'Estatus',type:'ro',help:'Activo o pendiente de alta (viene del formulario de Alta).'},
];
async function sb(p,o){const r=await fetch(SB+p,{headers:H,...o});if(!r.ok){status('⚠ error','err');throw new Error(await r.text())}const c=await r.text();return c?JSON.parse(c):null}
function status(t,c){const s=$('status');s.textContent=t||'';s.className='status'+(c?' '+c:'')}
function ubic(r){return r.sede || PROP[r.property_id] || '';}
function fillFilters(){
 const u=[...new Set(data.map(ubic).filter(Boolean))].sort();
 const a=[...new Set(data.map(r=>r.area).filter(Boolean))].sort();
 $('fUbic').innerHTML='<option value="">Todas</option>'+u.map(x=>`<option>${x}</option>`).join('');
 $('fArea').innerHTML='<option value="">Todas</option>'+a.map(x=>`<option>${x}</option>`).join('');
}
function header(){$('thead').innerHTML=COLS.map(c=>`<th${c.w?` style="min-width:${c.w}px"`:''}>${c.t}<span class="help" data-h="${c.help.replace(/"/g,'&quot;')}">?</span></th>`).join('');}
function vis(){const u=$('fUbic').value,a=$('fArea').value,q=$('fTxt').value.trim().toLowerCase();
 return data.filter(r=>(!u||ubic(r)===u)&&(!a||r.area===a)&&(!q||[r.nombre,r.apellido,r.nombre_display,r.empleado_id].some(v=>(v||'').toLowerCase().includes(q))));}
function areaSel(r,k){return `<select data-id="${r.id}" data-k="${k}">`+AREAS.map(a=>`<option ${(r[k]||'')===a?'selected':''}>${a}</option>`).join('')+'</select>';}
function cell(r,c){
 if(c.type==='ro') return `<span class="tag ${r.estatus==='activo'?'act':'pend'}">${r.estatus||'—'}</span>`;
 if(c.type==='area') return areaSel(r,c.k);
 if(c.type==='ubic') return `<input type="text" value="${ubic(r).replace(/"/g,'&quot;')}" data-id="${r.id}" data-k="sede">`;
 if(c.type==='date') return `<input type="date" value="${r[c.k]||''}" data-id="${r.id}" data-k="${c.k}">`;
 return `<input type="text" value="${(r[c.k]??'').toString().replace(/"/g,'&quot;')}" data-id="${r.id}" data-k="${c.k}">`;
}
function render(){$('tbody').innerHTML=vis().map(r=>'<tr>'+COLS.map(c=>`<td>${cell(r,c)}</td>`).join('')+'</tr>').join('');bind();}
function bind(){
 document.querySelectorAll('#tbody input,#tbody select').forEach(el=>{el.onchange=async()=>{
  const id=el.dataset.id,k=el.dataset.k,v=el.value===''?null:el.value; status('guardando…');
  try{await sb('/employees?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({[k]:v,updated_at:new Date().toISOString()})});
   const row=data.find(x=>x.id===id); if(row) row[k]=v; status('✓ guardado','ok'); if(k==='area'||k==='sede') fillFilters();
  }catch(e){status('⚠ no se guardó','err');}
 };});
}
['fUbic','fArea','fTxt'].forEach(id=>$(id).addEventListener('input',render));
const pop=$('pop');
document.addEventListener('click',e=>{const h=e.target.closest('.help');
 if(h&&h.dataset.h){pop.innerHTML='<b>¿Qué es?</b><br>'+h.dataset.h;pop.style.display='block';const r=h.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-280)+'px';pop.style.top=(r.bottom+6)+'px';e.stopPropagation();}
 else if(!e.target.closest('#pop'))pop.style.display='none';});
(async()=>{header();try{data=await sb("/employees?select=id,empleado_id,nombre,apellido,nombre_display,fecha_inicio_labores,sede,property_id,area,area_2,estatus&estatus=in.(activo,pendiente_alta)&order=area,nombre");}catch(e){data=[];}fillFilters();render();status('✓ guardado','ok');})();
</script></body></html>
