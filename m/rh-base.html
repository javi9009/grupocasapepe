<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Base · ID maestro · Casa Pepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3;--bad:#b03434}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
header{background:#2b2017;color:#f4ecdd;padding:10px 16px;border-bottom:3px solid var(--gold);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header a{color:#cdbf9c;text-decoration:none;font-size:12px}
header .ttl{font-weight:600;font-size:15px}header .ttl b{color:var(--gold)}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap}
.bar label{font-size:12px;color:var(--soft);font-weight:600}
.bar select,.bar input{padding:7px 9px;border:1px solid var(--bd);border-radius:8px;font-size:13px;background:#fff;color:var(--txt)}
.bar .status{margin-left:auto;font-size:12px;color:var(--soft)}.bar .status.ok{color:var(--accent);font-weight:600}.bar .status.err{color:var(--bad);font-weight:600}
.legend{padding:2px 16px 8px;font-size:11px;color:var(--soft)}
.wrap{overflow-x:auto;padding:0 16px 30px}
table{border-collapse:collapse;width:100%;min-width:0;background:var(--surface);border-radius:10px;overflow:hidden;table-layout:fixed}
th,td{border:1px solid var(--bd);padding:3px 6px;text-align:left}
thead th{background:#efe6d4;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0}
td input,td select{width:100%;border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 6px;font-size:13px;font-family:inherit;color:var(--txt)}
td input:hover,td select:hover{border-color:var(--bd)}
td input:focus,td select:focus{border-color:var(--accent);background:#fcf8f0;outline:none}
.tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:20px}.tag.act{background:#eaf6f0;color:#176b4c}.tag.pend{background:#fbf0db;color:#8a5a00}
.help{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;border-radius:50%;background:#cdbf9c;color:#2b2017;font-size:10px;font-weight:700;cursor:pointer;margin-left:4px}
#pop{position:fixed;display:none;max-width:260px;background:#2b2017;color:#f4ecdd;font-size:12px;line-height:1.4;padding:9px 11px;border-radius:8px;box-shadow:0 8px 30px rgba(0,0,0,.3);z-index:50}#pop b{color:var(--gold)}

.colsbtn{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:7px 11px;cursor:pointer;font-size:13px;color:var(--txt)}
#colsPanel{position:absolute;z-index:60;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.25);padding:10px;max-height:72vh;overflow:auto;width:300px;display:none}
#colsPanel.show{display:block}#colsPanel h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--soft)}
.colrow{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;border-bottom:1px solid #f0e8d6}.colrow .nm{flex:1}
.colrow button{border:1px solid var(--bd);background:#faf5ea;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:12px;color:var(--txt)}.colrow button[disabled]{opacity:.35;cursor:default}
th{position:relative;overflow:hidden}
.thwrap{display:flex;align-items:center;gap:3px}
.thsort{cursor:pointer;user-select:none;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thsort:hover{color:var(--accent)}
.colmenu{border:none;background:transparent;cursor:pointer;font-size:14px;color:var(--soft);padding:0 2px;line-height:1}.colmenu:hover{color:var(--accent)}
.rsz{position:absolute;top:0;right:0;width:6px;height:100%;cursor:col-resize;z-index:3}.rsz:hover{background:var(--accent)}
#colMenuPop{position:absolute;z-index:70;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px;display:none;min-width:185px}#colMenuPop.show{display:block}
#colMenuPop button{display:block;width:100%;text-align:left;border:none;background:transparent;padding:7px 10px;font-size:13px;cursor:pointer;border-radius:6px;color:var(--txt)}#colMenuPop button:hover{background:#f4ecdd}
td:first-child,th:first-child{position:sticky;left:0;z-index:1;background:var(--surface)}thead th:first-child{background:#efe6d4}
</style></head><body>
<script>if(window.self!==window.top){document.addEventListener("DOMContentLoaded",function(){var h=document.querySelector("header");if(h)h.style.display="none";});}</script>
<header><a href="/">← Panel</a><span class="ttl">Base · ID maestro <b>Grupo Casa Pepe</b></span><span style="font-size:11px;color:#cdbf9c;margin-left:auto">Supabase en vivo</span></header>
<div class="bar">
<label>Ubicación</label><select id="fUbic"><option value="">Todas</option></select>
<label>Área</label><select id="fArea"><option value="">Todas</option></select>
<label>Buscar</label><input id="fTxt" placeholder="nombre, ID…">
<button class="colsbtn" id="colsBtn" onclick="openCols(event)">⚙ Columnas</button><span class="status" id="status"></span>
</div>
<div class="legend">Sábana base que marca el <b>ID</b> de cada persona. De aquí cuelgan las demás sábanas. Da clic en <span class="help">?</span> para ver qué hay detrás de cada columna.</div>
<div class="wrap"><table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="pop"></div>
<div id="colsPanel"></div>
<div id="colMenuPop"></div>
<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t)H.Authorization='Bearer '+_t;}}catch(e){}
const $=id=>document.getElementById(id); let data=[];
const PROP={'45e69775-d877-4507-a9e1-a45bd3400dc5':'CDMX','3e10a9ea-4913-4f7c-86ef-0c829caa851d':'Virreyes'};
const AREAS=['Front Desk','A&B','A&B · Animación','Cuartos / Housekeeping','Recamaristas / Housekeeping','Experiencias','Virreyes / Sincrético','Prevención / Seguridad','Mantenimiento','Gerencia / Admin','Revenue','Por confirmar',''];
const COLS=[
 {k:'empleado_id',t:'ID',type:'text',w:110,help:'Identificador único del colaborador. Es la llave que une todas las sábanas. Independiente de la sede (si se cambia de ciudad conserva su ID).'},
 {k:'nombre',t:'Nombre',type:'text',help:'Nombre(s) de pila.'},
 {k:'apellido',t:'Apellidos',type:'text',help:'Apellidos. Si el nombre completo está en una sola celda, sepáralos aquí.'},
 {k:'nombre_display',t:'Alias',type:'text',help:'Cómo le dicen los Pepes. Si no tiene alias, se usa su nombre.'},
 {k:'fecha_inicio_labores',t:'Fecha de entrada',type:'date',help:'Fecha en que empezó a trabajar. Base para antigüedad, prueba/planta y vacaciones.'},
 {k:'_ubic',t:'Ubicación',type:'ubic',help:'Sede donde trabaja hoy (CDMX, Puebla, Virreyes). Editable: si se muda de sede, se cambia aquí sin perder el ID.'},
 {k:'area',t:'Área 1',type:'area',help:'Área principal de la empresa donde trabaja.'},
 {k:'area_2',t:'Área 2 (opcional)',type:'area',help:'Segunda área cuando alguien cubre o pertenece a dos equipos.'},
 {k:'rfc',t:'RFC',type:'text',help:'RFC del trabajador. Va en el contrato y nómina.'},
 {k:'curp',t:'CURP',type:'text',help:'CURP del trabajador. Va en el contrato.'},
 {k:'nss',t:'NSS / IMSS',type:'text',help:'Número de seguridad social (IMSS). Va en el contrato.'},
 {k:'fecha_nacimiento',t:'Fecha nac.',type:'date',help:'Fecha de nacimiento. Calcula la edad que aparece en el contrato.'},
 {k:'nacionalidad',t:'Nacionalidad',type:'text',help:'Nacionalidad. Va en las declaraciones del contrato.'},
 {k:'estado_civil',t:'Estado civil',type:'text',help:'Estado civil. Va en el contrato.'},
 {k:'direccion',t:'Domicilio',type:'text',help:'Domicilio del trabajador. Va en el contrato.'},
 {k:'telefono',t:'Teléfono',type:'text',help:'Teléfono de contacto.'},
 {k:'email',t:'Correo',type:'text',help:'Correo electrónico.'},
 {k:'afore',t:'AFORE',type:'text',help:'AFORE del trabajador.'},
 {k:'contacto_nombre',t:'Contacto emerg.',type:'text',help:'Nombre del contacto de emergencia.'},
 {k:'contacto_cel',t:'Cel. contacto',type:'text',help:'Celular del contacto de emergencia.'},
 {k:'estatus',t:'Estatus',type:'ro',help:'Activo o pendiente de alta (viene del formulario de Alta).'},
];
const CKEY='rhbase-cols-v1';
let CFG=(()=>{try{return JSON.parse(localStorage.getItem(CKEY))||{}}catch(e){return{}}})();CFG.order=CFG.order||[];CFG.hidden=CFG.hidden||[];CFG.widths=CFG.widths||{};
function _byk(){const o={};COLS.forEach(c=>o[c.k]=c);return o;}
function _ord(){const byk=_byk();let o=CFG.order.filter(k=>byk[k]);COLS.forEach(c=>{if(!o.includes(c.k))o.push(c.k);});return o;}
function activeCols(){const byk=_byk();return _ord().filter(k=>!CFG.hidden.includes(k)).map(k=>byk[k]);}
function saveCfg(){localStorage.setItem(CKEY,JSON.stringify(CFG));}
let SORT={k:null,dir:1};
function sortBy(k){if(SORT.k===k)SORT.dir=-SORT.dir;else{SORT.k=k;SORT.dir=1;}header();render();}
let _rk=null,_rx=0,_rw=0;
function startRsz(e,k){e.preventDefault();e.stopPropagation();_rk=k;_rx=e.clientX;const th=document.querySelector('th[data-k="'+k+'"]');_rw=th?th.offsetWidth:130;document.addEventListener('mousemove',_onRsz);document.addEventListener('mouseup',_endRsz);}
function _onRsz(e){if(!_rk)return;const w=Math.max(60,_rw+(e.clientX-_rx));CFG.widths=CFG.widths||{};CFG.widths[_rk]=w;const th=document.querySelector('th[data-k="'+_rk+'"]');if(th){th.style.width=w+'px';th.style.minWidth=w+'px';}}
function _endRsz(){if(_rk){saveCfg();}_rk=null;document.removeEventListener('mousemove',_onRsz);document.removeEventListener('mouseup',_endRsz);}
function colMenu(e,k){e.stopPropagation();const p=$('colMenuPop');
 p.innerHTML='<button data-a="asc">↑ Ordenar A → Z</button><button data-a="desc">↓ Ordenar Z → A</button><button data-a="left">◀ Mover a la izquierda</button><button data-a="right">▶ Mover a la derecha</button><button data-a="hide">✕ Ocultar columna</button>';
 p.querySelectorAll('button').forEach(function(b){b.onclick=function(){var a=b.dataset.a;if(a==='asc'){SORT={k:k,dir:1};header();render();}else if(a==='desc'){SORT={k:k,dir:-1};header();render();}else if(a==='left'){moveCol(k,-1);}else if(a==='right'){moveCol(k,1);}else if(a==='hide'){if(!CFG.hidden.includes(k))CFG.hidden.push(k);saveCfg();header();render();}p.classList.remove('show');};});
 const r=e.target.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-190)+'px';p.style.top=(r.bottom+4+window.scrollY)+'px';p.classList.add('show');}
document.addEventListener('click',function(e){if(!e.target.closest('#colMenuPop')&&!e.target.closest('.colmenu'))$('colMenuPop').classList.remove('show');});
function moveCol(k,dir){const o=_ord();const i=o.indexOf(k),j=i+dir;if(j<0||j>=o.length)return;o.splice(i,1);o.splice(j,0,k);CFG.order=o;saveCfg();renderColsPanel();header();render();}
function renderColsPanel(){const byk=_byk();const o=_ord();
 $('colsPanel').innerHTML='<h4>Columnas · mostrar y ordenar</h4>'+o.map((k,i)=>{const c=byk[k];const v=!CFG.hidden.includes(k);return `<div class="colrow"><input type="checkbox" data-vk="${k}" ${v?'checked':''}><span class="nm">${c.t}</span><button data-up="${k}" ${i===0?'disabled':''}>▲</button><button data-dn="${k}" ${i===o.length-1?'disabled':''}>▼</button></div>`;}).join('')+'<div style="margin-top:8px;text-align:right"><button class="colsbtn" id="colsReset">Restaurar</button> <button class="colsbtn" id="colsClose">Cerrar</button></div>';
 $('colsPanel').querySelectorAll('[data-vk]').forEach(cb=>cb.onchange=()=>{const k=cb.dataset.vk;if(cb.checked)CFG.hidden=CFG.hidden.filter(x=>x!==k);else if(!CFG.hidden.includes(k))CFG.hidden.push(k);saveCfg();header();render();});
 $('colsPanel').querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>moveCol(b.dataset.up,-1));
 $('colsPanel').querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>moveCol(b.dataset.dn,1));
 $('colsReset').onclick=()=>{CFG={order:[],hidden:[]};saveCfg();renderColsPanel();header();render();};
 $('colsClose').onclick=()=>$('colsPanel').classList.remove('show');}
function openCols(e){renderColsPanel();const p=$('colsPanel');const r=e.target.getBoundingClientRect();p.style.left=Math.min(r.left,innerWidth-310)+'px';p.style.top=(r.bottom+6+window.scrollY)+'px';p.classList.add('show');e.stopPropagation();}
document.addEventListener('click',e=>{if(!e.target.closest('#colsPanel')&&!e.target.closest('#colsBtn'))$('colsPanel').classList.remove('show');});
async function sb(p,o){const r=await fetch(SB+p,{headers:H,...o});if(!r.ok){status('⚠ error','err');throw new Error(await r.text())}const c=await r.text();return c?JSON.parse(c):null}
function status(t,c){const s=$('status');s.textContent=t||'';s.className='status'+(c?' '+c:'')}
function ubic(r){return r.sede || PROP[r.property_id] || '';}
function fillFilters(){
 const u=[...new Set(data.map(ubic).filter(Boolean))].sort();
 const a=[...new Set(data.map(r=>r.area).filter(Boolean))].sort();
 $('fUbic').innerHTML='<option value="">Todas</option>'+u.map(x=>`<option>${x}</option>`).join('');
 $('fArea').innerHTML='<option value="">Todas</option>'+a.map(x=>`<option>${x}</option>`).join('');
}
function header(){$('thead').innerHTML=activeCols().map(c=>{const w=(CFG.widths&&CFG.widths[c.k])||c.w||130;return `<th data-k="${c.k}" style="width:${w}px;min-width:${w}px"><div class="thwrap"><span class="thsort" onclick="sortBy('${c.k}')">${c.t}${SORT.k===c.k?(SORT.dir>0?' ▲':' ▼'):''}</span><span class="help" data-h="${c.help.replace(/"/g,'&quot;')}">?</span><button class="colmenu" onclick="colMenu(event,'${c.k}')">⋮</button></div><span class="rsz" onmousedown="startRsz(event,'${c.k}')"></span></th>`;}).join('');}
function vis(){const u=$('fUbic').value,a=$('fArea').value,q=$('fTxt').value.trim().toLowerCase();
 let rows=data.filter(r=>(!u||ubic(r)===u)&&(!a||r.area===a)&&(!q||[r.nombre,r.apellido,r.nombre_display,r.empleado_id].some(v=>(v||'').toLowerCase().includes(q))));
 if(SORT.k){const k=SORT.k,d=SORT.dir;const val=r=>k==='_ubic'?ubic(r):(r[k]==null?'':r[k]);rows=rows.slice().sort((x,y)=>(''+val(x)).localeCompare(''+val(y),'es',{numeric:true})*d);}
 return rows;}
function areaSel(r,k){return `<select data-id="${r.id}" data-k="${k}">`+AREAS.map(a=>`<option ${(r[k]||'')===a?'selected':''}>${a}</option>`).join('')+'</select>';}
function cell(r,c){
 if(c.type==='ro') return `<span class="tag ${r.estatus==='activo'?'act':'pend'}">${r.estatus||'—'}</span>`;
 if(c.type==='area') return areaSel(r,c.k);
 if(c.type==='ubic') return `<input type="text" value="${ubic(r).replace(/"/g,'&quot;')}" data-id="${r.id}" data-k="sede">`;
 if(c.type==='date') return `<input type="date" value="${r[c.k]||''}" data-id="${r.id}" data-k="${c.k}">`;
 return `<input type="text" value="${(r[c.k]??'').toString().replace(/"/g,'&quot;')}" data-id="${r.id}" data-k="${c.k}">`;
}
function render(){$('tbody').innerHTML=vis().map(r=>'<tr>'+activeCols().map(c=>`<td>${cell(r,c)}</td>`).join('')+'</tr>').join('');bind();}
function bind(){
 document.querySelectorAll('#tbody input,#tbody select').forEach(el=>{el.onchange=async()=>{
  const id=el.dataset.id,k=el.dataset.k,v=el.value===''?null:el.value; status('guardando…');
  try{await sb('/employees?id=eq.'+id,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({[k]:v,updated_at:new Date().toISOString()})});
   const row=data.find(x=>x.id===id); if(row) row[k]=v; status('✓ guardado','ok'); if(k==='area'||k==='sede') fillFilters();
  }catch(e){status('⚠ no se guardó','err');}
 };});
}
['fUbic','fArea','fTxt'].forEach(id=>$(id).addEventListener('input',render));
const pop=$('pop');
document.addEventListener('click',e=>{const h=e.target.closest('.help');
 if(h&&h.dataset.h){pop.innerHTML='<b>¿Qué es?</b><br>'+h.dataset.h;pop.style.display='block';const r=h.getBoundingClientRect();pop.style.left=Math.min(r.left,innerWidth-280)+'px';pop.style.top=(r.bottom+6)+'px';e.stopPropagation();}
 else if(!e.target.closest('#pop'))pop.style.display='none';});
(async()=>{header();try{data=await sb("/employees?select=id,empleado_id,nombre,apellido,nombre_display,fecha_inicio_labores,sede,property_id,area,area_2,rfc,curp,nss,fecha_nacimiento,nacionalidad,estado_civil,direccion,telefono,email,afore,contacto_nombre,contacto_cel,estatus&estatus=in.(activo,pendiente_alta)&order=area,nombre");}catch(e){data=[];}fillFilters();render();status('✓ guardado','ok');})();
</script></body></html>
