<!doctype html><html lang="es"><head>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocupación del Ateneo</title>
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- CALENDARIO DE OCUPACIÓN (coworking + residencias). APARTE del calendario de
     eventos (salas): aquí la variable son PERSONAS (pax). Coworking = socios con
     plan vigente + daypass del día (deck, oficinas, daypass). Residencias = camas:
     cada reserva de dorm es 1 pax (una cama); una privada toma su cuarto completo.
     La capacidad (Y) sale del editor de espacios. Javi, 3-oct. -->
<style>
:root{
  --ground:#F4F1EA; --blanco:#fff; --tinta:#2c2c2a; --gris:#5f5e5a; --tenue:#8a897f;
  --linea:rgba(0,0,0,.10); --cow:#1F6FB2; --res:#9A5B2E; --verde:#1d9e75; --ambar:#C98A1A; --rojo:#B5452F;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -24px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
.top{max-width:980px;margin:0 auto;padding:24px 16px 4px}
.top .migaja{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--tenue)}
.top h1{margin:6px 0 0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:25px;letter-spacing:.02em;text-transform:uppercase}
.nav{max-width:980px;margin:14px auto 0;padding:0 16px;display:flex;align-items:center;gap:8px}
.nav button{font:inherit;border:1px solid var(--linea);background:#fff;border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--gris)}
.nav button:hover{border-color:var(--cow);color:var(--cow)}
.nav .hoy{color:var(--tinta)}
.nav .fch{font-family:Oswald,Inter,sans-serif;font-weight:600;text-transform:capitalize;font-size:15px;min-width:180px;text-align:center}
.strip{max-width:980px;margin:12px auto 0;padding:0 16px;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.d{background:#fff;border:1px solid var(--linea);border-radius:10px;padding:7px 4px;text-align:center;cursor:pointer}
.d.sel{border-color:var(--tinta);box-shadow:0 0 0 1px var(--tinta)}
.d .dn{font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--tenue)}
.d .dd{font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:16px}
.d .bars{display:flex;gap:2px;justify-content:center;margin-top:3px}
.d .bars i{width:10px;height:4px;border-radius:2px;background:#e5e0d4;display:block}
.wrap{max-width:980px;margin:16px auto 0;padding:0 16px 70px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:720px){.wrap{grid-template-columns:1fr} .strip{gap:4px}}
.card{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);overflow:hidden}
.card .ch{display:flex;align-items:center;gap:9px;padding:14px 16px 10px}
.card .ch .ic{font-size:20px}
.card .ch h2{margin:0;font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.02em}
.card.cow{border-top:3px solid var(--cow)} .card.res{border-top:3px solid var(--res)}
.xy{padding:0 16px;display:flex;align-items:baseline;gap:8px}
.xy .big{font-family:Oswald,Inter,sans-serif;font-weight:700;font-size:34px;line-height:1}
.xy .of{color:var(--tenue);font-size:15px}
.xy .pct{margin-left:auto;font-weight:700;font-size:14px}
.bar{height:9px;background:#eee7da;border-radius:99px;margin:10px 16px 4px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.mas{margin:6px 16px 4px;background:none;border:0;color:var(--cow);font:inherit;font-weight:700;font-size:12px;cursor:pointer;padding:4px 0}
.card.res .mas{color:var(--res)}
.desg{display:none;padding:2px 16px 14px}
.desg.on{display:block}
.lin{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--linea);font-size:13px}
.lin .nm{font-weight:600}
.lin .n{margin-left:auto;font-weight:700}
.lin .de{color:var(--tenue);font-size:11.5px}
.foot{max-width:980px;margin:0 auto;padding:0 16px 40px;color:var(--tenue);font-size:12px}
.warn{color:var(--ambar)}
</style>
</head>
<body>
<div class="top">
  <div class="migaja">Operación · Ateneo</div>
  <h1>Ocupación</h1>
</div>
<div class="nav">
  <button id="prev">‹</button>
  <div class="fch" id="fch">…</div>
  <button id="next">›</button>
  <button class="hoy" id="hoy">Hoy</button>
</div>
<div class="strip" id="strip"></div>
<div class="wrap" id="wrap"></div>
<div class="foot" id="foot"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DN=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
function hoyMX(){ const d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'})); d.setHours(0,0,0,0); return d; }
function iso(d){ return d.toISOString().slice(0,10); }
function addD(d,n){ const x=new Date(d); x.setDate(x.getDate()+n); return x; }
function parseD(s){ return s?new Date(String(s).slice(0,10)+'T00:00:00'):null; }

/* ---- capacidad (Y) y catálogo de espacios ---- */
let LUG=[]; // ateneo_lugares
function capYpax(cat){ return LUG.filter(l=>l.activo!==false && (l.categoria||'coworking')===cat).reduce((s,l)=>s+(+l.capacidad||0),0); }
function cuartoDe(hab){ return LUG.find(l=>(l.categoria==='residencias')&&String(l.numero||'').trim()===String(hab||'').trim()); }

/* ---- fuentes de ocupación ---- */
let INSC=[], RES=[];
async function cargarBase(){
  const [lg,ins,res]=await Promise.all([
    sb.from('ateneo_lugares').select('numero,categoria,tipo,capacidad,activo'),
    sb.from('inscripciones_coworking').select('plan_id,plan_nombre,unidad,fecha_inicio,pax,estado'),
    sb.from('ateneo_residencias_reservas').select('unidad,habitacion,fecha_inicio,fecha_fin,estado')
  ]);
  LUG=lg.data||[]; INSC=ins.data||[]; RES=res.data||[];
}

/* Mapa plan → tipo de coworking. Virtual no ocupa espacio físico. */
function planTipo(i){
  const s=((i.plan_id||'')+' '+(i.plan_nombre||'')).toLowerCase();
  if(s.includes('virtual')) return null;
  if(s.includes('ofi')) return 'oficina';
  if(s.includes('day')) return 'daypass';
  return 'deck'; // ateneista, semanal, coworker…
}
function planPeriodoDias(i){
  const s=((i.plan_id||'')+' '+(i.plan_nombre||'')).toLowerCase();
  if(s.includes('day')) return 1;
  if(s.includes('seman')) return 7;
  return 31; // mensual por defecto
}
function inscActiva(i,D){
  if((i.estado||'').match(/cancel|baja|rechaz/i)) return false;
  const ini=parseD(i.fecha_inicio); if(!ini) return false;
  const fin=addD(ini, planPeriodoDias(i)-1);
  return D>=ini && D<=fin;
}

function ocupacionCoworking(D){
  const r={deck:0,oficina:0,daypass:0,total:0};
  INSC.forEach(i=>{ if(!inscActiva(i,D))return; const t=planTipo(i); if(!t)return;
    const pax=+i.pax||1; r[t]+=pax; r.total+=pax; });
  return r;
}
function ocupacionResidencias(D){
  const r={dorm:0,privada:0,total:0,sinCuarto:0};
  RES.forEach(x=>{ if((x.estado||'').match(/cancel|rechaz/i))return;
    const ini=parseD(x.fecha_inicio), fin=parseD(x.fecha_fin);
    if(!ini||!fin||D<ini||D>fin) return;
    const cu=cuartoDe(x.habitacion);
    const esDorm = cu ? (String(cu.tipo||'').toLowerCase().includes('dorm')) : /-\d+$/.test(String(x.unidad||''));
    if(esDorm){ r.dorm+=1; r.total+=1; }
    else { const pax = cu ? (+cu.capacidad||1) : 1; r.privada+=pax; r.total+=pax; if(!cu) r.sinCuarto+=1; }
  });
  return r;
}

let SEL=hoyMX();
function barColor(p){ return p>=0.9?'var(--rojo)':p>=0.7?'var(--ambar)':'var(--verde)'; }

function pintarStrip(){
  const base=addD(SEL,-3);
  $('#strip').innerHTML=Array.from({length:7},(_,k)=>{
    const d=addD(base,k); const cw=ocupacionCoworking(d), rs=ocupacionResidencias(d);
    const yc=capYpax('coworking'), yr=capYpax('residencias');
    const pc=yc?cw.total/yc:0, pr=yr?rs.total/yr:0;
    const sel=iso(d)===iso(SEL);
    return '<div class="d'+(sel?' sel':'')+'" data-d="'+iso(d)+'">'
      +'<div class="dn">'+DN[d.getDay()]+'</div><div class="dd">'+d.getDate()+'</div>'
      +'<div class="bars"><i style="background:'+(cw.total?barColor(pc):'#e5e0d4')+'"></i>'
        +'<i style="background:'+(rs.total?barColor(pr):'#e5e0d4')+'"></i></div></div>';
  }).join('');
  $('#strip').querySelectorAll('.d').forEach(e=>e.onclick=()=>{ SEL=parseD(e.dataset.d); render(); });
}

function cardHTML(cat){
  const D=SEL;
  const esCow=cat==='coworking';
  const occ=esCow?ocupacionCoworking(D):ocupacionResidencias(D);
  const Y=capYpax(cat);
  const p=Y?occ.total/Y:0;
  const lineas = esCow
    ? [['🪑 Deck (ateneístas)',occ.deck],['🚪 Oficinas',occ.oficina],['🎟️ Day pass',occ.daypass]]
    : [['🛏 Dorm (camas)',occ.dorm],['🚪 Privadas',occ.privada]];
  const cls=esCow?'cow':'res';
  const nota = (!Y) ? '<div class="lin"><span class="de warn">Define los espacios en el editor para tener el total (Y).</span></div>'
    : (!esCow && occ.sinCuarto ? '<div class="lin"><span class="de warn">'+occ.sinCuarto+' reserva(s) sin cuarto en el editor · contadas como 1 pax.</span></div>':'');
  return '<div class="card '+cls+'">'
    +'<div class="ch"><span class="ic">'+(esCow?'💻':'🛏')+'</span><h2>'+(esCow?'Coworking':'Residencias')+'</h2></div>'
    +'<div class="xy"><span class="big">'+occ.total+'</span><span class="of">/ '+(Y||'—')+' pax</span>'
      +'<span class="pct" style="color:'+(Y?barColor(p):'var(--tenue)')+'">'+(Y?Math.round(p*100)+'%':'')+'</span></div>'
    +'<div class="bar"><i style="width:'+(Y?Math.min(100,Math.round(p*100)):0)+'%;background:'+(Y?barColor(p):'#ccc')+'"></i></div>'
    +'<button class="mas" data-cat="'+cat+'">+ Desglose</button>'
    +'<div class="desg" id="desg-'+cat+'">'
      +lineas.map(l=>'<div class="lin"><span class="nm">'+l[0]+'</span><span class="n">'+l[1]+'</span></div>').join('')
      +nota+'</div></div>';
}

function render(){
  $('#fch').textContent = DN[SEL.getDay()]+' '+SEL.getDate()+' '+MES[SEL.getMonth()];
  pintarStrip();
  $('#wrap').innerHTML = cardHTML('coworking')+cardHTML('residencias');
  $('#wrap').querySelectorAll('.mas').forEach(b=>b.onclick=()=>{ const d=$('#desg-'+b.dataset.cat); d.classList.toggle('on'); b.textContent=d.classList.contains('on')?'– Ocultar':'+ Desglose'; });
  $('#foot').textContent='Coworking: socios con plan vigente + daypass del día. Residencias: dorm = 1 cama por reserva; privada = cuarto completo (su pax). La capacidad (Y) sale del editor de espacios.';
}

$('#prev').onclick=()=>{ SEL=addD(SEL,-1); render(); };
$('#next').onclick=()=>{ SEL=addD(SEL,1); render(); };
$('#hoy').onclick=()=>{ SEL=hoyMX(); render(); };

sb.auth.getSession().then(async ({data})=>{
  if(!data||!data.session){ $('#wrap').innerHTML='<div class="foot">Abre esta pantalla desde el panel (necesita tu sesión).</div>'; return; }
  await cargarBase(); render();
});
</script>
</body></html>
