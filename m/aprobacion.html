<!--
  LA COLA DE APROBACION. Javi, 26-oct-2026.

  Es la pantalla mas importante del panel: el ateneista puede crear lo que
  quiera, pero nada sale a la venta sin que alguien de la casa lo mire. Si
  esta cola se atasca, la plataforma se para -por eso lo que lleva mas de
  48 horas esperando sale en rojo.

  TRES REGLAS QUE NO SE NEGOCIAN:

  1. Rechazar pide motivo. Sin motivo no hay boton: un "no" sin razon
     obliga al ateneista a adivinar y vuelve dos veces.
  2. No se publica a quien no puede cobrar. Antes de aprobar se mira el
     candado del dueno -lo mismo que mira la base- y si bloquea, se avisa
     y se pregunta. Publicar a alguien sin Stripe es vender boletos que
     nadie puede cobrar; ya paso con tres productoras.
  3. Todo deja rastro en historia: que se aprobo, quien y cuando.

  Los terminos sin escribir van abajo y NO llevan boton de aprobar: no son
  una decision, son una tarea de la casa.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}
.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.verde{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}
.filtros{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filtros input,.filtros select{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.pill{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.al{background:var(--alerta-bg);color:var(--alerta)}
.pill.er{background:var(--error-bg);color:var(--error)}
.pill.ne{background:var(--hueso);color:var(--gris)}
.pill.na{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.pill.mg{background:var(--magenta-suave);color:#B3106F}
.pill.ci{background:var(--cielo-suave);color:#2F6E93}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:center;padding:13px 15px;margin-bottom:10px}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
/* LA TARJETA GRANDE. Javi, 30-oct-2026: «me puedes poner el detalle más grande
   con precio, foto, etc para poder analizarlos mejor». Decidir sin ver la foto
   ni el precio es abrir otra pantalla por cada cosa de la cola; y la cola es
   justo donde se decide rápido. */
.fila .shot{flex:0 0 132px;width:132px;height:99px;border-radius:10px;background:var(--hueso) center/cover;
  display:grid;place-items:center;font-size:27px;color:var(--tenue);overflow:hidden}
@media(max-width:760px){.fila{flex-wrap:wrap}.fila .shot{flex:0 0 100%;width:100%;height:150px}}
.fila .datos{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
.fila .dato{font:600 11.5px Inter;background:var(--hueso);border-radius:7px;padding:3px 9px;color:var(--tinta)}
.fila .dato.gratis{background:var(--ok-bg,#E1F0E7);color:var(--ok,#1D6B4A)}
.fila .dato.mal{background:var(--error-bg);color:var(--error)}
.fila .texto{font:400 12.5px Inter;color:var(--gris);margin-top:7px;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:34px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 16px Oswald;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;display:none;z-index:60;box-shadow:var(--sombra)}
@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}
h2{font:700 15px Oswald;letter-spacing:.07em;text-transform:uppercase;margin:26px 0 10px;color:var(--tinta);
  display:flex;align-items:center;gap:9px}
h2 em{font:600 11px Inter;font-style:normal;color:var(--gris);background:var(--hueso);border-radius:999px;padding:2px 9px}
.fila{align-items:flex-start}
.fila.viejo{border-color:#E7B3AA;box-shadow:0 0 0 1px #F6E1DD inset,var(--sombra)}
.ico{flex:0 0 42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--hueso)}
.acc{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;align-items:stretch}
.espera{font:400 11.5px Inter;color:var(--tenue);margin-top:5px}
.espera.rojo{color:var(--error);font-weight:600}
.espera.verde{color:var(--ok,#1D6B4A);font-weight:600}
.motivo{margin-top:10px;display:none}
.motivo.on{display:block}
.motivo textarea{width:100%;border:1.5px solid var(--linea);border-radius:9px;padding:9px 11px;min-height:62px;resize:vertical;background:#fff}
.motivo .pie{display:flex;gap:8px;align-items:center;margin-top:7px}
.motivo .pie span{font:400 11.5px Inter;color:var(--tenue)}
.candado{margin-top:8px;background:var(--error-bg);color:var(--error);border-radius:9px;padding:8px 11px;font-size:12.5px;display:none}
.candado.on{display:block}

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, YO='', FALLO='', CARGANDO=true;
var EXPS=[], EVTS=[], ATES=[], CAND={}, OPS={};
/* LAS OTRAS DOS COSAS QUE LA CASA AUTORIZA. Javi, 30-oct-2026: «en el
   dashboard no tenemos ningún lugar donde autorizar salas, ¿dónde está?».
   Sí estaba —🗝️ Peticiones de sala— pero esa pantalla solo enseñaba las
   peticiones de salas cuyo nombre lleva «cumbre», así que el Teatro, la
   Galería y las Áreas comunes no salían por ningún lado; y encima solo
   dejaba decidir a ateneo@casapepe.mx, una cuenta que ya no lleva nadie,
   cuando la base solo pide ser equipo de casa. Dos candados escritos a mano
   que no estaban en la base: por eso parecía que el sitio no existía.
   Ahora las cuatro cosas que autoriza la casa viven aquí. */
var SALAS=[], HOT=[];
var FSALA='', FQ='';   /* filtros de la cola de salas */
var FOTO={}, PRODN={};   /* portada por ficha y nombre de cada productora */
/* Las dos salas que además pasan por su sede: lo que la casa valida aquí,
   Ana lo acepta después en su portal de Cumbre. */
var SEDE_ANA=['Café Cumbre','Galería'];
function esDeAna(n){ return SEDE_ANA.indexOf(String(n||''))>=0; }

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},3200);}

function horas(iso){ if(!iso) return null;
  try{ return Math.floor((Date.now()-new Date(iso).getTime())/3600000); }catch(_){ return null; } }
function espera(iso){
  var h=horas(iso); if(h==null) return ['','sin fecha'];
  if(h<1) return ['','llegó hace un momento'];
  if(h<24) return ['','esperando '+h+' h'];
  var d=Math.floor(h/24);
  return [h>=48?'rojo':'', 'esperando '+d+' día'+(d>1?'s':'')];
}

/* El candado se lee de la base, no se recalcula aqui. Si la vista dice que
   bloquea, bloquea. */
function bloqueos(opId){
  var c=CAND[opId]; if(!c) return [];
  try{ return (c.bloquea||[]).map(function(b){ return b.texto||b.clave||String(b); }); }catch(_){ return []; }
}

async function historia(entidad,id,que,detalle){
  try{
    await fetch(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
      body:JSON.stringify({entidad:entidad,entidad_id:id,que:que,quien:YO||'el equipo',detalle:detalle||null})});
  }catch(_){}
}

/* El correo lo manda la funcion, que es la unica que puede crear la cuenta:
   desde el navegador no se toca auth ni con la sesion del equipo. */
async function aviso(accion,id,motivo){
  try{
    var r=await fetch(SB+'/functions/v1/ateneista-aviso',{method:'POST',
      headers:Object.assign(hdr(),{}),
      body:JSON.stringify({accion:accion,id:id,motivo:motivo||null})});
    var j=await r.json().catch(function(){return null;});
    if(!r.ok || !j) return {ok:false,error:'la función respondió '+r.status};
    return {ok: j.correo!==false && j.ok!==false, error: j.motivo||j.error||null};
  }catch(e){ return {ok:false,error:String((e&&e.message)||e)}; }
}

async function patch(tabla,id,cambios){
  var r=await fetch(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
    {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),body:JSON.stringify(cambios)});
  if(!r.ok) throw new Error('la base respondió '+r.status+' · '+(await r.text()).slice(0,140));
}

/* ---------- aprobar y rechazar ---------- */
async function aprobar(tipo,id){
  var it=buscar(tipo,id); if(!it) return;
  if(tipo==='exp'){
    var b=bloqueos(it.operador_id);
    if(b.length && !confirm('A '+(OPS[it.operador_id]||'este ateneísta')+' le falta: '+b.join(', ')+
        '.\n\nPublicar ahora es poner a la venta algo que todavía no se le puede cobrar.\n\n¿Lo publico igual?')) return;
  }
  var ahora=new Date().toISOString();
  try{
    if(tipo==='exp'){ await patch('op_experiencias',id,{estado:'publicada',publicada_at:ahora});
      await historia('experiencia',id,'publicada',{desde:'en_revision'}); }
    if(tipo==='evt'){ await patch('eventos',id,{estado:'publicado',validado_at:ahora,validado_por:YO||null,
        devuelto_at:null, devuelto_por:null});
      await historia('evento',id,'publicado',{desde:'propuesto'}); }
    if(tipo==='ate'){ await patch('tour_operadores',id,{estado:'activo'});
      await historia('ateneista',id,'alta aprobada',{desde:'en_revision'}); }
    /* APROBAR UN ATENEISTA ES ABRIRLE LA PUERTA. Hasta aqui no tenia cuenta:
       la funcion le crea el usuario y le manda la liga para poner contrasena.
       Si el correo no sale, el alta YA quedo aprobada -no se deshace por un
       correo- pero se dice en voz alta, porque si no el que espera se queda
       esperando sin que nadie lo sepa. */
    if(tipo==='ate'){
      var c=await aviso('aprobada',id);
      avisa(c.ok ? 'Aprobado · le mandamos la liga para su contraseña'
                 : 'Aprobado, PERO el correo no salió: '+(c.error||'sin motivo')+'. Reenvíaselo tú.');
      carga(); return;
    }
    avisa('Aprobado · lo publicó '+(YO||'el equipo'));
    carga();
  }catch(e){ avisa('No se pudo aprobar: '+((e&&e.message)||e)); }
}

function abreMotivo(tipo,id){
  var c=$('mot-'+tipo+'-'+id); if(!c) return;
  c.classList.toggle('on');
  if(c.classList.contains('on')) c.querySelector('textarea').focus();
}

async function rechazar(tipo,id){
  var c=$('mot-'+tipo+'-'+id); if(!c) return;
  var txt=(c.querySelector('textarea').value||'').trim();
  if(txt.length<4){ avisa('Escribe el motivo: sin él, quien lo mandó tiene que adivinar.'); return; }
  try{
    if(tipo==='exp'){ await patch('op_experiencias',id,{estado:'borrador'});
      await historia('experiencia',id,'devuelta a borrador',{motivo:txt}); }
    /* DEVOLVER UN EVENTO NO ERA DEVOLVERLO. Javi, 30-oct-2026: «ya los devolví
       y no se movió nada». El motivo se guardaba, pero un trigger que recoloca
       los eventos segun lo que les falte veia uno completo y lo subia otra vez
       a la cola. Ahora queda escrito que lo devolvio una persona, y eso manda
       hasta que su dueno lo vuelva a guardar. */
    if(tipo==='evt'){ await patch('eventos',id,{estado:'borrador',notas:txt,
        devuelto_at:new Date().toISOString(), devuelto_por:YO||null});
      await historia('evento',id,'devuelto a borrador',{motivo:txt}); }
    if(tipo==='ate'){ await patch('tour_operadores',id,{estado:'borrador'});
      await historia('ateneista',id,'alta devuelta',{motivo:txt});
      var c=await aviso('devuelta',id,txt);
      avisa(c.ok ? 'Devuelto · le mandamos el motivo por correo'
                 : 'Devuelto, pero el correo no salió: '+(c.error||'sin motivo'));
      carga(); return; }
    avisa('Devuelto con motivo.');
    carga();
  }catch(e){ avisa('No se pudo devolver: '+((e&&e.message)||e)); }
}

function buscar(tipo,id){
  var l = tipo==='exp'?EXPS : tipo==='evt'?EVTS : ATES;
  for(var i=0;i<l.length;i++) if(String(l[i].id)===String(id)) return l[i];
  return null;
}

/* ---------- salas ---------- */
function salaDia(x){ if(!x) return '—';
  return new Date(x).toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'}); }
function salaHora(x){ if(!x) return '—';
  var d=new Date(x); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

async function decideSala(i, ok){
  var r=SALAS[i]; if(!r) return;
  var motivo=null;
  if(!ok){
    var ta=$('salaMot-'+i);
    motivo=(ta&&ta.value||'').trim();
    if(motivo.length<4){ avisa('Escribe el motivo: sin él, quien la pidió tiene que adivinar.'); return; }
  }
  var disp=$('salaDisp-'+i);
  try{
    var j=await traeRpc('ev_solicitud_decide',{p_id:r.id,p_aprobar:!!ok,
            p_motivo:motivo,p_dispensa_poliza:!!(disp&&disp.checked)});
    if(!j || j.error){ avisa(j&&j.error ? j.error : 'no se pudo'); return; }
    /* La decisión ya está guardada. El correo se intenta aparte: si falla, se
       dice, pero no se deshace nada. */
    var cola='';
    try{
      var ra=await fetch(SB+'/functions/v1/prod-aviso-sala',{method:'POST',
        headers:Object.assign({'Content-Type':'application/json'},hdr()),
        body:JSON.stringify({solicitud_id:r.id})});
      var av=await ra.json().catch(function(){return null;});
      cola = (av&&av.ok&&av.para) ? ' · avisada en '+av.para : ' · no pudimos avisarle por correo';
    }catch(_){ cola=' · no pudimos avisarle por correo'; }
    avisa((ok?'Sala confirmada para «'+(j.evento||'')+'»':'Sala rechazada')+cola);
    carga();
  }catch(e){ avisa('No se pudo: '+((e&&e.message)||e)); }
}
function abreSalaMot(i){
  var c=$('salaCaja-'+i); if(!c) return;
  c.style.display = c.style.display==='block' ? 'none' : 'block';
}


/* La lista de salas, aparte: los filtros la repintan sola. */
function pintaSalas(){
  var caja=$('salasLista'); if(!caja) return;
  var L=SALAS.map(function(r,i){ return {r:r,i:i}; }).filter(function(o){
    if(FSALA && String(o.r.sala||'(sin sala)')!==FSALA) return false;
    if(FQ){
      var t=(String(o.r.evento||'')+' '+String(o.r.productora||'')).toLowerCase();
      if(t.indexOf(FQ.toLowerCase())<0) return false;
    }
    return true;
  });
  if(!L.length){
    caja.innerHTML='<div class="vacio" style="padding:18px">Ninguna petición con ese filtro.</div>';
    return;
  }
  caja.innerHTML=L.map(function(o){ var r=o.r, i=o.i;
        var huerfano = !r.evento;
        var pol=r.poliza||{}, exi=r.poliza_exige||{};
        var falta = exi.exigible && !pol.ok;
        var pax = r.cupo||r.aforo;
        var sobra = (pax && r.capacidad && pax>r.capacidad)
          ? ' <b style="color:#9E3B2E">pasa del aforo ('+r.capacidad+')</b>' : '';
        /* UN EVENTO QUE YA SE VENDE CON LA SALA SIN CONFIRMAR. No es teoría:
           hoy hay tres así. Se canta, porque es lo contrario del orden. */
        var vendiendo = (r.evento_estado==='publicado')
          ? '<div class="candado on">Este evento <b>ya está a la venta</b> y su sala sigue sin confirmar.</div>' : '';
        return '<div class="fila">'+
          '<div class="ico">🗝️</div>'+
          '<div class="mid">'+
            /* UNA PETICION HUERFANA NO TIENE NOMBRE, TIENE UN CODIGO. Cuando el
               evento se borro y la peticion se quedo, el titulo que queda es
               «EV:<uuid>», que no le dice nada a nadie. Se nombra por lo que
               es: una peticion sin evento detras. */
            '<div class="nom"><b>'+esc(huerfano?'Petición sin evento':(r.evento||'(sin nombre)'))+'</b></div>'+
            '<div class="donde">'+esc(r.productora||'(sin productora)')+' · <b>'+esc(r.sala||'—')+'</b>'+
              (esDeAna(r.sala)?' · la sede también lo acepta después':'')+'</div>'+
            '<div class="donde">'+salaDia(r.venta_desde)+' · sala '+salaHora(r.sala_desde)+'–'+salaHora(r.sala_hasta)+
              ' · boleto para las '+salaHora(r.venta_desde)+' · '+(pax||'—')+' personas'+sobra+'</div>'+
            vendiendo+
            (huerfano?'<div class="candado on">El evento que pidió esta sala <b>ya no existe</b>, y su productora tampoco. '+
                      'Es un resto de una prueba: rechazarla la quita de en medio.</div>':'')+
            (r.choca_con?'<div class="candado on">Choca con <b>'+esc(r.choca_con)+'</b>, que ya tiene esa franja. Hay que mover uno de los dos.</div>':'')+
            (falta?'<div class="candado on">'+esc(pol.motivo||'sin póliza')+' · la necesita porque '+
                   esc(exi.por||'lo pide el contrato')+' (cláusula DÉCIMA QUINTA).'+
                   '<label style="display:flex;gap:7px;align-items:center;margin-top:6px;font-weight:400">'+
                   '<input type="checkbox" id="salaDisp-'+i+'"> Dispensar la póliza para este evento — queda a tu nombre</label></div>':'')+
            '<div id="salaCaja-'+i+'" style="display:none;margin-top:8px">'+
              '<textarea id="salaMot-'+i+'" placeholder="¿Por qué la rechazas? Se lo decimos tal cual." '+
                'style="width:100%;min-height:62px;padding:8px 10px;border:1px solid var(--linea,#E3E0D6);border-radius:8px;font:inherit"></textarea>'+
              '<div style="margin-top:6px"><button class="btn sm gris" onclick="decideSala('+i+',false)">Rechazar con este motivo</button></div>'+
            '</div>'+
          '</div>'+
          '<div class="acc">'+
            /* A una petición sin evento no se le confirma nada: confirmarla
               apartaría una sala para algo que no existe. Solo se quita. */
            (huerfano?'':'<button class="btn sm verde" onclick="decideSala('+i+',true)">Confirmar la sala</button>')+
            '<button class="btn sm gris" onclick="abreSalaMot('+i+')">'+(huerfano?'Quitarla':'Rechazar')+'</button>'+
          '</div>'+
        '</div>';
  }).join('');
}

/* ---------- hoteles ---------- */
async function activaHotel(id){
  var h=null; for(var i=0;i<HOT.length;i++) if(String(HOT[i].id)===String(id)) h=HOT[i];
  if(!h) return;
  if(!h.contrato_firmado_at &&
     !confirm(h.nombre_comercial+' todavía no tiene convenio firmado.\n\nActivarlo es dejarle vender sin papel. ¿Lo activo igual?')) return;
  try{
    await patch('hoteles',id,{estado:'activo'});
    await historia('hotel',id,'activado',{desde:h.estado});
    avisa('Hotel activo · lo activó '+(YO||'el equipo'));
    carga();
  }catch(e){ avisa('No se pudo activar: '+((e&&e.message)||e)); }
}

/* ---------- pintar ---------- */
function dineroMx(n){ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }
function horasDe(min){ if(!min) return ''; var h=Math.round(min/60*10)/10; return (h>=1? h+' h' : min+' min'); }
function cuandoMx(iso,conHora){
  if(!iso) return '';
  var d=new Date(iso); if(isNaN(d.getTime())) return '';
  return new Intl.DateTimeFormat('es-MX',Object.assign({timeZone:'America/Mexico_City',
    weekday:'short',day:'numeric',month:'short'},
    conHora?{hour:'2-digit',minute:'2-digit',hour12:false}:{})).format(d);
}
function portadaDe(it){
  if(FOTO[it.id]) return FOTO[it.id];
  var f=it.fotos;
  if(f && f.length) return (f[0] && (f[0].url||f[0])) || '';
  return '';
}
/* Los datos que hacen falta para decidir sin abrir otra pantalla. */
function datosDe(tipo,it){
  var d=[];
  if(tipo==='exp'){
    var pre = Number(it.precio_adulto)>0 ? dineroMx(it.precio_adulto)
            : Number(it.neto_adulto)>0 ? dineroMx(it.neto_adulto)+' neto' : '';
    d.push(pre ? {t:pre} : {t:'sin precio', c:'mal'});
    if(it.duracion_min) d.push({t:horasDe(it.duracion_min)});
    if(it.cupo_max) d.push({t:'hasta '+it.cupo_max+' pax'});
    if(it.ciudad) d.push({t:it.ciudad});
    if(it.categoria) d.push({t:it.categoria});
    var donde = it.cer_inicio_lugar||it.punto_encuentro;
    if(donde) d.push({t:'sale de '+donde});
    else d.push({t:'sin punto de encuentro', c:'mal'});
  } else if(tipo==='evt'){
    if(it.fecha_inicio) d.push({t:cuandoMx(it.fecha_inicio,true)});
    if(it.es_gratis) d.push({t:'entrada libre', c:'gratis'});
    else if(Number(it.precio)>0) d.push({t:dineroMx(it.precio)});
    else if(Number(it.precio_por_hora)>0) d.push({t:dineroMx(it.precio_por_hora)+' la hora'});
    else d.push({t:'sin precio', c:'mal'});
    var pax=it.cupo||it.aforo; if(pax) d.push({t:pax+' pax'});
    if(it.duracion_min) d.push({t:horasDe(it.duracion_min)});
    if(!portadaDe(it)) d.push({t:'sin foto', c:'mal'});
  }
  return d;
}
function tarjeta(tipo,it,icono,titulo,sub,cuando,enlace){
  var e=espera(cuando);
  var b = tipo==='exp' ? bloqueos(it.operador_id) : [];
  var foto=portadaDe(it);
  var datos=datosDe(tipo,it);
  var texto=String(it.resumen||it.descripcion||'').replace(/\s+/g,' ').trim();
  /* APROBAR ALGO QUE YA OCURRIO ES PONERLO A LA VENTA DESPUES DE LA FIESTA.
     Los dos eventos que esperan hoy son del 17 y del 22 de octubre. */
  var pasado = tipo==='evt' && it.fecha_inicio &&
               new Date(it.fecha_fin||it.fecha_inicio) < new Date(new Date().toDateString());
  return '<div class="fila '+(e[0]==='rojo'?'viejo':'')+'">'+
    (tipo==='ate'
      ? '<div class="ico">'+icono+'</div>'
      /* LAS COMILLAS DE JSON.stringify CERRABAN EL ATRIBUTO. El style quedaba
         style="background-image:url("https://…")" y el navegador lo cortaba en
         la primera comilla: cajas grises con la foto cargada al lado. */
      : '<div class="shot"'+(foto?' style="background-image:url(\''+esc(foto)+'\')"':'')+'>'+
        (foto?'':icono)+'</div>')+
    '<div class="mid">'+
      '<div class="nom"><b>'+esc(titulo)+'</b></div>'+
      '<div class="donde">'+esc(sub)+'</div>'+
      (datos.length?'<div class="datos">'+datos.map(function(x){
         return '<span class="dato'+(x.c?' '+x.c:'')+'">'+esc(x.t)+'</span>'; }).join('')+'</div>':'')+
      (texto?'<div class="texto">'+esc(texto)+'</div>':'')+
      (pasado?'<div class="candado on">Esta fecha <b>ya pasó</b>. Aprobarlo es ponerlo a la venta después de la fiesta.</div>':'')+
      '<div class="espera '+e[0]+'">'+e[1]+'</div>'+
      (b.length?'<div class="candado on">No puede cobrar todavía: '+esc(b.join(' · '))+'</div>':'')+
      '<div class="motivo" id="mot-'+tipo+'-'+esc(it.id)+'">'+
        '<textarea placeholder="¿Qué le falta o por qué se devuelve? Esto es lo que va a leer."></textarea>'+
        '<div class="pie"><button class="btn sm" onclick="rechazar(\''+tipo+'\',\''+esc(it.id)+'\')">Devolver con este motivo</button>'+
        '<span>Mínimo cuatro letras.</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="acc">'+
      '<button class="btn sm verde" onclick="aprobar(\''+tipo+'\',\''+esc(it.id)+'\')">Aprobar</button>'+
      '<button class="btn sm gris" onclick="abreMotivo(\''+tipo+'\',\''+esc(it.id)+'\')">Devolver</button>'+
      (enlace?'<a class="btn sm gris" target="_top" href="'+enlace+'">Ver ↗</a>':'')+
    '</div>'+
  '</div>';
}

function pinta(){
  var caja=$('cuerpo');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos leer la cola</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—'; return;
  }
  if(CARGANDO){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  var total=EXPS.length+EVTS.length+ATES.length+SALAS.length+HOT.length;
  var viejos=0;
  EXPS.concat(EVTS).forEach(function(x){ var h=horas(x.updated_at||x.created_at); if(h!=null&&h>=48) viejos++; });
  $('cuenta').innerHTML= total
    ? '<b>'+total+'</b> esperando'+(viejos?' · <b style="color:#9E3B2E">'+viejos+'</b> con más de 48 h':'')
    : 'Nada esperando';

  var h='';
  if(!total){
    h+='<div class="vacio"><b>La cola está limpia</b>No hay nada esperando aprobación. '+
       'Cuando un ateneísta mande una experiencia o un evento, aparece aquí.</div>';
  }
  if(EXPS.length){
    h+='<h2>Experiencias <em>'+EXPS.length+'</em></h2>'+EXPS.map(function(x){
      return tarjeta('exp',x,x.formato==='evento'?'🎫':x.formato==='transporte'?'🚐':'🚶',x.nombre||'(sin nombre)',
        (OPS[x.operador_id]||(x.tipo==='propio'?'Casa Pepe':'sin dueño'))+
        /* El precio que escribe el operador es el neto; precio_adulto es el PVP
           calculado y casi ninguna ficha lo trae. Mirando sólo ése, la cola
           decía «sin precio» a fichas con precio puesto -el Cable Bus de Kari
           llevaba siete días aquí marcado así, con sus cien pesos dentro-.
           Javi, 26-oct-2026. */
        (Number(x.precio_adulto)>0 ? ' · $'+Number(x.precio_adulto).toLocaleString('es-MX')
          : Number(x.neto_adulto)>0 ? ' · $'+Number(x.neto_adulto).toLocaleString('es-MX')+' neto'
          : ' · sin precio'),
        x.updated_at,'/ficha.html?id='+encodeURIComponent(x.id));
    }).join('');
  }
  if(EVTS.length){
    h+='<h2>Eventos <em>'+EVTS.length+'</em></h2>'+
      (EVTS.some(function(x){return esDeAna(x.espacio);})
        ? '<div style="font-size:12.5px;color:var(--gris);margin:-4px 0 10px">Los de <b>Café Cumbre</b> y '+
          '<b>Galería</b> llevan dos vistos buenos: el tuyo, aquí, y el de la sede. Cuando lo apruebes, '+
          'le aparece a Ana en su portal para que acepte tenerlo en su sitio.</div>'
        : '')+
      EVTS.map(function(x){
      return tarjeta('evt',x,'🎫',x.nombre||'(sin nombre)',
        (x.espacio||'sin espacio')+(x.fecha_inicio?' · '+String(x.fecha_inicio).slice(0,10):'')+
        (esDeAna(x.espacio)?' · después lo acepta la sede':''),
        x.updated_at||x.created_at,'/m/eventos.html?embed=evt');
    }).join('');
  }

  if(SALAS.length){
    /* FILTRAR POR SALA O POR EVENTO. Javi, 30-oct-2026. Con siete peticiones
       de cinco salas distintas, buscar «la del Teatro» es leerlas todas. Los
       filtros repintan SOLO la lista -no la pantalla entera- para que escribir
       en el buscador no pierda el cursor en cada letra. */
    var salasNom={};
    SALAS.forEach(function(r){ var n=r.sala||'(sin sala)'; salasNom[n]=(salasNom[n]||0)+1; });
    var opts=Object.keys(salasNom).sort(function(a,b){return a.localeCompare(b,'es');});
    h+='<h2>Salas para eventos <em>'+SALAS.length+'</em></h2>'+
      '<div style="font-size:12.5px;color:var(--gris);margin:-4px 0 10px">Una productora pide una sala y '+
      'queda pendiente hasta que alguien de la casa la confirme. Dos pueden pedir la misma noche: las dos '+
      'salen aquí y solo una se puede confirmar. Ojo con las dos franjas: <b>la sala se bloquea desde el '+
      'montaje</b>, pero <b>el boleto se vende a la hora de inicio</b>.</div>'+
      /* VERLO EN EL CALENDARIO, EN OTRA PESTAÑA. Javi, 30-oct-2026: «sería muy
         bueno que me permitieras ver en otra pestaña por sala las propuestas
         de sala y eventos para decidir visualmente cuál seleccionar». Cuando
         dos piden la misma noche, la lista no deja verlo; el calendario sí. */
      '<div style="margin:-2px 0 10px"><a class="btn sm gris" target="_blank" rel="noopener" '+
        'href="/m/eventos.html?embed=cal">Verlo en el calendario de salas ↗</a></div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center">'+
        '<select id="fSala" style="padding:7px 10px;border:1px solid var(--linea,#E3E0D6);border-radius:8px;font:inherit;font-size:13px">'+
          '<option value="">Todas las salas ('+SALAS.length+')</option>'+
          opts.map(function(n){ return '<option value="'+esc(n)+'"'+(FSALA===n?' selected':'')+'>'+esc(n)+' ('+salasNom[n]+')</option>'; }).join('')+
        '</select>'+
        '<input id="fEvt" value="'+esc(FQ)+'" placeholder="Buscar por evento o productora…" '+
          'style="flex:1;min-width:190px;padding:7px 10px;border:1px solid var(--linea,#E3E0D6);border-radius:8px;font:inherit;font-size:13px">'+
        '<button class="btn sm gris" id="fLimpia" style="'+(FSALA||FQ?'':'display:none')+'">Quitar filtros</button>'+
      '</div>'+
      '<div id="salasLista"></div>';
  }

  if(HOT.length){
    h+='<h2>Hoteles nuevos <em>'+HOT.length+'</em></h2>'+
      '<div style="font-size:12.5px;color:var(--gris);margin:-4px 0 10px">Hoteles que terminaron su alta y '+
      'todavía no están activos. Activar uno es dejarle vender.</div>'+
      HOT.map(function(x){
        return '<div class="fila">'+
          '<div class="ico">🛏️</div>'+
          '<div class="mid">'+
            '<div class="nom"><b>'+esc(x.nombre_comercial||'(sin nombre)')+'</b></div>'+
            '<div class="donde">'+esc(x.ciudad||'sin ciudad')+
              (x.cuartos?' · '+x.cuartos+' cuartos':'')+(x.email?' · '+esc(x.email):'')+'</div>'+
            (x.contrato_firmado_at
              ? '<div class="espera verde">convenio firmado</div>'
              : '<div class="candado on">Sin convenio firmado.</div>')+
          '</div>'+
          '<div class="acc">'+
            '<button class="btn sm verde" onclick="activaHotel(\''+esc(x.id)+'\')">Activar</button>'+
            '<a class="btn sm gris" target="_top" href="/m/hoteles.html">Ver ↗</a>'+
          '</div>'+
        '</div>';
      }).join('');
  }
  if(ATES.length){
    h+='<h2>Altas de antes del cambio <em>'+ATES.length+'</em></h2>'+
      '<div style="font-size:12.5px;color:var(--gris);margin:-4px 0 10px">Las altas ya no esperan visto bueno: '+
      'quien entra por <b>/ateneista</b> queda activo en el acto. Estas se quedaron en revisión de antes, '+
      'y basta con aprobarlas para que puedan entrar.</div>'+
      ATES.map(function(x){
      return tarjeta('ate',x,'👤',x.nombre_comercial||'(sin nombre)',
        (x.ciudad||'sin ciudad')+(x.email?' · '+x.email:''),
        x.updated_at||x.created_at,'/m/comunidad.html');
    }).join('');
  }
  /* AQUÍ ESTABA «TÉRMINOS SIN ESCRIBIR». Javi, 30-oct-2026: «quita todos los
     términos». Veinte fichas en una cola que es para decidir, y ninguna se
     decide aquí: los términos los escribe la casa en la ficha. Una lista de
     deberes dentro de una bandeja de aprobación enseña a hacer scroll para
     pasar de largo, y eso se lo acaba llevando lo que sí hay que aprobar. */
  caja.innerHTML=h;
  /* Los filtros de salas viven dentro de lo que acabamos de pintar, así que se
     enganchan aquí y repintan SOLO su lista. */
  if($('salasLista')){
    pintaSalas();
    var fs=$('fSala'), fe=$('fEvt'), fl=$('fLimpia');
    if(fs) fs.onchange=function(){ FSALA=fs.value; if(fl) fl.style.display=(FSALA||FQ)?'':'none'; pintaSalas(); };
    if(fe) fe.oninput=function(){ FQ=fe.value; if(fl) fl.style.display=(FSALA||FQ)?'':'none'; pintaSalas(); };
    if(fl) fl.onclick=function(){ FSALA=''; FQ=''; if(fs) fs.value=''; if(fe) fe.value=''; fl.style.display='none'; pintaSalas(); };
  }
}

async function traeRpc(fn,body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:Object.assign({'Content-Type':'application/json'},hdr()),
    body:JSON.stringify(body||{})});
  if(!r.ok) throw new Error(fn+' respondió '+r.status);
  return r.json();
}
async function trae(q){
  var r=await fetch(SB+'/rest/v1/'+q,{headers:hdr()});
  if(!r.ok) throw new Error(q.split('?')[0]+' respondió '+r.status);
  return r.json();
}

async function carga(){
  FALLO=''; CARGANDO=true; pinta();
  try{
    var campos='id,nombre,estado,tipo,formato,operador_id,precio_adulto,neto_adulto,updated_at,created_at,'+
      'fotos,duracion_min,ciudad,categoria,resumen,descripcion,cupo_max,cupo_min,cer_inicio_lugar,punto_encuentro';
    var res=await Promise.all([
      trae('op_experiencias?select='+campos+'&estado=eq.en_revision&order=updated_at'),
      trae('eventos?select=id,nombre,estado,espacio,fecha_inicio,fecha_fin,productora_id,created_at,updated_at,'+
           'fotos,descripcion,cupo,aforo,es_gratis,precio,precio_por_hora,duracion_min,clase&estado=eq.propuesto&order=created_at'),
      /* LAS ALTAS YA NO PASAN POR AQUI. Javi, 26-oct-2026: «lo que si me
         interesa es que las altas no requieran vto bueno». El alta deja al
         ateneista activo desde que la manda; lo que sigue necesitando firma
         nuestra es PUBLICAR. Esta consulta se queda para recoger las que
         quedaron en revision de antes del cambio: cuando no haya ninguna, la
         seccion desaparece sola. */
      trae('tour_operadores?select=id,nombre_comercial,email,ciudad,estado,created_at,updated_at&estado=eq.en_revision&order=created_at'),
      trae('v_ateneistas?select=id,nombre_comercial,candado&limit=1000'),
      /* Las peticiones de sala, TODAS: el filtro por nombre de sala era el
         agujero. La base ya decide quién puede verlas (es_equipo_casa). */
      traeRpc('ev_solicitudes_lista',{p_estado:'pendiente'}),
      /* Un hotel que terminó su alta y todavía no está activo. Los candidatos
         -los que aún no se han dado de alta- no se aprueban: se contactan, y
         eso vive en su propia pantalla. */
      trae('hoteles?select=id,nombre_comercial,ciudad,cuartos,email,etapa,estado,contrato_firmado_at,created_at,updated_at'+
           '&etapa=eq.alta&estado=neq.activo&order=created_at'),
      /* Las portadas de lo que está en la cola, para verlo sin abrir la ficha. */
      trae('sinc_media?select=experiencia_id,url,etiqueta,orden&tipo=eq.foto&order=orden&limit=3000'),
      /* Y el nombre de quien monta cada evento: hasta hoy la cola solo decía
         en qué sala era. */
      trae('productoras?select=id,nombre_comercial&limit=1000')
    ]);
    EXPS=res[0]; EVTS=res[1]; ATES=res[2];
    CAND={}; OPS={};
    res[3].forEach(function(a){ CAND[a.id]=a.candado; OPS[a.id]=a.nombre_comercial; });
    SALAS=res[4]||[]; HOT=res[5]||[];
    FOTO={};
    (res[6]||[]).forEach(function(m){
      if(!m.experiencia_id || FOTO[m.experiencia_id]) return;
      FOTO[m.experiencia_id]=m.url;
    });
    PRODN={};
    (res[7]||[]).forEach(function(x){ PRODN[x.id]=x.nombre_comercial; });
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  CARGANDO=false; pinta();
}

$('recargar').addEventListener('click',carga);

ses=sesionPanel();
try{ YO=(ses&&ses.user&&ses.user.email)||''; }catch(_){}
carga();
