<!doctype html><html lang="es"><head>
<script src="/cp-guarda.js"></script>
<script src="/m/cp-marco.js"></script>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cola de aprobación · Sincrético</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  LA COLA DE APROBACION. Javi, 26-oct-2026.

  Es la pantalla mas importante del panel: el ateneista puede crear lo que
  quiera, pero nada sale a la venta sin que alguien de la casa lo mire. Si
  esta cola se atasca, la plataforma se para -por eso lo que lleva mas de
  48 horas esperando sale en rojo.

  TRES REGLAS QUE NO SE NEGOCIAN:

  1. Rechazar pide motivo. Sin motivo no hay boton: un "no" sin razon
     obliga al ateneista a adivinar y vuelve dos veces.
  2. No se publica a quien no puede cobrar. Antes de aprobar se mira el
     candado del dueno -lo mismo que mira la base- y si bloquea, se avisa
     y se pregunta. Publicar a alguien sin Stripe es vender boletos que
     nadie puede cobrar; ya paso con tres productoras.
  3. Todo deja rastro en historia: que se aprobo, quien y cuando.

  Los terminos sin escribir van abajo y NO llevan boton de aprobar: no son
  una decision, son una tarea de la casa.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-suave:#FBDCEE;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --artesania:#D9A441;--artesania-suave:#F7ECD4;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 10px 26px -20px rgba(30,26,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 80px}
.encab{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 26px Oswald;letter-spacing:.03em;text-transform:uppercase;margin:0}
.cuenta{font:400 13px Inter;color:var(--gris);margin-top:3px}
.cuenta b{color:var(--tinta)}
.encab .der{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{cursor:pointer;font:600 12.5px Oswald;letter-spacing:.05em;padding:9px 15px;border-radius:9px;border:2px solid var(--tinta);background:none;color:var(--tinta)}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.verde{border-color:var(--ok);background:var(--ok);color:#fff}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn.gris{border-color:var(--linea);color:var(--gris)}
.btn[disabled]{opacity:.5;cursor:default}
.filtros{display:grid;grid-template-columns:minmax(0,1.6fr) 1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.filtros input,.filtros select{border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px;background:#fff;width:100%}
.pill{font:600 10.5px Oswald;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.al{background:var(--alerta-bg);color:var(--alerta)}
.pill.er{background:var(--error-bg);color:var(--error)}
.pill.ne{background:var(--hueso);color:var(--gris)}
.pill.na{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.pill.mg{background:var(--magenta-suave);color:#B3106F}
.pill.ci{background:var(--cielo-suave);color:#2F6E93}
.fila{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);
  display:flex;gap:14px;align-items:center;padding:13px 15px;margin-bottom:10px}
.fila .mid{flex:1;min-width:0}
.fila .nom{display:flex;gap:9px;align-items:center;min-width:0}
.fila .nom b{font:600 15px Inter;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fila .pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}
.fila .donde{font:400 12px Inter;color:var(--tenue);margin-top:4px}
.vacio{background:#fff;border:1px dashed var(--linea);border-radius:12px;padding:34px 20px;text-align:center;color:var(--gris)}
.vacio b{display:block;font:600 16px Oswald;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--tinta);color:#fff;
  padding:11px 18px;border-radius:999px;font-size:13px;display:none;z-index:60;box-shadow:var(--sombra)}
@media(max-width:760px){.filtros{grid-template-columns:1fr 1fr}}
h2{font:700 15px Oswald;letter-spacing:.07em;text-transform:uppercase;margin:26px 0 10px;color:var(--tinta);
  display:flex;align-items:center;gap:9px}
h2 em{font:600 11px Inter;font-style:normal;color:var(--gris);background:var(--hueso);border-radius:999px;padding:2px 9px}
.fila{align-items:flex-start}
.fila.viejo{border-color:#E7B3AA;box-shadow:0 0 0 1px #F6E1DD inset,var(--sombra)}
.ico{flex:0 0 42px;height:42px;border-radius:11px;display:grid;place-items:center;font-size:19px;background:var(--hueso)}
.acc{flex:0 0 auto;display:flex;flex-direction:column;gap:7px;align-items:stretch}
.espera{font:400 11.5px Inter;color:var(--tenue);margin-top:5px}
.espera.rojo{color:var(--error);font-weight:600}
.motivo{margin-top:10px;display:none}
.motivo.on{display:block}
.motivo textarea{width:100%;border:1.5px solid var(--linea);border-radius:9px;padding:9px 11px;min-height:62px;resize:vertical;background:#fff}
.motivo .pie{display:flex;gap:8px;align-items:center;margin-top:7px}
.motivo .pie span{font:400 11.5px Inter;color:var(--tenue)}
.candado{margin-top:8px;background:var(--error-bg);color:var(--error);border-radius:9px;padding:8px 11px;font-size:12.5px;display:none}
.candado.on{display:block}
</style></head><body>
<div class="wrap">

  <div class="encab">
    <div>
      <h1>Cola de aprobación</h1>
      <div class="cuenta" id="cuenta">Cargando…</div>
    </div>
    <div class="der">
      <button class="btn gris sm" id="recargar">Recargar</button>
    </div>
  </div>

  <div id="cuerpo"></div>
</div>

<div class="toast" id="toast"></div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ses=null, YO='', FALLO='', CARGANDO=true;
var EXPS=[], EVTS=[], ATES=[], TERM=[], CAND={}, OPS={};

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function avisa(t){var e=$('toast');e.textContent=t;e.style.display='block';setTimeout(function(){e.style.display='none';},3200);}

function horas(iso){ if(!iso) return null;
  try{ return Math.floor((Date.now()-new Date(iso).getTime())/3600000); }catch(_){ return null; } }
function espera(iso){
  var h=horas(iso); if(h==null) return ['','sin fecha'];
  if(h<1) return ['','llegó hace un momento'];
  if(h<24) return ['','esperando '+h+' h'];
  var d=Math.floor(h/24);
  return [h>=48?'rojo':'', 'esperando '+d+' día'+(d>1?'s':'')];
}

/* El candado se lee de la base, no se recalcula aqui. Si la vista dice que
   bloquea, bloquea. */
function bloqueos(opId){
  var c=CAND[opId]; if(!c) return [];
  try{ return (c.bloquea||[]).map(function(b){ return b.texto||b.clave||String(b); }); }catch(_){ return []; }
}

async function historia(entidad,id,que,detalle){
  try{
    await fetch(SB+'/rest/v1/historia',{method:'POST',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),
      body:JSON.stringify({entidad:entidad,entidad_id:id,que:que,quien:YO||'el equipo',detalle:detalle||null})});
  }catch(_){}
}

async function patch(tabla,id,cambios){
  var r=await fetch(SB+'/rest/v1/'+tabla+'?id=eq.'+encodeURIComponent(id),
    {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),body:JSON.stringify(cambios)});
  if(!r.ok) throw new Error('la base respondió '+r.status+' · '+(await r.text()).slice(0,140));
}

/* ---------- aprobar y rechazar ---------- */
async function aprobar(tipo,id){
  var it=buscar(tipo,id); if(!it) return;
  if(tipo==='exp'){
    var b=bloqueos(it.operador_id);
    if(b.length && !confirm('A '+(OPS[it.operador_id]||'este ateneísta')+' le falta: '+b.join(', ')+
        '.\n\nPublicar ahora es poner a la venta algo que todavía no se le puede cobrar.\n\n¿Lo publico igual?')) return;
  }
  var ahora=new Date().toISOString();
  try{
    if(tipo==='exp'){ await patch('op_experiencias',id,{estado:'publicada',publicada_at:ahora});
      await historia('experiencia',id,'publicada',{desde:'en_revision'}); }
    if(tipo==='evt'){ await patch('eventos',id,{estado:'publicado',validado_at:ahora,validado_por:YO||null});
      await historia('evento',id,'publicado',{desde:'propuesto'}); }
    if(tipo==='ate'){ await patch('tour_operadores',id,{estado:'activo'});
      await historia('ateneista',id,'alta aprobada',{desde:'en_revision'}); }
    avisa('Aprobado · lo publicó '+(YO||'el equipo'));
    carga();
  }catch(e){ avisa('No se pudo aprobar: '+((e&&e.message)||e)); }
}

function abreMotivo(tipo,id){
  var c=$('mot-'+tipo+'-'+id); if(!c) return;
  c.classList.toggle('on');
  if(c.classList.contains('on')) c.querySelector('textarea').focus();
}

async function rechazar(tipo,id){
  var c=$('mot-'+tipo+'-'+id); if(!c) return;
  var txt=(c.querySelector('textarea').value||'').trim();
  if(txt.length<4){ avisa('Escribe el motivo: sin él, quien lo mandó tiene que adivinar.'); return; }
  try{
    if(tipo==='exp'){ await patch('op_experiencias',id,{estado:'borrador'});
      await historia('experiencia',id,'devuelta a borrador',{motivo:txt}); }
    if(tipo==='evt'){ await patch('eventos',id,{estado:'borrador',notas:txt});
      await historia('evento',id,'devuelto a borrador',{motivo:txt}); }
    if(tipo==='ate'){ await patch('tour_operadores',id,{estado:'borrador'});
      await historia('ateneista',id,'alta devuelta',{motivo:txt}); }
    avisa('Devuelto con motivo.');
    carga();
  }catch(e){ avisa('No se pudo devolver: '+((e&&e.message)||e)); }
}

function buscar(tipo,id){
  var l = tipo==='exp'?EXPS : tipo==='evt'?EVTS : ATES;
  for(var i=0;i<l.length;i++) if(String(l[i].id)===String(id)) return l[i];
  return null;
}

/* ---------- pintar ---------- */
function tarjeta(tipo,it,icono,titulo,sub,cuando,enlace){
  var e=espera(cuando);
  var b = tipo==='exp' ? bloqueos(it.operador_id) : [];
  return '<div class="fila '+(e[0]==='rojo'?'viejo':'')+'">'+
    '<div class="ico">'+icono+'</div>'+
    '<div class="mid">'+
      '<div class="nom"><b>'+esc(titulo)+'</b></div>'+
      '<div class="donde">'+esc(sub)+'</div>'+
      '<div class="espera '+e[0]+'">'+e[1]+'</div>'+
      (b.length?'<div class="candado on">No puede cobrar todavía: '+esc(b.join(' · '))+'</div>':'')+
      '<div class="motivo" id="mot-'+tipo+'-'+esc(it.id)+'">'+
        '<textarea placeholder="¿Qué le falta o por qué se devuelve? Esto es lo que va a leer."></textarea>'+
        '<div class="pie"><button class="btn sm" onclick="rechazar(\''+tipo+'\',\''+esc(it.id)+'\')">Devolver con este motivo</button>'+
        '<span>Mínimo cuatro letras.</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="acc">'+
      '<button class="btn sm verde" onclick="aprobar(\''+tipo+'\',\''+esc(it.id)+'\')">Aprobar</button>'+
      '<button class="btn sm gris" onclick="abreMotivo(\''+tipo+'\',\''+esc(it.id)+'\')">Devolver</button>'+
      (enlace?'<a class="btn sm gris" target="_top" href="'+enlace+'">Ver ↗</a>':'')+
    '</div>'+
  '</div>';
}

function pinta(){
  var caja=$('cuerpo');
  if(FALLO){
    caja.innerHTML='<div class="vacio"><b>No pudimos leer la cola</b>'+esc(FALLO)+
      '<br><br><button class="btn sm" onclick="carga()">Reintentar</button></div>';
    $('cuenta').textContent='—'; return;
  }
  if(CARGANDO){ caja.innerHTML='<div class="vacio">Cargando…</div>'; return; }

  var total=EXPS.length+EVTS.length+ATES.length;
  var viejos=0;
  EXPS.concat(EVTS).forEach(function(x){ var h=horas(x.updated_at||x.created_at); if(h!=null&&h>=48) viejos++; });
  $('cuenta').innerHTML= total
    ? '<b>'+total+'</b> esperando'+(viejos?' · <b style="color:#9E3B2E">'+viejos+'</b> con más de 48 h':'')+
      (TERM.length?' · '+TERM.length+' sin términos':'')
    : 'Nada esperando'+(TERM.length?' · '+TERM.length+' fichas sin términos':'');

  var h='';
  if(!total){
    h+='<div class="vacio"><b>La cola está limpia</b>No hay nada esperando aprobación. '+
       'Cuando un ateneísta mande una experiencia o un evento, aparece aquí.</div>';
  }
  if(EXPS.length){
    h+='<h2>Experiencias <em>'+EXPS.length+'</em></h2>'+EXPS.map(function(x){
      return tarjeta('exp',x,'🚶',x.nombre||'(sin nombre)',
        (OPS[x.operador_id]||(x.tipo==='propio'?'Casa Pepe':'sin dueño'))+
        (x.precio_adulto?' · $'+Number(x.precio_adulto).toLocaleString('es-MX'):' · sin precio'),
        x.updated_at,'/ficha.html?id='+encodeURIComponent(x.id));
    }).join('');
  }
  if(EVTS.length){
    h+='<h2>Eventos <em>'+EVTS.length+'</em></h2>'+EVTS.map(function(x){
      return tarjeta('evt',x,'🎫',x.nombre||'(sin nombre)',
        (x.espacio||'sin espacio')+(x.fecha_inicio?' · '+String(x.fecha_inicio).slice(0,10):''),
        x.updated_at||x.created_at,'/m/eventos.html?embed=evt');
    }).join('');
  }
  if(ATES.length){
    h+='<h2>Altas de ateneístas <em>'+ATES.length+'</em></h2>'+ATES.map(function(x){
      return tarjeta('ate',x,'👤',x.nombre_comercial||x.nombre||'(sin nombre)',
        (x.ciudad||'sin ciudad')+(x.email?' · '+x.email:''),
        x.updated_at||x.created_at,'/m/comunidad.html');
    }).join('');
  }
  if(TERM.length){
    h+='<h2>Términos sin escribir <em>'+TERM.length+'</em></h2>'+
      '<div style="font-size:12.5px;color:var(--gris);margin:-4px 0 10px">Esto no se aprueba: lo escribe la casa. '+
      'El operador no puede poner sus propios términos.</div>'+
      TERM.map(function(x){
        return '<div class="fila"><div class="ico">📜</div><div class="mid">'+
          '<div class="nom"><b>'+esc(x.nombre||'(sin nombre)')+'</b></div>'+
          '<div class="donde">'+esc(OPS[x.operador_id]||'Casa Pepe')+'</div></div>'+
          '<div class="acc"><a class="btn sm" target="_top" href="/ficha.html?id='+encodeURIComponent(x.id)+'#terminos">Escribir ↗</a></div></div>';
      }).join('');
  }
  caja.innerHTML=h;
}

async function trae(q){
  var r=await fetch(SB+'/rest/v1/'+q,{headers:hdr()});
  if(!r.ok) throw new Error(q.split('?')[0]+' respondió '+r.status);
  return r.json();
}

async function carga(){
  FALLO=''; CARGANDO=true; pinta();
  try{
    var campos='id,nombre,estado,tipo,operador_id,precio_adulto,updated_at,created_at';
    var res=await Promise.all([
      trae('op_experiencias?select='+campos+'&estado=eq.en_revision&order=updated_at'),
      trae('eventos?select=id,nombre,estado,espacio,fecha_inicio,productora_id,created_at,updated_at&estado=eq.propuesto&order=created_at'),
      trae('tour_operadores?select=id,nombre,nombre_comercial,email,ciudad,estado,created_at,updated_at&estado=eq.en_revision&order=created_at'),
      trae('op_experiencias?select=id,nombre,operador_id&terminos_estado=eq.pendiente&order=nombre&limit=200'),
      trae('v_ateneistas?select=id,nombre_comercial,candado&limit=1000')
    ]);
    EXPS=res[0]; EVTS=res[1]; ATES=res[2]; TERM=res[3];
    CAND={}; OPS={};
    res[4].forEach(function(a){ CAND[a.id]=a.candado; OPS[a.id]=a.nombre_comercial; });
  }catch(e){ FALLO=(e&&e.message)||String(e); }
  CARGANDO=false; pinta();
}

$('recargar').addEventListener('click',carga);

ses=sesionPanel();
try{ YO=(ses&&ses.user&&ses.user.email)||''; }catch(_){}
carga();
</script>
</body></html>
