<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo de módulos</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#C9501A; --naranja-suave:#FDE7DC; --azul:#1A7FB5; --azul-suave:#DFEAF6;
  --verde:#1D6B4A; --verde-suave:#E1F0E7; --ambar:#8C6212; --ambar-suave:#F6EBD5;
  --rojo:#9E3B2E; --rojo-suave:#F6E1DD; --morado:#6B2E86; --morado-suave:#EDE4F6;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--hueso);color:var(--tinta);font:400 15px/1.55 Inter,system-ui,sans-serif}
.barra{background:var(--tinta);color:#fff;padding:14px 20px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.barra b{font:700 17px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em}
.barra span{font-size:13px;color:#C9C2B8}
.env{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
.caja{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);padding:20px 22px;margin-bottom:18px}
h2{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0 0 3px}
.ay{font-size:13.5px;color:var(--gris);margin:0 0 16px;line-height:1.55}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(142px,1fr));gap:11px;margin-bottom:18px}
.kpi{border:1px solid var(--linea);border-radius:11px;padding:13px 15px}
.kpi .et{font:600 9.5px/1.3 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.kpi .vl{font:700 26px/1.05 Oswald,sans-serif;margin-top:5px}
.kpi .nt{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}

.filtros{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.ft{border:1.5px solid var(--linea);background:#fff;border-radius:99px;padding:7px 14px;cursor:pointer;
  font:600 10.5px/1 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.ft.on{border-color:var(--tinta);background:var(--tinta);color:#fff}

.mod{border:1px solid var(--linea);border-radius:12px;margin-bottom:10px;background:#fff;overflow:hidden}
.mcab{display:grid;grid-template-columns:1fr auto auto;gap:14px;align-items:center;padding:13px 16px;cursor:pointer}
.mcab:hover{background:var(--papel)}
.mcab .nm{font:600 14px/1.2 Oswald,sans-serif;text-transform:uppercase}
.mcab .ds{font-size:12px;color:var(--gris);margin-top:3px;line-height:1.4}
.mcab .ct{font:700 17px/1 Oswald,sans-serif;color:var(--tenue);font-variant-numeric:tabular-nums}
.mcab .fl{color:var(--tenue);font-size:13px;width:14px;text-align:center}
.subs{display:none;border-top:1px solid var(--linea);background:var(--papel);padding:12px 16px 15px}
.mod.ab .subs{display:block}
.mod.ab .fl{transform:rotate(90deg)}
.subs .g{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:5px 14px}
.subs .s{font-size:12.5px;color:var(--tinta-2);padding:3px 0;line-height:1.4;display:flex;gap:7px}
.subs .s i{color:var(--tenue);font-style:normal;flex:none}
.int{display:inline-block;font:600 9px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;border-radius:99px;padding:4px 9px;white-space:nowrap}
.int.no{background:var(--hueso);color:var(--gris)}
.int.pms{background:var(--azul-suave);color:#1F5B7A}
.int.pos{background:var(--ambar-suave);color:var(--ambar)}
.int.pago{background:var(--naranja-suave);color:var(--naranja)}
.int.banco{background:var(--morado-suave);color:var(--morado)}
.int.cerr{background:var(--rojo-suave);color:var(--rojo)}
.casc{display:inline-block;font:600 9px/1 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;
  border-radius:4px;padding:4px 8px;margin-right:7px;background:var(--hueso);color:var(--gris)}
.cargando{color:var(--gris);padding:40px 0;text-align:center}
.nota{background:var(--hueso);border-radius:9px;padding:12px 15px;font-size:13px;color:var(--tinta-2);line-height:1.55;margin-top:14px}
.nota b{color:var(--tinta)}
</style>
</head>
<body>
<div class="barra"><b>Catálogo de módulos</b>
  <span>Todo lo que existe hoy, leído de la base. Toca un módulo para ver sus pantallas.</span></div>

<div class="env">
  <div class="caja">
    <div class="kpis" id="kpis"></div>
    <div class="filtros" id="filtros"></div>
    <div id="lista"><div class="cargando">Leyendo la base…</div></div>
    <div class="nota" id="pie"></div>
  </div>
</div>

<script>
/* EL CATÁLOGO DE VERDAD. Javi, 10-oct-2026: «vale, ¿qué más módulos y
 * submódulos hay? ¿me los puedes enseñar?»
 *
 * Esto no es una lista escrita a mano: lee la tabla `paginas`, que es la que de
 * verdad arma el menú del panel. Si alguien añade una pantalla mañana, aparece
 * aquí sin que nadie la apunte. Un catálogo escrito a mano se desactualiza el
 * mismo día que se escribe.
 *
 * El MÓDULO es el área —lo que un hotel enciende o apaga— y los SUBMÓDULOS son
 * sus pantallas. La integración se declara por área: es lo que decide si un
 * hotel puede encenderlo el día que firma o tiene que esperar a su proveedor.
 */
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var SBU='https://rehophywchakfapivsbh.supabase.co';
var SBK='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function token(){
  try{ for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i); if(!k||!/^sb-.*-auth-token$/.test(k)) continue;
    var raw=localStorage.getItem(k)||''; if(raw.indexOf('base64-')===0) raw=atob(raw.slice(7));
    var v=JSON.parse(raw), s=v.currentSession||v.session||v;
    if(s&&s.access_token) return s.access_token;
  } }catch(_){} return '';
}

/* Qué necesita cada área para funcionar, y en qué cáscara vive. */
var AREA={
 'Panel':          {c:'admin',   i:'no',   d:'La portada del equipo: su día, sus accesos y lo que tiene pendiente.'},
 'Inicio':         {c:'equipo',  i:'mixto',d:'Lo que el colaborador abre en su teléfono. Aquí vive casi todo SoyPepe.'},
 'Asistencia':     {c:'equipo',  i:'no',   d:'El reloj checador. Nada que conectar.'},
 'Mi cuenta':      {c:'equipo',  i:'no',   d:'Su perfil, sus avisos y sus tickets.'},
 'Huéspedes':      {c:'equipo',  i:'pms',  d:'Check-in, intercambios y objetos olvidados.'},
 'Servicio':       {c:'equipo',  i:'pms',  d:'Ama de llaves, mantenimiento, desayunos y preventivos. Lo más grande del piso.'},
 'Administración': {c:'equipo',  i:'pos',  d:'Cierre de efectivo y relevo de fondo de caja.'},
 'Operación':      {c:'admin',   i:'pos',  d:'A&B con su recetario y costeo, touroperadores, room service y hoteles asociados.'},
 'Revenue':        {c:'admin',   i:'pms',  d:'Tarifa por día, compset, reputación y disparidades.'},
 'RH':             {c:'admin',   i:'banco',d:'Del candidato a la nómina: expedientes, horarios, desempeño, bonos.'},
 'Experiencias':   {c:'admin',   i:'pago', d:'El motor de Sincrético entero: fichas, pricing, guías, boletos, tienda y padrones.'},
 'Ateneo':         {c:'admin',   i:'pago', d:'La puerta del Ateneo, sus salas, su funnel y la app del ateneísta.'},
 'Contabilidad y Finanzas':{c:'admin', i:'banco', d:'Cierre del día, conciliación, flujo, CFDI y el plan de pagos.'},
 'Compras':        {c:'admin',   i:'no',   d:'Pedidos y proveedores.'},
 'Control':        {c:'admin',   i:'no',   d:'Permisos, documentación y el buzón de atención.'},
 'Configuración':  {c:'admin',   i:'no',   d:'Lo que se ajusta una vez y se olvida.'},
 'Estadísticas':   {c:'admin',   i:'no',   d:'Los números del grupo.'},
 'CRM':            {c:'admin',   i:'no',   d:'Contactos y benchmark de la plaza.'},
 'Espíritu':       {c:'huesped', i:'no',   d:'Marco del pensamiento, frases y el Pepe GO!'},
 'Residencias':    {c:'admin',   i:'no',   d:'Voluntarios y sus horarios.'},
 'Voluntariado':   {c:'huesped', i:'no',   d:'La puerta pública del programa de voluntariado.'},
 'Socios':         {c:'admin',   i:'cerr', d:'Reparto, asambleas, títulos y gobierno. Capa aparte: se concede a nombre.'},
 'Próximamente':   {c:'equipo',  i:'no',   d:'Lo que está anunciado y todavía no abre.'}
};
var INOM={no:'sin integración', pms:'PMS', pos:'punto de venta', pago:'cobro', banco:'banco', mixto:'depende del submódulo', cerr:'cerrada'};
var CASC={huesped:'huésped', equipo:'equipo', admin:'dirección'};

var DATOS=null, FILTRO='';

async function carga(){
  var t=token();
  if(!t){ $('lista').innerHTML='<div class="cargando">Entra al panel y vuelve: esta pantalla lee la base con tu sesión.</div>'; return; }
  try{
    var r=await fetch(SBU+'/rest/v1/paginas?select=codigo,nombre,area,area_orden,orden,ruta&activo=is.true&order=area_orden.asc,orden.asc',
      {headers:{apikey:SBK,Authorization:'Bearer '+t}});
    if(!r.ok) throw new Error(r.status);
    DATOS=await r.json();
    pinta();
  }catch(x){ $('lista').innerHTML='<div class="cargando">No se pudo leer la base.</div>'; console.error(x); }
}

function pinta(){
  var areas={};
  DATOS.forEach(function(p){
    var a=p.area||'Sin área';
    (areas[a]=areas[a]||[]).push(p);
  });
  var nombres=Object.keys(areas).sort(function(a,b){ return areas[b].length-areas[a].length; });

  var total=DATOS.length, sinInt=0, conInt=0;
  nombres.forEach(function(a){
    var m=AREA[a]||{i:'no'};
    if(m.i==='no'||m.i==='cerr') sinInt+=areas[a].length; else conInt+=areas[a].length;
  });

  $('kpis').innerHTML=
     '<div class="kpi"><div class="et">Módulos</div><div class="vl">'+nombres.length+'</div><div class="nt">lo que se enciende o apaga</div></div>'
    +'<div class="kpi"><div class="et">Pantallas</div><div class="vl">'+total+'</div><div class="nt">los submódulos de dentro</div></div>'
    +'<div class="kpi"><div class="et">Sin conectar nada</div><div class="vl" style="color:#1D6B4A">'+sinInt+'</div><div class="nt">funcionan el día que firma</div></div>'
    +'<div class="kpi"><div class="et">Con integración</div><div class="vl" style="color:#C9501A">'+conInt+'</div><div class="nt">esperan a su proveedor</div></div>';

  var fs=[['','Todo'],['huesped','Huésped'],['equipo','Equipo'],['admin','Dirección'],
          ['_no','Sin integración'],['_int','Con integración']];
  $('filtros').innerHTML=fs.map(function(f){
    return '<button class="ft'+(FILTRO===f[0]?' on':'')+'" data-f="'+f[0]+'">'+esc(f[1])+'</button>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-f]'),function(b){
    b.onclick=function(){ FILTRO=b.getAttribute('data-f'); pinta(); };
  });

  var vistos=0;
  $('lista').innerHTML=nombres.map(function(a){
    var m=AREA[a]||{c:'admin',i:'no',d:''};
    if(FILTRO==='_no'  && !(m.i==='no'||m.i==='cerr')) return '';
    if(FILTRO==='_int' &&  (m.i==='no'||m.i==='cerr')) return '';
    if(FILTRO && FILTRO[0]!=='_' && m.c!==FILTRO) return '';
    vistos++;
    var ps=areas[a];
    return '<div class="mod" data-mod="'+esc(a)+'">'
      +'<div class="mcab"><div>'
        +'<div class="nm"><span class="casc">'+esc(CASC[m.c]||'')+'</span>'+esc(a)+'</div>'
        +'<div class="ds">'+esc(m.d||'')+'</div></div>'
        +'<span class="int '+(m.i==='mixto'?'no':m.i)+'">'+esc(INOM[m.i])+'</span>'
        +'<span class="ct">'+ps.length+'</span><span class="fl">›</span></div>'
      +'<div class="subs"><div class="g">'
        + ps.map(function(p){ return '<span class="s"><i>·</i>'+esc(p.nombre)+'</span>'; }).join('')
      +'</div></div></div>';
  }).join('');

  Array.prototype.forEach.call(document.querySelectorAll('[data-mod]'),function(d){
    d.querySelector('.mcab').onclick=function(){ d.classList.toggle('ab'); };
  });

  $('pie').innerHTML='Esto sale de la tabla <b>paginas</b>, la que arma el menú del panel: si alguien añade una pantalla mañana, '
    +'aparece aquí sin que nadie la apunte. <b>El módulo es el área</b> —lo que un hotel enciende— y los submódulos son sus pantallas. '
    +'<br><br>Para la propuesta, el número que importa es el tercero: <b>'+sinInt+' pantallas no necesitan conectar nada</b> y funcionan el día que firme. '
    +'Las otras esperan a Cloudbeds, al punto de venta o al banco — y mientras tanto quedan apagadas solas, no rotas.';
}
carga();
</script>
</body>
</html>
