<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soy Pepe · Casa Pepe</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d9e75">
<link rel="icon" type="image/png" sizes="192x192" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/apple-touch-icon.png">

<!-- LA PUERTA DE LA APP VIEJA.

     Aquí vivía una segunda Soy Pepe. Para el teléfono era una app distinta de
     la de /soypepe/ -su propio manifest, su propio icono, su propio service
     worker-, así que quien instaló ésta se quedó congelado en la versión de
     aquel día y no veía ni un cambio nuestro: lo de Bren con las comidas, y el
     25-nov-2026 el Soy Pepe de Deisy y el de Azucena con los iconos de antes.
     Mantener dos apps es garantizar que una envejezca.

     Ya no hay app aquí. Esta página limpia lo que dejó la vieja -su caché y su
     service worker- y lleva a /soypepe/, que es la única. El icono viejo del
     teléfono sigue funcionando: ahora abre la buena. Javi, 25-nov-2026. -->

<style>
  html,body{margin:0;height:100%}
  body{background:#16130f;color:#f2efe8;
       font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;
       padding:24px;box-sizing:border-box}
  .caja{max-width:320px}
  img{width:72px;height:72px;border-radius:18px;margin-bottom:18px}
  b{display:block;font-size:17px;margin-bottom:6px}
  p{margin:0;font-size:14px;line-height:1.5;color:#b9b3a6}
  a{color:#1d9e75;font-weight:700}
</style>
</head><body>

<div class="caja">
  <img src="/soypepe/icon-192.png" alt="">
  <b>Un momento…</b>
  <p>Te llevamos a tu Soy Pepe.<br>
     Si no se abre solo, entra <a href="/soypepe/">aquí</a>.</p>
</div>

<script>
(function(){
  var DESTINO='/soypepe/';
  /* Pase lo que pase con la limpieza, el salto se da: nadie se queda mirando
     una pantalla que no lleva a ninguna parte. Segundo y medio de margen para
     que el service worker viejo tenga tiempo de irse, y fuera. */
  var saltado=false;
  function salta(){ if(saltado) return; saltado=true; location.replace(DESTINO); }
  setTimeout(salta, 1500);

  (async function(){
    try{
      if('serviceWorker' in navigator){
        var regs=await navigator.serviceWorker.getRegistrations();
        for(var i=0;i<regs.length;i++){
          var sc=String(regs[i].scope||'');
          /* Sólo el de esta app. El de /soypepe/ no se toca: es el que vale. */
          if(sc.indexOf('/sp/')>=0 && sc.indexOf('/soypepe/')<0){
            try{ await regs[i].unregister(); }catch(_e){}
          }
        }
      }
      try{ await caches.delete('soypepe-v3'); }catch(_e){}
    }catch(_e){}
    salta();
  })();
})();
</script>
</body></html>
