<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Deck de la ronda · Socios Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#AD8F93">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Socios">
<!-- Esta pantalla vive dentro de /socios/ para no salirse del scope de la app.
     Si el socio saliera del scope, Android abriria el navegador encima y la
     app se sentiria rota. Por eso el destino va en iframe y no en un link. -->
<link rel="manifest" href="/socios.webmanifest">
<link rel="icon" type="image/png" href="/socios-192.png">
<link rel="apple-touch-icon" href="/socios-192.png">
<style>
  :root{ --ground:#FDFBF8; --soc:#AD8F93; --soc-txt:#906A6F; --tinta:#3D0001;
          --muted:#6B6459; --rule:#E7DED4; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--ground);color:var(--tinta);
    font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:12px;flex:0 0 auto;
    padding:calc(9px + env(safe-area-inset-top)) 14px 9px;
    background:#fff;border-bottom:1px solid var(--rule)}
  .bar a{color:var(--soc-txt);text-decoration:none;font-size:13.5px;font-weight:600;
    white-space:nowrap}
  .bar .t{font-weight:700;font-size:14.5px;color:var(--tinta)}
  iframe{flex:1 1 auto;width:100%;border:0;background:#fffaf2}
</style>
<link rel="stylesheet" href="/cp-movil.css">
</head>
<body>
  <div class="bar">
    <a href="/socios/">‹ Socios</a>
    <span class="t">Deck de la ronda</span>
    <a href="/deck" target="_blank" rel="noopener" style="margin-left:auto">Pestaña ↗</a>
  </div>
  <iframe src="/deck" title="Deck de la ronda" loading="eager"></iframe>

<script>/* Bitacora de accesos: deja constancia de quien abre esta pantalla y cuanto
   se queda. Si no esta en la lista de corporativo (public.aud_corporativo), la
   base levanta un ticket de seguridad en Incidencias > Tickets. */
(function(){try{
 var K='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO', T=null;
 try{var r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(r){var j=JSON.parse(r);
   T=j.access_token||(j.currentSession&&j.currentSession.access_token)||(j.session&&j.session.access_token)||null;}}catch(e){}
 if(!T)return;
 var S=null; try{ S=sessionStorage.getItem('cp-visita');
   if(!S){ S=Date.now().toString(36)+Math.random().toString(36).slice(2,8); sessionStorage.setItem('cp-visita',S); } }catch(e){}
 var AU='https://rehophywchakfapivsbh.supabase.co/rest/v1/rpc/';
 var HD={apikey:K,Authorization:'Bearer '+T,'Content-Type':'application/json'};
 var ID=null, visto=0, ult=Date.now();
 function tic(){ var n=Date.now(); if(document.visibilityState!=='hidden'){ visto+=Math.min(n-ult,60000); } ult=n; }
 function cierra(ka){ tic(); if(ID==null)return; try{ fetch(AU+'aud_cierra',{method:'POST',headers:HD,keepalive:!!ka,
   body:JSON.stringify({p_id:ID,p_segundos:Math.round(visto/1000)})}); }catch(e){} }
 fetch(AU+'aud_registra',{method:'POST',headers:HD,body:JSON.stringify(
   {p_area:'socios',p_objeto:'Socios · app · deck',p_ticket:true,p_sesion:S})})
  .then(function(x){return x.ok?x.json():null;}).then(function(v){ID=v;}).catch(function(){});
 setInterval(function(){ cierra(false); },30000);
 document.addEventListener('visibilitychange',function(){ tic(); if(document.visibilityState==='hidden')cierra(true); });
 window.addEventListener('pagehide',function(){ cierra(true); });
}catch(e){}})();</script>
</body>
</html>
