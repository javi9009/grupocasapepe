<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Entrar · Sincrético · Ateneo del Viaje</title>
<link rel="icon" href="/img/sincretico/sincretico-isotipo-64.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  LA PUERTA. Javi, 26-oct-2026.

  Una sola pantalla para todo el que forma parte del proyecto: ateneista,
  hotelero, concierge o equipo. Correo, contrasena, recuperar y alta. Nada
  mas. Quien es cada quien no se pregunta aqui: se mira en la base despues
  de entrar, y cada quien cae en su portal.

  POR QUE NO SE PREGUNTA "QUE ERES". Porque la respuesta ya la tenemos y
  preguntarla crea duplicados: asi acabo Barrio Hostel dado de alta tres
  veces. El unico que elige puerta es el que todavia no existe, y ese se va
  al alta.

  El boton de Casa Pepe no es decoracion: mucha gente llega aqui buscando
  el hotel, no el panel.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-oscuro:#B3106F;--magenta-suave:#FBDCEE;
  --rosa:#F8BBCB;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--error:#9E3B2E;--error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 18px 44px -28px rgba(30,26,22,.5);
  --radio:12px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:15px;
  background:
    radial-gradient(900px 520px at 8% -8%, rgba(242,104,42,.16), transparent 60%),
    radial-gradient(760px 480px at 96% 4%, rgba(226,24,142,.11), transparent 58%),
    radial-gradient(820px 520px at 50% 110%, rgba(141,200,234,.20), transparent 62%),
    linear-gradient(170deg,#FDFBF7 0%, var(--papel) 48%, #F1EADF 100%);
  background-attachment:fixed;
  display:flex;align-items:center;justify-content:center;padding:28px 18px 50px}
.caja{width:100%;max-width:430px}
.marca{text-align:center;margin-bottom:20px}
.marca img.iso{width:66px;height:auto;display:block;margin:0 auto 12px}
.marca img.logo{width:min(230px,70%);height:auto;display:block;margin:0 auto}
.marca .tag{font:400 italic 19px "Lobster Two";color:var(--magenta);margin-top:7px}
.marca .ate{font:600 10.5px Oswald;letter-spacing:.18em;text-transform:uppercase;color:var(--gris);margin-top:9px}

.tarjeta{background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra);padding:24px 22px 20px}
h1{font:700 21px Oswald;letter-spacing:.05em;text-transform:uppercase;margin:0 0 3px}
.sub{color:var(--gris);font-size:13.5px;margin:0 0 18px}

label{display:block;font:600 11px Oswald;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);margin:0 0 5px}
input{width:100%;border:1.5px solid var(--linea);border-radius:9px;padding:12px 13px;font:inherit;color:var(--tinta);background:#fff}
input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.campo{margin-bottom:14px}
.campo .pista{font-size:12px;color:var(--tenue);margin-top:5px}

.btn{width:100%;cursor:pointer;font:600 13px Oswald;letter-spacing:.06em;text-transform:uppercase;
  padding:13px 18px;border-radius:9px;border:2px solid var(--naranja);background:var(--naranja);color:#fff}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn[disabled]{opacity:.55;cursor:default}
.btn.fantasma{background:none;color:var(--naranja-oscuro)}
.btn.fantasma:hover{background:var(--naranja-suave)}
.btn.tinta{border-color:var(--tinta);background:var(--tinta);color:#fff}
.btn.tinta:hover{background:#000;border-color:#000}

.menores{display:flex;justify-content:space-between;gap:10px;margin-top:13px;flex-wrap:wrap}
.menores a{font-size:13px;color:var(--gris);text-decoration:none;border-bottom:1px solid var(--linea);cursor:pointer}
.menores a:hover{color:var(--naranja-oscuro);border-color:var(--naranja)}

.raya{display:flex;align-items:center;gap:11px;margin:20px 0 14px;color:var(--tenue);font-size:12px}
.raya:before,.raya:after{content:'';flex:1;height:1px;background:var(--linea)}

.aviso{display:none;border-radius:9px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin-bottom:14px}
.aviso.on{display:block}
.aviso.mal{background:var(--error-bg);color:var(--error)}
.aviso.bien{background:var(--ok-bg);color:var(--ok)}
.aviso.info{background:var(--cielo-suave);color:#2F6E93}

.pie{text-align:center;margin-top:18px;font-size:12.5px;color:var(--tenue);line-height:1.6}
.pie a{color:var(--gris)}
@media(max-width:420px){.tarjeta{padding:20px 17px 17px}}
</style>
</head><body>

<div class="caja">

  <div class="marca">
    <img class="iso" src="/img/sincretico/sincretico-isotipo-256.png" alt="">
    <img class="logo" src="/img/sincretico/sincretico-logo.png" alt="Sincrético">
    <div class="tag">How to be a Mexican?</div>
    <div class="ate">Ateneo del Viaje</div>
  </div>

  <div class="tarjeta">
    <h1>Entrar</h1>
    <p class="sub" id="sub">Tu correo y tu contraseña. Te llevamos a lo tuyo.</p>

    <div class="aviso" id="aviso"></div>

    <form id="form" autocomplete="on">
      <div class="campo">
        <label for="email">Correo</label>
        <input id="email" type="email" inputmode="email" autocomplete="username" placeholder="tu@correo.com" required>
      </div>
      <div class="campo" id="campoPass">
        <label for="pass">Contraseña</label>
        <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">
      </div>
      <button class="btn" id="entrar" type="submit">Entrar</button>
    </form>

    <div class="menores">
      <a id="olvide">¿Olvidaste tu contraseña?</a>
      <a id="volver" style="display:none">Volver a entrar</a>
    </div>

    <div class="raya">¿todavía no estás?</div>
    <a class="btn fantasma" href="/ateneista" style="display:block;text-align:center;text-decoration:none">Darme de alta</a>
    <!-- Fuera «Ir a Casa Pepe». Javi, 27-oct-2026.
         Esta es la puerta de quien trabaja con nosotros -ateneista, hotelero,
         concierge, equipo-, y el boton mas negro y mas grande de la pantalla
         lo sacaba del sitio al que venia a entrar. La web del hotel no se
         busca aqui. -->
  </div>

  <div class="pie">
    Grupo Casa Pepe · Sincrético · Ateneo del Viaje<br>
    ¿Algo no cuadra? Escribe a <a href="mailto:experience.cdmx@casapepe.mx">experience.cdmx@casapepe.mx</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB='https://rehophywchakfapivsbh.supabase.co';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB,KEY);

const $=id=>document.getElementById(id);
let MODO='entrar';   // 'entrar' | 'recuperar' | 'nueva'

function aviso(txt,clase){
  const a=$('aviso');
  if(!txt){ a.className='aviso'; a.innerHTML=''; return; }
  a.className='aviso on '+(clase||'info'); a.innerHTML=txt;
}

/* A DONDE VA CADA QUIEN.
   No se pregunta: se mira. Las tres consultas van con la sesion recien
   hecha, asi que RLS ya filtra a lo suyo; si una devuelve una fila, ese es
   su portal. El orden importa: alguien del equipo que ademas tenga ficha de
   operadora entra al panel, que es donde hace su trabajo. */
/* UNA PERSONA PUEDE TENER MAS DE UNA CASA, Y LA PUERTA NO DEBE ELEGIR POR
   ELLA. Javi, 28-oct-2026: «lo mandaste a soypepe en vez de a Ficha
   ateneista».
   Oscar Reyes esta en employees como SOCIO y ademas es ateneista -Taller de
   Rotulos Pase ud, con artesania, eventos y experiencias-. Esta funcion
   preguntaba en orden y se quedaba con la primera que respondiera que si: como
   socio respondia a la primera, nunca se le preguntaba por su ficha y acababa
   en el panel de la casa. No estaba mal ligado; estaba bien ligado a las dos
   cosas, y la puerta se quedo con una.
   Ahora se preguntan TODAS y, si hay mas de una, se le enseñan para que elija.
   Con una sola, entra directo como siempre: a nadie se le añade un clic que no
   hacia falta. */
async function misCasas(){
  const c=[];
  try{
    const {data:eq}=await sb.rpc('es_equipo_casa');
    if(eq===true) c.push({url:'/index.html', t:'El panel de la casa',
      d:'Lo de Grupo Casa Pepe: finanzas, equipo, operación.'});
  }catch(_){}
  /* El socio no es equipo de la casa —y por eso dejo de ver lo que no le
     tocaba—, pero su tablero vive en el mismo panel. Se le ofrece por lo que
     es. Javi, 28-oct-2026. */
  try{
    const {data:so}=await sb.rpc('es_socio');
    if(so===true && !c.some(x=>x.url==='/index.html'))
      c.push({url:'/index.html', t:'Mi tablero de socio',
        d:'Tus sociedades, las aportaciones, las actas y los resultados.'});
  }catch(_){}
  /* «¿PUEDO LEER ALGO?» NO ES «¿ES MIO?». Javi, 28-oct-2026: «Oscar no tiene
     hotel, ¿por que se lo ofreciste?».
     Estas dos preguntas eran `select id limit 1`, que contesta «si» en cuanto
     la persona puede LEER una fila cualquiera. Quien es equipo de la casa
     puede leer todos los hoteles, asi que a Oscar se le ofrecio un hotel que
     no es suyo. Ahora se pregunta por identidad: mi_operador() y mi_hotel()
     solo pueden devolver LA SUYA, y si no tiene, devuelven nada. */
  let miOp=null;
  try{
    const {data:op}=await sb.rpc('mi_operador');
    miOp = op || null;
  }catch(_){}
  if(miOp){
    let nom='';
    try{
      const {data:f}=await sb.from('tour_operadores').select('nombre_comercial').eq('id',miOp).limit(1);
      if(f && f.length) nom=f[0].nombre_comercial||'';
    }catch(_){}
    c.push({url:'/operador.html', t:'Mi ficha de ateneísta',
      d:(nom? nom+'. ' : '')+'Tus experiencias, tus eventos, tus piezas y tus ventas.'});
  }
  try{
    const {data:ho}=await sb.rpc('mi_hotel');
    if(ho) c.push({url:'/hotelero.html', t:'Mi hotel',
      d:'Tus casas, tus espacios y lo que ofreces a tus huéspedes.'});
  }catch(_){}
  try{
    const {data:pr}=await sb.rpc('mi_productora');
    if(pr) c.push({url:'/productora.html', t:'Mi productora',
      d:'Tus eventos en el Ateneo: salas, montaje y boletos.'});
  }catch(_){}
  return c;
}

/* Cuando hay varias, se preguntan. No se guarda la eleccion: alguien que lleva
   dos sombreros se los cambia a lo largo del dia, y recordarle el de ayer es
   justo el error que veniamos a arreglar. */
function eligeCasa(casas){
  document.querySelector('.tarjeta').innerHTML =
    '<h1>¿A dónde entras?</h1>'+
    '<p class="sub">Tienes más de un sitio con nosotros. Elige y te llevamos.</p>'+
    casas.map(function(c){
      return '<a class="btn fantasma" href="'+c.url+'" style="display:block;text-align:left;'+
        'text-decoration:none;margin-bottom:10px;padding:14px 16px">'+
        '<b style="display:block">'+c.t+'</b>'+
        /* El boton va en mayusculas por el estilo de la casa, pero la linea de
           abajo es una frase, no una etiqueta: en mayusculas se grita. */
        '<span style="display:block;font-weight:400;font-size:13px;line-height:1.45;text-transform:none;'+
        'letter-spacing:normal;color:var(--gris,#6E665C);margin-top:3px">'+
        c.d+'</span></a>';
    }).join('')+
    '<div class="menores" style="margin-top:4px"><a onclick="location.reload()">Salir</a></div>';
}

async function aDonde(){
  const casas=await misCasas();
  if(casas.length===1) return casas[0].url;
  if(casas.length>1){ eligeCasa(casas); return null; }
  /* Tiene cuenta pero no lo encontramos en ningun padron. No lo dejamos en
     blanco: la puerta vieja sigue sabiendo preguntar quien es. */
  return '/entrar.html';
}

async function entrar(email,pass){
  const b=$('entrar'); b.disabled=true; b.textContent='Entrando…'; aviso('');
  try{
    const {error}=await sb.auth.signInWithPassword({email,password:pass});
    if(error){
      const m=String(error.message||'');
      if(/not confirmed|not_confirmed/i.test(m)){
        aviso('Tu cuenta existe pero falta confirmar el correo. Busca el mensaje que te mandamos a <b>'+
              email+'</b> y dale al enlace.','info');
      } else if(/invalid/i.test(m)){
        aviso('Ese correo y esa contraseña no coinciden. Si no te acuerdas, usa <b>¿Olvidaste tu contraseña?</b> aquí abajo.','mal');
      } else {
        aviso('No pudimos entrar: '+m,'mal');
      }
      b.disabled=false; b.textContent='Entrar'; return;
    }
    b.textContent='Buscando lo tuyo…';
    const destino=await aDonde();
    const q=new URLSearchParams(location.search).get('a');
    /* destino null = ya se le estan enseñando sus casas para que elija; no se
       le manda a ningun sitio por encima de la pregunta. */
    if(q && q.charAt(0)==='/') location.href=q;
    else if(destino) location.href=destino;
  }catch(e){
    aviso('No pudimos entrar: '+((e&&e.message)||e),'mal');
    b.disabled=false; b.textContent='Entrar';
  }
}

async function recuperar(email){
  const b=$('entrar'); b.disabled=true; b.textContent='Mandando…'; aviso('');
  try{
    await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/acceso.html'});
  }catch(_){}
  /* Se contesta igual exista o no la cuenta: decir "ese correo no esta" es
     decirle a cualquiera quien si esta. */
  aviso('Si ese correo tiene cuenta, ya va en camino un mensaje para poner una contraseña nueva. '+
        'Mira también en spam.','bien');
  b.disabled=false;
  modo('entrar');
}

function modo(m){
  MODO=m;
  const esRec = m==='recuperar', esNueva = m==='nueva';
  $('campoPass').style.display = esRec?'none':'';
  document.querySelector('label[for=pass]').textContent = esNueva?'Contraseña nueva':'Contraseña';
  $('pass').setAttribute('autocomplete', esNueva?'new-password':'current-password');
  $('email').parentNode.style.display = esNueva?'none':'';
  $('entrar').textContent = esRec?'Mandarme el enlace' : esNueva?'Guardar y entrar' : 'Entrar';
  $('sub').textContent = esRec
    ? 'Dinos tu correo y te mandamos un enlace para poner una contraseña nueva.'
    : esNueva
    ? 'Escribe la contraseña nueva. Con eso entras.'
    : 'Tu correo y tu contraseña. Te llevamos a lo tuyo.';
  $('olvide').style.display = (esRec||esNueva)?'none':'';
  $('volver').style.display = esRec?'':'none';
}

/* VOLVIENDO DEL CORREO. El enlace trae la sesion en el hash; aqui NO se
   entra todavia: primero se guarda la contrasena nueva, porque si no, la
   proxima vez vuelve a no poder entrar y el correo ya se gasto. */
async function guardaNueva(pass){
  const b=$('entrar'); b.disabled=true; b.textContent='Guardando…'; aviso('');
  try{
    const {error}=await sb.auth.updateUser({password:pass});
    if(error) throw new Error(error.message);
    b.textContent='Buscando lo tuyo…';
    /* Si la liga decia a donde sigue -el check-in de los papeles, por ejemplo-
       se respeta: el que acaba de darse de alta no quiere el portal, quiere
       terminar lo que estaba haciendo. */
    var sigue=new URLSearchParams(location.search).get('a');
    history.replaceState(null,'',location.pathname);
    if(sigue && sigue.charAt(0)==='/' && sigue.indexOf('//')!==0){ location.href=sigue; return; }
    var d=await aDonde(); if(d) location.href=d;
  }catch(e){
    aviso('No pudimos guardarla: '+((e&&e.message)||e),'mal');
    b.disabled=false; b.textContent='Guardar y entrar';
  }
}

$('form').addEventListener('submit',function(e){
  e.preventDefault();
  const email=($('email').value||'').trim().toLowerCase();
  if(MODO!=='nueva' && !/.+@.+\..+/.test(email)){ aviso('Ese correo no parece válido.','mal'); return; }
  if(MODO==='recuperar') return recuperar(email);
  const pass=$('pass').value||'';
  if(MODO==='nueva'){
    if(pass.length<8){ aviso('La contraseña nueva necesita al menos 8 caracteres.','mal'); return; }
    return guardaNueva(pass);
  }
  if(pass.length<6){ aviso('Escribe tu contraseña.','mal'); return; }
  entrar(email,pass);
});
$('olvide').addEventListener('click',()=>modo('recuperar'));
$('volver').addEventListener('click',()=>{ aviso(''); modo('entrar'); });

/* Si llega con sesion abierta, no se le pregunta otra vez: se le lleva. */
(async function(){
  /* Volviendo del correo de recuperacion Supabase deja el token en el hash;
     ahi SI hay que quedarse para que escriba la contrasena nueva. */
  if(location.hash.indexOf('type=recovery')>=0){
    modo('nueva');
    aviso('Pon tu contraseña nueva y entra.','info');
    return;
  }
  /* LA LIGA GASTADA NO DECIA NADA. Javi, 29-oct-2026, enseñando una pantalla
     con `#error=access_denied&error_code=otp_expired` en la barra: la liga del
     correo caduca —y se gasta al primer clic, que a veces lo da solo el
     antivirus del correo antes que la persona—, y cuando eso pasa Supabase
     devuelve aquí con el motivo en el hash. Esta pantalla lo ignoraba y
     enseñaba el formulario de siempre, así que el que venía a poner su
     contraseña se quedaba mirando un «Entrar» con una contraseña que todavía
     no tiene, sin saber por qué.
     Ahora se lee el motivo y se le deja listo lo único que le sirve: pedir
     otra liga. */
  if(location.hash.indexOf('error')>=0){
    var h=new URLSearchParams(location.hash.replace(/^#/,''));
    var cod=h.get('error_code')||h.get('error')||'';
    history.replaceState(null,'',location.pathname+location.search);
    modo('recuperar');
    aviso(/expired|invalid/i.test(cod)
      ? '<b>Esa liga ya no sirve.</b> Las ligas del correo caducan, y se gastan en cuanto alguien las abre —a veces las abre el antivirus del correo antes que tú—. '+
        'Escribe tu correo aquí y te mandamos otra ahora mismo.'
      : '<b>No pudimos abrir esa liga.</b> Escribe tu correo y te mandamos una nueva.','mal');
    return;
  }
  try{
    const {data}=await sb.auth.getSession();
    if(data && data.session){
      $('sub').textContent='Ya tenías sesión abierta. Un momento…';
      var d2=await aDonde(); if(d2) location.href=d2;
    }
  }catch(_){}
})();
</script>
</body></html>
