<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mi productora · Ateneo</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --oscuro:#16230c; --oscuro2:#1f2e14; --linea-d:#2c3d1c;
  --oro:#C9A227; --oro-claro:#f0d489; --verde:#1f9d55; --verde-claro:#8cc63f;
  --papel:#F6EFE4; --crema:#f3f8ea; --blanco:#fff; --tinta:#1E2415; --gris:#6E6A5C; --tenue:#A7A08C; --linea:#E3E0D6;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5; --bad:#9E3B2E;
  --sombra:0 1px 1px rgba(20,26,12,.05),0 12px 30px -22px rgba(20,26,12,.5);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);font-family:Inter,system-ui,sans-serif;font-size:14px}
h1,h2,h3,.osw{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
/* cabecera oscura estilo portal operador */
.hd{background:var(--oscuro);color:var(--crema);padding:14px 16px 0}
.hd .in{max-width:900px;margin:0 auto}
.hd .aviso{font-size:12.5px;color:var(--tenue);line-height:1.5;margin-bottom:10px}
.hd .aviso a{color:var(--oro-claro)}
.hd .marca{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.hd .marca .n{font-family:Oswald;font-weight:700;font-size:19px}
.hd .marca .g{font-size:12px;color:var(--tenue)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tabs button{border:0;background:none;font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--tenue);padding:12px 12px 14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tabs button[aria-selected="true"]{color:var(--crema);border-bottom-color:var(--oro)}
.salir{color:var(--tenue);font-size:12.5px;padding:8px 0 12px;cursor:pointer;display:inline-block}
.wrap{max-width:900px;margin:0 auto;padding:16px 16px 90px}
.pane{display:none}.pane.on{display:block}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);padding:16px 18px;margin-bottom:12px}
.card h3{font-size:16px;margin:0 0 4px}
.hint{color:var(--gris);font-size:12.5px;margin-bottom:12px;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-family:Oswald;font-size:11px;color:var(--gris);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.06em}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 11px;border:1px solid var(--linea);border-radius:9px;font:inherit;font-size:14px;background:var(--blanco)}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--verde);box-shadow:0 0 0 3px #dff0e4}
.fld .ay{font-size:11.5px;color:var(--tenue);margin-top:3px}
.btn{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;padding:10px 16px;border-radius:9px;border:2px solid var(--verde);background:var(--verde);color:#fff;cursor:pointer}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:transparent;color:var(--verde);border-color:var(--linea)}
.btn.sm{padding:6px 11px;font-size:11.5px}
.btn[disabled]{opacity:.5;cursor:default}
.tag{display:inline-block;font-family:Oswald;font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;border-radius:999px;padding:3px 9px;background:var(--crema);color:var(--gris)}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--alerta-bg);color:var(--alerta)}.tag.bad{background:#F4E2DE;color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-family:Oswald;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--gris)}
.aviso{background:#EEF6E6;border:1px solid #CFE0B8;border-radius:10px;padding:11px 13px;font-size:12.5px;color:#3d5a26;line-height:1.5}
.mini{color:var(--gris);font-size:12px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.chip{font-size:12.5px;border:1.5px solid var(--linea);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--blanco);user-select:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--oscuro);color:var(--crema);padding:10px 16px;border-radius:8px;font-family:Oswald;font-weight:600;letter-spacing:.04em;display:none;z-index:60}.toast.err{background:var(--bad)}
/* sub-pestañas de la ficha (estilo tour-editor) */
.fnav{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--linea);margin-bottom:14px}
.fnav button{border:0;background:none;font-family:Oswald;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris);padding:10px 12px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.fnav button[aria-selected="true"]{color:var(--tinta);border-bottom-color:var(--oro)}
.fsec{display:none}.fsec.on{display:block}
[data-ef]{display:none}
</style><link rel="icon" type="image/png" href="/dash-192.png">
<script src="/tel.js" defer></script>
</head><body>
<div id="root"><div class="wrap"><div class="card">Cargando…</div></div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var TOK=''; try{ TOK=new URLSearchParams(location.search).get('t')||''; }catch(e){}
  var FICHA=null, EV=[], AG=[], PR=[], evCur=null, ESPACIOS=[];
  var EVT=[
    {k:'reserva_horas',n:'Reserva por horas',f:['fecha','hora','precio_hora','aforo']},
    {k:'congreso',      n:'Congreso / conferencia',f:['fechas','aforo','agenda','precios']},
    {k:'funcion',       n:'Función / show',f:['fecha','hora','duracion','aforo','cobro_taquilla','precios']},
    {k:'expo',          n:'Exposición',f:['fechas','horario_visita','cobro_expo']},
    {k:'taller',        n:'Taller',f:['fecha','hora','duracion','cupo','materiales','precio_persona']},
    {k:'grabacion',     n:'Grabación / rodaje',f:['fechas','hora','tipo_produccion','crew','cobro_renta']},
    {k:'otro',          n:'Otro',f:['fecha','aforo']}
  ];
  function evtDef(k){return EVT.filter(function(x){return x.k===k;})[0]||EVT[0];}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}
  function fmtCuando(e){if(e.fecha_inicio&&e.fecha_fin&&String(e.fecha_inicio).slice(0,10)!==String(e.fecha_fin).slice(0,10))return String(e.fecha_inicio).slice(0,10)+'→'+String(e.fecha_fin).slice(0,10);return e.fecha_inicio?String(e.fecha_inicio).slice(0,16).replace('T',' '):'—';}
  function hdrs(){return {'apikey':KEY,'Authorization':'Bearer '+KEY};}
  async function rpc(fn,body){var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body||{})});if(!r.ok)throw new Error(fn+' '+r.status);return r.json();}
  function estadoTag(e){var m={borrador:'borrador',propuesto:'en revisión',confirmado:'confirmado',publicado:'publicado',realizado:'realizado',cancelado:'cancelado'};var c=(e.estado==='publicado'||e.estado==='confirmado')?'ok':(e.estado==='cancelado'?'bad':'warn');return '<span class="tag '+c+'">'+esc(m[e.estado]||e.estado)+'</span>';}

  function shell(){
    if(!FICHA){$('root').innerHTML='<div class="wrap"><div class="card"><h3>Liga no válida</h3><div class="hint">Pídele a Casa Pepe tu liga personal para entrar.</div></div></div>';return;}
    $('root').innerHTML=
      '<div class="hd"><div class="in">'+
        '<div class="aviso">Vista de Casa Pepe · portal de <b>'+esc(FICHA.nombre_comercial||'tu productora')+'</b>. Lo que guardes queda a su nombre.</div>'+
        '<div class="marca"><span class="n">'+esc(FICHA.nombre_comercial||'Mi productora')+'</span><span class="g">'+esc(FICHA.tipo_nombre||'')+(FICHA.espacio?' · '+esc(FICHA.espacio):'')+'</span></div>'+
        '<div class="tabs" id="tabs">'+
          '<button data-p="eventos" aria-selected="true">🎫 Mis eventos</button>'+
          '<button data-p="pagina" aria-selected="false">🌐 Mi página</button>'+
          /* ROOM SERVICE. Javi, 3-oct-2026: solo Cumbre. No se decide por el
             nombre: se decide por el interruptor room_service de su ficha, asi
             que si manana otra cocina del edificio hace lo mismo, es encenderlo
             y no copiar el modulo. */
          ((FICHA&&FICHA.room_service)?'<button data-p="rs" aria-selected="false">🍳 Room service</button>':'')+
          '<button data-p="cuenta" aria-selected="false">🏢 Mi cuenta</button>'+
        '</div>'+
      '</div></div>'+
      '<div class="wrap"><div class="pane on" id="pane-eventos"></div>'+
        '<div class="pane" id="pane-pagina"></div>'+
        ((FICHA&&FICHA.room_service)?'<div class="pane" id="pane-rs"></div>':'')+
        '<div class="pane" id="pane-cuenta"></div></div>';
    Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){ve(b.getAttribute('data-p'));};});
    pintaEventos(); pintaPagina(); pintaCuenta();
    if(FICHA&&FICHA.room_service) pintaRS();
  }
  function ve(p){Array.prototype.forEach.call($('tabs').children,function(b){b.setAttribute('aria-selected',b.getAttribute('data-p')===p?'true':'false');});document.querySelectorAll('.pane').forEach(function(x){x.classList.toggle('on',x.id==='pane-'+p);});window.scrollTo({top:0,behavior:'smooth'});}

  /* ---------- MIS EVENTOS ---------- */
  function pintaEventos(){
    $('pane-eventos').innerHTML=
      '<div class="card"><h3>Mis eventos</h3>'+
        '<div class="hint">Elige el tipo y solo aparece lo que ese tipo necesita. Lo que mandes queda <b>en revisión</b> hasta que Casa Pepe lo valide y lo publique.</div>'+
        '<table><thead><tr><th>Evento</th><th>Tipo</th><th>Cuándo</th><th>Estado</th><th></th></tr></thead><tbody id="tbE"></tbody></table>'+
        '<div class="ft" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="evNuevo">+ Nuevo evento</button></div>'+
      '</div><div id="fichaHost"></div>';
    $('evNuevo').onclick=nuevo; renTabla();
  }
  function renTabla(){
    $('tbE').innerHTML=EV.map(function(e){
      return '<tr><td><b>'+esc(e.nombre||'(sin nombre)')+'</b>'+(e.es_gratis?' <span class="tag">gratis</span>':'')+'</td><td class="mini">'+esc(evtDef(e.tipo).n)+'</td><td class="mini">'+esc(fmtCuando(e))+'</td><td>'+estadoTag(e)+'</td><td><button class="btn ghost sm" data-ev="'+e.id+'">Abrir</button></td></tr>';
    }).join('')||'<tr><td colspan="5" class="mini">Todavía nada. Crea tu primer evento.</td></tr>';
    Array.prototype.forEach.call($('tbE').querySelectorAll('[data-ev]'),function(b){b.onclick=function(){abre(b.getAttribute('data-ev'));};});
  }

  /* ---------- FICHA DE EVENTO (pestañas estilo tour) ---------- */
  function fichaHTML(){
    return '<div class="card"><h3 id="fTit">Nuevo evento</h3>'+
    '<div class="fnav" id="fnav">'+
      '<button data-f="esencial" aria-selected="true">Lo esencial</button>'+
      '<button data-f="cuando">Cuándo y dónde</button>'+
      '<button data-f="cobro">Cobro</button>'+
      '<button data-f="fotos">Fotos</button>'+
      '<button data-f="extra" id="fnavExtra" style="display:none">Agenda y boletos</button>'+
    '</div>'+
    // ESENCIAL
    '<div class="fsec on" data-fs="esencial">'+
      '<div class="fgrid"><div class="fld"><label>Tipo de evento</label><select id="evTipo"></select></div>'+
      '<div class="fld"><label>¿Cómo se llama?</label><input id="ev-nombre"></div></div>'+
      '<div class="fld" style="margin-top:10px"><label>Descripción</label><textarea id="ev-desc" rows="3"></textarea></div>'+
    '</div>'+
    // CUÁNDO Y DÓNDE
    '<div class="fsec" data-fs="cuando">'+
      /* EL ESPACIO SE ELIGE, NO SE ESCRIBE. Victor, 3-oct: «cuando solicita
         espacio el campo esta abierto, no se puede configurar la reserva del
         espacio para su evento». Era un <input> libre -y ademas el unico campo
         que no se escondia segun el tipo-, asi que acababa escribiendo sala,
         fecha y hora en la misma casilla. Ahora salen SUS salas, las que su
         giro le permite, con el aforo a la vista. */
      '<div class="fgrid"><div class="fld"><label>Espacio</label>'+
        '<select id="ev-espacio"><option value="">— elige la sala —</option></select>'+
        '<div class="mini" id="ev-espacio-info"></div></div>'+
        '<div class="fld" data-ef="fecha"><label>Fecha</label><input type="date" id="ev-fecha"></div>'+
        '<div class="fld" data-ef="fechas"><label>Del</label><input type="date" id="ev-desde"></div>'+
        '<div class="fld" data-ef="fechas"><label>Al</label><input type="date" id="ev-hasta"></div>'+
        '<div class="fld" data-ef="hora"><label>Empieza</label><input type="time" id="ev-hora-ini"></div>'+
        '<div class="fld" data-ef="hora"><label>Acaba</label><input type="time" id="ev-hora-fin"></div>'+
        '<div class="fld" data-ef="duracion"><label>Duración (min)</label><input type="number" id="ev-duracion"></div>'+
        '<div class="fld" data-ef="aforo"><label>Aforo</label><input type="number" id="ev-aforo"></div>'+
        '<div class="fld" data-ef="cupo"><label>Cupo</label><input type="number" id="ev-cupo"></div>'+
        '<div class="fld" data-ef="horario_visita"><label>Horario de visita</label><input id="ev-horario" placeholder="12:00–19:00"></div>'+
        '<div class="fld" data-ef="materiales"><label>Materiales</label><input id="ev-materiales"></div>'+
        '<div class="fld" data-ef="tipo_produccion"><label>Tipo de producción</label><select id="ev-prod"><option value="">—</option><option>Foto</option><option>Video</option><option>Podcast</option></select></div>'+
        '<div class="fld" data-ef="crew"><label>Tamaño de crew</label><input type="number" id="ev-crew"></div>'+
      '</div>'+
    '</div>'+
    // COBRO
    '<div class="fsec" data-fs="cobro">'+
      '<div class="fgrid">'+
        '<div class="fld" data-ef="precio_hora"><label>Precio por hora</label><input type="number" id="ev-precio-hora"></div>'+
        '<div class="fld" data-ef="precio_persona"><label>Precio por persona</label><input type="number" id="ev-precio-persona"></div>'+
        '<div class="fld" data-ef="cobro_renta"><label>Modelo de renta</label><select id="ev-renta"><option value="renta_hora">Por hora</option><option value="renta_dia">Por día</option></select></div>'+
        '<div class="fld" data-ef="cobro_renta"><label>Precio de renta</label><input type="number" id="ev-precio-renta"></div>'+
        '<div class="fld" data-ef="cobro_taquilla"><label>Modelo</label><select id="ev-taq"><option value="taquilla">Taquilla</option><option value="garantia">Garantía</option><option value="donativo">Donativo</option></select></div>'+
        '<div class="fld" data-ef="cobro_expo"><label>Modelo</label><select id="ev-expo"><option value="renta">Renta</option><option value="comision_obra">Comisión sobre venta de obra</option></select></div>'+
        '<div class="fld" data-ef="cobro_expo"><label>Precio / %</label><input type="number" id="ev-precio-expo"></div>'+
      '</div>'+
      /* EVENTOS GRATUITOS: SOLO QUIEN LO TENGA CONCEDIDO. Javi, 3-oct-2026:
         «Ana en Cumbre es la unica que puede hacer eventos gratuitos». A quien
         no lo tenga ni se le enseña la casilla, en vez de dejarle marcarla y
         que la base se lo rebote al guardar. El candado de verdad esta en la
         base: esto solo evita el viaje en balde. */
      ((FICHA&&FICHA.puede_gratis)
        ? '<label class="chk" style="margin-top:8px"><input type="checkbox" id="ev-gratis"> <b>Es gratis</b> (pasa por autorización de Casa Pepe antes de publicarse)</label>'
        : '')+
    '</div>'+
    // FOTOS
    /* Javi, 3-oct: sin foto no se aprueba. Y hasta hoy no habia por donde
       subirla: el portal entra con token, no con sesion, asi que no puede
       escribir en el almacen. Lo hace la funcion prod-foto, que valida el
       token y sube con la llave de servicio. */
    '<div class="fsec" data-fs="fotos">'+
      '<div class="hint" id="fotoAviso">La primera foto es la que se ve en la tarjeta. '+
        'Sin al menos una, el evento no se puede poner a la venta.</div>'+
      '<div id="fotoLista" style="display:flex;gap:10px;flex-wrap:wrap;margin:12px 0"></div>'+
      '<input type="file" id="fotoFile" accept="image/*" multiple style="display:none">'+
      '<button class="btn ghost sm" id="fotoMas" type="button">＋ Subir foto</button>'+
    '</div>'+
    // EXTRA (agenda / precios)
    '<div class="fsec" data-fs="extra">'+
      '<div data-ef="agenda" style="margin-bottom:14px"><b style="font-family:Oswald">Agenda de ponencias</b>'+
        '<table style="margin-top:6px"><thead><tr><th>Día</th><th>Hora</th><th>Título</th><th>Ponente</th><th></th></tr></thead><tbody id="agBody"></tbody></table>'+
        '<button class="btn ghost sm" id="agMas" style="margin-top:6px" type="button">＋ Ponencia</button></div>'+
      '<div data-ef="precios"><b style="font-family:Oswald">Precios / boletos</b>'+
        '<div style="margin:6px 0"><span class="mini">Rápido:</span> <span class="chip" data-tier="General">General</span> <span class="chip" data-tier="VIP">VIP</span> <span class="chip" data-tier="Patrocinador">Patrocinador</span> <span class="chip" data-tier="Patrocinador Premium">Patrocinador Premium</span></div>'+
        '<table><thead><tr><th>Boleto</th><th>Precio</th><th>Cupo</th><th></th></tr></thead><tbody id="prBody"></tbody></table>'+
        '<button class="btn ghost sm" id="prMas" style="margin-top:6px" type="button">＋ Boleto</button></div>'+
    '</div>'+
    /* PREVISUALIZAR. Javi, 3-oct-2026: antes de mandarlo, ver como va a salir.
       Se pinta con lo que hay escrito en el formulario AHORA, no con lo
       guardado: si no, no sirve para decidir. */
    '<div class="ft"><button class="btn ghost" id="fCancel" type="button">Cancelar</button>'+
      '<button class="btn ghost" id="fPrev" type="button">Previsualizar</button>'+
      '<button class="btn" id="fGuardar" type="button">Enviar a Casa Pepe</button></div>'+
    '</div>';
  }
  function wire(){
    $('evTipo').innerHTML=EVT.map(function(t){return '<option value="'+t.k+'">'+esc(t.n)+'</option>';}).join('');
    $('evTipo').onchange=filtra;
    Array.prototype.forEach.call($('fnav').children,function(b){b.onclick=function(){var f=b.getAttribute('data-f');Array.prototype.forEach.call($('fnav').children,function(x){x.setAttribute('aria-selected',x.getAttribute('data-f')===f?'true':'false');});document.querySelectorAll('.fsec').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-fs')===f);});};});
    $('agMas').onclick=function(){AG.push({fecha:null,hora:null,titulo:'',ponente:''});renAg();};
    $('prMas').onclick=function(){PR.push({nombre:'',precio:null,cupo:null});renPr();};
    Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(c){c.onclick=function(){PR.push({nombre:c.getAttribute('data-tier'),precio:null,cupo:null});renPr();};});
    $('fCancel').onclick=function(){$('fichaHost').innerHTML='';};
    $('fGuardar').onclick=guardar;
    $('fPrev').onclick=previsualiza;
    if($('fotoMas')) $('fotoMas').onclick=function(){ $('fotoFile').click(); };
    if($('fotoFile')) $('fotoFile').onchange=function(){ subeFotos(this.files); this.value=''; };
    if($('ev-espacio')) $('ev-espacio').onchange=infoEspacio;
  }
  /* Las salas que puede pedir, y solo esas. Si su giro le da una sola, se
     elige sola: no hay nada que decidir. */
  function pintaEspacios(){
    var sel=$('ev-espacio'); if(!sel) return;
    var tipo=$('evTipo')?$('evTipo').value:'';
    var puede=ESPACIOS.filter(function(e){
      return !tipo || !e.evento_tipos || !e.evento_tipos.length
          || e.evento_tipos.indexOf(tipo)>=0; });
    /* Si para ese tipo de evento no le cuadra ninguna, se le enseñan todas las
       suyas antes que dejarle la lista vacia y sin explicacion. */
    if(!puede.length) puede=ESPACIOS.slice();
    var antes=sel.value;
    sel.innerHTML='<option value="">— elige la sala —</option>'+
      puede.map(function(e){
        var n=e.nombre+(e.alias?' · '+e.alias:'')+(e.capacidad?'  ('+e.capacidad+' personas)':'');
        return '<option value="'+esc(e.slug)+'">'+esc(n)+'</option>';
      }).join('');
    if(antes) sel.value=antes;
    if(!sel.value && puede.length===1) sel.value=puede[0].slug;
    infoEspacio();
  }
  function infoEspacio(){
    var sel=$('ev-espacio'), box=$('ev-espacio-info'); if(!sel||!box) return;
    var e=ESPACIOS.filter(function(x){return x.slug===sel.value;})[0];
    if(!e){ box.textContent=''; return; }
    var t=[];
    if(e.capacidad) t.push('Aforo '+e.capacidad+(e.capacidad_sentado?' de pie · '+e.capacidad_sentado+' sentado':''));
    if(e.fianza_tipo==='monto'&&e.fianza_monto) t.push('Fianza $'+Number(e.fianza_monto).toLocaleString('es-MX'));
    else if(e.fianza_tipo==='renta_mes') t.push('Fianza: un mes de renta');
    else if(e.fianza_tipo) t.push('Fianza: '+e.fianza_tipo);
    box.textContent=t.join(' · ');
    /* El cupo no puede pasar del aforo de la sala: se avisa en el momento. */
    var c=$('ev-cupo'), af=$('ev-aforo');
    [c,af].forEach(function(i){ if(i&&e.capacidad) i.max=e.capacidad; });
  }

  async function abre(id){

  /* LA HORA VA CON HUSO. 3-oct-2026.
     Esto mandaba '2026-10-04T16:00:00' a secas y Postgres lo leia como UTC:
     cada evento quedaba seis horas adelantado y en pantalla salia a las
     10:00 lo que la productora habia escrito a las 16:00. Mexico no mueve
     el reloj desde 2022, asi que el desfase es fijo: -06:00. */
  var HUSO='-06:00';
  function combinaFH(f,h){if(!f)return null;return h?(f+'T'+h+':00'+HUSO):(f+'T00:00:00'+HUSO);}
  /* ---------- PREVISUALIZAR ----------
     Lo que se enseña es el evento como lo veria el huesped en Sincretico, con
     lo que hay escrito en el formulario en este momento. Y debajo, lo que le
     falta para poder salir: el mismo criterio que usa Casa Pepe al aprobar, no
     uno mas blando. */
  function prevDatos(){
    var tipo=$('evTipo')?$('evTipo').value:'';
    var F=evtDef(tipo).f;
    var esp=$('ev-espacio')?$('ev-espacio').value:'';
    var eob=ESPACIOS.filter(function(x){return x.espacio_slug===esp;})[0];
    var hi=$('ev-hora-ini')?$('ev-hora-ini').value:'';
    var f1=($('ev-fecha')&&$('ev-fecha').value)||($('ev-desde')&&$('ev-desde').value)||'';
    var gratis=!!($('ev-gratis')&&$('ev-gratis').checked);
    /* El precio vive en un campo distinto segun como cobre este tipo de
       evento; se toma el primero que tenga algo. */
    var precio=0;
    ['ev-precio-persona','ev-precio-hora','ev-precio-renta','ev-precio-expo'].forEach(function(k){
      if(!precio && $(k) && Number($(k).value||0)>0) precio=Number($(k).value);
    });
    return {
      nombre:($('ev-nombre')&&$('ev-nombre').value.trim())||'',
      desc:($('ev-desc')&&$('ev-desc').value.trim())||'',
      sala:eob?eob.espacio:'',
      fecha:f1, hora:hi, gratis:gratis, precio:precio,
      cupo:Number(($('ev-cupo')&&$('ev-cupo').value)||0),
      foto:(FOTOS&&FOTOS.length&&(FOTOS[0].url||FOTOS[0]))||'',
      pideHora:F.indexOf('hora')>=0
    };
  }

            '<span style="font:700 20px/1 Oswald,system-ui;color:#C9501A">',(d.gratis?'Entrada libre':(d.precio>0?('$'+d.precio.toLocaleString('es-MX')):'—')),'</span>',
            (d.cupo?'<span style="font-size:12px;color:#6E665C">'+d.cupo+' lugares</span>':''),

  /* NO SE MANDA UN EVENTO SIN DECIR DONDE NI CUANDO. 3-oct-2026.
     «Enviar a Casa Pepe» aceptaba cualquier cosa, incluida nada: por eso habia
     seis eventos esperando aprobacion SIN FECHA DE INICIO. Aprobar uno de esos
     no reserva nada, porque no hay nada que reservar. */
  /* ---------- LAS FOTOS ---------- */
  var FOTOS=[];
  function pintaFotos(){
    var c=$('fotoLista'), av=$('fotoAviso'), bt=$('fotoMas');
    if(!c) return;
    if(!evCur||!evCur.id){
      c.innerHTML='';
      if(av) av.textContent='Guarda el evento primero y aqui mismo le subes las fotos.';
      if(bt) bt.disabled=true;
      return;
    }
    if(bt) bt.disabled=false;
    if(av) av.textContent=FOTOS.length
      ? 'La primera es la que se ve en la tarjeta. Toca una para quitarla.'
      : 'Sin al menos una foto, el evento no se puede poner a la venta.';
    c.innerHTML=FOTOS.map(function(f,i){
      return '<button type="button" class="fth" data-quitar="'+esc(f.url)+'" '+
        'title="Quitar esta foto" style="position:relative;width:104px;height:78px;padding:0;'+
        'border:1px solid var(--line,#E6DFD6);border-radius:9px;overflow:hidden;cursor:pointer;'+
        'background:#F4EFE8">'+
        '<img src="'+esc(f.url)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">'+
        (i===0?'<span style="position:absolute;left:4px;bottom:4px;background:rgba(30,26,22,.8);'+
               'color:#fff;font-size:9.5px;padding:1px 6px;border-radius:99px">PORTADA</span>':'')+
        '</button>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-quitar]'),function(b){
      b.onclick=function(){ quitaFoto(b.getAttribute('data-quitar')); };
    });
  }
  async function fotoRpc(cuerpo){
    var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},hdrs()),
      body:JSON.stringify(Object.assign({token:TOK,evento_id:evCur&&evCur.id},cuerpo))});
    var j=null; try{ j=await r.json(); }catch(_){}
    if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('la foto no subio ('+r.status+')'));
    return j;
  }
  async function subeFotos(files){
    if(!files||!files.length) return;
    if(!evCur||!evCur.id){ toast('Guarda el evento primero.',true); return; }
    var lista=Array.prototype.slice.call(files).filter(function(f){
      return (f.type||'').indexOf('image')===0; });
    if(!lista.length){ toast('Eso no es una imagen.',true); return; }
    for(var i=0;i<lista.length;i++){
      try{
        toast('Subiendo '+(i+1)+' de '+lista.length+'…');
        var dataUri=await new Promise(function(res,rej){
          var fr=new FileReader();
          fr.onload=function(){res(fr.result);}; fr.onerror=rej;
          fr.readAsDataURL(lista[i]);
        });
        var j=await fotoRpc({imagen:dataUri});
        FOTOS=j.fotos||[]; pintaFotos();
      }catch(e){ toast(e.message||'No se pudo subir',true); break; }
    }
    toast('Listo');
  }
  async function quitaFoto(url){
    try{ var j=await fotoRpc({quitar:url}); FOTOS=j.fotos||[]; pintaFotos(); toast('Quitada'); }
    catch(e){ toast(e.message||'No se pudo quitar',true); }
  }

  function faltaPara(F){
    var falta=[];
    if(!$('ev-nombre').value.trim())            falta.push('como se llama');
    if(!$('ev-espacio').value)                  falta.push('en que sala es');
    if(F.indexOf('fechas')>=0 && !$('ev-desde').value) falta.push('desde que dia');
    if(F.indexOf('fecha')>=0  && !$('ev-fecha').value) falta.push('que dia es');
    if(F.indexOf('hora')>=0   && !$('ev-hora-ini').value) falta.push('a que hora empieza');
    return falta;
  }

  async function guardar(){
    var tipo=$('evTipo').value,F=evtDef(tipo).f,g=!!($('ev-gratis')&&$('ev-gratis').checked);
    var falta=faltaPara(F);
    if(falta.length){
      toast('Antes de mandarlo falta '+falta.join(', y ')+'.', true);
      /* y se le lleva a la pestaña donde estan esos campos */
      var ir=(falta.length===1&&falta[0]==='como se llama')?'esencial':'cuando';
      var b=document.querySelector('#fnav button[data-f="'+ir+'"]'); if(b)b.click();
      return;
    }
    var esl=$('ev-espacio').value;
    var eob=ESPACIOS.filter(function(x){return x.slug===esl;})[0];
    var ev={tipo:tipo,nombre:$('ev-nombre').value.trim(),
            espacio:(eob?eob.nombre:esl),
            espacio_id:(eob?eob.espacio_id:null),
            descripcion:$('ev-desc').value.trim(),es_gratis:g};
    if(F.indexOf('fechas')>=0){ev.fecha_inicio=combinaFH($('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);ev.fecha_fin=combinaFH($('ev-hasta').value||$('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-fin').value:null);}
    else if(F.indexOf('fecha')>=0){ev.fecha_inicio=combinaFH($('ev-fecha').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);if(F.indexOf('hora')>=0&&$('ev-hora-fin').value)ev.fecha_fin=combinaFH($('ev-fecha').value,$('ev-hora-fin').value);}
    /* SI NO DIJO CUANDO ACABA, SE SACA DE LA DURACION.
       Sin hora de fin no hay rato que apartar, y la sala no se puede bloquear.
       Antes que pedirle el dato dos veces, se calcula: empieza + lo que dura.
       Y si tampoco dijo cuanto dura, dos horas, que es lo que dura casi todo. */
    if(ev.fecha_inicio && !ev.fecha_fin){
      var mins=parseInt($('ev-duracion')&&$('ev-duracion').value,10);
      if(!mins||mins<=0) mins=120;
      /* Se suma sobre el reloj de la Ciudad de Mexico, no sobre el del aparato:
         una productora conectada desde Lima no tiene por que corrernos la hora
         del evento. Por eso se lee la parte '...THH:MM' tal cual y se vuelve a
         escribir con el mismo huso. */
      var d=new Date(String(ev.fecha_inicio).slice(0,16)+':00Z');
      if(!isNaN(d)){ d=new Date(d.getTime()+mins*60000);
        var dd=function(n){return (n<10?'0':'')+n;};
        ev.fecha_fin=d.getUTCFullYear()+'-'+dd(d.getUTCMonth()+1)+'-'+dd(d.getUTCDate())+
                     'T'+dd(d.getUTCHours())+':'+dd(d.getUTCMinutes())+':00'+HUSO; }
    }
    if(F.indexOf('duracion')>=0)ev.duracion_min=$('ev-duracion').value;
    if(F.indexOf('aforo')>=0)ev.aforo=$('ev-aforo').value;
    if(F.indexOf('cupo')>=0)ev.cupo=$('ev-cupo').value;
    if(F.indexOf('horario_visita')>=0)ev.horario_visita=$('ev-horario').value.trim();
    if(F.indexOf('materiales')>=0)ev.materiales=$('ev-materiales').value.trim();
    if(F.indexOf('tipo_produccion')>=0)ev.tipo_produccion=$('ev-prod').value;
    if(F.indexOf('crew')>=0)ev.crew_tam=$('ev-crew').value;
    if(!g){
      if(F.indexOf('precio_hora')>=0)ev.precio_por_hora=$('ev-precio-hora').value;
      if(F.indexOf('precio_persona')>=0)ev.precio=$('ev-precio-persona').value;
      if(F.indexOf('cobro_renta')>=0){ev.modelo_cobro=$('ev-renta').value;ev.precio=$('ev-precio-renta').value;}
      if(F.indexOf('cobro_taquilla')>=0)ev.modelo_cobro=$('ev-taq').value;
      if(F.indexOf('cobro_expo')>=0){ev.modelo_cobro=$('ev-expo').value;ev.precio=$('ev-precio-expo').value;}
    } else ev.modelo_cobro='gratis';
    if(!ev.nombre){toast('Falta el nombre del evento',true);return;}
    $('fGuardar').disabled=true;
    try{
      var ag=(F.indexOf('agenda')>=0)?AG:[], pr=(F.indexOf('precios')>=0)?PR:[];
      var r=await rpc('prod_portal_evento',{p_token:TOK,p_id:evCur?evCur.id:null,p_evento:ev,p_agenda:ag,p_precios:pr});
      if(!r||!r.ok)throw new Error((r&&r.error)||'error');
      toast('Enviado a Casa Pepe');$('fichaHost').innerHTML='';
      var eraNuevo=!(evCur&&evCur.id);
      EV=await rpc('prod_portal_eventos',{p_token:TOK});renTabla();
      /* Un evento nuevo necesita existir antes de poder colgarle fotos. En vez
         de mandarlo de vuelta a la tabla y que lo busque, se le reabre ya
         guardado y directo en Fotos, que es lo unico que le falta. */
      if(eraNuevo && r && r.id){
        try{
          await abre(r.id);
          var b=document.querySelector('#fnav button[data-f="fotos"]'); if(b)b.click();
          toast('Guardado. Ahora subele una foto.');
          return;
        }catch(_){}
      }
    }catch(e){ toast('No se pudo enviar',true); }
    $('fGuardar').disabled=false;
  }

  /* ---------- MI CUENTA ---------- */
  /* ---------- MI PÁGINA ----------
     Javi, 3-oct-2026: la ficha de la productora pasa a ser una landing, y la
     productora la configura desde aquí. Lo que NO esta aqui a proposito:
     el interruptor de «publica». Quien sale al escaparate de Sincretico lo
     decide el Ateneo, no ella. */
  var EQ=[];
  function pintaPagina(){
    var f=FICHA||{};
    var liga='https://casapepe.mx/sincretico/productora.html?p='+encodeURIComponent(f.slug||'');
    $('pane-pagina').innerHTML=
      '<div class="card"><h3>Tu página en Sincrético</h3>'+
        '<div class="hint">Es la que compartes para que te reserven. Lo que escribas aquí es lo que lee quien la abre.</div>'+
        (f.publica
          ? '<div class="aviso" style="margin-top:10px">Tu página está <b>publicada</b>. <a href="'+esc(liga)+'" target="_blank" rel="noopener" style="font-weight:700">Verla →</a></div>'
          : '<div class="aviso" style="margin-top:10px">Todavía <b>no está publicada</b>: llénala y el Ateneo la abre. Mientras tanto, la liga no funciona.</div>')+
        '<div class="fgrid" style="margin-top:12px">'+
          '<div class="fld ancho"><label>Una línea que te presente</label>'+
            '<input id="g-bio" maxlength="160" value="'+esc(f.bio||'')+'" placeholder="Programamos música en vivo en el Centro Histórico">'+
            '<div class="ay">Sale arriba del todo. Máximo 160 caracteres.</div></div>'+
          '<div class="fld ancho"><label>Vuestra historia</label>'+
            '<textarea id="g-historia" rows="5" placeholder="De dónde venís, qué hacéis y por qué vale la pena ir.">'+esc(f.historia||'')+'</textarea></div>'+
          '<div class="fld"><label>Logo (liga a la imagen)</label>'+
            '<input id="g-logo_url" value="'+esc(f.logo_url||'')+'" placeholder="https://…">'+
            '<div class="ay">O <a href="#" class="subeImg" data-destino="logo" style="color:var(--accent,#1f9d55);font-weight:600">sube un archivo</a>.'+
            '<input type="file" accept="image/*" id="g-logo_file" style="display:none"></div></div>'+
          '<div class="fld"><label>Portada (liga a la imagen)</label>'+
            '<input id="g-portada_url" value="'+esc(f.portada_url||'')+'" placeholder="https://…">'+
            '<div class="ay">Si la dejas vacía usamos la foto de tu último evento. O <a href="#" class="subeImg" data-destino="portada" style="color:var(--accent,#1f9d55);font-weight:600">sube un archivo</a>.'+
            '<input type="file" accept="image/*" id="g-portada_file" style="display:none"></div></div>'+
        '</div>'+
      '</div>'+
      '<div class="card"><h3>Que te sigan y te escriban</h3>'+
        '<div class="hint">Lo que pongas aquí sale como botón en tu página. Lo que dejes vacío, no se enseña.</div>'+
        '<div class="fgrid">'+
          '<div class="fld"><label>WhatsApp público</label><input id="g-whatsapp_publico" value="'+esc(f.whatsapp_publico||'')+'" placeholder="52 55 1234 5678"></div>'+
          '<div class="fld"><label>Correo público</label><input id="g-email_publico" type="email" value="'+esc(f.email_publico||'')+'" placeholder="hola@tuproductora.mx"></div>'+
          '<div class="fld"><label>Instagram</label><input id="g-instagram" value="'+esc(f.instagram||'')+'" placeholder="@tuproductora"></div>'+
          '<div class="fld"><label>Facebook</label><input id="g-facebook" value="'+esc(f.facebook||'')+'"></div>'+
          '<div class="fld"><label>TikTok</label><input id="g-tiktok" value="'+esc(f.tiktok||'')+'"></div>'+
          '<div class="fld"><label>YouTube</label><input id="g-youtube" value="'+esc(f.youtube||'')+'"></div>'+
          '<div class="fld"><label>Spotify</label><input id="g-spotify" value="'+esc(f.spotify||'')+'"></div>'+
          '<div class="fld"><label>Web</label><input id="g-web" value="'+esc(f.web||'')+'"></div>'+
        '</div>'+
        '<div class="ft"><button class="btn" id="gGuardar">Guardar mi página</button></div>'+
      '</div>'+
      '<div class="card"><h3>Protagonistas y equipo</h3>'+
        '<div class="hint">En tu página salen en dos bloques: los <b>protagonistas</b> —a quien va a ver la gente— y <b>quién lo monta</b>. El rol de cada quien decide en cuál cae. <b>Nadie sale por defecto</b>: marca a cada persona, y su teléfono o su correo sólo si esa persona está de acuerdo.</div>'+
        '<div id="eqLista" style="margin-top:10px"></div>'+
      '</div>';
    $('gGuardar').onclick=guardaPagina;
    /* Subir el logo o la portada como archivo (además de pegar la liga). El portal
       entra con token, así que la subida la hace el servidor (prod-foto). Javi, 3-oct. */
    Array.prototype.forEach.call(document.querySelectorAll('.subeImg'),function(a){
      a.onclick=function(ev){ev.preventDefault();var fi=$('g-'+a.getAttribute('data-destino')+'_file');if(fi)fi.click();};});
    ['logo','portada'].forEach(function(d){var fi=$('g-'+d+'_file');if(fi)fi.onchange=function(){subeImagenFicha(d,this.files&&this.files[0]);this.value='';};});
    cargaEquipo();
  }
  async function subeImagenFicha(destino,file){
    if(!file) return;
    if((file.type||'').indexOf('image')!==0){ toast('Eso no es una imagen.',true); return; }
    if(file.size>25*1024*1024){ toast('La imagen pesa más de 25 MB.',true); return; }
    try{
      toast('Subiendo…');
      var dataUri=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=rej;fr.readAsDataURL(file);});
      var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify({token:TOK,destino:destino,imagen:dataUri})});
      var j=null; try{ j=await r.json(); }catch(_){}
      if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('no se pudo subir ('+r.status+')'));
      var el=$('g-'+destino+'_url'); if(el) el.value=j.url;
      toast('Imagen subida ✓');
    }catch(e){ toast(e.message||'No se pudo subir',true); }
  }
  async function guardaPagina(){
    var campos=['bio','historia','logo_url','portada_url','whatsapp_publico','email_publico',
                'instagram','facebook','tiktok','youtube','spotify','web'];
    var p={};campos.forEach(function(c){var el=$('g-'+c);if(el)p[c]=el.value.trim();});
    $('gGuardar').disabled=true;
    try{
      var r=await rpc('prod_portal_update',{p_token:TOK,p:p});
      if(!r||!r.ok)throw new Error();
      FICHA=await rpc('prod_portal_ficha',{p_token:TOK});
      toast('Guardado');
    }catch(e){ toast('No se pudo guardar',true); }
    $('gGuardar').disabled=false;
  }
  async function cargaEquipo(){
    try{ EQ=await rpc('prod_portal_gente',{p_token:TOK})||[]; }catch(_){ EQ=[]; }

    if(!EQ.length){
      c.innerHTML='<div class="mini">Todavía no hay nadie más en tu equipo. Pídele a Casa Pepe que los dé de alta y aquí decides quién sale.</div>';
      return;
    }
    c.innerHTML=EQ.map(function(u,i){

        '<div class="mini" style="margin-bottom:8px">'+
          '<b>'+esc(u.rol_nombre||u.rol||'')+'</b> · sale en '+
          (u.es_talento?'<b>Los protagonistas</b>':'<b>Quién lo monta</b>')+
        '</div>'+
        '<div class="fgrid">'+
          '<div class="fld"><label>Nombre</label><input data-q="nombre" data-i="'+i+'" value="'+esc(u.nombre||'')+'"></div>'+
          '<div class="fld"><label>Instagram</label><input data-q="instagram" data-i="'+i+'" value="'+esc(u.instagram||'')+'"></div>'+
          '<div class="fld"><label>WhatsApp</label><input data-q="whatsapp" data-i="'+i+'" value="'+esc(u.whatsapp||'')+'"></div>'+
          '<div class="fld"><label>Foto (liga)</label><input data-q="foto_url" data-i="'+i+'" value="'+esc(u.foto_url||'')+'"></div>'+
          '<div class="fld ancho"><label>En una línea, qué hace</label><input data-q="descripcion" data-i="'+i+'" maxlength="140" value="'+esc(u.descripcion||'')+'"></div>'+
        '</div>'+
        '<div style="display:flex;flex-wrap:wrap;gap:14px;margin-top:8px">'+
          '<label class="chk"><input type="checkbox" data-q="publico" data-i="'+i+'"'+(u.publico?' checked':'')+'> Sale en mi página</label>'+
          '<label class="chk"><input type="checkbox" data-q="muestra_wa" data-i="'+i+'"'+(u.muestra_wa?' checked':'')+'> Enseñar su WhatsApp</label>'+
          '<label class="chk"><input type="checkbox" data-q="muestra_mail" data-i="'+i+'"'+(u.muestra_mail?' checked':'')+'> Enseñar su correo</label>'+
        '</div>'+
        '<div class="ft" style="margin-top:8px"><button class="btn ghost sm" data-eqg="'+i+'">Guardar</button></div>'+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-eqg]'),function(b){
      b.onclick=function(){ guardaPersona(Number(b.getAttribute('data-eqg')), b); };
    });
  }
  async function guardaPersona(i,btn){
    var u=EQ[i]; if(!u)return;
    var p={};
    Array.prototype.forEach.call($('eqLista').querySelectorAll('[data-i="'+i+'"]'),function(el){
      var q=el.getAttribute('data-q');
      p[q] = (el.type==='checkbox') ? el.checked : el.value.trim();
    });
    btn.disabled=true;
    try{
      var r=await rpc('prod_portal_equipo_set',{p_token:TOK,p_id:u.id,p:p});
      if(!r||!r.ok)throw new Error((r&&r.error)||'');
      toast('Guardado'); await cargaEquipo();
    }catch(e){ toast('No se pudo guardar',true); }
    btn.disabled=false;
  }

  /* ---------- ROOM SERVICE ----------
     La cocina ve los pedidos que entran y los mueve de estado, y edita su
     carta. Los pedidos NO salen por PostgREST: llevan el nombre y el contacto
     de quien pide, asi que van por funciones que comprueban el token. */
  var RSP=[], RSI=[], RSTAB='pedidos';
  var RSEST=[['pedido','Nuevo'],['aceptado','En la cocina'],['en_camino','Subiendo'],
              ['entregado','Entregado'],['cancelado','Cancelado']];
  function rsNom(e){ var x=RSEST.filter(function(y){return y[0]===e;})[0]; return x?x[1]:e; }

  function pintaRS(){
    var f=FICHA||{};
    $('pane-rs').innerHTML=
      '<div class="card"><h3>Room service</h3>'+
        '<div class="hint">Quien está en una sala pide de tu carta y ustedes suben a dejárselo. '+
          'Horario: <b>'+esc(f.rs_horario||'—')+'</b> · aviso de <b>'+esc(String(f.rs_aviso_min||20))+' min</b>.</div>'+
        '<div class="fnav" id="rsnav" style="margin-top:10px">'+
          '<button data-r="pedidos" aria-selected="true">Pedidos</button>'+
          '<button data-r="carta">Mi carta</button>'+
        '</div>'+
        '<div id="rsPedidos"></div><div id="rsCarta" style="display:none"></div>'+
      '</div>';
    Array.prototype.forEach.call($('rsnav').children,function(b){
      b.onclick=function(){
        RSTAB=b.getAttribute('data-r');
        Array.prototype.forEach.call($('rsnav').children,function(x){
          x.setAttribute('aria-selected', x===b ? 'true':'false');});
        $('rsPedidos').style.display = RSTAB==='pedidos'?'':'none';
        $('rsCarta').style.display   = RSTAB==='carta'?'':'none';
        if(RSTAB==='carta') cargaCarta();
      };
    });
    cargaPedidos();
  }

  async function cargaPedidos(){
    try{ RSP=await rpc('rs_pedidos_portal',{p_token:TOK})||[]; }catch(_){ RSP=[]; }
    var vivos=RSP.filter(function(d){return ['entregado','cancelado'].indexOf(d.estado)<0;});
    var hechos=RSP.filter(function(d){return ['entregado','cancelado'].indexOf(d.estado)>=0;}).slice(0,20);
    function fila(d){
      var l=(d.items||[]).map(function(i){return i.cant+'× '+esc(i.nombre);}).join(', ');
      var sig = d.estado==='pedido' ? 'aceptado'
              : d.estado==='aceptado' ? 'en_camino'
              : d.estado==='en_camino' ? 'entregado' : null;
      var cuando='';
      try{ cuando=new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',
            hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(d.created_at)); }catch(_){}
      return '<div class="card" style="margin:0 0 10px;padding:12px">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+
          '<b style="font-family:Oswald;text-transform:uppercase">'+esc(d.espacio||'—')+'</b>'+
          '<span class="mini">'+esc(cuando)+' · <span class="tag">'+esc(rsNom(d.estado))+'</span></span>'+
        '</div>'+
        '<div style="margin-top:6px">'+l+'</div>'+
        '<div class="mini" style="margin-top:4px">'+esc(d.quien||'')+
          (d.contacto?' · '+esc(d.contacto):'')+' · <b>$'+Number(d.total||0).toLocaleString('es-MX')+'</b></div>'+
        (d.notas?'<div class="mini" style="margin-top:4px">“'+esc(d.notas)+'”</div>':'')+
        (sig?'<div class="ft" style="margin-top:8px">'+
          '<button class="btn ghost sm" data-rsx="'+d.id+'">Cancelar</button>'+
          '<button class="btn sm" data-rs="'+d.id+'" data-e="'+sig+'">'+esc(rsNom(sig))+'</button></div>':'')+
      '</div>';
    }
    $('rsPedidos').innerHTML=
      '<div style="margin-top:12px">'+
        (vivos.length?vivos.map(fila).join('')
          :'<div class="mini">Ningún pedido ahora mismo.</div>')+
      '</div>'+
      (hechos.length?'<div style="margin-top:16px"><div class="mini" style="margin-bottom:6px"><b>Ya atendidos</b></div>'+
        hechos.map(fila).join('')+'</div>':'');
    Array.prototype.forEach.call($('rsPedidos').querySelectorAll('[data-rs]'),function(b){
      b.onclick=function(){ mueve(b.getAttribute('data-rs'), b.getAttribute('data-e'), b); };
    });
    Array.prototype.forEach.call($('rsPedidos').querySelectorAll('[data-rsx]'),function(b){
      b.onclick=function(){ mueve(b.getAttribute('data-rsx'), 'cancelado', b); };
    });
  }
  async function mueve(id,estado,btn){
    btn.disabled=true;
    try{
      var r=await rpc('rs_pedido_estado',{p_token:TOK,p_id:id,p_estado:estado});
      if(!r||!r.ok)throw new Error();
      toast(rsNom(estado)); await cargaPedidos();
    }catch(e){ toast('No se pudo',true); btn.disabled=false; }
  }

  async function cargaCarta(){
    try{ RSI=await rpc('rs_items_portal',{p_token:TOK})||[]; }catch(_){ RSI=[]; }
    $('rsCarta').innerHTML=
      '<div style="margin-top:12px">'+
        (RSI.length?'':'<div class="mini" style="margin-bottom:10px">Tu carta está vacía. Añade lo primero y ya se puede pedir.</div>')+
        RSI.map(function(i,k){
          return '<div class="card" style="margin:0 0 10px;padding:12px">'+
            '<div class="fgrid">'+
              '<div class="fld"><label>Sección</label><input data-c="seccion" data-k="'+k+'" value="'+esc(i.seccion||'')+'"></div>'+
              '<div class="fld"><label>Nombre</label><input data-c="nombre" data-k="'+k+'" value="'+esc(i.nombre||'')+'"></div>'+
              '<div class="fld"><label>Precio</label><input type="number" data-c="precio" data-k="'+k+'" value="'+esc(String(i.precio||0))+'"></div>'+
              '<div class="fld"><label>Foto (liga)</label><input data-c="foto_url" data-k="'+k+'" value="'+esc(i.foto_url||'')+'"></div>'+
              '<div class="fld ancho"><label>Descripción</label><input data-c="descripcion" data-k="'+k+'" value="'+esc(i.descripcion||'')+'"></div>'+
            '</div>'+
            '<div style="display:flex;gap:14px;margin-top:8px">'+
              '<label class="chk"><input type="checkbox" data-c="activo" data-k="'+k+'"'+(i.activo?' checked':'')+'> En la carta</label>'+
              '<label class="chk"><input type="checkbox" data-c="agotado" data-k="'+k+'"'+(i.agotado?' checked':'')+'> Se acabó hoy</label>'+
            '</div>'+
            '<div class="ft" style="margin-top:8px"><button class="btn ghost sm" data-gi="'+k+'">Guardar</button></div>'+
          '</div>';
        }).join('')+
        '<button class="btn" id="rsMas" type="button">＋ Añadir a la carta</button>'+
      '</div>';
    Array.prototype.forEach.call($('rsCarta').querySelectorAll('[data-gi]'),function(b){
      b.onclick=function(){ guardaItem(Number(b.getAttribute('data-gi')), b); };
    });
    $('rsMas').onclick=async function(){
      this.disabled=true;
      try{ await rpc('rs_item_set',{p_token:TOK,p_id:null,p:{nombre:'Nuevo platillo'}}); await cargaCarta(); }
      catch(e){ toast('No se pudo',true); this.disabled=false; }
    };
  }
  async function guardaItem(k,btn){
    var i=RSI[k]; if(!i)return;
    var p={};
    Array.prototype.forEach.call($('rsCarta').querySelectorAll('[data-k="'+k+'"]'),function(el){
      var c=el.getAttribute('data-c');
      p[c] = (el.type==='checkbox') ? el.checked : (el.type==='number' ? Number(el.value||0) : el.value.trim());
    });
    btn.disabled=true;
    try{ var r=await rpc('rs_item_set',{p_token:TOK,p_id:i.id,p:p});
      if(!r||!r.ok)throw new Error(); toast('Guardado'); await cargaCarta(); }
    catch(e){ toast('No se pudo',true); btn.disabled=false; }
  }

  function pintaCuenta(){
    var f=FICHA;
    $('pane-cuenta').innerHTML=
      '<div class="card"><h3>Tu empresa</h3><div class="hint">Estos datos salen de tu constancia fiscal. Se piden una sola vez. El giro y el espacio los define Casa Pepe.</div>'+
        '<div class="fgrid">'+
          '<div class="fld"><label>Nombre comercial</label><input id="c-nombre_comercial" value="'+esc(f.nombre_comercial||'')+'"><div class="ay">Así te van a ver</div></div>'+
          '<div class="fld"><label>Giro</label><input value="'+esc((f.tipo_nombre||'')+(f.espacio?' · '+f.espacio:''))+'" readonly style="background:var(--crema)"></div>'+
          '<div class="fld"><label>Tipo de persona</label><select id="c-tipo_persona"><option value="">—</option><option value="moral">Persona moral</option><option value="fisica">Persona física</option></select></div>'+
          '<div class="fld"><label>Razón social</label><input id="c-razon_social" value="'+esc(f.razon_social||'')+'"></div>'+
          '<div class="fld"><label>RFC</label><input id="c-rfc" value="'+esc(f.rfc||'')+'"></div>'+
          '<div class="fld"><label>Ciudad</label><input id="c-ciudad" value="'+esc(f.ciudad||'')+'"></div>'+
        '</div></div>'+
      '<div class="card"><h3>Contactos</h3><div class="hint">Puede ser el mismo correo en varios campos.</div>'+
        '<div class="fgrid">'+
          '<div class="fld"><label>Correo de avisos</label><input id="c-email_notificaciones" type="email" value="'+esc(f.email_notificaciones||'')+'"></div>'+
          '<div class="fld"><label>Correo de reportes</label><input id="c-email_reportes" type="email" value="'+esc(f.email_reportes||'')+'"></div>'+
          '<div class="fld"><label>Correo de facturación</label><input id="c-email_facturacion" type="email" value="'+esc(f.email_facturacion||'')+'"></div>'+
          '<div class="fld"><label>WhatsApp</label><input id="c-whatsapp" value="'+esc(f.whatsapp||'')+'"></div>'+
          '<div class="fld"><label>Instagram</label><input id="c-instagram" value="'+esc(f.instagram||'')+'"></div>'+
          '<div class="fld"><label>Web</label><input id="c-web" value="'+esc(f.web||'')+'"></div>'+
        '</div>'+
        '<div class="aviso" style="margin-top:12px">La forma de cobro (Stripe), la comisión y el contrato los ve y define Casa Pepe contigo; no van aquí.</div>'+
        '<div class="ft"><button class="btn" id="cGuardar">Guardar mi cuenta</button></div>'+
      '</div>';
    $('cGuardar').onclick=guardaCuenta;
  }
  async function guardaCuenta(){
    var campos=['nombre_comercial','tipo_persona','razon_social','rfc','ciudad','email_notificaciones','email_reportes','email_facturacion','whatsapp','instagram','web'];
    var p={};campos.forEach(function(c){var el=$('c-'+c);if(el)p[c]=el.value.trim();});
    $('cGuardar').disabled=true;
    try{var r=await rpc('prod_portal_update',{p_token:TOK,p:p});if(!r||!r.ok)throw new Error();FICHA=await rpc('prod_portal_ficha',{p_token:TOK});toast('Guardado');}
    catch(e){toast('No se pudo guardar',true);}
    $('cGuardar').disabled=false;
  }

  (async function init(){
    if(!TOK){FICHA=null;shell();return;}
    try{ FICHA=await rpc('prod_portal_ficha',{p_token:TOK}); EV=await rpc('prod_portal_eventos',{p_token:TOK}); }catch(e){ FICHA=null; }
    try{ ESPACIOS=await rpc('prod_portal_espacios',{p_token:TOK})||[]; }catch(e){ ESPACIOS=[]; }
    shell();
  })();
})();
</script>
