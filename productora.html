.doc .est.mal{color:#9E3B2E;font-weight:700}

/* LOS TRES PASOS. Quien entra por primera vez ve el portal vacio y no sabe por

   tira se lo dice y se encoge sola cuando ya esta todo. Javi, 5-oct-2026. */
.guia{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  box-shadow:var(--sombra);padding:16px 18px;margin:0 0 14px}
.guia .gtit{font-weight:800;font-size:15px;margin-bottom:2px}

.guia .paso.ahora{border-color:var(--oro);background:#fff;box-shadow:0 0 0 3px rgba(201,162,39,.14)}
.guia .paso.listo{background:var(--ok-bg);border-color:#cfe6d9}

.guia .pn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;

.guia .paso.ahora .pn{background:var(--oro);color:#241d05}
.guia .paso.listo .pn{background:var(--ok);color:#fff}

.guia.todo .gtit{margin:0}

<script>
(function(){

  var TOK=''; try{ TOK=new URLSearchParams(location.search).get('t')||''; }catch(e){}
  var FICHA=null, EV=[], AG=[], PR=[], evCur=null, ESPACIOS=[];

    {k:'reserva_horas',n:'Reserva por horas',f:['fecha','hora','precio_hora','aforo']},

  /* LAS TRES FAMILIAS. Javi, 4-oct-2026: «el espacio puede generar diferentes

     Se elige PRIMERO la familia -que es lo que de verdad cambia como se cobra
     y si se publica- y el tipo se filtra solo. Antes habia un desplegable de
     siete y la productora no sabia en cual estaba cayendo. */
  var FAM=[
    {k:'evento', n:'Evento con público',
     /* EL PORCENTAJE NO VA EN LA TARJETA. Javi, 10-oct-2026: «quita el
        comentario del 35%, solo pon lo de la intermediación». El numero no es

     d:'Hay función y se venden boletos. Tú pones el precio; el Ateneo cobra su intermediación sobre lo vendido.',
     tipos:['funcion','congreso','taller','expo','otro']},
    {k:'espacio', n:'Espacio creativo',
     d:'No hay función: alguien viene a usar la sala. Grabar, ensayar, una sesión. La misma intermediación sobre lo que cobres.',
     tipos:['reserva_horas','grabacion']},
    {k:'privado', n:'Uso privado',
     d:'No se vende a nadie: un rodaje, una sesión cerrada. No sale publicado. Declaras lo que pagas por hora o por día.',
     tipos:['grabacion','reserva_horas','otro']}
  ];
  var CLASE='evento';
  function famDef(k){return FAM.filter(function(x){return x.k===k;})[0]||FAM[0];}
  function evtDef(k){return EVT.filter(function(x){return x.k===k;})[0]||EVT[0];}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}
  function fmtCuando(e){if(e.fecha_inicio&&e.fecha_fin&&String(e.fecha_inicio).slice(0,10)!==String(e.fecha_fin).slice(0,10))return String(e.fecha_inicio).slice(0,10)+'→'+String(e.fecha_fin).slice(0,10);return e.fecha_inicio?String(e.fecha_inicio).slice(0,16).replace('T',' '):'—';}
  function hdrs(){return {'apikey':KEY,'Authorization':'Bearer '+KEY};}
  async function get(path){var r=await fetch(SB+'/rest/v1/'+path,{headers:hdrs()});if(!r.ok)throw new Error(path+' '+r.status);return r.json();}
  async function rpc(fn,body){var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body||{})});if(!r.ok)throw new Error(fn+' '+r.status);return r.json();}
  function estadoTag(e){var m={borrador:'borrador',propuesto:'en revisión',confirmado:'confirmado',publicado:'publicado',realizado:'realizado',cancelado:'cancelado'};var c=(e.estado==='publicado'||e.estado==='confirmado')?'ok':(e.estado==='cancelado'?'bad':'warn');return '<span class="tag '+c+'">'+esc(m[e.estado]||e.estado)+'</span>';}

  function shell(){
    if(!FICHA){$('root').innerHTML='<div class="wrap"><div class="card"><h3>Liga no válida</h3><div class="hint">Pídele a Casa Pepe tu liga personal para entrar.</div></div></div>';return;}

    /* EL PORTAL ES PARA QUIEN YA FIRMÓ. Javi, 10-oct.
       Aquí no se redirige a secas: este portal se abre con una liga, no con una

    var verIgual=/[?&]ver=1/.test(location.search);

          '<div class="card"><h3>Tu convenio</h3><div id="contratoBox">Cargando…</div></div>'+

          /* ROOM SERVICE. Javi, 3-oct-2026: solo Cumbre. No se decide por el

          ((FICHA&&FICHA.room_service)?'<button data-p="rs" aria-selected="false">🍳 Room service</button>':'')+

    Array.prototype.forEach.call($('tabs').children,function(b){b.onclick=function(){ve(b.getAttribute('data-p'));};});

  function ve(p){Array.prototype.forEach.call($('tabs').children,function(b){b.setAttribute('aria-selected',b.getAttribute('data-p')===p?'true':'false');});document.querySelectorAll('.pane').forEach(function(x){x.classList.toggle('on',x.id==='pane-'+p);});

  /* Qué datos fiscales aplican, según quién es. Una persona física no tiene
     razón social: tiene nombre. Y sin actividad empresarial no tiene RFC:
     tiene CURP. Antes se exigía RFC a secas, así que una productora con solo
     CURP no completaba nunca el paso de empresa. Se esconde, no se borra.
     Javi, 9-oct-2026. */
  function pintaFiscalProd(){
    var sel=document.getElementById('c-tipo_persona'); if(!sel)return;
    if(!sel.__fiscal){
      sel.__fiscal=true;
      var antes=sel.onchange;
      sel.onchange=function(e){ if(antes)try{antes.call(this,e);}catch(_){} pintaFiscalProd(); };
    }
    var t=sel.value||'';
    var fisica=(t==='fisica'||t==='fisica_sin'), conRfc=(t!=='fisica_sin'), conCurp=(t!=='moral');
    var lab=document.getElementById('labRazon'), ay=document.getElementById('ayRazon');
    if(lab) lab.textContent = fisica ? 'Nombre completo' : 'Razón social';
    if(ay)  ay.textContent  = fisica ? 'Tu nombre completo' : 'Como viene en tu constancia';
    var f;
    f=document.getElementById('fldRfc');  if(f) f.style.display = conRfc  ? '' : 'none';
    f=document.getElementById('fldCurp'); if(f) f.style.display = conCurp ? '' : 'none';
  }
  function identOkProd(f){
    f=f||{};
    return (f.tipo_persona==='fisica_sin')
      ? !!String(f.curp||'').trim()
      : !!(String(f.rfc||'').trim() || String(f.curp||'').trim());
  }

  /* ---------- LOS TRES PASOS ---------- */
  function guiaEstado(){
    var f=FICHA||{};
    /* La identidad depende de la figura: con CURP basta si es persona física
       sin actividad empresarial. Antes se pedía RFC a secas y esa figura no
       completaba el paso jamás. */
    var empresa = !!(String(f.razon_social||'').trim() && identOkProd(f)
                  && String(f.ciudad||'').trim()
                  && String(f.email_notificaciones||f.email||'').trim());
    var eventos = (EV||[]).length>0;
    var pagina  = !!f.publica;
    return {empresa:empresa, eventos:eventos, pagina:pagina,
            lista:(String(f.bio||'').trim() && String(f.historia||'').trim())};
  }
  function guia(){
    var c=$('guia'); if(!c) return;
    var f=FICHA||{}, e=guiaEstado();
    var liga='https://casapepe.mx/sincretico/productora.html?p='+encodeURIComponent(f.slug||'');

    if(e.eventos && e.pagina){
      c.className='guia todo';
      c.innerHTML='<div class="pn" style="background:var(--ok);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800">&#10003;</div>'+
        '<div class="gtit">Todo en orden</div>'+
        '<div class="gsub" style="margin:0;flex:1">Tu página está publicada y tus eventos en marcha.</div>'+
        '<a class="btn ghost sm" href="'+esc(liga)+'" target="_blank" rel="noopener">Ver mi página</a>';
      return;
    }

    function paso(num,listo,ahora,tit,desc,btn,accion,espera){
      return '<div class="paso'+(listo?' listo':(ahora?' ahora':''))+'">'+
        '<div class="ph"><div class="pn">'+(listo?'&#10003;':num)+'</div><div class="pt">'+tit+'</div></div>'+
        '<div class="pd">'+desc+'</div>'+
        '<div class="pa">'+(listo
            ? (accion ? '<button class="btn ghost sm" data-guia="'+accion+'">'+btn+'</button>'
                      : '<span class="espera" style="color:var(--ok)">Listo</span>')
            : (ahora ? '<button class="btn sm" data-guia="'+accion+'">'+btn+'</button>'
                     : '<span class="espera">'+espera+'</span>'))+'</div>'+
      '</div>';
    }

    /* LOS TRES PASOS, DESPUÉS DEL CONTRATO. Javi, 10-oct-2026: «si el cliente
       ya está aquí quiere decir que ya está el contrato firmado y está dada de
       alta». El paso 1 ya no es una tarea: es una confirmación, y se consulta
       en Mi cuenta. El trabajo empieza en el evento, y la página es una
       cortesía —su escaparate— que se explica aparte. */
    c.className='guia';
    c.innerHTML='<div class="gtit">Ya estás dentro. Esto es lo que sigue</div>'+
      '<div class="gsub">Tu alta está firmada. Ahora: tu evento, y después tu página.</div>'+
      '<div class="pasos">'+
        paso(1, true, false,
             'Tu cuenta, lista',
             'Firmaste tu acuerdo y tus datos están guardados. Si algo cambia —un correo, tu póliza, tu Stripe— lo cambias tú en <b>Mi cuenta</b>.',
             'Ver mi cuenta','cuenta','') +
        paso(2, e.eventos, true,
             'Crea tu evento',
             'Eliges el tipo y solo te pedimos lo que ese tipo necesita: la sala, cuándo, tus boletos y una foto. Queda en revisión hasta que el Ateneo lo valide y aparte la sala.',
             'Crear un evento','nuevo','') +
        paso(3, e.pagina, e.eventos,
             'Tu página, de cortesía',
             (e.lista
               ? 'Ya la llenaste. El Ateneo la revisa y la abre; entonces la liga funciona.'
               : 'Te damos una página con todos tus eventos, para que compartas una sola liga. No es obligatoria: es tuya si la quieres.'),
             'Preparar mi página','pagina','Antes, crea un evento') +
      '</div>'+
      /* La cuenta ya no es una tarea pendiente, así que el botón del paso 1
         tiene que poder pulsarse aunque esté «listo». */
      '';

    Array.prototype.forEach.call(c.querySelectorAll('[data-guia]'),function(b){
      b.onclick=function(){
        var a=b.getAttribute('data-guia');
        if(a==='nuevo'){ ve('eventos'); try{ nuevo(); }catch(_){ } return; }
        ve(a);
      };
    });
  }

  /* ---------- MIS EVENTOS ---------- */
  function pintaEventos(){
    $('pane-eventos').innerHTML=
      '<div class="card"><h3>Mis eventos</h3>'+
        '<div class="hint">Elige el tipo y solo aparece lo que ese tipo necesita. Lo que mandes queda <b>en revisión</b> hasta que Casa Pepe lo valide y lo publique.</div>'+
        '<table><thead><tr><th>Evento</th><th>Tipo</th><th>Cuándo</th><th>Estado</th><th></th></tr></thead><tbody id="tbE"></tbody></table>'+
        '<div class="ft" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="evNuevo">+ Nuevo evento</button></div>'+
      '</div><div id="fichaHost"></div>';
    $('evNuevo').onclick=nuevo; renTabla();
  }
  function renTabla(){
    try{ guia(); }catch(_){ }
    $('tbE').innerHTML=EV.map(function(e){
      /* COMO VA SU SALA. Una cosa es que el evento este aprobado y otra que la
         sala sea suya: hasta que el Ateneo confirme la fecha, otra productora
         puede pedir esa misma noche. Javi, 4-oct-2026. */
      var sala = e.sala_estado==='aprobada' ? '<span class="tag" style="background:#E1F0E7;color:#1D6B4A">sala confirmada</span>'
               : e.sala_estado==='rechazada' ? '<span class="tag" style="background:#F6E1DD;color:#9E3B2E">sala rechazada</span>'
               : e.sala_estado ? '<span class="tag" style="background:#F6EBD5;color:#8C6212">sala pendiente</span>'
               : '<span class="tag" style="background:#F6E1DD;color:#9E3B2E">sin sala apartada</span>';
      var fam = e.clase==='espacio' ? 'Espacio creativo' : e.clase==='privado' ? 'Uso privado' : 'Evento con público';
      return '<tr><td><b>'+esc(e.nombre||'(sin nombre)')+'</b>'+(e.es_gratis?' <span class="tag">gratis</span>':'')+
        '<div class="mini" style="color:var(--tenue,#A9A096)">'+esc(fam)+'</div></td>'+
        '<td class="mini">'+esc(evtDef(e.tipo).n)+'</td><td class="mini">'+esc(fmtCuando(e))+'</td>'+
        '<td>'+estadoTag(e)+'<div style="margin-top:4px">'+sala+'</div></td>'+
        '<td><button class="btn ghost sm" data-ev="'+e.id+'">Abrir</button></td></tr>';
    }).join('')||'<tr><td colspan="5" class="mini">Todavía nada. Crea tu primer evento.</td></tr>';
    Array.prototype.forEach.call($('tbE').querySelectorAll('[data-ev]'),function(b){b.onclick=function(){abre(b.getAttribute('data-ev'));};});
  }

  /* ---------- FICHA DE EVENTO (pestañas estilo tour) ---------- */
  function fichaHTML(){
    return '<div class="card"><h3 id="fTit">Nuevo evento</h3>'+
    '<div class="fnav" id="fnav">'+
      '<button data-f="esencial" aria-selected="true">Lo esencial</button>'+
      '<button data-f="cuando">Cuándo y dónde</button>'+

      /* EL IMPACTO, DESPUÉS. Javi, 10-oct: «déjalo para después de la
         configuración del evento, como un extra que se pone una vez creado».
         Preguntarle por el impacto a quien todavía no ha dicho ni dónde ni

      '<button data-f="impacto" id="fnavImpacto" style="display:none">Impacto</button>'+

      '<div id="famCajas" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));'+
        'gap:8px;margin:6px 0 8px"></div>'+
      /* Javi, 4-oct-2026: «ponme una explicacion de tipos de eventos porque no
         lo entiendo ni yo... si Reyes quiere crear un estudio de grabacion por
         horas». La diferencia no es la sala: es si hay funcion o no. */
      '<div id="famAyuda" class="mini" style="background:var(--crema,#F7F3EA);border-radius:9px;'+
        'padding:10px 12px;margin-bottom:14px;line-height:1.6"></div>'+
      '<div class="fgrid"><div class="fld"><label>Tipo de evento</label><select id="evTipo"></select></div>'+

      /* CUÁNTO COBRAS, AQUÍ MISMO. Javi, 10-oct-2026: «no entiendo el Tu
         tarifa». Con razón: era una pestaña entera para un campo —el precio
         por hora, o el de renta, o el modelo de taquilla— que cambia según el
         tipo de evento y que no tiene nada que ver con la forma de pago. Se
         baja a «Lo esencial», detrás del nombre y la descripción, y la pestaña

      '<div id="cajaTarifa" style="margin-top:14px;border-top:1px solid var(--linea,#E2DCCF);padding-top:12px">'+
        '<label style="font:600 11px/1 Oswald,system-ui,sans-serif;letter-spacing:.09em;'+
          'text-transform:uppercase;color:var(--gris,#6E665C)">Cuánto cuesta</label>'+
        '<div class="mini" style="margin:3px 0 8px">El dinero entra por Stripe y cae en tu cuenta; el Ateneo retiene su comisión en el mismo cobro.</div>'+
        '<div class="fgrid">'+
        '<div class="fld" data-ef="precio_hora"><label>Precio por hora</label><input type="number" id="ev-precio-hora"></div>'+
        '<div class="fld" data-ef="precio_persona"><label>Precio por persona</label><input type="number" id="ev-precio-persona"></div>'+
        '<div class="fld" data-ef="cobro_renta"><label>Modelo de renta</label><select id="ev-renta"><option value="renta_hora">Por hora</option><option value="renta_dia">Por día</option></select></div>'+
        '<div class="fld" data-ef="cobro_renta"><label>Precio de renta</label><input type="number" id="ev-precio-renta"></div>'+
        /* FUERA EL «MODELO». Javi, 10-oct-2026: «quítalo de aquí, no lleva a ningún
           lugar». Y era verdad: `modelo_cobro` se guardaba y no lo leía nadie —ni
           el cobro, ni la comisión, ni la liquidación—. Pedía una decisión que el
           sistema ignoraba. El precio real vive en los boletos. Se queda el input
           escondido para no romper el guardado, con el valor que siempre tuvo. */
          '<input type="hidden" id="ev-taq" value="taquilla">'+
        '<div class="fld" data-ef="cobro_expo"><label>Modelo</label><select id="ev-expo"><option value="renta">Renta</option><option value="comision_obra">Comisión sobre venta de obra</option></select></div>'+
        '<div class="fld" data-ef="cobro_expo"><label>Precio / %</label><input type="number" id="ev-precio-expo"></div>'+
      '</div>'+
      /* EVENTOS GRATUITOS: A QUIEN SE LE OFREZCA. Lo enciende Casa Pepe en la

         Javi, 10-oct-2026: «quita el candado de que los eventos gratis son solo
         de Café Cumbre. Eso lo decide el administrador en esta página». Desde
         hoy la base YA NO rebota un evento gratis de nadie —antes mordia hasta
         al propio administrador—. Lo que decide de verdad sigue siendo la

      ((FICHA&&FICHA.puede_gratis)

      '<div class="fgrid"><div class="fld"><label>Espacio</label>'+

        '<div class="fld" style="grid-column:1/-1"><div id="ev-ficha-tec"></div></div>'+

           bloquee la cantidad que necesitamos para poder hacer el evento, pero
           deja solo la tarjeta de garantía armada y no crees nada. Pon

           columna nueva, no se guarda nada: es el hueco con su medida. */
        '<div class="fld" style="grid-column:1/-1"><div id="ev-garantia"></div></div>'+

           o la hora de soundcheck». Tiene razón: si el montaje se pregunta
           después, el productor elige una hora que parecía libre y descubre al
           final que la sala se apartaba desde dos horas antes —y que ahí ya
           había alguien—. Ahora se pregunta antes y la rejilla de horas ya
           cuenta con ello: una hora en la que no cabe TU montaje sale tachada. */
        '<div class="fld" style="grid-column:1/-1;border:1px solid var(--linea,#E2DCCF);'+
          'border-radius:10px;padding:12px 14px">'+
          '<label>Antes y después del evento</label>'+
          '<div class="mini" style="margin:2px 0 10px">Mientras montas o desmontas, la sala es tuya y nadie más puede pedirla. Dinos cuánto necesitas y te enseño solo las horas en las que cabe.</div>'+

            '<input type="checkbox" id="ev-necesita-montaje" checked style="width:auto;flex:none">'+

          /* EL SOUNDCHECK ES EL MONTAJE. Javi, 10-oct-2026: «olvida lo de
             necesito un soundcheck, es el mismo tiempo que el montaje». Tenía

        '<div class="fld" style="grid-column:1/-1">'+
          '<label>¿Traes algo más?</label>'+

        '<div style="display:none" id="camposViejos">'+

        '<div class="fld" data-ef="crew"><label>Tamaño de crew</label><input type="number" id="ev-crew"></div>'+

    /* EL IMPACTO EN LA COMUNIDAD. Javi lo puso en su trazo del 4-oct, entre los

      '<div class="hint">Marca solo lo que de verdad pasa en este evento. '+

  /* Las salas que puede pedir, y solo esas. Si su giro le da una sola, se
     elige sola: no hay nada que decidir. */
  function pintaEspacios(){
    var sel=$('ev-espacio'); if(!sel) return;
    var tipo=$('evTipo')?$('evTipo').value:'';
    /* LA SALA DICE PARA QUE SIRVE. Las tres de hotel -La Cosmica CDMX, La
       Cosmica Puebla y el Lobby- son de evento abierto al publico, asi que no
       salen cuando lo que se da de alta es un espacio creativo o un uso
       privado. Javi, 5-oct-2026. */
    var puede=ESPACIOS.filter(function(e){
      var fam = (!e.clases || !e.clases.length) || e.clases.indexOf(CLASE)>=0;
      var tip = !tipo || !e.evento_tipos || !e.evento_tipos.length
                || e.evento_tipos.indexOf(tipo)>=0;
      return fam && tip; });
    /* Si para ese tipo de evento no le cuadra ninguna, se le enseñan todas las
       de esa familia antes que dejarle la lista vacia y sin explicacion. */
    if(!puede.length) puede=ESPACIOS.filter(function(e){
      return (!e.clases || !e.clases.length) || e.clases.indexOf(CLASE)>=0; });
    if(!puede.length) puede=ESPACIOS.slice();
    var antes=sel.value;
    /* Agrupadas por sede: ya no son solo las de Virreyes y conviene que se vea
       de un golpe si la sala esta en el Ateneo, en CDMX o en Puebla. */
    var sedes=[], porSede={};
    puede.forEach(function(e){
      var s=e.sede_nombre||'Salas';
      if(!porSede[s]){ porSede[s]=[]; sedes.push(s); }
      porSede[s].push(e);
    });
    var opciones = sedes.map(function(s){
      return '<optgroup label="'+esc(s)+'">'+porSede[s].map(function(e){
        var n=e.nombre+(e.alias?' · '+e.alias:'')+(e.capacidad?'  ('+e.capacidad+' personas)':'');
        return '<option value="'+esc(e.slug)+'">'+esc(n)+'</option>';
      }).join('')+'</optgroup>';
    }).join('');
    sel.innerHTML='<option value="">— elige la sala —</option>'+opciones;
    if(antes) sel.value=antes;
    if(!sel.value && puede.length===1) sel.value=puede[0].slug;
    infoEspacio();
    fichaTec();
  }
  function infoEspacio(){
    var sel=$('ev-espacio'), box=$('ev-espacio-info'); if(!sel||!box) return;
    var e=ESPACIOS.filter(function(x){return x.slug===sel.value;})[0];
    if(!e){ box.textContent=''; return; }
    var t=[];
    if(e.capacidad) t.push('Aforo '+e.capacidad+(e.capacidad_sentado?' de pie · '+e.capacidad_sentado+' sentado':''));
    if(e.fianza_tipo==='monto'&&e.fianza_monto) t.push('Fianza $'+Number(e.fianza_monto).toLocaleString('es-MX'));
    else if(e.fianza_tipo==='renta_mes') t.push('Fianza: un mes de renta');
    else if(e.fianza_tipo) t.push('Fianza: '+e.fianza_tipo);
    box.textContent=t.join(' · ');
    pintaGarantia(e);
    /* El cupo no puede pasar del aforo de la sala: se avisa en el momento. */
    var c=$('ev-cupo'), af=$('ev-aforo');
    [c,af].forEach(function(i){ if(i&&e.capacidad) i.max=e.capacidad; });
    if(af && e.capacidad) af.value=e.capacidad;
  }

  /* LA FICHA TECNICA DE LA SALA. Javi, 3-oct-2026: «sobre el backline de

  var TEC={};
  async function fichaTec(){

    var bl={}, orden=[];

    h.push('<div class="tecin">');

      h.push('<div class="tecg"><b>'+esc(k)+'</b><ul>'+bl[k].map(function(b){
        /* CON FOTO Y CON DESCRIPCIÓN. Javi, 10-oct: «Cable RCA 100 - 20mt,

    if(d.observaciones) h.push('<div class="tecg"><b>Ten en cuenta</b><ul>'+String(d.observaciones).split('\n')
        .filter(Boolean).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul></div>');
    if((d.horarios||[]).length) h.push('<div class="tecg"><b>Cómo va el día</b><ul>'+d.horarios.map(function(x){

             ' de '+esc(d.apoyo.productora)+' con los datos de tu evento, y él te pasa precio.</div>');
    h.push('</div></details>');

  /* LAS DOS FRANJAS, A LA VISTA. La sala se bloquea desde el montaje; el boleto
     se vende a la hora de inicio. Que lo vea antes de mandarlo, no despues. */
  function pintaFranjas(){
    var c=$('ev-franjas'); if(!c) return;
    var f=($('ev-fecha')&&$('ev-fecha').value)||($('ev-desde')&&$('ev-desde').value)||'';
    var hi=$('ev-hora-ini')?$('ev-hora-ini').value:'';
    if(!f||!hi){ c.innerHTML='<span style="color:var(--tenue,#A9A096)">Pon la fecha y la hora de inicio y te digo qué franja apartas.</span>'; return; }
    var dur=Number(($('ev-duracion')&&$('ev-duracion').value)||0)||120;
    var hf=$('ev-hora-fin')?$('ev-hora-fin').value:'';
    var ini=new Date(f+'T'+hi+':00');
    var fin= hf ? new Date(f+'T'+hf+':00') : new Date(ini.getTime()+dur*60000);
    if(fin<=ini) fin=new Date(ini.getTime()+dur*60000);
    var mo=montajeMin(), de=desmontajeMin();
    var sd=new Date(ini.getTime()-mo*60000), sh=new Date(fin.getTime()+de*60000);
    var hh=function(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);};
    c.innerHTML='<div style="background:var(--crema,#F7F3EA);border-radius:9px;padding:9px 11px;line-height:1.6">'+
      '<b>La sala queda apartada de '+hh(sd)+' a '+hh(sh)+'</b> — eso es lo que nadie más puede pedir.<br>'+
      'El boleto se vende para las <b>'+hh(ini)+'</b>'+(hf?' y acaba a las '+hh(fin):'')+'.'+
      (mo||de ? '<br><span style="color:var(--gris,#6E665C)">Incluye '+mo+' min de montaje y '+de+' de desmontaje.</span>' : '')+
      '</div>';
  }

  /* La explicacion, con el caso que pregunto Javi: Reyes y su estudio de
     grabacion por horas. No hay funcion, hay llave: es espacio creativo. */
  var FAM_EJ={
    evento:'<b>Ejemplos:</b> un concierto, una obra, un congreso, un taller al que la gente se apunta, '+
           'una expo con inauguración. <b>La señal:</b> si no vas, te lo pierdes — hay función, y a una hora.',
    espacio:'<b>Ejemplos:</b> «Estudio de grabación por horas» de Reyes, ensayar en la sala de música, '+
            'grabar un podcast. <b>La señal:</b> no hay función, hay llave. El cliente compra un rato de sala '+
            'y lo usa él. Se vende igual y se cobra igual que un evento.',
    privado:'<b>Ejemplos:</b> un rodaje de comercial, una sesión de fotos cerrada, una junta privada. '+
            '<b>La señal:</b> nadie compra un boleto para ver grabar un anuncio. No sale publicado.'
  };
  function pintaFamAyuda(){ var c=$('famAyuda'); if(c) c.innerHTML=FAM_EJ[CLASE]||''; }

  /* ---------- EL CALENDARIO DE LA SALA ---------- */
  var AG_SALA=null, AG_MES=null, AG_ESP=null;
  function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  async function cargaAgenda(){
    var sel=$('ev-espacio'); if(!sel) return;
    var eob=ESPACIOS.filter(function(x){return x.slug===sel.value;})[0];
    AG_ESP = eob?eob.espacio_id:null;
    if(!AG_ESP){ AG_SALA=null; pintaCal(); return; }
    if(!AG_MES) AG_MES=new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    var d1=new Date(AG_MES.getFullYear(),AG_MES.getMonth(),1);
    var d2=new Date(AG_MES.getFullYear(),AG_MES.getMonth()+1,0);
    try{ AG_SALA=await rpc('prod_portal_agenda_sala',
      {p_token:TOK,p_espacio:AG_ESP,p_desde:ymd(d1),p_hasta:ymd(d2)}); }
    catch(_){ AG_SALA=null; }
    pintaCal();
  }
  /* ---------- EL CALENDARIO DE LA SALA, EN DOS PASOS ----------
     Javi, 10-oct-2026, dictado pantalla a pantalla:
       «Primero pregunta si es evento día entero o por horas. Si es día entero
        los días que ya hay evento saldrán en rojo. Si es por horas el productor
        tocará el día y abrirá un calendario de las horas del día y le
        aparecerán las horas con los bloqueos ya confirmados.»
     Lo que se elige aquí escribe los campos de siempre (ev-fecha, ev-hora-ini,
     ev-hora-fin), que es lo que lee el guardado y lo que aparta la sala. */
  var CAL_MODO='horas';           // 'dia' | 'horas'
  var CAL_DIA=null;               // el día abierto en la rejilla de horas
  var CAL_PASO=30;                // media hora
  var CAL_ABRE=7, CAL_CIERRA=23;  // lo que abre la casa

  function hhmm(min){ var h=Math.floor(min/60), m=min%60;
    return ('0'+h).slice(-2)+':'+('0'+m).slice(-2); }
  function aMin(t){ if(!t) return null; var p=String(t).slice(0,5).split(':');
    return Number(p[0])*60+Number(p[1]||0); }

  /* Las franjas ya tomadas de un día, en minutos, marcando si están confirmadas.
     Montaje y desmontaje ya vienen dentro: la sala se aparta desde que alguien
     empieza a montar. */
  function ocupadoDe(dia){
    var l=((AG_SALA&&AG_SALA.ocupado)||[]).filter(function(o){ return o.dia===dia; });
    return l.map(function(o){
      return {d:aMin(o.desde), h:aMin(o.hasta), firme:!!o.firme, mio:!!o.mio, que:o.que||''};
    }).filter(function(o){ return o.d!=null && o.h!=null; });
  }
  function chocaCon(dia,d,h){
    return ocupadoDe(dia).some(function(o){ return d < o.h && h > o.d; });
  }

  /* Lo que de verdad se aparta: el evento más su montaje y su desmontaje. */
  function montajeMin(){
    if(!$('ev-necesita-montaje') || !$('ev-necesita-montaje').checked) return 0;
    /* El tiempo lo pone él. Javi, 10-oct-2026: «que ellos pongan el tiempo y lo
       mismo en desmontar». Había un mínimo de una hora forzado por dentro que
       la pantalla ya no anuncia, y una regla escondida es peor que ninguna. */
    return Number(($('ev-montaje')&&$('ev-montaje').value)||0)||0;
  }
  function desmontajeMin(){
    if(!$('ev-necesita-montaje') || !$('ev-necesita-montaje').checked) return 0;
    return Number(($('ev-desmontaje')&&$('ev-desmontaje').value)||0)||0;
  }

  /* Sin montaje no hay minutos que ajustar, así que los campos se van. Y con
     montaje el mínimo es una hora: es la regla de Javi, no una sugerencia. */
  function montajeUI(){
    var on = $('ev-necesita-montaje') ? $('ev-necesita-montaje').checked : false;
    if($('wrapMontajes')) $('wrapMontajes').style.display = on ? '' : 'none';
    var c=$('ev-bloqueo');
    if(c){
      var mo=montajeMin(), de=desmontajeMin();
      var rato=function(m){ return m>=60 ? (Math.round(m/60*10)/10)+' h' : m+' min'; };
      c.innerHTML = (mo||de)
        ? 'Apartaremos la sala <b>'+rato(mo)+' antes</b> y <b>'+rato(de)+' después</b> de tu evento. '+
          'Lo verás pintado en el calendario.'
        : 'No apartamos nada antes ni después: solo la hora de tu evento.';
    }
  }

  function pintaModo(){
    var c=$('calModo'); if(!c) return;
    c.innerHTML=[['dia','Todo el día','De 07:00 a 23:00, que es lo que abre la casa'],
                 ['horas','Por horas','Eliges la hora de inicio y la de fin']]
      .map(function(x){
        var on=(CAL_MODO===x[0]);
        return '<button type="button" data-modo="'+x[0]+'" style="flex:1;text-align:left;'+
          'border:'+(on?'2px solid var(--naranja,#F2682A)':'1px solid var(--linea,#E2DCCF)')+';'+
          'background:'+(on?'var(--naranja-suave,#FDE7DC)':'#fff')+';border-radius:10px;'+
          'padding:9px 11px;font:inherit;cursor:pointer">'+
          '<b style="font-size:13px">'+x[1]+'</b>'+
          '<div class="mini" style="margin-top:2px">'+x[2]+'</div></button>';
      }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-modo]'),function(b){
      b.onclick=function(){
        CAL_MODO=b.getAttribute('data-modo');
        var ch=$('ev-todoeldia'); if(ch) ch.checked=(CAL_MODO==='dia');
        if(CAL_MODO==='dia'){
          if($('ev-hora-ini')) $('ev-hora-ini').value='07:00';
          if($('ev-hora-fin')) $('ev-hora-fin').value='23:00';
        }
        CAL_DIA=null; pintaCal(); pintaFranjas();
      };
    });
  }

  function pintaHoras(){
    var c=$('calHoras'); if(!c) return;
    if(CAL_MODO!=='horas' || !CAL_DIA){ c.innerHTML=''; return; }
    var oc=ocupadoDe(CAL_DIA);
    var hi=aMin($('ev-hora-ini')&&$('ev-hora-ini').value);
    var hf=aMin($('ev-hora-fin')&&$('ev-hora-fin').value);
    var h='<div style="border:1px solid var(--linea,#E2DCCF);border-radius:10px;padding:10px 12px;margin-top:10px">'+
      '<b style="font-family:Oswald,system-ui,sans-serif;text-transform:uppercase;font-size:13px">'+
        'Las horas del '+esc(CAL_DIA)+'</b>'+
      '<div class="mini" style="margin:2px 0 8px">Toca la hora de inicio y luego la de fin. '+
        'Lo rojo ya está apartado por otro.</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px">';
    /* EL MONTAJE SE PINTA, NO SE TACHA. Javi, 10-oct-2026: «marco en el
       calendario las 14:30 y si puso 60 mins de montaje marco antes de las
       14:30 60 mins de naranja clarito, y lo mismo a la hora de terminar. Si
       se junta con otra hora ya solicitada no podría avanzar y le daría
       error». Así ve de un vistazo lo que de verdad aparta, y el choque se lo
       decimos en el momento en vez de dejarle llegar hasta el final. */
    var mo=montajeMin(), de=desmontajeMin();
    var evIni=hi, evFin=(hf!=null?hf:(hi!=null?hi+CAL_PASO:null));
    var w1=(evIni!=null?evIni-mo:null), w2=(evFin!=null?evFin+de:null);
    var choca=(w1!=null && chocaCon(CAL_DIA,w1,w2));
    for(var t=CAL_ABRE*60; t<CAL_CIERRA*60; t+=CAL_PASO){
      var fin=t+CAL_PASO;
      var tomado=oc.filter(function(o){ return t < o.h && fin > o.d; });
      var firme=tomado.some(function(o){ return o.firme; });
      var esEvento = (evIni!=null && t>=evIni && fin<=evFin);
      /* MONTAJE ANTES, DESMONTAJE DESPUÉS. Javi, 10-oct-2026: «el montaje es
         antes de empezar y el desmontaje después de terminar». Estaban los dos
         del mismo color y con la misma etiqueta, así que no había manera de
         saber cuál era cuál mirando la rejilla. */
      var esAntes   = (!esEvento && evIni!=null && t>=w1 && fin<=evIni);
      var esDespues = (!esEvento && evFin!=null && t>=evFin && fin<=w2);
      var esMontaje = (esAntes||esDespues);
      var fondo, tinta, borde='0';
      if(esEvento){ fondo='var(--naranja,#F2682A)'; tinta='#fff'; }
      else if(esAntes){ fondo='#FDE7DC'; tinta='#C9501A'; borde='1px dashed #F2682A'; }
      else if(esDespues){ fondo='#E4F1FA'; tinta='#1F5B7A'; borde='1px dashed #8DC8EA'; }
      else if(firme){ fondo='#F6E1DD'; tinta='#9E3B2E'; }
      else if(tomado.length){ fondo='#F6EBD5'; tinta='#8C6212'; }
      else { fondo='#E1F0E7'; tinta='#1D6B4A'; }
      /* Si la franja es a la vez tuya y de otro, se marca el conflicto. */
      var pisa=((esEvento||esMontaje) && tomado.length);
      if(pisa){ fondo='#F6E1DD'; tinta='#9E3B2E'; borde='2px solid #9E3B2E'; }
      h+='<button type="button" '+(firme&&!esEvento&&!esMontaje?'disabled':'data-h="'+t+'"')+
         ' title="'+(pisa?'Aquí pisas algo ya apartado'
                      :(esAntes?'Montaje y pruebas, antes de empezar'
                      :(esDespues?'Desmontaje, después de terminar'
                      :(firme?'Ya está apartado':''))))+'"'+
         ' style="border:'+borde+';background:'+fondo+';color:'+tinta+';'+
         'border-radius:6px;padding:6px 2px;font:inherit;font-size:11.5px;'+
         'cursor:'+(firme&&!esEvento&&!esMontaje?'not-allowed':'pointer')+'">'+hhmm(t)+'</button>';
    }
    h+='</div>';
    if(mo||de) h+='<div class="mini" style="margin-top:8px;color:var(--gris,#6E665C)">'+
      '<span style="display:inline-block;width:10px;height:10px;background:#FDE7DC;border:1px dashed #F2682A;border-radius:2px;vertical-align:-1px"></span> montaje, antes &nbsp; '+
      '<span style="display:inline-block;width:10px;height:10px;background:var(--naranja,#F2682A);border-radius:2px;vertical-align:-1px"></span> tu evento &nbsp; '+
      '<span style="display:inline-block;width:10px;height:10px;background:#E4F1FA;border:1px dashed #8DC8EA;border-radius:2px;vertical-align:-1px"></span> desmontaje, después</div>';
    if(choca) h+='<div class="aviso er" style="margin-top:10px">Con tu montaje y desmontaje, la sala te quedaría apartada de <b>'+
      hhmm(w1)+' a '+hhmm(w2)+'</b>, y en esa franja ya hay algo pedido. Mueve la hora o baja los minutos de montaje: así no se puede mandar.</div>';
    if(oc.length) h+='<div class="mini" style="margin-top:8px">Ese día ya hay: '+
      oc.map(function(o){ return hhmm(o.d)+'–'+hhmm(o.h)+(o.mio?' (tuyo)':(o.firme?'':' · sin confirmar')); }).join(' · ')+'.</div>';
    h+='</div>';
    c.innerHTML=h;
    Array.prototype.forEach.call(c.querySelectorAll('[data-h]'),function(b){
      b.onclick=function(){
        var t=Number(b.getAttribute('data-h'));
        var ini=$('ev-hora-ini'), fin=$('ev-hora-fin');
        if(!ini.value || fin.value || t<=aMin(ini.value)){
          ini.value=hhmm(t); fin.value='';
        }else{
          var h2=t+CAL_PASO;
          if(chocaCon(CAL_DIA, aMin(ini.value)-montajeMin(), h2+desmontajeMin())){
            toast('Con tu montaje y desmontaje ese tramo pisa algo ya apartado. Elige otro.',true);
            return;
          }
          fin.value=hhmm(h2);
        }
        pintaHoras(); pintaFranjas();
      };
    });
  }

  function pintaCal(){
    var c=$('ev-cal'); if(!c) return;
    pintaModo();
    if(!AG_ESP){ c.innerHTML='<div class="mini" style="color:var(--tenue,#A9A096)">'+
      'Elige la sala y te enseño sus días libres.</div>'; if($('calHoras'))$('calHoras').innerHTML=''; return; }
    if(!AG_SALA||AG_SALA.error){ c.innerHTML='<div class="mini">No pudimos leer su calendario'+
      (AG_SALA&&AG_SALA.error?': '+esc(AG_SALA.error):'')+'.</div>'; return; }
    var oc={}; (AG_SALA.ocupado||[]).forEach(function(o){ (oc[o.dia]=oc[o.dia]||[]).push(o); });
    var y=AG_MES.getFullYear(), m=AG_MES.getMonth();
    var prim=new Date(y,m,1), ult=new Date(y,m+1,0);
    var hoy=ymd(new Date());
    var sel=($('ev-fecha')&&$('ev-fecha').value)||($('ev-desde')&&$('ev-desde').value)||'';
    var mes=prim.toLocaleDateString('es-MX',{month:'long',year:'numeric'});
    var h='<div style="border:1px solid var(--linea,#E2DCCF);border-radius:10px;padding:10px 12px">'+
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">'+
        '<button class="btn ghost sm" id="calPrev" type="button">‹</button>'+
        '<b style="flex:1;text-align:center;font-family:Oswald,system-ui,sans-serif;text-transform:uppercase">'+esc(mes)+'</b>'+
        '<button class="btn ghost sm" id="calNext" type="button">›</button></div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;font-size:11px;'+
        'text-align:center;color:var(--gris,#6E665C);margin-bottom:3px">'+
        ['L','M','X','J','V','S','D'].map(function(d){return '<div>'+d+'</div>';}).join('')+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px">';
    var hueco=(prim.getDay()+6)%7, i;
    for(i=0;i<hueco;i++) h+='<div></div>';
    for(i=1;i<=ult.getDate();i++){
      var f=ymd(new Date(y,m,i)), lista=oc[f]||[], pas=(f<hoy);
      /* EN DÍA ENTERO, CUALQUIER COSA LO TACHA. Javi, 10-oct: «si es día entero
         los días que ya hay evento saldrán en rojo». No hay medio día libre
         cuando lo que pides es el día. */
      var firme = (CAL_MODO==='dia') ? lista.length>0 : lista.some(function(o){return o.firme;});
      var bloq  = pas || (CAL_MODO==='dia' && lista.length>0);
      var fondo = pas ? '#F2EFEA' : firme ? '#F6E1DD' : lista.length ? '#F6EBD5' : '#E1F0E7';
      var tinta = pas ? 'var(--tenue,#A9A096)' : firme ? '#9E3B2E' : lista.length ? '#8C6212' : '#1D6B4A';
      pas = bloq;
      var borde = (f===sel) ? '2px solid var(--naranja,#F2682A)' : '1px solid transparent';
      h+='<button type="button" '+(pas?'disabled':'data-dia="'+f+'"')+' style="border:'+borde+';'+
         'background:'+fondo+';color:'+tinta+';border-radius:7px;padding:5px 2px;font:inherit;'+
         'font-size:12px;line-height:1.2;cursor:'+(pas?'default':'pointer')+'">'+i+
         (lista.length?'<div style="font-size:9px">'+esc(lista[0].desde)+'</div>':'')+'</button>';
    }
    h+='</div><div class="mini" style="margin-top:8px;color:var(--gris,#6E665C)">'+
      '<span style="color:#1D6B4A">■</span> libre &nbsp; '+
      (CAL_MODO==='dia'
        ? '<span style="color:#9E3B2E">■</span> ese día ya hay algo'
        : '<span style="color:#8C6212">■</span> alguien la pidió, todavía sin confirmar &nbsp; '+
          '<span style="color:#9E3B2E">■</span> ya es de otro')+'</div>';
    if(sel && oc[sel]) h+='<div class="mini" style="margin-top:6px">El '+esc(sel)+' está ocupada '+
      oc[sel].map(function(o){return 'de '+esc(o.desde)+' a '+esc(o.hasta)+(o.mio?' (tuyo: '+esc(o.que||'')+')':'');}).join(', ')+'.</div>';
    c.innerHTML=h+'</div>';
    pintaModo(); pintaHoras();
    $('calPrev').onclick=function(){ AG_MES=new Date(AG_MES.getFullYear(),AG_MES.getMonth()-1,1); cargaAgenda(); };
    $('calNext').onclick=function(){ AG_MES=new Date(AG_MES.getFullYear(),AG_MES.getMonth()+1,1); cargaAgenda(); };
    Array.prototype.forEach.call(c.querySelectorAll('[data-dia]'),function(b){
      b.onclick=function(){
        var f=b.getAttribute('data-dia');
        if($('ev-fecha')) $('ev-fecha').value=f;
        if($('ev-desde')) $('ev-desde').value=f;
        if($('ev-hasta')&&!$('ev-hasta').value) $('ev-hasta').value=f;
        /* Por horas, tocar el día abre la rejilla de ese día y se empieza de
           cero: las horas del día anterior no valen para este. */
        if(CAL_MODO==='horas'){
          CAL_DIA=f;
          if($('ev-hora-ini')) $('ev-hora-ini').value='';
          if($('ev-hora-fin')) $('ev-hora-fin').value='';
        }else{
          CAL_DIA=null;
          if($('ev-hora-ini')) $('ev-hora-ini').value='07:00';
          if($('ev-hora-fin')) $('ev-hora-fin').value='23:00';
        }
        pintaCal(); pintaHoras(); pintaFranjas();
      };
    });
  }
  /* Todo el dia = el horario del inmueble. Javi, 4-oct: «en el caso de que sean
     eventos de unas horas, o si no poner todo el dia». */
  function todoElDia(){
    var ch=$('ev-todoeldia'); if(!ch) return;
    var on=ch.checked;
    if(on){ if($('ev-hora-ini')) $('ev-hora-ini').value='07:00';
            if($('ev-hora-fin')) $('ev-hora-fin').value='23:00'; }
    /* LA MISMA TRAMPA QUE EN filtra(), otra vez. 7-oct-2026, Victor: «no me
       deja poner la hora de comienzo». Esto ponia display:'' para volver a
       enseñar Empieza y Acaba, y display:'' NO los enseña: quita el inline y
       vuelve a ganar la regla [data-ef]{display:none} del CSS. Como filtra()
       llama a todoElDia() al final, deshacia su propio arreglo y los dos
       campos de hora desaparecian siempre. Hay que dar un display real.
       Y el tipo de evento sigue mandando: si no pide hora, siguen ocultos. */
    /* Ya no se esconden ni se enseñan campos aquí: las horas las pone la
       rejilla del calendario y estos inputs viven ocultos. Javi, 10-oct. */
    pintaFranjas();
  }

  /* ---------- EL IMPACTO ---------- */
  var IMP=[];
  var IMP_GR={mesa:'La mesa',manos:'Las manos',gente:'La gente',lugar:'El lugar',casa:'La casa'};
  async function cargaImpacto(){
    var c=$('impLista'); if(!c) return;
    if(!evCur){ c.innerHTML='<div class="mini" style="color:var(--tenue,#A9A096)">'+
      'Guarda el evento primero y aquí podrás contar lo que deja en el barrio.</div>'; IMP=[]; return; }
    var j=null; try{ j=await rpc('prod_portal_impacto',{p_token:TOK,p_evento:evCur.id}); }catch(_){}
    if(!j||j.error){ c.innerHTML='<div class="mini">No pudimos cargar las preguntas.</div>'; return; }
    IMP=j.preguntas||[]; renImp();
  }
  function renImp(){
    var c=$('impLista'); if(!c) return;
    var gr={}; IMP.forEach(function(q,i){ (gr[q.grupo]=gr[q.grupo]||[]).push(i); });
    var inp='padding:6px 8px;border:1px solid var(--linea,#E2DCCF);border-radius:6px;font:inherit;font-size:13px;width:100%';
    var h='';
    Object.keys(gr).forEach(function(g){
      h+='<div style="margin-bottom:14px"><b style="font-family:Oswald,system-ui,sans-serif;'+
         'text-transform:uppercase;letter-spacing:.05em;font-size:12px;color:var(--gris,#6E665C)">'+
         esc(IMP_GR[g]||g)+'</b>';
      gr[g].forEach(function(i){
        var q=IMP[i];
        h+='<div style="border-top:1px solid var(--linea,#E2DCCF);padding:9px 0">'+
           '<label class="chk"><input type="checkbox" data-imp="'+i+'"'+(q.marcado?' checked':'')+'> '+
             esc(q.pregunta)+'</label>'+
           '<div data-impdet="'+i+'" style="display:'+(q.marcado?'flex':'none')+';gap:6px;margin:6px 0 0 24px">'+
             '<input data-impq="'+i+'" placeholder="'+esc(q.quien_label||'¿Quién?')+'" value="'+esc(q.quien||'')+'" style="'+inp+'">'+
             '<input data-impm="'+i+'" type="number" placeholder="$ al año" value="'+(q.monto_mxn!=null?q.monto_mxn:'')+'" style="'+inp+';max-width:110px">'+
           '</div></div>';
      });
      h+='</div>';
    });
    var n=IMP.filter(function(q){return q.marcado;}).length;
    c.innerHTML=h+'<div class="mini" style="margin-top:4px">'+
      (n?('Marcadas '+n+'. Se guardan al enviar el evento.'):'Nada marcado todavía.')+'</div>';
    Array.prototype.forEach.call(c.querySelectorAll('[data-imp]'),function(el){
      el.onchange=function(){ var i=+el.getAttribute('data-imp'); IMP[i].marcado=el.checked;

  /* LA HORA VA CON HUSO. 3-oct-2026.
     Esto mandaba '2026-10-04T16:00:00' a secas y Postgres lo leia como UTC:
     cada evento quedaba seis horas adelantado y en pantalla salia a las
     10:00 lo que la productora habia escrito a las 16:00. Mexico no mueve
     el reloj desde 2022, asi que el desfase es fijo: -06:00. */
  var HUSO='-06:00';
  function combinaFH(f,h){if(!f)return null;return h?(f+'T'+h+':00'+HUSO):(f+'T00:00:00'+HUSO);}
  /* ...Y SE LEE CON HUSO TAMBIEN. Javi, 10-oct-2026.
     El 3-oct se arreglo la mitad: se escribia con -06:00, pero al abrir un
     evento guardado se partia el texto que llega de la base, que viene en UTC.
     Abrir y volver a guardar sin tocar nada le corria las horas seis horas cada
     vez, y la casilla de «ocupa todo el dia» nunca salia marcada porque comparaba
     07:00 contra las 13:00 de UTC. */
  function enMexico(ts){
    if(!ts) return {f:'',h:''};
    var d=new Date(ts); if(isNaN(d.getTime())) return {f:'',h:''};
    var x=new Date(d.getTime()-6*3600000);
    var p=function(n){return String(n).padStart(2,'0');};
    return {f:x.getUTCFullYear()+'-'+p(x.getUTCMonth()+1)+'-'+p(x.getUTCDate()),
            h:p(x.getUTCHours())+':'+p(x.getUTCMinutes())};
  }
  /* Una noche que cruza las doce acaba al dia siguiente. Si el final sale antes
     del principio se corre un dia, en vez de mandarle a la base un rango del
     reves que rebota con un error en ingles. */
  function cierraFH(ini,fin,fHasta,h){
    if(!ini||!fin) return fin;
    if(new Date(fin)>=new Date(ini)) return fin;
    var d=new Date(fHasta+'T12:00:00Z'); if(isNaN(d.getTime())) return fin;
    d.setUTCDate(d.getUTCDate()+1);
    return combinaFH(d.toISOString().slice(0,10),h);
  }

    var j=null; try{ j=await r.json(); }catch(_){}

  async function subeFotos(files){
    if(!files||!files.length) return;
    /* NADIE DEBERÍA TENER QUE GUARDAR PARA PODER SUBIR UNA FOTO. Javi,
       10-oct-2026: «no me obligues a guardar evento para subir fotos». La foto
       necesita un evento al que colgarse, así que se crea el borrador solo, en
       silencio, y se sigue. */
    if(!evCur||!evCur.id){
      toast('Un momento: guardo tu evento como borrador para colgarle la foto…');
      try{ await guardar(true); }catch(_){}
      if(!evCur||!evCur.id){ toast('No pude crear el borrador. Inténtalo otra vez.',true); return; }
    }
    var lista=Array.prototype.slice.call(files).filter(function(f){
      return (f.type||'').indexOf('image')===0; });
    if(!lista.length){ toast('Eso no es una imagen.',true); return; }
    for(var i=0;i<lista.length;i++){
      try{
        toast('Subiendo '+(i+1)+' de '+lista.length+'…');

          fr.onload=function(){res(fr.result);}; fr.onerror=rej;
          fr.readAsDataURL(lista[i]);

        FOTOS=j.fotos||[]; pintaFotos();

    }

  function faltaPara(F){
    var falta=[];
    if(!$('ev-nombre').value.trim())            falta.push('como se llama');
    if(!$('ev-espacio').value)                  falta.push('en que sala es');
    if(F.indexOf('fechas')>=0 && !$('ev-desde').value) falta.push('desde que dia');
    if(F.indexOf('fecha')>=0  && !$('ev-fecha').value) falta.push('que dia es');
    if(F.indexOf('hora')>=0   && !$('ev-hora-ini').value) falta.push('a que hora empieza');
    return falta;
  }

  /* UN EVENTO A MEDIAS NO SE TIRA. Javi, 10-oct-2026: «permite que si avanzamos
     un evento y salimos no se pierda, entre en borrador». Un borrador se guarda
     con lo que haya —sin sala, sin fecha, sin nada— y NO aparta sala: nadie
     pierde un hueco por un evento a medio escribir. Pasa a «en revisión» el día
     que le dé a Enviar a Casa Pepe. */
  async function guardar(borrador){
    var tipo=$('evTipo').value,F=evtDef(tipo).f,g=!!($('ev-gratis')&&$('ev-gratis').checked);
    var falta=faltaPara(F);
    if(!borrador && falta.length){
      toast('Antes de mandarlo falta '+falta.join(', y ')+'.', true);
      /* y se le lleva a la pestaña donde estan esos campos */
      var ir=(falta.length===1&&falta[0]==='como se llama')?'esencial':'cuando';
      var b=document.querySelector('#fnav button[data-f="'+ir+'"]'); if(b)b.click();
      return;
    }
    var esl=$('ev-espacio').value;
    var eob=ESPACIOS.filter(function(x){return x.slug===esl;})[0];
    var ev={tipo:tipo,clase:CLASE,nombre:$('ev-nombre').value.trim(),
            espacio:(eob?eob.nombre:esl),
            espacio_id:(eob?eob.espacio_id:null),
            /* Lo que se aparta es exactamente lo que puso en pantalla. */
            montaje_min:montajeMin(),
            desmontaje_min:desmontajeMin(),
            equipo_extra:EXTRA.filter(function(x){return (x.equipo||'').trim();}),
            descripcion:$('ev-desc').value.trim(),es_gratis:(CLASE==='privado'?false:g),
            borrador:!!borrador};
    if(F.indexOf('fechas')>=0){
      var fH=$('ev-hasta').value||$('ev-desde').value, hF=F.indexOf('hora')>=0?$('ev-hora-fin').value:null;
      ev.fecha_inicio=combinaFH($('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH(fH,hF),fH,hF);
    }
    else if(F.indexOf('fecha')>=0){
      ev.fecha_inicio=combinaFH($('ev-fecha').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      if(F.indexOf('hora')>=0&&$('ev-hora-fin').value)
        ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH($('ev-fecha').value,$('ev-hora-fin').value),$('ev-fecha').value,$('ev-hora-fin').value);
    }
    /* SI NO DIJO CUANDO ACABA, SE SACA DE LA DURACION.
       Sin hora de fin no hay rato que apartar, y la sala no se puede bloquear.
       Antes que pedirle el dato dos veces, se calcula: empieza + lo que dura.
       Y si tampoco dijo cuanto dura, dos horas, que es lo que dura casi todo. */
    if(ev.fecha_inicio && !ev.fecha_fin){
      var mins=parseInt($('ev-duracion')&&$('ev-duracion').value,10);
      if(!mins||mins<=0) mins=120;
      /* Se suma sobre el reloj de la Ciudad de Mexico, no sobre el del aparato:
         una productora conectada desde Lima no tiene por que corrernos la hora
         del evento. Por eso se lee la parte '...THH:MM' tal cual y se vuelve a
         escribir con el mismo huso. */
      var d=new Date(String(ev.fecha_inicio).slice(0,16)+':00Z');
      if(!isNaN(d)){ d=new Date(d.getTime()+mins*60000);
        var dd=function(n){return (n<10?'0':'')+n;};
        ev.fecha_fin=d.getUTCFullYear()+'-'+dd(d.getUTCMonth()+1)+'-'+dd(d.getUTCDate())+
                     'T'+dd(d.getUTCHours())+':'+dd(d.getUTCMinutes())+':00'+HUSO; }
    }
    if(F.indexOf('duracion')>=0)ev.duracion_min=$('ev-duracion').value;
    if(F.indexOf('aforo')>=0)ev.aforo=$('ev-aforo').value;
    if(F.indexOf('cupo')>=0)ev.cupo=$('ev-cupo').value;
    if(F.indexOf('horario_visita')>=0)ev.horario_visita=$('ev-horario').value.trim();
    if(F.indexOf('materiales')>=0)ev.materiales=$('ev-materiales').value.trim();
    if(F.indexOf('tipo_produccion')>=0)ev.tipo_produccion=$('ev-prod').value;
    if(F.indexOf('crew')>=0)ev.crew_tam=$('ev-crew').value;
    if(!g){
      if(F.indexOf('precio_hora')>=0)ev.precio_por_hora=$('ev-precio-hora').value;
      if(F.indexOf('precio_persona')>=0)ev.precio=$('ev-precio-persona').value;
      if(F.indexOf('cobro_renta')>=0){ev.modelo_cobro=$('ev-renta').value;ev.precio=$('ev-precio-renta').value;}
      if(F.indexOf('cobro_taquilla')>=0)ev.modelo_cobro=$('ev-taq').value;
      if(F.indexOf('cobro_expo')>=0){ev.modelo_cobro=$('ev-expo').value;ev.precio=$('ev-precio-expo').value;}
    } else ev.modelo_cobro='gratis';
    var ag=(F.indexOf('agenda')>=0)?AG:[], pr=(F.indexOf('precios')>=0)?PR:[];
    /* ANTES DE MANDARLO, DECIRLE QUÉ FALTA Y LLEVARLE AHÍ. Javi, 10-oct: se
       quedó en «Agenda y boletos» con la sala y la fecha vacías y lo único que
       vio fue «No se pudo enviar». */
    var falta=[], irA=null;
    if(borrador){ falta=[]; }
    else{
    if(!ev.nombre){ falta.push('el nombre del evento'); irA=irA||'esencial'; }
    if(!$('ev-espacio').value){ falta.push('la sala'); irA=irA||'cuando'; }
    var hayFecha = ($('ev-fecha')&&$('ev-fecha').value) || ($('ev-desde')&&$('ev-desde').value);
    if(!hayFecha){ falta.push('la fecha'); irA=irA||'cuando'; }
    if(F.indexOf('hora')>=0 && !($('ev-hora-ini')&&$('ev-hora-ini').value)
       && !($('ev-todoeldia')&&$('ev-todoeldia').checked)){
      falta.push('la hora de inicio'); irA=irA||'cuando'; }
    /* El cupo de boletos no puede pasar del aforo de la sala: la venta de más
       boletos que gente cabe la paga alguien en la puerta. */
    var salaSel=ESPACIOS.filter(function(x){return x.slug===$('ev-espacio').value;})[0];
    if(salaSel && salaSel.capacidad && pr && pr.length){
      var suma=pr.reduce(function(a,b){return a+(Number(b.cupo)||0);},0);
      if(suma>salaSel.capacidad){
        toast('Los boletos suman '+suma+' y en '+salaSel.nombre+' caben '+salaSel.capacidad+'.',true);
        var bx=document.querySelector('#fnav button[data-f="extra"]'); if(bx)bx.click();
        return;
      }
    }
    if(falta.length){

      var bb=document.querySelector('#fnav button[data-f="'+(irA||'esencial')+'"]'); if(bb)bb.click();
      return;
    }
    }
    if(borrador && !ev.nombre) ev.nombre='Evento sin título';
    $('fGuardar').disabled=true;
    try{
      var r=await rpc('prod_portal_evento',{p_token:TOK,p_id:evCur?evCur.id:null,p_evento:ev,p_agenda:ag,p_precios:pr});
      if(!r||!r.ok)throw new Error((r&&r.error)||'error');

         el orden del tipo de boleto (mismo índice que se mandó en p_precios). */
      if(r.id && pr.length && pr.some(function(p){return p.incluye;})){
        try{ await rpc('prod_portal_precios_incluye',{p_token:TOK,p_evento_id:r.id,
          p_incluye:pr.map(function(p,i){return {orden:i,incluye:p.incluye||''};})}); }catch(_){}
      }

         evento nuevo no existe hasta ahora mismo. */
      if(r.id && IMP.length){
        try{ await rpc('prod_portal_impacto_set',{p_token:TOK,p_evento:r.id,
          p_items:IMP.filter(function(q){return q.marcado;})
            .map(function(q){return {clave:q.clave,quien:q.quien||'',monto_mxn:q.monto_mxn};})}); }catch(_){}
      }
      /* APARTAR LA FRANJA. La solicitud la abre la base al guardar; el hueco del
         calendario lo escribe ev-ocupa. Si falla, el evento NO se pierde: se
         queda guardado y sin sala apartada, y se le dice. */
      var ap=null;

        try{
          var ro=await fetch(SB+'/functions/v1/ev-ocupa',{method:'POST',
            headers:Object.assign({'Content-Type':'application/json'},hdrs()),

         va sola. Se queda donde está, con el evento ya creado detrás. */
      if(borrador){

        try{ EV=await rpc('prod_portal_eventos',{p_token:TOK}); renTabla(); }catch(_){}

  /* EL MISMO RECORTADOR DE SIEMPRE. Javi, 4-oct-2026: «el subir foto tiene el
     sistema de centrar que tenemos diseñado?». Lo tenemos desde hace meses
     (sinc-crop) y lo usan la ficha de experiencia y el alta de eventos; aquí
     faltaba. Sin él, una foto vertical de alguien del equipo salía cortada por
     la mitad y nadie entendía por qué. Si por lo que sea no cargó el
     recortador, se sube tal cual antes que dejar a nadie sin poder subir. */
  function leeDataUri(b){
    return new Promise(function(res,rej){
      var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej;
      fr.readAsDataURL(b);
    });
  }
  /* 7-oct-2026, Victor: «no le deja subir la foto». No es que no dejara: el
     recortador devolvía vacío y arriba se hacía `if(!img) return;` — sin aviso,
     sin foto, sin error. Desde fuera eso es exactamente «no me deja». Ahora se
     distingue cerrar a propósito (se avisa) de que el recortador se rompa o se
     quede colgado (se sube la foto tal cual, que es mejor que dejar a alguien
     sin poder subir). */
  async function conRecorte(file, titulo, cual){
    if(!window.sincCrop) return await leeDataUri(file);
    var blob=null, rompio=false;
    try{
      blob = await new Promise(function(res,rej){
        var t=setTimeout(function(){ rej(new Error('el recortador no respondió')); }, 120000);
        try{
          sincCrop.open(file, {titulo:titulo, only:cual}, function(r){
            clearTimeout(t);
            res(r ? (cual==='v' ? (r.vBlob||r.hBlob) : (r.hBlob||r.vBlob)) : null);
          });
        }catch(x){ clearTimeout(t); rej(x); }
      });
    }catch(_){ rompio=true; }
    if(rompio){ toast('El recortador falló; subimos la foto tal cual.'); return await leeDataUri(file); }
    if(!blob){ toast('No se subió nada: se cerró el recortador sin guardar.',true); return null; }
    return await leeDataUri(blob);
  }

  async function callFn(nombre,body){
    var r=await fetch(SB+'/functions/v1/'+nombre,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body||{})});
    var j=null;try{j=await r.json();}catch(_){} return {ok:r.ok,data:j};
  }
  /* Cobros en línea: el productor conecta su Stripe (cuenta Connect propia). El
     estado y la liga de alta los da la función productora-stripe-alta, con el
     token del portal. Los datos bancarios los escribe él en Stripe, no aquí. */
  async function cargaStripe(){
    var box=$('stripeBox'); if(!box) return;
    var r=await callFn('productora-stripe-alta',{accion:'estado',token:TOK});
    var d=r.data||{};
    if(r.ok && d.stripe_charges_enabled){
      box.innerHTML='<div style="background:#E8F5E9;color:#1B5E20;border-radius:10px;padding:11px 13px;font-size:14px">✓ Tu Stripe está conectado. Ya puedes vender boletos en línea.</div>';
      return;
    }
    var yaEmpezo = r.ok && d.alta && !d.stripe_charges_enabled;
    box.innerHTML='<button class="btn" id="stripeBtn">'+(yaEmpezo?'Continuar mi alta de Stripe':'Conectar mi Stripe')+'</button>'
      +(yaEmpezo?'<div class="hint" style="margin-top:8px">Tu alta quedó a medias; termínala para poder cobrar.</div>':'');
    $('stripeBtn').onclick=conectaStripe;
  }
  async function conectaStripe(){
    var b=$('stripeBtn'); if(b){b.disabled=true;b.textContent='Abriendo Stripe…';}
    var r=await callFn('productora-stripe-alta',{accion:'alta',token:TOK,origen:location.origin});
    if(r.ok && r.data && r.data.url){ location.href=r.data.url; return; }
    toast((r.data&&r.data.error)||'No se pudo abrir el alta de Stripe',true);
    if(b){b.disabled=false;b.textContent='Conectar mi Stripe';}
  }
  /* LA COMISIÓN, CON SU CUENTA HECHA. Javi, 4-oct-2026: «pon la comisión que se
     cobraría y un ejemplo». Decir «el Ateneo retiene su comisión» no le dice
     nada a quien va a poner el precio de su boleto: lo que necesita saber es
     cuánto le queda. El porcentaje sale de su propia ficha, así que si se le
     negocia otro, aquí cambia solo. */
  function pesos(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
  function comisionCaja(f){
    /* SIN PORCENTAJE NO SE INVENTA UNO. Javi, 10-oct-2026: «quita lo del 35
       porque puede variar». Antes, a una productora sin comisión puesta en su
       ficha esta caja le decía que el Ateneo retiene el 35% —un número que
       nadie había pactado con ella, y encima con el ejemplo en pesos hecho—.
       Si no está en su ficha, se le dice de dónde sale y se acabó. */
    /* El porcentaje llega ya resuelto desde prod_portal_ficha: el total pactado
       si lo tiene, y si no la suma de su propio desglose (de serie, 35). Solo
       llega vacío si no tiene ni desglose. */
    var pct = (f && f.comision_pct != null) ? Number(f.comision_pct) : null;
    if (pct == null) {
      return '<div class="comi">'+
        '<div class="comi-t">El Ateneo retiene una comisión de cada boleto que se venda en línea. El resto es tuyo.</div>'+
        '<div class="comi-p">El porcentaje es el que lleves en tu convenio; en cuanto esté puesto lo verás aquí '+
          'con la cuenta hecha. Si no lo tienes claro, escríbenos antes de poner precio.</div>'+
      '</div>';
    }
    var ej = 200, reten = Math.round(ej*pct/100), queda = ej - reten;
    return '<div class="comi">'+
      '<div class="comi-t">El Ateneo retiene el <b>'+pct+'%</b> de cada boleto que se venda en línea. El resto es tuyo.</div>'+
      '<div class="comi-e">'+
        '<div><span>Boleto de</span><b>'+pesos(ej)+'</b></div>'+
        '<div><span>Se queda el Ateneo</span><b>'+pesos(reten)+'</b></div>'+
        '<div class="tu"><span>Te llega a ti</span><b>'+pesos(queda)+'</b></div>'+
      '</div>'+
      '<div class="comi-p">Se parte en el mismo cobro: no hay que pasarte nada después. '+
        'Lo que Stripe cobra por procesar la tarjeta va aparte y lo descuenta Stripe de tu depósito.</div>'+
    '</div>';
  }

  /* Subir un papel: se manda como data URI a prod-doc, que lo deja en el bucket
     privado y lo apunta en productora_docs. */
  var DOCS=[];
  async function cargaDocs(){
    try{
      var r=await callFn('prod-doc',{accion:'lista',token:TOK});
      DOCS=(r&&r.data&&r.data.docs)||[];
    }catch(_){ DOCS=[]; }
    ['csf','ine','pasaporte','poliza'].forEach(function(t){
      var e=document.getElementById('d-'+t); if(!e) return;
      var mio=DOCS.filter(function(d){return d.tipo===t;})[0];
      if(mio){
        e.className='est ok';
        e.textContent='Recibido '+new Date(mio.created_at).toLocaleDateString('es-MX');
        /* LA PÓLIZA AVISA UN MES ANTES. Javi, 4-oct-2026. Una póliza vencida
           deja un evento sin cobertura, así que no basta con guardarla: hay que
           decirlo a tiempo, y en días, no en una fecha que nadie resta. */
        if(t==='poliza' && mio.vigencia){
          var dias=Math.ceil((new Date(mio.vigencia+'T12:00:00')-new Date())/86400000);
          if(dias<0){ e.className='est mal'; e.textContent='Venció el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX')+' · súbenos la nueva'; }
          else if(dias<=30){ e.className='est ojo'; e.textContent='Vence en '+dias+(dias===1?' día':' días')+' · ve pidiendo la renovación'; }
          else { e.textContent='Vale hasta el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX'); }
        }
      }else{
        e.className='est'; e.textContent='Falta';
      }
    });
    var falta = !DOCS.some(function(d){return d.tipo==='csf';}) ||
                !DOCS.some(function(d){return d.tipo==='ine'||d.tipo==='pasaporte';});
    var m=document.getElementById('msgDoc');
    if(m) m.textContent = falta
      ? 'Nos falta la constancia y una identificación (INE o pasaporte).'
      : 'Ya tenemos tus papeles. Gracias.';
  }
  function enlazaDocs(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'),function(inp){
      inp.onchange=async function(){
        var f=inp.files && inp.files[0]; if(!f) return;
        var m=document.getElementById('msgDoc');
        if(f.size > 15*1024*1024){ if(m)m.textContent='Ese archivo pesa más de 15 MB.'; inp.value=''; return; }
        if(m)m.textContent='Subiendo '+f.name+'…';
        var lector=new FileReader();
        lector.onload=async function(){
          try{
            var t=inp.getAttribute('data-doc');
            var vg=(t==='poliza' && $('c-poliza_vigencia')) ? $('c-poliza_vigencia').value : null;
            if(t==='poliza' && !vg){ if(m)m.textContent='Pon hasta qué día vale la póliza antes de subirla.'; inp.value=''; return; }
            var r=await callFn('prod-doc',{accion:'subir',token:TOK,
              tipo:t, nombre:f.name, archivo:lector.result, vigencia:vg});
            if(!(r&&r.ok)||(r.data&&r.data.error)) throw new Error((r.data&&r.data.error)||'No se pudo subir');
            if(m)m.textContent='Listo, lo recibimos.';
            cargaDocs();
          }catch(x){ if(m)m.textContent=x.message; }
          inp.value='';
        };
        lector.readAsDataURL(f);
      };
    });
  }

  async function cargaContrato(){
    var box=$('contratoBox'); if(!box) return;

    try{ c=await rpc('prod_portal_contrato',{p_token:TOK}); }catch(_){}
    if(!c||c.error){ box.textContent='No pudimos cargar tu contrato.'; return; }
    var t=c.terminos||{};
    var h='';
    if(c.firmado_at){
      h+='<div class="firmado">✓ Firmado el '+new Date(c.firmado_at).toLocaleDateString('es-MX')+
         ' por <b>'+esc(c.firmante||'')+'</b>'+(c.version?' · versión '+esc(c.version):'')+'</div>';
    }else if(c.habilitado){
      h+='<div class="mini">Tu contrato ya está listo para firmar'+(c.version?' (versión '+esc(c.version)+')':'')+'.</div>';
    }else{
      h+='<div class="mini">Todavía no habilitamos tu contrato. Puedes leerlo y leer las condiciones; te avisamos cuando se pueda firmar.</div>';
    }
    if(c.folio) h+='<div class="mini" style="margin-top:4px">Folio <b>'+esc(c.folio)+'</b>'+
                   (c.plantilla_version?' · texto '+esc(c.plantilla_version):'')+'</div>';
    /* La poliza manda en la DECIMA QUINTA: que lo vea aquí, junto al contrato,
       y no solo en su tarjeta. Javi, 4-oct-2026. */
    if(c.poliza_aviso) h+='<div class="mini" style="margin-top:4px;color:'+
         (/NO TENER|VENCIDA|sin fecha|hay que/.test(c.poliza_aviso)?'#9E3B2E':'#1D6B4A')+
         '">Responsabilidad civil: '+esc(c.poliza_aviso)+'</div>';
    h+='<div class="ft" style="justify-content:flex-start;gap:8px;margin-top:10px">'+
         '<button class="btn ghost sm" id="verContrato">Ver contrato</button>'+
         (t.url?'<a class="btn ghost sm" href="'+esc(t.url)+'" target="_blank" rel="noopener">Términos y condiciones</a>'
               :'<button class="btn ghost sm" id="verTyC">Términos y condiciones</button>')+
       '</div>'+
       '<div id="contratoTexto" class="legal" style="display:none"></div>';
    if(c.habilitado && !c.firmado_at){
      h+='<div class="firmar">'+
           '<label class="chk"><input type="checkbox" id="fAcepta"> He leído el contrato y las condiciones, y los acepto</label>'+
           '<div class="alta"><input id="fNombre" placeholder="Tu nombre completo, como firma">'+
             '<button class="btn sm" id="fBtn">Firmar</button></div>'+
         '</div>';
    }
    box.innerHTML=h;

    /* El contrato viene en markdown. Si se pinta con textContent se lee con
       asteriscos por todos lados, y un contrato que se ve mal no se lee. Esto
       no es un parser: negritas, titulos, guiones y la raya, nada mas. */
    function legalHtml(txt){
      var l=String(txt||'').split('\n'), out=[], i, s, m;
      function neg(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
      for(i=0;i<l.length;i++){
        s=l[i];
        /* Los anexos vienen como tabla de markdown: si se pintan linea por
           linea se leen a puros pipes. */
        if(/^\s*\|.*\|\s*$/.test(s)){
          var fs=[], j=i;
          while(j<l.length && /^\s*\|.*\|\s*$/.test(l[j])){
            var cel=l[j].trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
            if(!/^[\s|:-]+$/.test(l[j])) fs.push(cel);
            j++;
          }
          var tb='<table style="width:100%;border-collapse:collapse;margin:9px 0;font-size:12px">', k, c;
          for(k=0;k<fs.length;k++){
            tb+='<tr>';
            for(c=0;c<fs[k].length;c++)
              tb+='<td style="border:1px solid var(--linea,#E2DCCF);padding:4px 6px;'+
                  (k===0?'font-weight:700;background:rgba(0,0,0,.035)':'')+'">'+neg(fs[k][c].trim())+'</td>';
            tb+='</tr>';
          }
          out.push(tb+'</table>'); i=j-1; continue;
        }
        if(/^\s*---+\s*$/.test(s)){ out.push('<hr style="border:0;border-top:1px solid var(--linea,#E2DCCF);margin:12px 0">'); continue; }
        s=esc(s);
        s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>');
        if((m=/^##\s+(.*)$/.exec(s)))      { out.push('<div style="font-weight:700;font-size:14px;margin:14px 0 4px">'+m[1]+'</div>'); continue; }
        if((m=/^#\s+(.*)$/.exec(s)))       { out.push('<div style="font-weight:700;font-size:15.5px;margin:0 0 6px">'+m[1]+'</div>'); continue; }
        if((m=/^[-*]\s+(.*)$/.exec(s)))    { out.push('<div style="margin:3px 0 3px 14px;text-indent:-10px">· '+m[1]+'</div>'); continue; }
        if((m=/^(\d+)\.\s+(.*)$/.exec(s))){ out.push('<div style="margin:3px 0 3px 16px;text-indent:-12px">'+m[1]+'. '+m[2]+'</div>'); continue; }
        out.push(s ? '<div style="margin:7px 0">'+s+'</div>' : '');
      }
      return out.join('');
    }
    function muestra(txt){
      var d=$('contratoTexto');
      d.style.display = d.style.display==='none' ? 'block' : 'none';
      if(txt) d.innerHTML = legalHtml(txt);
      else    d.textContent = 'Todavía no hay texto cargado. Pídenoslo y te lo mandamos.';
    }
    if($('verContrato')) $('verContrato').onclick=function(){ muestra(c.cuerpo); };
    if($('verTyC'))      $('verTyC').onclick=function(){ muestra(t.texto); };

    if($('fBtn')) $('fBtn').onclick=async function(){
      var b=$('fBtn'); b.disabled=true;
      try{
        var r=await rpc('prod_portal_firma',{p_token:TOK,
          p_nombre:($('fNombre').value||'').trim(), p_acepta:$('fAcepta').checked});
        if(!r||!r.ok) throw new Error((r&&r.error)||'No se pudo firmar');
        toast('Contrato firmado'); await cargaContrato();
      }catch(e){ toast(e.message,true); b.disabled=false; }
    };
  }
