  /* UN SERVICIO POR HORAS NO TIENE FECHA: TIENE HORARIO. 13-oct-2026.
     Esto le pedia a Reyes Recording «que dia es, y a que hora empieza» para
     dejarle mandar la sala de ensayo, que es justo lo que NO tiene: se ofrece
     de lunes a domingo y la fecha la pone quien compra las horas. Los dos
     campos que exigia ni siquiera se pintan en esa pantalla, asi que el aviso
     rojo era imposible de cumplir y el evento no se podia mandar nunca. Ahora
     a un servicio por horas se le pide lo suyo: que dias, de que hora a que
     hora y cuanto cuesta la hora. */
  /* CÓMO VA LA FICHA, PASO A PASO. Javi, 27-oct-2026: «el diseño que tienes
     ahora». En la ficha de experiencia cada paso dice si está completo, a
     medias o sin empezar, y a la derecha se ve el resumen. Aquí es lo mismo,
     leyendo lo que el evento ya tiene. Las funciones del evento no se tocan:
     lo que cambia es que ahora se ve dónde estás. */
  function evEstado(){
    function val(id){ var e=$(id); return e ? String(e.value||'').trim() : ''; }
    var h={esencial:0, cuando:0, fotos:0, extra:0, impacto:0};

    var nom=val('ev-nombre'), desc=val('ev-desc');
    var gratis=$('ev-gratis')&&$('ev-gratis').checked;
    var precio=Number(val('ev-precio')||val('ev-precio-hora')||0);
    if(nom) h.esencial=1;
    if(nom && (desc || gratis || precio>0)) h.esencial=2;

    var sala=val('ev-espacio');
    var cuando = esPorHoras()
      ? (DISPO_DIAS.length>0 && val('ev-hdesde') && val('ev-hhasta'))
      : (val('ev-fecha') || val('ev-desde'));
    if(sala || cuando) h.cuando=1;
    if(sala && cuando) h.cuando=2;

    if((FOTOS||[]).length) h.fotos=2;
    if((PR||[]).length || (AG||[]).length) h.extra=2;
    return h;
  }

  function pintaPasosEv(){
    var nav=$('fnav'); if(!nav) return;
    var h=evEstado(), n=0;
    Array.prototype.forEach.call(nav.children,function(b){
      if(b.style.display==='none') return;
      var f=b.getAttribute('data-f'), g=h[f];
      if(g===undefined) return;
      n++;
      var p=b.querySelector('.fpunto');
      if(!p){ p=document.createElement('span'); p.className='fpunto'; b.insertBefore(p,b.firstChild); }
      p.className='fpunto'+(g===2?' ok':(g===1?' medio':''));
      p.textContent = g===2?'✓':(g===1?'◐':String(n));
      b.title = g===2?'Completo':(g===1?'A medias':'Sin empezar');
    });
    pintaComoVa(h);
  }

  var ETIQ={esencial:'Lo esencial', cuando:'Cuándo y dónde', fotos:'Fotos', extra:'Agenda y boletos'};
  function pintaComoVa(h){
    var c=$('comoVaEv'); if(!c) return;
    h=h||evEstado();
    var ks=Object.keys(ETIQ), ok=0;
    c.innerHTML='<div class="comova">'+ks.map(function(k){

      return '<div class="l '+(g===2?'ok':(g===1?'medio':'no'))+'">'+
        '<i>'+(g===2?'✓':(g===1?'◐':'○'))+'</i>'+esc(ETIQ[k])+'</div>';
    }).join('')+'</div>'+
    '<div class="mini" style="margin-top:8px">'+ok+' de '+ks.length+' completos</div>';
  }

  function faltaPara(F){
    var falta=[];
    if(!$('ev-nombre').value.trim())            falta.push('como se llama');
    if(!$('ev-espacio').value)                  falta.push('en que sala es');
    if(esPorHoras()){
      if(!DISPO_DIAS.length) falta.push('que dias la ofreces');
      if(!($('ev-hdesde')&&$('ev-hdesde').value) || !($('ev-hhasta')&&$('ev-hhasta').value))
        falta.push('de que hora a que hora');
      if(!($('ev-gratis')&&$('ev-gratis').checked) &&
         !(Number(($('ev-precio-hora')&&$('ev-precio-hora').value)||0)>0))
        falta.push('el precio por hora');
      return falta;
    }
    if(F.indexOf('fechas')>=0 && !$('ev-desde').value) falta.push('desde que dia');
    if(F.indexOf('fecha')>=0  && !$('ev-fecha').value) falta.push('que dia es');
    if(F.indexOf('hora')>=0   && !$('ev-hora-ini').value) falta.push('a que hora empieza');
    return falta;

  /* UN EVENTO A MEDIAS NO SE TIRA. Javi, 10-oct-2026: «permite que si avanzamos
     un evento y salimos no se pierda, entre en borrador». Un borrador se guarda
     con lo que haya —sin sala, sin fecha, sin nada— y NO aparta sala: nadie
     pierde un hueco por un evento a medio escribir. Pasa a «en revisión» el día
     que le dé a Enviar a Casa Pepe. */
  /* ---------- QUE NO SE PIERDA NADA ----------
     Javi, 13-oct-2026: «1) al crear evento se guarda cuando pones el nombre.
     2) se actualiza el guardado a medida que vas metiendo datos. 3) pon un
     boton de Guardar (no guardar y salir) para doble check. 5) no permitas
     que se pierda info».
     El evento nace con el nombre; de ahi en adelante cada cambio programa un
     guardado segundo y medio despues, y al cambiar de pestana o al cerrar se
     guarda antes de moverse. El boton Guardar hace lo mismo cuando el lo
     decide, y lo dice en el pie. Nada de esto manda el evento a Casa Pepe:
     mandar sigue siendo un gesto aparte, con su pregunta. */
  var AUTO_T=null, AUTO_CORRE=false, AUTO_SUCIO=false;
  function marcaEstado(t,clase){
    var c=$('fEstado'); if(!c) return;
    c.textContent=t||'';
    c.style.color = clase==='mal' ? 'var(--error,#9E3B2E)'
                  : clase==='ok'  ? 'var(--ok,#1D6B4A)'
                  : 'var(--tenue,#A9A096)';
  }
  function tocado(){
    if(!$('fGuardar')) return;            /* la ficha ya no esta abierta */
    AUTO_SUCIO=true; marcaEstado('Sin guardar…');
    if(AUTO_T) clearTimeout(AUTO_T);
    AUTO_T=setTimeout(function(){ guardaYa('auto'); }, 1500);
  }
  async function guardaYa(motivo){
    if(AUTO_T){ clearTimeout(AUTO_T); AUTO_T=null; }
    if(!$('fGuardar')) return;
    if(AUTO_CORRE) return;
    /* Sin nombre no hay evento que guardar: el evento nace con el nombre. */
    var nom=($('ev-nombre')&&$('ev-nombre').value.trim())||'';
    if(!nom && !(evCur&&evCur.id)) return;
    if(motivo==='auto' && !AUTO_SUCIO) return;
    if(motivo!=='auto' && !AUTO_SUCIO && evCur && evCur.id){ marcaEstado('Guardado','ok'); return; }
    /* UN EVENTO YA CONFIRMADO NO SE TOCA A ESCONDIDAS. La base devuelve a
       revision cualquier evento que se vuelva a guardar, y eso en uno que el
       Ateneo ya confirmo significa perder la sala. Que lo decida ella, con el
       boton de mandar los cambios, no un temporizador. */
    if(evCur && evCur.estado==='confirmado'){
      marcaEstado('Ya está confirmado: usa «Enviar los cambios» para tocarlo.','mal');
      return;
    }
    AUTO_CORRE=true;
    marcaEstado('Guardando…');
    try{
      /* Un borrador se guarda como borrador. Uno que ya mando se guarda SIN
         exigirle que este completo y SIN degradarlo: sigue en revision. */
      var esBorrador=(!evCur || !evCur.id || evCur.estado==='borrador');
      if(esBorrador) await guardar(true,false,true);
      else           await guardar(false,true,true);
      AUTO_SUCIO=false;
      marcaEstado(motivo==='auto'?'Guardado solo':'Guardado','ok');
    }catch(e){
      marcaEstado('No se pudo guardar. No cierres.','mal');
    }
    AUTO_CORRE=false;
  }

  /* ---------- ANTES DE MANDARLO, SE PREGUNTA ----------
     Javi, 13-oct-2026: «al dar a enviar solicitud consultale si esta seguro y
     se envia». Mandar pone el evento delante de Casa Pepe y le pide la sala al
     Ateneo; no puede salir de un clic de paso. Se le ensena lo que va a mandar
     -nombre, sala, cuando y precio- para que lo reconozca antes de decir si. */
  function confirmaEnvio(){
    var d=prevDatos();
    var yaMando=(evCur && evCur.estado && evCur.estado!=='borrador');
    var cuando=cuandoTexto(d);
    var precio = d.gratis ? 'Entrada libre'
               : (d.precio>0 ? ('$'+Number(d.precio).toLocaleString('es-MX')+
                   (d.cobro==='hora'?' la hora':'')) : 'sin precio todavia');
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(30,26,22,.55);z-index:960;'+
      'display:grid;place-items:center;padding:18px;overflow:auto';
    ov.innerHTML='<div style="background:#fff;border-radius:14px;max-width:440px;width:100%;'+
      'padding:20px 22px;box-shadow:0 20px 60px -20px rgba(30,26,22,.5)">'+
      '<h3 style="margin:0 0 6px;font-family:Oswald,system-ui,sans-serif;text-transform:uppercase;font-size:17px">'+
        (yaMando?'¿Mandamos los cambios?':'¿Lo mandamos a Casa Pepe?')+'</h3>'+
      '<div class="mini" style="line-height:1.6">'+
        (yaMando
          ? 'Tu solicitud se actualiza con lo que tienes ahora y vuelve a revisión.'
          : 'Queda <b>en revisión</b>. Casa Pepe lo valida, te confirma la sala y lo publica.')+
      '</div>'+
      '<div style="margin-top:14px;border:1px solid var(--linea,#E2DCCF);border-radius:10px;'+
        'padding:12px 14px;background:var(--crema,#F7F3EA);line-height:1.7;font-size:13px">'+
        '<div><b>'+esc(d.nombre||'(sin nombre)')+'</b></div>'+
        '<div>'+esc(d.sala||'sin sala')+'</div>'+
        '<div>'+esc(cuando)+'</div>'+
        '<div>'+esc(precio)+'</div>'+
      '</div>'+
      '<div class="ft" style="margin-top:16px;justify-content:flex-end;gap:8px">'+
        '<button class="btn ghost" type="button" data-no>Todavía no</button>'+
        '<button class="btn" type="button" data-si>'+(yaMando?'Sí, mandar los cambios':'Sí, enviar')+'</button>'+
      '</div></div>';
    document.body.appendChild(ov);
    ov.querySelector('[data-no]').onclick=function(){ ov.remove(); };
    ov.querySelector('[data-si]').onclick=function(){
      ov.remove();
      if(AUTO_T){ clearTimeout(AUTO_T); AUTO_T=null; }
      var p=guardar(false); if(p&&p.catch)p.catch(function(e){
        toast('No se pudo enviar: '+String((e&&e.message)||e),true); });
    };
  }

  /* ---------- PREVISUALIZAR DESDE LA LISTA ----------
     Javi, 13-oct-2026: «previsualizar ponlo en el listado de eventos en el
     panel, no abajo en la configuracion de la data». Tiene razon: decidir si
     algo esta listo se hace mirando la lista, no desde dentro del formulario.
     Aqui no hay formulario que leer, asi que la ficha se arma con lo que hay
     guardado en la base -que ademas es lo que de verdad veria el huesped-. */
  async function previsualizaGuardado(id){
    var e=EV.filter(function(x){return x.id===id;})[0]; if(!e) return;
    var det=null; try{ det=await rpc('prod_portal_evento_detalle',{p_token:TOK,p_id:id}); }catch(_){}
    previsualiza(deFila(e, det && det.ok ? det : null));
  }
  function deFila(e,det){
    var F=evtDef(e.tipo).f;
    var eob=ESPACIOS.filter(function(x){
      return x.espacio_id===e.espacio_id || x.nombre===e.espacio || x.slug===e.espacio; })[0]||null;
    var LI=enMexico(e.fecha_inicio), LF=enMexico(e.fecha_fin);
    var porHoras=(e.tipo==='reserva_horas');
    var tiers=(det&&det.precios)||[];
    var precio=Number(e.precio||0), cobro='persona', desde=false;
    if(porHoras || Number(e.precio_por_hora||0)>0){ precio=Number(e.precio_por_hora||0); cobro='hora'; }
    else if(F.indexOf('cobro_renta')>=0) cobro='renta';
    else if(F.indexOf('cobro_expo')>=0)  cobro='expo';
    var conPrecio=tiers.filter(function(p){return Number(p.precio)>0;});
    if(conPrecio.length){
      var mn=Math.min.apply(null,conPrecio.map(function(p){return Number(p.precio);}));
      var mx=Math.max.apply(null,conPrecio.map(function(p){return Number(p.precio);}));
      precio=mn; desde=(mx>mn); cobro='persona';
    }
    return {
      nombre:e.nombre||'', desc:e.descripcion||'',
      sala:(eob?eob.nombre:(e.espacio||'')), sede:(eob&&eob.sede_nombre)||'Ateneo de Virreyes',
      espObj:eob,
      fecha:LI.f, fechaFin:(LF.f&&LF.f!==LI.f)?LF.f:'',
      hora:LI.h, horaFin:LF.h, todoDia:(LI.h==='07:00'&&LF.h==='23:00'),
      gratis:!!e.es_gratis, precio:precio, desde:desde, cobro:cobro,
      minHoras:Number(e.min_horas||0),
      renta:(e.modelo_cobro||''), expo:(e.modelo_cobro||''),
      cupo:Number(e.cupo||0), aforo:Number(e.aforo||0), duracion:Number(e.duracion_min||0),
      materiales:e.materiales||'', horario:e.horario_visita||'',
      prod:e.tipo_produccion||'', crew:Number(e.crew_tam||0),
      fotos:(Array.isArray(e.fotos)?e.fotos:[]).map(function(f){return (f&&f.url)||f;}).filter(Boolean),
      extra:(Array.isArray(e.equipo_extra)?e.equipo_extra:[]).filter(function(x){return (x.equipo||'').trim();}),
      agenda:((det&&det.agenda)||[]).filter(function(a){return (a.titulo||'').trim();}),
      tiers:tiers, impacto:[],
      clase:(['evento','espacio','privado'].indexOf(e.clase)>=0?e.clase:'evento'),
      tipoN:evtDef(e.tipo).n,
      pideHora:(F.indexOf('hora')>=0),
      dispo: porHoras ? {dias:(Array.isArray(e.dias_semana)?e.dias_semana:[]),
                         hd:String(e.hora_desde||'').slice(0,5), hh:String(e.hora_hasta||'').slice(0,5),
                         vd:e.vigencia_desde||'', vh:e.vigencia_hasta||'',
                         minh:Number(e.min_horas||0)} : null,
      foto:((Array.isArray(e.fotos)&&e.fotos.length)?(e.fotos[0].url||e.fotos[0]):'')||''
    };
  }
  /* El «cuando» de la ficha: una fecha, un rango de dias, o -si lo que se
     vende son horas- los dias de la semana en que se ofrece. */
  function cuandoTexto(d){
    if(d.dispo){
      var nom={1:'lunes',2:'martes',3:'miércoles',4:'jueves',5:'viernes',6:'sábados',7:'domingos'};
      var ds=(d.dispo.dias||[]).map(function(n){return nom[n];}).filter(Boolean);
      if(!ds.length) return 'Falta decir qué días';
      return ds.join(', ')+((d.dispo.hd&&d.dispo.hh)?(' · '+d.dispo.hd+'–'+d.dispo.hh+' h'):'')+
             (d.dispo.vh?' · hasta el '+pvDia(d.dispo.vh):'');
    }
    if(!d.fecha) return 'Falta el día';
    var t=pvDia(d.fecha);
    if(d.fechaFin) t+=' → '+pvDia(d.fechaFin);
    if(d.todoDia) t+=' · todo el día';
    else if(d.hora) t+=' · '+d.hora+(d.horaFin?'–'+d.horaFin:'')+' h';
    return t;
  }
  /* `quieto` = guarda y se queda donde esta: ni cierra la ficha, ni pide la
     sala, ni saca el aviso de la fianza. Es lo que usan el guardado automatico
     y el boton Guardar. Mandar a Casa Pepe sigue siendo otra cosa. */
  async function guardar(borrador,sinExigir,quieto){
    var tipo=$('evTipo').value,F=evtDef(tipo).f,g=!!($('ev-gratis')&&$('ev-gratis').checked);
    var falta=faltaPara(F);
    /* ESTE CANDADO TAMBIEN FRENABA EL GUARDADO. 13-oct-2026: `sinExigir` nacio
       para que guardar a medias no pidiera nada, pero este primer if solo
       miraba `borrador`, asi que un evento ya propuesto e incompleto rebotaba
       aqui con el aviso rojo y no se guardaba. Es el aviso que Javi veia al
       darle a «Guardar y salir» en Reyes Recording. */
    if(!borrador && !sinExigir && falta.length){
      toast('Antes de mandarlo falta '+falta.join(', y ')+'.', true);
      /* y se le lleva a la pestaña donde estan esos campos */
      var ir=(falta.length===1&&falta[0]==='como se llama')?'esencial':'cuando';
      var b=document.querySelector('#fnav button[data-f="'+ir+'"]'); if(b)b.click();
      return;
    }
    var esl=$('ev-espacio').value;
    var eob=ESPACIOS.filter(function(x){return x.slug===esl;})[0];
    var ev={tipo:tipo,clase:CLASE,nombre:$('ev-nombre').value.trim(),
            espacio:(eob?eob.nombre:esl),
            espacio_id:(eob?eob.espacio_id:null),
            /* Lo que se aparta es exactamente lo que puso en pantalla. */
            montaje_min:montajeMin(),
            desmontaje_min:desmontajeMin(),
            equipo_extra:EXTRA.filter(function(x){return (x.equipo||'').trim();}),
            descripcion:$('ev-desc').value.trim(),es_gratis:(CLASE==='privado'?false:g),
            garantia_modo:(function(){var r=document.querySelector('input[name=garantia]:checked');
                                       return r?r.value:null;})(),
            borrador:!!borrador};
    if(F.indexOf('fechas')>=0){
      var fH=$('ev-hasta').value||$('ev-desde').value, hF=F.indexOf('hora')>=0?$('ev-hora-fin').value:null;
      ev.fecha_inicio=combinaFH($('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH(fH,hF),fH,hF);
    }
    else if(F.indexOf('fecha')>=0){
      ev.fecha_inicio=combinaFH($('ev-fecha').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      if(F.indexOf('hora')>=0&&$('ev-hora-fin').value)
        ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH($('ev-fecha').value,$('ev-hora-fin').value),$('ev-fecha').value,$('ev-hora-fin').value);
    }
    /* SI NO DIJO CUANDO ACABA, SE SACA DE LA DURACION.
       Sin hora de fin no hay rato que apartar, y la sala no se puede bloquear.
       Antes que pedirle el dato dos veces, se calcula: empieza + lo que dura.
       Y si tampoco dijo cuanto dura, dos horas, que es lo que dura casi todo. */
    if(ev.fecha_inicio && !ev.fecha_fin){
      var mins=parseInt($('ev-duracion')&&$('ev-duracion').value,10);
      if(!mins||mins<=0) mins=120;
      /* Se suma sobre el reloj de la Ciudad de Mexico, no sobre el del aparato:
         una productora conectada desde Lima no tiene por que corrernos la hora
         del evento. Por eso se lee la parte '...THH:MM' tal cual y se vuelve a
         escribir con el mismo huso. */
      var d=new Date(String(ev.fecha_inicio).slice(0,16)+':00Z');
      if(!isNaN(d)){ d=new Date(d.getTime()+mins*60000);
        var dd=function(n){return (n<10?'0':'')+n;};
        ev.fecha_fin=d.getUTCFullYear()+'-'+dd(d.getUTCMonth()+1)+'-'+dd(d.getUTCDate())+
                     'T'+dd(d.getUTCHours())+':'+dd(d.getUTCMinutes())+':00'+HUSO; }
    }
    if(F.indexOf('duracion')>=0)ev.duracion_min=$('ev-duracion').value;
    if(F.indexOf('aforo')>=0)ev.aforo=$('ev-aforo').value;
    if(F.indexOf('cupo')>=0)ev.cupo=$('ev-cupo').value;
    if(F.indexOf('horario_visita')>=0)ev.horario_visita=$('ev-horario').value.trim();
    if(F.indexOf('materiales')>=0)ev.materiales=$('ev-materiales').value.trim();
    if(F.indexOf('tipo_produccion')>=0)ev.tipo_produccion=$('ev-prod').value;
    if(F.indexOf('crew')>=0)ev.crew_tam=$('ev-crew').value;
    if(!g){
      if(F.indexOf('precio_hora')>=0)ev.precio_por_hora=$('ev-precio-hora').value;
      if(F.indexOf('precio_persona')>=0)ev.precio=$('ev-precio-persona').value;

  async function subeImagenFicha(destino,file){
    if(!file) return;
    if((file.type||'').indexOf('image')!==0){ toast('Eso no es una imagen.',true); return; }
    if(file.size>25*1024*1024){ toast('La imagen pesa más de 25 MB.',true); return; }
    try{
      /* LA PORTADA SE ACOMODA ANTES DE SUBIR. Es la foto ancha del encabezado:
         una foto vertical del teléfono salía cortada por la mitad y nadie
         entendía por qué. El logo NO pasa por el recortador: recortar un logo
         lo estropea. Si el recortador no cargó, conRecorte sube tal cual. */
      var dataUri;
      if(destino==='portada'){
        dataUri = await conRecorte(file,'Acomoda tu portada','h');
        if(!dataUri) return;            // cerró el recortador sin guardar
        toast('Subiendo…');
      }else{
        toast('Subiendo…');
        dataUri = await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=rej;fr.readAsDataURL(file);});
      }
      var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify({token:TOK,destino:destino,imagen:dataUri})});
      var j=null; try{ j=await r.json(); }catch(_){}
      if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('no se pudo subir ('+r.status+')'));
      var el=$('g-'+destino+'_url'); if(el) el.value=j.url;
      /* Se guarda de una: subir y que no se vea hasta pulsar «Guardar» es el
         camino corto a subirla tres veces creyendo que no funcionó. */
      try{
        var campo={}; campo[destino+'_url']=j.url;
        await rpc('prod_portal_update',{p_token:TOK,p:campo});
        FICHA=await rpc('prod_portal_ficha',{p_token:TOK});
        pintaPagina(); guia();
      }catch(_){}
      toast('Imagen subida ✓');
    }catch(e){ toast(e.message||'No se pudo subir',true); }
  }
  async function guardaPagina(){
    var campos=['bio','historia','logo_url','portada_url','whatsapp_publico','email_publico',
                'instagram','facebook','tiktok','youtube','spotify','web'];
    var p={};campos.forEach(function(c){var el=$('g-'+c);if(el)p[c]=el.value.trim();});
    $('gGuardar').disabled=true;
    try{

      if(!r||!r.ok)throw new Error();

      guia();

  /* EL MISMO RECORTADOR DE SIEMPRE. Javi, 4-oct-2026: «el subir foto tiene el
     sistema de centrar que tenemos diseñado?». Lo tenemos desde hace meses
     (sinc-crop) y lo usan la ficha de experiencia y el alta de eventos; aquí
     faltaba. Sin él, una foto vertical de alguien del equipo salía cortada por
     la mitad y nadie entendía por qué. Si por lo que sea no cargó el
     recortador, se sube tal cual antes que dejar a nadie sin poder subir. */
  function leeDataUri(b){
    return new Promise(function(res,rej){
      var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej;
      fr.readAsDataURL(b);
    });
  }
  /* 7-oct-2026, Victor: «no le deja subir la foto». No es que no dejara: el
     recortador devolvía vacío y arriba se hacía `if(!img) return;` — sin aviso,
     sin foto, sin error. Desde fuera eso es exactamente «no me deja». Ahora se
     distingue cerrar a propósito (se avisa) de que el recortador se rompa o se
     quede colgado (se sube la foto tal cual, que es mejor que dejar a alguien
     sin poder subir). */
  async function conRecorte(file, titulo, cual){
    if(!window.sincCrop) return await leeDataUri(file);
    var blob=null, rompio=false;
    try{
      blob = await new Promise(function(res,rej){
        var t=setTimeout(function(){ rej(new Error('el recortador no respondió')); }, 120000);
        try{
          sincCrop.open(file, {titulo:titulo, only:cual}, function(r){
            clearTimeout(t);
            res(r ? (cual==='v' ? (r.vBlob||r.hBlob) : (r.hBlob||r.vBlob)) : null);
          });
        }catch(x){ clearTimeout(t); rej(x); }
      });
    }catch(_){ rompio=true; }
    if(rompio){ toast('El recortador falló; subimos la foto tal cual.'); return await leeDataUri(file); }
    if(!blob){ toast('No se subió nada: se cerró el recortador sin guardar.',true); return null; }
    return await leeDataUri(blob);
  }

  async function callFn(nombre,body){
    var r=await fetch(SB+'/functions/v1/'+nombre,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body||{})});
    var j=null;try{j=await r.json();}catch(_){} return {ok:r.ok,data:j};

  /* Cobros en línea: el productor conecta su Stripe (cuenta Connect propia). El
     estado y la liga de alta los da la función productora-stripe-alta, con el
     token del portal. Los datos bancarios los escribe él en Stripe, no aquí. */
  async function cargaStripe(){
    var box=$('stripeBox'); if(!box) return;
    var r=await callFn('productora-stripe-alta',{accion:'estado',token:TOK});
    var d=r.data||{};
    if(r.ok && d.stripe_charges_enabled){
      box.innerHTML='<div style="background:#E8F5E9;color:#1B5E20;border-radius:10px;padding:11px 13px;font-size:14px">✓ Tu Stripe está conectado. Ya puedes vender boletos en línea.</div>';
      return;
    }
    var yaEmpezo = r.ok && d.alta && !d.stripe_charges_enabled;
    box.innerHTML='<button class="btn" id="stripeBtn">'+(yaEmpezo?'Continuar mi alta de Stripe':'Conectar mi Stripe')+'</button>'
      +(yaEmpezo?'<div class="hint" style="margin-top:8px">Tu alta quedó a medias; termínala para poder cobrar.</div>':'');
    $('stripeBtn').onclick=conectaStripe;
  }
  async function conectaStripe(){
    var b=$('stripeBtn'); if(b){b.disabled=true;b.textContent='Abriendo Stripe…';}
    var r=await callFn('productora-stripe-alta',{accion:'alta',token:TOK,origen:location.origin});
    if(r.ok && r.data && r.data.url){ location.href=r.data.url; return; }
    toast((r.data&&r.data.error)||'No se pudo abrir el alta de Stripe',true);
    if(b){b.disabled=false;b.textContent='Conectar mi Stripe';}
  }
  /* LA COMISIÓN, CON SU CUENTA HECHA. Javi, 4-oct-2026: «pon la comisión que se
     cobraría y un ejemplo». Decir «el Ateneo retiene su comisión» no le dice
     nada a quien va a poner el precio de su boleto: lo que necesita saber es
     cuánto le queda. El porcentaje sale de su propia ficha, así que si se le
     negocia otro, aquí cambia solo. */
  function pesos(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
  function comisionCaja(f){
    /* SIN PORCENTAJE NO SE INVENTA UNO. Javi, 10-oct-2026: «quita lo del 35
       porque puede variar». Antes, a una productora sin comisión puesta en su
       ficha esta caja le decía que el Ateneo retiene el 35% —un número que
       nadie había pactado con ella, y encima con el ejemplo en pesos hecho—.
       Si no está en su ficha, se le dice de dónde sale y se acabó. */
    /* El porcentaje llega ya resuelto desde prod_portal_ficha: el total pactado
       si lo tiene, y si no la suma de su propio desglose (de serie, 35). Solo
       llega vacío si no tiene ni desglose. */
    var pct = (f && f.comision_pct != null) ? Number(f.comision_pct) : null;
    if (pct == null) {
      return '<div class="comi">'+
        '<div class="comi-t">El Ateneo retiene una comisión de cada boleto que se venda en línea. El resto es tuyo.</div>'+
        '<div class="comi-p">El porcentaje es el que lleves en tu convenio; en cuanto esté puesto lo verás aquí '+
          'con la cuenta hecha. Si no lo tienes claro, escríbenos antes de poner precio.</div>'+
      '</div>';
    }
    var ej = 200, reten = Math.round(ej*pct/100), queda = ej - reten;
    return '<div class="comi">'+
      '<div class="comi-t">El Ateneo retiene el <b>'+pct+'%</b> de cada boleto que se venda en línea. El resto es tuyo.</div>'+
      '<div class="comi-e">'+
        '<div><span>Boleto de</span><b>'+pesos(ej)+'</b></div>'+
        '<div><span>Se queda el Ateneo</span><b>'+pesos(reten)+'</b></div>'+
        '<div class="tu"><span>Te llega a ti</span><b>'+pesos(queda)+'</b></div>'+
      '</div>'+
      /* LOS DOS NUMEROS A LA VISTA. 14-oct-2026: el porcentaje es del precio
         que paga el cliente; quien lo cuenta sobre lo que le queda saca otra
         cifra mayor y cree que se la subieron. Se dicen las dos. */
      '<div class="comi-p"><b>El '+pct+'% es del precio que paga el cliente</b>, no un recargo sobre lo tuyo'+
        (pct<100 ? '; sobre los '+pesos(queda)+' que te quedan equivale a un '+
                   (pct/(100-pct)*100).toFixed(1).replace('.',',')+'%, que es la misma cantidad contada al revés' : '')+
        '. Se parte en el mismo cobro: no hay que pasarte nada después. '+
        'Lo que Stripe cobra por procesar la tarjeta va aparte y lo descuenta Stripe de tu depósito.</div>'+
    '</div>';
  }

  /* Subir un papel: se manda como data URI a prod-doc, que lo deja en el bucket
     privado y lo apunta en productora_docs. */
  var DOCS=[];
  async function cargaDocs(){
    try{
      var r=await callFn('prod-doc',{accion:'lista',token:TOK});
      DOCS=(r&&r.data&&r.data.docs)||[];
    }catch(_){ DOCS=[]; }
    ['csf','ine','pasaporte','poliza'].forEach(function(t){
      var e=document.getElementById('d-'+t); if(!e) return;
      var mio=DOCS.filter(function(d){return d.tipo===t;})[0];
      if(mio){
        e.className='est ok';
        e.textContent='Recibido '+new Date(mio.created_at).toLocaleDateString('es-MX');
        /* LA PÓLIZA AVISA UN MES ANTES. Javi, 4-oct-2026. Una póliza vencida
           deja un evento sin cobertura, así que no basta con guardarla: hay que
           decirlo a tiempo, y en días, no en una fecha que nadie resta. */
        if(t==='poliza' && mio.vigencia){
          var dias=Math.ceil((new Date(mio.vigencia+'T12:00:00')-new Date())/86400000);
          if(dias<0){ e.className='est mal'; e.textContent='Venció el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX')+' · súbenos la nueva'; }
          else if(dias<=30){ e.className='est ojo'; e.textContent='Vence en '+dias+(dias===1?' día':' días')+' · ve pidiendo la renovación'; }
          else { e.textContent='Vale hasta el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX'); }
        }
      }else{
        e.className='est'; e.textContent='Falta';
      }
    });
    var falta = !DOCS.some(function(d){return d.tipo==='csf';}) ||
                !DOCS.some(function(d){return d.tipo==='ine'||d.tipo==='pasaporte';});
    var m=document.getElementById('msgDoc');
    if(m) m.textContent = falta
      ? 'Nos falta la constancia y una identificación (INE o pasaporte).'
      : 'Ya tenemos tus papeles. Gracias.';
  }
  function enlazaDocs(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'),function(inp){
      inp.onchange=async function(){
        var f=inp.files && inp.files[0]; if(!f) return;
        var m=document.getElementById('msgDoc');
        if(f.size > 15*1024*1024){ if(m)m.textContent='Ese archivo pesa más de 15 MB.'; inp.value=''; return; }
        if(m)m.textContent='Subiendo '+f.name+'…';
        var lector=new FileReader();
        lector.onload=async function(){
          try{
            var t=inp.getAttribute('data-doc');
            var vg=(t==='poliza' && $('c-poliza_vigencia')) ? $('c-poliza_vigencia').value : null;
            if(t==='poliza' && !vg){ if(m)m.textContent='Pon hasta qué día vale la póliza antes de subirla.'; inp.value=''; return; }
            var r=await callFn('prod-doc',{accion:'subir',token:TOK,
              tipo:t, nombre:f.name, archivo:lector.result, vigencia:vg});
            if(!(r&&r.ok)||(r.data&&r.data.error)) throw new Error((r.data&&r.data.error)||'No se pudo subir');
            if(m)m.textContent='Listo, lo recibimos.';
            cargaDocs();
          }catch(x){ if(m)m.textContent=x.message; }
          inp.value='';
        };
        lector.readAsDataURL(f);
      };
    });
  }

  /* El contrato: se lee siempre, se firma cuando Casa Pepe lo habilita. */
  /* CADA PASO, ABIERTO DEBAJO DEL CAMINO.
     No se abre otra pantalla: el paso se despliega en #pasoCaja, se guarda, y
     se vuelve a pintar el camino con un paso menos. Así nadie se pierde de
     vuelta y se ve el avance. */
  async function abrePaso(cual){
    var caja=$('pasoCaja'); if(!caja)return;
    var f=FICHA||{};
    var fisica=(f.tipo_persona==='fisica'||f.tipo_persona==='fisica_sin');

    if(cual==='datos'){
      /* LA FIGURA, PREGUNTADA. Javi, 16-oct-2026: a UNDERCORP «no le deja
         seleccionar persona física sin actividad empresarial». No se lo dejaba
         porque este paso nunca se lo preguntaba: deducía la figura de la ficha,
         y con la ficha en blanco daba por hecho que había razón social y RFC.
         Quien no tiene actividad empresarial no tiene ninguno de los dos, así
         que se queda mirando un campo que no puede llenar. */
      caja.innerHTML='<div class="card"><h3>Tus datos</h3>'+
        '<div class="hint">Como vienen en tu constancia de situación fiscal. Si eres persona física sin actividad empresarial, con la CURP basta.</div>'+
        '<div class="fld" style="margin-top:12px"><label>Cómo facturas</label>'+
          '<select id="pdTipo">'+
            '<option value="">—</option>'+
            '<option value="moral"'+(f.tipo_persona==='moral'?' selected':'')+'>Persona moral</option>'+
            '<option value="fisica"'+(f.tipo_persona==='fisica'?' selected':'')+'>Persona física con actividad empresarial</option>'+
            '<option value="fisica_sin"'+(f.tipo_persona==='fisica_sin'?' selected':'')+'>Persona física sin actividad empresarial</option>'+
          '</select></div>'+
        '<div class="fld" style="margin-top:10px"><label id="pdLabRazon">'+(fisica?'Nombre completo':'Razón social')+'</label>'+
          '<input id="pdRazon" value="'+esc(f.razon_social||'')+'"></div>'+
        '<div class="fld" style="margin-top:10px" id="pdFldRfc"'+(f.tipo_persona==='fisica_sin'?' hidden':'')+'><label>RFC</label>'+
          '<input id="pdRfc" value="'+esc(f.rfc||'')+'" autocapitalize="characters" spellcheck="false">'+
          '<div class="ay">Déjalo vacío si no tienes y pon tu CURP abajo.</div></div>'+
        '<div class="fld" style="margin-top:10px"><label>CURP</label>'+
          '<input id="pdCurp" value="'+esc(f.curp||'')+'" autocapitalize="characters" spellcheck="false"></div>'+
        '<div class="fld" style="margin-top:10px"><label>Correo de avisos</label>'+
          '<input id="pdMail" type="email" value="'+esc(f.email_notificaciones||f.email||'')+'">'+
          '<div class="ay">Aquí te avisamos de cada reserva que entre.</div></div>'+
        '<div class="ft" style="margin-top:14px"><button class="btn" id="pdGuardar">Guardar y seguir</button></div>'+
        '<div id="pdMsg" class="mini" style="margin-top:8px"></div></div>';
      /* El nombre y el RFC cambian con la figura, en el momento. */
      $('pdTipo').onchange=function(){
        var t=this.value, fis=(t==='fisica'||t==='fisica_sin');
        $('pdLabRazon').textContent = fis?'Nombre completo':'Razón social';
        $('pdFldRfc').hidden = (t==='fisica_sin');
      };
      $('pdGuardar').onclick=async function(){
        var tipo=($('pdTipo').value||''),
            razon=($('pdRazon').value||'').trim(), rfc=($('pdRfc').value||'').trim().toUpperCase(),
            curp=($('pdCurp').value||'').trim().toUpperCase(), mail=($('pdMail').value||'').trim();
        if(!tipo){ $('pdMsg').textContent='Falta decir cómo facturas.'; return; }
        if(!razon){ $('pdMsg').textContent='Falta tu nombre o razón social.'; return; }
        /* Sin actividad empresarial no hay RFC: ahí la CURP es la identidad. */
        if(tipo==='fisica_sin'){
          if(!curp){ $('pdMsg').textContent='Hace falta tu CURP.'; return; }
          rfc='';
        }else if(!rfc && !curp){ $('pdMsg').textContent='Hace falta el RFC o la CURP.'; return; }
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail)){ $('pdMsg').textContent='Ese correo no se ve bien.'; return; }
        this.disabled=true; var a=this.textContent; this.textContent='Guardando…';
        try{
          await rpc('prod_portal_update',{p_token:TOK,p:{tipo_persona:tipo,razon_social:razon,rfc:rfc,curp:curp,email_notificaciones:mail}});
          FICHA=await rpc('prod_portal_ficha',{p_token:TOK});
          toast('Datos guardados'); shell();
        }catch(x){ $('pdMsg').textContent='No se pudo guardar: '+x.message; this.disabled=false; this.textContent=a; }
      };
      return;
    }

    if(cual==='poliza'){
      caja.innerHTML='<div class="card"><h3>Tu póliza</h3>'+
        '<div class="hint">Responsabilidad civil que cubra tus eventos en el Ateneo. Si no tienes, marca la casilla de abajo y la cotizamos contigo: no te frena el alta.</div>'+
        '<div class="fld" style="margin-top:12px"><label>Aseguradora</label><input id="ppAseg" value="'+esc(f.poliza_aseguradora||'')+'"></div>'+
        '<div class="fld" style="margin-top:10px"><label>Número de póliza</label><input id="ppNum" value="'+esc(f.poliza_numero||'')+'" spellcheck="false"></div>'+
        '<div class="fld" style="margin-top:10px"><label>Vigencia</label><input id="ppVig" type="date" value="'+esc(f.poliza_vigencia||'')+'"></div>'+
        '<label class="mini" style="display:flex;gap:8px;align-items:flex-start;margin-top:12px;cursor:pointer">'+
          '<input type="checkbox" id="ppCot"'+(f.poliza_cotizar?' checked':'')+'> '+
          '<span>No tengo póliza todavía: <b>consíganmela ustedes</b>. Entiendo que sin póliza vigente aplica la cláusula del convenio.</span></label>'+
        '<div class="ft" style="margin-top:14px"><button class="btn" id="ppGuardar">Guardar y seguir</button></div>'+
        '<div id="ppMsg" class="mini" style="margin-top:8px"></div></div>';
      $('ppGuardar').onclick=async function(){
        var cot=$('ppCot').checked;
        var ase=($('ppAseg').value||'').trim(), num=($('ppNum').value||'').trim(), vig=($('ppVig').value||'').trim();
        if(!cot && !(ase&&num&&vig)){ $('ppMsg').textContent='Pon aseguradora, número y vigencia, o marca que te la consigamos.'; return; }
        this.disabled=true; var a=this.textContent; this.textContent='Guardando…';
        try{
          await rpc('prod_portal_update',{p_token:TOK,p:{poliza_aseguradora:ase,poliza_numero:num,
            poliza_vigencia:vig,poliza_cotizar:cot?'true':'false',tiene_poliza:(!cot&&ase&&num)?'true':'false'}});
          FICHA=await rpc('prod_portal_ficha',{p_token:TOK});
          toast(cot?'Anotado: la vemos contigo':'Póliza guardada'); shell();
        }catch(x){ $('ppMsg').textContent='No se pudo guardar: '+x.message; this.disabled=false; this.textContent=a; }
      };
      return;
    }

    if(cual==='stripe'){
      caja.innerHTML='<div class="card"><h3>Tu Stripe</h3>'+
        '<div class="hint">El huésped paga una vez y <b>el cobro cae directo en tu cuenta</b>; de ahí se descuenta sola nuestra comisión. '+
        'No nos das tu CLABE: la capturas tú dentro de Stripe y solo tú la ves.<br><br>'+
        'Si ya tienes cuenta de Stripe, al abrir el alta puedes entrar con ella.</div>'+
        '<div class="ft" style="margin-top:14px"><button class="btn" id="psIr">Abrir mi alta de Stripe</button></div>'+
        '<div id="psMsg" class="mini" style="margin-top:8px"></div></div>';
      $('psIr').onclick=async function(){
        this.disabled=true; var a=this.textContent; this.textContent='Hablando con Stripe…';
        try{
          var r=await callFn('productora-stripe-alta',{accion:'alta',token:TOK,origen:location.origin});
          var d=r&&r.data;
          if(!r||!r.ok||!d||!d.url) throw new Error((d&&d.error)||'no se pudo abrir');
          try{ if(window.top&&window.top!==window){ window.top.location.href=d.url; } else { location.href=d.url; } }
          catch(_){ window.open(r.url,'_blank','noopener'); }
        }catch(x){ $('psMsg').textContent='No se pudo abrir Stripe: '+x.message; this.disabled=false; this.textContent=a; }
      };
      return;
    }

    if(cual==='firma'){
      caja.innerHTML='<div class="card"><h3>Tu convenio</h3><div id="contratoBox">Cargando…</div></div>';
      cargaContrato();
      return;
    }
  }

  async function cargaContrato(){
    var box=$('contratoBox'); if(!box) return;
    var c=null;
    try{ c=await rpc('prod_portal_contrato',{p_token:TOK}); }catch(_){}
    if(!c||c.error){ box.textContent='No pudimos cargar tu contrato.'; return; }
    var t=c.terminos||{};
    var h='';
    if(c.firmado_at){
      h+='<div class="firmado">✓ Firmado el '+new Date(c.firmado_at).toLocaleDateString('es-MX')+
         ' por <b>'+esc(c.firmante||'')+'</b>'+(c.version?' · versión '+esc(c.version):'')+'</div>';
    }else if(c.habilitado){
      h+='<div class="mini">Tu contrato ya está listo para firmar'+(c.version?' (versión '+esc(c.version)+')':'')+'.</div>';
    }else{
      h+='<div class="mini">Todavía no habilitamos tu contrato. Puedes leerlo y leer las condiciones; te avisamos cuando se pueda firmar.</div>';
    }
    if(c.folio) h+='<div class="mini" style="margin-top:4px">Folio <b>'+esc(c.folio)+'</b>'+
                   (c.plantilla_version?' · texto '+esc(c.plantilla_version):'')+'</div>';
    /* La poliza manda en la DECIMA QUINTA: que lo vea aquí, junto al contrato,
       y no solo en su tarjeta. Javi, 4-oct-2026. */
    if(c.poliza_aviso) h+='<div class="mini" style="margin-top:4px;color:'+
         (/NO TENER|VENCIDA|sin fecha|hay que/.test(c.poliza_aviso)?'#9E3B2E':'#1D6B4A')+
         '">Responsabilidad civil: '+esc(c.poliza_aviso)+'</div>';
    h+='<div class="ft" style="justify-content:flex-start;gap:8px;margin-top:10px">'+
         '<button class="btn ghost sm" id="verContrato">Ver contrato</button>'+
         (t.url?'<a class="btn ghost sm" href="'+esc(t.url)+'" target="_blank" rel="noopener">Términos y condiciones</a>'
               :'<button class="btn ghost sm" id="verTyC">Términos y condiciones</button>')+
       '</div>'+
       '<div id="contratoTexto" class="legal" style="display:none"></div>';
    if(c.habilitado && !c.firmado_at){
      h+='<div class="firmar">'+
           '<label class="chk"><input type="checkbox" id="fAcepta"> He leído el contrato y las condiciones, y los acepto</label>'+
           '<div class="alta"><input id="fNombre" placeholder="Tu nombre completo, como firma">'+
             '<button class="btn sm" id="fBtn">Firmar</button></div>'+
         '</div>';
    }
    box.innerHTML=h;

    /* El contrato viene en markdown. Si se pinta con textContent se lee con
       asteriscos por todos lados, y un contrato que se ve mal no se lee. Esto
       no es un parser: negritas, titulos, guiones y la raya, nada mas. */
    function legalHtml(txt){
      var l=String(txt||'').split('\n'), out=[], i, s, m;
      function neg(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
      for(i=0;i<l.length;i++){
        s=l[i];
        /* Los anexos vienen como tabla de markdown: si se pintan linea por
           linea se leen a puros pipes. */
        if(/^\s*\|.*\|\s*$/.test(s)){
          var fs=[], j=i;
          while(j<l.length && /^\s*\|.*\|\s*$/.test(l[j])){
            var cel=l[j].trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
            if(!/^[\s|:-]+$/.test(l[j])) fs.push(cel);
            j++;
          }
          var tb='<table style="width:100%;border-collapse:collapse;margin:9px 0;font-size:12px">', k, c;
          for(k=0;k<fs.length;k++){
            tb+='<tr>';
            for(c=0;c<fs[k].length;c++)
              tb+='<td style="border:1px solid var(--linea,#E2DCCF);padding:4px 6px;'+
                  (k===0?'font-weight:700;background:rgba(0,0,0,.035)':'')+'">'+neg(fs[k][c].trim())+'</td>';
            tb+='</tr>';
          }
          out.push(tb+'</table>'); i=j-1; continue;
        }
        if(/^\s*---+\s*$/.test(s)){ out.push('<hr style="border:0;border-top:1px solid var(--linea,#E2DCCF);margin:12px 0">'); continue; }
        s=esc(s);
        s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>');
        if((m=/^##\s+(.*)$/.exec(s)))      { out.push('<div style="font-weight:700;font-size:14px;margin:14px 0 4px">'+m[1]+'</div>'); continue; }
        if((m=/^#\s+(.*)$/.exec(s)))       { out.push('<div style="font-weight:700;font-size:15.5px;margin:0 0 6px">'+m[1]+'</div>'); continue; }
        if((m=/^[-*]\s+(.*)$/.exec(s)))    { out.push('<div style="margin:3px 0 3px 14px;text-indent:-10px">· '+m[1]+'</div>'); continue; }
        if((m=/^(\d+)\.\s+(.*)$/.exec(s))){ out.push('<div style="margin:3px 0 3px 16px;text-indent:-12px">'+m[1]+'. '+m[2]+'</div>'); continue; }
        out.push(s ? '<div style="margin:7px 0">'+s+'</div>' : '');
      }
      return out.join('');
    }
    function muestra(txt){
      var d=$('contratoTexto');
      d.style.display = d.style.display==='none' ? 'block' : 'none';
      if(txt) d.innerHTML = legalHtml(txt);
      else    d.textContent = 'Todavía no hay texto cargado. Pídenoslo y te lo mandamos.';
    }
    if($('verContrato')) $('verContrato').onclick=function(){ muestra(c.cuerpo); };
    if($('verTyC'))      $('verTyC').onclick=function(){ muestra(t.texto); };

    if($('fBtn')) $('fBtn').onclick=async function(){
      var b=$('fBtn'); b.disabled=true;
      try{
        var r=await rpc('prod_portal_firma',{p_token:TOK,
          p_nombre:($('fNombre').value||'').trim(), p_acepta:$('fAcepta').checked});
        if(!r||!r.ok) throw new Error((r&&r.error)||'No se pudo firmar');
        /* Firmar es el último paso del camino: se refresca la ficha y se
           repinta, y shell() ya la mete en Mi productora. Antes solo se
           repintaba el contrato y se quedaba mirando su propia firma. */
        toast('Contrato firmado');
        try{ FICHA=await rpc('prod_portal_ficha',{p_token:TOK}); }catch(_){}
        if(FICHA && FICHA.contrato_firmado_at){ shell(); } else { await cargaContrato(); }
      }catch(e){ toast(e.message,true); b.disabled=false; }
    };
  }

  async function guardaCuenta(){
    var campos=['nombre_comercial','tipo_persona','razon_social','rfc','curp','ciudad','email_notificaciones','email_reportes','email_facturacion','whatsapp','instagram','web','poliza_aseguradora','poliza_numero','poliza_suma','poliza_vigencia'];
    var p={};campos.forEach(function(c){var el=$('c-'+c);if(el)p[c]=el.value.trim();});
    p.tiene_poliza   = ($('c-tiene_poliza')  && $('c-tiene_poliza').checked)  ? 'true' : 'false';
    p.poliza_cotizar = ($('c-poliza_cotizar')&& $('c-poliza_cotizar').checked)? 'true' : 'false';
    $('cGuardar').disabled=true;
    try{var r=await rpc('prod_portal_update',{p_token:TOK,p:p});if(!r||!r.ok)throw new Error();FICHA=await rpc('prod_portal_ficha',{p_token:TOK});guia();toast('Guardado');}
    catch(e){toast('No se pudo guardar',true);}
    $('cGuardar').disabled=false;
  }

  (async function init(){
    /* Sin liga en la barra, pero con sesión: es suya, se recupera su liga y
       sigue. Nunca un login aquí dentro. */
    if(!TOK){
      TOK=await miLiga();
      if(TOK){
        try{ history.replaceState(null,'',location.pathname+'?t='+encodeURIComponent(TOK)+location.hash); }catch(_){}
      }
    }
    if(!TOK){FICHA=null;shell();return;}
    try{ FICHA=await rpc('prod_portal_ficha',{p_token:TOK}); EV=await rpc('prod_portal_eventos',{p_token:TOK}); }catch(e){ FICHA=null; }
    try{ ESPACIOS=await rpc('prod_portal_espacios',{p_token:TOK})||[]; }catch(e){ ESPACIOS=[]; }
    shell();
    /* ENTRAR DIRECTO A UN EVENTO. El portal del hotelero manda aquí con
       ?ev=<id> al tocar una tarjeta, igual que las experiencias abren su ficha:
       el que viene a arreglar su clase de cumbia no tiene por qué buscarla en
       una tabla. Si el id no es suyo, no pasa nada: abre() no lo encuentra. */
    try{
      var _ev=new URLSearchParams(location.search).get('ev')||'';
      if(_ev && (EV||[]).some(function(x){return String(x.id)===_ev;})) abre(_ev);
    }catch(_){}
  })();
})();
</script>
