<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis eventos · Ateneo</title>
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F3EAD6;--bad:#9E3B2E;--shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
.hd{padding:6px 0 12px}.hd h1{margin:0;font-size:20px;font-weight:800}.hd .sub{color:var(--muted);font-size:13px;margin-top:3px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}.hint{color:var(--muted);font-size:12.5px;margin-bottom:12px;line-height:1.45}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fld label{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;text-transform:uppercase;letter-spacing:.05em}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:8px;font:inherit;font-size:13.5px;background:var(--surface)}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}.btn.sm{padding:5px 10px;font-size:12px}
.tag{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:700;background:#EFE9DD;color:#3A3630}
.tag.ok{background:var(--ok-bg);color:var(--ok)}.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.bad{background:#F4E2DE;color:var(--bad)}
.chk{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13.5px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--rule);vertical-align:top}th{font-size:11px;text-transform:uppercase;color:var(--muted)}
.aviso{background:var(--warn-bg);border:1px solid #E6D3AE;border-radius:10px;padding:10px 12px;font-size:12.5px;color:#6B4C10;line-height:1.5}
.mini{color:var(--muted);font-size:12px}.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.chip{font-size:12.5px;border:1.5px solid var(--rule);border-radius:999px;padding:5px 12px;cursor:pointer;background:var(--surface);user-select:none}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;font-weight:700;display:none;z-index:60}.toast.err{background:var(--bad)}
[data-ef]{display:none}
</style><link rel="icon" type="image/png" href="/dash-192.png">
</head><body>
<div class="wrap" id="app"><div class="card">Cargando…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var TOK=''; try{ TOK=new URLSearchParams(location.search).get('t')||''; }catch(e){}
  var PERFIL=null, EV=[], AG=[], PR=[], evCur=null;
  var EVT=[
    {k:'reserva_horas',n:'Reserva por horas',f:['fecha','hora','precio_hora','aforo']},
    {k:'congreso',      n:'Congreso / conferencia',f:['fechas','aforo','agenda','precios']},
    {k:'funcion',       n:'Función / show',f:['fecha','hora','duracion','aforo','cobro_taquilla','precios']},
    {k:'expo',          n:'Exposición',f:['fechas','horario_visita','cobro_expo']},
    {k:'taller',        n:'Taller',f:['fecha','hora','duracion','cupo','materiales','precio_persona']},
    {k:'grabacion',     n:'Grabación / rodaje',f:['fechas','hora','tipo_produccion','crew','cobro_renta']},
    {k:'otro',          n:'Otro',f:['fecha','aforo']}
  ];
  function evtDef(k){return EVT.filter(function(x){return x.k===k;})[0]||EVT[0];}
  function $(id){return document.getElementById(id);}
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function toast(t,err){var e=$('toast');e.textContent=t;e.className='toast'+(err?' err':'');e.style.display='block';setTimeout(function(){e.style.display='none';},2600);}
  function money(n){return '$'+Math.round(n||0).toLocaleString('es-MX');}
  function fmtCuando(e){if(e.fecha_inicio&&e.fecha_fin&&String(e.fecha_inicio).slice(0,10)!==String(e.fecha_fin).slice(0,10))return String(e.fecha_inicio).slice(0,10)+'→'+String(e.fecha_fin).slice(0,10);return e.fecha_inicio?String(e.fecha_inicio).slice(0,16).replace('T',' '):'—';}
  async function rpc(fn,body){var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:{'Content-Type':'application/json','apikey':KEY,'Authorization':'Bearer '+KEY},body:JSON.stringify(body||{})});if(!r.ok)throw new Error(fn+' '+r.status);return r.json();}

  function estadoTag(e){var m={borrador:'borrador',propuesto:'en revisión',confirmado:'confirmado',publicado:'publicado',realizado:'realizado',cancelado:'cancelado'};var c=(e.estado==='publicado'||e.estado==='confirmado')?'ok':(e.estado==='cancelado'?'bad':'warn');return '<span class="tag '+c+'">'+esc(m[e.estado]||e.estado)+'</span>';}

  function pinta(){
    if(!PERFIL){$('app').innerHTML='<div class="card"><h3>Liga no válida</h3><div class="hint">Pídele a Casa Pepe tu liga personal para entrar.</div></div>';return;}
    var espacio=PERFIL.espacio||'';
    $('app').innerHTML=
      '<div class="hd"><h1>🎬 '+esc(PERFIL.nombre||'Tu productora')+'</h1>'+
        '<div class="sub">'+esc(PERFIL.tipo_nombre||'')+(espacio?' · '+esc(espacio):'')+'</div></div>'+
      '<div class="card"><h3>Tus eventos</h3>'+
        '<div class="hint">Crea tus eventos aquí. Elige el tipo y solo aparece lo que ese tipo necesita. Lo que mandes queda <b>en revisión</b> hasta que Casa Pepe lo valide y publique.</div>'+
        '<table><thead><tr><th>Evento</th><th>Tipo</th><th>Cuándo</th><th>Estado</th><th></th></tr></thead><tbody id="tbE"></tbody></table>'+
        '<div class="ft" style="justify-content:flex-start;margin-top:10px"><button class="btn" id="evNuevo">+ Nuevo evento</button></div>'+
      '</div>'+
      '<div class="card" id="evForm" style="display:none"></div>';
    $('evNuevo').onclick=nuevo; pintaTabla();
  }
  function pintaTabla(){
    $('tbE').innerHTML=EV.map(function(e){
      return '<tr><td><b>'+esc(e.nombre||'(sin nombre)')+'</b>'+(e.es_gratis?' <span class="tag">gratis</span>':'')+'</td><td class="mini">'+esc(evtDef(e.tipo).n)+'</td><td class="mini">'+esc(fmtCuando(e))+'</td><td>'+estadoTag(e)+'</td><td><button class="btn ghost sm" data-ev="'+e.id+'">Abrir</button></td></tr>';
    }).join('')||'<tr><td colspan="5" class="mini">Todavía nada. Crea tu primer evento.</td></tr>';
    Array.prototype.forEach.call($('tbE').querySelectorAll('[data-ev]'),function(b){b.onclick=function(){abre(b.getAttribute('data-ev'));};});
  }

  function formHTML(){
    return '<h3 id="evTit">Nuevo evento</h3>'+
    '<div class="fgrid"><div class="fld"><label>Tipo de evento</label><select id="evTipo"></select></div>'+
    '<div class="fld"><label>Nombre</label><input id="ev-nombre"></div>'+
    '<div class="fld"><label>Espacio</label><input id="ev-espacio"></div></div>'+
    '<div class="fld" style="margin-top:10px"><label>Descripción</label><textarea id="ev-desc" rows="2"></textarea></div>'+
    '<div class="fgrid" style="margin-top:10px">'+
      '<div class="fld" data-ef="fecha"><label>Fecha</label><input type="date" id="ev-fecha"></div>'+
      '<div class="fld" data-ef="fechas"><label>Del</label><input type="date" id="ev-desde"></div>'+
      '<div class="fld" data-ef="fechas"><label>Al</label><input type="date" id="ev-hasta"></div>'+
      '<div class="fld" data-ef="hora"><label>Hora inicio</label><input type="time" id="ev-hora-ini"></div>'+
      '<div class="fld" data-ef="hora"><label>Hora fin</label><input type="time" id="ev-hora-fin"></div>'+
      '<div class="fld" data-ef="duracion"><label>Duración (min)</label><input type="number" id="ev-duracion"></div>'+
      '<div class="fld" data-ef="aforo"><label>Aforo</label><input type="number" id="ev-aforo"></div>'+
      '<div class="fld" data-ef="cupo"><label>Cupo</label><input type="number" id="ev-cupo"></div>'+
      '<div class="fld" data-ef="horario_visita"><label>Horario de visita</label><input id="ev-horario" placeholder="12:00–19:00"></div>'+
      '<div class="fld" data-ef="materiales"><label>Materiales</label><input id="ev-materiales"></div>'+
      '<div class="fld" data-ef="tipo_produccion"><label>Tipo de producción</label><select id="ev-prod"><option value="">—</option><option>Foto</option><option>Video</option><option>Podcast</option></select></div>'+
      '<div class="fld" data-ef="crew"><label>Tamaño de crew</label><input type="number" id="ev-crew"></div>'+
    '</div>'+
    '<div class="fgrid" style="margin-top:10px">'+
      '<div class="fld" data-ef="precio_hora"><label>Precio por hora</label><input type="number" id="ev-precio-hora"></div>'+
      '<div class="fld" data-ef="precio_persona"><label>Precio por persona</label><input type="number" id="ev-precio-persona"></div>'+
      '<div class="fld" data-ef="cobro_renta"><label>Modelo de renta</label><select id="ev-renta"><option value="renta_hora">Por hora</option><option value="renta_dia">Por día</option></select></div>'+
      '<div class="fld" data-ef="cobro_renta"><label>Precio de renta</label><input type="number" id="ev-precio-renta"></div>'+
      '<div class="fld" data-ef="cobro_taquilla"><label>Modelo</label><select id="ev-taq"><option value="taquilla">Taquilla</option><option value="garantia">Garantía</option><option value="donativo">Donativo</option></select></div>'+
      '<div class="fld" data-ef="cobro_expo"><label>Modelo</label><select id="ev-expo"><option value="renta">Renta</option><option value="comision_obra">Comisión sobre venta de obra</option></select></div>'+
      '<div class="fld" data-ef="cobro_expo"><label>Precio / %</label><input type="number" id="ev-precio-expo"></div>'+
    '</div>'+
    '<label class="chk" style="margin-top:8px"><input type="checkbox" id="ev-gratis"> <b>Es gratis</b> (pasa por autorización de Casa Pepe)</label>'+
    '<div data-ef="agenda" style="margin-top:12px"><b style="font-size:13px">Agenda de ponencias</b>'+
      '<table style="margin-top:6px"><thead><tr><th>Día</th><th>Hora</th><th>Título</th><th>Ponente</th><th></th></tr></thead><tbody id="agBody"></tbody></table>'+
      '<button class="btn ghost sm" id="agMas" style="margin-top:6px" type="button">＋ Ponencia</button></div>'+
    '<div data-ef="precios" style="margin-top:12px"><b style="font-size:13px">Precios / boletos</b>'+
      '<div style="margin:6px 0"><span class="mini">Rápido:</span> <span class="chip" data-tier="General">General</span> <span class="chip" data-tier="VIP">VIP</span> <span class="chip" data-tier="Patrocinador">Patrocinador</span> <span class="chip" data-tier="Patrocinador Premium">Patrocinador Premium</span></div>'+
      '<table><thead><tr><th>Boleto</th><th>Precio</th><th>Cupo</th><th></th></tr></thead><tbody id="prBody"></tbody></table>'+
      '<button class="btn ghost sm" id="prMas" style="margin-top:6px" type="button">＋ Boleto</button></div>'+
    '<div class="ft"><button class="btn ghost" id="evCancel" type="button">Cancelar</button><button class="btn" id="evGuardar" type="button">Enviar a Casa Pepe</button></div>';
  }
  function wireForm(){
    $('evTipo').innerHTML=EVT.map(function(t){return '<option value="'+t.k+'">'+esc(t.n)+'</option>';}).join('');
    $('evTipo').onchange=filtra;
    $('agMas').onclick=function(){AG.push({fecha:null,hora:null,titulo:'',ponente:''});pintaAg();};
    $('prMas').onclick=function(){PR.push({nombre:'',precio:null,cupo:null});pintaPr();};
    Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(c){c.onclick=function(){PR.push({nombre:c.getAttribute('data-tier'),precio:null,cupo:null});pintaPr();};});
    $('evCancel').onclick=function(){$('evForm').style.display='none';};
    $('evGuardar').onclick=guardar;
  }
  function filtra(){var def=evtDef($('evTipo').value);document.querySelectorAll('[data-ef]').forEach(function(el){el.style.display=def.f.indexOf(el.getAttribute('data-ef'))>=0?'':'none';});if(PERFIL.espacio&&!$('ev-espacio').value)$('ev-espacio').value=PERFIL.espacio;}
  function pintaAg(){var inp='padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:13px;width:100%';
    $('agBody').innerHTML=AG.map(function(a,i){return '<tr><td><input type="date" data-ag="'+i+'" data-f="fecha" value="'+esc(a.fecha||'')+'" style="'+inp+'"></td><td><input type="time" data-ag="'+i+'" data-f="hora" value="'+esc(a.hora||'')+'" style="'+inp+'"></td><td><input data-ag="'+i+'" data-f="titulo" value="'+esc(a.titulo||'')+'" style="'+inp+'"></td><td><input data-ag="'+i+'" data-f="ponente" value="'+esc(a.ponente||'')+'" style="'+inp+'"></td><td><button class="btn ghost sm" data-agdel="'+i+'" type="button">×</button></td></tr>';}).join('');
    Array.prototype.forEach.call($('agBody').querySelectorAll('[data-ag]'),function(el){el.onchange=function(){AG[+el.getAttribute('data-ag')][el.getAttribute('data-f')]=el.value||null;};});
    Array.prototype.forEach.call($('agBody').querySelectorAll('[data-agdel]'),function(b){b.onclick=function(){AG.splice(+b.getAttribute('data-agdel'),1);pintaAg();};});}
  function pintaPr(){var inp='padding:6px 8px;border:1px solid var(--rule);border-radius:6px;font:inherit;font-size:13px;width:100%';
    $('prBody').innerHTML=PR.map(function(p,i){return '<tr><td><input data-pr="'+i+'" data-f="nombre" value="'+esc(p.nombre||'')+'" style="'+inp+'"></td><td><input type="number" data-pr="'+i+'" data-f="precio" value="'+(p.precio!=null?p.precio:'')+'" style="'+inp+'"></td><td><input type="number" data-pr="'+i+'" data-f="cupo" value="'+(p.cupo!=null?p.cupo:'')+'" style="'+inp+'"></td><td><button class="btn ghost sm" data-prdel="'+i+'" type="button">×</button></td></tr>';}).join('');
    Array.prototype.forEach.call($('prBody').querySelectorAll('[data-pr]'),function(el){el.onchange=function(){var v=el.value;if(el.getAttribute('data-f')!=='nombre')v=v===''?null:Number(v);PR[+el.getAttribute('data-pr')][el.getAttribute('data-f')]=v;};});
    Array.prototype.forEach.call($('prBody').querySelectorAll('[data-prdel]'),function(b){b.onclick=function(){PR.splice(+b.getAttribute('data-prdel'),1);pintaPr();};});}

  function abreForm(){ $('evForm').innerHTML=formHTML(); $('evForm').style.display=''; wireForm(); }
  function nuevo(){
    evCur=null;AG=[];PR=[];abreForm();
    $('evTit').textContent='Nuevo evento';$('evTipo').value='reserva_horas';
    filtra();pintaAg();pintaPr();window.scrollTo({top:$('evForm').offsetTop-10,behavior:'smooth'});
  }
  async function abre(id){
    evCur=EV.filter(function(e){return e.id===id;})[0];if(!evCur)return;
    AG=[];PR=[];
    try{ var d=await rpc('prod_portal_eventos',{p_token:TOK}); }catch(e){}
    abreForm();$('evTit').textContent='Editar evento';
    $('evTipo').value=evCur.tipo||'reserva_horas';
    $('ev-nombre').value=evCur.nombre||'';$('ev-espacio').value=evCur.espacio||'';$('ev-desc').value=evCur.descripcion||'';
    var fi=evCur.fecha_inicio?String(evCur.fecha_inicio):'';
    $('ev-fecha').value=fi?fi.slice(0,10):'';$('ev-desde').value=fi?fi.slice(0,10):'';
    $('ev-hasta').value=evCur.fecha_fin?String(evCur.fecha_fin).slice(0,10):'';
    $('ev-hora-ini').value=fi.length>=16?fi.slice(11,16):'';
    $('ev-hora-fin').value=evCur.fecha_fin&&String(evCur.fecha_fin).length>=16?String(evCur.fecha_fin).slice(11,16):'';
    $('ev-duracion').value=evCur.duracion_min||'';$('ev-aforo').value=evCur.aforo||'';$('ev-cupo').value=evCur.cupo||'';
    $('ev-horario').value=evCur.horario_visita||'';$('ev-materiales').value=evCur.materiales||'';
    $('ev-prod').value=evCur.tipo_produccion||'';$('ev-crew').value=evCur.crew_tam||'';
    $('ev-precio-hora').value=evCur.precio_por_hora||'';$('ev-precio-persona').value=evCur.precio||'';
    $('ev-precio-renta').value=evCur.precio||'';$('ev-precio-expo').value=evCur.precio||'';
    $('ev-gratis').checked=!!evCur.es_gratis;
    var ra=await fetch(SB+'/rest/v1/evento_agenda?select=*&evento_id=eq.'+id+'&order=orden',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});AG=ra.ok?await ra.json():[];
    var rp=await fetch(SB+'/rest/v1/evento_precios?select=*&evento_id=eq.'+id+'&order=orden',{headers:{'apikey':KEY,'Authorization':'Bearer '+KEY}});PR=rp.ok?await rp.json():[];
    filtra();pintaAg();pintaPr();window.scrollTo({top:$('evForm').offsetTop-10,behavior:'smooth'});
  }
  function combinaFH(f,h){if(!f)return null;return h?(f+'T'+h+':00'):(f+'T00:00:00');}
  async function guardar(){
    var tipo=$('evTipo').value,F=evtDef(tipo).f,g=$('ev-gratis').checked;
    var ev={tipo:tipo,nombre:$('ev-nombre').value.trim(),espacio:$('ev-espacio').value.trim(),descripcion:$('ev-desc').value.trim(),es_gratis:g};
    if(F.indexOf('fechas')>=0){ev.fecha_inicio=combinaFH($('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);ev.fecha_fin=combinaFH($('ev-hasta').value||$('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-fin').value:null);}
    else if(F.indexOf('fecha')>=0){ev.fecha_inicio=combinaFH($('ev-fecha').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);if(F.indexOf('hora')>=0&&$('ev-hora-fin').value)ev.fecha_fin=combinaFH($('ev-fecha').value,$('ev-hora-fin').value);}
    if(F.indexOf('duracion')>=0)ev.duracion_min=$('ev-duracion').value;
    if(F.indexOf('aforo')>=0)ev.aforo=$('ev-aforo').value;
    if(F.indexOf('cupo')>=0)ev.cupo=$('ev-cupo').value;
    if(F.indexOf('horario_visita')>=0)ev.horario_visita=$('ev-horario').value.trim();
    if(F.indexOf('materiales')>=0)ev.materiales=$('ev-materiales').value.trim();
    if(F.indexOf('tipo_produccion')>=0)ev.tipo_produccion=$('ev-prod').value;
    if(F.indexOf('crew')>=0)ev.crew_tam=$('ev-crew').value;
    if(!g){
      if(F.indexOf('precio_hora')>=0)ev.precio_por_hora=$('ev-precio-hora').value;
      if(F.indexOf('precio_persona')>=0)ev.precio=$('ev-precio-persona').value;
      if(F.indexOf('cobro_renta')>=0){ev.modelo_cobro=$('ev-renta').value;ev.precio=$('ev-precio-renta').value;}
      if(F.indexOf('cobro_taquilla')>=0)ev.modelo_cobro=$('ev-taq').value;
      if(F.indexOf('cobro_expo')>=0){ev.modelo_cobro=$('ev-expo').value;ev.precio=$('ev-precio-expo').value;}
    } else ev.modelo_cobro='gratis';
    if(!ev.nombre){toast('Falta el nombre del evento',true);return;}
    $('evGuardar').disabled=true;
    try{
      var ag=(F.indexOf('agenda')>=0)?AG:[], pr=(F.indexOf('precios')>=0)?PR:[];
      var r=await rpc('prod_portal_evento',{p_token:TOK,p_id:evCur?evCur.id:null,p_evento:ev,p_agenda:ag,p_precios:pr});
      if(!r||!r.ok)throw new Error((r&&r.error)||'error');
      toast('Enviado a Casa Pepe');$('evForm').style.display='none';
      EV=await rpc('prod_portal_eventos',{p_token:TOK});pintaTabla();
    }catch(e){ toast('No se pudo enviar',true); }
    $('evGuardar').disabled=false;
  }

  (async function init(){
    if(!TOK){pinta();return;}
    try{ PERFIL=await rpc('prod_portal',{p_token:TOK}); EV=await rpc('prod_portal_eventos',{p_token:TOK}); }catch(e){ PERFIL=null; }
    pinta();
  })();
})();
</script>
</body></html>
