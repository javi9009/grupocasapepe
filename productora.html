  /* NO SE MANDA UN EVENTO SIN DECIR DONDE NI CUANDO. 3-oct-2026.
     «Enviar a Casa Pepe» aceptaba cualquier cosa, incluida nada: por eso habia
     seis eventos esperando aprobacion SIN FECHA DE INICIO. Aprobar uno de esos
     no reserva nada, porque no hay nada que reservar. */
  /* ---------- LAS FOTOS ---------- */
  var FOTOS=[];
  /* ---------- LA GALERÍA DEL EVENTO ----------
     Javi, 10-oct-2026: «incluye el editor de foto de portada, galería y ajustar
     y borrar con el X». Antes la miniatura entera era el botón de borrar: tocar
     para ver una foto la borraba. Ahora cada una tiene su X, su «portada» y su
     «ajustar», que recorta de verdad —a 16:9, que es como sale en la ficha— y
     sustituye la original. */
  function pintaFotos(){
    var c=$('fotoLista'), av=$('fotoAviso'), bt=$('fotoMas');
    if(!c) return;
    if(!evCur||!evCur.id){
      c.innerHTML='';
      if(av) av.textContent='Súbelas cuando quieras: guardamos tu evento como borrador solo para poder colgarlas. '+
        'Sin al menos una foto no se puede poner a la venta.';
      if(bt) bt.disabled=false;
      return;
    }
    if(bt) bt.disabled=false;
    if(av) av.innerHTML=FOTOS.length
      ? 'La <b>portada</b> es la que sale en tu ficha y en la tarjeta. Las demás van en la galería del evento.'
      : 'Sin al menos una foto, el evento no se puede poner a la venta.';
    c.innerHTML=FOTOS.map(function(f,i){
      var esVideo=(f.tipo==='video');
      return '<div style="position:relative;width:132px">'+
        '<div style="position:relative;width:132px;height:86px;border:'+
          (i===0?'2px solid var(--naranja,#F2682A)':'1px solid var(--linea,#E6DFD6)')+';'+
          'border-radius:9px;overflow:hidden;background:#F4EFE8">'+
          (esVideo
            ? '<video src="'+esc(f.url)+'" style="width:100%;height:100%;object-fit:cover;display:block"></video>'
            : '<img src="'+esc(f.url)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">')+
          (i===0?'<span style="position:absolute;left:4px;bottom:4px;background:var(--naranja,#F2682A);'+
                 'color:#fff;font:600 9px/1 Oswald,system-ui;letter-spacing:.06em;padding:3px 6px;'+
                 'border-radius:99px">PORTADA</span>':'')+
          '<button type="button" data-quitar="'+esc(f.url)+'" title="Quitar esta foto" '+
            'style="position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;'+
            'background:rgba(30,26,22,.78);color:#fff;font:700 13px/1 system-ui;cursor:pointer;'+
            'display:grid;place-items:center;padding:0">×</button>'+
        '</div>'+
        '<div style="display:flex;gap:4px;margin-top:4px">'+
          (i===0?'' : '<button type="button" class="btn ghost sm" style="flex:1;padding:4px 6px;font-size:10px" '+
                      'data-portada="'+esc(f.url)+'">Portada</button>')+
          (esVideo?'' : '<button type="button" class="btn ghost sm" style="flex:1;padding:4px 6px;font-size:10px" '+
                      'data-ajusta="'+esc(f.url)+'">Ajustar</button>')+
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-quitar]'),function(b){
      b.onclick=function(){ if(confirm('¿Quitar esta foto?')) quitaFoto(b.getAttribute('data-quitar')); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-portada]'),function(b){
      b.onclick=function(){ haciaPortada(b.getAttribute('data-portada')); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-ajusta]'),function(b){
      b.onclick=function(){ abreAjuste(b.getAttribute('data-ajusta')); };
    });
  }

  /* La portada es, sencillamente, la primera: se reordena. */
  async function haciaPortada(url){
    var orden=[url].concat(FOTOS.map(function(f){return f.url;}).filter(function(u){return u!==url;}));
    try{ var j=await fotoRpc({orden:orden}); FOTOS=j.fotos||FOTOS; pintaFotos(); toast('Ya es la portada'); }
    catch(e){ toast('No se pudo: '+((e&&e.message)||e),true); }
  }

  /* AJUSTAR = RECORTAR DE VERDAD. Se encuadra a 16:9, que es la forma en que
     sale en la ficha y en la tarjeta, y la recortada sustituye a la original en
     el mismo sitio de la galería. */
  function abreAjuste(url){
    var f=FOTOS.filter(function(x){return x.url===url;})[0]; if(!f) return;
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(30,26,22,.65);z-index:70;'+
      'display:grid;place-items:center;padding:16px;overflow:auto';
    ov.innerHTML='<div style="background:#fff;border-radius:14px;max-width:520px;width:100%;padding:18px 20px">'+
      '<h3 style="margin:0 0 2px;font-family:Oswald,system-ui,sans-serif;text-transform:uppercase;font-size:16px">Ajustar la foto</h3>'+
      '<div class="mini" style="margin-bottom:10px">Arrastra para mover y usa el deslizador para acercar. Se recorta a lo ancho, como sale en tu ficha.</div>'+
      '<div id="ajMarco" style="position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;'+
        'border-radius:10px;background:#1E1A16;cursor:grab;touch-action:none">'+
        /* SIN crossorigin EL RECORTE NO SALE. La foto vive en otro dominio
           (el almacén), así que el canvas queda «teñido» y el navegador se
           niega a exportarlo: «Tainted canvases may not be exported». El
           almacén sí manda CORS; solo había que pedírselo. Javi, 10-oct. */
        '<img id="ajImg" crossorigin="anonymous" src="'+esc(url)+'" alt="" style="position:absolute;transform-origin:0 0;'+
          'user-select:none;-webkit-user-drag:none;pointer-events:none">'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'+
        '<span class="mini">Acercar</span>'+
        '<input type="range" id="ajZoom" min="100" max="300" value="100" style="flex:1">'+
      '</div>'+
      '<div class="ft" style="margin-top:14px;justify-content:flex-end;gap:8px">'+
        '<button class="btn ghost" type="button" id="ajNo">Cancelar</button>'+
        '<button class="btn" type="button" id="ajOk">Guardar el recorte</button>'+
      '</div></div>';
    document.body.appendChild(ov);

    var marco=ov.querySelector('#ajMarco'), img=ov.querySelector('#ajImg'), zo=ov.querySelector('#ajZoom');
    var st={x:0,y:0,base:1,z:1,natW:0,natH:0,arr:false,px:0,py:0};
    img.onload=function(){
      st.natW=img.naturalWidth; st.natH=img.naturalHeight;
      var W=marco.clientWidth, H=marco.clientHeight;
      st.base=Math.max(W/st.natW, H/st.natH);
      st.z=1; st.x=(W-st.natW*st.base)/2; st.y=(H-st.natH*st.base)/2;
      aplica();
    };
    function aplica(){
      var e=st.base*st.z;
      img.style.width=(st.natW*e)+'px'; img.style.height=(st.natH*e)+'px';
      img.style.left='0'; img.style.top='0';
      img.style.transform='translate('+st.x+'px,'+st.y+'px)';
    }
    function limita(){
      var W=marco.clientWidth, H=marco.clientHeight, e=st.base*st.z;
      var w=st.natW*e, h=st.natH*e;
      st.x=Math.min(0, Math.max(W-w, st.x));
      st.y=Math.min(0, Math.max(H-h, st.y));
    }
    marco.onpointerdown=function(ev){ st.arr=true; st.px=ev.clientX; st.py=ev.clientY;
      marco.setPointerCapture(ev.pointerId); marco.style.cursor='grabbing'; };
    marco.onpointermove=function(ev){ if(!st.arr) return;
      st.x+=ev.clientX-st.px; st.y+=ev.clientY-st.py; st.px=ev.clientX; st.py=ev.clientY;
      limita(); aplica(); };
    marco.onpointerup=function(){ st.arr=false; marco.style.cursor='grab'; };
    zo.oninput=function(){
      var W=marco.clientWidth, H=marco.clientHeight;
      var cx=(W/2-st.x), cy=(H/2-st.y), zAnt=st.z;
      st.z=Number(zo.value)/100;
      var k=st.z/zAnt;
      st.x=W/2-cx*k; st.y=H/2-cy*k;
      limita(); aplica();
    };
    ov.querySelector('#ajNo').onclick=function(){ ov.remove(); };
    ov.querySelector('#ajOk').onclick=async function(){
      var b=this; b.disabled=true; b.textContent='Recortando…';
      try{
        var W=marco.clientWidth, H=marco.clientHeight, e=st.base*st.z;
        var sx=(-st.x)/e, sy=(-st.y)/e, sw=W/e, sh=H/e;
        var destW=Math.min(1600, Math.round(sw)), destH=Math.round(destW*9/16);
        var cv=document.createElement('canvas'); cv.width=destW; cv.height=destH;
        cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, destW, destH);
        var data=cv.toDataURL('image/jpeg', 0.9);
        var pos=FOTOS.map(function(x){return x.url;}).indexOf(url);
        var j=await fotoRpc({imagen:data});          // sube la recortada al final
        var nuevas=(j.fotos||[]);
        var nueva=nuevas[nuevas.length-1];
        if(nueva){
          var j2=await fotoRpc({quitar:url});        // fuera la original
          var lista=(j2.fotos||[]).map(function(x){return x.url;});
          lista.splice(lista.indexOf(nueva.url),1);
          lista.splice(pos,0,nueva.url);            // la recortada ocupa su sitio
          var j3=await fotoRpc({orden:lista});
          FOTOS=j3.fotos||j2.fotos||nuevas;
        }else{ FOTOS=nuevas; }
        pintaFotos(); toast('Recortada'); ov.remove();
      }catch(err){
        b.disabled=false; b.textContent='Guardar el recorte';
        var m=String((err&&err.message)||err);
        toast(/[Tt]ainted/.test(m)
          ? 'Esa foto no deja recortarse desde el navegador. Vuelve a subirla y recórtala al subir.'
          : 'No se pudo recortar: '+m, true);
      }
    };
  }
  async function fotoRpc(cuerpo){
    var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},hdrs()),
      body:JSON.stringify(Object.assign({token:TOK,evento_id:evCur&&evCur.id},cuerpo))});
    var j=null; try{ j=await r.json(); }catch(_){}
    if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('la foto no subio ('+r.status+')'));
    return j;
  }
  async function subeFotos(files){
    if(!files||!files.length) return;
    /* NADIE DEBERÍA TENER QUE GUARDAR PARA PODER SUBIR UNA FOTO. Javi,
       10-oct-2026: «no me obligues a guardar evento para subir fotos». La foto
       necesita un evento al que colgarse, así que se crea el borrador solo, en
       silencio, y se sigue. */
    if(!evCur||!evCur.id){
      toast('Un momento: guardo tu evento como borrador para colgarle la foto…');
      try{ await guardar(true); }catch(_){}
      if(!evCur||!evCur.id){ toast('No pude crear el borrador. Inténtalo otra vez.',true); return; }
    }
    var lista=Array.prototype.slice.call(files).filter(function(f){
      return (f.type||'').indexOf('image')===0; });
    if(!lista.length){ toast('Eso no es una imagen.',true); return; }
    for(var i=0;i<lista.length;i++){
      try{
        toast('Subiendo '+(i+1)+' de '+lista.length+'…');
        var dataUri=await new Promise(function(res,rej){
          var fr=new FileReader();
          fr.onload=function(){res(fr.result);}; fr.onerror=rej;
          fr.readAsDataURL(lista[i]);
        });
        var j=await fotoRpc({imagen:dataUri});
        FOTOS=j.fotos||[]; pintaFotos();
      }catch(e){ toast(e.message||'No se pudo subir',true); break; }
    }
    toast('Listo');
  }
  async function quitaFoto(url){
    try{ var j=await fotoRpc({quitar:url}); FOTOS=j.fotos||[]; pintaFotos(); toast('Quitada'); }
    catch(e){ toast(e.message||'No se pudo quitar',true); }
  }

  function faltaPara(F){
    var falta=[];
    if(!$('ev-nombre').value.trim())            falta.push('como se llama');
    if(!$('ev-espacio').value)                  falta.push('en que sala es');
    if(F.indexOf('fechas')>=0 && !$('ev-desde').value) falta.push('desde que dia');
    if(F.indexOf('fecha')>=0  && !$('ev-fecha').value) falta.push('que dia es');
    if(F.indexOf('hora')>=0   && !$('ev-hora-ini').value) falta.push('a que hora empieza');
    return falta;
  }

  /* UN EVENTO A MEDIAS NO SE TIRA. Javi, 10-oct-2026: «permite que si avanzamos
     un evento y salimos no se pierda, entre en borrador». Un borrador se guarda
     con lo que haya —sin sala, sin fecha, sin nada— y NO aparta sala: nadie
     pierde un hueco por un evento a medio escribir. Pasa a «en revisión» el día
     que le dé a Enviar a Casa Pepe. */
  async function guardar(borrador){
    var tipo=$('evTipo').value,F=evtDef(tipo).f,g=!!($('ev-gratis')&&$('ev-gratis').checked);
    var falta=faltaPara(F);
    if(!borrador && falta.length){
      toast('Antes de mandarlo falta '+falta.join(', y ')+'.', true);
      /* y se le lleva a la pestaña donde estan esos campos */
      var ir=(falta.length===1&&falta[0]==='como se llama')?'esencial':'cuando';
      var b=document.querySelector('#fnav button[data-f="'+ir+'"]'); if(b)b.click();
      return;
    }
    var esl=$('ev-espacio').value;
    var eob=ESPACIOS.filter(function(x){return x.slug===esl;})[0];
    var ev={tipo:tipo,clase:CLASE,nombre:$('ev-nombre').value.trim(),
            espacio:(eob?eob.nombre:esl),
            espacio_id:(eob?eob.espacio_id:null),
            /* Lo que se aparta es exactamente lo que puso en pantalla. */
            montaje_min:montajeMin(),
            desmontaje_min:desmontajeMin(),
            equipo_extra:EXTRA.filter(function(x){return (x.equipo||'').trim();}),
            descripcion:$('ev-desc').value.trim(),es_gratis:(CLASE==='privado'?false:g),
            garantia_modo:(function(){var r=document.querySelector('input[name=garantia]:checked');
                                       return r?r.value:null;})(),
            borrador:!!borrador};
    if(F.indexOf('fechas')>=0){
      var fH=$('ev-hasta').value||$('ev-desde').value, hF=F.indexOf('hora')>=0?$('ev-hora-fin').value:null;
      ev.fecha_inicio=combinaFH($('ev-desde').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH(fH,hF),fH,hF);
    }
    else if(F.indexOf('fecha')>=0){
      ev.fecha_inicio=combinaFH($('ev-fecha').value,F.indexOf('hora')>=0?$('ev-hora-ini').value:null);
      if(F.indexOf('hora')>=0&&$('ev-hora-fin').value)
        ev.fecha_fin=cierraFH(ev.fecha_inicio,combinaFH($('ev-fecha').value,$('ev-hora-fin').value),$('ev-fecha').value,$('ev-hora-fin').value);
    }
    /* SI NO DIJO CUANDO ACABA, SE SACA DE LA DURACION.
       Sin hora de fin no hay rato que apartar, y la sala no se puede bloquear.
       Antes que pedirle el dato dos veces, se calcula: empieza + lo que dura.
       Y si tampoco dijo cuanto dura, dos horas, que es lo que dura casi todo. */
    if(ev.fecha_inicio && !ev.fecha_fin){
      var mins=parseInt($('ev-duracion')&&$('ev-duracion').value,10);
      if(!mins||mins<=0) mins=120;
      /* Se suma sobre el reloj de la Ciudad de Mexico, no sobre el del aparato:
         una productora conectada desde Lima no tiene por que corrernos la hora
         del evento. Por eso se lee la parte '...THH:MM' tal cual y se vuelve a
         escribir con el mismo huso. */
      var d=new Date(String(ev.fecha_inicio).slice(0,16)+':00Z');
      if(!isNaN(d)){ d=new Date(d.getTime()+mins*60000);
        var dd=function(n){return (n<10?'0':'')+n;};
        ev.fecha_fin=d.getUTCFullYear()+'-'+dd(d.getUTCMonth()+1)+'-'+dd(d.getUTCDate())+
                     'T'+dd(d.getUTCHours())+':'+dd(d.getUTCMinutes())+':00'+HUSO; }
    }
    if(F.indexOf('duracion')>=0)ev.duracion_min=$('ev-duracion').value;
    if(F.indexOf('aforo')>=0)ev.aforo=$('ev-aforo').value;
    if(F.indexOf('cupo')>=0)ev.cupo=$('ev-cupo').value;
    if(F.indexOf('horario_visita')>=0)ev.horario_visita=$('ev-horario').value.trim();
    if(F.indexOf('materiales')>=0)ev.materiales=$('ev-materiales').value.trim();
    if(F.indexOf('tipo_produccion')>=0)ev.tipo_produccion=$('ev-prod').value;
    if(F.indexOf('crew')>=0)ev.crew_tam=$('ev-crew').value;
    if(!g){
      if(F.indexOf('precio_hora')>=0)ev.precio_por_hora=$('ev-precio-hora').value;
      if(F.indexOf('precio_persona')>=0)ev.precio=$('ev-precio-persona').value;
      if(F.indexOf('cobro_renta')>=0){ev.modelo_cobro=$('ev-renta').value;ev.precio=$('ev-precio-renta').value;}
      if(F.indexOf('cobro_taquilla')>=0)ev.modelo_cobro=$('ev-taq').value;
      if(F.indexOf('cobro_expo')>=0){ev.modelo_cobro=$('ev-expo').value;ev.precio=$('ev-precio-expo').value;}
    } else ev.modelo_cobro='gratis';
    /* null = no se pudieron leer, así que no se mandan y la base los deja en
       paz. Un array vacío sí significa «bórralos todos». */
    var ag=(!DET_OK&&evCur&&evCur.id)?null:((F.indexOf('agenda')>=0)?AG:[]);
    var pr=(!DET_OK&&evCur&&evCur.id)?null:((F.indexOf('precios')>=0)?PR:[]);
    /* ANTES DE MANDARLO, DECIRLE QUÉ FALTA Y LLEVARLE AHÍ. Javi, 10-oct: se
       quedó en «Agenda y boletos» con la sala y la fecha vacías y lo único que
       vio fue «No se pudo enviar». */
    var falta=[], irA=null;
    if(borrador){ falta=[]; }
    else{
    if(!ev.nombre){ falta.push('el nombre del evento'); irA=irA||'esencial'; }
    if(!$('ev-espacio').value){ falta.push('la sala'); irA=irA||'cuando'; }
    var hayFecha = ($('ev-fecha')&&$('ev-fecha').value) || ($('ev-desde')&&$('ev-desde').value);
    if(!hayFecha){ falta.push('la fecha'); irA=irA||'cuando'; }
    if(F.indexOf('hora')>=0 && !($('ev-hora-ini')&&$('ev-hora-ini').value)
       && !($('ev-todoeldia')&&$('ev-todoeldia').checked)){
      falta.push('la hora de inicio'); irA=irA||'cuando'; }
    /* El cupo de boletos no puede pasar del aforo de la sala: la venta de más
       boletos que gente cabe la paga alguien en la puerta. */
    var salaSel=ESPACIOS.filter(function(x){return x.slug===$('ev-espacio').value;})[0];
    if(salaSel && salaSel.capacidad && pr && pr.length){
      var suma=pr.reduce(function(a,b){return a+(Number(b.cupo)||0);},0);
      if(suma>salaSel.capacidad){
        toast('Los boletos suman '+suma+' y en '+salaSel.nombre+' caben '+salaSel.capacidad+'.',true);
        var bx=document.querySelector('#fnav button[data-f="extra"]'); if(bx)bx.click();
        return;
      }
    }
    if(falta.length){
      toast('Antes de enviarlo falta '+falta.join(', ')+'.',true);
      var bb=document.querySelector('#fnav button[data-f="'+(irA||'esencial')+'"]'); if(bb)bb.click();
      return;
    }
    }
    if(borrador && !ev.nombre) ev.nombre='Evento sin título';
    $('fGuardar').disabled=true;
    try{
      var r=await rpc('prod_portal_evento',{p_token:TOK,p_id:evCur?evCur.id:null,p_evento:ev,p_agenda:ag,p_precios:pr});
      if(!r||!r.ok)throw new Error((r&&r.error)||'error');
      /* El "qué incluye" de cada boleto se guarda en un paso aparte, ligado por
         el orden del tipo de boleto (mismo índice que se mandó en p_precios). */
      if(r.id && pr.length && pr.some(function(p){return p.incluye;})){
        try{ await rpc('prod_portal_precios_incluye',{p_token:TOK,p_evento_id:r.id,
          p_incluye:pr.map(function(p,i){return {orden:i,incluye:p.incluye||''};})}); }catch(_){}
      }
      /* El impacto se guarda aparte porque necesita el id del evento, que en un
         evento nuevo no existe hasta ahora mismo. */
      if(r.id && IMP.length){
        try{ await rpc('prod_portal_impacto_set',{p_token:TOK,p_evento:r.id,
          p_items:IMP.filter(function(q){return q.marcado;})
            .map(function(q){return {clave:q.clave,quien:q.quien||'',monto_mxn:q.monto_mxn};})}); }catch(_){}
      }
      /* APARTAR LA FRANJA. La solicitud la abre la base al guardar; el hueco del
         calendario lo escribe ev-ocupa. Si falla, el evento NO se pierde: se
         queda guardado y sin sala apartada, y se le dice. */
      var ap=null;
      if(r.id && !borrador){
        try{
          var ro=await fetch(SB+'/functions/v1/ev-ocupa',{method:'POST',
            headers:Object.assign({'Content-Type':'application/json'},hdrs()),
            body:JSON.stringify({token:TOK,evento_id:r.id})});

        }catch(_){}
      }
      /* EL BORRADOR SE QUEDA ABIERTO. Si al guardar a medias le cerráramos la
         ficha, el guardado automático se sentiría como que la pantalla se le
         va sola. Se queda donde está, con el evento ya creado detrás. */
      if(borrador){
        evCur = evCur || {id:r.id};
        evCur.id = r.id;
        try{ EV=await rpc('prod_portal_eventos',{p_token:TOK}); renTabla(); }catch(_){}
        var ec=EV.filter(function(x){return x.id===r.id;})[0]; if(ec) evCur=ec;
        $('fTit').textContent='Editar evento · borrador';
        tituloBoton();
        try{ filtra(); pintaFotos(); }catch(_){}
        if($('fGuardar')) $('fGuardar').disabled=false;
        return r.id;
      }
      var eraPropuesto=(evCur&&evCur.estado==='propuesto');
      var msj= eraPropuesto ? 'Solicitud actualizada' : 'Enviado a Casa Pepe';
      if(ap&&ap.ok&&!ap.sin_apartar){
        var hh=function(s){var d=new Date(s);return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);};
        msj = ap.sin_tocar ? 'Guardado · la sala ya la tienes confirmada'
            : 'Pedida la sala de '+hh(ap.sala_desde)+' a '+hh(ap.sala_hasta)+' · pendiente de confirmar';
      }else if(ap&&ap.sin_tocar){
        msj='Guardado. La sala ya está confirmada y no la movemos desde aquí: si cambiaste la hora, avísanos.';
      }else if(ap&&ap.sin_apartar){
        msj='Guardado, pero sin sala apartada: le falta la sala o la fecha';
      }
      /* La sala se lee ANTES de borrar la ficha: después el desplegable ya no
         existe y el cierre de la fianza reventaba. */
      var salaFz=ESPACIOS.filter(function(x){return x.slug===$('ev-espacio').value;})[0];
      toast(msj);$('fichaHost').innerHTML='';
      /* LA FIANZA, AL FINAL DEL TODO. Javi, 10-oct-2026: «falta lo de la fianza
         al final del proceso». Es lo último que hay que resolver y lo primero
         que se olvida: se dice ahora, cuando acaba de mandar y todavía tiene la
         cabeza en el evento. */
      try{ cierraConFianza(salaFz); }catch(_){}
      var eraNuevo=!(evCur&&evCur.id);
      EV=await rpc('prod_portal_eventos',{p_token:TOK});renTabla();
      /* Un evento nuevo necesita existir antes de poder colgarle fotos. En vez
         de mandarlo de vuelta a la tabla y que lo busque, se le reabre ya
         guardado y directo en Fotos, que es lo unico que le falta. */
      if(eraNuevo && r && r.id){
        try{
          await abre(r.id);
          var b=document.querySelector('#fnav button[data-f="fotos"]'); if(b)b.click();
          toast('Guardado. Ahora subele una foto.');
          return;
        }catch(_){}
      }
    }catch(e){
      /* «No se pudo enviar» a secas costó una tarde. La base dice por qué; se
         enseña tal cual, que el que lee lo copia y lo manda. Javi, 10-oct. */
      toast('No se pudo enviar: '+String((e&&e.message)||e),true);

    if($('fGuardar')) $('fGuardar').disabled=false;

  async function subeImagenFicha(destino,file){
    if(!file) return;
    if((file.type||'').indexOf('image')!==0){ toast('Eso no es una imagen.',true); return; }
    if(file.size>25*1024*1024){ toast('La imagen pesa más de 25 MB.',true); return; }

      toast('Subiendo…');
      var dataUri=await new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=rej;fr.readAsDataURL(file);});
      var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify({token:TOK,destino:destino,imagen:dataUri})});
      var j=null; try{ j=await r.json(); }catch(_){}
      if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('no se pudo subir ('+r.status+')'));
      var el=$('g-'+destino+'_url'); if(el) el.value=j.url;
      toast('Imagen subida ✓');
    }catch(e){ toast(e.message||'No se pudo subir',true); }
  }

  /* EL MISMO RECORTADOR DE SIEMPRE. Javi, 4-oct-2026: «el subir foto tiene el
     sistema de centrar que tenemos diseñado?». Lo tenemos desde hace meses
     (sinc-crop) y lo usan la ficha de experiencia y el alta de eventos; aquí
     faltaba. Sin él, una foto vertical de alguien del equipo salía cortada por
     la mitad y nadie entendía por qué. Si por lo que sea no cargó el
     recortador, se sube tal cual antes que dejar a nadie sin poder subir. */
  function leeDataUri(b){
    return new Promise(function(res,rej){
      var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej;
      fr.readAsDataURL(b);
    });
  }
  /* 7-oct-2026, Victor: «no le deja subir la foto». No es que no dejara: el
     recortador devolvía vacío y arriba se hacía `if(!img) return;` — sin aviso,
     sin foto, sin error. Desde fuera eso es exactamente «no me deja». Ahora se
     distingue cerrar a propósito (se avisa) de que el recortador se rompa o se
     quede colgado (se sube la foto tal cual, que es mejor que dejar a alguien
     sin poder subir). */
  async function conRecorte(file, titulo, cual){
    if(!window.sincCrop) return await leeDataUri(file);
    var blob=null, rompio=false;
    try{
      blob = await new Promise(function(res,rej){
        var t=setTimeout(function(){ rej(new Error('el recortador no respondió')); }, 120000);
        try{
          sincCrop.open(file, {titulo:titulo, only:cual}, function(r){
            clearTimeout(t);
            res(r ? (cual==='v' ? (r.vBlob||r.hBlob) : (r.hBlob||r.vBlob)) : null);
          });
        }catch(x){ clearTimeout(t); rej(x); }
      });
    }catch(_){ rompio=true; }
    if(rompio){ toast('El recortador falló; subimos la foto tal cual.'); return await leeDataUri(file); }
    if(!blob){ toast('No se subió nada: se cerró el recortador sin guardar.',true); return null; }
    return await leeDataUri(blob);
  }

    try{ RSP=await rpc('rs_pedidos_portal',{p_token:TOK})||[]; }catch(_){ RSP=[]; }
    var vivos=RSP.filter(function(d){return ['entregado','cancelado'].indexOf(d.estado)<0;});
    var hechos=RSP.filter(function(d){return ['entregado','cancelado'].indexOf(d.estado)>=0;}).slice(0,20);
    function fila(d){
      var l=(d.items||[]).map(function(i){return i.cant+'× '+esc(i.nombre);}).join(', ');
      var sig = d.estado==='pedido' ? 'aceptado'
              : d.estado==='aceptado' ? 'en_camino'
              : d.estado==='en_camino' ? 'entregado' : null;
      var cuando='';
      try{ cuando=new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',

      return '<div class="card" style="margin:0 0 10px;padding:12px">'+
        '<div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline">'+
          '<b style="font-family:Oswald;text-transform:uppercase">'+esc(d.espacio||'—')+'</b>'+

        '<div class="mini" style="margin-top:4px">'+esc(d.quien||'')+
          (d.contacto?' · '+esc(d.contacto):'')+' · <b>$'+Number(d.total||0).toLocaleString('es-MX')+'</b></div>'+
        (d.notas?'<div class="mini" style="margin-top:4px">“'+esc(d.notas)+'”</div>':'')+
        (sig?'<div class="ft" style="margin-top:8px">'+

          '<button class="btn sm" data-rs="'+d.id+'" data-e="'+sig+'">'+esc(rsNom(sig))+'</button></div>':'')+
      '</div>';

    $('rsPedidos').innerHTML=
      '<div style="margin-top:12px">'+
        (vivos.length?vivos.map(fila).join('')

          '<div class="fld"><label>WhatsApp</label><input id="c-whatsapp" value="'+esc(f.whatsapp||'')+'"></div>'+
          '<div class="fld"><label>Instagram</label><input id="c-instagram" value="'+esc(f.instagram||'')+'"></div>'+
          '<div class="fld"><label>Web</label><input id="c-web" value="'+esc(f.web||'')+'"></div>'+
        '</div>'+
        '<div class="ft"><button class="btn" id="cGuardar">Guardar mi cuenta</button></div>'+
      '</div>'+
      '<div class="card"><h3>Cobros en línea (Stripe)</h3>'+
        '<div class="hint">Para vender boletos en línea tienes que conectar tu Stripe. El dinero de tus boletos cae directo en tu cuenta; el Ateneo retiene solo su comisión en el mismo cobro. Tus datos bancarios y fiscales los escribes tú en Stripe — aquí no se piden ni se guardan.</div>'+
        comisionCaja(f)+
        '<div id="stripeBox" style="margin-top:12px;color:var(--gris)">Revisando…</div>'+
      '</div>'+
      /* EL CONTRATO, AL FINAL. Javi, 4-oct-2026: «ver contrato y términos y
         condiciones, y cuando se habilita le sale para firmarlo». Leerlo se
         puede siempre; firmarlo solo cuando Casa Pepe le puso versión. */
      '<div class="card"><h3>Contrato</h3>'+
        '<div id="contratoBox" style="color:var(--gris)">Revisando…</div>'+
      '</div>';
    $('cGuardar').onclick=guardaCuenta;
    /* El desplegable se pintaba sin `selected`, así que la figura guardada no
       se veía al volver: salía siempre en «—» y al guardar se la llevaba por
       delante. Se le pone su valor aquí, y de ahí cuelga qué campos se piden. */
    var tpers=$('c-tipo_persona'); if(tpers) tpers.value=f.tipo_persona||'';
    pintaFiscalProd();
    enlazaDocs(); cargaDocs();
    cargaStripe(); cargaContrato();
    /* Póliza: si tiene, salen sus datos; si no, la casilla de que se la consigamos. */
    var tp=$('c-tiene_poliza');
    if(tp) tp.onchange=function(){ var on=tp.checked;
      var pc=$('polizaCampos'); if(pc) pc.style.display=on?'':'none';
      var cw=$('polizaCotizarWrap'); if(cw) cw.style.display=on?'none':'block'; };
  }
  async function callFn(nombre,body){
    var r=await fetch(SB+'/functions/v1/'+nombre,{method:'POST',headers:Object.assign({'Content-Type':'application/json'},hdrs()),body:JSON.stringify(body||{})});
    var j=null;try{j=await r.json();}catch(_){} return {ok:r.ok,data:j};
  }
  /* Cobros en línea: el productor conecta su Stripe (cuenta Connect propia). El
     estado y la liga de alta los da la función productora-stripe-alta, con el
     token del portal. Los datos bancarios los escribe él en Stripe, no aquí. */
  async function cargaStripe(){
    var box=$('stripeBox'); if(!box) return;
    var r=await callFn('productora-stripe-alta',{accion:'estado',token:TOK});
    var d=r.data||{};
    if(r.ok && d.stripe_charges_enabled){
      box.innerHTML='<div style="background:#E8F5E9;color:#1B5E20;border-radius:10px;padding:11px 13px;font-size:14px">✓ Tu Stripe está conectado. Ya puedes vender boletos en línea.</div>';
      return;
    }
    var yaEmpezo = r.ok && d.alta && !d.stripe_charges_enabled;
    box.innerHTML='<button class="btn" id="stripeBtn">'+(yaEmpezo?'Continuar mi alta de Stripe':'Conectar mi Stripe')+'</button>'
      +(yaEmpezo?'<div class="hint" style="margin-top:8px">Tu alta quedó a medias; termínala para poder cobrar.</div>':'');
    $('stripeBtn').onclick=conectaStripe;
  }
  async function conectaStripe(){
    var b=$('stripeBtn'); if(b){b.disabled=true;b.textContent='Abriendo Stripe…';}
    var r=await callFn('productora-stripe-alta',{accion:'alta',token:TOK,origen:location.origin});
    if(r.ok && r.data && r.data.url){ location.href=r.data.url; return; }
    toast((r.data&&r.data.error)||'No se pudo abrir el alta de Stripe',true);
    if(b){b.disabled=false;b.textContent='Conectar mi Stripe';}
  }
  /* LA COMISIÓN, CON SU CUENTA HECHA. Javi, 4-oct-2026: «pon la comisión que se
     cobraría y un ejemplo». Decir «el Ateneo retiene su comisión» no le dice
     nada a quien va a poner el precio de su boleto: lo que necesita saber es
     cuánto le queda. El porcentaje sale de su propia ficha, así que si se le
     negocia otro, aquí cambia solo. */
  function pesos(n){ return '$'+Math.round(n||0).toLocaleString('es-MX'); }
  function comisionCaja(f){
    /* SIN PORCENTAJE NO SE INVENTA UNO. Javi, 10-oct-2026: «quita lo del 35
       porque puede variar». Antes, a una productora sin comisión puesta en su
       ficha esta caja le decía que el Ateneo retiene el 35% —un número que
       nadie había pactado con ella, y encima con el ejemplo en pesos hecho—.
       Si no está en su ficha, se le dice de dónde sale y se acabó. */
    /* El porcentaje llega ya resuelto desde prod_portal_ficha: el total pactado
       si lo tiene, y si no la suma de su propio desglose (de serie, 35). Solo
       llega vacío si no tiene ni desglose. */
    var pct = (f && f.comision_pct != null) ? Number(f.comision_pct) : null;
    if (pct == null) {
      return '<div class="comi">'+
        '<div class="comi-t">El Ateneo retiene una comisión de cada boleto que se venda en línea. El resto es tuyo.</div>'+
        '<div class="comi-p">El porcentaje es el que lleves en tu convenio; en cuanto esté puesto lo verás aquí '+
          'con la cuenta hecha. Si no lo tienes claro, escríbenos antes de poner precio.</div>'+
      '</div>';
    }
    var ej = 200, reten = Math.round(ej*pct/100), queda = ej - reten;
    return '<div class="comi">'+
      '<div class="comi-t">El Ateneo retiene el <b>'+pct+'%</b> de cada boleto que se venda en línea. El resto es tuyo.</div>'+
      '<div class="comi-e">'+
        '<div><span>Boleto de</span><b>'+pesos(ej)+'</b></div>'+
        '<div><span>Se queda el Ateneo</span><b>'+pesos(reten)+'</b></div>'+
        '<div class="tu"><span>Te llega a ti</span><b>'+pesos(queda)+'</b></div>'+
      '</div>'+
      '<div class="comi-p">Se parte en el mismo cobro: no hay que pasarte nada después. '+
        'Lo que Stripe cobra por procesar la tarjeta va aparte y lo descuenta Stripe de tu depósito.</div>'+
    '</div>';
  }

  /* Subir un papel: se manda como data URI a prod-doc, que lo deja en el bucket
     privado y lo apunta en productora_docs. */
  var DOCS=[];
  async function cargaDocs(){
    try{
      var r=await callFn('prod-doc',{accion:'lista',token:TOK});
      DOCS=(r&&r.data&&r.data.docs)||[];
    }catch(_){ DOCS=[]; }
    ['csf','ine','pasaporte','poliza'].forEach(function(t){
      var e=document.getElementById('d-'+t); if(!e) return;
      var mio=DOCS.filter(function(d){return d.tipo===t;})[0];
      if(mio){
        e.className='est ok';
        e.textContent='Recibido '+new Date(mio.created_at).toLocaleDateString('es-MX');
        /* LA PÓLIZA AVISA UN MES ANTES. Javi, 4-oct-2026. Una póliza vencida
           deja un evento sin cobertura, así que no basta con guardarla: hay que
           decirlo a tiempo, y en días, no en una fecha que nadie resta. */
        if(t==='poliza' && mio.vigencia){
          var dias=Math.ceil((new Date(mio.vigencia+'T12:00:00')-new Date())/86400000);
          if(dias<0){ e.className='est mal'; e.textContent='Venció el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX')+' · súbenos la nueva'; }
          else if(dias<=30){ e.className='est ojo'; e.textContent='Vence en '+dias+(dias===1?' día':' días')+' · ve pidiendo la renovación'; }
          else { e.textContent='Vale hasta el '+new Date(mio.vigencia+'T12:00:00').toLocaleDateString('es-MX'); }
        }
      }else{
        e.className='est'; e.textContent='Falta';
      }
    });
    var falta = !DOCS.some(function(d){return d.tipo==='csf';}) ||
                !DOCS.some(function(d){return d.tipo==='ine'||d.tipo==='pasaporte';});
    var m=document.getElementById('msgDoc');
    if(m) m.textContent = falta
      ? 'Nos falta la constancia y una identificación (INE o pasaporte).'
      : 'Ya tenemos tus papeles. Gracias.';
  }
  function enlazaDocs(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-doc]'),function(inp){
      inp.onchange=async function(){
        var f=inp.files && inp.files[0]; if(!f) return;
        var m=document.getElementById('msgDoc');
        if(f.size > 15*1024*1024){ if(m)m.textContent='Ese archivo pesa más de 15 MB.'; inp.value=''; return; }
        if(m)m.textContent='Subiendo '+f.name+'…';
        var lector=new FileReader();
        lector.onload=async function(){
          try{
            var t=inp.getAttribute('data-doc');
            var vg=(t==='poliza' && $('c-poliza_vigencia')) ? $('c-poliza_vigencia').value : null;
            if(t==='poliza' && !vg){ if(m)m.textContent='Pon hasta qué día vale la póliza antes de subirla.'; inp.value=''; return; }
            var r=await callFn('prod-doc',{accion:'subir',token:TOK,
              tipo:t, nombre:f.name, archivo:lector.result, vigencia:vg});
            if(!(r&&r.ok)||(r.data&&r.data.error)) throw new Error((r.data&&r.data.error)||'No se pudo subir');
            if(m)m.textContent='Listo, lo recibimos.';
            cargaDocs();
          }catch(x){ if(m)m.textContent=x.message; }
          inp.value='';
        };
        lector.readAsDataURL(f);
      };
    });
  }

  /* El contrato: se lee siempre, se firma cuando Casa Pepe lo habilita. */
  async function cargaContrato(){
    var box=$('contratoBox'); if(!box) return;
    var c=null;
    try{ c=await rpc('prod_portal_contrato',{p_token:TOK}); }catch(_){}
    if(!c||c.error){ box.textContent='No pudimos cargar tu contrato.'; return; }
    var t=c.terminos||{};
    var h='';
    if(c.firmado_at){
      h+='<div class="firmado">✓ Firmado el '+new Date(c.firmado_at).toLocaleDateString('es-MX')+
         ' por <b>'+esc(c.firmante||'')+'</b>'+(c.version?' · versión '+esc(c.version):'')+'</div>';
    }else if(c.habilitado){
      h+='<div class="mini">Tu contrato ya está listo para firmar'+(c.version?' (versión '+esc(c.version)+')':'')+'.</div>';
    }else{
      h+='<div class="mini">Todavía no habilitamos tu contrato. Puedes leerlo y leer las condiciones; te avisamos cuando se pueda firmar.</div>';
    }
    if(c.folio) h+='<div class="mini" style="margin-top:4px">Folio <b>'+esc(c.folio)+'</b>'+
                   (c.plantilla_version?' · texto '+esc(c.plantilla_version):'')+'</div>';
    /* La poliza manda en la DECIMA QUINTA: que lo vea aquí, junto al contrato,
       y no solo en su tarjeta. Javi, 4-oct-2026. */
    if(c.poliza_aviso) h+='<div class="mini" style="margin-top:4px;color:'+
         (/NO TENER|VENCIDA|sin fecha|hay que/.test(c.poliza_aviso)?'#9E3B2E':'#1D6B4A')+
         '">Responsabilidad civil: '+esc(c.poliza_aviso)+'</div>';
    h+='<div class="ft" style="justify-content:flex-start;gap:8px;margin-top:10px">'+
         '<button class="btn ghost sm" id="verContrato">Ver contrato</button>'+
         (t.url?'<a class="btn ghost sm" href="'+esc(t.url)+'" target="_blank" rel="noopener">Términos y condiciones</a>'
               :'<button class="btn ghost sm" id="verTyC">Términos y condiciones</button>')+
       '</div>'+
       '<div id="contratoTexto" class="legal" style="display:none"></div>';
    if(c.habilitado && !c.firmado_at){
      h+='<div class="firmar">'+
           '<label class="chk"><input type="checkbox" id="fAcepta"> He leído el contrato y las condiciones, y los acepto</label>'+
           '<div class="alta"><input id="fNombre" placeholder="Tu nombre completo, como firma">'+
             '<button class="btn sm" id="fBtn">Firmar</button></div>'+
         '</div>';
    }
    box.innerHTML=h;

    /* El contrato viene en markdown. Si se pinta con textContent se lee con
       asteriscos por todos lados, y un contrato que se ve mal no se lee. Esto
       no es un parser: negritas, titulos, guiones y la raya, nada mas. */
    function legalHtml(txt){
      var l=String(txt||'').split('\n'), out=[], i, s, m;
      function neg(x){ return esc(x).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }
      for(i=0;i<l.length;i++){
        s=l[i];
        /* Los anexos vienen como tabla de markdown: si se pintan linea por
           linea se leen a puros pipes. */
        if(/^\s*\|.*\|\s*$/.test(s)){
          var fs=[], j=i;
          while(j<l.length && /^\s*\|.*\|\s*$/.test(l[j])){
            var cel=l[j].trim().replace(/^\|/,'').replace(/\|$/,'').split('|');
            if(!/^[\s|:-]+$/.test(l[j])) fs.push(cel);
            j++;
          }
          var tb='<table style="width:100%;border-collapse:collapse;margin:9px 0;font-size:12px">', k, c;
          for(k=0;k<fs.length;k++){
            tb+='<tr>';
            for(c=0;c<fs[k].length;c++)
              tb+='<td style="border:1px solid var(--linea,#E2DCCF);padding:4px 6px;'+
                  (k===0?'font-weight:700;background:rgba(0,0,0,.035)':'')+'">'+neg(fs[k][c].trim())+'</td>';
            tb+='</tr>';
          }
          out.push(tb+'</table>'); i=j-1; continue;
        }
        if(/^\s*---+\s*$/.test(s)){ out.push('<hr style="border:0;border-top:1px solid var(--linea,#E2DCCF);margin:12px 0">'); continue; }
        s=esc(s);
        s=s.replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/(^|\s)\*([^*]+)\*/g,'$1<i>$2</i>');
        if((m=/^##\s+(.*)$/.exec(s)))      { out.push('<div style="font-weight:700;font-size:14px;margin:14px 0 4px">'+m[1]+'</div>'); continue; }
        if((m=/^#\s+(.*)$/.exec(s)))       { out.push('<div style="font-weight:700;font-size:15.5px;margin:0 0 6px">'+m[1]+'</div>'); continue; }
        if((m=/^[-*]\s+(.*)$/.exec(s)))    { out.push('<div style="margin:3px 0 3px 14px;text-indent:-10px">· '+m[1]+'</div>'); continue; }
        if((m=/^(\d+)\.\s+(.*)$/.exec(s))){ out.push('<div style="margin:3px 0 3px 16px;text-indent:-12px">'+m[1]+'. '+m[2]+'</div>'); continue; }
        out.push(s ? '<div style="margin:7px 0">'+s+'</div>' : '');
      }
      return out.join('');
    }
    function muestra(txt){
      var d=$('contratoTexto');
      d.style.display = d.style.display==='none' ? 'block' : 'none';
      if(txt) d.innerHTML = legalHtml(txt);
      else    d.textContent = 'Todavía no hay texto cargado. Pídenoslo y te lo mandamos.';
    }
    if($('verContrato')) $('verContrato').onclick=function(){ muestra(c.cuerpo); };
    if($('verTyC'))      $('verTyC').onclick=function(){ muestra(t.texto); };

    if($('fBtn')) $('fBtn').onclick=async function(){
      var b=$('fBtn'); b.disabled=true;
      try{
        var r=await rpc('prod_portal_firma',{p_token:TOK,
          p_nombre:($('fNombre').value||'').trim(), p_acepta:$('fAcepta').checked});
        if(!r||!r.ok) throw new Error((r&&r.error)||'No se pudo firmar');
        toast('Contrato firmado'); await cargaContrato();
      }catch(e){ toast(e.message,true); b.disabled=false; }
    };
  }

  async function guardaCuenta(){
    var campos=['nombre_comercial','tipo_persona','razon_social','rfc','curp','ciudad','email_notificaciones','email_reportes','email_facturacion','whatsapp','instagram','web','poliza_aseguradora','poliza_numero','poliza_suma','poliza_vigencia'];
    var p={};campos.forEach(function(c){var el=$('c-'+c);if(el)p[c]=el.value.trim();});
    p.tiene_poliza   = ($('c-tiene_poliza')  && $('c-tiene_poliza').checked)  ? 'true' : 'false';
    p.poliza_cotizar = ($('c-poliza_cotizar')&& $('c-poliza_cotizar').checked)? 'true' : 'false';
    $('cGuardar').disabled=true;
    try{var r=await rpc('prod_portal_update',{p_token:TOK,p:p});if(!r||!r.ok)throw new Error();FICHA=await rpc('prod_portal_ficha',{p_token:TOK});guia();toast('Guardado');}
    catch(e){toast('No se pudo guardar',true);}
    $('cGuardar').disabled=false;
  }

  (async function init(){
    if(!TOK){FICHA=null;shell();return;}
    try{ FICHA=await rpc('prod_portal_ficha',{p_token:TOK}); EV=await rpc('prod_portal_eventos',{p_token:TOK}); }catch(e){ FICHA=null; }
    try{ ESPACIOS=await rpc('prod_portal_espacios',{p_token:TOK})||[]; }catch(e){ ESPACIOS=[]; }
    shell();
  })();
})();
</script>
