/* SI LA MINIATURA NO ESTÁ, LA FOTO ENTERA. Javi, 27-oct-2026: «no se ve esta
   foto de este tour». mini() cambia _v.jpg por _t.jpg dando por hecho que la
   miniatura existe, y había 31 verticales que nunca la tuvieron: el navegador
   pedía un archivo que no está y dejaba el hueco roto, sin aviso ninguno.
   Desde la url no se puede saber si está, así que se corrige cuando falla: si
   una _t.jpg no carga, se pide la vertical, que siempre está. Cuesta una
   petición fallida y no cuesta ni un hueco. */
if(!window.__miniRespaldo){ window.__miniRespaldo=1;
  document.addEventListener('error',function(e){
    var t=e.target;
    if(!t||t.tagName!=='IMG'||!t.src||t.getAttribute('data-respaldo'))return;
    if(!/_t\.jpg($|\?|#)/i.test(t.src))return;
    t.setAttribute('data-respaldo','1');
    t.src=t.src.replace(/_t\.jpg/i,'_v.jpg');
  },true);
}

  /* LA BASE DICE POR QUE, Y AQUI SE TIRABA A LA BASURA. Javi, 13-oct-2026:
     «da este error: No se pudo enviar: prod_portal_evento 409».
     Un 409 no le dice nada a nadie. La respuesta trae el motivo escrito
     -Postgres manda code, message, hint y details- y esto solo miraba el
     numero. Ahora se lee el cuerpo, se traducen los dos choques que de verdad
     pasan aqui, y si es otro se enseña lo que dijo la base tal cual, que es lo
     que se puede copiar y mandar. */
  async function rpc(fn,body){
    var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},hdrs()),
      body:JSON.stringify(body||{})});
    var t=await r.text(), j=null; try{ j=t?JSON.parse(t):null; }catch(_){}
    if(!r.ok){
      var code=(j&&j.code)||'';
      var msg=(j&&(j.message||j.hint||j.details))||'';
      /* 23P01: dos cosas quieren la misma sala al mismo tiempo. Es el choque
         mas comun del portal y hasta hoy salia como un numero. */
      if(code==='23P01' || /exclusion constraint/i.test(msg))
        throw new Error('Esa sala ya está apartada en ese rato. Cambia el día o la hora, o escríbenos para que te la liberemos.');
      if(code==='23505') throw new Error('Eso ya está dado de alta: no se puede repetir.');
      /* 23503: algo cuelga de lo que se quiere tocar —una venta, casi siempre—.
         Esto es lo que salía como «prod_portal_evento 409» cuando un evento ya
         había vendido boletos: la base lo resuelve sola desde el 14-oct, y este
         aviso queda por si aparece en otra pantalla. */
      if(code==='23503') throw new Error('Esto ya tiene algo vendido o apuntado y por eso no se puede cambiar así. Escríbenos y lo movemos nosotros.');
      if(code==='23514') throw new Error('Hay un dato que la base no acepta. '+(msg||''));
      throw new Error(msg || (fn+' '+r.status));
    }
    return j;
  }

     pública se armaba siempre, aunque la ficha no tuviera todavía slug ni

     —otro sitio, con su propia cuenta, que ella no tiene ni necesita—.
     Mientras el Ateneo no abra la página, la liga que se le da es la vista
     previa con su token: ésa sí es suya, se abre sin cuenta y enseña
     exactamente lo que lleva llenado. */
  function ligaPagina(){
    var f=FICHA||{};
    if(f.publica && f.slug) return {
      url:'https://casapepe.mx/sincretico/productora.html?p='+encodeURIComponent(f.slug),
      publica:true, texto:'Ver mi página' };
    return { url:'/sinc/productora.html?prev='+encodeURIComponent(TOK),
             publica:false, texto:'Ver cómo va la mía' };
  }
  function guia(){
    var c=$('guia'); if(!c) return;
    var f=FICHA||{}, e=guiaEstado();
    var LP=ligaPagina(), liga=LP.url;

    if(e.eventos && e.pagina){
      c.className='guia todo';
      c.innerHTML='<div class="pn" style="background:var(--ok);color:#fff;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800">&#10003;</div>'+
        '<div class="gtit">Todo en orden</div>'+
        '<div class="gsub" style="margin:0;flex:1">Tu página está publicada y tus eventos en marcha.</div>'+
        '<a class="btn ghost sm" href="'+esc(liga)+'" target="_blank" rel="noopener">'+esc(LP.texto)+'</a>';
      return;
    }

    function paso(num,listo,ahora,tit,desc,btn,accion,espera){
      return '<div class="paso'+(listo?' listo':(ahora?' ahora':''))+'">'+
        '<div class="ph"><div class="pn">'+(listo?'&#10003;':num)+'</div><div class="pt">'+tit+'</div></div>'+
        '<div class="pd">'+desc+'</div>'+
        '<div class="pa">'+(listo
            ? (accion ? '<button class="btn ghost sm" data-guia="'+accion+'">'+btn+'</button>'
                      : '<span class="espera" style="color:var(--ok)">Listo</span>')
            : (ahora ? '<button class="btn sm" data-guia="'+accion+'">'+btn+'</button>'
                     : '<span class="espera">'+espera+'</span>'))+'</div>'+
      '</div>';
    }

    /* LOS TRES PASOS, DESPUÉS DEL CONTRATO. Javi, 10-oct-2026: «si el cliente
       ya está aquí quiere decir que ya está el contrato firmado y está dada de
       alta». El paso 1 ya no es una tarea: es una confirmación, y se consulta
       en Mi cuenta. El trabajo empieza en el evento, y la página es una
       cortesía —su escaparate— que se explica aparte. */
    c.className='guia';
    c.innerHTML='<div class="gtit">Ya estás dentro. Esto es lo que sigue</div>'+
      '<div class="gsub">Tu alta está firmada. Ahora: tu evento, y después tu página.</div>'+
      '<div class="pasos">'+
        paso(1, true, false,
             'Tu cuenta, lista',
             'Firmaste tu acuerdo y tus datos están guardados. Si algo cambia —un correo, tu póliza, tu Stripe— lo cambias tú en <b>Mi cuenta</b>.',
             'Ver mi cuenta','cuenta','') +
        paso(2, e.eventos, true,
             'Crea tu evento',
             'Eliges el tipo y solo te pedimos lo que ese tipo necesita: la sala, cuándo, tus boletos y una foto. Queda en revisión hasta que el Ateneo lo valide y aparte la sala.',
             'Crear un evento','nuevo','') +
        paso(3, e.pagina, e.eventos,
             'Tu página, de cortesía',
             (e.lista
               ? 'Ya la llenaste. El Ateneo la revisa y la abre; entonces la liga funciona.'
               : 'Te damos una página con todos tus eventos, para que compartas una sola liga. No es obligatoria: es tuya si la quieres.'),
             'Preparar mi página','pagina','Antes, crea un evento') +
      '</div>'+
      /* La cuenta ya no es una tarea pendiente, así que el botón del paso 1
         tiene que poder pulsarse aunque esté «listo». */
      '';

    Array.prototype.forEach.call(c.querySelectorAll('[data-guia]'),function(b){
      b.onclick=function(){
        var a=b.getAttribute('data-guia');
        if(a==='nuevo'){ ve('eventos'); try{ nuevo(); }catch(_){ } return; }
        ve(a);
      };
    });
  }

  /* ---------- MIS RESERVAS ----------
     Javi, 11-oct-2026: «debe haber una pestaña de mis reservas de los que le
     reservaron y que las pueda gestionar», «con la info completa, contacto,
     posibilidad de cancelar la reserva y que se haga la devolución completa al
     cliente».

     Lo que tiene que resolver esta pantalla es el día a día: quién viene a lo
     mío, cuánta gente, si ya pagó y cómo le escribo. Por eso el contacto no
     está escondido detrás de un clic: el correo y el WhatsApp son ligas, que es
     lo que se usa cuando hay que avisar de que algo cambió.

     Cancelar devuelve el dinero ENTERO y manda el correo. Eso no lo hace esta
     pantalla: lo hace prod-reserva-cancelar, en el servidor, porque el dinero
     no se mueve desde un navegador. */
  /* LA LIGA DEL BOLETO. La misma que va en el correo del cliente: el boleto no
     se reinventa aquí, se abre el que ya existe. */
  var BOLETO='https://casapepe.mx/sincretico/evento-boleto.html';
  var RES=[], RESF='todas', RESV='lista', EVFIL='', DIAFIL='';
  try{ RESV=localStorage.getItem('resVista')||'lista'; }catch(_){}
  function dinero(n){ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }
  function cuandoRes(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',
      day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  }
  /* EL DÍA, EN HORA DE MÉXICO. Un evento a las 20:00 del 31 de octubre se
     guarda como 02:00 UTC del 1 de noviembre: agrupar por la fecha cruda
     partiría la salida en dos noches. */
  function diaMx(iso){
    if(!iso) return '';
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(iso))) return String(iso);
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',
      year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
    return p;
  }
  function diaLargo(ymd){
    if(!ymd) return 'Sin fecha';
    var p=String(ymd).split('-');
    var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12,0,0));
    return new Intl.DateTimeFormat('es-MX',{timeZone:'UTC',weekday:'long',day:'numeric',month:'long'}).format(d);
  }
  function horaMx(iso){
    if(!iso) return '';
    var d=new Date(iso); if(isNaN(d.getTime())) return '';
    return new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',
      hour:'2-digit',minute:'2-digit',hour12:false}).format(d);
  }
  function telLlano(t){ return String(t||'').replace(/[^0-9]/g,''); }
  /* La salida: un evento en un día. Si la reserva es por horas (una sala
     alquilada), manda su propio día; si no, el del evento. */
  function diaDe(r){ return diaMx(r.dia||r.evento_fecha); }
  function salidaDe(r){ return String(r.evento_id||'')+'|'+diaDe(r); }

  function pintaReservas(){
    $('pane-reservas').innerHTML=
      '<div class="card"><h3>Mis reservas</h3>'+
        '<div class="hint">Quién reservó en tus eventos, agrupado por salida: cada bloque es un evento en un día. '+
          'Puedes escribirles desde aquí, abrir su boleto, marcar quién entró y, si hace falta, '+
          'cancelar una reserva: al cancelarla le devolvemos <b>todo</b> lo que pagó y le avisamos por correo.</div>'+
        '<div class="ft" style="justify-content:flex-start;gap:8px;margin:10px 0 0;flex-wrap:wrap;align-items:center">'+
          '<select id="resEv" style="padding:8px 10px;border:1px solid var(--linea);border-radius:9px;font:inherit;font-size:13px;background:#fff"></select>'+
          '<select id="resDia" style="padding:8px 10px;border:1px solid var(--linea);border-radius:9px;font:inherit;font-size:13px;background:#fff"></select>'+
          '<div class="vista" id="resVista" style="margin-left:auto">'+
            '<button data-v="lista" aria-pressed="true">Listado</button>'+
            '<button data-v="foto" aria-pressed="false">Fotos</button></div>'+
        '</div>'+
        '<div class="ft" style="justify-content:flex-start;gap:6px;margin:8px 0 0;flex-wrap:wrap" id="resFiltros"></div>'+
        '<div id="resResumen" class="mini" style="margin-top:10px"></div>'+
        '<div id="resLista" style="margin-top:10px">Cargando…</div>'+
      '</div>';
    cargaReservas();
  }
  async function cargaReservas(){
    try{ RES=await rpc('prod_portal_reservas',{p_token:TOK})||[]; }
    catch(e){ RES=[]; var l=$('resLista'); if(l) l.innerHTML='<div class="hint">No pudimos traer tus reservas. Recarga la página.</div>'; return; }
    renReservas();
  }

  /* El filtro de estado y el de tour/fecha son cosas distintas: el primero dice
     qué reservas, el segundo de qué salida. Se aplican por separado para que
     «pagadas» no se coma la salida que estás mirando. */
  function pasaEstado(r){
    if(RESF==='pagadas')    return r.estado!=='cancelada' && r.pago_estado==='pagado';
    if(RESF==='pendientes') return r.estado!=='cancelada' && r.pago_estado!=='pagado';
    if(RESF==='canceladas') return r.estado==='cancelada';
    return true;
  }
  function pasaSalida(r){
    if(EVFIL && String(r.evento_id||'')!==EVFIL) return false;
    if(DIAFIL && diaDe(r)!==DIAFIL) return false;
    return true;
  }

  function renReservas(){
    var l=$('resLista'); if(!l) return;
    var vivas=RES.filter(function(r){return r.estado!=='cancelada';});
    var pagadas=vivas.filter(function(r){return r.pago_estado==='pagado';});
    var pax=vivas.reduce(function(s,r){return s+(Number(r.pax)||0);},0);
    var cobrado=pagadas.reduce(function(s,r){return s+(Number(r.pago_total)||Number(r.total)||0);},0);

    /* ---- el selector de tour ---- */
    var evs=[], vistos={};
    RES.forEach(function(r){ var k=String(r.evento_id||'');
      if(!vistos[k]){ vistos[k]=1; evs.push({id:k,n:r.evento||'(evento borrado)'}); } });
    evs.sort(function(a,b){return a.n.localeCompare(b.n,'es');});
    $('resEv').innerHTML='<option value="">Todos mis eventos</option>'+
      evs.map(function(e){return '<option value="'+esc(e.id)+'"'+(EVFIL===e.id?' selected':'')+'>'+esc(e.n)+'</option>';}).join('');
    $('resEv').onchange=function(){ EVFIL=this.value; DIAFIL=''; renReservas(); };

    /* ---- el selector de fecha, sólo con las fechas que ese tour tiene ---- */
    var dias=[], vd={};
    RES.filter(function(r){return !EVFIL||String(r.evento_id||'')===EVFIL;}).forEach(function(r){
      var d=diaDe(r); if(d&&!vd[d]){ vd[d]=1; dias.push(d); } });
    dias.sort();
    $('resDia').innerHTML='<option value="">Todas las fechas</option>'+
      dias.map(function(d){return '<option value="'+esc(d)+'"'+(DIAFIL===d?' selected':'')+'>'+esc(diaLargo(d))+'</option>';}).join('');
    $('resDia').onchange=function(){ DIAFIL=this.value; renReservas(); };

    /* ---- lista o fotos ---- */
    Array.prototype.forEach.call($('resVista').children,function(b){
      b.setAttribute('aria-pressed',String(b.getAttribute('data-v')===RESV));
      b.onclick=function(){ RESV=b.getAttribute('data-v');
        try{ localStorage.setItem('resVista',RESV); }catch(_){}
        renReservas(); };
    });

    var F=[['todas','Todas'],['pagadas','Pagadas'],['pendientes','Sin pagar'],['canceladas','Canceladas']];
    $('resFiltros').innerHTML=F.map(function(f){
      var n = f[0]==='todas'?RES.length
            : f[0]==='pagadas'?pagadas.length
            : f[0]==='pendientes'?vivas.filter(function(r){return r.pago_estado!=='pagado';}).length
            : RES.filter(function(r){return r.estado==='cancelada';}).length;
      return '<button class="btn ghost sm" data-rf="'+f[0]+'"'+(RESF===f[0]?' style="border-color:var(--verde);font-weight:700"':'')+'>'+
             esc(f[1])+' · '+n+'</button>';
    }).join('');
    Array.prototype.forEach.call($('resFiltros').children,function(b){
      b.onclick=function(){ RESF=b.getAttribute('data-rf'); renReservas(); };});

    var entraron=vivas.reduce(function(s,r){return s+(Number(r.usados)||0);},0);
    $('resResumen').innerHTML = RES.length
      ? '<b>'+pax+'</b> persona'+(pax===1?'':'s')+' esperada'+(pax===1?'':'s')+' en '+vivas.length+
        ' reserva'+(vivas.length===1?'':'s')+' · cobrado <b>'+dinero(cobrado)+'</b>'+
        (entraron?' · <b>'+entraron+'</b> ya entr'+(entraron===1?'ó':'aron'):'')
      : '';

    var lista=RES.filter(function(r){ return pasaEstado(r) && pasaSalida(r); });

    if(!lista.length){
      l.innerHTML='<div class="hint">'+(RES.length
        ? 'Nada en este filtro.'
        : 'Todavía no te ha reservado nadie. En cuanto el Ateneo publique un evento tuyo, las reservas caen aquí solas.')+'</div>';
      return;
    }

    /* ---- agrupar por salida ---- */
    var orden=[], grupos={};
    lista.forEach(function(r){
      var k=salidaDe(r);
      if(!grupos[k]){ grupos[k]={k:k,r:[],ev:r.evento,evid:r.evento_id,dia:diaDe(r),
                                 hora:horaMx(r.evento_fecha),espacio:r.evento_espacio,
                                 foto:r.evento_foto}; orden.push(k); }
      grupos[k].r.push(r);
    });
    orden.sort(function(a,b){ return String(grupos[b].dia).localeCompare(String(grupos[a].dia)); });

    function resumenG(g){
      var v=g.r.filter(function(r){return r.estado!=='cancelada';});
      return {
        res:v.length,
        pax:v.reduce(function(s,r){return s+(Number(r.pax)||0);},0),
        usados:v.reduce(function(s,r){return s+(Number(r.usados)||0);},0),
        cobrado:v.filter(function(r){return r.pago_estado==='pagado';})
                 .reduce(function(s,r){return s+(Number(r.pago_total)||Number(r.total)||0);},0)
      };
    }

    if(RESV==='foto'){
      /* LA GALERÍA ES DE SALIDAS, NO DE RESERVAS. La foto es la del evento: en
         una rejilla de reservas saldría la misma imagen diez veces. Aquí cada
         recuadro es una función, con su gente dentro; al tocarlo se abre. */
      l.innerHTML='<div class="rejilla">'+orden.map(function(k){
        var g=grupos[k], s=resumenG(g);
        var ini=g.foto
          ? '<img src="'+esc(g.foto)+'" alt="">'
          : '<div class="sinf">'+esc(String(g.ev||'E').trim().charAt(0).toUpperCase())+'</div>';
        return '<article class="tarj" data-sal="'+esc(k)+'">'+
          '<div class="foto">'+ini+'<div class="arr">'+
            (s.usados?'<span class="sello">'+s.usados+' dentro</span>':'')+'</div></div>'+
          '<div class="cuerpo">'+
            '<div class="nom2">'+esc(g.ev||'(evento borrado)')+'</div>'+
            '<div class="meta">'+esc(diaLargo(g.dia))+(g.hora?' · '+esc(g.hora):'')+
              (g.espacio?'<br>'+esc(g.espacio):'')+'</div>'+
            '<div class="pie2"><span>'+s.pax+' persona'+(s.pax===1?'':'s')+' · '+s.res+' reserva'+(s.res===1?'':'s')+'</span>'+
              '<b>'+dinero(s.cobrado)+'</b></div>'+
          '</div></article>';
      }).join('')+'</div>';
      Array.prototype.forEach.call(l.querySelectorAll('[data-sal]'),function(el){
        el.onclick=function(){
          var g=grupos[el.getAttribute('data-sal')];
          EVFIL=String(g.evid||''); DIAFIL=g.dia; RESV='lista';
          try{ localStorage.setItem('resVista','lista'); }catch(_){}
          renReservas();
        };});
      return;
    }

    l.innerHTML=orden.map(function(k){
      var g=grupos[k], s=resumenG(g);
      return '<div class="gsal">'+
          '<span class="gn">'+esc(g.ev||'(evento borrado)')+'</span>'+
          '<span class="gc">'+esc(diaLargo(g.dia))+(g.hora?' · '+esc(g.hora):'')+
            (g.espacio?' · '+esc(g.espacio):'')+'</span>'+
          '<span class="gr">'+s.pax+' persona'+(s.pax===1?'':'s')+
            (s.usados?' · '+s.usados+' dentro':'')+' · '+dinero(s.cobrado)+'</span>'+
        '</div>'+
        g.r.map(tarjetaReserva).join('');
    }).join('');

    Array.prototype.forEach.call(l.querySelectorAll('[data-cancel]'),function(b){
      b.onclick=function(){ pideCancelar(b.getAttribute('data-cancel'), b); };});
    Array.prototype.forEach.call(l.querySelectorAll('[data-check]'),function(b){
      b.onclick=function(){ compruebaCobro(b.getAttribute('data-check'), b); };});
    Array.prototype.forEach.call(l.querySelectorAll('[data-entra]'),function(b){
      b.onclick=function(){ marcaEntrada(b.getAttribute('data-entra'), b); };});
  }

  function tarjetaReserva(r){
    var cancelada = r.estado==='cancelada';
    var pagada    = r.pago_estado==='pagado';
    var pax       = Number(r.pax)||1;
    var usados    = Number(r.usados)||0;
    var tag = cancelada ? '<span class="tag bad">cancelada</span>'
            : pagada    ? '<span class="tag ok">pagada</span>'
                        : '<span class="tag warn">sin pagar</span>';
    var sello = (!cancelada && usados>0)
      ? '<span class="sello">'+(usados>=pax?'entró'+(pax>1?'n todos':''):(usados+' de '+pax+' dentro'))+'</span>' : '';
    var ctos=[];
    if(r.email)    ctos.push('<a href="mailto:'+esc(r.email)+'">✉️ '+esc(r.email)+'</a>');
    if(r.telefono) ctos.push('<a href="https://wa.me/'+esc(telLlano(r.telefono))+'" target="_blank" rel="noopener">💬 '+esc(r.telefono)+'</a>');
    var importe = Number(r.pago_total)||Number(r.total)||0;
    return '<div class="card" style="margin-top:10px'+(cancelada?';opacity:.6':'')+'">'+
      '<div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap">'+
        '<b style="font-size:15.5px">'+esc(r.nombre||'(sin nombre)')+'</b>'+
        '<span class="tag">'+pax+' '+(pax===1?'boleto':'boletos')+'</span>'+
        tag+sello+
        '<span class="mini" style="margin-left:auto">'+esc(r.folio||'')+'</span>'+
      '</div>'+
      (ctos.length?'<div class="mini" style="margin-top:6px;display:flex;gap:12px;flex-wrap:wrap">'+ctos.join('')+'</div>':
                   '<div class="mini" style="margin-top:6px">Sin datos de contacto.</div>')+
      '<div class="mini" style="margin-top:6px">'+
        (r.tier?esc(r.tier)+' · ':'')+
        dinero(importe)+
        (Number(r.descuento)>0?' · descuento '+dinero(r.descuento):'')+
        (r.codigo?' · código '+esc(r.codigo):'')+
        ' · reservó '+esc(cuandoRes(r.created_at))+
        (r.canal?' · '+esc(r.canal):'')+
        (r.usado_at?' · último escaneo '+esc(cuandoRes(r.usado_at)):'')+
      '</div>'+
      (r.notas?'<div class="mini" style="margin-top:6px;white-space:pre-line;color:var(--tenue)">'+esc(r.notas)+'</div>':'')+
      (cancelada?'':
        '<div class="ft" style="justify-content:flex-start;margin-top:10px;gap:8px;flex-wrap:wrap">'+
          /* EL BOLETO, A MANO. Javi, 11-oct-2026: «permíteme aquí poner el
             boleto». Es el mismo que recibió el cliente por correo: si lo
             perdió, se abre desde aquí y se le reenvía la liga. */
          (r.folio?'<a class="btn ghost sm" href="'+esc(BOLETO)+'?f='+encodeURIComponent(r.folio)+'" target="_blank" rel="noopener">Ver el boleto</a>':'')+
          /* Y marcar la entrada sin cámara: en la puerta no siempre se puede
             escanear —se acabó la batería, el QR no se lee, el cliente llega
             con el folio escrito. Suma una persona, igual que el escáner. */
          ((usados<pax && (pagada||importe<=0))?'<button class="btn ghost sm" data-entra="'+esc(r.folio||'')+'">Marcar entrada'+(pax>1?' ('+usados+'/'+pax+')':'')+'</button>':'')+
          /* COMPROBAR EL COBRO. Javi, 11-oct-2026. Mientras el aviso de Stripe
             no esté dado de alta —y aun estándolo, porque un aviso se puede
             perder— una reserva puede estar cobrada de verdad y aquí decir
             «sin pagar». Este botón le pregunta a Stripe por ESE cobro y
             escribe lo que Stripe conteste; si entró, marca pagada y manda el
             boleto, igual que haría el aviso. No decide nada por su cuenta. */
          (pagada?'':'<button class="btn ghost sm" data-check="'+esc(r.id)+'">Comprobar el cobro</button>')+
          '<button class="btn ghost sm" data-cancel="'+esc(r.id)+'" style="color:#B3261E;border-color:#E6B8B2">'+
            'Cancelar'+(pagada?' y devolver '+dinero(importe):'')+'</button>'+
        '</div>')+
    '</div>';
  }

  /* ---------- ESCANEAR BOLETOS ----------
     Javi, 11-oct-2026: «falta en el menú de productora un botón arriba de
     escanear boletos que vaya marcando en mis reservas los boletos ya
     escaneados».

     Quien valida es la base, no esta pantalla: evento_verificar_boleto
     comprueba con el token del portal que el boleto es de un evento suyo, que
     la reserva no está cancelada, que está pagada si hay algo que pagar, y
     entonces suma una persona. Aquí sólo se enseña lo que conteste.

     Se cuenta por personas, no por boletos: una reserva de tres lleva un solo
     QR y la familia llega junta. Al tercer escaneo se cierra. */
  var LECTOR=null, ULT='', ULTAT=0, ESCHIST=[];
  /* La base contesta con un mensaje en castellano cuando el boleto no es de sus
     eventos. El rpc() general se lo come y deja un «403» a secas; aquí sí se
     enseña, porque es lo único que le dice al portero qué está pasando. */
  async function rpcDicho(fn,body){
    var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},hdrs()),
      body:JSON.stringify(body||{})});
    var j=null; try{ j=await r.json(); }catch(_){}
    if(!r.ok) throw new Error((j&&(j.message||j.hint))||('no se pudo ('+r.status+')'));
    return j;
  }

      if(f<hoy) return;
      if(!mejor || f<mejor.f) mejor={f:f, nombre:e.nombre||'tu evento'};
    });

  function cargaLib(src){
    return new Promise(function(ok,mal){
      if(window.Html5Qrcode) return ok();
      var s=document.createElement('script');
      s.src=src; s.onload=function(){ok();}; s.onerror=function(){mal(new Error('no cargó el lector'));};
      document.head.appendChild(s);
    });
  }
  async function enciendeLector(){
    try{
      $('escNota').textContent='Preparando la cámara…';
      await cargaLib('https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js');
      LECTOR=new Html5Qrcode('lector');
      $('escOn').style.display='none'; $('escOff').style.display='';
      $('escNota').textContent='Apunta al QR.';
      await LECTOR.start({facingMode:'environment'},{fps:10,qrbox:240},function(txt){ verifica(txt,true); },function(){});
    }catch(e){
      $('escNota').textContent='No se pudo abrir la cámara: '+(e.message||e)+'. Usa el folio, abajo.';
      $('escOn').style.display=''; $('escOff').style.display='none'; LECTOR=null;
    }
  }
  async function apagaLector(){
    if(!LECTOR) return;
    try{ await LECTOR.stop(); }catch(_){}
    try{ LECTOR.clear(); }catch(_){}
    LECTOR=null;
    if($('escOn')){ $('escOn').style.display=''; $('escOff').style.display='none'; $('escNota').textContent=''; }
  }

  async function verifica(codigo, deCamara){
    codigo=String(codigo||'').trim().toUpperCase();
    if(!codigo) return;
    /* El lector dispara varias veces sobre el mismo QR mientras lo enfoca: sin
       esto, el segundo disparo contaría una persona de más. Sólo vale para la
       cámara: si alguien teclea el mismo folio dos veces es porque entra la
       segunda persona de esa reserva, y ahí sí hay que contar. */
    var ahora=Date.now();
    if(deCamara && codigo===ULT && ahora-ULTAT<4000) return;
    ULT=codigo; ULTAT=ahora;
    var el=$('escRes'); if(el){ el.className='resq'; el.innerHTML='<div class="mini">Comprobando…</div>'; }
    try{
      var j=await rpcDicho('evento_verificar_boleto',{p_codigo:codigo,p_token:TOK,p_marcar:true});
      pintaEsc(j);
      cargaReservas();
    }catch(e){
      if(el){ el.className='resq bad';
        el.innerHTML='<div class="big">No se pudo comprobar</div><div class="pie">'+esc(e.message||e)+'</div>'; }
    }
  }

     con un confirm del navegador —que Javi no quiere— sino escribiendo el
     motivo, que además es lo que lee el cliente en su correo. */
  function pideCancelar(id, boton){
    var r=RES.filter(function(x){return x.id===id;})[0]; if(!r) return;
    var caja=boton.closest('.card');
    if(caja.querySelector('[data-cbox]')) return;
    var importe=Number(r.pago_total)||Number(r.total)||0;
    var pagada=r.pago_estado==='pagado';
    var d=document.createElement('div');
    d.setAttribute('data-cbox','1');
    d.style.cssText='margin-top:10px;background:#FBEFEE;border:1px solid #E6B8B2;border-radius:10px;padding:12px 14px';
    d.innerHTML=
      '<div class="mini" style="color:#B3261E"><b>Vas a cancelar la reserva de '+esc(r.nombre||'este cliente')+'.</b> '+
        (pagada?('Le devolvemos <b>'+dinero(importe)+'</b>, el importe completo, al mismo medio con el que pagó.')
               :('No había pagado nada, así que no hay cargo que devolver.'))+
        ' Le llega un correo avisándole. Esto no se deshace.</div>'+
      '<div class="fld" style="margin-top:10px"><label>¿Por qué? Lo lee el cliente</label>'+
        '<input data-motivo placeholder="Se canceló la función por falta de aforo"></div>'+
      '<div class="ft" style="justify-content:flex-start;margin-top:10px;gap:8px">'+
        '<button class="btn sm" data-ok style="background:#B3261E;border-color:#B3261E">Sí, cancelar y devolver</button>'+
        '<button class="btn ghost sm" data-no>Dejarlo como está</button>'+
      '</div>';
    caja.appendChild(d);
    d.querySelector('[data-no]').onclick=function(){ d.remove(); };
    d.querySelector('[data-ok]').onclick=async function(){
      var bt=this; bt.disabled=true; bt.textContent='Cancelando…';

        var res=await fetch(SB+'/functions/v1/prod-reserva-cancelar',{
          method:'POST', headers:Object.assign({'Content-Type':'application/json'},hdrs()),
          body:JSON.stringify({token:TOK, reserva_id:id,
                               motivo:(d.querySelector('[data-motivo]').value||'').trim()})});

        bt.disabled=false; bt.textContent='Sí, cancelar y devolver';

  function renTabla(){
    try{ guia(); }catch(_){ }
    $('tbE').innerHTML=EV.map(function(e){
      /* COMO VA SU SALA. Una cosa es que el evento este aprobado y otra que la
         sala sea suya: hasta que el Ateneo confirme la fecha, otra productora
         puede pedir esa misma noche. Javi, 4-oct-2026. */
      /* UN BORRADOR NO FALLÓ NADA. Javi, 10-oct-2026: un evento a medias salía
         con «sin sala apartada» en rojo, como si algo se hubiera roto. Un
         borrador no aparta sala a propósito: nadie pierde un hueco por algo
         que todavía se está escribiendo. */
      /* LA SALA CONFIRMADA SE PUEDE QUEDAR ATRÁS, Y EN SILENCIO. Javi,
         10-oct-2026: «¿puedes tratar de no duplicar?». Duplicar no duplica: la
         solicitud es única por evento y el hueco se borra y se reescribe en
         cada guardado, también si cambia de sala. Lo que sí pasaba, y sin
         avisar, es que una vez CONFIRMADA la sala el portal ya no la mueve —y
         con razón, es del Ateneo— así que cambiar la hora del evento dejaba
         apartada la hora vieja. Aquí se compara lo apartado con lo que el
         evento dice ahora, y si no coinciden se canta. */
      var desfase=false;
      if(e.sala_estado==='aprobada' && e.sala_desde && e.fecha_inicio){
        var deb=new Date(new Date(e.fecha_inicio).getTime()-(e.montaje_min||0)*60000);
        desfase = Math.abs(deb-new Date(e.sala_desde))>60000;
      }
      var sala = desfase ? '<span class="tag" style="background:#F6EBD5;color:#8C6212" '+
                   'title="La sala está apartada en otra hora. Avísale a Casa Pepe para rehacerla.">sala en otra hora</span>'
               : e.sala_estado==='aprobada' ? '<span class="tag" style="background:#E1F0E7;color:#1D6B4A">sala confirmada</span>'
               : e.sala_estado==='rechazada' ? '<span class="tag" style="background:#F6E1DD;color:#9E3B2E">sala rechazada</span>'
               : e.sala_estado ? '<span class="tag" style="background:#F6EBD5;color:#8C6212">sala pendiente</span>'
               : e.estado==='borrador' ? '<span class="tag" style="background:#F4EFE8;color:#6E665C">te falta mandarlo</span>'
               /* UN SERVICIO POR HORAS NO APARTA SALA, Y NO ES UN FALLO. La
                  base no le pide la sala a proposito -la aparta quien compra
                  las horas- asi que marcarlo en rojo como «sin sala apartada»
                  es decirle que algo se rompio cuando esta funcionando. */
               : e.tipo==='reserva_horas' ? '<span class="tag" style="background:#E4F1FA;color:#1F5B7A">se vende por horas</span>'
               : '<span class="tag" style="background:#F6E1DD;color:#9E3B2E">sin sala apartada</span>';
      var fam = e.clase==='espacio' ? 'Espacio creativo' : e.clase==='privado' ? 'Uso privado' : 'Evento con público';
      return '<tr><td><b>'+esc(e.nombre||'(sin nombre)')+'</b>'+(e.es_gratis?' <span class="tag">gratis</span>':'')+
        '<div class="mini" style="color:var(--tenue,#A9A096)">'+esc(fam)+'</div></td>'+
        '<td class="mini">'+esc(evtDef(e.tipo).n)+'</td><td class="mini">'+esc(fmtCuando(e))+'</td>'+
        '<td>'+estadoTag(e)+'<div style="margin-top:4px">'+sala+'</div></td>'+
        '<td style="white-space:nowrap">'+
          '<button class="btn ghost sm" data-pv="'+e.id+'" title="Así lo vería el huésped">Ver ficha</button> '+
          '<button class="btn ghost sm" data-ev="'+e.id+'">Abrir</button></td></tr>';
    }).join('')||'<tr><td colspan="5" class="mini">Todavía nada. Crea tu primer evento.</td></tr>';
    Array.prototype.forEach.call($('tbE').querySelectorAll('[data-ev]'),function(b){b.onclick=function(){abre(b.getAttribute('data-ev'));};});
    Array.prototype.forEach.call($('tbE').querySelectorAll('[data-pv]'),function(b){b.onclick=function(){

    Array.prototype.forEach.call($('fnav').children,function(b){b.onclick=function(){try{guardaYa('auto');}catch(_){ }var f=b.getAttribute('data-f');Array.prototype.forEach.call($('fnav').children,function(x){x.setAttribute('aria-selected',x.getAttribute('data-f')===f?'true':'false');});document.querySelectorAll('.fsec').forEach(function(s){s.classList.toggle('on',s.getAttribute('data-fs')===f);});try{pintaPasosEv();}catch(_){ }};});
    try{ pintaPasosEv(); }catch(_){ }
    /* Mientras escribe, no al guardar: el punto tiene que moverse cuando se
       llena el campo, no un segundo despues. */
    $('fichaHost').addEventListener('input',function(){ try{pintaPasosEv();}catch(_){ } });
    $('fichaHost').addEventListener('change',function(){ try{pintaPasosEv();}catch(_){ } });
    $('agMas').onclick=function(){AG.push({fecha:null,hora:null,titulo:'',ponente:''});renAg();};
    $('prMas').onclick=function(){PR.push({nombre:'',precio:null,cupo:null,incluye:''});renPr();};
    if($('paqMas')) $('paqMas').onclick=function(){ PAQS.push({horas:4,precio:null}); pintaPaqs(); tocado(); };
    pintaPaqs();
    Array.prototype.forEach.call(document.querySelectorAll('[data-tier]'),function(c){c.onclick=function(){PR.push({nombre:c.getAttribute('data-tier'),precio:null,cupo:null,incluye:''});renPr();};});
    /* SALIR NO ES TIRAR. Javi, 10-oct-2026: «permite que si avanzamos un evento
       y salimos no se pierda, entre en borrador». Si no escribió nada, no se
       crea una ficha vacía por salir. */
    /* «GUARDAR Y SALIR» TIENE QUE GUARDAR SIEMPRE.
       Javi, 13-oct-2026: «cuando estás creando un evento y le das a guardar y
       salir te saca; nos borró lo de cuándo y dónde y lo de impacto».
       No lo borraba la base: es que esto NO GUARDABA. La condición de abajo
       solo salvaba el evento nuevo o en borrador; si el evento ya estaba
       propuesto —que es el caso en cuanto lo mandas una vez— el botón decía
       «Guardar y salir», no guardaba nada y cerraba la ficha. Todo lo que
       acababas de escribir se iba con ella: la fecha, la sala, el impacto.
       Ahora guarda en los dos casos. El nuevo o el borrador se guardan como
       borrador; el que ya está propuesto se guarda SIN exigirle que esté
       completo y SIN degradarlo a borrador, que es lo que haría guardar(true). */
    /* CERRAR GUARDA ANTES DE IRSE. Nunca se sale de una ficha perdiendo lo
       ultimo que se escribio: si el guardado automatico no habia llegado a
       correr, corre ahora y despues se cierra. */
    $('fCerrar').onclick=async function(){
      $('fCerrar').disabled=true;
      try{ await guardaYa('cerrar'); }catch(_){ }
      $('fCerrar').disabled=false;

    /* OJO AQUÍ. `onclick=guardar` le pasa a la función el evento del ratón como
       primer argumento, y ese argumento es `borrador`. Un MouseEvent es
       «verdadero», así que «Enviar a Casa Pepe» guardaba SIEMPRE en borrador y
       nunca mandaba nada. Javi, 10-oct-2026: «le di a enviar y no se actualizó
       nada». Por eso se llama con el valor explícito. */
    /* Y ANTES DE MANDARLO, SE PREGUNTA. Javi, 13-oct-2026: «al dar a enviar
       solicitud consultale si esta seguro y se envia». Mandar es el gesto que
       pone el evento delante de Casa Pepe y le pide la sala: no puede salir de
       un clic de paso. */
    $('fGuardar').onclick=function(){ confirmaEnvio(); };

    /* TODO LO QUE SE TOQUE AQUI DENTRO SE GUARDA SOLO. Javi, 13-oct-2026: «se
       actualiza el guardado a medida que vas metiendo datos» y «no permitas
       que se pierda info». Se escucha en el contenedor de la ficha, no campo
       por campo: asi el campo que se anada manana entra solo. */
    (function(){
      var host=$('fichaHost'); if(!host) return;

  /* Las salas que puede pedir, y solo esas. Si su giro le da una sola, se
     elige sola: no hay nada que decidir. */
  function pintaEspacios(){
    var sel=$('ev-espacio'); if(!sel) return;
    var tipo=$('evTipo')?$('evTipo').value:'';
    /* LA SALA DICE PARA QUE SIRVE. Las tres de hotel -La Cosmica CDMX, La
       Cosmica Puebla y el Lobby- son de evento abierto al publico, asi que no
       salen cuando lo que se da de alta es un espacio creativo o un uso
       privado. Javi, 5-oct-2026. */
    /* EL TIPO SUGIERE, NO DESCARTA. Javi, 10-oct-2026: «me sigue sin guardar
       Café Cumbre». No era el guardado: era que la sala desaparecía de la
       lista. `ev_giro_espacio.evento_tipos` habla otro idioma que el
       desplegable —dice 'concierto', 'estudio', 'temporada', 'rodaje'; el
       desplegable dice 'funcion', 'reserva_horas', 'grabacion'—, así que
       Café Cumbre, marcada para 'concierto', se caía al elegir 'Función /
       show'. Un desajuste de vocabulario escondiendo salas es peor que
       enseñarlas todas: ahora el tipo solo las ordena, las de su giro primero,
       y quien filtra de verdad es el permiso (`ev_productora_espacios`). */
    var puede=ESPACIOS.filter(function(e){
      return (!e.clases || !e.clases.length) || e.clases.indexOf(CLASE)>=0; });
    if(!puede.length) puede=ESPACIOS.slice();
    if(tipo) puede.sort(function(a,b){
      var A=(a.evento_tipos&&a.evento_tipos.indexOf(tipo)>=0)?0:1;
      var B=(b.evento_tipos&&b.evento_tipos.indexOf(tipo)>=0)?0:1;
      return A-B; });
    var antes=sel.value;
    /* Agrupadas por sede: ya no son solo las de Virreyes y conviene que se vea
       de un golpe si la sala esta en el Ateneo, en CDMX o en Puebla. */
    var sedes=[], porSede={};
    puede.forEach(function(e){
      var s=e.sede_nombre||'Salas';
      if(!porSede[s]){ porSede[s]=[]; sedes.push(s); }
      porSede[s].push(e);
    });
    var opciones = sedes.map(function(s){
      return '<optgroup label="'+esc(s)+'">'+porSede[s].map(function(e){
        var n=e.nombre+(e.alias?' · '+e.alias:'')+(e.capacidad?'  ('+e.capacidad+' personas)':'');
        return '<option value="'+esc(e.slug)+'">'+esc(n)+'</option>';
      }).join('')+'</optgroup>';
    }).join('');
    sel.innerHTML='<option value="">— elige la sala —</option>'+opciones;
    if(antes) sel.value=antes;
    if(!sel.value && puede.length===1) sel.value=puede[0].slug;
    infoEspacio();
    fichaTec();
  }
  function infoEspacio(){
    var sel=$('ev-espacio'), box=$('ev-espacio-info'); if(!sel||!box) return;
    var e=ESPACIOS.filter(function(x){return x.slug===sel.value;})[0];
    if(!e){ box.textContent=''; return; }
    var t=[];
    if(e.capacidad) t.push('Aforo '+e.capacidad+(e.capacidad_sentado?' de pie · '+e.capacidad_sentado+' sentado':''));
    if(e.fianza_tipo==='monto'&&e.fianza_monto) t.push('Fianza $'+Number(e.fianza_monto).toLocaleString('es-MX'));
    else if(e.fianza_tipo==='renta_mes') t.push('Fianza: un mes de renta');

  /* LA FICHA TECNICA DE LA SALA. Javi, 3-oct-2026: «sobre el backline de
     Cosmica CDMX este es el criterio y articulos que hay para tocar. Es
     importante que los productores lo sepan por si tienen que contratar a un
     ingeniero de sonido». Sale aqui, al elegir la sala, que es cuando todavia
     se puede decidir; no en un PDF que nadie abre. Si falta ingeniero, el
     boton le manda un WhatsApp a Fernando con los datos del evento ya puestos
     para que le pase precio. */
  var TEC={};
  async function fichaTec(){
    var box=$('ev-ficha-tec'), slug=$('ev-espacio')?$('ev-espacio').value:'';
    if(!box) return;
    if(!slug){ box.innerHTML=''; return; }
    var d=TEC[slug];
    if(d===undefined){
      box.innerHTML='<div class="mini">Cargando la ficha de la sala…</div>';
      try{ d=await rpc('ev_ficha_tecnica',{p_espacio:slug}); }catch(_){ d=null; }
      TEC[slug]=d;
    }
    if(!d){ box.innerHTML=''; return; }
    var bl={}, orden=[];
    (d.backline||[]).forEach(function(b){ if(!bl[b.bloque]){bl[b.bloque]=[];orden.push(b.bloque);} bl[b.bloque].push(b); });
    var h=[];
    h.push('<details class="tecbox"><summary>🎛 Qué hay en '+esc(d.espacio)+' para tocar'+
           (d.ing_sonido_costo?' · ingeniero de la casa $'+Number(d.ing_sonido_costo).toLocaleString('es-MX'):'')+'</summary>');
    h.push('<div class="tecin">');
    if(d.descripcion) h.push('<p class="tecp">'+esc(d.descripcion)+'</p>');
    orden.forEach(function(k){
      h.push('<div class="tecg"><b>'+esc(k)+'</b><ul>'+bl[k].map(function(b){
        /* CON FOTO Y CON DESCRIPCIÓN. Javi, 10-oct: «Cable RCA 100 - 20mt,
           foto». Una lista de nombres no le dice a un productor si el cable
           que hay le sirve; la foto sí. */
        return '<li>'+(b.cantidad?'<i>'+(+b.cantidad)+'</i> ':'')+esc(b.equipo)+
          (b.nota?' <span style="color:var(--tenue,#A9A096)">· '+esc(b.nota)+'</span>':'')+
          (b.foto?' <a href="'+esc(b.foto)+'" target="_blank" rel="noopener">'+
            '<img src="'+esc(b.foto)+'" alt="" style="width:34px;height:26px;object-fit:cover;'+
            'border-radius:5px;vertical-align:middle;margin-left:4px;border:1px solid var(--linea,#E6DFD6)"></a>':'')+
          '</li>';

    });

    if((d.servicios||[]).length)
      h.push('<div class="tecg"><b>Servicios que puedes contratar</b><ul>'+d.servicios.map(function(x){

          (x.foto?' <a href="'+esc(x.foto)+'" target="_blank" rel="noopener">'+
            '<img src="'+esc(x.foto)+'" alt="" style="width:34px;height:26px;object-fit:cover;'+
            'border-radius:5px;vertical-align:middle;margin-left:4px;border:1px solid var(--linea,#E6DFD6)"></a>':'')+
          '</li>';
      }).join('')+'</ul></div>');
    if(d.criterio) h.push('<div class="tecg"><b>Cómo trabajamos</b><ul>'+String(d.criterio).split('\n')
        .filter(Boolean).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul></div>');
    if(d.observaciones) h.push('<div class="tecg"><b>Ten en cuenta</b><ul>'+String(d.observaciones).split('\n')
        .filter(Boolean).map(function(l){return '<li>'+esc(l)+'</li>';}).join('')+'</ul></div>');
    if((d.horarios||[]).length) h.push('<div class="tecg"><b>Cómo va el día</b><ul>'+d.horarios.map(function(x){
        return '<li><i>'+esc(x.hora)+'</i> '+esc(x.que)+'</li>';}).join('')+'</ul></div>');

             '<div class="mini" style="margin-top:5px">Le llega a '+esc(d.apoyo.quien||d.apoyo.productora)+
             ' de '+esc(d.apoyo.productora)+' con los datos de tu evento, y él te pasa precio.</div>');

           afo?('Aforo estimado: '+afo):'',

          '<input data-ex="'+i+'" data-k="cantidad" type="number" min="1" value="'+(x.cantidad||1)+'" style="'+inp+';max-width:72px">'+
          '<button class="btn ghost sm" data-exdel="'+i+'" type="button">×</button></div>'; }).join('')
      : '<div class="mini" style="color:var(--tenue,#A9A096)">Nada por ahora.</div>';
    Array.prototype.forEach.call(c.querySelectorAll('[data-ex]'),function(el){
      el.onchange=function(){ var k=el.getAttribute('data-k');
        EXTRA[+el.getAttribute('data-ex')][k] = k==='cantidad' ? Number(el.value||1) : el.value;
        if(k==='clase') renExtra(); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-exdel]'),function(b){
      b.onclick=function(){ EXTRA.splice(+b.getAttribute('data-exdel'),1); renExtra(); };
    });
  }
  /* LAS DOS FRANJAS, A LA VISTA. La sala se bloquea desde el montaje; el boleto
     se vende a la hora de inicio. Que lo vea antes de mandarlo, no despues. */
  function pintaFranjas(){
    var c=$('ev-franjas'); if(!c) return;
    var f=($('ev-fecha')&&$('ev-fecha').value)||($('ev-desde')&&$('ev-desde').value)||'';
    var hi=$('ev-hora-ini')?$('ev-hora-ini').value:'';
    if(!f||!hi){ c.innerHTML='<span style="color:var(--tenue,#A9A096)">Pon la fecha y la hora de inicio y te digo qué franja apartas.</span>'; return; }
    var dur=Number(($('ev-duracion')&&$('ev-duracion').value)||0)||120;
    var hf=$('ev-hora-fin')?$('ev-hora-fin').value:'';
    var ini=new Date(f+'T'+hi+':00');
    var fin= hf ? new Date(f+'T'+hf+':00') : new Date(ini.getTime()+dur*60000);
    if(fin<=ini) fin=new Date(ini.getTime()+dur*60000);
    var mo=montajeMin(), de=desmontajeMin();
    var sd=new Date(ini.getTime()-mo*60000), sh=new Date(fin.getTime()+de*60000);
    var hh=function(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);};
    c.innerHTML='<div style="background:var(--crema,#F7F3EA);border-radius:9px;padding:9px 11px;line-height:1.6">'+
      '<b>La sala queda apartada de '+hh(sd)+' a '+hh(sh)+'</b> — eso es lo que nadie más puede pedir.<br>'+
      'El boleto se vende para las <b>'+hh(ini)+'</b>'+(hf?' y acaba a las '+hh(fin):'')+'.'+
      (mo||de ? '<br><span style="color:var(--gris,#6E665C)">Incluye '+mo+' min de montaje y '+de+' de desmontaje.</span>' : '')+
      '</div>';
  }

  /* La explicacion, con el caso que pregunto Javi: Reyes y su estudio de
     grabacion por horas. No hay funcion, hay llave: es espacio creativo. */
  var FAM_EJ={
    evento:'<b>Ejemplos:</b> un concierto, una obra, un congreso, un taller al que la gente se apunta, '+
           'una expo con inauguración. <b>La señal:</b> si no vas, te lo pierdes — hay función, y a una hora.',
    espacio:'<b>Ejemplos:</b> «Estudio de grabación por horas» de Reyes, ensayar en la sala de música, '+
            'grabar un podcast. <b>La señal:</b> no hay función, hay llave. El cliente compra un rato de sala '+
            'y lo usa él. Se vende igual y se cobra igual que un evento.',
    privado:'<b>Ejemplos:</b> un rodaje de comercial, una sesión de fotos cerrada, una junta privada. '+
            '<b>La señal:</b> nadie compra un boleto para ver grabar un anuncio. No sale publicado.'
  };
  function pintaFamAyuda(){ var c=$('famAyuda'); if(c) c.innerHTML=FAM_EJ[CLASE]||''; }

  /* ---------- EL CALENDARIO DE LA SALA ---------- */
  var AG_SALA=null, AG_MES=null, AG_ESP=null;
  function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);}
  async function cargaAgenda(){
    var sel=$('ev-espacio'); if(!sel) return;
    var eob=ESPACIOS.filter(function(x){return x.slug===sel.value;})[0];
    AG_ESP = eob?eob.espacio_id:null;
    if(!AG_ESP){ AG_SALA=null; pintaCal(); return; }
    if(!AG_MES) AG_MES=new Date(new Date().getFullYear(), new Date().getMonth(), 1);
    var d1=new Date(AG_MES.getFullYear(),AG_MES.getMonth(),1);
    var d2=new Date(AG_MES.getFullYear(),AG_MES.getMonth()+1,0);
    try{ AG_SALA=await rpc('prod_portal_agenda_sala',
      {p_token:TOK,p_espacio:AG_ESP,p_desde:ymd(d1),p_hasta:ymd(d2)}); }
    catch(_){ AG_SALA=null; }
    pintaCal();
  }
  /* ---------- EL CALENDARIO DE LA SALA, EN DOS PASOS ----------
     Javi, 10-oct-2026, dictado pantalla a pantalla:
       «Primero pregunta si es evento día entero o por horas. Si es día entero
        los días que ya hay evento saldrán en rojo. Si es por horas el productor
        tocará el día y abrirá un calendario de las horas del día y le
        aparecerán las horas con los bloqueos ya confirmados.»
     Lo que se elige aquí escribe los campos de siempre (ev-fecha, ev-hora-ini,
     ev-hora-fin), que es lo que lee el guardado y lo que aparta la sala. */
  var CAL_MODO='horas';           // 'dia' | 'horas'
  var CAL_DIA=null;               // el día abierto en la rejilla de horas
  var CAL_PASO=30;                // media hora
  var CAL_ABRE=7, CAL_CIERRA=23;  // lo que abre la casa

  function hhmm(min){ var h=Math.floor(min/60), m=min%60;
    return ('0'+h).slice(-2)+':'+('0'+m).slice(-2); }
  function aMin(t){ if(!t) return null; var p=String(t).slice(0,5).split(':');
    return Number(p[0])*60+Number(p[1]||0); }

  /* Las franjas ya tomadas de un día, en minutos, marcando si están confirmadas.
     Montaje y desmontaje ya vienen dentro: la sala se aparta desde que alguien
     empieza a montar. */
  function ocupadoDe(dia){
    var l=((AG_SALA&&AG_SALA.ocupado)||[]).filter(function(o){ return o.dia===dia; });
    return l.map(function(o){
      /* `mio` = de esta productora. `propio` = de ESTE evento, el que edito. */
      var mio=!!o.mio;
      var propio = mio && evCur && evCur.nombre && String(o.que||'')===String(evCur.nombre);
      return {d:aMin(o.desde), h:aMin(o.hasta), firme:!!o.firme, mio:mio, propio:propio, que:o.que||''};
    }).filter(function(o){ return o.d!=null && o.h!=null; });
  }
  /* La reserva de ESTE evento no choca consigo misma: si estoy corrigiendo la
     hora de un evento que ya tiene la sala pedida, su propia franja no puede
     ser el obstáculo. Javi, 10-oct-2026. */
  function chocaCon(dia,d,h){
    return ocupadoDe(dia).some(function(o){ return !o.propio && d < o.h && h > o.d; });
  }

  /* Lo que de verdad se aparta: el evento más su montaje y su desmontaje. */
  function montajeMin(){
    if(!$('ev-necesita-montaje') || !$('ev-necesita-montaje').checked) return 0;
    /* El tiempo lo pone él. Javi, 10-oct-2026: «que ellos pongan el tiempo y lo
       mismo en desmontar». Había un mínimo de una hora forzado por dentro que
       la pantalla ya no anuncia, y una regla escondida es peor que ninguna. */
    return Number(($('ev-montaje')&&$('ev-montaje').value)||0)||0;
  }
  function desmontajeMin(){
    if(!$('ev-necesita-montaje') || !$('ev-necesita-montaje').checked) return 0;
    return Number(($('ev-desmontaje')&&$('ev-desmontaje').value)||0)||0;
  }

  /* Sin montaje no hay minutos que ajustar, así que los campos se van. Y con
     montaje el mínimo es una hora: es la regla de Javi, no una sugerencia. */
  function montajeUI(){
    var on = $('ev-necesita-montaje') ? $('ev-necesita-montaje').checked : false;
    if($('wrapMontajes')) $('wrapMontajes').style.display = on ? '' : 'none';
    var c=$('ev-bloqueo');
    if(c){
      var mo=montajeMin(), de=desmontajeMin();
      var rato=function(m){ return m>=60 ? (Math.round(m/60*10)/10)+' h' : m+' min'; };
      c.innerHTML = (mo||de)
        ? 'Apartaremos la sala <b>'+rato(mo)+' antes</b> y <b>'+rato(de)+' después</b> de tu evento. '+
          'Lo verás pintado en el calendario.'
        : 'No apartamos nada antes ni después: solo la hora de tu evento.';
    }
  }

  function pintaModo(){
    var c=$('calModo'); if(!c) return;
    c.innerHTML=[['dia','Todo el día','De 07:00 a 23:00, que es lo que abre la casa'],
                 ['horas','Por horas','Eliges la hora de inicio y la de fin']]
      .map(function(x){
        var on=(CAL_MODO===x[0]);
        return '<button type="button" data-modo="'+x[0]+'" style="flex:1;text-align:left;'+
          'border:'+(on?'2px solid var(--ok,#1D6B4A)':'1px solid var(--linea,#E2DCCF)')+';'+
          'background:'+(on?'var(--ok-bg,#E1F0E7)':'#fff')+';border-radius:10px;'+
          'padding:9px 11px;font:inherit;cursor:pointer">'+
          '<b style="font-size:13px">'+x[1]+'</b>'+
          '<div class="mini" style="margin-top:2px">'+x[2]+'</div></button>';
      }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-modo]'),function(b){
      b.onclick=function(){
        CAL_MODO=b.getAttribute('data-modo');
        var ch=$('ev-todoeldia'); if(ch) ch.checked=(CAL_MODO==='dia');
        if(CAL_MODO==='dia'){
          if($('ev-hora-ini')) $('ev-hora-ini').value='07:00';
          if($('ev-hora-fin')) $('ev-hora-fin').value='23:00';
        }
        CAL_DIA=null; pintaCal(); pintaFranjas();
      };
    });
  }

  function pintaHoras(){
    var c=$('calHoras'); if(!c) return;
    if(CAL_MODO!=='horas' || !CAL_DIA){ c.innerHTML=''; return; }
    var oc=ocupadoDe(CAL_DIA);
    var hi=aMin($('ev-hora-ini')&&$('ev-hora-ini').value);
    var hf=aMin($('ev-hora-fin')&&$('ev-hora-fin').value);
    var h='<div style="border:1px solid var(--linea,#E2DCCF);border-radius:10px;padding:10px 12px;margin-top:10px">'+
      '<b style="font-family:Oswald,system-ui,sans-serif;text-transform:uppercase;font-size:13px">'+
        'Las horas del '+esc(CAL_DIA)+'</b>'+
      '<div class="mini" style="margin:2px 0 8px">Toca la hora de inicio y luego la de fin. '+
        'Lo rojo ya está apartado por otro.</div>'+
      '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:4px">';
    /* EL MONTAJE SE PINTA, NO SE TACHA. Javi, 10-oct-2026: «marco en el
       calendario las 14:30 y si puso 60 mins de montaje marco antes de las
       14:30 60 mins de naranja clarito, y lo mismo a la hora de terminar. Si
       se junta con otra hora ya solicitada no podría avanzar y le daría
       error». Así ve de un vistazo lo que de verdad aparta, y el choque se lo
       decimos en el momento en vez de dejarle llegar hasta el final. */
    /* UNA SOLA LEYENDA, Y SOLO DE LO QUE SE VE. Javi, 10-oct-2026: «creo que
       los colores y la leyenda no cuadran». Y no cuadraban: se anunciaban
       montaje, evento y desmontaje aunque no hubiera nada elegido todavía, y
       la reserva de su propio evento salía del mismo color que la de un
       tercero. Ahora cada estado tiene su color, la leyenda se arma con los
       que de verdad aparecen, y lo suyo se distingue de lo ajeno. */
    var C={
      libre:   {bg:'#E1F0E7', fg:'#1D6B4A', t:'libre'},
      propio:  {bg:'#DFEAF6', fg:'#1F5B7A', t:'esta reserva es de este evento'},
      mio:     {bg:'#E4F1FA', fg:'#1F5B7A', t:'otro evento tuyo'},
      pedido:  {bg:'#F6EBD5', fg:'#8C6212', t:'pedida por otro, sin confirmar'},
      firme:   {bg:'#F6E1DD', fg:'#9E3B2E', t:'ya es de otro'},
      /* VERDE ES QUE HAY LUGAR. Javi, 10-oct-2026: «los colores del calendario,
         parece que en naranja no hay lugar». Y así se leía: lo que él estaba
         apartando salía naranja, del mismo tono caliente que lo ocupado por
         otros, y parecía que el día estaba cerrado. Ahora todo lo verde es
         suyo o está libre, y lo cálido es de alguien más. */
      montaje: {bg:'#D3E8DC', fg:'#15543A', t:'tu montaje, antes', borde:'1px dashed #1D6B4A'},
      evento:  {bg:'#1D6B4A', fg:'#fff',    t:'tu evento'},
      desmont: {bg:'#D3E8DC', fg:'#15543A', t:'tu desmontaje, después', borde:'1px dashed #7FB79A'},
      pisa:    {bg:'#F6E1DD', fg:'#9E3B2E', t:'aquí pisas algo ya apartado', borde:'2px solid #9E3B2E'}
    };
    var vistos={};
    var mo=montajeMin(), de=desmontajeMin();
    var evIni=hi, evFin=(hf!=null?hf:(hi!=null?hi+CAL_PASO:null));
    var w1=(evIni!=null?evIni-mo:null), w2=(evFin!=null?evFin+de:null);
    var choca=(w1!=null && chocaCon(CAL_DIA,w1,w2));
    for(var t=CAL_ABRE*60; t<CAL_CIERRA*60; t+=CAL_PASO){
      var fin=t+CAL_PASO;
      var tomado=oc.filter(function(o){ return t < o.h && fin > o.d; });
      var ajeno =tomado.filter(function(o){ return !o.propio; });
      var k;
      if(evIni!=null && t>=evIni && fin<=evFin) k='evento';
      else if(w1!=null && t>=w1 && fin<=evIni) k='montaje';
      else if(w2!=null && evFin!=null && t>=evFin && fin<=w2) k='desmont';
      else if(tomado.some(function(o){return o.propio;})) k='propio';
      else if(ajeno.some(function(o){return o.firme;})) k='firme';
      else if(ajeno.length) k='pedido';
      else if(tomado.length) k='mio';
      else k='libre';
      /* Mi franja pisando la de otro: eso sí es un problema y se marca. */
      if((k==='evento'||k==='montaje'||k==='desmont') && ajeno.length) k='pisa';
      vistos[k]=1;
      var col=C[k], off=(k==='firme'||k==='pedido'||k==='mio');
      h+='<button type="button" '+(off?'disabled':'data-h="'+t+'"')+
         ' title="'+esc(col.t)+'" style="border:'+(col.borde||'0')+';background:'+col.bg+';'+
         'color:'+col.fg+';border-radius:6px;padding:6px 2px;font:inherit;font-size:11.5px;'+
         'cursor:'+(off?'not-allowed':'pointer')+'">'+hhmm(t)+'</button>';
    }
    h+='</div>';
    var orden=['libre','propio','mio','pedido','firme','montaje','evento','desmont','pisa'];
    h+='<div class="mini" style="margin-top:8px;color:var(--gris,#6E665C);line-height:2">'+
      orden.filter(function(k){return vistos[k];}).map(function(k){
        var c=C[k];
        return '<span style="display:inline-block;width:11px;height:11px;background:'+c.bg+';'+
          'border:'+(c.borde||'1px solid rgba(0,0,0,.08)')+';border-radius:3px;vertical-align:-1px;'+
          'margin-right:4px"></span>'+esc(c.t);
      }).join(' &nbsp;·&nbsp; ')+'</div>';
    if(choca) h+='<div class="aviso er" style="margin-top:10px">Con tu montaje y desmontaje, la sala te quedaría apartada de <b>'+
      hhmm(w1)+' a '+hhmm(w2)+'</b>, y en esa franja ya hay algo de otro. Mueve la hora o baja los minutos de montaje: así no se puede mandar.</div>';
    if(oc.length) h+='<div class="mini" style="margin-top:8px">Ese día ya hay: '+
      oc.map(function(o){ return hhmm(o.d)+'–'+hhmm(o.h)+(o.mio?' (tuyo)':(o.firme?'':' · sin confirmar')); }).join(' · ')+'.</div>';
    h+='</div>';
    c.innerHTML=h;
    Array.prototype.forEach.call(c.querySelectorAll('[data-h]'),function(b){
      b.onclick=function(){
        var t=Number(b.getAttribute('data-h'));
        var ini=$('ev-hora-ini'), fin=$('ev-hora-fin');
        if(!ini.value || fin.value || t<=aMin(ini.value)){
          ini.value=hhmm(t); fin.value='';
        }else{
          var h2=t+CAL_PASO;
          if(chocaCon(CAL_DIA, aMin(ini.value)-montajeMin(), h2+desmontajeMin())){
            toast('Con tu montaje y desmontaje ese tramo pisa algo ya apartado. Elige otro.',true);
            return;
          }
          fin.value=hhmm(h2);
        }
        pintaHoras(); pintaFranjas();
      };
    });
  }

  /* ---------- EL SERVICIO POR HORAS ----------
     Javi, 10-oct-2026: «de esa forma evitamos que tenga que seleccionar todos
     los días si por ejemplo es el servicio de Reyes Recording de dar la sala
     de ensayo». No es un evento con fecha: es un horario que se publica. */
  var DIAS_SEM=[[1,'L'],[2,'M'],[3,'X'],[4,'J'],[5,'V'],[6,'S'],[7,'D']];
  var DISPO_DIAS=[];
  function esPorHoras(){ try{ return $('evTipo').value==='reserva_horas'; }catch(_){ return false; } }
  function pintaDispoDias(){
    var c=$('dispoDias'); if(!c) return;
    c.innerHTML=DIAS_SEM.map(function(d){
      var on=DISPO_DIAS.indexOf(d[0])>=0;
      return '<button type="button" data-dia="'+d[0]+'" style="width:40px;height:40px;border-radius:9px;'+
        'border:'+(on?'2px solid var(--ok,#1D6B4A)':'1px solid var(--linea,#E2DCCF)')+';'+
        'background:'+(on?'var(--ok,#1D6B4A)':'#fff')+';color:'+(on?'#fff':'var(--tinta,#1E1A16)')+';'+
        'font:600 13px/1 Oswald,system-ui,sans-serif;cursor:pointer">'+d[1]+'</button>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-dia]'),function(b){
      b.onclick=function(){
        var n=Number(b.getAttribute('data-dia')), i=DISPO_DIAS.indexOf(n);
        if(i>=0) DISPO_DIAS.splice(i,1); else DISPO_DIAS.push(n);
        DISPO_DIAS.sort(function(a,b2){return a-b2;});
        pintaDispoDias(); resumenDispo(); tocado();
      };
    });
  }
  /* LOS PAQUETES DE HORAS. Javi, 14-oct-2026, por petición de Fer de Reyes
     Recording: «una tarifa de X h por X pesos». Son filas de horas + precio;
     la base las guarda en el evento y es ella quien hace la cuenta al cobrar:
     aquí sólo se escriben y se avisa si un paquete sale más caro que las horas
     sueltas, que es el único error que de verdad se comete. */
  var PAQS=[];
  function pintaPaqs(){
    var c=$('paqLista'); if(!c) return;
    var ph=Number(($('ev-precio-hora')&&$('ev-precio-hora').value)||0);
    if(!PAQS.length){ c.innerHTML='<div class="mini">Sin paquetes: todo se cobra por hora.</div>'; return; }
    c.innerHTML=PAQS.map(function(p,i){
      var caro=(ph>0 && Number(p.precio)>0 && Number(p.precio) >= ph*Number(p.horas||0));
      return '<div style="display:flex;gap:8px;align-items:center;margin-bottom:6px">'+
        '<input type="number" min="1" step="1" data-paq="h" data-i="'+i+'" value="'+(p.horas||'')+'" '+
          'style="width:76px" placeholder="horas"><span class="mini">h por</span>'+
        '<input type="number" min="0" step="10" data-paq="p" data-i="'+i+'" value="'+(p.precio||'')+'" '+
          'style="width:110px" placeholder="$"><span class="mini">pesos</span>'+
        '<button type="button" class="bsec" data-paq="x" data-i="'+i+'" style="padding:4px 10px">Quitar</button>'+
        (caro?'<span class="mini" style="color:var(--alerta,#8C6212)">Así sale más caro que por hora: nadie lo elegiría.</span>':'')+
      '</div>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-paq]'),function(el){
      var i=Number(el.getAttribute('data-i')), q=el.getAttribute('data-paq');
      if(q==='x'){ el.onclick=function(){ PAQS.splice(i,1); pintaPaqs(); resumenDispo(); tocado(); }; return; }
      el.onchange=function(){
        PAQS[i][q==='h'?'horas':'precio']=Number(el.value||0);
        pintaPaqs(); resumenDispo(); tocado();
      };
    });
  }
  function resumenDispo(){
    var c=$('dispoResumen'); if(!c) return;
    if(!DISPO_DIAS.length){ c.innerHTML='<span style="color:var(--error,#9E3B2E)">Elige al menos un día.</span>'; return; }
    var nom={1:'lunes',2:'martes',3:'miércoles',4:'jueves',5:'viernes',6:'sábados',7:'domingos'};
    var hd=($('ev-hdesde')&&$('ev-hdesde').value)||'', hh=($('ev-hhasta')&&$('ev-hhasta').value)||'';
    var vh=($('ev-vhasta')&&$('ev-vhasta').value)||'';
    var ph=Number(($('ev-precio-hora')&&$('ev-precio-hora').value)||0);
    var mh=Number(($('ev-minh')&&$('ev-minh').value)||1);
    var horas = (hd&&hh) ? (' de <b>'+hd+'</b> a <b>'+hh+'</b>') : '';
    c.innerHTML='Se ofrece los <b>'+DISPO_DIAS.map(function(n){return nom[n];}).join(', ')+'</b>'+horas+
      (vh?', hasta el <b>'+vh+'</b>':'')+'. '+
      (ph? 'Un cliente que reserve '+mh+' h pagaría <b>$'+(ph*mh).toLocaleString('es-MX')+'</b>.'
         : '<span style="color:var(--alerta,#8C6212)">Falta el precio por hora.</span>')+
      (ph&&PAQS.length ? ' Con tus paquetes: '+PAQS.filter(function(p){return p.horas&&p.precio;})
          .map(function(p){ return '<b>'+p.horas+' h por $'+Number(p.precio).toLocaleString('es-MX')+'</b>'; }).join(' · ')+'.'
        : '');
  }
  /* Se enseña una forma u otra: o publicas un horario, o apartas una fecha. */
  function formaPorHoras(){
    var ph=esPorHoras();
    var cj=$('cajaDispo'); if(cj) cj.style.display= ph ? 'block' : 'none';
    ['calModo','ev-cal','calHoras'].forEach(function(id){
      var e=$(id); if(e) e.style.display = ph ? 'none' : '';
    });

  function filtra(){
    var def=evtDef($('evTipo').value);
    /* OJO: los [data-ef] están ocultos por CSS por defecto. Poner display:'' NO
       los enseña -quita el inline y vuelve a mandar la regla display:none-, por eso
       no salían fecha ni hora al crear un evento. Hay que darles un display real.
       Victor, 3-oct: «puede asociar el espacio pero no apartar fechas u horas». */
    document.querySelectorAll('[data-ef]').forEach(function(el){
      el.style.display=def.f.indexOf(el.getAttribute('data-ef'))>=0?'block':'none';});
    var extra=(def.f.indexOf('agenda')>=0||def.f.indexOf('precios')>=0);
    $('fnavExtra').style.display=extra?'':'none';
    if($('fnavImpacto')) $('fnavImpacto').style.display=(evCur&&evCur.id)?'inline-block':'none';
    /* Si este tipo de evento no cobra nada aquí —porque lo vende por boletos—
       el bloque de precio sobra y no se enseña. */
    var hayTarifa=['precio_hora','precio_persona','cobro_renta','cobro_taquilla','cobro_expo']
      .some(function(k){ return def.f.indexOf(k)>=0; });
    if($('cajaTarifa')) $('cajaTarifa').style.display=(hayTarifa||(FICHA&&FICHA.puede_gratis))?'':'none';
    /* El uso privado no se vende: ni boletos ni "es gratis". */
    if($('ev-gratis')) $('ev-gratis').closest('label').style.display = CLASE==='privado' ? 'none' : '';
    pintaEspacios(); pintaFranjas(); todoElDia(); formaPorHoras();
  }

  function aforoSala(){

  }

        '<td><input type="number" data-pr="'+i+'" data-f="precio" value="'+(p.precio!=null?p.precio:'')+'" style="'+inp+'"></td>'+
        '<td><input type="number" min="0"'+(tope!=null?' max="'+tope+'"':'')+' data-pr="'+i+'" data-f="cupo" value="'+(p.cupo!=null?p.cupo:'')+'" style="'+inp+'">'+

        '<td><input data-pr="'+i+'" data-f="incluye" value="'+esc(p.incluye||'')+'" placeholder="Qué incluye" style="'+inp+'"></td>'+
        '<td><button class="btn ghost sm" data-prdel="'+i+'" type="button">×</button></td></tr>';}).join('');

    if(av){
      if(!sala) av.innerHTML='Elige la sala en «Cuándo y dónde» y te digo cuántos boletos caben.';
      else{
        var usado=sumaCupo(-1), queda=sala.cap-usado;

          'Llevas repartidos <b>'+usado+'</b>'+

                    : ' · <b style="color:#9E3B2E">te pasas por '+(-queda)+'</b>, así no se puede mandar.');

  /* NO SE MANDA UN EVENTO SIN DECIR DONDE NI CUANDO. 3-oct-2026.
     «Enviar a Casa Pepe» aceptaba cualquier cosa, incluida nada: por eso habia
     seis eventos esperando aprobacion SIN FECHA DE INICIO. Aprobar uno de esos
     no reserva nada, porque no hay nada que reservar. */
  /* ---------- LAS FOTOS ---------- */
  var FOTOS=[];
  /* ---------- LA GALERÍA DEL EVENTO ----------
     Javi, 10-oct-2026: «incluye el editor de foto de portada, galería y ajustar
     y borrar con el X». Antes la miniatura entera era el botón de borrar: tocar
     para ver una foto la borraba. Ahora cada una tiene su X, su «portada» y su
     «ajustar», que recorta de verdad —a 16:9, que es como sale en la ficha— y
     sustituye la original. */
  function pintaFotos(){
    var c=$('fotoLista'), av=$('fotoAviso'), bt=$('fotoMas');
    var q=$('queSubir');
    if(q && window.cpVideo && !q.innerHTML) q.innerHTML=cpVideo.queSubir('evento');
    if(!c) return;
    if(!evCur||!evCur.id){
      c.innerHTML='';
      if(av) av.textContent='Súbelas cuando quieras: guardamos tu evento como borrador solo para poder colgarlas. '+
        'Sin al menos una foto no se puede poner a la venta.';
      if(bt) bt.disabled=false;
      return;
    }
    if(bt) bt.disabled=false;
    if(av) av.innerHTML=FOTOS.length
      ? 'La <b>portada</b> es la que sale en tu ficha y en la tarjeta. Las demás van en la galería del evento. Arrástralas con «Portada» para cambiar cuál manda.'
      : 'Sin al menos una foto, el evento no se puede poner a la venta.';
    c.innerHTML=FOTOS.map(function(f,i){
      var esVideo=(f.tipo==='video');
      return '<div style="position:relative;width:132px">'+
        '<div style="position:relative;width:132px;height:86px;border:'+
          (i===0?'2px solid var(--naranja,#F2682A)':'1px solid var(--linea,#E6DFD6)')+';'+
          'border-radius:9px;overflow:hidden;background:#F4EFE8">'+
          (esVideo
            ? '<video src="'+esc(f.url)+'" style="width:100%;height:100%;object-fit:cover;display:block"></video>'
            : '<img src="'+esc(f.url)+'" alt="" style="width:100%;height:100%;object-fit:cover;display:block">')+
          '<span style="position:absolute;left:4px;top:4px;background:'+(esVideo?'var(--magenta,#E2188E)':'rgba(30,26,22,.78)')+';'+
            'color:#fff;font:600 8.5px/1 Oswald,system-ui;letter-spacing:.06em;padding:3px 6px;'+
            'border-radius:99px">'+(esVideo?'▶ VIDEO':'FOTO')+'</span>'+
          (i===0?'<span style="position:absolute;left:4px;bottom:4px;background:var(--naranja,#F2682A);'+
                 'color:#fff;font:600 9px/1 Oswald,system-ui;letter-spacing:.06em;padding:3px 6px;'+
                 'border-radius:99px">PORTADA</span>':'')+
          '<button type="button" data-quitar="'+esc(f.url)+'" title="Quitar esta foto" '+
            'style="position:absolute;top:4px;right:4px;width:22px;height:22px;border:0;border-radius:50%;'+
            'background:rgba(30,26,22,.78);color:#fff;font:700 13px/1 system-ui;cursor:pointer;'+
            'display:grid;place-items:center;padding:0">×</button>'+
        '</div>'+
        '<div style="display:flex;gap:4px;margin-top:4px">'+
          (i===0?'' : '<button type="button" class="btn ghost sm" style="flex:1;padding:4px 6px;font-size:10px" '+
                      'data-portada="'+esc(f.url)+'">Portada</button>')+
          (esVideo?'' : '<button type="button" class="btn ghost sm" style="flex:1;padding:4px 6px;font-size:10px" '+
                      'data-ajusta="'+esc(f.url)+'">Ajustar</button>')+
        '</div></div>';
    }).join('');
    Array.prototype.forEach.call(c.querySelectorAll('[data-quitar]'),function(b){
      b.onclick=function(){ if(confirm('¿Quitar esta foto?')) quitaFoto(b.getAttribute('data-quitar')); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-portada]'),function(b){
      b.onclick=function(){ haciaPortada(b.getAttribute('data-portada')); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-ajusta]'),function(b){
      b.onclick=function(){ abreAjuste(b.getAttribute('data-ajusta')); };
    });
  }

  /* La portada es, sencillamente, la primera: se reordena. */
  async function haciaPortada(url){
    var orden=[url].concat(FOTOS.map(function(f){return f.url;}).filter(function(u){return u!==url;}));
    try{ var j=await fotoRpc({orden:orden}); FOTOS=j.fotos||FOTOS; pintaFotos(); toast('Ya es la portada'); }
    catch(e){ toast('No se pudo: '+((e&&e.message)||e),true); }
  }

  /* AJUSTAR = RECORTAR DE VERDAD. Se encuadra a 16:9, que es la forma en que
     sale en la ficha y en la tarjeta, y la recortada sustituye a la original en
     el mismo sitio de la galería. */
  function abreAjuste(url){
    var f=FOTOS.filter(function(x){return x.url===url;})[0]; if(!f) return;
    var ov=document.createElement('div');
    ov.style.cssText='position:fixed;inset:0;background:rgba(30,26,22,.65);z-index:70;'+
      'display:grid;place-items:center;padding:16px;overflow:auto';
    ov.innerHTML='<div style="background:#fff;border-radius:14px;max-width:520px;width:100%;padding:18px 20px">'+
      '<h3 style="margin:0 0 2px;font-family:Oswald,system-ui,sans-serif;text-transform:uppercase;font-size:16px">Ajustar la foto</h3>'+
      '<div class="mini" style="margin-bottom:10px">Arrastra para mover y usa el deslizador para acercar. '+
        'Se recorta en vertical, que es el marco con el que salen todas: así la galería no queda a parches.</div>'+
      '<div id="ajMarco" style="position:relative;width:100%;max-width:300px;margin:0 auto;aspect-ratio:3/4;overflow:hidden;'+
        'border-radius:10px;background:#1E1A16;cursor:grab;touch-action:none">'+
        /* SIN crossorigin EL RECORTE NO SALE. La foto vive en otro dominio
           (el almacén), así que el canvas queda «teñido» y el navegador se
           niega a exportarlo: «Tainted canvases may not be exported». El
           almacén sí manda CORS; solo había que pedírselo. Javi, 10-oct. */
        '<img id="ajImg" crossorigin="anonymous" src="'+esc(url)+'" alt="" style="position:absolute;transform-origin:0 0;'+
          'user-select:none;-webkit-user-drag:none;pointer-events:none">'+
      '</div>'+
      '<div style="display:flex;align-items:center;gap:10px;margin-top:10px">'+
        '<span class="mini">Acercar</span>'+
        '<input type="range" id="ajZoom" min="100" max="300" value="100" style="flex:1">'+
      '</div>'+
      '<div class="ft" style="margin-top:14px;justify-content:flex-end;gap:8px">'+
        '<button class="btn ghost" type="button" id="ajNo">Cancelar</button>'+
        '<button class="btn" type="button" id="ajOk">Guardar el recorte</button>'+
      '</div></div>';
    document.body.appendChild(ov);

    var marco=ov.querySelector('#ajMarco'), img=ov.querySelector('#ajImg'), zo=ov.querySelector('#ajZoom');
    var st={x:0,y:0,base:1,z:1,natW:0,natH:0,arr:false,px:0,py:0};
    img.onload=function(){
      st.natW=img.naturalWidth; st.natH=img.naturalHeight;
      var W=marco.clientWidth, H=marco.clientHeight;
      st.base=Math.max(W/st.natW, H/st.natH);
      st.z=1; st.x=(W-st.natW*st.base)/2; st.y=(H-st.natH*st.base)/2;
      aplica();
    };
    function aplica(){
      var e=st.base*st.z;
      img.style.width=(st.natW*e)+'px'; img.style.height=(st.natH*e)+'px';
      img.style.left='0'; img.style.top='0';
      img.style.transform='translate('+st.x+'px,'+st.y+'px)';
    }
    function limita(){
      var W=marco.clientWidth, H=marco.clientHeight, e=st.base*st.z;
      var w=st.natW*e, h=st.natH*e;
      st.x=Math.min(0, Math.max(W-w, st.x));
      st.y=Math.min(0, Math.max(H-h, st.y));
    }
    marco.onpointerdown=function(ev){ st.arr=true; st.px=ev.clientX; st.py=ev.clientY;
      marco.setPointerCapture(ev.pointerId); marco.style.cursor='grabbing'; };
    marco.onpointermove=function(ev){ if(!st.arr) return;
      st.x+=ev.clientX-st.px; st.y+=ev.clientY-st.py; st.px=ev.clientX; st.py=ev.clientY;
      limita(); aplica(); };
    marco.onpointerup=function(){ st.arr=false; marco.style.cursor='grab'; };
    zo.oninput=function(){
      var W=marco.clientWidth, H=marco.clientHeight;
      var cx=(W/2-st.x), cy=(H/2-st.y), zAnt=st.z;
      st.z=Number(zo.value)/100;
      var k=st.z/zAnt;
      st.x=W/2-cx*k; st.y=H/2-cy*k;
      limita(); aplica();
    };
    ov.querySelector('#ajNo').onclick=function(){ ov.remove(); };
    ov.querySelector('#ajOk').onclick=async function(){
      var b=this; b.disabled=true; b.textContent='Recortando…';
      try{
        var W=marco.clientWidth, H=marco.clientHeight, e=st.base*st.z;
        var sx=(-st.x)/e, sy=(-st.y)/e, sw=W/e, sh=H/e;
        var destW=Math.min(900, Math.round(sw)), destH=Math.round(destW*4/3);
        var cv=document.createElement('canvas'); cv.width=destW; cv.height=destH;
        cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, destW, destH);
        var data=cv.toDataURL('image/jpeg', 0.9);
        var pos=FOTOS.map(function(x){return x.url;}).indexOf(url);
        var j=await fotoRpc({imagen:data});          // sube la recortada al final
        var nuevas=(j.fotos||[]);
        var nueva=nuevas[nuevas.length-1];
        if(nueva){
          var j2=await fotoRpc({quitar:url});        // fuera la original
          var lista=(j2.fotos||[]).map(function(x){return x.url;});
          lista.splice(lista.indexOf(nueva.url),1);
          lista.splice(pos,0,nueva.url);            // la recortada ocupa su sitio
          var j3=await fotoRpc({orden:lista});
          FOTOS=j3.fotos||j2.fotos||nuevas;
        }else{ FOTOS=nuevas; }
        pintaFotos(); toast('Recortada'); ov.remove();
      }catch(err){
        b.disabled=false; b.textContent='Guardar el recorte';
        var m=String((err&&err.message)||err);
        toast(/[Tt]ainted/.test(m)
          ? 'Esa foto no deja recortarse desde el navegador. Vuelve a subirla y recórtala al subir.'
          : 'No se pudo recortar: '+m, true);
      }
    };
  }
  async function fotoRpc(cuerpo){
    var r=await fetch(SB+'/functions/v1/prod-foto',{method:'POST',
      headers:Object.assign({'Content-Type':'application/json'},hdrs()),
      body:JSON.stringify(Object.assign({token:TOK,evento_id:evCur&&evCur.id},cuerpo))});
    var j=null; try{ j=await r.json(); }catch(_){}
    if(!r.ok||!j||j.error) throw new Error((j&&j.error)||('la foto no subio ('+r.status+')'));
    return j;
  }
  async function subeFotos(files){
    if(!files||!files.length) return;
    var fallos=[];
    var cajaMal=$('malFotos'); if(cajaMal) cajaMal.innerHTML='';
    /* NADIE DEBERÍA TENER QUE GUARDAR PARA PODER SUBIR UNA FOTO. Javi,
       10-oct-2026: «no me obligues a guardar evento para subir fotos». La foto
       necesita un evento al que colgarse, así que se crea el borrador solo, en
       silencio, y se sigue. */
    if(!evCur||!evCur.id){
      toast('Un momento: guardo tu evento como borrador para colgarle la foto…');
      try{ await guardar(true); }catch(_){}
      if(!evCur||!evCur.id){ toast('No pude crear el borrador. Inténtalo otra vez.',true); return; }
    }
    /* VIDEO TAMBIÉN. Javi, 22-oct-2026: «en Mi Cuenta de cada productor o
       touroperador permite que también suban el video para la portada y
       explícales». El servidor ya lo aceptaba —mp4, mov y webm, hasta 25 MB—;
       lo que faltaba era dejar elegirlo aquí.
       Y las fotos van TODAS por el mismo recorte vertical antes de subir: eso
       es lo que evita que la galería de la app mezcle horizontales con
       verticales. El video no se recorta, se manda como está. */
    var lista=Array.prototype.slice.call(files).filter(function(f){
      var t=(f.type||'');
      return t.indexOf('image')===0 || t.indexOf('video')===0; });
    var fuera=Array.prototype.slice.call(files).filter(function(f){ return lista.indexOf(f)<0; });
    fuera.forEach(function(f){ fallos.push({nombre:f.name,motivo:'no es una foto ni un video'}); });
    if(!lista.length){
      if(cajaMal&&window.cpVideo) cajaMal.innerHTML=cpVideo.noEntraron(fallos);
      toast('Eso no es una foto ni un video.',true); return; }
    for(var i=0;i<lista.length;i++){
      try{
        var f=lista[i], esVid=(f.type||'').indexOf('video')===0;
        var fuente=f;
        if(esVid){
          /* Se comprime ANTES de pesarlo: el video del teléfono viene en 1080p
             y pesa treinta megas, y encima viaja en base64, que infla un tercio
             más. Comprimido son dos o tres. Javi, 22-oct. */
          if(window.cpVideo){
            toast('Comprimiendo el video… tarda lo que dura el video.');
            var r=await new Promise(function(res){ cpVideo.comprime(f,null,function(e,x){ res(x||null); }); });
            if(r){ fuente=r.blob; if(r.aviso) toast(r.aviso,!r.comprimido);
              if(r.comprimido) toast('Comprimido: de '+cpVideo.mb(r.antes)+' MB a '+cpVideo.mb(r.despues)+' MB'); }
          }
          if(fuente.size>60*1024*1024){
            fallos.push({nombre:f.name,motivo:'sigue pesando '+cpVideo.mb(fuente.size)+' MB y el tope son 60: córtalo más corto'});
            continue;
          }
        }
        toast((esVid?'Subiendo el video ':'Subiendo ')+(i+1)+' de '+lista.length+'…');
        if(!esVid && window.sincCrop){
          var blob=await new Promise(function(res){
            sincCrop.open(f,{only:'v',titulo:'Acomoda la foto de tu evento'},function(r){
              res((r&&(r.vBlob||r.hBlob))||null); });
          });
          if(!blob){ fallos.push({nombre:f.name,motivo:'cerraste el recortador sin acomodarla'}); continue; }
          fuente=blob;
        }
        var dataUri=await new Promise(function(res,rej){
          var fr=new FileReader();
          fr.onload=function(){res(fr.result);}; fr.onerror=rej;
          fr.readAsDataURL(fuente);
        });
        var j=await fotoRpc({imagen:dataUri});
        FOTOS=j.fotos||[]; pintaFotos();
      }catch(e){ fallos.push({nombre:(lista[i]&&lista[i].name)||'un archivo',motivo:e.message||'no se pudo subir'}); }
    }
    if(cajaMal && window.cpVideo) cajaMal.innerHTML=cpVideo.noEntraron(fallos);
    toast(fallos.length?('Listo, con '+fallos.length+' sin subir'):'Listo', fallos.length>0);
  }
  async function quitaFoto(url){
    try{ var j=await fotoRpc({quitar:url}); FOTOS=j.fotos||[]; pintaFotos(); toast('Quitada'); }
    catch(e){ toast(e.message||'No se pudo quitar',true); }
