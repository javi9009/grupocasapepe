<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mantenimiento · Casa Pepe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
    --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
    --rule:#E2DCCF; --rule-2:#D2C8B6;
    --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
    --ok:#1D6B4A; --ok-bg:#E1F0E7; --warn:#8C6212; --warn-bg:#F3EAD6;
    --bad:#9E3B2E; --bad-bg:#F4E2DE; --none:#66707A; --none-bg:#E9E4DA;
    --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0}
  .btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
  .btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
  .btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;width:100%}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  /* header */
  header.top{background:var(--surface);border-bottom:1px solid var(--rule)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .top-sp{flex:1}
  .prop-lbl{font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-size:13px}
  select.prop{width:auto;min-width:130px;font-weight:600}
  .who{font-size:12.5px;color:var(--muted)}
  /* secnav */
  .secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
  .secnav-in{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
  .secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  .secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  h2.vt{font-size:20px;margin-bottom:14px}
  /* kpis / cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:26px;font-weight:700;line-height:1}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:5px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .card h3{font-size:15px;padding:13px 16px;border-bottom:1px solid var(--rule)}
  .card .pad{padding:16px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface-3)}
  td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .c-react{background:var(--bad-bg);color:var(--bad)} .c-correc{background:var(--warn-bg);color:var(--warn)} .c-prev{background:var(--ok-bg);color:var(--ok)}
  .c-info{background:var(--none-bg);color:var(--ink-2)}
  .st{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;background:var(--surface-3)}
  a.lnk{color:var(--accent);text-decoration:none;font-weight:600}a.lnk:hover{text-decoration:underline}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select{width:auto;min-width:150px}
  .muted{color:var(--muted)} .center{text-align:center;padding:26px;color:var(--muted)}
  .bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
  .bar span{display:block;height:100%}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .form-grid .full{grid-column:1/-1}
  .modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.4);display:none;place-items:center;padding:16px;z-index:50}
  .modal-bg.on{display:grid}
  .modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{padding:15px 16px;border-bottom:1px solid var(--rule);font-size:16px}
  .modal .foot{padding:13px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:60}
  .toast.on{opacity:1}
  .tec{border:1px solid var(--rule);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .tec .h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .tec .h b{font-size:15px}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:30px;max-width:360px;width:100%}
  .login-card h1{font-size:22px;margin:6px 0 3px}
  .login-card .eb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
</style>
</head>
<body>

<div id="login" style="display:none">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="eb">Casa Pepe · Servicios</div>
    <h1>🔧 Mantenimiento</h1>
    <p class="muted" style="margin:0 0 16px;font-size:14px">Entra con tu cuenta Casa Pepe.</p>
    <label>Correo</label><input id="lemail" type="email" autocomplete="username" required>
    <label>Contraseña</label><input id="lpass" type="password" autocomplete="current-password" required>
    <button class="btn" style="width:100%;margin-top:16px" type="submit">Entrar</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="app" style="display:none">
  <header class="top">
    <div class="top-in">
      <div class="brand">🔧 Mantenimiento<small>Casa Pepe</small></div>
      <div class="top-sp"></div>
      <div id="propWrap"></div>
      <span class="who" id="who"></span>
      <button class="btn ghost sm" onclick="logout()">Salir</button>
    </div>
  </header>
  <nav class="secnav"><div class="secnav-in" id="secnav"></div></nav>
  <main>
    <h2 class="vt" id="vt">Tablero</h2>
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const sb=supabase.createClient(SB_URL,SB_KEY);
const PROP_ALL=[
  {id:"45e69775-d877-4507-a9e1-a45bd3400dc5",n:"CDMX",proj:"cdmx"},
  {id:"3e10a9ea-4913-4f7c-86ef-0c829caa851d",n:"Virreyes",proj:"virreyes"},
  {id:"febfbef6-7fd1-4b45-84d9-13533e8dcb72",n:"Puebla",proj:"puebla"},
];
let PROPS=PROP_ALL.slice(), PROP=PROP_ALL[0], USER=null, TECS=[];
const PER_F={semanal:52,quincenal:26,mensual:12,bimestral:6,trimestral:4,semestral:2,anual:1,"n/a":0};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200);}
function clsChip(c){return {reactivo:'<span class="chip c-react">Reactivo</span>',correctivo:'<span class="chip c-correc">Correctivo</span>',preventivo:'<span class="chip c-prev">Preventivo</span>'}[c]||'';}
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}

const VIEWS=[
  {k:"tablero",t:"Tablero"},{k:"tickets",t:"Tickets"},{k:"prev",t:"Preventivos"},
  {k:"prog",t:"Programación"},{k:"anual",t:"Anual externo"},{k:"lect",t:"Lecturas"},{k:"rep",t:"Reporte"},
];
let CUR="tablero";

/* auth */
async function doLogin(e){e.preventDefault();$("#lerr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#lemail").value.trim(),password:$("#lpass").value});
  if(error){$("#lerr").textContent=error.message;return false;} boot();return false;}
async function logout(){await sb.auth.signOut();location.reload();}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#login").style.display="grid";$("#app").style.display="none";return;}
  USER=session.user; $("#login").style.display="none"; $("#app").style.display="block";
  $("#who").textContent=USER.email;
  await resolveProps();
  TECS=(await sb.from("employees").select("id,nombre,nombre_display,property_id").ilike("puesto","%mantenimiento%")).data||[];
  $("#secnav").innerHTML=VIEWS.map(v=>`<button data-k="${v.k}" onclick="go('${v.k}')">${v.t}</button>`).join("");
  renderPropWrap(); go(CUR);
}
async function resolveProps(){
  // ámbito por usuario_proyectos; corp = todas; si nada, todas
  let allow=null;
  try{
    const {data:el}=await sb.from("empleado_login").select("employee_id").eq("user_id",USER.id).maybeSingle();
    if(el?.employee_id){
      const {data:up}=await sb.from("usuario_proyectos").select("proyecto").eq("employee_id",el.employee_id);
      const set=new Set((up||[]).map(r=>r.proyecto));
      if(set.has("corp")) allow=null;
      else if(set.size){ allow=PROP_ALL.filter(p=>set.has(p.proj)); }
    }
  }catch(_){}
  const em=(USER.email||"").toLowerCase();
  if(["javi@casapepe.mx","hola.puebla@casapepe.mx"].includes(em)) allow=null;
  PROPS = (allow && allow.length) ? allow : PROP_ALL.slice();
  PROP = PROPS[0];
}
function renderPropWrap(){
  const w=$("#propWrap");
  if(PROPS.length<=1){ w.innerHTML=`<span class="prop-lbl">${PROP.n}</span>`; return; }
  w.innerHTML=`<select class="prop" id="propSel">${PROPS.map(p=>`<option value="${p.id}">${p.n}</option>`).join("")}</select>`;
  $("#propSel").value=PROP.id;
  $("#propSel").onchange=e=>{PROP=PROPS.find(p=>p.id===e.target.value);render();};
}
function go(k){CUR=k;const v=VIEWS.find(x=>x.k===k);$("#vt").textContent=v.t;
  document.querySelectorAll("#secnav button").forEach(b=>b.setAttribute("aria-selected", b.dataset.k===k));render();}

function loading(){$("#view").innerHTML='<div class="center">Cargando…</div>';}
function modal(h){$("#modal").innerHTML=h;$("#modalBg").classList.add("on");}
function closeModal(){$("#modalBg").classList.remove("on");}
$("#modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});
function tecName(id){const t=TECS.find(x=>x.id===id);return t?(t.nombre_display||t.nombre):null;}
function tecOptions(sel){return '<option value="">— técnico —</option>'+TECS.map(t=>`<option value="${t.id}" ${sel===t.id?"selected":""}>${esc(t.nombre_display||t.nombre)}</option>`).join("");}

async function render(){
  loading();
  try{
    if(CUR==="tablero")return renderTablero();
    if(CUR==="tickets")return renderTickets();
    if(CUR==="prev")return renderPrev();
    if(CUR==="prog")return renderProg();
    if(CUR==="anual")return renderAnual();
    if(CUR==="lect")return renderLect();
    if(CUR==="rep")return renderRep();
  }catch(e){$("#view").innerHTML='<div class="center">Error: '+esc(e.message)+'</div>';}
}

/* TABLERO */
async function renderTablero(){
  const [{data:tk},{data:cfg},{data:pv},{data:an}]=await Promise.all([
    sb.from("mtto_tickets").select("estado,clasificacion").eq("property_id",PROP.id),
    sb.from("mtto_config").select("*").eq("property_id",PROP.id).single(),
    sb.from("mtto_preventivos_catalogo").select("id").eq("property_id",PROP.id).eq("activo",true),
    sb.from("mtto_anual_externo").select("estado,critico").eq("property_id",PROP.id),
  ]);
  const ab=(tk||[]).filter(t=>!["cerrado","cancelado"].includes(t.estado));
  const react=ab.filter(t=>t.clasificacion==="reactivo").length;
  const anPend=(an||[]).filter(a=>a.estado!=="realizado").length;
  const anCrit=(an||[]).filter(a=>a.critico&&a.estado!=="realizado").length;
  const c=cfg||{horas_dia:8,dias_semana:6,reserva_reactivo_h:12,admin_h:4,consumos_h:1.5,pct_correctivo:70,pct_preventivo:30};
  const disp=c.horas_dia*c.dias_semana, libres=disp-c.reserva_reactivo_h-c.admin_h-c.consumos_h;
  const hc=libres*c.pct_correctivo/100, hp=libres*c.pct_preventivo/100;
  $("#view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${ab.length}</div><div class="l">tickets abiertos</div></div>
      <div class="kpi"><div class="n" style="color:var(--bad)">${react}</div><div class="l">reactivos pendientes</div></div>
      <div class="kpi"><div class="n">${(pv||[]).length}</div><div class="l">preventivos en catálogo</div></div>
      <div class="kpi"><div class="n" style="color:${anCrit?'var(--bad)':'inherit'}">${anPend}</div><div class="l">anual externo pendiente${anCrit?` · ${anCrit} crítico`:''}</div></div>
    </div>
    <div class="card"><h3>Reparto de horas semanal · por técnico (${disp} h)</h3><div class="pad">
      <div class="bar">
        <span style="width:${c.reserva_reactivo_h/disp*100}%;background:var(--bad)"></span>
        <span style="width:${hc/disp*100}%;background:var(--warn)"></span>
        <span style="width:${hp/disp*100}%;background:var(--ok)"></span>
        <span style="width:${(c.admin_h+c.consumos_h)/disp*100}%;background:var(--none)"></span>
      </div>
      <table style="min-width:auto;margin-top:12px"><tbody>
        <tr><td><span class="chip c-react">Reactivos (reserva)</span></td><td class="num">${c.reserva_reactivo_h} h</td></tr>
        <tr><td><span class="chip c-correc">Correctivo (${c.pct_correctivo}%)</span></td><td class="num">${hc.toFixed(1)} h</td></tr>
        <tr><td><span class="chip c-prev">Preventivo (${c.pct_preventivo}%)</span></td><td class="num">${hp.toFixed(1)} h</td></tr>
        <tr><td><span class="chip c-info">Admin + consumos</span></td><td class="num">${(c.admin_h+c.consumos_h)} h</td></tr>
      </tbody></table>
    </div></div>`;
}

/* TICKETS */
let TK_F={estado:"",clas:""};
async function renderTickets(){
  const {data,error}=await sb.from("mtto_tickets").select("*, ubic:ubicacion_id(nombre)").eq("property_id",PROP.id).order("reportado_at",{ascending:false});
  if(error)throw error; let rows=data||[];
  if(TK_F.estado)rows=rows.filter(r=>r.estado===TK_F.estado);
  if(TK_F.clas)rows=rows.filter(r=>r.clasificacion===TK_F.clas);
  $("#view").innerHTML=`
    <div class="filters">
      <select onchange="TK_F.estado=this.value;renderTickets()"><option value="">Todos los estados</option>
        ${["nuevo","validado","programado","en_proceso","resuelto","cerrado","cancelado"].map(s=>`<option ${TK_F.estado===s?"selected":""}>${s}</option>`).join("")}</select>
      <select onchange="TK_F.clas=this.value;renderTickets()"><option value="">Toda clasificación</option>
        ${["reactivo","correctivo","preventivo"].map(s=>`<option ${TK_F.clas===s?"selected":""}>${s}</option>`).join("")}</select>
    </div>
    <div class="card"><div class="scroll"><table>
      <thead><tr><th>Reporte</th><th>Ubicación</th><th>Clasif.</th><th>Estado</th><th class="num">Min est.</th><th>Técnico</th><th></th></tr></thead>
      <tbody>${rows.length?rows.map(ticketRow).join(""):'<tr><td colspan="7" class="center">Sin tickets</td></tr>'}</tbody>
    </table></div></div>`;
}
function ticketRow(t){
  const foto=t.foto_url?` <a class="lnk" href="${esc(t.foto_url)}" target="_blank">📷</a>`:"";
  return `<tr>
    <td><b>${esc(t.titulo||"(sin título)")}</b>${foto}<div class="muted" style="font-size:12px">${esc((t.descripcion||"").slice(0,70))}</div></td>
    <td>${esc(t.ubic?.nombre||"—")}</td><td>${clsChip(t.clasificacion)}</td>
    <td><span class="st">${esc(t.estado)}</span></td><td class="num">${t.minutos_estimados??"—"}</td>
    <td class="muted" style="font-size:12px">${esc(t.asignado_nombre||"—")}</td>
    <td><div class="row-actions">${ticketActions(t)}</div></td></tr>`;
}
function ticketActions(t){
  const a=[];
  if(t.estado==="nuevo")a.push(`<button class="btn sm" onclick="validar('${t.id}')">Validar</button>`);
  if(["validado","programado"].includes(t.estado))a.push(`<button class="btn sm" onclick="iniciar('${t.id}')">Iniciar</button>`);
  if(t.estado==="en_proceso")a.push(`<button class="btn sm" onclick="resolver('${t.id}')">Resolver</button>`);
  if(t.estado==="resuelto")a.push(`<button class="btn ghost sm" onclick="cerrar('${t.id}')">Cerrar</button>`);
  return a.join("")||`<span class="muted">—</span>`;
}
async function validar(id){
  modal(`<h3>Validar y estimar</h3><div class="pad">
    <label>Minutos estimados</label><input id="mMin" type="number" min="1" value="30">
    <label>Asignar a</label><select id="mTec">${tecOptions("")}</select>
    <label>Clasificación</label><select id="mClas">${["reactivo","correctivo","preventivo"].map(c=>`<option>${c}</option>`).join("")}</select>
  </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="saveValidar('${id}')">Guardar</button></div>`);
  $("#mClas").value="correctivo";
}
async function saveValidar(id){
  const min=parseInt($("#mMin").value)||null, tec=$("#mTec").value||null, clas=$("#mClas").value;
  const patch={estado:"validado",minutos_estimados:min,clasificacion:clas};
  if(tec){patch.asignado_a=tec;patch.asignado_nombre=tecName(tec);}
  const {error}=await sb.from("mtto_tickets").update(patch).eq("id",id);
  if(error)return toast(error.message);
  await ev(id,"validado",{minutos_estimados:min});closeModal();toast("Validado");renderTickets();
}
async function iniciar(id){
  const {error}=await sb.from("mtto_tickets").update({estado:"en_proceso",iniciado_at:new Date().toISOString()}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"iniciado");toast("Iniciado");render();}
async function resolver(id){
  modal(`<h3>Resolver</h3><div class="pad"><label>Foto de resuelto (URL)</label><input id="mFoto" placeholder="opcional">
    <p class="muted" style="font-size:12.5px;margin-top:8px">Los minutos reales se calculan desde Iniciar.</p></div>
    <div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="saveResolver('${id}')">Marcar resuelto</button></div>`);
}
async function saveResolver(id){
  const {data:t}=await sb.from("mtto_tickets").select("iniciado_at").eq("id",id).single();
  const now=new Date(); const mins=t?.iniciado_at?Math.max(1,Math.round((now-new Date(t.iniciado_at))/60000)):null;
  const {error}=await sb.from("mtto_tickets").update({estado:"resuelto",resuelto_at:now.toISOString(),minutos_reales:mins,foto_resuelto_url:$("#mFoto").value.trim()||null}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"resuelto",{minutos_reales:mins});closeModal();toast("Resuelto"+(mins?` · ${mins} min`:""));render();}
async function cerrar(id){
  const {error}=await sb.from("mtto_tickets").update({estado:"cerrado",cerrado_at:new Date().toISOString(),cerrado_por:USER.id,cerrado_por_nombre:USER.email}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"cerrado_conforme");toast("Cerrado");render();}
async function ev(ticket_id,tipo,payload){await sb.from("mtto_ticket_eventos").insert({ticket_id,tipo,actor_id:USER.id,actor_nombre:USER.email,payload:payload||{}});}

/* PREVENTIVOS */
async function renderPrev(){
  const {data,error}=await sb.from("mtto_preventivos_catalogo").select("*, ubic:ubicacion_id(nombre,orden)").eq("property_id",PROP.id).eq("activo",true);
  if(error)throw error; const rows=data||[];
  const g={};rows.forEach(r=>{const a=r.ubic?.nombre||"Varias áreas";(g[a]=g[a]||[]).push(r);});
  const areas=Object.keys(g).sort((a,b)=>(g[a][0].ubic?.orden||99)-(g[b][0].ubic?.orden||99));
  $("#view").innerHTML=`<div style="margin-bottom:14px"><button class="btn sm" onclick="addPrev()">＋ Nuevo preventivo</button></div>`+
    (rows.length?areas.map(a=>{const gi=g[a];const h=Math.round(gi.reduce((s,r)=>s+(r.minutos_estimados||0)*(PER_F[r.periodicidad]||0),0)/60);
      return `<div class="card"><h3>${esc(a)} <span class="muted" style="font-weight:500;font-size:12px">· ${gi.length} · ~${h} h/año</span></h3>
      <div class="scroll"><table><thead><tr><th>Trabajo</th><th>Periodicidad</th><th class="num">Min</th><th>Ficha</th><th></th></tr></thead>
      <tbody>${gi.map(r=>`<tr><td>${esc(r.tarea)}</td><td><span class="st">${esc(r.periodicidad)}</span></td><td class="num">${r.minutos_estimados??"—"}</td>
        <td>${r.ficha_url?`<a class="lnk" href="${esc(r.ficha_url)}" target="_blank">ficha ↗</a>`:"—"}</td>
        <td class="num"><button class="btn ghost sm" onclick="cancelPrev('${r.id}')">Cancelar</button></td></tr>`).join("")}</tbody></table></div></div>`;
    }).join(""):'<div class="center">Sin catálogo para esta propiedad todavía</div>');
}
async function addPrev(){
  const {data:ubis}=await sb.from("mtto_ubicaciones").select("id,nombre").eq("property_id",PROP.id).order("orden");
  modal(`<h3>Nuevo preventivo</h3><div class="pad"><div class="form-grid">
    <div class="full"><label>Trabajo</label><input id="pTarea"></div>
    <div><label>Área</label><select id="pUbic"><option value="">(varias)</option>${(ubis||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join("")}</select></div>
    <div><label>Periodicidad</label><select id="pPer">${Object.keys(PER_F).filter(k=>k!=="n/a").map(k=>`<option ${k==="mensual"?"selected":""}>${k}</option>`).join("")}</select></div>
    <div><label>Minutos</label><input id="pMin" type="number" min="1" value="30"></div>
    <div><label>Ficha (URL)</label><input id="pFicha" placeholder="opcional"></div>
    <div class="full"><label>Recomendación</label><textarea id="pRec" rows="2"></textarea></div>
  </div></div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="savePrev()">Agregar</button></div>`);
}
async function savePrev(){
  const tarea=$("#pTarea").value.trim();if(!tarea)return toast("Falta el trabajo");
  const {error}=await sb.from("mtto_preventivos_catalogo").insert({property_id:PROP.id,ubicacion_id:$("#pUbic").value||null,tarea,periodicidad:$("#pPer").value,minutos_estimados:parseInt($("#pMin").value)||null,ficha_url:$("#pFicha").value.trim()||null,recomendacion:$("#pRec").value.trim()||null,tipo:"interno"});
  if(error)return toast(error.message);closeModal();toast("Agregado");renderPrev();}
async function cancelPrev(id){if(!confirm("¿Cancelar este preventivo?"))return;
  const {error}=await sb.from("mtto_preventivos_catalogo").update({activo:false}).eq("id",id);
  if(error)return toast(error.message);toast("Cancelado");renderPrev();}

/* PROGRAMACIÓN */
let PROG_WK=mondayOf(new Date());
async function renderProg(){
  const {data:cfg}=await sb.from("mtto_config").select("*").eq("property_id",PROP.id).single();
  const c=cfg||{horas_dia:8,dias_semana:6,reserva_reactivo_h:12,admin_h:4,consumos_h:1.5,pct_correctivo:70,pct_preventivo:30};
  const disp=c.horas_dia*c.dias_semana, libres=disp-c.reserva_reactivo_h-c.admin_h-c.consumos_h;
  const objetivo=libres; // correctivo+preventivo por técnico
  const {data}=await sb.from("mtto_tickets").select("*, ubic:ubicacion_id(nombre)").eq("property_id",PROP.id).in("estado",["validado","programado","en_proceso"]).order("prioridad");
  const rows=data||[];
  const sinSemana=rows.filter(r=>!r.semana_programada || mondayOf(r.semana_programada)!==PROG_WK);
  const enSemana=rows.filter(r=>r.semana_programada && mondayOf(r.semana_programada)===PROG_WK);
  // por técnico
  const tecCards=TECS.map(t=>{
    const mine=enSemana.filter(r=>r.asignado_a===t.id);
    const min=mine.reduce((s,r)=>s+(r.minutos_estimados||0),0), hh=min/60;
    const pct=Math.min(100,hh/objetivo*100);
    const over=hh>objetivo;
    return `<div class="tec"><div class="h"><b>${esc(t.nombre_display||t.nombre)}</b>
      <span class="mono" style="color:${over?'var(--bad)':'var(--muted)'}">${hh.toFixed(1)} / ${objetivo.toFixed(1)} h</span></div>
      <div class="pad">
        <div class="bar"><span style="width:${pct}%;background:${over?'var(--bad)':'var(--accent)'}"></span></div>
        <div class="scroll" style="margin-top:10px"><table><thead><tr><th>Trabajo</th><th>Clasif.</th><th class="num">Min</th><th></th></tr></thead>
        <tbody>${mine.length?mine.map(r=>`<tr><td>${esc(r.titulo||"—")}<div class="muted" style="font-size:12px">${esc(r.ubic?.nombre||"")}</div></td>
          <td>${clsChip(r.clasificacion)}</td><td class="num">${r.minutos_estimados??"—"}</td>
          <td class="num"><button class="btn ghost sm" onclick="quitarSemana('${r.id}')">Sacar</button></td></tr>`).join(""):'<tr><td colspan="4" class="center">Sin trabajos esta semana</td></tr>'}</tbody></table></div>
      </div></div>`;
  }).join("");
  $("#view").innerHTML=`
    <div class="card"><div class="pad" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <div><label style="margin:0">Semana (lunes)</label><input type="date" id="wk" value="${PROG_WK}" style="width:auto"></div>
      <div class="muted" style="font-size:13px;flex:1">Objetivo correctivo+preventivo por técnico: <b>${objetivo.toFixed(1)} h</b> (12h reactivo + ${c.admin_h}h admin + ${c.consumos_h}h consumos reservadas)</div>
      <button class="btn sm" onclick="genPrev()">＋ Generar preventivos</button>
    </div></div>
    ${tecCards}
    <div class="card"><h3>Por asignar / otras semanas <span class="muted" style="font-weight:500;font-size:12px">· ${sinSemana.length}</span></h3>
      <div class="scroll"><table><thead><tr><th>Trabajo</th><th>Clasif.</th><th class="num">Min</th><th>Técnico</th><th>Semana</th></tr></thead>
      <tbody>${sinSemana.length?sinSemana.map(r=>`<tr>
        <td>${esc(r.titulo||"—")}<div class="muted" style="font-size:12px">${esc(r.ubic?.nombre||"")}</div></td>
        <td>${clsChip(r.clasificacion)}</td><td class="num">${r.minutos_estimados??"—"}</td>
        <td><select onchange="asignarTec('${r.id}',this.value)">${tecOptions(r.asignado_a)}</select></td>
        <td><button class="btn sm" onclick="ponerSemana('${r.id}')">A esta semana</button></td>
      </tr>`).join(""):'<tr><td colspan="5" class="center">Nada por asignar</td></tr>'}</tbody></table></div></div>`;
  $("#wk").onchange=e=>{PROG_WK=mondayOf(e.target.value);renderProg();};
}
async function asignarTec(id,tec){const p={asignado_a:tec||null,asignado_nombre:tec?tecName(tec):null};
  const {error}=await sb.from("mtto_tickets").update(p).eq("id",id);if(error)return toast(error.message);toast("Asignado");}
async function ponerSemana(id){const {error}=await sb.from("mtto_tickets").update({semana_programada:PROG_WK,estado:"programado"}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"programado",{semana:PROG_WK});renderProg();}
async function quitarSemana(id){const {error}=await sb.from("mtto_tickets").update({semana_programada:null,estado:"validado"}).eq("id",id);
  if(error)return toast(error.message);renderProg();}
async function genPrev(){
  const {data:cat}=await sb.from("mtto_preventivos_catalogo").select("*, ubic:ubicacion_id(nombre)").eq("property_id",PROP.id).eq("activo",true).order("periodicidad");
  const rows=cat||[];
  modal(`<h3>Generar preventivos · semana ${PROG_WK}</h3><div class="pad">
    <div class="form-grid"><div><label>Técnico</label><select id="gTec">${tecOptions("")}</select></div>
    <div><label>Semana (lunes)</label><input type="date" id="gWk" value="${PROG_WK}"></div></div>
    <label style="margin-top:12px">Selecciona los trabajos a programar</label>
    <div style="max-height:38vh;overflow:auto;border:1px solid var(--rule);border-radius:8px">
    <table><tbody>${rows.map(r=>`<tr><td style="width:34px"><input type="checkbox" style="width:auto" value="${r.id}" class="gChk"></td>
      <td>${esc(r.tarea)}<div class="muted" style="font-size:12px">${esc(r.ubic?.nombre||"")} · ${esc(r.periodicidad)}</div></td>
      <td class="num">${r.minutos_estimados??"—"} min</td></tr>`).join("")}</tbody></table></div>
    </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick='saveGenPrev(${JSON.stringify(rows.map(r=>({id:r.id,tarea:r.tarea,min:r.minutos_estimados,ub:r.ubicacion_id,eq:r.equipo_id,fi:r.ficha_url})))})'>Programar seleccionados</button></div>`);
}
async function saveGenPrev(rows){
  const tec=$("#gTec").value||null, wk=mondayOf($("#gWk").value);
  const ids=[...document.querySelectorAll(".gChk:checked")].map(c=>c.value);
  if(!ids.length)return toast("Selecciona al menos uno");
  const map={}; rows.forEach(r=>map[r.id]=r);
  const ins=ids.map(id=>{const r=map[id];return {property_id:PROP.id,origen:"preventivo_programado",preventivo_catalogo_id:id,
    clasificacion:"preventivo",ubicacion_id:r.ub,equipo_id:r.eq,titulo:(r.tarea||"Preventivo").slice(0,80),descripcion:r.tarea,
    minutos_estimados:r.min,asignado_a:tec,asignado_nombre:tec?tecName(tec):null,semana_programada:wk,estado:tec?"programado":"validado",eloy_completo:true};});
  const {error}=await sb.from("mtto_tickets").insert(ins);
  if(error)return toast(error.message);closeModal();toast(ins.length+" preventivos programados");renderProg();}

/* ANUAL EXTERNO */
async function renderAnual(){
  const {data,error}=await sb.from("mtto_anual_externo").select("*").eq("property_id",PROP.id).order("critico",{ascending:false});
  if(error)throw error; const rows=data||[];
  const stc={pendiente:"c-info",agendado:"c-info",realizado:"c-prev",vencido:"c-react"};
  $("#view").innerHTML=`<div class="card"><h3>Preventivo anual con proveedores externos</h3><div class="scroll"><table>
    <thead><tr><th>Equipo / servicio</th><th>Periodicidad</th><th>Estado</th><th class="num">Costo</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td><b>${esc(r.tarea)}</b>${r.critico?' <span class="chip c-react">crítico</span>':''}<div class="muted" style="font-size:12px">${esc(r.notas||"")}</div></td>
      <td><span class="st">${esc(r.periodicidad||"—")}</span></td><td><span class="chip ${stc[r.estado]||'c-info'}">${esc(r.estado)}</span></td>
      <td class="num">${money(r.costo)}</td>
      <td class="num"><select onchange="setAnual('${r.id}',this.value)" style="width:auto">${["pendiente","agendado","realizado","vencido"].map(s=>`<option ${r.estado===s?"selected":""}>${s}</option>`).join("")}</select></td>
    </tr>`).join(""):'<tr><td colspan="5" class="center">Sin registros</td></tr>'}</tbody></table></div></div>`;
}
async function setAnual(id,estado){const p={estado};if(estado==="realizado")p.fecha_realizada=new Date().toISOString().slice(0,10);
  const {error}=await sb.from("mtto_anual_externo").update(p).eq("id",id);if(error)return toast(error.message);toast("Actualizado");renderAnual();}

/* LECTURAS */
async function renderLect(){
  const {data}=await sb.from("mtto_lecturas").select("*").eq("property_id",PROP.id).order("fecha",{ascending:false}).limit(30);
  const rows=data||[]; const today=new Date().toISOString().slice(0,10);
  $("#view").innerHTML=`<div class="card"><h3>Registrar lectura del día</h3><div class="pad"><div class="form-grid">
      <div><label>Fecha</label><input id="lF" type="date" value="${today}"></div><div><label>Huéspedes</label><input id="lH" type="number" min="0"></div>
      <div><label>Agua (lectura)</label><input id="lA" type="number" step="0.01"></div><div><label>Luz kWh</label><input id="lL" type="number" step="0.01"></div>
      <div><label>Gas %</label><input id="lG" type="number" step="0.1"></div><div><label>Foto (URL)</label><input id="lFoto"></div>
      <div class="full"><button class="btn sm" onclick="saveLect()">Guardar lectura</button></div>
    </div></div></div>
    <div class="card"><h3>Últimas lecturas</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th class="num">Agua</th><th class="num">Luz kWh</th><th class="num">Gas %</th><th class="num">Huésp.</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td>${r.fecha}</td><td class="num">${r.agua_lectura??"—"}</td><td class="num">${r.luz_lectura??"—"}</td><td class="num">${r.gas_pct??"—"}</td><td class="num">${r.huespedes??"—"}</td></tr>`).join(""):'<tr><td colspan="5" class="center">Sin lecturas</td></tr>'}</tbody></table></div></div>`;
}
async function saveLect(){
  const {error}=await sb.from("mtto_lecturas").upsert({property_id:PROP.id,fecha:$("#lF").value,huespedes:parseInt($("#lH").value)||null,agua_lectura:parseFloat($("#lA").value)||null,luz_lectura:parseFloat($("#lL").value)||null,gas_pct:parseFloat($("#lG").value)||null,foto_url:$("#lFoto").value.trim()||null,subido_por:USER.id,subido_por_nombre:USER.email},{onConflict:"property_id,fecha"});
  if(error)return toast(error.message);toast("Lectura guardada");renderLect();}

/* REPORTE */
async function renderRep(){
  const wk=mondayOf(new Date());
  const {data}=await sb.from("mtto_tickets").select("clasificacion,minutos_reales,resuelto_at").eq("property_id",PROP.id);
  const rows=(data||[]).filter(t=>t.minutos_reales&&t.resuelto_at&&mondayOf(t.resuelto_at)===wk);
  const sum=c=>rows.filter(r=>r.clasificacion===c).reduce((s,r)=>s+r.minutos_reales,0)/60;
  const hc=sum("correctivo"),hp=sum("preventivo"),hr=sum("reactivo");
  $("#view").innerHTML=`<div class="card"><h3>Reporte de horas · semana del ${wk}</h3><div class="scroll"><table>
    <thead><tr><th>Concepto</th><th class="num">Horas realizadas</th></tr></thead><tbody>
    <tr><td>${clsChip("reactivo")}</td><td class="num">${hr.toFixed(1)}</td></tr>
    <tr><td>${clsChip("correctivo")}</td><td class="num">${hc.toFixed(1)}</td></tr>
    <tr><td>${clsChip("preventivo")}</td><td class="num">${hp.toFixed(1)}</td></tr>
    <tr><td><b>Total</b></td><td class="num"><b>${(hc+hp+hr).toFixed(1)}</b></td></tr></tbody></table></div></div>
    <p class="muted" style="font-size:13px">Minutos reales (Iniciar → foto resuelto) de los tickets cerrados esta semana.</p>`;
}

sb.auth.getSession().then(({data})=>{if(data.session)boot(); else {$("#login").style.display="grid";}});
</script>
