<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mantenimiento · Casa Pepe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --bg:#FBF9F5; --surface:#FFFFFF; --surface-2:#F4F0E8; --ink:#221D15; --ink-2:#5C5445;
    --line:#E4DCCB; --gold:#B4802A; --gold-soft:#EFE2C6;
    --react:#B23A2E; --correc:#C2762A; --prev:#3F7A56; --info:#4A6B8A;
    --shadow:0 1px 2px rgba(40,30,10,.06),0 8px 24px rgba(40,30,10,.05);
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#16130E; --surface:#1F1B14; --surface-2:#26221A; --ink:#F1EADB; --ink-2:#A99E8A;
    --line:#332D22; --gold:#DCA84A; --gold-soft:#3A3020;
    --react:#E0705F; --correc:#E0A155; --prev:#6FB98C; --info:#7FA6C9;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif;font-weight:600;margin:0}
  button{font-family:inherit;cursor:pointer}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  /* Login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--shadow);padding:34px;max-width:380px;width:100%}
  .login-card .eyebrow{font:600 12px/1;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
  .login-card h1{font-size:28px;margin:10px 0 4px}
  .login-card p{color:var(--ink-2);font-size:14px;margin:0 0 20px}
  input,select,textarea{font-family:inherit;font-size:14px;width:100%;padding:10px 12px;border:1px solid var(--line);
    border-radius:10px;background:var(--bg);color:var(--ink)}
  label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin:12px 0 5px;letter-spacing:.02em}
  .btn{background:var(--gold);color:#fff;border:none;border-radius:10px;padding:11px 16px;font-weight:600;font-size:14px}
  .btn:hover{filter:brightness(1.05)} .btn.block{width:100%;margin-top:18px}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
  .err{color:var(--react);font-size:13px;margin-top:12px;min-height:18px}
  /* App shell */
  #app{display:none;min-height:100vh;grid-template-columns:230px 1fr}
  @media (max-width:820px){#app{grid-template-columns:1fr}}
  aside{background:var(--surface);border-right:1px solid var(--line);padding:18px 14px;display:flex;flex-direction:column;gap:4px}
  @media (max-width:820px){aside{border-right:none;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto}}
  .brand{font-family:"Fraunces",serif;font-weight:600;font-size:18px;padding:6px 8px 14px;letter-spacing:-.01em}
  .brand small{display:block;font-family:"IBM Plex Sans";font-weight:600;font-size:10px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--gold);margin-top:2px}
  .nav{display:flex;flex-direction:column;gap:2px;flex:1}
  @media (max-width:820px){.nav{flex-direction:row}}
  .nav button{display:flex;align-items:center;gap:9px;text-align:left;background:transparent;border:none;
    color:var(--ink-2);font-weight:500;font-size:14px;padding:9px 11px;border-radius:9px;white-space:nowrap}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button.on{background:var(--gold-soft);color:var(--ink)}
  .nav .ico{width:18px;text-align:center}
  main{padding:clamp(16px,3vw,30px);max-width:1080px}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
  .topbar h1{font-size:clamp(22px,3.4vw,30px)}
  .prop{display:flex;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px}
  .prop button{border:none;background:transparent;color:var(--ink-2);font-weight:600;font-size:12.5px;padding:6px 12px;border-radius:999px}
  .prop button.on{background:var(--gold);color:#fff}
  .who{font-size:12.5px;color:var(--ink-2)}
  /* cards / grid */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-family:"Fraunces",serif;font-weight:600;font-size:27px;line-height:1}
  .kpi .l{color:var(--ink-2);font-size:12px;margin-top:5px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;margin-bottom:16px}
  .card h3{font-size:16px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);
    font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip{display:inline-block;font:600 11px/1;padding:5px 9px;border-radius:999px;white-space:nowrap;color:#fff}
  .b-react{background:var(--react)} .b-correc{background:var(--correc);color:#231a08} .b-prev{background:var(--prev)}
  .b-info{background:var(--info)} .b-gray{background:var(--surface-2);color:var(--ink-2)}
  .st{font:600 11px/1;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--ink-2)}
  a.lnk{color:var(--gold);text-decoration:none;font-weight:600}a.lnk:hover{text-decoration:underline}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select,.filters input{width:auto;min-width:130px}
  .muted{color:var(--ink-2)}.center{text-align:center;padding:26px;color:var(--ink-2)}
  .bar{height:9px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
  .bar span{display:block;height:100%}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:16px}
  @media (max-width:560px){.form-grid{grid-template-columns:1fr}}
  .form-grid .full{grid-column:1/-1}
  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,15,5,.5);display:none;place-items:center;padding:16px;z-index:50}
  .modal-bg.on{display:grid}
  .modal{background:var(--surface);border-radius:16px;max-width:460px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{padding:16px;border-bottom:1px solid var(--line)}
  .modal .foot{padding:14px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);
    padding:11px 18px;border-radius:10px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:60}
  .toast.on{opacity:1}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="eyebrow">Casa Pepe · Servicios</div>
    <h1>🔧 Mantenimiento</h1>
    <p>Entra con tu cuenta Casa Pepe.</p>
    <label>Correo</label>
    <input id="email" type="email" autocomplete="username" required placeholder="tu@casapepe.mx">
    <label>Contraseña</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn block" type="submit">Entrar</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- APP -->
<div id="app">
  <aside>
    <div class="brand">Casa Pepe<small>Mantenimiento</small></div>
    <nav class="nav" id="nav"></nav>
    <button class="btn ghost sm" style="margin-top:10px" onclick="logout()">Salir</button>
  </aside>
  <main>
    <div class="topbar">
      <h1 id="viewTitle">Tablero</h1>
      <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
        <div class="prop" id="propSwitch"></div>
        <span class="who" id="who"></span>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL="https://rehophywchakfapivsbh.supabase.co";
const SB_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y";
const sb=supabase.createClient(SB_URL,SB_KEY);
const PROPS=[
  {id:"45e69775-d877-4507-a9e1-a45bd3400dc5",n:"CDMX"},
  {id:"3e10a9ea-4913-4f7c-86ef-0c829caa851d",n:"Virreyes"},
  {id:"febfbef6-7fd1-4b45-84d9-13533e8dcb72",n:"Puebla"},
];
let PROP=PROPS[0], USER=null;
const PER_F={semanal:52,quincenal:26,mensual:12,bimestral:6,trimestral:4,semestral:2,anual:1,"n/a":0};
const $=s=>document.querySelector(s);
const esc=s=>(s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX");
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2200);}
function clsChip(c){return {reactivo:'<span class="chip b-react">Reactivo</span>',correctivo:'<span class="chip b-correc">Correctivo</span>',preventivo:'<span class="chip b-prev">Preventivo</span>'}[c]||'';}

const VIEWS=[
  {k:"tablero",t:"Tablero",i:"📊"},
  {k:"tickets",t:"Tickets",i:"🎫"},
  {k:"prev",t:"Preventivos por área",i:"🗂️"},
  {k:"prog",t:"Programación semanal",i:"🗓️"},
  {k:"anual",t:"Preventivo anual externo",i:"🏭"},
  {k:"lect",t:"Lecturas diarias",i:"💧"},
  {k:"rep",t:"Reporte de horas",i:"📈"},
  {k:"reportar",t:"Reportar (Eloy Queda)",i:"✍️"},
];
let CUR="tablero";

/* ---------- auth ---------- */
async function doLogin(e){e.preventDefault();$("#loginErr").textContent="";
  const {error}=await sb.auth.signInWithPassword({email:$("#email").value.trim(),password:$("#password").value});
  if(error){$("#loginErr").textContent=error.message;return false;}
  boot();return false;}
async function logout(){await sb.auth.signOut();location.reload();}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#login").style.display="grid";$("#app").style.display="none";return;}
  USER=session.user;
  $("#login").style.display="none";$("#app").style.display="grid";
  $("#who").textContent=USER.email;
  $("#nav").innerHTML=VIEWS.map(v=>`<button data-k="${v.k}" onclick="go('${v.k}')"><span class="ico">${v.i}</span>${v.t}</button>`).join("");
  $("#propSwitch").innerHTML=PROPS.map(p=>`<button data-p="${p.id}" onclick="setProp('${p.id}')">${p.n}</button>`).join("");
  setProp(PROP.id,true);go(CUR);
}
function setProp(id,silent){PROP=PROPS.find(p=>p.id===id);
  document.querySelectorAll("#propSwitch button").forEach(b=>b.classList.toggle("on",b.dataset.p===id));
  if(!silent)render();}
function go(k){CUR=k;const v=VIEWS.find(x=>x.k===k);$("#viewTitle").textContent=v.t;
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.k===k));render();}

/* ---------- helpers ---------- */
async function q(t){return sb.from(t).select("*").eq("property_id",PROP.id);}
function loading(){$("#view").innerHTML='<div class="center">Cargando…</div>';}
function modal(html){$("#modal").innerHTML=html;$("#modalBg").classList.add("on");}
function closeModal(){$("#modalBg").classList.remove("on");}
$("#modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

/* ---------- router ---------- */
async function render(){
  loading();
  try{
    if(CUR==="tablero")return renderTablero();
    if(CUR==="tickets")return renderTickets();
    if(CUR==="prev")return renderPrev();
    if(CUR==="prog")return renderProg();
    if(CUR==="anual")return renderAnual();
    if(CUR==="lect")return renderLect();
    if(CUR==="rep")return renderRep();
    if(CUR==="reportar")return renderReportar();
  }catch(err){$("#view").innerHTML='<div class="center">Error: '+esc(err.message)+'</div>';}
}

/* ---------- TABLERO ---------- */
async function renderTablero(){
  const [{data:tk},{data:cfg},{data:pv},{data:an}]=await Promise.all([
    sb.from("mtto_tickets").select("estado,clasificacion,minutos_reales,semana_programada").eq("property_id",PROP.id),
    sb.from("mtto_config").select("*").eq("property_id",PROP.id).single(),
    sb.from("mtto_preventivos_catalogo").select("id").eq("property_id",PROP.id).eq("activo",true),
    sb.from("mtto_anual_externo").select("estado,critico").eq("property_id",PROP.id),
  ]);
  const abiertos=(tk||[]).filter(t=>!["cerrado","cancelado"].includes(t.estado));
  const react=abiertos.filter(t=>t.clasificacion==="reactivo").length;
  const anualPend=(an||[]).filter(a=>a.estado!=="realizado").length;
  const anualCrit=(an||[]).filter(a=>a.critico&&a.estado!=="realizado").length;
  const c=cfg||{horas_dia:8,dias_semana:6,reserva_reactivo_h:12,admin_h:4,consumos_h:1.5,pct_correctivo:70,pct_preventivo:30};
  const disp=c.horas_dia*c.dias_semana;
  const libres=disp-c.reserva_reactivo_h-c.admin_h-c.consumos_h;
  const hc=(libres*c.pct_correctivo/100), hp=(libres*c.pct_preventivo/100);
  $("#view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${abiertos.length}</div><div class="l">tickets abiertos</div></div>
      <div class="kpi"><div class="n" style="color:var(--react)">${react}</div><div class="l">reactivos pendientes</div></div>
      <div class="kpi"><div class="n">${(pv||[]).length}</div><div class="l">preventivos en catálogo</div></div>
      <div class="kpi"><div class="n" style="color:${anualCrit?'var(--react)':'inherit'}">${anualPend}</div><div class="l">anual externo pendiente${anualCrit?` · ${anualCrit} crítico`:''}</div></div>
    </div>
    <div class="card"><h3>Reparto de horas semanal · por técnico (${disp} h)</h3>
      <div style="padding:16px">
        <div class="bar" title="reparto">
          <span style="width:${c.reserva_reactivo_h/disp*100}%;background:var(--react)"></span>
          <span style="width:${hc/disp*100}%;background:var(--correc)"></span>
          <span style="width:${hp/disp*100}%;background:var(--prev)"></span>
          <span style="width:${(c.admin_h+c.consumos_h)/disp*100}%;background:var(--info)"></span>
        </div>
        <table style="min-width:auto;margin-top:14px"><tbody>
          <tr><td><span class="chip b-react">Reactivos (reserva)</span></td><td class="num">${c.reserva_reactivo_h} h</td></tr>
          <tr><td><span class="chip b-correc">Correctivo (${c.pct_correctivo}%)</span></td><td class="num">${hc.toFixed(1)} h</td></tr>
          <tr><td><span class="chip b-prev">Preventivo (${c.pct_preventivo}%)</span></td><td class="num">${hp.toFixed(1)} h</td></tr>
          <tr><td><span class="chip b-info">Admin + consumos</span></td><td class="num">${(c.admin_h+c.consumos_h)} h</td></tr>
        </tbody></table>
      </div>
    </div>`;
}

/* ---------- TICKETS ---------- */
let TK_F={estado:"",clas:""};
async function renderTickets(){
  let query=sb.from("mtto_tickets").select("*, ubic:ubicacion_id(nombre)").eq("property_id",PROP.id).order("reportado_at",{ascending:false});
  const {data,error}=await query;
  if(error)throw error;
  let rows=data||[];
  if(TK_F.estado)rows=rows.filter(r=>r.estado===TK_F.estado);
  if(TK_F.clas)rows=rows.filter(r=>r.clasificacion===TK_F.clas);
  $("#view").innerHTML=`
    <div class="filters">
      <select onchange="TK_F.estado=this.value;renderTickets()">
        <option value="">Todos los estados</option>
        ${["nuevo","validado","programado","en_proceso","resuelto","cerrado","cancelado"].map(s=>`<option ${TK_F.estado===s?"selected":""}>${s}</option>`).join("")}
      </select>
      <select onchange="TK_F.clas=this.value;renderTickets()">
        <option value="">Toda clasificación</option>
        ${["reactivo","correctivo","preventivo"].map(s=>`<option ${TK_F.clas===s?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>
    <div class="card"><div class="scroll"><table>
    <thead><tr><th>Reporte</th><th>Ubicación</th><th>Clasif.</th><th>Estado</th><th class="num">Min est.</th><th>Reportó</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(ticketRow).join(""):'<tr><td colspan="7" class="center">Sin tickets todavía</td></tr>'}</tbody>
    </table></div></div>`;
}
function ticketRow(t){
  const foto=t.foto_url?` <a class="lnk" href="${esc(t.foto_url)}" target="_blank">📷</a>`:"";
  return `<tr>
    <td><b>${esc(t.titulo||"(sin título)")}</b>${foto}<div class="muted" style="font-size:12px">${esc((t.descripcion||"").slice(0,70))}</div></td>
    <td>${esc(t.ubic?.nombre||"—")}</td>
    <td>${clsChip(t.clasificacion)}</td>
    <td><span class="st">${esc(t.estado)}</span></td>
    <td class="num">${t.minutos_estimados??"—"}</td>
    <td class="muted" style="font-size:12px">${esc(t.reportado_por_nombre||"—")}</td>
    <td><div class="row-actions">${ticketActions(t)}</div></td>
  </tr>`;
}
function ticketActions(t){
  const a=[];
  if(t.estado==="nuevo")a.push(`<button class="btn sm" onclick="validarTicket('${t.id}')">Validar</button>`);
  if(["validado","programado"].includes(t.estado))a.push(`<button class="btn sm" onclick="iniciarTicket('${t.id}')">Iniciar</button>`);
  if(t.estado==="en_proceso")a.push(`<button class="btn sm" onclick="resolverTicket('${t.id}')">Resolver</button>`);
  if(t.estado==="resuelto")a.push(`<button class="btn sm ghost" onclick="cerrarTicket('${t.id}')">Cerrar</button>`);
  return a.join("")||`<span class="muted">—</span>`;
}
async function validarTicket(id){
  modal(`<h3>Validar y estimar</h3><div style="padding:16px">
    <label>Minutos estimados (los define el jefe)</label><input id="mMin" type="number" min="1" value="30">
    <label>Asignar a (técnico)</label><input id="mTec" placeholder="Manuel / Juan">
    </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="saveValidar('${id}')">Guardar</button></div>`);
}
async function saveValidar(id){
  const min=parseInt($("#mMin").value)||null, tec=$("#mTec").value.trim()||null;
  const {error}=await sb.from("mtto_tickets").update({estado:"validado",minutos_estimados:min,asignado_nombre:tec}).eq("id",id);
  if(error)return toast(error.message);
  await ev(id,"validado",{minutos_estimados:min});closeModal();toast("Ticket validado");renderTickets();
}
async function iniciarTicket(id){
  const {error}=await sb.from("mtto_tickets").update({estado:"en_proceso",iniciado_at:new Date().toISOString()}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"iniciado");toast("Cronómetro iniciado");renderTickets();
}
async function resolverTicket(id){
  modal(`<h3>Resolver trabajo</h3><div style="padding:16px">
    <label>Foto de resuelto (URL)</label><input id="mFoto" placeholder="https://…">
    <p class="muted" style="font-size:12.5px;margin-top:8px">Los minutos reales se calculan desde Iniciar hasta ahora.</p>
    </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="saveResolver('${id}')">Marcar resuelto</button></div>`);
}
async function saveResolver(id){
  const {data:t}=await sb.from("mtto_tickets").select("iniciado_at").eq("id",id).single();
  const now=new Date(); const mins=t?.iniciado_at?Math.max(1,Math.round((now-new Date(t.iniciado_at))/60000)):null;
  const {error}=await sb.from("mtto_tickets").update({estado:"resuelto",resuelto_at:now.toISOString(),
    minutos_reales:mins,foto_resuelto_url:$("#mFoto").value.trim()||null}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"resuelto",{minutos_reales:mins});closeModal();
  toast("Resuelto"+(mins?` · ${mins} min`:""));renderTickets();
}
async function cerrarTicket(id){
  const {error}=await sb.from("mtto_tickets").update({estado:"cerrado",cerrado_at:new Date().toISOString(),
    cerrado_por:USER.id,cerrado_por_nombre:USER.email}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"cerrado_conforme");toast("Cerrado de conforme");renderTickets();
}
async function ev(ticket_id,tipo,payload){await sb.from("mtto_ticket_eventos").insert({ticket_id,tipo,
  actor_id:USER.id,actor_nombre:USER.email,payload:payload||{}});}

/* ---------- PREVENTIVOS ---------- */
async function renderPrev(){
  const {data,error}=await sb.from("mtto_preventivos_catalogo")
    .select("*, ubic:ubicacion_id(nombre,orden)").eq("property_id",PROP.id).eq("activo",true);
  if(error)throw error;
  const rows=data||[];
  const groups={};rows.forEach(r=>{const a=r.ubic?.nombre||"Varias áreas";(groups[a]=groups[a]||[]).push(r);});
  const areas=Object.keys(groups).sort((a,b)=>(groups[a][0].ubic?.orden||99)-(groups[b][0].ubic?.orden||99));
  $("#view").innerHTML=`<div style="margin-bottom:14px"><button class="btn sm" onclick="addPrev()">+ Nuevo preventivo</button></div>`+
    (rows.length?areas.map(a=>{
      const g=groups[a];const h=Math.round(g.reduce((s,r)=>s+(r.minutos_estimados||0)*(PER_F[r.periodicidad]||0),0)/60);
      return `<div class="card"><h3>${esc(a)} <span class="muted" style="font-family:'IBM Plex Sans';font-size:12px;font-weight:500">· ${g.length} · ~${h} h/año</span></h3>
      <div class="scroll"><table><thead><tr><th>Trabajo</th><th>Periodicidad</th><th class="num">Min</th><th>Ficha</th><th></th></tr></thead>
      <tbody>${g.map(r=>`<tr>
        <td>${esc(r.tarea)}</td>
        <td><span class="st">${esc(r.periodicidad)}</span></td>
        <td class="num">${r.minutos_estimados??"—"}</td>
        <td>${r.ficha_url?`<a class="lnk" href="${esc(r.ficha_url)}" target="_blank">ficha ↗</a>`:"—"}</td>
        <td class="num"><button class="btn sm ghost" onclick="cancelPrev('${r.id}')">Cancelar</button></td>
      </tr>`).join("")}</tbody></table></div></div>`;
    }).join(""):'<div class="center">Sin catálogo para esta propiedad todavía</div>');
}
async function addPrev(){
  const {data:ubis}=await sb.from("mtto_ubicaciones").select("id,nombre").eq("property_id",PROP.id).order("orden");
  modal(`<h3>Nuevo preventivo</h3><div class="form-grid">
    <div class="full"><label>Trabajo</label><input id="pTarea" placeholder="Ej. Revisión de…"></div>
    <div><label>Área</label><select id="pUbic"><option value="">(varias)</option>${(ubis||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join("")}</select></div>
    <div><label>Periodicidad</label><select id="pPer">${Object.keys(PER_F).filter(k=>k!=="n/a").map(k=>`<option ${k==="mensual"?"selected":""}>${k}</option>`).join("")}</select></div>
    <div><label>Minutos estimados</label><input id="pMin" type="number" min="1" value="30"></div>
    <div><label>Ficha técnica (URL)</label><input id="pFicha" placeholder="opcional"></div>
    <div class="full"><label>Recomendación</label><textarea id="pRec" rows="2" placeholder="opcional"></textarea></div>
    </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick="savePrev()">Agregar</button></div>`);
}
async function savePrev(){
  const tarea=$("#pTarea").value.trim();if(!tarea)return toast("Falta el trabajo");
  const {error}=await sb.from("mtto_preventivos_catalogo").insert({property_id:PROP.id,
    ubicacion_id:$("#pUbic").value||null,tarea,periodicidad:$("#pPer").value,
    minutos_estimados:parseInt($("#pMin").value)||null,ficha_url:$("#pFicha").value.trim()||null,
    recomendacion:$("#pRec").value.trim()||null,tipo:"interno"});
  if(error)return toast(error.message);closeModal();toast("Preventivo agregado");renderPrev();
}
async function cancelPrev(id){if(!confirm("¿Cancelar este preventivo del catálogo?"))return;
  const {error}=await sb.from("mtto_preventivos_catalogo").update({activo:false}).eq("id",id);
  if(error)return toast(error.message);toast("Cancelado");renderPrev();}

/* ---------- PROGRAMACIÓN ---------- */
async function renderProg(){
  const {data}=await sb.from("mtto_tickets").select("*").eq("property_id",PROP.id)
    .in("estado",["validado","programado","en_proceso"]).order("prioridad");
  const rows=data||[];
  const total=rows.reduce((s,r)=>s+(r.minutos_estimados||0),0);
  $("#view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${rows.length}</div><div class="l">trabajos por programar/en curso</div></div>
      <div class="kpi"><div class="n">${(total/60).toFixed(1)} h</div><div class="l">carga estimada</div></div>
    </div>
    <div class="card"><h3>Cola de trabajos (para el briefing del lunes)</h3><div class="scroll"><table>
    <thead><tr><th>Trabajo</th><th>Clasif.</th><th>Técnico</th><th>Semana</th><th class="num">Min</th></tr></thead>
    <tbody>${rows.length?rows.map(t=>`<tr>
      <td>${esc(t.titulo||"—")}</td><td>${clsChip(t.clasificacion)}</td>
      <td>${esc(t.asignado_nombre||"—")}</td>
      <td>${t.semana_programada||'<span class="muted">sin fecha</span>'}</td>
      <td class="num">${t.minutos_estimados??"—"}</td>
    </tr>`).join(""):'<tr><td colspan="5" class="center">Nada en cola</td></tr>'}</tbody></table></div></div>`;
}

/* ---------- ANUAL EXTERNO ---------- */
async function renderAnual(){
  const {data,error}=await sb.from("mtto_anual_externo").select("*").eq("property_id",PROP.id).order("critico",{ascending:false});
  if(error)throw error;const rows=data||[];
  const stColor={pendiente:"b-gray",agendado:"b-info",realizado:"b-prev",vencido:"b-react"};
  $("#view").innerHTML=`<div class="card"><h3>Preventivo anual con proveedores externos</h3><div class="scroll"><table>
    <thead><tr><th>Equipo / servicio</th><th>Periodicidad</th><th>Estado</th><th class="num">Costo</th><th></th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr>
      <td><b>${esc(r.tarea)}</b>${r.critico?' <span class="chip b-react">crítico</span>':''}<div class="muted" style="font-size:12px">${esc(r.notas||"")}</div></td>
      <td><span class="st">${esc(r.periodicidad||"—")}</span></td>
      <td><span class="chip ${stColor[r.estado]||'b-gray'}">${esc(r.estado)}</span></td>
      <td class="num">${money(r.costo)}</td>
      <td class="num"><select onchange="setAnual('${r.id}',this.value)">
        ${["pendiente","agendado","realizado","vencido"].map(s=>`<option ${r.estado===s?"selected":""}>${s}</option>`).join("")}
      </select></td>
    </tr>`).join(""):'<tr><td colspan="5" class="center">Sin registros</td></tr>'}</tbody></table></div></div>`;
}
async function setAnual(id,estado){const patch={estado};if(estado==="realizado")patch.fecha_realizada=new Date().toISOString().slice(0,10);
  const {error}=await sb.from("mtto_anual_externo").update(patch).eq("id",id);
  if(error)return toast(error.message);toast("Actualizado");renderAnual();}

/* ---------- LECTURAS ---------- */
async function renderLect(){
  const {data}=await sb.from("mtto_lecturas").select("*").eq("property_id",PROP.id).order("fecha",{ascending:false}).limit(30);
  const rows=data||[];const today=new Date().toISOString().slice(0,10);
  $("#view").innerHTML=`
    <div class="card"><h3>Registrar lectura del día</h3><div class="form-grid">
      <div><label>Fecha</label><input id="lF" type="date" value="${today}"></div>
      <div><label>Huéspedes</label><input id="lH" type="number" min="0"></div>
      <div><label>Agua (lectura)</label><input id="lA" type="number" step="0.01"></div>
      <div><label>Luz kWh (lectura)</label><input id="lL" type="number" step="0.01"></div>
      <div><label>Gas %</label><input id="lG" type="number" step="0.1"></div>
      <div><label>Foto (URL)</label><input id="lFoto" placeholder="opcional"></div>
      <div class="full"><button class="btn sm" onclick="saveLect()">Guardar lectura</button></div>
    </div></div>
    <div class="card"><h3>Últimas lecturas</h3><div class="scroll"><table>
    <thead><tr><th>Fecha</th><th class="num">Agua</th><th class="num">Luz kWh</th><th class="num">Gas %</th><th class="num">Huésp.</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td>${r.fecha}</td><td class="num">${r.agua_lectura??"—"}</td>
      <td class="num">${r.luz_lectura??"—"}</td><td class="num">${r.gas_pct??"—"}</td><td class="num">${r.huespedes??"—"}</td></tr>`).join(""):'<tr><td colspan="5" class="center">Sin lecturas</td></tr>'}</tbody></table></div></div>`;
}
async function saveLect(){
  const {error}=await sb.from("mtto_lecturas").upsert({property_id:PROP.id,fecha:$("#lF").value,
    huespedes:parseInt($("#lH").value)||null,agua_lectura:parseFloat($("#lA").value)||null,
    luz_lectura:parseFloat($("#lL").value)||null,gas_pct:parseFloat($("#lG").value)||null,
    foto_url:$("#lFoto").value.trim()||null,subido_por:USER.id,subido_por_nombre:USER.email},{onConflict:"property_id,fecha"});
  if(error)return toast(error.message);toast("Lectura guardada");renderLect();
}

/* ---------- REPORTE ---------- */
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x.toISOString().slice(0,10);}
async function renderRep(){
  const wk=mondayOf(new Date());
  const {data}=await sb.from("mtto_tickets").select("clasificacion,minutos_reales,resuelto_at,estado").eq("property_id",PROP.id);
  const rows=(data||[]).filter(t=>t.minutos_reales&&t.resuelto_at&&mondayOf(t.resuelto_at)===wk);
  const sum=c=>rows.filter(r=>r.clasificacion===c).reduce((s,r)=>s+r.minutos_reales,0)/60;
  const hc=sum("correctivo"),hp=sum("preventivo"),hr=sum("reactivo");
  $("#view").innerHTML=`<div class="card"><h3>Reporte de horas · semana del ${wk}</h3><div class="scroll"><table>
    <thead><tr><th>Concepto</th><th class="num">Horas realizadas</th></tr></thead><tbody>
    <tr><td>${clsChip("reactivo")}</td><td class="num">${hr.toFixed(1)}</td></tr>
    <tr><td>${clsChip("correctivo")}</td><td class="num">${hc.toFixed(1)}</td></tr>
    <tr><td>${clsChip("preventivo")}</td><td class="num">${hp.toFixed(1)}</td></tr>
    <tr><td><b>Total</b></td><td class="num"><b>${(hc+hp+hr).toFixed(1)}</b></td></tr>
    </tbody></table></div></div>
    <p class="muted" style="font-size:13px">Se calcula con los minutos reales (Iniciar → foto resuelto) de los tickets cerrados esta semana.</p>`;
}

/* ---------- REPORTAR (Eloy Queda) ---------- */
async function renderReportar(){
  const {data:ubis}=await sb.from("mtto_ubicaciones").select("id,nombre").eq("property_id",PROP.id).order("orden");
  $("#view").innerHTML=`
    <div class="card"><h3>✍️ Reportar una incidencia · ${PROP.n}</h3><div class="form-grid">
      <div class="full"><label>¿Qué pasa?</label><textarea id="rDesc" rows="3" placeholder="Describe la incidencia…"></textarea></div>
      <div><label>Área / habitación</label><select id="rUbic"><option value="">—</option>${(ubis||[]).map(u=>`<option value="${u.id}">${esc(u.nombre)}</option>`).join("")}</select></div>
      <div><label>Clasificación</label><select id="rClas">
        <option value="reactivo">Reactivo (pierdo la venta)</option>
        <option value="correctivo" selected>Correctivo (pierdo calidad)</option>
        <option value="preventivo">Preventivo (evita un daño mayor)</option></select></div>
      <div class="full"><label>Foto (URL)</label><input id="rFoto" placeholder="https://…"></div>
      <div class="full"><button class="btn" onclick="saveReporte()">Enviar a mantenimiento</button></div>
    </div></div>
    <p class="muted" style="font-size:13px">Nota: aquí el ticket se crea directo. En Pepe Chat, <b>Eloy Queda (IA)</b> hará este mismo flujo por conversación (redacta, clasifica y confirma) — es la Fase 3 con Edge Function.</p>`;
}
async function saveReporte(){
  const desc=$("#rDesc").value.trim();if(!desc)return toast("Describe la incidencia");
  const {error}=await sb.from("mtto_tickets").insert({property_id:PROP.id,origen:"reporte_chat",
    clasificacion:$("#rClas").value,ubicacion_id:$("#rUbic").value||null,
    titulo:desc.slice(0,60),descripcion:desc,foto_url:$("#rFoto").value.trim()||null,
    reportado_por:USER.id,reportado_por_nombre:USER.email,estado:"nuevo"});
  if(error)return toast(error.message);toast("Reporte enviado ✔");$("#rDesc").value="";$("#rFoto").value="";
}

/* start */
sb.auth.getSession().then(({data})=>{if(data.session)boot();});
</script>
</body>
</html>
