<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Mantenimiento · Casa Pepe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
    --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
    --rule:#E2DCCF; --rule-2:#D2C8B6;
    --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
    --ok:#1D6B4A; --ok-bg:#E1F0E7; --warn:#8C6212; --warn-bg:#F3EAD6;
    --bad:#9E3B2E; --bad-bg:#F4E2DE; --none:#66707A; --none-bg:#E9E4DA;
    --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;line-height:1.5}
  .mono{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
  h1,h2,h3{margin:0}
  .btn{font:inherit;font-weight:600;border-radius:6px;cursor:pointer;padding:8px 14px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent)}
  .btn:hover{filter:brightness(1.08)} .btn[disabled]{opacity:.5;cursor:default;filter:none}
  .btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
  .btn.sm{padding:5px 10px;font-size:12.5px;border-radius:6px}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  input,select,textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--rule-2);border-radius:6px;padding:8px 10px;width:100%}
  input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
  label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:10px 0 4px}
  /* header */
  header.top{background:var(--surface);border-bottom:1px solid var(--rule)}
  .top-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px}
  .brand small{font-weight:600;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .top-sp{flex:1}
  .prop-lbl{font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:6px 13px;font-size:13px}
  select.prop{width:auto;min-width:130px;font-weight:600}
  .who{font-size:12.5px;color:var(--muted)}
  /* secnav */
  .secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
  .secnav-in{max-width:1180px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
  .secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  .secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
  .cfgcard{max-width:580px;margin:0 auto 14px}
  .cfggrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
  .dias{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
  .dchk{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;background:var(--surface-2);border:1px solid var(--rule);border-radius:8px;padding:6px 10px;cursor:pointer}
  .dchk input{width:auto;margin:0}
  .kpi.click{cursor:pointer} .kpi.click:hover{border-color:var(--accent)}
  .prodgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
  .hpila{height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex;position:relative}
  .hpila i{display:block;height:100%;background:var(--accent)}
  .hpila.warn i{background:var(--warn)} .hpila.bad i{background:var(--bad)} .hpila.full i{background:var(--ok)}
  .hpila .mk{position:absolute;top:0;bottom:0;width:1px;background:rgba(31,27,22,.35)}
  .prodrow{display:flex;justify-content:space-between;font-size:12.5px;margin-top:5px}
  .ef{font-weight:800}
  main{max-width:1180px;margin:0 auto;padding:18px 16px 60px}
  h2.vt{font-size:20px;margin-bottom:14px}
  /* kpis / cards */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}
  .kpi{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .n{font-size:26px;font-weight:700;line-height:1}
  .kpi .l{color:var(--muted);font-size:12.5px;margin-top:5px}
  .card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .card h3{font-size:15px;padding:13px 16px;border-bottom:1px solid var(--rule)}
  .card .pad{padding:16px}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
  th{text-align:left;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface-3)}
  td{padding:10px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;white-space:nowrap}
  .chip{display:inline-block;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap}
  .c-react{background:var(--bad-bg);color:var(--bad)} .c-correc{background:var(--warn-bg);color:var(--warn)} .c-prev{background:var(--ok-bg);color:var(--ok)}
  .c-info{background:var(--none-bg);color:var(--ink-2)}
  .st{font-size:11px;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:6px;padding:3px 7px;background:var(--surface-3)}
  details.area{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
  details.area>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;font-weight:600}
  details.area>summary::-webkit-details-marker{display:none}
  details.area>summary::before{content:"▸";color:var(--muted);transition:transform .15s}
  details.area[open]>summary::before{transform:rotate(90deg)}
  details.area>summary .sub{margin-left:auto;font-weight:500;font-size:12px;color:var(--muted);display:flex;gap:6px}
  details.reco{margin-top:4px}
  details.reco>summary{cursor:pointer;color:var(--accent);font-size:12px;font-weight:600;list-style:none}
  details.reco>summary::-webkit-details-marker{display:none}
  details.reco .txt{font-size:12.5px;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--rule);border-radius:8px;padding:9px 11px;margin-top:6px;white-space:pre-wrap;line-height:1.45}
  .caly{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0}
  .caly .mc{aspect-ratio:1;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;border:1px solid var(--rule);background:var(--surface-3);color:var(--faint)}
  .caly .mc.due{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
  .caly .mc.done{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
  .caly .mc.late{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
  .calh{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:2px}
  .calh span{text-align:center;font-size:9px;color:var(--faint);font-weight:700}
  a.lnk{color:var(--accent);text-decoration:none;font-weight:600}a.lnk:hover{text-decoration:underline}
  .row-actions{display:flex;gap:6px;flex-wrap:wrap}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .filters select{width:auto;min-width:150px}
  .muted{color:var(--muted)} .center{text-align:center;padding:26px;color:var(--muted)}
  .bar{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden;display:flex}
  .bar span{display:block;height:100%}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:560px){.form-grid{grid-template-columns:1fr}}
  .form-grid .full{grid-column:1/-1}
  .modal-bg{position:fixed;inset:0;background:rgba(31,27,22,.4);display:none;place-items:center;padding:16px;z-index:50}
  .modal-bg.on{display:grid}
  .modal{background:var(--surface);border-radius:14px;max-width:520px;width:100%;box-shadow:var(--shadow);max-height:90vh;overflow:auto}
  .modal h3{padding:15px 16px;border-bottom:1px solid var(--rule);font-size:16px}
  .modal .foot{padding:13px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--rule)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:8px;font-size:13.5px;box-shadow:var(--shadow);opacity:0;transition:.25s;z-index:60}
  .toast.on{opacity:1}
  .tec{border:1px solid var(--rule);border-radius:12px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .tec .h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
  .tec .h b{font-size:15px}
  /* login */
  #login{min-height:100vh;display:grid;place-items:center;padding:20px}
  .login-card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);padding:30px;max-width:360px;width:100%}
  .login-card h1{font-size:22px;margin:6px 0 3px}
  .login-card .eb{font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .err{color:var(--bad);font-size:13px;margin-top:10px;min-height:18px}
  /* Programación semanal (cajones/pila estilo Ama de Llaves) */
  .progwrap{display:grid;grid-template-columns:minmax(320px,1.2fr) minmax(260px,1fr);gap:14px;align-items:start}
  @media(max-width:820px){.progwrap{grid-template-columns:1fr}}
  .pend{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .pend .hd{padding:11px 14px;border-bottom:1px solid var(--rule);font-weight:600;font-size:13.5px;background:var(--surface-3)}
  .pitem{padding:10px 12px;border-bottom:1px solid var(--rule);cursor:grab}
  .pitem:last-child{border-bottom:none} .pitem:hover{background:var(--surface-3)} .pitem.drag{opacity:.4}
  .pitem .t{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pitem .m{color:var(--muted);font-size:11.5px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ur{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px}
  .ur.hi{background:var(--bad-bg);color:var(--bad)} .ur.md{background:var(--warn-bg);color:var(--warn)} .ur.lo{background:var(--none-bg);color:var(--ink-2)}
  .cols{display:flex;flex-direction:column;gap:12px}
  .acol{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .acol.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .acol .ahd{padding:10px 14px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .acol .ahd b{font-size:14.5px}
  .flotachip{font-size:10px;font-weight:700;background:var(--accent-soft);color:var(--accent);padding:2px 7px;border-radius:999px}
  .apila{height:12px;border-radius:6px;background:var(--surface-2);margin:10px 14px 4px;position:relative;overflow:hidden;display:flex}
  .apila i{display:block;height:100%} .apila .lim{background:var(--accent)} .apila .tra{background:var(--none)}
  .apila .obl{background:repeating-linear-gradient(45deg,var(--warn),var(--warn) 4px,#a8770f 4px,#a8770f 8px)}
  .achip .asel{margin:0 2px 0 0;flex:none;width:15px;height:15px;accent-color:var(--accent);cursor:pointer}
  .apila.warn .lim{background:var(--warn)} .apila.bad .lim{background:var(--bad)}
  .apila .marca{position:absolute;top:0;bottom:0;width:1px;background:rgba(31,27,22,.35)}
  .afila{display:flex;justify-content:space-between;padding:0 14px 6px;font-size:12px}
  .apct{font-weight:700}
  .achips{padding:8px 12px 12px;display:flex;flex-direction:column;gap:6px;min-height:44px}
  .achip{background:var(--surface-3);border:1px solid var(--rule);border-radius:8px;padding:7px 9px;font-size:12.5px;cursor:grab;display:flex;gap:7px;align-items:center}
  .achip.dos{border-color:var(--accent)} .achip .x{margin-left:auto;color:var(--muted);cursor:pointer;font-weight:700;padding:0 2px}
  .sqrow{padding:0 14px 2px} .sq{font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;background:var(--surface-2);color:var(--ink-2);border:1px solid var(--rule);white-space:nowrap}
  .sq.obl{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)} .sq.r{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)} .sq.c{background:var(--warn-bg);color:var(--warn)}
  .sq.cal{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
  .sq.mv{cursor:grab} .sq.mv:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent-soft)} .sq.mv:active{cursor:grabbing}
  .sq.mv.drag{opacity:.4}
  .pitem,.achip,.sq.mv{-webkit-user-select:none;user-select:none}
  .pend details.pgrp>summary{list-style:none;cursor:pointer;padding:9px 12px;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--rule);background:var(--surface)}
  .pend details.pgrp>summary::-webkit-details-marker{display:none}
  .pend details.pgrp>summary::before{content:'▸ ';color:var(--muted)}
  .pend details.pgrp[open]>summary::before{content:'▾ ';color:var(--muted)}
  .pgroup{border-bottom:1px solid var(--rule-2)} .pgroup:last-child{border-bottom:none}
  .pgroup>.ghd{padding:10px 12px;font-weight:700;font-size:13px;background:var(--surface-3);display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none}
  .pgroup>.ghd .gc{margin-left:auto;color:var(--muted);font-weight:600;font-size:12px}
  .sortbar{display:flex;gap:4px;padding:6px 10px;background:var(--surface);border-bottom:1px solid var(--rule);align-items:center;flex-wrap:wrap}
  .sortbar .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;margin-right:2px}
  .sbtn{font:inherit;font-size:11px;font-weight:600;border:1px solid var(--rule);background:var(--surface);color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer}
  .sbtn.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .pgnada{padding:8px 12px;font-size:12px;color:var(--faint)}
  /* Embebido en el panel: el panel ya trae su barra; ocultamos el header propio para no duplicarlo */
  html.embed header.top .brand, html.embed #who, html.embed #btnSalir{display:none}
  html.embed header.top{padding:4px 0;box-shadow:none;border-bottom:1px solid var(--rule);background:var(--ground)}
  html.embed header.top .top-in:empty, html.embed header.top:has(.top-in > #propWrap:empty){display:none}
  /* ---- Calendario visual de preventivos ---- */
  .calbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .calkpi{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:7px 12px;font-size:13px}
  .calkpi b{font-size:1.15rem}
  .calwrap{overflow:auto;max-height:78vh;border:1px solid var(--rule);border-radius:12px;background:var(--surface)}
  table.calx{border-collapse:separate;border-spacing:0;font-size:11.5px;min-width:100%}
  table.calx th,table.calx td{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:0}
  table.calx thead th{position:sticky;top:0;z-index:3;background:var(--surface-2);font-weight:600;text-align:center;padding:4px 6px;vertical-align:bottom}
  table.calx thead tr:first-child th{top:0}
  table.calx thead tr.colrow th{top:26px;z-index:3}
  table.calx .areah{font-family:inherit;font-weight:700;font-size:12px;color:var(--accent-ink,#0C5C40);border-bottom:2px solid var(--rule-2)}
  table.calx .colh{cursor:pointer;min-width:66px;max-width:66px;width:66px;line-height:1.15;color:var(--ink);white-space:normal}
  table.calx .colh:hover{background:var(--accent-soft)}
  table.calx .colh .oi{font-size:14px;display:block}
  table.calx th.corner{position:sticky;left:0;z-index:5;background:var(--surface-2);min-width:96px;text-align:left;padding:5px 8px}
  table.calx td.wk,table.calx th.wk{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding:4px 8px;min-width:96px;white-space:nowrap;font-weight:600}
  table.calx td.wk .mo{display:block;font-size:10px;color:var(--accent-ink,#0C5C40);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
  table.calx td.wk .dt{color:var(--muted);font-weight:400;font-size:10.5px}
  table.calx tr.poolrow td.wk{color:var(--warn)}
  table.calx td.cell{height:30px;vertical-align:middle;text-align:center}
  .cchip{display:inline-block;min-width:40px;padding:3px 5px;border-radius:6px;font-weight:700;cursor:grab;
    border:1px solid;line-height:1.1;touch-action:none;user-select:none;font-variant-numeric:tabular-nums}
  .cchip small{font-weight:500;opacity:.75}
  .cchip.n2::after{content:"×"attr(data-n)}
  table.calx td.wktot{position:sticky;right:0;z-index:2;background:var(--surface);text-align:center;font-weight:700;min-width:64px;padding:3px 6px;font-variant-numeric:tabular-nums}
  table.calx th.corner.r{left:auto;right:0;z-index:5}
  table.calx tfoot td,table.calx tfoot th{position:sticky;bottom:0;z-index:3;background:var(--surface-2);font-weight:700;text-align:center;padding:4px 6px}
  table.calx tfoot th.wk{left:0;z-index:4}
  .calghost{position:fixed;z-index:9999;pointer-events:none;transform:translate(-50%,-50%);opacity:.92}
  table.calx td.cell.drop{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
  .perleg{display:flex;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--muted);align-items:center}
  .perleg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:3px;vertical-align:-1px}
  .cchip.rc{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink,#0C5C40)}
  table.calx td.roomcell{text-align:center}
  table.calx .addcell{border:1px dashed var(--rule-2);background:none;color:var(--faint);border-radius:6px;width:22px;height:22px;line-height:1;cursor:pointer;font-size:14px;padding:0}
  table.calx .addcell:hover{border-color:var(--accent);color:var(--accent)}
  table.calx .colh.room{min-width:52px;max-width:52px;width:52px;cursor:default;font-weight:700}
  table.calx col.colhi{background:rgba(19,122,86,.10)}
  table.calx tbody tr.rowhi td.cell{background:rgba(19,122,86,.06)}
  table.calx tbody tr.rowhi td.wk{background:var(--surface-2)}
  table.calx .foot3{font-size:10px;line-height:1.35;text-align:center}
  .lwrow{display:flex;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--rule);border-radius:9px;margin-bottom:5px;cursor:pointer;background:var(--surface)}
  .lwrow:hover{border-color:var(--rule-2);background:var(--surface-3)}
  .lwrow .oi{font-size:16px}
  .lwrow .lwnm{flex:1;min-width:0}
  .lwrow .lwmin{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink-2);white-space:nowrap}
</style>
</head>
<body>
<script>try{if(window.self!==window.top)document.documentElement.classList.add('embed');}catch(e){document.documentElement.classList.add('embed');}</script>

<div id="login" style="display:none">
  <form class="login-card" onsubmit="return doLogin(event)">
    <div class="eb">Casa Pepe · Servicios</div>
    <h1>🔧 Mantenimiento</h1>
    <p class="muted" style="margin:0 0 16px;font-size:14px">Entra con tu cuenta Casa Pepe.</p>
    <label>Correo</label><input id="lemail" type="email" autocomplete="username" required>

async function renderCalendario(){

    .select('id,semana_programada,minutos_estimados,oficio,periodicidad,estado,recomendacion,catalogo_id,subtarea_id,ubicacion_id, cat:catalogo_id(tarea,alcance,oficio,ejecucion), sub:subtarea_id(descripcion), ubic:ubicacion_id(nombre,tipo)')

  const locMap={};
  plan.forEach(r=>{const id=r.ubicacion_id||'GEN'; if(!locMap[id])locMap[id]={id, nombre:r.ubicacion_id?((r.ubic&&r.ubic.nombre)||id):'General', tipo:r.ubicacion_id?((r.ubic&&r.ubic.tipo)||'area'):'general'};});

  const locs=Object.values(locMap).sort((a,b)=>grp(a)!==grp(b)?grp(a)-grp(b):String(a.nombre).localeCompare(String(b.nombre),'es',{numeric:true}));

  CAL.cols=cols;
  const colKey=r=>'L'+(r.ubicacion_id||'GEN');
  // Semanas jul->dic (ampliando)
  const mondayISO=(dt)=>{const d=new Date(dt);const w=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-w);return d.toISOString().slice(0,10);};
  const withWk=plan.filter(r=>r.semana_programada), pool=plan.filter(r=>!r.semana_programada);
  let ini=mondayISO(anio+'-07-01T12:00:00Z'), fin=mondayISO(anio+'-12-31T12:00:00Z');
  if(withWk.length){const ws=withWk.map(r=>r.semana_programada).sort(); if(ws[0]<ini)ini=ws[0]; if(ws[ws.length-1]>fin)fin=ws[ws.length-1];}
  let weeks=[]; let dd=new Date(ini+'T12:00:00Z'); const end=new Date(fin+'T12:00:00Z');
  while(dd<=end){weeks.push(dd.toISOString().slice(0,10)); dd=new Date(dd.getTime()+6048e5);}
  CAL.weeks=weeks;
  // Índices
  const cellIds={}, weekTot={}, colProg={}, colHechas={}, colTotal={}, poolByCol={};
  plan.forEach(r=>{const ck=colKey(r), mn=r.minutos_estimados||0;
    colTotal[ck]=(colTotal[ck]||0)+mn; if(r.estado==='hecho')colHechas[ck]=(colHechas[ck]||0)+mn;
    if(r.semana_programada){const k=r.semana_programada+'@@'+ck;(cellIds[k]=cellIds[k]||{ids:[],min:0});cellIds[k].ids.push(r.id);cellIds[k].min+=mn;
      colProg[ck]=(colProg[ck]||0)+mn; weekTot[r.semana_programada]=(weekTot[r.semana_programada]||0)+mn;}
    else {(poolByCol[ck]=poolByCol[ck]||{ids:[],min:0});poolByCol[ck].ids.push(r.id);poolByCol[ck].min+=mn;}});
  const overWeeks=weeks.filter(w=>(weekTot[w]||0)>CAP_SEM_MIN).length;
  const totalMin=withWk.reduce((s,r)=>s+(r.minutos_estimados||0),0);
  const areaGroups=[]; cols.forEach(c=>{const g=areaGroups[areaGroups.length-1]; if(g&&g.area===c.area)g.n++; else areaGroups.push({area:c.area,n:1});});
  const locChip=(min,ids)=>`<span class="cchip rc" data-chip data-ids="${ids.join(',')}" title="${ids.length} tareas · ${Math.round(min)}m — clic para ver/editar">${ids.length}·${Math.round(min)}m</span>`;

    const wt=weekTot[w]||0; const ratio=wt/CAP_SEM_MIN; const wc=ratio>1?'var(--bad)':(ratio>=.85?'var(--warn)':'var(--ok)');

  const cg=`<colgroup><col/>${cols.map(()=>'<col/>').join('')}<col/></colgroup>`;

    <div class="calbar">
      <button class="calkpi" style="cursor:pointer;border-color:${poolTotN?'var(--warn)':'var(--rule)'}" onclick="porAsignarModal()"><b style="color:${poolTotN?'var(--bad)':'var(--ok)'}">${poolTotN}</b> preventivos por asignar <span style="color:var(--accent);font-weight:700">＋</span></button>

    <div class="calwrap"><table class="calx">

        <tr><th class="corner" rowspan="2">Semana</th>${areaGroups.map(g=>`<th class="areah" colspan="${g.n}">${esc(g.area)}</th>`).join('')}<th class="corner r" rowspan="2">Sem.<br>/13h</th></tr>
        <tr class="colrow">${cols.map(c=>`<th class="colh ${c.room?'room':''}" title="${esc(c.label)}">${c.room?'🚪 ':''}${esc(c.label.length>22?c.label.slice(0,21)+'…':c.label)}</th>`).join('')}</tr>

function calWireHover(){
  const wrap=document.querySelector('.calwrap'); if(!wrap)return; const tbl=wrap.querySelector('table'); const cg=tbl.querySelector('colgroup');
  let curCol=null,curRow=null;
  tbl.addEventListener('mouseover',e=>{const cell=e.target.closest('td.cell,td.wktot,td.wk'); if(!cell)return;
    const idx=[...cell.parentNode.children].indexOf(cell);
    if(cg.children[idx]){ if(curCol)curCol.classList.remove('colhi'); curCol=cg.children[idx]; curCol.classList.add('colhi'); }
    const tr=cell.closest('tr'); if(curRow&&curRow!==tr)curRow.classList.remove('rowhi'); if(tr){curRow=tr;tr.classList.add('rowhi');} });
  tbl.addEventListener('mouseleave',()=>{ if(curCol){curCol.classList.remove('colhi');curCol=null;} if(curRow){curRow.classList.remove('rowhi');curRow=null;} });
}

function calWireDrag(){
  const wrap=document.querySelector('.calwrap'); if(!wrap)return;
  let drag=null,ghost=null,lastDrop=null,moved=false;
  wrap.querySelectorAll('[data-chip]').forEach(ch=>{
    ch.addEventListener('pointerdown',e=>{ e.preventDefault(); const cell=ch.closest('[data-cell]');
      drag={ids:ch.dataset.ids.split(','),col:cell.dataset.col,fromWeek:cell.dataset.week,loc:cell.dataset.loc}; moved=false;
      ghost=ch.cloneNode(true); ghost.className='cchip rc calghost'; document.body.appendChild(ghost); ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      ch.setPointerCapture(e.pointerId); });
    ch.addEventListener('pointermove',e=>{ if(!drag)return; moved=true; ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
      const el=document.elementFromPoint(e.clientX,e.clientY); const cell=el&&el.closest?el.closest('[data-cell]'):null;
      if(lastDrop&&lastDrop!==cell)lastDrop.classList.remove('drop');
      if(cell&&cell.dataset.col===drag.col){cell.classList.add('drop');lastDrop=cell;} else lastDrop=null; });
    ch.addEventListener('pointerup',async e=>{ if(!drag)return; if(ghost)ghost.remove();
      const el=document.elementFromPoint(e.clientX,e.clientY); const cell=el&&el.closest?el.closest('[data-cell]'):null;
      if(lastDrop)lastDrop.classList.remove('drop'); const d=drag; drag=null;
      const smallMove=!moved || (cell&&cell.dataset.col===d.col&&cell.dataset.week===d.fromWeek);
      if(smallMove){ return locWeekModal(d.loc,d.fromWeek); }

async function renderTablero(){
  const anio=new Date().getFullYear();
  const win30=(()=>{const d=new Date();d.setDate(d.getDate()-30);return d.toISOString().slice(0,10);})();
  const [{data:tk},{data:sum},{data:lec},{data:plan},{data:ext},{data:cc},{data:recs}]=await Promise.all([
    sb.from("mtto_tickets").select("estado,clasificacion,minutos_estimados,minutos_reales,asignado_nombre").eq("property_id",PROP.id),
    sb.from("mtto_suministros").select("id,estatus,costo,material,descripcion,link,semana").eq("property_id",PROP.id),
    sb.from("mtto_lecturas").select("huespedes,fecha,agua_lectura,luz_lectura,gas_pct").eq("property_id",PROP.id),
    sb.from("mtto_preventivo_plan").select("estado,oficio").eq("property_id",PROP.id).eq("anio",anio),
    sb.from("mtto_preventivos_catalogo").select("id,tarea,periodicidad,presupuesto,critico,empresa,ultimo_realizado, eq:equipo_id(nombre)").eq("property_id",PROP.id).eq("ejecucion","externo").eq("activo",true),
    sb.from("mtto_consumo_config").select("*").eq("property_id",PROP.id).maybeSingle(),
    sb.from("mtto_gas_recargas").select("fecha,litros").eq("property_id",PROP.id).gte("fecha",win30)
  ]);
  const CC=cc||{agua_factor_litros:1000,luz_factor_kwh:1,gas_tanque_litros:1600,obj_agua:[170,170,220,220,220,190,190,190,190,175,170,170],obj_luz:[6,6,6.5,7,7,7,6.5,6.5,6.5,6,6,6],obj_gas:[3.5,3.5,2.8,2.5,2.5,2.6,2.8,2.8,2.8,3,3.5,3.7]};
  const tanque=Number(CC.gas_tanque_litros||1600);
  // Promedio de los últimos 30 días, por huésped-noche. Agua/luz por delta del medidor; gas por las BAJADAS del % (las subidas son recargas).
  const asc=[...(lec||[])].sort((a,b)=>a.fecha<b.fecha?-1:1);
  let aguaL=0,aguaGN=0, luzK=0,luzGN=0, gasL=0,gasGN=0, ndias=0;
  for(let i=1;i<asc.length;i++){const p=asc[i-1],c=asc[i]; if(c.fecha<win30)continue;
    const gn=(c.huespedes!=null)?Number(c.huespedes):null; if(gn)ndias++;
    if(gn&&c.agua_lectura!=null&&p.agua_lectura!=null&&c.agua_lectura>p.agua_lectura){aguaL+=(c.agua_lectura-p.agua_lectura)*Number(CC.agua_factor_litros);aguaGN+=gn;}
    if(gn&&c.luz_lectura!=null&&p.luz_lectura!=null&&c.luz_lectura>p.luz_lectura){luzK+=(c.luz_lectura-p.luz_lectura)*Number(CC.luz_factor_kwh);luzGN+=gn;}
    if(gn&&c.gas_pct!=null&&p.gas_pct!=null&&Number(p.gas_pct)>Number(c.gas_pct)){gasL+=(Number(p.gas_pct)-Number(c.gas_pct))/100*tanque;gasGN+=gn;}
  }
  const aguaH=aguaGN?aguaL/aguaGN:null, luzH=luzGN?luzK/luzGN:null, gasH=gasGN?gasL/gasGN:null;
  const gasUlt=asc.length?asc[asc.length-1]:null;
  const mIdx=new Date().getMonth();
  const oAgua=CC.obj_agua[mIdx],oLuz=CC.obj_luz[mIdx],oGas=CC.obj_gas[mIdx];
  const T=tk||[];
  const open=T.filter(t=>!["cerrado","cancelado","resuelto"].includes(t.estado));
  const react=open.filter(t=>t.clasificacion==="reactivo").length;
  const corr =open.filter(t=>t.clasificacion==="correctivo").length;
  // Eficiencia = estimado ÷ real (100 = a tiempo, >100 = más rápido)
  const done=T.filter(t=>["resuelto","cerrado"].includes(t.estado)&&t.minutos_reales>0&&t.minutos_estimados>0);
  const efic=rows=>{const e=rows.reduce((s,r)=>s+r.minutos_estimados,0),r=rows.reduce((s,x)=>s+x.minutos_reales,0);return r?Math.round(e/r*100):null;};
  const eGlobal=efic(done);
  const byTec={}; done.forEach(t=>{const k=t.asignado_nombre||'—';(byTec[k]=byTec[k]||[]).push(t);});
  const eficCol=v=>v==null?'var(--muted)':(v>=95?'var(--ok)':(v>=80?'var(--warn)':'var(--bad)'));
  // Suministros: coste por huésped + compras pendientes
  const costoTot=(sum||[]).reduce((s,x)=>s+(+x.costo||0),0);
  const huesp=(lec||[]).reduce((s,x)=>s+(+x.huespedes||0),0);
  const costoHuesped=huesp?costoTot/huesp:null;

  const patch={estado:"validado",minutos_estimados:min,clasificacion:clas};
  if(tec){patch.asignado_a=tec;patch.asignado_nombre=tecName(tec);}
  const {error}=await sb.from("mtto_tickets").update(patch).eq("id",id);
  if(error)return toast(error.message);
  await ev(id,"validado",{minutos_estimados:min});closeModal();toast("Validado");renderTickets();
}
async function iniciar(id){
  const {data:t0}=await sb.from("mtto_tickets").select("requiere_compra").eq("id",id).single();
  if(t0&&t0.requiere_compra){
    const {data:sum}=await sb.from("mtto_suministros").select("estatus,entregado_at").eq("ticket_id",id);
    const ok=(sum||[]).some(x=>x.entregado_at||["comprado","recibido","entregado"].includes(x.estatus));
    if(!ok)return toast("No se puede iniciar: falta que se entregue la compra");
  }
  const {error}=await sb.from("mtto_tickets").update({estado:"en_proceso",iniciado_at:new Date().toISOString()}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"iniciado");toast("Iniciado");render();}
async function resolver(id){
  modal(`<h3>Resolver</h3><div class="pad"><label>Foto de resuelto (URL)</label><input id="mFoto" placeholder="opcional">
    <p class="muted" style="font-size:12.5px;margin-top:8px">Los minutos reales se calculan desde Iniciar.</p></div>

    <button class="btn sm" onclick="saveResolver('${id}')">Marcar resuelto</button></div>`);
}
async function saveResolver(id){
  const {data:t}=await sb.from("mtto_tickets").select("iniciado_at").eq("id",id).single();
  const now=new Date(); const mins=t?.iniciado_at?Math.max(1,Math.round((now-new Date(t.iniciado_at))/60000)):null;
  const {error}=await sb.from("mtto_tickets").update({estado:"resuelto",resuelto_at:now.toISOString(),minutos_reales:mins,foto_resuelto_url:$("#mFoto").value.trim()||null}).eq("id",id);
  if(error)return toast(error.message);await ev(id,"resuelto",{minutos_reales:mins});closeModal();toast("Resuelto"+(mins?` · ${mins} min`:""));render();}

  if(error)return toast(error.message);await ev(id,"cerrado_conforme");toast("Cerrado");render();}

async function saveSolicitarCompra(ticketId){
  const desc=$("#scDesc").value.trim(); if(!desc)return toast("Describe qué se necesita");
  const link=$("#scLink").value.trim()||null, costo=parseFloat($("#scCosto").value)||null, foto=$("#scFoto").value.trim()||null;
  const {data:tk}=await sb.from("mtto_tickets").select("titulo").eq("id",ticketId).single();
  const {error}=await sb.from("mtto_suministros").insert({property_id:PROP.id,ticket_id:ticketId,descripcion:desc,material:desc.slice(0,80),link,costo,foto_url:foto,estatus:"solicitado",semana:mondayOf(new Date()),solicitado_por:USER.id,solicitado_por_nombre:USER.email,subido_por:USER.id,subido_por_nombre:USER.email});
  if(error)return toast(error.message);
  await sb.from("mtto_tickets").update({requiere_compra:true}).eq("id",ticketId);
  await ev(ticketId,"compra_solicitada",{descripcion:desc,link,costo});
  const {data:cfg}=await sb.from("mtto_config").select("compras_emp_id,compras_user_id").eq("property_id",PROP.id).maybeSingle();
  if(cfg&&cfg.compras_user_id){
    await sb.from("notificaciones").insert({employee_id:cfg.compras_emp_id,user_id:cfg.compras_user_id,
      titulo:"🛒 Compra de mantenimiento ("+PROP.n+")",
      cuerpo:(tk&&tk.titulo?tk.titulo+": ":"")+desc+(link?"  · "+link:"")+(costo?"  · ~"+money(costo):""),
      icono:"🛒",accion:{url:"/mantenimiento.html",tipo:"mtto_compra",ticket:ticketId},leido:false});
  }
  closeModal();toast("Solicitud de compra enviada");render();
}
async function marcarEntregada(sumId,ticketId){
  const {error}=await sb.from("mtto_suministros").update({estatus:"recibido",entregado_at:new Date().toISOString()}).eq("id",sumId);
  if(error)return toast(error.message);await ev(ticketId,"compra_entregada",{suministro:sumId});
  toast("Compra entregada · ya se puede iniciar");closeModal();render();}

/* PREVENTIVOS */
const ALCANCE={especifico:'📍 Un área',hotel:'🏨 Todo el hotel (1 tarea)',habitaciones:'🛏️ Todas las habitaciones',areas:'🏛️ Todas las áreas',todo:'🏢 Cada lugar (hbs + áreas)'};
let PREV_UBIS={nHab:0,nArea:0};
function alcanceN(a){ const {nHab,nArea}=PREV_UBIS; return a==='habitaciones'?nHab:(a==='areas'?nArea:(a==='todo'?nHab+nArea:1)); } // 'hotel' y 'especifico' = 1
function vecesAnio(per){ return 365/(PER_DAYS[per]||30); }
let PREV_SUBS={};   // catalogo_id -> [subtareas]
const ROUTINE=new Set(['diaria','semanal']);  // rutina del técnico, no genera ticket
function subsDe(r){ return PREV_SUBS[r.id]&&PREV_SUBS[r.id].length? PREV_SUBS[r.id] : [{periodicidad:r.periodicidad,minutos_estimados:r.minutos_estimados,oficio:r.oficio,descripcion:r.tarea}]; }
function subsProg(r){ return subsDe(r).filter(st=>!ROUTINE.has(st.periodicidad)); }
function prevHorasAnio(r){ const n=alcanceN(r.alcance||'especifico'); return subsProg(r).reduce((s,st)=>s+n*vecesAnio(st.periodicidad)*(st.minutos_estimados||0)/60,0); }
async function renderPrev(){
  const anio=new Date().getFullYear();
  const [{data,error},{data:ub},{data:pu},{data:plan}]=await Promise.all([
    sb.from("mtto_preventivos_catalogo").select("*, ubic:ubicacion_id(nombre,orden)").eq("property_id",PROP.id).eq("activo",true),
    sb.from("mtto_ubicaciones").select("tipo").eq("property_id",PROP.id),
    sb.from("mtto_puesto").select("*"),
    sb.from("mtto_preventivo_plan").select("estado,semana_programada,minutos_estimados,equipo_id,eq:equipo_id(nombre, ubic:ubicacion_id(nombre)),cat:catalogo_id(tarea),pubic:ubicacion_id(nombre)").eq("property_id",PROP.id).eq("anio",anio)
  ]);
  if(error)throw error; const rows=data||[];
  PREV_UBIS={nHab:(ub||[]).filter(u=>u.tipo==='habitacion').length, nArea:(ub||[]).filter(u=>u.tipo==='area').length};
  // Subtareas por preventivo (la previsión real = subtareas × áreas × veces/año)
  PREV_SUBS={};
  if(rows.length){ const {data:subs}=await sb.from("mtto_preventivo_subtarea").select("*").eq("activo",true).in("catalogo_id",rows.map(r=>r.id));
    (subs||[]).forEach(s=>{(PREV_SUBS[s.catalogo_id]=PREV_SUBS[s.catalogo_id]||[]).push(s);}); }
  // Cálculo de carga anual: alimenta los KPIs de arriba (horas, personas)
  const interno=rows.filter(r=>r.ejecucion!=='externo'), externo=rows.filter(r=>r.ejecucion==='externo');
  const hInt=interno.reduce((s,r)=>s+prevHorasAnio(r),0);
  const hExt=externo.reduce((s,r)=>s+prevHorasAnio(r),0);
  const instInt=interno.reduce((s,r)=>{const n=alcanceN(r.alcance||'especifico');return s+subsProg(r).reduce((a,st)=>a+n*vecesAnio(st.periodicidad),0);},0);
  const presu=externo.reduce((s,r)=>s+(+r.presupuesto||0),0);
  // Capacidad: una persona ≈ jornada del turno (h/sem) × 48 semanas útiles
  const sems=(pu||[]).map(p=>+p.horas_semana||48).filter(x=>x>0);
  const semAvg=sems.length?sems.reduce((a,b)=>a+b,0)/sems.length:48;
  const capPersona=semAvg*48; const personas=capPersona?hInt/capPersona:0;
  // Desglose por OFICIO (por subtarea × área, solo interno; sin rutina diaria/semanal)
  const OFI={}; interno.forEach(r=>{const n=alcanceN(r.alcance||'especifico');subsProg(r).forEach(st=>{const o=st.oficio||r.oficio||'general';OFI[o]=(OFI[o]||0)+n*vecesAnio(st.periodicidad)*(st.minutos_estimados||0)/60;});});
  const ofiRows=Object.keys(OFI).sort((a,b)=>OFI[b]-OFI[a]).map(o=>`<tr><td>${esc(ofNombre(o))}</td><td class="num">${Math.round(OFI[o])} h</td><td class="num"><b>${(OFI[o]/capPersona).toFixed(1)}</b></td></tr>`).join('');
  // Agrupación POR MÁQUINA (¿la caldera recibió todos sus mtto?)
  const MAQ={};(plan||[]).filter(p=>p.equipo_id&&p.eq).forEach(p=>{const k=p.equipo_id;const m=MAQ[k]=MAQ[k]||{nom:p.eq.nombre,area:p.eq.ubic?.nombre||'—',hechas:0,pend:0,tot:0};m.tot++;if(p.estado==='hecho')m.hechas++;else m.pend++;});
  const maqRows=Object.values(MAQ).sort((a,b)=>b.pend-a.pend).map(m=>`<tr><td>${esc(m.nom)}</td><td class="muted">${esc(m.area)}</td><td class="num">${m.hechas}</td><td class="num"><b style="color:${m.pend?'var(--warn)':'var(--ok)'}">${m.pend}</b></td><td class="num">${m.tot}</td></tr>`).join('');
  // El calendario en barras se quitó de esta pestaña (Javi, 2-sep). Se conserva
  // PREV_PLAN porque planSemana() sigue existiendo; hoy ya no tiene botón que
  // la llame, así que si no se va a reenganchar se puede borrar.
  window.PREV_PLAN=plan||[];
  const FILT=window.PREV_FILT||'';
  const list=FILT?rows.filter(r=>FILT==='externo'?r.ejecucion==='externo':(FILT==='interno'?r.ejecucion!=='externo':r.oficio===FILT)):rows;
  const ofChips=[['','Todos'],['interno','Internos'],['externo','Externos']].concat(OFICIOS);
  $("#view").innerHTML=`
    <div class="kpis">
      <div class="kpi"><div class="n">${rows.length}</div><div class="l">preventivos configurados</div></div>
      <div class="kpi"><div class="n">${Math.round(instInt)}</div><div class="l">tareas internas al año</div></div>
      <div class="kpi"><div class="n" style="color:var(--accent)">${Math.round(hInt)} h</div><div class="l">horas de preventivo/año (interno)</div></div>
      <div class="kpi"><div class="n" style="color:var(--accent)">${personas.toFixed(1)}</div><div class="l">personas solo para preventivos</div></div>
    </div>
    ${maqRows?`<div class="card"><h3 style="margin:0">Por máquina (revisa que cada equipo tenga sus mtto)</h3><div class="scroll"><table><thead><tr><th>Máquina</th><th>Área</th><th class="num">hechas</th><th class="num">pend.</th><th class="num">plan/año</th></tr></thead><tbody>${maqRows}</tbody></table></div></div>`:''}
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:14px 2px">
      <button class="btn sm" onclick="addPrev()">＋ Nuevo preventivo</button>
      <button class="btn ghost sm" onclick="generarPlanPrev(${anio})">🗓️ Generar / actualizar plan ${anio}</button>
      <span class="muted" style="font-size:12px">Filtrar:</span>
      ${ofChips.map(o=>`<button class="btn ghost sm" style="${FILT===o[0]?'border-color:var(--accent);color:var(--accent)':''}" onclick="window.PREV_FILT='${o[0]}';renderPrev()">${o[1]}</button>`).join('')}
    </div>
    <div class="card"><div class="scroll"><table><thead><tr><th>Trabajo</th><th>Oficio</th><th>Subtareas</th><th>Dónde</th><th class="num">h/año</th><th>Ejecución</th><th></th></tr></thead>
    <tbody>${list.length?list.map(r=>{const n=alcanceN(r.alcance||'especifico');const reco=r.recomendacion||r.ficha_texto;const subs=subsDe(r);const pers=[...new Set(subs.map(s=>s.periodicidad))].join(', ');
      return `<tr><td>${esc(r.tarea)}${r.critico?' <span class="chip c-react">crítico</span>':''}${reco?`<details class="reco"><summary>ver ficha</summary><div class="txt">${esc(reco)}</div></details>`:''}</td>
      <td>${r.oficio?esc(ofNombre(r.oficio)):'—'}</td>
      <td><button class="btn ghost sm" onclick="editSubs('${r.id}')">🧩 ${subs.length} subtarea${subs.length!==1?'s':''}</button><div class="muted" style="font-size:11px">${esc(pers)}</div></td>
      <td>${(r.alcance||'especifico')==='especifico'?esc(r.ubic?.nombre||'—'):`${ALCANCE[r.alcance]} <span class="muted">(${n})</span>`}</td>
      <td class="num">${prevHorasAnio(r).toFixed(1)}</td>
      <td>${r.ejecucion==='externo'?`<span class="chip c-info">🏢 ${esc(r.empresa||'externo')}</span>${r.presupuesto?`<div class="muted" style="font-size:11px">${money(r.presupuesto)}</div>`:''}`:'<span class="chip c-prev">interno</span>'}</td>
      <td class="num" style="white-space:nowrap"><button class="btn ghost sm" onclick="editPrev('${r.id}')">Editar</button> <button class="btn ghost sm" onclick="cancelPrev('${r.id}')">✕</button></td></tr>`;}).join(''):'<tr><td class="muted" style="padding:16px">Sin preventivos con ese filtro.</td></tr>'}</tbody></table></div></div>`;
}

function guessOficio(r){ if(r.oficio)return r.oficio; const t=((r.titulo||'')+' '+(r.descripcion||'')).toLowerCase();

  if(/foco|\bluz\b|lampar|luminaria|contacto|apagador|electric|corto|cablead|breaker|pastilla/.test(t))return 'electricidad';
  if(/cerradura|chapa|candado|llavin/.test(t))return 'cerrajeria';
  if(/madera|puerta|mueble|repisa|cajon|carpint|litera|closet|zoclo/.test(t))return 'carpinteria';
  if(/herrer|soldad|barandal|reja|\bmetal|estructura/.test(t))return 'herreria';
  if(/muro|pared|\bpiso\b|azulejo|impermeab|yeso|resane|junta|cemento|alban/.test(t))return 'albanileria';
  if(/jard|planta|poda|riego|maceta/.test(t))return 'jardineria';
  if(/wifi|internet|\bred\b|camara|cctv|router|antena|pantalla|impresora/.test(t))return 'electronica_it';

function estimMin(r){ if(r.minutos_estimados) return {min:r.minutos_estimados,prop:false};

  const t=((r.titulo||'')+' '+(r.descripcion||'')).toLowerCase();
  if(/pintar|pintura|repintar|barniz/.test(t)) m=Math.max(m,180);
  if(/caldera|boiler|bomba|hidroneum/.test(t)) m=Math.max(m,120);

  if(/cerradura|chapa|llave/.test(t)) m=Math.min(m,45);

function wkUrg(semana,crit){ const wk=new Date((semana||'2999-01-01')+'T12:00:00Z');
  const wl=Math.max(0,Math.floor((Date.now()-wk.getTime())/6048e5));

function sortNorm(list,key){

}

function grpArea(key,titulo,items){
  const sort=PROG_SORT[key]||'urg';
  const g={}; items.forEach(n=>{(g[n.area]=g[n.area]||[]).push(n);});
  let areas=Object.keys(g).map(a=>({a,items:g[a],avg:g[a].reduce((s,n)=>s+n.urg,0)/g[a].length,
    min:g[a].reduce((s,n)=>s+n.min,0)}));
  if(sort==='area')areas.sort((x,y)=>x.a.localeCompare(y.a,'es'));
  else if(sort==='min')areas.sort((x,y)=>y.min-x.min);
  else areas.sort((x,y)=>y.avg-x.avg);
  areas.forEach(o=>sortNorm(o.items,sort));
  const body=areas.map(o=>{const ak=key+'|'+slugK(o.a),aop=PROG_AOPEN.has(ak);

  const inner=`<div class="sortbar">${sortBar(key)}</div>`+(items.length?body:'<div class="pgnada">Nada por asignar aquí</div>');

function wireDrag(){
  let dragTk=null,dragProf=null,dragPrev=null,dragPP=null,dragSq=null;
  const clr=()=>{dragTk=null;dragProf=null;dragPrev=null;dragPP=null;dragSq=null;};
  document.querySelectorAll('.pitem,.achip,.sq.mv').forEach(el=>{
    el.addEventListener('dragstart',e=>{dragTk=el.getAttribute('data-tk');dragProf=el.getAttribute('data-prof');dragPrev=el.getAttribute('data-prev');dragPP=el.getAttribute('data-prevplan');dragSq=el.getAttribute('data-sq');el.classList.add('drag');try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragTk||dragProf||dragPP||dragSq||'');}catch(_){}});
    el.addEventListener('dragend',()=>el.classList.remove('drag'));
  });
  document.querySelectorAll('.achips').forEach(z=>{
    z.addEventListener('dragover',e=>{e.preventDefault();z.parentElement.classList.add('over');});
    z.addEventListener('dragleave',()=>z.parentElement.classList.remove('over'));
    z.addEventListener('drop',e=>{e.preventDefault();z.parentElement.classList.remove('over');const tec=z.getAttribute('data-drop');
      if(dragSq!=null)moverGrupo(+dragSq,tec);else if(dragPP)genPrevPlan(dragPP,tec);else if(dragPrev)genPrevUno(dragPrev,tec);else if(dragProf)genProfundo(dragProf,tec);else if(dragTk)asignar(dragTk,tec);clr();});
  });
  const pl=document.querySelector('.pend');
  if(pl){pl.addEventListener('dragover',e=>{if(dragSq!=null||(dragTk&&PROG_STATE.enSemana.some(r=>r.id===dragTk)))e.preventDefault();});
    pl.addEventListener('drop',e=>{if(dragSq!=null){e.preventDefault();desasignarGrupo(+dragSq);clr();}
      else if(dragTk&&PROG_STATE.enSemana.some(r=>r.id===dragTk)){e.preventDefault();quitarSemana(dragTk);clr();}});}
}

async function autoAsignarSemana(){
  if(!PROG_STATE)return; const board=PROG_STATE.board; if(!board.length)return toast('No hay técnicos');
  const capMinOf=t=>puestoCap(PROG_STATE.PUESTOS[t.id]).sem*60;
  const needOf=t=>puestoCap(PROG_STATE.PUESTOS[t.id]).minPrev*60;
  const half=(PROG_STATE.c.horas_dia||8)/2*60;
  const load={},prevLoad={},travel={};
  board.forEach(t=>{const mine=PROG_STATE.enSemana.filter(r=>r.asignado_a===t.id);
    travel[t.id]=!!(t._flota&&mine.length);
    load[t.id]=mine.reduce((s,r)=>s+(r.minutos_estimados||0),0)+(travel[t.id]?half:0);
    prevLoad[t.id]=mine.filter(r=>r.clasificacion==='preventivo').reduce((s,r)=>s+(r.minutos_estimados||0),0);});
  const needTravel=t=>(t._flota&&!travel[t.id])?half:0;
  const inserts=[],updates=[];
  const due=PROG_STATE.prevCat.slice(); let di=0;
  for(const t of board){ const need=needOf(t); while(prevLoad[t.id]<need && di<due.length){ const r=due[di++]; const min=r.minutos_estimados||estimMin(r).min;
    if(needTravel(t)){load[t.id]+=half;travel[t.id]=true;} inserts.push(prevInsert(r,t.id,min)); load[t.id]+=min; prevLoad[t.id]+=min; } }
  const pend=PROG_STATE.pend.slice().sort((a,b)=>(b._u||0)-(a._u||0));
  for(const r of pend){ const min=r.minutos_estimados||estimMin(r).min;
    let best=null,bestFree=-1;
    for(const t of board){ const free=capMinOf(t)-load[t.id]-needTravel(t); if(free>bestFree){bestFree=free;best=t;} }
    if(best&&bestFree>=min){ if(needTravel(best)){load[best.id]+=half;travel[best.id]=true;}
      updates.push({id:r.id,tec:best.id,min:r.minutos_estimados?null:min,of:r.oficio?null:guessOficio(r)}); load[best.id]+=min; } }
  if(!inserts.length&&!updates.length)return toast('Nada por asignar o sin capacidad libre');
  if(inserts.length){const {error}=await sb.from('mtto_tickets').insert(inserts);if(error)return toast(error.message);}
  for(const u of updates){const patch={asignado_a:u.tec,asignado_nombre:tecName(u.tec),semana_programada:PROG_WK,estado:'programado'};if(u.min)patch.minutos_estimados=u.min;if(u.of)patch.oficio=u.of;await sb.from('mtto_tickets').update(patch).eq('id',u.id);}
  toast('Propuesta lista ('+(inserts.length+updates.length)+' trabajos) · revisa y ajusta'); renderProg();
}
async function lanzarAsignacion(){
  if(!PROG_STATE)return; const board=PROG_STATE.board; const notifs=[];
  // Regla del 75%: cada colaborador debe tener >=75% de su jornada asignada (obligatorio + trabajos + traslado)
  const bajo=[];
  for(const t of board){ const cap=puestoCap(PROG_STATE.PUESTOS[t.id]);
    const mine=PROG_STATE.enSemana.filter(r=>r.asignado_a===t.id);
    const oblMin=Math.round(((+cap.lect||0)+(+cap.admin||0))*60);
    const travelMin=(t._flota&&mine.length)?((PROG_STATE.c.horas_dia||8)/2)*60:0;
    const workMin=mine.reduce((s,r)=>s+(r.minutos_estimados||0),0);
    const pct=Math.round((oblMin+workMin+travelMin)/((cap.sem*60)||1)*100);
    if(pct<75)bajo.push((t.nombre_display||t.nombre)+' '+pct+'%'); }
  if(bajo.length)return toast('⛔ Aún no puedes lanzar: falta llegar al 75% de la jornada — '+bajo.join(' · '));
  for(const t of board){ const mine=PROG_STATE.enSemana.filter(r=>r.asignado_a===t.id); if(!mine.length)continue;
    const {data:el}=await sb.from('empleado_login').select('user_id').eq('employee_id',t.id).maybeSingle();
    const h=(mine.reduce((s,r)=>s+(r.minutos_estimados||0),0)/60).toFixed(1);
    notifs.push({employee_id:t.id,user_id:el?el.user_id:null,titulo:'🔧 Tu plan de mantenimiento · semana '+PROG_WK,
      cuerpo:mine.length+' trabajos ('+h+' h). Ábrelo para iniciar y terminar cada uno.',icono:'🔧',
      accion:{url:'/m/mis-mtto.html?wk='+PROG_WK,tipo:'mtto_plan',semana:PROG_WK},leido:false}); }
  if(!notifs.length)return toast('No hay trabajos asignados esta semana');
  const {error}=await sb.from('notificaciones').insert(notifs);
  if(error)return toast(error.message);
  toast('Asignación lanzada a '+notifs.length+' técnico(s)');
}
async function autoPrevAssign(){
  if(!PROG_STATE)return;
  // Primero las instancias por lugar que vencen (plan anual), luego el catálogo suelto
  // Prioridad de abordaje por score de urgencia (crítico + atraso)
  const duePlan=(PROG_STATE.prevPlan||[]).slice().sort((a,b)=>planUrg(b)-planUrg(a));
  const dueCat=PROG_STATE.prevCat.slice();
  let pi=0,ci=0; const inserts=[]; const planUsed=[];
  for(const t of PROG_STATE.board){ const need=puestoCap(PROG_STATE.PUESTOS[t.id]).minPrev*60;
    let cur=PROG_STATE.enSemana.filter(r=>r.asignado_a===t.id&&r.clasificacion==='preventivo').reduce((s,r)=>s+(r.minutos_estimados||0),0);
    while(cur<need && pi<duePlan.length){ const p=duePlan[pi++]; const min=p.minutos_estimados||30; const nom=planNom(p); const lug=p.ubic?p.ubic.nombre:'';
      inserts.push({property_id:PROP.id,origen:'preventivo_programado',preventivo_catalogo_id:p.catalogo_id,clasificacion:'preventivo',ubicacion_id:p.ubicacion_id,oficio:p.oficio||null,titulo:(nom+' · '+lug).slice(0,80),descripcion:nom+' en '+lug,minutos_estimados:min,asignado_a:t.id,asignado_nombre:tecName(t.id),semana_programada:PROG_WK,estado:'programado',eloy_completo:true,metadata:{prev_plan_id:p.id}});
      planUsed.push(p.id); cur+=min; }
    while(cur<need && ci<dueCat.length){ const r=dueCat[ci++]; const min=r.minutos_estimados||estimMin(r).min;
      inserts.push({property_id:PROP.id,origen:'preventivo_programado',preventivo_catalogo_id:r.id,clasificacion:'preventivo',ubicacion_id:r.ubicacion_id,equipo_id:r.equipo_id,oficio:r.oficio||null,titulo:(r.tarea||'Preventivo').slice(0,80),descripcion:r.tarea,minutos_estimados:min,asignado_a:t.id,asignado_nombre:tecName(t.id),semana_programada:PROG_WK,estado:'programado',eloy_completo:true});
      cur+=min; }
  }
  if(!inserts.length)return toast('No hay preventivos pendientes por preasignar');
  const {data:ins,error}=await sb.from('mtto_tickets').insert(inserts).select('id,metadata');
  if(error)return toast(error.message);
  // marca las instancias del plan como programadas con su ticket
  for(const row of (ins||[])){ const pid=row.metadata&&row.metadata.prev_plan_id; if(pid) await sb.from('mtto_preventivo_plan').update({estado:'programado',ticket_id:row.id}).eq('id',pid); }
  toast(inserts.length+' preventivos preasignados · ajústalos a gusto'); renderProg();
}

async function cfgAreas(){
  const [{data:ubis},{data:cats}]=await Promise.all([
    sb.from('mtto_ubicaciones').select('id,nombre,tipo,activo,orden').eq('property_id',PROP.id).order('orden'),
    sb.from('mtto_preventivos_catalogo').select('id,tarea,ubicacion_id,alcance,oficio').eq('property_id',PROP.id).eq('activo',true)
  ]);
  const areas=(ubis||[]).filter(u=>u.tipo!=='habitacion');

function techProdCard(t,tks,pu,wk){
  const cap=puestoCap(pu); const capMin=cap.prog*60||1;
  const mine=tks.filter(r=>r.asignado_a===t.id&&r.semana_programada&&mondayOf(r.semana_programada)===wk);
  const prog=mine.reduce((s,r)=>s+(r.minutos_estimados||0),0);
  const done=mine.filter(DONEP);
  const hecho=done.reduce((s,r)=>s+(r.minutos_reales||r.minutos_estimados||0),0);
  const prevMin=mine.filter(r=>r.clasificacion==="preventivo").reduce((s,r)=>s+(r.minutos_estimados||0),0);
  const react=mine.filter(r=>r.clasificacion==="reactivo").length;
  const sumR=done.reduce((s,r)=>s+(r.minutos_reales||0),0), sumE=done.filter(r=>r.minutos_reales).reduce((s,r)=>s+(r.minutos_estimados||0),0);
  const ef=sumE?Math.round(sumR/sumE*100):null;
  const efCol=ef==null?"var(--muted)":(ef<=100?"var(--ok)":(ef<=120?"var(--warn)":"var(--bad)"));
  const pct=prog?Math.min(100,Math.round(hecho/prog*100)):0;
  const cls=pct>=100?"full":(pct>=60?"":"warn");
  const capPct=Math.min(100,Math.round(prog/capMin*100));
  return `<div class="card"><div class="pad">
    <div style="display:flex;align-items:center;gap:8px"><b>${esc(t.nombre_display||t.nombre)}</b><span class="ef" style="margin-left:auto;color:${efCol}">${ef==null?'—':ef+'%'} ef.</span></div>
    <div class="prodrow"><span class="muted">Avance de la semana</span><span><b>${(hecho/60).toFixed(1)}h</b> / ${(prog/60).toFixed(1)}h programado</span></div>
    <div class="hpila ${cls}"><i style="width:${pct}%"></i></div>
    <div class="prodrow"><span class="muted">Carga vs capacidad (${cap.prog.toFixed(1)}h)</span><span>${capPct}%</span></div>
    <div class="prodrow"><span>🛠️ Preventivos ${(prevMin/60).toFixed(1)}h / ${cap.minPrev}h</span><span>${prevMin>=cap.minPrev*60?'<span style="color:var(--ok)">✓</span>':'<b style="color:var(--bad)">∗ bajo</b>'}</span></div>
    <div class="prodrow"><span>⚡ Reactivos atendidos</span><span>${done.filter(r=>r.clasificacion==='reactivo').length} / ${react}</span></div>
    <div class="prodrow"><span>✅ Terminados</span><span>${done.length} / ${mine.length}</span></div>
  </div></div>`;
}

  const ins=ids.map(id=>{const r=map[id];return {property_id:PROP.id,origen:"preventivo_programado",preventivo_catalogo_id:id,
    clasificacion:"preventivo",ubicacion_id:r.ub,equipo_id:r.eq,titulo:(r.tarea||"Preventivo").slice(0,80),descripcion:r.tarea,
    minutos_estimados:r.min,asignado_a:tec,asignado_nombre:tec?tecName(tec):null,semana_programada:wk,estado:tec?"programado":"validado",eloy_completo:true};});
  const {error}=await sb.from("mtto_tickets").insert(ins);
  if(error)return toast(error.message);closeModal();toast(ins.length+" preventivos programados");renderProg();}

/* ANUAL EXTERNO */
let PROV={};
async function renderAnual(){
  const [{data,error},{data:provs}]=await Promise.all([
    sb.from("mtto_anual_externo").select("*").eq("property_id",PROP.id).order("critico",{ascending:false}),
    sb.from("mtto_proveedores").select("*").eq("property_id",PROP.id)
  ]);
  if(error)throw error; const rows=data||[];
  PROV={}; (provs||[]).forEach(p=>PROV[p.id]=p);
  const cm=new Date().getMonth()+1;
  const head=`<div class="calh">${MESES.map(m=>`<span>${m}</span>`).join("")}</div>`;
  const cal=r=>{const ms=mesesDe(r); const done=r.estado==="realizado"; const rm=r.fecha_realizada?new Date(r.fecha_realizada).getMonth()+1:null;
    return `<div class="caly">${Array.from({length:12},(_,i)=>{const m=i+1; if(!ms.includes(m))return `<div class="mc"></div>`;
      let c="due",t=""; if(done&&(rm?m<=rm:true)){c="done";t="✓";} else if(m<cm){c="late";t="!";} else if(m===cm){c="due";t="•";}
      return `<div class="mc ${c}" title="${MESES[i]}">${t}</div>`;}).join("")}</div>`;};
  const prov=r=>{const p=r.proveedor_id?PROV[r.proveedor_id]:null;
    return `<details class="reco"><summary>Proveedor / contrato ${p?"· "+esc(p.nombre):""}</summary><div class="txt">${p?
      `${p.contacto_nombre?"<b>Contacto:</b> "+esc(p.contacto_nombre)+"<br>":""}${p.telefono?"<b>Tel:</b> "+esc(p.telefono)+"  ":""}${p.email?"<b>Correo:</b> "+esc(p.email)+"<br>":""}${p.contrato?"<b>Contrato:</b> "+esc(p.contrato)+"<br>":""}${p.contrato_vigencia?"<b>Vigencia:</b> "+esc(p.contrato_vigencia)+"<br>":""}${p.presupuesto!=null?"<b>Presupuesto:</b> "+money(p.presupuesto)+"<br>":""}${p.notas?esc(p.notas)+"<br>":""}`
      :"Sin proveedor asignado."}<div style="margin-top:8px"><button class="btn ghost sm" onclick="editProv('${r.id}','${r.proveedor_id||""}')">${p?"Editar proveedor":"＋ Datos del proveedor"}</button></div></div></details>`;};
  $("#view").innerHTML=`<div class="card"><div class="pad" style="color:var(--muted);font-size:13px">Calendario anual estimado por periodicidad. <span style="color:var(--ok)">Verde = hecho</span>, <span style="color:var(--bad)">rojo = debió hacerse</span>, <span style="color:var(--warn)">ámbar = por hacer</span>.</div></div>`+
    (rows.length?rows.map(r=>`<div class="card"><div class="pad">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><b>${esc(r.tarea)}</b>${r.critico?' <span class="chip c-react">crítico</span>':''}
        <span class="st">${esc(r.periodicidad||"—")}</span><span class="muted" style="margin-left:auto;font-size:13px">${money(r.costo)}</span></div>
      ${head}${cal(r)}
      <div style="display:flex;align-items:center;gap:10px;margin-top:8px">
        <select onchange="setAnual('${r.id}',this.value)" style="width:auto">${["pendiente","agendado","realizado","vencido"].map(s=>`<option ${r.estado===s?"selected":""}>${s}</option>`).join("")}</select>
        ${r.fecha_realizada?`<span class="muted" style="font-size:12px">último: ${r.fecha_realizada}</span>`:""}
      </div>
      ${prov(r)}
    </div></div>`).join(""):'<div class="center">Sin registros</div>');
}
async function setAnual(id,estado){const p={estado};if(estado==="realizado")p.fecha_realizada=hoyMX();
  const {error}=await sb.from("mtto_anual_externo").update(p).eq("id",id);if(error)return toast(error.message);toast("Actualizado");renderAnual();}
function editProv(anualId,provId){const p=provId?PROV[provId]:{};
  modal(`<h3>Datos del proveedor</h3><div class="pad"><div class="form-grid">
    <div class="full"><label>Nombre / empresa</label><input id="vN" value="${esc(p.nombre||"")}"></div>
    <div><label>Contacto</label><input id="vC" value="${esc(p.contacto_nombre||"")}"></div>
    <div><label>Teléfono</label><input id="vT" value="${esc(p.telefono||"")}"></div>
    <div><label>Correo</label><input id="vE" value="${esc(p.email||"")}"></div>
    <div><label>Presupuesto (anual)</label><input id="vP" type="number" value="${p.presupuesto??""}"></div>
    <div class="full"><label>Contrato</label><input id="vK" value="${esc(p.contrato||"")}" placeholder="No. de contrato / alcance"></div>
    <div><label>Vigencia</label><input id="vV" value="${esc(p.contrato_vigencia||"")}" placeholder="ej. ene-dic 2026"></div>
    <div class="full"><label>Notas</label><textarea id="vNo" rows="2">${esc(p.notas||"")}</textarea></div>
  </div></div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button>
    <button class="btn sm" onclick='saveProv("${anualId}","${provId}")'>Guardar</button></div>`);
}
async function saveProv(anualId,provId){
  const rec={property_id:PROP.id,nombre:$("#vN").value.trim(),contacto_nombre:$("#vC").value.trim()||null,telefono:$("#vT").value.trim()||null,
    email:$("#vE").value.trim()||null,presupuesto:parseFloat($("#vP").value)||null,contrato:$("#vK").value.trim()||null,
    contrato_vigencia:$("#vV").value.trim()||null,notas:$("#vNo").value.trim()||null};
  if(!rec.nombre)return toast("Falta el nombre del proveedor");
  let pid=provId;
  if(pid){const {error}=await sb.from("mtto_proveedores").update(rec).eq("id",pid);if(error)return toast(error.message);}
  else{const {data,error}=await sb.from("mtto_proveedores").insert(rec).select("id").single();if(error)return toast(error.message);pid=data.id;}
  await sb.from("mtto_anual_externo").update({proveedor_id:pid}).eq("id",anualId);
  closeModal();toast("Proveedor guardado");renderAnual();
}

/* LECTURAS */
let CC=null;
async function renderLect(){
  const win=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
  const win60=new Date(Date.now()-70*864e5).toISOString().slice(0,10);
  const [{data},{data:cc},{data:recs},{data:occ}]=await Promise.all([
    sb.from("mtto_lecturas").select("*").eq("property_id",PROP.id).order("fecha",{ascending:false}).limit(60),
    sb.from("mtto_consumo_config").select("*").eq("property_id",PROP.id).maybeSingle(),
    sb.from("mtto_gas_recargas").select("*").eq("property_id",PROP.id).order("fecha",{ascending:false}).limit(24),
    sb.from("hk_ocupacion_hist").select("fecha,camas_ocupadas,privadas_ocupadas").eq("property_id",PROP.id).gte("fecha",win60)
  ]);
  const rows=data||[]; const today=hoyMX();
  CC=cc||{gas_tanque_litros:1600,agua_factor_litros:1000,luz_factor_kwh:1,privada_pax:2,obj_agua:[170,170,220,220,220,190,190,190,190,175,170,170],obj_luz:[6,6,6.5,7,7,7,6.5,6.5,6.5,6,6,6],obj_gas:[3.5,3.5,2.8,2.5,2.5,2.6,2.8,2.8,2.8,3,3.5,3.7]};
  const ppax=Number(CC.privada_pax??2);
  // huéspedes por NOCHE (ocupación real; cubre días sin lectura, p.ej. el descanso de Manuel)
  const gmap={}; (occ||[]).forEach(o=>{gmap[String(o.fecha)]=Number(o.camas_ocupadas||0)+Number(o.privadas_ocupadas||0)*ppax;});
  const lecByDate={}; rows.forEach(r=>{lecByDate[String(r.fecha)]=r;});
  const dISO=(iso,n)=>{const d=new Date(iso+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);};
  const diffDays=(a,b)=>Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5);
  const guestNights=(fromExcl,toIncl)=>{let s=0,any=false,d=dISO(fromExcl,1),guard=0;while(d<=toIncl&&guard++<400){let g=gmap[d];if(g==null){const lr=lecByDate[d];g=lr&&lr.huespedes!=null?Number(lr.huespedes):null;}if(g!=null){s+=g;any=true;}d=dISO(d,1);}return any?s:null;};
  // consumo por huésped-noche: delta entre lecturas / huésped-noches del periodo cubierto (aunque sean 2+ días)
  const asc=[...rows].sort((a,b)=>a.fecha<b.fecha?-1:1), cons=[];
  for(let i=1;i<asc.length;i++){const p=asc[i-1],c=asc[i];const mes=parseInt(c.fecha.slice(5,7))-1;
    const dias=Math.max(1,diffDays(p.fecha,c.fecha)); const gn=guestNights(p.fecha,c.fecha);
    const aguaC=(c.agua_lectura!=null&&p.agua_lectura!=null&&c.agua_lectura>=p.agua_lectura)?(c.agua_lectura-p.agua_lectura)*Number(CC.agua_factor_litros):null;
    const luzC=(c.luz_lectura!=null&&p.luz_lectura!=null&&c.luz_lectura>=p.luz_lectura)?(c.luz_lectura-p.luz_lectura)*Number(CC.luz_factor_kwh):null;
    cons.push({fecha:c.fecha,gn,dias,mes,aguaH:(gn&&aguaC!=null)?aguaC/gn:null,luzH:(gn&&luzC!=null)?luzC/gn:null});}
  cons.reverse();
  // ---- gas por costo (recargas + huésped-noches últimos 30 días) ----
  let hn30=(occ||[]).filter(o=>String(o.fecha)>=win).reduce((s,o)=>s+Number(o.camas_ocupadas||0)+Number(o.privadas_ocupadas||0)*ppax,0);
  if(!hn30) hn30=asc.filter(r=>r.fecha>=win).reduce((s,r)=>s+(Number(r.huespedes)||0),0);
  const recArr=recs||[];
  const rec30=recArr.filter(r=>r.fecha>=win);
  const gMon30=rec30.reduce((s,r)=>s+(Number(r.monto)||0),0);
  const gLit30=rec30.reduce((s,r)=>s+(Number(r.litros)||0),0);
  const gasCostoH = hn30>0 && gMon30>0 ? gMon30/hn30 : null;
  const gasLitH   = hn30>0 && gLit30>0 ? gLit30/hn30 : null;
  const precioProm= gLit30>0 ? gMon30/gLit30 : (recArr.find(r=>r.precio_litro)?.precio_litro||null);
  const oa=CC.obj_agua,ol=CC.obj_luz,og=CC.obj_gas;
  const cell=(v,obj,dec)=>{if(v==null)return '<td class="num muted">—</td>';const r=v/obj;const cls=r<=1?'c-prev':(r<=1.25?'c-correc':'c-react');
    return `<td class="num"><span class="chip ${cls}">${v.toFixed(dec)}</span> <span class="muted" style="font-size:11px">/${obj}</span></td>`;};
  const last=cons.find(x=>x.aguaH!=null||x.luzH!=null||x.gasH!=null);
  const m=new Date().getMonth();
  const kpi=(lbl,v,obj,unit,dec)=>{const val=v==null?"—":v.toFixed(dec);const r=v==null?null:v/obj;const col=r==null?"var(--muted)":(r<=1?"var(--ok)":(r<=1.25?"var(--warn)":"var(--bad)"));
    return `<div class="kpi"><div class="n" style="color:${col}">${val}<span style="font-size:13px;color:var(--muted)"> ${unit}</span></div><div class="l">${lbl} · objetivo ${obj} ${unit}</div></div>`;};
  $("#view").innerHTML=`
    <div class="card"><h3>Consumo por huésped / noche <span class="muted" style="font-weight:500;font-size:12px">· vs objetivo de industria por temporada</span>
      <button class="btn ghost sm" style="float:right;margin-top:-2px" onclick="editConsumo()">⚙︎ Ajustar objetivos</button>
      <button class="btn ghost sm" style="float:right;margin:-2px 6px 0 0" onclick="traerHuespedes()">👥 Traer huéspedes de Cloudbeds</button></h3>
      <div class="pad">
        ${last?`<div class="kpis" style="margin-bottom:6px">
          ${kpi('💧 Agua ('+last.fecha+')',last.aguaH,oa[m],'L',0)}
          ${kpi('⚡ Luz ('+last.fecha+')',last.luzH,ol[m],'kWh',1)}
        </div>`:'<p class="muted" style="margin:0">Aún no hay dos días con lecturas y número de huéspedes para calcular el consumo. Captura las lecturas y el número de huéspedes por día.</p>'}
        <div class="scroll"><table><thead><tr><th>Fecha</th><th class="num">Huésp-noches</th><th class="num">Agua L/h</th><th class="num">Luz kWh/h</th></tr></thead>
        <tbody>${cons.length?cons.slice(0,21).map(c=>`<tr><td>${c.fecha}${c.dias>1?` <span class="muted" style="font-size:11px">(${c.dias} días)</span>`:''}</td><td class="num">${c.gn??'<span class=muted>falta</span>'}</td>${cell(c.aguaH,oa[c.mes],0)}${cell(c.luzH,ol[c.mes],1)}</tr>`).join(""):'<tr><td colspan="4" class="center">Sin datos suficientes</td></tr>'}</tbody></table></div>
        <p class="muted" style="font-size:11.5px;margin:10px 0 0">Verde ≤ objetivo · ámbar hasta +25% · rojo arriba. El consumo de cada lectura se divide entre los huésped-noches que cubre, así que si pasan 2 días (p.ej. el descanso de Manuel) se reparte solo. Agua en litros (medidor ×${CC.agua_factor_litros}). El gas se mide por costo (abajo). Ajusta con ⚙︎.</p>
      </div></div>
    <div class="card"><h3>🔥 Gas por costo <span class="muted" style="font-weight:500;font-size:12px">· recargas de pipa, últimos 30 días</span></h3>
      <div class="pad">
        <div class="kpis" style="margin-bottom:6px">
          <div class="kpi"><div class="n">${gasCostoH!=null?money(Math.round(gasCostoH)):'—'}</div><div class="l">$ de gas por huésped-noche</div></div>
          <div class="kpi"><div class="n">${gasLitH!=null?gasLitH.toFixed(2)+'<span style="font-size:13px;color:var(--muted)"> L</span>':'—'}</div><div class="l">Litros por huésped-noche</div></div>
          <div class="kpi"><div class="n">${precioProm!=null?money(precioProm.toFixed(2)):'—'}<span style="font-size:13px;color:var(--muted)">/L</span></div><div class="l">Precio por litro</div></div>
        </div>
        <p class="muted" style="font-size:12px;margin:0 0 8px">Base 30 días: ${hn30} huésped-noches · ${money(gMon30)} en recargas · ${gLit30} L.</p>
        <div class="scroll"><table><thead><tr><th>Fecha</th><th class="num">Litros</th><th class="num">Monto</th><th class="num">$/L</th><th>Ticket</th></tr></thead>
        <tbody>${recArr.length?recArr.map(r=>`<tr><td>${r.fecha}</td><td class="num">${r.litros??'—'}</td><td class="num">${money(r.monto)}</td><td class="num">${r.precio_litro!=null?money(r.precio_litro):'—'}</td><td>${r.foto_url?`<a class="lnk" href="${esc(r.foto_url)}" target="_blank">ver</a>`:'—'}</td></tr>`).join(""):'<tr><td colspan="5" class="center">Sin recargas registradas todavía</td></tr>'}</tbody></table></div>
        <p class="muted" style="font-size:11.5px;margin:10px 0 0">Manuel sube la foto del ticket cuando llega la pipa (en 📷 Capturar) y Eloy lee litros y monto. El % del tanque solo dispara el aviso de "hay que llenar".</p>
      </div></div>
    <div class="card"><h3>Captura por foto (Eloy)</h3><div class="pad"><p style="margin:0 0 10px;color:var(--muted);font-size:.9rem">Manuel/Juan toman la foto de los medidores y Eloy los lee: agua y luz solo suben, el gas puede bajar y avisa si baja del umbral.</p><a class="btn sm" href="/m/lecturas.html">📷 Capturar lecturas con foto</a></div></div>
    <div class="card"><h3>Registrar lectura del día (manual)</h3><div class="pad"><div class="form-grid">
      <div><label>Fecha</label><input id="lF" type="date" value="${today}"></div><div><label>Huéspedes (noche)</label><input id="lH" type="number" min="0"></div>
      <div><label>Agua (lectura)</label><input id="lA" type="number" step="0.01"></div><div><label>Luz kWh</label><input id="lL" type="number" step="0.01"></div>
      <div><label>Gas %</label><input id="lG" type="number" step="0.1"></div><div><label>Foto (URL)</label><input id="lFoto"></div>
      <div class="full"><button class="btn sm" onclick="saveLect()">Guardar lectura</button></div>
    </div></div></div>
    <div class="card"><h3>Últimas lecturas</h3><div class="scroll"><table><thead><tr><th>Fecha</th><th class="num">Agua</th><th class="num">Luz kWh</th><th class="num">Gas %</th><th class="num">Huésp.</th></tr></thead>
    <tbody>${rows.length?rows.map(r=>`<tr><td>${r.fecha}</td><td class="num">${r.agua_lectura??"—"}</td><td class="num">${r.luz_lectura??"—"}</td><td class="num">${r.gas_pct??"—"}</td><td class="num">${r.huespedes??"—"}</td></tr>`).join(""):'<tr><td colspan="5" class="center">Sin lecturas</td></tr>'}</tbody></table></div></div>`;
}
function editConsumo(){const m=new Date().getMonth();const mn=["Ene","Feb","Mar","Abr","May","Jun","Jul","Ago","Sep","Oct","Nov","Dic"][m];
  modal(`<h3>Ajustar consumo · objetivos</h3><div class="pad"><div class="form-grid">
    <div><label>Tanque de gas (litros)</label><input id="cGT" type="number" value="${CC.gas_tanque_litros}"></div>
    <div><label>Litros por unidad de agua</label><input id="cAF" type="number" value="${CC.agua_factor_litros}"></div>
    <div><label>kWh por unidad de luz</label><input id="cLF" type="number" step="0.01" value="${CC.luz_factor_kwh}"></div>
    <div><label>Huéspedes por privada</label><input id="cPP" type="number" step="0.1" value="${CC.privada_pax??2}"></div>
    <div class="full"><label style="color:var(--ink)">Objetivos por huésped/noche para ${mn}</label></div>
    <div><label>💧 Agua (L)</label><input id="cOA" type="number" value="${CC.obj_agua[m]}"></div>
    <div><label>⚡ Luz (kWh)</label><input id="cOL" type="number" step="0.1" value="${CC.obj_luz[m]}"></div>
    <div><label>🔥 Gas (L)</label><input id="cOG" type="number" step="0.1" value="${CC.obj_gas[m]}"></div>
  </div><p class="muted" style="font-size:12px;margin-top:10px">Los objetivos se guardan por mes (temporada). Aquí editas los de ${mn}; puedes ajustar cada mes cuando toque.</p>
  </div><div class="foot"><button class="btn ghost sm" onclick="closeModal()">Cancelar</button><button class="btn sm" onclick="saveConsumo(${m})">Guardar</button></div>`);
}
async function saveConsumo(m){
  const oa=[...CC.obj_agua],ol=[...CC.obj_luz],og=[...CC.obj_gas];
  oa[m]=parseFloat($("#cOA").value)||oa[m]; ol[m]=parseFloat($("#cOL").value)||ol[m]; og[m]=parseFloat($("#cOG").value)||og[m];
  const {error}=await sb.from("mtto_consumo_config").upsert({property_id:PROP.id,gas_tanque_litros:parseFloat($("#cGT").value)||1600,
    agua_factor_litros:parseFloat($("#cAF").value)||1000,luz_factor_kwh:parseFloat($("#cLF").value)||1,privada_pax:parseFloat($("#cPP").value)||2,obj_agua:oa,obj_luz:ol,obj_gas:og,updated_at:new Date().toISOString()},{onConflict:"property_id"});
  if(error)return toast(error.message);closeModal();toast("Objetivos actualizados");renderLect();
}
async function traerHuespedes(){
  toast("Consultando Cloudbeds…");
  const {data,error}=await sb.functions.invoke('mtto-huespedes',{body:{property_id:PROP.id,dias:30}});
  if(error)return toast(error.message);
  if(data&&data.no_conectado)return toast(PROP.n+" no está en Cloudbeds");
  toast((data?.actualizados?.length||0)+" días actualizados con huéspedes");renderLect();
}
async function saveLect(){
  const {error}=await sb.from("mtto_lecturas").upsert({property_id:PROP.id,fecha:$("#lF").value,huespedes:parseInt($("#lH").value)||null,agua_lectura:parseFloat($("#lA").value)||null,luz_lectura:parseFloat($("#lL").value)||null,gas_pct:parseFloat($("#lG").value)||null,foto_url:$("#lFoto").value.trim()||null,subido_por:USER.id,subido_por_nombre:USER.email},{onConflict:"property_id,fecha"});
  if(error)return toast(error.message);toast("Lectura guardada");renderLect();}

/* REPORTE */
async function renderRep(){
  const wk=mondayOf(new Date());
  const {data}=await sb.from("mtto_tickets").select("clasificacion,minutos_reales,resuelto_at").eq("property_id",PROP.id);
  const rows=(data||[]).filter(t=>t.minutos_reales&&t.resuelto_at&&mondayOf(t.resuelto_at)===wk);
  const sum=c=>rows.filter(r=>r.clasificacion===c).reduce((s,r)=>s+r.minutos_reales,0)/60;
  const hc=sum("correctivo"),hp=sum("preventivo"),hr=sum("reactivo");
  $("#view").innerHTML=`<div class="card"><h3>Reporte de horas · semana del ${wk}</h3><div class="scroll"><table>
    <thead><tr><th>Concepto</th><th class="num">Horas realizadas</th></tr></thead><tbody>
    <tr><td>${clsChip("reactivo")}</td><td class="num">${hr.toFixed(1)}</td></tr>
    <tr><td>${clsChip("correctivo")}</td><td class="num">${hc.toFixed(1)}</td></tr>
    <tr><td>${clsChip("preventivo")}</td><td class="num">${hp.toFixed(1)}</td></tr>
    <tr><td><b>Total</b></td><td class="num"><b>${(hc+hp+hr).toFixed(1)}</b></td></tr></tbody></table></div></div>
    <p class="muted" style="font-size:13px">Minutos reales (Iniciar → foto resuelto) de los tickets cerrados esta semana.</p>`;
}

sb.auth.getSession().then(({data})=>{if(data.session)boot(); else {$("#login").style.display="grid";}});
