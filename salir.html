<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Cerrando sesión · Casa Pepe</title>
<style>
  :root{--crema:#FBF7F2;--tinta:#1E1A16;--verde:#137A56;--gris:#8e8c85}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--crema);color:var(--tinta);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .card{max-width:420px}
  .sp{width:46px;height:46px;border:4px solid #e6ddd0;border-top-color:var(--verde);border-radius:50%;margin:0 auto 20px;animation:g 0.9s linear infinite}
  @keyframes g{to{transform:rotate(360deg)}}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:15px;color:#5c5349;line-height:1.5;margin:0 0 18px}
  a.btn{display:inline-block;background:var(--verde);color:#fff;text-decoration:none;font-weight:700;
        padding:13px 22px;border-radius:12px;font-size:16px}
</style>
</head>
<body>
  <div class="card">
    <div class="sp" id="sp"></div>
    <h1 id="t">Limpiando tu sesión…</h1>
    <p id="s">Quitamos la sesión que quedó guardada en este teléfono. En un momento te llevamos al inicio de Casa Pepe para que entres con tu cuenta.</p>
    <a class="btn" href="/" id="ir" style="display:none">Ir a Casa Pepe</a>
  </div>
<script>
(function(){
  // Borra SOLO las llaves de sesión (de Supabase y las de los portales de
  // operador/Sincrético). No toca cookies ni otras preferencias, para no borrar,
  // por ejemplo, la llave de la tablet de recepción si esto se abriera ahí.
  try{
    for(var i=localStorage.length-1;i>=0;i--){
      var k=localStorage.key(i);
      if(!k) continue;
      if(/sb-.*-auth-token/.test(k) || /op_sesion/i.test(k) || /sinc_/i.test(k)){
        try{ localStorage.removeItem(k); }catch(_){}
      }
    }
  }catch(_){}
  try{ sessionStorage.clear(); }catch(_){}
  // Deja listo el botón manual por si el navegador bloquea la redirección.
  setTimeout(function(){
    try{ document.getElementById('sp').style.display='none'; }catch(_){}
    try{ document.getElementById('t').textContent='Listo'; }catch(_){}
    try{ document.getElementById('s').textContent='Ya limpiamos la sesión. Entra con tu correo y contraseña de Casa Pepe.'; }catch(_){}
    try{ document.getElementById('ir').style.display='inline-block'; }catch(_){}
  }, 1000);
  setTimeout(function(){ try{ location.replace('/'); }catch(_){ location.href='/'; } }, 1300);
})();
</script>
</body>
</html>
