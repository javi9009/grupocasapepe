<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --c1:#08402F; --c2:#0D6047; --c3:#13805B; --c4:#2D9C74; --c5:#63B894;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
header.top{padding:22px 0 14px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.badge{display:inline-block;background:var(--accent-soft);color:var(--ok);border:1px solid var(--ok);
  border-radius:999px;padding:2px 9px;font-size:.7rem;font-weight:600;vertical-align:middle;margin-left:8px}
.badge.off{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
select{font:inherit;padding:8px 11px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--surface);color:var(--ink);min-width:230px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
  padding:18px;margin:0 0 16px}
.card h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.persona h3{margin:0;font-size:1.3rem}
.persona .sub{color:var(--muted);font-size:.88rem;margin-top:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;
  border-bottom:1px solid var(--rule)}
.dato:last-child{border-bottom:0}
.dato .k{color:var(--muted)} .dato .v{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px;margin:10px 0 4px}
.bar i{display:block;height:100%}
.bar i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.leyenda{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:.73rem;color:var(--muted)}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.leyenda i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.7rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.neutro{background:var(--surface-2);color:var(--muted);border-color:var(--rule-2)}
.mods{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mod{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.85rem;
  background:var(--surface-3);border:1px solid var(--rule);border-radius:6px;padding:7px 12px}
.mod .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.mov{font-size:.84rem;padding:7px 0;border-bottom:1px solid var(--rule);display:flex;gap:10px}
.mov:last-child{border-bottom:0}
.mov .f{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.vacia{color:var(--faint);font-size:.85rem}
footer.pie{padding:24px 0 44px;color:var(--faint);font-size:.78rem;line-height:1.6}
code.k{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:.8rem}
</style>
</head>

let F=SNAP.fichas.slice();
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha=d=>d?new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}):"—";
const CRIT=[["puntualidad","Puntualidad","var(--c1)"],["actitud","Actitud","var(--c2)"],
  ["desempeno","Desempeño","var(--c3)"],["conocimiento","Conocimiento","var(--c4)"],
  ["discurso","Discurso","var(--c5)"]];
const TRAMO={practicas:"prácticas",junior:"junior",junior2:"junior 2",senior:"senior"};

function selPersonas(){
  $("#sel").innerHTML='<option value="">— elige un colaborador —</option>'
    +F.sort((a,b)=>a.nombre.localeCompare(b.nombre))
      .map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("");
  $("#sel").onchange=pinta;
}

function pinta(){
  const p=F.find(x=>x.id===$("#sel").value);
  if(!p){$("#ficha").innerHTML="";return}
  const cr=p.criterios||{};
  let medidos=0, posibles=0;
  const segs=CRIT.map(([k,n,col])=>{
    const v=cr[k]&&cr[k].valor!==null&&cr[k].valor!==undefined?Number(cr[k].valor):null;
    if(v===null) return `<i class="nm" style="width:20%" title="${n}: sin medir"></i>`;
    medidos+=v; posibles+=20;
    const w=v/20*20, r=20-w;
    return `<i style="width:${w}%;background:${col}" title="${n}: ${v}/20"></i>`
      +(r>0.4?`<i style="width:${r}%;background:var(--surface-2)"></i>`:"");
  }).join("");
  const m=p.maestria, pr=p.prueba, b=p.bonos||[], mov=p.movimientos||[];
  const antig=p.inicio?Math.floor((Date.now()-new Date(p.inicio))/(86400000*30.44)):null;

  $("#ficha").innerHTML=`
  <div class="card persona">
    <h3>${esc(p.nombre)}</h3>
    <div class="sub">${esc(p.rol||"sin rol")} · ${esc(p.categoria_nombre||"sin categoría")}
      ${p.tramo?" · tramo "+TRAMO[p.tramo]:""} · ${esc(p.sede||"—")}
      · desde ${fecha(p.inicio)}${antig!==null?" ("+antig+" meses)":""}</div>
    <div class="sub">Jefe: <strong>${esc(p.jefe||"por definir")}</strong>
      ${p.jefe_funcional?" · Funcional: <strong>"+esc(p.jefe_funcional)+"</strong>":""}</div>
  </div>

  <div class="card">
    <h2>Los cinco criterios</h2>
    <div class="bar">${segs}</div>
    <div class="leyenda">${CRIT.map(([k,n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}
      <span><i class="nm"></i>sin medir</span>
      <span style="margin-left:auto"><strong>${medidos.toFixed(1)}</strong> de ${posibles} medibles</span></div>
  </div>

  <div class="grid">
    <div class="card">
      <h2>Crecimiento</h2>
      ${m?`<div class="dato"><span class="k">Maestría</span><span class="v"><strong>${esc(m.maestria)}</strong></span></div>
        <div class="dato"><span class="k">Avance</span><span class="v">${m.cerrados} de ${m.modulos} módulos
          ${m.cerrados>=m.modulos?'<span class="pill ok">lista para ascenso</span>':""}</span></div>
        <div class="dato"><span class="k">Destraba</span><span class="v">${esc(m.destraba||"—")}</span></div>
        <div class="mods">${(m.detalle||[]).map(d=>`<div class="mod"><span>${esc(d.categoria)}</span>
          <span class="num">${d.mejor??"—"}/${d.minimo}</span><span>${d.cerrado?"✅":"⬜"}</span></div>`).join("")}</div>`
        :'<p class="vacia">Sin maestría asignada — su rol o tramo no tienen ruta todavía.</p>'}
      ${mov.length?`<h2 style="margin-top:16px">Movimientos</h2>`+mov.map(x=>
        `<div class="mov"><span class="f">${fecha(x.fecha)}</span><span>${esc(x.tipo)}: ${esc(x.antes||"—")} → <strong>${esc(x.despues||"—")}</strong></span></div>`).join(""):""}
    </div>

    <div class="card">
      <h2>Situación</h2>
      ${pr?`<div class="dato"><span class="k">Periodo de prueba</span><span class="v">
          ${pr.dias_restantes>0?`vence en <strong>${pr.dias_restantes} días</strong>`:'concluido'}
          ${Number(pr.hitos_vencidos)?' <span class="pill bad">'+pr.hitos_vencidos+' hitos vencidos</span>':""}</span></div>`:""}
      ${p.contrato?`<div class="dato"><span class="k">Contrato</span><span class="v">
        ${esc(p.contrato.estatus||"—")} · ${p.contrato.numero||1} de ${p.contrato.de||"—"}
        ${p.contrato.fin?" · hasta "+fecha(p.contrato.fin):""}</span></div>`
        :'<div class="dato"><span class="k">Contrato</span><span class="v faint">sin registro</span></div>'}
      <div class="dato"><span class="k">Horas extra validadas (4 meses)</span>
        <span class="v">${Math.round((p.min_extra_4m||0)/60)} h</span></div>
      <div class="dato"><span class="k">Incidencias (4 meses)</span><span class="v">${p.incidencias_4m||0}</span></div>
      <div class="dato"><span class="k">Vacaciones</span><span class="v">
        ${p.vacaciones&&p.vacaciones.pendientes!==null?`${p.vacaciones.tomadas??0} tomadas · <strong>${p.vacaciones.pendientes??"—"} pendientes</strong>`:'<span class="faint">sin registro</span>'}</span></div>
      <div class="dato"><span class="k">Procedimientos firmados</span>
        <span class="v">${p.proc_firmados||0} de ${p.proc_por_firmar||0} que le tocan</span></div>
      ${b.length?`<h2 style="margin-top:16px">Bonos</h2>`+b.map(x=>
        `<div class="dato"><span class="k">${esc(x.nombre)}</span><span class="v">$${Number(x.monto||0).toLocaleString("es-MX")} · ${esc(x.estatus||"—")}</span></div>`).join("")
        :'<h2 style="margin-top:16px">Bonos</h2><p class="vacia">Sin bonos registrados.</p>'}
    </div>
  </div>`;
}

async function carga(){
  if(SB.key.startsWith("__")) return;
  try{
    const r=await fetch(SB.url+"/rh_ficha?select=*&order=nombre",
      {headers:{apikey:SB.key,Authorization:"Bearer "+SB.key}});
    const l=await r.json();
    if(Array.isArray(l)&&l.length){F=l;$("#fuente").textContent="en vivo";$("#fuente").className="badge";}
  }catch(e){}
}
(async function(){
  $("#fuente").textContent="snapshot";$("#fuente").className="badge off";
  await carga(); selPersonas();
})();
</script>
