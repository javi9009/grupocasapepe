<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ficha 360 · Grupo Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;
  --c1:#08402F; --c2:#0D6047; --c3:#13805B; --c4:#2D9C74; --c5:#63B894;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
.badge{display:inline-block;background:var(--accent-soft);color:var(--ok);border:1px solid var(--ok);
  border-radius:999px;padding:2px 9px;font-size:.7rem;font-weight:600;vertical-align:middle;margin-left:8px}
.badge.off{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
select{font:inherit;padding:8px 11px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--surface);color:var(--ink);min-width:230px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ava{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;flex:none}
.hero .hmain{flex:1;min-width:220px}
.hero h3{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.7rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.neutro{background:var(--surface-2);color:var(--muted);border-color:var(--rule-2)}

/* submenú arriba */
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin:0 -16px 16px;padding:0 16px}
.secnav-in{display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:11px 13px;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;font-size:.9rem}
.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
  padding:18px;margin:0 0 16px}
.card h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.dato{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;padding:6px 0;border-bottom:1px solid var(--rule)}
.dato:last-child{border-bottom:0}
.dato .k{color:var(--muted)} .dato .v{text-align:right;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:.72rem;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.bar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px;margin:10px 0 4px}
.bar i{display:block;height:100%}
.bar i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.leyenda{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:.73rem;color:var(--muted)}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.leyenda i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.vbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--rule);max-width:320px}
.vbar i{display:block;height:100%}
.docrow{display:flex;align-items:center;gap:10px;font-size:.87rem;padding:7px 0;border-bottom:1px solid var(--rule)}
.docrow:last-child{border-bottom:0}
.docrow .nm{flex:1}
.docrow .st.si{color:var(--ok);font-weight:600}.docrow .st.no{color:var(--warn)}
.docrow a{color:var(--accent);font-size:.8rem;cursor:pointer;text-decoration:underline}
.mods{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mod{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.85rem;
  background:var(--surface-3);border:1px solid var(--rule);border-radius:6px;padding:7px 12px}
.mod .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.mov{font-size:.84rem;padding:7px 0;border-bottom:1px solid var(--rule);display:flex;gap:10px}
.mov:last-child{border-bottom:0}
.mov .f{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.vacia{color:var(--faint);font-size:.85rem}
.aviso{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 13px;font-size:.84rem;margin-bottom:14px}
footer.pie{padding:20px 0 44px;color:var(--faint);font-size:.78rem;line-height:1.6}
code.k{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:.8rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Ficha 360 <span class="badge" id="fuente">cargando…</span></h1>
    <select id="sel"><option value="">— elige un colaborador —</option></select>
  </header>
  <div id="hero"></div>
  <nav class="secnav" id="nav" hidden><div class="secnav-in" id="tabs"></div></nav>
  <div id="pane"></div>
  <footer class="pie">
    La ficha reúne el expediente completo del colaborador: <code class="k">rh_ficha</code> (pila, maestría,
    prueba, bonos, contrato, movimientos) + <code class="k">employees</code> (documentación, datos personales
    y laborales). Los datos se editan en Expediente · ID maestro; aquí se leen.
  </footer>
</div>

<script>
const SBU="https://rehophywchakfapivsbh.supabase.co";
const SB=SBU+"/rest/v1";
const KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const H={apikey:KEY,Authorization:"Bearer "+KEY};
try{const _r=localStorage.getItem("sb-rehophywchakfapivsbh-auth-token");if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t)H.Authorization="Bearer "+_t;}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fecha=d=>d?new Date(String(d).slice(0,10)+"T12:00:00").toLocaleDateString("es-MX",{day:"numeric",month:"short",year:"numeric"}):"—";
const mxn=n=>n==null?"—":"$"+Number(n).toLocaleString("es-MX");
const CRIT=[["puntualidad","Puntualidad","var(--c1)"],["actitud","Actitud","var(--c2)"],
  ["desempeno","Desempeño","var(--c3)"],["conocimiento","Conocimiento","var(--c4)"],
  ["discurso","Discurso","var(--c5)"]];
const TRAMO={practicas:"prácticas",junior:"junior",junior2:"junior 2",senior:"senior"};
const TRAMOS=["practicas","junior","junior2","senior"];
const DOCS=[["contrato_url","Contrato"],["id_oficial_url","INE / identificación"],["foto_url","Foto"],
 ["acta_nacimiento_url","Acta de nacimiento"],["rfc_doc_url","Constancia RFC"],["nss_doc_url","Constancia NSS"],
 ["comprobante_domicilio_url","Comprobante de domicilio"],["comprobante_estudios_url","Comprobante de estudios"],
 ["imss_cedula_url","Cédula IMSS"],["cv_url","CV"]];
const SECS=[["resumen","Resumen"],["docs","Documentación"],["laboral","Datos laborales"],
 ["perfil","Perfil"],["criterios","Desempeño"],["situacion","Situación"],["crecimiento","Crecimiento"]];
let F=[],E={},RANGOS=[],cur=null,tab="resumen";

async function sb(p){const r=await fetch(SB+p,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
function dato(k,v,cls){return `<div class="dato"><span class="k">${k}</span><span class="v ${cls||""}">${v}</span></div>`;}
function edad(f){if(!f)return null;const d=new Date(f),h=new Date();let a=h.getFullYear()-d.getFullYear();if(h<new Date(h.getFullYear(),d.getMonth(),d.getDate()))a--;return a;}
function aniv(f){if(!f)return null;const d=new Date(f+"T00:00:00"),hoy=new Date();
 const ult=new Date(d);ult.setFullYear(hoy.getFullYear());if(ult>hoy)ult.setFullYear(ult.getFullYear()-1);
 const prox=new Date(ult);prox.setFullYear(prox.getFullYear()+1);
 return {prox,dias:Math.round((prox-hoy)/86400000)};}
function docCount(e){return e?DOCS.filter(d=>e[d[0]]).length:0;}
function rango(e){if(!e)return null;return RANGOS.find(x=>x.activo&&(x.rol===e.puesto||x.puesto===e.puesto)&&(!x.sede||x.sede===e.sede))||RANGOS.find(x=>x.activo&&(x.rol===e.puesto||x.puesto===e.puesto));}
async function verDoc(val){
 if(!val)return;
 if(/^https?:\/\//.test(val)){window.open(val,"_blank");return;}
 try{const r=await fetch(SBU+"/storage/v1/object/sign/empleados/"+val,{method:"POST",
   headers:{...H,"Content-Type":"application/json"},body:JSON.stringify({expiresIn:3600})});
  if(!r.ok)throw 0;const j=await r.json();window.open(SBU+"/storage/v1"+j.signedURL,"_blank");
 }catch(e){alert("No se pudo abrir el documento (¿tienes sesión?).");}}

/* ===== pila 5 criterios ===== */
function pilaHTML(p){
 const cr=p.criterios||{};let medidos=0,posibles=0;
 const segs=CRIT.map(([k,n,col])=>{
  const v=cr[k]&&cr[k].valor!=null?Number(cr[k].valor):null;
  if(v===null)return `<i class="nm" style="width:20%" title="${n}: sin medir"></i>`;
  medidos+=v;posibles+=20;const w=v/20*20,r=20-w;
  return `<i style="width:${w}%;background:${col}" title="${n}: ${v}/20"></i>`+(r>0.4?`<i style="width:${r}%;background:var(--surface-2)"></i>`:"");
 }).join("");
 return {html:`<div class="bar">${segs}</div>
  <div class="leyenda">${CRIT.map(([k,n,c])=>`<span><i style="background:${c}"></i>${n}</span>`).join("")}
   <span><i class="nm"></i>sin medir</span>
   <span style="margin-left:auto"><strong>${medidos.toFixed(1)}</strong> de ${posibles||"—"} medibles</span></div>`,medidos,posibles};
}
function vacBar(e){
 if(!e)return "";
 const anio=Number(e.vac_anio)||0,tom=Math.min(Number(e.vac_tomadas)||0,anio);
 if(!anio)return "";
 return `<div class="vbar" title="Tomadas ${e.vac_tomadas??0} de ${anio} del año"><i style="width:${Math.round(tom/anio*100)}%;background:var(--accent)"></i></div>`;
}

/* ===== secciones ===== */
function sResumen(p,e){
 const pila=pilaHTML(p);const dc=docCount(e);const an=e?aniv(e.fecha_inicio_labores):null;
 const m=p.maestria;
 return `<div class="stats">
   <div class="stat ${dc<10?"warn":""}"><b>${dc}/10</b><span>documentos del expediente</span></div>
   <div class="stat"><b>${p.vacaciones&&p.vacaciones.pendientes!=null?p.vacaciones.pendientes:"—"}</b><span>días de vacaciones pendientes</span></div>
   <div class="stat ${p.incidencias_4m>3?"warn":""}"><b>${p.incidencias_4m||0}</b><span>incidencias (4 meses)</span></div>
   <div class="stat"><b>${m?m.cerrados+"/"+m.modulos:"—"}</b><span>módulos de maestría</span></div>
   <div class="stat"><b>${an?an.dias+"d":"—"}</b><span>para su aniversario</span></div>
  </div>
  <div class="card"><h2>Los cinco criterios</h2>${pila.html}</div>`;
}
function sDocs(p,e){
 if(!e)return `<div class="aviso">La documentación vive en el expediente y necesita sesión para leerse.</div>`;
 const dc=docCount(e);
 return `<div class="card"><h2>Documentación · ${dc} de 10</h2>
  ${DOCS.map(d=>{const v=e[d[0]];return `<div class="docrow"><span class="nm">${d[1]}</span>
    <span class="st ${v?"si":"no"}">${v?"✓ en expediente":"falta"}</span>${v?`<a data-doc="${esc(e.id)}|${d[0]}">ver</a>`:""}</div>`;}).join("")}
  <p class="faint" style="font-size:.78rem;margin:10px 0 0">Los documentos se suben desde Expediente · ID maestro (botón del expediente).</p></div>
 <div class="card"><h2>Contrato y firmas</h2>
  ${p.contrato?dato("Contrato",esc(p.contrato.estatus||"—")+" · "+(p.contrato.numero||1)+" de "+(p.contrato.de||"—")+(p.contrato.fin?" · hasta "+fecha(p.contrato.fin):"")):dato("Contrato",'<span class="faint">sin registro</span>')}
  ${dato("Procedimientos firmados",(p.proc_firmados||0)+" de "+(p.proc_por_firmar||0)+" que le tocan",p.proc_firmados<p.proc_por_firmar?"":"")}
 </div>`;
}
function sLaboral(p,e){
 const g=rango(e);const an=e?aniv(e.fecha_inicio_labores):null;
 const antig=p.inicio?Math.floor((Date.now()-new Date(p.inicio))/(86400000*30.44)):null;
 const b=p.bonos||[];
 return `<div class="grid">
  <div class="card"><h2>Puesto y contrato</h2>
   ${dato("ID",esc(e&&e.empleado_id||"—"))}
   ${dato("Puesto",esc(p.rol||"sin rol"))}
   ${dato("Categoría",esc(p.categoria_nombre||"—")+(p.tipo_contrato?" · "+esc(p.tipo_contrato):""))}
   ${dato("Tramo",p.tramo?TRAMO[p.tramo]||esc(p.tramo):"—")}
   ${dato("Sede · área",esc([p.sede,p.area].filter(Boolean).join(" · ")||"—"))}
   ${dato("Entrada",fecha(p.inicio)+(antig!=null?" · "+antig+" meses":""))}
   ${dato("Prueba / planta",e&&e.prueba_planta?esc(e.prueba_planta):"—")}
   ${an?dato("Aniversario",fecha(an.prox)+" ("+an.dias+"d)",an.dias<=30?"":""):""}
  </div>
  <div class="card"><h2>Salario</h2>
   ${dato("Salario bruto",mxn(e&&e.salario_bruto))}
   ${g?dato("Banda del tabulador",mxn(g[p.tramo||"junior"])+" en su tramo"):""}
   ${dato("Último aumento",fecha(e&&(e.salario_desde||e.ultimo_aumento_fecha)))}
   ${dato("Horas extra validadas (4 m)",Math.round((p.min_extra_4m||0)/60)+" h")}
   <h2 style="margin-top:16px">Bonos</h2>
   ${b.length?b.map(x=>dato(esc(x.nombre),mxn(x.monto)+" · "+esc(x.estatus||"—"))).join(""):'<p class="vacia">Sin bonos registrados.</p>'}
  </div>
  <div class="card"><h2>Vacaciones</h2>
   ${dato("Del año",e&&e.vac_anio!=null?e.vac_anio+" días":"—")}
   ${dato("Acumuladas de años anteriores",e&&e.vac_anteriores!=null?e.vac_anteriores+" días":"—")}
   ${dato("Tomadas",p.vacaciones?p.vacaciones.tomadas??0:"—")}
   ${dato("Pendientes","<strong>"+(p.vacaciones&&p.vacaciones.pendientes!=null?p.vacaciones.pendientes:"—")+"</strong>")}
   ${vacBar(e)}
   <p class="faint" style="font-size:.78rem;margin:8px 0 0">La pila completa del equipo está en Horarios → Vacaciones.</p>
  </div>
 </div>`;
}
function sPerfil(p,e){
 if(!e)return `<div class="aviso">Los datos personales viven en el expediente y necesitan sesión para leerse.</div>`;
 return `<div class="grid">
  <div class="card"><h2>Identidad</h2>
   ${dato("Nombre",esc([e.nombre,e.apellido].filter(Boolean).join(" ")))}
   ${dato("Alias",esc(e.nombre_display||"—"))}
   ${dato("Nacimiento",fecha(e.fecha_nacimiento)+(edad(e.fecha_nacimiento)!=null?" · "+edad(e.fecha_nacimiento)+" años":""))}
   ${dato("Nacionalidad",esc(e.nacionalidad||"—"))}
   ${dato("Estado civil",esc(e.estado_civil||"—"))}
  </div>
  <div class="card"><h2>Fiscal y seguridad social</h2>
   ${dato("RFC",esc(e.rfc||"—"))}
   ${dato("CURP",esc(e.curp||"—"))}
   ${dato("NSS / IMSS",esc(e.nss||"—"))}
   ${dato("AFORE",esc(e.afore||"—"))}
  </div>
  <div class="card"><h2>Contacto</h2>
   ${dato("Teléfono",esc(e.telefono||"—"))}
   ${dato("Correo",esc(e.email||"—"))}
   ${dato("Domicilio",esc(e.direccion||"—"))}
   ${dato("Emergencia",esc(e.contacto_nombre||"—")+(e.contacto_cel?" · "+esc(e.contacto_cel):""))}
  </div>
 </div>`;
}
function sCriterios(p){
 const pila=pilaHTML(p);const pu=p.criterios&&p.criterios.puntualidad;const d=pu&&pu.detalle;
 return `<div class="card"><h2>Los cinco criterios · 20 puntos cada uno</h2>${pila.html}</div>
 <div class="grid">
  <div class="card"><h2>Puntualidad al detalle</h2>
   ${d?dato("Turnos con horario",d.con_turno??"—")+dato("A tiempo",d.a_tiempo??"—")+dato("Retardos",d.retardo??"—")+dato("Faltas",d.falta??"—")+dato("Checadas olvidadas (no cuentan)",(d.retardos_mayores_4h??0)+(d.olvidadas??0)):'<p class="vacia">Sin turnos suficientes para calificar.</p>'}
  </div>
  <div class="card"><h2>Señales del periodo</h2>
   ${dato("Incidencias (4 meses)",p.incidencias_4m||0)}
   ${dato("Horas extra validadas (4 m)",Math.round((p.min_extra_4m||0)/60)+" h")}
   <p class="faint" style="font-size:.78rem;margin:10px 0 0">Actitud, desempeño y conocimientos se llenan con el test cuatrimestral del jefe y los PepeQuiz — en cuanto haya datos, la pila los pinta sola.</p>
  </div>
 </div>`;
}
function sSituacion(p,e){
 const pr=p.prueba;
 return `<div class="grid">
  <div class="card"><h2>Situación</h2>
   ${dato("Estatus",e?`<span class="pill ${e.estatus==="activo"?"ok":"warn"}">${esc(e.estatus||"—")}</span>`:"—")}
   ${pr?dato("Periodo de prueba",pr.dias_restantes>0?`vence en <strong>${pr.dias_restantes} días</strong>`:"concluido")+(Number(pr.hitos_vencidos)?dato("Hitos de prueba",`<span class="pill bad">${pr.hitos_vencidos} vencidos</span>`):""):dato("Periodo de prueba",'<span class="faint">no está en prueba</span>')}
   ${p.contrato?dato("Contrato",esc(p.contrato.estatus||"—")+(p.contrato.fin?" · hasta "+fecha(p.contrato.fin):"")):""}
   ${dato("Incidencias (4 meses)",p.incidencias_4m||0)}
  </div>
  <div class="card"><h2>Sus jefes</h2>
   ${dato("Jefe jerárquico","<strong>"+esc(p.jefe||"por definir")+"</strong>")}
   ${dato("Jefe funcional",p.jefe_funcional?"<strong>"+esc(p.jefe_funcional)+"</strong>":'<span class="faint">no aplica</span>')}
   <p class="faint" style="font-size:.78rem;margin:10px 0 0">El jerárquico aprueba horario, vacaciones y renovación; el funcional dirige el trabajo técnico. Se mueven en el Organigrama.</p>
  </div>
 </div>`;
}
function sCrecimiento(p,e){
 const m=p.maestria,mov=p.movimientos||[];const g=rango(e);
 let sig="";
 if(g&&p.tramo){const i=TRAMOS.indexOf(p.tramo);if(i>-1&&i<TRAMOS.length-1){sig=dato("Siguiente tramo",TRAMO[TRAMOS[i+1]]+" · "+mxn(g[TRAMOS[i+1]]));}}
 return `<div class="grid">
  <div class="card"><h2>Potencial de crecimiento</h2>
   ${m?dato("Maestría","<strong>"+esc(m.maestria)+"</strong>")+dato("Avance",m.cerrados+" de "+m.modulos+" módulos"+(m.cerrados>=m.modulos?' <span class="pill ok">lista para ascenso</span>':""))+dato("Destraba",esc(m.destraba||"—"))+(m.requisito?dato("Requisito extra",esc(m.requisito)):"")+sig+`<div class="mods">${(m.detalle||[]).map(d=>`<div class="mod"><span>${esc(d.categoria)}</span><span class="num">${d.mejor??"—"}/${d.minimo}</span><span>${d.cerrado?"✅":"⬜"}</span></div>`).join("")}</div>`
    :'<p class="vacia">Sin maestría asignada — su rol o tramo no tienen ruta todavía.</p>'+sig}
  </div>
  <div class="card"><h2>Historial de movimientos</h2>
   ${mov.length?mov.map(x=>`<div class="mov"><span class="f">${fecha(x.fecha)}</span><span>${esc(x.tipo)}: ${esc(x.antes||"—")} → <strong>${esc(x.despues||"—")}</strong></span></div>`).join(""):'<p class="vacia">Sin movimientos registrados.</p>'}
  </div>
 </div>`;
}

/* ===== render ===== */
function pintaHero(p,e){
 const ini=(p.nombre||"?").split(/\s+/).map(x=>x[0]).slice(0,2).join("").toUpperCase();
 const dc=docCount(e);
 $("#hero").innerHTML=`<div class="hero">
  <div class="ava">${esc(ini)}</div>
  <div class="hmain">
   <h3>${esc(p.nombre)}</h3>
   <div class="sub">${esc(p.rol||"sin rol")} · ${esc(p.categoria_nombre||"sin categoría")}${p.tramo?" · tramo "+(TRAMO[p.tramo]||esc(p.tramo)):""} · ${esc(p.sede||"—")}</div>
   <div class="sub">Jefe: <strong>${esc(p.jefe||"por definir")}</strong>${p.jefe_funcional?" · Funcional: <strong>"+esc(p.jefe_funcional)+"</strong>":""} · desde ${fecha(p.inicio)}</div>
   <div class="pills">
    ${e?`<span class="pill ${e.estatus==="activo"?"ok":"warn"}">${esc(e.estatus||"—")}</span>`:""}
    ${e&&e.prueba_planta?`<span class="pill ${e.prueba_planta==="planta"?"ok":"warn"}">${esc(e.prueba_planta)}</span>`:""}
    <span class="pill ${dc>=10?"ok":"neutro"}">${dc}/10 docs</span>
    ${p.maestria?`<span class="pill neutro">maestría ${p.maestria.cerrados}/${p.maestria.modulos}</span>`:""}
   </div>
  </div>
 </div>`;
}
function pintaTabs(){
 $("#tabs").innerHTML=SECS.map(([k,t])=>`<button role="tab" data-k="${k}" aria-selected="${k===tab}">${t}</button>`).join("");
 $("#tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>{tab=b.dataset.k;pinta();});
}
function pinta(){
 const p=F.find(x=>x.id===cur);
 if(!p){$("#hero").innerHTML="";$("#pane").innerHTML="";$("#nav").hidden=true;return;}
 const e=E[p.id]||null;
 $("#nav").hidden=false;
 pintaHero(p,e);pintaTabs();
 const fn={resumen:sResumen,docs:sDocs,laboral:sLaboral,perfil:sPerfil,criterios:sCriterios,situacion:sSituacion,crecimiento:sCrecimiento}[tab]||sResumen;
 $("#pane").innerHTML=fn(p,e);
 $("#pane").querySelectorAll("[data-doc]").forEach(a=>a.onclick=()=>{const [id,k]=a.dataset.doc.split("|");const ee=E[id];if(ee)verDoc(ee[k]);});
 try{history.replaceState(null,"",location.pathname+"?id="+cur+"&tab="+tab);}catch(_){}
}
(async function(){
 $("#fuente").textContent="cargando…";
 try{
  F=await sb("/rh_ficha?select=*&order=nombre");
  $("#fuente").textContent="en vivo";$("#fuente").className="badge";
 }catch(e){$("#fuente").textContent="sin conexión";$("#fuente").className="badge off";}
 try{
  const emps=await sb("/employees?select=id,empleado_id,nombre,apellido,nombre_display,estatus,prueba_planta,fecha_inicio_labores,fecha_nacimiento,nacionalidad,estado_civil,direccion,telefono,email,rfc,curp,nss,afore,contacto_nombre,contacto_cel,salario_bruto,salario_desde,ultimo_aumento_fecha,puesto,area,area_2,sede,vac_anio,vac_anteriores,vac_tomadas,vac_pendientes,contrato_url,id_oficial_url,foto_url,acta_nacimiento_url,rfc_doc_url,nss_doc_url,comprobante_domicilio_url,comprobante_estudios_url,imss_cedula_url,cv_url&estatus=in.(activo,pendiente_alta)");
  emps.forEach(x=>E[x.id]=x);
 }catch(e){}
 try{RANGOS=await sb("/rangos_salariales?select=rol,puesto,sede,activo,practicas,junior,junior2,senior&activo=is.true");}catch(e){}
 $("#sel").innerHTML='<option value="">— elige un colaborador —</option>'
  +F.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")).map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join("");
 $("#sel").onchange=()=>{cur=$("#sel").value;tab="resumen";pinta();};
 const q=new URLSearchParams(location.search);
 if(q.get("id")&&F.some(x=>x.id===q.get("id"))){cur=q.get("id");$("#sel").value=cur;if(q.get("tab")&&SECS.some(s=>s[0]===q.get("tab")))tab=q.get("tab");pinta();}
})();
</script>
