<style>

  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --warn:#8C6212; --warn-bg:#F3EAD6;
  --bad:#9E3B2E; --bad-bg:#F4E2DE;

  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:0 16px}
header.top{padding:20px 0 12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header.top h1{margin:0;font-size:1.3rem;letter-spacing:-.01em}
.badge{display:inline-block;background:var(--accent-soft);color:var(--ok);border:1px solid var(--ok);
  border-radius:999px;padding:2px 9px;font-size:.7rem;font-weight:600;vertical-align:middle;margin-left:8px}
.badge.off{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
#st{font-size:.75rem;color:var(--muted);min-width:90px;text-align:right}
#st.ok{color:var(--ok);font-weight:600}#st.err{color:var(--bad);font-weight:600}
select{font:inherit;padding:8px 11px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--surface);color:var(--ink);min-width:230px}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* hero */
.hero{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);
  padding:18px 20px;margin-bottom:14px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.ava{width:64px;height:64px;border-radius:50%;background:var(--accent);color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;flex:none}
.hero .hmain{flex:1;min-width:220px}
.hero h3{margin:0;font-size:1.35rem;letter-spacing:-.01em}
.hero .sub{color:var(--muted);font-size:.86rem;margin-top:2px}
.hero .pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:1px 9px;font-size:.7rem;font-weight:600;border:1px solid;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.pill.neutro{background:var(--surface-2);color:var(--muted);border-color:var(--rule-2)}

.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule);margin:0 -16px 16px;padding:0 16px}
.secnav-in{display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:11px 13px;color:var(--muted);

.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);
  padding:18px;margin:0 0 16px}
.card h2{margin:0 0 10px;font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.dato{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.88rem;padding:5px 0;border-bottom:1px solid var(--rule)}
.dato:last-child{border-bottom:0}
.dato .k{color:var(--muted);flex:none} .dato .v{text-align:right;font-variant-numeric:tabular-nums}
.dato .in{flex:1;max-width:60%;text-align:right;border:1px solid transparent;background:transparent;border-radius:6px;
  padding:4px 6px;font:inherit;font-size:.88rem;color:var(--ink);min-width:0}
.dato select.in{min-width:0;padding:4px 6px}
.dato .in:hover{border-color:var(--rule-2)}
.dato .in:focus{border-color:var(--accent);background:var(--surface-3);outline:none}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.stat span{font-size:.72rem;color:var(--muted)}
.stat.bad b{color:var(--bad)} .stat.warn b{color:var(--warn)}
.bar{display:flex;height:26px;border-radius:4px;overflow:hidden;background:var(--surface-2);gap:2px;margin:10px 0 4px}
.bar i{display:block;height:100%}
.bar i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.leyenda{display:flex;flex-wrap:wrap;gap:5px 15px;font-size:.73rem;color:var(--muted)}
.leyenda i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:5px}
.leyenda i.nm{background:repeating-linear-gradient(45deg,var(--surface-2),var(--surface-2) 3px,var(--rule-2) 3px,var(--rule-2) 5px)}
.vbar{display:flex;height:16px;border-radius:4px;overflow:hidden;background:var(--surface-2);border:1px solid var(--rule);max-width:320px}
.vbar i{display:block;height:100%}
.docrow{display:flex;align-items:center;gap:8px;font-size:.87rem;padding:7px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.docrow:last-child{border-bottom:0}
.docrow .nm{flex:1;min-width:150px}
.docrow .st.si{color:var(--ok);font-weight:600}.docrow .st.no{color:var(--warn)}
.bt{border:1px solid var(--rule-2);background:var(--surface);border-radius:6px;padding:3px 9px;font-size:.76rem;
  cursor:pointer;color:var(--ink);font-family:inherit}
.bt:hover{border-color:var(--accent);color:var(--accent)}
.bt.baja{color:var(--warn);border-color:#e0c27a}.bt.baja:hover{background:var(--warn-bg)}
.bt.del{color:var(--bad);border-color:#e0b3b3}.bt.del:hover{background:var(--bad-bg)}
.mods{display:flex;flex-direction:column;gap:5px;margin-top:8px}
.mod{display:grid;grid-template-columns:1fr auto auto;gap:10px;font-size:.85rem;
  background:var(--surface-3);border:1px solid var(--rule);border-radius:6px;padding:7px 12px}
.mod .num{font-variant-numeric:tabular-nums;color:var(--muted)}
.mov{font-size:.84rem;padding:7px 0;border-bottom:1px solid var(--rule);display:flex;gap:10px}
.mov:last-child{border-bottom:0}
.mov .f{color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)}
.vacia{color:var(--faint);font-size:.85rem}
/* directorio de cajones por sede */
.dirbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.dirbar input{font:inherit;padding:8px 11px;border:1px solid var(--rule-2);border-radius:6px;background:var(--surface);color:var(--ink);flex:1;min-width:160px}
.dirbar input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sleyenda{display:flex;gap:5px 14px;flex-wrap:wrap;font-size:.73rem;color:var(--muted)}
.sleyenda i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
.dir{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px;padding-bottom:30px}
.cajon{background:var(--sc-bg,var(--surface));border:1px solid var(--rule);border-top:4px solid var(--sc,var(--rule-2));
  border-radius:10px;box-shadow:var(--shadow);padding:13px 14px;cursor:pointer;text-align:left;font:inherit;color:var(--ink);
  display:flex;flex-direction:column;gap:8px;transition:border-color .12s}
.cajon:hover{border-color:var(--sc,var(--accent))}
.cajon:focus-visible{outline:2px solid var(--sc,var(--accent));outline-offset:2px}
.cajon .ctop{display:flex;gap:10px;align-items:center;min-width:0}
.cajon .cava{width:38px;height:38px;border-radius:50%;background:var(--sc,var(--accent));color:#fff;display:flex;
  align-items:center;justify-content:center;font-size:.85rem;font-weight:700;flex:none}
.cajon .cnom{min-width:0}
.cajon .cnom b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cajon .cnom em{font-style:normal;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cajon .cmeta{display:flex;gap:5px;flex-wrap:wrap}
.cajon .cmeta .pill{font-size:.64rem;padding:1px 7px}
.aviso{background:var(--warn-bg);border:1px solid var(--warn);color:var(--warn);border-radius:8px;padding:10px 13px;font-size:.84rem;margin-bottom:14px}
footer.pie{padding:20px 0 44px;color:var(--faint);font-size:.78rem;line-height:1.6}
code.k{background:var(--surface-2);border-radius:4px;padding:1px 5px;font-size:.8rem}
</style>
</head>

try{const _r=localStorage.getItem("sb-rehophywchakfapivsbh-auth-token");if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t){H.Authorization="Bearer "+_t;const _p=_t.split(".")[1].replace(/-/g,"+").replace(/_/g,"/");try{ME=((JSON.parse(atob(_p+"===".slice((_p.length+3)%4)))||{}).email||"").toLowerCase();}catch(_){}}}}catch(e){}

function confirmImpacto(titulo,delta){ const im=impacto(delta); const mesTxt=(NOM.objetivo_mes?MESES[Number(NOM.objetivo_mes)]:"")+(NOM.objetivo_anio?" "+NOM.objetivo_anio:""); let msg=titulo+"\n\nImpacto en la nómina de la empresa:\n"; msg+="\u2022 "+(delta>=0?"+":"")+mxn(delta)+" al mes ("+(delta>=0?"+":"")+im.pctMes.toFixed(2)+"% del gasto salarial)\n"; msg+="\u2022 Gasto mensual: "+mxn(im.tot)+" \u2192 "+mxn(im.nuevoMes)+"\n"; if(im.objMes){ msg+="\u2022 Objetivo del mes (forecast"+(mesTxt?" "+mesTxt.trim():"")+"): "+mxn(im.objMes)+"\n"; msg+="\u2022 "+(im.holgura>=0?("Vas BIEN: quedan "+mxn(im.holgura)+" de holgura ("+im.pctObj.toFixed(1)+"% del objetivo del mes)."):("\u26a0 Te PASAS del objetivo del mes por "+mxn(-im.holgura)+" ("+im.pctObj.toFixed(1)+"% del objetivo).")); } else { msg+="\u2022 (No hay forecast de nómina cargado para el mes)"; } return confirm(msg+"\n\n\u00bfConfirmas el cambio?"); }

async function patchEmp(id,body){
 st("guardando…");
 try{

function loadGapi(cb){const s1=document.createElement("script");s1.src="https://apis.google.com/js/api.js";s1.onload=()=>gapi.load("picker",()=>{gReady=true;const s2=document.createElement("script");s2.src="https://accounts.google.com/gsi/client";s2.onload=cb;document.head.appendChild(s2);});document.head.appendChild(s1);}
