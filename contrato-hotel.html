<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrato · Grupo Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{--ground:#F4F1EA;--surface:#FFF;--surface-2:#EFE9DD;--surface-3:#FBF8F1;--ink:#1F1B16;--muted:#6B6459;
  --faint:#A49B8C;--rule:#E2DCCF;--accent:#137A56;--accent-soft:#DCEFE6;--ok:#1D6B4A;--ok-bg:#E1F0E7;
  --bad:#9E3B2E;--bad-bg:#F4E2DE;--warn:#8C6212;--warn-bg:#F3EAD6;
  --shadow:0 1px 1px rgba(31,27,22,.04),0 10px 26px -20px rgba(31,27,22,.35)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:26px 18px 70px}
.top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:4px}
.top b{font-size:17px}.top span{color:var(--muted);font-size:13px}
.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.res{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.res .p{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 14px;min-width:138px;box-shadow:var(--shadow)}
.res .p i{display:block;font-style:normal;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.res .p b{font-size:15px;display:block;margin-top:3px}
.doc{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:26px 28px;max-height:62vh;overflow:auto;box-shadow:var(--shadow)}
.doc h2{font-size:20px;margin:20px 0 9px}
.doc h3{font-size:16px;margin:18px 0 7px;color:var(--accent)}
.doc h4{font-size:14.5px;margin:14px 0 6px}
.doc h5{font-size:13.5px;margin:12px 0 4px}
.doc p{margin:8px 0;font-size:14px}
.doc ul{margin:6px 0 10px 20px}.doc li{font-size:14px;margin:3px 0}
.doc hr{border:0;border-top:1px solid var(--rule);margin:20px 0}
.doc table{width:100%;border-collapse:collapse;margin:9px 0 13px;font-size:13.5px}
.doc td{border:1px solid var(--rule);padding:7px 10px;vertical-align:top}
.doc td:first-child{background:var(--surface-3);width:38%;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:20px 22px;margin-top:18px;box-shadow:var(--shadow)}
.box h4{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.g{grid-template-columns:1fr}}
label{display:block;font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:5px}
input,select{width:100%;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit}
input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:13.5px}
.chk input{width:auto;margin-top:4px}
.chk label{font-size:13.5px;color:var(--ink);font-weight:400;margin:0}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;font-weight:700;border:0;border-radius:10px;padding:13px 22px;font-size:15px;cursor:pointer;font-family:inherit;margin-top:16px}
.btn[disabled]{opacity:.5;cursor:default}
.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:9px;font-size:13.5px}
.msg.err{display:block;background:var(--bad-bg);border:1px solid #E6B8B2;color:var(--bad)}
.muro{background:var(--warn-bg);border:1px solid #E6D2A8;color:var(--warn);border-radius:11px;padding:13px 15px;font-size:13.5px;margin-top:16px}
.ok{text-align:center;padding:30px 10px 16px}
.ok .tick{width:46px;height:46px;border-radius:50%;background:var(--ok-bg);color:var(--ok);display:grid;place-items:center;margin:0 auto 10px;font-size:24px;font-weight:800}
.ok h1{font-size:21px;margin:0 0 8px}
.ok p{color:var(--muted);font-size:14.5px;max-width:560px;margin:0 auto}
.acuse{margin-top:20px;background:var(--surface-3);border:1px dashed var(--rule);border-radius:12px;padding:16px 18px;font-size:12.5px;color:var(--muted);line-height:1.8}
.acuse b{color:var(--ink);letter-spacing:.06em}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.cargando{text-align:center;color:var(--muted);padding:60px 0}
.pie{margin-top:26px;color:var(--faint);font-size:12.5px;text-align:center}
</style>
</head><body>
<div class="wrap" id="app"><div class="cargando">Cargando tu contrato…</div></div>
<script>
/* La pagina publica donde el hotelero lee y firma su contrato marco.
   El token de la URL ES la credencial: la liga se manda por correo y no se
   comparte. La funcion vuelve a comprobar el candado al firmar, asi que esta
   pagina no es el unico sitio donde se cuida. */
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var FN=SB+'/functions/v1/hotel-contrato';
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var TOKEN=new URLSearchParams(location.search).get('t')||'';

async function api(body){
  var r=await fetch(FN,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j=await r.json().catch(function(){return {error:'respuesta ilegible'};});
  if(!r.ok||j.error) throw new Error(j.error||'Algo falló');
  return j;
}
function aviso(t,x){
  $('app').innerHTML='<div class="ok"><div class="tick">·</div><h1>'+esc(t)+'</h1><p>'+esc(x)+'</p></div>'
    +'<p class="pie">Grupo Casa Pepe · javi@casapepe.mx</p>';
}

function pinta(c,puede,motivo){
  var cab='<div class="top"><b>Grupo Casa Pepe</b><span>· Contrato marco '+esc(c.folio)+'</span></div>';
  var res='<div class="res">'
    +'<div class="p"><i>Hotel</i><b>'+esc(c.hotel||'')+'</b></div>'
    +(c.ciudad?'<div class="p"><i>Ciudad</i><b>'+esc(c.ciudad)+'</b></div>':'')
    +'<div class="p"><i>Versión</i><b>'+esc(c.version||'')+'</b></div>'
    +'</div>';

  if(c.estado==='firmado'){
    var a=c.acuse||{};
    $('app').innerHTML=cab
      +'<div class="ok"><div class="tick">&#10003;</div><h1>Contrato firmado</h1>'
      +'<p>Lo firmó '+esc(a.firmante||c.firmante||'')+' el '+esc(a.fecha_local||String(c.firmado_at||'').slice(0,10))+'. Abajo queda el documento tal como se firmó; también te llegó por correo.</p></div>'
      +res+'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
      +'<div class="acuse"><b>ACUSE DE FIRMA ELECTRÓNICA</b><br>'
      +'Folio: '+esc(c.folio)+'<br>Firmó: '+esc(a.firmante||'')+'<br>'
      +'Fecha y hora: '+esc(a.fecha_local||'')+'<br>IP: '+esc(a.ip||'')+'<br>'
      +'Navegador: '+esc(String(a.ua||'').slice(0,120))+'</div>'
      +'<p class="pie">Grupo Casa Pepe · javi@casapepe.mx</p>';
    return;
  }

  $('app').innerHTML=cab
    +'<p class="lead">Léelo completo. Abajo corriges los datos que falten y lo firmas; te llega copia por correo.</p>'
    +res
    +'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
    +'<div class="box"><h4>Tus datos para el contrato</h4><div class="g">'
      +'<div><label>Razón social o nombre completo</label><input id="f-razon" value="'+esc(c.razon_social||'')+'"></div>'
      +'<div><label>RFC</label><input id="f-rfc" value="'+esc(c.rfc||'')+'" placeholder="XAXX010101000" style="text-transform:uppercase"></div>'
      +'<div><label>Figura fiscal</label><select id="f-tipo">'
        +'<option value="Persona moral">Persona moral</option>'
        +'<option value="Persona física con actividad empresarial">Persona física con actividad empresarial</option>'
        +'<option value="Persona física sin actividad empresarial">Persona física sin actividad empresarial</option></select></div>'
      +'<div><label>Representante</label><input id="f-rep" value="'+esc(c.representante||'')+'"></div>'
      +'<div><label>Domicilio</label><input id="f-dom" value="'+esc(c.domicilio||'')+'"></div>'
      +'<div><label>Correo para notificaciones</label><input id="f-mail" type="email" value="'+esc(c.email||'')+'"></div>'
      +'<div><label>WhatsApp</label><input id="f-wa" value="'+esc(c.whatsapp||'')+'"></div>'
    +'</div>'
    + (puede
      ? '<div class="chk"><input type="checkbox" id="f-ok"><label for="f-ok">He leído el contrato completo y acepto sus términos. Entiendo que mi firma electrónica tiene la misma validez que una firma autógrafa.</label></div>'
        +'<div style="margin-top:14px;max-width:380px"><label>Escribe tu nombre completo para firmar</label><input id="f-firma" placeholder="Nombre y apellidos"></div>'
        +'<button class="btn" id="b-firmar">Firmar contrato</button>'
      : '<div class="muro">'+esc(motivo||'Todavía no se puede firmar.')+'</div>')
    +'<div class="msg" id="err"></div></div>'
    +'<p class="pie">Grupo Casa Pepe · javi@casapepe.mx</p>';

  var sel=$('f-tipo'); if(sel && c.tipo_persona) sel.value=c.tipo_persona;

  if(!puede) return;
  $('b-firmar').onclick=async function(){
    var err=$('err'); err.style.display='none';
    var v=function(i){return ($(i).value||'').trim();};
    if(!v('f-razon')){err.className='msg err';err.textContent='Falta la razón social o tu nombre.';return;}
    if(!$('f-ok').checked){err.className='msg err';err.textContent='Marca la casilla de aceptación para poder firmar.';return;}
    if(v('f-firma').length<5){err.className='msg err';err.textContent='Escribe tu nombre completo para firmar.';return;}
    var b=$('b-firmar'); b.disabled=true; b.innerHTML='<span class="spin"></span> Firmando…';
    try{
      await api({accion:'firmar',token:TOKEN,acepta:true,
        razon_social:v('f-razon'),rfc:v('f-rfc'),tipo_persona:$('f-tipo').value,
        representante:v('f-rep'),domicilio:v('f-dom'),
        email_notificaciones:v('f-mail'),whatsapp:v('f-wa'),
        firmante:v('f-firma'),fecha_local:new Date().toLocaleString('es-MX')});
      await cargar();
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){
      b.disabled=false; b.textContent='Firmar contrato';
      err.className='msg err'; err.textContent=e.message||'No se pudo firmar. Inténtalo otra vez.';
    }
  };
}

async function cargar(){
  if(!TOKEN){ aviso('Falta el enlace','Entra con el enlace que te mandamos por correo.'); return; }
  try{
    var j=await api({accion:'ver',token:TOKEN});
    pinta(j.contrato, j.puede_firmar!==false, j.motivo);
  }catch(e){
    aviso('No encontramos ese contrato', (e.message||'')+'. Escríbenos y te mandamos uno nuevo.');
  }
}
cargar();
</script>
</body></html>
