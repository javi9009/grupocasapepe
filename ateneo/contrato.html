async function nombrePlan(slug){

  try{
    const r=await fetch(SB_URL+'/rest/v1/ateneo_planes?slug=eq.'+encodeURIComponent(slug)+'&select=nombre',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});

async function api(body){

/* ================== EL PRIMER PAGO ==================
   Javi, 9-nov-2026: «este contrato va asociado al link de pago? Recuerda que
   ha de pagar el depósito en garantía cuando paga el primer mes». No lo
   estaba: la página terminaba en la firma y ahí se acababa el camino. El
   cliente firmaba y nadie le decía cómo pagar.

   LAS CIFRAS NO SE CALCULAN AQUÍ. Se le piden a `ate-cobro-alta`, que es la
   misma función que después le cobra: así lo que lee en pantalla es, por
   construcción, lo que Stripe le va a cargar. Si la pantalla sumara por su
   cuenta, el día que cambie una regla del cobro habría dos verdades.

   Y esa función exige contrato firmado y lugar asignado antes de abrir nada.
   Si falta algo lo dice con sus palabras, que es mejor que un botón que no
   hace nada. */
/* DARSE DE BAJA UNO MISMO. Javi, 9-nov-2026: «permite en la cuenta del
   ateneísta dar de baja la suscripción». Se pide confirmación porque es una
   decisión con dinero detrás, y se dice con todas las letras qué pasa: no se
   vuelve a cobrar, y el periodo que ya pagó corre hasta su fin. Dejar el sitio
   es otra conversación, y no se decide con este botón. */
function enganchaBaja(){
  var b=$('bBaja'); if(!b) return;
  b.onclick=async function(){
    if(!confirm(T('\u00bfDamos de baja el cobro mensual? No se te volver\u00e1 a cobrar. Lo que ya pagaste corre hasta su fin.'))) return;
    b.disabled=true; b.innerHTML='<span class="spin"></span> '+T('Dando de baja\u2026');
    var m=$('bajaMsg');
    try{
      var r=await fetch(SB_URL+'/functions/v1/ate-cobro-baja',{method:'POST',
        headers:{'Content-Type':'application/json'},body:JSON.stringify({token:TOKEN})});
      var j=await r.json();
      if(!j||!j.ok){ m.className='msg err'; m.textContent=(j&&j.error)||T('No se pudo dar de baja.'); b.disabled=false; b.textContent=T('Dar de baja el cobro mensual'); return; }
      b.style.display='none';
      m.className='msg'; m.style.display='block';
      m.style.background='rgba(140,198,63,.12)'; m.style.border='1px solid var(--green)'; m.style.color='#dbe6cd';
      m.textContent=j.mensaje||T('Listo: no se har\u00e1n m\u00e1s cargos.');
    }catch(e){ m.className='msg err'; m.textContent=T('No se pudo dar de baja.'); b.disabled=false; b.textContent=T('Dar de baja el cobro mensual'); }
  };
}

    return;
  }
  if(!j||!j.url){
    caja.innerHTML='<div class="box"><h4>'+T('El primer pago')+'</h4>'

      +T('Escr\u00edbenos y lo resolvemos: ateneo@casapepe.mx')+'</p></div>';

  }
  PAGO=j;
  const ren=Number(j.renta||0), dep=Number(j.deposito||0);
  caja.innerHTML='<div class="box"><h4>'+T('El primer pago')+'</h4>'
    +'<div class="res" style="margin:0 0 14px">'
      +'<div class="p"><i>'+T('Primera mensualidad')+'</i><b>'+dinero(ren)+'</b></div>'
      +(dep>0?'<div class="p"><i>'+T('Dep\u00f3sito en garant\u00eda')+'</i><b>'+dinero(dep)+'</b></div>':'')
      +'<div class="p"><i>'+T('Total hoy')+'</i><b>'+dinero(j.primer_cargo||(ren+dep))+'</b></div>'
    +'</div>'
    +'<p style="font-size:13.5px;color:#dbe6cd">'
      +(dep>0?T('El dep\u00f3sito en garant\u00eda se cubre una sola vez, junto con tu primera mensualidad.')+' ':'')
      +(j.siguiente_cobro?(T('A partir de ah\u00ed se cobra s\u00f3lo la renta, el d\u00eda 1 de cada mes; el pr\u00f3ximo ser\u00e1 el')+' '+esc(j.siguiente_cobro)+'.'):'')
    +'</p>'
    +'<div class="aviso">'+T('Al pagar guardas tu tarjeta y autorizas el')+' <b>'+T('cobro autom\u00e1tico de la renta cada mes')+'</b>'
      +(j.siguiente_cobro?(' '+T('a partir del')+' '+esc(j.siguiente_cobro)):'')+'. '
      +T('Puedes darlo de baja cuando quieras desde aqu\u00ed mismo; no se vuelve a cobrar y lo ya pagado corre hasta su fin.')+'</div>'
    +'<button class="btn" id="bPagar">'+T('Pagar y guardar mi tarjeta')+'</button>'
    +'<div class="msg" id="cobroErr"></div></div>';
  $('bPagar').onclick=function(){
    this.disabled=true;
    this.innerHTML='<span class="spin"></span> '+T('Abriendo el pago\u2026');
    location.href=PAGO.url;
  };
}

/* LA FIRMA A MANO. Javi, 9-nov-2026: «permite que firme con la mano para que
   se vea autógrafo».

   El nombre escrito se queda igual: es lo que identifica a quien firma y lo
   que viaja en los correos. El trazo es lo que lo hace parecer -y leerse
   como- una firma de verdad. Los dos van al acuse.

   Se dibuja en coordenadas reales del lienzo, no en las del CSS: un canvas
   estirado por hoja de estilo dibuja borroso y con el trazo desplazado del
   dedo, que es lo que hace que la gente firme tres veces y se rinda. */
var TRAZO = { hay:false, ctx:null, cv:null };
function montaTrazo(){
  var cv=$('f-trazo'); if(!cv) return;
  var dpr=Math.max(1, Math.min(3, window.devicePixelRatio||1));
  function talla(){
    var r=cv.getBoundingClientRect();
    if(!r.width) return;
    cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr);
    var c=cv.getContext('2d');
    c.setTransform(dpr,0,0,dpr,0,0);
    c.lineWidth=2.2; c.lineCap='round'; c.lineJoin='round'; c.strokeStyle='#17230c';
    TRAZO.ctx=c;
  }
  TRAZO.cv=cv; talla();
  window.addEventListener('resize', function(){ if(!TRAZO.hay) talla(); });

  var pintando=false;
  function punto(e){
    var r=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])||e;
    return { x:t.clientX-r.left, y:t.clientY-r.top };
  }
  function abajo(e){
    e.preventDefault(); pintando=true;
    var p=punto(e); TRAZO.ctx.beginPath(); TRAZO.ctx.moveTo(p.x,p.y);
    if(!TRAZO.hay){ TRAZO.hay=true; var pi=$('f-pista'); if(pi) pi.style.display='none'; }
  }
  function mueve(e){ if(!pintando) return; e.preventDefault();
    var p=punto(e); TRAZO.ctx.lineTo(p.x,p.y); TRAZO.ctx.stroke(); }
  function arriba(){ pintando=false; }

  cv.addEventListener('mousedown',abajo); cv.addEventListener('mousemove',mueve);
  window.addEventListener('mouseup',arriba);
  cv.addEventListener('touchstart',abajo,{passive:false});
  cv.addEventListener('touchmove',mueve,{passive:false});
  cv.addEventListener('touchend',arriba);

  var bb=$('f-borrar');
  if(bb) bb.onclick=function(){
    talla(); TRAZO.hay=false;
    var pi=$('f-pista'); if(pi) pi.style.display='';
  };
}


function pinta(c){
  const cab='<div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><div class="top"><b>Ateneo de Virreyes</b><span>· '+T('Contrato')+' '+esc(c.folio)+'</span></div><div id="idioma"></div></div>';
  const res='<div class="res">'
    +'<div class="p"><i>'+T('Plan')+'</i><b style="font-size:15px;color:var(--txt)">'+esc(NOMBRE_PLAN||c.plan_slug||'')+'</b></div>'
    +'<div class="p"><i>'+T('Primer pago')+'</i><b>'+dinero(c.importe)+'</b></div>'
    +(c.meses?'<div class="p"><i>'+T('Vigencia')+'</i><b>'+c.meses+' '+T('meses')+'</b></div>':'')
    +'</div>';

  /* Contrafirmado es firmado por las dos partes: tambien entra aqui. Antes
     solo se miraba 'firmado', asi que a quien ya habiamos contrafirmado le
     volvia a salir el formulario de firma, como si no hubiera firmado. */
  if(c.estado==='firmado'||c.estado==='contrafirmado'){
    const a=c.acuse||{};
    $('app').innerHTML=cab
      +'<div class="ok"><div class="tick">✅</div><h1>'+T('Contrato firmado')+'</h1>'
      +'<p>'+T('Lo firmó')+' '+esc(a.firmante||c.cliente||'')+' '+T('el')+' '+esc(a.fecha_local||c.firmado_at||'')+'. '+T('Abajo queda el documento tal como se firmó; también te llegó por correo.')+'</p></div>'
      +'<div id="cobro"></div>'
      +res+'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
      +'<div class="acuse"><b>'+T('ACUSE DE FIRMA ELECTRÓNICA')+'</b><br>'
      +(a.firma_png?('<img src="'+esc(a.firma_png)+'" alt="'+T('Firma')+'" style="display:block;max-width:300px;width:100%;margin:10px 0 4px;background:#fff;border-radius:8px;padding:6px">'):'')
      +T('Folio:')+' '+esc(c.folio)+'<br>'+T('Firmó:')+' '+esc(a.firmante||'')+'<br>'
      +T('Fecha y hora:')+' '+esc(a.fecha_local||'')+'<br>'+T('IP:')+' '+esc(a.ip||'')+'<br>'
      +T('Navegador:')+' '+esc(String(a.ua||'').slice(0,120))+'</div>'
      +'<p class="pie">Ateneo de Virreyes · José María Izazaga 8, piso 1, Centro Histórico, CDMX</p>';
    idi();
    if(c.estado==='firmado') montaCobro();
    return;
  }

  $('app').innerHTML=cab
    +'<p class="lead">'+T('Lee el contrato completo. Abajo completas los datos que faltan y lo firmas; te llega copia por correo.')+'</p>'
    +res
    +'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
    +'<div class="box"><h4>'+T('Datos para el contrato')+'</h4><div class="g">'
      +'<div><label id="l-cliente">'+T('Razón social o nombre completo')+'</label><input id="f-cliente" value="'+esc(c.cliente||'')+'"></div>'
      +'<div><label>RFC</label><input id="f-rfc" value="'+esc(c.rfc||'')+'" placeholder="XAXX010101000"></div>'
      /* LAS TRES FIGURAS, NO DOS. Javi, 16-oct-2026: faltaba la de quien no
         tiene actividad empresarial, que es justo quien no puede poner un RFC
         y se quedaba sin poder firmar. */
      +'<div><label>'+T('Tipo')+'</label><select id="f-tipo">'
        +['Persona física','Persona física sin actividad empresarial','Persona moral'].map(function(o){
            return '<option value="'+o+'"'+((c.tipo_persona===o)?' selected':'')+'>'+T(o)+'</option>'; }).join('')
        +'</select></div>'
      +'<div id="w-rep"><label>'+T('Representante legal')+'</label><input id="f-rep" value="'+esc(c.representante||'')+'"></div>'
      +'<div><label>'+T('Domicilio fiscal')+'</label><input id="f-dom" value="'+esc(c.domicilio||'')+'"></div>'
      +'<div id="w-act"><label>'+T('Actividad principal')+'</label><input id="f-act" value="'+esc(c.actividad||'')+'"></div>'
      +'<div><label>'+T('Correo de facturación')+'</label><input id="f-fact" type="email" value="'+esc(c.email||'')+'"></div>'
      +'<div><label>WhatsApp</label><input id="f-wa" value="'+esc(c.whatsapp||c.telefono||'')+'"></div>'
    +'</div>'
    +'<div class="chk"><input type="checkbox" id="f-ok"><label for="f-ok" style="font-weight:400">'+T('He leído el contrato completo y acepto sus términos. Entiendo que mi firma electrónica tiene la misma validez que una firma autógrafa.')+'</label></div>'
    +'<div style="margin-top:14px;max-width:360px"><label>'+T('Escribe tu nombre completo para firmar')+'</label><input id="f-firma" placeholder="'+T('Nombre y apellidos')+'"></div>'
    +'<div class="firma"><label>'+T('Y firma aquí con el dedo o el ratón')+'</label>'
      +'<div class="lienzo"><canvas id="f-trazo"></canvas>'
        +'<div class="raya"></div><div class="pista" id="f-pista">'+T('Firma sobre la línea')+'</div></div>'
      +'<div class="bajo"><span>'+T('Tu trazo queda guardado en el acuse.')+'</span>'
        +'<button type="button" id="f-borrar">'+T('Borrar y repetir')+'</button></div></div>'
    +'<button class="btn" id="b-firmar">'+T('Firmar contrato')+'</button>'
    +'<div class="msg" id="err"></div></div>'
    +'<p class="pie">Ateneo de Virreyes · José María Izazaga 8, piso 1, Centro Histórico, CDMX · '+T('¿Dudas? WhatsApp 55 4930 5703')+'</p>';
  idi();

  /* LA FIGURA DECIDE QUÉ CAMPOS EXISTEN. Javi, 9-nov-2026: «si es persona
     física no hay representante legal». Y es verdad: una persona física se
     representa a sí misma, así que ese campo no es que esté vacío, es que no
     aplica. Pedirlo invita a rellenarlo con cualquier cosa, y eso acaba
     impreso en un contrato.

     La tercera figura -sin actividad empresarial- tampoco tiene actividad
     principal que declarar: ese es justo el dato que la define.

     Esconder no basta: al firmar, el representante de una persona física se
     manda igual a su propio nombre, para que la cláusula del contrato no
     quede con una raya en medio. */
  function figura(){
    var t=$('f-tipo').value;
    return { moral: t==='Persona moral',
             sinAct: t==='Persona f\u00edsica sin actividad empresarial' };
  }
  function ajustaCampos(){
    var f=figura();
    var wr=$('w-rep'), wa=$('w-act'), lc=$('l-cliente');
    if(wr) wr.style.display = f.moral ? '' : 'none';
    if(wa) wa.style.display = f.sinAct ? 'none' : '';
    if(lc) lc.textContent = f.moral ? T('Raz\u00f3n social') : T('Nombre completo');
  }
  $('f-tipo').onchange=ajustaCampos;
  ajustaCampos();
  montaTrazo();

  $('b-firmar').onclick=async()=>{
    const err=$('err'); err.style.display='none';
    const v=i=>($(i).value||'').trim();
    if(!v('f-cliente')){err.className='msg err';err.textContent=T('Falta la razón social o tu nombre.');return;}
    if(figura().moral && !v('f-rep')){err.className='msg err';err.textContent=T('Una persona moral firma por medio de su representante legal: escribe su nombre.');return;}
    if(!$('f-ok').checked){err.className='msg err';err.textContent=T('Marca la casilla de aceptación para poder firmar.');return;}
    if(v('f-firma').length<5){err.className='msg err';err.textContent=T('Escribe tu nombre completo para firmar.');return;}
    if(!TRAZO.hay){err.className='msg err';err.textContent=T('Falta tu firma: tr\u00e1zala con el dedo o el rat\u00f3n en el recuadro.');return;}
    const b=$('b-firmar'); b.disabled=true; b.innerHTML='<span class="spin"></span> '+T('Firmando…');
    try{
      await api({accion:'firmar',token:TOKEN,
        cliente:v('f-cliente'),rfc:v('f-rfc'),tipo_persona:$('f-tipo').value,
        representante: figura().moral ? v('f-rep') : v('f-cliente'),
        actividad: figura().sinAct ? '' : v('f-act'),
        domicilio:v('f-dom'),email_facturacion:v('f-fact'),whatsapp:v('f-wa'),
        firmante:v('f-firma'),fecha_local:new Date().toLocaleString('es-MX'),
        firma_png:(TRAZO.hay&&TRAZO.cv)?TRAZO.cv.toDataURL('image/png'):null});
      /* Javi, 9-nov-2026: \u00abcoordina que tras la firma se abre la pesta\u00f1a de
         pago\u00bb. Se repinta en estado firmado -eso monta el bloque del cobro- y
         se le lleva ah\u00ed, que es el \u00fanico paso que le queda. Antes se le
         sub\u00eda arriba del todo y se quedaba mirando su propio contrato sin
         saber que faltaba guardar la tarjeta. */
      await cargar();
      setTimeout(function(){
        var c=document.getElementById('cobro');
        if(c) c.scrollIntoView({behavior:'smooth',block:'center'});
        else window.scrollTo({top:0,behavior:'smooth'});
      }, 400);
    }catch(e){
      b.disabled=false; b.textContent=T('Firmar contrato');
      err.className='msg err'; err.textContent=e.message||T('No se pudo firmar. Inténtalo otra vez.');
    }
  };
}

async function cargar(){
  if(!TOKEN){ aviso(T('Falta el enlace'),T('Entra con el enlace que te mandamos por correo.')); return; }
  try{
    const j=await api({accion:'ver',token:TOKEN});
    NOMBRE_PLAN=await nombrePlan(j.contrato&&j.contrato.plan_slug);
    pinta(j.contrato);
  }catch(e){
    aviso(T('No encontramos ese contrato'), (e.message||'')+T('. Escríbenos y te mandamos uno nuevo.'));
  }
}
cargar();
</script>
</body></html>
