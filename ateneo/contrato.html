<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contrato · Ateneo de Virreyes</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1409;--card:#141c0e;--card2:#0b1207;--line:#2b3a1e;--txt:#f0f5e7;--muted:#9aa78c;--gold:#d8b25e;--green:#8cc63f}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.6}
.wrap{max-width:840px;margin:0 auto;padding:24px 18px 70px}
.top{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.top b{font-size:16px}.top span{color:var(--muted);font-size:13px}
.lead{color:var(--muted);font-size:14px;margin-bottom:16px}
.res{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 18px}
.res .p{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:132px}
.res .p i{display:block;font-style:normal;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.res .p b{font-size:17px;color:var(--gold)}
.doc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px 26px;max-height:58vh;overflow:auto}
.doc h2{font-size:20px;margin:18px 0 8px;color:var(--gold)}
.doc h3{font-size:17px;margin:16px 0 6px}
.doc h4{font-size:15px;margin:14px 0 6px;color:var(--gold)}
.doc h5{font-size:14px;margin:12px 0 4px}
.doc p{margin:7px 0;font-size:14px}
.doc ul{margin:6px 0 10px 18px}.doc li{font-size:14px;margin:3px 0}
.doc hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin-top:18px}
.box h4{font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:13px}
.g{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.g{grid-template-columns:1fr}}
label{display:block;font-size:12.5px;font-weight:600;margin-bottom:5px}
input,select{width:100%;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14px;font-family:'Inter'}
input:focus,select:focus{outline:none;border-color:var(--green)}
.chk{display:flex;gap:9px;align-items:flex-start;margin-top:15px;font-size:13.5px;color:#dbe6cd}
.chk input{width:auto;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--green);color:#16230c;font-weight:800;border:0;border-radius:11px;padding:13px 22px;font-size:15px;cursor:pointer;font-family:'Inter';margin-top:16px}
.btn[disabled]{opacity:.55;cursor:default}
.msg{display:none;margin-top:12px;padding:11px 13px;border-radius:9px;font-size:13.5px}
.msg.err{display:block;background:rgba(255,93,108,.12);border:1px solid #ff5d6c;color:#ffb4ba}
.ok{text-align:center;padding:34px 10px 18px}
.ok .tick{font-size:42px}.ok h1{font-size:22px;margin:10px 0 8px;color:var(--gold)}
.ok p{color:#dbe6cd;font-size:15px;max-width:540px;margin:0 auto}
.acuse{margin-top:20px;background:var(--card2);border:1px dashed var(--line);border-radius:12px;padding:16px 18px;font-size:12.5px;color:var(--muted);line-height:1.8}
.acuse b{color:var(--gold);letter-spacing:.06em}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(0,0,0,.25);border-top-color:#16230c;border-radius:50%;animation:g .7s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
.cargando{text-align:center;color:var(--muted);padding:60px 0}
.pie{margin-top:26px;color:var(--muted);font-size:12.5px;text-align:center}
</style><link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
</head><body>
<div class="wrap" id="app"><div class="cargando">Cargando tu contrato…</div></div>
<script>
const FN='https://rehophywchakfapivsbh.supabase.co/functions/v1/contrato';
const $=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dinero=n=>'$'+Number(n||0).toLocaleString('es-MX');
const TOKEN=new URLSearchParams(location.search).get('t')||'';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
let NOMBRE_PLAN='';
async function nombrePlan(slug){
  if(!slug) return '';
  try{
    const r=await fetch(SB_URL+'/rest/v1/ateneo_planes?slug=eq.'+encodeURIComponent(slug)+'&select=nombre',
      {headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    const j=await r.json();
    return (j&&j[0]&&j[0].nombre)||slug;
  }catch(_){ return slug; }
}

async function api(body){
  const r=await fetch(FN,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({error:'respuesta ilegible'}));
  if(!r.ok||j.error) throw new Error(j.error||'Algo falló');
  return j;
}

function aviso(t,x){
  $('app').innerHTML='<div class="ok"><div class="tick">📄</div><h1>'+esc(t)+'</h1><p>'+esc(x)+'</p>'
    +'<p class="pie">Ateneo de Virreyes · José María Izazaga 8, piso 1, Centro Histórico, CDMX · javi@casapepe.mx</p></div>';
}

function pinta(c){
  const cab='<div class="top"><b>Ateneo de Virreyes</b><span>· Contrato '+esc(c.folio)+'</span></div>';
  const res='<div class="res">'
    +'<div class="p"><i>Plan</i><b style="font-size:15px;color:var(--txt)">'+esc(NOMBRE_PLAN||c.plan_slug||'')+'</b></div>'
    +'<div class="p"><i>Primer pago</i><b>'+dinero(c.importe)+'</b></div>'
    +(c.meses?'<div class="p"><i>Vigencia</i><b>'+c.meses+' meses</b></div>':'')
    +'</div>';

  if(c.estado==='firmado'){
    const a=c.acuse||{};
    $('app').innerHTML=cab
      +'<div class="ok"><div class="tick">✅</div><h1>Contrato firmado</h1>'
      +'<p>Lo firmó '+esc(a.firmante||c.cliente||'')+' el '+esc(a.fecha_local||c.firmado_at||'')+'. Abajo queda el documento tal como se firmó; también te llegó por correo.</p></div>'
      +res+'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
      +'<div class="acuse"><b>ACUSE DE FIRMA ELECTRÓNICA</b><br>'
      +'Folio: '+esc(c.folio)+'<br>Firmó: '+esc(a.firmante||'')+'<br>'
      +'Fecha y hora: '+esc(a.fecha_local||'')+'<br>IP: '+esc(a.ip||'')+'<br>'
      +'Navegador: '+esc(String(a.ua||'').slice(0,120))+'</div>'
      +'<p class="pie">Ateneo de Virreyes · José María Izazaga 8, piso 1, Centro Histórico, CDMX</p>';
    return;
  }

  $('app').innerHTML=cab
    +'<p class="lead">Lee el contrato completo. Abajo completas los datos que faltan y lo firmas; te llega copia por correo.</p>'
    +res
    +'<div class="doc">'+(c.cuerpo_html||'')+'</div>'
    +'<div class="box"><h4>Datos para el contrato</h4><div class="g">'
      +'<div><label>Razón social o nombre completo</label><input id="f-cliente" value="'+esc(c.cliente||'')+'"></div>'
      +'<div><label>RFC</label><input id="f-rfc" value="'+esc(c.rfc||'')+'" placeholder="XAXX010101000"></div>'
      +'<div><label>Tipo</label><select id="f-tipo"><option value="Persona física">Persona física</option><option value="Persona moral">Persona moral</option></select></div>'
      +'<div><label>Representante legal</label><input id="f-rep" value="'+esc(c.representante||'')+'"></div>'
      +'<div><label>Domicilio fiscal</label><input id="f-dom" value="'+esc(c.domicilio||'')+'"></div>'
      +'<div><label>Actividad principal</label><input id="f-act" value="'+esc(c.actividad||'')+'"></div>'
      +'<div><label>Correo de facturación</label><input id="f-fact" type="email" value="'+esc(c.email||'')+'"></div>'
      +'<div><label>WhatsApp</label><input id="f-wa" value="'+esc(c.whatsapp||c.telefono||'')+'"></div>'
    +'</div>'
    +'<div class="chk"><input type="checkbox" id="f-ok"><label for="f-ok" style="font-weight:400">He leído el contrato completo y acepto sus términos. Entiendo que mi firma electrónica tiene la misma validez que una firma autógrafa.</label></div>'
    +'<div style="margin-top:14px;max-width:360px"><label>Escribe tu nombre completo para firmar</label><input id="f-firma" placeholder="Nombre y apellidos"></div>'
    +'<button class="btn" id="b-firmar">Firmar contrato</button>'
    +'<div class="msg" id="err"></div></div>'
    +'<p class="pie">Ateneo de Virreyes · José María Izazaga 8, piso 1, Centro Histórico, CDMX · ¿Dudas? WhatsApp 55 4930 5703</p>';

  $('b-firmar').onclick=async()=>{
    const err=$('err'); err.style.display='none';
    const v=i=>($(i).value||'').trim();
    if(!v('f-cliente')){err.className='msg err';err.textContent='Falta la razón social o tu nombre.';return;}
    if(!$('f-ok').checked){err.className='msg err';err.textContent='Marca la casilla de aceptación para poder firmar.';return;}
    if(v('f-firma').length<5){err.className='msg err';err.textContent='Escribe tu nombre completo para firmar.';return;}
    const b=$('b-firmar'); b.disabled=true; b.innerHTML='<span class="spin"></span> Firmando…';
    try{
      await api({accion:'firmar',token:TOKEN,
        cliente:v('f-cliente'),rfc:v('f-rfc'),tipo_persona:$('f-tipo').value,representante:v('f-rep'),
        domicilio:v('f-dom'),actividad:v('f-act'),email_facturacion:v('f-fact'),whatsapp:v('f-wa'),
        firmante:v('f-firma'),fecha_local:new Date().toLocaleString('es-MX')});
      cargar();
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){
      b.disabled=false; b.textContent='Firmar contrato';
      err.className='msg err'; err.textContent=e.message||'No se pudo firmar. Inténtalo otra vez.';
    }
  };
}

async function cargar(){
  if(!TOKEN){ aviso('Falta el enlace','Entra con el enlace que te mandamos por correo.'); return; }
  try{
    const j=await api({accion:'ver',token:TOKEN});
    NOMBRE_PLAN=await nombrePlan(j.contrato&&j.contrato.plan_slug);
    pinta(j.contrato);
  }catch(e){
    aviso('No encontramos ese contrato', (e.message||'')+'. Escríbenos y te mandamos uno nuevo.');
  }
}
cargar();
</script>
</body></html>
