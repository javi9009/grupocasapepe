<!doctype html><html lang="es"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Gestión Ateneo · Grupo Casa Pepe</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
:root{--bg:#0e1a08;--card:#13200c;--card2:#1a2a10;--line:#2c3d1c;--txt:#f3f8ea;--muted:#a7b894;--green:#8cc63f;--green2:#a6da5e;--gold:#f5c400;--red:#ff5d6c}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:'Inter',system-ui,sans-serif;font-size:14px}
.wrap{max-width:1100px;margin:0 auto;padding:18px}
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;border:1px solid transparent;font-family:'Inter'}
.btn-p{background:var(--green);color:#16230c}.btn-p:hover{background:var(--green2)}
.btn-o{background:transparent;border-color:var(--line);color:var(--txt)}.btn-o:hover{border-color:var(--green)}
.btn-v{background:rgba(140,198,63,.15);border:1px solid var(--green);color:var(--green2)}
.btn-x{background:rgba(255,93,108,.12);border:1px solid var(--red);color:#ff9aa4}
.btn-sm{font-size:12px;padding:6px 10px}
/* login */
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:380px;width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.gate h1{font-size:20px;margin-bottom:4px}.gate p.s{color:var(--muted);font-size:13px;margin-bottom:20px}
.fld{margin-bottom:14px}.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
.fld input{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:'Inter'}
.fld input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(31,157,85,.12)}
.msg{display:none;padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
.msg.err{display:block;background:rgba(255,93,108,.12);border:1px solid var(--red);color:#ffb4ba}
/* app */
#app{display:none}
.head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.head h1{font-size:20px}.head .who{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;flex-wrap:wrap}
.tab{padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--green2);border-bottom-color:var(--green)}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:120px}
.kpi .n{font-size:22px;font-weight:700}.kpi .l{font-size:11.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.card .t{font-weight:700;font-size:15px}
.card .sub{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.row{font-size:13px;margin:3px 0}.row b{color:var(--txt)}
.badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase;letter-spacing:.03em}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.lug-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.lug{border:1px solid var(--line);border-radius:10px;padding:10px 8px;text-align:center;cursor:pointer;background:var(--card);transition:.12s}
.lug:hover{border-color:var(--green)}
.lug.ocup{background:rgba(140,198,63,.16);border-color:var(--green)}
.lug .num{font-weight:700;font-size:14px}.lug .tp{font-size:10px;color:var(--muted);text-transform:uppercase}
.lug .oc{font-size:11px;color:var(--green2);font-weight:600;margin-top:3px;min-height:14px}
.sec-t{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 0 8px}
audio{width:100%;height:32px;margin-top:6px}
.empty{color:var(--muted);padding:30px;text-align:center}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:s 1s linear infinite;margin:40px auto}
@keyframes s{to{transform:rotate(360deg)}}
.calnav{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.calnav .rng{font-weight:700;font-size:15px}
.caltbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.caltbl{border-collapse:collapse;width:100%;font-size:12px;min-width:660px}
.caltbl th,.caltbl td{border:1px solid var(--line)}
.caltbl thead th{background:var(--card2);color:var(--muted);font-weight:600;padding:8px 6px;text-align:center;font-size:11.5px}
.caltbl thead th.today{color:var(--gold)}
.caltbl .lcell{background:var(--card2);padding:8px 10px;text-align:left;white-space:nowrap;position:sticky;left:0;z-index:1}
.caltbl .lcell b{font-size:13px}.caltbl .lcell .tp{font-size:10px;color:var(--muted);text-transform:uppercase}
.caltbl .cc{height:36px;min-width:76px;cursor:pointer;text-align:center;font-size:11px;color:#dce6cf}
.caltbl .cc:hover{background:rgba(140,198,63,.08)}
.caltbl .cc.occ{background:rgba(140,198,63,.22);color:var(--green2);font-weight:600}
.caltbl .cc.occ:hover{background:rgba(255,93,108,.18)}

/* Residencias modal */
.rmodal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.rmodal-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:470px;width:100%;max-height:90vh;overflow:auto}
.rmodal-card h3{font-size:18px;margin-bottom:12px}
.rm-row{display:flex;gap:10px}.rm-row .fld{flex:1}
.rmodal-card select,.rmodal-card input{width:100%;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:14px;font-family:'Inter'}
.rm-acts{display:flex;gap:8px;align-items:center;margin-top:14px}
</style></head><body>
<div class="gate" id="gate" style="display:none"><div class="gate-card">
  <h1>Gestión Ateneo</h1><p class="s">Acceso Grupo Casa Pepe · solo equipo autorizado</p>
  <div class="msg err" id="lmsg"></div>
  <div class="fld"><label>Correo</label><input id="email" type="email" placeholder="tu@correo.com" autocomplete="username"></div>
  <div class="fld"><label>Contraseña</label><input id="pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
  <button class="btn btn-p" id="loginBtn" style="width:100%;justify-content:center;padding:11px">Entrar</button>
</div></div>

<div id="app"><div class="wrap">
  <div class="head"><h1>🌿 Gestión del Ateneo de Virreyes</h1><div style="display:flex;gap:10px;align-items:center"><span class="who" id="who"></span><button class="btn btn-o btn-sm" id="reload">↻</button><button class="btn btn-o btn-sm" id="logout" style="display:none">Salir</button></div></div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="ocup">Ocupación</div><div class="tab" data-t="cowork">Coworking</div><div class="tab" data-t="resid">Residencias</div><div class="tab" data-t="cine">Cine / Teatro</div><div class="tab" data-t="verif">🎫 Verificar</div><div class="tab" data-t="incub">Incubathon</div>
  </div>
  <div id="view"><div class="spin"></div></div>
</div></div>

<div id="resmodal" class="rmodal" style="display:none">
 <div class="rmodal-card">
  <h3 id="rm-title">Nueva reserva</h3>
  <div class="msg err" id="rm-err" style="display:none"></div>
  <input type="hidden" id="rm-id">
  <div class="fld"><label>Nombre de la reserva</label><input id="rm-nombre" type="text" placeholder="Nombre y apellido"></div>
  <div class="rm-row"><div class="fld"><label>Email</label><input id="rm-email" type="email" placeholder="correo@ejemplo.com"></div><div class="fld"><label>Teléfono</label><input id="rm-tel" type="text" placeholder="55..."></div></div>
  <div class="rm-row"><div class="fld"><label>Entrada</label><input id="rm-ini" type="date"></div><div class="fld"><label>Salida</label><input id="rm-fin" type="date"></div></div>
  <div class="fld"><label>Habitación / cama (solo libres para esas fechas)</label><select id="rm-unit"></select></div>
  <div class="fld"><label>Notas</label><input id="rm-notas" type="text" placeholder="Opcional"></div>
  <div class="rm-acts"><button class="btn btn-x btn-sm" id="rm-del" style="display:none">Eliminar</button><span style="flex:1"></span><button class="btn btn-o btn-sm" id="rm-cancel">Cancelar</button><button class="btn btn-p btn-sm" id="rm-save">Guardar</button></div>
 </div>
</div>

<div id="evmodal" class="rmodal" style="display:none"><div class="rmodal-card">
  <h3 id="ev-title">Nuevo evento</h3>
  <div class="msg err" id="ev-err" style="display:none"></div>
  <input type="hidden" id="ev-id">
  <div class="fld"><label>Título</label><input id="ev-tit" type="text" placeholder="Nombre de la obra/función"></div>
  <div class="fld"><label>Subtítulo</label><input id="ev-sub" type="text" placeholder="Teatro · Funciones limitadas"></div>
  <div class="fld"><label>Descripción</label><textarea id="ev-desc" style="width:100%;min-height:70px;background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-family:'Inter';font-size:14px" placeholder="Sinopsis, autor, etc."></textarea></div>
  <div class="fld"><label>Foto / cartel</label><input id="ev-foto" type="file" accept="image/*"><div id="ev-fotoPrev"></div></div>
  <div class="rm-row"><div class="fld"><label>Precio (MXN)</label><input id="ev-precio" type="number" min="0" value="0"></div><div class="fld"><label>Cupo por función</label><input id="ev-cupo" type="number" min="1" value="16"></div></div>
  <div class="fld"><label>Pago</label>
    <label style="font-weight:400;display:block"><input type="checkbox" id="ev-online"> Pago en línea (Stripe)</label>
    <input id="ev-link" type="text" placeholder="https://buy.stripe.com/…" style="margin-top:6px">
    <label style="font-weight:400;display:block;margin-top:8px"><input type="checkbox" id="ev-taquilla"> Pago en taquilla</label>
  </div>
  <div class="fld"><label>Funciones (fecha · hora · cupo)</label><div id="ev-funcs"></div><button class="btn btn-o btn-sm" id="ev-addfunc" type="button" style="margin-top:6px">＋ Agregar función</button></div>
  <label style="font-weight:400;display:block;margin-top:4px"><input type="checkbox" id="ev-activo" checked> Visible en la web</label>
  <div class="rm-acts"><span style="flex:1"></span><button class="btn btn-o btn-sm" id="ev-cancel">Cancelar</button><button class="btn btn-p btn-sm" id="ev-save">Guardar evento</button></div>
</div></div>

<div id="codmodal" class="rmodal" style="display:none"><div class="rmodal-card">
  <h3 id="cod-title">Nuevo código</h3>
  <div class="msg err" id="cod-err" style="display:none"></div>
  <input type="hidden" id="cod-id">
  <div class="rm-row"><div class="fld"><label>Código</label><input id="cod-cod" type="text" placeholder="VERANO2026" autocapitalize="off"></div><div class="fld"><label>Tipo</label><select id="cod-tipo"><option value="cortesia">Cortesía (100%)</option><option value="porcentaje">% de descuento</option><option value="precio_especial">Precio especial</option></select></div></div>
  <div class="fld" id="cod-valwrap" style="display:none"><label id="cod-vallbl">Valor</label><input id="cod-val" type="number" min="0" value="0"></div>
  <div class="fld"><label>Aplica a eventos <span style="color:var(--muted);font-weight:400">(ninguno = todos)</span></label><div id="cod-eventos" style="max-height:120px;overflow:auto"></div></div>
  <div class="fld"><label>Aplica a funciones <span style="color:var(--muted);font-weight:400">(ninguna = todas)</span></label><div id="cod-funcs" style="max-height:150px;overflow:auto"></div></div>
  <div class="rm-row"><div class="fld"><label>Vence (opcional)</label><input id="cod-vence" type="date"></div><div class="fld"><label>Usos máx (opcional)</label><input id="cod-max" type="number" min="1"></div></div>
  <label style="font-weight:400;display:block;margin-top:4px"><input type="checkbox" id="cod-activo" checked> Activo</label>
  <div class="rm-acts"><span style="flex:1"></span><button class="btn btn-o btn-sm" id="cod-cancel">Cancelar</button><button class="btn btn-p btn-sm" id="cod-save">Guardar código</button></div>
</div></div>

<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const ALLOWED=['javi@casapepe.mx','alan.vrgr@gmail.com'];
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fd=s=>{try{return new Date(s).toLocaleDateString('es-MX',{day:'2-digit',month:'short'});}catch(e){return s||'';}};
let tab='ocup';
function tabFromHash(){const hh=(location.hash||'').replace('#','');return ['ocup','cowork','resid','cine','verif','incub'].includes(hh)?hh:null;}
function setActiveTab(){document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===tab));}

// Entra directo: el acceso lo controla el portal (grupocasapepe · usuarios). El panel lee con la llave pública.
async function boot(){ enter(); }
$('loginBtn').onclick=async()=>{
  const email=$('email').value.trim().toLowerCase(),pass=$('pass').value;
  if(!ALLOWED.includes(email)){$('lmsg').textContent='Este panel es solo para el equipo del Ateneo.';$('lmsg').style.display='block';return;}
  $('loginBtn').disabled=true;$('loginBtn').textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('loginBtn').disabled=false;$('loginBtn').textContent='Entrar';
  if(error){$('lmsg').textContent='Correo o contraseña incorrectos.';$('lmsg').style.display='block';return;}
  enter();
};
$('pass').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click();});
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload();};
$('reload').onclick=()=>render();
let entered=false;
async function enter(){$('gate').style.display='none';$('app').style.display='block';try{const {data:{user}}=await sb.auth.getUser();$('who').textContent=user?user.email:'';}catch(_){}if(entered){render();return;}entered=true;const ht=tabFromHash();if(ht){tab=ht;setActiveTab();}render();window.addEventListener('hashchange',()=>{const h=tabFromHash();if(h){tab=h;setActiveTab();render();}});}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');tab=t.dataset.t;render();});

function linkWeb(w){w=(w||'').trim();if(!w)return '—';if(w.charAt(0)==='@')return '<a href="https://instagram.com/'+encodeURIComponent(w.slice(1))+'" target="_blank" rel="noopener">📷 '+esc(w)+'</a>';var u=/^https?:\/\//.test(w)?w:'https://'+w;var ig=/instagram\.com/i.test(w);return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+(ig?'📷 ':'🌐 ')+esc(w)+'</a>';}
function estBadge(e){const m={inscrito:['#c9a227','Inscrito · por confirmar'],solicitud:['#e0a400','Solicitud'],pendiente_pago:['#e0a400','Pendiente pago'],confirmado:['#1f9d55','Confirmado'],confirmado_gratis:['#1f9d55','Confirmado gratis'],pagado:['#1f9d55','Pagado'],validado:['#1f9d55','Validado'],cancelado:['#e0483f','Cancelado'],en_lista:['#1f9d55','En lista'],reservado:['#1f9d55','Reservado'],taquilla:['#c9a227','Taquilla']}[e]||['#6b7a70',e||'—'];return '<span class="badge" style="background:'+m[0]+'1a;color:'+m[0]+'">'+m[1]+'</span>';}

async function render(){
  await stopQR();
  $('view').innerHTML='<div class="spin"></div>';
  try{ if(tab==='ocup')await vOcup(); else if(tab==='cowork')await vCowork(); else if(tab==='cine')await vCine(); else if(tab==='resid')await vResid(); else if(tab==='verif')await vVerificar(); else await vIncub(); }
  catch(e){$('view').innerHTML='<div class="empty">Error: '+esc(e.message||e)+'</div>';}
}

// ---- Ocupación (calendario semanal) ----
function mondayOf(d){d=new Date(d);const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);d.setHours(0,0,0,0);return d;}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
const DOW=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
let weekStart=mondayOf(new Date());
async function vOcup(){
  const days=[...Array(7)].map((_,i)=>{const d=new Date(weekStart);d.setDate(d.getDate()+i);return d;});
  const start=ymd(days[0]),end=ymd(days[6]),today=ymd(new Date());
  const [lr,ar]=await Promise.all([
    sb.from('ateneo_lugares').select('*').order('orden'),
    sb.from('ateneo_asignaciones').select('*').eq('estado','activa').lte('fecha_inicio',end).gte('fecha_fin',start)
  ]);
  if(lr.error)throw lr.error; if(ar.error)throw ar.error;
  const lug=lr.data,asig=ar.data;
  let h='<div class="calnav"><button class="btn btn-o btn-sm" id="wprev">‹ Semana</button><span class="rng">'+days[0].getDate()+'/'+(days[0].getMonth()+1)+' – '+days[6].getDate()+'/'+(days[6].getMonth()+1)+'</span><button class="btn btn-o btn-sm" id="wnext">Semana ›</button><button class="btn btn-o btn-sm" id="wtoday">Hoy</button></div>';
  h+='<div class="caltbl-wrap"><table class="caltbl"><thead><tr><th class="lcell" style="text-align:left">Lugar</th>'+days.map(d=>'<th class="'+(ymd(d)===today?'today':'')+'">'+DOW[(d.getDay()+6)%7]+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>').join('')+'</tr></thead><tbody>';
  lug.forEach(l=>{
    h+='<tr><td class="lcell"><b>'+esc(l.numero)+'</b><br><span class="tp">'+esc(l.tipo)+'</span></td>';
    days.forEach(d=>{const ds=ymd(d);const a=asig.find(x=>x.lugar_id===l.id&&x.fecha_inicio<=ds&&x.fecha_fin>=ds);
      if(a)h+='<td class="cc occ" data-aid="'+a.id+'" title="'+esc(a.ocupante)+' ('+a.fecha_inicio+'→'+a.fecha_fin+')">'+esc(a.ocupante).slice(0,9)+'</td>';
      else h+='<td class="cc" data-lug="'+l.id+'" data-num="'+esc(l.numero)+'" data-d="'+ds+'"></td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div><p style="color:var(--muted);font-size:12px;margin-top:10px">Clic en una celda vacía para <b>programar</b> un ocupante (con fecha de salida). Clic en una ocupada para liberarla.</p>';
  $('view').innerHTML=h;
  $('wprev').onclick=()=>{weekStart.setDate(weekStart.getDate()-7);render();};
  $('wnext').onclick=()=>{weekStart.setDate(weekStart.getDate()+7);render();};
  $('wtoday').onclick=()=>{weekStart=mondayOf(new Date());render();};
  document.querySelectorAll('.cc.occ').forEach(c=>c.onclick=async()=>{if(!confirm('¿Liberar esta asignación?'))return;const {error}=await sb.from('ateneo_asignaciones').delete().eq('id',c.dataset.aid);if(error){alert(error.message);return;}render();});
  document.querySelectorAll('.cc:not(.occ)').forEach(c=>c.onclick=async()=>{const ocu=prompt('Ocupante para '+c.dataset.num+' (desde '+c.dataset.d+'):');if(!ocu)return;const fin=prompt('¿Hasta qué fecha? (YYYY-MM-DD). Vacío = solo ese día:',c.dataset.d)||c.dataset.d;const {error}=await sb.from('ateneo_asignaciones').insert({lugar_id:c.dataset.lug,ocupante:ocu,fecha_inicio:c.dataset.d,fecha_fin:fin,estado:'activa'});if(error){alert(error.message);return;}render();});
}

// ---- Coworking ----
async function vCowork(){
  const {data,error}=await sb.from('ateneo_reservas').select('*').order('created_at',{ascending:false});
  if(error)throw error;
  if(!data.length){$('view').innerHTML='<div class="empty">Aún no hay solicitudes de coworking.</div>';return;}
  let h='<div class="grid">'+data.map(r=>'<div class="card"><div class="t">'+esc(r.empresa||r.nombre||'—')+'</div><div class="sub">'+esc(r.plan||r.espacio||'')+' · '+fd(r.created_at)+'</div>'
    +'<div class="row">👤 '+esc(r.persona_contacto||r.nombre||'')+' · <a href="mailto:'+esc(r.email)+'">'+esc(r.email)+'</a></div>'
    +(r.telefono?'<div class="row">📞 '+esc(r.telefono)+'</div>':'')
    +(r.domicilio?'<div class="row">📍 '+esc(r.domicilio)+'</div>':'')
    +(r.notas?'<div class="row" style="color:var(--muted)">'+esc(r.notas)+'</div>':'')

function renderEvFuncs(){
  const box=$('ev-funcs');

  box.querySelectorAll('.rm-row').forEach(rw=>{const i=+rw.dataset.i;
    rw.querySelector('.evf-fecha').onchange=e=>EVFUNCS[i].fecha=e.target.value;
    rw.querySelector('.evf-hora').onchange=e=>EVFUNCS[i].hora=e.target.value;
    rw.querySelector('.evf-cupo').onchange=e=>EVFUNCS[i].cupo=e.target.value?parseInt(e.target.value,10):null;
    rw.querySelector('.evf-del').onclick=()=>{ if(EVFUNCS[i].id) EVFUNCS[i]._del=true; else EVFUNCS.splice(i,1); renderEvFuncs(); };

function openEvento(e,orden,funcs){
  $('ev-title').textContent=e?'Editar evento':'Nuevo evento';
  $('ev-err').style.display='none';
  $('ev-id').value=e?e.id:'';
  $('ev-tit').value=e?(e.titulo||''):'';
  $('ev-sub').value=e?(e.subtitulo||''):'';
  $('ev-desc').value=e?(e.descripcion||''):'';
  $('ev-precio').value=e?e.precio:0;
  $('ev-cupo').value=e?(e.cupo_default||16):16;
  $('ev-online').checked=e?!!e.permite_online:true;
  $('ev-link').value=e?(e.pago_link||''):'';
  $('ev-taquilla').checked=e?!!e.permite_taquilla:false;
  $('ev-activo').checked=e?!!e.activo:true;
  EVFOTO=null; $('ev-foto').value='';
  $('ev-fotoPrev').innerHTML=(e&&e.foto_url)?'<img src="'+e.foto_url+'" style="height:60px;border-radius:6px;margin-top:6px">':'';
  EVORDEN=(typeof orden==='number')?orden:(e?e.orden:0);
  EVFUNCS=(funcs||[]).map(f=>({id:f.id,fecha:f.fecha,hora:(f.hora||'20:00'),cupo:f.cupo}));
  if(!EVFUNCS.length) EVFUNCS=[{fecha:'',hora:'20:00',cupo:null}];
  renderEvFuncs();
  $('evmodal').style.display='flex';
}
async function saveEvento(){
  const er=m=>{$('ev-err').textContent=m;$('ev-err').style.display='block';};
  const tit=$('ev-tit').value.trim(); if(!tit)return er('Escribe el título.');
  const online=$('ev-online').checked, link=$('ev-link').value.trim();
  if(online && !link) return er('Si es pago en línea, pega el link de Stripe (o desactiva pago en línea).');
  const row={titulo:tit,subtitulo:$('ev-sub').value.trim()||null,descripcion:$('ev-desc').value.trim()||null,precio:parseFloat($('ev-precio').value)||0,cupo_default:parseInt($('ev-cupo').value,10)||16,permite_online:online,pago_link:link||null,permite_taquilla:$('ev-taquilla').checked,activo:$('ev-activo').checked,orden:EVORDEN||0,updated_at:new Date().toISOString()};
  if(EVFOTO) row.foto_url=EVFOTO;
  const id=$('ev-id').value; let evId=id;
  if(id){ const {error}=await sb.from('ateneo_cine_eventos').update(row).eq('id',id); if(error)return er('No se pudo guardar: '+error.message); }
  else { const {data,error}=await sb.from('ateneo_cine_eventos').insert(row).select('id').single(); if(error)return er('No se pudo crear: '+error.message); evId=data.id; }
  for(const f of EVFUNCS){
    if(f._del){ if(f.id){ const d=await sb.from('ateneo_cine_funciones').delete().eq('id',f.id); if(d.error) alert('No se pudo borrar la función '+f.fecha+' (tiene reservas).'); } continue; }
    if(!f.fecha) continue;
    const fr={evento_id:evId,fecha:f.fecha,hora:f.hora||'20:00',cupo:(f.cupo!=null?f.cupo:null),activo:true};
    if(f.id){ await sb.from('ateneo_cine_funciones').update(fr).eq('id',f.id); }
    else { await sb.from('ateneo_cine_funciones').insert(fr); }
  }
  $('evmodal').style.display='none'; render();
}
// binds estáticos del modal de evento
$('ev-foto').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{EVFOTO=rd.result;$('ev-fotoPrev').innerHTML='<img src="'+EVFOTO+'" style="height:60px;border-radius:6px;margin-top:6px">';};rd.readAsDataURL(f);};
$('ev-addfunc').onclick=()=>{EVFUNCS.push({fecha:'',hora:'20:00',cupo:null});renderEvFuncs();};
$('ev-cancel').onclick=()=>{$('evmodal').style.display='none';};
$('ev-save').onclick=saveEvento;
$('evmodal').addEventListener('click',e=>{if(e.target.id==='evmodal')$('evmodal').style.display='none';});

// ---- Códigos de descuento / cortesía ----
let COD_EVS=[], COD_FS=[], COD_SELE=new Set(), COD_SELF=new Set();
function codTipoUI(){
  const t=$('cod-tipo').value;
  if(t==='cortesia'){ $('cod-valwrap').style.display='none'; }
  else { $('cod-valwrap').style.display=''; $('cod-vallbl').textContent = t==='porcentaje'?'% de descuento':'Precio especial (MXN por persona)'; }
}
function renderCodFuncs(){
  const evs = COD_SELE.size? [...COD_SELE] : COD_EVS.map(e=>e.id);
  const fs=COD_FS.filter(f=>evs.indexOf(f.evento_id)>=0);
  $('cod-funcs').innerHTML=fs.map(f=>{const e=COD_EVS.find(x=>x.id===f.evento_id);return '<label style="display:block;font-weight:400;font-size:13px"><input type="checkbox" class="cod-fn" value="'+f.id+'"'+(COD_SELF.has(f.id)?' checked':'')+'> '+esc((e?e.titulo+' · ':'')+f.fecha+' '+((f.hora||'').slice(0,5)))+'</label>';}).join('')||'<span style="color:var(--muted)">Sin funciones</span>';
  $('cod-funcs').querySelectorAll('.cod-fn').forEach(ch=>ch.onchange=()=>{ if(ch.checked)COD_SELF.add(ch.value); else COD_SELF.delete(ch.value); });
}
function renderCodEventos(){
  $('cod-eventos').innerHTML=COD_EVS.map(e=>'<label style="display:block;font-weight:400;font-size:13px"><input type="checkbox" class="cod-ev" value="'+e.id+'"'+(COD_SELE.has(e.id)?' checked':'')+'> '+esc(e.titulo)+'</label>').join('')||'<span style="color:var(--muted)">Sin eventos</span>';
  $('cod-eventos').querySelectorAll('.cod-ev').forEach(ch=>ch.onchange=()=>{ if(ch.checked)COD_SELE.add(ch.value); else COD_SELE.delete(ch.value); renderCodFuncs(); });
  renderCodFuncs();
}
function openCodigo(c,eventos,funciones){
  COD_EVS=eventos||[]; COD_FS=funciones||[];
  COD_SELE=new Set((c&&c.evento_ids)||[]); COD_SELF=new Set((c&&c.funcion_ids)||[]);
  $('cod-title').textContent=c?'Editar código':'Nuevo código';
  $('cod-err').style.display='none';
  $('cod-id').value=c?c.id:'';
  $('cod-cod').value=c?c.codigo:'';
  $('cod-tipo').value=c?c.tipo:'cortesia';
  $('cod-val').value=c?c.valor:0;
  $('cod-vence').value=(c&&c.vence)?c.vence:'';
  $('cod-max').value=(c&&c.usos_max)?c.usos_max:'';
  $('cod-activo').checked=c?!!c.activo:true;
  codTipoUI(); renderCodEventos();
  $('codmodal').style.display='flex';
}
async function saveCodigo(){
  const er=m=>{$('cod-err').textContent=m;$('cod-err').style.display='block';};
  const codigo=$('cod-cod').value.trim(); if(!codigo)return er('Escribe el código.');
  const tipo=$('cod-tipo').value;
  const valor = tipo==='cortesia'?100:(parseFloat($('cod-val').value)||0);
  if(tipo!=='cortesia' && !(valor>0)) return er('Indica el valor del descuento o precio especial.');
  const eids=[...COD_SELE], fids=[...COD_SELF];
  const row={codigo,tipo,valor,evento_ids:eids.length?eids:null,funcion_ids:fids.length?fids:null,activo:$('cod-activo').checked,vence:$('cod-vence').value||null,usos_max:$('cod-max').value?parseInt($('cod-max').value,10):null,updated_at:new Date().toISOString()};
  const id=$('cod-id').value;
  const res = id ? await sb.from('ateneo_cine_codigos').update(row).eq('id',id) : await sb.from('ateneo_cine_codigos').insert(row);
  if(res.error){ return er(/duplicate|unique/i.test(res.error.message)?'Ya existe un código con ese nombre.':('No se pudo guardar: '+res.error.message)); }
  $('codmodal').style.display='none'; render();
}
$('cod-tipo').onchange=codTipoUI;
$('cod-cancel').onclick=()=>{$('codmodal').style.display='none';};
$('cod-save').onclick=saveCodigo;
$('codmodal').addEventListener('click',e=>{if(e.target.id==='codmodal')$('codmodal').style.display='none';});

async function vVerificar(){

   +'<div class="fld" style="margin-top:12px"><label>¿Sin cámara? Escribe el código</label><div style="display:flex;gap:6px"><input id="qr-man" type="text" placeholder="ERM-XXXXXX" autocapitalize="characters"><button class="btn btn-o btn-sm" id="qr-manbtn">Verificar</button></div></div>'

    else if(r&&r.motivo==='ya_usado'){ resEl.innerHTML='<div style="background:rgba(245,196,0,.16);border:1px solid #c9a227;border-radius:12px;padding:16px;color:#f0d98a"><div style="font-size:22px;font-weight:800">⚠️ Boleto YA USADO</div><div style="color:#e7eedb;font-size:14px;margin-top:6px">'+esc(r.evento||'')+'<br>Usado: '+esc(r.usado_at||'')+'</div></div>'; }
    else { resEl.innerHTML='<div style="background:rgba(255,93,108,.16);border:1px solid #ff5d6c;border-radius:12px;padding:16px;color:#ff9aa4"><div style="font-size:22px;font-weight:800">⛔ No válido</div><div style="color:#e7eedb;font-size:14px;margin-top:6px">Código no encontrado.</div></div>'; }

const RESID_ROOMS=[
 {hab:'102',tipo:'Dormitorio · 6 camas',camas:6},
 {hab:'103',tipo:'Privada · Bunk & Bed',camas:1},
 {hab:'104',tipo:'Litera · 2 camas',camas:2},
 {hab:'105',tipo:'Litera · 2 camas',camas:2},
 {hab:'106',tipo:'Litera · 2 camas',camas:2},
 {hab:'107',tipo:'Litera · 2 camas',camas:2},
 {hab:'108',tipo:'Dormitorio · 1 cama',camas:1},
 {hab:'109',tipo:'Taller',camas:1},
 {hab:'110',tipo:'Deluxe Queen · Residencia',camas:1},
 {hab:'111',tipo:'Taller',camas:1},
 {hab:'112',tipo:'Deluxe Queen · Residencia',camas:1},
 {hab:'113',tipo:'Taller',camas:1},
 {hab:'114',tipo:'Taller',camas:1},
 {hab:'115',tipo:'Taller',camas:1}
];
function residUnits(){var u=[];RESID_ROOMS.forEach(function(r){if(r.camas===1){u.push({key:r.hab,hab:r.hab,tipo:r.tipo,sub:''});}else{for(var i=1;i<=r.camas;i++)u.push({key:r.hab+'-'+i,hab:r.hab,tipo:r.tipo,sub:'Cama '+i});}});return u;}
var RESID_ALL=[];
var residStart=(function(){var d=new Date();d.setHours(0,0,0,0);return d;})();
var RESID_WIN=14;
function residColor(id){var h=0,x=String(id);for(var i=0;i<x.length;i++)h=(h*31+x.charCodeAt(i))%360;return 'hsl('+h+',42%,34%)';}
function residFree(unit,ini,fin,exId){return !RESID_ALL.some(function(r){return r.unidad===unit&&r.id!==exId&&(ini<r.fecha_fin&&fin>r.fecha_inicio);});}
function residAt(unit,ds){return RESID_ALL.find(function(r){return r.unidad===unit&&r.fecha_inicio<=ds&&ds<r.fecha_fin;});}
function addDays(ds,n){var d=new Date(ds+'T00:00:00');d.setDate(d.getDate()+n);return ymd(d);}
async function vResid(){
  const rr=await sb.from('ateneo_residencias_reservas').select('*').neq('estado','cancelada').order('fecha_inicio');
  if(rr.error)throw rr.error;
  RESID_ALL=rr.data||[];
  const units=residUnits();
  const days=[];for(var i=0;i<RESID_WIN;i++){var d=new Date(residStart);d.setDate(d.getDate()+i);days.push(d);}
  const today=ymd(new Date());
  var h='<div class="calnav"><button class="btn btn-p btn-sm" id="rNew">＋ Nueva reserva</button>'
    +'<button class="btn btn-o btn-sm" id="rPrev">‹ 2 sem</button><span class="rng">'+days[0].getDate()+'/'+(days[0].getMonth()+1)+' – '+days[RESID_WIN-1].getDate()+'/'+(days[RESID_WIN-1].getMonth()+1)+'</span><button class="btn btn-o btn-sm" id="rNext">2 sem ›</button><button class="btn btn-o btn-sm" id="rToday">Hoy</button>'
    +'<span style="color:var(--muted);font-size:12px;margin-left:auto">'+RESID_ALL.length+' reservas activas</span></div>';
  h+='<div class="caltbl-wrap"><table class="caltbl"><thead><tr><th class="lcell" style="text-align:left">Habitación</th>'
    +days.map(function(d){return '<th class="'+(ymd(d)===today?'today':'')+'">'+DOW[(d.getDay()+6)%7]+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>';}).join('')+'</tr></thead><tbody>';
  var lastHab=null;
  units.forEach(function(u){
    var ng=u.hab!==lastHab;lastHab=u.hab;
    h+='<tr'+(ng?' style="border-top:2px solid var(--line)"':'')+'><td class="lcell"><b>'+esc(u.hab)+'</b>'+(u.sub?' · '+esc(u.sub):'')+'<br><span class="tp">'+esc(u.tipo)+'</span></td>';
    var shown={};
    days.forEach(function(d){var ds=ymd(d);var r=residAt(u.key,ds);
      if(r){var first=!shown[r.id];shown[r.id]=true;h+='<td class="cc occ" style="background:'+residColor(r.id)+';color:#fff;border-color:rgba(0,0,0,.25)" data-rid="'+r.id+'" title="'+esc(r.nombre)+' ('+r.fecha_inicio+' → '+r.fecha_fin+')">'+(first?esc(r.nombre).slice(0,11):'·')+'</td>';}
      else h+='<td class="cc" data-unit="'+esc(u.key)+'" data-d="'+ds+'"></td>';});
    h+='</tr>';
  });
  h+='</tbody></table></div><p style="color:var(--muted);font-size:12px;margin-top:10px">Clic en una celda vacía para <b>crear</b> reserva · clic en una ocupada para <b>editar o mover</b> (cambia la habitación y guarda).</p>';
  $('view').innerHTML=h;
  $('rNew').onclick=function(){openResModal(null,null);};
  $('rPrev').onclick=function(){residStart.setDate(residStart.getDate()-RESID_WIN);render();};
  $('rNext').onclick=function(){residStart.setDate(residStart.getDate()+RESID_WIN);render();};
  $('rToday').onclick=function(){residStart=new Date();residStart.setHours(0,0,0,0);render();};
  document.querySelectorAll('#view .cc.occ').forEach(function(c){c.onclick=function(){var r=RESID_ALL.find(function(x){return x.id===c.dataset.rid;});if(r)openResModal(r,null);};});
  document.querySelectorAll('#view .cc:not(.occ)').forEach(function(c){c.onclick=function(){openResModal(null,{unidad:c.dataset.unit,fecha:c.dataset.d});};});
}
function residUnitOptions(selUnit,ini,fin,exId){
  var units=residUnits();var byHab={};units.forEach(function(u){(byHab[u.hab]=byHab[u.hab]||[]).push(u);});
  var canCheck=ini&&fin&&ini<fin;var html='';
  Object.keys(byHab).forEach(function(hab){
    var opts=byHab[hab].map(function(u){
      var free=!canCheck?true:residFree(u.key,ini,fin,exId);
      var isSel=(u.key===selUnit);
      if(!free&&!isSel)return '';
      var lbl=(u.sub?u.sub:('Habitación '+u.hab));
      return '<option value="'+esc(u.key)+'"'+(isSel?' selected':'')+'>'+esc(lbl)+'</option>';
    }).filter(Boolean).join('');
    if(opts)html+='<optgroup label="'+esc(hab+' · '+byHab[hab][0].tipo)+'">'+opts+'</optgroup>';
  });
  return html||'<option value="">(sin unidades libres para esas fechas)</option>';
}
function openResModal(r,prefill){
  var isEdit=!!r;
  var ini=r?r.fecha_inicio:((prefill&&prefill.fecha)?prefill.fecha:'');
  var fin=r?r.fecha_fin:((prefill&&prefill.fecha)?addDays(prefill.fecha,1):'');
  var unit=r?r.unidad:((prefill&&prefill.unidad)?prefill.unidad:'');
  $('rm-title').textContent=isEdit?'Editar reserva':'Nueva reserva';
  $('rm-id').value=r?r.id:'';
  $('rm-nombre').value=r?(r.nombre||''):'';
  $('rm-email').value=r?(r.email||''):'';
  $('rm-tel').value=r?(r.telefono||''):'';
  $('rm-ini').value=ini;$('rm-fin').value=fin;
  $('rm-notas').value=r?(r.notas||''):'';
  $('rm-del').style.display=isEdit?'inline-flex':'none';
  $('rm-err').style.display='none';
  $('rm-unit').innerHTML=residUnitOptions(unit,ini,fin,r?r.id:null);
  function refresh(){var cur=$('rm-unit').value||unit;$('rm-unit').innerHTML=residUnitOptions(cur,$('rm-ini').value,$('rm-fin').value,r?r.id:null);}
  $('rm-ini').onchange=refresh;$('rm-fin').onchange=refresh;
  $('resmodal').style.display='flex';
}
async function residSave(){
  var id=$('rm-id').value;
  var nombre=$('rm-nombre').value.trim(),ini=$('rm-ini').value,fin=$('rm-fin').value,unit=$('rm-unit').value;
  function er(m){$('rm-err').textContent=m;$('rm-err').style.display='block';}
  if(!nombre)return er('Escribe el nombre de la reserva.');
  if(!ini||!fin)return er('Indica entrada y salida.');
  if(fin<=ini)return er('La salida debe ser posterior a la entrada.');
  if(!unit)return er('Selecciona una habitación libre.');
  if(!residFree(unit,ini,fin,id||null))return er('Esa habitación no está libre en esas fechas.');
  var row={unidad:unit,habitacion:unit.split('-')[0],nombre:nombre,email:$('rm-email').value.trim()||null,telefono:$('rm-tel').value.trim()||null,fecha_inicio:ini,fecha_fin:fin,notas:$('rm-notas').value.trim()||null};
  var res=id?await sb.from('ateneo_residencias_reservas').update(row).eq('id',id):await sb.from('ateneo_residencias_reservas').insert(row);
  if(res.error)return er('No se pudo guardar: '+res.error.message);
  $('resmodal').style.display='none';render();
}
async function residDelete(){
  var id=$('rm-id').value;if(!id)return;
  if(!confirm('¿Eliminar esta reserva?'))return;
  var res=await sb.from('ateneo_residencias_reservas').delete().eq('id',id);
  if(res.error){alert(res.error.message);return;}
  $('resmodal').style.display='none';render();
}
$('rm-save').onclick=residSave;
$('rm-del').onclick=residDelete;
$('rm-cancel').onclick=function(){$('resmodal').style.display='none';};
$('resmodal').addEventListener('click',function(e){if(e.target.id==='resmodal')$('resmodal').style.display='none';});

// SSO opcional: si el portal manda la sesion, la aplica (no bloquea la entrada)
window.addEventListener('message',async(e)=>{
  if(e.origin!=='https://grupocasapepe.netlify.app') return;
  const d=e.data||{};
  if(d&&d.type==='cpp-session'&&d.access_token&&d.refresh_token){
    try{ const {error}=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token}); if(!error){ enter(); } }catch(_){}
  }
});
boot();
</script>
