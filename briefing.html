<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing semanal · Casa Pepe</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{--bg:#f4f1ea;--card:#fff;--txt:#1f1b16;--txt2:#6b6459;--txt3:#a49b8c;--bd:#e5e0d5;--accent:#137a56}
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:18px;max-width:900px;margin:0 auto}
  h1{font-size:21px;margin:0 0 2px}
  .sub{color:var(--txt2);font-size:13px;margin-bottom:14px}
  .ranges{display:flex;gap:8px;margin-bottom:14px}
  .rg{border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:7px 15px;font-size:13px;font-weight:700;cursor:pointer;color:inherit}
  .rg.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
  .kpi{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:13px 14px}
  .kpi .n{font-size:26px;font-weight:800;line-height:1}
  .kpi .l{font-size:12px;color:var(--txt2);margin-top:4px}
  .kpi.tot .n{color:var(--accent)}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden}
  th,td{text-align:left;padding:10px 12px;font-size:13px;border-bottom:1px solid var(--bd)}
  th{background:#efeae0;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--txt2)}
  tr:last-child td{border-bottom:none}
  .cat{font-weight:700;white-space:nowrap}
  .badge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:20px}
  .ab{background:#d6f3e6;color:#137a56}.ce{background:#e5e3dc;color:#6b6a64}
  .empty{padding:26px;text-align:center;color:var(--txt3)}
  .foot{margin-top:14px;color:var(--txt3);font-size:11px}
</style>
</head><body>
  <h1>&#128202; Briefing semanal</h1>
  <div class="sub" id="sub">Tickets levantados desde el chat del equipo</div>
  <div class="ranges">
    <button class="rg on" data-d="7">7 d&iacute;as</button>
    <button class="rg" data-d="14">14 d&iacute;as</button>
    <button class="rg" data-d="30">30 d&iacute;as</button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="tablewrap"><div class="empty">Cargando&hellip;</div></div>
  <div class="foot">Datos en vivo &middot; categor&iacute;as detectadas por Don Jos&eacute; en el Pepe Chat.</div>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SB_URL,SB_KEY);
const ICON={mantenimiento:'\u{1F527} Mantenimiento',mejora:'\u{1F4A1} Mejora',solicitud:'\u{1F4E9} Solicitud',incidencia:'\u{1F6CE}\u{FE0F} Incidencia',otro:'✨ Otro'};
let DIAS=7;
function esc(s){return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fdate(iso){ const d=new Date(iso); return d.toLocaleDateString('es-MX',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }
async function load(){
  const { data:{session} } = await sb.auth.getSession();
  if(!session){ document.getElementById('tablewrap').innerHTML='<div class="empty">Inicia sesión en Casa Pepe para ver el briefing.</div>'; document.getElementById('kpis').innerHTML=''; return; }
  document.getElementById('tablewrap').innerHTML='<div class="empty">Cargando…</div>';
  const { data, error } = await sb.rpc('briefing_semanal',{p_dias:DIAS});
  if(error){ document.getElementById('tablewrap').innerHTML='<div class="empty">'+(/direcc/i.test(error.message)?'Solo dirección puede ver el briefing.':'No se pudo cargar: '+esc(error.message))+'</div>'; document.getElementById('kpis').innerHTML=''; return; }
  const r = data||{};
  const pc = r.por_categoria||{};
  const kpis=[
    ['tot','Total tickets', r.total||0],
    ['','\u{1F527} Mantenimiento', pc.mantenimiento||0],
    ['','\u{1F4A1} Mejora', pc.mejora||0],
    ['','\u{1F4E9} Solicitud', pc.solicitud||0],
    ['','\u{1F6CE}\u{FE0F} Incidencia', pc.incidencia||0],
    ['','Abiertos / Cerrados', (r.abiertos||0)+' / '+(r.cerrados||0)]
  ];
  document.getElementById('kpis').innerHTML=kpis.map(k=>'<div class="kpi '+k[0]+'"><div class="n">'+k[2]+'</div><div class="l">'+k[1]+'</div></div>').join('');
  document.getElementById('sub').textContent='Tickets levantados desde el chat · últimos '+(r.dias||DIAS)+' días';
  const items=r.items||[];
  if(!items.length){ document.getElementById('tablewrap').innerHTML='<div class="empty">Sin tickets en este periodo \u{1F389}</div>'; return; }
  let h='<table><thead><tr><th>Fecha</th><th>Categoría</th><th>Título</th><th>Solicitante</th><th>Estado</th></tr></thead><tbody>';
  items.forEach(it=>{ h+='<tr><td>'+fdate(it.created_at)+'</td><td class="cat">'+(ICON[it.categoria]||esc(it.categoria))+'</td><td>'+esc(it.titulo)+'</td><td>'+esc(it.solicitante)+'</td><td><span class="badge '+(it.estado==='cerrado'?'ce':'ab')+'">'+(it.estado==='cerrado'?'Cerrado':'Abierto')+'</span></td></tr>'; });
  h+='</tbody></table>';
  document.getElementById('tablewrap').innerHTML=h;
}
document.querySelectorAll('.rg').forEach(b=>b.onclick=()=>{ DIAS=+b.dataset.d; document.querySelectorAll('.rg').forEach(x=>x.classList.toggle('on',x===b)); load(); });
load();
</script>
</body></html>
