<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesos · Grupo Casa Pepe</title>
<style>
:root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
header{background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
header h1{font-size:16px;margin:0;font-weight:600}
.muted{color:var(--muted);font-size:12px}
.wrap{display:flex;gap:0;height:calc(100vh - 50px)}
.side{width:300px;border-right:1px solid var(--line);overflow:auto;padding:10px}
.side input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
.uitem{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.uitem:hover{background:#1f1a13}
.uitem.on{background:#221a0e;border-color:var(--gold)}
.uitem b{display:block;font-size:13px}
.uitem span{font-size:11px;color:var(--muted)}
.main{flex:1;overflow:auto;padding:16px 20px}
.uhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.uhead h2{margin:0;font-size:18px;color:var(--gold2)}
.mailbox{display:flex;gap:6px;align-items:center}
.mailbox input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;min-width:220px}
.btn{background:var(--gold);color:#1a1206;border:0;border-radius:8px;padding:7px 11px;font-weight:600;cursor:pointer;font-size:12px}
.btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
.btn.green{background:#2c6b3a;color:#dff3e2}
.btn.red{background:#6b342c;color:#f3e0dd}
.appsec{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.appsec .h{background:#16120c;padding:10px 14px;font-weight:600;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
.appsec .h small{color:var(--muted);font-weight:400}
.area{padding:4px 14px}
.area .at{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:10px 0 4px}
.prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #241d14}
.prow .pn{flex:1;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{background:var(--panel2);color:var(--muted);border:0;padding:5px 11px;font-size:12px;cursor:pointer}
.seg button.on[data-v="none"]{background:#3a2a2a;color:#e6bfbf}
.seg button.on[data-v="ver"]{background:#23402a;color:#bfe6c4}
.seg button.on[data-v="editar"]{background:#3a2c12;color:var(--gold2)}
.empty{color:var(--muted);padding:30px;text-align:center}
.gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
.gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:340px;width:90%;text-align:center}
.gate h2{color:var(--gold2);margin:0 0 10px}
.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:10px}
.gate .err{color:var(--red);font-size:12px;min-height:14px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23402a;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60}
.toast.show{opacity:1}
/* Ámbito (proyectos) */
.ambito{margin:0 0 16px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ambito .h{background:#16120c;padding:10px 14px;font-weight:600;color:var(--gold2)}
.ambito .h small{color:var(--muted);font-weight:400;margin-left:8px}
.projgrid{display:flex;gap:8px;flex-wrap:wrap;padding:12px 14px}
.projchip{display:flex;align-items:center;gap:7px;padding:8px 13px;border:1px solid var(--line);border-radius:22px;background:var(--panel2);cursor:pointer;font-size:13px;user-select:none;opacity:.65}
.projchip.on{border-color:var(--gold);background:#221a0e;color:var(--gold2);opacity:1}
.projchip .dot{width:9px;height:9px;border-radius:50%;background:#3a3128}
.projchip.on .dot{background:var(--green)}
/* Solicitudes */
.solbox{margin:0 0 18px;border:1px solid #3f6043;border-radius:12px;overflow:hidden}
.solbox .h{background:#14210f;padding:10px 14px;font-weight:600;color:#bfe6c4}
.solrow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid #1c2a17;flex-wrap:wrap}
.solrow .info{flex:1;min-width:200px}
.solrow .info b{display:block;font-size:13px}
.solrow .info span{font-size:11px;color:var(--muted)}
.badge{background:#2c6b3a;color:#dff3e2;border-radius:20px;padding:1px 8px;font-size:11px;font-weight:700}
</style>
</head>
<body>
<div class="gate" id="gate" style="display:none">
<div class="box">
<h2>Accesos · admin</h2>
<p class="muted" id="gmsg">Inicia sesión con tu cuenta de administrador.</p>
<input type="email" id="lemail" placeholder="correo">
<input type="password" id="lpass" placeholder="contraseña">
<div class="err" id="lerr"></div>
<button class="btn" id="lbtn" style="width:100%">Entrar</button>
</div>
</div>

<header>
<h1>⚙ Configuración de Accesos</h1>
<span class="muted">1) Ámbito: en qué proyectos está · 2) Permisos: qué puede hacer</span>
<span style="flex:1"></span>
<span class="muted" id="me"></span>
</header>
<div class="wrap">
<div class="side">
<input type="search" id="q" placeholder="Buscar persona…">
<div id="solside"></div>
<div id="users"></div>
</div>
<div class="main" id="main"><div class="empty">Selecciona una persona de la izquierda.</div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=createClient(SB_URL,SB_KEY);
const ADMINS=['javi@casapepe.mx','contabilidad@casapepe.mx','administracion@casapepe.mx','administracion.puebla@casapepe.mx','hola.puebla@casapepe.mx'];
const APPS=[{k:'dashboard',n:'Dashboard (gerencia)'},{k:'soypepe',n:'Soy Pepe (colaboradores)'},{k:'huesped',n:'How to be a Mexican (huésped)'}];
// pantallas base que se activan al aprobar una solicitud
const DEFAULT_SOYPEPE=['COL-CHECADOR','COL-HORARIO','COL-COMIDAS','COL-PERFIL','COL-NOTIF','COL-CONFIG','COL-REPORTE','COL-VACACIONES','COL-BITACORA'];
const $=id=>document.getElementById(id);
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let ME='', PANT=[], USERS=[], ACC=[], SEL=null, PROJ=[], UP=[], SOL=[];
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#23402a':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

async function boot(){
const {data:{session}}=await sb.auth.getSession();
const email=(session&&session.user&&session.user.email||'').toLowerCase();
if(!email){return showGate('Inicia sesión con tu cuenta de administrador.');}
if(!ADMINS.includes(email)){return showGate('Tu cuenta ('+email+') no es administrador. Entra con una cuenta admin.');}
ME=email;$('me').textContent=ME;$('gate').style.display='none';
await load();
}
function showGate(msg){$('gate').style.display='flex';$('gmsg').textContent=msg;}
$('lbtn').onclick=async()=>{
$('lerr').textContent='';
const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});
if(error){$('lerr').textContent=error.message;return;}
boot();
};

async function load(){
const [m,e,a,p,u,s]=await Promise.all([
sb.from('modulos').select('codigo,nombre,area,area_orden,orden,app').not('app','is',null).order('area_orden').order('orden'),
sb.from('employees').select('id,nombre,apellido,nombre_display,puesto,area,email,estatus').order('nombre'),
sb.from('accesos').select('email,app,pantalla,nivel'),
sb.from('proyectos_catalogo').select('proyecto,nombre,emoji,orden').order('orden'),
sb.from('usuario_proyectos').select('employee_id,proyecto'),
sb.from('accesos_solicitudes').select('*').eq('estado','pendiente').order('created_at')
]);
PANT=m.data||[]; ACC=a.data||[]; PROJ=p.data||[]; UP=u.data||[]; SOL=s.data||[];
USERS=(e.data||[]).filter(x=>x.estatus!=='baja');
const have=new Set(USERS.map(x=>(x.email||'').toLowerCase()));
ADMINS.forEach(em=>{ if(!have.has(em)) USERS.push({nombre:em.split('@')[0],email:em,puesto:'cuenta',area:''}); });
renderSol();renderUsers();
}
function renderSol(){
$('solside').innerHTML = SOL.length
? `<div class="solbox"><div class="h">📥 Solicitudes de acceso <span class="badge">${SOL.length}</span></div>${SOL.map((s,i)=>`
<div class="solrow"><div class="info"><b>${esc(s.nombre||s.email)}</b><span>${esc(s.email)} · pide <b style="color:#bfe6c4">${esc(projName(s.proyecto))}</b>${s.mensaje?' · «'+esc(s.mensaje)+'»':''}</span></div>
<button class="btn green" data-ap="${i}">Aprobar</button><button class="btn red" data-rj="${i}">Rechazar</button></div>`).join('')}</div>` : '';
$('solside').querySelectorAll('[data-ap]').forEach(b=>b.onclick=()=>resolveSol(SOL[+b.dataset.ap],true));
$('solside').querySelectorAll('[data-rj]').forEach(b=>b.onclick=()=>resolveSol(SOL[+b.dataset.rj],false));
}
function projName(k){const p=PROJ.find(x=>x.proyecto===k);return p?(p.emoji+' '+p.nombre):k;}
async function resolveSol(s,ok){
if(ok){
// 1) localizar/emparejar empleado por email
let emp = USERS.find(u=>(u.email||'').toLowerCase()===s.email.toLowerCase() && u.id);
let empId = s.employee_id || (emp&&emp.id);
if(!empId){ toast('No hay empleado con ese correo. Dalo de alta primero en RH.',false); return; }
// 2) ámbito
const {error:e1}=await sb.from('usuario_proyectos').upsert({employee_id:empId,proyecto:s.proyecto,granted_by:ME},{onConflict:'employee_id,proyecto'});
if(e1) return toast('Error ámbito: '+e1.message,false);
// 3) permisos base SoyPepe
const rows=DEFAULT_SOYPEPE.map(p=>({email:s.email.toLowerCase(),app:'soypepe',pantalla:p,nivel:'ver',granted_by:ME,updated_at:new Date().toISOString()}));
const {error:e2}=await sb.from('accesos').upsert(rows,{onConflict:'email,app,pantalla'});
if(e2) return toast('Error permisos: '+e2.message,false);
}
const {error}=await sb.from('accesos_solicitudes').update({estado:ok?'aprobada':'rechazada',resuelto_at:new Date().toISOString(),resuelto_por:ME}).eq('id',s.id);
if(error) return toast('Error: '+error.message,false);
toast(ok?'Solicitud aprobada — ámbito y permisos base creados':'Solicitud rechazada');
await load();
}
function renderUsers(){
const q=$('q').value.trim().toLowerCase();
const list=USERS.filter(u=>!q||(`${u.nombre} ${u.apellido||''} ${u.nombre_display||''} ${u.email||''} ${u.puesto||''}`.toLowerCase().includes(q)));
$('users').innerHTML=list.map((u,i)=>`<div class="uitem ${SEL&&SEL._k===u.nombre+(u.email||'')?'on':''}" data-i="${USERS.indexOf(u)}">
<b>${esc(u.nombre_display||u.nombre)} ${esc(u.apellido||'')}</b><span>${esc(u.puesto||'')}${u.email?' · '+esc(u.email):' · sin correo'} · ${esc(ambitoStr(u))}</span></div>`).join('')||'<div class="empty">Sin resultados.</div>';
$('users').querySelectorAll('.uitem').forEach(el=>el.onclick=()=>selectUser(USERS[+el.dataset.i]));
}
function ambitoStr(u){
if(!u.id) return '';
const ps=UP.filter(x=>x.employee_id===u.id).map(x=>x.proyecto);
return ps.length? ps.join(' · ') : 'sin ámbito';
}
$('q').addEventListener('input',renderUsers);

function accOf(email,app,pant){const r=ACC.find(x=>x.email===email&&x.app===app&&x.pantalla===pant);return r?r.nivel:'none';}
function selectUser(u){
SEL=u; SEL._k=u.nombre+(u.email||''); renderUsers();
const m=$('main');
if(!u.email){
m.innerHTML=`<div class="uhead"><h2>${esc(u.nombre_display||u.nombre)} ${esc(u.apellido||'')}</h2></div>
<div class="empty">Esta persona no tiene correo. Asígnale uno para poder darle accesos:<br><br>
<span class="mailbox"><input id="setmail" type="email" placeholder="correo@casapepe.mx"><button class="btn" id="savemail">Guardar correo</button></span></div>`;
$('savemail').onclick=async()=>{
const em=$('setmail').value.trim().toLowerCase();if(!em)return;
const {error}=await sb.from('employees').update({email:em}).eq('id',u.id);
if(error)return toast('Error: '+error.message,false);
u.email=em;toast('Correo guardado');selectUser(u);
};
return;
}
let html=`<div class="uhead"><h2>${esc(u.nombre_display||u.nombre)} ${esc(u.apellido||'')}</h2><span class="muted">${esc(u.puesto||'')} · ${esc(u.email)}</span></div>`;
// ── Paso 1: Ámbito (multi-proyecto)
if(u.id){
const mine=new Set(UP.filter(x=>x.employee_id===u.id).map(x=>x.proyecto));
html+=`<div class="ambito"><div class="h">1 · Ámbito <small>proyectos cuyos DATOS puede ver — el selector de proyecto solo le mostrará estos</small></div>
<div class="projgrid">${PROJ.map(p=>`<span class="projchip ${mine.has(p.proyecto)?'on':''}" data-proj="${p.proyecto}"><span class="dot"></span>${p.emoji||''} ${esc(p.nombre)}</span>`).join('')}</div></div>`;
}else{
html+=`<div class="ambito"><div class="h">1 · Ámbito</div><div class="projgrid muted">Esta cuenta no es un empleado registrado en RH; no aplica ámbito.</div></div>`;
}
html+=`<div class="ambito" style="border-style:dashed;border-color:#241d14"><div class="h" style="background:transparent;color:var(--muted)">2 · Permisos por funcionalidad <small>encima del ámbito: qué puede hacer en cada pantalla</small></div></div>`;
APPS.forEach(app=>{
const pant=PANT.filter(p=>p.app===app.k);
html+=`<div class="appsec"><div class="h">${esc(app.n)} <small>${pant.length?pant.length+' pantallas':'por crear'}</small></div>`;
if(!pant.length){html+=`<div class="area"><div class="empty" style="padding:14px">Aún no hay pantallas para esta app.</div></div>`;}
else{
const byArea={};pant.forEach(p=>{(byArea[p.area]=byArea[p.area]||[]).push(p);});
Object.keys(byArea).forEach(ar=>{
html+=`<div class="area"><div class="at">${esc(ar)}</div>`;
byArea[ar].forEach(p=>{
const cur=accOf(u.email,app.k,p.codigo);
html+=`<div class="prow"><span class="pn">${esc(p.nombre)}</span>
<span class="seg" data-app="${app.k}" data-p="${esc(p.codigo)}">
${['none','ver','editar'].map(v=>`<button data-v="${v}" class="${cur===v?'on':''}">${v==='none'?'Sin acceso':v==='ver'?'Ver':'Editar'}</button>`).join('')}
</span></div>`;
});
html+=`</div>`;
});
}
html+=`</div>`;
});
m.innerHTML=html;
m.querySelectorAll('.projchip').forEach(ch=>ch.onclick=()=>toggleProj(u,ch));
m.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>setNivel(u.email,seg.dataset.app,seg.dataset.p,b.dataset.v,seg)));
}
async function toggleProj(u,ch){
const proj=ch.dataset.proj, on=ch.classList.contains('on');
if(on){
const mine=UP.filter(x=>x.employee_id===u.id);
if(mine.length<=1 && !confirm('Es su último proyecto: quedaría sin ámbito y sin datos en la app. ¿Quitar de todos modos?')) return;
const {error}=await sb.from('usuario_proyectos').delete().eq('employee_id',u.id).eq('proyecto',proj);
if(error)return toast('Error: '+error.message,false);
UP=UP.filter(x=>!(x.employee_id===u.id&&x.proyecto===proj));
ch.classList.remove('on');toast('Quitado de '+projName(proj));
}else{
const {error}=await sb.from('usuario_proyectos').upsert({employee_id:u.id,proyecto:proj,granted_by:ME},{onConflict:'employee_id,proyecto'});
if(error)return toast('Error: '+error.message,false);
UP.push({employee_id:u.id,proyecto:proj});
ch.classList.add('on');toast('Añadido a '+projName(proj));
}
renderUsers();
}
async function setNivel(email,app,pant,nivel,seg){
seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===nivel));
if(nivel==='none'){
const {error}=await sb.from('accesos').delete().eq('email',email).eq('app',app).eq('pantalla',pant);
if(error)return toast('Error: '+error.message,false);
ACC=ACC.filter(x=>!(x.email===email&&x.app===app&&x.pantalla===pant));
}else{
const row={email,app,pantalla:pant,nivel,granted_by:ME,updated_at:new Date().toISOString()};
const {error}=await sb.from('accesos').upsert(row,{onConflict:'email,app,pantalla'});
if(error)return toast('Error: '+error.message+' (¿eres admin?)',false);
const ex=ACC.find(x=>x.email===email&&x.app===app&&x.pantalla===pant);
if(ex)ex.nivel=nivel;else ACC.push(row);
}
toast('Guardado');
}
boot();
</script>

<script>
(function(){
var SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
var KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
var H={apikey:KEY,Authorization:'Bearer '+KEY};
function esc2(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]);});}
function selInfo(){
var main=document.getElementById('main'); if(!main) return {};
var t=main.innerText||'';
var em=(t.match(/[\w.+-]+@[\w.-]+\.[A-Za-z]{2,}/)||[''])[0];
var rm=t.match(/([A-Za-zÁÉÍÓÚáéíóúÑñ() ]{3,40})\s*[·.]\s*(?:[\w.+-]+@|sin correo)/i);
var role=rm?rm[1].trim():'';
var h2=main.querySelector('.uhead h2'); var nm=h2?(h2.textContent||'').trim():'';
if(!nm){ nm=(t.split('\n').map(function(s){return s.trim();}).filter(function(s){return s && s.indexOf('Cómo se ve')<0;})[0])||''; }
return {email:em, role:role, name:nm};
}
function inject(){
var main=document.getElementById('main'); if(!main) return;
if(!/@|sin correo/i.test(main.textContent)) return;
if(document.getElementById('verSoyPepe')) return;
var b=document.createElement('button'); b.id='verSoyPepe'; b.type='button';
b.textContent='📱 Cómo se ve su SoyPepe';
b.style.cssText='display:block;margin:14px 0;padding:12px 18px;border:0;border-radius:10px;background:#1d9e75;color:#fff;font-size:15px;font-weight:700;cursor:pointer';
b.onclick=openPrev;
main.insertBefore(b, main.firstChild);
}
function openPrev(){
if(document.getElementById('spPrevOv')) return;
var info=selInfo();
var ov=document.createElement('div'); ov.id='spPrevOv';
ov.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:99999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:14px';
var cap=document.createElement('div'); cap.style.cssText='color:#fff;font-size:13px;max-width:420px;text-align:center';
cap.textContent='Lo que '+(info.name||'el colaborador')+' tiene activado en su SoyPepe'+(info.email?(' · '+info.email):'');
var ph=document.createElement('div'); ph.style.cssText='width:390px;max-width:94vw;height:80vh;background:#16130f;border-radius:26px;overflow:auto;border:7px solid #111;box-shadow:0 10px 40px rgba(0,0,0,.5);color:#f3ead9;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif';
var body=document.createElement('div'); body.style.cssText='padding:16px 14px 28px'; body.innerHTML='<div style="text-align:center;color:#a99a82;padding:30px">Cargando…</div>';
ph.appendChild(body);
var cl=document.createElement('button'); cl.type='button'; cl.textContent='Cerrar'; cl.style.cssText='padding:10px 20px;border:0;border-radius:8px;background:#fff;color:#111;font-weight:700;cursor:pointer';
cl.onclick=function(){ ov.remove(); };
ov.appendChild(cap); ov.appendChild(ph); ov.appendChild(cl);
ov.addEventListener('click',function(e){ if(e.target===ov) ov.remove(); });
document.body.appendChild(ov);
if(!info.email){ body.innerHTML='<div style="text-align:center;color:#cf6a5a;padding:30px">Este colaborador no tiene correo asignado; no se pueden consultar sus accesos.</div>'; return; }
Promise.all([
fetch(SB+'/modulos?select=codigo,nombre,area,area_orden,orden&app=eq.soypepe&order=area_orden.asc,orden.asc',{headers:H}).then(function(r){return r.json();}),
fetch(SB+'/accesos?select=pantalla,nivel&app=eq.soypepe&email=eq.'+encodeURIComponent(info.email),{headers:H}).then(function(r){return r.json();})
]).then(function(res){
var mods=Array.isArray(res[0])?res[0]:[], acc=Array.isArray(res[1])?res[1]:[];
var lvl={}; acc.forEach(function(a){lvl[a.pantalla]=a.nivel;});
if(!mods.length){ body.innerHTML='<div style="text-align:center;color:#a99a82;padding:30px">No hay pantallas de SoyPepe configuradas.</div>'; return; }
var groups={}, order=[]; mods.forEach(function(m){ if(!groups[m.area]){groups[m.area]=[];order.push(m.area);} groups[m.area].push(m); });
var nAct=mods.filter(function(m){return lvl[m.codigo]&&lvl[m.codigo]!=='none';}).length;
var html='<div style="font-size:19px;font-weight:800;margin:2px 4px">📱 SoyPepe</div>';
html+='<div style="font-size:12px;color:#a99a82;margin:2px 4px 10px"><b style="color:#bfe6c4">'+nAct+'</b> de '+mods.length+' funciones activadas para este colaborador</div>';
order.forEach(function(ar){
html+='<div style="font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#a99a82;margin:14px 4px 6px">'+esc2(ar)+'</div>';
groups[ar].forEach(function(m){
var nv=lvl[m.codigo]||'none'; var on=nv!=='none';
var badge= on
? '<span style="background:#23402a;color:#bfe6c4;border:1px solid #3f6043;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600">'+(nv==='editar'?'Editar':'Activada')+'</span>'
: '<span style="background:#2a2320;color:#9a8c82;border:1px solid #34291c;border-radius:20px;padding:2px 10px;font-size:11px">Sin acceso</span>';
html+='<div style="display:flex;align-items:center;gap:10px;padding:11px 10px;border:1px solid '+(on?'#2c3a2c':'#241d14')+';border-radius:12px;margin:6px 0;background:'+(on?'rgba(35,64,42,.35)':'rgba(26,22,17,.5)')+';opacity:'+(on?'1':'.6')+'">'
+'<span style="font-size:16px">'+(on?'✅':'🔒')+'</span>'
+'<span style="flex:1;font-size:14px;font-weight:600">'+esc2(m.nombre)+'</span>'+badge+'</div>';
});
});
body.innerHTML=html;
}).catch(function(e){ body.innerHTML='<div style="text-align:center;color:#cf6a5a;padding:30px">No se pudo cargar: '+esc2(e&&e.message||'error')+'</div>'; });
}
try{ var m=document.getElementById('main'); if(m){ new MutationObserver(inject).observe(m,{childList:true,subtree:true}); } }catch(e){}
setInterval(inject,1500);
})();
</script>
