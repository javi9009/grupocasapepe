<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Accesos · Grupo Casa Pepe</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:16px;margin:0;font-weight:600}
  .muted{color:var(--muted);font-size:12px}
  .wrap{display:flex;gap:0;height:calc(100vh - 50px)}
  .side{width:300px;border-right:1px solid var(--line);overflow:auto;padding:10px}
  .side input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;margin-bottom:8px}
  .uitem{padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent}
  .uitem:hover{background:#1f1a13}
  .uitem.on{background:#221a0e;border-color:var(--gold)}
  .uitem b{display:block;font-size:13px}
  .uitem span{font-size:11px;color:var(--muted)}
  .main{flex:1;overflow:auto;padding:16px 20px}
  .uhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .uhead h2{margin:0;font-size:18px;color:var(--gold2)}
  .mailbox{display:flex;gap:6px;align-items:center}
  .mailbox input{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12px;min-width:220px}
  .btn{background:var(--gold);color:#1a1206;border:0;border-radius:8px;padding:7px 11px;font-weight:600;cursor:pointer;font-size:12px}
  .btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
  .appsec{margin:16px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .appsec .h{background:#16120c;padding:10px 14px;font-weight:600;color:var(--gold2);display:flex;justify-content:space-between;align-items:center}
  .appsec .h small{color:var(--muted);font-weight:400}
  .area{padding:4px 14px}
  .area .at{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:10px 0 4px}
  .prow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #241d14}
  .prow .pn{flex:1;font-size:13px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel2);color:var(--muted);border:0;padding:5px 11px;font-size:12px;cursor:pointer}
  .seg button.on[data-v="none"]{background:#3a2a2a;color:#e6bfbf}
  .seg button.on[data-v="ver"]{background:#23402a;color:#bfe6c4}
  .seg button.on[data-v="editar"]{background:#3a2c12;color:var(--gold2)}
  .empty{color:var(--muted);padding:30px;text-align:center}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px;max-width:340px;width:90%;text-align:center}
  .gate h2{color:var(--gold2);margin:0 0 10px}
  .gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:10px}
  .gate .err{color:var(--red);font-size:12px;min-height:14px}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23402a;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="gate" id="gate" style="display:none">
  <div class="box">
    <h2>Accesos · admin</h2>
    <p class="muted" id="gmsg">Inicia sesión con tu cuenta de administrador.</p>
    <input type="email" id="lemail" placeholder="correo">
    <input type="password" id="lpass" placeholder="contraseña">
    <div class="err" id="lerr"></div>
    <button class="btn" id="lbtn" style="width:100%">Entrar</button>
  </div>
</div>

<header>
  <h1>⚙ Configuración de Accesos</h1>
  <span class="muted">Quién entra a qué (Dashboard · Soypepe · Huésped) y con qué nivel</span>
  <span style="flex:1"></span>
  <span class="muted" id="me"></span>
</header>
<div class="wrap">
  <div class="side">
    <input type="search" id="q" placeholder="Buscar persona…">
    <div id="users"></div>
  </div>
  <div class="main" id="main"><div class="empty">Selecciona una persona de la izquierda.</div></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=createClient(SB_URL,SB_KEY);
const ADMINS=['javi@casapepe.mx','contabilidad@casapepe.mx','administracion@casapepe.mx','administracion.puebla@casapepe.mx'];
const APPS=[{k:'dashboard',n:'Dashboard (gerencia)'},{k:'soypepe',n:'Soy Pepe (colaboradores)'},{k:'huesped',n:'How to be a Mexican (huésped)'}];
const $=id=>document.getElementById(id);
const arr=v=>Array.isArray(v)?v:[];
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let ME='', PANT=[], USERS=[], ACC=[], SEL=null;
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#23402a':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const email=(session&&session.user&&session.user.email||'').toLowerCase();
  if(!email){return showGate('Inicia sesión con tu cuenta de administrador.');}
  if(!ADMINS.includes(email)){return showGate('Tu cuenta ('+email+') no es administrador. Entra con una cuenta admin.');}
  ME=email;$('me').textContent=ME;$('gate').style.display='none';
  await load();
}
function showGate(msg){$('gate').style.display='flex';$('gmsg').textContent=msg;}
$('lbtn').onclick=async()=>{
  $('lerr').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});
  if(error){$('lerr').textContent=error.message;return;}
  boot();
};

async function load(){
  const [m,e,a]=await Promise.all([
    sb.from('modulos').select('codigo,nombre,area,area_orden,orden,app').not('app','is',null).order('area_orden').order('orden'),
    sb.from('employees').select('nombre,apellido,puesto,area,email,estatus').order('nombre'),
    sb.from('accesos').select('email,app,pantalla,nivel')
  ]);
  PANT=m.data||[]; ACC=a.data||[];
  USERS=(e.data||[]).filter(u=>u.estatus!=='baja');
  // añade admins/cuentas que no estén como empleado
  const have=new Set(USERS.map(u=>(u.email||'').toLowerCase()));
  ADMINS.forEach(em=>{ if(!have.has(em)) USERS.push({nombre:em.split('@')[0],email:em,puesto:'cuenta',area:''}); });
  renderUsers();
}
function renderUsers(){
  const q=$('q').value.trim().toLowerCase();
  const list=USERS.filter(u=>!q||(`${u.nombre} ${u.apellido||''} ${u.email||''} ${u.puesto||''}`.toLowerCase().includes(q)));
  $('users').innerHTML=list.map((u,i)=>`<div class="uitem ${SEL&&SEL._k===u.nombre+(u.email||'')?'on':''}" data-i="${USERS.indexOf(u)}">
     <b>${esc(u.nombre)} ${esc(u.apellido||'')}</b><span>${esc(u.puesto||'')}${u.email?' · '+esc(u.email):' · sin correo'}</span></div>`).join('')||'<div class="empty">Sin resultados.</div>';
  $('users').querySelectorAll('.uitem').forEach(el=>el.onclick=()=>selectUser(USERS[+el.dataset.i]));
}
$('q').addEventListener('input',renderUsers);

function accOf(email,app,pant){const r=ACC.find(x=>x.email===email&&x.app===app&&x.pantalla===pant);return r?r.nivel:'none';}
function selectUser(u){
  SEL=u; SEL._k=u.nombre+(u.email||''); renderUsers();
  const m=$('main');
  if(!u.email){
    m.innerHTML=`<div class="uhead"><h2>${esc(u.nombre)} ${esc(u.apellido||'')}</h2></div>
      <div class="empty">Esta persona no tiene correo. Asígnale uno para poder darle accesos:<br><br>
      <span class="mailbox"><input id="setmail" type="email" placeholder="correo@casapepe.mx"><button class="btn" id="savemail">Guardar correo</button></span></div>`;
    $('savemail').onclick=async()=>{
      const em=$('setmail').value.trim().toLowerCase();if(!em)return;
      const {error}=await sb.from('employees').update({email:em}).eq('nombre',u.nombre);
      if(error)return toast('Error: '+error.message,false);
      u.email=em;toast('Correo guardado');selectUser(u);
    };
    return;
  }
  let html=`<div class="uhead"><h2>${esc(u.nombre)} ${esc(u.apellido||'')}</h2><span class="muted">${esc(u.puesto||'')} · ${esc(u.email)}</span></div>`;
  APPS.forEach(app=>{
    const pant=PANT.filter(p=>p.app===app.k);
    html+=`<div class="appsec"><div class="h">${esc(app.n)} <small>${pant.length?pant.length+' pantallas':'por crear'}</small></div>`;
    if(!pant.length){html+=`<div class="area"><div class="empty" style="padding:14px">Aún no hay pantallas para esta app.</div></div>`;}
    else{
      const byArea={};pant.forEach(p=>{(byArea[p.area]=byArea[p.area]||[]).push(p);});
      Object.keys(byArea).forEach(ar=>{
        html+=`<div class="area"><div class="at">${esc(ar)}</div>`;
        byArea[ar].forEach(p=>{
          const cur=accOf(u.email,app.k,p.codigo);
          html+=`<div class="prow"><span class="pn">${esc(p.nombre)}</span>
            <span class="seg" data-app="${app.k}" data-p="${esc(p.codigo)}">
              ${['none','ver','editar'].map(v=>`<button data-v="${v}" class="${cur===v?'on':''}">${v==='none'?'Sin acceso':v==='ver'?'Ver':'Editar'}</button>`).join('')}
            </span></div>`;
        });
        html+=`</div>`;
      });
    }
    html+=`</div>`;
  });
  m.innerHTML=html;
  m.querySelectorAll('.seg').forEach(seg=>seg.querySelectorAll('button').forEach(b=>b.onclick=()=>setNivel(u.email,seg.dataset.app,seg.dataset.p,b.dataset.v,seg)));
}
async function setNivel(email,app,pant,nivel,seg){
  seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===nivel));
  if(nivel==='none'){
    const {error}=await sb.from('accesos').delete().eq('email',email).eq('app',app).eq('pantalla',pant);
    if(error)return toast('Error: '+error.message,false);
    ACC=ACC.filter(x=>!(x.email===email&&x.app===app&&x.pantalla===pant));
  }else{
    const row={email,app,pantalla:pant,nivel,granted_by:ME,updated_at:new Date().toISOString()};
    const {error}=await sb.from('accesos').upsert(row,{onConflict:'email,app,pantalla'});
    if(error)return toast('Error: '+error.message+' (¿eres admin?)',false);
    const ex=ACC.find(x=>x.email===email&&x.app===app&&x.pantalla===pant);
    if(ex)ex.nivel=nivel;else ACC.push(row);
  }
  toast('Guardado');
}
boot();
</script>
</body>
</html>
