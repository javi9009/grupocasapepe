<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intake · Casa Pepe</title>
<style>
  :root{ --bg:#0f0e0c; --card:#1a1815; --line:#2c2824; --txt:#f4efe6; --mut:#a89e8c; --gold:#c9a84a; --ok:#4ea36b; --err:#c9584a; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased;padding:16px}
  .wrap{max-width:520px;margin:0 auto}
  h1{font-size:20px;margin:6px 0 2px} .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}
  label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
  select,input[type=text],textarea{width:100%;background:#141210;border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:12px;font-size:16px;outline:none}
  select:focus,input:focus,textarea:focus{border-color:var(--gold)}
  textarea{min-height:60px;resize:vertical}
  .drop{margin-top:14px;border:1.5px dashed #3a352e;border-radius:14px;padding:24px 14px;text-align:center;color:var(--mut);cursor:pointer;transition:.15s}
  .drop.hot{border-color:var(--gold);background:#151310;color:var(--txt)}
  .drop b{color:var(--gold)}
  .files{margin-top:10px;font-size:13px}
  .frow{display:flex;justify-content:space-between;gap:8px;padding:8px 10px;background:#141210;border:1px solid var(--line);border-radius:8px;margin-top:6px}
  .frow .st{color:var(--mut)} .frow .st.ok{color:var(--ok)} .frow .st.err{color:var(--err)}
  button{width:100%;margin-top:16px;background:var(--gold);color:#241f10;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.5}
  .note{color:var(--mut);font-size:12px;text-align:center;margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <h1>Subir archivos · Casa Pepe</h1>
  <p class="sub">Estados de cuenta, reportes, exports… van a la nube (Supabase), no a ninguna computadora.</p>
  <div class="card">
    <label>Área</label>
    <select id="area">
      <option value="finanzas">Finanzas (conciliación, estados de cuenta, QB)</option>
      <option value="socios">Socios (datos de Roberto)</option>
      <option value="rh">RH</option>
      <option value="soypepe">SoyPepe</option>
      <option value="tours">Tours &amp; Experiencias</option>
      <option value="ateneo">Ateneo Virreyes</option>
      <option value="marca">Marca &amp; Diseño</option>
      <option value="huespedes">App de huéspedes</option>
      <option value="otro">Otro</option>
    </select>
    <label>Tu nombre (opcional)</label>
    <input type="text" id="quien" placeholder="Ej. Roberto">
    <label>Nota (opcional)</label>
    <textarea id="nota" placeholder="Ej. Estado de cuenta Banorte julio"></textarea>
    <div class="drop" id="drop">Arrastra archivos aquí o <b>toca para elegir</b><input type="file" id="file" multiple hidden></div>
    <div class="files" id="list"></div>
    <button id="go" disabled>Subir</button>
  </div>
  <p class="note">Se guarda cifrado en Supabase. Claude los lee desde ahí para trabajarlos.</p>
</div>
<script>
const SUPA="https://rehophywchakfapivsbh.supabase.co";
const KEY="sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO";
const drop=document.getElementById('drop'), fileEl=document.getElementById('file'),
      list=document.getElementById('list'), go=document.getElementById('go');
let files=[];
function render(){
  list.innerHTML='';
  files.forEach((f,i)=>{
    const d=document.createElement('div'); d.className='frow';
    d.innerHTML='<span>'+f.name+'</span><span class="st" id="st'+i+'">'+(f._s||(Math.round(f.size/1024)+' KB'))+'</span>';
    list.appendChild(d);
  });
  go.disabled=files.length===0;
}
drop.onclick=()=>fileEl.click();
fileEl.onchange=e=>{files=files.concat([...e.target.files]);render();};
['dragover','dragenter'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('hot');}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('hot');}));
drop.addEventListener('drop',e=>{files=files.concat([...e.dataTransfer.files]);render();});
function slug(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9._-]+/g,'_');}
go.onclick=async()=>{
  go.disabled=true;
  const area=document.getElementById('area').value;
  const quien=document.getElementById('quien').value||null;
  const nota=document.getElementById('nota').value||null;
  const now=new Date().toISOString().slice(0,10);
  for(let i=0;i<files.length;i++){
    const f=files[i]; const st=document.getElementById('st'+i);
    const path=area+'/'+now+'_'+Date.now()+'_'+slug(f.name);
    st.textContent='subiendo…'; st.className='st';
    try{
      const up=await fetch(SUPA+'/storage/v1/object/intake/'+encodeURIComponent(path),{
        method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'x-upsert':'true','Content-Type':f.type||'application/octet-stream'},body:f});
      if(!up.ok) throw new Error('storage '+up.status);
      await fetch(SUPA+'/rest/v1/intake_registro',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},
        body:JSON.stringify({area,archivo:f.name,path,subido_por:quien,nota})});
      st.textContent='✓ listo'; st.className='st ok';
    }catch(err){ st.textContent='✗ error'; st.className='st err'; }
  }
  go.textContent='Subir más'; go.disabled=false; files=[];
};
</script>
</body>
</html>
