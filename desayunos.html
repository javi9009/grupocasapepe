<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desayunos · Casa Pepe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#EDEFF1; --surface:#FFFFFF; --surface-2:#E4E8EB; --surface-3:#F5F7F8;
  --ink:#14181C; --ink-2:#3A434B; --muted:#5A646E; --faint:#8A939C;
  --rule:#D3D9DE; --rule-2:#BEC7CE;
  --accent:#0F6E63; --accent-soft:#DCEAE7; --on-accent:#FFFFFF;
  --ok:#1D6B4A;  --ok-bg:#DFEDE6;
  --warn:#8C6212; --warn-bg:#F2E9D8;
  --bad:#9E3B2E;  --bad-bg:#F3E1DE;
  --none:#66707A; --none-bg:#E6EAED;
  --info:#2A5B7E; --info-bg:#DEE8EF;
  --sev1:#1D6B4A; --sev1-bg:#E6F2EC;
  --sev2:#8C6212; --sev2-bg:#F5EBD9;
  --sev3:#A8402F; --sev3-bg:#F6E2DE;
  --sev4:#7E1D12; --sev4-bg:#F0CFC9;
  --shadow:0 1px 1px rgba(20,24,28,.04), 0 10px 26px -20px rgba(20,24,28,.45);
  --rojo-fuerte:#A31810; --rojo-suave:#F7DDD9; --rojo-suave-b:#E0A79E; --rojo-suave-t:#8C463C;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#0E1114; --surface:#171B1F; --surface-2:#1F252A; --surface-3:#13171A;
  --ink:#E7EBEF; --ink-2:#C2CAD1; --muted:#98A2AC; --faint:#6D7780;
  --rule:#282F35; --rule-2:#39424A;
  --accent:#57C5B6; --accent-soft:#122A28; --on-accent:#0E1114;
  --ok:#69C89C; --ok-bg:#12261D; --warn:#D6A34E; --warn-bg:#2A2113;
  --bad:#DE8073; --bad-bg:#2B1815; --none:#98A2AC; --none-bg:#1F252A;
  --info:#7FB2D6; --info-bg:#13212B;
  --sev1:#7BD1A4; --sev1-bg:#12291F;
  --sev2:#D6A34E; --sev2-bg:#2C2214;
  --sev3:#E38071; --sev3-bg:#2E1815;
  --sev4:#F2705A; --sev4-bg:#3C1611;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
  --rojo-fuerte:#C4342A; --rojo-suave:#3A1C18; --rojo-suave-b:#5C302A; --rojo-suave-t:#C99A91;
}}
:root[data-theme="dark"]{
  --ground:#0E1114; --surface:#171B1F; --surface-2:#1F252A; --surface-3:#13171A;
  --ink:#E7EBEF; --ink-2:#C2CAD1; --muted:#98A2AC; --faint:#6D7780;
  --rule:#282F35; --rule-2:#39424A;
  --accent:#57C5B6; --accent-soft:#122A28; --on-accent:#0E1114;
  --ok:#69C89C; --ok-bg:#12261D; --warn:#D6A34E; --warn-bg:#2A2113;
  --bad:#DE8073; --bad-bg:#2B1815; --none:#98A2AC; --none-bg:#1F252A;
  --info:#7FB2D6; --info-bg:#13212B;
  --sev1:#7BD1A4; --sev1-bg:#12291F;
  --sev2:#D6A34E; --sev2-bg:#2C2214;
  --sev3:#E38071; --sev3-bg:#2E1815;
  --sev4:#F2705A; --sev4-bg:#3C1611;
  --shadow:0 1px 1px rgba(0,0,0,.5), 0 10px 26px -20px rgba(0,0,0,.9);
  --rojo-fuerte:#C4342A; --rojo-suave:#3A1C18; --rojo-suave-b:#5C302A; --rojo-suave-t:#C99A91;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Public Sans",system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;margin:0;letter-spacing:-.012em;text-wrap:balance}
h1{font-size:1.5rem;font-weight:700;line-height:1.15}
h2{font-size:1.2rem;font-weight:700;line-height:1.2}
p{margin:0}
.mono,.n,th,.chip,.eyebrow{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace}
.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.eyebrow{font-size:.66rem;text-transform:uppercase;letter-spacing:.15em;font-weight:600;color:var(--faint)}

.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;padding:13px 22px;display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.brand{display:flex;flex-direction:column;gap:1px;margin-right:auto}
.brand b{font-family:Fraunces,Georgia,serif;font-size:1.02rem;font-weight:700}
.seg{display:flex;border:1px solid var(--rule-2);border-radius:5px;overflow:hidden;background:var(--surface-3)}
.seg button{appearance:none;border:0;background:none;font:inherit;font-size:.82rem;padding:7px 13px;
  color:var(--muted);cursor:pointer;white-space:nowrap;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--surface-2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn{appearance:none;font:inherit;font-size:.82rem;font-weight:600;border-radius:5px;cursor:pointer;
  padding:8px 15px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);
  font-family:"IBM Plex Mono",monospace}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default;filter:none}

.secnav{position:sticky;top:56px;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 22px;display:flex;gap:2px;overflow-x:auto}
.secnav button{appearance:none;border:0;background:none;font:inherit;font-size:.88rem;padding:12px 14px;
  color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav .badge{display:inline-block;margin-left:6px;font-family:"IBM Plex Mono",monospace;font-size:.68rem;
  background:var(--bad-bg);color:var(--bad);border-radius:20px;padding:1px 6px;font-weight:600}

main{max-width:1180px;margin:0 auto;padding:24px 22px 90px;display:flex;flex-direction:column;gap:24px}

/* tira del mes */
.mes{display:flex;flex-direction:column;gap:8px}
.tira{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px}
.d{flex:1 1 22px;min-width:22px;height:36px;border-radius:3px;border:1px solid var(--rule-2);
  background:var(--none-bg);cursor:pointer;position:relative;padding:0;
  font-family:"IBM Plex Mono",monospace;font-size:.6rem;color:var(--faint)}
.d span{position:absolute;bottom:2px;left:0;right:0;text-align:center}
.d.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.d.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.d.warn{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.d.sel{outline:2px solid var(--accent);outline-offset:1px}
.d:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.d[disabled]{cursor:default}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.78rem;color:var(--muted)}
.leyenda span{display:flex;align-items:center;gap:6px}
.leyenda i{width:10px;height:10px;border-radius:2px;display:block;border:1px solid var(--rule-2)}

.hero{display:flex;flex-direction:column;gap:5px}
.tiles{display:flex;flex-wrap:wrap;gap:10px;align-items:stretch}
.tiles .tile{flex:1 1 168px;min-width:150px}
.tiles .tile:first-child{flex:1.15 1 190px}
/* cabecera y flechas de la tira */
.mescab{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mescab .eyebrow{margin:0}
.mescab .mini{margin-left:auto}
.tirawrap{display:flex;align-items:stretch;gap:6px}
.tirawrap .tira{flex:1;min-width:0}
.flecha{flex:0 0 auto;width:26px;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--muted);border-radius:8px;cursor:pointer;font-size:1.1rem;line-height:1;padding:0}
.flecha:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.flecha:disabled{opacity:.35;cursor:default}

/* calendario en pop-up */
.calmodal{position:fixed;inset:0;z-index:60;background:rgba(10,13,16,.62);
  display:flex;align-items:center;justify-content:center;padding:16px}
.calmodal[hidden]{display:none}
.calbox{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  box-shadow:var(--shadow);max-width:900px;width:100%;max-height:92vh;overflow:auto}
.calhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--rule);
  position:sticky;top:0;background:var(--surface);z-index:1}
.calhead b{font-family:Fraunces,Georgia,serif;font-size:1.05rem}
.calmeses{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;padding:16px}
.calmes h4{margin:0 0 8px;font-family:Fraunces,Georgia,serif;font-size:.95rem;font-weight:700;
  text-transform:capitalize;color:var(--ink)}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.calgrid .dow{font-size:.62rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
  text-align:center;padding-bottom:2px;font-weight:600}
.calgrid .cd{aspect-ratio:1;border:1px solid var(--rule);border-radius:6px;background:var(--surface-3);
  color:var(--muted);font-size:.72rem;font-variant-numeric:tabular-nums;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center}
.calgrid .cd.vacio{border:0;background:none;cursor:default}
.calgrid .cd{position:relative;overflow:hidden}
.calgrid .cd.verde{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.calgrid .cd.rojo{background:var(--rojo-fuerte);border-color:var(--rojo-fuerte);color:#fff;font-weight:700}
.calgrid .cd.rojoclaro{background:var(--rojo-suave);border-color:var(--rojo-suave-b);color:var(--rojo-suave-t)}
.calgrid .cd.sinjust::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg, transparent 0 50%, var(--warn) 50% 100%);opacity:.55}
.calgrid .cd.justok::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(135deg, transparent 0 50%, var(--ok) 50% 100%);opacity:.45}
.calgrid .cd.nd{background:var(--none-bg);border-color:var(--rule);color:var(--faint)}
.calgrid .cd.sel{outline:2px solid var(--accent);outline-offset:1px}
.calgrid .cd:hover:not(.vacio){border-color:var(--accent)}


.op{display:flex;align-items:center;justify-content:center;font-family:"IBM Plex Mono",monospace;
  font-size:1.15rem;color:var(--faint);width:14px;flex:0 0 auto}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:13px 15px;
  display:flex;flex-direction:column;gap:3px;box-shadow:var(--shadow)}
.tile .k{font-family:"IBM Plex Mono",monospace;font-size:.63rem;text-transform:uppercase;letter-spacing:.13em;color:var(--faint)}
.tile .v{font-family:"IBM Plex Mono",monospace;font-size:1.22rem;font-weight:500;font-variant-numeric:tabular-nums}
.tile .s{font-size:.78rem;color:var(--muted);line-height:1.35}
.tile{text-align:left;font:inherit;color:inherit;cursor:default}
button.tile[data-t]{cursor:pointer}
button.tile[data-t]:hover{border-color:var(--accent)}
button.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.on{border-color:var(--accent)}
.tile.sel{border-color:var(--accent);background:var(--accent-soft)}

/* barra de avance */
.barra{display:flex;height:10px;border-radius:20px;overflow:hidden;background:var(--surface-2);border:1px solid var(--rule)}
.barra i{display:block;height:100%}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:7px;box-shadow:var(--shadow);overflow:hidden}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:600px}
thead th{text-align:left;font-weight:600;font-size:.63rem;letter-spacing:.13em;text-transform:uppercase;
  color:var(--faint);padding:9px 13px;border-bottom:1px solid var(--rule);white-space:nowrap;background:var(--surface-3)}
th.n,td.n{text-align:right}
tbody td{padding:9px 13px;border-bottom:1px solid var(--rule);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr.sum td{background:var(--surface-3);font-weight:600}
tr.lv2 td{background:var(--surface-3)}
tr.lv3 td{background:var(--surface-3);font-size:13.5px}
tr.lv4 td{background:var(--surface-3);font-size:13px;color:var(--ink-2)}
td.d1{color:var(--sev1);font-weight:600}
td.d2{color:var(--sev2);font-weight:600}
td.d3{color:var(--sev3);font-weight:600}
td.d4{color:var(--sev4);font-weight:700}
tr.lv4.s1 td{background:var(--sev1-bg)} tr.lv4.s1 td:first-child{border-left:3px solid var(--sev1)}
tr.lv4.s2 td{background:var(--sev2-bg)} tr.lv4.s2 td:first-child{border-left:3px solid var(--sev2)}
tr.lv4.s3 td{background:var(--sev3-bg)} tr.lv4.s3 td:first-child{border-left:3px solid var(--sev3)}
tr.lv4.s4 td{background:var(--sev4-bg)} tr.lv4.s4 td:first-child{border-left:3px solid var(--sev4)}
tr.lv4.s1 .difnota{color:var(--sev1)} tr.lv4.s2 .difnota{color:var(--sev2)}
tr.lv4.s3 .difnota{color:var(--sev3)} tr.lv4.s4 .difnota{color:var(--sev4)}
.stripe.s1{border-left-color:var(--sev1)} .stripe.s2{border-left-color:var(--sev2)}
.stripe.s3{border-left-color:var(--sev3)} .stripe.s4{border-left-color:var(--sev4)}
.chip.s1{background:var(--sev1-bg);color:var(--sev1)} .chip.s2{background:var(--sev2-bg);color:var(--sev2)}
.chip.s3{background:var(--sev3-bg);color:var(--sev3)} .chip.s4{background:var(--sev4-bg);color:var(--sev4)}
.difacc{display:block;margin-top:7px}
.difnota{display:block;font-size:.8rem;color:var(--bad);font-weight:500;margin-top:4px;max-width:64ch;line-height:1.42}
.ind1{padding-left:30px} .ind2{padding-left:52px} .ind3{padding-left:74px}
.tg{appearance:none;border:1px solid var(--rule-2);background:var(--surface);color:var(--muted);
  width:19px;height:19px;line-height:1;border-radius:4px;cursor:pointer;font-family:"IBM Plex Mono",monospace;
  font-size:.8rem;margin-right:9px;padding:0;vertical-align:1px}
.tg:hover{border-color:var(--accent);color:var(--accent)}
.tg:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.sub{display:block;font-size:.79rem;color:var(--muted);margin-top:3px;line-height:1.42;max-width:64ch}
.stripe{border-left:3px solid transparent}
.stripe.ok{border-left-color:var(--ok)} .stripe.warn{border-left-color:var(--warn)}
.stripe.bad{border-left-color:var(--bad)} .stripe.none{border-left-color:var(--rule-2)}
.stripe.info{border-left-color:var(--info)}
.chip{display:inline-block;padding:2px 8px;border-radius:20px;font-size:.67rem;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.none{background:var(--none-bg);color:var(--none)}
.chip.info{background:var(--info-bg);color:var(--info)}

.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;flex-direction:column;gap:5px}
.lede{color:var(--muted);font-size:.92rem;max-width:80ch}

.exc-item{background:var(--surface);border:1px solid var(--rule);border-left:3px solid var(--bad);
  border-radius:7px;padding:14px 16px;display:grid;gap:4px 18px;grid-template-columns:1fr auto;box-shadow:var(--shadow)}
.exc-item.warn{border-left-color:var(--warn)}
.exc-m{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums;
  grid-row:1 / span 2;grid-column:2;align-self:center;text-align:right}
.exc-f{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.77rem;color:var(--muted);
  padding-top:8px;margin-top:4px;border-top:1px solid var(--rule);align-items:center}
.exc-f b{color:var(--ink-2);font-weight:600}
.mini{appearance:none;border:1px solid var(--rule-2);background:var(--surface-3);border-radius:5px;
  font-size:.73rem;padding:4px 10px;color:var(--ink-2);cursor:pointer;font-family:"IBM Plex Mono",monospace}
.mini:hover{border-color:var(--accent);color:var(--accent)}
.quien{padding:15px 17px;display:flex;flex-direction:column;gap:11px}
.qfila{display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--rule)}
.qnombres{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.persona{display:inline-flex;align-items:center;gap:7px;font-size:.9rem;font-weight:500}
.msg{display:flex;flex-direction:column;gap:8px;margin-top:10px;background:var(--surface-3);
  border:1px solid var(--rule);border-radius:6px;padding:12px 14px}
.msg textarea{font:inherit;font-size:.88rem;line-height:1.5;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule-2);border-radius:5px;padding:9px 11px;resize:vertical;width:100%}
.msg textarea:focus{outline:none;border-color:var(--accent)}
.empty{background:var(--surface);border:1px dashed var(--rule-2);border-radius:7px;padding:22px;color:var(--muted);text-align:center}

/* póliza editable */
.pol input,.pol select{font:inherit;font-size:13.5px;background:transparent;border:1px solid transparent;
  border-radius:4px;padding:4px 6px;color:var(--ink);width:100%;font-family:inherit}
.pol input.n{font-family:"IBM Plex Mono",monospace;text-align:right;font-variant-numeric:tabular-nums}
.pol input:hover,.pol select:hover{border-color:var(--rule-2)}
.pol input:focus,.pol select:focus{outline:none;border-color:var(--accent);background:var(--surface-3)}
.pol td{padding:5px 8px}
.acct{font-family:"IBM Plex Mono",monospace;font-size:.76rem;color:var(--accent);font-weight:600}
.acciones{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nota{background:var(--surface-2);border-radius:6px;padding:12px 15px;font-size:.84rem;color:var(--ink-2);line-height:1.5}
.nota b{font-weight:600}

/* subir archivo */
.drop{border:1px dashed var(--rule-2);border-radius:7px;background:var(--surface-3);padding:18px;
  display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .txt{font-size:.87rem;color:var(--muted);max-width:56ch}
.res{font-size:.85rem;padding:10px 14px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.res.ok{background:var(--ok-bg);color:var(--ok)} .res.bad{background:var(--bad-bg);color:var(--bad)}

footer{border-top:1px solid var(--rule);margin-top:8px;padding-top:16px;color:var(--faint);font-size:.78rem;
  display:flex;flex-direction:column;gap:5px}
[hidden]{display:none !important}
@media (max-width:640px){.secnav{position:static} .exc-item{grid-template-columns:1fr} .exc-m{grid-row:auto;grid-column:1;text-align:left}}
</style><style>
/* el selector de sede tenía el estilo activo colgado de aria-pressed y el JS
   marcaba con la clase .on: no se veía dónde estabas */
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}

.marcador{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:4px}
.marcador .m{flex:1;min-width:140px;background:var(--surface);border:1px solid var(--rule);
  border-radius:8px;padding:12px 15px;box-shadow:var(--shadow)}
.marcador .m b{display:block;font-size:1.5rem;font-family:Fraunces,Georgia,serif;line-height:1.1}
.marcador .m.on{border-color:var(--accent)}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:4px 0 12px}

/* Reservas: una fila por habitación de la noche */
.fila{display:flex;align-items:center;gap:13px;padding:12px 15px;border:1px solid var(--rule);
  border-radius:9px;background:var(--surface);margin-bottom:7px;box-shadow:var(--shadow)}
.fila.con{border-left:3px solid var(--ok)}
.fila.sin{border-left:3px solid var(--rule-2)}
.fila.mano{background:var(--surface-3)}
.sw{appearance:none;flex:0 0 auto;width:56px;height:32px;border-radius:20px;cursor:pointer;padding:0;
  border:1px solid var(--rule-2);background:var(--surface-2);position:relative;transition:background .12s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;
  background:var(--surface);border:1px solid var(--rule-2);transition:left .12s}
.sw[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.sw[aria-pressed="true"]::after{left:27px;border-color:var(--ok)}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw[disabled]{opacity:.45;cursor:default}
.fila .cuarto{font-family:"IBM Plex Mono",monospace;font-size:1.05rem;font-weight:600;min-width:92px}
.fila .quien{flex:1;min-width:0}
.fila .quien b{display:block;font-size:.95rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nums{flex:0 0 auto;display:flex;align-items:center;gap:7px}
.nums input{width:56px;font:inherit;font-family:"IBM Plex Mono",monospace;font-size:.95rem;text-align:center;
  font-variant-numeric:tabular-nums;padding:6px 4px;border:1px solid var(--rule-2);border-radius:6px;
  background:var(--surface);color:var(--ink)}
.nums input:focus{outline:none;border-color:var(--accent);background:var(--surface-3)}
.nums input[disabled]{opacity:.35}
.nums .de{font-size:.72rem;color:var(--faint);font-family:"IBM Plex Mono",monospace;white-space:nowrap}
.marca{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:112px}
.reset{appearance:none;border:0;background:none;font:inherit;font-size:.72rem;color:var(--accent);
  cursor:pointer;padding:0;text-decoration:underline}

/* Del día: lo que tacha el mesero */
.hab{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--rule);
  border-radius:12px;background:var(--surface);margin-bottom:8px;box-shadow:var(--shadow)}
.hab.hecho{background:var(--ok-bg);border-color:var(--ok)}
.hab.hecho .cuarto{text-decoration:line-through;color:var(--ok)}
.hab .cuarto{font-family:"IBM Plex Mono",monospace;font-size:1.15rem;font-weight:600;min-width:92px}
.hab .quien{flex:1;min-width:0}
.hab .quien b{display:block;font-size:.95rem}
.hab .pax{font-family:"IBM Plex Mono",monospace;font-size:1.1rem;min-width:34px;text-align:right}
.tick{width:46px;height:46px;flex:0 0 auto;border-radius:12px;border:2px solid var(--rule-2);
  background:var(--surface-3);cursor:pointer;font-size:1.3rem;line-height:1;color:var(--faint)}
.hab.hecho .tick{background:var(--ok);border-color:var(--ok);color:#fff}

/* Tarifas */
td .plan{font-family:"IBM Plex Mono",monospace;font-size:.82rem;word-break:break-word}
tr.lleva td:first-child{border-left:3px solid var(--ok)}
tr.nolleva td:first-child{border-left:3px solid var(--rule-2)}
tr.mano td{background:var(--surface-3)}
.regla{display:flex;gap:12px;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--rule)}
.regla:last-child{border-bottom:0}
.regla code{font-family:"IBM Plex Mono",monospace;font-size:.82rem;background:var(--surface-2);
  padding:2px 7px;border-radius:4px;min-width:190px}
.regla span{color:var(--muted);font-size:.85rem}

@media(max-width:720px){
  .fila{flex-wrap:wrap;gap:9px}
  .fila .cuarto{min-width:64px;font-size:.95rem}
  .fila .quien{flex:1 1 100%;order:5}
  .marca{min-width:0;align-items:flex-start}
  .hab .cuarto{min-width:74px;font-size:1rem}
}
</style>
</head>
<body>

<div class="top"><div class="top-in">
  <div class="brand"><b>Desayunos</b><span class="eyebrow">Casa Pepe</span></div>
  <div class="seg" id="props" role="group" aria-label="Propiedad"></div>
</div>
<div class="top-in" style="padding-top:0"><div class="res" id="aviso" hidden style="width:100%"></div></div></div>
<div class="secnav"><div class="secnav-in" id="secnav" role="tablist"></div></div>

<main>
  <div id="gate"></div>

  <div class="mes" id="secmes" hidden>
    <div class="mescab">
      <span class="eyebrow" id="mesTitulo">Últimos 30 días</span>
      <button class="mini" type="button" id="btnHoy">Hoy</button>
      <button class="mini" type="button" id="btnManana">Mañana</button>
      <button class="mini" id="btnCal" type="button">＋ Calendario</button>
    </div>
    <div class="tirawrap">
      <button class="flecha" id="tiraAnt" type="button" aria-label="Periodo anterior">‹</button>
      <div class="tira" id="tira"></div>
      <button class="flecha" id="tiraSig" type="button" aria-label="Periodo siguiente">›</button>
    </div>
    <div class="leyenda">
      <span><i style="background:var(--ok-bg);border-color:var(--ok)"></i> Cuadra con Poster</span>
      <span><i style="background:var(--bad-bg);border-color:var(--bad)"></i> Poster sirvió de más</span>
      <span><i style="background:var(--none-bg)"></i> Sin datos de Cloudbeds</span>
      <span><i style="background:linear-gradient(135deg,var(--surface) 50%,var(--ok) 50%)"></i> Recepción lo revisó</span>
    </div>
  </div>

  <div class="hero"><span class="eyebrow" id="propsub"></span><h1 id="titulo"></h1>
    <p class="lede" id="lede"></p></div>
  <div id="cuerpo"></div>

  <footer id="pie"></footer>
</main>

<div class="calmodal" id="calmodal" hidden>
  <div class="calbox">
    <div class="calhead">
      <button class="flecha" id="calAnt" type="button" aria-label="Meses anteriores">‹</button>
      <b id="calTitulo"></b>
      <button class="flecha" id="calSig" type="button" aria-label="Meses siguientes">›</button>
      <button class="mini" id="calCerrar" type="button" style="margin-left:auto">Cerrar</button>
    </div>
    <div class="calmeses" id="calmeses"></div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=createClient(SB_URL,SB_KEY);

const PROPS=[['45e69775-d877-4507-a9e1-a45bd3400dc5','Casa Pepe CDMX'],
             ['febfbef6-7fd1-4b45-84d9-13533e8dcb72','Casa Pepe Puebla']];
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DOW=['L','M','X','J','V','S','D'];
const MIN_FECHA='2026-07-01';

let prop=PROPS[0][0], propNombre=PROPS[0][1];
let fecha=null;              // SIEMPRE la mañana del desayuno; la noche es fecha-1
let sec='reservas', PERM={}, MES=[], CAL=[], tiraOffset=0, calBase=null;
let N=null, D=null, P=[], filtro='todas', filtroP='todos', cargando=false;

const $=id=>document.getElementById(id);
const m=v=>(v===null||v===undefined)?'—':Number(v).toLocaleString('es-MX');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hoyCDMX(){return new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));}
function iso(d){const p=n=>(n<10?'0':'')+n;return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
function masDias(f,n){const d=new Date(f+'T12:00:00');d.setDate(d.getDate()+n);return iso(d);}
function fmtFecha(f){const d=new Date(f+'T12:00:00');
  return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'}).replace(/^./,c=>c.toUpperCase());}
function fmtCorta(f){const d=new Date(f+'T12:00:00');
  return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});}
function fmtCorto(f){const x=/^(\d{4})-(\d{2})-(\d{2})/.exec(f);return x?((+x[3])+' '+MESES[(+x[2])-1].slice(0,3)):f;}
async function rpc(fn,args){const {data,error}=await sb.rpc(fn,args||{});if(error)throw error;return data;}
function nota(t,c){const e=$('aviso');if(!t){e.hidden=true;return;}e.hidden=false;e.className='res '+(c||'');e.textContent=t;}
function puede(t){return PERM[t]==='editar';}
function ve(t){return PERM[t]==='ver'||PERM[t]==='editar';}

const SECS=[['reservas','Reservas'],['dia','Del día'],['tarifas','Tarifas']];

/* ---------------- arranque ---------------- */
async function arranque(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$('gate').innerHTML='<div class="empty">Entra con tu cuenta para ver los desayunos.</div>';return;}
  try{ PERM=await rpc('aud_desayunos_permisos')||{}; }catch(e){ PERM={}; }
  const visibles=SECS.filter(s=>ve(s[0]));
  if(!visibles.length){$('gate').innerHTML='<div class="empty">Tu cuenta no tiene acceso a los desayunos.</div>';return;}
  if(!ve(sec)) sec=visibles[0][0];
  $('gate').innerHTML='';

  $('props').innerHTML=PROPS.map(p=>'<button type="button" data-p="'+p[0]+'"'+(p[0]===prop?' class="on" aria-pressed="true"':' aria-pressed="false"')+'>'+esc(p[1])+'</button>').join('');
  $('props').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(!b)return;
    prop=b.dataset.p;propNombre=b.textContent;pintaProps();recarga();});

  $('secnav').innerHTML=visibles.map(s=>'<button type="button" role="tab" data-s="'+s[0]+'" aria-selected="'+(s[0]===sec?'true':'false')+'">'+s[1]+'</button>').join('');
  $('secnav').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;
    sec=b.dataset.s; pintaSecnav(); recarga();});

  fecha=iso(hoyCDMX());
  $('btnHoy').addEventListener('click',()=>irA(iso(hoyCDMX())));
  $('btnManana').addEventListener('click',()=>irA(masDias(iso(hoyCDMX()),1)));
  $('btnCal').addEventListener('click',abreCalendario);
  $('calCerrar').addEventListener('click',cierraCalendario);
  $('calAnt').addEventListener('click',()=>mueveCalendario(-1));
  $('calSig').addEventListener('click',()=>mueveCalendario(1));
  $('calmodal').addEventListener('click',e=>{if(e.target.id==='calmodal')cierraCalendario();});
  $('calmeses').addEventListener('click',e=>{const b=e.target.closest('[data-cf]');if(!b)return;
    cierraCalendario(); irA(b.dataset.cf);});
  $('tiraAnt').addEventListener('click',async()=>{tiraOffset++;await cargaMes();pintaTira();});
  $('tiraSig').addEventListener('click',async()=>{if(tiraOffset>0){tiraOffset--;await cargaMes();pintaTira();}});
  $('tira').addEventListener('click',e=>{const b=e.target.closest('button.d');if(!b||!b.dataset.f)return;irA(b.dataset.f);});

  await cargaMes(); pintaTira(); await recarga();
}
function pintaProps(){
  $('props').querySelectorAll('button').forEach(b=>{
    const on=b.dataset.p===prop;
    b.classList.toggle('on',on); b.setAttribute('aria-pressed',on?'true':'false');});
}
function pintaSecnav(){
  $('secnav').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.s===sec?'true':'false'));
}
async function irA(f){ fecha=f; await centraTiraEn(f); pintaTira(); await recarga(); }

/* ---------------- tira y calendario ---------------- */
function rangoTira(){
  const manana=new Date(hoyCDMX().getTime()+864e5);
  const hasta=new Date(manana.getTime()-tiraOffset*30*864e5);
  const desde=new Date(hasta.getTime()-29*864e5);
  const min=new Date(MIN_FECHA+'T12:00:00');
  return {desde:iso(desde<min?min:desde), hasta:iso(hasta)};
}
async function cargaMes(){
  const r=rangoTira();
  try{ MES = (r.hasta<r.desde) ? [] : (await rpc('aud_desayunos_mes',{p_property:prop,p_desde:r.desde,p_hasta:r.hasta})||[]); }
  catch(e){ MES=[]; }
  if(MES && MES.error) MES=[];
  $('mesTitulo').textContent = tiraOffset===0 ? 'Últimos 30 días' : (fmtCorto(r.desde)+' – '+fmtCorto(r.hasta));
  const min=new Date(MIN_FECHA+'T12:00:00');
  $('tiraAnt').disabled = new Date(r.desde+'T12:00:00') <= min;
  $('tiraSig').disabled = tiraOffset===0;
}
// r = [fecha, habitaciones, personas, desayunos, a_mano, poster]
function claseDia(r){
  if(!r || Number(r[1])===0) return 'nd';
  let c = Number(r[5])>Number(r[3]) ? 'bad' : 'ok';
  if(Number(r[4])>0) c += ' justok';
  return c;
}
function tituloDia(r,f){
  if(!r || Number(r[1])===0) return f+' · sin datos de Cloudbeds';
  let t=f+' · '+r[3]+' desayuno(s) con derecho, '+r[1]+' habitación(es) en casa';
  if(Number(r[5])>0) t+=' · '+r[5]+' capturados en Poster';
  if(Number(r[5])>Number(r[3])) t+=' — Poster sirvió de más';
  if(Number(r[4])>0) t+=' · '+r[4]+' ajustada(s) por recepción';
  return t;
}
function pintaTira(){
  const t=$('tira'); t.innerHTML='';
  if(!MES.length){t.innerHTML='<span class="sub" style="padding:6px 2px">Sin datos en este periodo.</span>';return;}
  MES.forEach(r=>{const b=document.createElement('button');b.type='button';
    b.className='d '+claseDia(r)+(r[0]===fecha?' sel':'');
    b.dataset.f=r[0]; const ti=tituloDia(r,r[0]);
    b.title=ti; b.setAttribute('aria-label',ti);
    b.innerHTML='<span>'+r[0].slice(8)+'</span>'; t.appendChild(b);});
}
function mesesVisibles(){
  const b=calBase||{a:hoyCDMX().getFullYear(), m:hoyCDMX().getMonth()};
  return [2,1,0].map(k=>{const d=new Date(b.a,b.m-k,1);return {a:d.getFullYear(), m:d.getMonth()};});
}
async function cargaCalendario(){
  const v=mesesVisibles();
  const desde=iso(new Date(v[0].a, v[0].m, 1));
  const ultimo=new Date(v[2].a, v[2].m+1, 0);
  const tope=new Date(hoyCDMX().getTime()+864e5);
  const hasta=iso(ultimo>tope?tope:ultimo);
  try{ CAL = (hasta<desde) ? [] : (await rpc('aud_desayunos_mes',{p_property:prop,p_desde:desde,p_hasta:hasta})||[]); }
  catch(e){ CAL=[]; }
  if(CAL && CAL.error) CAL=[];
}
function pintaCalendario(){
  const cont=$('calmeses'); if(!cont) return;
  const por={}; CAL.forEach(r=>{por[r[0]]=r;});
  const v=mesesVisibles();
  $('calTitulo').textContent = MESES[v[0].m]+' – '+MESES[v[2].m]+' de '+v[2].a;
  cont.innerHTML = v.map(x=>{
    const primero=new Date(x.a,x.m,1), ultimo=new Date(x.a,x.m+1,0);
    const hueco=(primero.getDay()+6)%7;
    let celdas='';
    for(let i=0;i<hueco;i++) celdas+='<div class="cd vacio"></div>';
    for(let d=1;d<=ultimo.getDate();d++){
      const f=iso(new Date(x.a,x.m,d)), r=por[f];
      const cl=claseDia(r).replace('bad','rojo').replace('ok','verde')+(f===fecha?' sel':'');
      celdas+='<button type="button" class="cd '+cl+'" data-cf="'+f+'" title="'+esc(tituloDia(r,f))+'">'+d+'</button>';
    }
    return '<div class="calmes"><h4>'+MESES[x.m]+' '+x.a+'</h4>'
      +'<div class="calgrid">'+DOW.map(d=>'<div class="dow">'+d+'</div>').join('')+celdas+'</div></div>';
  }).join('');
  const min=new Date(MIN_FECHA+'T12:00:00'), hoy=hoyCDMX();
  $('calAnt').disabled = new Date(v[0].a, v[0].m-1, 1) < new Date(min.getFullYear(),min.getMonth(),1);
  $('calSig').disabled = (calBase===null) || (new Date(calBase.a, calBase.m+1, 1) > new Date(hoy.getFullYear(),hoy.getMonth(),1));
}
async function abreCalendario(){
  if(!calBase){const h=hoyCDMX();calBase={a:h.getFullYear(), m:h.getMonth()};}
  $('calmodal').hidden=false;
  $('calmeses').innerHTML='<div class="empty">Cargando…</div>';
  await cargaCalendario(); pintaCalendario();
}
function cierraCalendario(){$('calmodal').hidden=true;}
async function mueveCalendario(delta){
  const h=hoyCDMX(), min=new Date(MIN_FECHA+'T12:00:00');
  const n=new Date(calBase.a, calBase.m+delta, 1);
  if(n > new Date(h.getFullYear(),h.getMonth(),1)) return;
  if(new Date(n.getFullYear(),n.getMonth()-2,1) < new Date(min.getFullYear(),min.getMonth(),1)) return;
  calBase={a:n.getFullYear(), m:n.getMonth()};
  $('calmeses').innerHTML='<div class="empty">Cargando…</div>';
  await cargaCalendario(); pintaCalendario();
}
async function centraTiraEn(f){
  const manana=new Date(hoyCDMX().getTime()+864e5);
  const d=new Date(f+'T12:00:00');
  const dias=Math.floor((manana-d)/864e5);
  tiraOffset = dias<=29 ? 0 : Math.floor(dias/30);
  await cargaMes();
}

/* ---------------- carga por pestaña ---------------- */
async function recarga(){
  cargando=true; pinta();
  try{
    if(sec==='reservas')      N=await rpc('aud_desayunos_noche',{p_property:prop,p_fecha_noche:masDias(fecha,-1)});
    else if(sec==='dia')      D=await rpc('aud_desayunos_dia',{p_property:prop,p_fecha:fecha});
    else                      P=await rpc('aud_desayuno_planes',{p_property:prop});
  }catch(e){
    nota('No se pudo cargar: '+((e&&e.message)||e),'bad');
    if(sec==='reservas')N=null; else if(sec==='dia')D=null; else P=[];
  }
  cargando=false; pinta();
  if(sec==='tarifas') cargaReglas();
}

/* ---------------- pintado ---------------- */
function pinta(){
  $('propsub').textContent=propNombre;
  $('secmes').hidden = (sec==='tarifas');
  if(sec==='reservas'){
    $('titulo').textContent='Reservas de la noche del '+fmtCorta(masDias(fecha,-1));
    $('lede').textContent='Vienen premarcadas las habitaciones cuya tarifa lleva desayuno. Enciende las que falten y ajusta cuántos desayunos van; por defecto, tantos como personas hay en la habitación. Esto es lo que verá el mesero el '+fmtCorta(fecha)+'.';
    $('pie').innerHTML='<div>Se desayuna la mañana del <b>'+fmtCorta(fecha)+'</b>; la noche que cuenta es la del <b>'+fmtCorta(masDias(fecha,-1))+'</b>.</div>'
      +'<div>Si alguien de la habitación no desayuna, baja el número aquí y la auditoría lo cuenta bien.</div>';
  }else if(sec==='dia'){
    $('titulo').textContent='Desayunos del '+fmtCorta(fecha);
    $('lede').textContent='Quien durmió anoche con derecho a desayuno. Tacha a cada habitación conforme vaya subiendo.';
    $('pie').innerHTML='<div>Lo que se contabiliza es lo que se captura en Poster. Si ahí salen más desayunos que los que tenían derecho, se levanta incidencia en la auditoría nocturna.</div>';
  }else{
    $('titulo').textContent='Qué tarifa lleva desayuno';
    $('lede').textContent='Cada plan tarifario que Cloudbeds ha devuelto, con las noches que ha vendido. Cambiar uno re-etiqueta todas sus noches. Cuantos menos planes haya y más claros sean sus nombres, menos hay que corregir a mano.';
    $('pie').innerHTML='<div>Para revisar con Liz: los planes con pocas noches y nombre ambiguo son los candidatos a fusionar o borrar en Cloudbeds.</div>';
  }
  if(cargando){$('cuerpo').innerHTML='<div class="empty">Cargando…</div>';return;}
  if(sec==='reservas') pintaReservas();
  else if(sec==='dia') pintaDia();
  else pintaTarifas();
}

function pintaReservas(){
  if(!N){$('cuerpo').innerHTML='';return;}
  if(N.error){$('cuerpo').innerHTML='<div class="empty">Tu cuenta no puede ver esta lista.</div>';return;}
  const L=N.lista||[], editable=puede('reservas')&&N.puede_editar!==false;
  const conD=L.filter(x=>x[7]);
  const personas=L.reduce((a,x)=>a+Number(x[5]||0),0);
  const desayunos=conD.reduce((a,x)=>a+Number(x[8]||0),0);
  const aMano=L.filter(x=>x[9]).length;
  const marcador='<div class="marcador">'
   +'<div class="m"><span class="eyebrow">Habitaciones</span><b>'+m(L.length)+'</b><span class="sub">'+m(personas)+' personas en casa</span></div>'
   +'<div class="m on"><span class="eyebrow">Con desayuno</span><b>'+m(desayunos)+'</b><span class="sub">en '+m(conD.length)+' habitación(es)</span></div>'
   +'<div class="m"><span class="eyebrow">Ajustadas a mano</span><b>'+m(aMano)+'</b><span class="sub">el resto va por tarifa</span></div>'
   +'</div>';
  if(N.sin_datos) return void($('cuerpo').innerHTML=marcador
    +'<div class="empty">Cloudbeds todavía no ha cargado esa noche. Se recarga sola a las 2:15 y a las 5:00.</div>');
  const chips=[['todas','Todas',L.length],['con','Con desayuno',conD.length],
               ['sin','Sin desayuno',L.length-conD.length],['mano','Ajustadas a mano',aMano]];
  const filtros='<div class="filtros">'+chips.map(c=>
     '<button class="mini" type="button" data-f="'+c[0]+'"'+(filtro===c[0]?' style="border-color:var(--accent);color:var(--accent)"':'')
     +'>'+c[1]+' · '+c[2]+'</button>').join('')+'</div>';
  const vis=L.filter(x=> filtro==='todas' || (filtro==='con'&&x[7]) || (filtro==='sin'&&!x[7]) || (filtro==='mano'&&x[9]));
  if(!vis.length) return void($('cuerpo').innerHTML=marcador+filtros+'<div class="empty">Nada en este filtro.</div>');
  $('cuerpo').innerHTML=marcador+filtros+vis.map(x=>{
    const lleva=!!x[7], mano=!!x[9];
    const ref=[x[3],x[4]].filter(Boolean).join(' · ');
    const sello = mano ? '<span class="chip warn">A mano'+(x[10]?' · '+esc(x[10]):'')+'</span>'
                       : (x[6] ? '<span class="chip ok">Por tarifa</span>' : '<span class="chip none">Sin desayuno</span>');
    return '<div class="fila '+(lleva?'con':'sin')+(mano?' mano':'')+'">'
     +'<button class="sw" type="button" role="switch" aria-pressed="'+(lleva?'true':'false')+'" '
       +'data-sub="'+esc(x[0])+'" data-act="tog"'+(editable?'':' disabled')
       +' aria-label="'+(lleva?'Quitar':'Marcar')+' desayuno en '+esc(x[1])+'"></button>'
     +'<span class="cuarto">'+(x[1]?esc(x[1]):'<span style="color:var(--faint);font-size:.8rem">sin asignar</span>')+'</span>'
     +'<span class="quien"><b>'+esc(x[2]||'')+'</b><span class="sub">'+esc(ref)+'</span></span>'
     +'<span class="nums"><input type="number" min="0" max="12" inputmode="numeric" value="'+Number(x[8]||0)+'" '
       +'data-sub="'+esc(x[0])+'" data-act="pax"'+(editable&&lleva?'':' disabled')+'>'
       +'<span class="de">de '+m(x[5])+'</span></span>'
     +'<span class="marca">'+sello
       +(mano&&editable?'<button class="reset" type="button" data-sub="'+esc(x[0])+'" data-act="reset">Restablecer</button>':'')
     +'</span></div>';
  }).join('')
  +(editable?'':'<div class="nota" style="margin-top:12px">Puedes ver la lista pero no cambiarla. Si necesitas editar, pídelo en Accesos.</div>');
}

function pintaDia(){
  if(!D){$('cuerpo').innerHTML='';return;}
  if(D.error){$('cuerpo').innerHTML='<div class="empty">Tu cuenta no puede ver esta lista.</div>';return;}
  const L=D.lista||[];
  const subieron=L.filter(x=>x[4]).reduce((a,x)=>a+Number(x[5]||x[3]||0),0);
  const derecho=L.reduce((a,x)=>a+Number(x[3]||0),0);
  const marcador='<div class="marcador">'
   +'<div class="m on"><span class="eyebrow">Con derecho</span><b>'+m(derecho)+'</b><span class="sub">personas</span></div>'
   +'<div class="m"><span class="eyebrow">Ya subieron</span><b>'+m(subieron)+'</b><span class="sub">de '+m(derecho)+'</span></div>'
   +'<div class="m"><span class="eyebrow">Capturado en Poster</span><b>'+m(D.servidos_poster)+'</b><span class="sub">desayunos incluidos</span></div>'
   +'</div>';
  if(D.sin_datos) return void($('cuerpo').innerHTML=marcador
    +'<div class="empty">Cloudbeds todavía no ha cargado la noche anterior.</div>');
  if(!L.length) return void($('cuerpo').innerHTML=marcador
    +'<div class="empty">Nadie durmió esa noche con derecho a desayuno.'
    +(Number(D.servidos_poster)>0?' Pero en Poster se capturaron '+m(D.servidos_poster)
      +' desayunos incluidos: eso sale como incidencia en la auditoría.':'')+'</div>');
  const editable=puede('dia');
  $('cuerpo').innerHTML=marcador+L.map(x=>{
    const hecho=!!x[4];
    const ref=[x[11]?'Puesto por recepción':x[10], x[9]].filter(Boolean).join(' · ');
    return '<div class="hab'+(hecho?' hecho':'')+'">'
     +'<button class="tick" type="button" data-sub="'+esc(x[0])+'" data-on="'+(hecho?'1':'0')+'" data-act="tick"'
     +(editable?'':' disabled')+' aria-label="'+(hecho?'Desmarcar':'Marcar')+' '+esc(x[1])+'">'+(hecho?'✓':'')+'</button>'
     +'<span class="cuarto">'+esc(x[1]||'—')+'</span>'
     +'<span class="quien"><b>'+esc(x[2]||'')+'</b>'
     +'<span class="sub">'+esc(ref)+(x[7]?' · '+esc(x[7]):'')+(hecho&&x[6]?' · tachó '+esc(x[6]):'')+'</span></span>'
     +'<span class="pax">'+m(x[3])+'</span></div>';
  }).join('')
  +(Number(D.servidos_poster)>derecho
    ? '<div class="nota" style="margin-top:12px"><b>Ojo.</b> En Poster se capturaron '+m(D.servidos_poster)
      +' desayunos incluidos y sólo '+m(derecho)+' personas tenían derecho. La diferencia sale como incidencia en la auditoría.</div>'
    : '');
}

function pintaTarifas(){
  const L=Array.isArray(P)?P:[];
  if(!L.length){$('cuerpo').innerHTML='<div class="empty">Todavía no hay planes cargados para esta sede.</div>';return;}
  const con=L.filter(x=>x[4]), mano=L.filter(x=>x[5]);
  const nochesCon=con.reduce((a,x)=>a+Number(x[1]||0),0);
  const nochesTot=L.reduce((a,x)=>a+Number(x[1]||0),0);
  const marcador='<div class="marcador">'
   +'<div class="m"><span class="eyebrow">Planes distintos</span><b>'+m(L.length)+'</b><span class="sub">en '+m(nochesTot)+' noches vendidas</span></div>'
   +'<div class="m on"><span class="eyebrow">Llevan desayuno</span><b>'+m(con.length)+'</b><span class="sub">'+m(nochesCon)+' noches</span></div>'
   +'<div class="m"><span class="eyebrow">Puestos a mano</span><b>'+m(mano.length)+'</b><span class="sub">el resto lo decide la regla</span></div>'
   +'</div>';
  const chips=[['todos','Todos',L.length],['con','Llevan',con.length],
               ['sin','No llevan',L.length-con.length],['mano','A mano',mano.length]];
  const filtros='<div class="filtros">'+chips.map(c=>
    '<button class="mini" type="button" data-fp="'+c[0]+'"'+(filtroP===c[0]?' style="border-color:var(--accent);color:var(--accent)"':'')
    +'>'+c[1]+' · '+c[2]+'</button>').join('')+'</div>';
  const vis=L.filter(x=> filtroP==='todos' || (filtroP==='con'&&x[4]) || (filtroP==='sin'&&!x[4]) || (filtroP==='mano'&&x[5]));
  const editable=puede('tarifas');
  $('cuerpo').innerHTML=marcador+filtros
   +'<div class="card scroll"><table><thead><tr>'
   +'<th>Plan tarifario</th><th class="n">Noches</th><th>Desde</th><th>Hasta</th><th>¿Desayuno?</th><th></th>'
   +'</tr></thead><tbody>'
   + (vis.length ? vis.map(p=>
      '<tr class="'+(p[4]?'lleva':'nolleva')+(p[5]?' mano':'')+'">'
      +'<td><span class="plan">'+esc(p[0])+'</span>'
        +(p[5]?'<span class="sub">Puesto a mano'+(p[6]?' por '+esc(p[6]):'')+'</span>':'')+'</td>'
      +'<td class="n">'+m(p[1])+'</td><td class="mono">'+esc(p[2]||'')+'</td><td class="mono">'+esc(p[3]||'')+'</td>'
      +'<td><span class="chip '+(p[4]?'ok':'none')+'">'+(p[4]?'Sí lleva':'No lleva')+'</span></td>'
      +'<td class="n">'+(editable?'<button class="mini" type="button" data-plan="'+esc(p[0])+'" data-lleva="'+(p[4]?'0':'1')+'">'
      +(p[4]?'Quitar desayuno':'Marcar con desayuno')+'</button>':'')+'</td></tr>').join('')
      : '<tr><td colspan="6">Nada en este filtro.</td></tr>')
   +'</tbody></table></div>'
   +'<section class="sec" style="margin-top:22px"><div class="sechead">'
   +'<span class="eyebrow">Cómo se decide</span><h2>Las reglas por nombre</h2>'
   +'<p class="lede">Se comparan contra el nombre completo del plan, sin distinguir mayúsculas. Un "no" explícito gana siempre a un "sí".</p>'
   +'</div><div class="card" style="padding:15px 18px"><div id="reglas">Cargando…</div></div></section>';
}

async function cargaReglas(){
  const c=$('reglas'); if(!c) return;
  try{
    const R=await rpc('aud_desayuno_reglas');
    if(!R||R.error){ c.textContent='No se pudieron cargar las reglas.'; return; }
    c.innerHTML=R.map(r=>'<div class="regla">'
      +'<span class="chip '+(r[1]?'ok':'none')+'">'+(r[1]?'Sí lleva':'No lleva')+'</span>'
      +'<code>'+esc(r[0])+'</code><span>'+esc(r[2])+'</span></div>').join('');
  }catch(e){ c.textContent='No se pudieron cargar las reglas.'; }
}

/* ---------------- acciones ---------------- */
async function guardaReserva(sub, lleva, pax){
  try{
    const r=await rpc('aud_desayuno_reserva_marcar',
      {p_property:prop,p_fecha_noche:masDias(fecha,-1),p_sub:sub,p_lleva:lleva,p_pax:pax});
    if(r&&r.error){nota('No se pudo: '+r.error,'bad');return false;}
    nota(''); return true;
  }catch(e){nota('No se pudo guardar: '+((e&&e.message)||e),'bad');return false;}
}

$('cuerpo').addEventListener('click',async e=>{
  const f=e.target.closest('[data-f]');   if(f){ filtro=f.dataset.f;  pinta(); return; }
  const fp=e.target.closest('[data-fp]'); if(fp){ filtroP=fp.dataset.fp; pinta(); return; }

  const pl=e.target.closest('[data-plan]');
  if(pl){
    pl.disabled=true; pl.textContent='Guardando…';
    try{
      const r=await rpc('aud_desayuno_plan_marcar',{p_property:prop,p_plan:pl.dataset.plan,p_lleva:pl.dataset.lleva==='1'});
      if(r&&r.error){ nota('No se pudo: '+r.error,'bad'); pl.disabled=false; return; }
      nota('Listo: '+((r&&r.noches)||0)+' noches re-etiquetadas.','ok');
      await recarga(); await cargaMes(); pintaTira();
    }catch(ex){ nota('No se pudo: '+((ex&&ex.message)||ex),'bad'); pl.disabled=false; }
    return;
  }

  const b=e.target.closest('[data-act]');
  if(!b || b.dataset.act==='pax') return;
  b.disabled=true;
  if(b.dataset.act==='tog'){
    const nuevo=b.getAttribute('aria-pressed')!=='true';
    const fila=(N&&N.lista||[]).find(x=>x[0]===b.dataset.sub);
    const pax = nuevo ? Number((fila&&fila[8])||(fila&&fila[5])||1) : null;
    if(await guardaReserva(b.dataset.sub, nuevo, pax)){ await recarga(); await cargaMes(); pintaTira(); } else b.disabled=false;
  }else if(b.dataset.act==='reset'){
    if(await guardaReserva(b.dataset.sub, null, null)){ await recarga(); await cargaMes(); pintaTira(); } else b.disabled=false;
  }else if(b.dataset.act==='tick'){
    const nuevo=b.dataset.on!=='1';
    try{
      const r=await rpc('aud_desayuno_marcar',{p_property:prop,p_fecha:fecha,p_sub:b.dataset.sub,
        p_subio:nuevo,p_pax:null,p_nota:null});
      if(r&&r.error){nota('No se pudo: '+r.error,'bad');b.disabled=false;return;}
      nota(''); await recarga();
    }catch(ex){nota('No se pudo: '+((ex&&ex.message)||ex),'bad');b.disabled=false;}
  }
});

$('cuerpo').addEventListener('change',async e=>{
  const i=e.target.closest('[data-act="pax"]'); if(!i) return;
  let v=parseInt(i.value,10); if(isNaN(v)||v<0) v=0; if(v>12) v=12;
  i.value=v; i.disabled=true;
  const fila=(N&&N.lista||[]).find(x=>x[0]===i.dataset.sub);
  const lleva = fila ? !!fila[7] : true;
  if(await guardaReserva(i.dataset.sub, lleva, v)){ await recarga(); await cargaMes(); pintaTira(); } else i.disabled=false;
});

arranque();
</script>
