<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mejora tu estancia · Casa Pepe</title>
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6;--warn:#8C6212;--warn-bg:#F3EAD6;--ok:#1D6B4A;--ok-bg:#E1F0E7}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;padding:22px 16px 48px}
.wrap{width:100%;max-width:460px;margin:0 auto}
.head{text-align:center;margin-bottom:8px}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:25px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:0 1px 1px rgba(31,27,22,.04),0 14px 34px -24px rgba(31,27,22,.45);overflow:hidden;margin-bottom:16px}
.card.top{border-color:var(--green);box-shadow:0 0 0 2px var(--soft),0 14px 34px -24px rgba(31,27,22,.45)}

/* comparación visual: dos fotos con flecha */
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.side{position:relative}
.side .ph{width:100%;aspect-ratio:4/3;background:#EDE7DB center/cover no-repeat;display:block}
.side .ph.ph-empty{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
.side .tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--muted)}
.side.to .tag{background:var(--green);color:#fff}
.arrow{width:38px;height:38px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;z-index:2;margin:0 -19px;box-shadow:0 2px 8px rgba(19,122,86,.4)}

/* comparación escrita: qué mejora, actual vs destino */
.specc{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.sc{padding:10px 12px}
.sc.to{background:#F4FAF7;border-left:1px solid var(--rule)}
.scl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.sc.to .scl{color:var(--green)}
.scnm{font-weight:700;font-size:13.5px;line-height:1.25;margin-top:2px}
.scv{font-size:12.5px;color:var(--muted);margin-top:3px}
.sc.to .scv{color:var(--ink)}

.body{padding:14px 16px 16px}
.rowh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.rowh .nm{font-weight:800;font-size:16px;flex:1}
.tagp{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--green);white-space:nowrap}
.tagp.fijo{background:var(--warn-bg);color:var(--warn)}
.incluye{font-size:12px;color:var(--muted);margin-top:6px}
.incluye b{color:var(--ink);font-weight:700}

.sub{font-size:12.5px;color:var(--muted);margin-top:11px}
.offer{display:flex;gap:8px;margin-top:10px}
.money{flex:1;display:flex;align-items:center;border:1px solid var(--rule);border-radius:12px;background:#FBF8F1;padding:0 12px}
.money span{color:var(--muted);font-weight:700}
.money input{border:0;background:none;font:inherit;font-size:17px;font-weight:700;padding:11px 6px;width:100%;outline:none;color:var(--ink)}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:11px 18px;cursor:pointer;white-space:nowrap}
.btn:active{filter:brightness(.94)} .btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:10px;padding:13px 0;font-size:16px}
.msg{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:13.5px;display:none}
.msg.on{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.info{background:#EEF4FF;color:#2B6CB0}
.empty{background:#FBF8F1;border:1px dashed var(--rule-2);border-radius:16px;padding:26px 18px;color:var(--muted);text-align:center}
.foot{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}
</style></head>
<body><div class="wrap">
  <div class="head">
    <div class="k">Casa Pepe</div>
    <h1>Mejora tu estancia</h1>
    <div class="s">Antes de llegar, sube de categoría — tú pones el precio.</div>
  </div>
  <div id="cont"><div class="empty">Cargando tus opciones…</div></div>
  <div class="foot">Mi Casa Pepe es tu Casa 🧡</div>
</div>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var q=new URLSearchParams(location.search);
  var RESV=q.get('resv')||'', RID=q.get('rid')||'', PROP=(q.get('prop')||'cdmx').toLowerCase();
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }
  function api(body){ return fetch(SB+'/functions/v1/apepe-upgrade',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
  function base(extra){ var o=extra||{}; if(RESV) o.resv=RESV; else { o.reservation_id=RID; o.prop=PROP; } return o; }

  function ph(url){ return url ? '<span class="ph" style="background-image:url(\''+esc(url)+'\')"></span>' : '<span class="ph ph-empty">Casa Pepe</span>'; }
  function specLine(r){ var pax=r.pax?esc(r.pax)+' pax':''; var bano=r.bano?esc(r.bano):''; return [pax,bano].filter(Boolean).join(' · ')||'—'; }
  function incluye(list){ list=Array.isArray(list)?list:[]; if(!list.length) return ''; return '<div class="incluye"><b>Incluye:</b> '+list.slice(0,3).map(esc).join(' · ')+'</div>'; }

  api(base({accion:'opciones'})).then(function(d){
    var cont=document.getElementById('cont');
    if(!d||!d.ok){ cont.innerHTML='<div class="empty">No pudimos cargar tus opciones ahora. Inténtalo más tarde o pregunta en recepción.</div>'; return; }
    var ops=Array.isArray(d.opciones)?d.opciones:[];
    var act=d.cuarto_actual||{};
    if(!ops.length){
      cont.innerHTML='<div class="card"><div class="body"><div class="rowh"><div class="nm">'+esc(act.nombre||'Tu cuarto')+'</div></div><div class="incluye">'+specLine(act)+'</div></div></div>'+
        '<div class="empty">Por ahora no hay upgrades disponibles para tu reserva. ¡Ya estás muy bien! 🧡</div>'; return;
    }
    var html='';
    ops.forEach(function(op,i){
      var t=op.target||{}, nombre=esc(t.nombre||'Habitación');
      var esFijo=(op.tipo==='fijo');
      var clase=esFijo?'Habitación privada':(op.clase==='suite'?'Suite':'Dormitorio');
      var tagCls=esFijo?'tagp fijo':'tagp';

      // fotos actual -> destino
      var compara='<div class="compare">'+
        '<div class="side from">'+ph(act.foto)+'<span class="tag">Ahora</span></div>'+
        '<div class="arrow">→</div>'+
        '<div class="side to">'+ph(t.foto)+'<span class="tag">Mejora</span></div>'+
      '</div>';

      // comparación escrita: qué mejora
      var specs='<div class="specc">'+
        '<div class="sc"><div class="scl">Ahora</div><div class="scnm">'+esc(act.nombre||'Tu cuarto')+'</div><div class="scv">'+specLine(act)+'</div></div>'+
        '<div class="sc to"><div class="scl">Mejora</div><div class="scnm">'+nombre+'</div><div class="scv">'+specLine(t)+'</div></div>'+
      '</div>';

      var cuerpo='<div class="body"><div class="rowh"><div class="nm">'+nombre+'</div><span class="'+tagCls+'">'+clase+'</span></div>'+incluye(t.features);
      if(esFijo){
        cuerpo+='<div class="sub">Sube a una privada por la diferencia real del día — habitación solo para ti.</div>'+
          '<button class="btn full" data-fijo="'+i+'">Subir por '+money(op.precio)+'</button>'+
          '<div class="msg" id="m'+i+'"></div>';
      } else {
        cuerpo+='<div class="sub">¿Cuánto pagarías por subir a este cuarto? Tú propones.</div>'+
          '<div class="offer"><div class="money"><span>$</span><input type="number" inputmode="numeric" min="1" placeholder="0" id="in'+i+'"></div>'+
          '<button class="btn" data-puja="'+i+'">Ofrecer</button></div>'+
          '<div class="msg" id="m'+i+'"></div>';
      }
      cuerpo+='</div>';
      html+='<div class="card'+(esFijo?' top':'')+'" data-i="'+i+'">'+compara+specs+cuerpo+'</div>';
    });
    cont.innerHTML=html;

    function showMsg(i,cls,txt){ var m=document.getElementById('m'+i); m.className='msg on '+cls; m.innerHTML=txt; }
    Array.prototype.forEach.call(cont.querySelectorAll('[data-puja]'),function(b){
      b.onclick=function(){ var i=b.getAttribute('data-puja'); var op=ops[i]; var v=Number((document.getElementById('in'+i).value||'').replace(/[^0-9.]/g,''));
        if(!v){ showMsg(i,'warn','Escribe cuánto quieres ofrecer.'); return; }
        b.disabled=true; b.textContent='…';
        api(base({accion:'evaluar',target_id:op.target.id,bid:v})).then(function(r){
          b.disabled=false; b.textContent='Ofrecer';
          if(!r||!r.ok){ showMsg(i,'warn','No se pudo procesar. Intenta de nuevo.'); return; }
          if(r.decision==='acepta'){ showMsg(i,'ok','🎉 '+esc(r.mensaje)); b.disabled=true; document.getElementById('in'+i).disabled=true; }
          else if(r.decision==='recepcion'){ showMsg(i,'info','🤝 '+esc(r.mensaje)); }
          else { showMsg(i,'warn',esc(r.mensaje)); }
        }).catch(function(){ b.disabled=false; b.textContent='Ofrecer'; showMsg(i,'warn','Error de conexión.'); });
      };
    });
    Array.prototype.forEach.call(cont.querySelectorAll('[data-fijo]'),function(b){
      b.onclick=function(){ var i=b.getAttribute('data-fijo'); var op=ops[i]; b.disabled=true; b.textContent='…';
        api(base({accion:'evaluar',target_id:op.target.id})).then(function(r){
          if(r&&r.ok&&r.decision==='precio_fijo'){ showMsg(i,'ok','🎉 '+esc(r.mensaje)); b.textContent='¡Confirmado!'; }
          else if(r&&r.decision==='recepcion'){ b.disabled=false; b.textContent='Subir por '+money(op.precio); showMsg(i,'info','🤝 '+esc(r.mensaje)); }
          else { b.disabled=false; b.textContent='Subir por '+money(op.precio); showMsg(i,'warn',(r&&r.mensaje)||'No disponible ahora.'); }
        }).catch(function(){ b.disabled=false; b.textContent='Subir por '+money(op.precio); showMsg(i,'warn','Error de conexión.'); });
      };
    });
  }).catch(function(){ document.getElementById('cont').innerHTML='<div class="empty">No pudimos cargar tus opciones. Pregunta en recepción.</div>'; });
})();
</script>
</body></html>
