<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mejora tu estancia · Casa Pepe</title>
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6;--warn:#8C6212;--warn-bg:#F3EAD6;--ok:#1D6B4A;--ok-bg:#E1F0E7}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;padding:22px 16px 48px}
.wrap{width:100%;max-width:460px;margin:0 auto}
.head{text-align:center;margin-bottom:8px}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:25px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}

.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:0 1px 1px rgba(31,27,22,.04),0 14px 34px -24px rgba(31,27,22,.45);overflow:hidden;margin-bottom:16px}
.card.top{border-color:var(--green);box-shadow:0 0 0 2px var(--soft),0 14px 34px -24px rgba(31,27,22,.45)}
.compare{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.side{position:relative}
.side .ph{width:100%;aspect-ratio:4/3;background:#EDE7DB center/cover no-repeat;display:block}
.side .ph.ph-empty{display:flex;align-items:center;justify-content:center;color:var(--faint);font-size:12px}
.side .tag{position:absolute;top:8px;left:8px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:rgba(255,255,255,.92);color:var(--muted)}
.side.to .tag{background:var(--green);color:#fff}
.side .zoom{position:absolute;right:8px;bottom:8px;background:rgba(36,28,20,.72);color:#fff;border:0;border-radius:999px;font:inherit;font-size:11px;font-weight:700;padding:5px 11px;cursor:pointer;display:flex;align-items:center;gap:4px}
.arrow{width:38px;height:38px;border-radius:999px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:800;z-index:2;margin:0 -19px;box-shadow:0 2px 8px rgba(19,122,86,.4)}
.specc{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--rule)}
.sc{padding:10px 12px}
.sc.to{background:#F4FAF7;border-left:1px solid var(--rule)}
.scl{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.sc.to .scl{color:var(--green)}
.scnm{font-weight:700;font-size:13.5px;line-height:1.25;margin-top:2px}
.scv{font-size:12.5px;color:var(--muted);margin-top:3px}
.sc.to .scv{color:var(--ink)}
.body{padding:14px 16px 16px}
.rowh{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.rowh .nm{font-weight:800;font-size:16px;flex:1}
.tagp{font-size:10.5px;font-weight:700;border-radius:6px;padding:2px 8px;background:var(--soft);color:var(--green);white-space:nowrap}
.tagp.fijo{background:var(--warn-bg);color:var(--warn)}
.incluye{font-size:12px;color:var(--muted);margin-top:6px}
.incluye b{color:var(--ink);font-weight:700}
.verdet{display:inline-block;margin-top:8px;font-size:12.5px;font-weight:700;color:var(--green);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.sub{font-size:12.5px;color:var(--muted);margin-top:11px}
.offer{display:flex;gap:8px;margin-top:10px}
.money{flex:1;display:flex;align-items:center;border:1px solid var(--rule);border-radius:12px;background:#FBF8F1;padding:0 12px}
.money span{color:var(--muted);font-weight:700}
.money input{border:0;background:none;font:inherit;font-size:17px;font-weight:700;padding:11px 6px;width:100%;outline:none;color:var(--ink)}
.pern{font-size:11px;color:var(--faint);margin-top:5px}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:11px 18px;cursor:pointer;white-space:nowrap}
.btn:active{filter:brightness(.94)} .btn[disabled]{opacity:.5;cursor:default}
.btn.full{width:100%;margin-top:10px;padding:13px 0;font-size:16px}
.msg{margin-top:12px;border-radius:12px;padding:11px 13px;font-size:13.5px;display:none}
.msg.on{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)} .msg.info{background:#EEF4FF;color:#2B6CB0}
.empty{background:#FBF8F1;border:1px dashed var(--rule-2);border-radius:16px;padding:26px 18px;color:var(--muted);text-align:center}
.foot{margin-top:14px;text-align:center;color:var(--muted);font-size:12px}
/* overlay modales */
.ov{position:fixed;inset:0;background:rgba(28,22,16,.62);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.ov.on{display:flex}
@media(min-width:480px){.ov{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch}
@media(min-width:480px){.sheet{border-radius:18px}}
.lbhead{position:relative}
.lbstage{position:relative;background:#000}
.lbstage img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.lbnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;background:rgba(0,0,0,.45);color:#fff;border:0;font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.lbnav.prev{left:8px}.lbnav.next{right:8px}
.lbcount{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.5);color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
.lbx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:18px;cursor:pointer}
.lbbody{padding:16px 18px 22px}
.lbbody h3{margin:0 0 2px;font-size:19px}
.lbbody .sp{color:var(--muted);font-size:13px;font-weight:700}
.lbbody .ds{margin:12px 0 0;font-size:13.5px;color:var(--ink)}
.feat{list-style:none;padding:0;margin:12px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.feat li{font-size:12.5px;color:var(--ink);display:flex;gap:6px;align-items:flex-start}
.feat li .ic{color:var(--green);font-weight:800}
/* confirm */
.cm{padding:22px 20px 20px;text-align:center}
.cm .em{font-size:34px}
.cm h3{margin:8px 0 4px;font-size:19px}
.cm p{margin:0;color:var(--muted);font-size:13.5px}
.cm .price{margin:14px 0 4px;font-size:15px;font-weight:800;color:var(--ink)}
.cm .price small{display:block;font-size:12px;font-weight:600;color:var(--faint);margin-top:2px}
.cm .acts{display:flex;gap:9px;margin-top:16px}
.cm .acts .btn{flex:1;justify-content:center}
.cm .ghost{background:#EFEAE0;color:var(--ink)}
.volver{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:2px 0 10px;display:inline-flex;align-items:center;gap:4px}
</style></head>
<body><div class="wrap">
  <div class="head">
    <button class="volver" id="volver" type="button">← Volver</button>
    <div class="k">Casa Pepe</div>
    <h1>Mejora tu estancia</h1>
    <div class="s">Antes de llegar, sube de categoría — tú pones el precio.</div>
  </div>
  <div id="cont"><div class="empty">Cargando tus opciones…</div></div>
  <div class="foot">Mi Casa Pepe es tu Casa <img src="/img/casapepe/casapepe_isotipo_color.png" alt="Casa Pepe" style="height:17px;width:auto;vertical-align:-4px;margin-left:3px"></div>
</div>

<div class="ov" id="lb"><div class="sheet"><div class="lbhead"><div class="lbstage" id="lbstage"></div>
  <button class="lbx" id="lbx" aria-label="Cerrar">✕</button></div>
  <div class="lbbody"><h3 id="lbnm"></h3><div class="sp" id="lbsp"></div><p class="ds" id="lbds"></p><ul class="feat" id="lbfeat"></ul></div>
</div></div>

<div class="ov" id="cm"><div class="sheet"><div class="cm">
  <div class="em">🎉</div>
  <h3>¡Tienes tu nueva habitación a un solo clic!</h3>
  <p id="cmroom"></p>
  <div class="price" id="cmprice"></div>
  <div class="acts"><button class="btn ghost" id="cmno">Ahora no</button><button class="btn" id="cmyes">Confirmar</button></div>
</div></div></div>

<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var q=new URLSearchParams(location.search);
  var RESV=q.get('resv')||'', RID=q.get('rid')||'', PROP=(q.get('prop')||'cdmx').toLowerCase();
  (function(){ var v=document.getElementById('volver'); if(v) v.onclick=function(){ if(history.length>1){ history.back(); } else { location.href='/apepe/'+(RESV?('?resv='+encodeURIComponent(RESV)):''); } }; })();
  var NOCHES=1, OPS=[], ACT={};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }
  function api(body){ return fetch(SB+'/functions/v1/apepe-upgrade',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(r){return r.json();}); }
  function base(extra){ var o=extra||{}; if(RESV) o.resv=RESV; else { o.reservation_id=RID; o.prop=PROP; } return o; }
  function ph(url){ return url ? '<span class="ph" style="background-image:url(\''+esc(url)+'\')"></span>' : '<span class="ph ph-empty">Casa Pepe</span>'; }
  function specLine(r){ var pax=r.pax?esc(r.pax)+' pax':''; var m2=r.m2?esc(r.m2)+' m²':''; var bano=r.bano?esc(r.bano):''; return [pax,m2,bano].filter(Boolean).join(' · ')||'—'; }
  function ganas(r){ var list=Array.isArray(r.gana)&&r.gana.length?r.gana:[]; list=list.slice(0,4); if(!list.length) return ''; return '<div class="incluye"><b>Ganas:</b> '+list.map(esc).join(' · ')+'</div>'; }
  function esPrivada(op){ return op.clase==='privada'||op.clase==='suite'; }
  function porNoche(perNight){ if(NOCHES>1) return money(perNight)+' /noche · '+NOCHES+' noches = '+money(perNight*NOCHES); return money(perNight)+' /noche'; }

  api(base({accion:'opciones'})).then(function(d){
    var cont=document.getElementById('cont');
    if(!d||!d.ok){ cont.innerHTML='<div class="empty">No pudimos cargar tus opciones ahora. Inténtalo más tarde o pregunta en recepción.</div>'; return; }
    NOCHES=Number(d.noches||1)||1; OPS=Array.isArray(d.opciones)?d.opciones:[]; ACT=d.cuarto_actual||{};
    if(!OPS.length){ cont.innerHTML='<div class="empty">Por ahora no hay upgrades disponibles para tu reserva. ¡Ya estás muy bien! 🧡</div>'; return; }
    var html='';
    OPS.forEach(function(op,i){
      var t=op.target||{}, nombre=esc(t.nombre||'Habitación'); var fijo=(op.tipo==='fijo'); var priv=esPrivada(op);
      var clase=fijo?'Habitación privada':(op.clase==='suite'?'Suite':'Dormitorio'); var tagCls=fijo?'tagp fijo':'tagp';
      var zoom = priv ? '<button class="zoom" data-amp="'+i+'">⤢ Ampliar</button>' : '';
      var compara='<div class="compare">'+
        '<div class="side from">'+ph(ACT.foto)+'<span class="tag">Ahora</span></div>'+
        '<div class="arrow">→</div>'+
        '<div class="side to">'+ph(t.foto)+'<span class="tag">Mejora</span>'+zoom+'</div>'+
      '</div>';
      var specs='<div class="specc">'+
        '<div class="sc"><div class="scl">Ahora</div><div class="scnm">'+esc(ACT.nombre||'Tu cuarto')+'</div><div class="scv">'+specLine(ACT)+'</div></div>'+
        '<div class="sc to"><div class="scl">Mejora</div><div class="scnm">'+nombre+'</div><div class="scv">'+specLine(t)+'</div></div>'+
      '</div>';
      var cuerpo='<div class="body"><div class="rowh"><div class="nm">'+nombre+'</div><span class="'+tagCls+'">'+clase+'</span></div>';
      if(priv){ cuerpo+=ganas(t); if((t.fotos&&t.fotos.length)||t.desc||(t.features&&t.features.length)) cuerpo+='<div><button class="verdet" data-amp="'+i+'">Ver fotos y detalle</button></div>'; }
      if(fijo){
        cuerpo+='<div class="sub">Sube a una privada por la diferencia real del día — habitación solo para ti.</div>'+
          '<button class="btn full" data-fijo="'+i+'">Subir por '+money(op.precio_noche)+' /noche</button>'+
          (NOCHES>1?'<div class="pern">El precio es por noche · '+NOCHES+' noches = '+money(op.precio)+'</div>':'')+
          '<div class="msg" id="m'+i+'"></div>';
      } else {
        cuerpo+='<div class="sub">¿Cuánto ofreces <b>por noche</b> por subir a este cuarto?</div>'+
          '<div class="offer"><div class="money"><span>$</span><input type="number" inputmode="numeric" min="1" placeholder="0" id="in'+i+'"></div>'+
          '<button class="btn" data-puja="'+i+'">Ofrecer</button></div>'+
          '<div class="pern">Escribe el precio por noche'+(NOCHES>1?' · tu estancia es de '+NOCHES+' noches':'')+'.</div>'+
          '<div class="msg" id="m'+i+'"></div>';
      }
      cuerpo+='</div>';
      html+='<div class="card'+(fijo?' top':'')+'" data-i="'+i+'">'+compara+specs+cuerpo+'</div>';
    });
    cont.innerHTML=html;
    wire(cont);
  }).catch(function(){ document.getElementById('cont').innerHTML='<div class="empty">No pudimos cargar tus opciones. Pregunta en recepción.</div>'; });

  function showMsg(i,cls,txt){ var m=document.getElementById('m'+i); if(m){ m.className='msg on '+cls; m.innerHTML=txt; } }

  // ---- Lightbox detalle ----
  var lb=document.getElementById('lb'), lbStage=document.getElementById('lbstage'), lbImgs=[], lbIdx=0;
  function lbRender(){ if(!lbImgs.length){ lbStage.innerHTML='<div style="aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#fff;background:#333">Sin fotos</div>'; return; }
    var nav = lbImgs.length>1 ? '<button class="lbnav prev" id="lbprev">‹</button><button class="lbnav next" id="lbnext">›</button><div class="lbcount">'+(lbIdx+1)+' / '+lbImgs.length+'</div>' : '';
    lbStage.innerHTML='<img src="'+esc(lbImgs[lbIdx])+'" alt="">'+nav;
    var p=document.getElementById('lbprev'), n=document.getElementById('lbnext');
    if(p) p.onclick=function(){ lbIdx=(lbIdx-1+lbImgs.length)%lbImgs.length; lbRender(); };
    if(n) n.onclick=function(){ lbIdx=(lbIdx+1)%lbImgs.length; lbRender(); };
  }
  function openLB(i){ var t=(OPS[i]||{}).target||{}; lbImgs=Array.isArray(t.fotos)&&t.fotos.length?t.fotos:(t.foto?[t.foto]:[]); lbIdx=0;
    document.getElementById('lbnm').textContent=t.nombre||'Habitación';
    document.getElementById('lbsp').textContent=specLine(t);
    document.getElementById('lbds').textContent=t.desc||'';
    var ul=document.getElementById('lbfeat'); var fs=Array.isArray(t.features)?t.features:[]; ul.innerHTML=fs.map(function(f){return '<li><span class="ic">✓</span><span>'+esc(f)+'</span></li>';}).join('');
    lbRender(); lb.classList.add('on');
  }
  document.getElementById('lbx').onclick=function(){ lb.classList.remove('on'); };
  lb.onclick=function(e){ if(e.target===lb) lb.classList.remove('on'); };

  // ---- Confirm ----
  var cm=document.getElementById('cm'), cmPending=null;
  function openConfirm(i, perNight){ var t=(OPS[i]||{}).target||{}; cmPending={i:i, perNight:perNight};
    document.getElementById('cmroom').textContent='Confirmar tu cambio a '+(t.nombre||'tu nueva habitación')+'.';
    document.getElementById('cmprice').innerHTML='+'+porNoche(perNight)+'<small>El precio es por noche. Lo dejamos listo para tu llegada.</small>';
    cm.classList.add('on');
  }
  document.getElementById('cmno').onclick=function(){ cm.classList.remove('on'); cmPending=null; };
  cm.onclick=function(e){ if(e.target===cm) cm.classList.remove('on'); };
  document.getElementById('cmyes').onclick=function(){ if(!cmPending) return; var i=cmPending.i, op=OPS[i]; var yes=document.getElementById('cmyes'); yes.disabled=true; yes.textContent='…';
    var body=base({accion:'confirmar',target_id:op.target.id}); if(op.tipo!=='fijo') body.bid=cmPending.perNight;
    api(body).then(function(r){ yes.disabled=false; yes.textContent='Confirmar'; cm.classList.remove('on');
      if(r&&r.ok&&r.decision==='confirmado'){ showMsg(i,'ok','🎉 '+esc(r.mensaje)); lockCard(i); }
      else { showMsg(i,'warn',(r&&r.mensaje)||'No se pudo confirmar. Intenta de nuevo.'); }
      cmPending=null;
    }).catch(function(){ yes.disabled=false; yes.textContent='Confirmar'; cm.classList.remove('on'); showMsg(i,'warn','Error de conexión.'); });
  };
  function lockCard(i){ var card=document.querySelector('.card[data-i="'+i+'"]'); if(!card) return;
    var b=card.querySelector('[data-puja],[data-fijo]'); if(b){ b.disabled=true; b.textContent='¡Confirmado!'; }
    var inp=document.getElementById('in'+i); if(inp) inp.disabled=true; }

  function wire(cont){
    Array.prototype.forEach.call(cont.querySelectorAll('[data-amp]'),function(b){ b.onclick=function(){ openLB(+b.getAttribute('data-amp')); }; });
    Array.prototype.forEach.call(cont.querySelectorAll('[data-puja]'),function(b){
      b.onclick=function(){ var i=+b.getAttribute('data-puja'); var op=OPS[i]; var v=Number((document.getElementById('in'+i).value||'').replace(/[^0-9.]/g,''));
        if(!v){ showMsg(i,'warn','Escribe cuánto quieres ofrecer por noche.'); return; }
        b.disabled=true; b.textContent='…';
        api(base({accion:'evaluar',target_id:op.target.id,bid:v})).then(function(r){
          b.disabled=false; b.textContent='Ofrecer';
          if(!r||!r.ok){ showMsg(i,'warn','No se pudo procesar. Intenta de nuevo.'); return; }
          if(r.decision==='acepta'){ showMsg(i,'ok','✓ '+esc(r.mensaje)); openConfirm(i, v); }
          else if(r.decision==='recepcion'){ showMsg(i,'warn','Esa oferta se queda cortita 🙂 Sube un poco tu propuesta e inténtalo de nuevo.'); var _in=document.getElementById('in'+i); if(_in) _in.focus(); }
          else { showMsg(i,'warn','Sube un poco tu propuesta e inténtalo de nuevo 🙂'); }
        }).catch(function(){ b.disabled=false; b.textContent='Ofrecer'; showMsg(i,'warn','Error de conexión.'); });
      };
    });
    Array.prototype.forEach.call(cont.querySelectorAll('[data-fijo]'),function(b){
      b.onclick=function(){ var i=+b.getAttribute('data-fijo'); var op=OPS[i]; b.disabled=true; b.textContent='…';
        api(base({accion:'evaluar',target_id:op.target.id})).then(function(r){
          b.disabled=false; b.textContent='Subir por '+money(op.precio_noche)+' /noche';
          if(r&&r.ok&&r.decision==='precio_fijo'){ openConfirm(i, r.precio_noche||op.precio_noche); }
          else if(r&&r.decision==='recepcion'){ showMsg(i,'warn','Por muy poquito. Vuelve a intentarlo en un momento 🙂'); }
          else { showMsg(i,'warn',(r&&r.mensaje)||'No disponible ahora. Inténtalo de nuevo.'); }
        }).catch(function(){ b.disabled=false; b.textContent='Subir por '+money(op.precio_noche)+' /noche'; showMsg(i,'warn','Error de conexión.'); });
      };
    });
  }
})();
</script>
</body></html>
