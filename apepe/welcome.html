<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Welcome · Casa Pepe</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Welcome">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-suave:#FBDCEE; --rosa:#F8BBCB;
  --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:40px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .back{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:2px 6px}
.top .av{width:40px;height:40px;border-radius:50%;background:var(--naranja);flex:none;overflow:hidden}
.top .av img{width:100%;height:100%;object-fit:cover;display:block}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:18px;line-height:1.1}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px}
.top .hueco{flex:1}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:rgba(255,255,255,.7);font:inherit;font-size:11.5px;
  font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button.on{background:#fff;color:var(--tinta)}
.franja{height:8px;display:flex}
.franja i{flex:1}

.hero{padding:20px 0 2px}
.hero h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:25px;line-height:1.05;margin:0}
.hero p{color:var(--gris);font-size:14px;margin:9px 0 0;line-height:1.6}

.seclab{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12px;
  letter-spacing:.09em;color:var(--gris);margin:24px 0 2px}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:15px 16px;margin-top:10px}
.card h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14px;
  letter-spacing:.04em;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.card h3 .em{font-size:17px}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--tinta-2)}
.card .hora{display:inline-block;margin-top:8px;background:var(--hueso);color:var(--gris);
  font-family:'Oswald',sans-serif;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:6px}
.tip{display:flex;gap:11px;padding:11px 0;border-top:1px solid var(--linea);font-size:14px;line-height:1.55}
.tip:first-of-type{border-top:0}
.tip .em{font-size:19px;flex:0 0 auto;line-height:1.3}
.tip b{display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:0;border-radius:11px;background:var(--naranja);color:#fff;font-family:'Oswald',sans-serif;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px;
  padding:12px 18px;text-decoration:none;margin-top:14px}
.btn.plano{background:var(--blanco);color:var(--tinta);border:1px solid var(--linea)}
</style>
<script src="/apepe/resv.js"></script>
<script src="/apepe/marca.js"></script>
</head>

    <div class="av"><img src="/img/apepe/stickers/hola-perrito.webp" alt=""></div>
    <div><div class="nom" id="tTitulo">Welcome</div>

<div class="franja">
  <i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i>

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* El idioma: el que eligió antes, si no el del teléfono, si no español. */
var LANG=(function(){
  try{ var g=localStorage.getItem('apepe_lang'); if(g==='es'||g==='en')return g; }catch(_){}
  return /^en/i.test(navigator.language||'')?'en':'es';
})();

/* La SEDE la dice la reserva (resv.js). Un huésped de Puebla ve la bienvenida de
   Puebla; uno de CDMX, la de CDMX. Por defecto, CDMX. */
var SEDE=(function(){
  try{ var s=(window.apepeResv&&window.apepeResv.sede&&window.apepeResv.sede())||''; if(s==='cdmx'||s==='puebla') return s; }catch(_){}
  try{ var g=localStorage.getItem('apepe_sede'); if(g==='puebla'||g==='cdmx') return g; }catch(_){}
  return 'cdmx';
})();
if(!T[SEDE]) SEDE='cdmx';

var P=new URLSearchParams(location.search);
var qs=P.get('resv')?('?resv='+encodeURIComponent(P.get('resv'))):'';
$('back').href='/apepe/index.html'+qs;

function pinta(){
  var t=T[SEDE][LANG];
  document.documentElement.lang=LANG;
  $('tTitulo').textContent=t.titulo; $('tSub').textContent=t.sub;
  $('hTit').textContent=t.hTit; $('hTxt').textContent=t.hTxt;
  $('lCasa').textContent=t.lCasa; $('lCiudad').textContent=t.lCiudad;
  $('bMapa').textContent=t.bMapa; $('bPepe').textContent=t.bPepe;
  $('casa').innerHTML=t.casa.map(function(c){
    return '<div class="card"><h3><span class="em">'+c[0]+'</span>'+esc(c[1])+'</h3>'+
      '<p>'+esc(c[2])+'</p>'+(c[3]?'<span class="hora">'+esc(c[3])+'</span>':'')+'</div>';
  }).join('');
  $('ciudad').innerHTML=t.ciudad.map(function(c){
    var link = c[3] ? ' <a href="'+esc(c[3])+'" target="_blank" rel="noopener" style="color:var(--naranja);font-weight:700;white-space:nowrap">'+esc(c[4]||'Ver')+' ↗</a>' : '';
    return '<div class="tip"><span class="em">'+c[0]+'</span><span><b>'+esc(c[1])+'</b>'+
      esc(c[2])+link+'</span></div>';
  }).join('');
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-l')===LANG);
  });
}
Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.onclick=function(){
    LANG=b.getAttribute('data-l');
    try{ localStorage.setItem('apepe_lang',LANG); }catch(_){}
    pinta();
  };
});
$('bPepe').href='/apepe/hola-pepe.html'+qs;
pinta();
})();
</script>
