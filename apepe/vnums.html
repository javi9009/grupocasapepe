<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vnums · Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vnums">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --rosa:#F8BBCB; --cielo:#8DC8EA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF; --ok:#1D6B4A;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:40px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .back{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:2px 6px}
.top .av{width:40px;height:40px;border-radius:50%;background:#fff;flex:none;overflow:hidden}
.top .av img{width:100%;height:100%;object-fit:contain;display:block;padding:2px}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:18px;line-height:1.1}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px}
.top .hueco{flex:1}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:rgba(255,255,255,.7);font:inherit;font-size:11.5px;
  font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button.on{background:#fff;color:var(--tinta)}
.franja{display:flex;height:6px}
.franja i{flex:1}

/* El saldo. Un número grande y una frase: no es una cuenta de banco. */
.saldo{background:var(--tinta);color:#fff;border-radius:var(--radio);padding:20px 18px;
  margin:18px 0 6px;box-shadow:var(--sombra)}
.saldo .n{font-family:'Oswald',sans-serif;font-weight:700;font-size:44px;line-height:1;
  letter-spacing:.02em;display:flex;align-items:baseline;gap:9px}
.saldo .n small{font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--rosa)}
.saldo p{margin:10px 0 0;font-size:12.5px;line-height:1.55;color:rgba(255,255,255,.72)}
.movs{margin:12px 0 0;border-top:1px solid rgba(255,255,255,.14);padding-top:10px;display:none}
.movs.on{display:block}
.movs div{display:flex;gap:10px;justify-content:space-between;font-size:12.5px;
  color:rgba(255,255,255,.8);padding:5px 0}
.movs b{font-variant-numeric:tabular-nums;color:#fff;flex:none}
.verMas{background:none;border:0;color:var(--rosa);font:inherit;font-size:12px;font-weight:700;
  padding:8px 0 0;cursor:pointer}

.seclab{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.12em;
  font-size:12px;color:var(--tenue);margin:26px 0 12px}

/* Las cartas. Como las de la lotería: por delante el dibujo, se tocan y por
   detrás está el QR. Las cobradas se quedan en gris y ya no giran. */
.baraja{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.carta{perspective:1100px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.carta .gira{position:relative;width:100%;aspect-ratio:3/4.1;transition:transform .55s cubic-bezier(.4,.1,.2,1);
  transform-style:preserve-3d}
.carta.vuelta .gira{transform:rotateY(180deg)}
.cara{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radio);background:var(--blanco);border:1px solid var(--linea);
  box-shadow:var(--sombra);overflow:hidden;display:flex;flex-direction:column}
.cara.atras{transform:rotateY(180deg);align-items:center;justify-content:center;padding:12px;gap:8px}
.cara .marco{height:5px;flex:none}
.cara .dib{flex:1;display:flex;align-items:center;justify-content:center;padding:12px 10px 0;min-height:0}
.cara .dib img{max-width:100%;max-height:100%;object-fit:contain}
.cara .pie{padding:8px 11px 12px;text-align:center}
.cara .pie b{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:.04em;font-size:12.5px;line-height:1.2}
.cara .pie span{display:block;font-size:10.5px;color:var(--tenue);margin-top:3px}
.qr{width:100%;max-width:150px;aspect-ratio:1;background:#fff}
.cod{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;font-size:13px;
  letter-spacing:.14em}
.dato{font-size:10.5px;color:var(--tenue);text-align:center;line-height:1.4}
.carta.usada .cara{filter:grayscale(1);opacity:.55}
.carta.usada{cursor:default}
.sello{position:absolute;top:10px;left:50%;transform:translateX(-50%) rotate(-7deg);
  font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:11px;
  border:2px solid var(--gris);color:var(--gris);border-radius:6px;padding:2px 8px;
  background:rgba(255,255,255,.85);z-index:2}

.aviso{background:var(--naranja-suave);border:1px solid #F6C9B1;border-radius:var(--radio);
  padding:14px 16px;font-size:13.5px;line-height:1.55;margin:18px 0 0}
.vacio{background:var(--blanco);border:1px dashed var(--linea);border-radius:var(--radio);
  padding:24px 18px;text-align:center;color:var(--tenue);font-size:13.5px;line-height:1.6}
.nota{font-size:11.5px;color:var(--tenue);line-height:1.5;margin:14px 0 0}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <a class="back" id="back" href="/apepe/" aria-label="Volver">←</a>
    <div class="av"><img src="/img/apepe/stickers/mezcal.webp" alt=""
      onerror="this.parentNode.style.display='none'"></div>
    <div><div class="nom" id="tTitulo">Vnums</div>
      <div class="sub" id="tSub">tu billetera</div></div>
    <div class="hueco"></div>
    <div class="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div>
  </div>
</header>
<div class="franja">
  <i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i>
  <i style="background:var(--rosa)"></i><i style="background:var(--cielo)"></i>
</div>

<div class="wrap">
  <div class="saldo">
    <div class="n"><span id="sNum">—</span><small>VNUMS</small></div>
    <p id="sTxt"></p>
    <div class="movs" id="movs"></div>
    <button class="verMas" id="bMovs" style="display:none"></button>
  </div>

  <div class="seclab" id="labCartas">Tus cartas</div>
  <div id="baraja"></div>
  <p class="nota" id="notaPie"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';

var T={
  es:{ titulo:'Vnums', sub:'tu billetera',
       labCartas:'Tus cartas',
       saldoTxt:'Cada peso que un tour deja en la comunidad te vuelve como un Vnum. '+
                'Todavía estamos decidiendo dónde se canjean: por ahora se guardan.',
       saldoCero:'Todavía no tienes Vnums. Se ganan con las experiencias de Sincrético: '+
                 'cada peso que el tour deja en la comunidad te vuelve como un Vnum.',
       verMovs:'Ver de dónde salieron', ocultar:'Ocultar',
       vacio:'Aquí van a aparecer tus cartas. La primera llega cuando hagas el check-in.',
       tocar:'Tócala para ver el QR', usada:'Usada', caducada:'Caducó',
       enseña:'Enséñalo en la terraza', enseñaSinc:'Enséñalo al reservar',
       cobrada:'Cobrada el', gano:{checkin:'Por tu check-in', quiz:'Por ganar el PepeQuiz',
                viernes:'Regalo del viernes', mano:'De parte de la casa'},
       persona:'Persona', de:'de',
       pie:'El QR sólo vive aquí, en la app: por eso no se puede copiar ni cobrar dos veces. '+
           'Quien lo cobra es el equipo de terraza, desde su propio celular.' },
  en:{ titulo:'Vnums', sub:'your wallet',
       labCartas:'Your cards',
       saldoTxt:'Every peso a tour leaves in the community comes back to you as a Vnum. '+
                'We are still deciding where they can be spent: for now they just add up.',
       saldoCero:'No Vnums yet. You earn them with Sincrético experiences: every peso the tour '+
                 'leaves in the community comes back to you as a Vnum.',
       verMovs:'See where they came from', ocultar:'Hide',
       vacio:'Your cards will show up here. The first one arrives when you check in.',
       tocar:'Tap it to see the QR', usada:'Used', caducada:'Expired',
       enseña:'Show it at the terrace', enseñaSinc:'Show it when you book',
       cobrada:'Redeemed on', gano:{checkin:'For checking in', quiz:'For winning the PepeQuiz',
                viernes:'Friday gift', mano:'On the house'},
       persona:'Guest', de:'of',
       pie:'The QR only lives here, in the app — that is why it cannot be copied or redeemed '+
           'twice. The terrace team redeems it from their own phone.' }
};

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var LANG=(function(){
  try{ var g=localStorage.getItem('apepe_lang'); if(g==='es'||g==='en')return g; }catch(_){}
  return /^en/i.test(navigator.language||'')?'en':'es';
})();

var P=new URLSearchParams(location.search);
var TOKEN=P.get('resv')||'';
var qs=TOKEN?('?resv='+encodeURIComponent(TOKEN)):'';
$('back').href='/apepe/index.html'+qs;

var CARTAS=[], SALDO=0, MOVS=[], abiertas={};

async function rpc(f,b){
  var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',
    headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify(b||{})});
  if(!r.ok) throw new Error('Respondió '+r.status);
  return await r.json();
}

function fecha(ts){
  if(!ts)return '';
  try{ return new Date(ts).toLocaleDateString(LANG==='en'?'en-GB':'es-MX',
    {day:'numeric',month:'short'}); }catch(_){ return ''; }
}

function pintaSaldo(){
  var t=T[LANG];
  $('sNum').textContent=SALDO.toLocaleString(LANG==='en'?'en-US':'es-MX');
  $('sTxt').textContent = SALDO>0 ? t.saldoTxt : t.saldoCero;
  var b=$('bMovs');
  if(!MOVS.length){ b.style.display='none'; return; }
  b.style.display='';
  b.textContent = $('movs').classList.contains('on') ? t.ocultar : t.verMovs;
  $('movs').innerHTML=MOVS.map(function(m){
    return '<div><span>'+esc(m.concepto||m.motivo||'')+'</span>'+
           '<b>'+(m.vnums>0?'+':'')+Number(m.vnums).toLocaleString('es-MX')+'</b></div>';
  }).join('');
}

/* El QR se dibuja sólo cuando la carta se voltea: pintar treinta lienzos de
   golpe en un teléfono se nota, y casi ninguno se va a mirar. */
function dibujaQR(el, codigo){
  if(el.getAttribute('data-listo')==='1') return;
  el.setAttribute('data-listo','1');
  try{
    QRCode.toCanvas(el, codigo, {width:300, margin:1,
      color:{dark:'#1E1A16', light:'#FFFFFF'}}, function(){});
  }catch(_){ }
}

function pintaCartas(){
  var t=T[LANG];
  if(!CARTAS.length){
    $('baraja').innerHTML='<div class="vacio">'+esc(t.vacio)+'</div>';
    return;
  }
  $('baraja').className='baraja';
  $('baraja').innerHTML=CARTAS.map(function(c,i){
    var viva=c.estado==='activa';
    var titulo=LANG==='en'?(c.premio_en||c.premio):c.premio;
    var lema  =LANG==='en'?(c.lema_en||c.lema):c.lema;
    var sello = c.estado==='usada' ? t.usada : (c.estado==='caducada' ? t.caducada : '');
    var comoGano = t.gano[c.origen] || t.gano.mano;
    var donde = c.donde==='terraza' ? t.enseña : t.enseñaSinc;
    return '<div class="carta'+(viva?'':' usada')+(abiertas[c.codigo]?' vuelta':'')+
             '" data-c="'+esc(c.codigo)+'"'+(viva?' tabindex="0" role="button"':'')+'>'+
      (sello?'<span class="sello">'+esc(sello)+'</span>':'')+
      '<div class="gira">'+
        '<div class="cara">'+
          '<div class="marco" style="background:'+esc(c.color||'#F2682A')+'"></div>'+
          '<div class="dib">'+(c.sticker?'<img src="'+esc(c.sticker)+'" alt="" '+
            'onerror="this.style.display=\'none\'">':'')+'</div>'+
          '<div class="pie"><b>'+esc(titulo)+'</b><span>'+
            esc(viva ? t.tocar : (c.usada_at ? t.cobrada+' '+fecha(c.usada_at) : sello))+
          '</span></div>'+
        '</div>'+
        '<div class="cara atras">'+
          (viva
            ? '<canvas class="qr" data-qr="'+esc(c.codigo)+'"></canvas>'+
              '<div class="cod">'+esc(c.codigo)+'</div>'+
              '<div class="dato">'+esc(donde)+'<br>'+esc(comoGano)+
              (c.persona>1?'<br>'+esc(t.persona)+' '+c.persona:'')+'</div>'
            : '<div class="dato" style="font-size:12px">'+esc(sello)+
              (c.usada_at?'<br>'+esc(t.cobrada)+' '+fecha(c.usada_at):'')+'</div>')+
        '</div>'+
      '</div></div>';
  }).join('');

  Array.prototype.forEach.call($('baraja').querySelectorAll('.carta:not(.usada)'),function(el){
    function voltea(){
      var cod=el.getAttribute('data-c');
      el.classList.toggle('vuelta');
      abiertas[cod]=el.classList.contains('vuelta');
      var cv=el.querySelector('canvas[data-qr]');
      if(cv && el.classList.contains('vuelta')) dibujaQR(cv, cod);
    }
    el.onclick=voltea;
    el.onkeydown=function(ev){ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();voltea();} };
  });
}

function pinta(){
  var t=T[LANG];
  document.documentElement.lang=LANG;
  $('tTitulo').textContent=t.titulo; $('tSub').textContent=t.sub;
  $('labCartas').textContent=t.labCartas;
  $('notaPie').textContent=t.pie;
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-l')===LANG);
  });
  pintaSaldo(); pintaCartas();
}

$('bMovs').onclick=function(){
  $('movs').classList.toggle('on');
  this.textContent = $('movs').classList.contains('on') ? T[LANG].ocultar : T[LANG].verMovs;
};

Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.onclick=function(){
    LANG=b.getAttribute('data-l');
    try{ localStorage.setItem('apepe_lang',LANG); }catch(_){}
    pinta();
  };
});

async function arranca(){
  if(!TOKEN){
    $('baraja').innerHTML='<div class="vacio">'+
      esc(LANG==='en' ? 'Open this from your reservation link so we know who you are.'
                      : 'Ábrelo desde la liga de tu reserva, que es como sabemos quién eres.')+
      '</div>';
    pinta(); return;
  }
  try{
    var r=await Promise.all([
      rpc('vnum_mis_cartas',{p_token:TOKEN}),
      rpc('vnum_mi_saldo',{p_token:TOKEN})
    ]);
    CARTAS=r[0]||[];
    var s=(r[1]||[])[0]||{};
    SALDO=Number(s.vnums||0);
    MOVS=(s.movimientos||[]).slice(0,8);
  }catch(x){
    $('baraja').innerHTML='<div class="vacio">'+esc(String(x.message||x))+'</div>';
  }
  pinta();
}
arranca();
})();
</script>
</body>
</html>
