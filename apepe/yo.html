<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C;
  --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:14px;
}
/* Interruptores de avisos. El de push no es un gusto: es un permiso del navegador,
   así que puede quedarse apagado aunque el huésped lo encienda. Por eso su texto
   de abajo cuenta qué pasó. */
.sw{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-bottom:1px solid var(--linea)}
.sw:last-child{border-bottom:0}
.sw .tx{flex:1}
.sw .tx b{display:block;font-size:14.5px}
.sw .tx span{display:block;color:var(--gris);font-size:12.5px;margin-top:2px;line-height:1.45}
.sw input{appearance:none;-webkit-appearance:none;width:46px;height:27px;border-radius:999px;
  background:var(--linea);position:relative;cursor:pointer;flex:none;margin-top:3px;transition:background .18s}
.sw input:checked{background:var(--naranja)}
.sw input::after{content:'';position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:999px;
  background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked::after{left:22px}
.sw input:disabled{opacity:.5;cursor:not-allowed}
.swNota{color:var(--tenue);font-size:12px;margin-top:10px;line-height:1.45}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:calc(74px + env(safe-area-inset-bottom))}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .marca{height:38px;width:auto;flex:0 0 auto}
/* Logo arriba y sede debajo, centrados entre sí: es un bloque, no dos cosas. */
.top .marcafila{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.top .der{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--cielo);text-transform:uppercase}
.top .izq{flex:1;min-width:0}
.top .bienv{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:17px;line-height:1.1}
.top .lema{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px;line-height:1.25;opacity:.75}
.top .dcha{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.top .hueco{flex:1}
@media(max-width:380px){ .top .bienv{font-size:15px} .top .marca{height:32px} .top .in{gap:10px} }
.franja{height:8px;display:flex}
.franja i{flex:1}

.hola{padding:18px 0 4px;display:flex;align-items:center;gap:13px}
.hola img{width:56px;height:56px;object-fit:contain;flex:0 0 auto}
.hola h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:23px;line-height:1.05;margin:0}
.hola .baja{color:var(--gris);font-size:13.5px;margin-top:2px}

.card{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px 17px;margin:14px 0}
.card h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14.5px;
  letter-spacing:.04em;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.card .dice{color:var(--gris);font-size:12.5px;margin:0 0 12px;line-height:1.5}
.li{display:flex;justify-content:space-between;gap:14px;padding:7px 0;font-size:14px;
  border-top:1px solid var(--linea)}
.li:first-of-type{border-top:0}
.li span{color:var(--gris)}
.li b{text-align:right}
.vacio{color:var(--tenue);font-size:13.5px;padding:6px 0;line-height:1.5}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:0;border-radius:11px;background:var(--naranja);color:#fff;font-family:'Oswald',sans-serif;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px;
  padding:12px 18px;cursor:pointer;text-decoration:none;margin-top:12px}
.btn:hover{background:var(--naranja-oscuro)}
.btn:disabled{background:var(--linea);color:var(--tenue)}
.btn.plano{background:var(--blanco);color:var(--tinta);border:1px solid var(--linea)}
.btn.plano:hover{background:var(--hueso)}

.bol{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--linea)}
.bol:first-of-type{border-top:0}
.bol .foto{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:0 0 auto;
  background:linear-gradient(135deg,var(--naranja-suave),var(--cielo-suave))}
.bol .foto img{width:100%;height:100%;object-fit:cover;display:block}
.bol .qu{flex:1;min-width:0}
.bol .qu b{display:block;font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;
  text-transform:uppercase;line-height:1.2}
.bol .qu span{display:block;color:var(--gris);font-size:12.5px;margin-top:1px}
.bol .ver{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--naranja-oscuro);
  text-decoration:none;white-space:nowrap}
.et{display:inline-block;font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;
  letter-spacing:.09em;text-transform:uppercase;padding:2px 7px;border-radius:5px;
  background:var(--hueso);color:var(--gris)}
.et.ok{background:var(--ok-bg);color:var(--ok)}
.et.pend{background:var(--alerta-bg);color:var(--alerta)}
.wb{background:var(--cielo-suave);border-color:var(--cielo)}
.wb .precios{display:flex;gap:16px;align-items:baseline;margin-top:8px}
.wb .precios s{color:var(--tenue)}
.wb .precios b{font-family:'Oswald',sans-serif;font-size:21px;color:var(--ok)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--blanco);
  border-top:1px solid var(--linea);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px -20px rgba(30,26,22,.5)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;
  color:var(--gris);font-size:10.5px;font-weight:600;padding:5px 0}
.tabbar a .ti{font-size:20px;line-height:1;height:22px;display:flex;align-items:center;justify-content:center}
/* El columnario en vez del emoji de moneda: es el logo de los Vnums. */
.tabbar a .ti .tiMon{width:21px;height:21px;display:block;filter:grayscale(1) contrast(1.15)}
.tabbar a.on .ti .tiMon,.tabbar a:hover .ti .tiMon{filter:none}
.tabbar a .ti img{height:24px;width:24px;object-fit:contain;display:block}
.tabbar a.on{color:var(--naranja)}
.tabbar a.soon{opacity:.55}
</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="/sinc/sinc-cuenta.js"></script>
<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var P=new URLSearchParams(location.search);
var RESV=(P.get('resv')||'').trim();
var qs=RESV?('?resv='+encodeURIComponent(RESV)):'';

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){try{return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
  catch(e){return '$'+n;}}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fecha(s){
  if(!s)return '';
  var p=String(s).slice(0,10).split('-');
  return (+p[2])+' '+T(MES[(+p[1])-1])+' '+p[0];
}
async function fn(nombre,cuerpo){
  var r=await fetch(SB+'/functions/v1/'+nombre,{method:'POST',
    headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(cuerpo||{})});
  var t=await r.text(), j=null; try{j=t?JSON.parse(t):null;}catch(_){}
  if(!r.ok)throw new Error((j&&j.error)||T('Respondió {c}').replace('{c}',r.status));
  return j;
}


/* ---------- la reserva ---------- */
async function pintaReserva(){
  if(!RESV){
    $('res').innerHTML='<div class="vacio">'+esc(T('Abre esta pantalla desde la liga de tu reserva '+
      '—la que te mandamos por correo o WhatsApp— y aquí verás tus fechas.'))+'</div>';
    return null;
  }
  var j=null;
  try{ j=await fn('apepe-reserva',{resv:RESV}); }catch(_){}
  var v=j&&j.ok&&j.reserva?j.reserva:null;
  if(!v){ $('res').innerHTML='<div class="vacio">'+esc(T('No pudimos traer tu reserva ahora mismo.'))+'</div>'; return null; }

  if(v.nombre){
    $('hNom').textContent=T('Hola, {n}').replace('{n}',String(v.nombre).split(' ')[0]);
    $('hSub').textContent=T('Tu reserva, tus papeles y lo que has comprado.');
  }
  var l=[];
  l.push([T('Cuándo'), fecha(v.desde)+' → '+fecha(v.hasta)+(v.noches?' · '+(v.noches===1?T('{n} noche'):T('{n} noches')).replace('{n}',v.noches):'')]);
  if(v.habitacion)l.push([T('Habitación'), v.habitacion]);
  if(v.pax)l.push([T('Personas'), String(v.pax)]);
  if(v.desayuno)l.push([T('Desayuno'), v.desayuno]);
  if(v.reserva)l.push([T('Reserva'), v.reserva]);
  if(v.fuente)l.push([T('Reservaste por'), v.fuente]);
  $('res').innerHTML=l.map(function(x){
    return '<div class="li"><span>'+esc(x[0])+'</span><b>'+esc(x[1])+'</b></div>';}).join('')+
    (j.ya_checkin?'<div style="margin-top:10px"><span class="et ok">'+esc(T('Check-in hecho'))+'</span></div>'
      :'<a class="btn" href="/apepe/checkin.html'+qs+'">'+esc(T('Hacer el check-in'))+'</a>');
  return v;
}

/* ---------- los papeles ---------- */
async function pintaDocs(){
  if(!RESV){ $('cDoc').style.display='none'; return; }
  var j=null;
  try{ j=await fn('apepe-doc',{accion:'mio',token:RESV}); }catch(_){}
  if(!j||!j.ok||!j.hay){
    $('doc').innerHTML='<div class="vacio">'+esc(T('Todavía no hay nada firmado. Aparecerá aquí en cuanto '+
      'termines el check-in.'))+'</div>';
    return;
  }
  $('doc').innerHTML=
    '<div class="li"><span>'+esc(T('Contrato de hospedaje'))+'</span>'+
      '<b><span class="et ok">'+esc(T('Firmado'))+(j.firmado_at?' · '+fecha(j.firmado_at):'')+'</span></b></div>'+
    '<a class="btn plano" href="'+esc(j.contrato_url)+'" target="_blank" rel="noopener">'+esc(T('Ver mi contrato'))+'</a>'+
    '<div class="vacio" style="margin-top:8px">'+esc(T('La liga vale diez minutos: si caduca, recarga esta pantalla.'))+'</div>';
}

/* ---------- los boletos ---------- */
/* Entra solo con la liga de la reserva: su correo ya lo escribió al reservar el
   hotel, así que no hay que pedirle nada. */
async function pintaBoletos(){
  var yo=null;
  try{ yo=await sincCuenta.yaEntrado(); if(!yo)yo=await sincCuenta.comoHuesped(); }catch(_){}
  if(!yo){
    $('bol').innerHTML='<div class="vacio">'+esc(T('Entra con tu cuenta de Sincrético para ver lo que has '+
      'comprado.'))+'</div><a class="btn plano" href="/sinc/">'+esc(T('Ver experiencias'))+'</a>';
    return;
  }
  var l=[];
  try{
    var h=await sincCuenta.hdr();
    var r=await fetch(SB+'/rest/v1/rpc/sinc_mis_reservas',{method:'POST',headers:h,body:'{}'});
    l=r.ok?(await r.json()||[]):[];
  }catch(_){}
  if(!l.length){
    $('bol').innerHTML='<div class="vacio">'+esc(T('Todavía no has comprado ninguna experiencia.'))+'</div>'+
      '<a class="btn plano" href="/sinc/">'+esc(T('Ver qué hay'))+'</a>';
    return;
  }
  /* La etiqueta miraba sólo el pago, así que una reserva CANCELADA o cuyo enlace de
     pago CADUCÓ salía como «Pago pendiente»: el huésped creía que aún la tenía y se
     quedaba mirando un boleto que no existe. El estado de la reserva manda sobre el
     del pago, y cuando ya no hay nada que hacer se le ofrece volver a reservar.
     Javi, 29-sep. */
  function etiqueta(b){
    var cancelada = b.estado==='cancelada' || b.pago_estado==='caducado' || b.pago_estado==='reembolsado';
    if(cancelada){
      var txt = b.pago_estado==='reembolsado' ? T('Reembolsada')
              : b.pago_estado==='caducado'    ? T('Caducó sin pagar')
              : T('Cancelada');
      return { et:'<span class="et pend">'+txt+'</span>', accion:'otra', qr:false };
    }
    if(b.pago_estado==='pagado'){
      var usada = b.usados>0 && b.usados>=b.boletos;
      return { et:'<span class="et'+(usada?'':' ok')+'">'+(usada?T('Ya la usaste'):T('Pagada'))+'</span>',
               accion:'', qr:!usada && !!b.folio };
    }
    return { et:'<span class="et pend">'+T('Pago pendiente')+'</span>', accion:'pagar', qr:false };
  }

  $('bol').innerHTML=l.map(function(b){
    var cu=[fecha(b.fecha), (b.hora||'').slice(0,5)].filter(Boolean).join(' · ');
    var e=etiqueta(b);
    var boton = e.qr   ? '<a class="ver" href="/boleto?f='+encodeURIComponent(b.folio)+'">'+esc(T('Ver QR'))+'</a>'
              : e.accion==='otra'  ? '<a class="ver" href="/sinc/">'+esc(T('Reservar otra vez'))+'</a>'
              : e.accion==='pagar' ? '<a class="ver" href="/sinc/">'+esc(T('Terminar de pagar'))+'</a>'
              : '';
    return '<div class="bol">'+
      '<span class="foto">'+(b.portada?'<img src="'+esc(b.portada)+'" alt="">':'')+'</span>'+
      '<span class="qu"><b>'+esc(b.experiencia||T('Experiencia'))+'</b>'+
        '<span>'+esc(cu||T('sin fecha'))+' · '+esc((b.pax===1?T('{n} persona'):T('{n} personas')).replace('{n}',b.pax))+
        ' · '+money(b.total)+'</span>'+
        '<span style="margin-top:3px">'+e.et+' <span class="et">'+esc(b.folio||'')+'</span></span></span>'+
      boton+
    '</div>';
  }).join('');
}

/* ---------- la tarifa directa ---------- */
async function pintaWinback(){
  if(!RESV)return;
  var d=null;
  try{ d=await fn('apepe-winback-huesped',{token:RESV,op:'check'}); }catch(_){}
  if(!d||!d.ok||!d.elegible||!d.plan)return;
  $('cWb').style.display='';
  $('wb').innerHTML=
    '<p class="dice" style="margin-bottom:6px">'+
      T('Como reservaste por {f}, puedes pasarte a nuestra tarifa directa con <b>15% menos</b>. Sin penalización.')
        .replace('{f}', esc(d.plan.fuente||T('un canal')))+'</p>'+
    '<div class="precios"><s>'+money(d.plan.precio_ota)+'</s><b>'+money(d.plan.precio_directo)+'</b></div>'+
    '<button class="btn" id="wbBtn">'+esc(T('Solicitar el descuento'))+'</button>'+
    '<div id="wbMsg" style="margin-top:10px"></div>';
  $('wbBtn').onclick=async function(){
    var b=this; b.disabled=true; b.textContent=T('Solicitando…');
    try{
      var j=await fn('apepe-winback-huesped',{token:RESV,op:'solicitar'});
      if(!j||!j.ok)throw new Error((j&&j.error)||T('No se pudo procesar'));
      var t=j.textos||{};
      b.style.display='none';
      $('wbMsg').innerHTML='<div style="background:var(--ok-bg);color:var(--ok);border-radius:10px;'+
        'padding:11px 13px;line-height:1.5;font-size:13.5px">'+
        '<b>✓ '+esc(T('Tu reserva quedó preconfirmada por {p}').replace('{p}',money(j.precio_directo)))+'</b><br>'+
        esc(t.recomendacion||'')+(t.sin_penalidad?'<br><b>'+esc(t.sin_penalidad)+'</b>':'')+
        (j.correo&&j.correo.ok?'<br><span style="opacity:.8">'+esc(T('Te mandamos el detalle por correo.'))+'</span>':'')+
        '</div>';
    }catch(x){
      b.disabled=false; b.textContent=T('Solicitar el descuento');
      $('wbMsg').innerHTML='<div class="vacio">'+esc(String(x.message||x))+'</div>';
    }
  };
}

/* ---------- avisos: qué quiere recibir ---------- */
function rpc(fn,b){ return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
  headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
  body:JSON.stringify(b||{})}).then(function(r){return r.json();}); }

async function pintaAvisos(){
  var caja=$('avs');
  if(!RESV){ caja.innerHTML='<div class="vacio">'+esc(T('Abre esta pantalla desde la liga de tu reserva para configurar tus avisos.'))+'</div>'; return; }
  var pref={};
  try{ pref=await rpc('apepe_notif_prefs',{p_resv:RESV})||{}; }catch(e){}
  if(pref.ok===false){ caja.innerHTML='<div class="vacio">'+esc(T('No reconocemos tu reserva.'))+'</div>'; return; }

  /* El push necesita tres cosas que pueden faltar: service worker, API de
     notificaciones y que el huésped diga que sí. Si falta alguna, el interruptor
     se queda apagado y se explica por qué, en vez de mentir. */
  var puedePush = ('serviceWorker' in navigator) && ('PushManager' in window) && ('Notification' in window);
  var bloqueado = puedePush && Notification.permission === 'denied';

  caja.innerHTML =
    '<div class="sw"><div class="tx"><b>'+esc(T('Ofertas y descuentos'))+'</b>'+
      '<span>'+esc(T('Tarifas directas, upgrades y lo que se nos ocurra regalarte.'))+'</span></div>'+
      '<input type="checkbox" id="avOf"'+(pref.ofertas===false?'':' checked')+'></div>'+
    '<div class="sw"><div class="tx"><b>'+esc(T('Tu estancia'))+'</b>'+
      '<span>'+esc(T('Check-in, tu cuarto, tus experiencias y tus boletos.'))+'</span></div>'+
      '<input type="checkbox" id="avEs"'+(pref.estancia===false?'':' checked')+'></div>'+
    '<div class="sw"><div class="tx"><b>'+esc(T('Avisarme al teléfono'))+'</b>'+
      '<span id="avPuSub">'+esc(
        !puedePush ? T('Tu navegador no puede mandarte avisos. Los verás igual en la campanita de arriba.')
        : bloqueado ? T('Los bloqueaste en este navegador. Actívalos desde los ajustes del sitio y vuelve aquí.')
        : T('Aunque no tengas APePe abierta. Te pedirá permiso una vez.'))+'</span></div>'+
      '<input type="checkbox" id="avPu"'+(pref.push?' checked':'')+(puedePush&&!bloqueado?'':' disabled')+'></div>'+
    '<div class="swNota">'+esc(T('Los avisos son de esta reserva. Al terminar tu estancia dejamos de mandarte nada.'))+'</div>';

  function guarda(campo,valor){
    var b={p_resv:RESV}; b[campo]=valor;
    return rpc('apepe_notif_prefs_guardar',b).catch(function(){});
  }
  $('avOf').onchange=function(){ guarda('p_ofertas',this.checked); };
  $('avEs').onchange=function(){ guarda('p_estancia',this.checked); };
  $('avPu').onchange=async function(){
    var sw=this;
    if(!sw.checked){ await rpc('apepe_push_baja',{p_resv:RESV}).catch(function(){}); await guarda('p_push',false); return; }
    sw.disabled=true;
    try{
      var per=await Notification.requestPermission();
      if(per!=='granted'){
        sw.checked=false;
        $('avPuSub').textContent=T('No diste permiso. Los verás igual en la campanita de arriba.');
        return;
      }
      var reg=await navigator.serviceWorker.ready;
      var sub=await reg.pushManager.getSubscription();
      if(!sub){
        var vap=await fetch(SB+'/functions/v1/apepe-push?clave=1',{headers:{apikey:KEY}}).then(function(r){return r.json();}).catch(function(){return null;});
        if(!vap||!vap.clave){
          sw.checked=false;
          $('avPuSub').textContent=T('Todavía no tenemos listo el aviso al teléfono. Mientras, la campanita de arriba no falla.');
          return;
        }
        sub=await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:vap.clave});
      }
      var j=sub.toJSON();
      await rpc('apepe_push_alta',{p_resv:RESV, p_endpoint:j.endpoint,
        p_p256dh:(j.keys||{}).p256dh, p_auth:(j.keys||{}).auth, p_ua:navigator.userAgent.slice(0,180)});
      $('avPuSub').textContent=T('Listo. Te avisamos aunque tengas APePe cerrada.');
    }catch(e){
      sw.checked=false;
      $('avPuSub').textContent=T('No se pudo activar en este teléfono. Los verás en la campanita de arriba.');
    }finally{ sw.disabled=false; }
  };
}

pintaReserva();
pintaDocs();
pintaBoletos();
pintaWinback();
pintaAvisos();
})();
</script>
<script src="/apepe/notis.js"></script>
<script src="/apepe/tabbar.js"></script>
</body>
