<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Casa Pepe · Check-in</title>
<link rel="stylesheet" href="/cp-movil.css">
<style>
/* LA PUERTA DE UN GRUPO. Javi, 7-nov-2026: «¿puedes mantener la reserva en
   Cloudbeds pero permitir que cada huésped haga su checkin y suba su ID y vea
   la habitación asignada y tenga el QR por persona?».
   Una sola liga para los sesenta. Cada uno se busca en la lista -como el
   check-in de recepción, pero buscándose ellos-, y desde que toca su nombre
   esa ficha es suya en su teléfono. El grupo es holandés, así que la pantalla
   abre en inglés. */
:root{ --crema:#F4EFE8; --tinta:#2C2620; --linea:#E0D7CB; --naranja:#E1623D;
       --ok:#1E7A4B; --ok-bg:#E1F0E7; --gris:#8A8178; }
*{box-sizing:border-box}
body{margin:0;background:var(--crema);color:var(--tinta);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-bottom:40px}
.barra{background:var(--tinta);color:#fff;padding:14px 16px;display:flex;
  align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.barra b{font-family:Oswald,sans-serif;letter-spacing:.08em;text-transform:uppercase;font-size:15px}
.barra .gr{opacity:.65;font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-family:Oswald,sans-serif}
.lang{margin-left:auto;display:flex;gap:4px}
.lang button{background:transparent;border:1px solid rgba(255,255,255,.3);color:#fff;
  border-radius:999px;padding:3px 10px;font-size:11px;cursor:pointer;font-weight:700}
.lang button.on{background:#fff;color:var(--tinta)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em;
  font-size:22px;margin:4px 0 4px}
.dice{color:var(--gris);margin:0 0 16px}
input,select{width:100%;padding:12px 14px;border:1px solid var(--linea);border-radius:11px;
  font:inherit;background:#fff;color:inherit}
label.f{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;
  font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em}
.card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;margin-bottom:12px}
.persona{display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:#fff;border:1px solid var(--linea);border-radius:12px;padding:13px 14px;
  margin-bottom:8px;cursor:pointer;font:inherit;color:inherit}
.persona:hover{border-color:var(--naranja)}
.persona .nm{font-weight:700;flex:1;min-width:0}
.persona .cu{font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.06em;color:var(--gris)}
.chip{font-size:10.5px;font-weight:700;border-radius:999px;padding:3px 9px;
  font-family:Oswald,sans-serif;letter-spacing:.06em;background:var(--ok-bg);color:var(--ok)}
.btn{display:inline-block;background:var(--naranja);color:#fff;border:0;border-radius:11px;
  padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;text-decoration:none;text-align:center}
.btn.ancho{display:block;width:100%}
.btn.plano{background:#fff;color:var(--tinta);border:1px solid var(--linea)}
.cuarto{font-family:Oswald,sans-serif;font-size:52px;line-height:1;letter-spacing:.02em;margin:6px 0 2px}
.qr{background:#fff;padding:14px;border-radius:14px;display:inline-block;margin-top:6px}
.nota{font-size:13px;color:var(--gris);margin-top:8px}
.mal{color:#B3261E;font-size:13.5px;margin-top:8px}
.vacio{color:var(--gris);text-align:center;padding:24px 0}
</style>
</head>
<body>
<div class="barra"><b>Casa Pepe</b><span class="gr" id="gr"></span>
  <span class="lang"><button data-l="en" class="on">EN</button><button data-l="es">ES</button></span></div>
<div class="wrap" id="app"><div class="vacio" id="cargando">…</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function hdr(){ return {apikey:KEY, Authorization:'Bearer '+KEY, 'Content-Type':'application/json'}; }
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

var G=new URLSearchParams(location.search).get('g')||'';
var LLAVE='cp:grupo:'+G;
var TOK=''; try{ TOK=localStorage.getItem(LLAVE)||''; }catch(_){}
var LANG='en', GENTE=[], YO=null;

var T={
 en:{busca:'Find your name',dice:'Tap your name to open your check-in. Your room and your QR are inside.',
     ph:'Type your name…',nores:'No one with that name on the list.',
     tuyo:'Your room',hola:'Hi',yaid:'Your ID is on file',
     subir:'Upload your ID',subdice:'Passport or ID card. One photo, readable.',
     nac:'Nationality',tipo:'Document',num:'Document number',foto:'Photo of your document',
     pas:'Passport',dni:'ID card',guarda:'Save my check-in',guardando:'Saving…',
     listo:'All set',listodice:'Show this QR at the front desk when you arrive.',
     noyo:'Not me — pick another name',faltafoto:'Please add a photo of your document.',
     error:'Could not save. Try again in a moment.',sinlista:'This link is not valid.'},
 es:{busca:'Busca tu nombre',dice:'Toca tu nombre para abrir tu check-in. Dentro está tu cuarto y tu QR.',
     ph:'Escribe tu nombre…',nores:'Nadie con ese nombre en la lista.',
     tuyo:'Tu cuarto',hola:'Hola',yaid:'Tu identificación ya está',
     subir:'Sube tu identificación',subdice:'Pasaporte o documento de identidad. Una foto, que se lea.',
     nac:'Nacionalidad',tipo:'Documento',num:'Número de documento',foto:'Foto de tu documento',
     pas:'Pasaporte',dni:'Documento de identidad',guarda:'Guardar mi check-in',guardando:'Guardando…',
     listo:'Listo',listodice:'Enseña este QR en recepción cuando llegues.',
     noyo:'No soy yo — elegir otro nombre',faltafoto:'Falta la foto de tu documento.',
     error:'No se pudo guardar. Inténtalo en un momento.',sinlista:'Esta liga no es válida.'}
};
function t(k){ return (T[LANG]&&T[LANG][k])||T.en[k]||k; }

Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.onclick=function(){
    LANG=b.getAttribute('data-l');
    Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(x){
      x.classList.toggle('on', x===b); });
    pinta();
  };
});

async function rpc(fn, body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',headers:hdr(),body:JSON.stringify(body||{})});
  return r.ok ? r.json() : null;
}

/* LA FOTO SE ENCOGE ANTES DE SALIR DEL TELÉFONO. Un documento fotografiado
   con una cámara de hoy pesa varios megas y la mitad de este grupo va a estar
   en el wifi del hostal a la vez. */
function encoge(file, maxW, cb){
  try{ var img=new Image();
    img.onload=function(){
      var s=img.width>maxW?maxW/img.width:1,
          w=Math.round(img.width*s), h=Math.round(img.height*s);
      var c=document.createElement('canvas'); c.width=w; c.height=h;
      c.getContext('2d').drawImage(img,0,0,w,h);
      cb(c.toDataURL('image/jpeg',0.7));
    };
    img.onerror=function(){ cb(''); };
    img.src=URL.createObjectURL(file);
  }catch(e){ cb(''); }
}

async function arranca(){
  if(!G){ $('app').innerHTML='<div class="vacio">'+esc(t('sinlista'))+'</div>'; return; }
  var d=await rpc('apepe_grupo_lista',{p_grupo:G});
  if(!d||!d.ok){ $('app').innerHTML='<div class="vacio">'+esc(t('sinlista'))+'</div>'; return; }
  GENTE=d.gente||[];
  $('gr').textContent=d.grupo||'';
  if(TOK) await cargaYo(); else pinta();
}

async function cargaYo(){
  YO=await rpc('apepe_rooming_yo',{p_token:TOK});
  if(!YO||!YO.ok){ YO=null; TOK=''; try{ localStorage.removeItem(LLAVE); }catch(_){} }
  pinta();
}

function pinta(){ YO ? pintaYo() : pintaLista(); }

function pintaLista(){
  $('app').innerHTML=
    '<h1>'+esc(t('busca'))+'</h1><p class="dice">'+esc(t('dice'))+'</p>'+
    '<input id="q" type="search" autocomplete="off" placeholder="'+esc(t('ph'))+'">'+
    '<div id="lista" style="margin-top:14px"></div>';
  $('q').oninput=function(){ filtra(this.value); };
  filtra('');
}

function filtra(q){
  var n=String(q||'').trim().toLowerCase();
  var v=GENTE.filter(function(p){ return !n || String(p.nombre).toLowerCase().indexOf(n)>=0; });
  $('lista').innerHTML = v.length ? v.map(function(p){
      return '<button class="persona" data-id="'+esc(p.id)+'">'+
        '<span class="nm">'+esc(p.nombre)+'</span>'+
        (p.listo?'<span class="chip">✓</span>':'')+
        '<span class="cu">'+esc(p.cuarto||'')+'</span></button>';
    }).join('')
    : '<div class="vacio">'+esc(t('nores'))+'</div>';
  Array.prototype.forEach.call($('lista').querySelectorAll('.persona'),function(b){
    b.onclick=async function(){
      b.disabled=true;
      var r=await rpc('apepe_grupo_tomar',{p_grupo:G, p_id:b.getAttribute('data-id')});
      if(r&&r.ok){ TOK=r.token; try{ localStorage.setItem(LLAVE,TOK); }catch(_){} await cargaYo(); }
      else b.disabled=false;
    };
  });
}

function pintaYo(){
  var hecho=!!YO.listo;
  $('app').innerHTML=
    '<h1>'+esc(t('hola'))+', '+esc(String(YO.nombre).split(' ')[0])+'</h1>'+
    '<div class="card" style="text-align:center">'+
      '<div style="font-family:Oswald,sans-serif;font-size:12px;letter-spacing:.07em;'+
        'text-transform:uppercase;color:var(--gris)">'+esc(t('tuyo'))+'</div>'+
      '<div class="cuarto">'+esc(YO.cuarto||'—')+'</div>'+
      '<div class="qr" id="qr"></div>'+
      '<div class="nota">'+esc(t('listodice'))+'</div>'+
    '</div>'+
    (hecho
      ? '<div class="card"><span class="chip">'+esc(t('yaid'))+'</span></div>'
      : '<div class="card">'+
          '<h1 style="font-size:17px;margin-top:0">'+esc(t('subir'))+'</h1>'+
          '<p class="dice" style="margin-bottom:0">'+esc(t('subdice'))+'</p>'+
          '<label class="f">'+esc(t('nac'))+'</label><input id="nac" type="text" autocomplete="country-name">'+
          '<label class="f">'+esc(t('tipo'))+'</label>'+
          '<select id="tipo"><option value="pasaporte">'+esc(t('pas'))+'</option>'+
            '<option value="identificacion">'+esc(t('dni'))+'</option></select>'+
          '<label class="f">'+esc(t('num'))+'</label><input id="num" type="text" autocomplete="off">'+
          '<label class="f">'+esc(t('foto'))+'</label>'+
          '<input id="foto" type="file" accept="image/*" capture="environment">'+
          '<div id="aviso" class="mal" style="display:none"></div>'+
          '<button class="btn ancho" id="save" style="margin-top:16px">'+esc(t('guarda'))+'</button>'+
        '</div>')+
    '<button class="btn plano ancho" id="otro">'+esc(t('noyo'))+'</button>';

  try{ new QRCode($('qr'),{text:String(YO.qr),width:168,height:168,correctLevel:QRCode.CorrectLevel.M}); }catch(_){}

  $('otro').onclick=function(){
    TOK=''; YO=null; try{ localStorage.removeItem(LLAVE); }catch(_){} pinta();
  };

  if(!hecho){
    var FOTO='';
    $('foto').onchange=function(){
      var f=this.files&&this.files[0]; if(!f) return;
      encoge(f,1280,function(d){ FOTO=d||''; });
    };
    $('save').onclick=async function(){
      var b=$('save');
      if(!FOTO){ $('aviso').style.display='block'; $('aviso').textContent=t('faltafoto'); return; }
      b.disabled=true; b.textContent=t('guardando'); $('aviso').style.display='none';
      var r=await rpc('apepe_rooming_checkin',{
        p_token:TOK, p_nacionalidad:$('nac').value, p_doc_tipo:$('tipo').value,
        p_doc_numero:$('num').value, p_id_foto:FOTO, p_email:null });
      if(r&&r.ok){ await cargaYo(); window.scrollTo(0,0); }
      else{ b.disabled=false; b.textContent=t('guarda');
            $('aviso').style.display='block'; $('aviso').textContent=t('error'); }
    };
  }
}

arranca();
</script>
</body>
</html>
