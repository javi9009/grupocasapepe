<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pepe Challenge · Casa Pepe</title>
<meta name="description" content="Caza anécdotas por la ciudad y desbloquea tu pasaporte de personajes.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pepe Challenge">
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --rosa:#F8BBCB; --cielo:#8DC8EA;
  --tinta:#1E1A16; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --madera:#9A6B3F; --chaquira:#E2188E; --oro:#D9A521; --catrin:#1E1A16;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100dvh}
a{color:inherit;text-decoration:none}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top a.back{color:#fff;font-size:22px;opacity:.9}
.top .av{width:40px;height:40px;border-radius:50%;background:var(--naranja);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.top .av img{width:100%;height:100%;object-fit:cover;display:block}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:18px;line-height:1.05}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px;margin-top:1px}
.tabs{position:sticky;top:64px;z-index:50;background:var(--papel);display:flex;gap:8px;padding:10px 16px;border-bottom:1px solid var(--linea)}
.tab{flex:1;border:1px solid var(--linea);background:var(--hueso);color:var(--tinta);border-radius:999px;padding:9px 12px;font-size:14px;font-weight:700;text-align:center;cursor:pointer}
.tab.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.wrap{padding:14px 16px 40px;max-width:820px;margin:0 auto}
.intro{color:var(--gris);font-size:13.5px;margin:2px 0 14px}
.col{margin:0 0 22px}
.col h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:15px;letter-spacing:.03em;margin:0 0 3px;display:flex;align-items:center;gap:8px}
.col .prog{color:var(--tenue);font-size:12px;font-weight:600}
.col .desc{color:var(--gris);font-size:12.5px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:400px){.grid{grid-template-columns:1fr 1fr}}
.carta{position:relative;aspect-ratio:2/3;border-radius:12px;overflow:hidden;cursor:pointer;border:2px solid rgba(30,26,22,.12);box-shadow:var(--sombra);background:var(--hueso)}
.carta img{width:100%;height:100%;object-fit:cover;display:block}
.carta .nm{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.02em;padding:16px 6px 6px;text-align:center;line-height:1.1}
.carta .tier{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
/* dorso de carta (bloqueada) */
.carta.lock{display:flex;align-items:center;justify-content:center;flex-direction:column;color:#fff;text-align:center;padding:10px}
.carta.lock .q{font-family:'Oswald',sans-serif;font-size:34px;font-weight:700;line-height:1}
.carta.lock .lg{font-size:10.5px;margin-top:8px;opacity:.9;font-weight:600}
.carta.lock::before{content:"";position:absolute;inset:6px;border:2px dashed rgba(255,255,255,.5);border-radius:8px;pointer-events:none}
/* mapa */
#map{height:calc(100dvh - 190px);min-height:340px;border-radius:0}
.gpschip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0));z-index:55;background:var(--tinta);color:#fff;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:600;box-shadow:var(--sombra);max-width:92%;text-align:center}
.gpschip b{color:var(--rosa)}
.pin{background:none;border:0}
.pin .b{width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(45deg);display:flex;align-items:center;justify-content:center;border:2px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35)}
.pin .b span{transform:rotate(-45deg);font-size:15px;color:#fff;font-family:'Oswald';font-weight:700}
/* modales */
.ov{position:fixed;inset:0;z-index:1500;background:rgba(20,16,12,.62);display:none;align-items:center;justify-content:center;padding:18px}
.ov.show{display:flex}
.sheet{background:var(--papel);border-radius:20px;max-width:440px;width:100%;max-height:92dvh;overflow:auto;box-shadow:0 20px 60px -20px rgba(0,0,0,.6)}
.sheet .x{position:sticky;top:0;display:flex;justify-content:flex-end;padding:8px 8px 0}
.sheet .x button{border:0;background:var(--hueso);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--gris)}
.sheet .pad{padding:2px 20px 22px}
.ficha-img{width:150px;aspect-ratio:2/3;object-fit:cover;border-radius:14px;display:block;margin:0 auto 12px;box-shadow:var(--sombra)}
.ficha h3{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:22px;margin:0;text-align:center}
.ficha .tt{font-family:'Lobster Two',cursive;color:var(--magenta);text-align:center;font-size:17px;margin:0 0 10px}
.ficha p{color:var(--gris);font-size:14px}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 12px;font-weight:700;font-size:12.5px;color:#fff}
.center{text-align:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:13px;font-weight:700;font-size:15px;cursor:pointer;text-align:center;font-family:'Inter'}
.btn.pri{background:var(--naranja);color:#fff}
.btn.dark{background:var(--tinta);color:#fff}
.btn.ghost{background:var(--hueso);color:var(--tinta);border:1px solid var(--linea)}
.btn:disabled{opacity:.4}
.pista{background:var(--naranja-suave);border:1px solid #F7CDB6;border-radius:14px;padding:12px 14px;font-size:14px;margin:10px 0}
.pista b{color:var(--naranja-oscuro)}
.mini{color:var(--tenue);font-size:12px;text-align:center;margin-top:8px}
/* reto */
.reto .kop{font-family:'Oswald';text-transform:uppercase;letter-spacing:.04em;font-size:12px;color:var(--tenue);text-align:center}
.reto .qn{font-size:16.5px;font-weight:600;margin:6px 0 14px;text-align:center;line-height:1.35}
.op{display:block;width:100%;text-align:left;border:1.5px solid var(--linea);background:var(--blanco);border-radius:12px;padding:13px 14px;margin:8px 0;font-size:14.5px;cursor:pointer;font-family:'Inter'}
.op:active{background:var(--hueso)}
.op.ok{border-color:#2E7D5B;background:#E7F3EC}
.op.no{border-color:#C0392B;background:#FBEAE8}
.prog2{display:flex;gap:5px;justify-content:center;margin:2px 0 12px}
.prog2 i{width:22px;height:5px;border-radius:3px;background:var(--linea)}
.prog2 i.on{background:var(--naranja)}
/* El reloj de la pregunta: una barra que se vacía. La animación la lleva el
   navegador, así que no depende de que el JS vaya corriendo cada cuadro. */
.reloj{height:6px;border-radius:4px;background:var(--linea);overflow:hidden;margin:0 0 12px}
.reloj i{display:block;height:100%;width:100%;background:var(--magenta);border-radius:4px;
  transform-origin:left center;animation:vaciar linear forwards}
@keyframes vaciar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
@media(prefers-reduced-motion:reduce){.reloj i{animation:none;opacity:.5}}
.tier-scale{display:flex;justify-content:space-between;gap:6px;margin:14px 0 2px;font-size:11px;color:var(--tenue);text-align:center}
.tier-scale div{flex:1}
.tier-scale b{display:block;font-size:15px}
.spin{width:26px;height:26px;border:3px solid var(--linea);border-top-color:var(--naranja);border-radius:50%;animation:sp 1s linear infinite;margin:20px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.rankrow{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--linea);font-size:14px}
.rankrow b{font-family:'Oswald'}
</style>
<script src="/apepe/resv.js"></script>
</head>
<body>
<header class="top">
  <a class="back" id="back" href="/apepe/" aria-label="Volver">←</a>
  <div class="av"><img src="/img/apepe/stickers/luchador-sentado-b.webp" alt="" onerror="this.parentNode.textContent='🎴'"></div>
  <div>
    <div class="nom">Pepe Challenge</div>
    <div class="sub">caza anécdotas por la ciudad</div>
  </div>
</header>

<div class="tabs">
  <div class="tab on" id="tabP" data-t="pas">🎴 Pasaporte</div>
  <div class="tab" id="tabM" data-t="map">🗺️ Mapa</div>
</div>

<div id="vPas" class="wrap">
  <p class="intro" id="introP">Recorre la ciudad, encuentra a los personajes en sus lugares y gánales su reto. Cada uno que venzas se queda en tu pasaporte como carta de lotería. Entre mejor lo hagas… mejor la carta. Descúbrelo.</p>
  <div id="cols"><div class="spin"></div></div>
  <button class="btn ghost" id="btnRank" style="margin-top:6px">🏆 Ver el ranking de la semana</button>
</div>

<div id="vMap" style="display:none">
  <div id="map"></div>
</div>
<div class="gpschip" id="gps" style="display:none"></div>

<!-- Modal ficha / carta -->
<div class="ov" id="ovFicha"><div class="sheet"><div class="x"><button onclick="cerrar('ovFicha')">✕</button></div><div class="pad" id="fichaBody"></div></div></div>
<!-- Modal reto -->
<div class="ov" id="ovReto"><div class="sheet"><div class="x"><button id="retoX" onclick="cerrarReto()">✕</button></div><div class="pad reto" id="retoBody"></div></div></div>
<!-- Modal ranking -->
<div class="ov" id="ovRank"><div class="sheet"><div class="x"><button onclick="cerrar('ovRank')">✕</button></div><div class="pad" id="rankBody"></div></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var P=new URLSearchParams(location.search);
var DEMO=(P.get('demo')==='1');           // modo vista previa: ignora la distancia (para revisar sin estar en el lugar)
var SEDE=(P.get('sede')||'cdmx').toLowerCase();
var TOKEN=P.get('resv')||P.get('sol')||'';
try{ if(!TOKEN){ TOKEN=localStorage.getItem('cpp_resv')||localStorage.getItem('pch_tok')||''; } }catch(e){}
if(!TOKEN){ TOKEN='pch-'+Math.random().toString(36).slice(2,10); try{localStorage.setItem('pch_tok',TOKEN);}catch(e){} }
try{ if(P.get('resv')||P.get('sol')) localStorage.setItem('cpp_resv',TOKEN); }catch(e){}
var QT='resv='+encodeURIComponent(TOKEN)+(DEMO?'&demo=1':'');
try{ document.getElementById('back').href='/apepe/'+(P.get('resv')||P.get('sol')?('?resv='+encodeURIComponent(TOKEN)):''); }catch(e){}

function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function api(fn,body){
  return fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})}).then(function(r){return r.ok?r.json():Promise.reject(r.status);});
}
function dist(a,b,c,d){var R=6371000,t=Math.PI/180;var x=Math.sin((c-a)*t/2),y=Math.sin((d-b)*t/2);
  var h=x*x+Math.cos(a*t)*Math.cos(c*t)*y*y;return 2*R*Math.asin(Math.min(1,Math.sqrt(h)));}

/* Las llaves (chaquira, catrin) son internas y no se tocan: están en la base,
   en pch_tier y en las rutas de las imágenes. Lo que ve el huésped es 'n'. */
var TIER={madera:{e:'🪵',c:'var(--madera)',n:'Madera'},chaquira:{e:'🔷',c:'var(--chaquira)',n:'Pixel wixáxika'},
          oro:{e:'🥇',c:'var(--oro)',n:'Oro'},catrin:{e:'💀',c:'var(--catrin)',n:'Día de muertos'}};

/* ---------- Pasaporte ---------- */
function pintaPasaporte(cols){
  if(!cols||!cols.length){ $('cols').innerHTML='<div class="mini">Aún no hay personajes activos. Muy pronto.</div>'; return; }
  var h='';
  cols.forEach(function(c){
    h+='<div class="col"><h2><span style="color:'+esc(c.color)+'">●</span> '+esc(c.nombre)+
       ' <span class="prog">'+c.abiertas+'/'+c.total+'</span></h2>';
    h+='<div class="grid">';
    (c.cartas||[]).forEach(function(k){
      if(k.abierta){
        var t=TIER[k.tier]||{};
        h+='<div class="carta" onclick=\'fichaAbierta('+JSON.stringify(k).replace(/'/g,"&#39;")+')\'>'+
             '<img src="'+esc(k.img)+'" alt="'+esc(k.nombre)+'" loading="lazy">'+
             '<div class="tier" title="'+(t.n||'')+'">'+(t.e||'')+'</div>'+
             '<div class="nm">'+esc(k.nombre)+'</div></div>';
      }else{
        h+='<div class="carta lock" style="background:'+esc(k.color)+'" onclick=\'fichaBloqueada('+JSON.stringify(k).replace(/'/g,"&#39;")+')\'>'+
             '<div class="q">🎴</div><div class="lg">'+(k.n_lugares||0)+' lugares</div></div>';
      }
    });
    h+='</div></div>';
  });
  $('cols').innerHTML=h;
}
function cargaPasaporte(){
  return api('pch_pasaporte',{p_token:TOKEN}).then(pintaPasaporte)
    .catch(function(){ $('cols').innerHTML='<div class="mini">No pudimos cargar tu pasaporte. Revisa tu internet.</div>'; });
}
/* Logo de la marca que va en la carta descargable. Configurable por propiedad:
   Casa Pepe por defecto; si fuera otro hotel/barrio, se cambia esta URL. */
var LOGO_MARCA='/img/casapepe/casapepe_isotipo_color.png';
var _fichaK=null;
function fichaAbierta(k){
  _fichaK=k;
  var t=TIER[k.tier]||{};
  $('fichaBody').innerHTML='<div class="ficha center">'+
    '<img class="ficha-img" src="'+esc(k.img)+'" alt="'+esc(k.nombre)+'">'+
    '<h3>'+esc(k.nombre)+'</h3><p class="tt">'+esc(k.titulo||'')+'</p>'+
    '<span class="badge" style="background:'+(t.c||'#333')+'">'+(t.e||'')+' '+(t.n||'')+'</span>'+
    '<p style="margin-top:12px;text-align:left">'+esc(k.semblanza||'')+'</p>'+
    '<button class="btn dark" id="btnDl" style="margin-top:10px" onclick="descargarCarta()">⬇ Descargar mi carta</button>'+
    '<p class="mini">Se descarga con el sello de Casa Pepe.</p></div>';
  abrir('ovFicha');
}
/* Compone la carta (arte + logo de la marca) en un canvas y la descarga como PNG.
   Mismo origen que la app, así que el canvas no queda "tainted". */
function descargarCarta(){
  var k=_fichaK; if(!k||!k.img) return;
  var b=$('btnDl'); if(b){ b.disabled=true; b.textContent='Preparando…'; }
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    var w=img.naturalWidth||600, h=img.naturalHeight||900;
    var esc2=Math.max(1, Math.round(1000/w)); // sube un poco la resolución del lienzo
    var W=w*esc2, H=h*esc2;
    var c=document.createElement('canvas'); c.width=W; c.height=H;
    var cx=c.getContext('2d'); cx.imageSmoothingEnabled=true; cx.drawImage(img,0,0,W,H);
    function baja(canvas){
      canvas.toBlob(function(bl){
        var a=document.createElement('a'); a.href=URL.createObjectURL(bl);
        a.download=(k.nombre||'carta').replace(/[^\wÀ-ſ -]/g,'').trim().replace(/\s+/g,'-')+'-CasaPepe.png';
        document.body.appendChild(a); a.click(); a.remove();
        if(b){ b.disabled=false; b.textContent='⬇ Descargar mi carta'; }
      },'image/png');
    }
    var logo=new Image(); logo.crossOrigin='anonymous';
    logo.onload=function(){
      var lw=W*0.20, lh=lw*(logo.naturalHeight/logo.naturalWidth||1);
      var pad=W*0.045, x=W-lw-pad, y=H-lh-pad, r=lw*0.14;
      // chip blanco redondeado detrás del logo, para que resalte sobre cualquier acabado
      cx.save(); cx.fillStyle='rgba(255,255,255,.92)';
      cx.beginPath();
      var bx=x-lw*0.12, by=y-lh*0.12, bw=lw*1.24, bh=lh*1.24;
      cx.moveTo(bx+r,by); cx.arcTo(bx+bw,by,bx+bw,by+bh,r); cx.arcTo(bx+bw,by+bh,bx,by+bh,r);
      cx.arcTo(bx,by+bh,bx,by,r); cx.arcTo(bx,by,bx+bw,by,r); cx.closePath();
      cx.shadowColor='rgba(0,0,0,.25)'; cx.shadowBlur=W*0.02; cx.fill(); cx.restore();
      cx.drawImage(logo,x,y,lw,lh); baja(c);
    };
    logo.onerror=function(){ baja(c); }; // si no carga el logo, descarga la carta igual
    logo.src=LOGO_MARCA;
  };
  img.onerror=function(){ if(b){ b.disabled=false; b.textContent='No se pudo descargar'; } };
  img.src=k.img;
}
function fichaBloqueada(k){
  $('fichaBody').innerHTML='<div class="ficha center">'+
    '<div style="width:150px;aspect-ratio:2/3;margin:0 auto 12px;border-radius:14px;background:'+esc(k.color)+';display:flex;align-items:center;justify-content:center;color:#fff;font-family:Oswald;font-size:44px;font-weight:700;position:relative">🎴</div>'+
    '<h3>Personaje por descubrir</h3>'+
    '<div class="pista" style="text-align:left"><b>Pista:</b> '+esc(k.pista||'Búscalo en la ciudad.')+'</div>'+
    '<p class="mini">Aparece en '+(k.n_lugares||0)+' lugar(es). Ábrelo en el <b>mapa</b> y, cuando estés cerca, acepta su reto.</p>'+
    '<button class="btn dark" style="margin-top:12px" onclick="cerrar(\'ovFicha\');irMapa();">Ver el mapa</button></div>';
  abrir('ovFicha');
}

/* ---------- Mapa ---------- */
var map=null, pines=[], userMk=null, myPos=null, watchId=null;
function irMapa(){ $('tabM').click(); }
function initMap(){
  if(map) return;
  map=L.map('map',{zoomControl:true,attributionControl:false}).setView([19.4340,-99.1400],14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
  cargaMapa();
  startGeo();
}
function pinIcon(color,txt){
  return L.divIcon({className:'pin',html:'<div class="b" style="background:'+color+'"><span>'+txt+'</span></div>',iconSize:[34,34],iconAnchor:[17,34],popupAnchor:[0,-32]});
}
function cargaMapa(){
  api('pch_mapa',{p_token:TOKEN}).then(function(rows){
    pines.forEach(function(p){map.removeLayer(p.mk);}); pines=[];
    (rows||[]).forEach(function(r){
      var txt=r.abierta?'★':'🎴';
      var mk=L.marker([r.lat,r.lng],{icon:pinIcon(r.color||'#F2682A',txt)}).addTo(map);
      mk.on('click',function(){ abrePin(r); });
      pines.push({r:r,mk:mk});
    });
  }).catch(function(){});
}
function abrePin(r){
  var d = myPos? dist(myPos.lat,myPos.lng,r.lat,r.lng) : null;
  var cerca = DEMO || (d!=null && d<=r.radio);
  var titulo = r.abierta? esc(r.personaje) : 'Un personaje te espera aquí';
  var sub = r.abierta? ('<div class="mini" style="text-align:left">'+esc(r.lugar||'')+'</div>') :
            ('<div class="pista" style="text-align:left">'+esc(r.resena||'')+'</div>');
  var llegar = r.como_llegar? '<p class="mini" style="text-align:left">📍 '+esc(r.como_llegar)+'</p>':'';
  var estado = DEMO? '<p class="mini">Vista previa: puedes retar sin estar en el lugar.</p>'
    : (d==null? '<p class="mini">Activa tu ubicación para saber si ya estás cerca.</p>'
        : (cerca? '<p class="mini" style="color:#2E7D5B;font-weight:700">✓ Estás a '+Math.round(d)+' m — ¡puedes retarlo!</p>'
                : '<p class="mini">Estás a '+(d>1200?(Math.round(d/100)/10+' km'):(Math.round(d)+' m'))+'. Acércate a menos de '+r.radio+' m.</p>'));
  var btn = r.abierta
    ? '<button class="btn ghost" onclick="cerrar(\'ovFicha\')">Ya es tuyo ✓ — cerrar</button>'
    : '<button class="btn pri" '+(cerca?'':'disabled')+' onclick="empezarReto('+r.lugar_id+')">Aceptar el reto</button>';
  $('fichaBody').innerHTML='<div class="ficha center"><h3>'+titulo+'</h3>'+sub+llegar+estado+'<div style="margin-top:12px">'+btn+'</div></div>';
  abrir('ovFicha');
}
function startGeo(){
  if(!navigator.geolocation){ $('gps').style.display='block'; $('gps').innerHTML='Tu teléfono no comparte ubicación.'; return; }
  $('gps').style.display='block'; $('gps').innerHTML='Buscando tu ubicación…';
  watchId=navigator.geolocation.watchPosition(function(p){
    myPos={lat:p.coords.latitude,lng:p.coords.longitude};
    if(!userMk){ userMk=L.circleMarker([myPos.lat,myPos.lng],{radius:8,color:'#1E7BE0',fillColor:'#4B9BF5',fillOpacity:.9,weight:2}).addTo(map); }
    else userMk.setLatLng([myPos.lat,myPos.lng]);
    // lugar más cercano
    var best=null;
    pines.forEach(function(p){ if(p.r.abierta) return; var dd=dist(myPos.lat,myPos.lng,p.r.lat,p.r.lng); if(!best||dd<best.d) best={d:dd,r:p.r}; });
    if(best){ var near=best.d<=best.r.radio;
      $('gps').innerHTML = near? ('🎯 <b>¡Estás en un lugar!</b> Toca el pin para retar.')
        : ('El personaje más cercano está a <b>'+(best.d>1200?(Math.round(best.d/100)/10+' km'):(Math.round(best.d)+' m'))+'</b>');
    } else { $('gps').innerHTML='Ya tienes todo por aquí ✨'; }
  },function(){ $('gps').innerHTML='No pudimos leer tu ubicación. Actívala para jugar.'; },
  {enableHighAccuracy:true,maximumAge:10000,timeout:15000});
}

/* ---------- Reto ----------
   Diez preguntas contra reloj. El reloj de cada pregunta viene de la base
   (5 a 9 segundos según lo larga que sea). Lo que sobra del reloj es la
   eficiencia, y de ahí sale el nivel de la carta. Sin tope de intentos. */
var RETO=null, RELOJ=null;
function empezarReto(lugarId){
  cerrar('ovFicha');
  var pin=pines.filter(function(p){return p.r.lugar_id===lugarId;})[0];
  var pos = DEMO && pin ? {lat:pin.r.lat,lng:pin.r.lng} : myPos;
  if(!pos){ alert('Activa tu ubicación para aceptar el reto.'); return; }
  $('retoBody').innerHTML='<div class="spin"></div>'; abrir('ovReto');
  api('pch_reto_iniciar',{p_token:TOKEN,p_lugar_id:lugarId,p_lat:pos.lat,p_lng:pos.lng}).then(function(j){
    if(!j||!j.ok){
      var m = j&&j.error==='lejos'? 'Todavía estás lejos ('+j.dist+' m). Acércate al lugar.'
            : j&&j.error==='sin_preguntas'? 'Este personaje todavía no tiene su reto listo. Vuelve pronto.'
            : 'No se pudo iniciar el reto.';
      $('retoBody').innerHTML='<p class="center">'+m+'</p><button class="btn ghost" onclick="cerrarReto()">Cerrar</button>'; return;
    }
    RETO={lugar_id:lugarId,personaje_id:j.personaje_id,intento_id:j.intento_id,
          preguntas:j.preguntas||[],i:0,sel:[],pos:pos};
    introReto();
  }).catch(function(){ $('retoBody').innerHTML='<p class="center">Falló la conexión. Intenta de nuevo.</p><button class="btn ghost" onclick="cerrarReto()">Cerrar</button>'; });
}
function introReto(){
  $('retoBody').innerHTML='<div class="center">'+
    '<div class="kop">Un personaje te reta</div>'+
    '<p class="qn">«Contéstame diez preguntas sobre mi vida. Si me ganas, me quedo en tu pasaporte.»</p>'+
    '<p class="mini">Cada pregunta tiene su reloj. Entre más rápido y mejor le atines, mejor la carta: madera, pixel wixáxika, oro o día de muertos. Puedes volver a intentarlo las veces que quieras, y las preguntas cambian.</p>'+
    '<button class="btn dark" style="margin-top:12px" onclick="preguntaReto()">Empezar</button></div>';
}
function paraReloj(){ if(RELOJ){ clearTimeout(RELOJ); RELOJ=null; } }
function preguntaReto(){
  paraReloj();
  var q=RETO.preguntas[RETO.i];
  if(!q){ resolverReto(); return; }
  var prog=''; for(var n=0;n<RETO.preguntas.length;n++){ prog+='<i class="'+(n<=RETO.i?'on':'')+'"></i>'; }
  var ops=(q.op||[]).map(function(o,ix){ return '<button class="op" data-ix="'+ix+'" onclick="responde('+ix+')">'+esc(o)+'</button>'; }).join('');
  var seg=Math.max(3,+q.seg||7);
  $('retoBody').innerHTML='<div class="prog2">'+prog+'</div>'+
    '<div class="reloj"><i id="relojBarra" style="animation-duration:'+seg+'s"></i></div>'+
    '<div class="kop">Pregunta '+(RETO.i+1)+' de '+RETO.preguntas.length+'</div>'+
    '<p class="qn">'+esc(q.q)+'</p>'+ops;
  RETO.t0=Date.now();
  /* Si se acaba el reloj, la pregunta se va sin respuesta y cuenta como fallada. */
  RELOJ=setTimeout(function(){ responde(null); }, seg*1000);
}
function responde(ix){
  paraReloj();
  var q=RETO.preguntas[RETO.i];
  RETO.sel.push({id:q.id, sel:(ix===null?null:ix), ms:Date.now()-(RETO.t0||Date.now())});
  RETO.i++;
  if(RETO.i<RETO.preguntas.length){ preguntaReto(); } else { resolverReto(); }
}
function resolverReto(){
  paraReloj();
  $('retoBody').innerHTML='<div class="spin"></div><p class="center mini">Calificando…</p>';
  api('pch_reto_resolver',{p_token:TOKEN,p_intento_id:RETO.intento_id,p_respuestas:RETO.sel}).then(function(j){
    if(!j||!j.ok){ $('retoBody').innerHTML='<p class="center">No se pudo calificar. '+((j&&j.error)||'')+'</p><button class="btn ghost" onclick="cerrarReto()">Cerrar</button>'; return; }
    var gano=j.tier_gano, t=TIER[gano]||{}, head;
    var tiempo=Math.round((j.eficiencia||0)*100);
    if(gano){
      head='<div class="center"><img class="ficha-img" src="'+esc(j.personaje.img)+'">'+
        '<div class="kop">'+(j.subio?'¡Subiste de carta!':'Ya la tenías igual o mejor')+'</div>'+
        '<h3 style="font-family:Oswald;text-transform:uppercase;margin:4px 0">'+esc(j.personaje.nombre)+'</h3>'+
        '<p class="tt" style="font-family:\'Lobster Two\';color:var(--magenta);margin:0 0 8px">'+esc(j.personaje.titulo||'')+'</p>'+
        '<span class="badge" style="background:'+(t.c||'#333')+'">'+(t.e||'')+' '+(t.n||'')+'</span>'+
        '<p style="text-align:left;margin-top:12px">'+esc(j.personaje.semblanza||'')+'</p>';
    }else{
      head='<div class="center"><div class="kop">Ni una…</div>'+
        '<p class="qn">No acertaste ninguna. Vuelve a intentarlo: las preguntas cambian.</p>';
    }
    $('retoBody').innerHTML=head+
      '<p class="mini">'+j.aciertos+' de '+j.total+' correctas · '+tiempo+'% de reloj aprovechado'+
      (j.sin_responder? ' · '+j.sin_responder+' se te fueron de tiempo':'')+'</p>'+
      '<p class="mini">Puedes repetirlo cuando quieras'+(gano&&gano!=='catrin'?' para subir de carta':'')+'.</p>'+
      '<button class="btn pri" style="margin-top:10px" onclick="cerrarReto(true)">'+(gano?'Ver mi pasaporte':'Cerrar')+'</button></div>';
  }).catch(function(){ $('retoBody').innerHTML='<p class="center">Falló la conexión al calificar.</p><button class="btn ghost" onclick="cerrarReto()">Cerrar</button>'; });
}
function cerrarReto(recargar){ paraReloj(); cerrar('ovReto'); RETO=null; if(recargar){ cargaPasaporte(); if(map) cargaMapa(); $('tabP').click(); } }

/* ---------- Ranking ---------- */
function verRank(){
  $('rankBody').innerHTML='<h3 style="font-family:Oswald;text-transform:uppercase;text-align:center">Ranking de la semana</h3><div class="spin"></div>';
  abrir('ovRank');
  api('pch_ranking',{p_sede:SEDE}).then(function(rows){
    if(!rows||!rows.length){ $('rankBody').innerHTML='<h3 style="font-family:Oswald;text-transform:uppercase;text-align:center">Ranking</h3><p class="mini">Nadie ha desbloqueado cartas todavía. ¡Sé el primero!</p>'; return; }
    var h='<h3 style="font-family:Oswald;text-transform:uppercase;text-align:center;margin-bottom:10px">Ranking · cartas</h3>';
    rows.forEach(function(r,i){ h+='<div class="rankrow"><span>'+(i+1)+'. '+esc(r.nombre)+'</span><span><b>'+r.pts+'</b> pts · '+r.cartas+' 🎴</span></div>'; });
    $('rankBody').innerHTML=h;
  }).catch(function(){ $('rankBody').innerHTML='<p class="mini">No se pudo cargar el ranking.</p>'; });
}

/* ---------- modales / tabs ---------- */
function abrir(id){ $(id).classList.add('show'); }
function cerrar(id){ $(id).classList.remove('show'); }
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on');}); t.classList.add('on');
    var m=t.getAttribute('data-t')==='map';
    $('vMap').style.display=m?'block':'none'; $('vPas').style.display=m?'none':'block';
    $('gps').style.display=m?'block':'none';
    if(m){ initMap(); setTimeout(function(){ if(map) map.invalidateSize(); },80); }
  };
});
$('btnRank').onclick=verRank;

/* arranque */
api('pch_registrar_jugador',{p_token:TOKEN,p_nombre:null,p_sede:SEDE}).catch(function(){});
cargaPasaporte();
</script>
