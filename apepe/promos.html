<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Promos · Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Promos">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-suave:#FBDCEE; --rosa:#F8BBCB;
  --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.55;padding-bottom:40px}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .back{color:#fff;text-decoration:none;font-size:22px;line-height:1;padding:2px 6px}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:18px;line-height:1.1}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px}
.top .hueco{flex:1}
.lang{display:flex;gap:2px;background:rgba(255,255,255,.14);border-radius:999px;padding:2px}
.lang button{border:0;background:none;color:rgba(255,255,255,.7);font:inherit;font-size:11.5px;
  font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;letter-spacing:.04em}
.lang button.on{background:#fff;color:var(--tinta)}
.franja{height:8px;display:flex}
.franja i{flex:1}

.hero{padding:20px 0 2px}
.hero h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:25px;line-height:1.05;margin:0}
.hero p{color:var(--gris);font-size:14px;margin:9px 0 0;line-height:1.6}

.promo{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);overflow:hidden;margin-top:16px}
.promo .cab{display:flex;align-items:center;gap:12px;padding:16px 17px 0}
.promo .cab .em{font-size:30px;line-height:1}
.promo .cab b{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:17px;
  letter-spacing:.03em;display:block;line-height:1.15}
.promo .cab span{color:var(--gris);font-size:12.5px}
.promo .cuerpo{padding:12px 17px 17px}
.promo p{margin:0 0 12px;font-size:14.5px;line-height:1.6;color:var(--tinta-2)}
.codigo{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:11px;
  padding:12px 14px;margin:0 0 12px}
.codigo .val{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:700;
  font-size:17px;letter-spacing:.1em;color:var(--ok);flex:1;word-break:break-all}
.codigo button{border:1px solid var(--ok);background:transparent;color:var(--ok);font:inherit;
  font-size:12.5px;font-weight:700;border-radius:8px;padding:7px 12px;cursor:pointer;flex:0 0 auto}
.codigo button:hover{background:#fff}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  border:0;border-radius:11px;background:var(--naranja);color:#fff;font-family:'Oswald',sans-serif;
  font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px;
  padding:13px 18px;text-decoration:none}
.btn:hover{background:var(--naranja-oscuro)}
.chico{font-size:11.5px;color:var(--tenue);line-height:1.5;margin:11px 0 0}
.vacio{background:var(--blanco);border:1px dashed var(--linea);border-radius:var(--radio);
  padding:22px 18px;margin-top:16px;text-align:center;color:var(--tenue);font-size:13.5px;line-height:1.6}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <a class="back" id="back" href="/apepe/" aria-label="Volver">←</a>
    <div><div class="nom" id="tTitulo">Promos</div>
      <div class="sub" id="tSub">para tu viaje</div></div>
    <div class="hueco"></div>
    <div class="lang"><button data-l="es">ES</button><button data-l="en">EN</button></div>
  </div>
</header>
<div class="franja">
  <i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i>
  <i style="background:var(--rosa)"></i><i style="background:var(--cielo)"></i>
</div>

<div class="wrap">
  <div class="hero"><h1 id="hTit"></h1><p id="hTxt"></p></div>
  <div id="lista"></div>
</div>

<script>
(function(){
'use strict';
/* Las promos que la casa consiguió para sus huéspedes. El enlace lleva los
   parámetros del acuerdo: se copia tal cual, que si se recorta deja de contar
   como nuestra y el huésped pierde el descuento. */
var PROMOS=[
  {
    em:'📶', marca:'Holafly', slug:'holafly',
    codigo:'FLYLIKEBUTTERFLY',
    url:'https://esim.holafly.com/es/?irclickid=WEo2M0UKqxyZU1tXqaQWeyFCUkrz6cRQNU0qSc0&discount=FLYLIKEBUTTERFLY&utm_source=affiliate&utm_medium=Marianela%20Gette&utm_campaign=6087173&irgwc=1&afsrc=1&tw_source=impact&tw_campaign=6087173&tw_term=2006335',
    es:{ titulo:'eSIM para tu teléfono', gancho:'5% de descuento en cualquier destino',
         texto:'Internet desde que aterrizas, sin cambiar de chip y sin buscar una tienda al llegar. '+
               'Se instala antes de salir de casa y funciona en cuanto pisas el aeropuerto.',
         boton:'Ir a la tienda',
         chico:'Comprueba que el descuento aparezca al finalizar la compra; si no, escríbele a su '+
               'servicio al cliente. Es un enlace de socio: a ti te cuesta lo mismo y a la casa le ayuda.' },
    en:{ titulo:'eSIM for your phone', gancho:'5% off any destination',
         texto:'Internet from the moment you land — no swapping SIM cards, no hunting for a shop on '+
               'arrival. You install it before you leave home and it works the second you land.',
         boton:'Go to the store',
         chico:'Check that the discount shows up at checkout; if it does not, reach out to their '+
               'customer service. This is a partner link: it costs you the same and it helps the house.' }
  }
];

var T={
  es:{ titulo:'Promos', sub:'para tu viaje', hTit:'Lo que conseguimos para ti',
       hTxt:'Acuerdos que la casa tiene con gente que nos gusta. Usa el código y listo.',
       copiar:'Copiar', copiado:'Copiado ✓',
       vacio:'Ahora mismo no hay promos activas. Vuelve a asomarte en unos días.' },
  en:{ titulo:'Promos', sub:'for your trip', hTit:'What we lined up for you',
       hTxt:'Deals the house has with people we like. Use the code and that is it.',
       copiar:'Copy', copiado:'Copied ✓',
       vacio:'No active promos right now. Check back in a few days.' }
};

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var LANG=(function(){
  try{ var g=localStorage.getItem('apepe_lang'); if(g==='es'||g==='en')return g; }catch(_){}
  return /^en/i.test(navigator.language||'')?'en':'es';
})();

var P=new URLSearchParams(location.search);
var qs=P.get('resv')?('?resv='+encodeURIComponent(P.get('resv'))):'';
$('back').href='/apepe/index.html'+qs;

function pinta(){
  var t=T[LANG];
  document.documentElement.lang=LANG;
  $('tTitulo').textContent=t.titulo; $('tSub').textContent=t.sub;
  $('hTit').textContent=t.hTit; $('hTxt').textContent=t.hTxt;
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
    b.classList.toggle('on', b.getAttribute('data-l')===LANG);
  });

  if(!PROMOS.length){ $('lista').innerHTML='<div class="vacio">'+esc(t.vacio)+'</div>'; return; }
  $('lista').innerHTML=PROMOS.map(function(p,i){
    var x=p[LANG];
    return '<div class="promo">'+
      '<div class="cab"><span class="em">'+p.em+'</span><span><b>'+esc(x.titulo)+'</b>'+
        '<span>'+esc(p.marca)+' · '+esc(x.gancho)+'</span></span></div>'+
      '<div class="cuerpo">'+
        '<p>'+esc(x.texto)+'</p>'+
        '<div class="codigo"><span class="val">'+esc(p.codigo)+'</span>'+
          '<button data-i="'+i+'">'+esc(t.copiar)+'</button></div>'+
        '<a class="btn" href="'+esc(p.url)+'" target="_blank" rel="noopener">'+esc(x.boton)+'</a>'+
        '<p class="chico">'+esc(x.chico)+'</p>'+
      '</div></div>';
  }).join('');

  Array.prototype.forEach.call($('lista').querySelectorAll('.codigo button'),function(b){
    b.onclick=function(){
      var cod=PROMOS[Number(b.getAttribute('data-i'))].codigo;
      var listo=function(){ b.textContent=T[LANG].copiado;
        setTimeout(function(){ b.textContent=T[LANG].copiar; },1800); };
      /* El portapapeles falla en algunos navegadores dentro de la app: si no se
         puede copiar, al menos se deja seleccionado para copiarlo a mano. */
      if(navigator.clipboard&&navigator.clipboard.writeText){
        navigator.clipboard.writeText(cod).then(listo).catch(selecciona);
      } else selecciona();
      function selecciona(){
        try{
          var r=document.createRange(); r.selectNodeContents(b.previousElementSibling);
          var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); listo();
        }catch(_){}
      }
    };
  });
}
Array.prototype.forEach.call(document.querySelectorAll('.lang button'),function(b){
  b.onclick=function(){
    LANG=b.getAttribute('data-l');
    try{ localStorage.setItem('apepe_lang',LANG); }catch(_){}
    pinta();
  };
});
pinta();
})();
</script>
</body>
</html>
