<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WiFi · Casa Pepe</title>
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:22px 16px 40px}
.wrap{width:100%;max-width:420px}
.head{text-align:center;margin-bottom:16px}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:26px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:20px;box-shadow:0 1px 1px rgba(31,27,22,.04),0 18px 40px -26px rgba(31,27,22,.5);padding:20px;text-align:center;margin-bottom:16px}
.qr{width:210px;height:210px;margin:2px auto 4px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;border:1px solid var(--rule)}
.qr img{width:192px;height:192px;image-rendering:pixelated}
.net{margin-top:12px}
.net .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.net .ssid{font-size:19px;font-weight:800;margin-top:2px}
.open{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--green);background:var(--soft);border-radius:999px;padding:3px 12px}
.passrow{display:flex;gap:8px;align-items:stretch;margin-top:12px}
.pass{flex:1;border:1px solid var(--rule);border-radius:12px;background:#FBF8F1;padding:11px 14px;font-size:16px;font-weight:700;letter-spacing:.5px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:0 16px;cursor:pointer}
.btn:active{filter:brightness(.94)}
.btn.big{width:100%;padding:14px 0;font-size:16px;border-radius:14px}
details summary::-webkit-details-marker{display:none}
.hint{margin-top:13px;font-size:12.5px;color:var(--muted)}
.hint b{color:var(--ink)}
.intro{text-align:center;color:var(--muted);font-size:13px;margin:-4px 0 14px}
.pend{background:#FBF8F1;border:1px dashed var(--rule-2);border-radius:16px;padding:26px 18px;color:var(--muted);text-align:center}
.foot{margin-top:8px;text-align:center;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head>
<body>
<div class="wrap">
  <div class="head">
    <div class="k">Casa Pepe</div>
    <h1>WiFi de la casa</h1>
    <div class="s" id="sede">Conéctate en un toque</div>
  </div>
  <div id="cont"><div class="card"><div class="qr"><span style="color:#A49B8C;font-size:13px">Cargando…</span></div></div></div>
  <div class="foot">Mi Casa Pepe es tu Casa 🧡</div>
</div>
<div class="toast" id="toast">Contraseña copiada ✓</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var prop=(new URLSearchParams(location.search).get('prop')||'cdmx').toLowerCase();
  if(prop!=='puebla') prop='cdmx';
  document.getElementById('sede').textContent = prop==='puebla'?'Casa Pepe Puebla':'Casa Pepe CDMX';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function wifiEnc(s){ return String(s==null?'':s).replace(/([\\\\;,:"])/g,'\\\\$1'); }
  function toast(){ var t=document.getElementById('toast'); t.classList.add('on'); setTimeout(function(){t.classList.remove('on');},1600); }
  function copiar(pass, box){ try{ navigator.clipboard.writeText(pass).then(toast,function(){fb(box);}); }catch(e){ fb(box); }
    function fb(el){ if(!el)return; var r=document.createRange(); r.selectNodeContents(el); var s=getSelection(); s.removeAllRanges(); s.addRange(r); try{document.execCommand('copy'); toast();}catch(_){} } }
  function abrirWifi(){ var ua=navigator.userAgent||''; try{
      if(/android/i.test(ua)) location.href='intent://wifi#Intent;action=android.settings.WIFI_SETTINGS;end';
      else if(/iphone|ipad|ipod/i.test(ua)) location.href='App-Prefs:root=WIFI';
    }catch(e){} }

  fetch(SB+'/rest/v1/apepe_config?clave=eq.apepe_wifi_'+prop+'&select=valor&limit=1',
    {headers:{apikey:KEY,Authorization:'Bearer '+KEY}})
    .then(function(r){return r.json();})
    .then(function(rows){
      var cont=document.getElementById('cont');
      var redes=[]; try{ redes=JSON.parse((rows&&rows[0]&&rows[0].valor)||'[]'); }catch(e){ redes=[]; }
      if(!Array.isArray(redes)||!redes.length){
        cont.innerHTML='<div class="pend"><b>La red aún no está publicada.</b><br>Pídele la contraseña del WiFi a recepción; en un momento la tendrás aquí.</div>';
        return;
      }
      var intro = redes.length>1 ? '<div class="intro">Tenemos dos redes — usa la que mejor te agarre.</div>' : '';
      var html = intro;
      redes.forEach(function(n,idx){
        var ssid=n.ssid||'', pass=n.pass||'', sec=(n.sec||(pass?'WPA':'nopass')).toUpperCase();
        var abierta = (sec==='NOPASS'||sec==='NONE'||sec==='ABIERTA'||sec==='OPEN'||!pass);
        var t = abierta?'nopass':sec;
        var payload='WIFI:T:'+t+';S:'+wifiEnc(ssid)+';'+(abierta?'':('P:'+wifiEnc(pass)+';'))+(n.hidden?'H:true;':'')+';';
        var qr=qrcode(0,'M'); qr.addData(payload); qr.make();
        var img=qr.createDataURL(6,1);
        html+='<div class="card">'+
          '<div class="net"><div class="lbl">Red</div><div class="ssid">'+esc(ssid)+'</div></div>'+
          (abierta?'<div class="open">Red abierta · sin contraseña</div>':'')+
          '<div style="margin-top:15px"><button class="btn big" data-conn="'+idx+'">📶 Conectarme</button></div>'+
          (abierta?''
            : '<div class="passrow"><div class="pass" id="pb'+idx+'">'+esc(pass)+'</div><button class="btn" data-i="'+idx+'">Copiar</button></div>')+
          '<div class="hint" id="ch'+idx+'">Toca <b>Conectarme</b>: te abrimos los ajustes de WiFi'+(abierta?' para que elijas <b>'+esc(ssid)+'</b> (sin contraseña).':' y te copiamos la contraseña para que la pegues en <b>'+esc(ssid)+'</b>.')+'</div>'+
          '<details style="margin-top:12px"><summary style="cursor:pointer;color:var(--muted);font-size:12.5px;list-style:none">o muestra el código QR (para escanear desde otra pantalla)</summary>'+
            '<div class="qr" style="margin-top:10px"><img src="'+img+'" alt="QR WiFi '+esc(ssid)+'"></div></details>'+
        '</div>';
      });
      cont.innerHTML=html;
      Array.prototype.forEach.call(cont.querySelectorAll('.btn[data-i]'),function(b){
        b.onclick=function(){ var i=b.getAttribute('data-i'); copiar(redes[i].pass, document.getElementById('pb'+i)); };
      });
      Array.prototype.forEach.call(cont.querySelectorAll('.btn[data-conn]'),function(b){
        b.onclick=function(){ var i=b.getAttribute('data-conn'); var n=redes[i]; var pass=n.pass||'';
          var sec=(n.sec||(pass?'WPA':'nopass')).toUpperCase();
          var abierta=(sec==='NOPASS'||sec==='NONE'||sec==='ABIERTA'||sec==='OPEN'||!pass);
          if(!abierta&&pass){ try{ navigator.clipboard.writeText(pass); }catch(e){} }
          var ch=document.getElementById('ch'+i);
          if(ch) ch.innerHTML = abierta
            ? 'Abre tus <b>ajustes de WiFi</b> y toca <b>'+esc(n.ssid)+'</b>. Es red abierta, no pide contraseña.'
            : '✓ Contraseña copiada. Abre tus <b>ajustes de WiFi</b>, toca <b>'+esc(n.ssid)+'</b> y pégala.';
          abrirWifi();
        };
      });
    })
    .catch(function(){
      document.getElementById('cont').innerHTML='<div class="pend">No pudimos cargar la red ahora mismo. Vuelve a intentarlo o pregunta en recepción.</div>';
    });
})();
</script>
</body></html>
