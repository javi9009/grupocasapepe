<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Cuándo vuelves? · Casa Pepe</title>
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<script src="/apepe/idioma.js"></script>
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6;--oro:#C9A227;--oro-bg:#F8F1DA;--naranja:#C9501A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;padding:22px 16px 48px}
.wrap{width:100%;max-width:460px;margin:0 auto}
.barra{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.volver{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:22px;line-height:1;cursor:pointer;padding:6px 8px 6px 0;flex:0 0 auto;text-decoration:none}
.head{flex:1;min-width:0;text-align:left}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:25px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}

/* Lo que se lleva puesto: cuántas noches ha dormido aquí. No es un adorno —
   es el motivo por el que se le trata distinto al volver. */
.tuyo{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:13px 15px;margin:14px 0;
  display:flex;align-items:center;gap:12px}
.tuyo .n{font-family:Oswald,sans-serif;font-weight:700;font-size:20px;flex:0 0 auto;
  background:var(--soft);color:var(--green);border-radius:10px;padding:7px 11px;line-height:1}
.tuyo .t b{display:block;font-size:13.5px}
.tuyo .t span{font-size:12.5px;color:var(--muted)}

.seclab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 0 9px}

/* El descuento: se enseña ya aplicado, no como un código que hay que acordarse
   de escribir. Si hay que teclearlo, la mitad no lo teclea. */
.codigo{background:var(--oro-bg);border:1px solid #E6D9A8;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.codigo b{font-family:Oswald,sans-serif;letter-spacing:.06em;font-size:18px;color:#7A5F0B}
.codigo p{margin:5px 0 0;font-size:13.5px;color:#6B5A2E}

.socio{background:#EDF6F1;border:1px solid #BFE0D0;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.socio b{font-size:14.5px;color:var(--green)}
.socio p{margin:5px 0 0;font-size:13.5px;color:#3D5C4E}

.motorbtn{display:block;background:var(--green);color:#fff;text-decoration:none;border-radius:16px;
  padding:16px 18px;text-align:center;box-shadow:0 10px 24px -16px rgba(19,122,86,.9)}
.motorbtn b{display:block;font-family:Oswald,sans-serif;font-size:18px;letter-spacing:.03em}
.motorbtn span{display:block;font-size:12.5px;opacity:.85;margin-top:3px}
.motor{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
.fechas{display:flex;gap:8px;margin-bottom:10px}
.fechas label{flex:1;min-width:0;display:block}
.fechas label.pax{flex:0 0 76px}
.fechas span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:3px}
.fechas input{width:100%;padding:9px 10px;border:1px solid var(--rule);border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.casas{display:flex;gap:8px;margin-bottom:12px}
.casab{flex:1;border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.casab.on{border-color:var(--green);background:#F4FAF7;color:var(--green)}
.opcion{display:flex;width:100%;align-items:center;gap:10px;text-align:left;border:1.5px solid var(--rule);
  background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opcion:hover{border-color:var(--green)}
.opcion.yendo{opacity:.5}
.opcion .q{flex:1;min-width:0}
.opcion .q b{display:block;font-size:14px}
.opcion .q span{font-size:12px;color:var(--faint)}
.opcion .p{text-align:right;flex:0 0 auto}
.opcion .p b{display:block;font-family:Oswald,sans-serif;font-size:17px;color:var(--green)}
.opcion .p span{font-size:11.5px;color:var(--muted)}
.hecha{background:#EDF6F1;border:1px solid #BFE0D0;border-radius:14px;padding:14px 16px;margin-top:6px}
.hecha b{color:var(--green);font-family:Oswald,sans-serif;font-size:18px}
.hecha p{margin:4px 0 0;font-size:13.5px;color:#3D5C4E}
.aviso{font-size:12.5px;color:var(--faint);margin-top:10px;text-align:center}
.aviso a{color:var(--muted)}
.cargando{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head><body>
<div class="wrap">
  <div class="barra">
    <a class="volver" id="atras" href="/apepe/" aria-label="Volver" data-i18n-aria="Volver">←</a>
    <div class="head">
      <div class="k" data-i18n>Casa Pepe</div>
      <h1 data-i18n>¿Cuándo vuelves?</h1>
      <div class="s" id="sub" data-i18n>Esta casa ya es un poco tuya.</div>
    </div>
  </div>

  <div id="cuerpo"><div class="cargando" data-i18n>Un momento…</div></div>
</div>

<script>
/* Atajo al traductor de idioma.js. Si todavía no cargó, devuelve el español. */
function T(f){ try{ return window.apepeT ? window.apepeT(f) : f; }catch(e){ return f; } }
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var P=new URLSearchParams(location.search);
  var RESV=P.get('resv')||P.get('sol')||'';
  try{ if(!RESV){ RESV=localStorage.getItem('cpp_resv')||''; } }catch(e){}
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  if(RESV) $('atras').href='/apepe/?resv='+encodeURIComponent(RESV);

  /* El motor de reservas de la casa, con el descuento ya puesto en la liga.
     Cloudbeds lo aplica solo al abrir: el huésped no teclea nada. */
  function motorUrl(sede){
    var hoy=new Date(); hoy.setDate(hoy.getDate()+14);
    var f=function(d){ return d.toISOString().slice(0,10); };
    var ent=new Date(hoy), sal=new Date(hoy); sal.setDate(sal.getDate()+2);
    var base = sede==='puebla'
      ? 'https://grupocasapepe.cloudbeds.com/es/reservas/hiU1o8'   /* mismo motor: elige casa dentro */
      : 'https://grupocasapepe.cloudbeds.com/es/reservas/hiU1o8';
    return base+'?checkin='+f(ent)+'&checkout='+f(sal)+'&currency=mxn&promo=SUPERPEPE';
  }

  function pinta(j){
    var c=$('cuerpo'), h='';
    var r=j.resumen||{estancias:0,noches:0};

    if(r.noches>0){
      h+='<div class="tuyo"><div class="n">'+r.noches+'</div><div class="t">'+
         '<b>'+esc(r.noches===1?T('Una noche en esta casa'):T('{n} noches en esta casa').replace('{n}',r.noches))+'</b>'+
         '<span>'+esc(r.estancias===1?T('Una estancia'):T('{n} estancias').replace('{n}',r.estancias))+'</span>'+
         '</div></div>';
    }

    if(j.es_socio){
      /* El socio no pasa por el motor público: tiene su tarifa y su cuenta. */
      h+='<div class="socio"><b>'+esc(T('Eres socio de la casa'))+'</b>'+
         '<p>'+esc(T('Reservas a tarifa de socio y la noche se carga a tu cuenta, sin pagar aquí. Dinos las fechas y te la dejamos hecha.'))+'</p></div>';
      h+='<div class="seclab">'+esc(T('Tu reserva de socio'))+'</div>';
      h+='<div class="motor" id="socio"></div>';
      SEDE = (j.reserva&&j.reserva.sede)||'cdmx';
      setTimeout(montaSocio,0);
    } else {
      h+='<div class="codigo"><b>SUPERPEPE</b>'+
         '<p>'+esc(T('Tu 15% de siempre, ya aplicado en la liga. No tienes que escribirlo.'))+'</p></div>';
      h+='<div class="seclab">'+esc(T('Elige tus fechas'))+'</div>';
      /* El motor NO va en iframe. Cloudbeds deja meterlo -no manda
         X-Frame-Options-, pero su propia aplicación se cae dentro del marco y
         lo que ve el huésped es la pantalla de error de ellos, con su nube
         dormida. Comprobado el 29-sep contra el motor real. Así que se abre
         aparte, que es lo único que funciona siempre, y la liga ya lleva el
         descuento puesto. */
      h+='<a class="motorbtn" href="'+esc(motorUrl(j.reserva&&j.reserva.sede))+'" target="_blank" rel="noopener">'+
         '<b>'+esc(T('Ver fechas y precios'))+'</b>'+
         '<span>'+esc(T('Con tu 15% ya aplicado'))+'</span></a>';
    }
    c.innerHTML=h;
    try{ if(window.apepeBarre) apepeBarre(c); }catch(e){}
  }

  /* ---------- el motor del socio ---------- */
  var SEDE='cdmx';
  function f10(d){ return d.toISOString().slice(0,10); }
  function masDias(f,n){ var d=new Date(f+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return f10(d); }
  function bonito(f){ try{ var d=new Date(f+'T00:00:00Z');
    return d.toLocaleDateString(apepeLang&&apepeLang()==='en'?'en-GB':'es-MX',{day:'numeric',month:'short',timeZone:'UTC'}); }catch(e){ return f; } }
  function dinero(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }

  function montaSocio(){
    var c=$('socio'); if(!c) return;
    var hoy=f10(new Date(Date.now()-6*3600*1000));
    var d1=masDias(hoy,14), d2=masDias(hoy,16);
    c.innerHTML=
      '<div class="fechas">'+
        '<label><span>'+esc(T('Entras'))+'</span><input type="date" id="sD1" value="'+d1+'" min="'+hoy+'"></label>'+
        '<label><span>'+esc(T('Sales'))+'</span><input type="date" id="sD2" value="'+d2+'" min="'+masDias(hoy,1)+'"></label>'+
        '<label class="pax"><span>'+esc(T('Personas'))+'</span><input type="number" id="sPax" value="1" min="1" max="6"></label>'+
      '</div>'+
      '<div class="casas" id="sCasas"></div>'+
      '<button class="motorbtn" id="sBuscar"><b>'+esc(T('Ver qué hay libre'))+'</b>'+
        '<span>'+esc(T('A tu tarifa de socio'))+'</span></button>'+
      '<div id="sRes"></div>';
    pintaCasas();
    $('sCasas').onclick=function(e){ var b=e.target.closest('[data-sede]'); if(!b) return;
      SEDE=b.getAttribute('data-sede'); pintaCasas(); $('sRes').innerHTML=''; };
    $('sBuscar').onclick=buscaSocio;
    try{ if(window.apepeBarre) apepeBarre(c); }catch(e){}
  }
  function pintaCasas(){
    $('sCasas').innerHTML=[['cdmx','CDMX'],['puebla','Puebla']].map(function(x){
      return '<button type="button" data-sede="'+x[0]+'" class="casab'+(SEDE===x[0]?' on':'')+'">'+x[1]+'</button>';
    }).join('');
  }

  function buscaSocio(){
    var d1=$('sD1').value, d2=$('sD2').value, pax=+$('sPax').value||1;
    var r=$('sRes'); r.innerHTML='<div class="cargando">'+esc(T('Mirando…'))+'</div>';
    fetch(SB+'/functions/v1/apepe-socio-reserva',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({op:'buscar',resv:RESV,sede:SEDE,desde:d1,hasta:d2,personas:pax})})
      .then(function(x){return x.json();})
      .then(function(j){
        if(!j||!j.ok){ r.innerHTML='<div class="cargando">'+esc(j&&j.error?j.error:T('No se pudo mirar ahora mismo.'))+'</div>'; return; }
        if(!j.opciones.length){ r.innerHTML='<div class="cargando">'+esc(T('Esas noches no queda nada libre. Prueba otras fechas.'))+'</div>'; return; }
        r.innerHTML='<div class="seclab">'+esc(T('{n} noches · {a} → {b}').replace('{n}',j.noches).replace('{a}',bonito(j.desde)).replace('{b}',bonito(j.hasta)))+'</div>'+
          j.opciones.map(function(o){
            return '<button type="button" class="opcion" data-rt="'+esc(o.room_type_id)+'">'+
              '<div class="q"><b>'+esc(o.nombre)+'</b>'+
              '<span>'+esc(T('Quedan {n}').replace('{n}',o.libres))+'</span></div>'+
              '<div class="p"><b>'+dinero(o.total)+'</b><span>'+dinero(o.noche)+'/'+esc(T('noche'))+'</span></div></button>';
          }).join('');
        r.onclick=function(e){ var b=e.target.closest('[data-rt]'); if(b) confirmaSocio(j,b.getAttribute('data-rt'),b); };
        try{ if(window.apepeBarre) apepeBarre(r); }catch(e){}
      })
      .catch(function(){ r.innerHTML='<div class="cargando">'+esc(T('Falló la conexión.'))+'</div>'; });
  }

  function confirmaSocio(j,rt,btn){
    var o=j.opciones.filter(function(x){return x.room_type_id===rt;})[0]; if(!o) return;
    var msg=T('{c}, {a} → {b}, {n} noches.').replace('{c}',o.nombre).replace('{a}',bonito(j.desde)).replace('{b}',bonito(j.hasta)).replace('{n}',j.noches)
      +'\n'+T('Son {t} a tu cuenta de socio. No se cobra aquí.').replace('{t}',dinero(o.total));
    if(!confirm(msg)) return;
    btn.disabled=true; btn.classList.add('yendo');
    fetch(SB+'/functions/v1/apepe-socio-reserva',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({op:'reservar',resv:RESV,sede:j.sede,desde:j.desde,hasta:j.hasta,
                           personas:j.personas,room_type_id:rt})})
      .then(function(x){return x.json();})
      .then(function(k){
        if(!k||!k.ok){ btn.disabled=false; btn.classList.remove('yendo');
          alert(k&&k.error==='ya_pedida'?T('Ya tienes esa misma reserva pedida.'):(k&&k.error)||T('No se pudo crear.')); return; }
        $('sRes').innerHTML='<div class="hecha"><b>'+esc(T('Hecha'))+'</b>'+
          '<p>'+esc(T('{c} · {a} → {b}').replace('{c}',k.cuarto).replace('{a}',bonito(k.desde)).replace('{b}',bonito(k.hasta)))+'<br>'+
          esc(T('{t} a tu cuenta de socio. Te llega el correo de confirmación.').replace('{t}',dinero(k.importe)))+'</p></div>';
      })
      .catch(function(){ btn.disabled=false; btn.classList.remove('yendo'); alert(T('Falló la conexión.')); });
  }

  function sinToken(){
    $('cuerpo').innerHTML='<div class="codigo"><b>SUPERPEPE</b><p>'+
      esc(T('Tu 15% de siempre, ya aplicado en la liga. No tienes que escribirlo.'))+'</p></div>'+
      '<a class="motorbtn" href="'+esc(motorUrl(''))+'" target="_blank" rel="noopener">'+
      '<b>'+esc(T('Ver fechas y precios'))+'</b><span>'+esc(T('Con tu 15% ya aplicado'))+'</span></a>';
  }

  if(!RESV){ sinToken(); }
  else{
    fetch(SB+'/functions/v1/apepe-estancias',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({resv:RESV})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok) pinta(j); else sinToken(); })
      .catch(function(){ sinToken(); });
  }
})();
</script>
<script src="/apepe/tabbar.js"></script>
</body></html>
