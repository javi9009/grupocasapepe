<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Cuándo vuelves? · Casa Pepe</title>
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<script src="/apepe/idioma.js"></script>
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6;--oro:#C9A227;--oro-bg:#F8F1DA;--naranja:#C9501A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;padding:22px 16px 48px}
.wrap{width:100%;max-width:460px;margin:0 auto}
.barra{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.volver{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:22px;line-height:1;cursor:pointer;padding:6px 8px 6px 0;flex:0 0 auto;text-decoration:none}
.head{flex:1;min-width:0;text-align:left}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:25px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}

/* Lo que se lleva puesto: cuántas noches ha dormido aquí. No es un adorno —
   es el motivo por el que se le trata distinto al volver. */
.tuyo{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:13px 15px;margin:14px 0;
  display:flex;align-items:center;gap:12px}
.tuyo .n{font-family:Oswald,sans-serif;font-weight:700;font-size:20px;flex:0 0 auto;
  background:var(--soft);color:var(--green);border-radius:10px;padding:7px 11px;line-height:1}
.tuyo .t b{display:block;font-size:13.5px}
.tuyo .t span{font-size:12.5px;color:var(--muted)}

.seclab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 0 9px}

/* El descuento: se enseña ya aplicado, no como un código que hay que acordarse
   de escribir. Si hay que teclearlo, la mitad no lo teclea. */
.codigo{background:var(--oro-bg);border:1px solid #E6D9A8;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.codigo b{font-family:Oswald,sans-serif;letter-spacing:.06em;font-size:18px;color:#7A5F0B}
.codigo p{margin:5px 0 0;font-size:13.5px;color:#6B5A2E}

.socio{background:#EDF6F1;border:1px solid #BFE0D0;border-radius:16px;padding:14px 16px;margin-bottom:14px}
.socio b{font-size:14.5px;color:var(--green)}
.socio p{margin:5px 0 0;font-size:13.5px;color:#3D5C4E}

.motorbtn{display:block;background:var(--green);color:#fff;text-decoration:none;border-radius:16px;
  padding:16px 18px;text-align:center;box-shadow:0 10px 24px -16px rgba(19,122,86,.9)}
.motorbtn b{display:block;font-family:Oswald,sans-serif;font-size:18px;letter-spacing:.03em}
.motorbtn span{display:block;font-size:12.5px;opacity:.85;margin-top:3px}
.motor{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:16px}
/* El calendario es el mismo de Sincrético: mismas clases, mismo gesto. Allí se
   elige un día; aquí dos, entrada y salida, porque se duerme. */
.calbar{display:flex;align-items:center;justify-content:space-between;margin:2px 0 10px}
.calbar .mes{font-family:Oswald,sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.calbar button{width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:#fff;
  font:inherit;color:var(--muted);cursor:pointer;line-height:1}
.calbar button:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);text-align:center;padding-bottom:4px}
.cal .d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:1px solid transparent;
  border-radius:10px;font-size:14.5px;color:var(--faint)}
.cal .d.hay{color:var(--ink);cursor:pointer}
.cal .d.hay:hover{border-color:var(--green)}
.cal .d.entre{background:var(--soft);border-radius:0}
.cal .d.ini,.cal .d.fin{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.cal .d.ini{border-radius:10px 0 0 10px}
.cal .d.fin{border-radius:0 10px 10px 0}
.cal .d.ini.fin{border-radius:10px}
.rango{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 2px}
.rango b{color:var(--ink)}
.pax{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--rule);
  border-radius:12px;padding:10px 12px;margin:12px 0}
.pax .t{flex:1;min-width:0}
.pax .t b{display:block;font-family:Oswald,sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase}
.pax .t span{font-size:11.5px;color:var(--faint)}
.pax button{width:34px;height:34px;border-radius:50%;border:1px solid var(--rule);background:#fff;
  font:inherit;font-size:18px;line-height:1;color:var(--ink);cursor:pointer}
.pax button:disabled{opacity:.3;cursor:default}
.pax .n{min-width:22px;text-align:center;font-weight:700;font-size:16px}
.casas{display:flex;gap:8px;margin-bottom:12px}
.casab{flex:1;border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:9px;font:inherit;font-weight:600;cursor:pointer;color:var(--muted)}
.casab.on{border-color:var(--green);background:#F4FAF7;color:var(--green)}
.opcion{display:flex;width:100%;align-items:center;gap:11px;text-align:left;border:1.5px solid var(--rule);
  background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;cursor:pointer}
.opcion:hover{border-color:var(--green)}
.opcion.on{border-color:var(--green);background:#F4FAF7}
.opcion input{width:19px;height:19px;flex:0 0 auto;accent-color:var(--green);margin:0}
.opcion .q{flex:1;min-width:0}
.opcion .q b{display:block;font-size:14px}
.opcion .q span{font-size:12px;color:var(--faint)}
.motorbtn[disabled]{background:var(--rule-2);box-shadow:none;cursor:default}
.hecha .nocobro{border-top:1px solid #BFE0D0;margin-top:10px;padding-top:10px;color:#4A6B5C}
/* La pregunta, dentro de la pantalla. Ni modal ni confirm del navegador. */
.qcaja{display:none}
.qcaja.on{display:block;margin-top:10px}
.qs{background:#F4FAF7;border:1.5px solid var(--green);border-radius:16px;padding:15px 16px}
.qs b{font-family:Oswald,sans-serif;font-size:17px;letter-spacing:.03em;color:var(--green)}
.qs p{margin:6px 0 0;font-size:14px;line-height:1.5}
.qs p.cu{color:var(--muted);font-size:13px}
.qb{display:flex;gap:8px;margin-top:13px}
.qb button{flex:1;border-radius:11px;padding:11px;font:inherit;font-weight:600;cursor:pointer}
.qb .no{border:1.5px solid var(--rule);background:#fff;color:var(--muted)}
.qb .si{border:1.5px solid var(--green);background:var(--green);color:#fff}
.savi{display:none}
.savi.on{display:block;background:#F7EAE6;border:1px solid #E4C3B9;color:#8C3B27;
  border-radius:12px;padding:11px 13px;margin-top:10px;font-size:13.5px;line-height:1.5}
.hecha{background:#EDF6F1;border:1px solid #BFE0D0;border-radius:14px;padding:14px 16px;margin-top:6px}
.hecha b{color:var(--green);font-family:Oswald,sans-serif;font-size:18px}
.hecha p{margin:4px 0 0;font-size:13.5px;color:#3D5C4E}
.aviso{font-size:12.5px;color:var(--faint);margin-top:10px;text-align:center}
.aviso a{color:var(--muted)}
.cargando{padding:40px 16px;text-align:center;color:var(--muted);font-size:13.5px}
</style>
</head><body>
<div class="wrap">
  <div class="barra">
    <a class="volver" id="atras" href="/apepe/" aria-label="Volver" data-i18n-aria="Volver">←</a>
    <div class="head">
      <div class="k" data-i18n>Casa Pepe</div>
      <h1 data-i18n>¿Cuándo vuelves?</h1>
      <div class="s" id="sub" data-i18n>Esta casa ya es un poco tuya.</div>
    </div>
  </div>

  <div id="cuerpo"><div class="cargando" data-i18n>Un momento…</div></div>
</div>

<script>
/* Atajo al traductor de idioma.js. Si todavía no cargó, devuelve el español. */
function T(f){ try{ return window.apepeT ? window.apepeT(f) : f; }catch(e){ return f; } }
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var P=new URLSearchParams(location.search);
  var RESV=P.get('resv')||P.get('sol')||'';
  /* La llave personal del socio. Entra sin tener reserva abierta: es la liga
     que se le manda a cada socio y no caduca. */
  var SOCIO=P.get('socio')||'';
  try{ if(!RESV && !SOCIO){ RESV=localStorage.getItem('cpp_resv')||''; } }catch(e){}
  function llave(){ return SOCIO ? {socio:SOCIO} : {resv:RESV}; }
  var $=function(id){return document.getElementById(id);};
  var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

  if(RESV) $('atras').href='/apepe/?resv='+encodeURIComponent(RESV);
  if(SOCIO) $('atras').style.visibility='hidden';

  /* El motor de reservas de la casa, con el descuento ya puesto en la liga.
     Cloudbeds lo aplica solo al abrir: el huésped no teclea nada. */
  function motorUrl(sede){
    var hoy=new Date(); hoy.setDate(hoy.getDate()+14);
    var f=function(d){ return d.toISOString().slice(0,10); };
    var ent=new Date(hoy), sal=new Date(hoy); sal.setDate(sal.getDate()+2);
    var base = sede==='puebla'
      ? 'https://grupocasapepe.cloudbeds.com/es/reservas/hiU1o8'   /* mismo motor: elige casa dentro */
      : 'https://grupocasapepe.cloudbeds.com/es/reservas/hiU1o8';
    return base+'?checkin='+f(ent)+'&checkout='+f(sal)+'&currency=mxn&promo=SUPERPEPE';
  }

  function pinta(j){
    var c=$('cuerpo'), h='';
    var r=j.resumen||{estancias:0,noches:0};

    if(r.noches>0){
      h+='<div class="tuyo"><div class="n">'+r.noches+'</div><div class="t">'+
         '<b>'+esc(r.noches===1?T('Una noche en esta casa'):T('{n} noches en esta casa').replace('{n}',r.noches))+'</b>'+
         '<span>'+esc(r.estancias===1?T('Una estancia'):T('{n} estancias').replace('{n}',r.estancias))+'</span>'+
         '</div></div>';
    }

    if(j.es_socio){
      /* El socio no pasa por el motor público: tiene su tarifa y su cuenta. */
      h+='<div class="socio"><b>'+esc(T('Eres socio de la casa'))+'</b>'+
         '<p>'+esc(T('Reservas a tarifa de socio y la noche se carga a tu cuenta, sin pagar aquí. Dinos las fechas y te la dejamos hecha.'))+'</p></div>';
      h+='<div class="seclab">'+esc(T('Tu reserva de socio'))+'</div>';
      h+='<div class="motor" id="socio"></div>';
      SEDE = (j.reserva&&j.reserva.sede)||'cdmx';
      setTimeout(montaSocio,0);
    } else {
      h+='<div class="codigo"><b>SUPERPEPE</b>'+
         '<p>'+esc(T('Tu 15% de siempre, ya aplicado en la liga. No tienes que escribirlo.'))+'</p></div>';
      h+='<div class="seclab">'+esc(T('Elige tus fechas'))+'</div>';
      /* El motor NO va en iframe. Cloudbeds deja meterlo -no manda
         X-Frame-Options-, pero su propia aplicación se cae dentro del marco y
         lo que ve el huésped es la pantalla de error de ellos, con su nube
         dormida. Comprobado el 29-sep contra el motor real. Así que se abre
         aparte, que es lo único que funciona siempre, y la liga ya lleva el
         descuento puesto. */
      h+='<a class="motorbtn" href="'+esc(motorUrl(j.reserva&&j.reserva.sede))+'" target="_blank" rel="noopener">'+
         '<b>'+esc(T('Ver fechas y precios'))+'</b>'+
         '<span>'+esc(T('Con tu 15% ya aplicado'))+'</span></a>';
    }
    c.innerHTML=h;
    try{ if(window.apepeBarre) apepeBarre(c); }catch(e){}
  }

  /* ---------- el motor del socio ---------- */
  var SEDE='cdmx';
  function f10(d){ return d.toISOString().slice(0,10); }
  function masDias(f,n){ var d=new Date(f+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return f10(d); }
  function bonito(f){ try{ var d=new Date(f+'T00:00:00Z');
    return d.toLocaleDateString(apepeLang&&apepeLang()==='en'?'en-GB':'es-MX',{day:'numeric',month:'short',timeZone:'UTC'}); }catch(e){ return f; } }
  function dinero(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }

  var MES=null, D1=null, D2=null, PAX=1;
  function ymd(d){ return d.toISOString().slice(0,10); }
  function hoyYmd(){ return ymd(new Date(Date.now()-6*3600*1000)); }
  function DOW(){ return apepeLang&&apepeLang()==='en' ? ['M','T','W','T','F','S','S'] : ['L','M','M','J','V','S','D']; }
  function nombreMes(d){
    try{ return d.toLocaleDateString(apepeLang&&apepeLang()==='en'?'en-GB':'es-MX',{month:'long',year:'numeric'}); }
    catch(e){ return ''; }
  }

  function montaSocio(){
    var c=$('socio'); if(!c) return;
    MES=new Date(); MES.setDate(1); D1=null; D2=null; PAX=1;
    c.innerHTML=
      '<div class="casas" id="sCasas"></div>'+
      '<div class="calbar"><button type="button" id="cPrev" aria-label="Mes anterior">‹</button>'+
        '<div class="mes" id="cMes"></div>'+
        '<button type="button" id="cNext" aria-label="Mes siguiente">›</button></div>'+
      '<div class="cal" id="cal"></div>'+
      '<div class="rango" id="cRango"></div>'+
      '<div class="pax"><div class="t"><b>'+esc(T('Personas'))+'</b>'+
        '<span>'+esc(T('En total, contándote'))+'</span></div>'+
        '<button type="button" id="pMenos">−</button><span class="n" id="pNum">1</span>'+
        '<button type="button" id="pMas">+</button></div>'+
      '<button class="motorbtn" id="sBuscar" disabled><b>'+esc(T('Ver qué hay libre'))+'</b>'+
        '<span>'+esc(T('Elige entrada y salida'))+'</span></button>'+
      '<div class="qcaja" id="sConf"></div>'+
      '<div class="savi" id="sAviso"></div>'+
      '<div id="sRes"></div>';
    pintaCasas(); pintaCal(); pintaPax();
    $('sCasas').onclick=function(e){ var b=e.target.closest('[data-sede]'); if(!b) return;
      SEDE=b.getAttribute('data-sede'); pintaCasas(); $('sRes').innerHTML=''; };
    $('cPrev').onclick=function(){ MES=new Date(MES.getFullYear(),MES.getMonth()-1,1); pintaCal(); };
    $('cNext').onclick=function(){ MES=new Date(MES.getFullYear(),MES.getMonth()+1,1); pintaCal(); };
    $('pMenos').onclick=function(){ if(PAX>1){PAX--;pintaPax();} };
    $('pMas').onclick=function(){ if(PAX<6){PAX++;pintaPax();} };
    $('sBuscar').onclick=buscaSocio;
    try{ if(window.apepeBarre) apepeBarre(c); }catch(e){}
  }

  function pintaPax(){
    $('pNum').textContent=PAX;
    $('pMenos').disabled=(PAX<=1); $('pMas').disabled=(PAX>=6);
  }

  /* Un toque pone la entrada; el siguiente, la salida. Si el segundo cae antes
     o es el mismo día, se empieza otra vez desde ahí: es lo que espera la mano. */
  function tocaDia(f){
    if(!D1 || D2 || f<=D1){ D1=f; D2=null; }
    else { D2=f; }
    pintaCal();
  }

  function pintaCal(){
    var hoy=hoyYmd(), ahora=new Date();
    $('cMes').textContent=nombreMes(MES);
    $('cPrev').disabled=(MES.getFullYear()===ahora.getFullYear()&&MES.getMonth()===ahora.getMonth());
    var tope=new Date(ahora.getFullYear(),ahora.getMonth()+12,1);
    $('cNext').disabled=(MES>=tope);

    var h=DOW().map(function(d){return '<div class="dow">'+d+'</div>';}).join('');
    var primero=new Date(MES.getFullYear(),MES.getMonth(),1);
    var hueco=(primero.getDay()+6)%7;            /* la semana empieza en lunes */
    for(var i=0;i<hueco;i++) h+='<div></div>';
    var ultimo=new Date(MES.getFullYear(),MES.getMonth()+1,0).getDate();

    for(var n=1;n<=ultimo;n++){
      var d=new Date(MES.getFullYear(),MES.getMonth(),n);
      var f=ymd(new Date(d.getTime()-d.getTimezoneOffset()*60000));
      var pasado=(f<hoy);
      var cls='d'+(pasado?'':' hay')+
        (f===D1?' ini':'')+(f===D2?' fin':'')+
        (D1&&D2&&f>D1&&f<D2?' entre':'');
      h+='<div class="'+cls+'"'+(pasado?'':' data-f="'+f+'"')+'>'+n+'</div>';
    }
    $('cal').innerHTML=h;
    Array.prototype.forEach.call($('cal').querySelectorAll('.d[data-f]'),function(c){
      c.onclick=function(){ tocaDia(c.getAttribute('data-f')); };
    });

    var r=$('cRango'), b=$('sBuscar');
    if(D1&&D2){
      var nn=Math.round((new Date(D2+'T00:00:00Z')-new Date(D1+'T00:00:00Z'))/86400000);
      r.innerHTML='<b>'+esc(bonito(D1))+'</b> → <b>'+esc(bonito(D2))+'</b> · '+
        esc((nn===1?T('{n} noche'):T('{n} noches')).replace('{n}',nn));
      b.disabled=false; b.querySelector('span').textContent=T('A tu tarifa de socio');
    } else {
      r.textContent = D1 ? T('¿Y qué día sales?') : T('Toca el día que entras');
      b.disabled=true; b.querySelector('span').textContent=T('Elige entrada y salida');
    }
  }
  function pintaCasas(){
    $('sCasas').innerHTML=[['cdmx','CDMX'],['puebla','Puebla']].map(function(x){
      return '<button type="button" data-sede="'+x[0]+'" class="casab'+(SEDE===x[0]?' on':'')+'">'+x[1]+'</button>';
    }).join('');
  }

  function buscaSocio(){
    var d1=D1, d2=D2, pax=PAX;
    aviso(''); var cf=$('sConf'); if(cf){cf.classList.remove('on');cf.innerHTML='';}
    var r=$('sRes'); r.innerHTML='<div class="cargando">'+esc(T('Mirando…'))+'</div>';
    fetch(SB+'/functions/v1/apepe-socio-reserva',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({op:'buscar',sede:SEDE,desde:d1,hasta:d2,personas:pax},llave()))})
      .then(function(x){return x.json();})
      .then(function(j){
        if(!j||!j.ok){ r.innerHTML='<div class="cargando">'+esc(j&&j.error?j.error:T('No se pudo mirar ahora mismo.'))+'</div>'; return; }
        if(!j.opciones.length){ r.innerHTML='<div class="cargando">'+esc(T('Esas noches no queda nada libre. Prueba otras fechas.'))+'</div>'; return; }
        r.innerHTML='<div class="seclab">'+esc(T('{n} noches · {a} → {b}').replace('{n}',j.noches).replace('{a}',bonito(j.desde)).replace('{b}',bonito(j.hasta)))+'</div>'+
          j.opciones.map(function(o){
            return '<label class="opcion"><input type="checkbox" value="'+esc(o.room_type_id)+'">'+
              '<div class="q"><b>'+esc(o.nombre)+'</b>'+
              '<span>'+esc(T('Quedan {n}').replace('{n}',o.libres))+'</span></div></label>';
          }).join('')+
          '<button class="motorbtn" id="sReservar" disabled><b>'+esc(T('Reservar'))+'</b>'+
          '<span>'+esc(T('Elige dónde quieres dormir'))+'</span></button>';
        /* Puede elegir varios: una cama para él y otra para quien venga, o dos
           cuartos. Se reservan todos de una, en la misma reserva. */
        var marcados=function(){ return Array.prototype.filter.call(r.querySelectorAll('input'),function(x){return x.checked;}).map(function(x){return x.value;}); };
        r.onchange=function(){
          var v=marcados(), bt=$('sReservar');
          Array.prototype.forEach.call(r.querySelectorAll('.opcion'),function(l){ l.classList.toggle('on', l.querySelector('input').checked); });
          bt.disabled=!v.length;
          bt.querySelector('span').textContent = v.length
            ? (v.length===1?T('Una habitación'):T('{n} habitaciones').replace('{n}',v.length))
            : T('Elige dónde quieres dormir');
        };
        $('sReservar').onclick=function(){ reservaSocio(j, marcados(), $('sReservar')); };
        try{ if(window.apepeBarre) apepeBarre(r); }catch(e){}
      })
      .catch(function(){ r.innerHTML='<div class="cargando">'+esc(T('Falló la conexión.'))+'</div>'; });
  }

  /* Sin pop-ups del navegador: ese «grupocasapepe.netlify.app dice» rompe la
     casa y en el móvil tapa media pantalla. Lo que se pregunta y lo que se
     responde pasa aquí dentro. */
  function aviso(txt){
    var a=$('sAviso'); if(!a) return;
    a.textContent=txt||''; a.classList.toggle('on', !!txt);
    if(txt){ try{ a.scrollIntoView({block:'nearest',behavior:'smooth'}); }catch(e){} }
  }

  function reservaSocio(j, rts, btn){
    if(!rts.length) return;
    aviso('');
    var nombres=j.opciones.filter(function(o){return rts.indexOf(o.room_type_id)>=0;}).map(function(o){return o.nombre;});
    /* No se le pregunta por el importe porque no lo decide él: la noche va a
       su cuenta de socio. Se le confirma qué y cuándo, que es lo suyo. */
    var caja=$('sConf');
    caja.innerHTML='<div class="qs">'+
      '<b>'+esc(T('¿Lo reservo?'))+'</b>'+
      '<p>'+nombres.map(esc).join('<br>')+'</p>'+
      '<p class="cu">'+esc(T('{a} → {b}, {n} noches.').replace('{a}',bonito(j.desde)).replace('{b}',bonito(j.hasta)).replace('{n}',j.noches))+'</p>'+
      '<div class="qb"><button type="button" class="no" id="qNo">'+esc(T('Ahora no'))+'</button>'+
      '<button type="button" class="si" id="qSi">'+esc(T('Sí, resérvalo'))+'</button></div></div>';
    caja.classList.add('on');
    try{ caja.scrollIntoView({block:'center',behavior:'smooth'}); }catch(e){}
    $('qNo').onclick=function(){ caja.classList.remove('on'); caja.innerHTML=''; };
    $('qSi').onclick=function(){ caja.classList.remove('on'); caja.innerHTML=''; manda(j,rts,btn); };
  }

  function manda(j, rts, btn){
    btn.disabled=true; btn.querySelector('b').textContent=T('Reservando…');
    fetch(SB+'/functions/v1/apepe-socio-reserva',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({op:'reservar',sede:j.sede,desde:j.desde,hasta:j.hasta,
                           personas:j.personas,cuartos:rts},llave()))})
      .then(function(x){return x.json();})
      .then(function(k){
        if(!k||!k.ok){
          btn.disabled=false; btn.querySelector('b').textContent=T('Reservar');
          aviso(k&&k.error==='ya_pedida'?T('Ya tienes esa misma reserva pedida.'):((k&&(k.detalle||k.error))||T('No se pudo crear.')));
          return;
        }
        $('sRes').innerHTML='<div class="hecha"><b>'+esc(T('Hecha'))+'</b>'+
          '<p>'+esc((k.cuartos||[]).join(' + '))+'<br>'+
          esc(T('{a} → {b} · {c}').replace('{a}',bonito(k.desde)).replace('{b}',bonito(k.hasta)).replace('{c}',k.casa))+'</p>'+
          '<p>'+esc(T('Te acaba de llegar el correo con la confirmación.'))+'</p>'+
          '<p class="nocobro">'+esc(T('No te preocupes por el importe: como socio va a tu cuenta y no se cobra aquí ni en recepción.'))+'</p></div>';
        try{ if(window.apepeBarre) apepeBarre($('sRes')); }catch(e){}
      })
      .catch(function(){ btn.disabled=false; btn.querySelector('b').textContent=T('Reservar'); aviso(T('Falló la conexión.')); });
  }

  function sinToken(){
    $('cuerpo').innerHTML='<div class="codigo"><b>SUPERPEPE</b><p>'+
      esc(T('Tu 15% de siempre, ya aplicado en la liga. No tienes que escribirlo.'))+'</p></div>'+
      '<a class="motorbtn" href="'+esc(motorUrl(''))+'" target="_blank" rel="noopener">'+
      '<b>'+esc(T('Ver fechas y precios'))+'</b><span>'+esc(T('Con tu 15% ya aplicado'))+'</span></a>';
  }

  if(SOCIO){
    /* Con la llave de socio no hace falta preguntar por ninguna reserva: ya
       sabemos quién es y a qué tarifa reserva. */
    fetch(SB+'/functions/v1/apepe-socio-reserva',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({op:'quien',socio:SOCIO})})
      .then(function(r){return r.json();})
      .then(function(j){
        if(j&&j.ok){ pinta({es_socio:true, socio:j.socio, resumen:{estancias:0,noches:0}, reserva:{sede:'cdmx'}}); }
        else { sinToken(); }
      })
      .catch(function(){ sinToken(); });
  }
  else if(!RESV){ sinToken(); }
  else{
    fetch(SB+'/functions/v1/apepe-estancias',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},
      body:JSON.stringify({resv:RESV})})
      .then(function(r){return r.json();})
      .then(function(j){ if(j&&j.ok) pinta(j); else sinToken(); })
      .catch(function(){ sinToken(); });
  }
})();
</script>
<script src="/apepe/tabbar.js"></script>
</body></html>
