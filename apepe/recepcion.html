<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APePe · Recepción</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5; --error:#9E3B2E; --error-bg:#F6E1DD;
  --sombra:0 1px 2px rgba(30,26,22,.06),0 18px 40px -26px rgba(30,26,22,.45);
  --sombra-sm:0 1px 2px rgba(30,26,22,.05),0 8px 20px -16px rgba(30,26,22,.4);
  --radio:18px;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100dvh}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 44px}
img{max-width:100%}
/* header */
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:11px 16px}
.top .marca{height:38px;width:auto}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1}
.top .lema{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:13px;margin-top:1px}
.franja{height:7px;display:flex}.franja i{flex:1}
/* prop selector */
.propsel{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.propsel button{border:1.5px solid var(--linea);background:#fff;border-radius:999px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:13px;padding:9px 20px;cursor:pointer;color:var(--gris)}
.propsel button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.dia{text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--tenue);margin:2px 0 10px}
/* search */
.buscador{position:relative;margin:6px 0 8px}
.buscador input{width:100%;padding:14px 15px 14px 44px;border:1.5px solid var(--linea);border-radius:14px;font:inherit;font-size:16px;background:#fff;color:var(--tinta);box-shadow:var(--sombra-sm)}
.buscador input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.buscador .lupa{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.5}
.hint{font-size:12.5px;color:var(--gris);text-align:center;margin:2px 0 12px}
/* arrivals list */
.lista{display:flex;flex-direction:column;gap:10px}
.g{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra-sm);padding:13px 14px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.g:hover{border-color:var(--naranja);box-shadow:var(--sombra)}
.g:active{transform:scale(.995)}
.ini{flex:0 0 46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--naranja),var(--magenta));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase}
.g.done .ini{background:var(--ok)}
.g.ns .ini{background:linear-gradient(135deg,#C9501A,var(--error))}
.gnom{font-weight:700;font-size:16px;line-height:1.2}
.gsub{font-size:12.5px;color:var(--gris);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
.chip.por{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.chip.ya{background:var(--ok-bg);color:var(--ok)}
.chip.ns{background:var(--error-bg);color:var(--error);font-weight:700}
.flecha{margin-left:auto;color:var(--tenue);font-size:20px}
.vacio{text-align:center;color:var(--gris);padding:34px 10px;font-size:14px}
.cargando{text-align:center;color:var(--tenue);padding:30px 10px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
/* selected guest sheet */
.sheet{position:fixed;inset:0;background:rgba(30,26,22,.55);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .card{background:var(--papel);border-radius:24px 24px 0 0;width:100%;max-width:620px;margin:0 auto;max-height:92dvh;overflow:auto;padding:8px 18px 26px;box-shadow:0 -20px 50px -20px rgba(30,26,22,.5)}
@media(min-width:640px){.sheet{align-items:center}.sheet .card{border-radius:24px;max-height:90dvh}}
.grab{width:44px;height:5px;border-radius:999px;background:var(--linea);margin:8px auto 6px}
.sclose{background:none;border:0;color:var(--gris);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:12px;cursor:pointer;padding:6px 2px;font-weight:600}
.hola{text-align:center;margin:2px 0 4px}
.hola .k{font-family:'Lobster Two',cursive;color:var(--magenta);font-size:20px}
.hola .n{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.05;margin-top:2px}
.hola .m{color:var(--gris);font-size:13.5px;margin-top:5px}
.qrbox{display:flex;flex-direction:column;align-items:center;margin:14px 0 6px;padding:18px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra-sm)}
.qrbox img{width:240px;height:240px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px}
.qrcap{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;color:var(--gris);margin-top:12px;text-align:center;line-height:1.5}
.o{display:flex;align-items:center;gap:10px;color:var(--tenue);font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:14px 2px}
.o:before,.o:after{content:"";height:1px;background:var(--linea);flex:1}
.btn{border:0;border-radius:14px;padding:15px 18px;font-family:'Inter';font-weight:700;font-size:15.5px;cursor:pointer;background:var(--naranja);color:#fff;width:100%;box-shadow:var(--sombra-sm)}
.btn:hover{background:var(--naranja-oscuro)}
.btn.sec{background:#fff;color:var(--tinta);border:1.5px solid var(--linea);box-shadow:none;margin-top:10px}
.avsheet{font-size:13px;color:var(--gris);text-align:center;min-height:16px;margin-top:8px}
/* overlay wizard */
.ov{position:fixed;inset:0;background:var(--tinta);display:none;flex-direction:column;z-index:70}
.ov.on{display:flex}
.ovbar{background:var(--tinta);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 14px}
.ovbar button{background:#fff;color:var(--tinta);border:0;border-radius:11px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:12px;padding:10px 15px;cursor:pointer}
.ovbar .nm{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14px}
.ov iframe{flex:1;border:0;width:100%;background:var(--papel)}
.foot{text-align:center;color:var(--tenue);font-size:12px;margin-top:22px}
.foot .l{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px}
</style></head>
<body>
<header class="top">
  <div class="in">
    <img class="marca" src="/img/casapepe/casapepe_blanco.png" alt="Casa Pepe" onerror="this.style.display='none'">
    <div><div class="nom">Recepción</div><div class="lema">Check-in de hoy</div></div>
  </div>
  <div class="franja"><i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i><i style="background:var(--rosa)"></i><i style="background:var(--cielo)"></i></div>
</header>

<div class="wrap">
  <div class="propsel">
    <button data-p="cdmx" class="on">Casa Pepe CDMX</button>
    <button data-p="puebla">Casa Pepe Puebla</button>
  </div>
  <div class="dia" id="dia">&nbsp;</div>

  <div class="buscador">
    <span class="lupa">🔍</span>
    <input id="q" type="text" placeholder="Busca al huésped por su nombre…" autocomplete="off">
  </div>
  <div class="hint">Toca tu nombre y escanea el código con tu celular para hacer tu check-in.</div>

  <div class="lista" id="lista"><div class="cargando">Cargando llegadas…</div></div>

  <div class="foot">Deja esta pantalla abierta en la tablet · <span class="l">Mi Casa Pepe es tu Casa</span></div>
</div>

<!-- hoja del huésped seleccionado -->
<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"></div>
    <div style="text-align:right"><button class="sclose" id="sclose">✕ Cerrar</button></div>
    <div class="hola">
      <div class="k">¡Hola!</div>
      <div class="n" id="sNom">—</div>
      <div class="m" id="sMeta">—</div>
    </div>
    <div class="qrbox">
      <img id="qr" alt="Código de check-in">
      <div class="qrcap">Escanea con la cámara de tu celular<br>y haz tu check-in en 2 minutos</div>
    </div>
    <div class="o">o si prefieres</div>
    <button class="btn" id="btnTablet">📝 Hacer el check-in en esta tablet</button>
    <button class="btn sec" id="btnCopiar">🔗 Copiar el link para enviarlo</button>
    <div class="avsheet" id="avSheet"></div>
  </div>
</div>

<!-- overlay wizard -->
<div class="ov" id="ov">
  <div class="ovbar"><button id="ovBack">← Volver</button><span class="nm" id="ovNom"></span></div>
  <iframe id="ovFrame" title="Check-in"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var PROP='cdmx', DATOS=[], CUR=null, tokCache={};
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fdate(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); if(p.length!==3) return s; return Number(p[2])+' '+MESES[Number(p[1])-1]; }
  function iniciales(n){ var w=String(n||'').trim().split(/\s+/).filter(Boolean); if(!w.length) return '·'; return (w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase(); }

  Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(b){
    b.onclick=function(){ PROP=b.getAttribute('data-p');
      Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(x){x.className=(x.getAttribute('data-p')===PROP?'on':'');});
      cargar(); };
  });

  function cargar(){
    var box=$('lista'); box.innerHTML='<div class="cargando">Cargando llegadas…</div>'; DATOS=[];
    fetch(SB+'/functions/v1/apepe-recepcion-portal',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({prop:PROP})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ box.innerHTML='<div class="vacio">No pudimos cargar las llegadas. Intenta de nuevo.</div>'; return; }
        $('dia').textContent='Llegadas · '+fdate(d.fecha);
        DATOS=d.llegadas||[]; pintar();
      }).catch(function(){ box.innerHTML='<div class="vacio">Sin conexión. Revisa el internet de la tablet.</div>'; });
  }

  function pintar(){
    var box=$('lista'); var q=($('q').value||'').trim().toLowerCase();
    var arr=DATOS.filter(function(g){ return !q || String(g.nombre).toLowerCase().indexOf(q)>=0; });
    if(!arr.length){ box.innerHTML='<div class="vacio">'+(q?'No encontramos a nadie con ese nombre.':'No hay llegadas registradas para hoy en esta sede.')+'</div>'; return; }
    box.innerHTML=arr.map(function(g){
      var cls=g.ns?'ns':(g.checked_in?'done':'');
      var chip=g.ns?'<span class="chip ns">NS · no llegó ayer</span>':(g.checked_in?'<span class="chip ya">✓ Ya llegó</span>':'<span class="chip por">Por llegar</span>');
      var hab=g.habitacion?('<span>'+esc(g.habitacion)+'</span>'):'';
      return '<button class="g '+cls+'" data-rid="'+esc(g.reservation_id)+'">'+
        '<span class="ini">'+esc(iniciales(g.nombre))+'</span>'+
        '<span><span class="gnom">'+esc(g.nombre||'Huésped')+'</span>'+
        '<span class="gsub">'+chip+hab+'</span></span>'+
        '<span class="flecha">›</span></button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.g'),function(b){ b.onclick=function(){ abrir(b.getAttribute('data-rid')); }; });
  }
  $('q').addEventListener('input',pintar);

  function pintarQR(link){ try{ var qr=qrcode(0,'M'); qr.addData(link); qr.make(); $('qr').src=qr.createDataURL(6,2); $('qr').style.display=''; }catch(e){ $('qr').style.display='none'; } }

  function abrir(rid){
    CUR=null; $('avSheet').textContent=''; $('sheet').className='sheet on';
    var g=DATOS.filter(function(x){return String(x.reservation_id)===String(rid);})[0]||{};
    $('sNom').textContent=g.nombre||'Huésped';
    $('sMeta').textContent='Preparando tu check-in…';
    $('qr').style.display='none';
    if(tokCache[rid]){ usarTok(tokCache[rid]); return; }
    fetch(SB+'/functions/v1/apepe-checkin-token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({reservation_id:rid,prop:PROP})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ $('sMeta').textContent=(d&&d.error)||'No pudimos preparar el check-in.'; return; }
        tokCache[rid]=d; usarTok(d);
      }).catch(function(){ $('sMeta').textContent='Error de conexión.'; });
  }
  function usarTok(d){ CUR=d;
    $('sMeta').textContent=[d.habitacion,(d.desde?('Llega '+fdate(d.desde)):'')].filter(Boolean).join(' · ')||'Bienvenido a Casa Pepe';
    pintarQR(d.link);
  }
  $('sclose').onclick=function(){ $('sheet').className='sheet'; };
  $('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) $('sheet').className='sheet'; });
  $('btnCopiar').onclick=function(){ if(!CUR) return; try{ navigator.clipboard.writeText(CUR.link); $('avSheet').textContent='Link copiado ✓'; }catch(e){ prompt('Copia el link:', CUR.link); } };
  $('btnTablet').onclick=function(){ if(!CUR) return; $('ovNom').textContent=CUR.nombre||''; $('ovFrame').src=CUR.link; $('ov').className='ov on'; };
  $('ovBack').onclick=function(){ $('ov').className='ov'; $('ovFrame').src='about:blank'; $('sheet').className='sheet'; cargar(); };

  cargar();
})();
</script>
</body></html>
