<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Check-in en recepción · Casa Pepe</title>
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule2:#D2C8B6;--verde:#137A56;--soft:#DCEFE6;--naranja:#E1622F}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.5;min-height:100vh}
.top{background:#241c14;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px}
.top img{height:30px}.top .k{font-size:18px;font-weight:800}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 50px}
.propsel{display:flex;gap:8px;margin:6px 0 18px;justify-content:center}
.propsel button{border:1.5px solid var(--rule2);background:#fff;border-radius:999px;font-weight:800;font-size:15px;padding:9px 22px;cursor:pointer;color:var(--muted)}
.propsel button.on{background:var(--verde);color:#fff;border-color:var(--verde)}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:18px;box-shadow:0 1px 1px rgba(31,27,22,.04),0 14px 34px -24px rgba(31,27,22,.45);padding:18px 18px 20px;margin-bottom:16px}
.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;margin-bottom:6px}
.srow{display:flex;gap:10px}
.srow input{flex:1;padding:14px 15px;border:1.5px solid var(--rule2);border-radius:12px;font:inherit;font-size:17px}
.btn{border:0;border-radius:12px;background:var(--verde);color:#fff;font:inherit;font-weight:800;font-size:16px;padding:14px 20px;cursor:pointer}
.btn:active{filter:brightness(.94)}.btn.o{background:var(--naranja)}.btn.ghost{background:#EFEAE0;color:var(--ink)}
.btn.full{width:100%}
.aviso{font-size:14px;color:var(--muted);margin-top:10px;min-height:18px}
.res{display:none}.res.on{display:block}
.gu{font-weight:800;font-size:20px}.meta{color:var(--muted);font-size:14px;margin-top:2px}
.qrbox{display:flex;flex-direction:column;align-items:center;margin:16px 0 8px;padding:16px;background:#FBF8F1;border:1px solid var(--rule);border-radius:16px}
.qrbox img{width:230px;height:230px;image-rendering:pixelated;background:#fff;padding:6px;border-radius:10px}
.qrcap{font-size:13px;color:var(--muted);margin-top:8px;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.acts .btn{width:100%;justify-content:center}
@media(max-width:520px){.acts{grid-template-columns:1fr}}
.arr{margin-top:6px}
.arrit{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 4px;border-top:1px solid var(--rule)}
.arrit:first-child{border-top:0}
.arrit .n{font-weight:700;font-size:15px}.arrit .d{font-size:12.5px;color:var(--muted)}
.pill{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--verde);cursor:pointer;border:0}
/* overlay wizard */
.ov{position:fixed;inset:0;background:#241c14;display:none;flex-direction:column;z-index:60}
.ov.on{display:flex}
.ovbar{background:#241c14;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px}
.ovbar button{background:#fff;color:var(--ink);border:0;border-radius:10px;font-weight:800;padding:9px 14px;cursor:pointer}
.ov iframe{flex:1;border:0;width:100%;background:#F4F1EA}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style></head>
<body>
<div class="top"><img src="/img/casapepe/casapepe_blanco.png" alt="Casa Pepe" onerror="this.style.display='none'"><span class="k">Check-in en recepción</span></div>
<div class="wrap">
  <div class="propsel">
    <button data-p="cdmx" class="on">Casa Pepe CDMX</button>
    <button data-p="puebla">Casa Pepe Puebla</button>
  </div>
  <div class="card">
    <div class="lbl">Buscar reserva</div>
    <div class="srow">
      <input id="rid" inputmode="numeric" placeholder="ID de reserva de Cloudbeds">
      <button class="btn" id="buscar">Buscar</button>
    </div>
    <div class="aviso" id="av"></div>
    <div class="res" id="res">
      <div class="gu" id="gNombre">—</div>
      <div class="meta" id="gMeta">—</div>
      <div class="qrbox"><img id="qr" alt="QR check-in"><div class="qrcap">El huésped escanea este código y hace su check-in en su celular.</div></div>
      <div class="acts">
        <button class="btn o" id="btnTablet">🖥️ Check-in en esta tablet</button>
        <button class="btn ghost" id="btnCopiar">🔗 Copiar link</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="lbl">Llegadas de hoy</div>
    <div class="arr" id="arr"><div class="meta">Cargando…</div></div>
  </div>
  <div class="foot">Deja esta pantalla abierta en la tablet · Mi Casa Pepe es tu Casa 🧡</div>
</div>

<div class="ov" id="ov"><div class="ovbar"><button id="ovBack">← Volver al portal</button><span style="color:#fff;font-weight:700" id="ovNom"></span></div><iframe id="ovFrame" title="Check-in"></iframe></div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var PROP='cdmx', CUR=null;
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fdate(s){ if(!s) return ''; var p=String(s).split('-'); return p.length===3?(p[2]+'/'+p[1]):s; }
  Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(b){ b.onclick=function(){ PROP=b.getAttribute('data-p');
    Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(x){x.className=(x.getAttribute('data-p')===PROP?'on':'');});
    $('res').className='res'; $('av').textContent=''; cargarLlegadas(); }; });

  function pintarQR(link){ try{ var qr=qrcode(0,'M'); qr.addData(link); qr.make(); $('qr').src=qr.createDataURL(6,2); }catch(e){ $('qr').style.display='none'; } }
  function buscar(rid){ rid=(rid||$('rid').value||'').trim(); if(!rid){ $('av').textContent='Escribe el ID de la reserva.'; return; }
    $('av').textContent='Buscando…'; $('res').className='res';
    fetch(SB+'/functions/v1/apepe-checkin-token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({reservation_id:rid,prop:PROP})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ $('av').textContent=(d&&d.error)||'No encontramos esa reserva.'; return; }
        CUR=d; $('av').textContent='';
        $('gNombre').textContent=d.nombre||'Huésped';
        $('gMeta').textContent=[esc(d.habitacion||''),(d.desde?('Llega '+fdate(d.desde)):'')].filter(Boolean).join(' · ');
        pintarQR(d.link); $('res').className='res on';
      }).catch(function(){ $('av').textContent='Error de conexión.'; });
  }
  $('buscar').onclick=function(){ buscar(); };
  $('rid').addEventListener('keydown',function(e){ if(e.key==='Enter') buscar(); });
  $('btnCopiar').onclick=function(){ if(!CUR) return; try{ navigator.clipboard.writeText(CUR.link); $('av').textContent='Link copiado ✓'; }catch(e){ prompt('Copia el link:', CUR.link); } };
  $('btnTablet').onclick=function(){ if(!CUR) return; $('ovNom').textContent=CUR.nombre||''; $('ovFrame').src=CUR.link; $('ov').className='ov on'; };
  $('ovBack').onclick=function(){ $('ov').className='ov'; $('ovFrame').src='about:blank'; cargarLlegadas(); };

  function cargarLlegadas(){ var box=$('arr'); box.innerHTML='<div class="meta">Cargando…</div>';
    fetch(SB+'/functions/v1/apepe-recepcion',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({dias:1})})
      .then(function(r){return r.json();}).then(function(d){
        var arr=(d&&(d.llegadas||d.data||d))||[]; if(!Array.isArray(arr)) arr=[];
        var hoy=new Date().toISOString().slice(0,10);
        arr=arr.filter(function(a){ var sede=(a.sede||a.property||'cdmx'); return sede===PROP && (!a.desde || String(a.desde).slice(0,10)<=hoy? true:true); });
        if(!arr.length){ box.innerHTML='<div class="meta">Sin llegadas hoy para esta sede. Busca por ID arriba.</div>'; return; }
        box.innerHTML=arr.slice(0,20).map(function(a){ var rid=a.reservation_id||a.reservationID||a.id; var nom=a.nombre||a.guestName||'Huésped';
          return '<div class="arrit"><div><div class="n">'+esc(nom)+'</div><div class="d">'+esc(a.habitacion||a.roomTypeName||'')+' · '+esc(rid)+'</div></div><button class="pill" data-rid="'+esc(rid)+'">Check-in</button></div>'; }).join('');
        Array.prototype.forEach.call(box.querySelectorAll('.pill'),function(b){ b.onclick=function(){ $('rid').value=b.getAttribute('data-rid'); buscar(b.getAttribute('data-rid')); window.scrollTo(0,0); }; });
      }).catch(function(){ box.innerHTML='<div class="meta">No se pudieron cargar las llegadas. Busca por ID arriba.</div>'; });
  }
  cargarLlegadas();
})();
</script>
</body></html>
