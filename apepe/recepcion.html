<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5; --error:#9E3B2E; --error-bg:#F6E1DD;
  --sombra:0 1px 2px rgba(30,26,22,.06),0 18px 40px -26px rgba(30,26,22,.45);
  --sombra-sm:0 1px 2px rgba(30,26,22,.05),0 8px 20px -16px rgba(30,26,22,.4);
  --radio:18px;
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100dvh}
.wrap{max-width:620px;margin:0 auto;padding:0 16px 44px}
img{max-width:100%}
/* header */
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:11px 16px}
.top .marca{height:38px;width:auto}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1}
.top .lema{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:13px;margin-top:1px}
.franja{height:7px;display:flex}.franja i{flex:1}
/* prop selector */
.propsel{display:flex;gap:8px;justify-content:center;margin:16px 0 4px}
.propsel button{border:1.5px solid var(--linea);background:#fff;border-radius:999px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:13px;padding:9px 20px;cursor:pointer;color:var(--gris)}
.propsel button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.dia{text-align:center;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:11px;color:var(--tenue);margin:2px 0 10px}
/* search */
.buscador{position:relative;margin:6px 0 8px}
.buscador input{width:100%;padding:14px 15px 14px 44px;border:1.5px solid var(--linea);border-radius:14px;font:inherit;font-size:16px;background:#fff;color:var(--tinta);box-shadow:var(--sombra-sm)}
.buscador input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.buscador .lupa{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:17px;opacity:.5}
.hint{font-size:12.5px;color:var(--gris);text-align:center;margin:2px 0 12px}
.fechas{display:flex;justify-content:center;gap:14px;margin:0 0 8px;flex-wrap:wrap}
.fbtn{background:none;border:0;color:var(--naranja-oscuro);font:inherit;font-weight:700;font-size:13px;cursor:pointer;padding:4px 6px}
.fbtn.hoy{color:var(--gris)}
.fpanel{display:none;background:#fff;border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra-sm);padding:12px;margin:0 0 12px}
.fpanel.on{display:block}
.frow{display:flex;gap:10px;margin-bottom:10px}
.frow label{flex:1;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:11px;letter-spacing:.05em;color:var(--gris);display:flex;flex-direction:column;gap:4px}
.frow input{padding:11px 12px;border:1.5px solid var(--linea);border-radius:11px;font:inherit;font-size:15px}
.btnbuscar{width:100%;border:0;border-radius:12px;background:var(--naranja);color:#fff;font-family:'Inter';font-weight:700;font-size:15px;padding:12px;cursor:pointer}
.g .fch{font-size:11px;color:var(--tenue);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
/* arrivals list */
.lista{display:flex;flex-direction:column;gap:10px}
.g{display:flex;align-items:center;gap:13px;background:#fff;border:1px solid var(--linea);border-radius:16px;box-shadow:var(--sombra-sm);padding:13px 14px;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.g:hover{border-color:var(--naranja);box-shadow:var(--sombra)}
.g:active{transform:scale(.995)}
.ini{flex:0 0 46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--naranja),var(--magenta));color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald',sans-serif;font-weight:700;font-size:18px;text-transform:uppercase}
.g.done .ini{background:var(--ok)}
.g.ns .ini{background:linear-gradient(135deg,#C9501A,var(--error))}
.gnom{font-weight:700;font-size:16px;line-height:1.2}
.gsub{font-size:12.5px;color:var(--gris);margin-top:2px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.chip{font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:2px 8px;border-radius:999px}
.chip.por{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.chip.ya{background:var(--ok-bg);color:var(--ok)}
.chip.ns{background:var(--error-bg);color:var(--error);font-weight:700}
.flecha{margin-left:auto;color:var(--tenue);font-size:20px}
.vacio{text-align:center;color:var(--gris);padding:34px 10px;font-size:14px}
.cargando{text-align:center;color:var(--tenue);padding:30px 10px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:12px}
.saludo{text-align:center;padding:14px 10px 4px}
.saludo img{max-height:200px;filter:drop-shadow(0 16px 24px rgba(30,26,22,.22))}
.saludo .h{font-family:'Lobster Two',cursive;color:var(--magenta);font-size:32px;line-height:1;margin-top:4px}
.saludo .s{color:var(--gris);font-size:14px;margin-top:4px}
/* selected guest sheet */
.sheet{position:fixed;inset:0;background:rgba(30,26,22,.55);display:none;align-items:flex-end;z-index:50}
.sheet.on{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet .card{background:var(--papel);border-radius:24px 24px 0 0;width:100%;max-width:620px;margin:0 auto;max-height:92dvh;overflow:auto;padding:8px 18px 26px;box-shadow:0 -20px 50px -20px rgba(30,26,22,.5)}
@media(min-width:640px){.sheet{align-items:center}.sheet .card{border-radius:24px;max-height:90dvh}}
.grab{width:44px;height:5px;border-radius:999px;background:var(--linea);margin:8px auto 6px}
.sclose{background:none;border:0;color:var(--gris);font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:12px;cursor:pointer;padding:6px 2px;font-weight:600}
.hola{text-align:center;margin:2px 0 4px}
.hola .k{font-family:'Lobster Two',cursive;color:var(--magenta);font-size:20px}
.hola .n{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:26px;line-height:1.05;margin-top:2px}
.hola .m{color:var(--gris);font-size:13.5px;margin-top:5px}
.qrbox{display:flex;flex-direction:column;align-items:center;margin:14px 0 6px;padding:18px;background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra-sm)}
.qrbox img{width:240px;height:240px;image-rendering:pixelated;background:#fff;padding:8px;border-radius:12px}
.qrcap{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;color:var(--gris);margin-top:12px;text-align:center;line-height:1.5}
.o{display:flex;align-items:center;gap:10px;color:var(--tenue);font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.1em;margin:14px 2px}
.o:before,.o:after{content:"";height:1px;background:var(--linea);flex:1}
.btn{border:0;border-radius:14px;padding:15px 18px;font-family:'Inter';font-weight:700;font-size:15.5px;cursor:pointer;background:var(--naranja);color:#fff;width:100%;box-shadow:var(--sombra-sm)}
.btn:hover{background:var(--naranja-oscuro)}
.btn.sec{background:#fff;color:var(--tinta);border:1.5px solid var(--linea);box-shadow:none;margin-top:10px}
.avsheet{font-size:13px;color:var(--gris);text-align:center;min-height:16px;margin-top:8px}
/* overlay wizard */
.ov{position:fixed;inset:0;background:var(--tinta);display:none;flex-direction:column;z-index:70}
.ov.on{display:flex}
.ovbar{background:var(--tinta);color:#fff;display:flex;align-items:center;gap:10px;padding:9px 14px}
.ovbar button{background:rgba(255,255,255,.14);color:#fff;border:0;border-radius:50%;
  font:inherit;font-size:16px;line-height:1;width:34px;height:34px;cursor:pointer;flex:0 0 auto}
.ovbar button:hover{background:rgba(255,255,255,.28)}
.ovbar .nm{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14px}
.ov iframe{flex:1;border:0;width:100%;background:var(--papel)}
.foot{text-align:center;color:var(--tenue);font-size:12px;margin-top:22px}
.foot .l{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px}
</style><script src="/apepe/resv.js"></script>
<script src="/apepe/marca.js"></script>
</head>
<body>
<header class="top">
  <div class="in">
    <img class="marca" data-marca-logo="blanco" src="/img/casapepe/casapepe_blanco.png" alt="Casa Pepe" onerror="this.style.display='none'">
    <div><div class="nom">Recepción</div><div class="lema">Check-in de hoy</div></div>
  </div>
  <div class="franja"><i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i><i style="background:var(--rosa)"></i><i style="background:var(--cielo)"></i></div>
</header>

<div class="wrap">
  <div class="propsel">
    <button data-p="cdmx" class="on">Casa Pepe CDMX</button>
    <button data-p="puebla">Casa Pepe Puebla</button>
  </div>
  <div class="dia" id="dia">&nbsp;</div>

  <div class="buscador">
    <span class="lupa">🔍</span>
    <input id="q" type="text" placeholder="Busca por nombre o número de reserva…" autocomplete="off">
  </div>
  <div class="fechas">
    <button class="fbtn" id="btnFechas" type="button">📅 Buscar en otras fechas</button>
    <button class="fbtn hoy" id="btnHoy" type="button" style="display:none">← Volver a hoy</button>
    <!-- Lo que pidieron los chicos: después de registrar a alguien, poder volver
         a sacarle su QR para que siga en su celular. Si son dos, lo escanean los
         dos: el QR no se gasta. Javi, 28-sep. -->
    <button class="fbtn" id="btnHechos" type="button">✓ Check-ins de hoy</button>
    <button class="fbtn" id="btnRefrescar" type="button">🔄 Actualizar de Cloudbeds</button>
  </div>
  <div class="fpanel" id="fpanel">
    <div class="frow">
      <label>Desde<input type="date" id="fDesde"></label>
      <label>Hasta<input type="date" id="fHasta"></label>
    </div>
    <button class="btnbuscar" id="fGo" type="button">Buscar en estas fechas</button>
  </div>
  <div class="saludo" id="saludo">
    <img src="/img/apepe/stickers/hola-perrito.webp" alt="Hola" onerror="this.style.display='none'">
    <div class="s" id="saludoSub">Escribe tu nombre y te preparo tu check-in.</div>
  </div>
  <div class="lista" id="lista"></div>

  <div class="foot">Deja esta pantalla abierta en la tablet · <span class="l">Mi Casa Pepe es tu Casa</span></div>
</div>

<!-- hoja del huésped seleccionado -->
<div class="sheet" id="sheet">
  <div class="card">
    <div class="grab"></div>
    <div style="text-align:right"><button class="sclose" id="sclose">✕ Cerrar</button></div>
    <div class="hola">
      <div class="k">¡Hola!</div>
      <div class="n" id="sNom">—</div>
      <div class="m" id="sMeta">—</div>
    </div>
    <div class="qrbox">
      <img id="qr" alt="Código">
      <div class="qrcap" id="qrcap">Escanea con la cámara de tu celular<br>y haz tu check-in en 2 minutos</div>
    </div>
    <div class="o" id="sOtra">o si prefieres</div>
    <button class="btn" id="btnTablet">📝 Hacer el check-in en esta tablet</button>
    <button class="btn sec" id="btnCopiar">🔗 Copiar el link para enviarlo</button>
    <div class="avsheet" id="avSheet"></div>
  </div>
</div>

<!-- overlay wizard -->
<div class="ov" id="ov">
  <!-- Aquí ya no dice «Volver»: para volver está la flecha de la propia app, al
       lado de cada título. Esto es otra cosa —cerrar la ventana y soltar al
       huésped—, así que es una ✕ a la derecha y el nombre manda. Javi, 28-sep. -->
  <div class="ovbar"><span class="nm" id="ovNom"></span><span style="flex:1"></span>
    <button id="ovBack" title="Cerrar" aria-label="Cerrar">✕</button></div>
  <iframe id="ovFrame" title="Check-in"></iframe>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var PROP='cdmx', DATOS=[], CUR=null, tokCache={}, RANGO=null;
  var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fdate(s){ if(!s) return ''; var p=String(s).slice(0,10).split('-'); if(p.length!==3) return s; return Number(p[2])+' '+MESES[Number(p[1])-1]; }
  function iniciales(n){ var w=String(n||'').trim().split(/\s+/).filter(Boolean); if(!w.length) return '·'; return (w[0][0]+(w.length>1?w[w.length-1][0]:'')).toUpperCase(); }

  Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(b){
    b.onclick=function(){ PROP=b.getAttribute('data-p');
      Array.prototype.forEach.call(document.querySelectorAll('.propsel button'),function(x){x.className=(x.getAttribute('data-p')===PROP?'on':'');});
      $('q').value=''; cargar(); };
  });

  // Contención 27-sep-2026: la tablet se abre con su llave en el link (?k=...), que
  // se guarda en el dispositivo y viaja en x-integracion-token. Sin llave (o con
  // sesión del equipo) también sirve la sesión iniciada.
  // La llave se guarda REDUNDANTE: localStorage + cookie larga. En iPad/Safari el
  // localStorage se borra a los ~7 días si la página NO está instalada como app; por eso
  // conviene instalarla en la pantalla de inicio (en modo app Safari ya no la borra) y,
  // mientras tanto, la cookie sirve de respaldo. Se refresca en cada apertura.
  var LLAVE='';
  function _ckGet(n){ try{ var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)')); return m?decodeURIComponent(m[1]):''; }catch(e){ return ''; } }
  function _ckSet(n,v){ try{ document.cookie=n+'='+encodeURIComponent(v)+'; path=/; max-age=34560000; samesite=Lax'; }catch(e){} }
  try{
    var _k=new URLSearchParams(location.search).get('k');
    if(_k){ try{localStorage.setItem('cpp_tablet_llave',_k);}catch(e){} _ckSet('cpp_tablet_llave',_k); history.replaceState(null,'',location.pathname); }
    try{ LLAVE=localStorage.getItem('cpp_tablet_llave')||''; }catch(e){}
    if(!LLAVE){ LLAVE=_ckGet('cpp_tablet_llave'); if(LLAVE){ try{localStorage.setItem('cpp_tablet_llave',LLAVE);}catch(e){} } }
    if(LLAVE){ _ckSet('cpp_tablet_llave',LLAVE); }
  }catch(e){}
  function sesTok(){ try{ for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(!k||!/^sb-.*-auth-token$/.test(k)) continue; var raw=localStorage.getItem(k)||''; if(raw.indexOf('base64-')===0) raw=atob(raw.slice(7)); var v=JSON.parse(raw); var ss=v.currentSession||v; if(ss&&ss.access_token) return ss.access_token; } }catch(e){} return ''; }
  function cab(){ var h={apikey:KEY,'Content-Type':'application/json',Authorization:'Bearer '+(sesTok()||KEY)}; if(LLAVE) h['x-integracion-token']=LLAVE; return h; }
  // Deja rastro cuando la tablet cae en el candado (perdió su llave): el
  // vigilante diario lo lee y avisa a Javi. Máx 1 aviso cada 2h por dispositivo
  // para no hacer ruido. Best-effort: si falla, ni se nota. Javi, 10-oct.
  function avisaSinLlave(){
    try{
      var ahora=Date.now(), ult=0;
      try{ ult=parseInt(localStorage.getItem('cpp_aviso_sinllave')||'0',10)||0; }catch(_){}
      if(ahora-ult < 7200000) return;
      try{ localStorage.setItem('cpp_aviso_sinllave', String(ahora)); }catch(_){}
      var body=JSON.stringify({prop:PROP, evento:'sin_llave', detalle:(location.hostname||''), ua:(navigator.userAgent||'').slice(0,280)});
      fetch(SB+'/rest/v1/apepe_salud',{method:'POST',keepalive:true,headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json',Prefer:'return=minimal'},body:body}).catch(function(){});
    }catch(_){}
  }
  function cargar(rango){
    RANGO=rango||null; DATOS=[]; $('lista').innerHTML=''; $('saludo').style.display='block';
    $('btnHoy').style.display=RANGO?'inline':'none';
    $('saludoSub').textContent=RANGO?'Cargando las llegadas de esas fechas…':'Cargando las llegadas de hoy…';
    var body={prop:PROP}; if(RANGO){ body.desde=RANGO.desde; body.hasta=RANGO.hasta; }
    var authFail=false;
    fetch(SB+'/functions/v1/apepe-recepcion-portal',{method:'POST',headers:cab(),body:JSON.stringify(body)})
      .then(function(r){ authFail=(r.status===401); return r.json(); }).then(function(d){
        if(!d||!d.ok){
          if(authFail || (d&&/recepci|llave|sesi/i.test(d.error||''))){
            /* Zuzu se quedó sin poder registrar a nadie porque la tablet perdió
               la llave y el mensaje sólo ofrecía una salida que depende de Javi.
               Hay una segunda, que ella misma puede hacer. Javi, 28-sep. */
            $('saludoSub').innerHTML='🔒 Esta tablet necesita su <b>llave de acceso</b>.<br><br>'+
              'Ábrela con el link que te compartió Javi (el que termina en <b>?k=…</b>): queda guardada '+
              'en este dispositivo y ya no la pide más.<br><br>'+
              '<b>O, si tienes cuenta de Casa Pepe:</b> entra en '+
              '<a href="/" target="_blank" rel="noopener" style="color:var(--naranja,#E1622F);font-weight:700">grupocasapepe.netlify.app</a> '+
              'con tu correo en este mismo navegador y vuelve a esta pantalla. Con tu sesión también abre.<br><br>'+
              '<b>Para que no se vuelva a pedir:</b> abre el link con la llave y luego <b>instálala en la pantalla de inicio</b> '+
              '(Compartir → “Agregar a inicio”). Instalada como app, ya no se borra la llave.';
            avisaSinLlave();
          } else { $('saludoSub').textContent='No pudimos cargar las llegadas. Intenta de nuevo.'; }
          return;
        }
        $('dia').textContent=RANGO?('Llegadas · '+fdate(d.desde)+' → '+fdate(d.hasta)):('Llegadas · '+fdate(d.fecha));
        DATOS=d.llegadas||[];
        $('saludoSub').textContent=RANGO?'Escribe el nombre o el número de reserva para encontrarlo.':'Escribe tu nombre y te preparo tu check-in.';
        if(SOLOHECHOS) pintarHechos(); else pintar();
      }).catch(function(){ $('saludoSub').textContent='Sin conexión. Revisa el internet de la tablet.'; });
  }

  function pintar(){
    var box=$('lista'); var q=($('q').value||'').trim().toLowerCase();
    if(!q){ box.innerHTML=''; $('saludo').style.display='block'; return; }
    $('saludo').style.display='none';
    var arr=DATOS.filter(function(g){ return String(g.nombre).toLowerCase().indexOf(q)>=0 || String(g.reservation_id).toLowerCase().indexOf(q)>=0; });
    if(!arr.length){ box.innerHTML='<div class="vacio">No encontramos a nadie con ese nombre o número en estas fechas.</div>'; return; }
    box.innerHTML=arr.map(function(g){
      var cls=g.ns?'ns':(g.checked_in?'done':'');
      var chip=g.ns?'<span class="chip ns">NS · no llegó ayer</span>':(g.checked_in?'<span class="chip ya">✓ Ya llegó</span>':'<span class="chip por">Por llegar</span>');
      var hab=g.habitacion?('<span>'+esc(g.habitacion)+'</span>'):'';
      var fch=RANGO?('<span class="fch">'+fdate(g.desde)+'</span>'):'';
      return '<button class="g '+cls+'" data-rid="'+esc(g.reservation_id)+'">'+
        '<span class="ini">'+esc(iniciales(g.nombre))+'</span>'+
        '<span><span class="gnom">'+esc(g.nombre||'Huésped')+'</span>'+
        '<span class="gsub">'+chip+hab+fch+'</span></span>'+
        '<span class="flecha">›</span></button>';
    }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('.g'),function(b){ b.onclick=function(){ abrir(b.getAttribute('data-rid')); }; });
  }
  $('q').addEventListener('input',pintar);

  // Buscar en otras fechas
  (function(){
    function ymd(off){ var d=new Date(); d.setDate(d.getDate()+(off||0)); return d.toISOString().slice(0,10); }
    $('fDesde').value=ymd(0); $('fHasta').value=ymd(7);
    $('btnFechas').onclick=function(){ $('fpanel').classList.toggle('on'); };
    $('fGo').onclick=function(){
      var de=$('fDesde').value, ha=$('fHasta').value;
      if(!de||!ha){ return; } if(ha<de){ var t=de; de=ha; ha=t; }
      $('fpanel').classList.remove('on'); $('q').value=''; cargar({desde:de,hasta:ha});
    };
    $('btnHoy').onclick=function(){ $('q').value=''; cargar(null); };
  })();

  // Vuelve a consultar Cloudbeds en vivo (walk-ins y reservas de último minuto que
  // entraron después de abrir la pantalla). Respeta la vista actual (hoy o rango,
  // y "Check-ins de hoy"). Javi, 11-oct.
  (function(){
    var cargando=false;
    $('btnRefrescar').onclick=function(){
      if(cargando) return; cargando=true;
      var b=this, t=b.textContent; b.textContent='⏳ Actualizando…';
      try{ cargar(RANGO); }catch(_){}
      setTimeout(function(){ b.textContent=t; cargando=false; }, 1600);
    };
  })();

  function pintarQR(link){ try{ var qr=qrcode(0,'M'); qr.addData(link); qr.make(); $('qr').src=qr.createDataURL(6,2); $('qr').style.display=''; }catch(e){ $('qr').style.display='none'; } }

  /* Los que ya se registraron hoy. Mismo listado, otro filtro: no hace falta
     pedirle nada más al servidor porque `checked_in` ya viene en cada llegada. */
  var SOLOHECHOS=false;
  function pintarHechos(){
    var box=$('lista');
    var arr=DATOS.filter(function(g){ return g.checked_in && !g.ns; });
    $('saludo').style.display='none';
    if(!arr.length){ box.innerHTML='<div class="vacio">Todavía no se ha registrado nadie hoy.</div>'; return; }
    box.innerHTML='<div class="vacio" style="padding:10px 4px;text-align:left">Tócalo y le sale su código: '+
      'que lo escanee con su celular para seguir desde ahí. Si son dos, lo escanean los dos.</div>'+
      arr.map(function(g){
        var hab=g.habitacion?('<span>'+esc(g.habitacion)+'</span>'):'';
        return '<button class="g done" data-app="'+esc(g.reservation_id)+'">'+
          '<span class="ini">'+esc(iniciales(g.nombre))+'</span>'+
          '<span><span class="gnom">'+esc(g.nombre||'Huésped')+'</span>'+
          '<span class="gsub"><span class="chip ya">✓ Ya se registró</span>'+hab+'</span></span>'+
          '<span class="flecha">›</span></button>';
      }).join('');
    Array.prototype.forEach.call(box.querySelectorAll('[data-app]'),function(b){
      b.onclick=function(){ abrirApp(b.getAttribute('data-app')); };
    });
  }

  /* El QR de su app, no el del check-in: ése ya lo hizo. */
  function abrirApp(rid){
    CUR=null; $('avSheet').textContent=''; $('sheet').className='sheet on';
    var g=DATOS.filter(function(x){return String(x.reservation_id)===String(rid);})[0]||{};
    $('sNom').textContent=g.nombre||'Huésped';
    $('sMeta').textContent='Su check-in ya está hecho.';
    $('qrcap').innerHTML='Que lo escanee con su celular<br>y sigue desde ahí: su cuarto, el mapa y sus experiencias';
    $('qr').style.display='none';
    $('btnTablet').style.display='none'; $('sOtra').style.display='none';
    $('btnCopiar').textContent='🔗 Copiar el link de su app';
    function pinta(d){
      var tok=''; try{ tok=new URL(d.link, location.origin).searchParams.get('resv')||''; }catch(_){}
      var liga=location.origin+'/apepe/'+(tok?('?resv='+encodeURIComponent(tok)):'');
      CUR={link:liga, app:true};
      $('sMeta').textContent=[g.habitacion,'Su check-in ya está hecho.'].filter(Boolean).join(' · ');
      pintarQR(liga);
    }
    if(tokCache[rid]){ pinta(tokCache[rid]); return; }
    fetch(SB+'/functions/v1/apepe-checkin-token',{method:'POST',headers:cab(),body:JSON.stringify({reservation_id:rid,prop:PROP})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ $('sMeta').textContent=(d&&d.error)||'No pudimos sacar su código.'; return; }
        tokCache[rid]=d; pinta(d);
      }).catch(function(){ $('sMeta').textContent='Error de conexión.'; });
  }

  $('btnHechos').onclick=function(){
    SOLOHECHOS=!SOLOHECHOS;
    this.classList.toggle('hoy', SOLOHECHOS);
    this.textContent = SOLOHECHOS ? '← Volver a buscar' : '✓ Check-ins de hoy';
    $('q').value='';
    if(SOLOHECHOS) pintarHechos(); else { $('lista').innerHTML=''; $('saludo').style.display='block'; }
  };

  function abrir(rid){
    CUR=null; $('avSheet').textContent=''; $('sheet').className='sheet on';
    $('btnTablet').style.display=''; $('sOtra').style.display='';
    $('btnCopiar').textContent='🔗 Copiar el link para enviarlo';
    $('qrcap').innerHTML='Escanea con la cámara de tu celular<br>y haz tu check-in en 2 minutos';
    var g=DATOS.filter(function(x){return String(x.reservation_id)===String(rid);})[0]||{};
    $('sNom').textContent=g.nombre||'Huésped';
    $('sMeta').textContent='Preparando tu check-in…';
    $('qr').style.display='none';
    if(tokCache[rid]){ usarTok(tokCache[rid]); return; }
    fetch(SB+'/functions/v1/apepe-checkin-token',{method:'POST',headers:cab(),body:JSON.stringify({reservation_id:rid,prop:PROP})})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ $('sMeta').textContent=(d&&d.error)||'No pudimos preparar el check-in.'; return; }
        tokCache[rid]=d; usarTok(d);
      }).catch(function(){ $('sMeta').textContent='Error de conexión.'; });
  }
  function usarTok(d){ CUR=d;
    $('sMeta').textContent=[d.habitacion,(d.desde?('Llega '+fdate(d.desde)):'')].filter(Boolean).join(' · ')||'Bienvenido a Casa Pepe';
    pintarQR(d.link);
  }
  $('sclose').onclick=function(){ $('sheet').className='sheet'; };
  $('sheet').addEventListener('click',function(e){ if(e.target===$('sheet')) $('sheet').className='sheet'; });
  $('btnCopiar').onclick=function(){ if(!CUR) return; try{ navigator.clipboard.writeText(CUR.link); $('avSheet').textContent='Link copiado ✓'; }catch(e){ prompt('Copia el link:', CUR.link); } };
  $('btnTablet').onclick=function(){ if(!CUR) return; $('ovNom').textContent=CUR.nombre||'';
    /* `front=1` para que al terminar no se meta en la app del huésped: le saca
       su QR y ofrece empezar con el siguiente. */
    var u=CUR.link+(CUR.link.indexOf('?')>=0?'&':'?')+'front=1';
    $('ovFrame').src=u; $('ov').className='ov on'; };
  function cierraOv(){ $('ov').className='ov'; $('ovFrame').src='about:blank'; $('sheet').className='sheet';
    /* Volver deja la pantalla lista para el siguiente, que es lo que pidió Zuzu. */
    SOLOHECHOS=false; $('btnHechos').classList.remove('hoy'); $('btnHechos').textContent='✓ Check-ins de hoy';
    cargar(); }
  $('ovBack').onclick=cierraOv;
  /* Las pantallas de dentro avisan cuando terminan —el upgrade al confirmarse—
     para que Liz no tenga que cerrar a mano lo que ya acabó. Javi, 28-sep. */
  window.addEventListener('message',function(ev){
    if(ev.origin!==location.origin) return;
    var d=ev.data||{};
    if(d && d.tipo==='apepe-cerrar') cierraOv();
  });

  cargar();
})();
</script>
</body></html>
