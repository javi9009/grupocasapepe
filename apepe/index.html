<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APePe · Hola, Pepe Huésped</title>
<meta name="description" content="Tu app de huésped de Casa Pepe: el mapa de la ciudad, tu check-in, tus experiencias.">

<meta name="theme-color" content="#1E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="APePe">

<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB;    --cielo:#8DC8EA;          --cielo-suave:#E4F1FA;
  --tinta:#1E1A16;   --tinta-2:#3C3630;        --gris:#6E665C;
  --tenue:#A9A096;   --linea:#E6DFD6;
  --papel:#FBF7F2;   --hueso:#F4EFE8;          --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
  --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:calc(160px + env(safe-area-inset-bottom))}
a{color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---- header ---- */
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
/* El saludo estaba dos veces: aquí arriba y otra vez abajo en un bloque suelto
   con el mismo logo y el mismo «How to be a Mexican». Se junta todo en la barra:
   a la izquierda quién eres y dónde estás, a la derecha de quién es la app. Una
   línea en blanco menos y una cosa sola en vez de dos. Javi, 28-sep. */
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:11px 16px}
.top .izq{flex:1;min-width:0}
.top .marca{height:38px;width:auto;flex:0 0 auto}
.top .bienv{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:17px;line-height:1.1}
.top .quien{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:15px;line-height:1.25;margin-top:1px}
.top .lema{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px;line-height:1.25;opacity:.75}
.top .dcha{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
/* Logo arriba y sede debajo, centrados entre sí: es un bloque, no dos cosas. */
.top .marcafila{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px}
.top .der{font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.08em;color:var(--cielo);text-transform:uppercase}
@media(max-width:380px){ .top .bienv{font-size:15px} .top .marca{height:32px} .top .in{gap:10px} }
.franja{height:8px;display:flex}
.franja i{flex:1}

/* ---- saludo ---- */
.hola{padding:18px 0 6px}
.hola h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:24px;line-height:1.05;margin:0}
.hola .baja{font-family:'Lobster Two',cursive;color:var(--magenta);font-size:19px;margin-top:2px}
.hola p{color:var(--gris);font-size:13.5px;margin:8px 0 0}

/* ---- mapa ---- */
.mapcard{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);overflow:hidden;margin:14px 0}
.mapcard .cab{display:flex;align-items:center;gap:8px;padding:12px 14px 0}
.mapcard .cab b{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:14px;letter-spacing:.03em}
.mapcard .cab .aq{margin-left:auto;border:0;background:var(--naranja);color:#fff;border-radius:999px;
  padding:8px 14px;font-family:'Inter';font-weight:700;font-size:12.5px;cursor:pointer}
.mapcard .cab .aq:hover{background:var(--naranja-oscuro)}
#mapa{height:230px;margin:12px 0 0}
.leaflet-container{font-family:Inter,sans-serif}
.mapcard .pie{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--linea);font-size:12.5px;color:var(--gris)}
.mapcard .pie a{color:var(--naranja);font-weight:700;text-decoration:none;margin-left:auto}

/* ---- bolitas ---- */
/* LA GALERÍA
   Tres tarjetas que se pasan con el dedo. Van a lo ancho y no en rejilla porque
   una foto pequeña no invita a nada: aquí la foto manda y la frase remata.
   `scroll-snap` es lo que hace que cada tarjeta se quede centrada sola al soltar,
   en vez de dejar media tarjeta asomando. */
.galeria{display:flex;gap:12px;margin-top:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;padding-bottom:4px;scrollbar-width:none}
.galeria::-webkit-scrollbar{display:none}
/* Los márgenes del wrap se compensan con padding para que la primera y la última
   tarjeta respiren igual que el resto de la pantalla. */
.galeria{margin-left:-16px;margin-right:-16px;padding-left:16px;padding-right:16px}
.gcard{flex:0 0 82%;max-width:330px;scroll-snap-align:center;position:relative;
  border-radius:var(--radio,16px);overflow:hidden;text-decoration:none;color:#fff;
  min-height:206px;display:flex;align-items:flex-end;box-shadow:var(--sombra);
  background:var(--tinta)}
.gcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* Sin foto todavía: el sticker de la casa sobre su color, para que se vea qué es
   y no un hueco gris. Cuando lleguen las fotos, esto no se usa. */
.gcard .sticker{position:absolute;right:8px;top:8px;width:92px;height:92px;object-fit:contain;
  opacity:.9;filter:drop-shadow(0 8px 18px rgba(0,0,0,.4))}
/* El velo. Sin él, la letra blanca se pierde en cuanto la foto tiene cielo. */
.gcard .velo{position:absolute;inset:0;background:linear-gradient(180deg,
  rgba(30,26,22,.05) 0%, rgba(30,26,22,.45) 45%, rgba(30,26,22,.88) 100%)}
.gcard .tx{position:relative;padding:14px 15px 15px}
.gcard .ti{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.03em;
  font-size:19px;line-height:1.05;text-shadow:0 2px 10px rgba(0,0,0,.45)}
.gcard .fr{display:block;font-size:13px;line-height:1.4;margin-top:5px;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.gcard .cta{display:inline-block;margin-top:9px;font-family:'Oswald',sans-serif;text-transform:uppercase;
  letter-spacing:.06em;font-size:11.5px;background:var(--naranja);color:#fff;padding:6px 12px;border-radius:999px}
.gcard:active{transform:scale(.99)}
@media(min-width:620px){ .gcard{flex-basis:46%} }
.seclab{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.09em;color:var(--gris);margin:18px 0 2px}
.bolitas{display:grid;grid-template-columns:repeat(4,1fr);gap:6px 4px;margin-top:8px}
/* [hidden] es display:none del navegador, pero display:grid de arriba le gana:
   el bloque de voluntario salía siempre aunque estuviera marcado hidden. */
[hidden]{display:none !important}
@media(max-width:360px){.bolitas{grid-template-columns:repeat(3,1fr)}}
.bola{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;color:var(--tinta);
  padding:10px 2px;border-radius:14px;position:relative}
.bola:active{background:var(--hueso)}
.bola .ic{width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:27px;background:var(--blanco);border:1px solid var(--linea);box-shadow:var(--sombra);overflow:hidden}
.bola .ic img{width:56px;height:56px;object-fit:contain;display:block}
.bola .tx{font-size:12px;font-weight:600;text-align:center;line-height:1.2}
.bola .badge{position:absolute;top:6px;right:calc(50% - 36px);background:var(--magenta);color:#fff;
  font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:999px}
.bola.guia .ic{background:linear-gradient(135deg,var(--magenta-suave),var(--cielo-suave));border-color:var(--magenta)}
/* Algunas bolitas llevan sticker de la casa en vez de emoji: dibujo nuestro,
   no el de la fuente del teléfono, que cambia en cada marca. */
.bola .ic img{width:48px;height:48px;object-fit:contain;display:block}
.bola.checkin .ic{background:var(--naranja-suave);border-color:var(--naranja)}
.bola.soon .ic{opacity:.55}
.bola.soon .tx{color:var(--tenue)}

/* ---- footer nav ---- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--blanco);
  border-top:1px solid var(--linea);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 24px -20px rgba(30,26,22,.5)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;
  color:var(--gris);font-size:10.5px;font-weight:600;padding:5px 0}
/* Algunas pestañas llevan sticker de la casa en vez de emoji. */
.tabbar a .ti{font-size:20px;line-height:1;height:22px;display:flex;align-items:center;justify-content:center}
/* El columnario en vez del emoji de moneda: es el logo de los Vnums. */
.tabbar a .ti .tiMon{width:21px;height:21px;display:block;filter:grayscale(1) contrast(1.15)}
.tabbar a.on .ti .tiMon,.tabbar a:hover .ti .tiMon{filter:none}
.tabbar a .ti img{height:24px;width:24px;object-fit:contain;display:block}
.tabbar a.soon{opacity:.55}
.tabbar a.on{color:var(--naranja)}
</style>
<script src="/apepe/resv.js"></script>
</head>
<body>

<header class="top">
  <div class="in">
    <!-- El logo manda a la izquierda, con la sede debajo. Antes iba a la derecha

    <div class="marcafila">

  <!-- Las tres puertas que hay que APETECER entrar. De bolita de 62px no se

<nav class="tabbar">

    <span class="ti"><img src="/img/apepe/stickers/hola-perrito.webp" alt=""></span>Inicio</a>
  <!-- La Diana baja aquí: el mapa ya vivía en la barra de abajo, así que tenerlo
       también de bolita era la misma puerta dos veces. Y de paso el icono deja de
       ser el emoji del teléfono —que cambia en cada marca— y pasa a ser el nuestro.
       Javi, 29-sep. -->
  <a href="/sinc/mapa.html"><span class="ti"><img src="/img/apepe/stickers/diana-reforma.webp" alt=""></span>Mapa</a>
  <a href="/apepe/vnums.html" id="tabVnum"><span class="ti"><img src="/img/apepe/vnum-moneda-128.webp" alt="" class="tiMon" onerror="this.replaceWith(document.createTextNode('\u{1FA99}'))"></span>Vnums</a>

<!-- Hola Pepe vive aquí y en ningún otro sitio: tenerlo también como bolita del
     mosaico era la misma puerta dos veces. El sombrero es quien es —un bocadillo
     genérico no dice con quién hablas—, y el nombre va debajo para que no haya
     que adivinarlo. -->
<a class="fab-chat" id="fabChat" href="/apepe/hola-pepe.html" title="Hola Pepe" aria-label="Hola Pepe"
   style="position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom,0));z-index:60;width:60px;text-decoration:none;display:flex;flex-direction:column;align-items:center;gap:4px">
  <span style="width:56px;height:56px;border-radius:50%;background:var(--naranja);color:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 10px 26px -6px rgba(30,26,22,.55)">🎩</span>
  <span style="font-family:'Oswald',sans-serif;font-weight:600;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--tinta);background:rgba(255,255,255,.92);border-radius:999px;padding:2px 7px;white-space:nowrap">Hola Pepe</span>
</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  /* Zonas para caer en algo del Centro si no dan ubicación (aleatorio como pidió Javi). */
  var ZONAS=[
    {n:'Centro',      lat:19.4338, lng:-99.1380},
    {n:'Alameda',     lat:19.4352, lng:-99.1440},
    {n:'Juárez',      lat:19.4270, lng:-99.1610},
    {n:'Roma',        lat:19.4180, lng:-99.1620}
  ];
  var MAP,CAPA,YO,PUNTOS=[];

  function arranca(){
    MAP=L.map('mapa',{scrollWheelZoom:false,zoomControl:true}).setView([19.4326,-99.1450],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(MAP);
    CAPA=L.layerGroup().addTo(MAP);
    /* arranca en una zona aleatoria del Centro; si el huésped da ubicación, saltamos ahí */
    var z=ZONAS[Math.floor(Math.random()*ZONAS.length)];
    centra(z.lat,z.lng,z.n,false);
    cargaPuntos();
    pedirUbic(true); /* intento silencioso al abrir */
  }
  function centra(lat,lng,etq,mio){
    if(YO){MAP.removeLayer(YO);YO=null;}
    YO=L.circleMarker([lat,lng],{radius:9,weight:3,color:'#fff',
      fillColor:mio?'#E2188E':'#1E1A16',fillOpacity:1}).addTo(MAP);
    YO.bindPopup(mio?'Estás aquí':esc(etq));
    MAP.setView([lat,lng], mio?15:14);
    $('mapinfo').textContent = mio ? 'Centrado donde estás.' : '';
  }
  function pedirUbic(silencio){
    if(!navigator.geolocation){ if(!silencio) $('mapinfo').textContent='Tu navegador no comparte ubicación.'; return; }
    if(!silencio) $('btnAqui').textContent='Buscándote…';
    navigator.geolocation.getCurrentPosition(function(p){
      $('btnAqui').textContent='📍 Estoy aquí';
      centra(p.coords.latitude,p.coords.longitude,'donde estás',true);
    },function(){
      $('btnAqui').textContent='📍 Estoy aquí';
      if(!silencio) $('mapinfo').textContent='No pudimos ubicarte — quizá el permiso está apagado.';
    },{enableHighAccuracy:true,timeout:9000,maximumAge:60000});
  }
  async function cargaPuntos(){
    try{
      var r=await fetch(SB+'/rest/v1/v_mapa_publico?select=nombre,lat,lng,tipologia,descripcion_breve,maps_url&order=orden',
        {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
      if(!r.ok) return;
      PUNTOS=await r.json();
      CAPA.clearLayers();
      PUNTOS.forEach(function(p){
        if(p.lat==null||p.lng==null) return;
        var m=L.marker([p.lat,p.lng],{icon:L.icon({
          iconUrl:'/sinc/img/mapa/'+p.tipologia+'.png',
          iconSize:[26,28],iconAnchor:[13,28],popupAnchor:[0,-24]})});
        m.bindPopup('<b>'+esc(p.nombre)+'</b>'+
          (p.descripcion_breve?'<br><i>'+esc(p.descripcion_breve)+'</i>':'')+
          (p.maps_url?'<br><a href="'+esc(p.maps_url)+'" target="_blank" rel="noopener">Cómo llegar</a>':''));
        m.addTo(CAPA);
      });
    }catch(e){/* el mapa sigue vivo aunque no carguen los puntos */}
  }
  $('btnAqui').onclick=function(){ pedirUbic(false); };

  /* Lleva el token de la reserva a check-in y upgrade */
  var _P=new URLSearchParams(location.search);
  var RESV=_P.get('resv')||'', SOL=_P.get('sol')||'';
  var qs=RESV?('?resv='+encodeURIComponent(RESV)):(SOL?('?sol='+encodeURIComponent(SOL)):'');
  /* Las experiencias son una sola pantalla para todos; se le pasa la reserva
     para que sepa volver aquí. */
  /* LAS TRES TARJETAS DE LA GALERÍA.
     Las fotos las pone Javi: en cuanto estén en /img/apepe/home/ basta con
     rellenar `foto` aquí abajo y ya. Mientras tanto cada tarjeta se pinta con su
     color y su sticker, que dice lo que es sin parecer un hueco. */
  var GALERIA=[
    { id:'promos', ruta:'/apepe/promos.html',
      titulo:'Promos',
      frase:'\u00bfSIM? \u00bfMuseos? Descubre qu\u00e9 descuentos tiene Casa Pepe para ti. Los buenos turistas ya no pagan de m\u00e1s.',
      cta:'Ver descuentos',
      foto:'/img/apepe/home/promos.webp', color:'#C9501A', sticker:'/img/apepe/stickers/mercado.webp' },
    { id:'go', ruta:'/apepe/challenge.html',
      titulo:'Casa Pepe GO!',
      frase:'\u00bfListo para encontrar los secretos de esta ciudad? \u00a1No dejes que se te escapen!',
      cta:'Salir a cazarlos',
      foto:'/img/apepe/home/go.webp', color:'#1D6B4A', sticker:'/img/apepe/stickers/bellas-artes.webp' },
    { id:'quiz', ruta:'/apepe/pepequiz.html',
      titulo:'PepeQuiz',
      frase:'Aprender tiene premio. Reta a otros viajeros y gana el premio del d\u00eda. \u00bfQu\u00e9 tan mexicano eres ya?',
      cta:'Jugar ahora',
      foto:'', color:'#5B2E86', sticker:'/img/apepe/stickers/frida-bicicleta-a.webp' }
  ];
  function pintaGaleria(q){
    var g=$('galeria'); if(!g) return;
    g.innerHTML=GALERIA.map(function(c){
      var fondo = c.foto
        ? '<img src="'+c.foto+'" alt="" loading="lazy">'
        : '<img class="sticker" src="'+c.sticker+'" alt="" loading="lazy">';
      return '<a class="gcard" id="g-'+c.id+'" href="'+c.ruta+(q||'')+'"'+
             (c.foto?'':' style="background:'+c.color+'"')+'>'+
        fondo+'<span class="velo"></span>'+
        '<span class="tx"><span class="ti">'+c.titulo+'</span>'+
        '<span class="fr">'+c.frase+'</span>'+
        '<span class="cta">'+c.cta+'</span></span></a>';
    }).join('');
  }

  if($('bExp')) $('bExp').href='/apepe/experiencias.html'+qs;
  if($('bWel')) $('bWel').href='/apepe/welcome.html'+qs;
  if($('bTienda')) $('bTienda').href='/apepe/tienda.html'+qs;
  pintaGaleria(qs);
  if($('fabChat')) $('fabChat').href='/apepe/hola-pepe.html'+qs;
  if($('tabYo')) $('tabYo').href='/apepe/yo.html'+qs;
  /* Aquí ya no va el upgrade: el upgrade es antes de entrar a la habitación y
     quien abre la app ya está en la casa. Vive donde tiene sentido, al terminar el
     check-in. Lo que sí puede hacer desde dentro es quedarse más. Javi, 28-sep. */
  if($('bExt')){
    if(RESV){ $('bExt').href='/apepe/extender.html?resv='+encodeURIComponent(RESV); }
    else { $('bExt').addEventListener('click',function(ev){ ev.preventDefault();
      /* El aviso vivía arriba, junto al mapa, y quien toca el botón está abajo
         en el mosaico: escribía el mensaje donde nadie lo veía y parecía que el
         botón estaba roto. Ahora te lleva hasta él. Javi, 28-sep. */
      $('mapinfo').textContent='Para ver si puedes quedarte más necesitamos saber cuál es tu reserva: entra con la liga que te mandamos por correo o WhatsApp.';
      $('mapinfo').scrollIntoView({behavior:'smooth',block:'center'});
    }); }
  }

  /* Bolitas "próximamente": avisan y no navegan */
  document.querySelectorAll('[data-soon]').forEach(function(a){
    a.addEventListener('click',function(ev){ ev.preventDefault();
      $('mapinfo').textContent='Ese módulo llega pronto a APePe.'; });
  });
  /* La billetera va con la liga de la reserva: es lo que dice de quién son
     las cartas. */
  if($('tabVnum')) $('tabVnum').href='/apepe/vnums.html'+qs;

  arranca();
})();
</script>
<script src="/apepe/notis.js"></script>
</body>
</html>
