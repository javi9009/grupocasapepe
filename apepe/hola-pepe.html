<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hola Pepe · Don José</title>
<meta name="description" content="Don José, el conserje de Casa Pepe, te ayuda con cualquier duda de tu estancia.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Hola Pepe">
<link rel="icon" href="/img/casapepe/casapepe_isotipo_color.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A;
  --magenta:#E2188E; --rosa:#F8BBCB; --cielo:#8DC8EA;
  --tinta:#1E1A16; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;
  display:flex;flex-direction:column;min-height:100dvh}
a{color:inherit}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0)) 16px;padding-bottom:12px}
.top a.back{color:#fff;text-decoration:none;font-size:22px;line-height:1;opacity:.9}
.top .av{width:40px;height:40px;border-radius:50%;background:var(--naranja);display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:18px;line-height:1.05}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px;margin-top:1px}
.chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:86%;padding:10px 13px;border-radius:16px;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word}
.msg.dj{align-self:flex-start;background:var(--blanco);border:1px solid var(--linea);border-bottom-left-radius:5px;box-shadow:var(--sombra)}
.msg.yo{align-self:flex-end;background:var(--naranja);color:#fff;border-bottom-right-radius:5px}
.msg b{font-weight:700}
.hint{align-self:flex-start;color:var(--tenue);font-size:12px;padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 4px}
.chip{border:1px solid var(--linea);background:var(--hueso);color:var(--tinta);border-radius:999px;
  padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter'}
.chip:active{background:var(--naranja-suave,#FDE7DC)}
.typing{align-self:flex-start;color:var(--gris);font-size:13px;font-style:italic;padding:2px 4px}
.barra{border-top:1px solid var(--linea);background:var(--blanco);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0));
  display:flex;gap:8px;align-items:flex-end;position:sticky;bottom:0}
.barra textarea{flex:1;resize:none;border:1px solid var(--linea);border-radius:18px;padding:10px 14px;font:inherit;
  font-size:15px;max-height:120px;background:var(--papel);color:var(--tinta)}
.barra textarea:focus{outline:none;border-color:var(--naranja)}
.barra button{border:0;background:var(--naranja);color:#fff;width:44px;height:44px;border-radius:50%;font-size:19px;cursor:pointer;flex:none}
.barra button:disabled{opacity:.45}
.pie{text-align:center;color:var(--tenue);font-size:11px;padding:0 16px 6px}
</style>
</head>
<body>
<header class="top">
  <a class="back" id="back" href="/apepe/" aria-label="Volver">←</a>
  <div class="av">🎩</div>
  <div>
    <div class="nom">Don José</div>
    <div class="sub">tu conserje en Casa Pepe</div>
  </div>
</header>

<main class="chat" id="chat"></main>

<div class="chips" id="chips"></div>

<form class="barra" id="form" autocomplete="off">
  <textarea id="in" rows="1" placeholder="Escríbele a Don José…" enterkeyhint="send"></textarea>
  <button type="submit" id="send" aria-label="Enviar">➤</button>
</form>
<div class="pie">Don José te orienta; para cambios en tu reserva, recepción confirma.</div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var P=new URLSearchParams(location.search);
var TOKEN=P.get('resv')||P.get('sol')||'';
try{ if(!TOKEN){ TOKEN=localStorage.getItem('cpp_resv')||''; } else { localStorage.setItem('cpp_resv',TOKEN); } }catch(e){}
// el botón de volver conserva el token
try{ var b=document.getElementById('back'); b.href='/apepe/'+(TOKEN?('?resv='+encodeURIComponent(TOKEN)):''); }catch(e){}

var MSGS=[]; // {role:'user'|'assistant', content}
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
// markdown mínimo: **negrita** y saltos de línea (ya vienen como \n en white-space:pre-wrap)
function fmt(s){ return esc(s).replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>'); }

function burbuja(role,texto){
  var d=document.createElement('div');
  d.className='msg '+(role==='user'?'yo':'dj');
  d.innerHTML=fmt(texto);
  $('chat').appendChild(d);
  $('chat').scrollTop=$('chat').scrollHeight;
  return d;
}

// Bienvenida (no cuenta para el historial que se manda a la IA)
burbuja('assistant','¡Qué gusto tenerte por aquí! Soy Don José, el conserje de la casa. Pregúntame lo que necesites de tu estancia: cómo llegar, horarios, qué hacer en la ciudad, o cualquier duda con tu reserva. 🎩');

var CHIPS=[
  '¿Cómo llego del aeropuerto?',
  'Horarios de la casa',
  '¿Qué hago hoy?',
  'Ver mi reserva'
];
(function(){
  var c=$('chips');
  CHIPS.forEach(function(t){
    var b=document.createElement('button'); b.className='chip'; b.type='button'; b.textContent=t;
    b.onclick=function(){ $('in').value=t; enviar(); };
    c.appendChild(b);
  });
})();

var esperando=false, typingEl=null;
function typingOn(){ typingEl=document.createElement('div'); typingEl.className='typing'; typingEl.textContent='Don José está escribiendo…'; $('chat').appendChild(typingEl); $('chat').scrollTop=$('chat').scrollHeight; }
function typingOff(){ if(typingEl&&typingEl.parentNode){ typingEl.parentNode.removeChild(typingEl); } typingEl=null; }

function enviar(){
  if(esperando) return;
  var txt=($('in').value||'').trim();
  if(!txt) return;
  $('in').value=''; $('in').style.height='auto';
  $('chips').style.display='none';
  burbuja('user',txt);
  MSGS.push({role:'user',content:txt});
  esperando=true; $('send').disabled=true; typingOn();
  fetch(SB+'/functions/v1/apepe-donjose',{method:'POST',
    headers:{apikey:KEY,'Content-Type':'application/json'},
    body:JSON.stringify({token:TOKEN,mensajes:MSGS})})
  .then(function(r){ return r.json(); })
  .then(function(j){
    typingOff();
    var resp=(j&&j.ok&&j.respuesta)?j.respuesta:'Perdona, se me cruzaron los cables. Inténtalo de nuevo en un momento, o pásate a recepción — el lobby está abierto 24h.';
    burbuja('assistant',resp);
    if(j&&j.ok&&j.respuesta) MSGS.push({role:'assistant',content:j.respuesta});
  })
  .catch(function(){
    typingOff();
    burbuja('assistant','No pude conectarme ahorita. Revisa tu internet e inténtalo otra vez; si es urgente, recepción está en el lobby las 24h.');
  })
  .then(function(){ esperando=false; $('send').disabled=false; $('in').focus(); });
}

$('form').addEventListener('submit',function(e){ e.preventDefault(); enviar(); });
// enter envía, shift+enter salto de línea; textarea que crece
var ta=$('in');
ta.addEventListener('input',function(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px'; });
ta.addEventListener('keydown',function(e){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); enviar(); } });
</script>
</body>
</html>
