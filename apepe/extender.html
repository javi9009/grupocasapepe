<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quédate más · Casa Pepe</title>
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<style>
:root{--ground:#F4F1EA;--surface:#fff;--ink:#241c14;--muted:#6B6459;--faint:#A49B8C;--rule:#E2DCCF;--rule-2:#D2C8B6;--green:#137A56;--soft:#DCEFE6;--warn:#8C6212;--warn-bg:#F3EAD6;--ok:#1D6B4A;--ok-bg:#E1F0E7;--naranja:#C9501A}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:Inter,system-ui,-apple-system,Arial,sans-serif;line-height:1.55;min-height:100vh;padding:22px 16px 48px}
.wrap{width:100%;max-width:460px;margin:0 auto}
.barra{display:flex;align-items:flex-start;gap:12px;margin-bottom:10px}
.volver{background:none;border:0;color:var(--muted);font:inherit;font-weight:700;font-size:22px;line-height:1;cursor:pointer;padding:6px 8px 6px 0;flex:0 0 auto}
.head{flex:1;min-width:0;text-align:left}
.head .k{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--green);font-weight:700}
.head h1{font-size:25px;margin:4px 0 2px}
.head .s{color:var(--muted);font-size:13.5px}

/* Dónde duerme ahora: lo primero, porque toda la pantalla se lee en relación a eso. */
.tuya{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:13px 15px;margin-bottom:14px;
  display:flex;align-items:center;gap:12px}
.tuya .cama{font-family:'Oswald',sans-serif;font-weight:700;font-size:20px;letter-spacing:.02em;flex:0 0 auto;
  background:var(--soft);color:var(--green);border-radius:10px;padding:7px 11px;line-height:1}
.tuya .t{flex:1;min-width:0}
.tuya .t b{display:block;font-size:13.5px}
.tuya .t span{font-size:12.5px;color:var(--muted)}

.seclab{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700;margin:20px 0 9px}

/* Las noches: pastillas, que es como se elige "cuántas" sin pensarlo. */
.noches{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.nb{flex:0 0 auto;border:1.5px solid var(--rule);background:var(--surface);border-radius:14px;padding:10px 14px;
  cursor:pointer;font:inherit;text-align:center;min-width:84px}
.nb b{display:block;font-size:17px;font-weight:800;line-height:1.1}
.nb span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
.nb[aria-pressed="true"]{border-color:var(--green);background:#F4FAF7;box-shadow:0 0 0 2px var(--soft)}
.nb[aria-pressed="true"] b{color:var(--green)}

/* Cada sitio donde puede dormir. La primera es la que no le mueve nada. */
.alt{background:var(--surface);border:1.5px solid var(--rule);border-radius:16px;padding:13px 15px;margin-bottom:10px;
  cursor:pointer;display:flex;align-items:flex-start;gap:12px;width:100%;font:inherit;text-align:left}
.alt[aria-pressed="true"]{border-color:var(--green);box-shadow:0 0 0 2px var(--soft)}
.alt.mejor{border-color:var(--green)}
.alt .ic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:17px}
.alt.mueve .ic{background:var(--warn-bg);color:var(--warn)}
.alt .c{flex:1;min-width:0}
.alt .nm{font-weight:700;font-size:14.5px;display:block}
.alt .de{display:block;font-size:12.5px;color:var(--muted);margin-top:1px;word-break:break-word}
.alt .av{display:block;font-size:11.5px;color:var(--warn);margin-top:4px}
.mudanza{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 13px;font-size:12.5px;margin:2px 0 12px;line-height:1.45}
.alt .pr{flex:0 0 auto;text-align:right}
.alt .pr b{display:block;font-size:17px;font-weight:800}
.alt .pr s{display:block;font-size:11.5px;color:var(--faint)}
.alt .pr em{display:block;font-size:11px;color:var(--green);font-style:normal;font-weight:700}
.tagm{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;
  background:var(--soft);color:var(--green);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:1px}

.resumen{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin-top:16px}
.resumen .r{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0}
.resumen .r span{color:var(--muted)}
.resumen .r b{text-align:right}
.resumen .tot{border-top:1px solid var(--rule);margin-top:6px;padding-top:9px}
.resumen .tot b{font-size:19px}
.btn{border:0;border-radius:12px;background:var(--green);color:#fff;font:inherit;font-weight:800;padding:13px 18px;cursor:pointer;width:100%;font-size:16px;margin-top:12px}
.btn:active{filter:brightness(.94)} .btn[disabled]{opacity:.5;cursor:default}
.btn.ghost{background:#EFEAE0;color:var(--ink)}
.msg{margin-top:12px;border-radius:12px;padding:12px 14px;font-size:13.5px;display:none;line-height:1.5}
.msg.on{display:block}
.msg.ok{background:var(--ok-bg);color:var(--ok)} .msg.warn{background:var(--warn-bg);color:var(--warn)}
.empty{background:#FBF8F1;border:1px dashed var(--rule-2);border-radius:16px;padding:26px 18px;color:var(--muted);text-align:center;font-size:14px}
.foot{margin-top:16px;text-align:center;color:var(--muted);font-size:12px}
.vermas{background:none;border:0;color:var(--green);font:inherit;font-size:13px;font-weight:700;
  cursor:pointer;padding:6px 0;width:100%;text-align:center}
.hide{display:none}
</style>
<script src="/apepe/resv.js"></script>
</head>
<body><div class="wrap">
  <div class="barra">
    <button class="volver" id="volver" type="button" aria-label="Volver">←</button>
    <div class="head">
      <div class="k">Casa Pepe</div>
      <h1>¿Te quedas más?</h1>
      <div class="s" id="sub">Vemos si puedes quedarte sin cambiarte de cama.</div>
    </div>
  </div>

  <div id="cont"><div class="empty">Viendo qué hay libre…</div></div>

  <div class="foot">Mi Casa Pepe es tu Casa
    <img src="/img/casapepe/casapepe_isotipo_color.png" alt="Casa Pepe"
      style="height:17px;width:auto;vertical-align:-4px;margin-left:3px"
      onerror="this.style.display='none'"></div>
</div>

<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co', KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var q=new URLSearchParams(location.search);
  var RESV=q.get('resv')||'', RID=q.get('rid')||'', PROP=(q.get('prop')||'cdmx').toLowerCase();
  var DATOS=null, NOCHES=1, ALT=null, TODAS=false;

  var $=function(i){ return document.getElementById(i); };
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function money(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }
  function fecha(s){ if(!s) return '—'; var p=String(s).split('-'); return p.length===3?(p[2]+'/'+p[1]):s; }
  function base(extra){ var o=extra||{}; if(RESV) o.resv=RESV; else { o.reservation_id=RID; o.prop=PROP; } return o; }
  function api(body){
    return fetch(SB+'/functions/v1/apepe-extender',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){ return r.json(); });
  }

  $('volver').onclick=function(){
    var qs = window.apepeResv ? window.apepeResv.qs() : (RESV?('?resv='+encodeURIComponent(RESV)):'');
    location.href='/apepe/'+qs;
  };

  /* Un icono por tipo de sitio. El de la maleta es el aviso de que hay mudanza,
     y va antes que el precio a propósito: eso es lo que de verdad decide. */
  var ICO={ misma_cama:'🛏️', misma_cama_moviendo:'🛏️', mismo_dorm:'🧳', otro_dorm:'🧳', privada:'🚪' };

  function pinta(){
    var c=$('cont');
    if(!DATOS || !DATOS.ok){ c.innerHTML='<div class="empty">No pudimos ver tus opciones ahora. Pregúntanos en recepción.</div>'; return; }

    var r=DATOS.reserva||{}, cu=r.cuarto||{};
    var esc1='<div class="tuya">'+
      (cu.unidad_nombre?'<div class="cama">'+esc(cu.unidad_nombre)+'</div>':'')+
      '<div class="t"><b>'+esc(cu.tipo_nombre||'Tu habitación')+'</b>'+
      '<span>'+(cu.nivel?('Cama '+esc(cu.nivel)+' · '):'')+'Sales el '+fecha(r.salida)+'</span></div></div>';

    var esc_=DATOS.escalera||[];
    if(!esc_.length){
      c.innerHTML=esc1+'<div class="empty">'+esc(DATOS.mensaje||'Ahora mismo no podemos extender tu estancia.')+'</div>';
      return;
    }

    var fila=esc_.find(function(e){ return e.noches===NOCHES; })||esc_[0];
    NOCHES=fila.noches;
    /* La clave la pone el servidor y es unica por alternativa. Con solo el tipo, las
       tres de "otro dormitorio" se marcaban las tres a la vez y al apartar salia otra
       distinta de la que habia elegido. Javi, 28-sep. */
    function claveDe(a){ return a.clave||a.tipo; }
    if(!ALT || !fila.alternativas.some(function(a){ return claveDe(a)===ALT; })) ALT=claveDe(fila.mejor);

    var pastillas=esc_.map(function(e){
      return '<button class="nb" data-n="'+e.noches+'" aria-pressed="'+(e.noches===NOCHES)+'">'+
        '<b>+'+e.noches+'</b><span>'+(e.noches===1?'noche':'noches')+'</span></button>';
    }).join('');

    /* Ocho opciones de golpe son una lista, no una decision. Se ensenan las tres
       primeras —que ya traen su cama y lo mas barato— y el resto bajo un boton. Si
       tiene elegida una de las de abajo, se abren solas para que la vea. */
    var TOPE=3;
    var iEleg=0; fila.alternativas.forEach(function(a,i){ if(claveDe(a)===ALT) iEleg=i; });
    var abrir = TODAS || iEleg>=TOPE;
    var visibles = abrir ? fila.alternativas : fila.alternativas.slice(0,TOPE);

    var alts=visibles.map(function(a,i){
      var ahorro=a.sin-a.precio, k=claveDe(a);
      return '<button class="alt'+(a.mueve_cosas?' mueve':'')+'" data-a="'+esc(k)+'" aria-pressed="'+(k===ALT)+'">'+
        '<span class="ic">'+(ICO[a.tipo]||'🛏️')+'</span>'+
        '<span class="c"><span class="nm">'+esc(a.etiqueta)+
          (a.tipo==='misma_cama'?'<span class="tagm">sin mudarte</span>':'')+'</span>'+
          '<span class="de">'+esc(a.detalle||'')+'</span>'+
          (a.mueve_cosas?'<span class="av">🧳 Te mudas de cama</span>':'')+
        '</span>'+
        '<span class="pr"><b>'+money(a.precio)+'</b>'+
          (ahorro>0?('<s>'+money(a.sin)+'</s><em>−'+money(ahorro)+'</em>'):'')+
        '</span></button>';
    }).join('');
    if(fila.alternativas.length>TOPE) alts+='<button class="vermas" id="bMas">'+
      (abrir?'Ver menos':'Ver las otras '+(fila.alternativas.length-TOPE)+' opciones ▾')+'</button>';

    var eleg=fila.alternativas.find(function(a){ return claveDe(a)===ALT; })||fila.mejor;

    c.innerHTML = esc1 +
      '<div class="seclab">¿Cuántas noches más?</div><div class="noches">'+pastillas+'</div>'+
      '<div class="seclab">¿Dónde duermes?</div>'+alts+
      (eleg.mueve_cosas?('<div class="mudanza">🧳 '+esc(DATOS.aviso_mudanza||'')+'</div>'):'')+
      '<div class="resumen">'+
        '<div class="r"><span>Nueva salida</span><b>'+fecha(fila.hasta)+'</b></div>'+
        '<div class="r"><span>Noches</span><b>'+fila.noches+'</b></div>'+
        '<div class="r"><span>Dónde</span><b>'+esc(eleg.etiqueta)+'</b></div>'+
        '<div class="r"><span>&nbsp;</span><b style="font-weight:400;color:var(--muted);font-size:12.5px">'+esc(eleg.detalle||'')+'</b></div>'+
        '<div class="r tot"><span>Total con SuperPepe</span><b>'+money(eleg.precio)+'</b></div>'+
        '<button class="btn" id="bPedir">Quiero quedarme</button>'+
        '<div class="msg" id="m"></div>'+
      '</div>';

    Array.prototype.forEach.call(c.querySelectorAll('[data-n]'),function(b){
      b.onclick=function(){ NOCHES=+b.getAttribute('data-n'); pinta(); };
    });
    Array.prototype.forEach.call(c.querySelectorAll('[data-a]'),function(b){
      b.onclick=function(){ ALT=b.getAttribute('data-a'); pinta(); };
    });
    var bm=$('bMas'); if(bm) bm.onclick=function(){ TODAS=!abrir; pinta(); };
    $('bPedir').onclick=function(){ pedir(this, fila, eleg); };
  }

  function pedir(btn, fila, eleg){
    var m=$('m');
    /* Se le dice ANTES lo que va a pasar con sus cosas: enterarse después de dar
       el botón es enterarse tarde. */
    var aviso = eleg.mueve_cosas
      ? '\n\nTe cambiamos a: '+eleg.detalle+'\n'+(DATOS.aviso_mudanza||'')
      : '';
    if(!confirm('Te quedas '+fila.noches+' noche'+(fila.noches>1?'s':'')+' más, hasta el '+fecha(fila.hasta)+'.\n'+
        'Son '+money(eleg.precio)+', que se pagan en recepción.'+aviso+'\n\n¿Lo aparto?')) return;
    btn.disabled=true; var old=btn.textContent; btn.textContent='Apartando…';
    m.className='msg'; m.innerHTML='';
    api(base({op:'pedir', noches:fila.noches, alternativa:(eleg.clave||eleg.tipo)})).then(function(r){
      btn.disabled=false; btn.textContent=old;
      if(r&&r.ok){
        m.className='msg on ok';
        m.innerHTML='🎉 '+esc(r.mensaje||'Listo.')+
          (r.recepcion_mueve?'<br><br>Estamos cuadrando tu cama con recepción; te confirmamos.':'');
        btn.classList.add('hide');
      } else {
        m.className='msg on warn';
        m.textContent=(r&&(r.mensaje||r.error))||'No pudimos apartarla. Pregúntanos en recepción.';
        /* Si se la quitaron mientras decidía, hay que releer: lo que tiene en
           pantalla ya no es verdad. */
        if(r&&r.escalera){ DATOS.escalera=r.escalera; ALT=null; setTimeout(pinta,1400); }
      }
    }).catch(function(){
      btn.disabled=false; btn.textContent=old;
      m.className='msg on warn'; m.textContent='Error de conexión. Inténtalo otra vez.';
    });
  }

  if(!RESV && !RID){
    $('cont').innerHTML='<div class="empty">Para ver si puedes quedarte necesitamos saber cuál es tu reserva: entra con la liga que te mandamos por correo o WhatsApp.</div>';
  } else {
    api(base({})).then(function(r){
      DATOS=r;
      if(r&&r.ok&&r.ventana&&!r.ventana.abierta){
        var cu=(r.reserva||{}).cuarto||{};
        $('sub').textContent='';
        $('cont').innerHTML='<div class="empty">'+esc(r.mensaje||'')+'</div>';
        return;
      }
      if(r&&r.ok&&r.mensaje) $('sub').textContent=r.mensaje;
      pinta();
    }).catch(function(){
      $('cont').innerHTML='<div class="empty">No pudimos ver tus opciones. Pregúntanos en recepción.</div>';
    });
  }
})();
</script>
</body></html>
