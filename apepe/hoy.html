<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hoy · Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!--
  HOY — la agenda del día.

  Javi, 26-oct-2026, con el rediseño. La pestaña de experiencias llevaba al
  catálogo de Sincrético, que contesta «qué vendemos»: 33 fichas, todas a la
  vez, ordenadas por lo que nos interesa enseñar. El huésped que abre la app a
  las cuatro de la tarde no está preguntando eso. Está preguntando QUÉ SALE
  HOY Y SI TODAVÍA CABE.

  Por eso aquí la fila no es la experiencia, es la salida: un tour que sale
  tres veces hoy son tres renglones, cada uno con su hora y su cupo. Y lo que
  ya salió no se enseña, que sólo sirve para dar rabia.

  El catálogo sigue existiendo y es a donde lleva «Explorar todo»: son dos
  preguntas distintas y cada una tiene su pantalla.
-->
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --rosa:#F8BBCB; --cielo:#5B93C2; --cielo-suave:#E4F1FA;
  --verde:#6F9A63; --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra-sm:0 1px 2px rgba(30,26,22,.05),0 8px 20px -16px rgba(30,26,22,.4);
}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--hueso);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;
  font-size:15px;line-height:1.5;min-height:100dvh;
  padding-bottom:calc(116px + env(safe-area-inset-bottom,0px))}
img{max-width:100%}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* cabecera */
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:30}
.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:11px;padding:11px 16px}
.top .marca{height:34px;width:auto}
.top .ti{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:17px;line-height:1}
.top .le{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:13px;margin-top:1px}
.franja{height:6px;display:flex}.franja i{flex:1}

h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;
  font-size:26px;letter-spacing:.015em;margin:16px 0 2px;line-height:1.05}
.sub{color:var(--gris);font-size:13.5px}

/* los días y los filtros */
.tiras{display:flex;gap:7px;margin-top:12px;overflow-x:auto;scrollbar-width:none;
  margin-left:-16px;margin-right:-16px;padding:0 16px}
.tiras::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--linea);background:var(--blanco);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:12.5px;font-weight:700;color:var(--tinta);cursor:pointer;
  white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}
.tiras.fam .chip[aria-pressed="true"]{background:var(--naranja);border-color:var(--naranja)}

/* la agenda */
.hora{display:flex;align-items:center;gap:10px;margin:22px 0 8px}
.hora b{font-family:'Oswald',sans-serif;font-size:20px;font-weight:700;letter-spacing:.02em}
.hora i{flex:1;height:1px;background:var(--linea)}
.sal{display:flex;gap:12px;text-decoration:none;color:var(--tinta);background:var(--blanco);
  border-radius:18px;padding:10px;margin-bottom:8px;box-shadow:var(--sombra-sm)}
.sal .fo{width:76px;height:76px;flex:none;border-radius:13px;overflow:hidden;background:var(--linea)}
.sal .fo img{width:100%;height:100%;object-fit:cover;display:block}
.sal .cu{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center}
.sal .nm{font-size:15px;font-weight:700;line-height:1.2}
.sal .me{color:var(--gris);font-size:12.5px;margin-top:3px}
.sal .ab{display:flex;align-items:baseline;gap:8px;margin-top:5px;flex-wrap:wrap}
.sal .pr{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px}
.sal .pr.gratis{color:var(--ok)}
.sal .qd{font-size:11.5px;font-weight:700;color:var(--alerta);background:var(--alerta-bg);
  border-radius:999px;padding:2px 8px}
.pill{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;
  text-transform:uppercase;border-radius:6px;padding:2px 6px;color:#fff}

/* vacío, carga y el pie */
.vacio{background:var(--blanco);border-radius:18px;padding:22px 18px;text-align:center;
  color:var(--gris);font-size:14px;line-height:1.55;margin-top:14px;box-shadow:var(--sombra-sm)}
.vacio b{display:block;color:var(--tinta);font-size:16px;margin-bottom:6px}
.explora{display:flex;align-items:center;gap:10px;text-decoration:none;margin-top:18px;
  background:var(--tinta);color:#F6F1E9;border-radius:20px;padding:14px 16px}
.explora .tx{min-width:0}
.explora .tx b{display:block;font-size:15px}
.explora .tx small{display:block;color:var(--tenue);font-size:12px;margin-top:2px}
.explora .fl{margin-left:auto;font-size:18px}
.fab-mapa{position:fixed;right:16px;bottom:calc(112px + env(safe-area-inset-bottom,0px));
  z-index:58;background:var(--blanco);color:var(--tinta);border-radius:999px;
  padding:11px 16px;text-decoration:none;font-size:13px;font-weight:700;
  box-shadow:0 10px 24px -8px rgba(30,26,22,.45);display:flex;align-items:center;gap:7px}
.fab-mapa svg{width:17px;height:17px}
</style>
</head>
<body>

<header class="top">
  <div class="in">
    <img class="marca" data-marca-logo="blanco" src="/img/casapepe/casapepe_blanco.png" alt="Casa Pepe">
    <div>
      <div class="ti" data-i18n>Hoy</div>
      <div class="le">How to be a Mexican?</div>
    </div>
  </div>
  <div class="franja">
    <i style="background:var(--naranja)"></i><i style="background:var(--magenta)"></i>
    <i style="background:var(--rosa)"></i><i style="background:var(--cielo)"></i>
  </div>
</header>

<div class="wrap">
  <h1 id="tit" data-i18n>Qué hacemos hoy</h1>
  <div class="sub" id="sub" data-i18n>Buscando lo que sale…</div>

  <div class="tiras" id="dias">
    <button class="chip" data-d="0" aria-pressed="true" data-i18n>Hoy</button>
    <button class="chip" data-d="1" aria-pressed="false" data-i18n>Mañana</button>
    <button class="chip" data-d="fin" aria-pressed="false" data-i18n>El fin de semana</button>
    <button class="chip" data-d="todo" aria-pressed="false" data-i18n>Los próximos días</button>
  </div>

  <div class="tiras fam" id="fams"></div>

  <div id="lista"></div>

  <a class="explora" href="/sinc/index.html?app=1" id="bExplora">
    <span class="tx">
      <b data-i18n>Explorar todo</b>
      <small data-i18n>El catálogo entero, con fechas de otros días</small>
    </span>
    <span class="fl">→</span>
  </a>
</div>

<a class="fab-mapa" id="bMapa" href="/sinc/mapa.html?app=1">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s6.3-5.7 6.3-10.3A6.3 6.3 0 0 0 5.7 10.7C5.7 15.3 12 21 12 21Z"/><circle cx="12" cy="10.5" r="2.3"/>
  </svg>
  <span data-i18n>Mapa</span>
</a>

<script src="/apepe/resv.js"></script>
<script src="/apepe/marca.js"></script>
<script src="/apepe/idioma.js"></script>
<script src="/cp-muertos.js"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  function $(id){return document.getElementById(id);}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function T(f){ try{ return window.apepeT?window.apepeT(f):f; }catch(_){ return f; } }
  function qs(){ try{ return window.apepeResv?window.apepeResv.qs():''; }catch(_){ return ''; } }

  /* La ciudad del huésped: si duerme en Puebla no se le enseñan los tours de
     CDMX, que están a dos horas de carretera. Sin reserva no se filtra. */
  var SEDE=''; try{ SEDE=(window.apepeResv&&window.apepeResv.sede&&window.apepeResv.sede())||''; }catch(_){}
  var CIUDAD = SEDE==='puebla' ? 'Puebla' : (SEDE==='cdmx' ? 'CDMX' : null);

  /* Los colores de cada familia son los del rediseño, y sirven para algo:
     a un golpe de vista se distingue un tour de una fiesta. */
  var COLOR={tours:'#F2682A', fiesta:'#E2188E', eventos:'#E2188E',
             cultura:'#5B93C2', arte:'#5B93C2', talleres:'#6F9A63'};
  function colorDe(sl){ sl=String(sl||'').toLowerCase();
    for(var k in COLOR){ if(sl.indexOf(k)>=0) return COLOR[k]; } return '#6E665C'; }
  /* LA ETIQUETA SALE DEL SLUG, NO DEL TEXTO HEREDADO.
     Hay fichas donde `categoria` dice «Cultural» y `categoria_slug` dice
     «tours»: son dos campos que se escribieron en momentos distintos y ya no
     coinciden. El slug es el que manda hoy -con el deciden el tope de
     personas, el minimo de precio y los filtros-, asi que es el que se enseña:
     si no, sale una etiqueta naranja de tour con la palabra Cultural dentro. */
  function etiqueta(s){
    var sl=String(s.categoria_slug||'').trim();
    if(!sl) return String(s.categoria||'');
    return sl.charAt(0).toUpperCase()+sl.slice(1);
  }

  var TODO=[], FILTRO='', DIA='0';

  function hoyMx(){
    var d=new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));
    return new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate(),12));
  }
  function iso(d){ return d.toISOString().slice(0,10); }

  /* Qué fechas entran en cada pestaña de día. «El fin de semana» es el sábado y
     el domingo que vienen, aunque hoy sea martes: es como lo pregunta la gente. */
  function fechasDe(sel){
    var h=hoyMx();
    if(sel==='0')  return [iso(h)];
    if(sel==='1'){ var m=new Date(h); m.setUTCDate(m.getUTCDate()+1); return [iso(m)]; }
    if(sel==='fin'){
      var out=[], d=new Date(h);
      for(var i=0;i<8;i++){ var x=new Date(d); x.setUTCDate(x.getUTCDate()+i);
        var w=x.getUTCDay(); if(w===6||w===0) out.push(iso(x)); }
      return out;
    }
    return null;   /* todo lo que haya */
  }

  function money(n){ n=Number(n||0); return '$'+n.toLocaleString('es-MX'); }
  var DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
  function bonita(f){
    var p=String(f).split('-'); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],12));
    return T(DIAS[d.getUTCDay()])+' '+d.getUTCDate()+' '+T(MESES[d.getUTCMonth()]);
  }

  function pintaFamilias(){
    var vistos={}, orden=[];
    TODO.forEach(function(s){ var k=String(s.categoria_slug||'otras').toLowerCase();
      if(!vistos[k]){ vistos[k]=s.categoria||k; orden.push(k); } });
    if(orden.length<2){ $('fams').innerHTML=''; return; }
    $('fams').innerHTML='<button class="chip" data-f="" aria-pressed="'+(FILTRO?'false':'true')+'">'+T('Todo')+'</button>'+
      orden.map(function(k){
        return '<button class="chip" data-f="'+esc(k)+'" aria-pressed="'+(FILTRO===k?'true':'false')+'">'+
          esc(vistos[k])+'</button>';}).join('');
    Array.prototype.forEach.call($('fams').querySelectorAll('.chip'),function(b){
      b.onclick=function(){ FILTRO=b.getAttribute('data-f')||''; pinta(); };
    });
  }

  function pinta(){
    var fechas=fechasDe(DIA);
    var v=TODO.filter(function(s){
      if(fechas && fechas.indexOf(s.fecha)<0) return false;
      if(FILTRO && String(s.categoria_slug||'').toLowerCase()!==FILTRO) return false;
      return true;
    });

    $('sub').textContent = v.length
      ? (v.length===1 ? T('Una salida') : v.length+' '+T('salidas'))
      : '';

    if(!v.length){
      $('lista').innerHTML='<div class="vacio"><b>'+T('Por aquí no hay nada programado')+'</b>'+
        T('Puede que sí haya para otros días. Mira el catálogo completo y elige fecha.')+'</div>';
      pintaFamilias(); return;
    }

    /* Agrupado por día y, dentro, por hora: así se lee como una agenda y no
       como una lista. */
    var html='', ultimaF='', ultimaH='';
    v.forEach(function(s){
      if(s.fecha!==ultimaF){
        ultimaF=s.fecha; ultimaH='';
        if(fechas===null || fechas.length>1)
          html+='<div class="hora" style="margin-top:26px"><b>'+esc(bonita(s.fecha))+'</b><i></i></div>';
      }
      var hh=String(s.hora||'').slice(0,5);
      if(hh!==ultimaH){ ultimaH=hh;
        html+='<div class="hora"><b>'+esc(hh)+'</b><i></i></div>'; }

      var col=colorDe(s.categoria_slug);
      var gratis = s.gratuito===true || Number(s.pvp_adulto||0)<=0;
      var dur = Number(s.duracion_min||0);
      var meta=[s.barrio||s.lugar||'', dur?Math.round(dur/60*10)/10+' h':''].filter(Boolean).join(' · ');

      html+='<a class="sal" href="/sinc/exp.html?id='+esc(s.op_exp)+(qs()?qs().replace('?','&'):'')+'&app=1">'+
        '<span class="fo">'+(s.portada?'<img src="'+esc(s.portada)+'" alt="" loading="lazy">':'')+'</span>'+
        '<span class="cu">'+
          '<span class="nm">'+esc(s.nombre||'')+'</span>'+
          (meta?'<span class="me">'+esc(meta)+'</span>':'')+
          '<span class="ab">'+
            '<span class="pill" style="background:'+col+'">'+esc(etiqueta(s))+'</span>'+
            '<span class="pr'+(gratis?' gratis':'')+'">'+(gratis?T('Por propina'):money(s.pvp_adulto))+'</span>'+
            (s.libres!=null&&s.libres<=6?'<span class="qd">'+T('Quedan ')+s.libres+'</span>':'')+
          '</span>'+
        '</span></a>';
    });
    $('lista').innerHTML=html;
    pintaFamilias();
    try{ window.apepeI18nBarre && window.apepeI18nBarre(); }catch(_){}
  }

  Array.prototype.forEach.call($('dias').querySelectorAll('.chip'),function(b){
    b.onclick=function(){
      DIA=b.getAttribute('data-d');
      Array.prototype.forEach.call($('dias').querySelectorAll('.chip'),function(o){
        o.setAttribute('aria-pressed', String(o===b)); });
      pinta();
    };
  });

  /* La liga de la reserva viaja a la ficha y al mapa: es lo que mantiene al
     huésped siendo él al cambiar de pantalla -y lo que le da su precio. */
  (function(){ var q=qs(); if(!q) return;
    $('bExplora').href='/sinc/index.html'+q+'&app=1';
    $('bMapa').href='/sinc/mapa.html'+q+'&app=1';
  })();

  fetch(SB+'/rest/v1/rpc/sinc_agenda',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_desde:null, p_dias:10, p_ciudad:CIUDAD})})
    .then(function(r){ return r.ok?r.json():[]; })
    .then(function(j){ TODO=Array.isArray(j)?j:[]; pinta(); })
    .catch(function(){
      $('sub').textContent='';
      $('lista').innerHTML='<div class="vacio"><b>'+T('No pudimos leer la agenda')+'</b>'+
        T('Revisa tu internet y vuelve a entrar.')+'</div>';
    });
})();
</script>
<script src="/apepe/tabbar.js"></script>
</body>
</html>
