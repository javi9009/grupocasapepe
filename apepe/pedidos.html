<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mis pedidos · Casa Pepe</title>
<meta name="description" content="Lo que pediste y en qué va.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --rosa:#F8BBCB; --cielo:#8DC8EA;
  --tinta:#1E1A16; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;min-height:100dvh}
a{color:inherit;text-decoration:none}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top a.back{color:#fff;font-size:22px;opacity:.9}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:18px;line-height:1.05}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:14px;margin-top:1px}
.wrap{padding:14px 16px 40px;max-width:680px;margin:0 auto}
.aviso{background:var(--ok-bg);border:1px solid #BFE0CC;color:#14563A;border-radius:11px;padding:11px 13px;font-size:13.5px;margin-bottom:14px}
.aviso.no{background:var(--alerta-bg);border-color:#E6D3AE;color:#6B4C10}
.ped{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;box-shadow:var(--sombra);padding:14px 15px;margin-bottom:12px}
.ped .cab{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.ped .fol{font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;letter-spacing:.03em}
.ped .cuando{color:var(--tenue);font-size:11.5px;margin-left:auto}
.et{display:inline-block;font-family:'Oswald',sans-serif;font-size:10.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;border-radius:999px;padding:3px 9px;background:var(--hueso);color:var(--gris)}
.et.ok{background:var(--ok-bg);color:var(--ok)}
.et.pend{background:var(--alerta-bg);color:var(--alerta)}
.piezas{margin:10px 0 0;padding:0;list-style:none;font-size:13.5px}
.piezas li{display:flex;gap:10px;padding:4px 0;border-bottom:1px dashed var(--linea)}
.piezas li:last-child{border:0}
.piezas li span.n{flex:1}
.tot{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:9px;border-top:1px solid var(--linea)}
.tot b{font-family:'Oswald',sans-serif;font-size:18px}
/* Los dos relevos: almacén se la da a front, front se la da a ti. */
.prom{margin-top:10px;background:var(--naranja-suave);border-radius:9px;padding:8px 11px;
  font-size:12.5px;font-weight:600;color:var(--naranja-oscuro)}
.ruta{display:flex;gap:0;margin-top:12px}
.ruta div{flex:1;text-align:center;font-size:10.5px;color:var(--tenue);position:relative;padding-top:20px}
.ruta div::before{content:'';position:absolute;top:5px;left:50%;transform:translateX(-50%);
  width:11px;height:11px;border-radius:50%;background:var(--linea)}
.ruta div::after{content:'';position:absolute;top:10px;left:50%;width:100%;height:2px;background:var(--linea)}
.ruta div:last-child::after{display:none}
.ruta div.on{color:var(--ok);font-weight:700}
.ruta div.on::before{background:var(--ok)}
.ruta div.on::after{background:var(--ok)}
.btn{display:block;width:100%;margin-top:12px;border:0;background:var(--naranja);color:#fff;border-radius:11px;
  padding:11px;font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  font-size:13px;text-align:center;cursor:pointer}
.vacio{padding:44px 16px;text-align:center;color:var(--tenue)}
.vacio b{display:block;font-family:'Oswald',sans-serif;text-transform:uppercase;color:var(--gris);margin-bottom:4px}
.vacio a{display:inline-block;margin-top:14px;color:var(--naranja-oscuro);font-weight:700}
</style>
<script src="/apepe/resv.js"></script>
<script src="/apepe/marca.js"></script>
<script src="/apepe/idioma.js"></script>
<script>
function T(f){ try{ return window.apepeT ? window.apepeT(f) : f; }catch(e){ return f; } }
</script>
</head>
<body>
<header class="top">
  <a class="back" id="back" href="/apepe/tienda.html" aria-label="Volver" data-i18n-aria="Volver">←</a>
  <div class="av" style="width:40px;height:40px;border-radius:50%;background:var(--naranja);display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden"><img src="/img/apepe/stickers/mercado.webp" alt="" style="width:100%;height:100%;object-fit:cover;display:block"></div>
  <div>
    <div class="nom" data-i18n>Mis pedidos</div>
    <div class="sub" data-i18n>lo que te espera en recepción</div>
  </div>
</header>

<div class="wrap">
  <div id="aviso"></div>
  <div id="lista"><div class="vacio" data-i18n>Cargando tus pedidos…</div></div>
</div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var P=new URLSearchParams(location.search);
var TOKEN=P.get('resv')||P.get('sol')||'';
try{ if(!TOKEN){ TOKEN=localStorage.getItem('cpp_resv')||localStorage.getItem('apepe_resv')||''; } }catch(e){}
var QT=TOKEN?('resv='+encodeURIComponent(TOKEN)):'';
try{ document.getElementById('back').href='/apepe/tienda.html'+(QT?('?'+QT):''); }catch(e){}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function money(n){ return '$'+Number(n||0).toLocaleString('es-MX'); }
function cuando(iso){
  try{
    var d=new Date(iso), h=new Date(); h.setHours(0,0,0,0);
    var dd=new Date(d); dd.setHours(0,0,0,0);
    var dias=Math.round((h-dd)/86400000);
    var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    if(dias===0) return T('hoy')+' '+hm;
    if(dias===1) return T('ayer')+' '+hm;
    return d.toLocaleDateString('es-MX',{day:'numeric',month:'short'})+' '+hm;
  }catch(e){ return ''; }
}

/* El aviso de vuelta de Stripe. Ojo: el ?pago=ok de la URL NO confirma nada —
   quien confirma es el webhook. Aquí sólo se dice lo que se está esperando, y
   el estado de verdad sale de la base, abajo. */
(function(){
  var r=P.get('pago'), nuevo=P.get('nuevo'), a=$('aviso');
  if(r==='ok') a.innerHTML='<div class="aviso">'+esc(T('Gracias. En cuanto el banco nos confirme, aquí abajo lo verás como pagado.'))+'</div>';
  else if(r==='no') a.innerHTML='<div class="aviso no">'+esc(T('No se completó el pago. Tu pedido sigue apartado: puedes volver a intentarlo.'))+'</div>';
  else if(nuevo){
    var efe=(new URLSearchParams(location.search)).get('efectivo')==='1';
    a.innerHTML='<div class="aviso">'+esc(efe
      ? T('Pedido {f} tomado. Lo pagas en efectivo cuando lo recojas en recepción.').replace('{f}',nuevo)
      : T('Pedido {f} tomado. Lo recoges en recepción.').replace('{f}',nuevo))+'</div>';
  }
})();

/* La hora de México, dicha como la diría un recepcionista: hoy, mañana, o el
   día, y la hora. El teléfono del huésped puede estar en cualquier huso, así
   que la hora se lee siempre en el de la casa. */
function horaMX(iso){
  try{
    var d=new Date(iso);
    var hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
    var dia=d.toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
    var h=d.toLocaleTimeString('es-MX',{timeZone:'America/Mexico_City',hour:'2-digit',minute:'2-digit',hour12:false});
    if(dia===hoy) return T('hoy hacia las {h}').replace('{h}',h);
    var m=new Date(Date.now()+86400000).toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
    if(dia===m) return T('mañana a las {h}').replace('{h}',h);
    return d.toLocaleDateString('es-MX',{timeZone:'America/Mexico_City',day:'numeric',month:'short'})+' · '+h;
  }catch(_){ return ''; }
}

function etiqueta(p){
  if(p.estado==='cancelado') return '<span class="et">'+esc(T('Cancelado'))+'</span>';
  if(p.entregado_at) return '<span class="et ok">'+esc(T('Entregado'))+'</span>';
  if(p.pago==='pagado') return '<span class="et ok">'+esc(T('Pagado'))+'</span>';
  return '<span class="et pend">'+esc(T('Por pagar'))+'</span>';
}

function tarjeta(p){
  var piezas=(p.piezas||[]).map(function(l){
    return '<li><span>'+l.cantidad+'×</span><span class="n">'+esc(l.nombre)+'</span><span>'+money(l.subtotal)+'</span></li>';
  }).join('');
  var ruta='<div class="ruta">'
    +'<div class="'+(p.pago==='pagado'?'on':'')+'">'+esc(p.pago==='pagado'?T('Pagado'):T('Por pagar'))+'</div>'
    +'<div class="'+(p.en_front_at?'on':'')+'">'+esc(T('En recepción'))+'</div>'
    +'<div class="'+(p.entregado_at?'on':'')+'">'+esc(T('En tu mano'))+'</div>'
    +'</div>';
  /* La hora prometida, la que calculó la base al crear el pedido. Solo
     mientras signifique algo: una vez en su mano, ya no hay nada que esperar. */
  var promesa='';
  if(p.entrega && !p.entregado_at && p.estado!=='cancelado'){
    promesa='<div class="prom">'+esc(T('Lo recoges en recepción · {h}').replace('{h}', horaMX(p.entrega)))+'</div>';
  }
  var pagar = (p.pago!=='pagado' && p.estado!=='cancelado' && Number(p.total)>0)
    ? '<button class="btn" data-pagar="'+esc(p.id)+'">'+esc(T('Pagar con tarjeta'))+'</button>' : '';
  return '<div class="ped">'
    +'<div class="cab"><span class="fol">'+esc(p.folio||'')+'</span>'+etiqueta(p)
      +'<span class="cuando">'+esc(cuando(p.cuando))+(p.cuarto?(' · '+esc(T('cuarto'))+' '+esc(p.cuarto)):'')+'</span></div>'
    +'<ul class="piezas">'+piezas+'</ul>'
    +'<div class="tot"><span>'+esc(T('Total'))+'</span><b>'+money(p.total)+'</b></div>'
    + promesa
    + (p.estado==='cancelado' ? '' : ruta)
    + pagar
    +'</div>';
}

function pinta(l){
  if(!l.length){
    $('lista').innerHTML='<div class="vacio"><b>'+esc(T('Todavía no has pedido nada'))+'</b>'
      +esc(T('Las piezas de la tienda se recogen en recepción.'))
      +'<br><a href="/apepe/tienda.html'+(QT?('?'+QT):'')+'">'+esc(T('Ver la tienda →'))+'</a></div>';
    return;
  }
  $('lista').innerHTML=l.map(tarjeta).join('');
  Array.prototype.forEach.call(document.querySelectorAll('[data-pagar]'),function(b){
    b.onclick=async function(){
      b.disabled=true; b.textContent=T('Un momento…');
      try{
        var c=await fetch(SB+'/functions/v1/arte-checkout',{method:'POST',
          headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
          body:JSON.stringify({pedido_id:b.getAttribute('data-pagar'),origen:location.origin})
        }).then(function(x){ return x.json(); });
        if(c&&c.url){ location.href=c.url; return; }
        throw new Error((c&&c.error)||T('No pudimos abrir el pago.'));
      }catch(e){
        b.disabled=false; b.textContent=String(e.message||e);
      }
    };
  });
}

if(!TOKEN){
  $('lista').innerHTML='<div class="vacio"><b>'+esc(T('No sabemos quién eres'))+'</b>'
    +esc(T('Abre la app con la liga de tu reserva y aquí verás tus pedidos.'))+'</div>';
}else{
  fetch(SB+'/rest/v1/rpc/arte_mis_pedidos',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify({p_resv:TOKEN})})
  .then(function(r){ return r.ok?r.json():[]; })
  .then(function(j){ pinta(Array.isArray(j)?j:[]); })
  .catch(function(){ $('lista').innerHTML='<div class="vacio"><b>'+esc(T('No pudimos cargar tus pedidos'))+'</b>'+esc(T('Revisa tu internet e inténtalo de nuevo.'))+'</div>'; });
}
</script>
<script src="/apepe/tabbar.js"></script>
</body>
</html>
