<!-- LA BIBLIOTECA DE PROCEDIMIENTOS. Javi, 19-nov-2026: «edita el lector como el de un
     kindle y crea en "la gente ya no lee" una biblioteca de procedimientos por secciones y
     portada de Casa Pepe brandeada por tipo de área y procedimiento, con el avance de
     lectura y el tiempo estimado por página. Los procedimientos son solo visibles por los
     trabajadores de la empresa».
     - El estante sale de proc_biblioteca() y el texto de proc_leer(): las dos responden
       null a quien no es del equipo de la casa (es_equipo_casa()). Sin sesión no hay nada.
     - La lectura cuenta igual que en /soypepe/leer.html: proc_abrir_lectura al abrir y
       proc_marcar_leido al terminar (el servidor exige el tiempo mínimo). El test se hace
       en leer.html, que es donde vive.
     - El avance de página se guarda en el teléfono (localStorage proc.bib.v1). -->
<style>
:root{
  --naranja:#F2682A; --magenta:#E2188E; --rosa:#F8BBCB;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096; --linea:#E6DFD6;
  --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFFFFF; --ok:#1D6B4A; --ok-bg:#E1F0E7;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4); --radio:14px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--papel);color:var(--tinta);font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.55;padding-bottom:40px;-webkit-text-size-adjust:100%}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
.top{background:var(--tinta);color:#fff;position:sticky;top:0;z-index:50}
.top .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.top .back{color:#fff;font-size:22px;line-height:1;padding:2px 6px;background:none;border:0;cursor:pointer}
.top .nom{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;font-size:17px;line-height:1.1}
.top .sub{font-family:'Lobster Two',cursive;color:var(--rosa);font-size:13px}
.top .lock{margin-left:auto;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:rgba(255,255,255,.14);border-radius:999px;padding:4px 9px}
.franja{height:8px;display:flex}.franja i{flex:1}
.vista{display:none}.vista.on{display:block}
.hero{padding:20px 0 2px}
.hero .ole{font-family:'Lobster Two',cursive;color:var(--naranja);font-size:19px;display:block;margin-bottom:2px}
.hero h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;font-size:25px;line-height:1.05;margin:0}
.hero p{color:var(--gris);font-size:14px;margin:9px 0 0;line-height:1.55}
.resumen{display:flex;gap:10px;margin:16px 0 4px;flex-wrap:wrap}
.resumen div{flex:1;min-width:120px;background:var(--blanco);border:1px solid var(--linea);border-radius:12px;padding:10px 12px;box-shadow:var(--sombra)}

.resumen small{color:var(--gris);font-size:11.5px}
.sigue{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);margin:14px 0 4px;padding:12px 13px;display:flex;gap:13px;align-items:center;cursor:pointer;text-align:left;width:100%;font:inherit;color:inherit}
.sigue .q{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--naranja)}
.sigue b{display:block;font-family:'Oswald',sans-serif;font-size:15px;text-transform:uppercase;line-height:1.15;margin:2px 0 3px}
.sigue small{color:var(--gris);font-size:12px}
.barra{height:4px;background:var(--hueso);border-radius:99px;margin-top:6px;overflow:hidden}.barra i{display:block;height:100%;background:var(--ok)}
.filtros{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0 6px}
.filtros button{border:1px solid var(--linea);background:var(--blanco);border-radius:999px;padding:6px 12px;font:inherit;font-size:12.5px;font-weight:600;color:var(--tinta-2);cursor:pointer}
.filtros button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.busca{width:100%;padding:11px 13px;border:1px solid var(--linea);border-radius:12px;font:inherit;font-size:15px;background:var(--blanco);margin:6px 0 2px}
.hh{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:13px;color:var(--tinta-2);margin:26px 0 4px;display:flex;align-items:center;gap:10px}
.hh i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hh:after{content:"";flex:1;height:1px;background:var(--linea)}
.sub-hh{color:var(--gris);font-size:12px;margin:0 0 11px}
.estante{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.libro{flex:none;width:118px;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;scroll-snap-align:start}
.tapa{position:relative;display:flex;flex-direction:column;border-radius:5px;overflow:hidden;aspect-ratio:2/3;color:#fff;padding:9px 9px 8px;
  box-shadow:0 2px 3px rgba(30,26,22,.1),0 14px 26px -16px rgba(30,26,22,.85)}
.tapa:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.28) 0,rgba(0,0,0,.05) 5px,rgba(255,255,255,.14) 10px,rgba(255,255,255,0) 18px)}
.tapa .tp{font-family:'Oswald',sans-serif;font-size:9px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.tapa .iso{width:22px;height:22px;object-fit:contain;margin:6px 0 4px;opacity:.95}
.tapa .tt{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12px;line-height:1.12;letter-spacing:.01em;flex:1;overflow:hidden;display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical}
.tapa .cd{font-size:9px;opacity:.75;letter-spacing:.04em}
.tapa .ar{font-family:'Lobster Two',cursive;font-size:12px;opacity:.95;margin-top:2px}
.tapa .badge{position:absolute;top:7px;right:7px;background:rgba(255,255,255,.95);color:var(--ok);font-size:9.5px;font-weight:800;border-radius:999px;padding:2px 6px}
.tapa .pro{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.25)}.tapa .pro i{display:block;height:100%;background:#fff}
.libro small{display:block;color:var(--gris);font-size:11px;line-height:1.3;margin-top:7px}
.libro small b{color:var(--tinta-2)}
.vacio{color:var(--gris);font-size:13px;padding:14px 0}
.gate{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:22px 18px;margin:24px 0;text-align:center}
.gate .em{font-size:36px}.gate h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;margin:8px 0 6px}
.gate p{color:var(--gris);font-size:14px;margin:0}
.gate a{display:inline-block;margin-top:14px;background:var(--tinta);color:#fff;border-radius:12px;padding:12px 18px;text-decoration:none;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.05em;font-size:13px}
/* ficha */
.fcab{display:flex;gap:16px;padding:20px 0 2px}
.fcab .libro{width:120px;cursor:default}
.fcab h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:20px;line-height:1.1;margin:0 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--hueso);border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:600;color:var(--tinta-2)}
.chip.verde{background:var(--ok-bg);color:var(--ok)} .chip.ambar{background:#F3EAD6;color:#8C6212}
.fres{font-size:14.5px;line-height:1.65;color:var(--tinta-2);margin:16px 0 0}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--tinta);color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:14px;padding:14px;margin-top:16px;cursor:pointer;text-align:center;text-decoration:none;box-shadow:var(--sombra)}
.btn.sec{background:var(--blanco);color:var(--tinta);border:1px solid var(--linea);margin-top:9px}
.btn.verde{background:var(--ok)}
/* lector tipo kindle */
#vLector{position:fixed;inset:0;background:var(--papel);z-index:80;display:none;flex-direction:column}
#vLector.on{display:flex}
#vLector.sepia{background:#F3E7D0;color:#3B2F20}
#vLector.noche{background:#17161A;color:#C9C4BC}
.lbar{display:flex;align-items:center;gap:10px;padding:10px 14px;flex:none}
.lbar button{background:none;border:0;font:inherit;color:inherit;cursor:pointer;padding:6px;font-size:13px;opacity:.72;line-height:1}
.lbar .tl{flex:1;font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:12px;letter-spacing:.05em;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar .x{font-size:20px}
#ventana{flex:1;overflow:hidden;position:relative;touch-action:pan-y}
#texto{height:100%;padding:0 22px;transition:transform .22s ease;font-family:'Lora',Georgia,serif;font-size:18px;line-height:1.7;text-align:left;hyphens:auto}
#texto h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:1.15em;line-height:1.2;margin:0 0 .5em;break-after:avoid}
#texto h2{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:.95em;letter-spacing:.03em;line-height:1.3;margin:1.1em 0 .45em;break-after:avoid}
#texto h3{font-family:'Oswald',sans-serif;font-size:.88em;letter-spacing:.02em;line-height:1.3;margin:1em 0 .35em;opacity:.85;break-after:avoid}
#texto p{margin:0 0 .75em}
#texto p.meta{font-family:'Inter',sans-serif;font-size:.7em;opacity:.6;margin-bottom:1em}
#texto ul{margin:0 0 .8em;padding-left:1.2em}#texto li{margin:0 0 .3em}
#texto hr{border:0;border-top:1px solid currentColor;opacity:.15;margin:1em 0}
#texto .portadilla{text-align:center;padding-top:8%;break-after:column}
#texto .portadilla .k{font-family:'Inter',sans-serif;font-size:.62em;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
#texto .portadilla .t{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:1.4em;line-height:1.15;margin:.6em 0}
#texto .portadilla .m{font-family:'Inter',sans-serif;font-size:.68em;opacity:.65;line-height:1.6}
#texto .fin{break-before:column;text-align:center;padding-top:10%;font-family:'Inter',sans-serif;font-size:.78em}
#texto .fin .em{font-size:2.4em}
#texto .fin button,#texto .fin a{display:block;width:100%;max-width:300px;margin:.8em auto 0;border:0;border-radius:12px;background:#1D6B4A;color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.06em;font-size:.95em;padding:.85em;cursor:pointer;text-decoration:none}
#texto .fin a.sec{background:transparent;color:inherit;border:1px solid currentColor;opacity:.75}
#texto .fin .msg{margin-top:.8em;opacity:.8;line-height:1.5}
.lpie{flex:none;padding:6px 16px 12px;font-size:11.5px}
.lpie .l1{display:flex;align-items:center;gap:12px;opacity:.65}
.lpie .pr{flex:1;height:3px;background:currentColor;opacity:.25;border-radius:99px;overflow:hidden;position:relative}
.lpie .pr i{display:block;height:100%;background:currentColor}
.lpie .l2{text-align:center;opacity:.55;margin-top:4px;font-size:11px}
.toque{position:absolute;top:0;bottom:0;width:30%;cursor:pointer}.toque.izq{left:0}.toque.der{right:0}
.ajustes{position:absolute;left:14px;right:14px;bottom:52px;background:var(--blanco);color:var(--tinta);border-radius:var(--radio);box-shadow:0 20px 50px -20px rgba(0,0,0,.6);padding:14px;display:none;z-index:5}
.ajustes.on{display:block}
.ajustes .fila{display:flex;align-items:center;gap:10px;margin-bottom:11px}.ajustes .fila:last-child{margin-bottom:0}
.ajustes .et{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--tenue);font-family:'Oswald',sans-serif;min-width:60px}
.ajustes .ops{display:flex;gap:6px;flex:1}
.ajustes .ops button{flex:1;border:1px solid var(--linea);background:var(--blanco);border-radius:9px;padding:9px 0;font:inherit;font-size:13px;cursor:pointer;color:var(--tinta)}
.ajustes .ops button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.tostada{position:fixed;left:50%;transform:translateX(-50%);bottom:40px;background:rgba(24,20,17,.92);color:#fff;font-size:12.5px;padding:9px 15px;border-radius:999px;z-index:90;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90vw;text-align:center}
.tostada.on{opacity:1}
</style>
</head>
<body>
<div class="top"><div class="in">
  <button class="back" id="atras" aria-label="Volver">←</button>
  <div><div class="nom">Procedimientos</div><div class="sub">La gente ya no lee · Casa Pepe</div></div>
  <span class="lock">🔒 Solo equipo</span>
</div></div>
<div class="franja"><i style="background:#1D6B4A"></i><i style="background:#F2682A"></i><i style="background:#E2188E"></i><i style="background:#8DC8EA"></i><i style="background:#5B2E86"></i></div>

<section class="vista on" id="vEstante"><div class="wrap" id="estanteWrap"><div class="vacio">Cargando la biblioteca…</div></div></section>
<section class="vista" id="vFicha"><div class="wrap" id="fichaWrap"></div></section>

<div id="vLector">
  <div class="lbar"><button class="x" id="lCerrar" aria-label="Cerrar">✕</button><div class="tl" id="lTitulo"></div><button id="lAjustes" aria-label="Ajustes">Aa</button></div>
  <div id="ventana">
    <div id="texto"></div>

      <div class="fila"><span class="et">Letra</span><div class="ops"><button data-ts="16">A</button><button data-ts="18">A</button><button data-ts="21">A</button><button data-ts="24">A</button></div></div>
      <div class="fila"><span class="et">Papel</span><div class="ops"><button data-tema="papel">Papel</button><button data-tema="sepia">Sepia</button><button data-tema="noche">Noche</button></div></div>
    </div>
  </div>

</div>
<div class="tostada" id="tost"></div>

<script>
(function(){
'use strict';
var SBU='https://rehophywchakfapivsbh.supabase.co/rest/v1';
var SBK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
var $=function(id){return document.getElementById(id);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
function tok(){ try{ var raw=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token'); if(!raw) return null; var o=JSON.parse(raw);
  var s=(o&&o.access_token)?o:((o&&(o.currentSession||o.session))||o); return (s&&s.access_token)?s.access_token:null; }catch(e){ return null; } }
function rpc(fn,body){ var t=tok(); if(!t) return Promise.resolve(null);
  return fetch(SBU+'/rpc/'+fn,{method:'POST',headers:{apikey:SBK,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body||{})})
    .then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }
var QS=new URLSearchParams(location.search), EMBED=(QS.get('embed')==='1' || window.top!==window.self);
/* SOLO ESTE DOCUMENTO. Javi, 22-nov-2026: «mejor sólo mete el kindle de ese
   procedimiento y si lo terminas se cierra el pop up». Abierta desde Mi
   desempeño, esta pantalla traía la biblioteca entera detrás del lector: al
   cerrar la cruz aparecía el estante dentro del pop-up y desde ahí se podía
   seguir navegando, con dos cabeceras encima. Con ?solo=1 sólo existe el
   lector, y su cruz cierra el pop-up de quien lo abrió. */
var SOLO=QS.get('solo')==='1';
function avisaPadre(tipo){
  try{ if(window.parent && window.parent!==window)
    window.parent.postMessage({type:tipo, doc:QS.get('doc')||null}, location.origin); }catch(_){}
}

var NIVEL={general:'General',jefe_area:'Jefe de área',gerente:'Gerencia',direccion:'Dirección'}, NIVEL_ORD=['general','jefe_area','gerente','direccion'];
var TIPO={PDO:'Procedimiento',PRO:'Proceso',POL:'Política',FOR:'Formato',DPT:'Puesto',STA:'Estándar',GUI:'Guía',OTR:'Documento'};
var TIPO_ORD=['PRO','PDO','POL','STA','DPT','FOR','GUI','OTR'];
var COLOR={GEN:['#1E1A16','#3C3630'],RRH:['#5B2E86','#3D1D5E'],REC:['#F2682A','#C9501A'],ADL:['#1D6B4A','#124A33'],APU:['#2E8B7A','#1D5F53'],
  AYB:['#C9501A','#8E3410'],MTO:['#3C5A78','#263C52'],COM:['#8C6212','#5E410B'],AUD:['#6E665C','#48423B'],CTA:['#2F6DB5','#1E4A7E'],GEX:['#E2188E','#A00F63']};
function col(a){ return COLOR[a]||['#3C3630','#1E1A16']; }
var PPM=400; // palabras por minuto: el tiempo de lectura va a la mitad (Javi, 19-nov-2026), igual que proc_segundos_minimos

var B=null, AREAS={}, FILTRO={vista:(new URLSearchParams(location.search).get('ver')==='pend'?'pend':'mio'), tipo:'', nivel:'', q:'', area:(new URLSearchParams(location.search).get('area')||'')};
var MEM={}; try{ MEM=JSON.parse(localStorage.getItem('proc.bib.v1')||'{}')||{}; }catch(_){ MEM={}; }
function guarda(){ try{ localStorage.setItem('proc.bib.v1',JSON.stringify(MEM)); }catch(_){} }
function avance(d){ if(d.leido) return 1; var m=MEM[d.id]; return m?Math.max(0,Math.min(1,m.f||0)):0; }
function minutos(d){ return Math.max(1,Math.round((d.palabras||0)/PPM)); }
function tostada(t){ var e=$('tost'); e.textContent=t; e.classList.add('on'); clearTimeout(e._t); e._t=setTimeout(function(){ e.classList.remove('on'); },2600); }

function tapa(d,grande){
  var c=col(d.area), a=AREAS[d.area]||d.area||'', p=Math.round(avance(d)*100);
  return '<span class="tapa" style="background:linear-gradient(160deg,'+c[0]+' 0%,'+c[1]+' 100%)">'
    +'<span class="tp">'+(d.nivel&&d.nivel!=='general'?'🔒 ':'')+esc(TIPO[d.tipo]||'Documento')+(d.nivel&&d.nivel!=='general'?' · '+esc(NIVEL[d.nivel]||''):'')+'</span>'
    +'<img class="iso" src="/img/casapepe/casapepe_isotipo_blanco.png" alt="">'
    +'<span class="tt">'+esc(d.titulo)+'</span>'
    +'<span class="cd">'+esc(d.codigo||'')+(d.version?(' · v'+esc(d.version)):'')+'</span>'
    +'<span class="ar">'+esc(a)+'</span>'
    +(d.quiz_ok?'<span class="badge">✓ TEST</span>':(d.leido?'<span class="badge">✓ LEÍDO</span>':''))
    +(p>0&&p<100?'<span class="pro"><i style="width:'+p+'%"></i></span>':'')
    +'</span>';
}
function libro(d){
  var p=Math.round(avance(d)*100);
  var est=d.quiz_ok?'test aprobado':(d.leido?'leído'+(d.preguntas?' · falta test':''):(p?(p+'% leído'):'sin empezar'));
  return '<button class="libro" data-id="'+esc(d.id)+'">'+tapa(d)+'<small><b>⏱ '+minutos(d)+' min</b> · '+est+'</small></button>';
}

/* ---------- ESTANTE ---------- */
function filtrados(){
  var q=FILTRO.q.toLowerCase();
  return B.docs.filter(function(d){
    if(FILTRO.vista==='mio' && !d.mio) return false;
    if(FILTRO.vista==='pend' && (!d.mio || d.leido)) return false;
    if(FILTRO.tipo && d.tipo!==FILTRO.tipo) return false;
    if(FILTRO.area && d.area!==FILTRO.area) return false;
    if(FILTRO.nivel && (d.nivel||'general')!==FILTRO.nivel) return false;
    if(q && (d.titulo+' '+(d.codigo||'')).toLowerCase().indexOf(q)<0) return false;
    return true;
  });
}
function pintaEstante(){
  var mios=B.docs.filter(function(d){return d.mio;}), leidosMios=mios.filter(function(d){return d.leido;}).length,
      testMios=mios.filter(function(d){return d.quiz_ok;}).length,
      minPend=mios.filter(function(d){return !d.leido;}).reduce(function(s,d){return s+minutos(d)*(1-avance(d));},0);
  var ult=null; Object.keys(MEM).forEach(function(id){ var m=MEM[id]; if(m&&m.f>0&&m.f<1&&(!ult||m.ts>MEM[ult].ts)) ult=id; });

  if(du) h+='<button class="sigue" data-id="'+esc(du.id)+'"><div style="width:46px;flex:none">'+tapa(du)+'</div><div style="flex:1;min-width:0"><div class="q">Seguir leyendo</div><b>'+esc(du.titulo)
    +'</b><small>'+Math.round(avance(du)*100)+'% · quedan '+Math.max(1,Math.round(minutos(du)*(1-avance(du))))+' min</small><div class="barra"><i style="width:'+Math.round(avance(du)*100)+'%"></i></div></div></button>';
  h+='<div class="filtros" id="fVista">'
    +(mios.length?'<button data-v="mio">Mi puesto ('+mios.length+')</button><button data-v="pend">Me faltan ('+(mios.length-leidosMios)+')</button>':'')
    +'<button data-v="todos">Todos ('+B.docs.length+')</button></div>'
    +(function(){ var nv={}; B.docs.forEach(function(d){ nv[d.nivel||'general']=1; }); var ks=NIVEL_ORD.filter(function(k){return nv[k];});
        /* Solo llegan los documentos de tu nivel o inferiores (proc_biblioteca); el filtro sale si ves más de uno. */
        return ks.length>1?'<div class="filtros" id="fNivel"><button data-n="">Todo nivel</button>'+ks.map(function(k){ return '<button data-n="'+k+'">'+NIVEL[k]+'</button>'; }).join('')+'</div>':''; })()
    +(FILTRO.area?'<div class="filtros"><button id="fAreaX" class="on">'+esc(AREAS[FILTRO.area]||FILTRO.area)+' ✕</button></div>':'')
    +'<div class="filtros" id="fTipo"><button data-t="">Todo tipo</button>'
    +TIPO_ORD.filter(function(t){return tiposHay[t];}).map(function(t){ return '<button data-t="'+t+'">'+TIPO[t]+'</button>'; }).join('')+'</div>'
    +'<input class="busca" id="busca" placeholder="Buscar por título o código…" value="'+esc(FILTRO.q)+'">'
    +'<div id="secciones"></div>';
  $('estanteWrap').innerHTML=h;
  if(!mios.length && FILTRO.vista!=='todos') FILTRO.vista='todos';
  document.querySelectorAll('#fVista button').forEach(function(b){ b.classList.toggle('on',b.dataset.v===FILTRO.vista); b.onclick=function(){ FILTRO.vista=b.dataset.v; pintaEstante(); }; });
  document.querySelectorAll('#fNivel button').forEach(function(b){ b.classList.toggle('on',b.dataset.n===FILTRO.nivel); b.onclick=function(){ FILTRO.nivel=b.dataset.n; pintaEstante(); }; });
  var bax=$('fAreaX'); if(bax) bax.onclick=function(){ FILTRO.area=''; pintaEstante(); };
  document.querySelectorAll('#fTipo button').forEach(function(b){ b.classList.toggle('on',b.dataset.t===FILTRO.tipo); b.onclick=function(){ FILTRO.tipo=b.dataset.t; pintaEstante(); }; });
  var bq=$('busca'); bq.oninput=function(){ FILTRO.q=bq.value; pintaSecciones(); };
  var sg=document.querySelector('.sigue'); if(sg) sg.onclick=function(){ abreFicha(sg.dataset.id); };

}
function pintaSecciones(){
  var L=filtrados(), h='';
  B.areas.forEach(function(a){
    var ds=L.filter(function(d){return d.area===a.codigo;}); if(!ds.length) return;
    ds.sort(function(x,y){ return (TIPO_ORD.indexOf(x.tipo)-TIPO_ORD.indexOf(y.tipo)) || String(x.codigo).localeCompare(String(y.codigo)); });
    var lei=ds.filter(function(d){return d.leido;}).length, mins=ds.reduce(function(s,d){return s+minutos(d);},0);
    h+='<div class="hh"><i style="background:'+col(a.codigo)[0]+'"></i>'+esc(a.nombre)+'</div>'
      +'<div class="sub-hh">'+ds.length+' documento'+(ds.length===1?'':'s')+' · '+lei+' leído'+(lei===1?'':'s')+' · ⏱ '+mins+' min en total</div>'
      +'<div class="estante">'+ds.map(libro).join('')+'</div>';
  });
  var sin=L.filter(function(d){ return !B.areas.some(function(a){return a.codigo===d.area;}); });

/* ---------- FICHA ---------- */
var FICHA=null;

  } else {
    h+='<a class="btn" href="/soypepe/leer.html?doc='+encodeURIComponent(d.id)+'&clasico=1'+(EMBED?'&embed=1':'')+'">Abrir el PDF</a>';

/* ---------- LECTOR (como un Kindle: páginas, letra, papel, avance y tiempo) ---------- */
function mdmin(txt){
  var lineas=esc(String(txt||'')).split(/\r?\n/), h='', lista=false;
  var inline=function(t){ return t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); };
  var cierra=function(){ if(lista){ h+='</ul>'; lista=false; } };
  for(var i=0;i<lineas.length;i++){
    var l=lineas[i].trim();
    if(!l){ cierra(); continue; }
    if(/^---+$/.test(l)){ cierra(); h+='<hr>'; continue; }
    if(/^###\s+/.test(l)){ cierra(); h+='<h3>'+inline(l.replace(/^###\s+/,''))+'</h3>'; continue; }
    if(/^##\s+/.test(l)){ cierra(); h+='<h2>'+inline(l.replace(/^##\s+/,''))+'</h2>'; continue; }
    if(/^#\s+/.test(l)){ cierra(); h+='<h2>'+inline(l.replace(/^#\s+/,''))+'</h2>'; var sg=(lineas[i+1]||'').trim(); if(sg&&/·/.test(sg)&&!/^\*\*/.test(sg)){ h+='<p class="meta">'+inline(sg)+'</p>'; i++; } continue; }
    if(/^[-•*]\s+/.test(l)){ if(!lista){ h+='<ul>'; lista=true; } h+='<li>'+inline(l.replace(/^[-•*]\s+/,''))+'</li>'; continue; }
    var sig=(lineas[i+1]||'').trim(), nPal=l.split(/\s+/).length;
    var esSub=sig && nPal<=7 && l.length<=58 && !/[:,;]/.test(l) && !/[.!?]$/.test(l.replace(/^\d+(\.\d+)*\.?\s*/,'')) && !/^[a-záéíóúñ]/.test(l);
    if(esSub){ cierra(); h+='<h3>'+inline(l)+'</h3>'; continue; }
    cierra(); h+='<p>'+inline(l)+'</p>';
  }
  if(lista) h+='</ul>';
  return h;
}
var L={id:null,doc:null,pag:0,paginas:1}, TS=18, TEMA='papel', ANCHO=0, ALTO=0, MODO='pagina';
try{ TS=+(localStorage.getItem('bib.ts')||18); TEMA=localStorage.getItem('bib.tema')||'papel'; }catch(_){}
function abreLector(id,desdeCero){
  var d=B.docs.find(function(x){return x.id===id;});
  tostada('Abriendo…');
  rpc('proc_abrir_lectura',{p_doc:id});
  rpc('proc_leer',{p_doc:id}).then(function(doc){
    if(!doc||!doc.id||!doc.contenido){ tostada('No se pudo abrir el documento'); return; }
    L.id=id; L.doc=doc; L.meta=d;
    var m=MEM[id]; L.pag=(!desdeCero&&m&&m.pag)?m.pag:0;
    $('vLector').classList.add('on'); aplicaTema(); pinta(true);
  });
}
function aplicaTema(){
  var v=$('vLector'); v.classList.remove('sepia','noche'); if(TEMA!=='papel') v.classList.add(TEMA);
  $('texto').style.fontSize=TS+'px';
  document.querySelectorAll('[data-ts]').forEach(function(b){ b.classList.toggle('on',+b.dataset.ts===TS); });
  document.querySelectorAll('[data-tema]').forEach(function(b){ b.classList.toggle('on',b.dataset.tema===TEMA); });
}
function cuerpoDoc(doc){
  var c=String(doc.contenido||'');
  if(/^#\s/.test(c.trimStart())){ var ls=c.replace(/^\s+/,'').split(/\r?\n/); ls.shift(); if(ls[0]&&/·/.test(ls[0])&&!/^\*\*/.test(ls[0].trim())) ls.shift(); c=ls.join('\n'); }
  return c;
}
function pinta(conserva){
  var doc=L.doc, d=L.meta||{};
  var html='<div class="portadilla"><div class="k">Casa Pepe · '+esc(TIPO[doc.tipo]||'Documento')+'</div>'
    +'<div class="t">'+esc(doc.titulo)+'</div>'
    +'<div class="m">'+esc(doc.codigo||'')+(doc.version?' · v'+esc(doc.version):'')+'<br>'+esc(doc.area_nombre||doc.area||'')
    +(doc.proceso?'<br>Parte del proceso «'+esc(doc.proceso)+'»':'')+'<br>⏱ '+Math.max(1,Math.round((doc.palabras||0)/PPM))+' min de lectura</div></div>'
    +mdmin(cuerpoDoc(doc))
    +'<div class="fin" id="finDoc"><div class="em">📘</div><b>Fin del documento</b>'
    +(doc.leido||(L.meta&&L.meta.leido)?'<div class="msg">✓ Ya está registrado como leído.</div>':'<button id="btnLeido">Ya lo leí</button><div class="msg" id="msgLeido">El sistema pide un tiempo mínimo de lectura de '+Math.round((doc.segundos_minimos||90)/60*10)/10+' min.</div>')
    +((doc.n_preguntas||0)>0?'<a href="/soypepe/leer.html?doc='+encodeURIComponent(doc.id)+'&ir=test'+(EMBED?'&embed=1':'')+'" id="btnTest" style="'+((doc.leido||(L.meta&&L.meta.leido))?'':'display:none')+'">'+(doc.quiz_ok?'Repetir el test':'Hacer el test ('+doc.n_preguntas+' preguntas)')+'</a>':'')
    +(doc.estado==='revision'||doc.estado==='heredado'?'<a class="sec" href="/soypepe/leer.html?doc='+encodeURIComponent(doc.id)+'&clasico=1'+(EMBED?'&embed=1':'')+'">Anotar que está desactualizado</a>':'')
    +'</div>';
  $('texto').innerHTML=html; $('lTitulo').textContent=doc.titulo;
  var bl=$('btnLeido'); if(bl) bl.onclick=marcarLeido;
  var n=0; (function re(){ requestAnimationFrame(function(){ var ok=mide(); if(!ok&&n++<20) return re(); if(!conserva) L.pag=0; if(MODO!=='scroll') L.pag=Math.max(0,Math.min(L.paginas-1,L.pag)); coloca(); }); })();
}
function marcarLeido(){
  var b=$('btnLeido'); b.disabled=true; b.textContent='Registrando…';
  rpc('proc_marcar_leido',{p_doc:L.id}).then(function(r){
    if(r&&r.ok){ b.style.display='none'; $('msgLeido').textContent='✓ Lectura registrada.'; var bt=$('btnTest'); if(bt) bt.style.display='';
      var d=B.docs.find(function(x){return x.id===L.id;}); if(d) d.leido=true; MEM[L.id]={f:1,pag:L.pag,ts:Date.now()}; guarda(); tostada('¡Leído!');
      /* Abierto desde Mi desempeño: terminar la lectura cierra el pop-up y
         deja la pantalla de atrás al día. Javi, 22-nov-2026. */
      if(SOLO) setTimeout(function(){ avisaPadre('cp-doc-listo'); }, 900);
    } else { b.disabled=false; b.textContent='Ya lo leí';
      var falta=(r&&r.falta)||0; $('msgLeido').textContent=(r&&r.motivo)?r.motivo:('Todavía no: llevas '+Math.round(((r&&r.segundos)||0)/60*10)/10+' min y el mínimo es '+Math.round(((r&&r.minimo)||90)/60*10)/10+' min. Faltan '+Math.ceil(falta)+' s.'); }
  });
}
function modoScroll(){
  if(MODO==='scroll') return; MODO='scroll';
  var v=$('ventana'), t=$('texto'); v.style.overflowY='auto'; t.style.columnWidth='auto'; t.style.webkitColumnWidth='auto'; t.style.height='auto'; t.style.transform='none'; t.style.paddingBottom='28px';
  $('tIzq').style.display='none'; $('tDer').style.display='none';
  v.addEventListener('scroll',function(){ L.pag=v.scrollTop/Math.max(1,(v.scrollHeight-v.clientHeight)); coloca(true); });
}
function mide(){
  var v=$('ventana'), t=$('texto'), r=v.getBoundingClientRect();
  ANCHO=Math.round(r.width)||v.clientWidth; ALTO=Math.round(r.height)||v.clientHeight; if(!ANCHO||!ALTO) return false;
  if(MODO==='scroll'){ L.paginas=1; return true; }
  t.style.webkitColumnWidth=t.style.columnWidth=(ANCHO-44)+'px'; t.style.webkitColumnGap=t.style.columnGap='44px';
  var lh=TS*1.7, cabe=Math.max(6,Math.floor((ALTO-10)/lh)); t.style.height=Math.round(cabe*lh)+'px'; t.style.width='auto';
  L.paginas=Math.max(1,Math.round(t.scrollWidth/ANCHO));
  if(L.paginas<=1 && t.scrollHeight>t.clientHeight+16){ modoScroll(); L.paginas=1; }
  return true;
}
function coloca(desdeScroll){
  var doc=L.doc, f, pagTxt;
  var minTotal=(doc.palabras||0)/PPM;
  if(MODO==='scroll'){
    var v=$('ventana'); if(!desdeScroll) v.scrollTop=(L.pag||0)*Math.max(0,(v.scrollHeight-v.clientHeight));
    f=Math.max(0,Math.min(1,L.pag||0)); pagTxt=Math.round(f*100)+'%';
    $('lTiempo').textContent='⏱ quedan '+Math.max(0,Math.ceil(minTotal*(1-f)))+' min';
  } else {
    $('texto').style.transform='translateX('+(-L.pag*ANCHO)+'px)';
    f=L.paginas>1?L.pag/(L.paginas-1):1; pagTxt='pág. '+(L.pag+1)+' de '+L.paginas;
    var porPag=minTotal/Math.max(1,L.paginas-2); // sin portadilla ni página final
    var quedan=Math.max(0,minTotal*(1-f));
    $('lTiempo').textContent='⏱ ≈ '+(porPag<1?Math.max(10,Math.round(porPag*60))+' s':(Math.round(porPag*10)/10)+' min')+' por página · quedan '+(quedan<1?'menos de 1 min':Math.ceil(quedan)+' min');
  }
  $('lBar').style.width=Math.round(f*100)+'%'; $('lPct').textContent=Math.round(f*100)+'%'; $('lPag').textContent=pagTxt;
  var prev=MEM[L.id]||{}; MEM[L.id]={f:Math.max(f,(L.meta&&L.meta.leido)?1:0), pag:L.pag, ts:Date.now()}; if(prev.f>MEM[L.id].f && f<0.02) MEM[L.id].f=prev.f; guarda();
}
function pasa(d){
  if(MODO==='scroll'){ var v=$('ventana'); v.scrollBy({top:d*(v.clientHeight-60),behavior:'smooth'}); return; }
  var n=L.pag+d; if(n<0) return; if(n>L.paginas-1){ tostada('Llegaste al final'); return; }
  L.pag=n; coloca();
}
$('tIzq').onclick=function(){ $('panel').classList.remove('on'); pasa(-1); };
$('tDer').onclick=function(){ $('panel').classList.remove('on'); pasa(1); };
$('lAjustes').onclick=function(){ $('panel').classList.toggle('on'); };
$('lCerrar').onclick=function(){
  if(SOLO){ avisaPadre('cp-doc-cerrar'); return; }
  $('vLector').classList.remove('on'); if(FICHA) abreFicha(FICHA.id); else { pintaEstante(); muestra('vEstante'); } };
document.querySelectorAll('[data-ts]').forEach(function(b){ b.onclick=function(){ var f=L.paginas>1?L.pag/(L.paginas-1):0; TS=+b.dataset.ts; try{localStorage.setItem('bib.ts',TS);}catch(_){} aplicaTema(); pinta(true); requestAnimationFrame(function(){ requestAnimationFrame(function(){ L.pag=Math.round(f*(L.paginas-1)); coloca(); }); }); }; });
document.querySelectorAll('[data-tema]').forEach(function(b){ b.onclick=function(){ TEMA=b.dataset.tema; try{localStorage.setItem('bib.tema',TEMA);}catch(_){} aplicaTema(); }; });
var x0=null;
$('ventana').addEventListener('touchstart',function(e){ x0=e.touches[0].clientX; },{passive:true});
$('ventana').addEventListener('touchend',function(e){ if(x0==null) return; var dx=e.changedTouches[0].clientX-x0; x0=null; if(Math.abs(dx)>45){ $('panel').classList.remove('on'); pasa(dx<0?1:-1); } },{passive:true});
document.addEventListener('keydown',function(e){ if(!$('vLector').classList.contains('on')) return; if(e.key==='ArrowRight') pasa(1); if(e.key==='ArrowLeft') pasa(-1); if(e.key==='Escape') $('lCerrar').click(); });
window.addEventListener('resize',function(){ if($('vLector').classList.contains('on')) pinta(true); });

/* ---------- navegación ---------- */
function muestra(id){ ['vEstante','vFicha'].forEach(function(v){ $(v).classList.toggle('on',v===id); }); window.scrollTo(0,0); }
$('atras').onclick=function(){
  if($('vFicha').classList.contains('on')){ FICHA=null; pintaEstante(); muestra('vEstante'); return; }
  location.href='/apepe/biblioteca.html'+(EMBED?'?embed=1':'');
};

/* ---------- arranque: solo el equipo de la casa ---------- */
function puerta(){
  $('estanteWrap').innerHTML='<div class="gate"><div class="em">🔒</div><h2>Solo para el equipo de Casa Pepe</h2>'
    +'<p>Los procedimientos son documentos internos. Entra con tu cuenta de SoyPepe para leerlos.</p>'
    +'<a href="/soypepe/">Entrar a SoyPepe</a></div>';
}
if(!tok()){ puerta(); return; }
rpc('proc_biblioteca').then(function(r){
  if(!r||!r.docs){ puerta(); return; }
  B=r; B.areas=(r.areas||[]); B.areas.forEach(function(a){ AREAS[a.codigo]=a.nombre; });
  pintaEstante();
  var doc=QS.get('doc');
  if(doc && B.docs.some(function(d){return d.id===doc;})){
    var d=B.docs.find(function(x){return x.id===doc;});
    if(SOLO && d.texto){ abreLector(doc,false); }
    else { abreFicha(doc); if(d.texto) abreLector(doc,false); }
  }
});
})();
