<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="manifest" href="/apepe.webmanifest">
<link rel="apple-touch-icon" href="/img/apepe/apepe-app-180.png">
<link rel="icon" href="/img/apepe/apepe-app-192.png">
<title>Experiencias · Casa Pepe</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/sinc/img/sincretico-isotipo-64.png">
<link rel="stylesheet" href="/sinc/sinc.css">
<script src="/sinc/sinc-cargando.js"></script>
<script src="/apepe/resv.js"></script>
<script src="/apepe/marca.js"></script>
<script src="/apepe/idioma.js"></script>
<script>
/* Atajo al traductor de idioma.js. Si todavía no cargó, devuelve el español:
   nunca un hueco delante del huésped. */
function T(f){ try{ return window.apepeT ? window.apepeT(f) : f; }catch(e){ return f; } }
</script>
</head>
<body>
<!-- Aqui vivia una copia entera del escaparate de Sincretico. Dos paginas para
     lo mismo significa que cada cambio hay que hacerlo dos veces, y la segunda
     siempre se olvida: el huesped que entraba por la app de Casa Pepe llevaba
     dias viendo la version vieja. Ahora hay una sola pantalla, y esto solo
     lleva a ella sin perder de donde venia -la reserva, el QR del concierge-
     para que la app siga sabiendo volver a su sitio. -->
<div id="cargando"></div>
<script>
(function(){
  var p=new URLSearchParams(location.search);
  var q=new URLSearchParams();
  q.set('app','1');
  ['resv','sol','c','prueba','h'].forEach(function(k){
    var v=p.get(k); if(v)q.set(k,v);
  });
  /* Y si el hotel no venía en la liga, el que ya resolvió marca.js. */
  try{ var _m = window.apepeMarca && window.apepeMarca.marca();
       if(!q.get('h') && _m && _m.slug) q.set('h', _m.slug); }catch(_){}
  try{ sincCargando.monta('cargando',{pie:T('Abriendo las experiencias…')}); }catch(_){}
  location.replace('/sinc/index.html?'+q.toString());
})();
</script>
</body>
</html>
