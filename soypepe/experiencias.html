<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Experiencias · Casa Pepe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#F4F1EA;--card:#FFFFFF;--line:#E2DCCF;--txt:#1F1B16;--muted:#6B6459;--gold:#8A6C31;--accent:#137A56;--bad:#9E3B2E;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;max-width:460px;margin:0 auto;box-shadow:0 0 40px rgba(31,27,22,.10)}
  .wrap{padding:calc(10px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
  .soon{display:flex;align-items:center;gap:8px;background:#F3EAD6;border:1px dashed #8C6212;color:#8C6212;font-size:12.5px;padding:9px 12px;border-radius:11px;margin-bottom:14px;opacity:.85}
  .soon b{color:var(--gold)}
  h1{font-size:23px;margin:4px 0 2px;letter-spacing:.2px}
  h1 .it{font-style:italic;color:var(--gold);font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
  .grid{display:flex;flex-direction:column;gap:9px}
  /* Tarjeta de fila: miniatura a la izquierda, el bono a la vista. Es la forma
     del mockup — el recepcionista barre la lista de un vistazo, no ve pósters. */
  .exp{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;cursor:pointer;transition:transform .12s;display:flex;gap:11px;align-items:flex-start}
  .exp:active{transform:scale(.985)}
  .exp .ph{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:9px;
    background:linear-gradient(135deg,#8A7A5C,#6E5F45);background-size:cover;background-position:center;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .exp .ph .ic{font-size:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .exp .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
  .exp .cuerpo{min-width:0;flex:1}
  .exp h3{margin:0;font-size:14.5px;font-weight:800;color:var(--txt);line-height:1.2}
  .exp .l{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .exp .pre{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .exp .pvp{color:var(--txt);font-weight:800;font-size:15px}
  .exp .bono{font-size:11.5px;font-weight:800;color:#1D6B4A;background:#E1F0E7;
    border:1px solid #1D6B4A;border-radius:999px;padding:2px 9px}
  .exp .bono.pend{color:#8C6212;background:#F3EAD6;border-color:#8C6212;font-weight:700}
  .exp .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  /* Rótulo de grupo: cuándo sale, que es como se pregunta de verdad. */
  .grh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:800;margin:14px 2px 8px}
  .grh:first-child{margin-top:2px}
  /* ---- Listados horizontales (home del Concierge) ---- */
  .rowh{display:flex;align-items:baseline;gap:8px;margin:16px 2px 8px}
  .rowh b{font-size:14.5px;font-weight:800;color:var(--txt)}
  .rowh .n{font-size:11.5px;color:var(--muted);font-weight:700}
  .hscroll{display:flex;gap:11px;overflow-x:auto;padding:1px 16px 10px;margin:0 -16px;scroll-snap-type:x proximity;scrollbar-width:none}
  .hscroll::-webkit-scrollbar{display:none}
  .hcard{flex:0 0 auto;width:158px;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .12s;scroll-snap-align:start}
  .hcard:active{transform:scale(.98)}
  .hcard .ph{position:relative;height:98px;background:linear-gradient(135deg,#8A7A5C,#6E5F45);display:flex;align-items:center;justify-content:center}
  .hcard .ph .ic{font-size:30px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .hcard .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .hcard .cu{padding:8px 10px 11px}
  .hcard h4{margin:0;font-size:12.5px;font-weight:800;line-height:1.2;max-height:30px;overflow:hidden}
  .hcard .l{display:block;font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hcard .pv{font-size:13.5px;font-weight:800;margin-top:6px}
  .hcard .bo{display:inline-block;font-size:10.5px;font-weight:800;color:#1D6B4A;background:#E1F0E7;border:1px solid #1D6B4A;border-radius:999px;padding:1px 7px;margin-top:5px}
  .fav{position:absolute;top:6px;right:6px;z-index:3;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.42);border:0;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
  .fav.on{color:#FFC93C}
  .exp .ph .fav{width:24px;height:24px;top:3px;right:3px;font-size:12px}
  .favhint{flex:0 0 auto;width:220px;display:flex;align-items:center;background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:12.5px;color:var(--muted);line-height:1.4;scroll-snap-align:start}
  .favhint b{color:var(--gold)}
  /* ---- Barra y hoja de filtros ---- */
  .fbar{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 12px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .fbar::-webkit-scrollbar{display:none}
  .fbtn{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--gold);border:1px solid var(--gold);color:#fff;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .fchip{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
  #fCard{padding:18px 16px calc(18px + var(--safe-b))}
  .fhdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .fhdr b{font-size:19px}
  .fhdr .x{width:34px;height:34px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:19px;cursor:pointer;color:var(--txt)}
  .fbody{padding:6px 0 4px}
  .flbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:800;margin:14px 0 8px}
  .flbl b{color:var(--txt);text-transform:none;letter-spacing:0}
  .fset{display:flex;gap:8px;flex-wrap:wrap}
  .fo{padding:9px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--txt);font-size:13.5px;font-weight:700;cursor:pointer}
  .fo.on{background:var(--txt);border-color:var(--txt);color:#fff}
  input[type=range]{accent-color:var(--gold);margin-top:6px}
  .ffoot{display:flex;gap:10px;margin-top:18px}
  .ffoot .bsec{margin:0;flex:0 0 38%}
  .ffoot .bpri{margin:0;flex:1}
  /* ---- Guía / protagonista en la ficha ---- */
  .guia{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px}
  .guia .gf{flex:0 0 auto;width:58px;height:58px;border-radius:50%;overflow:hidden;background:#EDE6D6;display:flex;align-items:center;justify-content:center;border:1px solid var(--line)}
  .guia .gf img{width:100%;height:100%;object-fit:cover}
  .guia .gf .gi{font-size:26px}
  .guia .gc{min-width:0}
  .guia .gn{font-size:15px;font-weight:800}
  .guia .gm{font-size:12px;color:var(--muted);margin-top:1px}
  .guia .gq{font-size:13px;color:#4E4638;font-style:italic;margin-top:6px;line-height:1.4}
  .guia .gp{font-size:12px;color:var(--muted);margin-top:6px}
  .guia .gp b{color:var(--txt)}
  .gacc{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
  .gbtn{flex:1;min-width:120px;text-align:center;padding:10px 12px;border-radius:11px;border:1px solid var(--accent);background:var(--card);color:var(--accent);font:inherit;font-size:13px;font-weight:800;cursor:pointer;text-decoration:none}
  .gbtn.wa{background:var(--accent);color:#fff;border-color:var(--accent)}
  .gbtn:disabled{opacity:.6}
  /* ---- Tarjeta de evento (fila de Virreyes) ---- */
  .hcard .ph.evt{background:linear-gradient(135deg,#5B57A6,#403c7a)}
  /* ---- Sub-navegación del Concierge (Experiencias · Boletos · Restaurantes) ---- */
  .cnav{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:0 0 14px}
  .cnav button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;font-size:13.5px;font-weight:800;padding:10px 6px;border-radius:9px;cursor:pointer}
  .cnav button.on{background:var(--gold);color:#fff}
  .exp .ph.bol{background:linear-gradient(135deg,#B5483B,#8a3328)}
  .exp .ph.rst{background:linear-gradient(135deg,#1D6B4A,#15503a)}
  .exp .tipo{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .exp .imp{font-size:11px;color:#8C6212;font-weight:800}
  .exp .rate{font-size:11.5px;color:#8C6212;font-weight:800}
  .michb{display:inline-flex;align-items:center;gap:2px;vertical-align:-3px}
  .michb .micon{height:15px;width:auto;display:block}
  .cats .chip.mich{border-color:#BA0C2F;color:#BA0C2F}
  .cats .chip.mich.on{background:#BA0C2F;border-color:#BA0C2F;color:#fff}
  .rgal{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:0 16px;scrollbar-width:none}
  .rgal::-webkit-scrollbar{display:none}
  .rgal img{height:120px;border-radius:10px;flex:0 0 auto;border:1px solid var(--line)}
  .rcred{font-size:10.5px;color:var(--muted);opacity:.8;margin:-6px 0 12px}
  .qr2{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
  .qcol{display:flex;flex-direction:column;align-items:center;gap:6px}
  .qt{font-size:12px;font-weight:800;color:var(--txt)}
  .qtabs{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;margin-top:12px}
  .qtabs .qtab{display:inline-flex;align-items:center;gap:7px;padding:9px 18px;border:0;background:var(--card);color:var(--muted);font:inherit;font-size:13.5px;font-weight:800;cursor:pointer}
  .qtabs .qtab.on{background:var(--gold);color:#fff}
  .qtabs .qtab svg{display:block}
  .sheet .hero.foto::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.72) 100%)}
  .sheet .hero>*{position:relative;z-index:1}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty b{color:var(--gold)}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .card{background:var(--bg);width:100%;max-width:460px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--line)}
  .sheet .hero{position:relative;height:200px;background:linear-gradient(135deg,#8A7A5C,#6E5F45);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:16px}
  /* El bono va tapado: esta ficha se le enseña al huésped. */
  .mibono{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);
    border:1px dashed #1D6B4A;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px}
  .mibono .l{color:var(--muted)}
  .mibono .v{color:#1D6B4A;font-weight:800;letter-spacing:.16em}
  .mibono button{background:none;border:1px solid #1D6B4A;color:#1D6B4A;border-radius:999px;
    font:inherit;font-size:11.5px;font-weight:700;padding:3px 11px;cursor:pointer}
  .gymbtn{width:100%;display:flex;align-items:center;gap:10px;background:#EEEDF7;border:1px solid #5B57A6;
    color:#443F8F;border-radius:13px;padding:12px 14px;font:inherit;font-size:13.5px;font-weight:700;
    cursor:pointer;margin-bottom:12px;text-align:left;text-decoration:none}
  .gymbtn .ch{margin-left:auto;opacity:.7}
  .gymbtn .ss{display:block;font-weight:400;font-size:11.5px;color:#6B67A6;margin-top:2px}
  .sheet .hero .ic{position:absolute;top:14px;left:16px;font-size:40px}
  .sheet .hero .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:20px;cursor:pointer}
  .sheet .hero h2{margin:0;color:#fff;font-size:21px;text-shadow:0 2px 12px rgba(0,0,0,.7);line-height:1.15}
  .sheet .body{padding:16px}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;color:var(--txt)}
  .pill b{color:var(--gold)}
  .story{color:#4E4638;font-size:14px;line-height:1.5;margin:0 0 14px}
  /* Lo que se suelta de memoria al vender: duración, hora, dónde y qué incluye. */
  .deuna{background:var(--card);border:1px solid var(--line);border-radius:12px;
         padding:9px 11px;margin:0 0 12px}
  .deuna .du{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--txt)}
  .deuna .du span{white-space:nowrap}
  .deuna .du b{font-weight:400;opacity:.75}
  .deuna .inc{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);
              font-size:12.5px;color:#4E4638;line-height:1.45}
  .deuna .inc b{text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;
                color:var(--muted);margin-right:5px}
  .masinfo{display:flex;align-items:center;gap:8px;width:100%;margin:0 0 14px;cursor:pointer;
           background:none;border:0;border-bottom:1px solid var(--line);padding:0 0 11px;
           font:inherit;font-size:13.5px;font-weight:700;color:#1D6B4A;text-align:left}
  .masinfo span{font-weight:400;font-size:12px;color:var(--muted)}
  .masinfo::after{content:"›";margin-left:auto;font-size:18px;color:var(--muted)}
  /* El pop up de la ficha completa de Sincrético. */
  .sincw{position:fixed;inset:0;z-index:95;background:rgba(0,0,0,.6);display:none;
         align-items:flex-end;justify-content:center}
  .sincw.show{display:flex}
  .sincw .sincc{background:var(--bg);width:100%;max-width:460px;height:94vh;
                border-radius:22px 22px 0 0;overflow:hidden;display:flex;flex-direction:column}
  .sincw .sinch{display:flex;align-items:center;gap:10px;padding:12px 14px;
                border-bottom:1px solid var(--line);flex:0 0 auto}
  .sincw .sinch b{font-size:14px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;
                  white-space:nowrap}
  .sincw .sinch .x{margin-left:auto;width:32px;height:32px;border-radius:50%;flex:0 0 auto;
                   background:var(--card);border:1px solid var(--line);font-size:19px;cursor:pointer;
                   color:var(--txt);line-height:1}
  .sincw iframe{flex:1 1 auto;width:100%;border:0;background:var(--bg)}
  .blk{margin-bottom:12px}
  .blk .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px;font-weight:700}
  /* Antes el cuerpo de cada bloque era texto suelto y sólo «Importante» iba en
     tarjetas: la ficha se leía como dos fichas distintas. Ahora todos los
     bloques se apoyan en el mismo papel. */
  .blk .c{font-size:13.5px;color:var(--txt);line-height:1.45;white-space:pre-wrap;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:10px;padding:9px 11px}
  /* El trato: lo que paga el huésped y lo que te queda a ti, uno debajo de otro. */
  .trato{display:flex;flex-direction:column;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .trato div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    background:var(--card);padding:9px 11px;font-size:13.5px}
  .trato div b{font-weight:800;color:var(--gold)}
  .trato div span.l{color:var(--muted)}
  .trato .tuyo b{color:#1D6B4A}
  /* "Importante" venía como un muro de texto. Va en viñetas, con el rótulo en
     negrita y un icono que se adivina por el tema. */
  .imp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .imp li{display:flex;gap:9px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;
    padding:9px 11px;font-size:13px;line-height:1.42;color:var(--txt)}
  .imp li .em{flex:0 0 auto;font-size:15px;line-height:1.2}
  .imp li b{color:var(--txt);font-weight:800}
  .imp li.alto{border-left-color:var(--bad);background:#FAF0EE}
  .sell{margin-top:6px;background:#E1F0E7;border:1px solid #1D6B4A;border-radius:16px;padding:16px;text-align:center}
  .sell .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#1D6B4A;font-weight:700;margin-bottom:4px}
  .sell .who{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sell .who b{color:var(--txt)}
  .sell .qr{display:inline-block;background:#fff;padding:10px;border-radius:12px}
  .sell .qr canvas,.sell .qr img{display:block}
  .sell .link{margin-top:12px;background:#F7FBF9;border:1px solid #1D6B4A;border-radius:10px;padding:10px;font-size:12px;color:#1D6B4A;word-break:break-all}
  .sell .copy{margin-top:10px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
  .sell .demo{margin-top:9px;font-size:11.5px;color:#8C6212;opacity:.85}
  /* ---- Flujo de venta (beta) ---- */
  .paso{display:flex;gap:6px;margin-bottom:14px}
  .paso i{flex:1;height:3px;border-radius:999px;background:var(--line)}
  .paso i.on{background:var(--accent)}
  .campo{margin-bottom:11px}
  .campo>label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .campo input,.campo select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit}
  .step{display:flex;align-items:center;justify-content:space-between;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:11px}
  .step .lb{font-size:13px;font-weight:700}
  .step .lb span{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .step .ct{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .step .bt{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    font-size:17px;line-height:1;color:var(--accent);font-weight:800;cursor:pointer}
  .step .bt:disabled{opacity:.35;cursor:default}
  .step .n{font-weight:800;min-width:18px;text-align:center;font-size:15px}
  .res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .res .r{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .res .r.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:15px}
  .res .r .tach{color:var(--muted);text-decoration:line-through;font-size:12px;margin-right:6px}
  .res .r.oc{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;color:var(--muted)}
  .res .r.oc .v{color:#1D6B4A;font-weight:800;letter-spacing:.16em}

<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const params=new URLSearchParams(location.search);
/* «2026-10-02 10:30» no le dice nada a nadie y además no cabe en la tarjeta:
   salía cortado con puntos suspensivos. El que vende piensa en hoy, mañana o el
   día de la semana. */
var DIAS_SEM=['domingo','lunes','martes','mi\u00e9rcoles','jueves','viernes','s\u00e1bado'];
function cuandoSale(fecha, hora){
  var h = hora ? String(hora).slice(0,5) : '';
  try{
    var d = new Date(String(fecha).slice(0,10)+'T12:00:00');
    if(isNaN(d)) return String(fecha)+(h?(' '+h):'');
    var hoy = new Date(); hoy.setHours(12,0,0,0);
    var dias = Math.round((d-hoy)/86400000);
    var txt = dias===0 ? 'hoy'
            : dias===1 ? 'ma\u00f1ana'
            : (dias>1 && dias<7) ? ('el '+DIAS_SEM[d.getDay()])
            : ('el '+DIAS_SEM[d.getDay()]+' '+d.getDate());
    return txt + (h?(' a las '+h):'');
  }catch(e){ return String(fecha)+(h?(' '+h):''); }
}
const REF=(params.get('ref')||params.get('nombre')||'PEPE').toString();
/* Los tours que sí tienen banco de preguntas propio. Se pide una vez; hasta que
   llegue, la ficha no pinta el botón del Gym -mejor no ofrecerlo que ofrecerlo
   roto-. */
var GYMS={};
fetch(SB_URL+'/rest/v1/rpc/pq_tours_con_gym',{method:'POST',
  headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},
  body:'{}'})
  .then(function(r){ return r.ok?r.json():[]; })
  .then(function(a){ (a||[]).forEach(function(x){ GYMS[x]=1; }); })
  .catch(function(){});
const REF_NICE=(params.get('nombre')||REF);
const PROP=(params.get('prop')||'').trim();

const ICON={'Tours':'🗺️','Meet at Casa':'🏠','Tiendita':'🧺','Lavandería':'🫧'};
let DATA=[], VENTAS={}, VENTAS_TOT=0, EVENTOS=[];
let BOLETOS=[], BOL_LOADED=false, REST=[], REST_LOADED=false, RESTF='', RESTSUB='';

/* Favoritos del que vende: se marcan con la estrella y viven en este teléfono,
   por código de vendedor (no hay aún tabla de favoritos del colaborador). Es la
   fuente que faltaba para el listado "Mis favoritos"; cuando exista tabla, se
   cambia esta capa por ella sin tocar el render. */
const FAV_KEY='cp_favs_'+REF;
function loadFavs(){ try{ return new Set(JSON.parse(localStorage.getItem(FAV_KEY)||'[]')); }catch(e){ return new Set(); } }
let FAVS=loadFavs();
function saveFavs(){ try{ localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); }catch(e){} }
function toggleFav(id){ if(!id) return; if(FAVS.has(id)) FAVS.delete(id); else FAVS.add(id); saveFavs(); renderRows(); render(); }
function favBtn(t){ const on=FAVS.has(t.id); return '<button class="fav'+(on?' on':'')+'" data-fav="'+esc(t.id)+'" title="'+(on?'Quitar de favoritos':'Guardar en favoritos')+'">'+(on?'★':'☆')+'</button>'; }
// Favoritos de RESTAURANTES del concierge (localStorage, por vendedor).
const FAVR_KEY='cp_favr_'+REF;
function loadFavr(){ try{ return new Set(JSON.parse(localStorage.getItem(FAVR_KEY)||'[]')); }catch(e){ return new Set(); } }
let FAVR=loadFavr();
function saveFavr(){ try{ localStorage.setItem(FAVR_KEY, JSON.stringify([...FAVR])); }catch(e){} }
function toggleFavR(id){ if(!id) return; if(FAVR.has(id)) FAVR.delete(id); else FAVR.add(id); saveFavr(); renderRest(); }
function favBtnR(r){ const on=FAVR.has(r.id); return '<button class="fav'+(on?' on':'')+'" data-favr="'+esc(r.id)+'" title="'+(on?'Quitar':'Guardar')+'">'+(on?'★':'☆')+'</button>'; }
// Dos niveles igual que el mapa de huéspedes (Javi, 1-oct): Comida es la sombrilla
// de comer, con Cocina Global, Cafés y Desayunos y Michelin como subfiltros. Multi-cat.
var RGRUPOS=[
  {key:'comida', n:'Comida', tipos:['tacos','fancy','veggie','cafe'], cats:['global'], mich:true,
    subs:[ {t:'tacos'}, {t:'fancy'}, {t:'veggie'}, {t:'cafe'},
           {cat:'global', lab:'Cocina Global'},
           {mich:'dos'}, {mich:'una'}, {mich:'verde'}, {mich:'bib'}, {mich:'lista'} ]},
  {key:'bebida', n:'Bebida', tipos:['fun']}
];
var MICHR={dos:'★★', una:'★', verde:'🌿', bib:'Bib', lista:'◆'};
function rTieneCat(r,k){ return (r.categorias||[]).indexOf(k)>=0; }
function rEnGrupo(r,G){
  if(!G) return true;
  if(G.tipos&&G.tipos.indexOf(r.tipologia)>=0) return true;
  if(rTieneCat(r,G.key)) return true;
  if(G.cats&&G.cats.some(function(c){return rTieneCat(r,c);})) return true;
  if(G.mich&&r.michelin&&r.michelin.length) return true;
  return false;
}
function rEnSub(r,code){
  if(!code) return true;
  if(code.slice(0,2)==='m:') return !!(r.michelin&&r.michelin.indexOf(code.slice(2))>=0);
  if(code.slice(0,2)==='c:') return rTieneCat(r,code.slice(2));
  return r.tipologia===code;
}
function rNombreTipo(code){ var f=REST.filter(function(r){return r.tipologia===code;})[0]; return f?f.tipologia_nombre:code; }
function micoR(src,alt){ return '<img class="micon" src="/img/michelin/'+src+'" alt="'+(alt||'')+'" loading="lazy">'; }
function restMich(r){
  if(!r.michelin||!r.michelin.length) return '';
  var out='';
  if(r.michelin.indexOf('dos')>=0) out+=micoR('star.png','★')+micoR('star.png','★');
  else if(r.michelin.indexOf('una')>=0) out+=micoR('star.png','★');
  if(r.michelin.indexOf('verde')>=0) out+=micoR('green.png','Verde');
  if(!out && r.michelin.indexOf('bib')>=0) out+=micoR('bib.png','Bib');
  return out?'<span class="michb">'+out+'</span>':'';
}

/* Servicios de la casa que no son tours y por tanto no están en la tabla `tours`.
   Van aquí hasta que tengan su propio catálogo: una categoría vacía se lee como
   una app rota, y la lavandería ya tiene precio y horario acordados. */
/* Bono del que vende: en artesanía es el 10% de la pieza; en lavandería, el 25%. */
const BONO_PCT={'Tiendita':0.10,'Lavandería':0.25};
const bonoDe=(cat,pvp)=>Math.round((Number(pvp)||0)*(BONO_PCT[cat]||0));

/* La colección Xika se fue de aquí. La artesanía ahora se vende en la
   tienda de la app del huésped -/apepe/tienda.html, con el motor de pedido a
   la habitación-, leyendo arte_productos y arte_artesanas: un solo sitio con
   los precios, las fotos y los artesanos, en vez de una semilla a mano aquí
   que se quedaba vieja. Lo que este catálogo vende es experiencias y
   servicios. Javi, 1-oct. */
const SERVICIOS=[{
  id:'srv-lavanderia', cat:'Lavandería', slug:'lavanderia',
  nombre:'Lavado por carga (hasta 3 kg)',
  pvp:80, prueba:true, bono_mxn:bonoDe('Lavandería',80),
  storytelling:'Lava, seca y dobla. Precio de prueba mientras se ve cuánto sale de verdad.',
  incluye:'Lavado, secado y doblado de una carga de hasta 3 kg.',
  lugar_inicio:'Se entrega en recepción',
  fechas_salida:'Se recibe de 7:00 a 12:00 · se devuelve la misma tarde a partir de las 18:00',
  info_importante:'Si la ropa llega después de las 12:00 pasa al día siguiente. No hay cupo ni reserva: se recibe y se anota. El bono del que la levanta es el 25%.'
}];

function catOf(t){
  if(t.cat) return t.cat;
  const nm=(t.nombre||'').toLowerCase();
  const li=(t.lugar_inicio||'').toLowerCase();
  // Grupos/eventos ya no es categoría propia (Javi 1-oct): caen en Meet at Casa o Tours.
  if(/c[oó]smica|terraza|taller|challenge|mezcalit|tortilla a mano/.test(nm+' '+li)) return 'Meet at Casa';
  return 'Tours';
}
function money(v){ if(v==null||v==='') return null; const n=Number(v); if(isNaN(n)) return null; return n===0?'Gratis':('$'+n.toLocaleString('es-MX')); }
function dur(m){ if(!m) return null; const h=Math.floor(m/60), mm=m%60; return ((h?h+'h':'')+(mm?(' '+mm+'m'):'')).trim() || (m+'m'); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
/* Misma ruta rota que el QR de venta: /x/ no existe en casapepe.mx. Y con
   `slug` vacío acababa en «/x/experiencia», que ni siquiera identifica el tour. */
function bookingLink(t){
  return 'https://casapepe.mx/sincretico/exp.html?id='+encodeURIComponent(t.id)
    + (REF && REF!=='PEPE' ? '&c='+encodeURIComponent(REF) : '');
}

/* ---------- "Importante", legible ----------
   El campo trae de todo: avisos de verdad para el huésped mezclados con notas
   internas de auditoría (costeo, apartado de Turitop, sellos de fecha). Al que
   está vendiendo sólo le sirve lo primero, así que lo demás se descarta y el
   resto se pinta en viñetas con su icono. */

// Lo que NUNCA se le enseña a quien vende: proceso, precios internos, pendientes.
const IMP_FUERA=/turitop|cloudbeds|product_id|\bsku\b|costeo|comisi[oó]n|apartado|\bpvp\b|paso \d|pendiente antes de vender|regla del metro|en base figuraba|se corrige a|sin confirmar|inconsistente|^\s*\[|movilidad:.*%|pregunta viva|^\s*ruta:/i;

const IMP_ICONO=[
  [/calzado|zapato|tenis|bota|suela/i,'🥾'],
  [/protector solar|sombrero|gorra|el sol quema/i,'🧴'],
  [/agua|hidrat|deshidrat/i,'💧'],
  [/lluvia|impermeable|temporada de lluvias|clima/i,'🌧️'],
  [/altitud|altura|m\s*s\.?\s*n\.?\s*m|desnivel|cumbre|monta[ñn]a|volc[aá]n/i,'⛰️'],
  [/m[eé]dic|alergia|asma|diabetes|embarazo|cardiopat|respiratori|ficha m/i,'🩺'],
  [/edad m[ií]nima|identificaci[oó]n|18 a[ñn]os|mayor de edad/i,'🪪'],
  [/efectivo|no aceptan tarjeta|cajero/i,'💵'],
  [/propina/i,'🤝'],
  [/hora de retorno|puntual|salida en|se da la vuelta|retorno pactad/i,'⏰'],
  [/silla de ruedas|no apta|no apto|accesib|movilidad reducida/i,'♿'],
  [/foto|fotograf|permiso.*imagen/i,'📷'],
  [/seguro|p[oó]liza/i,'🛡️'],
  [/emergencia|911|protecci[oó]n civil|cenapred|sem[aá]foro/i,'🚨'],
  [/registro|caseta|parque nacional|cuota de acceso/i,'📋'],
  [/alcohol|beber|trago|margarita|cata|destilado/i,'🍹'],
  [/menores|ni[ñn]os/i,'🧒'],
  [/comida|alimento|intolerancia|vegetarian/i,'🍽️']
];
const IMP_ALTO=/no apto|no apta|obligatori|nunca|no se promete|no se sale|prohibid|riesgo/i;

function impIcono(s){ for(const [re,em] of IMP_ICONO) if(re.test(s)) return em; return '▸'; }

function impPartes(txt){
  return String(txt||'')
    .split(/\s*\|\|\s*|\n+|(?=\s\d{1,2}\)\s)/)      // separadores del campo
    .map(x=>x.replace(/^\s*\d{1,2}\)\s*/,'').trim())
    .filter(x=>x.length>3 && !IMP_FUERA.test(x))
    // Los párrafos largos se parten en frases para que quepan en una viñeta.
    .flatMap(x=> x.length>190 ? x.split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚÑ])/) : [x])
    .map(x=>x.trim()).filter(x=>x.length>3 && !IMP_FUERA.test(x));
}

function blkImp(val){
  const partes=impPartes(val);
  if(!partes.length) return '';
  return '<div class="blk"><div class="t">Importante</div><ul class="imp">'
    + partes.map(p=>{
        // El rótulo inicial en mayúsculas o antes de ':' se pone en negrita.
        const m=p.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{2,28})[:.—-]\s*(.+)$/);
        const cuerpo = m
          ? '<b>'+esc(m[1].trim().replace(/\s+/g,' '))+'.</b> '+esc(m[2])
          : esc(p).replace(/^([^:]{3,34}):\s/,'<b>$1:</b> ');
        return '<li class="'+(IMP_ALTO.test(p)?'alto':'')+'"><span class="em">'+impIcono(p)+'</span><span>'+cuerpo+'</span></li>';
      }).join('')
    + '</ul></div>';
}

// Sede: SoyPepe pasa ?prop (UUID). sinc_catalogo trae ciudad en texto.
function ciudadDeProp(){ return PROP==='febfbef6-7fd1-4b45-84d9-13533e8dcb72'?'Puebla':(PROP==='45e69775-d877-4507-a9e1-a45bd3400dc5'?'CDMX':null); }

/* Catálogo VIVO de Sincrético: sinc_catalogo trae todas las experiencias (propias y de
   touroperadores), con foto (portada), precio y filtro por ciudad. El BONO del vendedor y
   la ficha rica (storytelling, incluye) se cruzan por NOMBRE con v_concierge_tours, porque
   los ids de las dos fuentes no casan. Antes esto leía la tabla `tours` (lista vieja, sin
   touroperadores) — Javi pidió apuntarlo al catálogo vivo (1-oct). */
async function load(){
  const ciudad=ciudadDeProp();
  let cat=[], vct={};
  try{
    /* La sede la decide la base, no esta pantalla: sinc_catalogo_sede devuelve
       sólo lo publicado de la ciudad que se pida. Si no sabemos de qué hotel
       viene (sin ?prop), se le pasa null y ve todas. */
    const r=await fetch(SB_URL+'/rest/v1/rpc/sinc_catalogo_sede',{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_dias:30,p_ciudad:ciudad,p_prueba:false})});
    cat = r.ok ? (await r.json()) : [];
  }catch(e){ cat=[]; }
  try{
    const rb=await fetch(SB_URL+'/rest/v1/v_concierge_tours?select=nombre,slug,bono_colaborador_mxn,storytelling,incluye,no_incluye,info_importante,lugar_inicio,fechas_salida,touroperador,idiomas,duracion_min,protagonista,guia_id,guia_nombre,guia_foto,guia_bio,guia_idiomas,guia_anios,guia_frase,guia_airbnb',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(rb.ok){ (await rb.json()).forEach(x=>{ if(x.nombre) vct[x.nombre.trim().toLowerCase()]=x; }); }
  }catch(e){}
  // Guías por experiencia — v_exp_guias_publica es anon-readable y casa por experiencia_id (= id
  // del catálogo). Trae nombre, foto, Instagram y descripción pública. El teléfono/WhatsApp NO
  // viaja aquí: vive en `guias` (solo authenticated) y se pide por clic (window.cpGuiaWa).
  let GEXP={};
  try{
    const rg=await fetch(SB_URL+'/rest/v1/v_exp_guias_publica?select=experiencia_id,orden,guia_id,nombre,foto_url,instagram,descripcion_publica,vinculo&order=experiencia_id,orden',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(rg.ok){ (await rg.json()).forEach(x=>{ if(!x.experiencia_id) return; (GEXP[x.experiencia_id]=GEXP[x.experiencia_id]||[]).push(x); }); }
  }catch(e){}
  /* La ficha pública de Sincrético, la misma que lee /sinc/exp.html. Casa por ID
     con el catálogo (no por nombre, como v_concierge_tours), así que cubre también
     las experiencias de touroperador que no están en la lista vieja — que eran
     justo las que salían sin duración, sin hora y sin qué incluye. De aquí vienen
     el objetivo del tour (fin_teleologico), la hora de salida y el incluye. */
  let FPUB={};
  try{
    const rp=await fetch(SB_URL+'/rest/v1/v_exp_publica?select=id,resumen,fin_teleologico,incluye,no_incluye,horas,horas_fin,cer_inicio_lugar,cancelacion,que_llevar,edad_minima,idiomas,cupo_max,cobro_dividido,anticipo_adulto',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(rp.ok){ (await rp.json()).forEach(x=>{ if(x.id) FPUB[x.id]=x; }); }
  }catch(e){}
  /* El filtro de ciudad ya viene hecho de la base; aquí no se repite. */
  DATA = cat.map(c=>{
    const v=vct[(c.nombre||'').trim().toLowerCase()]||{};
    const f=FPUB[c.id]||{};
    const pvp=(c.pvp_promo!=null?c.pvp_promo:c.pvp_adulto);
    const horas=(Array.isArray(c.horas)&&c.horas.length)?c.horas:(Array.isArray(f.horas)?f.horas:[]);
    const diash=(Array.isArray(c.dias)?c.dias.join(', '):'')+(horas.length?(' '+horas.join(', ')):'');
    const fecha=c.proxima_fecha?('Sale '+cuandoSale(c.proxima_fecha,c.proxima_hora)):'';
    /* `incluye` llega como lista en la ficha pública y como texto en la vieja.
       Se normaliza a texto para pintarlo en una línea. */
    const inc = Array.isArray(f.incluye) ? f.incluye.filter(Boolean).join(' · ')
              : (f.incluye || v.incluye || '');
    /* Hay tres tours sin duración cargada que la ficha pública sí sabe mostrar,
       porque la saca de la hora de inicio y la de fin. Se hace igual aquí: si las
       dos pantallas calculan distinto, acaban diciendo cosas distintas. */
    const mins = h => { const m=/^(\d{1,2}):(\d{2})/.exec(String(h||'')); return m?(+m[1]*60 + +m[2]):null; };
    let durMin = c.duracion_min || v.duracion_min || null;
    if(!durMin && Array.isArray(f.horas) && Array.isArray(f.horas_fin) && f.horas[0] && f.horas_fin[0]){
      const a=mins(f.horas[0]), z=mins(f.horas_fin[0]);
      if(a!=null && z!=null) durMin = (z>a ? z-a : (24*60-a)+z);  // cruza medianoche
    }
    return {
      id:c.id, nombre:c.nombre, slug:(v.slug||''),
      pvp:pvp, foto_url:(c.portada||null),
      duracion_min:durMin,
      idiomas:(Array.isArray(c.idiomas)?c.idiomas.join(', '):(c.idiomas||v.idiomas||'')),
      lugar_inicio:(v.lugar_inicio||f.cer_inicio_lugar||c.salida_desde||''),
      horas:horas,
      dias_horario:diash, fechas_salida:fecha, proxima_fecha:(c.proxima_fecha||''),
      tipologia:(c.tipologia||''), barrio:(c.barrio||''), categoria:(c.categoria||''),
      storytelling:(v.storytelling||c.resumen||''),
      /* El objetivo del tour, que es lo que Javi quiere que cuente el que vende:
         para qué sirve esta experiencia, no sólo qué se hace. Si no está escrito,
         cae al resumen para no dejar el hueco. */
      objetivo:(f.fin_teleologico||''),
      incluye:inc, no_incluye:(Array.isArray(f.no_incluye)?f.no_incluye.filter(Boolean).join(' · '):(f.no_incluye||'')),
      politica_cancelacion:(f.cancelacion||''), que_llevar:(Array.isArray(f.que_llevar)?f.que_llevar.filter(Boolean).join(' · '):(f.que_llevar||'')),
      info_importante:(v.info_importante||''),
      personas_max:(c.cupo_max||f.cupo_max||null),
      bono_mxn:(v.bono_colaborador_mxn!=null?Math.round(Number(v.bono_colaborador_mxn)):null),
      operador:(c.operador||v.touroperador||null),
      /* Cobro dividido: el huésped paga ahora sólo nuestra comisión y liquida
         el resto al operador al llegar. Quien vende tiene que saberlo antes de
         soltar el precio. */
      cobro_dividido:!!f.cobro_dividido, anticipo_adulto:(f.anticipo_adulto!=null?Number(f.anticipo_adulto):null),
      protagonista:(v.protagonista||''),
      guias:(GEXP[c.id]||[])
    };
  });
  DATA=DATA.concat(SERVICIOS);
  // Eventos de Virreyes a la venta (vista pública segura v_concierge_eventos: sólo futuros
  // y no-borrador). Hoy están en borrador, así que la fila no aparece hasta que se publiquen.
  try{ const re=await fetch(SB_URL+'/rest/v1/v_concierge_eventos?select=*&order=fecha_inicio',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}); EVENTOS = re.ok ? (await re.json()) : []; }catch(e){ EVENTOS=[]; }
  renderFbar(); renderRows(); render();
  try{ document.getElementById('todoh').style.display=''; }catch(e){}
  // "Top 7 mas vendidos": v_sinc_ventas esta protegida por RLS (no se lee con la
  // llave publica, y asi debe ser). Falta una vista agregada segura -solo nombre
  // y conteo- para encender la fila sin exponer el libro de ventas. Hasta
  // entonces no se llama, para no dejar un 401 en cada carga. loadVentas() queda
  // lista para apuntarla a esa vista.
  document.getElementById('sub').textContent = (REF_NICE && REF_NICE!=='PEPE') ? ('Hola '+REF_NICE+' — gana una propina extra por tu sentido de hospitalidad.') : 'Gana una propina extra por tu sentido de hospitalidad.';
}
/* ---- Filtros de "Todo el catálogo": tipo (tipología), zona (barrio), precio y cuándo ---- */
let F={tipo:'', zona:'', pmax:0, cuando:''};
function iso(d){ return d.toISOString().slice(0,10); }
function hoyISO(){ return iso(new Date()); }
function mananaISO(){ return iso(new Date(Date.now()+864e5)); }
function finde7(){ return iso(new Date(Date.now()+7*864e5)); }
function opciones(campo){ const s=new Set(); DATA.filter(esExp).forEach(t=>{ const v=(t[campo]||'').trim(); if(v) s.add(v); }); return [...s].sort(); }
function precioTope(){ let m=0; DATA.filter(esExp).forEach(t=>{ const p=Number(t.pvp)||0; if(p>m) m=p; }); return Math.ceil(m/100)*100; }
function matchF(t){
  if(F.tipo && (t.tipologia||'')!==F.tipo) return false;
  if(F.zona && (t.barrio||'')!==F.zona) return false;
  if(F.pmax && (Number(t.pvp)||0)>F.pmax) return false;
  if(F.cuando==='hoy' && (t.proxima_fecha||'')!==hoyISO()) return false;
  if(F.cuando==='manana' && (t.proxima_fecha||'')!==mananaISO()) return false;
  if(F.cuando==='semana'){ const f=(t.proxima_fecha||''); if(!f || f<hoyISO() || f>finde7()) return false; }
  return true;
}
function nFiltros(){ let n=0; if(F.tipo) n++; if(F.zona) n++; if(F.pmax) n++; if(F.cuando) n++; return n; }
function renderFbar(){
  const bar=document.getElementById('fbar'); if(!bar) return;
  const n=nFiltros();
  const chips=[];
  if(F.cuando) chips.push({k:'cuando',t:({hoy:'Hoy',manana:'Mañana',semana:'Esta semana'})[F.cuando]});
  if(F.tipo) chips.push({k:'tipo',t:F.tipo});
  if(F.zona) chips.push({k:'zona',t:F.zona});
  if(F.pmax) chips.push({k:'pmax',t:'hasta $'+F.pmax.toLocaleString('es-MX')});
  bar.innerHTML='<button class="fbtn" id="fopen">⚙︎ Filtros'+(n?(' · '+n):'')+'</button>'
    + chips.map(c=>'<button class="fchip" data-k="'+c.k+'">'+esc(c.t)+' ✕</button>').join('');
  document.getElementById('fopen').onclick=openFiltros;
  bar.querySelectorAll('.fchip').forEach(b=>b.onclick=()=>{ const k=b.dataset.k; if(k==='pmax') F.pmax=0; else F[k]=''; renderFbar(); render(); });
}
function openFiltros(){ pintaFiltros(); document.getElementById('fSheet').classList.add('show'); }
function cierraFiltros(){ document.getElementById('fSheet').classList.remove('show'); }
function pintaFiltros(){
  const tops=precioTope();
  const tipos=opciones('tipologia'), zonas=opciones('barrio');
  const chipRow=(campo,val,opts,etqTodo)=>'<div class="fset">'
    +'<button class="fo'+(!val?' on':'')+'" data-set="'+campo+'" data-v="">'+etqTodo+'</button>'
    + opts.map(o=>'<button class="fo'+(val===o?' on':'')+'" data-set="'+campo+'" data-v="'+esc(o)+'">'+esc(o)+'</button>').join('')
    +'</div>';

  html+='<div class="flbl">Cuándo</div><div class="fset">'

    + '</div>';

  if(zonas.length>=2){ html+='<div class="flbl">Zona</div>'+chipRow('zona',F.zona,zonas,'Todas'); }
  if(tops>0){ const val=F.pmax||tops;
    html+='<div class="flbl">Precio por persona · <b id="pval">'+(F.pmax?('hasta $'+F.pmax.toLocaleString('es-MX')):'cualquiera')+'</b></div>'
      +'<input type="range" id="prng" min="0" max="'+tops+'" step="50" value="'+val+'" style="width:100%">';
  }
  html+='</div><div class="ffoot"><button class="bsec" id="flimp">Limpiar</button><button class="bpri" id="fver">Ver experiencias</button></div>';
  const card=document.getElementById('fCard'); card.innerHTML=html;
  const upd=()=>{ document.getElementById('fver').textContent='Ver '+DATA.filter(t=>esExp(t)&&matchF(t)).length+' experiencias'; };
  card.querySelectorAll('.fo[data-set]').forEach(b=>b.onclick=()=>{ const s=b.dataset.set; F[s]=b.dataset.v; pintaFiltros(); upd(); });
  const pr=document.getElementById('prng');
  if(pr) pr.oninput=()=>{ const v=+pr.value; F.pmax=(v>=tops?0:v); const pv=document.getElementById('pval'); if(pv) pv.textContent=F.pmax?('hasta $'+F.pmax.toLocaleString('es-MX')):'cualquiera'; upd(); };
  document.getElementById('fx2').onclick=cierraFiltros;
  document.getElementById('flimp').onclick=()=>{ F={tipo:'',zona:'',pmax:0,cuando:''}; pintaFiltros(); };
  document.getElementById('fver').onclick=()=>{ cierraFiltros(); renderFbar(); render(); };
  upd();
}
/* ¿Cuándo sale? Es la pregunta real del huésped que tiene delante, así que la
   lista se agrupa por eso y no por categoría ni por precio. */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cuando(t){
  const s=((t.fechas_salida||'')+' '+(t.dias_horario||'')).toLowerCase();
  if(!s.trim()) return 2;
  if(/diario|todos los d|everyday|daily|lun.*dom/.test(s)) return 0;
  const man=DIAS[(new Date().getDay()+1)%7];
  if(s.includes(man) || s.includes(man.slice(0,3))) return 0;
  if(DIAS.some(d=>s.includes(d)||s.includes(d.slice(0,3)))) return 1;
  return 2;
}
const GRUPO=['Salen mañana','Esta semana','Otros días'];

function tarjeta(t){
  const p=money(t.pvp), d=dur(t.duracion_min);
  const meta=[d,(t.personas_max?('hasta '+t.personas_max+' pax'):null)]
    .filter(Boolean).join(' · ') || (t.artesano?esc(t.artesano):(t.prueba?'Precio de prueba':''));
  const cuandoTxt=esc((t.fechas_salida||'').split(/[.\n]/)[0]||'');
  const linea=[cuandoTxt,meta].filter(Boolean).join(' · ');
  /* La misma cuenta que la ficha: el bono en pesos si la ficha lo trae y, si no,
     el 10% del precio. Antes la tarjeta decía «bono por calcular» mientras la
     ficha de dentro ya enseñaba la cifra. */
  const bonoN = Number(t.bono_mxn)>0 ? Number(t.bono_mxn)
              : (Number(t.pvp)>0 ? Math.round(Number(t.pvp)*0.10*100)/100 : 0);
  const bono = bonoN>0 ? '<span class="bono">ganas '+money(bonoN)+'</span>' : '';
  return '<div class="exp" data-i="'+DATA.indexOf(t)+'">'
    +'<span class="ph"><span class="ic">'+ICON[catOf(t)]+'</span>'
      +(t.foto_url?('<img src="'+esc(t.foto_url)+'" alt="" loading="lazy" onerror="this.remove()">'):'')
      +favBtn(t)+'</span>'
    +'<span class="cuerpo">'
      +'<h3>'+esc(t.nombre)+'</h3>'
      +'<span class="l">'+(linea||'&nbsp;')+'</span>'
      +'<span class="pre">'
        +(p?('<span class="pvp">'+(Number(t.pvp)>0&&!t.prueba&&!t.pieza_unica?'desde ':'')+p+'</span>'):'<span class="l">Consultar</span>')
        +bono
        +(t.pieza_unica?'<span class="tag">pieza única</span>':'')
      +'</span>'
    +'</span></div>';

function openFicha(t){

    ? '<div class="blk"><div class="t">El trato</div><div class="trato">'

  const rapido = (deUna || t.incluye)

    +blk('Salidas', t.fechas_salida)

/* ================= Flujo de venta (beta) =================
   Tres pasos: cuánto y cuándo → confirmar → cómo se paga. Todavía no escribe
   reserva en la base: genera el QR y el link con el código de quien vende, que
   es lo único que hoy se puede acreditar de verdad. */
/* El colaborador NO reserva ni elige fecha/personas: eso lo hace el HUÉSPED en la app.
   El concierge sólo fija el DESCUENTO para ESTE grupo (sale de su comisión, puede variar
   de un grupo a otro) y comparte el QR/link con su código. El código y el descuento viajan
   dentro del link (ref=, dto=); el QR es ese mismo link — no hay un código aparte que teclear. */
let CP={t:null, desc:0};

// Comisión por persona de quien vende (servicios por %, experiencias por bono fijo).
function bonoPPde(t){ const pvp=Number(t.pvp)||0; return t.cat ? bonoDe(t.cat,pvp) : (Number(t.bono_mxn)||0); }
// Paso del descuento según el tamaño de la comisión.
function descStep(bpp){ return bpp>=300?50:(bpp>=120?25:10); }
function totalCP(){
  const pvp=Number(CP.t.pvp)||0;
  const bonoPP=bonoPPde(CP.t);
  // El descuento sale de la comisión del colaborador: no puede dar más de lo que gana.
  const descPP=Math.max(0, Math.min(CP.desc||0, bonoPP, pvp));
  return {pvp, descPP, pagaPP:pvp-descPP, bonoPP, bonoNetoPP:bonoPP-descPP};
}
/* El QR del concierge apuntaba a casapepe.mx/x/<slug>?ref=..., una ruta que NO
   existe: devolvía 404 y el huésped se quedaba sin poder reservar. En cualquier
   tour, no sólo en los de touroperador. Además el `slug` sale de la lista vieja
   por nombre, así que en los de operador venía vacío.

   La ficha pública de verdad es /sincretico/exp.html y se le pasa el id de la
   experiencia y el código del vendedor en `c` — que es el nombre que lee ella
   (`?c=`), no `ref`. Javi, 1-oct. */
function linkCompra(){
  const t=CP.t;
  return 'https://casapepe.mx/sincretico/exp.html?id='+encodeURIComponent(t.id)
    + (REF && REF!=='PEPE' ? '&c='+encodeURIComponent(REF) : '');
}

function abreCompra(t){
  CP={t:t, desc:0};
  document.getElementById('buySheet').classList.add('show');
  pintaCompra();
}
function cierraCompra(){ document.getElementById('buySheet').classList.remove('show'); }

function pintaCompra(){
  const t=CP.t, c=document.getElementById('buyCard'), q=totalCP();
  const cab='<div class="hero'+(t.foto_url?' foto" style="background-image:url(\''+esc(t.foto_url)+'\')':'')+'">'
    +'<button class="x" id="bx">×</button><h2>'+esc(t.nombre)+'</h2></div>';
  const dstep=descStep(q.bonoPP);
  c.innerHTML=cab+'<div class="body">'
    +'<div class="beta">El huésped elige fecha y personas en la app. Tú le compartes el link con tu código; él termina y paga la reserva.</div>'
    +(q.bonoPP>0 ? ('<div class="step"><span class="lb">Descuento al huésped<span>Sale de tu comisión ($'+q.bonoPP.toLocaleString('es-MX')+'/persona) · puede variar por grupo</span></span>'
      +'<span class="ct"><button class="bt" id="dmenos"'+(q.descPP<=0?' disabled':'')+'>−</button>'
      +'<span class="n">$'+q.descPP.toLocaleString('es-MX')+'</span>'
      +'<button class="bt" id="dmas"'+(q.descPP>=q.bonoPP?' disabled':'')+'>+</button></span></div>'
      +resumenHTML(q)) : '')
    +'<div class="sell" style="text-align:center">'
      +'<div class="lbl">Que lo escanee el huésped</div>'
      /* El descuento NO viaja en el link: la ficha pública calcula el precio desde
         el código del vendedor y no lee ningún parámetro de descuento. Decirle al
         Pepe que sí iba era prometerle al huésped algo que no llegaba. */
      +'<div class="who">Entra con <b>tu código</b> ya puesto. Él elige fecha y personas, termina y paga.'
        +(q.descPP?'<br><b>Ojo:</b> el descuento que pusiste no viaja en el link todavía.':'')+'</div>'
      +'<div class="qr" id="qb2"></div>'
      +'<div class="link">'+esc(linkCompra())+'</div>'
      +'<button class="copy" id="cp2">📋 Copiar mi link</button>'
    +'</div>'
    +'<button class="bsec" id="chat">💬 Mandar por Pepe Chat</button>'
    +'<div class="beta" id="hecho" style="display:none">✓ Link enviado. El huésped lo abre y termina la reserva con tu código.</div>'
    +'<button class="bsec" id="cerrar">Cerrar</button>'
    +'</div>';
  const qb=document.getElementById('qb2');
  try{ new QRCode(qb,{text:linkCompra(),width:170,height:170,colorDark:'#1F1B16',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ qb.textContent='QR no disponible'; }

  const $b=id=>document.getElementById(id);
  if($b('bx')) $b('bx').onclick=cierraCompra;
  if($b('cerrar')) $b('cerrar').onclick=()=>{ cierraCompra(); closeFicha(); };
  if($b('dmenos')) $b('dmenos').onclick=()=>{ CP.desc=Math.max(0,(CP.desc||0)-dstep); pintaCompra(); };
  if($b('dmas')) $b('dmas').onclick=()=>{ CP.desc=Math.min(q.bonoPP,(CP.desc||0)+dstep); pintaCompra(); };
  if($b('cp2')) $b('cp2').onclick=async()=>{ try{ await navigator.clipboard.writeText(linkCompra());
    $b('cp2').textContent='✓ Copiado'; setTimeout(()=>{ const x=$b('cp2'); if(x) x.textContent='📋 Copiar mi link'; },1600); }catch(e){} };
  if($b('chat')) $b('chat').onclick=()=>{ $b('hecho').style.display='block'; };
}

     auditoría no le pide depósito a ninguna terminal. Lo que sí pide es la prueba
     de que la noche se cobró: la foto del ticket de A&B firmado. Se sube desde aquí
     y aparece en el cierre del día. -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
// Misma configuración que la app: comparten origen, así que comparten la sesión.
/* Este archivo vive dentro de SoyPepe: si tambien refresca el token, los dos clientes
   usan el mismo refresh token y GoTrue lo toma por robado y tira la sesion de todos.
   El refresco lo hace solo la pagina madre. */
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:false}});

// Contacto del guía para avisarle del grupo. `guias` es authenticated-only (el teléfono

window.cpGuiaWa = async(gid)=>{ try{ const r=await sb.from('guias').select('telefono').eq('id',gid).maybeSingle(); return (r&&r.data&&r.data.telefono)||null; }catch(e){ return null; } };

const $=id=>document.getElementById(id);
const E=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MX=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

let NOCHE=null, PICK=null, FOTO=null, ABTAB='pago', GPICK=null;

async function cargaNoche(){
  try{
    const { data, error }=await sb.rpc('aud_experiencias_noche');
    if(error||!data||!data.ok) return null;
    return data;
  }catch(e){ return null; }
}

// El teléfono saca fotos de 4 MB que nadie va a ampliar. Se reducen antes de subir
// para que el anfitrión no se quede esperando en una terraza sin señal.
function achica(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type||'')) return res(file);
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, e=Math.min(1,max/Math.max(img.width,img.height));
      if(e>=1){ URL.revokeObjectURL(url); return res(file); }
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b?new File([b],'ticket.jpg',{type:'image/jpeg'}):file); },'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* ---- Gasto pagado con el fondo ----
   Un gasto sin cuenta contable y sin papel no cuadra ninguna caja, así que las dos
   cosas son obligatorias. El tour es opcional: no todo lo que compra Joseph es de un
   tour concreto. */
function pintaGasto(host){
  const fondos=(CAJA&&CAJA.fondos)||[];
  if(GPICK===null && fondos.length) GPICK=fondos[0].id;
  const fondo=fondos.find(x=>x.id===GPICK)||fondos[0];
  // Un fondo puede estar atado a un departamento —el de experiencias sólo compra
  // cosas de tours— o no estarlo, y entonces se le ofrece el catálogo entero.
  const dep=fondo&&fondo.departamento;
  const grupos=dep ? (CTAS&&CTAS[dep] ? [[dep,CTAS[dep]]] : [])
                   : Object.keys(CTAS||{}).map(k=>[k,CTAS[k]]);
  const hayCtas=grupos.some(g=>(g[1]||[]).length);
  const gastos=(CAJA&&CAJA.gastos)||[];

  host.innerHTML=''
    +'<div class="saldo"><div class="l">'+(fondo?E(fondo.nombre):'Tu fondo')+'</div>'
      +'<div class="v">$'+MX(fondo?fondo.saldo:0)+'</div></div>'
    +(fondos.length>4
      ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">De qué caja sale</label>'
        +'<select id="gCaja" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:12px">'
        +fondos.map(x=>'<option value="'+E(x.id)+'"'+(x.id===GPICK?' selected':'')+'>'
          +(x.icono||'')+' '+E(x.nombre)+' · $'+MX(x.saldo)+'</option>').join('')+'</select>'
      : (fondos.length>1?'<div class="expsel">'+fondos.map(x=>
         '<label class="'+(x.id===GPICK?'on':'')+'" data-gf="'+E(x.id)+'">'
         +'<input type="radio" name="gfx"'+(x.id===GPICK?' checked':'')+'>'
         +'<span><span class="nm">'+(x.icono||'')+' '+E(x.nombre)+'</span></span></label>').join('')+'</div>':''))
    +(!hayCtas
      ? '<p class="lede">No pude cargar el catálogo de cuentas. Cierra y vuelve a entrar.</p>'
      : '<label class="shot'+(GFOTO?' has':'')+'" id="gShot">'
        +(GFOTO?'<img id="gPrev" alt="Recibo">':'📷 Toca para la foto del recibo o la factura · cámara o galería')
        +'<input type="file" accept="image/*,application/pdf" hidden id="gFile"></label>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">A qué cuenta va</label>'
      +'<select id="gCta" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:10px">'
      +'<option value="">— elige la cuenta —</option>'
      +grupos.map(g=>(g[1]||[]).length
         ? (grupos.length>1?'<optgroup label="'+E(g[0])+'">':'')
           +(g[1]||[]).map(c=>'<option value="'+E(c[0])+'">'+E(c[1])+'</option>').join('')
           +(grupos.length>1?'</optgroup>':'')
         : '').join('')+'</select>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">¿De qué tour? (si aplica)</label>'
      +'<select id="gTour" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:10px">'
      +'<option value="">— de ninguno en concreto —</option>'
      +TOURS.map(t=>'<option value="'+E(t.id)+'">'+E(t.nombre)+'</option>').join('')+'</select>'
      +'<div class="flds">'
        +'<input id="gFecha" type="date" value="'+new Date().toISOString().slice(0,10)+'">'
        +'<input id="gMonto" type="number" inputmode="decimal" step="0.01" placeholder="Cuánto costó">'
      +'</div>'
      +'<textarea id="gConcepto" placeholder="Qué compraste"></textarea>'
      +'<button class="abgo" id="gGo"'+((GFOTO)?'':' disabled')+'>Guardar el gasto</button>')
    +'<div class="abmsg" id="gMsg"></div>'
    +(gastos.length?('<div class="abya"><div class="t">Lo que llevas capturado</div>'
       +gastos.map(g=>'<div class="it'+(g.anulado?' anul':'')+'" data-gid="'+E(g.id)+'">'
         +'<b>'+E(g.concepto)+'</b><span>$'+MX(g.monto)+'</span>'
         +'<span style="margin-left:auto">'+E(fdmy(g.fecha))+' · '+E(g.cuenta||'')+'</span>'
         +(g.anulado
            ? '<span class="gmark">anulado</span>'
            : '<button type="button" class="gfix" data-fix="'+E(g.id)+'">corregir</button>')
         +'</div>').join('')+'</div>'):'');

  if(GFOTO){ const p=host.querySelector('#gPrev'); if(p) p.src=URL.createObjectURL(GFOTO); }
  host.querySelectorAll('[data-gf]').forEach(l=>l.onclick=()=>{ GPICK=l.dataset.gf; pintaSheet(); });
  const gc=host.querySelector('#gCaja');
  if(gc) gc.onchange=()=>{ GPICK=gc.value; pintaSheet(); };
  const gf=host.querySelector('#gFile');
  if(gf) gf.onchange=async e=>{ const f=e.target.files&&e.target.files[0]; if(!f) return;
    host.querySelector('#gShot').textContent='Preparando la foto…'; GFOTO=await achica(f); pintaSheet(); };
  const gg=host.querySelector('#gGo'); if(gg) gg.onclick=guardaGasto;
  host.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>abreCorregir(b.dataset.fix));
}

/* Corregir un gasto ya capturado. Antes, un ticket con la fecha mal sólo se podía
   arreglar volviendo a subirlo, y el malo se quedaba contando. */
const fdmy=f=>{const s=String(f||'').slice(0,10).split('-');return s.length===3?(s[2]+'/'+s[1]):s[0];};
let GFIX=null;
function abreCorregir(id){ GFIX = (GFIX===id) ? null : id; pintaGFix(); }
function pintaGFix(){
  document.querySelectorAll('.gfixbox').forEach(x=>x.remove());
  if(!GFIX) return;
  const g=((CAJA&&CAJA.gastos)||[]).find(x=>x.id===GFIX); if(!g) return;
  const fila=document.querySelector('[data-gid="'+GFIX+'"]'); if(!fila) return;
  const fondo=((CAJA&&CAJA.fondos)||[]).find(x=>x.id===g.caja_id);
  const dep=fondo&&fondo.departamento;
  const ctas=dep ? (CTAS&&CTAS[dep] ? [[dep,CTAS[dep]]] : [])
                 : Object.keys(CTAS||{}).map(k=>[k,CTAS[k]]);
  const box=document.createElement('div'); box.className='gfixbox';
  box.innerHTML='<div class="flds">'
    +'<input id="gfFecha" type="date" value="'+E(String(g.fecha).slice(0,10))+'">'
    +'<input id="gfMonto" type="number" inputmode="decimal" step="0.01" value="'+Number(g.monto||0).toFixed(2)+'">'
    +'</div>'
    +'<select id="gfCta" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px;font-size:14px;font-family:inherit;margin-bottom:8px">'
    +ctas.map(gr=>(gr[1]||[]).length
        ? '<optgroup label="'+E(gr[0])+'">'
          +(gr[1]||[]).map(c=>'<option value="'+E(c[0])+'"'+(c[0]===g.cuenta_codigo?' selected':'')+'>'+E(c[1])+'</option>').join('')
          +'</optgroup>' : '').join('')
    +'</select>'
    +'<textarea id="gfConcepto">'+E(g.concepto||'')+'</textarea>'
    +'<button class="abgo" id="gfGo">Guardar la corrección</button>'
    +'<button type="button" class="gdel" id="gfDel">Este gasto sobra — anularlo</button>'
    +'<div class="abmsg" id="gfMsg"></div>';
  fila.after(box);
  box.querySelector('#gfGo').onclick=()=>guardaGFix(g);
  box.querySelector('#gfDel').onclick=()=>anulaGasto(g);
}
async function guardaGFix(g){
  const btn=$('gfGo'), msg=$('gfMsg'); btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…';
  try{
    const { data, error }=await sb.rpc('aud_caja_gasto_editar',{p:{id:g.id,
      fecha:$('gfFecha').value, monto:$('gfMonto').value,
      cuenta_codigo:$('gfCta').value, concepto:$('gfConcepto').value}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo corregir.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; GFIX=null; setTimeout(()=>pintaSheet(), 900);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo corregir.';
             btn.disabled=false; btn.textContent=t; }
}
async function anulaGasto(g){
  const msg=$('gfMsg');
  const motivo=prompt('¿Por qué se anula este gasto?\n\n'+(g.concepto||'')+' · $'+MX(g.monto));
  if(!motivo||!motivo.trim()){ return; }
  const btn=$('gfDel'); btn.disabled=true; const t=btn.textContent; btn.textContent='Anulando…';
  try{
    const { data, error }=await sb.rpc('aud_caja_gasto_anular',{p:{id:g.id,motivo:motivo.trim()}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo anular.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; GFIX=null; setTimeout(()=>pintaSheet(), 900);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo anular.';
             btn.disabled=false; btn.textContent=t; }
}

async function guardaGasto(){
  const btn=$('gGo'), msg=$('gMsg');
  if(!GFOTO) return;
  if(!$('gCta').value){ msg.style.color='#9E3B2E'; msg.textContent='Elige a qué cuenta va el gasto.'; return; }
  if(!$('gMonto').value){ msg.style.color='#9E3B2E'; msg.textContent='Pon cuánto costó.'; return; }
  if(!$('gConcepto').value.trim()){ msg.style.color='#9E3B2E'; msg.textContent='Escribe qué compraste.'; return; }
  btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…'; msg.textContent='';
  try{
    const ext={'application/pdf':'pdf','image/png':'png','image/webp':'webp','image/heic':'heic'}[GFOTO.type]||'jpg';
    const path=(CAJA.property_id||'sin-prop')+'/gastos/'+$('gFecha').value+'/'+GPICK+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('comprobantes').upload(path,GFOTO,{contentType:GFOTO.type||'image/jpeg'});
    if(up.error) throw up.error;
    const { data, error }=await sb.rpc('aud_caja_gasto_guardar',{p:{caja_id:GPICK,
      fecha:$('gFecha').value, cuenta_codigo:$('gCta').value, concepto:$('gConcepto').value,
      monto:$('gMonto').value, tour_id:$('gTour').value||null, foto_path:path}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo guardar.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    GFOTO=null; CAJA=await cargaCaja()||CAJA;
    setTimeout(()=>pintaSheet(), 1100);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo guardar.';
             btn.disabled=false; btn.textContent=t; }
}

async function guarda(){
  const btn=$('abGo'), msg=$('abMsg');
  if(!FOTO||!PICK) return;
  btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…'; msg.textContent='';
  try{
    // La extensión sale del tipo real: si la foto ya venía pequeña no se reencodea,
    // y llamarla .jpg cuando es png deja el archivo con el nombre cambiado.
    const ext={'application/pdf':'pdf','image/png':'png','image/webp':'webp','image/heic':'heic'}[FOTO.type]||'jpg';
    const path=NOCHE.property_id+'/'+NOCHE.fecha+'/'+PICK+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('comprobantes').upload(path,FOTO,{contentType:FOTO.type||'image/jpeg'});
    if(up.error) throw up.error;

    const { data, error }=await sb.rpc('aud_comprobante_guardar',{p:{
      categoria:PICK, fecha:NOCHE.fecha, foto_path:path,
      monto:$('abMonto').value||null, personas:$('abPax').value||null,
      ticket_folio:(NOCHE.experiencias.find(x=>x.categoria===PICK)||{}).ticket_folio||null,
      nota:$('abNota').value||null }});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo guardar.');

    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    FOTO=null;
    NOCHE=await cargaNoche()||NOCHE;
    setTimeout(()=>{ pintaSheet(); const m=$('abMsg'); if(m){ m.style.color='#1D6B4A'; m.textContent='✓ Guardado.'; } },900);
  }catch(e){
    msg.style.color='#9E3B2E';
    msg.textContent = (e&&e.message) ? e.message : 'No se pudo guardar. Revisa tu señal e inténtalo otra vez.';
    btn.disabled=false; btn.textContent=t;
  }
}

/* ================= Caja de turno y gastos del fondo =================
   Los $2,000 del fondo de A&B no son de nadie: van pasando de mano en mano toda la
   jornada. Aquí cada quien dice a quién se la deja y cuánto contó, y quien la recibe
   la vuelve a contar y la acepta. Si las dos cuentas no coinciden, queda escrito. */
let CAJA=null, CJTAB='entregar', CJPICK=null, GFOTO=null, CTAS=null, TOURS=[];

async function cargaCaja(){
  try{ const { data, error }=await sb.rpc('aud_caja_mi_turno');
       return (error||!data||!data.ok) ? null : data; }
  catch(e){ return null; }
}
async function cargaCuentas(){
  if(CTAS) return CTAS;
  try{ const { data }=await sb.rpc('aud_cuentas_gasto'); CTAS=data||{}; }catch(e){ CTAS={}; }
  return CTAS;
}
async function cargaTours(){
  if(TOURS.length) return TOURS;
  // Cada tour sabe de qué casa es: en Puebla no tienen por qué salir los de México.
  const prop = (CAJA && CAJA.property_id) || null;
  try{ let q=sb.from('tours').select('id,nombre').eq('estatus','activo').order('nombre');
       if(prop) q=q.eq('property_id',prop);
       const { data }=await q; TOURS=data||[]; }catch(e){ TOURS=[]; }
  return TOURS;
}


/* A quién se la puedo entregar, por orden: quien está en turno ahora, el área DE
   LA CAJA, el auditor, administración. La lista la calcula la base por caja
   —auditoria.gente_para_caja—, no es la plantilla entera de la casa: una caja de
   A&B no se le puede dejar a housekeeping. Aquí sólo se agrupa. */
function cjGrupos(gente){
  const orden=['En turno ahora','Su área','Auditoría','Administración'];
  const por={}; (gente||[]).forEach(g=>{ const k=g[3]; if(!k) return; (por[k]=por[k]||[]).push(g); });
  return orden.filter(k=>por[k]).map(k=>'<optgroup label="'+E(k)+'">'
    +por[k].map(g=>'<option value="'+E(g[0])+'">'+E(g[1])+(g[2]?' · '+E(g[2]):'')+'</option>').join('')
    +'</optgroup>').join('');
}

function pintaCjSheet(){
  const cajas=CAJA.cajas||[], pend=CAJA.por_recibir||[], mias=CAJA.sin_aceptar||[];
  // Si hay una caja esperándole, se abre por ahí — pero sólo al entrar: en cuanto
  // toca una pestaña, manda él.
  if(CJPICK===null && pend.length) CJTAB='recibir';
  // Aquí sólo llegan las cajas que uno LLEVA. Dirección y contabilidad ya no
  // las ven todas desde aquí: el relevo es de quien la tiene en la mano, y la
  // vigilancia vive en el cuadre de efectivo, no en el bolsillo del que releva.
  if(CJPICK===null && cajas[0]) CJPICK=cajas[0].id;
  // La lista de a quién se la puedo dejar es la DE ESTA CAJA, no una global.
  const cajaSel=cajas.find(c=>c.id===CJPICK)||cajas[0]||null;
  const gente=(cajaSel&&cajaSel.gente)||[];

  const fila=c=>'<label class="'+(c.id===CJPICK?'on':'')+'" data-cj="'+E(c.id)+'">'
      +'<input type="radio" name="cjx"'+(c.id===CJPICK?' checked':'')+'>'
      +'<span><span class="nm">'+(c.icono||'')+' '+E(c.nombre)+'</span>'
      // La caja es el FONDO, no el saldo del libro. En CDMX la venta se
      // deposita cada turno en CashProtect y no se entrega; en Puebla no hay
      // caja fuerte, se acumula, y va aparte.
      +'<span class="dt">Fondo $'+MX(c.fondo)
      +(c.area?(' · caja de '+E(c.area)):'')
      +(c.entrega_venta
          ? '<br>+ venta acumulada · el libro dice $'+MX(c.venta_libro)
          : '<br>La venta no se entrega: se deposita cada turno')
      +'</span></span></label>';
  const grupo=(t,l)=>l.length
    ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin:2px 0 6px">'+t+'</label>'
      +'<div class="expsel">'+l.map(fila).join('')+'</div>'
    : '';

  const tabEntregar=(cajas.length
      ? grupo(cajas.length>1?'Las que llevas':'La que llevas', cajas)
      : '<div class="expsel"><div class="lede" style="margin:0">No llevas ninguna caja de turno. '
        +'Si crees que sí deberías llevarla, dile a Roberto de qué área es esa caja.</div></div>')
    +(cajas.length ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">'
      +'El fondo'+(cajaSel?' · deberían ser $'+MX(cajaSel.fondo):'')+'</label>'
      +'<div class="flds">'
      +'<input id="cjMonto" type="number" inputmode="decimal" step="0.01" placeholder="¿Cuánto contaste del fondo?">'
      +'</div>'
      // El campo de la venta sólo existe donde la venta se entrega de verdad.
      // Si no, pedirlo invita a meter en la caja dinero que ya se depositó.
      +((cajaSel&&cajaSel.entrega_venta)
        ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">La venta que llevas anotada</label>'
          +'<div class="flds">'
          +'<input id="cjVenta" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'
          +'</div>'
          // El fin de semana la venta no llega a administración: se guarda.
          // Se avisa antes de intentarlo; el servidor lo impide igualmente.
          +(cajaSel.venta_hoy_a_admin===false
            ? '<div class="lede" style="margin:-4px 0 12px;font-size:12px">'
              +'<b>Hoy no se entrega la venta a administración.</b> Es fin de semana: '
              +'se queda en la caja fuerte y se entrega el lunes. El fondo sí sigue '
              +'pasando de turno en turno con normalidad.</div>'
            : '')
          +((cajaSel.ruta||[]).length
            ? '<div class="lede" style="margin:-4px 0 12px;font-size:12px">'
              +'Esta venta va: '+cajaSel.ruta.map(E).join(' → ')+'.</div>'
            : '')
        : '<div class="lede" style="margin:-4px 0 12px;font-size:12px">Aquí sólo se entrega el fondo. '
          +'La venta del turno se deposita en la caja fuerte, no pasa de mano en mano.</div>')
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Se la entrego a</label>'
      +'<select id="cjQuien" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:12px">'
      +'<option value="">— elige a quién —</option>'
      +cjGrupos(gente)
      +'</select>'
      +'<textarea id="cjNota" placeholder="¿Algo que aclarar? (opcional)"></textarea>'
      +'<button class="abgo" id="cjGo">Entregar la caja</button>' : '')
    +(mias.length?('<div class="abya"><div class="t">Entregadas y sin aceptar</div>'
       +mias.map(k=>'<div class="it"><b>'+E(k.caja)+'</b><span>$'+MX(k.monto)+'</span>'
         +'<span style="margin-left:auto">'+E(k.para)+' · '+E(k.cuando)+'</span></div>').join('')+'</div>'):'');

  const tabRecibir = pend.length ? pend.map(k=>{
      const f=Number(k.fondo!=null?k.fondo:k.monto)||0, v=Number(k.venta||0);
      return '<div class="recibir" data-rec="'+E(k.id)+'">'
      +'<div class="t">'+(k.icono||'')+' '+E(k.caja)+'</div>'
      +'<div class="s">Te la dejó <b>'+E(k.de)+'</b> el '+E(k.cuando)+': fondo $'+MX(f)
      +(v?(' y venta $'+MX(v)):'')+'. Cuéntala tú antes de aceptarla.</div>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">El fondo</label>'
      +'<div class="flds"><input class="rcMonto" type="number" inputmode="decimal" step="0.01" '
      +'value="'+f.toFixed(2)+'"></div>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">La venta</label>'
      +'<div class="flds"><input class="rcVenta" type="number" inputmode="decimal" step="0.01" '
      +'value="'+v.toFixed(2)+'"></div>'
      +'<button type="button" class="cjdif" style="background:none;border:0;color:var(--muted);'
      +'font:inherit;font-size:12px;text-decoration:underline;padding:0 0 10px;cursor:pointer">'
      +'Conté algo distinto — anotar por qué</button>'
      +'<textarea class="rcNota" hidden placeholder="¿Qué contaste y por qué crees que no cuadra?"></textarea>'
      +'<button class="go">Contada y aceptada</button></div>'; }).join('')
    : '<div class="lede" style="margin:0">Nadie te ha dejado una caja ahora mismo.</div>';

  $('cjCard').innerHTML=''
    +'<h2>Caja de turno</h2>'
    +'<p class="lede">El fondo va pasando de turno en turno. Quien la deja dice cuánto contó, '
    +'y quien la toma la vuelve a contar. Así, si un día falta, se sabe entre qué dos manos.</p>'
    +'<div class="segs">'
      +'<button type="button" data-cjtab="entregar" class="'+(CJTAB==='entregar'?'on':'')+'">Entregar</button>'
      +'<button type="button" data-cjtab="recibir" class="'+(CJTAB==='recibir'?'on':'')+'">'
        +'Recibir'+(pend.length?' ('+pend.length+')':'')+'</button>'
    +'</div>'
    +(CJTAB==='entregar'?tabEntregar:tabRecibir)
    +'<div class="abmsg" id="cjMsg"></div>';

  $('cjCard').querySelectorAll('[data-cjtab]').forEach(b=>b.onclick=()=>{ CJTAB=b.dataset.cjtab; pintaCjSheet(); });
  $('cjCard').querySelectorAll('[data-cj]').forEach(l=>l.onclick=()=>{ CJPICK=l.dataset.cj; pintaCjSheet(); });
  const go=$('cjGo'); if(go) go.onclick=entregaCaja;
  $('cjCard').querySelectorAll('[data-rec] .go').forEach(b=>b.onclick=()=>recibeCaja(b.closest('[data-rec]')));
  $('cjCard').querySelectorAll('[data-rec] .cjdif').forEach(b=>b.onclick=()=>{
    const t=b.closest('[data-rec]').querySelector('.rcNota'); t.hidden=false; b.hidden=true; t.focus(); });
}

async function entregaCaja(){
  const btn=$('cjGo'), msg=$('cjMsg');
  const quien=$('cjQuien').value, monto=$('cjMonto').value, venta=($('cjVenta')||{}).value||'0';
  if(!quien){ msg.style.color='#9E3B2E'; msg.textContent='Elige a quién le entregas la caja.'; return; }
  if(!monto){ msg.style.color='#9E3B2E'; msg.textContent='Cuenta el fondo y pon cuánto hay.'; return; }
  btn.disabled=true; const t=btn.textContent; btn.textContent='Entregando…'; msg.textContent='';
  try{
    const { data, error }=await sb.rpc('aud_caja_entregar',{p:{caja_id:CJPICK,
      recibe_employee_id:quien, monto_fondo:monto, monto_venta:venta,
      nota:$('cjNota').value||null}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo entregar.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; pintaCjBoton();
    setTimeout(()=>pintaCjSheet(), 1100);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo entregar.';
             btn.disabled=false; btn.textContent=t; }
}

async function recibeCaja(box){
  const btn=box.querySelector('.go'), msg=$('cjMsg');
  btn.disabled=true; const t=btn.textContent; btn.textContent='Aceptando…'; msg.textContent='';
  try{
    const nt=box.querySelector('.rcNota');
    const { data, error }=await sb.rpc('aud_caja_recibir',{p:{id:box.dataset.rec,
      monto_fondo:box.querySelector('.rcMonto').value,
      monto_venta:(box.querySelector('.rcVenta')||{}).value||'0',
      nota:(nt&&!nt.hidden&&nt.value.trim())||null}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo aceptar.');
    msg.style.color = Math.abs(Number(data.diferencia||0))<0.01 ? '#1D6B4A' : '#8C6212';
    msg.textContent=data.mensaje;
    CAJA=await cargaCaja()||CAJA; pintaCjBoton();
    setTimeout(()=>pintaCjSheet(), 1400);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo aceptar.';
             btn.disabled=false; btn.textContent=t; }
}

(async()=>{
  // Se puede llegar aquí desde el círculo de "Para ti", que pide una pantalla concreta.
  const abrir=new URLSearchParams(location.search).get('abrir');
  NOCHE=await cargaNoche();
  CAJA=await cargaCaja();
  // La caja de turno se abre desde "Para ti", no desde aquí: esta pantalla es de venta.
  if(CAJA && abrir==='caja'){
    CJPICK=null; await cargaCuentas(); pintaCjSheet(); $('cjSheet').classList.add('show');
  }
  // El único gesto de caja que se abre aquí es el que pide «Para ti» por la URL.
  // Va a pantalla completa —sin fondo que cerrar—: quien entra viene a la caja.
  if(abrir==='gasto' || abrir==='comprobante'){
    PICK=null; FOTO=null; GFOTO=null; GPICK=null;
    ABTAB = abrir==='comprobante' ? 'pago' : 'gasto';
    await cargaCuentas(); await cargaTours(); pintaSheet(); $('abSheet').classList.add('show');
  }
})();
</script>
