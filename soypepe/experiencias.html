<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Experiencias · Casa Pepe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#0f0d0a;--card:#1a1611;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--accent:#1d9e75;--bad:#b03434;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;max-width:460px;margin:0 auto;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .wrap{padding:calc(10px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
  .soon{display:flex;align-items:center;gap:8px;background:#241c10;border:1px dashed #5a4422;color:#cdb079;font-size:12.5px;padding:9px 12px;border-radius:11px;margin-bottom:14px;opacity:.85}
  .soon b{color:var(--gold)}
  h1{font-size:23px;margin:4px 0 2px;letter-spacing:.2px}
  h1 .it{font-style:italic;color:var(--gold);font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1a1208}
  .grid{display:flex;flex-direction:column;gap:14px}
  .exp{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;cursor:pointer;transition:transform .12s}
  .exp:active{transform:scale(.985)}
  .exp .ph{position:relative;height:158px;background:linear-gradient(135deg,#2a2114,#3a2b16);display:flex;align-items:flex-end;padding:12px}
  .exp .ph .ic{position:absolute;top:12px;left:14px;font-size:30px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.4))}
  .exp .ph .tag{position:absolute;top:13px;right:13px;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);color:#fff;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px}
  .exp .ph h3{margin:0;font-size:17px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.65);line-height:1.15}
  .exp .meta{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;font-size:13px}
  .exp .meta .l{color:var(--muted)}
  .exp .meta .pvp{color:var(--gold);font-weight:800;font-size:15px}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty b{color:var(--gold)}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .card{background:var(--bg);width:100%;max-width:460px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--line)}
  .sheet .hero{position:relative;height:200px;background:linear-gradient(135deg,#2a2114,#3a2b16);display:flex;align-items:flex-end;padding:16px}
  .sheet .hero .ic{position:absolute;top:14px;left:16px;font-size:40px}
  .sheet .hero .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:20px;cursor:pointer}
  .sheet .hero h2{margin:0;color:#fff;font-size:21px;text-shadow:0 2px 12px rgba(0,0,0,.7);line-height:1.15}
  .sheet .body{padding:16px}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;color:var(--txt)}
  .pill b{color:var(--gold)}
  .story{color:#d8ccb6;font-size:14px;line-height:1.5;margin:0 0 14px}
  .blk{margin-bottom:12px}
  .blk .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px;font-weight:700}
  .blk .c{font-size:13.5px;color:var(--txt);line-height:1.45;white-space:pre-wrap}
  .sell{margin-top:6px;background:#13261d;border:1px solid #1d4d3a;border-radius:16px;padding:16px;text-align:center}
  .sell .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#7fe0b0;font-weight:700;margin-bottom:4px}
  .sell .who{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sell .who b{color:var(--txt)}
  .sell .qr{display:inline-block;background:#fff;padding:10px;border-radius:12px}
  .sell .qr canvas,.sell .qr img{display:block}
  .sell .link{margin-top:12px;background:#0f1f18;border:1px solid #1d4d3a;border-radius:10px;padding:10px;font-size:12px;color:#bfe8d4;word-break:break-all}
  .sell .copy{margin-top:10px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
  .sell .demo{margin-top:9px;font-size:11.5px;color:#cdb079;opacity:.85}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px;opacity:.7}
  /* ---- Comprobante de A&B de la noche ---- */
  .abbtn{width:100%;display:flex;align-items:center;gap:11px;background:#13261d;border:1px solid #1d4d3a;
    border-radius:16px;padding:14px 15px;margin-bottom:14px;cursor:pointer;text-align:left;color:var(--txt)}
  .abbtn .em{font-size:24px;line-height:1}
  .abbtn .tt{font-size:15px;font-weight:800;margin-bottom:2px}
  .abbtn .ss{font-size:12px;color:#8fcfae;line-height:1.35}
  .abbtn .cn{margin-left:auto;flex:0 0 auto;background:#1d9e75;color:#04150e;font-size:11px;font-weight:800;
    padding:4px 9px;border-radius:999px}
  .abbtn .cn.pend{background:#5a4422;color:#f0cf95}
  #abSheet .card{background:var(--bg);width:100%;max-width:460px;max-height:94vh;overflow:auto;
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(20px + var(--safe-b))}
  #abSheet h2{margin:0 0 4px;font-size:19px}
  #abSheet .lede{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}
  .expsel{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .expsel label{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;cursor:pointer}
  .expsel label.on{border-color:var(--gold);background:#241c10}
  .expsel input{accent-color:var(--gold);width:18px;height:18px;flex:0 0 auto}
  .expsel .nm{display:block;font-size:14px;font-weight:700}
  .expsel .dt{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .expsel .ok{margin-left:auto;color:#7fe0b0;font-size:11.5px;font-weight:700;flex:0 0 auto}
  .shot{display:block;border:1px dashed #5a4422;border-radius:14px;padding:22px 14px;text-align:center;
    color:#cdb079;font-size:13.5px;cursor:pointer;margin-bottom:12px;background:#1a1611}
  .shot.has{padding:8px;border-style:solid;border-color:var(--line)}
  .shot img{max-width:100%;max-height:220px;border-radius:9px;display:block;margin:0 auto}
  .flds{display:flex;gap:8px;margin-bottom:10px}
  .flds input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit}
  #abSheet textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;min-height:56px;margin-bottom:12px}
  .abgo{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-size:15.5px;font-weight:800;cursor:pointer}
  .abgo:disabled{opacity:.45;cursor:default}
  .abmsg{margin-top:10px;font-size:13px;text-align:center;line-height:1.4}
  .abya{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .abya .t{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:7px}
  .abya .it{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px solid #241f16}
  .abya .it b{color:var(--txt);font-weight:700}
</style>

<body>
<div class="wrap">
  <div class="soon">⏳ <span><b>Próximamente</b> · versión beta — explora el catálogo; la reserva y el QR de venta se activan pronto.</span></div>
  <h1>Vende <span class="it">Experiencias</span></h1>
  <div class="sub" id="sub">Catálogo de Casa Pepe · Sincrético · tu link y QR de venta por experiencia.</div>

  <button class="abbtn" id="abBtn" type="button" hidden>
    <span class="em">📸</span>
    <span><span class="tt">Subir pago de A&amp;B</span>
      <span class="ss" id="abSub">La foto del ticket firmado de la noche.</span></span>
    <span class="cn pend" id="abCnt"></span>
  </button>

  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"><div class="empty">Cargando experiencias…</div></div>

  <div class="foot">Casa Pepe · Experiencias — los precios y comisiones pueden cambiar.</div>
</div>

<div class="sheet" id="sheet"><div class="card" id="sheetCard"></div></div>
<div class="sheet" id="abSheet"><div class="card" id="abCard"></div></div>

<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const params=new URLSearchParams(location.search);
const REF=(params.get('ref')||params.get('nombre')||'PEPE').toString();
const REF_NICE=(params.get('nombre')||REF);

const CATS=['Tours','Meet at Casa','Lavandería','Eventos o Grupos'];
const ICON={'Tours':'🗺️','Meet at Casa':'🏠','Lavandería':'🧺','Eventos o Grupos':'🎉'};
let DATA=[], CURCAT='Tours';

function catOf(t){
  const nm=(t.nombre||'').toLowerCase();
  const li=(t.lugar_inicio||'').toLowerCase();
  if(/grupo|privado|evento/.test(nm)) return 'Eventos o Grupos';
  if(/c[oó]smica|terraza|taller|challenge|mezcalit|tortilla a mano/.test(nm+' '+li)) return 'Meet at Casa';
  return 'Tours';
}
function money(v){ if(v==null||v==='') return null; const n=Number(v); if(isNaN(n)) return null; return n===0?'Gratis':('$'+n.toLocaleString('es-MX')); }
function dur(m){ if(!m) return null; const h=Math.floor(m/60), mm=m%60; return ((h?h+'h':'')+(mm?(' '+mm+'m'):'')).trim() || (m+'m'); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bookingLink(t){ return 'https://casapepe.mx/x/'+(t.slug||'experiencia')+'?ref='+encodeURIComponent(REF); }

async function load(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/tours?select=*&estatus=eq.activo&order=nombre.asc',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    DATA = r.ok ? (await r.json()) : [];
  }catch(e){ DATA=[]; }
  renderCats(); render();
  document.getElementById('sub').textContent = (REF_NICE && REF_NICE!=='PEPE') ? ('Hola '+REF_NICE+' — tu link y QR de venta van en cada experiencia.') : 'Catálogo de Casa Pepe · tu link y QR de venta por experiencia.';
}
function renderCats(){
  const c=document.getElementById('cats');
  c.innerHTML=CATS.map(k=>'<div class="chip'+(k===CURCAT?' on':'')+'" data-k="'+k+'">'+ICON[k]+' '+k+'</div>').join('');
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ CURCAT=ch.dataset.k; renderCats(); render(); });
}
function render(){
  const g=document.getElementById('grid');
  const items=DATA.filter(t=>catOf(t)===CURCAT);
  if(!items.length){
    g.innerHTML='<div class="empty">'+ICON[CURCAT]+' <b>'+CURCAT+'</b><br><br>Aún no hay opciones publicadas en esta categoría.<br>Muy pronto las verás aquí.</div>';
    return;
  }
  g.innerHTML=items.map(t=>{
    const p=money(t.pvp); const d=dur(t.duracion_min);
    return '<div class="exp" data-i="'+DATA.indexOf(t)+'">'
      +'<div class="ph"><span class="ic">'+ICON[catOf(t)]+'</span>'+(t.comision_3os?('<span class="tag">Comisión '+t.comision_3os+'%</span>'):'')+'<h3>'+esc(t.nombre)+'</h3></div>'
      +'<div class="meta"><span class="l">'+[d,(t.personas_max?('hasta '+t.personas_max+' pax'):null)].filter(Boolean).join(' · ')+'</span>'+(p?('<span class="pvp">'+(Number(t.pvp)>0?'desde ':'')+p+'</span>'):'<span class="l">Consultar</span>')+'</div>'
      +'</div>';
  }).join('');
  g.querySelectorAll('.exp').forEach(e=>e.onclick=()=>openFicha(DATA[+e.dataset.i]));
}
function openFicha(t){
  const p=money(t.pvp); const d=dur(t.duracion_min);
  const link=bookingLink(t);
  const pills=[ d?('<span class="pill">⏱ <b>'+d+'</b></span>'):'', t.personas_max?('<span class="pill">👥 hasta <b>'+t.personas_max+'</b></span>'):'', p?('<span class="pill">💵 <b>'+p+'</b></span>'):'', t.idiomas?('<span class="pill">🗣 '+esc(t.idiomas)+'</span>'):'', t.comision_3os?('<span class="pill">🤝 comisión <b>'+t.comision_3os+'%</b></span>'):'' ].join('');
  function blk(title,val){ return val?('<div class="blk"><div class="t">'+title+'</div><div class="c">'+esc(val)+'</div></div>'):''; }
  const card=document.getElementById('sheetCard');
  card.innerHTML=''
    +'<div class="hero"><span class="ic">'+ICON[catOf(t)]+'</span><button class="x" id="fx">×</button><h2>'+esc(t.nombre)+'</h2></div>'
    +'<div class="body">'
    +'<div class="row2">'+pills+'</div>'
    +(t.storytelling?('<p class="story">'+esc(t.storytelling)+'</p>'):'')
    +blk('Incluye', t.incluye)
    +blk('No incluye', t.no_incluye)
    +blk('Punto de inicio', t.lugar_inicio)
    +blk('Salidas', t.fechas_salida)
    +blk('Política de cancelación', t.politica_cancelacion)
    +blk('Importante', t.info_importante)
    +'<div class="sell">'
      +'<div class="lbl">Tu link de venta</div>'
      +'<div class="who">Vendido por <b>'+esc(REF_NICE)+'</b> — cada reserva con este QR/link se te acredita.</div>'
      +'<div class="qr" id="qrbox"></div>'
      +'<div class="link" id="linkbox">'+esc(link)+'</div>'
      +'<button class="copy" id="cp">📋 Copiar mi link</button>'
      +'<div class="demo">⏳ En beta: el QR es de muestra; la reserva se activa pronto.</div>'
    +'</div>'
    +'</div>';
  document.getElementById('sheet').classList.add('show');
  document.getElementById('fx').onclick=closeFicha;
  const qb=document.getElementById('qrbox'); qb.innerHTML='';
  try{ new QRCode(qb,{text:link,width:150,height:150,colorDark:'#0f0d0a',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){ qb.innerHTML='<div style="color:#111;font-size:12px;padding:20px">QR no disponible</div>'; }
  document.getElementById('cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(link); const b=document.getElementById('cp'); b.textContent='✓ Copiado'; setTimeout(()=>b.textContent='📋 Copiar mi link',1600); }catch(e){} };
}
function closeFicha(){ document.getElementById('sheet').classList.remove('show'); }
document.getElementById('sheet').addEventListener('click',e=>{ if(e.target.id==='sheet') closeFicha(); });

load();
</script>

<!-- ================= Comprobante de A&B de la noche =================
     Sincrético liquida las experiencias por transferencia a 30 días, así que la
     auditoría no le pide depósito a ninguna terminal. Lo que sí pide es la prueba
     de que la noche se cobró: la foto del ticket de A&B firmado. Se sube desde aquí
     y aparece en el cierre del día. -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
// Misma configuración que la app: comparten origen, así que comparten la sesión.
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});

const $=id=>document.getElementById(id);
const E=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MX=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

let NOCHE=null, PICK=null, FOTO=null;

async function cargaNoche(){
  try{
    const { data, error }=await sb.rpc('aud_experiencias_noche');
    if(error||!data||!data.ok) return null;
    return data;
  }catch(e){ return null; }
}

// El teléfono saca fotos de 4 MB que nadie va a ampliar. Se reducen antes de subir
// para que el anfitrión no se quede esperando en una terraza sin señal.
function achica(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type||'')) return res(file);
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, e=Math.min(1,max/Math.max(img.width,img.height));
      if(e>=1){ URL.revokeObjectURL(url); return res(file); }
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b?new File([b],'ticket.jpg',{type:'image/jpeg'}):file); },'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

function pintaBoton(){
  if(!NOCHE) return;
  const exps=NOCHE.experiencias||[], faltan=exps.filter(x=>!x.comprobantes).length;
  $('abBtn').hidden=false;
  const cn=$('abCnt');
  cn.textContent = faltan ? (faltan+' por subir') : '✓ al día';
  cn.className = 'cn'+(faltan?' pend':'');
  $('abSub').textContent = faltan
    ? 'La foto del ticket firmado de esta noche.'
    : 'Ya subiste el comprobante de esta noche. Puedes añadir otro.';
}

function pintaSheet(){
  const exps=NOCHE.experiencias||[], ya=NOCHE.subidos||[];
  const f=NOCHE.fecha ? NOCHE.fecha.split('-').reverse().slice(0,2).join('/') : '';
  if(PICK===null && exps.length) PICK=(exps.find(x=>!x.comprobantes)||exps[0]).categoria;

  $('abCard').innerHTML=''
    +'<h2>Pago de A&amp;B · noche del '+E(f)+'</h2>'
    +'<p class="lede">Sincrético liquida por transferencia a 30 días. La foto del ticket firmado '
    +'es lo que deja constancia de que la noche se cobró, y se ve en el cierre del día.</p>'
    +'<div class="expsel" id="abList">'+ (exps.length ? exps.map(x=>
        '<label class="'+(x.categoria===PICK?'on':'')+'" data-c="'+E(x.categoria)+'">'
        +'<input type="radio" name="abx" value="'+E(x.categoria)+'"'+(x.categoria===PICK?' checked':'')+'>'
        +'<span><span class="nm">'+E(x.experiencia)+'</span><span class="dt">'
        +(x.ticket_folio ? ('Cuenta '+E(x.ticket_folio)+' · $'+MX(x.monto)+(x.personas?(' · '+x.personas+' personas'):''))
                         : 'Poster todavía no cierra esta cuenta')
        +'</span></span>'
        +(x.comprobantes?'<span class="ok">✓ '+x.comprobantes+'</span>':'')
        +'</label>').join('')
      : '<div class="lede" style="margin:0">No hay experiencias de Sincrético dadas de alta para esta noche.</div>')
    +'</div>'
    +'<label class="shot'+(FOTO?' has':'')+'" id="abShot">'
      +(FOTO?'<img id="abPrev" alt="Ticket firmado">':'📷 Toca para tomar la foto del ticket firmado')
      +'<input type="file" accept="image/*,application/pdf" capture="environment" hidden id="abFile"></label>'
    +'<div class="flds">'
      +'<input id="abMonto" type="number" inputmode="decimal" step="0.01" placeholder="Importe del ticket">'
      +'<input id="abPax" type="number" inputmode="numeric" placeholder="Personas">'
    +'</div>'
    +'<textarea id="abNota" placeholder="¿Algo que aclarar? (opcional)"></textarea>'
    +'<button class="abgo" id="abGo"'+((FOTO&&PICK)?'':' disabled')+'>Guardar comprobante</button>'
    +'<div class="abmsg" id="abMsg"></div>'
    +(ya.length?('<div class="abya"><div class="t">Ya subido esta noche</div>'
       +ya.map(k=>'<div class="it"><b>'+E(k.experiencia)+'</b>'
         +(k.monto?('<span>$'+MX(k.monto)+'</span>'):'')
         +'<span style="margin-left:auto">'+E(k.quien)+' · '+E(k.hora)+'</span></div>').join('')
       +'</div>'):'');

  if(FOTO){ const p=$('abPrev'); if(p) p.src=URL.createObjectURL(FOTO); }

  $('abList').querySelectorAll('label').forEach(l=>l.onclick=()=>{
    PICK=l.dataset.c;
    $('abList').querySelectorAll('label').forEach(o=>o.classList.toggle('on',o===l));
    $('abGo').disabled=!(FOTO&&PICK);
  });
  $('abFile').onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    $('abShot').textContent='Preparando la foto…';
    FOTO=await achica(f);
    pintaSheet();
  };
  $('abGo').onclick=guarda;
}

async function guarda(){
  const btn=$('abGo'), msg=$('abMsg');
  if(!FOTO||!PICK) return;
  btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…'; msg.textContent='';
  try{
    // La extensión sale del tipo real: si la foto ya venía pequeña no se reencodea,
    // y llamarla .jpg cuando es png deja el archivo con el nombre cambiado.
    const ext={'application/pdf':'pdf','image/png':'png','image/webp':'webp','image/heic':'heic'}[FOTO.type]||'jpg';
    const path=NOCHE.property_id+'/'+NOCHE.fecha+'/'+PICK+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('comprobantes').upload(path,FOTO,{contentType:FOTO.type||'image/jpeg'});
    if(up.error) throw up.error;

    const { data, error }=await sb.rpc('aud_comprobante_guardar',{p:{
      categoria:PICK, fecha:NOCHE.fecha, foto_path:path,
      monto:$('abMonto').value||null, personas:$('abPax').value||null,
      ticket_folio:(NOCHE.experiencias.find(x=>x.categoria===PICK)||{}).ticket_folio||null,
      nota:$('abNota').value||null }});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo guardar.');

    msg.style.color='#7fe0b0'; msg.textContent='✓ '+data.mensaje;
    FOTO=null;
    NOCHE=await cargaNoche()||NOCHE;
    pintaBoton();
    setTimeout(()=>{ pintaSheet(); const m=$('abMsg'); if(m){ m.style.color='#7fe0b0'; m.textContent='✓ Guardado.'; } },900);
  }catch(e){
    msg.style.color='#e08a8a';
    msg.textContent = (e&&e.message) ? e.message : 'No se pudo guardar. Revisa tu señal e inténtalo otra vez.';
    btn.disabled=false; btn.textContent=t;
  }
}

(async()=>{
  NOCHE=await cargaNoche();
  if(!NOCHE) return;                       // sin sesión o sin ficha: el botón no aparece
  pintaBoton();
  $('abBtn').onclick=()=>{ PICK=null; FOTO=null; pintaSheet(); $('abSheet').classList.add('show'); };
  $('abSheet').addEventListener('click',e=>{ if(e.target.id==='abSheet') $('abSheet').classList.remove('show'); });
})();
</script>
</body></html>
