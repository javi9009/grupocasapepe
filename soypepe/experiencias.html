<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Experiencias · Casa Pepe</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#F4F1EA;--card:#FFFFFF;--line:#E2DCCF;--txt:#1F1B16;--muted:#6B6459;--gold:#8A6C31;--accent:#137A56;--bad:#9E3B2E;--safe-t:env(safe-area-inset-top);--safe-b:env(safe-area-inset-bottom)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;max-width:460px;margin:0 auto;box-shadow:0 0 40px rgba(31,27,22,.10)}
  .wrap{padding:calc(10px + var(--safe-t)) 16px calc(28px + var(--safe-b))}
  .soon{display:flex;align-items:center;gap:8px;background:#F3EAD6;border:1px dashed #8C6212;color:#8C6212;font-size:12.5px;padding:9px 12px;border-radius:11px;margin-bottom:14px;opacity:.85}
  .soon b{color:var(--gold)}
  h1{font-size:23px;margin:4px 0 2px;letter-spacing:.2px}
  h1 .it{font-style:italic;color:var(--gold);font-weight:600}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin:0 -16px 14px;padding-left:16px;padding-right:16px;scrollbar-width:none}
  .cats::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;padding:9px 15px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;white-space:nowrap}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#FFFFFF}
  .grid{display:flex;flex-direction:column;gap:9px}
  /* Tarjeta de fila: miniatura a la izquierda, el bono a la vista. Es la forma
     del mockup — el recepcionista barre la lista de un vistazo, no ve pósters. */
  .exp{background:var(--card);border:1px solid var(--line);border-radius:13px;
    padding:11px 12px;cursor:pointer;transition:transform .12s;display:flex;gap:11px;align-items:flex-start}
  .exp:active{transform:scale(.985)}
  .exp .ph{position:relative;flex:0 0 auto;width:52px;height:52px;border-radius:9px;
    background:linear-gradient(135deg,#8A7A5C,#6E5F45);background-size:cover;background-position:center;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
  .exp .ph .ic{font-size:22px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
  .exp .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--card)}
  .exp .cuerpo{min-width:0;flex:1}
  .exp h3{margin:0;font-size:14.5px;font-weight:800;color:var(--txt);line-height:1.2}
  .exp .l{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .exp .pre{margin-top:7px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .exp .pvp{color:var(--txt);font-weight:800;font-size:15px}
  .exp .bono{font-size:11.5px;font-weight:800;color:#1D6B4A;background:#E1F0E7;
    border:1px solid #1D6B4A;border-radius:999px;padding:2px 9px}
  .exp .bono.pend{color:#8C6212;background:#F3EAD6;border-color:#8C6212;font-weight:700}
  .exp .tag{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  /* Rótulo de grupo: cuándo sale, que es como se pregunta de verdad. */
  .grh{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
    font-weight:800;margin:14px 2px 8px}
  .grh:first-child{margin-top:2px}
  .sheet .hero.foto::before{content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(0,0,0,.15) 0%,rgba(0,0,0,0) 38%,rgba(0,0,0,.72) 100%)}
  .sheet .hero>*{position:relative;z-index:1}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:16px;padding:26px 18px;text-align:center;color:var(--muted);font-size:13.5px}
  .empty b{color:var(--gold)}
  .sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sheet .card{background:var(--bg);width:100%;max-width:460px;max-height:94vh;overflow:auto;border-radius:22px 22px 0 0;border-top:1px solid var(--line)}
  .sheet .hero{position:relative;height:200px;background:linear-gradient(135deg,#8A7A5C,#6E5F45);background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:16px}
  /* El bono va tapado: esta ficha se le enseña al huésped. */
  .mibono{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);
    border:1px dashed #1D6B4A;border-radius:12px;padding:10px 13px;margin-bottom:12px;font-size:13px}
  .mibono .l{color:var(--muted)}
  .mibono .v{color:#1D6B4A;font-weight:800;letter-spacing:.16em}
  .mibono button{background:none;border:1px solid #1D6B4A;color:#1D6B4A;border-radius:999px;
    font:inherit;font-size:11.5px;font-weight:700;padding:3px 11px;cursor:pointer}
  .gymbtn{width:100%;display:flex;align-items:center;gap:10px;background:#EEEDF7;border:1px solid #5B57A6;
    color:#443F8F;border-radius:13px;padding:12px 14px;font:inherit;font-size:13.5px;font-weight:700;
    cursor:pointer;margin-bottom:12px;text-align:left;text-decoration:none}
  .gymbtn .ch{margin-left:auto;opacity:.7}
  .gymbtn .ss{display:block;font-weight:400;font-size:11.5px;color:#6B67A6;margin-top:2px}
  .sheet .hero .ic{position:absolute;top:14px;left:16px;font-size:40px}
  .sheet .hero .x{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:0;font-size:20px;cursor:pointer}
  .sheet .hero h2{margin:0;color:#fff;font-size:21px;text-shadow:0 2px 12px rgba(0,0,0,.7);line-height:1.15}
  .sheet .body{padding:16px}
  .row2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .pill{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:12.5px;color:var(--txt)}
  .pill b{color:var(--gold)}
  .story{color:#4E4638;font-size:14px;line-height:1.5;margin:0 0 14px}
  .blk{margin-bottom:12px}
  .blk .t{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:5px;font-weight:700}
  .blk .c{font-size:13.5px;color:var(--txt);line-height:1.45;white-space:pre-wrap}
  /* "Importante" venía como un muro de texto. Va en viñetas, con el rótulo en
     negrita y un icono que se adivina por el tema. */
  .imp{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
  .imp li{display:flex;gap:9px;align-items:flex-start;background:var(--card);
    border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:10px;
    padding:9px 11px;font-size:13px;line-height:1.42;color:var(--txt)}
  .imp li .em{flex:0 0 auto;font-size:15px;line-height:1.2}
  .imp li b{color:var(--txt);font-weight:800}
  .imp li.alto{border-left-color:var(--bad);background:#FAF0EE}
  .sell{margin-top:6px;background:#E1F0E7;border:1px solid #1D6B4A;border-radius:16px;padding:16px;text-align:center}
  .sell .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#1D6B4A;font-weight:700;margin-bottom:4px}
  .sell .who{font-size:13px;color:var(--muted);margin-bottom:12px}
  .sell .who b{color:var(--txt)}
  .sell .qr{display:inline-block;background:#fff;padding:10px;border-radius:12px}
  .sell .qr canvas,.sell .qr img{display:block}
  .sell .link{margin-top:12px;background:#F7FBF9;border:1px solid #1D6B4A;border-radius:10px;padding:10px;font-size:12px;color:#1D6B4A;word-break:break-all}
  .sell .copy{margin-top:10px;width:100%;padding:13px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer}
  .sell .demo{margin-top:9px;font-size:11.5px;color:#8C6212;opacity:.85}
  /* ---- Flujo de venta (beta) ---- */
  .paso{display:flex;gap:6px;margin-bottom:14px}
  .paso i{flex:1;height:3px;border-radius:999px;background:var(--line)}
  .paso i.on{background:var(--accent)}
  .campo{margin-bottom:11px}
  .campo>label{display:block;font-size:12px;color:var(--muted);font-weight:700;margin-bottom:5px}
  .campo input,.campo select{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit}
  .step{display:flex;align-items:center;justify-content:space-between;gap:11px;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:9px 12px;margin-bottom:11px}
  .step .lb{font-size:13px;font-weight:700}
  .step .lb span{display:block;font-weight:400;font-size:11.5px;color:var(--muted);margin-top:1px}
  .step .ct{display:flex;align-items:center;gap:12px;flex:0 0 auto}
  .step .bt{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--card);
    font-size:17px;line-height:1;color:var(--accent);font-weight:800;cursor:pointer}
  .step .bt:disabled{opacity:.35;cursor:default}
  .step .n{font-weight:800;min-width:18px;text-align:center;font-size:15px}
  .res{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
  .res .r{display:flex;justify-content:space-between;font-size:13px;padding:4px 0}
  .res .r.tot{border-top:1px solid var(--line);margin-top:6px;padding-top:8px;font-weight:800;font-size:15px}
  .res .r .tach{color:var(--muted);text-decoration:line-through;font-size:12px;margin-right:6px}
  .res .r.oc{border-top:1px dashed var(--line);margin-top:6px;padding-top:8px;color:var(--muted)}
  .res .r.oc .v{color:#1D6B4A;font-weight:800;letter-spacing:.16em}
  .res .r.oc button{background:none;border:1px solid #1D6B4A;color:#1D6B4A;border-radius:999px;
    font:inherit;font-size:11px;font-weight:700;padding:2px 10px;margin-left:8px;cursor:pointer}
  .bpri{width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-size:15px;font-weight:800;cursor:pointer;margin-bottom:8px}
  .bpri:disabled{opacity:.45;cursor:default}
  .bsec{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--card);
    color:var(--accent);font-size:14px;font-weight:800;cursor:pointer;margin-bottom:8px}
  .beta{background:#F3EAD6;border:1px solid #8C6212;color:#8C6212;border-radius:10px;
    padding:9px 11px;font-size:12px;font-weight:700;margin-bottom:12px}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px;opacity:.7}
  /* ---- Gasto de caja y comprobante de A&B (se abre desde «Para ti») ----
     Cuando se entra por ahí, esta página ES la caja: el catálogo de tours no se
     pinta detrás. Concierge y caja son dos pantallas, no una encima de la otra. */
  body.solo-caja .wrap{display:none}
  body.solo-caja .sheet.show{position:static;background:none;display:block}
  body.solo-caja .sheet.show .card{max-height:none;min-height:100dvh;border-radius:0;
    border-top:0;margin:0 auto;padding-top:calc(16px + var(--safe-t))}
  #abSheet .card{background:var(--bg);width:100%;max-width:460px;max-height:94vh;overflow:auto;
    border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:18px 16px calc(20px + var(--safe-b))}
  #abSheet h2{margin:0 0 4px;font-size:19px}
  #abSheet .lede{color:var(--muted);font-size:13px;line-height:1.45;margin:0 0 14px}
  .expsel{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
  .expsel label{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:13px;padding:12px 13px;cursor:pointer}
  .expsel label.on{border-color:var(--gold);background:#F3EAD6}
  .expsel input{accent-color:var(--gold);width:18px;height:18px;flex:0 0 auto}
  .expsel .nm{display:block;font-size:14px;font-weight:700}
  .expsel .dt{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
  .expsel .ok{margin-left:auto;color:#1D6B4A;font-size:11.5px;font-weight:700;flex:0 0 auto}
  .shot{display:block;border:1px dashed #8C6212;border-radius:14px;padding:22px 14px;text-align:center;
    color:#8C6212;font-size:13.5px;cursor:pointer;margin-bottom:12px;background:#FFFFFF}
  .shot.has{padding:8px;border-style:solid;border-color:var(--line)}
  .shot img{max-width:100%;max-height:220px;border-radius:9px;display:block;margin:0 auto}
  .flds{display:flex;gap:8px;margin-bottom:10px}
  .flds input{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit}
  #abSheet textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
    border-radius:11px;padding:11px 12px;font-size:14px;font-family:inherit;resize:vertical;min-height:56px;margin-bottom:12px}
  .abgo{width:100%;padding:14px;border:0;border-radius:12px;background:var(--accent);color:#fff;
    font-size:15.5px;font-weight:800;cursor:pointer}
  .abgo:disabled{opacity:.45;cursor:default}
  .abmsg{margin-top:10px;font-size:13px;text-align:center;line-height:1.4}
  .abya{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
  .abya .t{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;margin-bottom:7px}
  .abya .it{display:flex;gap:9px;align-items:baseline;font-size:12.5px;color:var(--muted);padding:5px 0;border-bottom:1px solid #EFE9DD}
  .abya .it b{color:var(--txt);font-weight:700}
  .abya .it{flex-wrap:wrap}
  .abya .it.anul b,.abya .it.anul span{text-decoration:line-through;opacity:.55}
  .gmark{background:#3a2a1a;color:#8C6212;border-radius:20px;padding:1px 8px;font-size:10.5px;
    font-weight:700;text-transform:uppercase;letter-spacing:.04em;text-decoration:none!important;opacity:1!important}
  .gfix{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;text-decoration:underline;
    cursor:pointer;padding:0}
  .gfix:hover{color:var(--txt)}
  .gfixbox{padding:10px 0 14px;border-bottom:1px solid #EFE9DD}
  .gdel{width:100%;background:none;border:1px solid #9E3B2E;color:#9E3B2E;border-radius:11px;
    padding:11px;font:inherit;font-size:13px;cursor:pointer;margin-top:8px}
  .gdel:hover{background:#F4E2DE}
  /* ---- Caja de turno y gastos del fondo ---- */
  .cjbtn{width:100%;display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:14px 15px;margin-bottom:14px;cursor:pointer;text-align:left;color:var(--txt)}
  .cjbtn.urge{background:#F3EAD6;border-color:#8C6212}
  .cjbtn .em{font-size:24px;line-height:1}
  .cjbtn .tt{display:block;font-size:15px;font-weight:800;margin-bottom:2px}
  .cjbtn .ss{display:block;font-size:12px;color:var(--muted);line-height:1.35}
  .cjbtn.urge .ss{color:#8C6212}
  .cjbtn .cn{margin-left:auto;flex:0 0 auto;background:var(--gold);color:#FFFFFF;font-size:11px;
    font-weight:800;padding:4px 9px;border-radius:999px}
  .segs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:4px;margin-bottom:14px}
  .segs button{flex:1;appearance:none;border:0;background:none;color:var(--muted);font:inherit;
    font-size:13px;font-weight:700;padding:9px 6px;border-radius:9px;cursor:pointer}
  .segs button.on{background:var(--gold);color:#FFFFFF}
  .saldo{background:#E1F0E7;border:1px solid #1D6B4A;border-radius:14px;padding:13px 15px;margin-bottom:14px}
  .saldo .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:#1D6B4A;font-weight:700}
  .saldo .v{font-size:23px;font-weight:800;margin-top:2px}
  .recibir{background:#F3EAD6;border:1px solid #8C6212;border-radius:14px;padding:13px 15px;margin-bottom:10px}
  .recibir .t{font-size:14px;font-weight:800;margin-bottom:3px}
  .recibir .s{font-size:12.5px;color:#8C6212;line-height:1.4;margin-bottom:10px}
  .recibir .go{width:100%;padding:11px;border:0;border-radius:10px;background:var(--accent);color:#fff;
    font-size:14px;font-weight:800;cursor:pointer}
</style>
<script src="/embed-child.js"></script>
</head>
<body>
<div class="wrap">
  <div class="soon">⏳ <span><b>Próximamente</b> · versión beta — explora el catálogo; la reserva y el QR de venta se activan pronto.</span></div>
  <h1>Vende <span class="it">Experiencias</span></h1>
  <div class="sub" id="sub">Catálogo de Casa Pepe · Sincrético · tu link y QR de venta por experiencia.</div>

  <div class="cats" id="cats"></div>
  <div class="grid" id="grid"><div class="empty">Cargando experiencias…</div></div>

  <div class="foot">Casa Pepe · Experiencias — los precios y comisiones pueden cambiar.</div>
</div>

<div class="sheet" id="sheet"><div class="card" id="sheetCard"></div></div>
<div class="sheet" id="abSheet"><div class="card" id="abCard"></div></div>
<div class="sheet" id="buySheet"><div class="card" id="buyCard"></div></div>
<div class="sheet" id="cjSheet"><div class="card" id="cjCard"></div></div>

<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const params=new URLSearchParams(location.search);
const REF=(params.get('ref')||params.get('nombre')||'PEPE').toString();
const REF_NICE=(params.get('nombre')||REF);
const PROP=(params.get('prop')||'').trim();

const CATS=['Tours','Meet at Casa','Tiendita','Lavandería','Eventos o Grupos'];
const ICON={'Tours':'🗺️','Meet at Casa':'🏠','Tiendita':'🧺','Lavandería':'🫧','Eventos o Grupos':'🎉'};
let DATA=[], CURCAT='Tours';

/* Servicios de la casa que no son tours y por tanto no están en la tabla `tours`.
   Van aquí hasta que tengan su propio catálogo: una categoría vacía se lee como
   una app rota, y la lavandería ya tiene precio y horario acordados. */
/* Bono del que vende: en artesanía es el 10% de la pieza; en lavandería, el 25%. */
const BONO_PCT={'Tiendita':0.10,'Lavandería':0.25};
const bonoDe=(cat,pvp)=>Math.round((Number(pvp)||0)*(BONO_PCT[cat]||0));

const XIKA='https://arte.willstark-lab.workers.dev/';
/* Casi todas las piezas tienen recorte en /prototypes/cutouts; tres sólo tienen
   la foto de catálogo. Se pasa la ruta buena por pieza en vez de adivinarla. */
const fotoXika=(slug,cat)=> XIKA + (cat ? ('catalog/'+slug+'/'+slug+'-1.jpg')
                                        : ('prototypes/cutouts/'+slug+'.webp'));
const ART=(slug,nombre,artesano,pvp,que,cat)=>({
  id:'art-'+slug, cat:'Tiendita', slug:slug,
  nombre:nombre, pvp:pvp, artesano:artesano, pieza_unica:true,
  foto_url:fotoXika(slug,cat),
  bono_mxn:bonoDe('Tiendita',pvp),
  storytelling:'Pieza wixárika hecha a mano por '+artesano+'. '+que,
  incluye:'La pieza. Cada una es única: si se vende, sale del mostrador.',
  lugar_inicio:'Mostrador de la casa',
  info_importante:'No hay dos iguales ni se repone. El bono del que vende es el 10% de la pieza.'
});

/* Colección Xika — artesanía wixárika del mostrador. Vive aquí como semilla hasta
   que tenga su propia tabla: nombres, artesanos, precios y fotos son los reales.
   La Cabeza de jaguar salió del catálogo: se queda como pieza de habitación. */
const ARTESANIAS=[
  ART('mascara-de-chaquira-peyote','Máscara de peyote','Macario Matías Carrillo',2000,'Máscara forrada de chaquira, pieza escultórica.'),
  ART('nierika-cuadro','Figura de peyote (nierika)','Macario Matías Carrillo',1500,'Nierika tejido a mano con chaquira de vidrio.'),
  ART('tenis-de-chaquira','Tenis de chaquira','Macario Matías Carrillo',2500,'Tenis forrados a mano, uno por uno.',true),
  ART('morral-de-telar','Morral de telar','Arte Sano & Leocadra Carrillo',800,'Telar de cintura, bordado a mano.',true),
  ART('collar-medalla-flor-de-peyote','Collar medalla flor de peyote','Alicia Evangelista',800,'Con aretes a juego.',true),

  nombre:'Lavado por carga (hasta 3 kg)',
  pvp:80, prueba:true, bono_mxn:bonoDe('Lavandería',80),

  incluye:'Lavado, secado y doblado de una carga de hasta 3 kg.',

function catOf(t){
  if(t.cat) return t.cat;
  const nm=(t.nombre||'').toLowerCase();
  const li=(t.lugar_inicio||'').toLowerCase();
  if(/grupo|privado|evento/.test(nm)) return 'Eventos o Grupos';
  if(/c[oó]smica|terraza|taller|challenge|mezcalit|tortilla a mano/.test(nm+' '+li)) return 'Meet at Casa';
  return 'Tours';
}
function money(v){ if(v==null||v==='') return null; const n=Number(v); if(isNaN(n)) return null; return n===0?'Gratis':('$'+n.toLocaleString('es-MX')); }
function dur(m){ if(!m) return null; const h=Math.floor(m/60), mm=m%60; return ((h?h+'h':'')+(mm?(' '+mm+'m'):'')).trim() || (m+'m'); }
function esc(s){ return (s||'').toString().replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function bookingLink(t){ return 'https://casapepe.mx/x/'+(t.slug||'experiencia')+'?ref='+encodeURIComponent(REF); }

/* ---------- "Importante", legible ----------
   El campo trae de todo: avisos de verdad para el huésped mezclados con notas
   internas de auditoría (costeo, apartado de Turitop, sellos de fecha). Al que
   está vendiendo sólo le sirve lo primero, así que lo demás se descarta y el
   resto se pinta en viñetas con su icono. */

// Lo que NUNCA se le enseña a quien vende: proceso, precios internos, pendientes.
const IMP_FUERA=/turitop|cloudbeds|product_id|\bsku\b|costeo|comisi[oó]n|apartado|\bpvp\b|paso \d|pendiente antes de vender|regla del metro|en base figuraba|se corrige a|sin confirmar|inconsistente|^\s*\[|movilidad:.*%|pregunta viva|^\s*ruta:/i;

const IMP_ICONO=[
  [/calzado|zapato|tenis|bota|suela/i,'🥾'],
  [/protector solar|sombrero|gorra|el sol quema/i,'🧴'],
  [/agua|hidrat|deshidrat/i,'💧'],
  [/lluvia|impermeable|temporada de lluvias|clima/i,'🌧️'],
  [/altitud|altura|m\s*s\.?\s*n\.?\s*m|desnivel|cumbre|monta[ñn]a|volc[aá]n/i,'⛰️'],
  [/m[eé]dic|alergia|asma|diabetes|embarazo|cardiopat|respiratori|ficha m/i,'🩺'],
  [/edad m[ií]nima|identificaci[oó]n|18 a[ñn]os|mayor de edad/i,'🪪'],
  [/efectivo|no aceptan tarjeta|cajero/i,'💵'],
  [/propina/i,'🤝'],
  [/hora de retorno|puntual|salida en|se da la vuelta|retorno pactad/i,'⏰'],
  [/silla de ruedas|no apta|no apto|accesib|movilidad reducida/i,'♿'],
  [/foto|fotograf|permiso.*imagen/i,'📷'],
  [/seguro|p[oó]liza/i,'🛡️'],
  [/emergencia|911|protecci[oó]n civil|cenapred|sem[aá]foro/i,'🚨'],
  [/registro|caseta|parque nacional|cuota de acceso/i,'📋'],
  [/alcohol|beber|trago|margarita|cata|destilado/i,'🍹'],
  [/menores|ni[ñn]os/i,'🧒'],
  [/comida|alimento|intolerancia|vegetarian/i,'🍽️']
];
const IMP_ALTO=/no apto|no apta|obligatori|nunca|no se promete|no se sale|prohibid|riesgo/i;

function impIcono(s){ for(const [re,em] of IMP_ICONO) if(re.test(s)) return em; return '▸'; }

function impPartes(txt){
  return String(txt||'')
    .split(/\s*\|\|\s*|\n+|(?=\s\d{1,2}\)\s)/)      // separadores del campo
    .map(x=>x.replace(/^\s*\d{1,2}\)\s*/,'').trim())
    .filter(x=>x.length>3 && !IMP_FUERA.test(x))
    // Los párrafos largos se parten en frases para que quepan en una viñeta.
    .flatMap(x=> x.length>190 ? x.split(/(?<=\.)\s+(?=[A-ZÁÉÍÓÚÑ])/) : [x])
    .map(x=>x.trim()).filter(x=>x.length>3 && !IMP_FUERA.test(x));
}

function blkImp(val){
  const partes=impPartes(val);
  if(!partes.length) return '';
  return '<div class="blk"><div class="t">Importante</div><ul class="imp">'
    + partes.map(p=>{
        // El rótulo inicial en mayúsculas o antes de ':' se pone en negrita.
        const m=p.match(/^([A-ZÁÉÍÓÚÑ][A-ZÁÉÍÓÚÑ\s]{2,28})[:.—-]\s*(.+)$/);
        const cuerpo = m
          ? '<b>'+esc(m[1].trim().replace(/\s+/g,' '))+'.</b> '+esc(m[2])
          : esc(p).replace(/^([^:]{3,34}):\s/,'<b>$1:</b> ');
        return '<li class="'+(IMP_ALTO.test(p)?'alto':'')+'"><span class="em">'+impIcono(p)+'</span><span>'+cuerpo+'</span></li>';
      }).join('')
    + '</ul></div>';
}

/* La foto y el bono no viven en `tours`: viven en la unidad vendible, y la vista
   v_ficha_producto es la que las junta. Se piden aparte y se pegan por tour_id, para
   no tocar la consulta que ya funciona ni perder columnas por el camino. */
async function fichas(){
  try{
    const r=await fetch(SB_URL+'/rest/v1/v_ficha_producto?select=tour_id,foto_url,bono_colaborador_mxn,dto_huesped_mxn',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(!r.ok) return {};
    const m={}; (await r.json()).forEach(x=>{ if(x.tour_id) m[x.tour_id]=x; });
    return m;
  }catch(e){ return {}; }
}

async function load(){
  let extra={};
  try{
    const [r,f]=await Promise.all([
      // La casa manda: SoyPepe pasa ?prop y aquí sólo salen los tours de esa sede.
      fetch(SB_URL+'/rest/v1/tours?select=*&estatus=eq.activo'+(PROP?('&property_id=eq.'+encodeURIComponent(PROP)):'')+'&order=nombre.asc',{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}}),
      fichas()
    ]);
    DATA = r.ok ? (await r.json()) : [];
    extra=f;
  }catch(e){ DATA=[]; }
  DATA.forEach(t=>{ const x=extra[t.id]; if(x){ t.foto_url=x.foto_url; t.bono_mxn=x.bono_colaborador_mxn; t.dto_mxn=x.dto_huesped_mxn; } });
  DATA=DATA.concat(ARTESANIAS).concat(SERVICIOS);
  renderCats(); render();
  document.getElementById('sub').textContent = (REF_NICE && REF_NICE!=='PEPE') ? ('Hola '+REF_NICE+' — tu link y QR de venta van en cada experiencia.') : 'Catálogo de Casa Pepe · tu link y QR de venta por experiencia.';
}
function renderCats(){
  const c=document.getElementById('cats');
  c.innerHTML=CATS.map(k=>'<div class="chip'+(k===CURCAT?' on':'')+'" data-k="'+k+'">'+ICON[k]+' '+k+'</div>').join('');
  c.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ CURCAT=ch.dataset.k; renderCats(); render(); });
}
/* ¿Cuándo sale? Es la pregunta real del huésped que tiene delante, así que la
   lista se agrupa por eso y no por categoría ni por precio. */
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function cuando(t){
  const s=((t.fechas_salida||'')+' '+(t.dias_horario||'')).toLowerCase();
  if(!s.trim()) return 2;
  if(/diario|todos los d|everyday|daily|lun.*dom/.test(s)) return 0;
  const man=DIAS[(new Date().getDay()+1)%7];
  if(s.includes(man) || s.includes(man.slice(0,3))) return 0;
  if(DIAS.some(d=>s.includes(d)||s.includes(d.slice(0,3)))) return 1;
  return 2;
}
const GRUPO=['Salen mañana','Esta semana','Otros días'];

function tarjeta(t){
  const p=money(t.pvp), d=dur(t.duracion_min);
  const meta=[d,(t.personas_max?('hasta '+t.personas_max+' pax'):null)]
    .filter(Boolean).join(' · ') || (t.artesano?esc(t.artesano):(t.prueba?'Precio de prueba':''));
  const cuandoTxt=esc((t.fechas_salida||'').split(/[.\n]/)[0]||'');
  const linea=[cuandoTxt,meta].filter(Boolean).join(' · ');
  // Sin bono calculado no se inventa una cifra: se dice que falta, que es
  // distinto de ganar cero y es lo que hace que alguien lo reclame.
  const bono=Number(t.bono_mxn)>0
    ? '<span class="bono">ganas $'+Number(t.bono_mxn).toLocaleString('es-MX')+'</span>'
    : (Number(t.pvp)>0 ? '<span class="bono pend">bono por calcular</span>' : '');
  return '<div class="exp" data-i="'+DATA.indexOf(t)+'">'
    +'<span class="ph"><span class="ic">'+ICON[catOf(t)]+'</span>'
      +(t.foto_url?('<img src="'+esc(t.foto_url)+'" alt="" loading="lazy" onerror="this.remove()">'):'')+'</span>'
    +'<span class="cuerpo">'
      +'<h3>'+esc(t.nombre)+'</h3>'
      +'<span class="l">'+(linea||'&nbsp;')+'</span>'
      +'<span class="pre">'
        +(p?('<span class="pvp">'+(Number(t.pvp)>0&&!t.prueba&&!t.pieza_unica?'desde ':'')+p+'</span>'):'<span class="l">Consultar</span>')
        +bono
        +(t.pieza_unica?'<span class="tag">pieza única</span>':'')
      +'</span>'
    +'</span></div>';
}

function render(){
  const g=document.getElementById('grid');
  const items=DATA.filter(t=>catOf(t)===CURCAT);
  if(!items.length){
    g.innerHTML='<div class="empty">'+ICON[CURCAT]+' <b>'+CURCAT+'</b><br><br>Aún no hay opciones publicadas en esta categoría.<br>Muy pronto las verás aquí.</div>';
    return;
  }
  if(CURCAT==='Tours'){
    let html='';
    for(let k=0;k<3;k++){
      const bloque=items.filter(t=>cuando(t)===k);
      if(!bloque.length) continue;
      html+='<p class="grh">'+GRUPO[k]+'</p>'+bloque.map(tarjeta).join('');
    }
    g.innerHTML=html;
  } else {
    g.innerHTML=items.map(tarjeta).join('');
  }
  g.querySelectorAll('.exp').forEach(e=>e.onclick=()=>openFicha(DATA[+e.dataset.i]));
}
function openFicha(t){
  const p=money(t.pvp); const d=dur(t.duracion_min);

  const pills=[ d?('<span class="pill">⏱ <b>'+d+'</b></span>'):'', t.personas_max?('<span class="pill">👥 hasta <b>'+t.personas_max+'</b></span>'):'', p?('<span class="pill">💵 <b>'+p+'</b></span>'):'', t.idiomas?('<span class="pill">🗣 '+esc(t.idiomas)+'</span>'):'', t.comision_3os?('<span class="pill">🤝 comisión <b>'+t.comision_3os+'%</b></span>'):'' ].join('');
  function blk(title,val){ return val?('<div class="blk"><div class="t">'+title+'</div><div class="c">'+esc(val)+'</div></div>'):''; }
  const card=document.getElementById('sheetCard');
  const foto=t.foto_url ? ' foto" style="background-image:url(\''+esc(t.foto_url)+'\')' : '';
  // El bono no se enseña de entrada: esta ficha se le pone delante al huésped.
  const mibono=Number(t.bono_mxn)>0
    ? '<div class="mibono" id="mibono"><span class="l">Tu bono por persona</span>'
      +'<span class="v" id="bonoV">•••</span>'
      +'<button type="button" id="bonoB">ver</button></div>'
    : '';
  // El Gym del tour: se estudia donde se vende, no en una capacitación aparte.
  const gym=t.slug ? '<a class="gymbtn" id="gym" href="/m/pepequiz.html?modo=gym&tour='+encodeURIComponent(t.slug)
      +(REF_NICE&&REF_NICE!=='PEPE'?('&nombre='+encodeURIComponent(REF_NICE)):'')+'" target="_top">'
      +'<span>🎓</span><span>Gym de este tour<span class="ss">Practica sus preguntas y suma puntos en PepeQuiz</span></span>'
      +'<span class="ch">›</span></a>' : '';
  card.innerHTML=''
    +'<div class="hero'+foto+'"><span class="ic">'+ICON[catOf(t)]+'</span><button class="x" id="fx">×</button><h2>'+esc(t.nombre)+'</h2></div>'
    +'<div class="body">'
    +'<div class="row2">'+pills+'</div>'
    +mibono
    +(t.storytelling?('<p class="story">'+esc(t.storytelling)+'</p>'):'')

    +blk('No incluye', t.no_incluye)
    +blk('Punto de inicio', t.lugar_inicio)
    +blk('Salidas', t.fechas_salida)
    +blk('Política de cancelación', t.politica_cancelacion)
    +blkImp(t.info_importante)

  document.getElementById('sheet').classList.add('show');

    const oculto = v.textContent==='•••';

    v.style.letterSpacing = oculto ? '0' : '.16em';
    bb.textContent = oculto ? 'tapar' : 'ver';

  const vb=document.getElementById('vender');

function closeFicha(){ document.getElementById('sheet').classList.remove('show'); }

/* ================= Flujo de venta (beta) =================
   Tres pasos: cuánto y cuándo → confirmar → cómo se paga. Todavía no escribe
   reserva en la base: genera el QR y el link con el código de quien vende, que
   es lo único que hoy se puede acreditar de verdad. */
const DTO_PCT=0.05;                 // descuento del huésped, sobre el PVP bruto
let CP={t:null, n:1, fecha:'', paso:1, verBono:false};

function unidadDe(t){
  if(t.cat==='Tiendita') return ['Pieza','Piezas'];
  if(t.cat==='Lavandería') return ['Carga de 3 kg','Cargas de 3 kg'];
  return ['Persona','Personas'];
}
function maxDe(t){
  if(t.pieza_unica) return 1;                       // no hay dos iguales
  if(t.personas_max) return Number(t.personas_max);
  return 20;
}
function totalCP(){
  const pvp=Number(CP.t.pvp)||0, n=CP.n;
  const bruto=pvp*n;
  // El descuento del 5% es de tours; en tiendita y lavandería se cobra el precio.
  const dto = CP.t.cat ? 0 : Math.round(bruto*DTO_PCT);
  const bono = CP.t.cat
    ? bonoDe(CP.t.cat, pvp)*n
    : (Number(CP.t.bono_mxn)||0)*n;
  return {bruto, dto, total:bruto-dto, bono};
}
function linkCompra(){
  const t=CP.t;
  return 'https://casapepe.mx/x/'+(t.slug||t.id)+'?ref='+encodeURIComponent(REF)
    +'&n='+CP.n+(CP.fecha?('&d='+CP.fecha):'');
}

function abreCompra(t){
  CP={t:t, n:1, fecha:'', paso:1, verBono:false};
  document.getElementById('buySheet').classList.add('show');
  pintaCompra();
}
function cierraCompra(){ document.getElementById('buySheet').classList.remove('show'); }

function pintaCompra(){
  const t=CP.t, c=document.getElementById('buyCard');
  const [uno,varios]=unidadDe(t), max=maxDe(t), q=totalCP();
  const barra='<div class="paso">'+[1,2,3].map(k=>'<i class="'+(k<=CP.paso?'on':'')+'"></i>').join('')+'</div>';
  const cab='<div class="hero'+(t.foto_url?' foto" style="background-image:url(\''+esc(t.foto_url)+'\')':'')+'">'
    +'<button class="x" id="bx">×</button><h2>'+esc(t.nombre)+'</h2></div>';

  if(CP.paso===1){
    const fechas=(t.fechas_salida||t.dias_horario||'');
    c.innerHTML=cab+'<div class="body">'+barra
      +'<div class="beta">⏳ Versión de prueba: se genera el QR y el link con tu código, pero la reserva todavía no se guarda.</div>'
      +(t.cat==='Tiendita' ? '' :
        '<div class="campo"><label>¿Qué día?'+(fechas?(' · '+esc(fechas.split(/[.\n]/)[0])):'')+'</label>'
        +'<input type="date" id="fch" min="'+new Date(Date.now()+864e5).toISOString().slice(0,10)+'" value="'+esc(CP.fecha)+'"></div>')
      +'<div class="step"><span class="lb">'+(CP.n===1?uno:varios)
        +(t.pieza_unica?'<span>Pieza única: sólo hay una</span>':'')+'</span>'
        +'<span class="ct"><button class="bt" id="menos"'+(CP.n<=1?' disabled':'')+'>−</button>'
        +'<span class="n">'+CP.n+'</span>'
        +'<button class="bt" id="mas"'+(CP.n>=max?' disabled':'')+'>+</button></span></div>'
      +resumenHTML(q)
      +'<button class="bpri" id="sig">Continuar</button>'
      +'</div>';
  } else if(CP.paso===2){
    c.innerHTML=cab+'<div class="body">'+barra
      +'<div class="res">'
        +'<div class="r"><span>'+esc(t.nombre)+'</span><span>'+CP.n+' × '+money(t.pvp)+'</span></div>'
        +(CP.fecha?('<div class="r"><span>Fecha</span><span>'+esc(CP.fecha.split("-").reverse().join("/"))+'</span></div>'):'')
        +'<div class="r"><span>Vendido por</span><span>'+esc(REF_NICE)+'</span></div>'
      +'</div>'
      +resumenHTML(q)
      +'<button class="bpri" id="sig">Cobrar</button>'
      +'<button class="bsec" id="atr">Atrás</button>'
      +'</div>';
  } else {
    c.innerHTML=cab+'<div class="body">'+barra
      +'<div class="sell" style="text-align:center">'
        +'<div class="lbl">Que lo escanee</div>'
        +'<div class="who">Se abre con tu código ya puesto. Sirve para el huésped que no tiene la app.</div>'
        +'<div class="qr" id="qb2"></div>'
        +'<div class="link">'+esc(linkCompra())+'</div>'
        +'<button class="copy" id="cp2">📋 Copiar mi link</button>'
      +'</div>'
      +'<button class="bsec" id="chat">💬 Mandar por Pepe Chat</button>'
      +'<button class="bsec" id="efe">💵 Cobrar en efectivo · lo deposito en PepeCash</button>'
      +'<div class="beta" id="hecho" style="display:none">✓ Anotado en esta prueba. Cuando el motor esté conectado, aquí queda la reserva a tu nombre.</div>'
      +'<button class="bsec" id="cerrar">Cerrar</button>'
      +'</div>';
    const qb=document.getElementById('qb2');
    try{ new QRCode(qb,{text:linkCompra(),width:170,height:170,colorDark:'#1F1B16',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M}); }
    catch(e){ qb.textContent='QR no disponible'; }
  }

  const $b=id=>document.getElementById(id);
  if($b('bx')) $b('bx').onclick=cierraCompra;
  if($b('cerrar')) $b('cerrar').onclick=()=>{ cierraCompra(); closeFicha(); };
  if($b('menos')) $b('menos').onclick=()=>{ if(CP.n>1){CP.n--; pintaCompra();} };
  if($b('mas')) $b('mas').onclick=()=>{ if(CP.n<max){CP.n++; pintaCompra();} };
  if($b('fch')) $b('fch').onchange=e=>{ CP.fecha=e.target.value; };
  if($b('ojo2')) $b('ojo2').onclick=()=>{ CP.verBono=!CP.verBono; pintaCompra(); };
  if($b('atr')) $b('atr').onclick=()=>{ CP.paso=1; pintaCompra(); };
  if($b('sig')) $b('sig').onclick=()=>{ CP.paso++; pintaCompra(); };
  if($b('cp2')) $b('cp2').onclick=async()=>{ try{ await navigator.clipboard.writeText(linkCompra());
    $b('cp2').textContent='✓ Copiado'; setTimeout(()=>{ const x=$b('cp2'); if(x) x.textContent='📋 Copiar mi link'; },1600); }catch(e){} };
  if($b('chat')) $b('chat').onclick=()=>{ $b('hecho').style.display='block'; };
  if($b('efe')) $b('efe').onclick=()=>{ $b('hecho').style.display='block'; };
}

/* El bono va tapado: esta pantalla se le enseña al huésped. */
function resumenHTML(q){
  return '<div class="res">'
    +'<div class="r"><span>Subtotal</span><span>$'+q.bruto.toLocaleString('es-MX')+'</span></div>'
    +(q.dto?('<div class="r"><span>Descuento del huésped</span><span>−$'+q.dto.toLocaleString('es-MX')+'</span></div>'):'')
    +'<div class="r tot"><span>Paga el huésped</span><span>'
      +(q.dto?('<span class="tach">$'+q.bruto.toLocaleString('es-MX')+'</span>'):'')
      +'$'+q.total.toLocaleString('es-MX')+'</span></div>'
    +(q.bono?('<div class="r oc"><span>Tu bono</span><span>'

<!-- ================= Comprobante de A&B de la noche =================
     Sincrético liquida las experiencias por transferencia a 30 días, así que la
     auditoría no le pide depósito a ninguna terminal. Lo que sí pide es la prueba
     de que la noche se cobró: la foto del ticket de A&B firmado. Se sube desde aquí
     y aparece en el cierre del día. -->
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
// Misma configuración que la app: comparten origen, así que comparten la sesión.
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});

const $=id=>document.getElementById(id);
const E=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MX=n=>Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});

let NOCHE=null, PICK=null, FOTO=null, ABTAB='pago', GPICK=null;

async function cargaNoche(){
  try{
    const { data, error }=await sb.rpc('aud_experiencias_noche');
    if(error||!data||!data.ok) return null;
    return data;
  }catch(e){ return null; }
}

// El teléfono saca fotos de 4 MB que nadie va a ampliar. Se reducen antes de subir
// para que el anfitrión no se quede esperando en una terraza sin señal.
function achica(file){
  return new Promise(res=>{
    if(!/^image\//.test(file.type||'')) return res(file);
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      const max=1600, e=Math.min(1,max/Math.max(img.width,img.height));
      if(e>=1){ URL.revokeObjectURL(url); return res(file); }
      const cv=document.createElement('canvas');
      cv.width=Math.round(img.width*e); cv.height=Math.round(img.height*e);
      cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
      cv.toBlob(b=>{ URL.revokeObjectURL(url); res(b?new File([b],'ticket.jpg',{type:'image/jpeg'}):file); },'image/jpeg',0.82);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); res(file); };
    img.src=url;
  });
}

/* Esta pantalla es de VENTA: el catálogo de experiencias y nada más. Subir papeles

// ¿Este fondo es de Experiencias? Sólo esos equipos suben el pago de A&B: el ticket

function esExperiencias(fondo){
  return !!fondo && String(fondo.departamento||'').toLowerCase()==='experiencias';
}

  const fondos=(CAJA&&CAJA.fondos)||[];
  if(GPICK===null && fondos.length) GPICK=fondos[0].id;
  const fondo=fondos.find(x=>x.id===GPICK)||fondos[0];
  // Quién puede subir el ticket firmado lo dice el servidor (por área, tabla
  // auditoria.area_comprobante). Antes dependía de llevar un fondo de caja de
  // Experiencias, y el único responsable de ese fondo es un recepcionista: los
  // que hacen la noche no tenían por dónde entrar.
  const puedeSubir = !!(NOCHE && NOCHE.puede_subir) || esExperiencias(fondo);
  const hayPago = puedeSubir && exps.length>0;
  if(!hayPago) ABTAB='gasto';

  // Subir el ticket no necesita fondo. Si no llevas ninguno pero sí puedes
  // subirlo, esta pantalla es sólo eso y no habla de gastos.
  if(!fondos.length && hayPago){
    $('abCard').innerHTML='<div id="abBody"></div>';

    pintaPago(document.getElementById('abBody'), exps, ya, f, true);
    return;
  }

  if(!fondos.length){
    $('abCard').innerHTML='<h2>Gasto de caja</h2>'
      +'<p class="lede">No llevas ningún fondo de caja, así que no hay nada que registrar aquí. '
      +'Si crees que sí deberías llevarlo, dile a Roberto que te ponga como responsable de tu caja.</p>';
    return;
  }

  if(hayPago){
    $('abCard').innerHTML='<h2>Gasto de caja</h2>'
      +'<div class="segs">'
        +'<button type="button" data-abtab="gasto" class="'+(ABTAB==='gasto'?'on':'')+'">Gasto del fondo</button>'
        +'<button type="button" data-abtab="pago" class="'+(ABTAB==='pago'?'on':'')+'">Pago de A&amp;B</button>'
      +'</div><div id="abBody"></div>';
    $('abCard').querySelectorAll('[data-abtab]').forEach(b=>b.onclick=()=>{ ABTAB=b.dataset.abtab; pintaSheet(); });
    if(ABTAB==='pago'){ pintaPago(document.getElementById('abBody'), exps, ya, f); return; }
    pintaGasto(document.getElementById('abBody'));

  $('abCard').innerHTML='<h2>Gasto de caja</h2><div id="abBody"></div>';
  pintaGasto(document.getElementById('abBody'));
}

/* Corregir un gasto ya capturado. Antes, un ticket con la fecha mal sólo se podía
   arreglar volviendo a subirlo, y el malo se quedaba contando. */
const fdmy=f=>{const s=String(f||'').slice(0,10).split('-');return s.length===3?(s[2]+'/'+s[1]):s[0];};
let GFIX=null;
function abreCorregir(id){ GFIX = (GFIX===id) ? null : id; pintaGFix(); }
function pintaGFix(){
  document.querySelectorAll('.gfixbox').forEach(x=>x.remove());
  if(!GFIX) return;
  const g=((CAJA&&CAJA.gastos)||[]).find(x=>x.id===GFIX); if(!g) return;
  const fila=document.querySelector('[data-gid="'+GFIX+'"]'); if(!fila) return;
  const fondo=((CAJA&&CAJA.fondos)||[]).find(x=>x.id===g.caja_id);
  const dep=fondo&&fondo.departamento;
  const ctas=dep ? (CTAS&&CTAS[dep] ? [[dep,CTAS[dep]]] : [])
                 : Object.keys(CTAS||{}).map(k=>[k,CTAS[k]]);
  const box=document.createElement('div'); box.className='gfixbox';
  box.innerHTML='<div class="flds">'
    +'<input id="gfFecha" type="date" value="'+E(String(g.fecha).slice(0,10))+'">'
    +'<input id="gfMonto" type="number" inputmode="decimal" step="0.01" value="'+Number(g.monto||0).toFixed(2)+'">'
    +'</div>'
    +'<select id="gfCta" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:11px;font-size:14px;font-family:inherit;margin-bottom:8px">'
    +ctas.map(gr=>(gr[1]||[]).length
        ? '<optgroup label="'+E(gr[0])+'">'
          +(gr[1]||[]).map(c=>'<option value="'+E(c[0])+'"'+(c[0]===g.cuenta_codigo?' selected':'')+'>'+E(c[1])+'</option>').join('')
          +'</optgroup>' : '').join('')
    +'</select>'
    +'<textarea id="gfConcepto">'+E(g.concepto||'')+'</textarea>'
    +'<button class="abgo" id="gfGo">Guardar la corrección</button>'
    +'<button type="button" class="gdel" id="gfDel">Este gasto sobra — anularlo</button>'
    +'<div class="abmsg" id="gfMsg"></div>';
  fila.after(box);
  box.querySelector('#gfGo').onclick=()=>guardaGFix(g);
  box.querySelector('#gfDel').onclick=()=>anulaGasto(g);
}
async function guardaGFix(g){
  const btn=$('gfGo'), msg=$('gfMsg'); btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…';
  try{
    const { data, error }=await sb.rpc('aud_caja_gasto_editar',{p:{id:g.id,
      fecha:$('gfFecha').value, monto:$('gfMonto').value,
      cuenta_codigo:$('gfCta').value, concepto:$('gfConcepto').value}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo corregir.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; GFIX=null; setTimeout(()=>pintaSheet(), 900);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo corregir.';
             btn.disabled=false; btn.textContent=t; }
}
async function anulaGasto(g){
  const msg=$('gfMsg');

    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo anular.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; GFIX=null; setTimeout(()=>pintaSheet(), 900);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo anular.';
             btn.disabled=false; btn.textContent=t; }
}

async function guardaGasto(){
  const btn=$('gGo'), msg=$('gMsg');
  if(!GFOTO) return;
  if(!$('gCta').value){ msg.style.color='#9E3B2E'; msg.textContent='Elige a qué cuenta va el gasto.'; return; }
  if(!$('gMonto').value){ msg.style.color='#9E3B2E'; msg.textContent='Pon cuánto costó.'; return; }

  btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…'; msg.textContent='';
  try{
    const ext={'application/pdf':'pdf','image/png':'png','image/webp':'webp','image/heic':'heic'}[GFOTO.type]||'jpg';
    const path=(CAJA.property_id||'sin-prop')+'/gastos/'+$('gFecha').value+'/'+GPICK+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('comprobantes').upload(path,GFOTO,{contentType:GFOTO.type||'image/jpeg'});
    if(up.error) throw up.error;
    const { data, error }=await sb.rpc('aud_caja_gasto_guardar',{p:{caja_id:GPICK,
      fecha:$('gFecha').value, cuenta_codigo:$('gCta').value, concepto:$('gConcepto').value,
      monto:$('gMonto').value, tour_id:$('gTour').value||null, foto_path:path}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo guardar.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    GFOTO=null; CAJA=await cargaCaja()||CAJA;
    setTimeout(()=>pintaSheet(), 1100);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo guardar.';
             btn.disabled=false; btn.textContent=t; }
}

async function guarda(){
  const btn=$('abGo'), msg=$('abMsg');
  if(!FOTO||!PICK) return;
  btn.disabled=true; const t=btn.textContent; btn.textContent='Guardando…'; msg.textContent='';
  try{
    // La extensión sale del tipo real: si la foto ya venía pequeña no se reencodea,
    // y llamarla .jpg cuando es png deja el archivo con el nombre cambiado.
    const ext={'application/pdf':'pdf','image/png':'png','image/webp':'webp','image/heic':'heic'}[FOTO.type]||'jpg';
    const path=NOCHE.property_id+'/'+NOCHE.fecha+'/'+PICK+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('comprobantes').upload(path,FOTO,{contentType:FOTO.type||'image/jpeg'});
    if(up.error) throw up.error;

    const { data, error }=await sb.rpc('aud_comprobante_guardar',{p:{
      categoria:PICK, fecha:NOCHE.fecha, foto_path:path,
      monto:$('abMonto').value||null, personas:$('abPax').value||null,
      ticket_folio:(NOCHE.experiencias.find(x=>x.categoria===PICK)||{}).ticket_folio||null,
      nota:$('abNota').value||null }});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo guardar.');

    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    FOTO=null;
    NOCHE=await cargaNoche()||NOCHE;
    setTimeout(()=>{ pintaSheet(); const m=$('abMsg'); if(m){ m.style.color='#1D6B4A'; m.textContent='✓ Guardado.'; } },900);
  }catch(e){
    msg.style.color='#9E3B2E';
    msg.textContent = (e&&e.message) ? e.message : 'No se pudo guardar. Revisa tu señal e inténtalo otra vez.';
    btn.disabled=false; btn.textContent=t;
  }
}

/* ================= Caja de turno y gastos del fondo =================
   Los $2,000 del fondo de A&B no son de nadie: van pasando de mano en mano toda la
   jornada. Aquí cada quien dice a quién se la deja y cuánto contó, y quien la recibe
   la vuelve a contar y la acepta. Si las dos cuentas no coinciden, queda escrito. */
let CAJA=null, CJTAB='entregar', CJPICK=null, GFOTO=null, CTAS=null, TOURS=[];

async function cargaCaja(){
  try{ const { data, error }=await sb.rpc('aud_caja_mi_turno');
       return (error||!data||!data.ok) ? null : data; }
  catch(e){ return null; }
}
async function cargaCuentas(){
  if(CTAS) return CTAS;
  try{ const { data }=await sb.rpc('aud_cuentas_gasto'); CTAS=data||{}; }catch(e){ CTAS={}; }
  return CTAS;
}
async function cargaTours(){
  if(TOURS.length) return TOURS;
  // Cada tour sabe de qué casa es: en Puebla no tienen por qué salir los de México.
  const prop = (CAJA && CAJA.property_id) || null;
  try{ let q=sb.from('tours').select('id,nombre').eq('estatus','activo').order('nombre');
       if(prop) q=q.eq('property_id',prop);
       const { data }=await q; TOURS=data||[]; }catch(e){ TOURS=[]; }
  return TOURS;
}


/* A quién se la puedo entregar, por orden: quien está en turno ahora, el área DE
   LA CAJA, el auditor, administración. La lista la calcula la base por caja
   —auditoria.gente_para_caja—, no es la plantilla entera de la casa: una caja de
   A&B no se le puede dejar a housekeeping. Aquí sólo se agrupa. */
function cjGrupos(gente){
  const orden=['En turno ahora','Su área','Auditoría','Administración'];
  const por={}; (gente||[]).forEach(g=>{ const k=g[3]; if(!k) return; (por[k]=por[k]||[]).push(g); });
  return orden.filter(k=>por[k]).map(k=>'<optgroup label="'+E(k)+'">'
    +por[k].map(g=>'<option value="'+E(g[0])+'">'+E(g[1])+(g[2]?' · '+E(g[2]):'')+'</option>').join('')
    +'</optgroup>').join('');
}

function pintaCjSheet(){
  const cajas=CAJA.cajas||[], pend=CAJA.por_recibir||[], mias=CAJA.sin_aceptar||[];
  // Si hay una caja esperándole, se abre por ahí — pero sólo al entrar: en cuanto
  // toca una pestaña, manda él.
  if(CJPICK===null && pend.length) CJTAB='recibir';
  // Aquí sólo llegan las cajas que uno LLEVA. Dirección y contabilidad ya no
  // las ven todas desde aquí: el relevo es de quien la tiene en la mano, y la
  // vigilancia vive en el cuadre de efectivo, no en el bolsillo del que releva.
  if(CJPICK===null && cajas[0]) CJPICK=cajas[0].id;
  // La lista de a quién se la puedo dejar es la DE ESTA CAJA, no una global.
  const cajaSel=cajas.find(c=>c.id===CJPICK)||cajas[0]||null;
  const gente=(cajaSel&&cajaSel.gente)||[];

  const fila=c=>'<label class="'+(c.id===CJPICK?'on':'')+'" data-cj="'+E(c.id)+'">'
      +'<input type="radio" name="cjx"'+(c.id===CJPICK?' checked':'')+'>'
      +'<span><span class="nm">'+(c.icono||'')+' '+E(c.nombre)+'</span>'
      // La caja es el FONDO, no el saldo del libro. En CDMX la venta se
      // deposita cada turno en CashProtect y no se entrega; en Puebla no hay
      // caja fuerte, se acumula, y va aparte.
      +'<span class="dt">Fondo $'+MX(c.fondo)
      +(c.area?(' · caja de '+E(c.area)):'')
      +(c.entrega_venta
          ? '<br>+ venta acumulada · el libro dice $'+MX(c.venta_libro)
          : '<br>La venta no se entrega: se deposita cada turno')
      +'</span></span></label>';
  const grupo=(t,l)=>l.length
    ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin:2px 0 6px">'+t+'</label>'
      +'<div class="expsel">'+l.map(fila).join('')+'</div>'
    : '';

  const tabEntregar=(cajas.length
      ? grupo(cajas.length>1?'Las que llevas':'La que llevas', cajas)
      : '<div class="expsel"><div class="lede" style="margin:0">No llevas ninguna caja de turno. '
        +'Si crees que sí deberías llevarla, dile a Roberto de qué área es esa caja.</div></div>')
    +(cajas.length ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">'
      +'El fondo'+(cajaSel?' · deberían ser $'+MX(cajaSel.fondo):'')+'</label>'
      +'<div class="flds">'
      +'<input id="cjMonto" type="number" inputmode="decimal" step="0.01" placeholder="¿Cuánto contaste del fondo?">'
      +'</div>'
      // El campo de la venta sólo existe donde la venta se entrega de verdad.
      // Si no, pedirlo invita a meter en la caja dinero que ya se depositó.
      +((cajaSel&&cajaSel.entrega_venta)
        ? '<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">La venta que llevas anotada</label>'
          +'<div class="flds">'
          +'<input id="cjVenta" type="number" inputmode="decimal" step="0.01" placeholder="0.00">'
          +'</div>'
          // El fin de semana la venta no llega a administración: se guarda.
          // Se avisa antes de intentarlo; el servidor lo impide igualmente.
          +(cajaSel.venta_hoy_a_admin===false
            ? '<div class="lede" style="margin:-4px 0 12px;font-size:12px">'
              +'<b>Hoy no se entrega la venta a administración.</b> Es fin de semana: '
              +'se queda en la caja fuerte y se entrega el lunes. El fondo sí sigue '
              +'pasando de turno en turno con normalidad.</div>'
            : '')
          +((cajaSel.ruta||[]).length
            ? '<div class="lede" style="margin:-4px 0 12px;font-size:12px">'
              +'Esta venta va: '+cajaSel.ruta.map(E).join(' → ')+'.</div>'
            : '')
        : '<div class="lede" style="margin:-4px 0 12px;font-size:12px">Aquí sólo se entrega el fondo. '
          +'La venta del turno se deposita en la caja fuerte, no pasa de mano en mano.</div>')
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Se la entrego a</label>'
      +'<select id="cjQuien" style="width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:11px;padding:12px;font-size:14px;font-family:inherit;margin-bottom:12px">'
      +'<option value="">— elige a quién —</option>'
      +cjGrupos(gente)
      +'</select>'
      +'<textarea id="cjNota" placeholder="¿Algo que aclarar? (opcional)"></textarea>'
      +'<button class="abgo" id="cjGo">Entregar la caja</button>' : '')
    +(mias.length?('<div class="abya"><div class="t">Entregadas y sin aceptar</div>'
       +mias.map(k=>'<div class="it"><b>'+E(k.caja)+'</b><span>$'+MX(k.monto)+'</span>'
         +'<span style="margin-left:auto">'+E(k.para)+' · '+E(k.cuando)+'</span></div>').join('')+'</div>'):'');

  const tabRecibir = pend.length ? pend.map(k=>{
      const f=Number(k.fondo!=null?k.fondo:k.monto)||0, v=Number(k.venta||0);
      return '<div class="recibir" data-rec="'+E(k.id)+'">'
      +'<div class="t">'+(k.icono||'')+' '+E(k.caja)+'</div>'
      +'<div class="s">Te la dejó <b>'+E(k.de)+'</b> el '+E(k.cuando)+': fondo $'+MX(f)
      +(v?(' y venta $'+MX(v)):'')+'. Cuéntala tú antes de aceptarla.</div>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">El fondo</label>'
      +'<div class="flds"><input class="rcMonto" type="number" inputmode="decimal" step="0.01" '
      +'value="'+f.toFixed(2)+'"></div>'
      +'<label class="dt" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">La venta</label>'
      +'<div class="flds"><input class="rcVenta" type="number" inputmode="decimal" step="0.01" '
      +'value="'+v.toFixed(2)+'"></div>'
      +'<button type="button" class="cjdif" style="background:none;border:0;color:var(--muted);'
      +'font:inherit;font-size:12px;text-decoration:underline;padding:0 0 10px;cursor:pointer">'
      +'Conté algo distinto — anotar por qué</button>'
      +'<textarea class="rcNota" hidden placeholder="¿Qué contaste y por qué crees que no cuadra?"></textarea>'
      +'<button class="go">Contada y aceptada</button></div>'; }).join('')
    : '<div class="lede" style="margin:0">Nadie te ha dejado una caja ahora mismo.</div>';

  $('cjCard').innerHTML=''
    +'<h2>Caja de turno</h2>'
    +'<p class="lede">El fondo va pasando de turno en turno. Quien la deja dice cuánto contó, '
    +'y quien la toma la vuelve a contar. Así, si un día falta, se sabe entre qué dos manos.</p>'
    +'<div class="segs">'
      +'<button type="button" data-cjtab="entregar" class="'+(CJTAB==='entregar'?'on':'')+'">Entregar</button>'
      +'<button type="button" data-cjtab="recibir" class="'+(CJTAB==='recibir'?'on':'')+'">'
        +'Recibir'+(pend.length?' ('+pend.length+')':'')+'</button>'
    +'</div>'
    +(CJTAB==='entregar'?tabEntregar:tabRecibir)
    +'<div class="abmsg" id="cjMsg"></div>';

  $('cjCard').querySelectorAll('[data-cjtab]').forEach(b=>b.onclick=()=>{ CJTAB=b.dataset.cjtab; pintaCjSheet(); });
  $('cjCard').querySelectorAll('[data-cj]').forEach(l=>l.onclick=()=>{ CJPICK=l.dataset.cj; pintaCjSheet(); });
  const go=$('cjGo'); if(go) go.onclick=entregaCaja;
  $('cjCard').querySelectorAll('[data-rec] .go').forEach(b=>b.onclick=()=>recibeCaja(b.closest('[data-rec]')));
  $('cjCard').querySelectorAll('[data-rec] .cjdif').forEach(b=>b.onclick=()=>{
    const t=b.closest('[data-rec]').querySelector('.rcNota'); t.hidden=false; b.hidden=true; t.focus(); });
}

async function entregaCaja(){
  const btn=$('cjGo'), msg=$('cjMsg');
  const quien=$('cjQuien').value, monto=$('cjMonto').value, venta=($('cjVenta')||{}).value||'0';
  if(!quien){ msg.style.color='#9E3B2E'; msg.textContent='Elige a quién le entregas la caja.'; return; }
  if(!monto){ msg.style.color='#9E3B2E'; msg.textContent='Cuenta el fondo y pon cuánto hay.'; return; }
  btn.disabled=true; const t=btn.textContent; btn.textContent='Entregando…'; msg.textContent='';
  try{
    const { data, error }=await sb.rpc('aud_caja_entregar',{p:{caja_id:CJPICK,
      recibe_employee_id:quien, monto_fondo:monto, monto_venta:venta,
      nota:$('cjNota').value||null}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo entregar.');
    msg.style.color='#1D6B4A'; msg.textContent='✓ '+data.mensaje;
    CAJA=await cargaCaja()||CAJA; pintaCjBoton();
    setTimeout(()=>pintaCjSheet(), 1100);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo entregar.';
             btn.disabled=false; btn.textContent=t; }
}

async function recibeCaja(box){
  const btn=box.querySelector('.go'), msg=$('cjMsg');
  btn.disabled=true; const t=btn.textContent; btn.textContent='Aceptando…'; msg.textContent='';
  try{
    const nt=box.querySelector('.rcNota');
    const { data, error }=await sb.rpc('aud_caja_recibir',{p:{id:box.dataset.rec,
      monto_fondo:box.querySelector('.rcMonto').value,
      monto_venta:(box.querySelector('.rcVenta')||{}).value||'0',
      nota:(nt&&!nt.hidden&&nt.value.trim())||null}});
    if(error) throw error;
    if(!data||!data.ok) throw new Error((data&&data.mensaje)||'No se pudo aceptar.');
    msg.style.color = Math.abs(Number(data.diferencia||0))<0.01 ? '#1D6B4A' : '#8C6212';
    msg.textContent=data.mensaje;
    CAJA=await cargaCaja()||CAJA; pintaCjBoton();
    setTimeout(()=>pintaCjSheet(), 1400);
  }catch(e){ msg.style.color='#9E3B2E'; msg.textContent=(e&&e.message)||'No se pudo aceptar.';
             btn.disabled=false; btn.textContent=t; }
}

(async()=>{
  // Se puede llegar aquí desde el círculo de "Para ti", que pide una pantalla concreta.
  const abrir=new URLSearchParams(location.search).get('abrir');
  NOCHE=await cargaNoche();
  CAJA=await cargaCaja();
  // La caja de turno se abre desde "Para ti", no desde aquí: esta pantalla es de venta.
  if(CAJA && abrir==='caja'){
    CJPICK=null; await cargaCuentas(); pintaCjSheet(); $('cjSheet').classList.add('show');
  }
  // El único gesto de caja que se abre aquí es el que pide «Para ti» por la URL.
  // Va a pantalla completa —sin fondo que cerrar—: quien entra viene a la caja.
  if(abrir==='gasto' || abrir==='comprobante'){
    PICK=null; FOTO=null; GFOTO=null; GPICK=null;
    ABTAB = abrir==='comprobante' ? 'pago' : 'gasto';
    await cargaCuentas(); await cargaTours(); pintaSheet(); $('abSheet').classList.add('show');
  }
})();
</script>
