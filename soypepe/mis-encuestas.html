<!doctype html><html lang="es"><head>
<meta charset="utf-8">

<title>Mis Encuestas · Soy Pepe</title>
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--azul:#2F6DB5;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(96px + var(--safe-b))}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 6px;font-size:12.5px;font-weight:700;color:var(--soft);cursor:pointer;line-height:1.2}
.tabs button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:19px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.state{text-align:center;color:var(--muted);padding:24px}
.note{background:#eef4fc;border-left:3px solid var(--azul);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#28537f;line-height:1.45}
.note.gold{background:#fff7e6;border-color:var(--gold);color:#6b5320}
.note.verde{background:#e8f6ef;border-color:var(--accent);color:#14573f}
.card.oblig{border:2px solid var(--accent);background:#f3fbf7}
.card.reco{border:2px solid var(--azul);background:#f5f9ff}
.etq{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:3px 9px;margin-bottom:6px;color:#fff}
.etq.v{background:var(--accent)}.etq.a{background:var(--azul)}
.card.oblig .go{color:var(--accent)}.row .ok{color:var(--accent);font-weight:700;font-size:12.5px;white-space:nowrap}
.tabs button .bd{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:4px}
.cap{font-size:12.5px;color:var(--soft);background:#eef4fc;border:1px solid #cfe0f5;border-radius:10px;padding:8px 11px;margin-bottom:10px}
.cap b{color:var(--azul)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:12px 2px;cursor:pointer}
.row:first-of-type{border-top:0}
.row .n{font-size:14.5px;font-weight:600}.row .a{font-size:12px;color:var(--muted)}
.row .go{color:var(--azul);font-weight:700;font-size:13px;white-space:nowrap}
.buscar{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;margin:4px 0 8px}
.bloque{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:18px 2px 2px}
.q{border-top:1px solid var(--line);padding:14px 2px 10px}.q:first-of-type{border-top:0}
.q .txt{font-size:14.5px;line-height:1.4;margin-bottom:10px}.q .num{color:var(--muted);font-weight:700;margin-right:6px}
.esc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.esc button{border:1.5px solid var(--line);background:#fffdf8;border-radius:10px;padding:11px 0;font-size:15px;font-weight:700;color:var(--soft);cursor:pointer}
.esc button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.polos{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:5px}
.polos span{max-width:46%}.polos span:last-child{text-align:right}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;min-height:72px;resize:vertical}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:6px 12px calc(6px + var(--safe-b));z-index:20}
.barra.escribiendo{display:none}
.barra .in{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:4px}
.barra .bts{display:flex;gap:8px}
.benv{flex:1.4;background:var(--accent);color:#fff;border:0;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;cursor:pointer;line-height:1.2}
.benv[disabled]{opacity:.45;cursor:default}
.bcanc{flex:1;background:#fff;color:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:12.5px;font-weight:600;cursor:pointer;line-height:1.2}
.cnt{font-size:11px;color:var(--muted);text-align:center}
.msg{font-size:12px;font-weight:600;text-align:center}.msg:empty{display:none}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
.kpi{display:flex;align-items:baseline;justify-content:center;gap:8px;margin:6px 0 2px}
.kpi .big{font-size:34px;font-weight:800;color:var(--azul)}.kpi .max{font-size:14px;color:var(--muted)}
.vbar{display:flex;align-items:center;gap:8px;border-top:1px solid var(--line);padding:10px 2px}
.vbar .lb{flex:1;font-size:12.5px}.vbar .track{width:84px;height:8px;border-radius:4px;background:#eee;position:relative;overflow:hidden}
.vbar .fill{position:absolute;left:0;top:0;bottom:0;background:var(--azul)}.vbar .pv{font-size:12px;font-weight:700;color:var(--azul);width:34px;text-align:right}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.gracias{text-align:center;padding:26px 14px}.gracias .em{font-size:34px}
.gracias .frase{font-size:14px;line-height:1.5;margin-top:12px}
.leer{display:inline-block;margin-top:16px;color:var(--azul);font-weight:700;font-size:13px;text-decoration:none}
.back{background:none;border:0;color:var(--azul);font-weight:700;font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:4px}
.foucault{font-style:italic;color:var(--soft);font-size:13px;line-height:1.5;border-left:3px solid var(--gold);padding-left:10px;margin:2px 0 12px}
</style>

<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const MARCET='https://www.reasonwhy.es/actualidad/xavier-marcet-management-humanista-foro-lideres-proposito-2024';
const BLOQUES={ilusion:'Ilusión',compromiso:'Compromiso',potencial:'Potencial',cierre:''};
let D=null, TAB='pend', TARGET=null, TNOMBRE='', VAL={}, EQUIPO=[], SUBS={}, SOYJAVI=false;
/* Solo Javi ve la pestaña «Todos»: las encuestas completas de cada colaborador (sin quién opinó). */
const VE_TODOS=['javi@casapepe.mx'];

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').style.display='none'; $('loginWrap').style.display=''; return; }
  await cargar();
}
async function doLogin(){
  const m=$('l_msg'); m.className='msg'; m.textContent='';
  const email=$('l_email').value.replace(/\s+/g,'').toLowerCase(), pass=$('l_pass').value;
  if(!email||!pass){ m.className='msg err'; m.textContent='Escribe correo y contraseña.'; return; }
  $('l_btn').disabled=true; m.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ m.className='msg err'; m.textContent='⚠ '+error.message; $('l_btn').disabled=false; return; }
  $('loginWrap').style.display='none'; $('wrap').style.display=''; await cargar();
}

async function cargar(){
  quitarBarra(); TARGET=null; VAL={};
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  const {data,error}=await sb.functions.invoke('pares-mis-encuestas',{body:{}});
  if(error||!data||!data.ok){ $('wrap').innerHTML='<div class="card"><div class="state">No se pudo cargar: '+esc((data&&data.error)||(error&&error.message)||'')+'</div></div>'; return; }
  D=data; EQUIPO=await cargarEquipo();
  try{ const {data:{user}}=await sb.auth.getUser(); SOYJAVI=!!(user&&VE_TODOS.indexOf((user.email||'').toLowerCase())>=0); }catch(_){ SOYJAVI=false; }
  sinMiEquipo(); render();
}
/* Evaluaciones OBLIGATORIAS de mi equipo (soy su jefe): eval_ciclos.
   Por cada colaborador, el ciclo abierto si hay; si no, el último contestado. */
async function cargarEquipo(){
  try{
    const {data:{user}}=await sb.auth.getUser(); if(!user) return [];
    const {data:me}=await sb.from('employees').select('id').eq('user_id',user.id).maybeSingle(); if(!me) return [];
    // mi equipo según el organigrama (jefe jerárquico o funcional vigente)
    try{ const {data:oa}=await sb.from('org_asignacion').select('employee_id').eq('jefe_id',me.id).is('hasta',null); SUBS={}; (oa||[]).forEach(function(a){ SUBS[a.employee_id]=1; }); }catch(_){}
    const {data:cic}=await sb.from('eval_ciclos').select('id,employee_id,numero,vence,tipo_jefe,estado,contestado_at').eq('jefe_id',me.id).order('vence');
    if(!cic||!cic.length) return [];
    const ids=[...new Set(cic.map(function(c){return c.employee_id;}))];
    const {data:pp}=await sb.from('v_empleados_publico').select('id,nombre,nombre_display').in('id',ids);
    const nm={}; (pp||[]).forEach(function(e){ nm[e.id]=e.nombre_display||e.nombre; });
    return ids.map(function(id){
      const mios=cic.filter(function(c){return c.employee_id===id;});
      const abierto=mios.find(function(c){return c.estado==='pendiente'||c.estado==='notificado';});
      const ult=mios.filter(function(c){return c.estado==='contestado';}).sort(function(a,b){return (b.contestado_at||'').localeCompare(a.contestado_at||'');})[0];
      return {id:id, nombre:nm[id]||'—', abierto:abierto||null, ult:ult||null, tipo:(abierto||ult||{}).tipo_jefe||''};
    }).sort(function(a,b){ return (b.abierto?1:0)-(a.abierto?1:0) || (a.nombre||'').localeCompare(b.nombre||''); });
  }catch(_){ return []; }
}
/* A mi equipo (organigrama + a quien evalúo como jefe) no se me SUGIERE como compañero,
   pero sí puedo buscarlo y valorarlo en azul: esa opinión también cuenta como de jefe.
   Si al quitarlos quedan menos de 3 sugeridos, completo con otros candidatos. */
function sinMiEquipo(){
  const fuera=Object.assign({},SUBS); EQUIPO.forEach(function(x){ fuera[x.id]=1; });
  const cand=(D.candidatos||[]).filter(function(c){return !fuera[c.id];});
  let sug=(D.sugeridos||[]).filter(function(c){return !fuera[c.id];});
  const ya={}; sug.forEach(function(c){ya[c.id]=1;});
  for(let i=0;i<cand.length&&sug.length<(D.min||3);i++){ if(!ya[cand[i].id]){ sug.push(cand[i]); ya[cand[i].id]=1; } }
  D.sugeridos=sug;
}
function oblPend(){ return EQUIPO.filter(function(x){return x.abierto;}).length; }

function render(){
  quitarBarra();
  let html='<div class="tabs">'
    +'<button data-t="pend" class="'+(TAB==='pend'?'on':'')+'">Pendientes'+(oblPend()?'<span class="bd">'+oblPend()+'</span>':'')+'</button>'
    +'<button data-t="hechas" class="'+(TAB==='hechas'?'on':'')+'">Contestadas</button>'
    +'<button data-t="mias" class="'+(TAB==='mias'?'on':'')+'">Mis valoraciones</button>'
    +(SOYJAVI?'<button data-t="todos" class="'+(TAB==='todos'?'on':'')+'">Todos</button>':'')
    +'</div><div id="tabc"></div>';
  $('wrap').innerHTML=html;
  document.querySelectorAll('.tabs button').forEach(function(b){ b.onclick=function(){ TAB=b.dataset.t; render(); }; });
  if(TAB==='pend') tabPend(); else if(TAB==='hechas') tabHechas(); else if(TAB==='todos'&&SOYJAVI) tabTodos(); else tabMias();
}

function tabPend(){
  let h='';
  if(EQUIPO.length){
    const np=oblPend();
    h+='<div class="card oblig"><span class="etq v">Obligatoria</span><h1 class="t">Evaluaciones de tu equipo</h1>'
      +'<div class="sub">Como jefe, te toca evaluar a tu gente en cada periodo. No es opcional.</div>'
      +(np?'<div class="note verde">Tienes <b>'+np+'</b> pendiente'+(np==1?'':'s')+'.</div>':'<div class="note verde">✓ Estás al día con tu equipo. Te avisaremos cuando abra el siguiente periodo.</div>');
    const hoy=new Date().toISOString().slice(0,10);
    h+=EQUIPO.map(function(x){
      if(x.abierto){ const venc=x.abierto.vence&&x.abierto.vence<hoy;
        return '<div class="row" data-ciclo="1"><div><div class="n">'+esc(x.nombre)+'</div><div class="a">'+esc(x.tipo)+(x.abierto.vence?' · '+(venc?'<b style="color:var(--bad)">venció '+esc(x.abierto.vence)+'</b>':'vence '+esc(x.abierto.vence)):'')+'</div></div><div class="go">Contestar →</div></div>'; }
      return '<div class="row" style="cursor:default"><div><div class="n">'+esc(x.nombre)+'</div><div class="a">'+esc(x.tipo)+(x.ult&&x.ult.contestado_at?' · contestada '+esc(String(x.ult.contestado_at).slice(0,10)):'')+'</div></div><div class="ok">✓ Hecha</div></div>';
    }).join('');
    h+='</div>';
  }
  h+='<div class="card reco"><span class="etq a">Recomendada</span><h1 class="t">Valora a tus compañeros</h1>'
   +'<div class="sub">Cada cuatrimestre ('+esc(D.cuatri)+'): mínimo '+D.min+', máximo '+D.tope+'. Es anónima y proactiva.</div>'
   +'<div class="cap">Llevas <b>'+(D.usados||0)+'</b> · te quedan <b>'+(D.restante||0)+'</b> este cuatrimestre.</div>';
  if((D.restante||0)<=0){
    h+='<div class="note">Ya valoraste a '+(D.usados||0)+' compañeros este cuatrimestre. ¡Gracias! El cupo se renueva el próximo.</div>';
  }else{
    h+='<div class="note">Te sugerimos a estos 3, con quienes compartes procedimientos:</div>';
    h+=(D.sugeridos||[]).map(fila).join('')||'<div class="state">No hay sugeridos ahora.</div>';
    h+='<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px"><div class="sub">¿Prefieres a otro compañero?</div>'
      +'<input class="buscar" id="busca" placeholder="Buscar por nombre…"><div id="lista"></div></div>';
  }
  h+='</div>';
  $('tabc').innerHTML=h;
  document.querySelectorAll('[data-ciclo]').forEach(function(el){ el.onclick=function(){ location.href='/rh-eval.html'; }; });
  cablearFilas();
  const inp=$('busca');
  if(inp){ inp.oninput=function(){ const q=inp.value.trim().toLowerCase(); $('lista').innerHTML=(D.candidatos||[]).filter(function(c){return (c.nombre||'').toLowerCase().indexOf(q)>=0;}).slice(0,40).map(fila).join('')||'<div class="state">Nadie coincide.</div>'; cablearFilas(); }; }
}
function fila(c){ return '<div class="row" data-id="'+esc(c.id)+'" data-n="'+esc(c.nombre)+'"><div><div class="n">'+esc(c.nombre)+'</div><div class="a">'+esc([c.area,c.sede].filter(Boolean).join(' · '))+'</div></div><div class="go">Valorar →</div></div>'; }
function cablearFilas(){ document.querySelectorAll('.row[data-id]').forEach(function(el){ el.onclick=function(){ TARGET=el.dataset.id; TNOMBRE=el.dataset.n; verForm(); }; }); }

function tabHechas(){
  let h='<div class="card"><h1 class="t">Lo que has opinado</h1>'
    +'<div class="foucault">«Si leo tanto es para cambiar de opinión» — Michel Foucault</div>'
    +'<div class="sub">Puedes revisar lo que opinaste y, si cambiaste de parecer, dar una nueva opinión (no borra la anterior).</div>';
  if(!(D.contestadas||[]).length){ h+='<div class="state">Todavía no has contestado ninguna.</div></div>'; $('tabc').innerHTML=h; return; }
  h+=D.contestadas.map(function(c,i){
    return '<div class="row" data-rev="'+i+'"><div><div class="n">'+esc(c.nombre)+'</div><div class="a">'+esc(c.fecha)+(c.media!=null?' · dio '+c.media+'/5':'')+'</div></div><div class="go">Ver ▾</div></div><div id="rev'+i+'" style="display:none;padding:4px 2px 10px"></div>';
  }).join('');
  h+='</div>';
  $('tabc').innerHTML=h;
  document.querySelectorAll('[data-rev]').forEach(function(el){ el.onclick=function(){ const i=el.dataset.rev; const box=$('rev'+i); if(box.style.display==='none'){ box.innerHTML=revHtml(D.contestadas[i]); box.style.display=''; cableRevBtn(i); } else box.style.display='none'; }; });
}
function revHtml(c){
  const pm={}; (D.preguntas||[]).forEach(function(p){pm[p.id]=p;});
  let h=(c.respuestas||[]).map(function(r){ const p=pm[r.p]||{}; const val=r.v!=null?('<b>'+r.v+'/5</b>'):(r.t?('«'+esc(r.t)+'»'):'—'); return '<div style="font-size:12.5px;padding:4px 0;border-top:1px solid #f0efea"><span style="color:#999">'+esc(p.pregunta||('#'+r.p))+':</span> '+val+'</div>'; }).join('');
  h+='<button class="bcanc" style="width:auto;margin-top:10px" data-new="'+esc(c.target)+'" data-nn="'+esc(c.nombre)+'">Dar una nueva opinión sobre '+esc(c.nombre)+'</button>';
  return h;
}
function cableRevBtn(i){ const b=document.querySelector('#rev'+i+' [data-new]'); if(b) b.onclick=function(){ TARGET=b.dataset.new; TNOMBRE=b.dataset.nn; verForm(); }; }

function tabTodos(){
  $('tabc').innerHTML='<div class="card" style="padding:0;overflow:hidden"><iframe id="ifEnc" src="/m/rh-encuestas.html?embed=1" style="width:100%;height:600px;border:0;display:block" title="Encuestas de todos"></iframe></div>';
}
window.addEventListener('message',function(ev){ try{ if(ev.origin===location.origin&&ev.data&&ev.data.cpEncAlto){ const f=document.getElementById('ifEnc'); if(f) f.style.height=Math.max(300,ev.data.cpEncAlto+20)+'px'; } }catch(_){} });
function tabMias(){
  const mv=D.misvaloraciones||{};
  let h='<div class="card"><h1 class="t">Mis valoraciones</h1>'
    +'<div class="sub">El promedio de lo que tus compañeros opinan de ti. Es anónimo y va directo a tu KPI de Trabajo en equipo.</div>';
  if(mv.te_20!=null){ h+='<div class="kpi"><span class="big">'+mv.te_20+'</span><span class="max">/20 · Trabajo en equipo</span></div>'; }
  if(!mv.suficientes){
    h+='<div class="note gold" style="margin-top:8px">Aún no hay '+(D.min||3)+' opiniones de compañeros ('+(mv.n||0)+' hasta ahora). En cuanto haya al menos '+(D.min||3)+', verás aquí tu promedio pregunta por pregunta — sin saber quién dijo qué.</div>';
  }else{
    h+='<div class="sub" style="margin-top:10px">Promedio por pregunta ('+mv.n+' compañeros):</div>';
    h+=(mv.items||[]).map(function(it){ const w=Math.round(it.promedio/5*100); return '<div class="vbar"><div class="lb">'+esc(it.pregunta)+'</div><div class="track"><div class="fill" style="width:'+w+'%"></div></div><div class="pv">'+it.promedio+'</div></div>'; }).join('');
  }
  h+='</div>';
  $('tabc').innerHTML=h;
}

/* ---- Formulario de valoración de un compañero ---- */
function verForm(){
  quitarBarra(); VAL={};
  const ps=(D.preguntas||[]);
  let h='<button class="back" onclick="render()">← Volver</button>'
   +'<div class="card"><h1 class="t">Sobre '+esc(TNOMBRE)+'</h1>'
   +'<div class="note"><b>Esta encuesta es confidencial, personal y privada.</b> La procedencia de quien la envía está encriptada y no puede ser vista por ningún integrante de la empresa. Contesta pensando en su trabajo del día a día.</div></div>';
  let ba=null, ab=false;
  ps.forEach(function(p,i){
    if(p.bloque!==ba){ if(ab) h+='</div>'; ba=p.bloque; ab=true; const t=BLOQUES[p.bloque]||''; h+=(t?'<div class="bloque">'+esc(t)+'</div>':'')+'<div class="card">'; }
    h+='<div class="q"><div class="txt"><span class="num">'+(i+1)+'.</span>'+esc(p.pregunta)+'</div>';
    if(p.tipo==='texto'){ h+='<textarea id="t'+p.id+'" placeholder="Escribe aquí (opcional)"></textarea>'; }
    else{ h+='<div class="esc" id="e'+p.id+'">'; for(let v=1;v<=5;v++) h+='<button type="button" data-p="'+p.id+'" data-v="'+v+'">'+v+'</button>'; h+='</div><div class="polos"><span>1 · '+esc(p.polo_bajo||'Casi nunca')+'</span><span>'+esc(p.polo_alto||'Siempre')+' · 5</span></div>'; }
    h+='</div>';
  });
  if(ab) h+='</div>';
  $('wrap').innerHTML=h;
  document.querySelectorAll('.esc button').forEach(function(b){ b.onclick=function(){ VAL[b.dataset.p]=parseInt(b.dataset.v,10); document.querySelectorAll('#e'+b.dataset.p+' button').forEach(function(x){ x.classList.toggle('on',x===b); }); contador(); }; });
  document.querySelectorAll('#wrap textarea').forEach(function(t){
    t.addEventListener('focus',function(){ const b=$('barra'); if(b) b.classList.add('escribiendo'); });
    t.addEventListener('blur',function(){ const b=$('barra'); if(b) b.classList.remove('escribiendo'); });
  });
  ponBarra(); contador(); window.scrollTo(0,0);
}
function escalas(){ return (D.preguntas||[]).filter(function(p){return p.tipo!=='texto';}); }
function contador(){ const tot=escalas().length, hechas=escalas().filter(function(p){return VAL[p.id];}).length; const c=$('cnt'); if(c) c.textContent=hechas+' de '+tot+' contestadas'; const b=$('benv'); if(b) b.disabled=hechas<tot; }
function ponBarra(){ quitarBarra(); const bar=document.createElement('div'); bar.className='barra'; bar.id='barra';
  bar.innerHTML='<div class="in"><div class="cnt" id="cnt"></div><div class="msg" id="msg"></div>'
    +'<div class="bts"><button class="bcanc" id="bcanc">Lo pienso más</button>'
    +'<button class="benv" id="benv" disabled>Enviar opinión</button></div></div>';
  document.body.appendChild(bar); $('benv').onclick=enviar; $('bcanc').onclick=cancelar; }
function quitarBarra(){ const b=document.getElementById('barra'); if(b) b.remove(); }
function payload(){ const out=[]; (D.preguntas||[]).forEach(function(p){ if(p.tipo==='texto'){ const el=document.getElementById('t'+p.id); const t=el?el.value.trim():''; if(t) out.push({p:p.id,t:t}); } else if(VAL[p.id]) out.push({p:p.id,v:VAL[p.id]}); }); return out; }

async function enviar(){
  const b=$('benv'), m=$('msg'); b.disabled=true; const prev=b.textContent; b.textContent='Enviando…'; m.className='msg'; m.textContent='';
  const {data,error}=await sb.functions.invoke('pares-enviar',{body:{target:TARGET, respuestas:payload()}});
  if(error||!data||data.ok!==true){ m.className='msg err'; m.textContent='⚠ '+((data&&data.error)||(error&&error.message)||'No se pudo enviar'); b.disabled=false; b.textContent=prev; return; }
  quitarBarra();
  $('wrap').innerHTML='<div class="card gracias"><div class="em">🤝</div><h1 class="t">Enhorabuena por compartir tu opinión</h1>'
    +'<div class="frase">La tomaremos de forma proactiva para mantener un ambiente de trabajo sano. Recuerda que no se puede separar del todo lo personal de lo profesional: el objetivo de nuestro tiempo juntos es sentirnos realizados profesionalmente. El conflicto es progreso, y ser amable es más difícil que ser inteligente.</div>'
    +'<a class="leer" href="'+MARCET+'" target="_blank" rel="noopener">Por qué hacemos esto — Xavier Marcet ↗</a>'
    +'<div style="margin-top:18px"><button class="bcanc" style="width:auto" onclick="cargar()">Volver a Mis Encuestas</button></div></div>';
  window.scrollTo(0,0);
}
async function cancelar(){
  const m=$('msg'); if(m){ m.className='msg'; m.textContent='Guardando…'; }
  try{ await sb.functions.invoke('pares-cancelar',{body:{target:TARGET}}); }catch(_){}
  quitarBarra();
  $('wrap').innerHTML='<div class="card gracias"><div class="em">🌱</div><h1 class="t">Tómate tu tiempo</h1>'
    +'<div class="frase">Está bien reflexionar un poco más sobre qué sientes. Cuando lo tengas claro, aquí estará el espacio. Ser amable es más difícil que ser inteligente.</div>'
    +'<a class="leer" href="'+MARCET+'" target="_blank" rel="noopener">Por qué hacemos esto — Xavier Marcet ↗</a>'
    +'<div style="margin-top:18px"><button class="bcanc" style="width:auto" onclick="cargar()">Volver</button></div></div>';
  window.scrollTo(0,0);
}

boot();
</script>
</body></html>
