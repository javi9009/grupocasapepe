<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Cambiar habitación · Casa Pepe</title>
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input,textarea{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar .d{margin-left:auto;font-size:12px;color:#cdbf9c}
.appbar select{background:#2b2620;color:#f4ecdd;border:1px solid #3a3228;border-radius:9px;padding:5px 8px;font-size:12px}
.appbar .sync{background:none;border:none;color:#cdbf9c;font-size:18px;cursor:pointer;padding:2px 6px;line-height:1}
.appbar .sync[disabled]{opacity:.4}
.appbar .sync.gira{animation:cpgira 1s linear infinite}
@keyframes cpgira{to{transform:rotate(360deg)}}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}
.ph .reint{margin-top:10px;padding:9px 16px;border:1px solid var(--bd);border-radius:10px;background:#fff;font:inherit;font-weight:700;cursor:pointer}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:17px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:5px;line-height:1.5}
.hero .s b{color:var(--txt2)}
.buscar{width:100%;margin-bottom:10px;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:14px}
.filtros{display:flex;gap:7px;margin-bottom:10px}
.filtros button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:11px;padding:9px 4px;font-size:12px;font-weight:700;color:var(--txt2);cursor:pointer}
.filtros button.on{background:#16130f;border-color:#16130f;color:#f4ecdd}
.hb{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow);border-left:3px solid transparent}
.hb.mover{border-left-color:var(--accent)}
.hb.intercambiar{border-left-color:var(--gold)}
.hb.esperar{border-left-color:#1f5b96}
.hb .lin{display:flex;align-items:flex-start;gap:9px}
.hb .cod{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.hb .cod.sin{font-size:13px;color:var(--gold)}
.hb .nm{font-size:12.5px;color:var(--txt2);flex:1;line-height:1.4}
.hb .nm b{color:var(--txt);font-size:13.5px}
.hb .tipo{display:block;font-size:11px;color:var(--txt3);margin-top:2px}
.pill{font-size:10px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--bg3);color:var(--txt3);white-space:nowrap}
.pill.ok{background:#dff0e8;color:#12694d}
.pill.no{background:#ecebe6;color:#5f5e5a}
.pill.cur{background:#e4eefb;color:#1f5b96}
.rec{margin-top:11px;border-radius:12px;padding:11px 12px;font-size:13px;line-height:1.5;background:var(--bg2);color:var(--txt2)}
.rec.mover{background:#dff0e8;color:#12694d}
.rec.intercambiar{background:#fff0d6;color:#8a6212}
.rec.esperar{background:#e4eefb;color:#1f5b96}
.rec b{font-weight:800}
.rec .go{display:block;width:100%;margin-top:9px;background:#16130f;color:#f4ecdd;border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:800;cursor:pointer}
.rec .go[disabled]{opacity:.5}
.mas{width:100%;margin-top:9px;background:var(--bg2);border:1px solid var(--bd);border-radius:11px;padding:9px;font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.opciones{display:none;margin-top:10px}
.opciones.on{display:block}
.opciones .lbl{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em;margin:10px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--bd);background:var(--bg2);border-radius:11px;padding:9px 11px;font-size:13px;font-weight:700;color:var(--txt);cursor:pointer;text-align:left}
.chips button.sucia{opacity:.65;border-style:dashed}
.chips button span{display:block;font-size:10.5px;font-weight:600;color:var(--txt3);margin-top:2px}
.nolibre{font-size:12.5px;color:var(--txt3);line-height:1.5;background:var(--bg2);border-radius:10px;padding:9px 11px}
.aviso{background:#fff8ea;border:1px solid #e8d4a8;border-radius:14px;padding:12px 13px;color:#8a6212;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style><script src="/embed-child.js"></script>
<script>
/* Volver al shell: si estamos embebidos avisamos al padre para que cierre el embed. */
function cpVolverApp(){
  try{
    if(window.top!==window.self){
      window.parent.postMessage({type:'cp-embed-home'}, location.origin);
      return;
    }
  }catch(e){}
  location.href='/soypepe/';
}
</script>
</head><body>

<div class="appbar">
  <button class="bk" onclick="cpVolverApp()">‹</button>
  <span class="t">🔀 <b>Cambiar habitación</b></span>
  <select id="sede" hidden>
    <option value="45e69775-d877-4507-a9e1-a45bd3400dc5">CDMX</option>
    <option value="febfbef6-7fd1-4b45-84d9-13533e8dcb72">Puebla</option>
  </select>
  <span class="d" id="hoy"></span>
  <button class="sync" id="sync" title="Volver a leer Cloudbeds" aria-label="Actualizar">&#8635;</button>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const FECHA=hoyMX();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PROPS=['45e69775-d877-4507-a9e1-a45bd3400dc5','febfbef6-7fd1-4b45-84d9-13533e8dcb72'];
const SUPERVISORES=['javi@casapepe.mx','hola.puebla@casapepe.mx','hola.cdmx@casapepe.mx','housekeeping.cdmx@casapepe.mx','housekeeping.puebla@casapepe.mx'];
// Atajo para quien hoy está en el mostrador aunque nadie le haya dado el permiso
// todavía. El permiso manda; esto solo suma. `nocturno` entra porque el auditor
// de noche también recibe llegadas.
const TURNOS_OK=['front','nocturno','ama_llaves','experiencias','recamarista'];
const PAGINA='PAG-SP-CAMBIOCUARTO';
const MOTIVOS=['Su habitación todavía no está lista','Problema en la habitación (mtto)',
  'El huésped pidió cambiar','Se adelantó la llegada'];
const dm=f=>String(f||'').slice(8,10)+'/'+String(f||'').slice(5,7);

let USER=null,EMP=null,NOMBRE=null,PROP=null,DATOS=null,ABIERTO=null,FILTRO='',SOLO_PENDIENTES=true;

$('hoy').textContent=new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const e=$('tst');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),3200);}

async function sesionViva(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return null;
  const faltan=(session.expires_at||0)*1000-Date.now();
  if(faltan>60000) return session;
  const {data,error}=await sb.auth.refreshSession();
  if(error||!data?.session){ try{ await sb.auth.signOut(); }catch(e){} return null; }
  return data.session;
}

async function fn(body){
  const {data:{session}}=await sb.auth.getSession();
  const tok=session?session.access_token:SB_KEY;
  const r=await fetch(SB_URL+'/functions/v1/cb-mover',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+tok},
    body:JSON.stringify({prop:PROP,fecha:FECHA,...body})});
  return r.json().catch(()=>({ok:false,error:'sin respuesta'}));
}

// Después de mover, housekeeping tiene que ver el cuarto nuevo: se le pide a
// hk-dia que relea Cloudbeds. Si falla, el cron de la hora lo arregla igual.
async function resincronizar(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    const tok=session?session.access_token:SB_KEY;
    await fetch(SB_URL+'/functions/v1/hk-dia',{method:'POST',
      headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+tok},
      body:JSON.stringify({prop:PROP,fecha:FECHA,accion:'sync'})});
  }catch(e){}
}

async function arranca(){
  const session=await sesionViva();
  if(!session){cpVolverApp();return;}
  USER=session.user;
  const correo=(USER.email||'').toLowerCase();
  const {data:link}=await sb.from('empleado_login').select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(!link){$('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>';return;}
  EMP=link.employee_id;NOMBRE=link.nombre_display||link.nombre_completo;

  const esSuper=SUPERVISORES.includes(correo);
  let suya=null;
  try{ const {data:emp}=await sb.from('v_empleados_publico').select('property_id').eq('id',EMP).maybeSingle(); suya=emp?.property_id||null; }catch(e){}
  PROP=PROPS.includes(suya)?suya:PROPS[0];
  if(esSuper){ const s=$('sede'); s.hidden=false; s.value=PROP; s.onchange=()=>{ PROP=s.value; ABIERTO=null; DATOS=null; cargar(); }; }

  // Manda el permiso de la página, no el reparto de housekeeping. Becarios,
  // practicantes y auditores de noche no tienen caja en el reparto -su puesto no
  // está en hk_puestos_map- y con el candado viejo se quedaban fuera aunque RH
  // les hubiera dado el acceso. El turno sigue valiendo como atajo para quien
  // está hoy en el mostrador sin permiso explícito.
  if(!esSuper){
    let puede=false;
    try{
      const {data:ps}=await sb.rpc('mis_paginas');
      puede=(ps||[]).some(p=>p.codigo===PAGINA && p.nivel && p.nivel!=='none');
    }catch(e){ /* si el motor de permisos no responde, queda el turno */ }
    if(!puede){
      const {data:a}=await sb.from('hk_asignaciones').select('turno').eq('fecha',FECHA).eq('employee_id',EMP).maybeSingle();
      puede=!!a && TURNOS_OK.includes(a.turno);
    }
    if(!puede){
      $('wrap').innerHTML='<div class="ph">Los cambios de habitación los hace el equipo de front, el ama de llaves y gerencia.<br><br>Si crees que deberías tener acceso, avísale a tu jefe de área.</div>';
      return;
    }
  }
  await cargar();
}

let CARGANDO=false;
async function cargar(silencioso){
  if(CARGANDO) return;
  CARGANDO=true;
  const b=$('sync'); if(b){ b.disabled=true; b.classList.add('gira'); }
  if(!silencioso && !DATOS) $('wrap').innerHTML='<div class="ph">Leyendo las llegadas de hoy en Cloudbeds…</div>';
  try{
    const d=await fn({accion:'libres'});
    if(!d||d.ok===false) throw new Error(d&&d.error||'sin respuesta');
    DATOS=d; pintar();
  }catch(e){
    $('wrap').innerHTML='<div class="ph">No se pudieron leer las llegadas.<br>Revisa tu señal y vuelve a intentar.<br><button class="reint">Reintentar</button></div>';
    const r=$('wrap').querySelector('.reint'); if(r) r.onclick=()=>cargar();
  }finally{
    CARGANDO=false;
    const b2=$('sync'); if(b2){ b2.disabled=false; b2.classList.remove('gira'); }
  }
}
{ const b=$('sync'); if(b) b.onclick=()=>cargar(); }

const pendiente=f=>f.sin_asignar || !(f.mi_estado&&f.mi_estado.lista);

function pintar(){
  const w=$('wrap');
  const todas=DATOS?.filas||[];
  const q=FILTRO.trim().toLowerCase();
  let lista=SOLO_PENDIENTES?todas.filter(pendiente):todas;
  if(q) lista=lista.filter(f=>(String(f.huesped||'')+' '+String(f.room_nombre||'')+' '+String(f.room_tipo_nombre||'')).toLowerCase().includes(q));
  const pend=todas.filter(pendiente).length;

  let html=`<div class="hero">
    <div class="n">Llegadas de hoy</div>
    <div class="s">Si a alguien no le tienes lista su habitación, aquí te digo qué hacer: darle otra <b>del mismo tipo</b> que esté limpia y libre toda su estancia, cambiarlo por otra llegada que aún no llegó, o esperar a que housekeeping entregue.</div>
    <div class="s"><b>${todas.length}</b> habitaciones por entregar · <b>${pend}</b> todavía sin estar listas</div>
    </div>`;

  html+=`<div class="aviso">La reserva no se toca: fechas, tarifa y factura se quedan igual, solo cambia la habitación física. Cambiar de <b>tipo</b> mueve el precio y eso se hace en Cloudbeds.</div>`;

  html+=`<div class="filtros">
    <button data-f="1" class="${SOLO_PENDIENTES?'on':''}">Sin estar listas (${pend})</button>
    <button data-f="0" class="${SOLO_PENDIENTES?'':'on'}">Todas (${todas.length})</button>
  </div>`;
  html+=`<input class="buscar" id="q" placeholder="Buscar por huésped o habitación" value="${esc(FILTRO)}">`;

  if(!lista.length){
    html+='<div class="ph">'+(q?'Nadie coincide con esa búsqueda.':(SOLO_PENDIENTES?'Todas las llegadas de hoy tienen su habitación lista. 👌':'Hoy no hay llegadas.'))+'</div>';
    w.innerHTML=html; enganchar(); return;
  }

  html+=lista.map(f=>{
    const i=todas.indexOf(f);
    const rec=f.recomendacion||{tipo:'nada',texto:''};
    const est=f.mi_estado||{etiqueta:'sin datos',lista:false};
    const cls=est.lista?'ok':(est.limpiandose?'cur':'no');
    const abierto=ABIERTO===i;
    const puedeHacer=rec.tipo==='mover'||rec.tipo==='intercambiar';
    return `<div class="hb ${rec.tipo}" data-i="${i}">
      <div class="lin">
        <span class="cod ${f.sin_asignar?'sin':''}">${esc(f.sin_asignar?'Sin hab.':f.room_nombre)}</span>
        <span class="nm"><b>${esc(f.huesped||'Sin nombre')}</b>${f.ya_llego?' · ya llegó':''}
          <span class="tipo">${esc(f.room_tipo_nombre||'')} · ${f.noches} ${f.noches===1?'noche':'noches'} (${dm(f.desde)}→${dm(f.hasta)}) · ${esc(f.origen||'')}</span></span>
        <span class="pill ${cls}">${esc(est.etiqueta)}</span>
      </div>
      ${rec.texto?`<div class="rec ${rec.tipo}">${esc(rec.texto)}
        ${puedeHacer?`<button class="go" data-rec="${i}">${rec.tipo==='mover'?'Dársela':'Hacer el cambio'}</button>`:''}</div>`:''}
      <button class="mas" data-abrir="${i}">${abierto?'Cerrar':'Ver todas las opciones'} · ${f.opciones.length} libre${f.opciones.length===1?'':'s'}${f.intercambios.length?` · ${f.intercambios.length} para cambiar`:''}</button>
      <div class="opciones ${abierto?'on':''}">
        ${f.opciones.length?`<div class="lbl">Libres las ${f.noches===1?'noche':f.noches+' noches'} de su estancia</div>
          <div class="chips">${f.opciones.map(o=>`<button class="${o.lista?'':'sucia'}" data-mover="${i}" data-room="${esc(o.room_id)}">${esc(o.nombre)}<span>${esc(o.dorm||'')}${o.dorm?' · ':''}${esc(o.etiqueta)}</span></button>`).join('')}</div>`
        :`<div class="nolibre">No queda ninguna libre de <b>${esc(f.room_tipo_nombre||'ese tipo')}</b> toda su estancia.</div>`}
        ${f.intercambios.length?`<div class="lbl">Cambiar con otra llegada de las mismas noches</div>
          <div class="chips">${f.intercambios.map(x=>`<button class="${x.lista?'':'sucia'}" data-cambio="${i}" data-room="${esc(x.room_id)}">${esc(x.room_nombre)}<span>${esc(x.huesped)} · ${esc(x.etiqueta)}${x.ya_llego?' · ya llegó':' · no ha llegado'}</span></button>`).join('')}</div>`:''}
      </div>
    </div>`;
  }).join('');

  w.innerHTML=html; enganchar();
}

function enganchar(){
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ SOLO_PENDIENTES=b.dataset.f==='1'; ABIERTO=null; pintar(); });
  const q=$('q');
  if(q) q.oninput=()=>{ FILTRO=q.value; const p=q.selectionStart; pintar(); const n=$('q'); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} } };
  document.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.abrir); ABIERTO=(ABIERTO===i)?null:i; pintar();
  });
  document.querySelectorAll('[data-rec]').forEach(b=>b.onclick=()=>{
    const i=Number(b.dataset.rec), f=DATOS.filas[i], rec=f.recomendacion;
    if(rec.tipo==='mover') mover(i, rec.room_id, b);
    else if(rec.tipo==='intercambiar') intercambiar(i, rec.room_id, b);
  });
  document.querySelectorAll('[data-mover]').forEach(b=>b.onclick=()=>mover(Number(b.dataset.mover), b.dataset.room, b));
  document.querySelectorAll('[data-cambio]').forEach(b=>b.onclick=()=>intercambiar(Number(b.dataset.cambio), b.dataset.room, b));
}

function pedirMotivo(cabecera){
  const opts=MOTIVOS.map((m,i)=>(i+1)+'. '+m).join('\n');
  const r=prompt(`${cabecera}\n\n¿Por qué le cambias?\n\n${opts}\n\nEscribe el número, o cuéntalo con tus palabras:`);
  if(r===null) return null;
  const n=parseInt(String(r).trim(),10);
  const m=(n>=1&&n<=MOTIVOS.length)?MOTIVOS[n-1]:String(r).trim();
  if(!m){ toast('Dinos el motivo para poder registrarlo.'); return null; }
  return m;
}

// Si el destino no está marcado como limpio, el servidor devuelve `no_lista` y
// aquí se pregunta: a veces la cama está hecha y nadie la ha marcado todavía.
async function conReintentoSucio(payload, nombreDestino){
  let d=await fn(payload);
  if(d && d.error==='no_lista'){
    if(!confirm(`${nombreDestino} está ${d.etiqueta}.\n\n¿Ya está lista de verdad y quieres dársela igual?`)) return null;
    d=await fn({...payload, permitir_sucia:true});
  }
  return d;
}

async function mover(i, roomId, btn){
  const f=DATOS.filas[i]; if(!f) return;
  const destino=(f.opciones||[]).find(o=>String(o.room_id)===String(roomId));
  if(!destino){ toast('Esa opción ya no está. Actualizando…'); cargar(true); return; }

  const motivo=pedirMotivo(`${f.huesped}\n${f.sin_asignar?'Sin habitación':f.room_nombre} → ${destino.nombre}\n${f.noches} ${f.noches===1?'noche':'noches'} (${f.desde} → ${f.hasta})`);
  if(!motivo) return;
  if(!confirm(`Se le cambia a ${f.huesped} de ${f.sin_asignar?'sin habitación':f.room_nombre} a ${destino.nombre}, sus ${f.noches} ${f.noches===1?'noche':'noches'}.\n\nLa reserva, las fechas y el precio no cambian. ¿Lo hago?`)) return;

  const prev=btn.innerHTML; btn.disabled=true; btn.textContent='Cambiando…';
  const d=await conReintentoSucio({
    accion:'mover', confirmar:true,
    reserva_id:f.reserva_id, huesped:f.huesped,
    room_type_id:f.room_type_id,
    room_id_origen:f.sin_asignar?'':f.room_id,
    room_nombre_origen:f.sin_asignar?null:f.room_nombre,
    room_id_destino:destino.room_id,
    sub_reserva_id:f.sub_reserva_id,
    desde:f.desde, hasta:f.hasta,
    motivo, hecho_por:USER?.id||null, hecho_por_nombre:NOMBRE,
  }, destino.nombre);
  btn.disabled=false; btn.innerHTML=prev;
  if(d===null) return;

  if(d&&d.ok){ toast(`${f.huesped} ya está en ${destino.nombre}`); ABIERTO=null; resincronizar(); await cargar(true); return; }
  if(d&&d.error==='ocupado'){ toast(d.detalle||'Esa habitación ya se ocupó.'); await cargar(true); return; }
  toast('No se pudo cambiar'+(d&&d.detalle?': '+d.detalle:'. Inténtalo otra vez.'));
}

async function intercambiar(i, roomId, btn){
  const f=DATOS.filas[i]; if(!f) return;
  const otro=(f.intercambios||[]).find(x=>String(x.room_id)===String(roomId));
  if(!otro){ toast('Esa opción ya no está. Actualizando…'); cargar(true); return; }

  const motivo=pedirMotivo(`Intercambio\n${f.huesped}: ${f.room_nombre} → ${otro.room_nombre}\n${otro.huesped}: ${otro.room_nombre} → ${f.room_nombre}`);
  if(!motivo) return;
  if(!confirm(`Se cambian entre sí:\n\n· ${f.huesped} pasa a ${otro.room_nombre}\n· ${otro.huesped} pasa a ${f.room_nombre}\n\nSon las mismas ${f.noches} ${f.noches===1?'noche':'noches'}, así que ninguna reserva se descuadra.${otro.ya_llego?`\n\n⚠️ ${otro.huesped} ya hizo check-in: habría que avisarle.`:''}\n\n¿Lo hago?`)) return;

  const prev=btn.innerHTML; btn.disabled=true; btn.textContent='Cambiando…';
  const d=await conReintentoSucio({
    accion:'intercambiar', confirmar:true,
    room_type_id:f.room_type_id, desde:f.desde, hasta:f.hasta,
    a:{reserva_id:f.reserva_id, huesped:f.huesped, room_id:f.room_id, room_nombre:f.room_nombre,
       reservation_room_id:f.reservation_room_id, sub_reserva_id:f.sub_reserva_id},
    b:{reserva_id:otro.reserva_id, huesped:otro.huesped, room_id:otro.room_id, room_nombre:otro.room_nombre,
       reservation_room_id:otro.reservation_room_id, sub_reserva_id:otro.sub_reserva_id},
    motivo, hecho_por:USER?.id||null, hecho_por_nombre:NOMBRE,
  }, otro.room_nombre);
  btn.disabled=false; btn.innerHTML=prev;
  if(d===null) return;

  if(d&&d.ok){ toast(`${f.huesped} en ${d.a_en} · ${otro.huesped} en ${d.b_en}`); ABIERTO=null; resincronizar(); await cargar(true); return; }
  // Si se quedó a medias hay que decirlo entero: alguien puede estar sin cuarto.
  if(d&&d.error==='a_medias'){ alert(d.detalle); await cargar(true); return; }
  toast('No se pudo cambiar'+(d&&d.detalle?': '+d.detalle:'. Inténtalo otra vez.'));
}

arranca();
