<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Salidas del día · Soy Pepe</title>
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(40px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px}
.dias{display:flex;gap:8px;margin-top:12px}
.dias button{flex:1;border:1.5px solid var(--line);background:#fffdf8;border-radius:10px;padding:9px 0;
  font-weight:700;font-size:13px;cursor:pointer;color:var(--soft)}
.dias button.on{background:var(--txt);border-color:var(--txt);color:#fff}
.sal{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.sal .h{display:flex;align-items:baseline;gap:10px}
.sal .hora{font-weight:800;font-size:19px;font-variant-numeric:tabular-nums;flex:none}
.sal .nm{font-weight:700;flex:1;min-width:0}
.sal .li{display:flex;gap:8px;font-size:13px;color:var(--soft);margin-top:7px}
.sal .li span.k{color:var(--muted);flex:none;min-width:92px}
.sal .li span.v{font-weight:600;color:var(--txt)}
.et{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;margin-left:6px}
.et.pro{background:#e3f3ea;color:#1d6b4a}
.et.ter{background:#e4f1fa;color:#2a5d80}
.et.can{background:#f6e1dd;color:#9E3B2E}
.et.pax{background:#fff7e6;color:#6b5320}
.falta{color:var(--bad);font-weight:700}
.state{text-align:center;color:var(--muted);padding:24px}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.msg{font-size:12px;font-weight:600;margin-top:6px;min-height:14px}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
</head><body>
<header><a href="./">← Soy Pepe</a><span class="ttl">Salidas del <b>día</b></span></header>
<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];

/* El día es el de México, no el del teléfono: un guía que abra esto desde otro
   huso tiene que ver las salidas de la casa, no las de donde esté. */
function hoyMX(){ return new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'}); }
function masDias(n){
  const d=new Date(hoyMX()+'T12:00:00'); d.setDate(d.getDate()+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function bonito(ymd){
  const d=new Date(ymd+'T12:00:00');
  return DOW[d.getDay()]+' '+d.getDate()+' '+MES[d.getMonth()];
}
function hhmm(h){ return (''+(h||'')).slice(0,5); }

let ME=null, OFF=0, FILAS=[];

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').style.display='none'; $('loginWrap').style.display=''; return; }
  ME=session.user;
  await carga();
  pinta();
}
async function doLogin(){
  const m=$('l_msg'); m.className='msg'; m.textContent='';
  const email=$('l_email').value.trim().toLowerCase(), pass=$('l_pass').value;
  if(!email||!pass){ m.className='msg err'; m.textContent='Faltan el correo o la contraseña.'; return; }
  $('l_btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('l_btn').disabled=false;
  if(error){ m.className='msg err'; m.textContent='No pudimos entrar: '+error.message; return; }
  $('loginWrap').style.display='none'; $('wrap').style.display='';
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  boot();
}

/* Qué sale, a qué hora, con quién y de quién es. Javi, 1-oct: "un botón de
   salidas del día para que vean qué tours salen y a qué guía o protagonista y
   touroperadora". El protagonista puede venir de la asignación -una persona
   concreta ese día- o del ADN de la experiencia, que es el personaje. */
async function carga(){
  FILAS=[];
  const dia=masDias(OFF);
  const {data:ss}=await sb.from('sinc_salidas')
    .select('id,fecha,hora,estado,operacion,cupo_min,cupo_max,cupo_tomado,idioma,punto_encuentro,experiencia_id,notas')
    .eq('fecha',dia).order('hora');
  const sal=ss||[];
  if(!sal.length) return;

  const exps=[...new Set(sal.map(s=>s.experiencia_id).filter(Boolean))];
  let X={};
  if(exps.length){
    const {data:xs}=await sb.from('experiencias')
      .select('id,nombre,touroperador,operacion,adn_protagonista,lugar_salida,duracion,op_experiencia_id')
      .in('id',exps);
    (xs||[]).forEach(x=>{ X[x.id]=x; });
  }

  /* Los roles de una asignación son principal / apoyo / traslado / foto, y el
     estado puede ser propuesta -todavía sin confirmar- o aceptada. Al guía que
     lee esto le importa la diferencia: una propuesta no es un compromiso. */
  const {data:asg}=await sb.from('sinc_asignaciones')
    .select('salida_id,guia_id,rol,estado').in('salida_id',sal.map(s=>s.id));
  const gids=[...new Set((asg||[]).map(a=>a.guia_id).filter(Boolean))];
  let G={};
  if(gids.length){
    const {data:gs}=await sb.from('guias').select('id,nombre').in('id',gids);
    (gs||[]).forEach(g=>{ G[g.id]=g; });
  }
  const porSalida={};
  (asg||[]).forEach(a=>{ (porSalida[a.salida_id]=porSalida[a.salida_id]||[]).push(a); });

  /* El protagonista es el personaje de la experiencia, no la persona que va
     ese día: vive en su propia tabla y cuelga de la ficha del operador. */
  let PR={};
  const opids=[...new Set(Object.values(X).map(x=>x.op_experiencia_id).filter(Boolean))];
  if(opids.length){
    const {data:pp}=await sb.from('op_exp_protagonistas')
      .select('experiencia_id,protagonista_id,orden').in('experiencia_id',opids).order('orden');
    const pids=[...new Set((pp||[]).map(x=>x.protagonista_id).filter(Boolean))];
    let N={};
    if(pids.length){
      const {data:ns}=await sb.from('guia_protagonistas').select('id,nombre').in('id',pids);
      (ns||[]).forEach(n=>{ N[n.id]=n.nombre; });
    }
    (pp||[]).forEach(x=>{
      const nm=N[x.protagonista_id]; if(!nm) return;
      (PR[x.experiencia_id]=PR[x.experiencia_id]||[]).push(nm);
    });
  }

  FILAS=sal.map(s=>{
    const x=X[s.experiencia_id]||null;
    return { s:s, x:x, a:(porSalida[s.id]||[]), G:G,
             prot:(x&&x.op_experiencia_id&&PR[x.op_experiencia_id])||[] };
  });
}

function gente(f, roles){
  const l=f.a.filter(a=>roles.indexOf((a.rol||'').toLowerCase())>=0
                        && (a.estado||'')!=='rechazada')
    .map(a=>{
      const nm=(f.G[a.guia_id]||{}).nombre; if(!nm) return null;
      return (a.estado==='propuesta') ? (nm+' (sin confirmar)') : nm;
    }).filter(Boolean);
  return l.length? l.join(' · ') : '';
}

function tarjeta(f){
  const s=f.s, x=f.x||{};
  const nombre = x.nombre || 'Salida sin experiencia';
  const guia = gente(f,['principal']);
  const apoyo = gente(f,['apoyo','traslado','foto']);
  const prota = (f.prot||[]).join(' · ') || (x.adn_protagonista||'').split('.')[0] || '';
  const oper = (s.operacion||x.operacion||'').toLowerCase();
  const tope = x.touroperador || '';
  const punto = s.punto_encuentro || x.lugar_salida || '';
  const pax = Number(s.cupo_tomado||0);

  let et = '';
  if(s.estado==='cancelada') et='<span class="et can">cancelada</span>';
  else if(oper==='tercero') et='<span class="et ter">de tercero</span>';
  else if(oper) et='<span class="et pro">propia</span>';

  let li='';
  li+='<div class="li"><span class="k">Guía</span><span class="'+(guia?'v':'falta')+'">'
     +esc(guia||'sin asignar')+'</span></div>';
  if(apoyo) li+='<div class="li"><span class="k">Apoyo</span><span class="v">'+esc(apoyo)+'</span></div>';
  if(prota) li+='<div class="li"><span class="k">Protagonista</span><span class="v">'
     +esc(prota)+'</span></div>';
  if(oper==='tercero'||tope) li+='<div class="li"><span class="k">Touroperadora</span><span class="'
     +(tope?'v':'falta')+'">'+esc(tope||'sin anotar')+'</span></div>';
  if(punto) li+='<div class="li"><span class="k">Dónde</span><span class="v">'+esc(punto)+'</span></div>';
  if(s.idioma) li+='<div class="li"><span class="k">Idioma</span><span class="v">'+esc(s.idioma)+'</span></div>';
  if(s.notas) li+='<div class="li"><span class="k">Nota</span><span class="v">«'+esc(s.notas)+'»</span></div>';

  return '<div class="sal"><div class="h"><div class="hora">'+esc(hhmm(s.hora))+'</div>'
    +'<div class="nm">'+esc(nombre)+et
    +(pax?('<span class="et pax">'+pax+' pax</span>'):'')+'</div></div>'+li+'</div>';
}

function pinta(){
  const dia=masDias(OFF);
  let h='<div class="card"><h1 class="t">'+(OFF===0?'Hoy':(OFF===1?'Mañana':bonito(dia)))+'</h1>'
    +'<div class="sub">'+esc(bonito(dia))+' · '+FILAS.length+' '
    +(FILAS.length===1?'salida':'salidas')+'</div>'
    +'<div class="dias">'
      +'<button data-off="0" class="'+(OFF===0?'on':'')+'">Hoy</button>'
      +'<button data-off="1" class="'+(OFF===1?'on':'')+'">Mañana</button>'
      +'<button data-off="2" class="'+(OFF===2?'on':'')+'">Pasado</button>'
    +'</div></div>';

  h+= FILAS.length ? FILAS.map(tarjeta).join('')
    : '<div class="state">No hay ninguna salida programada este día.</div>';

  $('wrap').innerHTML=h;
  Array.prototype.forEach.call($('wrap').querySelectorAll('[data-off]'),function(b){
    b.onclick=async function(){
      OFF=Number(b.getAttribute('data-off'));
      $('wrap').innerHTML='<div class="state">Cargando…</div>';
      await carga(); pinta();
    };
  });
}

boot();
</script>
</body></html>
