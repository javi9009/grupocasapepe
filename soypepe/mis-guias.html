<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>La guía del guía · Soy Pepe</title>
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(40px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.tour{font-weight:700;font-size:14px;color:var(--soft);margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.g{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--txt)}
.g .co{width:46px;height:46px;border-radius:10px;background:linear-gradient(135deg,#3a2c12,#7a5a1e);flex:none;
  background-size:cover;background-position:center}
.g .i{flex:1;min-width:0}
.g .i .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g .i .mt{font-size:12px;color:var(--muted)}
.g .ch{color:var(--muted);font-size:18px}
.btn{border:1.5px solid var(--txt);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;
  font-size:13px;cursor:pointer;color:var(--txt)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.full{display:block;width:100%;text-align:center}
.state{text-align:center;color:var(--muted);padding:24px}
.note{background:#fff7e6;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6b5320}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.msg{font-size:12px;font-weight:600;margin-top:6px;min-height:14px}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
</head><body>
<header><a href="./">← Soy Pepe</a><span class="ttl">La guía del <b>guía</b></span></header>
<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

let ME=null, YO=null, MIS_TOURS=[], VERS=[], TOURS={}, TODAS=false;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').style.display='none'; $('loginWrap').style.display=''; return; }
  ME=session.user;
  await carga();
  pinta();
}
async function doLogin(){
  const m=$('l_msg'); m.className='msg'; m.textContent='';
  const email=$('l_email').value.trim().toLowerCase(), pass=$('l_pass').value;
  if(!email||!pass){ m.className='msg err'; m.textContent='Faltan el correo o la contraseña.'; return; }
  $('l_btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('l_btn').disabled=false;
  if(error){ m.className='msg err'; m.textContent='No pudimos entrar: '+error.message; return; }
  $('loginWrap').style.display='none'; $('wrap').style.display='';
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  boot();
}

/* Las guías de ESTA persona, no las de la casa. El hilo es: su correo es un
   guía del padrón; el guía tiene salidas asignadas; cada salida es una
   experiencia, que cuelga de un tour, y el tour es el que tiene guías
   escritas. Javi, 1-oct: "solo deben aparecer las guías asignadas a esa
   persona. No todas". */
async function carga(){
  const email=(ME.email||'').toLowerCase();
  try{
    const {data:g}=await sb.from('guias').select('id,nombre,email').ilike('email',email).maybeSingle();
    YO=g||null;
  }catch(_){ YO=null; }

  /* Todas las guías escritas, con su tour. Son decenas, no miles: una sola
     consulta y se filtra aquí. */
  const [{data:vs},{data:ts}]=await Promise.all([
    sb.from('guia_versiones').select('id,tour_id,nombre,autor,cover_url'),
    sb.from('tours').select('id,nombre').order('nombre')
  ]);
  VERS=vs||[]; TOURS={}; (ts||[]).forEach(t=>{ TOURS[t.id]=t.nombre; });

  if(!YO) return;
  const {data:asg}=await sb.from('sinc_asignaciones').select('salida_id,rol,estado').eq('guia_id',YO.id);
  const sal=[...new Set((asg||[]).map(a=>a.salida_id).filter(Boolean))];
  if(!sal.length) return;

  const {data:ss}=await sb.from('sinc_salidas').select('id,experiencia_id').in('id',sal);
  const exps=[...new Set((ss||[]).map(s=>s.experiencia_id).filter(Boolean))];
  if(!exps.length) return;

  const {data:xs}=await sb.from('experiencias').select('id,op_experiencia_id').in('id',exps);
  const ops=[...new Set((xs||[]).map(x=>x.op_experiencia_id).filter(Boolean))];
  if(!ops.length) return;

  const {data:os}=await sb.from('op_experiencias').select('id,tour_id').in('id',ops);
  MIS_TOURS=[...new Set((os||[]).map(o=>o.tour_id).filter(Boolean))];
}

function tarjeta(v){
  const co=v.cover_url?(' style="background-image:url('+encodeURI(v.cover_url)+')"'):'';
  return '<a class="g" href="/guia.html?v='+esc(v.id)+'">'
    +'<div class="co"'+co+'></div>'
    +'<div class="i"><div class="nm">'+esc(v.nombre||'Sin nombre')+'</div>'
      +'<div class="mt">'+esc(v.autor||'sin autor')+'</div></div>'
    +'<div class="ch">›</div></a>';
}

function grupos(lista){
  const por={};
  lista.forEach(v=>{ (por[v.tour_id]=por[v.tour_id]||[]).push(v); });
  const claves=Object.keys(por).sort((a,b)=>(TOURS[a]||'').localeCompare(TOURS[b]||''));
  return claves.map(k=>'<div class="tour">'+esc(TOURS[k]||'Sin tour')+'</div>'
    +por[k].map(tarjeta).join('')).join('');
}

function pinta(){
  const mias=VERS.filter(v=>MIS_TOURS.indexOf(v.tour_id)>=0);
  let h='<div class="card"><h1 class="t">'+(TODAS?'Todas las guías':'Mis guías')+'</h1>'
    +'<div class="sub">'+(TODAS
        ? 'Las guías de toda la casa. Lee la del tour que te toque.'
        : (YO ? 'Las guías de los tours que tienes asignados.'
              : 'Tu correo todavía no está en el padrón de guías.'))+'</div>';

  if(!TODAS && !mias.length){
    h+='<div class="note">'+(YO
      ? 'Todavía no tienes salidas asignadas, así que aquí no hay nada tuyo. En cuanto te asignen una, su guía aparece sola.'
      : 'Pídele a coordinación que te dé de alta en el padrón de guías y tus guías aparecerán aquí.')+'</div>';
  }
  h+='<button class="btn full" id="tog" style="margin-top:12px">'
    +(TODAS?'Ver sólo mis guías':'Ver todas las guías')+'</button></div>';

  h+=grupos(TODAS?VERS:mias);
  if(TODAS && !VERS.length) h+='<div class="state">No hay ninguna guía escrita todavía.</div>';

  $('wrap').innerHTML=h;
  $('tog').onclick=function(){ TODAS=!TODAS; pinta(); window.scrollTo(0,0); };
}

boot();
</script>
</body></html>
