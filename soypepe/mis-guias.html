<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>La guía del guía · Soy Pepe</title>
<!-- LA GUIA DEL GUIA, EN TRES PUERTAS. Javi, 15-nov-2026: «toma los PDFs y
     dejalos en la portada con "Coyoacan con Frida, etc". Pon otra opcion que
     diga tours de antiguos guias (Kari, Victor en Reforma, etc) y por ultimo
     "crear mi guia" y le das la opcion de que la genere y se descargue el PDF
     y se guarde». Y: «a la hora de crearla permitele tomar como referencia uno
     de sus tours de Sincretico de mi ficha de ateneista, de tal forma que tu
     enlaces los campos que ahi creo con los que se necesitan en la guia del
     guia, por ejemplo las paradas o la descripcion general».

     Antes esta pantalla decia una sola cosa -«tu correo todavia no esta en el
     padron de guias»- y ahi se acababa. Habia 33 guias escritas en la casa y
     quien no estuviera en el padron no podia leer ninguna.

     El titulo «Coyoacan con Frida» sale de cruzar dos cosas que ya estaban y
     que nadie juntaba: guia_versiones.tour_id apunta a tours -no a
     experiencias, que es lo que parecia- y el nombre de la version es el
     protagonista.

     El PDF lo hace el propio telefono al imprimir la guia en una ventana con
     su hoja de impresion: el sistema ofrece «Guardar como PDF». Asi no hay 33
     archivos que rehacer cada vez que se corrige una guia, que es el error de
     guardar PDFs de algo que se sigue editando. -->
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(40px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.tour{font-weight:700;font-size:12px;color:var(--soft);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.06em}
.g{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;
  padding:12px 14px;margin-bottom:8px;text-decoration:none;color:var(--txt);cursor:pointer}
.g .co{width:42px;height:42px;border-radius:10px;background:linear-gradient(135deg,#3a2c12,#7a5a1e);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:19px}
.g .i{flex:1;min-width:0}
.g .i .nm{font-weight:700;line-height:1.25}
.g .i .mt{font-size:12px;color:var(--muted);margin-top:1px}
.g .ch{color:var(--muted);font-size:18px}
.btn{border:1.5px solid var(--txt);background:#fff;border-radius:10px;padding:10px 14px;font-weight:700;
  font-size:13px;cursor:pointer;color:var(--txt)}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.full{display:block;width:100%;text-align:center}
.fila{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.state{text-align:center;color:var(--muted);padding:24px}
.note{background:#fff7e6;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6b5320}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input,.field select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#fff;font-family:inherit}
#ed{width:100%;min-height:320px;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:15px;
  line-height:1.5;font-family:inherit;background:#fff}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.msg{font-size:12px;font-weight:600;margin-top:6px;min-height:14px}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
.doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;line-height:1.6}
.doc h1{font-size:21px;margin:0 0 10px}.doc h2{font-size:17px;margin:18px 0 6px}
.doc h3{font-size:15px;margin:14px 0 4px}.doc img{max-width:100%}
.doc table{width:100%;border-collapse:collapse;font-size:13.5px}
.doc td,.doc th{border:1px solid var(--line);padding:6px 8px;text-align:left}
</style>
  <link rel="stylesheet" href="/cp-movil.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
<script defer src="/cp-verpass.js"></script>
<script src="/cp-dialogo.js"></script>
<script src="/uso.js" defer></script>
</head><body>
<header><a href="./">← Soy Pepe</a><span class="ttl">La guía del <b>guía</b></span></header>
<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

let CAT=null, TOURS=[], MISEXP=[], EDIT_ID=null, DOC=null;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').style.display='none'; $('loginWrap').style.display=''; return; }
  carga();
}
async function doLogin(){
  const m=$('l_msg'); m.className='msg'; m.textContent='';
  const email=$('l_email').value.trim().toLowerCase(), pass=$('l_pass').value;
  if(!email||!pass){ m.className='msg err'; m.textContent='Faltan el correo o la contraseña.'; return; }
  $('l_btn').disabled=true;
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  $('l_btn').disabled=false;
  if(error){ m.className='msg err'; m.textContent='No pudimos entrar: '+error.message; return; }
  $('loginWrap').style.display='none'; $('wrap').style.display='';
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  boot();
}

/* «Coyoacán con Frida»: el tour y quien lo cuenta. Sin tour se queda el
   nombre solo, que vale más que un «Sin tour con Frida». */
function titulo(g){
  const t=(g.tour||'').trim(), q=(g.quien||'').trim();
  if(!t || t==='Sin tour') return q || 'Guía sin nombre';
  if(!q || q===t) return t;
  return t+' con '+q;
}
function ficha(g, ic){
  return '<div class="g" onclick="verGuia(\''+esc(g.id)+'\')">'+
    '<span class="co">'+ic+'</span>'+
    '<span class="i"><span class="nm">'+esc(titulo(g))+'</span>'+
    (g.autor?'<span class="mt">'+esc(String(g.autor).split('·')[0].trim())+'</span>':'')+
    '</span><span class="ch">›</span></div>';
}

async function carga(){
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  let r; try{ r=await sb.rpc('guias_catalogo'); }
  catch(e){ $('wrap').innerHTML='<div class="state">No se pudo cargar. Vuelve a intentarlo.</div>'; return; }
  const d=r&&r.data;
  if(!d || d.error){ $('wrap').innerHTML='<div class="state">'+esc((d&&d.error)||'No se pudo cargar.')+'</div>'; return; }
  CAT=d;

  let h='<div class="card"><h1 class="t">Las guías de la casa</h1>'+
    '<div class="sub">Cada tour contado en la voz de su protagonista. Ábrela, léela y '+
    'descárgala en PDF para llevarla el día de la salida.</div></div>';

  const p=d.personajes||[];
  h+='<div class="tour">Guías de personajes · '+p.length+'</div>';
  h+= p.length ? p.map(g=>ficha(g,'📖')).join('')
               : '<div class="card"><div class="sub">Todavía no hay.</div></div>';

  const a=d.antiguos||[];
  h+='<div class="tour">Tours de antiguos guías · '+a.length+'</div>'+
     '<div class="sub" style="margin:-4px 2px 8px">Cómo lo contaban los que estuvieron antes.</div>';
  h+= a.length ? a.map(g=>ficha(g,'🧭')).join('')
               : '<div class="card"><div class="sub">Todavía no hay.</div></div>';

  const m=d.mias||[];
  h+='<div class="tour">Mi guía</div>';
  if(m.length) h+=m.map(g=>ficha(g,'✍️')).join('');
  h+='<div class="card"><h1 class="t">Crear mi guía</h1>'+
     '<div class="sub">Escribe cómo cuentas tú el tour. Puedes partir de uno de los tuyos de '+
     'Sincrético y se rellena sola con lo que ya cargaste ahí: la descripción, el punto de '+
     'salida, la duración y tus paradas.</div>'+
     '<div class="fila"><button class="btn on" onclick="nueva()">Empezar mi guía</button></div></div>';

  $('wrap').innerHTML=h;
  window.scrollTo(0,0);
}

async function verGuia(id){
  $('wrap').innerHTML='<div class="state">Abriendo…</div>';
  let r; try{ r=await sb.rpc('guia_doc',{p_id:id}); }catch(e){ r=null; }
  const d=r&&r.data;
  if(!d || d.error || !d.html){
    $('wrap').innerHTML='<div class="card"><div class="sub">'+
      esc((d&&d.error)||'Esa guía todavía no tiene documento escrito.')+'</div>'+
      '<div class="fila"><button class="btn" onclick="carga()">‹ Volver</button></div></div>';
    return;
  }
  DOC=d;
  $('wrap').innerHTML='<div class="fila" style="margin:0 0 10px">'+
      '<button class="btn" onclick="carga()">‹ Volver</button>'+
      '<button class="btn on" onclick="pdf()">⬇ Descargar en PDF</button></div>'+
    '<div class="card"><h1 class="t">'+esc(titulo(d))+'</h1>'+
    (d.autor?'<div class="sub">'+esc(d.autor)+'</div>':'')+'</div>'+
    '<div class="doc">'+d.html+'</div>';
  window.scrollTo(0,0);
}

/* El PDF lo hace el teléfono: la guía se abre sola en una ventana con su hoja
   de impresión y el sistema ofrece «Guardar como PDF». */
function pdf(){
  if(!DOC) return;
  const w=window.open('','_blank');
  if(!w){ cpAviso('Tu navegador bloqueó la ventana. Permite las ventanas emergentes y vuelve a intentarlo.'); return; }
  w.document.write('<!doctype html><html lang="es"><head><meta charset="utf-8">'+
    '<title>'+esc(titulo(DOC))+' · Casa Pepe</title><style>'+
    '@page{margin:18mm 14mm}'+
    'body{font-family:Georgia,"Times New Roman",serif;font-size:11.5pt;line-height:1.55;color:#16130f;margin:0}'+
    'h1{font-size:20pt;margin:0 0 4pt}'+
    'h2{font-size:14pt;margin:16pt 0 4pt;page-break-after:avoid}'+
    'h3{font-size:12pt;margin:12pt 0 3pt;page-break-after:avoid}'+
    'p{margin:0 0 7pt}img{max-width:100%}'+
    'table{width:100%;border-collapse:collapse;font-size:10pt}'+
    'td,th{border:1px solid #ccc;padding:4pt 6pt;text-align:left}'+
    '.pie{margin-top:14pt;padding-top:6pt;border-top:1px solid #ddd;font-size:9pt;color:#777}'+
    '</style></head><body>'+DOC.html+
    '<div class="pie">'+esc(titulo(DOC))+(DOC.autor?' · '+esc(DOC.autor):'')+
    ' · Sincrético · Grupo Casa Pepe</div></body></html>');
  w.document.close();
  setTimeout(()=>{ try{ w.focus(); w.print(); }catch(e){} }, 400);
}

async function nueva(){
  $('wrap').innerHTML='<div class="state">Cargando tus tours…</div>';
  try{
    const a=await sb.rpc('guias_tours');       TOURS=(a&&a.data)||[];
    const b=await sb.rpc('mis_exp_para_guia'); MISEXP=(b&&b.data)||[];
  }catch(e){ TOURS=[]; MISEXP=[]; }
  EDIT_ID=null;
  editor('','');
}

function editor(titu, html){
  let h='<div class="fila" style="margin:0 0 10px"><button class="btn" onclick="carga()">‹ Volver</button></div>'+
        '<div class="card"><h1 class="t">Mi guía</h1>';

  if(MISEXP.length){
    h+='<div class="field"><label for="exp">Partir de uno de mis tours de Sincrético</label>'+
       '<select id="exp"><option value="">Empezar en blanco</option>'+
       MISEXP.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.nombre)+' · '+(x.paradas||0)+' paradas</option>').join('')+
       '</select></div>'+
       '<div class="fila"><button class="btn" onclick="traer()">Traer sus datos</button></div>'+
       '<div class="sub" style="margin-top:8px">Se trae la descripción, el punto de salida, la '+
       'duración y tus paradas. Lo demás —la crónica, la voz con la que lo cuentas— lo pones tú.</div>';
  } else {
    h+='<div class="note">Todavía no tienes tours tuyos en Sincrético. Puedes escribir tu guía '+
       'aquí igual, o crear antes tu ficha de ateneísta y cargar tu tour con sus paradas.</div>';
  }

  h+='<div class="field"><label for="tour">¿De qué tour es?</label>'+
     '<select id="tour"><option value="">— elige —</option>'+
     TOURS.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.nombre)+'</option>').join('')+'</select></div>'+
     '<div class="field"><label for="ti">Título de tu guía</label>'+
     '<input id="ti" type="text" placeholder="p. ej. Coyoacán con Antonio" value="'+esc(titu)+'"></div>'+
     '<div class="field"><label for="ed">Tu guía</label>'+
     '<textarea id="ed" placeholder="Cuenta tu tour: de qué va, parada por parada, qué dices en cada sitio, qué nunca se te olvida hacer…">'+esc(html)+'</textarea></div>'+
     '<div class="fila">'+
       '<button class="btn on" onclick="guardar()">Guardar mi guía</button>'+
       '<button class="btn" onclick="verBorrador()">Ver cómo queda en PDF</button>'+
     '</div><div class="msg" id="m"></div></div>';
  $('wrap').innerHTML=h;
  window.scrollTo(0,0);
}

async function traer(){
  const s=$('exp'), m=$('m');
  const id=s?s.value:'';
  if(!id){ m.className='msg err'; m.textContent='Elige uno de tus tours.'; return; }
  m.className='msg'; m.textContent='Trayendo tus datos…';
  let r; try{ r=await sb.rpc('guia_borrador',{p_exp:id}); }catch(e){ r=null; }
  const d=r&&r.data;
  if(!d || d.error){ m.className='msg err'; m.textContent=(d&&d.error)||'No se pudo traer.'; return; }
  if($('ed')) $('ed').value=d.html;
  if($('ti') && !$('ti').value) $('ti').value=d.titulo||'';
  m.className='msg ok'; m.textContent='✓ Traído, con '+(d.paradas||0)+' paradas. Ahora ponle tu voz.';
}

function verBorrador(){
  const ed=$('ed'), ti=$('ti');
  if(!ed || !ed.value.trim()){ cpAviso('Escribe algo antes de verlo.'); return; }
  DOC={ html:ed.value, quien:(ti&&ti.value)||'Mi guía', tour:'', autor:'' };
  pdf();
}

async function guardar(){
  const ed=$('ed'), ti=$('ti'), tr=$('tour'), m=$('m');
  if(!ed || !ed.value.trim()){ m.className='msg err'; m.textContent='Tu guía está vacía.'; return; }
  if(!tr || !tr.value){ m.className='msg err'; m.textContent='Elige de qué tour es.'; return; }
  m.className='msg'; m.textContent='Guardando…';
  let r; try{
    r=await sb.rpc('guia_mia_guardar',{p_tour:tr.value, p_titulo:(ti&&ti.value)||null,
                                       p_html:ed.value, p_id:EDIT_ID});
  }catch(e){ r=null; }
  const d=r&&r.data;
  if(!d || d.error){ m.className='msg err'; m.textContent=(d&&d.error)||'No se pudo guardar.'; return; }
  EDIT_ID=d.id;
  m.className='msg ok'; m.textContent='✓ Guardada.';
  await cpAviso('Tu guía quedó guardada. La encuentras en «Mi guía», y desde ahí la descargas en PDF cuando quieras.');
  carga();
}

boot();
</script>
</body></html>
