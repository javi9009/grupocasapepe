<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Room audit · Casa Pepe</title>
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input,textarea{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar .d{margin-left:auto;font-size:12px;color:#cdbf9c}
.appbar select{background:#2b2620;color:#f4ecdd;border:1px solid #3a3228;border-radius:9px;padding:5px 8px;font-size:12px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
.ph .reint{margin-top:2px;padding:9px 16px;border:1px solid var(--bd,#d9d2c4);border-radius:10px;background:var(--surface,#fff);font:inherit;font-weight:700;cursor:pointer}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}

.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:17px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:3px;line-height:1.5}
.hero .marc{display:flex;gap:8px;margin-top:12px}
.hero .marc div{flex:1;background:var(--bg3);border-radius:11px;padding:8px 6px;text-align:center}
.hero .marc b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.hero .marc span{font-size:10.5px;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em}
.hero .marc .ok b{color:var(--accent)}
.hero .marc .inc b{color:#8a6212}
.hero .marc .no b{color:var(--bad)}

.aviso{background:#fff8ea;border:1px solid #e8d4a8;border-radius:14px;padding:12px 13px;color:#8a6212;font-size:13px;line-height:1.5;margin-bottom:12px}

.grupo{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 7px}
.hb{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:9px;box-shadow:var(--shadow);border-left:3px solid transparent}
.hb.ok{border-left-color:var(--accent)}
.hb.incidencia{border-left-color:var(--gold)}
.hb.no_apta{border-left-color:var(--bad)}
.hb .lin{display:flex;align-items:center;gap:9px}
.hb .cod{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums}
.hb .nm{font-size:12px;color:var(--txt3);flex:1;line-height:1.35}
.hb .est{font-size:10.5px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--bg3);color:var(--txt3)}
.hb .est.limpia{background:#dff0e8;color:#12694d}
.hb .est.sucia{background:#ecebe6;color:#5f5e5a}
.hb .est.limpiando{background:#e4eefb;color:#1f5b96}

.marcas{display:flex;gap:7px;margin-top:11px}
.marcas button{flex:1;border:1px solid var(--bd);background:var(--bg2);border-radius:11px;padding:11px 4px;
  font-size:20px;cursor:pointer;line-height:1;transition:.15s;color:var(--txt3)}
.marcas button .et{display:block;font-size:10px;font-weight:700;margin-top:4px;letter-spacing:.01em}
.marcas button.on.v{background:#dff0e8;border-color:#a5d5be;color:#12694d}
.marcas button.on.a{background:#fff0d6;border-color:#e8d4a8;color:#8a6212}
.marcas button.on.r{background:#fbe9e9;border-color:#e0a3a3;color:#9c2b2b}

.detalle{margin-top:11px;display:none}
.detalle.on{display:block}
.detalle label{display:block;font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em;margin:9px 0 4px}
.detalle textarea,.detalle select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--txt);font-size:14px}
.detalle textarea{min-height:62px;resize:vertical}
.detalle .g{display:flex;gap:8px}
.detalle .g>*{flex:1}
.guardar{width:100%;margin-top:10px;background:var(--accent);color:#fff;border:none;border-radius:11px;padding:12px;font-size:14px;font-weight:800;cursor:pointer}
.guardar[disabled]{background:var(--bg3);color:var(--txt3)}
.hecho{margin-top:10px;font-size:12.5px;color:var(--txt2);background:var(--bg2);border-radius:10px;padding:9px 11px;line-height:1.5}
.hecho b{color:var(--txt)}
.hecho .tk{font-size:12px;color:var(--txt3);display:block;margin-top:3px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style></head><body>

<div class="appbar">
  <button class="bk" onclick="location.href='/soypepe/'">‹</button>
  <span class="t">🔍 <b id="titulo">Room audit</b></span>
  <select id="sede" hidden>
    <option value="45e69775-d877-4507-a9e1-a45bd3400dc5">CDMX</option>
    <option value="febfbef6-7fd1-4b45-84d9-13533e8dcb72">Puebla</option>
  </select>
  <span class="d" id="hoy"></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const FECHA=hoyMX();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PROPS=['45e69775-d877-4507-a9e1-a45bd3400dc5','febfbef6-7fd1-4b45-84d9-13533e8dcb72'];
// Ama de llaves, front y gerencia. Corporativo entra por la lista de supervisores.
const SUPERVISORES=['javi@casapepe.mx','hola.puebla@casapepe.mx','hola.cdmx@casapepe.mx','housekeeping.cdmx@casapepe.mx','housekeeping.puebla@casapepe.mx'];
const TURNOS_OK=['ama_llaves','recamarista'];
let USER=null,EMP=null,NOMBRE=null,PROP=null,AUD={},CUARTOS=[],SOLO_LLEGADAS=true;

$('hoy').textContent=new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const e=$('tst');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2400);}
const horaMX=()=>Number(new Intl.DateTimeFormat('en-GB',{timeZone:'America/Mexico_City',hour:'2-digit',hour12:false}).format(new Date()));

// Si el token está caducado o a punto, se renueva antes de pedir nada. Si la
// renovación falla (token ya usado, sesión vieja), se cierra y se vuelve a entrar:
// mejor pedir la contraseña que dejar la app en blanco.
async function sesionViva(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return null;
  const faltan=(session.expires_at||0)*1000-Date.now();
  if(faltan>60000) return session;
  const {data,error}=await sb.auth.refreshSession();
  if(error||!data?.session){ try{ await sb.auth.signOut(); }catch(e){} return null; }
  return data.session;
}
function esFalloDeSesion(e){
  const c=String(e?.code||''), m=String(e?.message||'').toLowerCase();
  return c==='PGRST301'||c==='PGRST302'||e?.status===401||m.includes('jwt')||m.includes('token');
}

async function arranca(){
  const session=await sesionViva();
  if(!session){location.href='/soypepe/';return;}
  USER=session.user;
  const correo=(USER.email||'').toLowerCase();
  const {data:link,error:eLink}=await sb.from('empleado_login').select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(eLink){
    if(esFalloDeSesion(eLink)){ try{ await sb.auth.signOut(); }catch(e){} location.href='/soypepe/'; return; }
    $('wrap').innerHTML='<div class="ph">No se pudo conectar con el servidor.<br>Revisa tu señal y vuelve a intentar.<br><br><button class="reint">Reintentar</button></div>';
    $('wrap').querySelector('.reint').onclick=()=>location.reload();
    return;
  }
  if(!link){$('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>';return;}
  EMP=link.employee_id;NOMBRE=link.nombre_display||link.nombre_completo;

  const esSuper=SUPERVISORES.includes(correo);
  let suya=null;
  try{ const {data:emp}=await sb.from('v_empleados_publico').select('property_id').eq('id',EMP).maybeSingle(); suya=emp?.property_id||null; }catch(e){}
  PROP=PROPS.includes(suya)?suya:PROPS[0];
  if(esSuper){ const s=$('sede'); s.hidden=false; s.value=PROP; s.onchange=()=>{ PROP=s.value; cargar(); }; }

  // Quien no supervisa entra solo si hoy tiene turno de cuartos
  if(!esSuper){
    const {data:a}=await sb.from('hk_asignaciones').select('turno').eq('fecha',FECHA).eq('employee_id',EMP).maybeSingle();
    if(!a || !TURNOS_OK.includes(a.turno)){
      $('wrap').innerHTML='<div class="ph">El room audit lo hacen el ama de llaves, el equipo de front y gerencia.<br><br>Si crees que deberías tener acceso, avísale a tu jefe de área.</div>';
      return;
    }
  }
  await cargar();
}

async function cargar(){
  const [{data:est},{data:aud}]=await Promise.all([
    sb.from('hk_estatus_dia').select('area_id,estatus,check_in,check_out,limpieza,limpieza_por,metadata,hk_areas(id,codigo,nombre,tipo,piso)')
      .eq('property_id',PROP).eq('fecha',FECHA),
    sb.from('hk_auditoria').select('*').eq('property_id',PROP).eq('fecha',FECHA),
  ]);
  AUD={}; (aud||[]).forEach(a=>AUD[a.area_id]=a);
  // Solo cuartos: las camas se auditan a través de su dormitorio
  CUARTOS=(est||[]).filter(e=>['privada','dorm'].includes(e.hk_areas?.tipo));
  pintar();
}

const ESTLBL={vacia_limpia:['limpia','Limpia'],vacia_sucia:['sucia','Por limpiar'],
  ocupada:['','En casa'],ocupada_blancos:['','En casa · blancos'],fuera_servicio:['','Fuera de servicio']};

function pintar(){
  const w=$('wrap');
  const llegan=CUARTOS.filter(c=>c.check_in);
  const lista=(SOLO_LLEGADAS?llegan:CUARTOS)
    .slice().sort((a,b)=>String(a.hk_areas.codigo).localeCompare(String(b.hk_areas.codigo),'es',{numeric:true}));
  const hechas=llegan.filter(c=>AUD[c.area_id]).length;
  const inc=Object.values(AUD).filter(a=>a.estado==='incidencia').length;
  const no=Object.values(AUD).filter(a=>a.estado==='no_apta').length;
  const ok=Object.values(AUD).filter(a=>a.estado==='ok').length;

  let html=`<div class="hero">
    <div class="n">Room audit del ${new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'})}</div>
    <div class="s">Revisa las habitaciones que reciben huésped hoy y confirma que están listas para entregar. Lo que marques aparece en el reporte del día.</div>
    <div class="marc">
      <div class="ok"><b>${ok}</b><span>Listas</span></div>
      <div class="inc"><b>${inc}</b><span>Con detalle</span></div>
      <div class="no"><b>${no}</b><span>A mover</span></div>
      <div><b>${hechas}/${llegan.length}</b><span>Revisadas</span></div>
    </div></div>`;

  if(horaMX()<12) html+=`<div class="aviso">El audit se hace a partir de las 12:00, cuando ya salieron los cuartos. Puedes adelantar lo que quieras, pero ojo con las que todavía están limpiándose.</div>`;

  html+=`<div class="grupo">
    <label style="display:flex;align-items:center;gap:7px;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;color:var(--txt2)">
      <input type="checkbox" id="soloLl" ${SOLO_LLEGADAS?'checked':''} style="width:16px;height:16px;accent-color:#1d9e75">
      Solo las que tienen llegada hoy (${llegan.length} de ${CUARTOS.length})
    </label></div>`;

  if(!lista.length){
    html+='<div class="ph">No hay habitaciones con llegada hoy.<br><br>Quita el filtro para revisar cualquier otra.</div>';
    w.innerHTML=html; enganchar(w); return;
  }

  let pisoAct=null;
  html+=lista.map(c=>{
    const ar=c.hk_areas, a=AUD[c.area_id];
    let cab='';
    if(ar.piso!==pisoAct){ pisoAct=ar.piso; cab=`<div class="grupo">Piso ${ar.piso||'—'}</div>`; }
    // Se muestra cómo está de limpieza ahora mismo, no el estatus de la reserva
    const LIMP={limpia:['limpia','Limpia'],limpiando:['limpiando','Limpiándose'],sucia:['sucia','Por limpiar']};
    const el=LIMP[c.limpieza]||ESTLBL[c.estatus]||['',c.estatus];
    return cab+`<div class="hb ${a?a.estado:''}" data-a="${c.area_id}">
      <div class="lin">
        <span class="cod">${esc(ar.codigo)}</span>
        <span class="nm">${esc(ar.nombre)}${c.check_out?' · salió hoy':''}</span>
        <span class="est ${el[0]}">${el[1]}${c.limpieza_por?` · ${esc(String(c.limpieza_por).split(' ')[0])}`:''}</span>
      </div>
      <div class="marcas">
        <button class="v ${a?.estado==='ok'?'on':''}" data-m="ok">✓<span class="et">Lista</span></button>
        <button class="a ${a?.estado==='incidencia'?'on':''}" data-m="incidencia">!<span class="et">Con detalle</span></button>
        <button class="r ${a?.estado==='no_apta'?'on':''}" data-m="no_apta">✱<span class="et">Mejor moverla</span></button>
      </div>
      <div class="detalle" data-d="${c.area_id}">
        <label>¿Qué encontraste?</label>
        <textarea data-nota placeholder="Ej. falta agua, se tira el agua del lavabo, falta una toalla…">${esc(a?.nota||'')}</textarea>
        <div class="g">
          <div><label>¿Quién lo resuelve?</label>
            <select data-dest>
              <option value="mantenimiento" ${a?.destino==='mantenimiento'?'selected':''}>Mantenimiento</option>
              <option value="front" ${a?.destino==='front'?'selected':''}>Front</option>
              <option value="recamaristas" ${a?.destino==='recamaristas'?'selected':''}>Recamaristas</option>
            </select></div>
          <div><label>Tipo</label>
            <select data-clas>
              <option value="reactivo" ${a?.clasificacion!=='correctivo'?'selected':''}>Reactivo · hay que ir ya</option>
              <option value="correctivo" ${a?.clasificacion==='correctivo'?'selected':''}>Correctivo · se programa</option>
            </select></div>
        </div>
        <button class="guardar" data-g="${c.area_id}">Guardar</button>
      </div>
      ${a?`<div class="hecho">${a.estado==='ok'?'✓ Revisada y lista para entregar'
          :a.estado==='incidencia'?`! ${esc(a.nota||'Tiene un detalle')} → ${esc(a.destino||'—')}`
          :`✱ ${esc(a.nota||'No está en condiciones')} → mejor cambiar al huésped de habitación`}
        <span class="tk">${esc(a.auditor_nombre||'')} · ${new Date(a.auditada_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'})}${a.mtto_ticket_id?' · ticket de mantenimiento creado':''}</span></div>`:''}
    </div>`;
  }).join('');

  w.innerHTML=html;
  enganchar(w);
}

function enganchar(w){
  const f=w.querySelector('#soloLl');
  if(f) f.onchange=()=>{ SOLO_LLEGADAS=f.checked; pintar(); };

  w.querySelectorAll('.hb').forEach(box=>{
    const area=box.dataset.a;
    const det=box.querySelector(`[data-d="${area}"]`);
    box.querySelectorAll('.marcas button').forEach(b=>b.onclick=async()=>{
      const m=b.dataset.m;
      box.querySelectorAll('.marcas button').forEach(x=>x.classList.toggle('on',x===b));
      if(m==='ok'){ det.classList.remove('on'); await guardar(area,'ok',null,null,null); }
      else { det.classList.add('on'); det.querySelector('[data-nota]').focus(); }
    });
    const g=box.querySelector('[data-g]');
    if(g) g.onclick=async()=>{
      const m=[...box.querySelectorAll('.marcas button')].find(x=>x.classList.contains('on'))?.dataset.m||'incidencia';
      const nota=det.querySelector('[data-nota]').value.trim();
      if(!nota) return toast('Escribe qué encontraste');
      g.disabled=true;
      await guardar(area,m,nota,det.querySelector('[data-dest]').value,det.querySelector('[data-clas]').value);
      g.disabled=false;
    };
  });
}

// Guarda la revisión y, si es de mantenimiento, abre el ticket para que Eloy lo vea.
async function guardar(areaId,estado,nota,destino,clasificacion){
  const fila={property_id:PROP,fecha:FECHA,area_id:areaId,estado,nota:nota||null,
    destino:estado==='ok'?null:destino,clasificacion:estado==='ok'?null:clasificacion,
    auditor_email:USER?.email||null,auditor_nombre:NOMBRE,auditada_at:new Date().toISOString()};
  const {data,error}=await sb.from('hk_auditoria').upsert(fila,{onConflict:'fecha,area_id'}).select().single();
  if(error){ toast('No se pudo guardar'); return; }

  // El audit también deja la habitación limpia: si el ama de llaves la da por lista,
  // vale igual que si la recamarista acabara de salir. Y si la rechaza, vuelve a sucia.
  try{
    if(estado==='ok'){
      await sb.from('hk_estatus_dia').update({limpieza:'limpia',limpieza_at:new Date().toISOString(),
        limpieza_por:NOMBRE,limpieza_fuente:'room_audit'}).eq('property_id',PROP).eq('fecha',FECHA).eq('area_id',areaId);
    }else if(estado==='no_apta'){
      await sb.from('hk_estatus_dia').update({limpieza:'sucia',limpieza_at:new Date().toISOString(),
        limpieza_por:NOMBRE,limpieza_fuente:'room_audit'}).eq('property_id',PROP).eq('fecha',FECHA).eq('area_id',areaId);
    }
  }catch(e){ /* la auditoría queda guardada igual */ }

  if(estado!=='ok' && destino==='mantenimiento' && !data.mtto_ticket_id){
    const cuarto=CUARTOS.find(c=>c.area_id===areaId)?.hk_areas;
    try{
      let ubic=null;
      const {data:u}=await sb.from('mtto_ubicaciones').select('id').eq('property_id',PROP).eq('codigo',cuarto?.codigo).maybeSingle();
      ubic=u?.id||null;
      const {data:tk}=await sb.from('mtto_tickets').insert({
        property_id:PROP, ubicacion_id:ubic, origen:'room_audit',
        clasificacion:clasificacion||'reactivo',
        titulo:`${cuarto?.codigo||''} · ${nota.slice(0,60)}`,
        descripcion:`Room audit del ${FECHA}: ${nota}`,
        reportado_por_nombre:NOMBRE,
        prioridad:estado==='no_apta'?1:2,
        metadata:{origen_detalle:'room_audit',area_id:areaId,estado},
      }).select('id').single();
      if(tk) await sb.from('hk_auditoria').update({mtto_ticket_id:tk.id}).eq('id',data.id);
    }catch(e){ /* si mantenimiento no acepta el ticket, la auditoría igual queda guardada */ }
  }
  toast(estado==='ok'?'Habitación lista':estado==='incidencia'?'Anotado · alguien lo resuelve antes de la entrada':'Anotado · conviene cambiar de habitación');
  await cargar();
}

arranca();
</script></body></html>
