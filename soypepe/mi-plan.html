<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi plan de contenido · Soy Pepe</title>
<!-- SU PLAN, DENTRO DE SOYPEPE. Javi, 15-nov-2026: «si es voluntario de
     contenido, su módulo de "plan de contenido" con lo que propuso y que suba
     lo que grabó».
     El plan existía desde octubre pero sólo se veía desde el panel del equipo:
     el voluntario lo llenaba una vez por una liga con token y no lo volvía a
     ver nunca. Lo que grababa acababa en un WhatsApp, fuera del sistema, y
     nadie podía decir cuántas piezas llevaba entregadas.
     Aquí ve las dos columnas de su propia historia: lo que propuso y lo que
     hizo. Las notas internas del equipo no salen; sólo lo que se le escribe
     a él. -->
<style>
:root{--bg:#f7f6f1;--card:#fff;--txt:#16130f;--soft:#5f5e5a;--muted:#8e8c85;
 --line:rgba(0,0,0,.1);--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;
 --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
 background:var(--bg);color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;
 display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:14px 14px calc(40px + var(--safe-b))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.muted{color:var(--muted);font-size:13px}
h2{font-size:16px;margin:0 0 8px}
.sem{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
 font-weight:700;margin:18px 2px 8px}
.pz{background:var(--card);border:1px solid var(--line);border-radius:14px;
 padding:14px;margin-bottom:10px}
.pz .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;padding:3px 9px;
 border-radius:7px;background:#FFF7E6;color:#6b5320;border:1px solid #e7d6a6;white-space:nowrap}
.tag.ok{background:#EAF3DE;color:#173404;border-color:#bcd9a0}
.tag.c{background:#EFF4FA;color:#20425e;border-color:#c3d6e8}
.idea{font-weight:600;margin:2px 0 8px;line-height:1.4}
.ref{display:inline-block;font-size:13px;color:#20425e;text-decoration:none;
 border-bottom:1px solid #c3d6e8;word-break:break-all}
.hecho{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.hecho label{display:block;font-size:12px;color:var(--soft);font-weight:700;margin-bottom:5px}
.fila{display:flex;gap:8px;flex-wrap:wrap}
.fila input{flex:1 1 200px;min-width:0;padding:12px;border:1px solid var(--line);
 border-radius:10px;font-size:16px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 16px;
 font-size:15px;font-weight:700;cursor:pointer}
.btn[disabled]{opacity:.5}
.msg{font-size:13px;font-weight:600;margin-top:8px}
.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
.state{text-align:center;color:var(--muted);padding:40px 10px}
.nota{background:#FFF7E6;border:1px solid #e7d6a6;border-radius:10px;padding:10px 12px;
 font-size:13.5px;margin-top:8px}
</style></head>
<body>
<header><div class="ttl">Mi plan de <b>contenido</b></div></header>
<div class="wrap" id="wrap"><div class="state">Cargando tu plan…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script src="/cp-dialogo.js"></script>
<script>
(function(){
  var URL_SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var sb=window.supabase.createClient(URL_SB,KEY);
  var W=document.getElementById('wrap');
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function f(d){ if(!d) return ''; var p=String(d).slice(0,10).split('-');
    return p[2]+'/'+p[1]; }

  var CUENTAS={cpp:'Casa Pepe',sincretico:'Sincrético',cosmica:'La Cósmica',ateneo:'Ateneo'};
  /* Hoy en CDMX, para que el calendario no ofrezca mañana a quien está en
     otro huso ni ponga la pieza un día por delante. */
  var HOY=(function(){
    try{
      var p=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',
        year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
      return p;
    }catch(e){ return new Date().toISOString().slice(0,10); }
  })();

  /* EL EQUIPO PUEDE MIRAR EL DE OTRO. Javi, 15-nov-2026: «en el SoyPepe mio
     de Javi Puente mantenme el boton de mi plan de contenido y poder escoger
     el de los voluntarios activos para verlos».
     Quien puede elegir lo decide la base: a un voluntario vol_planes_lista()
     le devuelve vacio y el desplegable no se pinta, asi que aqui no hay nada
     que esconder a mano. Y mirando el de otro no salen los campos para subir
     piezas: subir es de quien grabo. */
  var VIENDO=null, LISTA=[];

  function selectorHtml(){
    if(!LISTA.length) return '';
    var h='<div class="card"><label for="quien" style="font-size:12px;color:#5f5e5a;'+
          'font-weight:700;display:block;margin-bottom:5px">Ver el plan de</label>'+
          '<select id="quien" style="width:100%;padding:11px;border:1px solid var(--line);'+
          'border-radius:10px;font:inherit;font-size:16px;background:#fff">'+
          '<option value="">El mío</option>';
    LISTA.forEach(function(v){
      h+='<option value="'+esc(v.email)+'"'+(VIENDO===v.email?' selected':'')+'>'+
         esc(v.nombre)+' · '+(v.entregadas||0)+'/'+(v.piezas||0)+' entregadas</option>';
    });
    return h+'</select></div>';
  }

  function ligaSelector(){
    var s=document.getElementById('quien');
    if(s) s.onchange=function(){ VIENDO=s.value||null; W.innerHTML='<div class="state">Cargando…</div>'; carga(); };
  }

  async function carga(){
    try{ var l=await sb.rpc('vol_planes_lista'); LISTA=(l && l.data) || []; }catch(e){ LISTA=[]; }
    var r;
    try{ r=await sb.rpc('vol_mi_plan', VIENDO?{p_email:VIENDO}:{}); }
    catch(e){ W.innerHTML='<div class="state">No se pudo cargar. Vuelve a intentarlo.</div>'; return; }
    var d=r && r.data;
    if(!d || d.error){ W.innerHTML=selectorHtml()+'<div class="state">'+esc((d&&d.error)||'No se pudo cargar.')+'</div>'; ligaSelector(); return; }
    var AJENO=!!d.ajeno;
    if(!d.hay){
      W.innerHTML=selectorHtml()+'<div class="card"><h2>'+
        (AJENO?esc(d.quien||'Esta persona')+' todavía no tiene plan':'Todavía no tienes plan')+'</h2>'+
        '<p class="muted">'+(AJENO
          ? 'Cuando se le prepare su plan del mes aparecerá aquí.'
          : 'Cuando el equipo te prepare tu plan del mes aparecerá aquí, '+
            'con lo que propusiste semana a semana. Entonces podrás ir subiendo lo que grabes.')+
        '</p></div>';
      ligaSelector();
      return;
    }

    var h=selectorHtml()+
      '<div class="card"><h2>'+(AJENO?'Plan de '+esc(d.quien||''):'Tu plan')+'</h2>'+
      '<p class="muted">Del <b>'+f(d.desde)+'</b> al <b>'+f(d.hasta)+'</b>'+
      (d.modalidad?' · '+esc(d.modalidad):'')+
      (d.estado?' · '+esc(d.estado):'')+'</p>'+
      '<p class="muted" style="margin-top:8px">'+(AJENO
        ? 'Esto es lo que propuso y lo que lleva entregado. Las piezas las sube él.'
        : 'Aquí está lo que propusiste. Cuando grabes una pieza, pega su liga y queda entregada.')+'</p>'+
      (d.nota?'<div class="nota">'+esc(d.nota)+'</div>':'')+
      '</div>';

    var piezas=d.piezas||[], sem=null;
    if(!piezas.length){
      h+='<div class="card"><p class="muted">Tu plan todavía no tiene piezas.</p></div>';
    }
    piezas.forEach(function(z){
      if(z.semana!==sem){ sem=z.semana; h+='<div class="sem">Semana '+esc(sem)+'</div>'; }
      var hecho=!!z.hecho;
      h+='<div class="pz" id="pz-'+esc(z.id)+'">'+
        '<div class="top">'+
          '<span class="tag c">'+esc(CUENTAS[z.cuenta]||z.cuenta||'—')+'</span>'+
          '<span class="tag">'+esc(z.formato||z.tipo||'pieza')+'</span>'+
          (hecho?'<span class="tag ok">entregada</span>':'')+
        '</div>'+
        '<div class="idea">'+esc(z.idea||'(sin descripción)')+'</div>'+
        (z.referencia
          ? '<a class="ref" href="'+esc(z.referencia)+'" target="_blank" rel="noopener">'+(AJENO?'La referencia que puso':'La referencia que pusiste')+' ↗</a>'
          : '')+
        (z.nota_equipo?'<div class="nota">'+esc(z.nota_equipo)+'</div>':'')+
        '<div class="hecho">'+
          (hecho
            ? '<label>'+(AJENO?'Lo que grabó':'Lo que grabaste')+'</label>'+
              '<a class="ref" href="'+esc(z.hecho)+'" target="_blank" rel="noopener">'+esc(z.hecho)+'</a>'+
              '<div class="muted" style="margin-top:6px">Subida el '+f(z.subido_at)+'.'+
              (AJENO?'':' <a href="#" onclick="return cambiar(\''+esc(z.id)+'\')">Cambiar la liga</a>')+'</div>'
            : (AJENO
              ? '<div class="muted">Todavía sin entregar.</div>'
              : '<label>Cuando la tengas, pega aquí su liga</label>'+
                '<div class="fila" style="margin-bottom:8px">'+
                  '<input id="u-'+esc(z.id)+'" type="url" placeholder="https://instagram.com/reel/…" inputmode="url">'+
                '</div>'+
                '<label>¿Qué día se publicó?</label>'+
                '<div class="fila">'+
                  '<input id="d-'+esc(z.id)+'" type="date" value="'+HOY+'" max="'+HOY+'">'+
                  '<button class="btn" onclick="sube(\''+esc(z.id)+'\')">Subirla</button>'+
                '</div>'))+
          '<div class="msg" id="m-'+esc(z.id)+'"></div>'+
        '</div></div>';
    });
    /* LO QUE VIENE. El plan se cerraba al mes y no habia forma de proponer
       nada mas: si alguien sigue en la casa, tiene que poder decir que va a
       grabar las proximas semanas sin esperar a que el equipo le abra filas.
       Javi, 15-nov-2026: «pidele que suba los contenidos que va a hacer las
       proximas dos semanas». */
    if(!AJENO){
      var maxS=0; piezas.forEach(function(z){ if((z.semana||0)>maxS) maxS=z.semana||0; });
      var opts='';
      for(var k=1;k<=maxS+2;k++){
        opts+='<option value="'+k+'"'+(k===maxS+1?' selected':'')+'>Semana '+k+
              (k>maxS?' (nueva)':'')+'</option>';
      }
      var cOpts='<option value="">¿De qué cuenta?</option>';
      Object.keys(CUENTAS).forEach(function(c){ cOpts+='<option value="'+c+'">'+CUENTAS[c]+'</option>'; });
      h+='<div class="card" id="prop" style="margin-top:20px">'+
        '<h2>Lo que viene</h2>'+
        '<p class="muted">Apunta aquí lo que vas a grabar las próximas semanas. '+
        'Una por una: el equipo lo ve y te dice si hay que ajustar algo.</p>'+
        '<div class="hecho" style="border-top:0;padding-top:4px">'+
          '<div class="fila" style="margin-bottom:8px">'+
            '<select id="p-sem" style="flex:1 1 140px;min-width:0;padding:12px;'+
              'border:1px solid var(--line);border-radius:10px;font-size:16px">'+opts+'</select>'+
            '<select id="p-cta" style="flex:1 1 140px;min-width:0;padding:12px;'+
              'border:1px solid var(--line);border-radius:10px;font-size:16px">'+cOpts+'</select>'+
          '</div>'+
          '<div class="fila" style="margin-bottom:8px">'+
            '<input id="p-fmt" type="text" placeholder="Formato (reel, carrusel, foto…)">'+
          '</div>'+
          '<div class="fila" style="margin-bottom:8px">'+
            '<input id="p-idea" type="text" placeholder="Qué vas a hacer">'+
          '</div>'+
          '<div class="fila">'+
            '<input id="p-ref" type="url" placeholder="Referencia (opcional)" inputmode="url">'+
            '<button class="btn" onclick="propone()">Añadirla</button>'+
          '</div>'+
          '<div class="msg" id="p-msg"></div>'+
        '</div></div>';
    }

    W.innerHTML=h;
    ligaSelector();
  }

  window.propone=async function(){
    var m=document.getElementById('p-msg');
    var sem=+(document.getElementById('p-sem')||{}).value||0;
    var idea=((document.getElementById('p-idea')||{}).value||'').trim();
    if(!idea){ m.className='msg err'; m.textContent='Dinos qué vas a hacer.'; return; }
    m.className='msg'; m.textContent='Guardando…';
    try{
      var r=await sb.rpc('vol_pieza_proponer',{
        p_semana:sem,
        p_cuenta:((document.getElementById('p-cta')||{}).value||'')||null,
        p_formato:((document.getElementById('p-fmt')||{}).value||'').trim()||null,
        p_idea:idea,
        p_ref:((document.getElementById('p-ref')||{}).value||'').trim()||null});
      var d=r && r.data;
      if(!d || d.error){ m.className='msg err'; m.textContent=(d&&d.error)||'No se pudo guardar.'; return; }
      m.className='msg ok'; m.textContent='✓ Añadida';
      setTimeout(carga, 600);
    }catch(e){ m.className='msg err'; m.textContent='No se pudo guardar.'; }
  };

  window.cambiar=function(id){
    var p=document.getElementById('pz-'+id); if(!p) return false;
    var c=p.querySelector('.hecho');
    c.innerHTML='<label>Pega la liga nueva</label>'+
      '<div class="fila" style="margin-bottom:8px">'+
      '<input id="u-'+id+'" type="url" placeholder="https://instagram.com/reel/…" inputmode="url"></div>'+
      '<label>¿Qué día se publicó?</label><div class="fila">'+
      '<input id="d-'+id+'" type="date" value="'+HOY+'" max="'+HOY+'">'+
      '<button class="btn" onclick="sube(\''+id+'\')">Guardar</button></div>'+
      '<div class="msg" id="m-'+id+'"></div>';
    var i=document.getElementById('u-'+id); if(i) i.focus();
    return false;
  };

  window.sube=async function(id){
    var i=document.getElementById('u-'+id), m=document.getElementById('m-'+id);
    if(!i||!m) return;
    var v=(i.value||'').trim();
    if(!v){ m.className='msg err'; m.textContent='Falta la liga.'; return; }
    m.className='msg'; m.textContent='Guardando…';
    try{
      /* La fecha va SIEMPRE, aunque sea la de hoy: lo que decide en qué
         semana cuenta la pieza es el día en que se publicó, no el día en que
         pegó la liga. Quien sube en bloque lo de semanas pasadas llena las
         semanas de verdad. Javi, 15-nov-2026. */
      var fd=document.getElementById('d-'+id);
      var fecha=(fd && fd.value) ? fd.value : HOY;
      var r=await sb.rpc('vol_pieza_subir',{p_pieza:id,p_url:v,p_fecha:fecha});
      var d=r && r.data;
      if(!d || d.error){ m.className='msg err'; m.textContent=(d&&d.error)||'No se pudo guardar.'; return; }
      m.className='msg ok'; m.textContent='✓ Guardada';
      setTimeout(carga, 600);
    }catch(e){ m.className='msg err'; m.textContent='No se pudo guardar.'; }
  };

  /* La sesión viaja en el navegador; si todavía no está, se espera un poco en
     vez de enseñar un error a quien acaba de entrar. */
  (async function(){
    for(var i=0;i<12;i++){
      var s=null; try{ s=(await sb.auth.getSession()).data.session; }catch(e){}
      if(s){ carga(); return; }
      await new Promise(function(r){ setTimeout(r,400); });
    }
    W.innerHTML='<div class="state">Entra con tu cuenta para ver tu plan.</div>';
  })();
})();
</script>
</body></html>
