<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Recibir mercancía · Casa Pepe</title>
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input,textarea{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(100px + var(--safe-b))}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}
.aviso{background:#fff8ea;border:1px solid #e8d4a8;border-radius:14px;padding:12px 13px;color:#8a6212;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.mal{background:#fdecec;border-color:#e8b4b4;color:#8a2020}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:18px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:5px;line-height:1.6}
.hero .s b{color:var(--txt2)}
.escan{width:100%;border:none;border-radius:14px;background:#16130f;color:#f4ecdd;padding:16px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:12px}
.escan.sec{background:var(--bg3);color:var(--txt2)}
#cam{width:100%;border-radius:14px;background:#000;display:block;max-height:52vh;object-fit:cover}
.grupo{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 7px}
.ped{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);
  border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer}
.ped .n{flex:1}
.ped .n b{display:block;font-size:14.5px}
.ped .n span{font-size:11.5px;color:var(--txt3)}
.ped .fl{color:var(--txt3);font-size:18px}
.it{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow)}
.it .lin{display:flex;align-items:center;gap:10px}
.it .n{flex:1;min-width:0}
.it .n b{display:block;font-size:14px;line-height:1.3}
.it .n span{font-size:11.5px;color:var(--txt3)}
.it input.cant{width:82px;padding:10px 8px;border:1px solid var(--bd);border-radius:11px;background:var(--bg2);
  font-size:16px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.it .det{display:none;margin-top:9px;gap:8px}
.it.abierto .det{display:flex}
.it .det input{flex:1;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg2);font-size:13px}
label.cmp{display:block;font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em;margin:14px 0 6px}
input.txt{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:15px}
#firma{width:100%;height:150px;background:#fff;border:1px dashed var(--bd);border-radius:12px;touch-action:none;display:block}
.mini{font-size:11.5px;color:var(--txt3);margin-top:5px}
.foto{width:100%;padding:12px;border:1px dashed var(--bd);border-radius:12px;background:#fff;font-size:13.5px}
.previa{width:100%;border-radius:12px;margin-top:8px;display:block}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:9px;align-items:center;z-index:30}
.barra .info{flex:1;font-size:12px;color:var(--txt3);line-height:1.4}
.barra .info b{color:var(--txt);font-size:14px}
.barra button{border:none;border-radius:11px;padding:13px 16px;font-size:14px;font-weight:800;cursor:pointer}
.barra .g{background:var(--bg3);color:var(--txt2)}
.barra .c{background:#16130f;color:#f4ecdd}
.barra button[disabled]{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style><script src="/embed-child.js"></script>
<script>
function cpVolverApp(){
  try{ if(window.top!==window.self){ window.parent.postMessage({type:'cp-embed-home'}, location.origin); return; } }catch(e){}
  location.href='/soypepe/';
}
</script>
</head><body>

<div class="appbar">
  <button class="bk" id="atras" onclick="cpVolverApp()">‹</button>
  <span class="t">📦 <b id="titulo">Recibir mercancía</b></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>n==null?'':(Math.round(+n*100)/100).toLocaleString('es-MX');
const money=n=>n==null?'—':'$'+(Math.round(+n*100)/100).toLocaleString('es-MX',{minimumFractionDigits:2});
let TT; function toast(m){ const t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),2800); }

let EMAIL='', PED=null, STREAM=null, ESCANEANDO=false, FOTO=null, FIRMADO=false;

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').innerHTML='<div class="ph">Entra con tu cuenta desde Soy Pepe para recibir mercancía.</div>'; return; }
  EMAIL=(session.user.email||'').toLowerCase();
  const t=new URLSearchParams(location.search).get('t');
  if(t) return abrirToken(t);
  lista();
}

/* ── Lo que me falta por recibir ────────────────────────────────── */
async function lista(){
  paraCamara(false); PED=null; FOTO=null; FIRMADO=false;
  $('titulo').textContent='Recibir mercancía';
  $('atras').onclick=cpVolverApp;
  $('wrap').innerHTML='<div class="ph">Buscando pedidos…</div>';
  const {data,error}=await sb.rpc('cmp_mis_por_recibir',{p_email:EMAIL});
  if(error){ $('wrap').innerHTML='<div class="ph">No se pudo leer tus pedidos.<br><span style="font-size:12px">'+esc(error.message)+'</span></div>'; return; }
  const l=data||[];
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">¿Llegó un pedido?</div>'+
    '<div class="s">Escanea el QR de la orden que trae el proveedor, o elígelo de la lista.</div></div>'+
    '<button class="escan" onclick="escanear()">📷 Escanear el QR</button>'+
    (l.length
      ? '<div class="grupo">Pendientes de recibir</div>'+l.map(p=>
          '<button class="ped" onclick="abrirToken(\'' + p.token + '\')">'+
            '<span class="n"><b>'+esc(p.folio)+' · '+esc(p.proveedor||'sin proveedor')+'</b>'+
            '<span>'+esc(p.sede)+' · '+esc(p.bodega||'sin bodega')+' · '+p.items+' producto'+(p.items===1?'':'s')+
            (p.estado==='recibido_parcial'?' · <b style="color:#8a6212">llegó incompleto</b>':'')+'</span></span>'+
            '<span class="fl">›</span></button>').join('')
      : '<div class="ph">No tienes nada pendiente de recibir.</div>');
}
window.escanear=escanear;
window.abrirToken=abrirToken;

/* ── Cámara ─────────────────────────────────────────────────────── */
function paraCamara(mostrar){
  ESCANEANDO=!!mostrar;
  if(!mostrar && STREAM){ STREAM.getTracks().forEach(t=>t.stop()); STREAM=null; }
}
async function escanear(){
  $('wrap').innerHTML='<div class="hero"><div class="n">Apunta al QR</div>'+
    '<div class="s">Está en la orden de compra que trae el proveedor.</div></div>'+
    '<video id="cam" playsinline muted></video>'+
    '<button class="escan sec" style="margin-top:12px" onclick="lista()">Cancelar</button>';
  try{
    STREAM=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
  }catch(e){
    $('wrap').innerHTML='<div class="aviso mal">No pude abrir la cámara: '+esc(e.message||e)+
      '<br>Puedes elegir el pedido de la lista.</div>'+
      '<button class="escan sec" onclick="lista()">Ver la lista</button>';
    return;
  }
  const v=$('cam'); v.srcObject=STREAM; await v.play();
  ESCANEANDO=true;
  // BarcodeDetector es nativo en Chrome de Android; si no está, se cae a jsQR.
  let det=null;
  if('BarcodeDetector' in window){
    try{ det=new window.BarcodeDetector({formats:['qr_code']}); }catch(_){ det=null; }
  }
  let jsQR=null;
  if(!det){
    try{ jsQR=(await import('https://cdn.jsdelivr.net/npm/jsqr@1.4.0/+esm')).default; }
    catch(_){ toast('Este teléfono no puede leer QR; elige el pedido de la lista.'); }
  }
  const lienzo=document.createElement('canvas'); const ctx=lienzo.getContext('2d',{willReadFrequently:true});
  const mira=async()=>{
    if(!ESCANEANDO) return;
    try{
      let txt=null;
      if(det){ const r=await det.detect(v); if(r&&r.length) txt=r[0].rawValue; }
      else if(jsQR && v.videoWidth){
        lienzo.width=v.videoWidth; lienzo.height=v.videoHeight;
        ctx.drawImage(v,0,0,lienzo.width,lienzo.height);
        const d=ctx.getImageData(0,0,lienzo.width,lienzo.height);
        const r=jsQR(d.data,d.width,d.height); if(r) txt=r.data;
      }
      if(txt){
        const m=String(txt).match(/[?&]t=([^&]+)/);
        const tok=m?decodeURIComponent(m[1]):String(txt).trim();
        paraCamara(false);
        return abrirToken(tok);
      }
    }catch(_){}
    requestAnimationFrame(mira);
  };
  requestAnimationFrame(mira);
}

/* ── El pedido ──────────────────────────────────────────────────── */
async function abrirToken(tok){
  paraCamara(false);
  $('wrap').innerHTML='<div class="ph">Abriendo el pedido…</div>';
  const {data,error}=await sb.rpc('cmp_pedido_por_token',{p_token:tok});
  if(error||!data){
    $('wrap').innerHTML='<div class="aviso mal">Ese QR no corresponde a ningún pedido pendiente.</div>'+
      '<button class="escan sec" onclick="lista()">Volver</button>';
    return;
  }
  PED=data; PED._token=tok; FOTO=null; FIRMADO=false;
  if(['recibido','cancelado','rechazado'].includes(PED.estado)){
    $('wrap').innerHTML='<div class="aviso">Este pedido ya está <b>'+esc(PED.estado)+'</b>. No hay nada que recibir.</div>'+
      '<button class="escan sec" onclick="lista()">Volver</button>';
    return;
  }
  $('titulo').textContent=PED.folio;
  $('atras').onclick=lista;
  pinta();
}

function pinta(){
  const its=(PED.items||[]).map(fila).join('');
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">'+esc(PED.folio)+'</div><div class="s">'+
      '<b>'+esc(PED.proveedor||'sin proveedor')+'</b><br>'+
      esc(PED.sede)+' · entra en <b>'+esc(PED.bodega||'sin bodega')+'</b><br>'+
      'Lo pidió '+esc(PED.solicitante||'')+'</div></div>'+
    '<div class="aviso">Revisa que lo que traen sea lo que dice el papel. Si algo llegó distinto, corrige la cantidad o el precio en su renglón.</div>'+
    its+
    '<label class="cmp">¿Quién lo entregó?</label>'+
    '<input class="txt" id="quien" placeholder="Nombre de quien trae la mercancía">'+
    '<label class="cmp">Foto de la remisión o de la mercancía</label>'+
    '<input class="foto" id="foto" type="file" accept="image/*" capture="environment" onchange="tomaFoto(this)">'+
    '<div id="previa"></div>'+
    '<label class="cmp">Firma de quien entrega</label>'+
    '<canvas id="firma"></canvas>'+
    '<div class="mini">Firma con el dedo. <a href="javascript:void(0)" onclick="limpiaFirma()">Borrar</a></div>'+
    '<div class="barra"><div class="info"><b id="sum">—</b><br>lo que llegó</div>'+
      '<button class="g" onclick="firmar(true)">Llegó incompleto</button>'+
      '<button class="c" onclick="firmar(false)">Recibir y firmar</button></div>';
  montaFirma();
  suma();
}
function fila(i){
  return '<div class="it" id="it-'+i.id+'">'+
    '<div class="lin"><div class="n"><b>'+esc(i.producto)+'</b>'+
      '<span>pedidas '+num(i.pedida)+' '+esc(i.unidad||'')+' · '+money(i.precio)+' c/u</span></div>'+
      '<input class="cant" type="number" inputmode="decimal" step="0.01" min="0" value="'+
        (i.recibida!=null?i.recibida:i.pedida)+'" oninput="suma()"></div>'+
    '<div class="det"><input class="pre" type="number" step="0.01" min="0" placeholder="precio real" value="'+
      (i.precio!=null?i.precio:'')+'" oninput="suma()">'+
      '<input class="nota" placeholder="nota (opcional)"></div>'+
    '<div class="mini"><a href="javascript:void(0)" onclick="document.getElementById(\'it-'+i.id+'\').classList.toggle(\'abierto\')">Cambió el precio</a></div>'+
  '</div>';
}
window.suma=function(){
  let s=0;
  (PED.items||[]).forEach(i=>{
    const e=document.getElementById('it-'+i.id); if(!e) return;
    const c=parseFloat(e.querySelector('.cant').value)||0;
    const p=parseFloat(e.querySelector('.pre').value)||0;
    s+=c*p;
  });
  const el=$('sum'); if(el) el.textContent=money(s);
};

/* ── Firma ──────────────────────────────────────────────────────── */
function montaFirma(){
  const c=$('firma'); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.2; x.lineCap='round'; x.strokeStyle='#16130f';
  let trazando=false;
  const pos=e=>{ const b=c.getBoundingClientRect(); const t=e.touches?e.touches[0]:e; return [t.clientX-b.left, t.clientY-b.top]; };
  const ini=e=>{ e.preventDefault(); trazando=true; FIRMADO=true; const [a,b]=pos(e); x.beginPath(); x.moveTo(a,b); };
  const mov=e=>{ if(!trazando) return; e.preventDefault(); const [a,b]=pos(e); x.lineTo(a,b); x.stroke(); };
  const fin=()=>{ trazando=false; };
  c.addEventListener('pointerdown',ini); c.addEventListener('pointermove',mov);
  c.addEventListener('pointerup',fin);   c.addEventListener('pointerleave',fin);
}
window.limpiaFirma=function(){
  const c=$('firma'); if(!c) return;
  c.getContext('2d').clearRect(0,0,c.width,c.height); FIRMADO=false;
};
window.tomaFoto=function(inp){
  const f=inp.files&&inp.files[0]; if(!f) return;
  FOTO=f;
  const u=URL.createObjectURL(f);
  $('previa').innerHTML='<img class="previa" src="'+u+'" alt="foto">';
};

/* ── Firmar y entrar a bodega ───────────────────────────────────── */
async function sube(blob, ext){
  const ruta='recepciones/'+PED.folio+'-'+Date.now()+'.'+ext;
  const {error}=await sb.storage.from('comprobantes').upload(ruta, blob, {upsert:false});
  if(error){ toast('No se pudo subir: '+error.message); return null; }
  return ruta;
}
window.firmar=async function(parcial){
  if(!FIRMADO) return toast('Falta la firma de quien entrega.');
  const quien=($('quien').value||'').trim();
  if(!quien) return toast('Pon el nombre de quien entregó.');

  const lineas=(PED.items||[]).map(i=>{
    const e=document.getElementById('it-'+i.id);
    return { id:i.id,
      recibida: e.querySelector('.cant').value,
      precio:   e.querySelector('.pre').value,
      nota:     e.querySelector('.nota').value };
  });

  toast('Guardando…');
  const c=$('firma');
  const firmaBlob=await new Promise(r=>c.toBlob(r,'image/png'));
  const firmaUrl=firmaBlob?await sube(firmaBlob,'png'):null;
  const fotoUrl=FOTO?await sube(FOTO,(FOTO.name.split('.').pop()||'jpg')):null;

  const {data,error}=await sb.rpc('cmp_recibir_por_token',{
    p_token:PED._token, p_lineas:lineas, p_quien_trajo:quien,
    p_firma_url:firmaUrl, p_foto_url:fotoUrl, p_recibe_email:EMAIL,
    p_notas:null, p_parcial:!!parcial });
  if(error) return toast(error.message);
  if(data&&data.error) return toast(data.error);

  $('wrap').innerHTML='<div class="hero"><div class="n">✅ Recibido</div><div class="s">'+
    esc(PED.folio)+' por '+money(data.total)+'.<br>La mercancía ya entró a <b>'+esc(PED.bodega||'la bodega')+'</b>'+
    (parcial?' y el pedido queda como <b>incompleto</b>, para lo que falte.':'.')+'</div></div>'+
    '<button class="escan" onclick="lista()">Recibir otro</button>'+
    '<button class="escan sec" onclick="cpVolverApp()">Volver a Soy Pepe</button>';
  $('titulo').textContent='Recibido';
};

window.addEventListener('pagehide',()=>paraCamara(false));
boot();
</script>
</body></html>
