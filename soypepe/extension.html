<!-- LA EXTENSIÓN LA VENDE QUIEN ESTÁ EN EL CUARTO.
     Quien se entera de que el huésped se quiere quedar es la recamarista: está
     ahí, con la mochila abierta y la ropa sin recoger. Hasta hoy eso acababa en
     "pues baja a recepción", y a recepción no baja todo el mundo. Aquí lo cierra
     ella: ve si puede quedarse en su misma cama, le dice cuánto es, el huésped
     firma con el dedo y le llega su correo. $25 por noche a la bolsa común de
     housekeeping. Javi, 6-oct-2026. -->
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
 --accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
 --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,input{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar select{margin-left:auto;background:#2b2620;color:#f4ecdd;border:1px solid #3a3228;border-radius:9px;padding:5px 8px;font-size:12px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(34px + var(--safe-b))}
.ph{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.6}
.reint{margin-top:12px;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:11px 18px;font-weight:700;font-size:14px}
.intro{font-size:13px;color:var(--txt2);line-height:1.55;margin:0 0 12px}
.busca{width:100%;padding:12px 13px;border:1px solid var(--bd);border-radius:13px;background:#fff;font-size:15px;margin-bottom:10px}

/* --- una cama, una tarjeta: es como ella mira la casa --- */
.cama{background:#fff;border:1px solid var(--bd);border-left:3px solid #c9c3b4;border-radius:14px;
  padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer;display:flex;gap:11px;align-items:center}
.cama:active{background:var(--bg2)}
.cama.hoy{border-left-color:var(--bad)}
.cama.manana{border-left-color:var(--gold)}
.cama .c{flex:1;min-width:0}
.cama .n{font-size:15px;font-weight:800;line-height:1.25}
.cama .d{font-size:12.5px;color:var(--txt3);margin-top:3px;line-height:1.45}
.cama .q{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
  padding:4px 9px;border-radius:99px;background:var(--bg3);color:var(--txt2);white-space:nowrap;flex:none}
.cama .q.hoy{background:#f7e3de;color:#8f3d2a}
.cama .q.manana{background:#fbf0dc;color:#8a6420}
.cama .ya{display:inline-block;margin-top:5px;font-size:11px;font-weight:700;background:#e3efe0;color:#43663a;padding:2px 8px;border-radius:99px}

.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:11px}
.card h2{margin:0 0 3px;font-size:16px;font-weight:800}
.card .s{font-size:12.5px;color:var(--txt3);line-height:1.5}
.lab{font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--txt3);margin:14px 0 7px}
.noches{display:flex;gap:7px;flex-wrap:wrap}
.nb{flex:1 0 56px;background:#fff;border:1.5px solid var(--bd);border-radius:13px;padding:9px 4px;text-align:center;cursor:pointer}
.nb b{display:block;font-size:17px;font-weight:800}
.nb span{font-size:10.5px;color:var(--txt3)}
.nb[aria-pressed="true"]{border-color:var(--accent);background:#eaf6f1}
.alt{width:100%;display:flex;gap:11px;align-items:center;text-align:left;background:#fff;border:1.5px solid var(--bd);
  border-radius:14px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.alt[aria-pressed="true"]{border-color:var(--accent);background:#eaf6f1}
.alt .ic{font-size:20px;flex:none}
.alt .c{flex:1;min-width:0}
.alt .nm{font-size:14px;font-weight:800;line-height:1.3}
.alt .de{font-size:12px;color:var(--txt3);margin-top:2px;line-height:1.4;overflow-wrap:anywhere}
.alt .av{display:block;font-size:11.5px;color:#8a6420;font-weight:700;margin-top:3px}
.alt .pr{text-align:right;flex:none}
.alt .pr b{font-size:15px;font-weight:800}
.alt .pr s{display:block;font-size:11px;color:var(--txt3)}
.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 2px;border-top:1px solid var(--bg3);margin-top:12px}
.tot span{font-size:13px;color:var(--txt2)}
.tot b{font-size:21px;font-weight:800}
.btn{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:15px;
  font-size:16px;font-weight:800;margin-top:11px;cursor:pointer}
.btn:disabled{opacity:.5}
.btn.sec{background:#fff;color:var(--txt);border:1.5px solid var(--bd)}
.msg{margin-top:10px;font-size:13.5px;line-height:1.5;padding:11px 12px;border-radius:12px;display:none}
.msg.on{display:block}
.msg.warn{background:#f7e3de;color:#8f3d2a}
.msg.ok{background:#e3efe0;color:#43663a}
.msg.espera{background:#fbf0dc;color:#8a6420}

/* --- el documento que lee y firma el huésped --- */
.doc{background:#fffdf8;border:1px solid #e8d4a8;border-radius:14px;padding:14px;font-size:13.5px;line-height:1.6;color:var(--txt)}
.doc h3{margin:0 0 8px;font-size:15px}
.doc table{width:100%;border-collapse:collapse;margin:8px 0 10px}
.doc td{padding:5px 0;font-size:13.5px;border-bottom:1px solid #f0e6d2}
.doc td:last-child{text-align:right;font-weight:800}
.doc .en{color:var(--txt3);font-size:12px;margin-top:9px;line-height:1.5}
.padbox{position:relative;background:#fff;border:1.5px dashed var(--bd);border-radius:14px;margin-top:11px;overflow:hidden}
canvas#pad{display:block;width:100%;height:190px;touch-action:none}
.padhint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#c7bda6;font-size:14px;pointer-events:none}
.listo{text-align:center;padding:10px 4px}
.listo .big{font-size:44px}
.listo h2{margin:8px 0 4px;font-size:20px}
.listo p{margin:0 0 10px;font-size:14px;color:var(--txt2);line-height:1.55}
.decir{background:#eaf6f1;border-radius:13px;padding:13px;text-align:left;font-size:14px;line-height:1.6;margin:12px 0}
.decir b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:5px}
.bolsa{font-size:12.5px;color:var(--txt3);margin-top:8px}
</style>

function cpVolverApp(){
  try{ if(window.top!==window.self){ window.parent.postMessage({type:'cp-embed-home'}, location.origin); return; } }catch(e){}
  location.href='/soypepe/';
}

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});

const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX');
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const dia=s=>{ if(!s) return '—'; const p=String(s).split('-'); return p.length===3?(p[2]+'/'+p[1]):s; };
const CASAS=['45e69775-d877-4507-a9e1-a45bd3400dc5','febfbef6-7fd1-4b45-84d9-13533e8dcb72'];
const ICO={misma_cama:'🛏️',misma_cama_moviendo:'🛏️',mismo_dorm:'🧳',otro_dorm:'🧳',privada:'🚪'};

let EMP=null,NOMBRE=null,PROP=CASAS[0],CAMAS=[],FILTRO='',CANAL='recepcion';
let SEL=null,DATOS=null,NOCHES=1,ALT=null,PASO='lista';

/* ---------- sesión ---------- */
async function sesionViva(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) return null;
  const faltan=(session.expires_at||0)*1000-Date.now();
  if(faltan>60000) return session;
  const {data,error}=await sb.auth.refreshSession();
  if(error||!data?.session){ try{ await sb.auth.signOut(); }catch(e){} return null; }
  return data.session;
}
/* Toda la pantalla habla con una sola función, y va firmada con la sesión de
   quien la usa: la comisión y la firma tienen que saber quién vendió. */
async function api(body){
  const s=await sesionViva();
  if(!s){ cpVolverApp(); throw new Error('sin sesión'); }
  const r=await fetch(SB_URL+'/functions/v1/hk-extension',{method:'POST',
    headers:{apikey:SB_KEY,Authorization:'Bearer '+s.access_token,'Content-Type':'application/json'},
    body:JSON.stringify({prop:PROP,...body})});
  return await r.json().catch(()=>({ok:false,error:'no contestó el servidor'}));
}

/* De dónde vino, para devolverlo ahí. Si entró por el concierge —«Servicios de
   la casa · Quédate más»— volver al inicio de Soy Pepe le hace rehacer el camino
   entero. Javi, 7-oct. */
var VOLVER=(function(){ try{ return new URLSearchParams(location.search).get('volver')||''; }catch(e){ return ''; } })();
/* ¿Está suelta o dentro de la app? Dentro, la app ya pone la cabecera de arriba. */
var SUELTA=(function(){ try{ return window.top===window.self; }catch(e){ return false; } })();
function atras(){
  if(PASO==='firma'){ pintaOpciones(); return; }
  if(PASO==='opciones'){ SEL=null; DATOS=null; pintaLista(); return; }
  if(VOLVER==='concierge'){ location.href='/soypepe/experiencias.html'; return; }
  cpVolverApp();
}
window.atras=atras;

/* ---------- 1 · las camas ocupadas ---------- */
async function cargaCamas(){
  PASO='lista';
  $('wrap').innerHTML='<div class="ph">Viendo quién está en casa…</div>';
  const r=await api({op:'ocupadas'});
  if(!r||!r.ok){
    $('wrap').innerHTML='<div class="ph">'+esc(r&&r.error||'No se pudo leer la casa.')+
      '<br><button class="reint" onclick="location.reload()">Reintentar</button></div>';
    return;
  }
  CAMAS=r.camas||[];
  pintaLista();
}
function pintaLista(){
  PASO='lista';
  const f=FILTRO.trim().toLowerCase();
  const lista=CAMAS.filter(c=>!f || (c.huesped+' '+c.cama).toLowerCase().includes(f));
  const filas=lista.map(c=>{
    const q = c.le_quedan<=0?'hoy' : (c.le_quedan===1?'manana':'');
    const et = c.le_quedan<=0?'Se va hoy' : (c.le_quedan===1?'Se va mañana':'Le quedan '+c.le_quedan+' noches');
    return '<div class="cama '+q+'" data-r="'+esc(c.reservation_id)+'">'+
      '<div class="c"><div class="n">'+esc(c.cama)+'</div>'+
      '<div class="d">'+esc(c.huesped)+' · sale el '+dia(c.sale)+'</div>'+
      (c.ya_extendida?'<span class="ya">ya extendida hasta el '+dia(c.ya_extendida.salida_despues)+'</span>':'')+
      '</div><span class="q '+q+'">'+et+'</span></div>';
  }).join('');
  $('wrap').innerHTML=
    '<p class="intro">Toca la cama del huésped que te dijo que se quiere quedar. '+
    'Primero salen los que se van antes, que son los que hay que preguntar hoy.</p>'+
    '<input class="busca" id="q" placeholder="Buscar por nombre o cama…" value="'+esc(FILTRO)+'">'+
    (filas||'<div class="ph">No hay nadie en casa esta noche, o la casa todavía no contesta.</div>');
  const q=$('q');
  if(q) q.oninput=()=>{ FILTRO=q.value; const v=q.value; pintaLista();
    const n=$('q'); if(n){ n.focus(); n.setSelectionRange(v.length,v.length); } };
  Array.prototype.forEach.call(document.querySelectorAll('[data-r]'),b=>{
    b.onclick=()=>abre(b.getAttribute('data-r'));
  });
}

/* ---------- 2 · sus opciones ---------- */
async function abre(rid){
  SEL=CAMAS.find(c=>c.reservation_id===rid)||null;
  if(!SEL) return;
  PASO='opciones';
  $('wrap').innerHTML='<div class="ph">Viendo si puede quedarse en su cama…<br>'+
    '<span style="font-size:12.5px">Esto lee la casa entera, tarda unos segundos.</span></div>';
  DATOS=await api({op:'opciones',reservation_id:rid});
  NOCHES=1; ALT=null;
  pintaOpciones();
}
function pintaOpciones(){
  PASO='opciones';
  if(!DATOS||!DATOS.ok||!(DATOS.escalera||[]).length){
    $('wrap').innerHTML='<div class="card"><h2>'+esc(SEL.huesped)+'</h2>'+
      '<div class="s">'+esc(SEL.cama)+' · sale el '+dia(SEL.sale)+'</div></div>'+
      '<div class="ph">'+esc((DATOS&&DATOS.mensaje)||'Para esas noches ya no queda sitio. Mándalo a recepción.')+'</div>'+
      '<button class="btn sec" onclick="atras()">Volver a la lista</button>';
    return;
  }
  const fila=DATOS.escalera.find(e=>e.noches===NOCHES)||DATOS.escalera[0];
  NOCHES=fila.noches;
  const clave=a=>a.clave||a.tipo;
  if(!ALT || !fila.alternativas.some(a=>clave(a)===ALT)) ALT=clave(fila.mejor);
  const eleg=fila.alternativas.find(a=>clave(a)===ALT)||fila.mejor;

  const pastillas=DATOS.escalera.map(e=>
    '<button class="nb" data-n="'+e.noches+'" aria-pressed="'+(e.noches===NOCHES)+'">'+
    '<b>+'+e.noches+'</b><span>'+(e.noches===1?'noche':'noches')+'</span></button>').join('');

  const alts=fila.alternativas.map(a=>{
    const ahorro=a.sin-a.precio, k=clave(a);
    return '<button class="alt" data-a="'+esc(k)+'" aria-pressed="'+(k===ALT)+'">'+
      '<span class="ic">'+(ICO[a.tipo]||'🛏️')+'</span>'+
      '<span class="c"><span class="nm">'+esc(a.etiqueta)+'</span>'+
      '<span class="de">'+esc(a.detalle||'')+'</span>'+
      (a.mueve_cosas?'<span class="av">🧳 Hay que moverlo de cama</span>':'<span class="av" style="color:var(--accent)">✓ No se mueve</span>')+
      '</span><span class="pr"><b>'+money(a.precio)+'</b>'+(ahorro>0?'<s>'+money(a.sin)+'</s>':'')+'</span></button>';
  }).join('');

  $('wrap').innerHTML=
    '<div class="card"><h2>'+esc(SEL.huesped)+'</h2>'+
      '<div class="s">'+esc(SEL.cama)+' · hoy sale el '+dia(SEL.sale)+'</div>'+
      '<div class="lab">¿Cuántas noches más?</div><div class="noches">'+pastillas+'</div>'+
      '<div class="lab">¿Dónde duerme?</div>'+alts+
      '<div class="tot"><span>Total con SuperPepe · '+NOCHES+(NOCHES===1?' noche':' noches')+'</span><b>'+money(eleg.precio)+'</b></div>'+
      (eleg.mueve_cosas
        ? '<div class="msg on espera">🧳 Díselo tal cual: <b>su cama ya está asegurada</b>, pero esa cama la ocupa otro. '+
          'Que deje sus cosas juntas —tú se las subes— y que pase por recepción por la llave nueva.</div>'
        : '<div class="msg on ok">✓ Se queda en su misma cama. No hay que mover nada.</div>')+
      '<button class="btn" id="bSigue">Está de acuerdo · firmar</button>'+
      '<button class="btn sec" onclick="atras()">Volver</button>'+
    '</div>';

  Array.prototype.forEach.call(document.querySelectorAll('[data-n]'),b=>{
    b.onclick=()=>{ NOCHES=+b.getAttribute('data-n'); pintaOpciones(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-a]'),b=>{
    b.onclick=()=>{ ALT=b.getAttribute('data-a'); pintaOpciones(); };
  });
  $('bSigue').onclick=()=>pintaFirma(fila,eleg);
}

/* ---------- 3 · el documento y la firma ----------
   Javi: "el cliente debe firmar con el dedo el nuevo precio, como si fuera un
   checkin nuevo". Así que lo que firma no es un botón: es una hoja con su nombre,
   su reserva, dónde duerme, cuánto es y cómo se paga. */
function textoDoc(fila,eleg){
  return 'Extensión de estancia · Casa Pepe\n'+
    SEL.huesped+' · reserva '+SEL.reservation_id+'\n'+
    'Te quedas '+fila.noches+(fila.noches===1?' noche más':' noches más')+', hasta el '+fila.hasta+'.\n'+
    'Dónde duermes: '+eleg.etiqueta+(eleg.detalle?' · '+eleg.detalle:'')+'\n'+
    'Total: '+money(eleg.precio)+' MXN, con el descuento SuperPepe ya aplicado.\n'+
    'El importe queda como saldo pendiente en tu cuenta y se paga en recepción.'+
    (eleg.mueve_cosas?'\nEsta extensión incluye cambio de cama: housekeeping mueve tus cosas y recoges tu llave nueva en recepción.':'');
}
function pintaFirma(fila,eleg){
  PASO='firma';
  const t=textoDoc(fila,eleg);
  $('wrap').innerHTML=
    '<div class="card"><div class="doc">'+
      '<h3>Extensión de estancia</h3>'+
      '<div style="font-size:13px;color:var(--txt2)">'+esc(SEL.huesped)+' · reserva '+esc(SEL.reservation_id)+'</div>'+
      '<table>'+
        '<tr><td>Noches más</td><td>'+fila.noches+'</td></tr>'+
        '<tr><td>Nueva salida</td><td>'+dia(fila.hasta)+'</td></tr>'+
        '<tr><td>Dónde duermes</td><td>'+esc(eleg.etiqueta)+'</td></tr>'+
        '<tr><td>Total (SuperPepe incluido)</td><td>'+money(eleg.precio)+'</td></tr>'+
      '</table>'+
      '<div>El importe queda como <b>saldo pendiente</b> en tu cuenta y se paga en recepción. '+
      (eleg.mueve_cosas?'Esta extensión incluye cambio de cama: housekeeping mueve tus cosas y recoges tu llave nueva en recepción. ':'')+
      'Al firmar aceptas este cargo y las mismas políticas de hospedaje que firmaste al llegar.</div>'+
      '<div class="en"><b>EN ·</b> You are extending your stay '+fila.noches+(fila.noches===1?' night':' nights')+
      ' until '+esc(fila.hasta)+' — '+esc(eleg.etiqueta)+'. Total '+money(eleg.precio)+' MXN, SuperPepe discount included, '+
      'charged to your account and payable at reception. By signing you accept this charge and the house policies you signed on arrival.</div>'+
    '</div>'+
    '<div class="lab">Que firme aquí con el dedo</div>'+
    '<div class="padbox"><canvas id="pad"></canvas><div class="padhint" id="padHint">✍️ Firma del huésped</div></div>'+
    '<button class="btn sec" id="bBorra" style="margin-top:8px">Borrar firma</button>'+
    '<button class="btn" id="bCierra">Cerrar la extensión</button>'+
    '<button class="btn sec" onclick="atras()">Volver</button>'+
    '<div class="msg" id="m"></div>'+
    '</div>';
  montaPad();
  $('bBorra').onclick=limpiaPad;
  $('bCierra').onclick=function(){ cierra(this, fila, eleg, t); };
}

/* El lienzo de la firma. Se dibuja a la resolución del teléfono para que no salga
   un garabato pixelado, y con pointer events, que valen para dedo y para lápiz. */
let PAD=null,CTX=null,HAYFIRMA=false;
function montaPad(){
  PAD=$('pad'); const r=PAD.getBoundingClientRect(), d=window.devicePixelRatio||1;
  PAD.width=Math.round(r.width*d); PAD.height=Math.round(r.height*d);
  CTX=PAD.getContext('2d'); CTX.scale(d,d);
  CTX.lineWidth=2.2; CTX.lineCap='round'; CTX.lineJoin='round'; CTX.strokeStyle='#16130f';
  HAYFIRMA=false;
  let pintando=false;
  const pos=e=>{ const b=PAD.getBoundingClientRect(); return [e.clientX-b.left, e.clientY-b.top]; };
  PAD.onpointerdown=e=>{ pintando=true; PAD.setPointerCapture(e.pointerId);
    const [x,y]=pos(e); CTX.beginPath(); CTX.moveTo(x,y);
    HAYFIRMA=true; const h=$('padHint'); if(h) h.style.display='none'; };
  PAD.onpointermove=e=>{ if(!pintando) return; const [x,y]=pos(e); CTX.lineTo(x,y); CTX.stroke(); };
  PAD.onpointerup=PAD.onpointerleave=()=>{ pintando=false; };
}
function limpiaPad(){
  if(!CTX||!PAD) return;
  const d=window.devicePixelRatio||1;
  CTX.clearRect(0,0,PAD.width/d,PAD.height/d);
  HAYFIRMA=false; const h=$('padHint'); if(h) h.style.display='';
}

/* ---------- 4 · cerrarla ---------- */
async function cierra(btn, fila, eleg, texto){
  const m=$('m');
  if(!HAYFIRMA){ m.className='msg on warn'; m.textContent='Falta que el huésped firme.'; return; }
  btn.disabled=true; const old=btn.textContent; btn.textContent='Apartando su cama…';
  m.className='msg on espera';
  m.textContent='Estamos apartándola en el sistema. No cierres la pantalla.';
  let r;
  try{
    r=await api({op:'vender', reservation_id:SEL.reservation_id, noches:fila.noches,
      alternativa:eleg.clave||eleg.tipo, canal:CANAL,
      vendedor:EMP, vendedor_nombre:NOMBRE,
      firma:PAD.toDataURL('image/png'), documento:texto});
  }catch(e){ r={ok:false,error:'Se cayó la conexión. Inténtalo otra vez.'}; }
  btn.disabled=false; btn.textContent=old;
  if(!r||!r.ok){
    m.className='msg on warn';
    m.textContent=(r&&r.error)||'No se pudo cerrar. Mándalo a recepción.';
    return;
  }
  pintaListo(r, eleg);
}
function pintaListo(r, eleg){
  PASO='listo';
  const mueve=r.mueve_cosas;
  $('wrap').innerHTML='<div class="card listo">'+
    '<div class="big">🧳</div>'+
    '<h2>'+esc(r.huesped||SEL.huesped)+' se queda</h2>'+
    '<p>Hasta el <b>'+dia(r.nueva_salida)+'</b> · '+esc(r.donde||'')+'<br>'+
      '<b style="font-size:19px">'+money(r.monto)+'</b> pendientes de pago</p>'+
    '<div class="decir"><b>Dile esto</b>'+
      '«Ya te dejé '+r.noches+(r.noches===1?' noche':' noches')+' más. Son '+money(r.monto)+
      ', y los pagas en recepción cuando bajes. Te acabo de mandar el correo con todo.»'+
      (mueve?'<br><br>«Deja tus cosas juntas, yo te las subo. Pasa por recepción por la llave nueva.»':'')+
    '</div>'+
    (r.correo&&r.correo.ok?'<p style="font-size:12.5px;color:var(--txt3)">✉️ Correo enviado a '+esc(r.correo.a)+'</p>'
      :'<p style="font-size:12.5px;color:#8f3d2a">✉️ No salió el correo. Dile que pase por recepción a que se lo manden.</p>')+
    (r.comision&&r.comision.comision>0?'<div class="bolsa">+'+money(r.comision.comision)+' a la bolsa de housekeeping de este mes.</div>':'')+
    '<button class="btn" onclick="otra()">Vender otra</button>'+
    '<button class="btn sec" onclick="atras()">Terminar</button>'+
  '</div>';
}
window.otra=function(){ SEL=null; DATOS=null; FILTRO=''; cargaCamas(); };

/* ---------- arranque ---------- */
const SUPERVISORES=['javi@casapepe.mx','hola.puebla@casapepe.mx','hola.cdmx@casapepe.mx',
  'housekeeping.cdmx@casapepe.mx','housekeeping.puebla@casapepe.mx'];
async function arranca(){
  const s=await sesionViva();
  if(!s){ cpVolverApp(); return; }
  const {data:link}=await sb.from('empleado_login')
    .select('employee_id,nombre_display,nombre_completo').eq('user_id',s.user.id).maybeSingle();
  if(!link){
    $('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>';
    return;
  }
  EMP=link.employee_id; NOMBRE=link.nombre_display||link.nombre_completo;
  /* El canal no lo elige el botón por el que entró: lo dice su puesto. Si lo
     decidiera el botón, una camarista que abriera la extensión desde la pestaña de
     Huéspedes perdería su comisión, y la comisión es de quien hace la tarea. */
  let suya=null, puesto='', area='';
  try{
    const {data:e}=await sb.from('v_empleados_publico').select('property_id,puesto,area').eq('id',EMP).maybeSingle();
    suya=e?.property_id||null; puesto=String(e?.puesto||''); area=String(e?.area||'');
  }catch(e){}
  PROP=CASAS.includes(suya)?suya:CASAS[0];
  if(/areas?\s*p[uú]blicas/i.test(puesto)) CANAL='areas_publicas';
  else if(/housekeeping|cuartos/i.test(area) || /camarista|limpieza|ama de llaves/i.test(puesto)) CANAL='housekeeping';
  else CANAL='recepcion';
  /* EL SELECTOR DE CIUDAD NO SE REPITE.
     Soy Pepe ya trae el suyo arriba —«Hola, Javi · CDMX»— y poner otro aquí
     dentro deja dos iguales en la misma pantalla diciendo lo mismo. Solo sale
     cuando esta página se abre suelta, fuera de la app. Javi, 7-oct. */
  if(SUELTA && SUPERVISORES.includes((s.user.email||'').toLowerCase())){
    const sel=$('sede'); sel.hidden=false; sel.value=PROP;
    sel.onchange=()=>{ PROP=sel.value; FILTRO=''; cargaCamas(); };
  }
  cargaCamas();
}
arranca();
