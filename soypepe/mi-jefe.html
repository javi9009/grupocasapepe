<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi jefe · Soy Pepe</title>
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(96px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.state{text-align:center;color:var(--muted);padding:24px}
.note{background:#fff7e6;border-left:3px solid var(--gold);border-radius:8px;padding:10px 12px;font-size:12.5px;color:#6b5320;line-height:1.45}
.note b{color:#5a4415}
.bloque{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soft);margin:18px 2px 2px}
.bloque .lead{display:block;text-transform:none;letter-spacing:0;font-weight:500;color:var(--muted);font-size:12.5px;margin-top:3px}
.q{border-top:1px solid var(--line);padding:14px 2px 10px}
.q:first-of-type{border-top:0}
.q .txt{font-size:14.5px;line-height:1.4;margin-bottom:10px}
.q .num{color:var(--muted);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.esc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.esc button{border:1.5px solid var(--line);background:#fffdf8;border-radius:10px;padding:11px 0;font-size:15px;font-weight:700;color:var(--soft);cursor:pointer}
.esc button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.polos{display:flex;justify-content:space-between;gap:10px;font-size:11.5px;color:var(--muted);margin-top:5px}
.polos span{max-width:46%}
.polos span:last-child{text-align:right}
textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;min-height:72px;resize:vertical}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + var(--safe-b));z-index:20}
.barra .in{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:12px}
.barra .cnt{font-size:12.5px;color:var(--muted);flex:1}
.benv{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:13px 22px;font-size:15px;font-weight:700;cursor:pointer}
.benv[disabled]{opacity:.45;cursor:default}
.msg{font-size:12.5px;font-weight:600;margin-top:6px;min-height:14px}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.gracias{text-align:center;padding:26px 10px}
.gracias .em{font-size:34px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
<script defer src="/cp-verpass.js"></script>
</head><body>
<script>if(new URLSearchParams(location.search).get('embed')==='1'){var _s=document.createElement('style');_s.textContent='header{display:none!important}body{background:#f4ecdd}.wrap{padding-top:12px!important}';document.documentElement.appendChild(_s);}</script>
<header><a href="./">← Soy Pepe</a><span class="ttl">Mi jefe · <b>Casa Pepe</b></span></header>

<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* títulos de cada bloque, con la bajada que pidió Javi en desempeño */
const BLOQUES={
  trato:       {t:'Cómo te trata', lead:''},
  escucha:     {t:'Cómo te escucha', lead:''},
  herramientas:{t:'Para poder trabajar', lead:''},
  desempeno:   {t:'Mi desempeño en Casa Pepe', lead:'Aquí están los indicadores que te pueden llevar al siguiente Pepe nivel.'},
  equipo:      {t:'El equipo', lead:''},
  abierta:     {t:'Lo que quieras contar', lead:'Las dos son opcionales. Se leen tal cual las escribas.'}
};

let ENC=null, VAL={}, TXT={};

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').style.display='none'; $('loginWrap').style.display=''; return; }
  await cargar();
}
async function doLogin(){
  const m=$('l_msg'); m.className='msg'; m.textContent='';
  const email=$('l_email').value.trim().toLowerCase(), pass=$('l_pass').value;
  if(!email||!pass){ m.className='msg err'; m.textContent='Escribe correo y contraseña.'; return; }
  $('l_btn').disabled=true; m.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){ m.className='msg err'; m.textContent='⚠ '+error.message; $('l_btn').disabled=false; return; }
  $('loginWrap').style.display='none'; $('wrap').style.display=''; await cargar();
}

async function cargar(){
  $('wrap').innerHTML='<div class="state">Cargando…</div>';
  const {data,error}=await sb.rpc('enc_mi_encuesta');
  if(error){ $('wrap').innerHTML='<div class="card"><div class="state">No se pudo cargar: '+esc(error.message)+'</div></div>'; return; }
  ENC=data||{hay:false};
  if(!ENC.hay){ sinEncuesta(); return; }
  pinta();
}

function sinEncuesta(){
  $('wrap').innerHTML=
   '<div class="card"><h1 class="t">Nada que contestar ahora</h1>'
  +'<div class="sub">Cuando toque valorar a tu jefe te va a aparecer aquí.</div>'
  +'<div class="note">Esta encuesta es <b>anónima</b>. Ni tu jefe ni RH pueden ver quién contestó qué: '
  +'las respuestas se guardan sueltas, sin tu nombre, y solo se publican en conjunto.</div></div>';
}

function pinta(){
  const ps=ENC.preguntas||[];
  let html=''
   +'<div class="card">'
   +'<h1 class="t">¿Cómo te trata '+esc(ENC.jefe||'tu jefe')+'?</h1>'
   +'<div class="sub">'+esc(ENC.jefe_rol||'')+(ENC.cierra?' · abierta hasta el '+esc(ENC.cierra):'')+'</div>'
   +'<div class="note"><b>Nadie va a saber que esto lo escribiste tú.</b> Tus respuestas se guardan sin tu nombre '
   +'y sin la hora, y solo se muestran sumadas con las de tus compañeros. Si el equipo es muy chico y no llegan '
   +'al menos 3 respuestas, no se enseña nada. Contesta con la verdad: para eso es.</div>'
   +'</div>';

  let bloqueActual=null, abierto=false;
  ps.forEach(function(p,i){
    if(p.bloque!==bloqueActual){
      if(abierto) html+='</div>';
      bloqueActual=p.bloque; abierto=true;
      const b=BLOQUES[p.bloque]||{t:p.bloque||'',lead:''};
      html+='<div class="bloque">'+esc(b.t)+(b.lead?'<span class="lead">'+esc(b.lead)+'</span>':'')+'</div><div class="card">';
    }
    html+='<div class="q" data-p="'+p.id+'"><div class="txt"><span class="num">'+(i+1)+'.</span>'+esc(p.pregunta)+'</div>';
    if(p.tipo==='texto'){
      html+='<textarea id="t'+p.id+'" placeholder="Escribe aquí si quieres"></textarea>';
    }else{
      html+='<div class="esc" id="e'+p.id+'">';
      for(let v=1;v<=5;v++) html+='<button type="button" data-p="'+p.id+'" data-v="'+v+'">'+v+'</button>';
      html+='</div><div class="polos"><span>1 · '+esc(p.bajo||'Nunca')+'</span><span>'+esc(p.alto||'Siempre')+' · 5</span></div>';
    }
    html+='</div>';
  });
  if(abierto) html+='</div>';

  $('wrap').innerHTML=html;

  document.querySelectorAll('.esc button').forEach(function(b){
    b.onclick=function(){
      const pid=b.dataset.p;
      VAL[pid]=parseInt(b.dataset.v,10);
      document.querySelectorAll('#e'+pid+' button').forEach(function(x){ x.classList.toggle('on', x===b); });
      contador();
    };
  });

  if(!document.getElementById('barra')){
    const bar=document.createElement('div');
    bar.className='barra'; bar.id='barra';
    bar.innerHTML='<div class="in"><div class="cnt" id="cnt"></div>'
      +'<button class="benv" id="benv" disabled>Enviar</button></div>'
      +'<div class="in"><div class="msg" id="msg"></div></div>';
    document.body.appendChild(bar);
    $('benv').onclick=enviar;
  }
  contador();
}

function escalas(){ return (ENC.preguntas||[]).filter(function(p){return p.tipo!=='texto';}); }
function contador(){
  const tot=escalas().length, hechas=escalas().filter(function(p){return VAL[p.id];}).length;
  $('cnt').textContent=hechas+' de '+tot+' contestadas';
  $('benv').disabled = hechas<tot;
}

async function enviar(){
  const b=$('benv'), m=$('msg');
  b.disabled=true; b.textContent='Enviando…'; m.className='msg'; m.textContent='';
  const payload=[];
  (ENC.preguntas||[]).forEach(function(p){
    if(p.tipo==='texto'){
      const el=document.getElementById('t'+p.id);
      const t=el?el.value.trim():'';
      if(t) payload.push({p:p.id, t:t});
    }else if(VAL[p.id]){
      payload.push({p:p.id, v:VAL[p.id]});
    }
  });
  const {data,error}=await sb.rpc('enc_responder',{p_ronda:ENC.ronda, p_respuestas:payload});
  if(error || !data || data.ok!==true){
    m.className='msg err';
    m.textContent='⚠ '+((data&&data.error)||(error&&error.message)||'No se pudo enviar');
    b.disabled=false; b.textContent='Enviar'; return;
  }
  const bar=document.getElementById('barra'); if(bar) bar.remove();
  $('wrap').innerHTML='<div class="card gracias"><div class="em">🙏</div>'
    +'<h1 class="t">Gracias</h1>'
    +'<div class="sub">Ya quedó. Nadie va a saber que fuiste tú.</div>'
    +'<div class="note" style="text-align:left;margin-top:14px">Lo que escribiste se junta con lo de tus compañeros. '
    +'Si algo de aquí hay que moverlo, se mueve — pero nunca sabiendo quién lo dijo.</div></div>';
  window.scrollTo(0,0);
}

boot();
</script>
</body></html>
