<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Los tanfos · Casa Pepe</title>
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input,textarea{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + var(--safe-b))}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:18px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:6px;line-height:1.6}
.grande{width:100%;border:none;border-radius:14px;background:#16130f;color:#f4ecdd;padding:17px;font-size:15.5px;font-weight:800;cursor:pointer;margin-bottom:12px}
.grande.sec{background:var(--bg3);color:var(--txt2)}
.grupo{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 7px}
label.cmp{display:block;font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em;margin:15px 0 6px}
input.txt,textarea.txt,select.txt{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:15px}
textarea.txt{min-height:70px;resize:vertical}
.foto{width:100%;padding:16px 12px;border:1px dashed var(--bd);border-radius:12px;background:#fff;font-size:13.5px}
.previa img{width:100%;border-radius:12px;margin-top:9px;display:block}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chips button.on{background:#16130f;color:#f4ecdd;border-color:#16130f}
.nota{background:#fff8ea;border:1px solid #e8d4a8;border-radius:13px;padding:12px 13px;color:#8a6212;font-size:12.5px;line-height:1.55;margin-top:10px}
.nota.fuerte{background:#fdecec;border-color:#e8b4b4;color:#8a2020}
.nota.bien{background:#eaf6f1;border-color:#b8ddcd;color:#14614a}
.ficha{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.ficha .n{font-size:14.5px;font-weight:800}
.ficha .s{font-size:11.5px;color:var(--txt3);margin-top:4px;line-height:1.55}
.ficha .et{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;margin-top:6px}
.et.c-custodia{background:var(--bg3);color:var(--txt2)}
.et.c-avisado{background:#eaf1f8;color:#1f4d78}
.et.c-reclamado{background:#fff8ea;color:#8a6212}
.et.c-entregado{background:#eaf6f1;color:#14614a}
.et.c-donado{background:#f3eefa;color:#4a3570}
.et.c-sin_dueno{background:#f1efe8;color:#6b665e}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:9px;align-items:center;z-index:30}
.barra .info{flex:1;font-size:12px;color:var(--txt3);line-height:1.4}
.barra button{border:none;border-radius:11px;padding:14px 18px;font-size:14.5px;font-weight:800;cursor:pointer}
.barra .g{background:var(--bg3);color:var(--txt2)}
.barra .c{background:#16130f;color:#f4ecdd}
.barra button[disabled]{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style><script src="/embed-child.js"></script>
<script>
function cpVolverApp(){
  try{ if(window.top!==window.self){ window.parent.postMessage({type:'cp-embed-home'}, location.origin); return; } }catch(e){}
  location.href='/soypepe/';
}
</script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
</head><body>

<div class="appbar">
  <button class="bk" id="atras" onclick="cpVolverApp()">‹</button>
  <span class="t">🎒 <b id="titulo">Los tanfos</b></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CDMX='45e69775-d877-4507-a9e1-a45bd3400dc5', PUEBLA='febfbef6-7fd1-4b45-84d9-13533e8dcb72';
let TT; function toast(m){ const t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),3200); }
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());

let USER=null, EMP=null, NOMBRE='', PROP=CDMX, FOTO=null;

// La recamarista no tiene que saber qué es "custodia de documentos". Elige qué
// cosa es y el sistema decide el protocolo: lo que lleva identidad, dinero o
// medicinas nunca se dona, y lo caro no caduca solo.
const CATS=[
  {c:'ropa',        n:'👕 Ropa',            v:'normal'},
  {c:'cosmeticos',  n:'🧴 Cosméticos',      v:'normal'},
  {c:'cargadores',  n:'🔌 Cables y cargadores', v:'normal'},
  {c:'libros',      n:'📚 Libros y papeles', v:'normal'},
  {c:'juguetes',    n:'🧸 Juguetes',        v:'normal'},
  {c:'gafas',       n:'🕶 Gafas',            v:'normal'},
  {c:'llaves',      n:'🔑 Llaves',          v:'alto'},
  {c:'electronica', n:'📱 Celular, laptop, cámara', v:'alto'},
  {c:'joyeria',     n:'💎 Joyas y relojes', v:'alto'},
  {c:'documentos',  n:'🪪 Pasaporte, INE, visas', v:'documento_o_dinero'},
  {c:'dinero',      n:'💳 Dinero o tarjetas', v:'documento_o_dinero'},
  {c:'medicinas',   n:'💊 Medicinas',       v:'documento_o_dinero'},
  {c:'otros',       n:'📦 Otra cosa',       v:'normal'},
];
const VALORES=[
  {v:'normal', n:'Normal', ex:'Se guarda en la bolsita de los tanfos. Si nadie lo reclama en 7 días, se dona.'},
  {v:'alto',   n:'De valor', ex:'Lo custodia la jefa de front, no la bolsita. No se dona nunca: ella decide.'},
  {v:'documento_o_dinero', n:'Documento o dinero', ex:'Entrégalo HOY en recepción a la jefa de front. No se dona ni se tira jamás.'},
];
const DONDES=[
  {d:'habitacion', n:'🛏 Una habitación', eq:'ama de llaves'},
  {d:'publico',    n:'🏛 Un espacio público', eq:'front'},
  {d:'terraza',    n:'☀️ La terraza', eq:'terraza'},
];
const DUENOS=[
  {k:'presente', n:'Sí, y está aquí — se lo doy en mano'},
  {k:'ido',      n:'Sí, pero ya se fue'},
  {k:'nose',     n:'No sé de quién es'},
];
const ETIQ={en_custodia:'En custodia',avisado:'Avisado al huésped',reclamado:'Lo reclamó',
  entregado:'Entregado',donado:'Donado',desechado:'Desechado',sin_dueno:'Sin dueño'};

let F={cat:'', valor:'', donde:'', hab:'', ubi:'', desc:'', dueno:'', huesped:null};

async function arranca(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').innerHTML='<div class="ph">Entra con tu cuenta desde Soy Pepe para usar los tanfos.</div>'; return; }
  USER=session.user;
  const {data:link}=await sb.from('empleado_login')
    .select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(!link){ $('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>'; return; }
  EMP=link.employee_id; NOMBRE=link.nombre_display||link.nombre_completo||'';
  try{
    const {data:e}=await sb.from('v_empleados_publico').select('property_id').eq('id',EMP).maybeSingle();
    if(e?.property_id===CDMX||e?.property_id===PUEBLA) PROP=e.property_id;
  }catch(e){}
  if(new URLSearchParams(location.search).get('alta')==='1') return formulario();
  lista();
}

/* ─────────────────────────── lo que hay en casa ─────────────────────────── */
async function lista(){
  $('titulo').textContent='Los tanfos'; $('atras').onclick=cpVolverApp;
  $('wrap').innerHTML='<div class="ph">Buscando…</div>';
  const {data,error}=await sb.from('v_lf_objetos')
    .select('id,folio,descripcion,estado,valor,custodia,puede_donarse,motivo,encontrado_el,encontrado_por_nombre,habitacion,huesped_nombre,revisar_el')
    .eq('property_id',PROP).order('encontrado_at',{ascending:false}).limit(60);
  if(error){ $('wrap').innerHTML='<div class="ph">No se pudo leer la lista.<br><span style="font-size:12px">'+esc(error.message)+'</span></div>'; return; }
  const l=data||[];
  const abiertos=l.filter(o=>!['entregado','donado','desechado'].includes(o.estado));
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">¿Encontraste algo de un huésped?</div>'+
    '<div class="s">Sácale una foto y busca al huésped. La excelencia es poder decirle cuanto antes '+
    'que se le quedó algo. Si no sabes de quién es, déjalo marcado como que no lo sabes.</div></div>'+
    '<button class="grande" id="bNuevo">📷 Encontré algo</button>'+
    (abiertos.length
      ? '<div class="grupo">En casa ahora ('+abiertos.length+')</div>'+abiertos.map(ficha).join('')
      : '<div class="ph">Ahora mismo no hay ningún niño perdido en casa.</div>')+
    (l.length>abiertos.length
      ? '<div class="grupo">Ya cerrados</div>'+l.filter(o=>!abiertos.includes(o)).slice(0,12).map(ficha).join('')
      : '');
  $('bNuevo').onclick=formulario;
}
function ficha(o){
  return '<div class="ficha"><div class="n">'+esc(o.descripcion)+'</div>'+
    '<div class="s">'+esc(o.folio||'')+' · '+esc(o.encontrado_el||'')+
      (o.habitacion?' · hab. '+esc(o.habitacion):'')+
      (o.encontrado_por_nombre?' · lo encontró '+esc(o.encontrado_por_nombre):'')+
      (o.huesped_nombre?'<br>Huésped: '+esc(o.huesped_nombre):'')+
      (o.custodia==='front'?'<br><b>Lo custodia la jefa de front</b> · '+esc(o.motivo):'')+
    '</div>'+
    '<span class="et c-'+esc(o.estado)+'">'+esc(ETIQ[o.estado]||o.estado)+'</span></div>';
}

/* ─────────────────────────── el alta ─────────────────────────── */
function formulario(){
  $('titulo').textContent='Encontré algo'; $('atras').onclick=lista;
  F={cat:'',valor:'',donde:'',hab:'',ubi:'',desc:'',dueno:'',huesped:null}; FOTO=null;
  $('wrap').innerHTML=
    '<label class="cmp">1. La foto</label>'+
    '<input class="foto" id="foto" type="file" accept="image/*" capture="environment">'+
    '<div class="previa" id="previa"></div>'+

    '<label class="cmp">2. ¿Qué es?</label>'+
    '<div class="chips" id="cCat">'+CATS.map(c=>
      '<button data-c="'+c.c+'">'+esc(c.n)+'</button>').join('')+'</div>'+

    '<label class="cmp">3. Descríbelo</label>'+
    '<textarea class="txt" id="desc" placeholder="Sudadera gris con capucha, talla M, marca Zara"></textarea>'+

    '<div id="zValor" hidden><label class="cmp">4. Cómo hay que tratarlo</label>'+
    '<div class="chips" id="cVal">'+VALORES.map(v=>
      '<button data-v="'+v.v+'">'+esc(v.n)+'</button>').join('')+'</div>'+
    '<div id="exValor"></div></div>'+

    '<label class="cmp">5. ¿Dónde apareció?</label>'+
    '<div class="chips" id="cDonde">'+DONDES.map(d=>
      '<button data-d="'+d.d+'">'+esc(d.n)+'</button>').join('')+'</div>'+
    '<div id="zDonde"></div>'+

    '<div id="zDueno" hidden><label class="cmp">6. ¿Sabes de quién es?</label>'+
    '<div class="chips" id="cDueno">'+DUENOS.map(x=>
      '<button data-k="'+x.k+'">'+esc(x.n)+'</button>').join('')+'</div>'+
    '<div id="zHuesped"></div></div>'+

    '<div class="barra"><span class="info" id="pie">Con la foto y la descripción ya basta.</span>'+
    '<button class="g" id="bCanc">Dejarlo</button>'+
    '<button class="c" id="bOk">Guardar</button></div>';

  $('foto').onchange=e=>{
    const f=e.target.files&&e.target.files[0]; if(!f) return;
    FOTO=f; $('previa').innerHTML='<img src="'+URL.createObjectURL(f)+'" alt="">';
  };
  chips('cCat','c',v=>{
    F.cat=v;
    const c=CATS.find(x=>x.c===v);
    // Se propone el nivel según la categoría, pero se puede cambiar: quien lo
    // tiene en la mano sabe si la cartera lleva o no la INE dentro.
    F.valor=c?c.v:'normal';
    $('zValor').hidden=false; marca('cVal','v',F.valor); explicaValor();
  });
  chips('cVal','v',v=>{ F.valor=v; explicaValor(); });
  chips('cDonde','d',v=>{ F.donde=v; pintaDonde(); });
  chips('cDueno','k',v=>{ F.dueno=v; F.huesped=null; pintaHuesped(); });
  $('bCanc').onclick=lista;
  $('bOk').onclick=guardar;
}
function chips(caja,attr,fn){
  const z=$(caja); if(!z) return;
  z.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    z.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); fn(b.dataset[attr]);
  });
}
function marca(caja,attr,val){
  const z=$(caja); if(!z) return;
  z.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===val));
}
function explicaValor(){
  const v=VALORES.find(x=>x.v===F.valor); if(!v) return;
  $('exValor').innerHTML='<div class="nota'+(F.valor==='documento_o_dinero'?' fuerte':(F.valor==='normal'?' bien':''))+'">'+esc(v.ex)+'</div>';
}
function pintaDonde(){
  const z=$('zDonde');
  z.innerHTML = F.donde==='habitacion'
    ? '<label class="cmp">¿Qué habitación?</label>'+
      '<input class="txt" id="hab" inputmode="numeric" placeholder="213">'+
      '<label class="cmp">¿Dónde exactamente?</label>'+
      '<input class="txt" id="ubi" placeholder="En el cajón de la mesita">'
    : '<label class="cmp">¿Dónde exactamente?</label>'+
      '<input class="txt" id="ubi" placeholder="'+(F.donde==='terraza'?'Bajo la mesa del fondo':'En el sofá del lobby')+'">';
  $('zDueno').hidden=false;
  if($('hab')) $('hab').oninput=e=>F.hab=e.target.value.trim();
  if($('ubi')) $('ubi').oninput=e=>F.ubi=e.target.value.trim();
  // Si apareció en una habitación, lo normal es que se sepa de quién era.
  if(F.donde==='habitacion' && !F.dueno){ F.dueno='ido'; marca('cDueno','k','ido'); pintaHuesped(); }
}
function pintaHuesped(){
  const z=$('zHuesped');
  if(F.dueno==='ido'){
    z.innerHTML='<button class="grande sec" id="bBusca">🔎 Buscar al huésped en Cloudbeds</button>'+
      '<div id="resHu"></div>';
    $('bBusca').onclick=buscaHuesped;
  }else if(F.dueno==='presente'){
    z.innerHTML='<div class="nota bien">Dáselo y ya. Lo registramos igual, marcado como entregado en mano, '+
      'para que quede el rastro de que apareció y volvió a su dueño.</div>'+
      '<label class="cmp">¿Cómo se llama? (si lo sabes)</label>'+
      '<input class="txt" id="hnom" placeholder="Nombre del huésped">';
    if($('hnom')) $('hnom').oninput=e=>F.huesped={nombre:e.target.value.trim(),email:'',reserva_id:''};
  }else if(F.dueno==='nose'){
    z.innerHTML='<div class="nota">Queda en custodia como «no sé quién es este niño». Si alguien lo reclama, '+
      'aparece aquí; si no, a los 7 días la jefa de front decide.</div>';
  }else{ z.innerHTML=''; }
}

async function buscaHuesped(){
  if(F.donde==='habitacion' && !F.hab) return toast('Pon primero la habitación.');
  $('resHu').innerHTML='<div class="ph">Buscando en Cloudbeds…</div>';
  const {data:{session}}=await sb.auth.getSession();
  const r=await fetch(SB_URL+'/functions/v1/tanfos',{
    method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(session?.access_token||'')},
    body:JSON.stringify({accion:'buscar',prop:PROP===PUEBLA?'puebla':'cdmx',habitacion:F.hab,fecha:hoy()})
  }).then(x=>x.json()).catch(()=>({ok:false,error:'sin conexión'}));
  if(!r.ok||!r.encontrado){
    $('resHu').innerHTML='<div class="nota">No dimos con la reserva'+(r.motivo?' ('+esc(r.motivo)+')':'')+
      '. Guárdalo igual: la jefa de front lo puede ligar después.</div>';
    F.huesped=null; return;
  }
  F.huesped={nombre:r.nombre,email:r.email,reserva_id:r.reserva_id,salida:r.salida};
  $('resHu').innerHTML='<div class="nota '+(r.email?'bien':'')+'"><b>'+esc(r.nombre||'sin nombre')+'</b><br>'+
    (r.email?esc(r.email)+'<br>Al guardar le mandamos el correo con la foto.':'No tiene correo en la reserva: no se le puede avisar solo.')+
    (r.salida?'<br>Salió el '+esc(r.salida):'')+
    (r.varias?'<br>⚠ Había más de una reserva en esa habitación esas noches. Si no es esta, dile a la jefa de front.':'')+
    '</div>';
}

/* ─────────────────────────── guardar ─────────────────────────── */
async function guardar(){
  const desc=($('desc')?.value||'').trim();
  if(!desc) return toast('Descríbelo, aunque sea en cuatro palabras.');
  if(!F.donde) return toast('Dinos dónde apareció.');
  if(F.donde==='habitacion' && !F.hab) return toast('Falta la habitación.');
  $('bOk').disabled=true; toast('Guardando…');

  let foto_path=null;
  if(FOTO){
    const ext=(FOTO.name.split('.').pop()||'jpg').toLowerCase().slice(0,4);
    const ruta=(PROP===PUEBLA?'puebla':'cdmx')+'/'+hoy().slice(0,7)+'/'+crypto.randomUUID()+'.'+ext;
    const {error}=await sb.storage.from('lost-found').upload(ruta,FOTO,{upsert:false});
    if(error){ toast('No se pudo subir la foto: '+error.message); $('bOk').disabled=false; return; }
    foto_path=ruta;
  }

  const eq=(DONDES.find(d=>d.d===F.donde)||{}).eq||null;
  const enMano=F.dueno==='presente';
  const fila={
    property_id:PROP, descripcion:desc, categoria:F.cat||'otros', valor:F.valor||'normal',
    foto_path, donde:F.donde, ubicacion_texto:($('ubi')?.value||'').trim()||null,
    encontrado_por:EMP, encontrado_por_nombre:NOMBRE, equipo:eq,
    habitacion:F.hab||null,
    huesped_identificado:!!(F.huesped&&(F.huesped.nombre||F.huesped.email)),
    huesped_nombre:F.huesped?.nombre||null, huesped_email:F.huesped?.email||null,
    reserva_id:F.huesped?.reserva_id||null, fecha_salida:F.huesped?.salida||null,
    entregado_en_mano:enMano,
    // En mano se cierra solo: ya está con su dueño, no hay nada que custodiar.
    estado: enMano?'entregado':(F.dueno==='nose'?'sin_dueno':'en_custodia'),
    cerrado_at: enMano?new Date().toISOString():null,
    cerrado_por: enMano?EMP:null, cerrado_por_nombre: enMano?NOMBRE:null,
    cerrado_nota: enMano?'Se lo dio en mano quien lo encontró':null,
  };
  const {data,error}=await sb.from('lf_objetos').insert(fila).select('id,folio,token').single();
  if(error){ toast('No se pudo guardar: '+error.message); $('bOk').disabled=false; return; }
  try{
    await sb.from('lf_eventos').insert({objeto_id:data.id,que:enMano?'entregado_en_mano':'alta',
      detalle:{donde:F.donde,valor:fila.valor},quien:EMP,quien_nombre:NOMBRE});
  }catch(e){}

  // Si hay correo del huésped, se le avisa ya. No esperamos a que alguien se
  // acuerde: la excelencia es decírselo lo antes posible.
  let aviso='';
  if(!enMano && fila.huesped_email){
    const {data:{session}}=await sb.auth.getSession();
    const r=await fetch(SB_URL+'/functions/v1/tanfos',{
      method:'POST',
      headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(session?.access_token||'')},
      body:JSON.stringify({accion:'avisar',objeto_id:data.id})
    }).then(x=>x.json()).catch(()=>({ok:false}));
    aviso=r.ok?' Le avisamos a '+fila.huesped_email+'.':' No se pudo mandar el correo; la jefa de front lo verá.';
  }
  const dónde = fila.valor==='documento_o_dinero'
    ? ' Llévalo HOY a recepción: lo custodia la jefa de front.'
    : fila.valor==='alto' ? ' Llévalo a recepción, lo custodia la jefa de front.'
    : enMano ? '' : ' Guárdalo en la bolsita con su nombre en recepción.';
  toast(data.folio+' guardado.'+dónde+aviso);
  setTimeout(lista,2600);
}

arranca();
</script>
</body></html>
