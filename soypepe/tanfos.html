<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Los Olvidados · Casa Pepe</title>
<!-- El archivo sigue llamándose tanfos.html: la ruta ya está en los permisos,
     en el menú y en los avisos. Lo que ve el equipo es «Los Olvidados». -->
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input,textarea{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(110px + var(--safe-b))}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:18px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:6px;line-height:1.6}
.grande{width:100%;border:none;border-radius:14px;background:#16130f;color:#f4ecdd;padding:17px;font-size:15.5px;font-weight:800;cursor:pointer;margin-bottom:12px}
.grande.sec{background:var(--bg3);color:var(--txt2)}
.grupo{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 7px}
label.cmp{display:block;font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.03em;margin:15px 0 6px}
input.txt,textarea.txt,select.txt{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:15px;appearance:none;-webkit-appearance:none}
select.txt{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' fill='none' stroke='%238e8c85' stroke-width='2'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:34px}
textarea.txt{min-height:70px;resize:vertical}
.dosf{display:flex;gap:8px}.dosf>*{flex:1}
.mini{font-size:11.5px;color:var(--txt3);margin-top:6px;line-height:1.5}
.fotob{display:flex;gap:8px}
.fotob button{flex:1;border:1px dashed var(--bd);background:#fff;border-radius:13px;padding:17px 10px;
  font-size:13.5px;font-weight:700;color:var(--txt2);cursor:pointer;line-height:1.45}
.fotob button b{display:block;font-size:22px;font-weight:400;margin-bottom:4px}
.previa img{width:100%;border-radius:12px;margin-top:9px;display:block}
.previa .quitar{display:block;width:100%;margin-top:7px;border:none;background:none;color:var(--txt3);
  font-size:12.5px;text-decoration:underline;cursor:pointer;padding:5px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips button{border:1px solid var(--bd);background:#fff;border-radius:99px;padding:9px 13px;font-size:13.5px;font-weight:700;color:var(--txt2);cursor:pointer}
.chips button.on{background:#16130f;color:#f4ecdd;border-color:#16130f}
.nota{background:#fff8ea;border:1px solid #e8d4a8;border-radius:13px;padding:12px 13px;color:#8a6212;font-size:12.5px;line-height:1.55;margin-top:10px}
.nota.fuerte{background:#fdecec;border-color:#e8b4b4;color:#8a2020}
.nota.bien{background:#eaf6f1;border-color:#b8ddcd;color:#14614a}
.ficha{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:12px 13px;margin-bottom:9px;box-shadow:var(--shadow)}
.ficha .n{font-size:14.5px;font-weight:800}
.ficha .s{font-size:11.5px;color:var(--txt3);margin-top:4px;line-height:1.55}
.ficha .et{display:inline-block;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 7px;margin-top:6px}
.et.c-custodia{background:var(--bg3);color:var(--txt2)}
.et.c-avisado{background:#eaf1f8;color:#1f4d78}
.et.c-reclamado{background:#fff8ea;color:#8a6212}
.et.c-entregado{background:#eaf6f1;color:#14614a}
.et.c-donado{background:#f3eefa;color:#4a3570}
.et.c-sin_dueno{background:#f1efe8;color:#6b665e}
.vprev{width:100%;height:58vh;border:1px solid var(--bd);border-radius:14px;background:#fff;display:block}
.vcan{background:#fff;border:1px solid var(--bd);border-radius:13px;padding:12px 13px;font-size:13px;
  line-height:1.6;margin-bottom:10px}
.vcan div{display:flex;gap:8px;align-items:baseline}
.vcan .i{width:20px;flex:0 0 20px}
.vcan b{color:var(--txt)}
.vcan .no{color:var(--txt3)}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:9px;align-items:center;z-index:30}
.barra .info{flex:1;font-size:12px;color:var(--txt3);line-height:1.4}
.barra button{border:none;border-radius:11px;padding:14px 18px;font-size:14.5px;font-weight:800;cursor:pointer}
.barra .g{background:var(--bg3);color:var(--txt2)}
.barra .c{background:#16130f;color:#f4ecdd}
.barra button[disabled]{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style><script src="/embed-child.js"></script>
<script>
function cpVolverApp(){
  try{ if(window.top!==window.self){ window.parent.postMessage({type:'cp-embed-home'}, location.origin); return; } }catch(e){}
  location.href='/soypepe/';
}
</script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
</head><body>

<div class="appbar">
  <button class="bk" id="atras" onclick="cpVolverApp()">‹</button>
  <span class="t">🧳 <b id="titulo">Los Olvidados</b></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<input type="file" id="fCam" accept="image/*" capture="environment" hidden>
<input type="file" id="fGal" accept="image/*" hidden>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CDMX='45e69775-d877-4507-a9e1-a45bd3400dc5', PUEBLA='febfbef6-7fd1-4b45-84d9-13533e8dcb72';
let TT; function toast(m){ const t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),3400); }
const hoy=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
async function tok(){ const {data:{session}}=await sb.auth.getSession(); return session?.access_token||''; }
async function fn(body){
  return await fetch(SB_URL+'/functions/v1/tanfos',{method:'POST',
    headers:{'Content-Type':'application/json',apikey:SB_KEY,Authorization:'Bearer '+(await tok())},
    body:JSON.stringify(body)}).then(x=>x.json()).catch(()=>({ok:false,error:'sin conexión'}));
}

let USER=null, EMP=null, NOMBRE='', PROP=CDMX, FOTO=null, AREAS=[];

// La recamarista no tiene que saber qué es "custodia de documentos". Elige qué
// cosa es y el sistema decide el protocolo: lo que lleva identidad, dinero o
// medicinas nunca se dona, y lo caro no caduca solo.
const CATS=[
  {c:'ropa',        n:'👕 Ropa',            v:'normal'},
  {c:'cosmeticos',  n:'🧴 Cosméticos',      v:'normal'},
  {c:'cargadores',  n:'🔌 Cables y cargadores', v:'normal'},
  {c:'libros',      n:'📚 Libros y papeles', v:'normal'},
  {c:'juguetes',    n:'🧸 Juguetes',        v:'normal'},
  {c:'gafas',       n:'🕶 Gafas',            v:'normal'},
  {c:'llaves',      n:'🔑 Llaves',          v:'alto'},
  {c:'electronica', n:'📱 Celular, laptop, cámara', v:'alto'},
  {c:'joyeria',     n:'💎 Joyas y relojes', v:'alto'},
  {c:'documentos',  n:'🪪 Pasaporte, INE, visas', v:'documento_o_dinero'},
  {c:'dinero',      n:'💳 Dinero o tarjetas', v:'documento_o_dinero'},
  {c:'medicinas',   n:'💊 Medicinas',       v:'documento_o_dinero'},
  {c:'otros',       n:'📦 Otra cosa',       v:'normal'},
];
const VALORES=[
  {v:'normal', n:'Normal', ex:'Se guarda en su bolsita. Si nadie lo reclama en 7 días, se dona.'},
  {v:'alto',   n:'De valor', ex:'Lo custodia la jefa de front. No se dona nunca: ella decide.'},
  {v:'documento_o_dinero', n:'Documento o dinero', ex:'Entrégalo HOY en recepción a la jefa de front. No se dona ni se tira jamás.'},
];
const DONDES=[
  {d:'habitacion', n:'🛏 Una habitación', eq:'ama de llaves'},
  {d:'publico',    n:'🏛 Un espacio público', eq:'front'},
  {d:'terraza',    n:'☀️ La terraza', eq:'terraza'},
];
const ETIQ={en_custodia:'En custodia',avisado:'Avisado al huésped',reclamado:'Lo reclamó',
  entregado:'Entregado',donado:'Donado',desechado:'Desechado',sin_dueno:'Sin dueño'};

// modo: '' sin decidir · 'auto' el huésped que salió de ahí ese día
//       'presente' se lo dio en mano · 'nose' no se sabe de quién es
let F={cat:'',valor:'',donde:'',cuarto:'',cama:'',area:'',fecha:'',ubi:'',desc:'',modo:'',huesped:null};

async function arranca(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').innerHTML='<div class="ph">Entra con tu cuenta desde Soy Pepe para usar Los Olvidados.</div>'; return; }
  USER=session.user;
  const {data:link}=await sb.from('empleado_login')
    .select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(!link){ $('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>'; return; }
  EMP=link.employee_id; NOMBRE=link.nombre_display||link.nombre_completo||'';
  try{
    const {data:e}=await sb.from('v_empleados_publico').select('property_id').eq('id',EMP).maybeSingle();
    if(e?.property_id===CDMX||e?.property_id===PUEBLA) PROP=e.property_id;
  }catch(e){}
  cargaAreas();
  if(new URLSearchParams(location.search).get('alta')==='1') return formulario();
  lista();
}

// Los cuartos reales, para no teclear números a mano. Un dormitorio NO identifica
// a nadie -son seis u ocho huéspedes distintos-; la cama sí, y por eso solo las
// camas y las privadas tienen cloudbeds_room_id.
async function cargaAreas(){
  if(AREAS.length) return AREAS;
  const {data}=await sb.from('hk_areas')
    .select('id,codigo,nombre,tipo,piso,parent_id,cloudbeds_room_id')
    .eq('property_id',PROP).eq('activo',true).in('tipo',['privada','dorm','cama'])
    .order('codigo').limit(1000);
  AREAS=data||[];
  return AREAS;
}

/* ─────────────────────────── lo que hay en casa ─────────────────────────── */
async function lista(){
  $('titulo').textContent='Los Olvidados'; $('atras').onclick=cpVolverApp;
  $('wrap').innerHTML='<div class="ph">Buscando…</div>';
  const {data,error}=await sb.from('v_lf_objetos')
    .select('id,folio,descripcion,estado,valor,custodia,puede_donarse,motivo,encontrado_el,encontrado_por_nombre,habitacion,huesped_nombre,revisar_el')
    .eq('property_id',PROP).order('encontrado_at',{ascending:false}).limit(60);
  if(error){ $('wrap').innerHTML='<div class="ph">No se pudo leer la lista.<br><span style="font-size:12px">'+esc(error.message)+'</span></div>'; return; }
  const l=data||[];
  const abiertos=l.filter(o=>!['entregado','donado','desechado'].includes(o.estado));
  const cerrados=l.filter(o=>['entregado','donado','desechado'].includes(o.estado)).slice(0,12);
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">¿Encontraste algo de un huésped?</div>'+
    '<div class="s">Sácale una foto y el sistema busca al huésped. La excelencia es poder decirle '+
    'cuanto antes que se le quedó algo. Si no sabes de quién es, déjalo marcado como que no lo sabes.</div></div>'+
    '<button class="grande" id="bNuevo">📷 Encontré algo</button>'+
    (abiertos.length
      ? '<div class="grupo">En casa ahora ('+abiertos.length+')</div>'+abiertos.map(ficha).join('')
      : '<div class="ph">Ahora mismo no hay nada olvidado en casa.</div>')+
    (cerrados.length?'<div class="grupo">Ya cerrados</div>'+cerrados.map(ficha).join(''):'');
  $('bNuevo').onclick=formulario;
}
function ficha(o){
  return '<div class="ficha"><div class="n">'+esc(o.descripcion)+'</div>'+
    '<div class="s">'+esc(o.folio||'')+' · '+esc(o.encontrado_el||'')+
      (o.habitacion?' · '+esc(o.habitacion):'')+
      (o.encontrado_por_nombre?' · lo encontró '+esc(o.encontrado_por_nombre):'')+
      (o.huesped_nombre?'<br>Huésped: '+esc(o.huesped_nombre):'')+
      (o.custodia==='front'?'<br><b>Lo custodia la jefa de front</b> · '+esc(o.motivo):'')+
    '</div>'+
    '<span class="et c-'+esc(o.estado)+'">'+esc(ETIQ[o.estado]||o.estado)+'</span></div>';
}

/* ─────────────────────────── el alta ─────────────────────────── */
function formulario(){
  $('titulo').textContent='Encontré algo'; $('atras').onclick=lista;
  F={cat:'',valor:'',donde:'',cuarto:'',cama:'',area:'',fecha:hoy(),ubi:'',desc:'',modo:'',huesped:null};
  FOTO=null;
  $('wrap').innerHTML=
    '<label class="cmp">1. La foto</label>'+
    // Dos botones y no uno: en el teléfono la cámara y la galería no son lo
    // mismo, y el selector del sistema obliga a elegir cada vez.
    '<div class="fotob">'+
      '<button id="bCam"><b>📷</b>Abrir cámara</button>'+
      '<button id="bGal"><b>🖼</b>Subir una foto</button>'+
    '</div>'+
    '<div class="previa" id="previa"></div>'+

    '<label class="cmp">2. ¿Qué es?</label>'+
    '<div class="chips" id="cCat">'+CATS.map(c=>
      '<button data-c="'+c.c+'">'+esc(c.n)+'</button>').join('')+'</div>'+

    '<label class="cmp">3. Descríbelo</label>'+
    '<textarea class="txt" id="desc" placeholder="Sudadera gris con capucha, talla M, marca Zara"></textarea>'+

    '<div id="zValor" hidden><label class="cmp">4. Cómo hay que tratarlo</label>'+
    '<div class="chips" id="cVal">'+VALORES.map(v=>
      '<button data-v="'+v.v+'">'+esc(v.n)+'</button>').join('')+'</div>'+
    '<div id="exValor"></div></div>'+

    '<label class="cmp">5. ¿Dónde apareció?</label>'+
    '<div class="chips" id="cDonde">'+DONDES.map(d=>
      '<button data-d="'+d.d+'">'+esc(d.n)+'</button>').join('')+'</div>'+
    '<div id="zDonde"></div>'+
    '<div id="zHuesped"></div>'+

    '<div class="barra"><span class="info" id="pie">Con la foto y la descripción ya basta.</span>'+
    '<button class="g" id="bCanc">Dejarlo</button>'+
    '<button class="c" id="bOk">Guardar</button></div>';

  const pon=f=>{ FOTO=f;
    $('previa').innerHTML='<img src="'+URL.createObjectURL(f)+'" alt="">'+
      '<button class="quitar" id="bQuita">quitar la foto</button>';
    $('bQuita').onclick=()=>{ FOTO=null; $('previa').innerHTML=''; };
  };
  $('fCam').onchange=e=>{ const f=e.target.files?.[0]; if(f) pon(f); e.target.value=''; };
  $('fGal').onchange=e=>{ const f=e.target.files?.[0]; if(f) pon(f); e.target.value=''; };
  $('bCam').onclick=()=>$('fCam').click();
  $('bGal').onclick=()=>$('fGal').click();

  chips('cCat','c',v=>{
    F.cat=v;
    const c=CATS.find(x=>x.c===v);
    // Se propone el nivel según la categoría, pero se puede cambiar: quien lo
    // tiene en la mano sabe si la cartera lleva o no la INE dentro.
    F.valor=c?c.v:'normal';
    $('zValor').hidden=false; marca('cVal','v',F.valor); explicaValor();
  });
  chips('cVal','v',v=>{ F.valor=v; explicaValor(); });
  chips('cDonde','d',v=>{ F.donde=v; pintaDonde(); });
  $('bCanc').onclick=lista;
  $('bOk').onclick=guardar;
}
function chips(caja,attr,fn2){
  const z=$(caja); if(!z) return;
  z.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    z.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on'); fn2(b.dataset[attr]);
  });
}
function marca(caja,attr,val){
  const z=$(caja); if(!z) return;
  z.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset[attr]===val));
}
function explicaValor(){
  const v=VALORES.find(x=>x.v===F.valor); if(!v) return;
  $('exValor').innerHTML='<div class="nota'+(F.valor==='documento_o_dinero'?' fuerte':(F.valor==='normal'?' bien':''))+'">'+esc(v.ex)+'</div>';
}

function pintaDonde(){
  const z=$('zDonde');
  if(F.donde!=='habitacion'){
    z.innerHTML='<label class="cmp">6. ¿Dónde exactamente?</label>'+
      '<input class="txt" id="ubi" placeholder="'+(F.donde==='terraza'?'Bajo la mesa del fondo':'En el sofá del lobby')+'">';
    $('ubi').oninput=e=>F.ubi=e.target.value.trim();
    // En un espacio público no hay cuarto que cruzar: o lo tiene delante su
    // dueño, o no se sabe de quién es.
    F.modo='nose'; F.area=''; F.huesped=null;
    pintaHuesped(
      '<label class="cmp">7. ¿De quién es?</label>'+
      '<div class="chips" id="cModo">'+
        '<button data-k="presente">Se lo di en mano</button>'+
        '<button data-k="nose" class="on">No sé de quién es</button>'+
      '</div><div id="zModo"></div>');
    chips('cModo','k',v=>{ F.modo=v; F.huesped=null; pintaModo(); });
    pintaModo();
    return;
  }

  const cuartos=AREAS.filter(a=>a.tipo==='privada'||a.tipo==='dorm');
  z.innerHTML=
    '<label class="cmp">6. ¿En qué cuarto y de qué día?</label>'+
    '<select class="txt" id="selCuarto"><option value="">Elige el cuarto…</option>'+
      cuartos.map(a=>'<option value="'+esc(a.codigo)+'">'+esc(a.nombre||a.codigo)+'</option>').join('')+
    '</select>'+
    '<div id="zCama"></div>'+
    '<input class="txt" id="fecha" type="date" style="margin-top:8px" value="'+esc(F.fecha)+'" max="'+esc(hoy())+'">'+
    '<div class="mini">El día que se fue el huésped. Si lo encontraste hoy limpiando, deja hoy.</div>'+
    '<label class="cmp">¿Dónde exactamente?</label>'+
    '<input class="txt" id="ubi" placeholder="En el cajón de la mesita">';
  $('ubi').oninput=e=>F.ubi=e.target.value.trim();
  $('fecha').onchange=e=>{ F.fecha=e.target.value||hoy(); resuelve(); };
  $('selCuarto').onchange=e=>{
    F.cuarto=e.target.value; F.cama=''; F.huesped=null; F.modo='';
    const a=AREAS.find(x=>x.codigo===F.cuarto);
    const camas=AREAS.filter(x=>x.parent_id===a?.id&&x.tipo==='cama');
    $('zCama').innerHTML = camas.length
      ? '<select class="txt" id="selCama" style="margin-top:8px"><option value="">¿Qué cama?…</option>'+
        camas.map(c=>'<option value="'+esc(c.codigo)+'">'+esc(c.nombre||c.codigo)+'</option>').join('')+
        '</select>'
      : '';
    if(camas.length){
      $('selCama').onchange=ev=>{ F.cama=ev.target.value; resuelve(); };
      // Un dormitorio son seis u ocho personas distintas. Sin la cama no se
      // puede decir de quién era, y mandarle el correo al equivocado es peor
      // que no mandarlo.
      pintaHuesped('<div class="nota">Es un dormitorio: dime la cama y te digo de quién era.</div>');
    }else{
      resuelve();
    }
  };
  pintaHuesped('<div class="nota">Elige el cuarto y te digo quién dormía ahí.</div>');
}
function pintaHuesped(html){ $('zHuesped').innerHTML=html||''; }

function pintaModo(){
  const z=$('zModo'); if(!z) return;
  if(F.modo==='auto'){ z.innerHTML=''; return; }
  if(F.modo==='presente'){
    const nom=F.huesped?.nombre||'';
    z.innerHTML='<div class="nota bien">Dáselo y ya. Lo registramos igual, cerrado como entregado en mano, '+
      'para que quede el rastro de que apareció y volvió a su dueño.</div>'+
      '<label class="cmp">¿Cómo se llama? (si lo sabes)</label>'+
      '<input class="txt" id="hnom" placeholder="Nombre del huésped" value="'+esc(nom)+'">';
    $('hnom').oninput=e=>F.huesped={...(F.huesped||{}),nombre:e.target.value.trim(),email:''};
  }else{
    z.innerHTML='<div class="nota">Queda en custodia como «no sé de quién es». Si alguien lo reclama, '+
      'aparece aquí; si no, a los 7 días la jefa de front decide.</div>';
  }
}

// Cuarto (o cama) + fecha -> el huésped. Se resuelve solo, sin botón.
async function resuelve(){
  F.area = F.cama || F.cuarto;
  if(!F.area){ pintaHuesped('<div class="nota">Elige el cuarto y te digo quién dormía ahí.</div>'); return; }
  const a=AREAS.find(x=>x.codigo===F.area);
  if(a && a.tipo==='dorm'){
    pintaHuesped('<div class="nota">Es un dormitorio: dime la cama y te digo de quién era.</div>');
    return;
  }
  const pedida=F.area+'|'+F.fecha;
  const comoSeLlama=(a?.nombre||F.area);
  pintaHuesped('<div class="ph">Viendo quién estaba en '+esc(comoSeLlama)+'…</div>');
  const r=await fn({accion:'buscar',prop:PROP===PUEBLA?'puebla':'cdmx',habitacion:F.area,fecha:F.fecha});
  // Si cambió de cuarto o de día mientras tardaba, esta respuesta ya no vale.
  if(pedida!==F.area+'|'+F.fecha) return;

  if(!r.ok||!r.encontrado){
    F.huesped=null; F.modo='nose';
    pintaHuesped('<div class="nota">No dimos con la reserva de '+esc(comoSeLlama)+' ese día'+
      (r.motivo?' — '+esc(r.motivo):'')+'. Guárdalo igual: queda sin dueño y la jefa de front '+
      'lo puede ligar después.</div>');
    return;
  }
  F.huesped={nombre:r.nombre,email:r.email,reserva_id:r.reserva_id,salida:r.salida};
  F.modo='auto';
  pintaHuesped(
    '<label class="cmp">7. ¿Es este huésped?</label>'+
    '<div class="nota '+(r.email?'bien':'')+'">En '+esc(comoSeLlama)+' estaba <b>'+esc(r.nombre||'sin nombre')+'</b>'+
      (r.salida?', salió el '+esc(r.salida):'')+'.<br>'+
      (r.email?esc(r.email):'No tiene correo en la reserva.')+
      (r.varias?'<br>⚠ Hubo más de una reserva ahí esas noches.':'')+
    '</div>'+
    '<div class="chips" id="cConf">'+
      '<button data-k="auto" class="on">✓ Sí, es '+esc((r.nombre||'ese huésped').split(' ')[0])+'</button>'+
      '<button data-k="nose">✕ No es, no sé de quién es</button>'+
      '<button data-k="presente">Se lo di en mano</button>'+
    '</div><div id="zModo"></div>');
  chips('cConf','k',v=>{
    F.modo=v;
    if(v==='nose') F.huesped=null;
    if(v==='auto') F.huesped={nombre:r.nombre,email:r.email,reserva_id:r.reserva_id,salida:r.salida};
    if(v==='presente') F.huesped={nombre:r.nombre,email:'',reserva_id:r.reserva_id};
    pintaModo();
  });
}

/* ─────────────────────────── guardar ─────────────────────────── */
async function guardar(){
  const desc=($('desc')?.value||'').trim();
  if(!desc) return toast('Descríbelo, aunque sea en cuatro palabras.');
  if(!F.donde) return toast('Dinos dónde apareció.');
  if(F.donde==='habitacion' && !F.cuarto) return toast('Falta el cuarto.');
  const aSel=AREAS.find(x=>x.codigo===F.cuarto);
  if(F.donde==='habitacion' && aSel?.tipo==='dorm' && !F.cama)
    return toast('Es un dormitorio: falta la cama.');
  $('bOk').disabled=true; toast('Guardando…');

  let foto_path=null;
  if(FOTO){
    const ext=(FOTO.name.split('.').pop()||'jpg').toLowerCase().slice(0,4);
    const ruta=(PROP===PUEBLA?'puebla':'cdmx')+'/'+hoy().slice(0,7)+'/'+crypto.randomUUID()+'.'+ext;
    const {error}=await sb.storage.from('lost-found').upload(ruta,FOTO,{upsert:false});
    if(error){ toast('No se pudo subir la foto: '+error.message); $('bOk').disabled=false; return; }
    foto_path=ruta;
  }

  const eq=(DONDES.find(d=>d.d===F.donde)||{}).eq||null;
  const enMano=F.modo==='presente';
  const areaSel=AREAS.find(x=>x.codigo===F.area);
  const fila={
    property_id:PROP, descripcion:desc, categoria:F.cat||'otros', valor:F.valor||'normal',
    foto_path, donde:F.donde, ubicacion_texto:($('ubi')?.value||'').trim()||null,
    area_id:areaSel?.id||null,
    encontrado_por:EMP, encontrado_por_nombre:NOMBRE, equipo:eq,
    habitacion:F.area?(areaSel?.nombre||F.area):null,
    huesped_identificado:!!(F.huesped&&(F.huesped.nombre||F.huesped.email)),
    huesped_nombre:F.huesped?.nombre||null, huesped_email:F.huesped?.email||null,
    reserva_id:F.huesped?.reserva_id||null, fecha_salida:F.huesped?.salida||null,
    entregado_en_mano:enMano,
    // En mano se cierra solo: ya está con su dueño, no hay nada que custodiar.
    estado: enMano?'entregado':(F.modo==='auto'?'en_custodia':'sin_dueno'),
    cerrado_at: enMano?new Date().toISOString():null,
    cerrado_por: enMano?EMP:null, cerrado_por_nombre: enMano?NOMBRE:null,
    cerrado_nota: enMano?'Se lo dio en mano quien lo encontró':null,
  };
  const {data,error}=await sb.from('lf_objetos').insert(fila).select('id,folio').single();
  if(error){ toast('No se pudo guardar: '+error.message); $('bOk').disabled=false; return; }
  try{
    await sb.from('lf_eventos').insert({objeto_id:data.id,que:enMano?'entregado_en_mano':'alta',
      detalle:{donde:F.donde,valor:fila.valor,area:F.area||null},quien:EMP,quien_nombre:NOMBRE});
  }catch(e){}

  const dónde = fila.valor==='documento_o_dinero'
    ? ' Llévalo HOY a recepción: lo custodia la jefa de front.'
    : fila.valor==='alto' ? ' Llévalo a recepción, lo custodia la jefa de front.'
    : enMano ? '' : ' Guárdalo en su bolsita con el nombre, en recepción.';
  toast(data.folio+' guardado.'+dónde);

  // Nada sale hacia el huésped sin que alguien lo lea antes.
  if(!enMano && fila.reserva_id) return validar(data.id, data.folio);
  setTimeout(lista,2200);
}

/* ────────────────── validar lo que le mandamos al huésped ────────────────── */
async function validar(id, folio){
  $('titulo').textContent='¿Se lo mandamos?'; $('atras').onclick=lista;
  $('wrap').innerHTML='<div class="ph">Armando el aviso…</div>';
  const r=await fn({accion:'previo',objeto_id:id});
  if(!r.ok){
    $('wrap').innerHTML='<div class="ph">Se guardó bien ('+esc(folio)+') pero no pudimos armar el aviso.<br>'+
      '<span style="font-size:12px">'+esc(r.error||'')+'</span><br><br>La jefa de front lo puede mandar desde su pantalla.</div>'+
      '<div class="barra"><span class="info"></span><button class="c" id="bFin">Listo</button></div>';
    $('bFin').onclick=lista; return;
  }
  const can=
    '<div class="vcan">'+
      '<div><span class="i">✉️</span><span>'+(r.canales.correo
          ? 'Correo a <b>'+esc(r.canales.correo)+'</b>'
          : '<span class="no">Sin correo en la reserva: por correo no se puede</span>')+'</span></div>'+
      '<div><span class="i">📱</span><span>'+(r.canales.apepe
          ? 'Aviso en <b>su APePe</b>, con la campanita'
          : '<span class="no">Sin reserva ligada: por APePe no se puede</span>')+'</span></div>'+
      '<div><span class="i">⏳</span><span>Le damos <b>'+esc(r.dias)+' días</b> y, si no contesta, te lo volvemos a poner delante</span></div>'+
    '</div>';
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">Esto es lo que le llega</div>'+
    '<div class="s">Léelo antes de mandarlo. Si algo no cuadra —el huésped equivocado, una foto '+
    'que no se entiende— mejor no lo mandes y dile a la jefa de front.</div></div>'+
    can+
    '<div class="grupo">Asunto</div><div class="vcan"><b>'+esc(r.asunto)+'</b></div>'+
    '<div class="grupo">El correo, tal cual</div>'+
    '<iframe class="vprev" id="pv" sandbox referrerpolicy="no-referrer"></iframe>'+
    '<div class="barra"><span class="info">Nada sale sin que lo valides.</span>'+
    '<button class="g" id="bNo">Ahora no</button>'+
    '<button class="c" id="bSi"'+(r.canales.correo||r.canales.apepe?'':' disabled')+'>Mandar</button></div>';
  $('pv').srcdoc=r.html;
  $('bNo').onclick=()=>{ toast('No se mandó. Queda en custodia y la jefa de front lo puede mandar.'); setTimeout(lista,1800); };
  $('bSi').onclick=async()=>{
    $('bSi').disabled=true; toast('Mandando…');
    const e=await fn({accion:'avisar',objeto_id:id});
    if(!e.ok){ toast('No se pudo mandar: '+(e.error||'')); $('bSi').disabled=false; return; }
    toast('Avisado'+(e.correo?' por correo':'')+(e.correo&&e.apepe?' y':'')+(e.apepe?' por APePe':'')+'.');
    setTimeout(lista,2200);
  };
}

arranca();
</script>
