function pickQuestions(catId, n) {
  const cat = CATEGORIES.find((c) => c.id === catId);
  if (!cat || cat.questions.length === 0) return [];
  return shuffle(cat.questions).slice(0, n).map((q) => {
    const correct = q.o[q.a];
    const opts = shuffle(q.o);
    return { q: q.q, options: opts, a: opts.indexOf(correct), ...explicar(q.q) };
  });
}

          puesto: e.area || "Colaborador", nivel: 1, sede: PROP[e.property_id] || "", enPrueba: false,
          walletHist: (pmap[e.id] || {}).h || 0, walletMes: (pmap[e.id] || {}).m || 0,
        }));
        // Identidad: sesión de SoyPepe (mismo origen) -> empleado; fallback al ?nombre. SIEMPRE entra.
        const params = new URLSearchParams(location.search);
        const nombreParam = (params.get("nombre") || params.get("ref") || "").trim();
        let sess = null;
        try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && /sb-.*-auth-token/.test(k)) { const v = JSON.parse(localStorage.getItem(k) || "null"); const s = v && (v.currentSession || v); if (s && s.user) { sess = s; break; } } } } catch (e) {}
        let empId = null, empNombre = "";
        if (sess && sess.user) {
          try { const el = await fetch(SBU + "/rest/v1/empleado_login?select=employee_id,nombre_display&user_id=eq." + sess.user.id, { headers: SBH }).then(r => r.json()); if (Array.isArray(el) && el[0]) { empId = el[0].employee_id; empNombre = el[0].nombre_display || ""; } } catch (e) {}
          if (!empId) { try { const em = await fetch(SBU + "/rest/v1/employees?select=id,nombre&user_id=eq." + sess.user.id, { headers: SBH }).then(r => r.json()); if (Array.isArray(em) && em[0]) { empId = em[0].id; empNombre = em[0].nombre || ""; } } catch (e) {} }
        }
        let finalUsers = (list && list.length) ? list.slice() : [];
        let meIdToSet;
        if (empId && finalUsers.some(u => u.id === empId)) {
          meIdToSet = empId;
        } else {
          const fid = empId || ("me_" + ((sess && sess.user && sess.user.id) || "pepe"));
          const fnombre = (empNombre || nombreParam || "Pepe").split(" ")[0];
          finalUsers = [{ id: fid, nombre: fnombre, avatar: "🧑", puesto: "Colaborador", nivel: 1, sede: "CDMX", enPrueba: false, walletHist: 0, walletMes: 0 }, ...finalUsers];
          meIdToSet = fid;
        }
        setUsers(finalUsers);
        setMeId(meIdToSet);
        // Preguntas desde la BBDD (pq_preguntas). Si una categoria trae preguntas, reemplaza el seed.
        try {
          const pregs = await fetch(SBU + "/rest/v1/pq_preguntas?select=categoria_id,enunciado,opciones,correcta&activa=eq.true", { headers: SBH }).then(r => r.json());
          if (Array.isArray(pregs) && pregs.length) {
            const byCat = {};
            pregs.forEach(p => { if (Array.isArray(p.opciones)) (byCat[p.categoria_id] = byCat[p.categoria_id] || []).push({ q: p.enunciado, o: p.opciones, a: p.correcta }); });
            CATEGORIES.forEach(c => { if (byCat[c.id] && byCat[c.id].length) { c.questions = byCat[c.id]; c.construccion = false; } });
          }
        } catch (e) {}
        setScreen("home");
      } catch (err) {
        try { const p = new URLSearchParams(location.search); const nm = (p.get("nombre") || "Pepe").split(" ")[0]; setUsers([{ id: "me_guest", nombre: nm, avatar: "🧑", puesto: "Colaborador", nivel: 1, sede: "CDMX", enPrueba: false, walletHist: 0, walletMes: 0 }]); setMeId("me_guest"); setScreen("home"); } catch (e) {}
      }
    })();
  }, []);

  const updateMe = useCallback((patch) => {
    setUsers((us) => us.map((u) => (u.id === meId ? { ...u, ...patch } : u)));
  }, [meId]);

  const obligatorios = me ? (PUESTO_OBLIGATORIOS[me.puesto] || []) : [];
  const myProg = (progress[meId] || {});
  const pendientes = obligatorios.filter((c) => (myProg[c]?.estado !== "aprobado"));

  const onPickUser = (id) => { setMeId(id); setScreen("home"); };

  const startGym = () => { setMode("gym"); setScreen("catselect"); };
  const startDuel = () => { setMode("duel"); setScreen("catselect"); };

  const onCatChosen = (cat) => {
    setActiveCat(cat);
    setScreen(mode === "gym" ? "gym" : "duelselect");
  };
  const onOppChosen = (opp) => { setOpponent(opp);
    try { if (opp && /^[0-9a-f-]{36}$/i.test(opp.id)) fetch(SBU + "/rest/v1/notificaciones", { method: "POST", headers: { ...SBH, "Content-Type": "application/json" }, body: JSON.stringify({ employee_id: opp.id, titulo: "\u2694\uFE0F Te retaron en PepeQuiz", cuerpo: ((me && me.nombre) || "Alguien") + " te ret\u00f3 en " + ((activeCat && activeCat.nombre) || "PepeQuiz") + ". \u00a1Entra a responder!", icono: "\u2694\uFE0F" }) }); } catch (e) {}
    setScreen("duel"); };

  const finishGym = (earned, correctCount, qs, answers) => {
    updateMe({ walletHist: me.walletHist + earned, walletMes: me.walletMes + earned });
    try { fetch(SBU + "/rest/v1/pq_puntos", { method: "POST", headers: { ...SBH, "Content-Type": "application/json", Prefer: "resolution=merge-duplicates" }, body: JSON.stringify({ employee_id: meId, pts_hist: me.walletHist + earned, pts_mes: me.walletMes + earned, updated_at: new Date().toISOString() }) }); } catch (e) {}
    // registrar progreso si es categoría obligatoria
    const isObl = obligatorios.includes(activeCat.id);
    let aprobadoAhora = false;
    if (isObl) {
      setProgress((p) => {
        const prev = p[meId]?.[activeCat.id]?.best || 0;
        const best = Math.max(prev, correctCount);
        aprobadoAhora = best > APROBADO_MIN; // >8
        return { ...p, [meId]: { ...(p[meId] || {}), [activeCat.id]: { best, estado: aprobadoAhora ? "aprobado" : "pendiente" } } };
      });
    }
    setLastResult({ mode: "gym", earned, correctCount, isObl, cat: activeCat, qs, answers });
    setScreen("result");
  };

  const finishDuel = (myScore, oppScore) => {
    const won = myScore > oppScore, tie = myScore === oppScore;
    const diff = Math.abs(myScore - oppScore); // margen del marcador
    // Cada quien suma SOLO lo que logró en su test.
    // Además, el PERDEDOR pierde la diferencia de su cartera. El ganador NO la recibe.
    let myDelta = myScore;
    let oppDelta = oppScore;
    if (won) {
      oppDelta -= diff;  // el rival (perdedor) pierde la diferencia
    } else if (!tie) {
      myDelta -= diff;   // tú (perdedor) pierdes la diferencia
    }
    // Reta PvP: los puntos NO se aplican hasta que el rival responda de verdad. Por ahora la Reta es practica (no acredita puntos).
    try {
      const _r = ((me && me.nombre) || "T\u00fa") + " " + myScore + " vs " + ((opponent && opponent.nombre) || "rival") + " " + oppScore + " \u00b7 " + (won ? ("gan\u00f3 " + ((me && me.nombre) || "t\u00fa")) : (tie ? "empate" : ("gan\u00f3 " + ((opponent && opponent.nombre) || "rival"))));
      const _n = (eid) => { if (eid && /^[0-9a-f-]{36}$/i.test(eid)) fetch(SBU + "/rest/v1/notificaciones", { method: "POST", headers: { ...SBH, "Content-Type": "application/json" }, body: JSON.stringify({ employee_id: eid, titulo: "\u2694\uFE0F Resultado de reto", cuerpo: _r, icono: "\u2694\uFE0F" }) }); };
      _n(opponent && opponent.id); _n(meId);
    } catch (e) {}
    // (sin cambios de cartera en Reta hasta el flujo PvP real)
    setLastResult({ mode: "duel", myScore, oppScore, won, tie, diff, myDelta, opp: opponent });
    setScreen("result");
  };

  return (
    <div style={S.app}>
      <Style />
      <div style={S.phone}>
        {me && <TopBar me={me} onHome={() => setScreen("home")} onLogout={() => setScreen("home")} />}
        <div style={S.body}>
          {(screen === "loading") && <div style={{padding:"48px 20px",textAlign:"center",color:"#a99a82"}}>Cargando tu perfil\u2026</div>}
          {(screen === "noauth") && <div style={{padding:"48px 20px",textAlign:"center",color:"#a99a82"}}>Inicia sesi\u00f3n en SoyPepe para jugar PepeQuiz.</div>}
          {screen === "home" && <Home me={me} pendientes={pendientes} obligatorios={obligatorios}
            onGym={startGym} onDuel={startDuel} onRank={() => setScreen("rank")} onPrueba={() => setScreen("prueba")} onAdmin={() => setScreen("admin")} />}
          {screen === "prueba" && <Prueba me={me} obligatorios={obligatorios} prog={myProg}
            onTrain={(catId) => { setMode("gym"); setActiveCat(CATEGORIES.find((c) => c.id === catId)); setScreen("gym"); }} />}
          {screen === "rank" && <Ranking users={users} meId={meId} />}
          {screen === "admin" && <Admin users={users} progress={progress} />}
          {screen === "catselect" && <CatSelect mode={mode} obligatorios={obligatorios} prog={myProg} onPick={onCatChosen} />}
          {screen === "gym" && <GymGame cat={activeCat} isObl={obligatorios.includes(activeCat.id)} onFinish={finishGym} />}
          {screen === "duelselect" && <DuelSelect me={me} users={users} onPick={onOppChosen} />}
          {screen === "duel" && <DuelGame cat={activeCat} opponent={opponent} onFinish={finishDuel} />}
          {screen === "result" && <Result res={lastResult} onAgain={() => setScreen("home")} onReview={() => setScreen("review")} />}
          {screen === "review" && <Review res={lastResult} onBack={() => setScreen("result")} onHome={() => setScreen("home")} />}
        </div>
      </div>
    </div>
  );
}

/* ===================== GYM ===================== */
function GymGame({ cat, isObl, onFinish }) {
  const [qs] = useState(() => pickQuestions(cat.id, GYM_QS));
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [earned, setEarned] = useState(0);
  const [correct, setCorrect] = useState(0);
  const [tLeft, setTLeft] = useState(GYM_WINDOW);
  const [pop, setPop] = useState(null);
  const answers = useRef([]); // [{picked}] por pregunta, para el repaso
  const timer = useRef(null);

  useEffect(() => {
    setTLeft(GYM_WINDOW);
    timer.current = setInterval(() => {
      setTLeft((t) => { if (t <= 0.1) { clearInterval(timer.current); handle(-1, 0); return 0; } return +(t - 0.1).toFixed(1); });
    }, 100);
    return () => clearInterval(timer.current);
    // eslint-disable-next-line
  }, [idx]);

  const handle = (choice, ratioOv) => {
    if (picked !== null) return;
    clearInterval(timer.current);
    const ratio = ratioOv !== undefined ? ratioOv : tLeft / GYM_WINDOW;
    const ok = choice === qs[idx].a;
    const pts = ok ? gymPts(ratio) : 0;
    answers.current[idx] = { picked: choice }; // -1 si se acabó el tiempo
    setPicked(choice); setEarned((e) => e + pts); if (ok) setCorrect((c) => c + 1);
    setPop(ok ? `+${pts}` : "✗");
    setTimeout(() => {
      setPop(null);
      if (idx + 1 < qs.length) { setIdx(idx + 1); setPicked(null); }
      else { try{ if(PQUID) fetch(SBU+'/rest/v1/rpc/pq_registrar_gym',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},SBH),body:JSON.stringify({p_usuario:PQUID,p_categoria:cat.id,p_aciertos:correct + (ok ? 1 : 0),p_puntos:earned + pts})}); }catch(e){} onFinish(earned + pts, correct + (ok ? 1 : 0), qs, answers.current); }
    }, 1050);
  };

  const cur = qs[idx];
  return (
    <div style={S.screen}>
      <GameHeader cat={cat} idx={idx} total={qs.length} right={<TimerRing ratio={tLeft / GYM_WINDOW} color={cat.color} label={Math.ceil(tLeft)} />} />
      {isObl && <div style={S.oblNote}>★ Quiz obligatorio · necesitas más de 8 aciertos para aprobar</div>}
      <div style={S.scoreRow}><span style={S.muted}>Cartera del test</span><strong style={{ color: "#E9B44C" }}>{earned} pts · {correct}/{idx} ✓</strong></div>
      <QuestionCard cur={cur} picked={picked} onPick={(i) => handle(i)} color={cat.color} />
      {pop && <Pop txt={pop} good={pop[0] === "+"} />}
    </div>
  );
}

/* ===================== DUEL GAME ===================== */
function DuelGame({ cat, opponent, onFinish }) {
  const [qs] = useState(() => pickQuestions(cat.id, DUEL_QS));
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [my, setMy] = useState(0);
  const [opp, setOpp] = useState(0);
  const [tLeft, setTLeft] = useState(DUEL_WINDOW);
  const [pop, setPop] = useState(null);
  const [oppPop, setOppPop] = useState(null);
  const timer = useRef(null);
  const skill = BOT_SKILL[opponent.id] ?? 0.78;

  useEffect(() => {
    setTLeft(DUEL_WINDOW);
    timer.current = setInterval(() => {
      setTLeft((t) => { if (t <= 0.1) { clearInterval(timer.current); resolve(-1, DUEL_WINDOW); return 0; } return +(t - 0.1).toFixed(1); });
    }, 100);
    return () => clearInterval(timer.current);
    // eslint-disable-next-line
  }, [idx]);

  const resolve = (choice, elapsedOv) => {
    if (picked !== null) return;
    clearInterval(timer.current);
    const elapsed = elapsedOv !== undefined ? elapsedOv : DUEL_WINDOW - tLeft;
    const ok = choice === qs[idx].a;
    const myPts = ok ? duelPts(elapsed) : 0;
    const oppOk = Math.random() < skill;
    const oPts = oppOk ? duelPts(1.5 + Math.random() * 5) : 0;
    setPicked(choice); setMy((s) => s + myPts); setOpp((s) => s + oPts);
    setPop(ok ? `+${myPts}` : "✗"); setOppPop(oppOk ? `+${oPts}` : "✗");
    setTimeout(() => {
      setPop(null); setOppPop(null);
      if (idx + 1 < qs.length) { setIdx(idx + 1); setPicked(null); }
      else onFinish(my + myPts, opp + oPts);
    }, 1250);
  };

  const cur = qs[idx];
  return (
    <div style={S.screen}>
      <div style={S.versusRow}>
        <PlayerChip avatar="🙋" name="Tú" score={my} pop={pop} side="left" color={cat.color} />
        <div style={S.vsCenter}><TimerRing ratio={tLeft / DUEL_WINDOW} color="#E9B44C" label={Math.ceil(tLeft)} /><div style={S.vsTxt}>VS</div></div>
        <PlayerChip avatar={opponent.avatar} empId={opponent.id} name={opponent.nombre} score={opp} pop={oppPop} side="right" color="#3E7CB1" />
      </div>
      <GameHeader cat={cat} idx={idx} total={qs.length} compact />
      <QuestionCard cur={cur} picked={picked} onPick={(i) => resolve(i)} color={cat.color} />
    </div>
  );
}

function PlayerChip({ avatar, name, score, pop, side, color, empId }) {
  return (
    <div style={{ ...S.pChip, alignItems: side === "right" ? "flex-end" : "flex-start" }}>
      <div style={S.pAvatar}>{empId ? <Av id={empId} emoji={avatar} /> : avatar}</div>
      <div style={S.pName}>{name}</div>
      <div style={{ ...S.pScore, color }}>{score}</div>
      {pop && <div style={{ ...S.pPop, color: pop[0] === "+" ? "#7BD389" : "#E0654A" }}>{pop}</div>}

}

/* ===================== SHARED ===================== */
function GameHeader({ cat, idx, total, right, compact }) {
  return (
    <div style={{ ...S.gameHead, marginBottom: compact ? 10 : 14 }}>
      <div>
        <div style={S.gameCat}><span>{cat.emoji}</span> {cat.name}</div>
        <div style={S.progressDots}>{Array.from({ length: total }).map((_, i) => <span key={i} style={{ ...S.dot, background: i <= idx ? cat.color : "#ffffff22" }} />)}</div>
        <div style={S.qNum}>Pregunta {idx + 1} de {total}</div>
      </div>
      {right}
    </div>
  );
}
function QuestionCard({ cur, picked, onPick, color }) {
  return (
    <div style={S.qCard}>
      <p style={S.qText}>{cur.q}</p>
      <div style={S.optGrid}>
        {cur.options.map((opt, i) => {
          let st = { ...S.opt };
          if (picked !== null) {
            if (i === cur.a) st = { ...S.opt, ...S.optGood };
            else if (i === picked) st = { ...S.opt, ...S.optBad };
            else st = { ...S.opt, opacity: 0.45 };
          }
          return (
            <button key={i} style={st} disabled={picked !== null} onClick={() => onPick(i)}>
              <span style={{ ...S.optLetter, color }}>{String.fromCharCode(65 + i)}</span>{opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}
function Pop({ txt, good }) { return <div style={{ ...S.bigPop, color: good ? "#7BD389" : "#E0654A" }}>{txt}</div>; }

/* ===================== RESULT ===================== */
function Result({ res, onAgain, onReview }) {
  if (!res) return null;
  if (res.mode === "gym") {
    const aprob = res.correctCount > APROBADO_MIN;
    return (
      <div style={S.screen}>
        <div style={S.resultWrap}>
          <div style={S.resultEmoji}>{res.isObl ? (aprob ? "✅" : "🔁") : "💪"}</div>
          <h2 style={S.resultTitle}>{res.isObl ? (aprob ? "¡Quiz aprobado!" : "Casi… reintenta") : "¡Entrenamiento listo!"}</h2>
          <div style={S.resultBig}>+{res.earned}</div>
          <p style={S.muted}>puntos a tu cartera · {res.correctCount}/{GYM_QS} aciertos</p>
          {res.isObl && !aprob && <div style={S.loseMsg}>Necesitas más de 8 aciertos para aprobar este quiz obligatorio. ¡Puedes reintentar!</div>}
          {res.isObl && aprob && <div style={S.stealMsg}>Quiz obligatorio de tu puesto <strong>aprobado</strong> ✓</div>}
        </div>
        <button style={S.reviewBtn} onClick={onReview}>📖 Ver respuestas y aprender</button>
        <button style={S.primaryBtn} onClick={onAgain}>Volver al inicio</button>
      </div>
    );
  }
  const { won, tie, myScore, oppScore, diff, myDelta, opp } = res;
  return (
    <div style={S.screen}>
      <div style={S.resultWrap}>
        <div style={S.resultEmoji}>{won ? "🏆" : tie ? "🤝" : "💔"}</div>
        <h2 style={S.resultTitle}>{won ? "¡Ganaste el reto!" : tie ? "¡Empate!" : `${opp.nombre} te ganó`}</h2>
        <div style={S.duelScoreRow}>
          <div style={S.dsCol}><div style={S.dsAv}>🙋</div><div style={{ ...S.dsScore, color: won ? "#7BD389" : "#fff" }}>{myScore}</div><div style={S.muted}>Tú</div></div>
          <div style={S.dsVs}>—</div>
          <div style={S.dsCol}><div style={S.dsAv}>{opp.avatar}</div><div style={{ ...S.dsScore, color: !won && !tie ? "#7BD389" : "#fff" }}>{oppScore}</div><div style={S.muted}>{opp.nombre}</div></div>
        </div>
        {won && <div style={S.stealMsg}>🪙 Sumas <strong>+{myScore} pts</strong> a tu cartera · {opp.nombre} pierde {diff} pts por la diferencia</div>}
        {!won && !tie && <div style={S.loseMsg}>Sumas +{myScore} pts, pero pierdes <strong>{diff} pts</strong> por el margen ({myDelta >= 0 ? "+" : ""}{myDelta} neto). {diff >= 40 ? "¡Te dieron una paliza!" : "Reto cerrado, casi nada."}</div>}
        {tie && <div style={S.loseMsg}>Empate. Cada quien conserva sus +{myScore} pts. ¡Revancha!</div>}
      </div>
      <button style={S.primaryBtn} onClick={onAgain}>Volver al inicio</button>
    </div>
  );
}

/* ===================== REVIEW (repaso post-Gym) ===================== */
function Review({ res, onBack, onHome }) {
  if (!res || !res.qs) return null;
  const { qs, answers, cat } = res;
  return (
    <div style={S.screen}>
      <h2 style={S.h2}>Repaso · {cat.emoji} {cat.name}</h2>
      <p style={S.muted}>Revisa cada respuesta y profundiza con el enlace. Así afianzas el conocimiento.</p>
      <div style={S.revList}>
        {qs.map((q, i) => {
          const picked = answers[i]?.picked;
          const acerto = picked === q.a;
          return (
            <div key={i} style={{ ...S.revCard, borderColor: acerto ? "#7BD389" : "#E0654A" }}>
              <div style={S.revHead}>
                <span style={{ ...S.revTag, background: acerto ? "#234d2c" : "#4d2326", color: acerto ? "#cdeccf" : "#f3b8ab" }}>{acerto ? "Acertaste" : ((picked===-1||picked==null) ? "Sin tiempo" : "Fallaste")}</span>
                <span style={S.revNum}>Pregunta {i + 1}</span>
              </div>
              <p style={S.revQ}>{q.q}</p>
              <div style={S.revOpts}>
                {q.options.map((opt, j) => {
                  const isCorrect = j === q.a;
                  const isPicked = j === picked;
                  let st = { ...S.revOpt };
                  if (isCorrect) st = { ...S.revOpt, ...S.revOptGood };
                  else if (isPicked) st = { ...S.revOpt, ...S.revOptBad };
                  return (
                    <div key={j} style={st}>
                      <span style={{ width: 16, fontWeight: 800 }}>{String.fromCharCode(65 + j)}</span>
                      {opt}
                      {isCorrect && <span style={S.revMark}>✓</span>}
                      {isPicked && !isCorrect && <span style={S.revMark}>tu respuesta</span>}
                    </div>
                  );
                })}
              </div>
              {q.explicacion
                ? <div style={S.revExpl}>💡 {q.explicacion}</div>
                : <div style={{ ...S.revExpl, color: "#ffffff66" }}>💡 Explicación por agregar.</div>}
              {q.fuente_url && (
                <a href={q.fuente_url} target="_blank" rel="noopener noreferrer" style={S.revLink}>
                  🔗 {q.fuente_label || "Más información"} →
                </a>
              )}
            </div>
          );
        })}
      </div>
      <div style={S.homeRow}>
        <button style={S.smallBtn} onClick={onBack}>← Resultado</button>
        <button style={S.primaryBtn} onClick={onHome}>Volver al inicio</button>
      </div>
    </div>
  );
}

function Ranking({ users, meId }) {
  const board = [...users].sort((a, b) => b.walletMes - a.walletMes);
  const medals = ["🥇", "🥈", "🥉"];
  return (
    <div style={S.screen}>
      <h2 style={S.h2}>Ranking del mes</h2>
      <p style={S.muted}>Los puntos del mes no se acumulan al siguiente. Premios al cierre.</p>
      <div style={S.rankList}>
        {board.map((p, i) => (
          <div key={p.id} style={{ ...S.rankRow, ...(p.id === meId ? S.rankMe : {}) }}>
            <div style={S.rankPos}>{medals[i] || i + 1}</div>

}
