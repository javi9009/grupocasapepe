<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi limpieza · Casa Pepe</title>
<meta name="theme-color" content="#1d9e75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar .d{margin-left:auto;font-size:12px;color:#cdbf9c}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:17px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:2px}
.prog{height:9px;background:var(--bg3);border-radius:99px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--txt2)}
.stats b{font-size:15px;display:block;color:var(--txt)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--txt2)}
.chip.vs{background:#fbe9e9;color:var(--bad)}.chip.vl{background:#dff0e8;color:#12694d}
.chip.oc{background:#fff0d6;color:#8a6212}.chip.rut{background:#e9e6f5;color:#4a3f8a}
.chip.warn{background:#fff0d6;color:#8a6212}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.done{opacity:.6}
.card.now{border-color:var(--accent);border-width:2px}
.card .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card .cod{font-size:20px;font-weight:800;letter-spacing:-.02em}
.card .nm{font-size:12.5px;color:var(--txt3);margin-top:3px}
.card .mn{margin-left:auto;font-size:12px;color:var(--txt3);text-align:right}
.card .mn b{display:block;font-size:14px;color:var(--txt2)}
.act{display:flex;gap:8px;margin-top:11px}
.act button{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.act .go{background:var(--accent);color:#fff}
.act .end{background:var(--gold);color:#16130f}
.act .off{background:var(--bg3);color:var(--txt3)}
.chkl{margin-top:10px;border-top:1px solid var(--bg3);padding-top:8px}
.chkl summary{font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer;list-style:none}
.chkl summary::-webkit-details-marker{display:none}
.chkl summary::before{content:"▸ ";color:var(--accent)}
.chkl[open] summary::before{content:"▾ "}
.chkl ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:c}
.chkl li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bg2);font-size:13px;line-height:1.35;color:var(--txt2)}
.chkl li input{width:20px;height:20px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.chkl li.ok{opacity:.5;text-decoration:line-through}
.chkl .cnt{font-size:11.5px;color:var(--txt3);font-weight:600}
.res{margin-top:9px;font-size:12.5px;color:var(--txt2);background:var(--bg2);border-radius:10px;padding:8px 10px}
.res .fast{color:var(--accent);font-weight:700}.res .slow{color:var(--bad);font-weight:700}
.ph{text-align:center;color:var(--txt3);padding:40px 16px;font-size:14px;line-height:1.5}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .bx{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .s{font-size:12.5px;color:var(--txt3);margin-bottom:14px}
.sheet label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin:12px 0 5px}
.sheet select,.sheet textarea{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:var(--bg2);color:var(--txt)}
.sheet textarea{min-height:78px;resize:vertical}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.sheet .btns button{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.sheet .btns .ok{background:var(--accent);color:#fff}
.sheet .btns .no{background:var(--bg3);color:var(--txt2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.vbox .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.vbox ul{margin:9px 0 0;padding:0;list-style:none;font-size:13px;color:var(--txt2)}
.vbox li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--bg3)}
.vbox li b{min-width:46px}
.vbox li select{margin-left:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 6px;font-size:11.5px;background:#fff;max-width:120px}
.big{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;background:var(--gold);color:#16130f;cursor:pointer;margin-top:6px}
.big.pri{background:var(--accent);color:#fff}
.big:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:#16130f;color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>

<div class="appbar">
  <button class="bk" onclick="location.href='/soypepe/'">‹</button>
  <span class="t">🧹 <b>Mi limpieza</b></span>
  <span class="d" id="hoy"></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>

<!-- Sheet cerrar cuarto -->
<div class="sheet" id="sh"><div class="bx">
  <h3 id="shT">Terminar limpieza</h3>
  <div class="s" id="shS"></div>
  <label>¿Pasó algo con este cuarto?</label>
  <select id="shM"><option value="">Todo normal</option></select>
  <label>Comentario (opcional)</label>
  <textarea id="shC" placeholder="Ej. la habitación estaba muy sucia, había fiesta…"></textarea>
  <div class="btns"><button class="no" id="shX">Cancelar</button><button class="ok" id="shOk">Terminar</button></div>
</div></div>

<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const FECHA=hoyMX();
const CH={vacia_limpia:['vl','Refresco'],vacia_sucia:['vs','Salida · a fondo'],ocupada:['oc','En casa'],rutina:['rut','Rutina']};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=t=>t?String(t).slice(0,5):'';
let EMP=null,NOMBRE=null,USER=null,MOTIVOS=[],MIA=null,TODAS=[],VISTA='mia';

$('hoy').textContent=new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const e=$('tst');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}

async function arranca(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='/soypepe/';return;}
  USER=session.user;
  const {data:link}=await sb.from('empleado_login').select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(!link){$('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>';return;}
  EMP=link.employee_id;NOMBRE=link.nombre_display||link.nombre_completo;
  const {data:m}=await sb.from('hk_motivos').select('*').eq('activo',true).order('orden');
  MOTIVOS=m||[];
  $('shM').innerHTML='<option value="">Todo normal</option>'+MOTIVOS.map(x=>`<option value="${x.codigo}">${esc(x.nombre)}</option>`).join('');
  cargar();
}

async function cargar(){
  const {data:mias}=await sb.from('hk_asignaciones')
    .select('*,hk_tareas(*,hk_areas(codigo,nombre,tipo,piso),hk_checklists:checklist_id(id,nombre,hk_checklist_items(id,orden,tarea,minutos)))')
    .eq('fecha',FECHA).eq('employee_id',EMP);
  MIA=(mias||[])[0]||null;
  if(MIA&&MIA.turno==='ama_llaves'){
    const {data:t}=await sb.from('hk_asignaciones')
      .select('*,hk_tareas(id,orden,estatus_area,minutos_estimados,estado,hk_areas(codigo,nombre,piso))')
      .eq('fecha',FECHA).eq('property_id',MIA.property_id).order('turno');
    TODAS=t||[];
  }
  pintar();
}

function pintar(){
  const w=$('wrap');
  if(!MIA){w.innerHTML='<div class="ph">Hoy no tienes cuartos asignados.<br><br>Si crees que es un error, avísale al ama de llaves.</div>';return;}
  const esAma=MIA.turno==='ama_llaves';
  const pendiente=MIA.estado==='propuesta';
  let html='';

  if(esAma){
    html+=`<div class="tabs">
      <button class="${VISTA==='mia'?'on':''}" data-v="mia">Mis cuartos</button>
      <button class="${VISTA==='rep'?'on':''}" data-v="rep">Reparto del día${pendiente?' ⚠':''}</button>
    </div>`;
  }

  if(esAma&&VISTA==='rep'){
    html+=`<div class="hero"><div class="n">Reparto del ${new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'long'})}</div>
      <div class="s">${pendiente?'Propuesta del sistema · revísala y valídala antes de arrancar el turno.':'Ya validado por '+esc(MIA.validado_por_nombre||'—')+'.'}</div></div>`;
    const dest=TODAS.filter(a=>a.employee_id).map(a=>({id:a.id,n:a.nombre_display}));
    html+=TODAS.map(a=>{
      const ts=(a.hk_tareas||[]).sort((x,y)=>x.orden-y.orden);
      return `<div class="vbox"><div class="h">${a.employee_id?'':'⚠ '}${esc(a.nombre_display)}
        <span class="chip">${esc(a.turno.replace('_',' '))}</span>
        <span class="chip">${hhmm(a.hora_inicio)}–${hhmm(a.hora_fin)}</span>
        ${a.pisos?.length?`<span class="chip">piso ${a.pisos.join(', ')}</span>`:''}
        <span class="chip ${a.metadata?.carga_pct>100?'vs':'warn'}">${a.minutos_estimados} min</span></div>
        <ul>${ts.map(t=>`<li><b>${esc(t.hk_areas?.codigo||'')}</b>
          <span class="chip ${(CH[t.estatus_area]||['rut'])[0]}">${(CH[t.estatus_area]||['','—'])[1]}</span>
          <span style="color:var(--txt3)">${t.minutos_estimados}m</span>
          ${pendiente?`<select class="mv" data-t="${t.id}"><option value="">↔ mover</option>${dest.filter(d=>d.id!==a.id).map(d=>`<option value="${d.id}">→ ${esc(d.n)}</option>`).join('')}</select>`:''}
        </li>`).join('')}</ul></div>`;
    }).join('');
    html+=pendiente
      ? `<button class="big pri" id="btnVal">✓ Validar el reparto del día</button>`
      : `<div class="ph" style="padding:16px">Reparto validado ${MIA.validado_at?'a las '+new Date(MIA.validado_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'}):''}.</div>`;
    w.innerHTML=html;
    engancharTabs();
    w.querySelectorAll('select.mv').forEach(s=>s.onchange=async()=>{
      if(!s.value)return;
      const {error}=await sb.from('hk_tareas').update({asignacion_id:s.value,es_extra:true}).eq('id',s.dataset.t);
      if(error)return toast('No se pudo mover');
      toast('Cuarto movido');cargar();
    });
    const bv=$('btnVal');
    if(bv)bv.onclick=async()=>{
      bv.disabled=true;
      const {error}=await sb.from('hk_asignaciones')
        .update({estado:'validada',validado_por:USER.id,validado_por_nombre:NOMBRE,validado_at:new Date().toISOString()})
        .eq('fecha',FECHA).eq('property_id',MIA.property_id);
      bv.disabled=false;
      if(error)return toast('No se pudo validar');
      toast('Reparto validado');cargar();
    };
    return;
  }

  // ---- mis cuartos ----
  const ts=(MIA.hk_tareas||[]).sort((a,b)=>a.orden-b.orden);
  const hechas=ts.filter(t=>t.estado==='terminada').length;
  const enCurso=ts.find(t=>t.estado==='en_curso');
  const estim=ts.reduce((s,t)=>s+(t.minutos_estimados||0),0);
  const real=ts.reduce((s,t)=>s+(Number(t.minutos_reales)||0),0);
  const estimHechas=ts.filter(t=>t.estado==='terminada').reduce((s,t)=>s+(t.minutos_estimados||0),0);

  html+=`<div class="hero">
    <div class="n">${esc(NOMBRE||'')}</div>
    <div class="s">${hhmm(MIA.hora_inicio)}–${hhmm(MIA.hora_fin)} · ${MIA.pisos?.length?'piso '+MIA.pisos.join(', '):'áreas comunes'}${pendiente?' · <span class="chip warn">reparto sin validar</span>':''}</div>
    <div class="prog"><i style="width:${ts.length?Math.round(hechas/ts.length*100):0}%"></i></div>
    <div class="stats">
      <div><b>${hechas}/${ts.length}</b>cuartos</div>
      <div><b>${Math.round(estim/60*10)/10} h</b>asignadas</div>
      <div><b>${real?Math.round(real)+' m':'—'}</b>trabajadas</div>
      ${real&&estimHechas?`<div><b style="color:${estimHechas>=real?'var(--accent)':'var(--bad)'}">${Math.round(estimHechas/real*100)}%</b>ritmo</div>`:''}
    </div></div>`;

  if(pendiente)html+=`<div class="ph" style="padding:14px;background:#fff8ea;border-radius:14px;margin-bottom:12px;color:#8a6212">El ama de llaves todavía no valida el reparto. Puedes verlo, pero espera antes de arrancar.</div>`;

  html+=ts.map(t=>{
    const a=t.hk_areas||{};const c=CH[t.estatus_area]||['rut','—'];
    const dif=t.minutos_reales!=null?(t.minutos_estimados-Number(t.minutos_reales)):null;
    return `<div class="card ${t.estado==='terminada'?'done':''} ${t.estado==='en_curso'?'now':''}" data-t="${t.id}">
      <div class="top">
        <div><div class="cod">${esc(a.codigo||'')}</div><div class="nm">${esc(a.nombre||'')}</div></div>
        <div class="mn"><b>${t.minutos_estimados} min</b><span class="chip ${c[0]}">${c[1]}</span></div>
      </div>
      ${chklHtml(t)}
      ${t.estado==='terminada'
        ? `<div class="res">Hecho en <b>${t.minutos_reales} min</b> ${dif>0?`<span class="fast">· ${dif} min menos de lo previsto</span>`:dif<0?`<span class="slow">· ${-dif} min más</span>`:''}${t.comentario?`<br>“${esc(t.comentario)}”`:''}</div>`
        : `<div class="act">
            ${t.estado==='en_curso'
              ? `<button class="end" data-fin="${t.id}">Terminar limpieza</button>`
              : `<button class="go" data-ini="${t.id}" ${(pendiente||enCurso)?'disabled':''} style="${(pendiente||enCurso)?'background:var(--bg3);color:var(--txt3)':''}">Iniciar limpieza</button>`}
          </div>`}
    </div>`;}).join('');

  if(!ts.length)html+='<div class="ph">No hay tareas en tu orden de hoy.</div>';
  w.innerHTML=html;
  engancharTabs();
  engancharChecklists(w);
  w.querySelectorAll('[data-ini]').forEach(b=>b.onclick=()=>iniciar(b.dataset.ini));
  w.querySelectorAll('[data-fin]').forEach(b=>b.onclick=()=>abrirFin(b.dataset.fin));
}
// Checklist del manual (FOR.APU.00X / PDO.ADL.001). De referencia: se puede palomear
// para no perder el hilo, pero no bloquea el cierre del cuarto.
const PAL='hk_pal_';
function palGet(id){ try{ return JSON.parse(localStorage.getItem(PAL+id)||'[]'); }catch(e){ return []; } }
function palSet(id,arr){ try{ localStorage.setItem(PAL+id,JSON.stringify(arr)); }catch(e){} }
function chklHtml(t){
  const c=t.hk_checklists; const items=(c&&c.hk_checklist_items)||[];
  if(!items.length||t.estado==='terminada')return '';
  items.sort((a,b)=>a.orden-b.orden);
  const hechos=palGet(t.id);
  return `<details class="chkl" ${t.estado==='en_curso'?'open':''}>
    <summary>Checklist · ${esc(c.nombre||'')} <span class="cnt">(${hechos.length}/${items.length})</span></summary>
    <ol>${items.map(i=>`<li class="${hechos.includes(i.id)?'ok':''}">
      <input type="checkbox" data-pal="${t.id}" data-i="${i.id}" ${hechos.includes(i.id)?'checked':''}>
      <span>${esc(i.tarea)}${i.minutos?` <span class="cnt">(${i.minutos} min)</span>`:''}</span></li>`).join('')}</ol>
  </details>`;
}
function engancharChecklists(root){
  root.querySelectorAll('input[data-pal]').forEach(cb=>cb.onchange=()=>{
    const tid=cb.dataset.pal, iid=cb.dataset.i;
    const arr=palGet(tid); const k=arr.indexOf(iid);
    if(cb.checked&&k<0)arr.push(iid); if(!cb.checked&&k>=0)arr.splice(k,1);
    palSet(tid,arr);
    cb.closest('li').classList.toggle('ok',cb.checked);
    const det=cb.closest('details'), tot=det.querySelectorAll('input[data-pal]').length;
    det.querySelector('.cnt').textContent=`(${arr.length}/${tot})`;
  });
}
function engancharTabs(){
  document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{VISTA=b.dataset.v;pintar();});
}

async function iniciar(id){
  const now=new Date().toISOString();
  const {error}=await sb.from('hk_tareas').update({estado:'en_curso',iniciado_at:now,ejecutado_por:USER.id,ejecutado_por_nombre:NOMBRE,updated_at:now}).eq('id',id);
  if(error)return toast('No se pudo iniciar');
  await sb.from('hk_eventos').insert({tarea_id:id,tipo:'inicio',employee_id:EMP,employee_nombre:NOMBRE});
  if(MIA.estado==='validada')await sb.from('hk_asignaciones').update({estado:'en_curso'}).eq('id',MIA.id);
  toast('Limpieza iniciada');cargar();
}

let FIN=null;
function abrirFin(id){
  FIN=id;
  const t=(MIA.hk_tareas||[]).find(x=>x.id===id);const a=t?.hk_areas||{};
  const min=t?.iniciado_at?Math.round((Date.now()-new Date(t.iniciado_at))/60000):0;
  $('shT').textContent='Terminar '+(a.codigo||'');
  $('shS').textContent=`Llevas ${min} min · lo previsto eran ${t?.minutos_estimados} min`;
  $('shM').value='';$('shC').value='';
  $('sh').classList.add('on');
}
$('shX').onclick=()=>{$('sh').classList.remove('on');FIN=null;};
$('shOk').onclick=async()=>{
  if(!FIN)return;
  const btn=$('shOk');btn.disabled=true;
  const now=new Date().toISOString();
  const motivo=$('shM').value||null,com=$('shC').value.trim()||null;
  const {error}=await sb.from('hk_tareas').update({estado:'terminada',terminado_at:now,motivo_codigo:motivo,comentario:com,updated_at:now}).eq('id',FIN);
  btn.disabled=false;
  if(error)return toast('No se pudo cerrar');
  const pal=palGet(FIN);
  await sb.from('hk_eventos').insert({tarea_id:FIN,tipo:'fin',employee_id:EMP,employee_nombre:NOMBRE,nota:com,metadata:{motivo,checklist_palomeado:pal.length}});

};
