<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Mi limpieza · Casa Pepe</title>
<meta name="theme-color" content="#1d9e75">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar .d{margin-left:auto;font-size:12px;color:#cdbf9c}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(30px + var(--safe-b))}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:17px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:2px}
.prog{height:9px;background:var(--bg3);border-radius:99px;margin-top:11px;overflow:hidden}
.pila{margin-top:12px;padding-top:11px;border-top:1px solid var(--bg3)}
.pila .fila{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.pila .et{font-size:10.5px;font-weight:800;color:var(--txt3);width:56px;text-transform:uppercase;letter-spacing:.03em}
.pila .barra{flex:1;height:14px;background:var(--bg3);border-radius:7px;overflow:hidden}
.pila .barra i{display:block;height:100%;border-radius:7px;transition:width .4s}
.pila .est i{background:#c9c3b4}
.pila .rea i{background:var(--accent)}
.pila .rea.lento i{background:var(--bad)}
.pila .rea.curso i{background:linear-gradient(90deg,var(--accent),#5ec49a)}
.pila .val{font-size:12px;font-weight:800;width:62px;text-align:right;font-variant-numeric:tabular-nums}
.pila .pie{font-size:12px;margin-top:4px;font-weight:700}
.pila .pie.bien{color:var(--accent)}.pila .pie.mal{color:var(--bad)}.pila .pie.neutro{color:var(--txt3);font-weight:500}
.card.opc{border-left:3px solid #b8adf0}
.card.libre{opacity:.62;border-style:dashed}
.card.libre .cod{font-weight:700}
.card.opc .cod{color:#4a3d94}
.cuarto.op .cod{color:#4a3d94}
.cuarto.op{border-left:3px solid #b8adf0}
.cuarto.extra{border-left:3px solid var(--gold)}
.chip.op{background:#ece8ff;color:#4a3d94}
.chip.ext{background:#fff0d6;color:#8a6212}
.addbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.addbox.pend{border-color:#e8d4a8;background:#fffdf8}
.addbox .top{display:flex;align-items:center;gap:9px}
.addbox .cod{font-size:16px;font-weight:800;letter-spacing:-.02em}
.addbox .nm{font-size:12.5px;color:var(--txt3);margin-top:3px;line-height:1.45}
.addbox .campos{margin-top:11px;display:flex;flex-direction:column;gap:8px}
.addbox select,.addbox input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;
  background:var(--bg2);color:var(--txt);font:inherit;font-size:15px}
.addbox .act{margin-top:10px}
.inc{border-top:1px solid var(--bg3);padding-top:11px;margin-top:11px}
.inc:first-of-type{border-top:none;padding-top:0}
.inc .q{font-weight:800;font-size:15px}
.inc .d{font-size:12.5px;color:var(--txt3);margin-top:3px;line-height:1.45}
.inc .act{margin-top:9px}
.crono{display:inline-flex;align-items:center;gap:5px;background:#e4eefb;color:#1f5b96;border-radius:99px;padding:3px 9px;font-size:11.5px;font-weight:800;margin-top:7px}
.crono b{font-variant-numeric:tabular-nums}
.prog i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.stats{display:flex;gap:14px;margin-top:9px;font-size:12px;color:var(--txt2)}
.stats b{font-size:15px;display:block;color:var(--txt)}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg3);color:var(--txt2)}
.chip.vs{background:#fbe9e9;color:var(--bad)}.chip.vl{background:#dff0e8;color:#12694d}
.chip.oc{background:#fff0d6;color:#8a6212}.chip.rut{background:#e9e6f5;color:#4a3f8a}
.chip.bl{background:#efe4f7;color:#6b3f8a}
.chip.warn{background:#fff0d6;color:#8a6212}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.done{opacity:.6}
.card.now{border-color:var(--accent);border-width:2px}
.card .top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.card .cod{font-size:20px;font-weight:800;letter-spacing:-.02em}
.card .nm{font-size:12.5px;color:var(--txt3);margin-top:3px}
.card .mn{margin-left:auto;font-size:12px;color:var(--txt3);text-align:right}
.card .mn b{display:block;font-size:14px;color:var(--txt2)}
.act{display:flex;gap:8px;margin-top:11px}
.act button{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.act .go{background:var(--accent);color:#fff}
.act .end{background:var(--gold);color:#16130f}
.act .off{background:var(--bg3);color:var(--txt3)}
.chkl{margin-top:10px;border-top:1px solid var(--bg3);padding-top:8px}
.chkl summary{font-size:12.5px;font-weight:700;color:var(--txt2);cursor:pointer;list-style:none}
.chkl summary::-webkit-details-marker{display:none}
.chkl summary::before{content:"▸ ";color:var(--accent)}
.chkl[open] summary::before{content:"▾ "}
.chkl ol{margin:8px 0 0;padding:0;list-style:none;counter-reset:c}
.chkl li{display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--bg2);font-size:13px;line-height:1.35;color:var(--txt2)}
.chkl li input{width:20px;height:20px;flex:0 0 auto;margin:0;accent-color:var(--accent)}
.chkl li.ok{opacity:.5;text-decoration:line-through}
.chkl .cnt{font-size:11.5px;color:var(--txt3);font-weight:600}
.res{margin-top:9px;font-size:12.5px;color:var(--txt2);background:var(--bg2);border-radius:10px;padding:8px 10px}
.res .fast{color:var(--accent);font-weight:700}.res .slow{color:var(--bad);font-weight:700}
.ph{text-align:center;color:var(--txt3);padding:40px 16px;font-size:14px;line-height:1.5}
.sheet{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .bx{background:#fff;width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(20px + var(--safe-b))}
.sheet h3{margin:0 0 4px;font-size:17px}
.sheet .s{font-size:12.5px;color:var(--txt3);margin-bottom:14px}
.sheet label{display:block;font-size:12px;font-weight:700;color:var(--txt2);margin:12px 0 5px}
.sheet select,.sheet textarea{width:100%;border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;background:var(--bg2);color:var(--txt)}
.sheet textarea{min-height:78px;resize:vertical}
.sheet .btns{display:flex;gap:8px;margin-top:16px}
.sheet .btns button{flex:1;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
.sheet .btns .ok{background:var(--accent);color:#fff}
.sheet .btns .no{background:var(--bg3);color:var(--txt2)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:12px;padding:10px;font-size:13px;font-weight:700;color:var(--txt2);cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.vbox{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:13px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.vbox .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800}
.vbox ul{margin:9px 0 0;padding:0;list-style:none;font-size:13px;color:var(--txt2)}
.vbox li{display:flex;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--bg3)}
.vbox li b{min-width:46px}
.vbox li select{margin-left:auto;border:1px solid var(--bd);border-radius:8px;padding:4px 6px;font-size:11.5px;background:#fff;max-width:120px}
/* piso plegable dentro del reparto */
.piso{border-top:1px solid var(--bg3);margin-top:8px}
.piso>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 2px 8px;font-size:12.5px;font-weight:800;color:var(--txt2)}
.piso>summary::-webkit-details-marker{display:none}
.piso>summary::before{content:"▸";color:var(--accent);font-size:13px}
.piso[open]>summary::before{content:"▾"}
.piso>summary .n{margin-left:auto;font-weight:600;color:var(--txt3);font-size:11.5px}
.cuarto{border-top:1px solid var(--bg2);padding:10px 2px}
.cuarto .lin{display:flex;align-items:center;gap:9px;cursor:pointer}
.cuarto .cod{font-size:19px;font-weight:800;letter-spacing:-.02em;min-width:56px}
.cuarto .min{margin-left:auto;font-size:12px;color:var(--txt3);font-variant-numeric:tabular-nums}
.cuarto .fle{color:var(--txt3);font-size:12px;transition:transform .2s}
.cuarto.on .fle{transform:rotate(90deg)}
.cuarto .quien{font-size:11px;color:var(--txt3)}
.cuarto .caja{display:none;padding:9px 0 3px}
.cuarto.on .caja{display:block}
.cuarto.curso{background:#f4f9ff;border-radius:12px;padding:10px}
.cuarto.hecha .cod{opacity:.5}
.cuarto .btn{width:100%;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:800;cursor:pointer}
.cuarto .btn.go{background:var(--accent);color:#fff}
.cuarto .btn.end{background:var(--gold);color:#16130f}
.cuarto .btn.off{background:var(--bg3);color:var(--txt3)}
.cuarto .hecho{font-size:13px;color:var(--txt2);background:var(--bg2);border-radius:10px;padding:9px 11px}
.cuarto .hecho .rap{color:var(--accent);font-weight:800}
.cuarto .hecho .len{color:var(--bad);font-weight:800}
/* mensaje de ánimo */
#msg{position:fixed;left:12px;right:12px;top:calc(var(--safe-t) + 62px);z-index:70;background:#16130f;color:#f4ecdd;border-radius:16px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.28);opacity:0;transform:translateY(-14px);transition:opacity .3s,transform .3s;pointer-events:none;max-width:496px;margin:0 auto}
#msg.on{opacity:1;transform:translateY(0)}
#msg .tx{font-size:14.5px;line-height:1.4}
#msg .au{font-size:11.5px;color:var(--gold);margin-top:6px;font-weight:700}
#msg.bien{background:#12694d}#msg.lento{background:#5c3a3a}
.big{width:100%;border:none;border-radius:14px;padding:16px;font-size:16px;font-weight:800;background:var(--gold);color:#16130f;cursor:pointer;margin-top:6px}
.big.pri{background:var(--accent);color:#fff}
.big:disabled{opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--safe-b));background:#16130f;color:#fff;padding:11px 18px;border-radius:99px;font-size:13.5px;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style></head><body>

<div class="appbar">
  <button class="bk" onclick="location.href='/soypepe/'">‹</button>
  <span class="t">🧹 <b id="titulo">Mi limpieza</b></span>
  <select id="sede" hidden style="margin-left:auto;background:#2b2620;color:#f4ecdd;border:1px solid #3a3228;border-radius:9px;padding:5px 8px;font-size:12px">
    <option value="45e69775-d877-4507-a9e1-a45bd3400dc5">CDMX</option>
    <option value="febfbef6-7fd1-4b45-84d9-13533e8dcb72">Puebla</option>
  </select>
  <span class="d" id="hoy"></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>

<!-- Sheet cerrar cuarto -->
<div class="sheet" id="sh"><div class="bx">
  <h3 id="shT">Terminar limpieza</h3>
  <div class="s" id="shS"></div>
  <label>¿Pasó algo con este cuarto?</label>
  <select id="shM"><option value="">Todo normal</option></select>
  <label>Comentario (opcional)</label>
  <textarea id="shC" placeholder="Ej. la habitación estaba muy sucia, había fiesta…"></textarea>
  <div class="btns"><button class="no" id="shX">Cancelar</button><button class="ok" id="shOk">Terminar</button></div>
</div></div>

<div class="toast" id="tst"></div>
<div id="msg"><div class="tx"></div><div class="au"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const FECHA=hoyMX();
const CH={vacia_limpia:['vl','Refresco'],vacia_sucia:['vs','Salida · a fondo'],ocupada:['oc','En casa'],ocupada_blancos:['bl','En casa · cambio de blancos'],rutina:['rut','Rutina']};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hhmm=t=>t?String(t).slice(0,5):'';
let EMP=null,NOMBRE=null,USER=null,MOTIVOS=[],MIA=null,TODAS=[],VISTA='mia',ANTES_N=0;
// Quien supervisa ve el reparto de todas las recamaristas del día, tenga o no
// cuartos propios. El ama de llaves lo ve siempre por su turno.
const SUPERVISORES=['javi@casapepe.mx','hola.puebla@casapepe.mx','hola.cdmx@casapepe.mx','housekeeping.cdmx@casapepe.mx','housekeeping.puebla@casapepe.mx'];
const PROPS_CON_CUARTOS=['45e69775-d877-4507-a9e1-a45bd3400dc5','febfbef6-7fd1-4b45-84d9-13533e8dcb72'];
let ES_SUPER=false, PROP=null;

$('hoy').textContent=new Date(FECHA+'T12:00:00').toLocaleDateString('es-MX',{weekday:'short',day:'numeric',month:'short'});
function toast(t){const e=$('tst');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200);}

// Mensajes de ánimo del marco conceptual de Casa Pepe. No se repiten: se guarda
// en el propio teléfono cuáles ya vio y se elige entre las que quedan.
let FRASES={};
const VISTAS='hk_frases_vistas';
async function cargarFrases(){
  try{
    const {data}=await sb.from('hk_frases').select('id,momento,texto,autor').eq('activo',true);
    FRASES={};
    (data||[]).forEach(f=>(FRASES[f.momento]=FRASES[f.momento]||[]).push(f));
  }catch(e){ FRASES={}; }
}
function fraseDe(momento){
  const lista=FRASES[momento]||[]; if(!lista.length) return null;
  let vistas=[]; try{ vistas=JSON.parse(localStorage.getItem(VISTAS)||'[]'); }catch(e){}
  let libres=lista.filter(f=>!vistas.includes(f.id));
  if(!libres.length){ vistas=vistas.filter(id=>!lista.some(f=>f.id===id)); libres=lista; }
  const f=libres[Math.floor(Math.random()*libres.length)];
  vistas.push(f.id); if(vistas.length>60) vistas=vistas.slice(-60);
  try{ localStorage.setItem(VISTAS,JSON.stringify(vistas)); }catch(e){}
  return f;
}
let MSG_T=null;
function mensaje(momento,tipo){
  const f=fraseDe(momento); if(!f) return;
  const e=$('msg');
  e.className=tipo||'';
  e.querySelector('.tx').textContent=f.texto;
  e.querySelector('.au').textContent=f.autor?('— '+f.autor):'';
  requestAnimationFrame(()=>e.classList.add('on'));
  clearTimeout(MSG_T);
  MSG_T=setTimeout(()=>e.classList.remove('on'),6000);
}

async function arranca(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){location.href='/soypepe/';return;}
  USER=session.user;
  const {data:link}=await sb.from('empleado_login').select('employee_id,nombre_display,nombre_completo').eq('user_id',USER.id).maybeSingle();
  if(!link){$('wrap').innerHTML='<div class="ph">Tu usuario todavía no está ligado a un colaborador.<br>Avísale a tu jefe de área.</div>';return;}
  EMP=link.employee_id;NOMBRE=link.nombre_display||link.nombre_completo;
  const correo=(USER.email||'').toLowerCase();
  ES_SUPER=SUPERVISORES.includes(correo);
  if(ES_SUPER){
    let suya=null;
    try{ const {data:emp}=await sb.from('v_empleados_publico').select('property_id').eq('id',EMP).maybeSingle(); suya=emp?.property_id||null; }catch(e){}
    PROP=PROPS_CON_CUARTOS.includes(suya)?suya:PROPS_CON_CUARTOS[0];
    const sel=$('sede'); sel.hidden=false; sel.value=PROP;
    sel.onchange=()=>{ PROP=sel.value; cargar(); };
    $('titulo').textContent='Limpieza del día';
  }
  const {data:m}=await sb.from('hk_motivos').select('*').eq('activo',true).order('orden');
  MOTIVOS=m||[];
  $('shM').innerHTML='<option value="">Todo normal</option>'+MOTIVOS.map(x=>`<option value="${x.codigo}">${esc(x.nombre)}</option>`).join('');
  await cargarFrases();
  await cargar();
  vigilarCambios();
}

// Si el ama de llaves mueve un cuarto o valida el reparto mientras tienes la
// pantalla abierta, se actualiza sola. Si el realtime no llega, al volver a la
// app se recarga igual.
let CANAL=null, RECARGA=null;
function recargaSuave(){
  if(FIN) return;              // no interrumpir mientras cierra un cuarto
  clearTimeout(RECARGA);
  RECARGA=setTimeout(()=>cargar(), 600);
}
function vigilarCambios(){
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden) recargaSuave(); });
  try{
    if(CANAL) return;
    CANAL = sb.channel('hk-limpieza')
      .on('postgres_changes',{event:'*',schema:'public',table:'hk_tareas'},()=>recargaSuave())
      .on('postgres_changes',{event:'*',schema:'public',table:'hk_asignaciones'},()=>recargaSuave())
      .subscribe();
  }catch(e){ /* sin realtime: queda el visibilitychange */ }
}

async function cargar(){
  const {data:mias}=await sb.from('hk_asignaciones')
    .select('*,hk_tareas(*,hk_areas(codigo,nombre,tipo,piso),hk_tareas_op(codigo,nombre,hora_sugerida,metadata),hk_checklists:checklist_id(id,nombre,hk_checklist_items(id,orden,tarea,minutos)))')
    .eq('fecha',FECHA).eq('employee_id',EMP);
  const antes = MIA ? MIA.estado : null;
  MIA=(mias||[])[0]||null;
  if(antes && MIA && antes==='propuesta' && MIA.estado!=='propuesta') toast('El ama de llaves ya validó tu reparto');
  if(antes && MIA && (MIA.hk_tareas||[]).length!==ANTES_N) toast('Tu lista de hoy cambió');
  ANTES_N=(MIA&&MIA.hk_tareas)?MIA.hk_tareas.length:0;
  if(!PROP && MIA) PROP=MIA.property_id;
  await cargarZonasYExtras();
  const veTodas = ES_SUPER || (MIA&&MIA.turno==='ama_llaves');
  if(veTodas && PROP){
    const {data:t}=await sb.from('hk_asignaciones')
      .select('*,hk_tareas(id,orden,estatus_area,minutos_estimados,minutos_reales,estado,iniciado_at,comentario,pase,pases,partes,es_extra,tarea_op_id,hk_areas(codigo,nombre,piso),hk_tareas_op(nombre,hora_sugerida))')
      .eq('fecha',FECHA).eq('property_id',PROP).order('turno');
    TODAS=t||[];
    if(!MIA) VISTA='rep';
  }
  pintar();
}

function pintar(){
  const w=$('wrap');
  const veTodas = ES_SUPER || (MIA&&MIA.turno==='ama_llaves');
  if(!MIA && !veTodas){w.innerHTML='<div class="ph">Hoy no tienes cuartos asignados.<br><br>Si crees que es un error, avísale al ama de llaves.</div>';return;}
  if(!MIA) VISTA='rep';

    html+=TODAS.map(a=>{

      }).join('');

        <span class="chip">${hhmm(a.hora_inicio)}–${hhmm(a.hora_fin)}</span>
        ${a.pisos?.length?`<span class="chip">piso ${a.pisos.join(', ')}</span>`:''}
        <span class="chip ${a.metadata?.carga_pct>100?'vs':'warn'}">${hechas}/${ts.length} · ${a.minutos_estimados} min</span></div>

    w.innerHTML=html;
    engancharTabs();
    engancharCuartos(w);
    arrancarReloj();
    const bv=$('btnVal');
    if(bv)bv.onclick=async()=>{

    };

  }

  // ---- mis cuartos ----
  const ts=(MIA.hk_tareas||[]).sort((a,b)=>a.orden-b.orden);

  html+=`<div class="hero">
    <div class="n">${esc(NOMBRE||'')}</div>

        : `<div class="act">

          </div>`}

  if(!ts.length)html+='<div class="ph">No hay tareas en tu orden de hoy.</div>';

  w.innerHTML=html;
  engancharTabs();
  engancharChecklists(w);
  engancharAnadir(w);

  arrancarReloj();

// Checklist del manual (FOR.APU.00X / PDO.ADL.001). De referencia: se puede palomear
// para no perder el hilo, pero no bloquea el cierre del cuarto.
const PAL='hk_pal_';
function palGet(id){ try{ return JSON.parse(localStorage.getItem(PAL+id)||'[]'); }catch(e){ return []; } }
function palSet(id,arr){ try{ localStorage.setItem(PAL+id,JSON.stringify(arr)); }catch(e){} }
function chklHtml(t){
  const c=t.hk_checklists; const items=(c&&c.hk_checklist_items)||[];
  if(!items.length||t.estado==='terminada')return '';
  items.sort((a,b)=>a.orden-b.orden);
  const hechos=palGet(t.id);
  return `<details class="chkl" ${t.estado==='en_curso'?'open':''}>
    <summary>Checklist · ${esc(c.nombre||'')} <span class="cnt">(${hechos.length}/${items.length})</span></summary>
    <ol>${items.map(i=>`<li class="${hechos.includes(i.id)?'ok':''}">
      <input type="checkbox" data-pal="${t.id}" data-i="${i.id}" ${hechos.includes(i.id)?'checked':''}>
      <span>${esc(i.tarea)}${i.minutos?` <span class="cnt">(${i.minutos} min)</span>`:''}</span></li>`).join('')}</ol>
  </details>`;
}
function engancharChecklists(root){
  root.querySelectorAll('input[data-pal]').forEach(cb=>cb.onchange=()=>{
    const tid=cb.dataset.pal, iid=cb.dataset.i;
    const arr=palGet(tid); const k=arr.indexOf(iid);
    if(cb.checked&&k<0)arr.push(iid); if(!cb.checked&&k>=0)arr.splice(k,1);
    palSet(tid,arr);
    cb.closest('li').classList.toggle('ok',cb.checked);
    const det=cb.closest('details'), tot=det.querySelectorAll('input[data-pal]').length;
    det.querySelector('.cnt').textContent=`(${arr.length}/${tot})`;
  });
}
// Una fila de cuarto que se abre al tocarla y trae Iniciar / Terminar / el tiempo.
function tarjetaCuarto(t,a){
  const ar=t.hk_areas||{}, op=t.hk_tareas_op;
  const c=op?['op',op.hora_sugerida?String(op.hora_sugerida).slice(0,5):'tarea']:(CH[t.estatus_area]||['rut','—']);
  const dif=t.minutos_reales!=null?(t.minutos_estimados-Number(t.minutos_reales)):null;
  const mio = a && EMP && a.employee_id===EMP;
  const puede = ES_SUPER || mio;
  let caja='';
  if(t.estado==='terminada'){
    caja=`<div class="hecho">Hecho en <b>${t.minutos_reales} min</b> de ${t.minutos_estimados} estimados
      ${dif>0?`· <span class="rap">${dif} min menos</span>`:dif<0?`· <span class="len">${-dif} min más</span>`:''}
      ${t.comentario?`<br>“${esc(t.comentario)}”`:''}</div>`;
  }else if(t.estado==='en_curso'){
    caja=puede?`<button class="btn end" data-fin="${t.id}">Terminar · <b data-crono="${t.iniciado_at}">0 min</b></button>`
              :`<div class="hecho">En limpieza desde las ${new Date(t.iniciado_at).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',timeZone:'America/Mexico_City'})}</div>`;
  }else{
    caja=puede?`<button class="btn go" data-ini="${t.id}">Empezar limpieza</button>`
              :`<div class="hecho">Sin empezar · ${t.minutos_estimados} min estimados</div>`;
  }
  return `<div class="cuarto ${op?'op':''} ${t.es_extra&&!t.reasignada_desde?'extra':''} ${t.estado==='en_curso'?'curso':''} ${t.estado==='terminada'?'hecha':''}" data-c="${t.id}">
    <div class="lin">
      <span class="cod">${esc(op?op.nombre:(ar.codigo||''))}</span>
      <span class="chip ${c[0]}">${c[1]}</span>
      ${t.pases>1?`<span class="chip">pase ${t.pase}/${t.pases}</span>`:''}
      ${t.partes>1?`<span class="chip">entre ${t.partes}</span>`:''}
      ${t.es_extra&&!t.reasignada_desde?'<span class="chip ext">extra</span>':''}
      <span class="min">${t.minutos_reales!=null?`${t.minutos_reales}m / ${t.minutos_estimados}m`:`${t.minutos_estimados}m`}</span>
      <span class="fle">▸</span>

function engancharCuartos(root){
  root.querySelectorAll('.cuarto .lin').forEach(l=>l.onclick=()=>l.parentElement.classList.toggle('on'));

// Busca una tarea esté donde esté (mi orden o el reparto completo).
function buscarTarea(id){
  for(const a of [MIA,...TODAS].filter(Boolean)){
    const t=(a.hk_tareas||[]).find(x=>x.id===id);
    if(t) return {t,a};
  }
  return {t:null,a:null};
}

// Pila de estimado vs real: lo que se esperaba de los cuartos que ya cerró,
// contra lo que de verdad tardó. El cuarto en curso cuenta en vivo.
function minutosEnCurso(){
  const t=(MIA?.hk_tareas||[]).find(x=>x.estado==='en_curso');
  if(!t||!t.iniciado_at) return {min:0,tarea:null};
  return {min:(Date.now()-new Date(t.iniciado_at))/60000, tarea:t};
}
function pintarPila(){
  const box=$('pilaBox'); if(!box||!MIA) return;
  const ts=MIA.hk_tareas||[];
  const hechas=ts.filter(t=>t.minutos_reales!=null);
  const enCurso=minutosEnCurso();
  const estHechas=hechas.reduce((s,t)=>s+(t.minutos_estimados||0),0) + (enCurso.tarea?.minutos_estimados||0);
  const real=hechas.reduce((s,t)=>s+Number(t.minutos_reales||0),0) + enCurso.min;
  const estDia=ts.reduce((s,t)=>s+(t.minutos_estimados||0),0);

  if(!hechas.length && !enCurso.tarea){
    box.innerHTML=`<div class="pie neutro">Cuando pulses «Iniciar limpieza» empezamos a contar. Hoy tienes ${Math.round(estDia/60*10)/10} h estimadas.</div>`;
    return;
  }
  const tope=Math.max(estHechas,real,1);
  const lento=real>estHechas;
  const dif=Math.round(Math.abs(estHechas-real));
  const hm=m=>m>=60?`${Math.floor(m/60)}h ${Math.round(m%60)}m`:`${Math.round(m)} min`;
  box.innerHTML=`
    <div class="fila"><span class="et">Estimado</span>
      <span class="barra est"><i style="width:${Math.round(estHechas/tope*100)}%"></i></span>
      <span class="val">${hm(estHechas)}</span></div>
    <div class="fila"><span class="et">Real</span>
      <span class="barra rea ${lento?'lento':''} ${enCurso.tarea?'curso':''}"><i style="width:${Math.round(real/tope*100)}%"></i></span>
      <span class="val">${hm(real)}</span></div>
    <div class="pie ${lento?'mal':'bien'}">${lento
      ? `Llevas ${dif} min de más sobre lo estimado`
      : `Vas ${dif} min por delante de lo estimado`}${enCurso.tarea?' · contando el cuarto en curso':''}</div>
    ${hechas.length===ts.length?`<div class="pie neutro" style="margin-top:2px">Día cerrado: ${hm(real)} reales contra ${hm(estDia)} estimadas.</div>`:''}`;
}

// Refresca el cronómetro y la pila cada 20 s mientras hay un cuarto abierto,
// sin repintar la pantalla (para no cerrar los checklists desplegados).
let RELOJ=null;
function arrancarReloj(){
  clearInterval(RELOJ);
  const hay=(MIA?.hk_tareas||[]).some(t=>t.estado==='en_curso');
  const tic=()=>{
    document.querySelectorAll('[data-crono]').forEach(el=>{
      const ini=el.getAttribute('data-crono'); if(!ini)return;
      el.textContent=Math.round((Date.now()-new Date(ini))/60000)+' min';
    });
    pintarPila();
  };
  tic();
  if(hay) RELOJ=setInterval(tic,20000);
}

// Añadir una limpieza que no venía en el reparto: un segundo repaso de baños,

// Un cuarto que hoy no daba trabajo entra con 0 min. Si la recamarista lo limpia
// igual, se le pone el tiempo estándar para que la pila y la eficiencia cuadren.
async function tiempoEstandar(t){
  const ar=t.hk_areas||{};
  const {data}=await sb.from('hk_tiempos').select('minutos')
    .eq('property_id',PROP).eq('tipo_area',ar.tipo).eq('estatus',t.estatus_area||'rutina').maybeSingle();
  return data?.minutos || (ar.tipo==='privada'?20:ar.tipo==='dorm'?30:15);
}

async function iniciar(id){
  const now=new Date().toISOString();
  const {t,a}=buscarTarea(id);
  const campos={estado:'en_curso',iniciado_at:now,ejecutado_por:USER.id,ejecutado_por_nombre:NOMBRE,updated_at:now};
  if(t && t.metadata?.sin_trabajo && !t.minutos_estimados){
    campos.minutos_estimados=await tiempoEstandar(t);
    campos.es_extra=true;
    campos.metadata={...(t.metadata||{}),sin_trabajo:false,se_limpio_igual:true};
  }
  const {error}=await sb.from('hk_tareas').update(campos).eq('id',id);
  if(error)return toast('No se pudo iniciar');
  await sb.from('hk_eventos').insert({tarea_id:id,tipo:'inicio',employee_id:EMP,employee_nombre:NOMBRE});
  if(a&&a.estado==='validada')await sb.from('hk_asignaciones').update({estado:'en_curso'}).eq('id',a.id);
  mensaje('inicio');
  cargar();
}

let FIN=null;
function abrirFin(id){
  FIN=id;
  const {t}=buscarTarea(id);const a=t?.hk_areas||{};
  const min=t?.iniciado_at?Math.round((Date.now()-new Date(t.iniciado_at))/60000):0;
  $('shT').textContent='Terminar '+(a.codigo||'');
  $('shS').textContent=`Llevas ${min} min · lo previsto eran ${t?.minutos_estimados} min`;
  $('shM').value='';$('shC').value='';
  $('sh').classList.add('on');
}
$('shX').onclick=()=>{$('sh').classList.remove('on');FIN=null;};
$('shOk').onclick=async()=>{
  if(!FIN)return;
  const btn=$('shOk');btn.disabled=true;
  const now=new Date().toISOString();
  const motivo=$('shM').value||null,com=$('shC').value.trim()||null;
  const {error}=await sb.from('hk_tareas').update({estado:'terminada',terminado_at:now,motivo_codigo:motivo,comentario:com,updated_at:now}).eq('id',FIN);
  btn.disabled=false;
  if(error)return toast('No se pudo cerrar');
  const pal=palGet(FIN);
  await sb.from('hk_eventos').insert({tarea_id:FIN,tipo:'fin',employee_id:EMP,employee_nombre:NOMBRE,nota:com,metadata:{motivo,checklist_palomeado:pal.length}});
  try{ localStorage.removeItem(PAL+FIN); }catch(e){}
  // ¿fue rápido, justo o largo? el mensaje cambia según eso
  const {t:tf,a:af}=buscarTarea(FIN);
  const est=tf?.minutos_estimados||0;
  const real=tf?.iniciado_at?(Date.now()-new Date(tf.iniciado_at))/60000:est;
  const ultimo = af ? (af.hk_tareas||[]).filter(x=>x.id!==FIN).every(x=>x.estado==='terminada') : false;
  $('sh').classList.remove('on');FIN=null;
  if(ultimo) mensaje('dia_cerrado','bien');
  else if(est&&real<est*0.9) mensaje('fin_rapido','bien');
  else if(est&&real>est*1.1) mensaje('fin_lento','lento');
  else mensaje('fin_justo','bien');
  cargar();
};

arranca();
</script></body></html>
