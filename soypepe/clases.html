<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clases · SoyPepe</title>
<style>
:root{--bg:#f4ecdd;--surface:#fff;--txt:#2b2017;--soft:#6b5d49;--accent:#1d9e75;--gold:#C9A227;--bd:#e3d8c3}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;-webkit-tap-highlight-color:transparent}
header{background:#2b2017;color:#f4ecdd;padding:12px 16px;display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--gold)}
header a{color:#cdbf9c;text-decoration:none;font-size:20px;line-height:1}
header .ttl{font-weight:700;font-size:16px}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.card{background:var(--surface);border:1px solid var(--bd);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(0,0,0,.05);margin-bottom:14px}
.emoji{font-size:44px;line-height:1}
.title{font-size:22px;font-weight:800;margin:6px 0 2px}
.meta{color:var(--soft);font-size:14px;line-height:1.5}
.meta b{color:var(--txt)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;background:#eaf6f0;color:#137a59}
.chip.gold{background:#fbf3e0;color:#8a5a00}
.desc{margin:10px 0 0;line-height:1.55}
.nota{margin-top:10px;background:#fbf3e0;border-radius:10px;padding:10px 12px;font-size:14px;color:#7a5a10}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;margin-top:4px}
.btn.join{background:var(--accent);color:#fff}
.btn.leave{background:#fff;color:#b03434;border:1.5px solid #e0b3b3}
.btn:disabled{opacity:.6}
.count{font-weight:800;font-size:15px;margin:0 0 8px}
.who{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #f0e8d8;font-size:14px}
.who:last-child{border-bottom:none}
.av{width:30px;height:30px;border-radius:50%;background:#efe6d4;display:flex;align-items:center;justify-content:center;font-weight:800;color:#8a7a55;font-size:13px;flex-shrink:0}
.rm{margin-left:auto;border:1px solid #e0b3b3;background:#fff;color:#b03434;border-radius:8px;padding:3px 8px;font-size:12px;cursor:pointer}
.adminbadge{display:inline-block;background:#2b2017;color:var(--gold);font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;margin-left:6px}
.muted{color:var(--soft);font-size:13px}
.status{text-align:center;color:var(--soft);font-size:13px;min-height:18px;margin-top:6px}
.status.ok{color:var(--accent);font-weight:700}.status.err{color:#b03434;font-weight:700}
</style></head><body>
<header><a href="/soypepe/">←</a><span class="ttl">Clases</span></header>
<div class="wrap" id="wrap"><div class="card"><div class="muted">Cargando…</div></div></div>

<script>
const SB='https://rehophywchakfapivsbh.supabase.co/rest/v1';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let ME={email:'',uid:'',empId:null,nombre:''};
try{const _r=localStorage.getItem('sb-rehophywchakfapivsbh-auth-token');if(_r){const _j=JSON.parse(_r);const _t=_j.access_token||(_j.currentSession&&_j.currentSession.access_token)||(_j.session&&_j.session.access_token);if(_t){H.Authorization='Bearer '+_t;var _p=_t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');var _d=JSON.parse(atob(_p+'==='.slice((_p.length+3)%4)))||{};ME.email=(_d.email||'').toLowerCase();ME.uid=_d.sub||'';}}}catch(e){}

const $=id=>document.getElementById(id);
async function sb(p,o){const r=await fetch(SB+p,{headers:H,...o});if(!r.ok)throw new Error(await r.text());const c=await r.text();return c?JSON.parse(c):null}
function esc(s){return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ini(n){return (n||'?').trim().charAt(0).toUpperCase()}

let CLASE=null, INS=[];

async function whoAmI(){
  if(!ME.uid)return;
  try{const l=await sb('/empleado_login?select=employee_id,nombre_display&user_id=eq.'+ME.uid+'&limit=1');
    if(l&&l[0]){ME.empId=l[0].employee_id;ME.nombre=l[0].nombre_display||'';}}catch(e){}
  if(ME.empId && !ME.nombre){try{const e=await sb('/employees?select=nombre_display,nombre&id=eq.'+ME.empId+'&limit=1');if(e&&e[0])ME.nombre=e[0].nombre_display||e[0].nombre||'';}catch(_){}}
}
async function load(){
  await whoAmI();
  let cs=[]; try{cs=await sb('/clases?select=*&activa=is.true&order=created_at&limit=1');}catch(e){}
  if(!cs||!cs.length){$('wrap').innerHTML='<div class="card"><div class="muted">Aún no hay clases disponibles.</div></div>';return;}
  CLASE=cs[0];
  try{INS=await sb('/clase_inscritos?select=employee_id,nombre_display,apuntado&clase_id=eq.'+CLASE.id+'&apuntado=is.true&order=created_at')||[];}catch(e){INS=[];}
  render();
}
function amIn(){return ME.empId && INS.some(x=>x.employee_id===ME.empId);}
function isAdmin(){return CLASE && ME.email && ME.email===(CLASE.admin_email||'').toLowerCase();}

function render(){
  const c=CLASE, dentro=amIn(), admin=isAdmin();
  const list=INS.map(x=>`<div class="who"><div class="av">${ini(x.nombre_display)}</div><div>${esc(x.nombre_display||'Pepe')}${x.employee_id===CLASE.imparte_emp?' · <span class="muted">imparte</span>':''}</div>${admin&&x.employee_id!==ME.empId?`<button class="rm" data-rm="${x.employee_id}">quitar</button>`:''}</div>`).join('');
  $('wrap').innerHTML=`
  <div class="card">
    <div class="emoji">${c.emoji||'📚'}</div>
    <div class="title">${esc(c.titulo)}</div>
    <div class="meta"><b>${esc(c.dias||'')}</b>${c.hora?' · '+esc(c.hora):''}</div>
    <div class="meta">Imparte: <b>${esc(c.imparte_nombre||'')}</b></div>
    <div class="chips">${c.autorizado_por?`<span class="chip">Autorizado por ${esc(c.autorizado_por)}</span>`:''}${c.gratuito?'<span class="chip gold">Gratuito</span>':''}</div>
    ${c.descripcion?`<div class="desc">${esc(c.descripcion)}</div>`:''}
    ${c.nota?`<div class="nota">${esc(c.nota)}</div>`:''}
    ${ME.empId?
      (dentro?`<button class="btn leave" id="tgl">Salir de la clase</button>`
             :`<button class="btn join" id="tgl">¡Me apunto! 🙌</button>`)
      :`<div class="status">Abre esta página desde SoyPepe (con tu sesión iniciada) para apuntarte.</div>`}
    <div class="status" id="st"></div>
  </div>
  <div class="card">
    <div class="count">Apuntados: ${INS.length}${admin?'<span class="adminbadge">Eres el admin</span>':''}</div>
    ${list||'<div class="muted">Todavía nadie se ha apuntado. ¡Sé el primero!</div>'}
  </div>`;
  const t=$('tgl'); if(t) t.onclick=toggle;
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>quitar(b.dataset.rm));
}
function stat(m,c){const s=$('st');if(s){s.textContent=m||'';s.className='status'+(c?' '+c:'');}}
async function toggle(){
  if(!ME.empId){stat('No encontramos tu ficha. Avisa a RH.','err');return;}
  const dentro=amIn(); const t=$('tgl'); if(t)t.disabled=true; stat('Guardando…');
  try{
    if(dentro){
      await sb('/clase_inscritos?clase_id=eq.'+CLASE.id+'&employee_id=eq.'+ME.empId,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({apuntado:false,updated_at:new Date().toISOString()})});
    }else{
      await sb('/clase_inscritos?on_conflict=clase_id,employee_id',{method:'POST',headers:{...H,Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({clase_id:CLASE.id,employee_id:ME.empId,nombre_display:ME.nombre||'Pepe',apuntado:true,updated_at:new Date().toISOString()})});
    }
    await load(); stat(dentro?'Saliste de la clase.':'¡Listo, quedaste apuntado! 🎉','ok');
  }catch(e){stat('No se pudo. Intenta de nuevo.','err');if(t)t.disabled=false;}
}
async function quitar(empId){
  if(!confirm('¿Quitar a esta persona de la clase?'))return;
  try{await sb('/clase_inscritos?clase_id=eq.'+CLASE.id+'&employee_id=eq.'+empId,{method:'PATCH',headers:{...H,Prefer:'return=minimal'},body:JSON.stringify({apuntado:false,updated_at:new Date().toISOString()})});await load();}catch(e){alert('No se pudo quitar.');}
}
load();
</script></body></html>
