<!doctype html><html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Clases · Soy Pepe</title>
<style>
:root{--bg:#fff;--txt:#16130f;--soft:#6b5d49;--muted:#9a8c74;--line:#eadfce;--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f4ecdd;color:var(--txt);font-size:15px}
header{background:#16130f;color:#fff;padding:calc(12px + var(--safe-t)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
header a{color:#cdbf9c;text-decoration:none;font-size:13px}header .ttl{font-weight:700}header .ttl b{color:var(--gold)}
.wrap{max-width:680px;margin:0 auto;padding:12px 12px calc(40px + var(--safe-b))}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1.t{font-size:20px;margin:0 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:8px}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 4px}
.wk b{font-size:15px;font-variant-numeric:tabular-nums}
.nav{border:1px solid var(--line);background:#fffdf8;border-radius:10px;width:40px;height:36px;font-size:16px;cursor:pointer;color:var(--txt)}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-top:1px solid var(--line)}
.row .d{width:60px;font-weight:700;font-size:13px;color:var(--soft);line-height:1.2}
.row .info{flex:1;min-width:0}.row .info .nm{font-weight:600}.row .info .mt{font-size:12px;color:var(--muted)}
.btn{border:1.5px solid var(--txt);background:#fff;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;cursor:pointer;color:var(--txt);white-space:nowrap}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.closed{color:var(--muted);font-size:13px;white-space:nowrap}
.state{text-align:center;color:var(--muted);padding:24px}
.ap{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.ap .dd{font-weight:700;color:var(--soft)}
.ap .who{color:var(--soft)}
.msg{font-size:12px;font-weight:600;margin-top:6px;min-height:14px}.msg.ok{color:var(--accent)}.msg.err{color:var(--bad)}
.field label{display:block;font-size:12px;color:var(--soft);font-weight:600;margin:10px 0 4px}
.field input{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;font-size:16px}
.blogin{display:block;width:100%;background:var(--accent);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;cursor:pointer;margin-top:10px}
.note{background:#fff7e6;border-left:3px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:12px;color:#6b5320;margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head><body>
<script>if(new URLSearchParams(location.search).get('embed')==='1'){var _s=document.createElement('style');_s.textContent='header{display:none!important}body{background:#f4ecdd}.wrap{padding-top:12px!important}';document.documentElement.appendChild(_s);}</script>
<header><a href="./">← Soy Pepe</a><span class="ttl">Clases · <b>Casa Pepe</b></span></header>
<div class="wrap" id="wrap"><div class="state">Cargando…</div></div>

<div class="wrap" id="loginWrap" style="display:none">
<div class="card">
<h3 style="margin:0 0 4px">Inicia sesión</h3>
<div class="sub">Entra con tu correo y contraseña de Soy Pepe.</div>
<div class="field"><label>Correo</label><input id="l_email" type="email" inputmode="email"></div>
<div class="field"><label>Contraseña</label><input id="l_pass" type="password"></div>
<button class="blogin" id="l_btn" onclick="doLogin()">Entrar</button>
<div class="msg" id="l_msg"></div>
</div>
</div>

<script>
const SBURL='https://rehophywchakfapivsbh.supabase.co';
const ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y';
const sb=supabase.createClient(SBURL,ANON);
const $=id=>document.getElementById(id);
let ME=null, CLASES=[], INSCR=[], weekOff=0;
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function norm(s){return (s||'').toString().toLowerCase().split('á').join('a').split('é').join('e').split('í').join('i').split('ó').join('o').split('ú').join('u');}
function esc(s){return (''+(s==null?'':s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function short(d){return d.getDate()+' '+MES[d.getMonth()];}
function mondayOf(off){const t=new Date();t.setHours(0,0,0,0);const wd=(t.getDay()+6)%7;t.setDate(t.getDate()-wd+off*7);return t;}
function weekDays(off){const m=mondayOf(off);const out=[];for(let i=0;i<7;i++){const d=new Date(m);d.setDate(m.getDate()+i);out.push(d);}return out;}

async function boot(){
const {data:{session}}=await sb.auth.getSession();
if(!session){$('wrap').style.display='none';$('loginWrap').style.display='';return;}
await load();
}
async function doLogin(){
const m=$('l_msg');m.className='msg';m.textContent='';
const email=$('l_email').value.trim().toLowerCase(), pass=$('l_pass').value;
if(!email||!pass){m.className='msg err';m.textContent='Escribe correo y contraseña.';return;}
$('l_btn').disabled=true;m.textContent='Entrando…';
const {error}=await sb.auth.signInWithPassword({email,password:pass});
if(error){m.className='msg err';m.textContent='⚠ '+error.message;$('l_btn').disabled=false;return;}
$('loginWrap').style.display='none';$('wrap').style.display='';await load();
}

async function load(){
$('wrap').innerHTML='<div class="state">Cargando talleres…</div>';
const {data:{user}}=await sb.auth.getUser();
let empId=null, nombre='Pepe';
try{const el=await sb.from('empleado_login').select('employee_id,nombre_display').eq('user_id',user.id).limit(1);if(el.data&&el.data[0]){empId=el.data[0].employee_id;nombre=el.data[0].nombre_display||nombre;}}catch(e){}
if(!empId){try{const em=await sb.from('employees').select('id,nombre,nombre_display').eq('user_id',user.id).limit(1);if(em.data&&em.data[0]){empId=em.data[0].id;nombre=em.data[0].nombre_display||em.data[0].nombre||nombre;}}catch(e){}}
ME={id:empId,nombre:nombre};
let _proj='cdmx'; try{ _proj=localStorage.getItem('cp_sede_contenido')||'cdmx'; }catch(e){}
const cl=await sb.from('clases').select('*').eq('activa',true).eq('proyecto',_proj);
CLASES=(cl.data||[]);
await render();
}

async function loadInscr(days){
const ini=ymd(days[0]), fin=ymd(days[6]);
try{const r=await sb.from('clase_inscritos').select('clase_id,employee_id,nombre_display,apuntado,fecha').gte('fecha',ini).lte('fecha',fin);INSCR=(r.data||[]);}catch(e){INSCR=[];}
}
function clasesDe(d){const dn=norm(DOW[d.getDay()]);return CLASES.filter(c=>norm(c.dias).indexOf(dn)>=0);}
function mine(clase_id,f){return INSCR.find(x=>x.clase_id===clase_id&&x.employee_id===ME.id&&x.fecha===f&&x.apuntado);}
function apuntadosDe(clase_id,f){return INSCR.filter(x=>x.clase_id===clase_id&&x.fecha===f&&x.apuntado);}

async function render(){
const days=weekDays(weekOff);
await loadInscr(days);
const hoy=ymd(new Date());
let rows='';
let anyTaller=false, apWk='';
days.forEach(d=>{
 const f=ymd(d); const cs=clasesDe(d); if(!cs.length) return; anyTaller=true;
 const past=f<hoy;
 cs.forEach(c=>{
  const on=!!mine(c.id,f);
  const right = past
   ? '<span class="closed">Cerrado</span>'
   : `<button class="btn ${on?'on':''}" onclick="toggle('${c.id}','${f}',this)">${on?'✓ Apuntado':'Me apunto'}</button>`;
  rows+=`<div class="row"><div class="d">${esc(short(d))}</div><div class="info"><div class="nm">${esc(c.emoji||'📚')} ${esc(c.titulo)}</div><div class="mt">${esc(c.hora||'')}${c.imparte_nombre?(' · imparte '+esc(c.imparte_nombre)):''}</div></div>${right}</div>`;
  const ap=apuntadosDe(c.id,f);
  if(ap.length) apWk+=`<div class="ap"><span class="dd">${esc(short(d))} · ${esc(c.titulo)}</span><br><span class="who">${ap.map(a=>esc(a.nombre_display||'Pepe')).join(', ')}</span></div>`;
 });
});
const rango=short(days[0])+' – '+short(days[6]);
let html=`<div class="card"><h1 class="t">Clases del personal</h1><div class="sub">Apúntate a las clases de la semana</div>
<div class="wk"><button class="nav" onclick="wk(-1)">‹</button><b>${esc(rango)}</b><button class="nav" onclick="wk(1)">›</button></div>
${anyTaller?rows:'<div class="state">No hay clases esta semana.</div>'}</div>`;
if(CLASES.length){const c=CLASES[0];if(c.nota) html+=`<div class="card" style="padding:12px 16px"><div class="note">${esc(c.emoji||'📚')} ${esc(c.nota)}</div></div>`;}
html+=`<div class="card"><h3 style="margin:0 0 6px;font-size:15px">Apuntados de la semana</h3>${apWk||'<div class="sub">Nadie apuntado aún.</div>'}</div>`;
$('wrap').innerHTML=html;
}

function wk(n){weekOff+=n;render();}

async function toggle(clase_id,f,btn){
if(!ME||!ME.id){alert('No encontramos tu ficha de colaborador.');return;}
btn.disabled=true;
const existing=INSCR.find(x=>x.clase_id===clase_id&&x.employee_id===ME.id&&x.fecha===f);
const nuevo=!(existing&&existing.apuntado);
try{
 // buscar fila real (por si apuntado=false ya existe)
 const q=await sb.from('clase_inscritos').select('id').eq('clase_id',clase_id).eq('employee_id',ME.id).eq('fecha',f).limit(1);
 if(q.data&&q.data[0]){
  await sb.from('clase_inscritos').update({apuntado:nuevo,nombre_display:ME.nombre,updated_at:new Date().toISOString()}).eq('id',q.data[0].id);
 }else{
  await sb.from('clase_inscritos').insert({clase_id,employee_id:ME.id,fecha:f,nombre_display:ME.nombre,apuntado:nuevo});
 }
 await render();
}catch(e){ btn.disabled=false; alert('⚠ '+(e.message||'no se pudo guardar')); }
}
boot();
</script></body></html>
