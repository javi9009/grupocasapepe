<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>Inventario · Casa Pepe</title>
<meta name="theme-color" content="#16130f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#fff;--bg2:#f7f6f1;--bg3:#f1efe8;--txt:#16130f;--txt2:#5f5e5a;--txt3:#8e8c85;
--accent:#1d9e75;--gold:#C9A227;--bad:#b03434;--bd:rgba(0,0,0,.08);--shadow:0 1px 3px rgba(0,0,0,.06);
--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--txt);background:var(--bg2);overscroll-behavior-y:none}
button,select,input{font-family:inherit}
.appbar{background:#16130f;color:#f4ecdd;padding:calc(10px + var(--safe-t)) 16px 10px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.appbar .bk{background:none;border:none;color:#cdbf9c;font-size:22px;cursor:pointer;padding:0 4px}
.appbar .t{font-weight:700;font-size:16px}
.appbar .t b{color:var(--gold)}
.appbar .d{margin-left:auto;font-size:12px;color:#cdbf9c}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px calc(96px + var(--safe-b))}
.ph{background:#fff;border:1px dashed var(--bd);border-radius:14px;padding:22px 16px;text-align:center;color:var(--txt3);font-size:14px;line-height:1.55}
.aviso{background:#fff8ea;border:1px solid #e8d4a8;border-radius:14px;padding:12px 13px;color:#8a6212;font-size:12.5px;line-height:1.5;margin-bottom:12px}
.grupo{font-size:11px;font-weight:800;color:var(--txt3);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 7px}
.bod{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:#fff;border:1px solid var(--bd);
  border-radius:14px;padding:13px;margin-bottom:9px;box-shadow:var(--shadow);cursor:pointer}
.bod .ic{font-size:20px}
.bod .n{flex:1}
.bod .n b{display:block;font-size:14.5px}
.bod .n span{font-size:11.5px;color:var(--txt3)}
.bod .fl{color:var(--txt3);font-size:18px}
.bod[disabled]{opacity:.55;cursor:default}
.pill{font-size:10px;font-weight:800;border-radius:6px;padding:3px 7px;background:var(--bg3);color:var(--txt3);white-space:nowrap}
.pill.on{background:#dff0e8;color:#12694d}
.pill.no{background:#fff0d6;color:#8a6212}
.hero{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}
.hero .n{font-size:17px;font-weight:800}
.hero .s{font-size:12.5px;color:var(--txt3);margin-top:5px;line-height:1.5}
.buscar{width:100%;margin-bottom:10px;padding:11px 12px;border:1px solid var(--bd);border-radius:12px;background:#fff;font-size:14px}
.it{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:11px 12px;margin-bottom:8px;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:10px}
.it.listo{border-left:3px solid var(--accent)}
.it .n{flex:1;min-width:0}
.it .n b{display:block;font-size:14px;line-height:1.3}
.it .n span{font-size:11.5px;color:var(--txt3)}
.it input{width:88px;padding:11px 8px;border:1px solid var(--bd);border-radius:11px;background:var(--bg2);
  font-size:17px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums}
.it input:focus{outline:2px solid var(--accent);background:#fff}
.barra{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--bd);
  padding:10px 14px calc(10px + var(--safe-b));display:flex;gap:9px;align-items:center;z-index:30}
.barra .info{flex:1;font-size:12px;color:var(--txt3);line-height:1.4}
.barra .info b{color:var(--txt);font-size:13px}
.barra button{border:none;border-radius:11px;padding:12px 15px;font-size:13.5px;font-weight:800;cursor:pointer}
.barra .g{background:var(--bg3);color:var(--txt2)}
.barra .c{background:#16130f;color:#f4ecdd}
.barra button[disabled]{opacity:.45}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + var(--safe-b));background:#16130f;color:#f4ecdd;
  padding:11px 17px;border-radius:99px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:40;max-width:88%;text-align:center}
.toast.on{opacity:1}
</style><script src="/embed-child.js"></script>
<script>
function cpVolverApp(){
  try{ if(window.top!==window.self){ window.parent.postMessage({type:'cp-embed-home'}, location.origin); return; } }catch(e){}
  location.href='/soypepe/';
}
</script>
<link rel="icon" type="image/png" href="/soypepe/icon-192.png">
<link rel="apple-touch-icon" href="/soypepe/icon-192.png">
</head><body>

<div class="appbar">
  <button class="bk" id="atras" onclick="cpVolverApp()">‹</button>
  <span class="t">📋 <b id="titulo">Inventario</b></span>
  <span class="d" id="hoy"></span>
</div>

<div class="wrap" id="wrap"><div class="ph">Cargando…</div></div>
<div class="toast" id="tst"></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=createClient(SB_URL,SB_KEY,{auth:{flowType:'implicit',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=n=>n==null?'':(Math.round(+n*100)/100).toLocaleString('es-MX');
const hoyMX=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'America/Mexico_City',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
let TT;
function toast(m){ const t=$('tst'); t.textContent=m; t.classList.add('on'); clearTimeout(TT); TT=setTimeout(()=>t.classList.remove('on'),2600); }

let EMAIL='', NOMBRE='', BODEGAS=[], CONTEO=null, ITEMS=[], BOD=null;
const ICONO=a=>({'A&B':'🍳','Cuartos':'🛏️','Administración':'🗄️','Tienda':'🛍️','Mantenimiento':'🧰','Tours':'🎒'}[a]||'📦');

$('hoy').textContent=new Date().toLocaleDateString('es-MX',{day:'numeric',month:'short'});

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('wrap').innerHTML='<div class="ph">Entra con tu cuenta desde Soy Pepe para contar.</div>'; return; }
  EMAIL=(session.user.email||'').toLowerCase();
  try{
    const {data}=await sb.from('employees').select('nombre').ilike('email',EMAIL).maybeSingle();
    NOMBRE=(data&&data.nombre)||EMAIL;
  }catch(_){ NOMBRE=EMAIL; }
  const {data,error}=await sb.rpc('cmp_mis_bodegas',{p_email:EMAIL});
  if(error){ $('wrap').innerHTML='<div class="ph">No se pudo leer tus bodegas.<br><span style="font-size:12px">'+esc(error.message)+'</span></div>'; return; }
  BODEGAS=data||[];
  listaBodegas();
}

/* ── Paso 1: qué bodega vas a contar ───────────────────────────────── */
function listaBodegas(){
  BOD=null; CONTEO=null; ITEMS=[];
  $('titulo').textContent='Inventario';
  $('atras').onclick=cpVolverApp;
  if(!BODEGAS.length){
    $('wrap').innerHTML='<div class="ph">No tienes ninguna bodega asignada para contar.<br>'+
      '<span style="font-size:12.5px">Habla con tu jefe de área para que te la den de alta.</span></div>';
    return;
  }
  const porSede={};
  BODEGAS.forEach(b=>{ (porSede[b.sede]=porSede[b.sede]||[]).push(b); });
  const varias=Object.keys(porSede).length>1;
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">¿Qué te toca contar?</div>'+
    '<div class="s">Elige tu bodega y anota lo que hay de verdad. Puedes dejarlo a medias y seguir luego: se guarda solo.</div></div>'+
    Object.keys(porSede).sort().map(sede=>
      (varias?'<div class="grupo">'+esc(sede)+'</div>':'')+
      porSede[sede].map(b=>
        '<button class="bod" '+(b.productos?'':'disabled')+' onclick="abrir(\''+b.id+'\')">'+
          '<span class="ic">'+ICONO(b.area)+'</span>'+
          '<span class="n"><b>'+esc(b.nombre)+'</b><span>'+esc(b.area||'')+' · '+
            (b.productos? b.productos+' producto'+(b.productos===1?'':'s') : 'todavía sin productos')+'</span></span>'+
          (b.productos?'<span class="fl">›</span>':'<span class="pill no">vacía</span>')+
        '</button>').join('')).join('')+
    (BODEGAS.some(b=>!b.productos)
      ? '<div class="aviso">Las bodegas marcadas como vacías todavía no tienen productos asignados. '+
        'Se cargan desde Proveedores y stocks, en el botón “＋ Productos” de cada bodega.</div>' : '');
}
window.abrir=abrir;

/* ── Paso 2: el conteo ─────────────────────────────────────────────── */
async function abrir(bodId){
  BOD=BODEGAS.find(b=>b.id===bodId);
  $('wrap').innerHTML='<div class="ph">Abriendo el conteo…</div>';
  const {data:cid,error}=await sb.rpc('cmp_abrir_conteo',{p_bodega:bodId,p_fecha:hoyMX(),p_nombre:NOMBRE});
  if(error){ toast(error.message); return listaBodegas(); }
  const [{data:cab},{data:its}]=await Promise.all([
    sb.from('cmp_conteos').select('*').eq('id',cid).maybeSingle(),
    sb.from('cmp_conteo_items').select('id,producto_id,cantidad_sistema,cantidad_contada').eq('conteo_id',cid)
  ]);
  CONTEO=cab||{id:cid};
  const ids=(its||[]).map(x=>x.producto_id);
  let prods=[];
  if(ids.length){
    const {data}=await sb.from('cmp_productos').select('id,nombre,unidad_base,unidad_texto,categoria').in('id',ids);
    prods=data||[];
  }
  const byId={}; prods.forEach(p=>byId[p.id]=p);
  ITEMS=(its||[]).map(x=>Object.assign({},x,{prod:byId[x.producto_id]||{nombre:'(producto)'}}))
                 .sort((a,b)=>(a.prod.categoria||'').localeCompare(b.prod.categoria||'')||a.prod.nombre.localeCompare(b.prod.nombre));
  $('titulo').textContent=BOD.nombre;
  $('atras').onclick=listaBodegas;
  pintaConteo();
}

function pintaConteo(){
  const cerrado=CONTEO&&CONTEO.estado==='cerrado';
  const q=(($('q')||{}).value||'').toLowerCase();
  const l=q?ITEMS.filter(x=>x.prod.nombre.toLowerCase().includes(q)):ITEMS;
  const hechos=ITEMS.filter(x=>x.cantidad_contada!=null).length;
  $('wrap').innerHTML=
    '<div class="hero"><div class="n">'+esc(BOD.nombre)+'</div>'+
    '<div class="s">'+(cerrado
      ? 'Este conteo ya está cerrado. Lo ves como quedó.'
      : 'Escribe cuánto hay de cada cosa. Lo que no toques queda sin contar, no en cero.')+
    '</div></div>'+
    '<input class="buscar" id="q" placeholder="Buscar producto…" value="'+esc(q)+'" '+(cerrado?'':'oninput="repinta()"')+'>'+
    (l.length? l.map(fila).join('') : '<div class="ph">Nada con esa búsqueda.</div>')+
    (cerrado?'':
      '<div class="barra"><div class="info"><b>'+hechos+' de '+ITEMS.length+'</b><br>contados</div>'+
      '<button class="g" onclick="guardar(false)">Guardar y seguir luego</button>'+
      '<button class="c" '+(hechos?'':'disabled')+' onclick="cerrar()">Cerrar</button></div>');
  if(q){ const e=$('q'); e.focus(); e.setSelectionRange(e.value.length,e.value.length); }
}
function fila(x){
  const u=x.prod.unidad_texto||x.prod.unidad_base||'';
  const listo=x.cantidad_contada!=null;
  const cerrado=CONTEO&&CONTEO.estado==='cerrado';
  return '<div class="it'+(listo?' listo':'')+'">'+
    '<div class="n"><b>'+esc(x.prod.nombre)+'</b><span>'+
      (u?esc(u)+' · ':'')+'el sistema dice '+num(x.cantidad_sistema)+'</span></div>'+
    (cerrado
      ? '<div style="font-size:17px;font-weight:800">'+(listo?num(x.cantidad_contada):'—')+'</div>'
      : '<input type="number" inputmode="decimal" step="0.01" min="0" value="'+(listo?x.cantidad_contada:'')+'" '+
        'placeholder="—" onchange="anota(\''+x.id+'\',this.value)">')+
  '</div>';
}
window.repinta=()=>pintaConteo();
window.anota=(id,v)=>{
  const x=ITEMS.find(y=>y.id===id); if(!x) return;
  x.cantidad_contada = v===''?null:parseFloat(v);
  x._sucio=true;
  const b=document.querySelector('.barra .info b');
  if(b) b.textContent=ITEMS.filter(y=>y.cantidad_contada!=null).length+' de '+ITEMS.length;
};

/* ── Guardar y cerrar ──────────────────────────────────────────────── */
async function guardar(callado){
  const sucios=ITEMS.filter(x=>x._sucio);
  if(!sucios.length){ if(!callado) toast('No hay nada nuevo que guardar.'); return true; }
  for(const x of sucios){
    const {error}=await sb.from('cmp_conteo_items')
      .update({cantidad_contada:x.cantidad_contada}).eq('id',x.id);
    if(error){ toast('No se pudo guardar: '+error.message); return false; }
    x._sucio=false;
  }
  if(!callado) toast('Guardado. Puedes seguir cuando quieras.');
  return true;
}
window.guardar=guardar;
window.cerrar=async function(){
  const faltan=ITEMS.filter(x=>x.cantidad_contada==null).length;
  if(faltan && !confirm('Quedan '+faltan+' sin contar. Si cierras, esos se quedan como estaban en el sistema. ¿Cerramos?')) return;
  if(!await guardar(true)) return;
  const {error}=await sb.rpc('cmp_cerrar_conteo',{p_conteo:CONTEO.id,p_nombre:NOMBRE});
  if(error){ toast(error.message); return; }
  toast('Conteo cerrado. ¡Gracias!');
  setTimeout(listaBodegas,1200);
};

// Red de seguridad: si se va de la pantalla con algo sin guardar, se guarda solo.
window.addEventListener('pagehide',()=>{ if(ITEMS.some(x=>x._sucio)) guardar(true); });

boot();
</script>
</body></html>
