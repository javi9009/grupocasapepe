<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi nómina · SoyPepe</title>
<style>
:root{--bg:#16130f;--card:#241f18;--bd:#3a3228;--txt:#f4ecdd;--soft:#c9bca6;--faint:#8d8170;--gold:#C9A227;--accent:#1d9e75;--bad:#e89a95}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding-bottom:40px}
.top{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.top a{color:var(--soft);text-decoration:none;font-size:13px}
.top h1{margin:0;font-size:19px}.top h1 b{color:var(--gold)}
.wrap{max-width:460px;margin:0 auto;padding:0 14px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;vertical-align:2px}
.tag.tent{background:#3a2f16;color:#e0a94b}.tag.final{background:#16352a;color:#7fe0b0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
table.tc{width:100%;border-collapse:collapse;font-size:13.5px}
.tc th{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em;text-align:right;padding:4px 0;border-bottom:1px solid var(--bd)}
.tc th:first-child{text-align:left}
.tc td{padding:7px 0;border-bottom:1px solid var(--bd);text-align:right;font-variant-numeric:tabular-nums}
.tc td:first-child{text-align:left;color:var(--soft)}
.tc tr:last-child td{border-bottom:0}
.tc tr.tot td{font-weight:800;font-size:15px}
.tc td.up{color:#7fe0b0}.tc td.down{color:var(--bad)}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{padding:11px;border:none;border-radius:10px;background:var(--gold);color:#2b2017;font-weight:800;font-size:13.5px;cursor:pointer}
.btn.g{background:transparent;border:1px solid var(--bd);color:var(--txt);font-weight:600}
.btn[disabled]{opacity:.45}
.btn.full{width:100%;margin-top:10px}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .q{font-size:12px;color:var(--faint);flex:none;width:82px}
.rec .mid{flex:1;font-size:12px;color:var(--soft)}
.rec .mid b.up{color:#7fe0b0}.rec .mid b.down{color:var(--bad)}
.rec .n{font-weight:800;font-variant-numeric:tabular-nums}
.rec .ch{color:var(--faint)}
.msg{font-size:13px;min-height:18px;margin-top:8px}.msg.ok{color:#7fe0b0;font-weight:700}.msg.err{color:var(--bad);font-weight:700}
.cargando{color:var(--faint);padding:30px 0;text-align:center}
.aviso{background:#241f18;border:1px solid var(--bd);border-radius:12px;padding:10px 13px;font-size:12px;color:var(--soft);margin:10px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{background:var(--card);border:1px solid var(--bd);border-radius:18px 18px 0 0;padding:18px;width:100%;max-width:460px;max-height:88vh;overflow:auto}
.sheet h2{margin:0 0 4px;font-size:16px}.sheet .x{float:right;border:none;background:none;font-size:20px;cursor:pointer;color:var(--soft)}
.sheet .sub{font-size:12px;color:var(--faint);margin-bottom:10px}
.conv{background:#16130f;border:1px solid var(--bd);border-radius:10px;padding:12px;font-size:12.5px;line-height:1.55;color:var(--soft);white-space:pre-wrap;margin:10px 0}
.sheet input{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#16130f;color:var(--txt);font-size:15px;margin-top:6px}
.sheet label{font-size:12px;font-weight:700;color:var(--soft);display:block;margin-top:10px}
.nota{font-size:11px;color:var(--faint);margin-top:8px;line-height:1.5}
</style>

</head><body>
<div class="top"><a href="/soypepe/">←</a><h1>Mi <b>nómina</b></h1></div>
<div class="wrap" id="app"><div class="cargando">Cargando…</div></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script>
const SBU='https://rehophywchakfapivsbh.supabase.co';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let EMAIL='';
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){const v=JSON.parse(localStorage.getItem(k)||'null');const s=v&&(v.currentSession||v);const t=s&&(s.access_token);if(t){H.Authorization='Bearer '+t;const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');EMAIL=((JSON.parse(atob(p+'==='.slice((p.length+3)%4)))||{}).email||'').toLowerCase();}}}}catch(e){}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const QN=q=>{const m=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+q.slice(5,7)];return (q.slice(8)==='Q1'?'1–15 ':'16–fin ')+m+' '+q.slice(2,4);};
async function rpc(fn,body){const r=await fetch(SBU+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
let D=null,ROSTER=null,VER='';
function openSheet(html){$('#sheet').innerHTML='<button class="x" onclick="document.getElementById(\'modal\').classList.remove(\'show\')">✕</button>'+html;$('#modal').classList.add('show');}
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show');};
function bonoTxt(a){
 if(a==null)return '';
 if(a>=100)return `<b class="up">+${money(a)} de bono · ¡lo lograste! 💪</b>`;
 if(a>0)return `<b class="up">+${money(a)} extra</b>`;
 if(a<=-100)return `<b class="down">−${money(-a)} de ajuste · va la próxima</b>`;
 if(a<0)return `<b class="down">−${money(-a)} de ajuste</b>`;
 return 'sin extras ni ajustes';
}
/* ===== desglose (estimada o recibo) ===== */
function fila(k,v,cls){return `<tr><td>${k}</td><td class="${cls||''}">${v}</td></tr>`;}
function filasConceptos(cc){ // conceptos con nombre y motivo (desglose legal)
 return (cc||[]).map(c=>fila(esc(c.concepto)+(c.nota?` <span style="color:var(--faint);font-size:11px">· ${esc(c.nota)}</span>`:''),
  (c.tipo==='percepcion'?'+':'−')+money(c.monto), c.tipo==='percepcion'?'up':'down')).join('');
}
function sumC(cc,t){return (cc||[]).filter(x=>x.tipo===t).reduce((s,x)=>s+(+x.monto||0),0);}
function verDesglose(){
 const det=D.detalle||{};const fiscal=D.esquema==='fiscal';
 openSheet(`<h2>Desglose de mi quincena</h2><div class="sub">${QN(D.quincena)} · esquema ${esc(D.esquema)} · ${D.estimada_estatus==='validada'?'FINAL':'estimado'}</div>
  <table class="tc">
   ${fila('Sueldo mensual base (contrato)',money(D.salario_mensual))}
   ${fila('Sueldo diario (mensual ÷ 30)',money(D.sueldo_diario))}
   ${fila('Días de la quincena',det.dias??15)}
   ${fila('Sueldo de la quincena',money(det.dias!=null?det.dias*D.sueldo_diario:det.percepciones))}
   ${filasConceptos(D.conceptos)}
   ${fiscal?fila('ISR retenido (tabla SAT 2026)','−'+money(det.isr),'down'):''}
   ${fiscal?fila('IMSS cuota obrera (sobre tu SBC)','−'+money(det.imss),'down'):''}
   ${fiscal&&det.sbc?fila('SBC (salario base de cotización)',money(det.sbc)):''}
   ${Number(det.deducciones)?fila('Otras deducciones','−'+money(det.deducciones),'down'):''}
   <tr class="tot"><td>Neto</td><td>${money(D.estimada)}</td></tr>
  </table>
  <p class="nota">${fiscal?'Tu nómina se calcula igual que en el despacho: ISR con la tabla mensual 2026 (÷2 por quincena, con subsidio al empleo si aplica) y cuotas obreras del IMSS sobre tu salario base de cotización, conforme a LFT y Ley del Seguro Social.':(D.esquema==='fijo'?'Tienes un neto quincenal pactado: recibes el mismo monto cada quincena, más extras y menos descuentos cuando aplican.':'Tu quincena base es tu sueldo mensual entre dos. Los bonos y extras se suman al cierre; los descuentos se restan.')}</p>`);
}
function verRecibo(r){
 const fiscal=Number(r.isr)>0||Number(r.imss)>0;
 const cc=r.conceptos||[];
 const desg=cc.length?filasConceptos(cc)
  :((r.ajuste>0?fila('Bonos y extras <span style="color:var(--faint);font-size:11px">· concepto por detallar con administración</span>','+'+money(r.ajuste),'up'):'')
   +(r.ajuste<0?fila('Ajustes y descuentos <span style="color:var(--faint);font-size:11px">· concepto por detallar con administración</span>','−'+money(-r.ajuste),'down'):''));
 openSheet(`<h2>Recibo · ${QN(r.quincena)}</h2><div class="sub">pagado</div>
  <table class="tc">
   ${r.base!=null?fila('Sueldo de la quincena (base de contrato)',money(r.base)):''}
   ${desg}
   ${fiscal?fila('ISR retenido (tabla SAT)','−'+money(r.isr),'down'):''}
   ${fiscal?fila('IMSS cuota obrera','−'+money(r.imss),'down'):''}
   <tr class="tot"><td>Neto depositado</td><td>${money(r.neto)}</td></tr>
  </table>
  <p class="nota">Cada pago o descuento debe traer su concepto y motivo. Si algo no te cuadra o falta el detalle, coméntalo con tu jefe o con administración — para eso está este recibo.</p>`);
}
function verContrato(){
 const c=D.contrato;
 if(!c){openSheet('<h2>Mi contrato</h2><p class="nota" style="font-size:13px">Aún no tienes contrato registrado en la plataforma. RH está completando los expedientes — pídelo en tu siguiente visita a administración.</p>');return;}
 openSheet(`<h2>Mi contrato</h2><div class="sub">contrato ${c.numero||1} · ${esc(c.estatus||'—')} ${c.firmado?'· ✓ firmado':''}</div>
  <table class="tc">
   ${fila('Salario mensual en contrato',money(c.salario))}
   ${fila('Salario mensual en nómina',money(D.salario_mensual))}
   <tr class="tot"><td>¿Coinciden?</td><td>${Number(c.salario)===Number(D.salario_mensual)?'✓ sí':'⚠ revisar'}</td></tr>
  </table>
  ${/^https?:/.test(c.pdf||'')?`<button class="btn full" onclick="window.open('${esc(c.pdf)}','_blank')">📄 Ver mi contrato</button>`:'<p class="nota">El documento firmado está en tu expediente; puedes pedirlo en administración.</p>'}`);
}
/* ===== adelanto ===== */
function verAdelanto(){
 const conv=`CONVENIO DE ANTICIPO DE NÓMINA · Grupo Casa Pepe

Yo, ${D.nombre_completo}, solicito de manera voluntaria un anticipo sobre los ${D.dias_trabajados} días que llevo efectivamente laborados en la quincena ${QN(D.quincena)}, equivalentes a ${money(D.retirable_bruto)}.

Acepto cubrir una comisión por la gestión del anticipo del 2% (${money(D.retirable_bruto*0.02)}), por lo que recibiré ${money(D.retirable_neto)}.

El monto anticipado se descontará íntegramente del pago de esta misma quincena. Firmo este convenio electrónicamente desde mi cuenta de SoyPepe.`;
 openSheet(`<h2>Adelantar mi nómina</h2><div class="sub">${QN(D.quincena)}</div>
  <table class="tc">
   ${fila('Días laborados hasta hoy',D.dias_trabajados+' días')}
   ${fila('Sueldo diario',money(D.sueldo_diario))}
   ${fila('Llevas ganado',money(D.retirable_bruto))}
   ${fila('Comisión por gestión (2%)','−'+money(D.retirable_bruto*0.02),'down')}
   <tr class="tot"><td>Recibes hoy</td><td>${money(D.retirable_neto)}</td></tr>
  </table>
  <p class="nota">Solo puedes adelantar días que ya trabajaste. El anticipo se descuenta completo de esta quincena: el día de pago recibirás tu quincena menos este adelanto.</p>
  <div class="conv">${esc(conv)}</div>
  <label>Firma con tu nombre completo</label>
  <input id="firma" placeholder="${esc(D.nombre_completo)}" autocomplete="name">
  <button class="btn full" id="firmar">✍️ Firmar convenio y solicitar ${money(D.retirable_neto)}</button>
  <div class="msg" id="amsg"></div>`);
 $('#firmar').onclick=async()=>{
  const f=($('#firma').value||'').trim();
  if(f.length<5){$('#amsg').className='msg err';$('#amsg').textContent='Escribe tu nombre completo como firma.';return;}
  $('#firmar').disabled=true;$('#amsg').className='msg';$('#amsg').textContent='Enviando…';
  try{const j=await rpc('solicitar_adelanto',{p_email:EMAIL,p_firma:f});
   if(!j.ok){$('#amsg').className='msg err';$('#amsg').textContent=j.error||'No se pudo';$('#firmar').disabled=false;return;}
   $('#amsg').className='msg ok';$('#amsg').textContent='✓ Convenio firmado · Tesorería revisa tu adelanto de '+money(j.monto_neto);
   setTimeout(()=>{$('#modal').classList.remove('show');pinta();},1400);
  }catch(e){$('#amsg').className='msg err';$('#amsg').textContent='Error de conexión';$('#firmar').disabled=false;}
 };
}
/* ===== lo que llevo vendido =====
   Javi, 1-nov-2026: «el portal de SoyPepe, en Mi nómina, donde el colaborador
   puede ver sus ventas que lleva acumuladas».
   No lee sinc_reservas: un concierge no tiene permiso para leer la tabla de
   reservas entera ni le hace falta. Lo suyo se lo da mis_ventas_concierge. */
let V=null;
function vFecha(f){ try{ return new Date(f+'T12:00:00').toLocaleDateString('es-MX',{day:'numeric',month:'short'}); }catch(e){ return f; } }

/* TAMBIÉN LAS QUE NO LE CONTARON. Javi, 1-nov-2026: «anótale en el reporte de
   + info al concierge el detalle de pagos reembolsados, pagos exitosos, pagos
   no terminados, etc., para que vea toda la info de lo que sí le aplicó y lo
   que no».
   Esconder lo que no contó no lo hace desaparecer: la persona se acuerda de
   que vendió ese tour, y si no lo ve, lo que concluye es que el sistema le
   quitó algo. Salen las tres cosas, separadas y con su motivo escrito. */
const VCLASE={
 cuenta:['Ya es tuyo','Cobradas. Esto entra en tu corte.','up'],
 aire:  ['Todavía en el aire','Aún puede contar: depende de que el huésped pague o de cómo acabe.','' ],
 cayo:  ['No te contó','Se cayeron. Aquí están para que sepas por qué.','down']
};
function filasVentas(L){
 return L.map(x=>`<tr><td>${vFecha(x.fecha)}</td><td>${esc(x.tour)}
   <div style="color:var(--faint);font-size:10.5px">${esc(x.cliente||'')} · ${x.pax||1} pax · ${money(x.total)}${x.base?` · sin IVA ${money(x.base)}`:''}</div>
   <div style="color:var(--faint);font-size:10.5px">${esc(x.estado||'')}</div></td>
   <td class="${x.clase==='cuenta'?'up':x.clase==='cayo'?'down':''}">${x.clase==='cayo'?'—':money(x.mio)}</td></tr>`).join('');
}

function verVentas(){
 if(!V||!V.ok||V.sin_codigo)return;
 const u=V.ultimas||[], p=V.periodo||{};
 const bloque=k=>{
  const L=u.filter(x=>x.clase===k); if(!L.length) return '';
  const c=VCLASE[k];
  return `<h2 style="margin-top:18px">${c[0]} <span style="font-weight:400;color:var(--faint);font-size:12px">· ${L.length}</span></h2>
   <div class="sub">${c[1]}</div>
   <table class="tc"><tr><th>Cuándo</th><th>Qué</th><th>Para mí</th></tr>${filasVentas(L)}</table>`;
 };
 openSheet(`<h2>Mis ventas</h2><div class="sub">del ${vFecha(V.desde)} al ${vFecha(V.hasta)} · código ${esc(V.codigo)}</div>
  <table class="tc">
   <tr><td>Cobradas y tuyas</td><td>${p.ventas||0}</td><td class="up">${money(p.mio)}</td></tr>
   ${p.aire_n?`<tr><td>Todavía en el aire</td><td>${p.aire_n}</td><td>${money(p.aire)}</td></tr>`:''}
   ${p.cayo_n?`<tr><td>No te contaron</td><td>${p.cayo_n}</td><td class="down">—</td></tr>`:''}
  </table>
  ${!u.length?'<div class="nota">Todavía nada en este periodo.</div>':''}
  ${bloque('cuenta')}${bloque('aire')}${bloque('cayo')}
  ${(V.por_estado||[]).length?`<h2 style="margin-top:18px">Cómo acabó cada cobro</h2><table class="tc">
   ${V.por_estado.map(e=>`<tr><td>${esc(e.estado)}</td><td>${e.n}</td><td class="${e.clase==='cuenta'?'up':e.clase==='cayo'?'down':''}">${e.clase==='cayo'?'—':money(e.mio)}</td></tr>`).join('')}
  </table>`:''}
  ${(V.por_tour||[]).length?`<h2 style="margin-top:18px">Lo que más vendo</h2><table class="tc">
   ${V.por_tour.map(t=>`<tr><td>${esc(t.tour)}</td><td>${t.n}</td><td class="up">${money(t.mio)}</td></tr>`).join('')}
  </table>`:''}
  ${ejemploIva()}
  <div class="nota">Se te liquida en el corte, junto con tu quincena. Si algo de «no te contó» no te cuadra, enséñaselo a tu gerente con el folio: ahí está escrito qué pasó.</div>`);
}

/* POR QUÉ NO SON 73.30 SINO 63.19. Javi, 1-nov-2026: «debe ser su 10% − el
   IVA, y en su cel hay que explicarlo».
   Si el número sale distinto del que la persona calculó de cabeza y nadie se
   lo explica, lo que se rompe no es la cuenta: es la confianza en la cuenta.
   Así que se explica con SU venta, con sus propios números, no con una regla
   abstracta. */
function ejemploIva(){
 /* El ejemplo se hace con una venta que SÍ le contó: explicar el reparto con
    una devuelta es enseñar la cuenta de un dinero que no va a cobrar. */
 const u=(V&&V.ultimas||[]).find(x=>x.clase==='cuenta' && x.base && x.total);
 if(!u) return '';
 const iva=u.iva_pct||16, pct=V.com_pct!=null?V.com_pct:10;
 return `<h2 style="margin-top:18px">De dónde sale tu ${pct}%</h2>
  <table class="tc">
   <tr><td>El huésped pagó</td><td>${money(u.total)}</td></tr>
   <tr><td>Menos el IVA (${iva}%)<div style="color:var(--faint);font-size:10.5px">ese dinero nunca fue de la casa: se entera</div></td><td class="down">−${money(u.total-u.base)}</td></tr>
   <tr><td>Queda la venta</td><td>${money(u.base)}</td></tr>
   <tr class="tot"><td>Tu ${pct}% de eso</td><td class="up">${money(u.mio)}</td></tr>
  </table>
  <div class="nota">Tu comisión se saca del precio sin IVA, no de lo que se cobró en la tarjeta. Por eso te sale un poco menos de lo que da la cuenta rápida.</div>`;
}

function cardVentas(){
 if(!V||!V.ok)return '';
 if(V.sin_codigo) return `<div class="card"><h3>Lo que llevo vendido</h3>
   <div class="nota">${esc(V.aviso||'')}</div></div>`;
 const p=V.periodo||{}, a=V.acumulado||{};
 if(!Number(a.ventas)) return `<div class="card"><h3>Lo que llevo vendido</h3>
   <div class="nota">Todavía no has vendido nada. Tu código es <b>${esc(V.codigo)}</b>: enseña tu QR al huésped desde Concierge y lo que compre se te apunta a ti, aunque lo pague esa noche desde su cuarto.</div></div>`;
 return `<div class="card"><h3>Lo que llevo vendido <span class="tag final">${esc(V.codigo)}</span></h3>
  <table class="tc">
   <tr><th>Concepto</th><th>Este mes</th><th>Desde siempre</th></tr>
   <tr><td>Ventas</td><td>${p.ventas||0}${p.pax?` <span style="color:var(--faint)">· ${p.pax} pax</span>`:''}</td><td>${a.ventas||0}</td></tr>
   <tr><td>Vendido</td><td>${money(p.vendido)}</td><td>${money(a.vendido)}</td></tr>
   <tr><td>Menos IVA, que no es de la casa</td><td class="down">−${money(p.iva)}</td><td>—</td></tr>
   ${p.aire_n?`<tr><td>En el aire<div style="color:var(--faint);font-size:10.5px">${p.aire_n} sin cerrar todavía</div></td><td>${money(p.aire)}</td><td>—</td></tr>`:''}
   ${p.cayo_n?`<tr><td>No contaron<div style="color:var(--faint);font-size:10.5px">${p.cayo_n} devueltas, falladas o canceladas</div></td><td class="down">—</td><td>—</td></tr>`:''}
   <tr class="tot"><td>Para mí${V.com_pct!=null?` (${V.com_pct}% de lo que queda)`:''}</td><td>${money(p.mio)}<div style="font-size:9.5px;font-weight:400;color:var(--faint)">${money(p.por_cobrar)} sin cobrar aún</div></td><td>${money(a.mio)}</td></tr>
  </table>
  <button class="btn g full" id="bVentas">🧾 Ver mis ventas una por una</button>
  <div class="nota">Tu ${V.com_pct!=null?V.com_pct:10}% se saca del precio <b>sin IVA</b>, no de lo que se cobró en la tarjeta — toca el botón y ahí está la cuenta con una venta tuya. Se liquida en el corte con tu quincena; si se cancela o se devuelve, se cae.</div>
 </div>`;
}

/* ===== vista principal ===== */
async function pinta(){
 try{D=await rpc('mi_nomina',{p_email:VER||EMAIL});}catch(e){$('#app').innerHTML='<div class="cargando">No se pudo cargar. Revisa tu sesión.</div>';return;}
 /* Las ventas no bloquean la nómina: si fallan, la quincena se enseña igual. */
 try{V=await rpc('mi_reporte_ventas',{p_email:VER||EMAIL});}catch(e){V=null;}
 if(!D.ok){$('#app').innerHTML='<div class="cargando">'+esc(D.error||'Sin datos')+'</div>';return;}
 if(ROSTER===null){try{ROSTER=await rpc('roster_nomina',{});}catch(e){ROSTER=[];}}
 const esFinal=D.estimada_estatus==='validada';
 const det=D.detalle||{};
 const com=Number(D.comision_adelanto)||(D.retirable_bruto*0.02);
 const cc=D.conceptos||[];
 /* si la estimada es la base pura (tentativa), los conceptos capturados se suman a la vista */
 const estMostrada=(D.estimada_estatus==='tentativa')?(Number(D.estimada)+sumC(cc,'percepcion')-sumC(cc,'deduccion')):Number(D.estimada);
 const ccRows=cc.map(c=>`<tr><td>${esc(c.concepto)}${c.nota?` <span style="color:var(--faint);font-size:10.5px">· ${esc(c.nota)}</span>`:''}</td><td>—</td><td class="${c.tipo==='percepcion'?'up':'down'}">${c.tipo==='percepcion'?'+':'−'}${money(c.monto)}</td></tr>`).join('');
 const verHTML=(ROSTER&&ROSTER.length)?`<div class="card" style="padding:10px 14px"><label style="font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.05em">👁 Ver como</label>
   <select id="verComo" style="width:100%;margin-top:5px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:#16130f;color:var(--txt);font-size:14px">
    <option value="">Yo (${esc(EMAIL)})</option>
    ${ROSTER.map(r=>`<option value="${esc(r.email)}" ${VER===r.email?'selected':''}>${esc(r.nombre)}</option>`).join('')}
   </select></div>`:'';
 $('#app').innerHTML=`
  ${verHTML}
  ${D.preview?`<div class="aviso" style="border-color:var(--gold);color:var(--gold)">👁 Estás viendo la pantalla de <b>${esc(D.nombre)}</b> tal como la ve. Solo lectura: el botón de adelanto está apagado.</div>`:''}
  <div class="card"><h3>${D.preview?esc(D.nombre)+' · quincena':'Mi quincena'} · ${QN(D.quincena)} <span class="tag ${esFinal?'final':'tent'}">${esFinal?'FINAL':'TENTATIVA'}</span></h3>
   <table class="tc">
    <tr><th>Concepto</th><th>A día de hoy</th><th>Quincena ${esFinal?'final':'estimada'}</th></tr>
    <tr><td>Días laborados</td><td>${D.dias_trabajados}</td><td>${det.dias??15}</td></tr>
    <tr><td>Sueldo por días</td><td>${money(D.retirable_bruto)}</td><td>${money(det.percepciones)}</td></tr>
    ${ccRows}
    ${Number(det.isr)?`<tr><td>ISR retenido</td><td>—</td><td class="down">−${money(det.isr)}</td></tr>`:''}
    ${Number(det.imss)?`<tr><td>IMSS obrero</td><td>—</td><td class="down">−${money(det.imss)}</td></tr>`:''}
    ${Number(det.deducciones)?`<tr><td>Otras deducciones</td><td>—</td><td class="down">−${money(det.deducciones)}</td></tr>`:''}
    <tr><td>Comisión si adelantas (2%)</td><td class="down">−${money(com)}</td><td>—</td></tr>
    <tr class="tot"><td>Se te deposita</td><td>${money(D.retirable_neto)}<div style="font-size:9.5px;font-weight:400;color:var(--faint)">hoy, si adelantas</div></td><td>${money(estMostrada)}<div style="font-size:9.5px;font-weight:400;color:var(--faint)">día de pago</div></td></tr>
   </table>
   <div class="btnrow">
    <button class="btn g" id="bDesglose">📋 Ver desglose</button>
    <button class="btn g" id="bContrato">📄 Mi contrato</button>
   </div>
   <button class="btn full" id="bAdelantar" ${(!D.preview&&!D.adelanto&&D.retirable_neto>=100)?'':'disabled'}>💸 Adelantar ${money(D.retirable_neto)} de mis días trabajados</button>
   <div class="nota">${D.adelanto?('Adelanto en trámite: '+money(D.adelanto.monto)+' ('+esc(D.adelanto.estado)+').'):(esFinal?'Cifra validada por administración: esto es lo que te cae.':'La cifra final se valida dos días antes del depósito; bonos y extras pueden moverla.')}</div>
  </div>
  ${cardVentas()}
  <div class="card"><h3>Mis recibos anteriores</h3>
   ${(D.recibos||[]).length?(D.recibos||[]).map((r,i)=>`<div class="rec" data-i="${i}"><span class="q">${QN(r.quincena)}</span><span class="mid">${bonoTxt(r.ajuste)}</span><span class="n">${money(r.neto)}</span><span class="ch">›</span></div>`).join(''):'<div class="nota">Aún no hay recibos registrados.</div>'}
  </div>
  <div class="aviso">Tu quincena base viene de tu contrato. Los bonos se ganan con asistencia y chamba — cuídalos. Cualquier duda con tus números, toca el recibo y revisa el desglose.</div>`;
 $('#bDesglose').onclick=verDesglose;
 $('#bContrato').onclick=verContrato;
 const bv=$('#bVentas'); if(bv) bv.onclick=verVentas;
 const ba=$('#bAdelantar');if(ba&&!ba.disabled)ba.onclick=verAdelanto;
 const vc=$('#verComo');if(vc)vc.onchange=()=>{VER=vc.value;pinta();};
 document.querySelectorAll('.rec[data-i]').forEach(el=>el.onclick=()=>verRecibo(D.recibos[+el.dataset.i]));
}
pinta();
</script></body></html>
