<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi nómina · SoyPepe</title>
<style>
:root{--bg:#16130f;--card:#241f18;--bd:#3a3228;--txt:#f4ecdd;--soft:#c9bca6;--faint:#8d8170;--gold:#C9A227;--accent:#1d9e75;--bad:#e89a95}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--txt);font-size:15px;padding-bottom:40px}
.top{padding:16px 18px 6px;display:flex;align-items:center;gap:10px}
.top a{color:var(--soft);text-decoration:none;font-size:13px}
.top h1{margin:0;font-size:19px}.top h1 b{color:var(--gold)}
.wrap{max-width:460px;margin:0 auto;padding:0 14px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:20px;padding:2px 9px;vertical-align:2px}
.tag.tent{background:#3a2f16;color:#e0a94b}.tag.final{background:#16352a;color:#7fe0b0}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.col{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px}
.col .l{font-size:11px;color:var(--faint);text-transform:uppercase;letter-spacing:.05em}
.col .v{font-size:22px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.col .s{font-size:11.5px;color:var(--soft);line-height:1.4}
.btn{width:100%;margin-top:10px;padding:11px;border:none;border-radius:10px;background:var(--gold);color:#2b2017;font-weight:800;font-size:14px;cursor:pointer}
.btn[disabled]{opacity:.45}
.aviso{background:#241f18;border:1px solid var(--bd);border-radius:12px;padding:10px 13px;font-size:12px;color:var(--soft);margin:10px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:13px;color:var(--soft);text-transform:uppercase;letter-spacing:.05em}
.rec{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}
.rec:last-child{border-bottom:0}
.rec .q{font-size:12px;color:var(--faint);flex:none;width:86px}
.rec .mid{flex:1;font-size:12px;color:var(--soft)}
.rec .mid b.up{color:#7fe0b0}.rec .mid b.down{color:var(--bad)}
.rec .n{font-weight:800;font-variant-numeric:tabular-nums}
.msg{font-size:13px;min-height:18px;margin-top:8px}.msg.ok{color:#7fe0b0;font-weight:700}.msg.err{color:var(--bad);font-weight:700}
.cargando{color:var(--faint);padding:30px 0;text-align:center}
</style></head><body>
<div class="top"><a href="/soypepe/">←</a><h1>Mi <b>nómina</b></h1></div>
<div class="wrap" id="app"><div class="cargando">Cargando…</div></div>
<script>
const SBU='https://rehophywchakfapivsbh.supabase.co';
const KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const H={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
let EMAIL='';
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&/sb-.*-auth-token/.test(k)){const v=JSON.parse(localStorage.getItem(k)||'null');const s=v&&(v.currentSession||v);const t=s&&(s.access_token);if(t){H.Authorization='Bearer '+t;const p=t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');EMAIL=((JSON.parse(atob(p+'==='.slice((p.length+3)%4)))||{}).email||'').toLowerCase();}}}}catch(e){}
const $=s=>document.querySelector(s);
const money=n=>'$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const QN=q=>{const m=['','ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'][+q.slice(5,7)];return (q.slice(8)==='Q1'?'1–15 ':'16–fin ')+m+' '+q.slice(2,4);};
async function rpc(fn,body){const r=await fetch(SBU+'/rest/v1/rpc/'+fn,{method:'POST',headers:H,body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json();}
function bonoTxt(a){
 if(a==null)return '';
 if(a>=100)return `<b class="up">+${money(a)} de bono · ¡lo lograste, sigue así! 💪</b>`;
 if(a>0)return `<b class="up">+${money(a)} extra</b>`;
 if(a<=-100)return `<b class="down">−${money(-a)} de ajuste · esta vez no salió, va la próxima</b>`;
 if(a<0)return `<b class="down">−${money(-a)} de ajuste</b>`;
 return 'sin extras ni ajustes';
}
async function pinta(){
 let d;
 try{d=await rpc('mi_nomina',{p_email:EMAIL});}catch(e){$('#app').innerHTML='<div class="cargando">No se pudo cargar. Revisa tu sesión.</div>';return;}
 if(!d.ok){$('#app').innerHTML='<div class="cargando">'+(d.error||'Sin datos')+'</div>';return;}
 const esFinal=d.estimada_estatus==='validada';
 $('#app').innerHTML=`
  <div class="dos">
    <div class="col">
      <div class="l">Días trabajados</div>
      <div class="v">${d.dias_trabajados}</div>
      <div class="s">llevas ${money(d.retirable_bruto)} trabajados esta quincena</div>
      <button class="btn" id="adelantar" ${(!d.adelanto&&d.retirable_neto>=100)?'':'disabled'}>💸 Adelantar ${money(d.retirable_neto)}</button>
      <div class="s" style="margin-top:6px">${d.adelanto?('Adelanto en trámite: '+money(d.adelanto.monto)+' ('+d.adelanto.estado+')'):'Adelantar tus días trabajados tiene una comisión del 2%.'}</div>
      <div class="msg" id="msg"></div>
    </div>
    <div class="col">
      <div class="l">Nómina estimada <span class="tag ${esFinal?'final':'tent'}">${esFinal?'FINAL':'TENTATIVA'}</span></div>
      <div class="v">${money(d.estimada)}</div>
      <div class="s">${esFinal?'Validada por administración: esto es lo que te cae.':'Estimación con tu quincena base. La cifra final se valida dos días antes del depósito; los bonos y extras pueden moverla.'}</div>
    </div>
  </div>
  <div class="card"><h3>Mis recibos</h3>
   ${(d.recibos||[]).length?(d.recibos||[]).map(r=>`<div class="rec"><span class="q">${QN(r.quincena)}</span><span class="mid">${bonoTxt(r.ajuste)}</span><span class="n">${money(r.neto)}</span></div>`).join(''):'<div class="s" style="color:var(--faint)">Aún no hay recibos registrados.</div>'}
  </div>
  <div class="aviso">Tu quincena base viene de tu contrato. Los bonos (puntualidad y extras) se suman al final de la quincena — cuídalos: se ganan con asistencia y chamba.</div>`;
 const b=$('#adelantar');
 if(b&&!b.disabled)b.onclick=async()=>{
  if(!confirm('¿Adelantar '+money(d.retirable_neto)+' de tus '+d.dias_trabajados+' días trabajados? Se descuenta 2% de comisión y el resto de tu quincena llega en el depósito normal.'))return;
  b.disabled=true;$('#msg').className='msg';$('#msg').textContent='Enviando…';
  try{const j=await rpc('solicitar_adelanto',{p_email:EMAIL});
   if(!j.ok){$('#msg').className='msg err';$('#msg').textContent=j.error||'No se pudo';b.disabled=false;return;}
   $('#msg').className='msg ok';$('#msg').textContent='✓ Solicitado · Tesorería lo revisa';setTimeout(pinta,900);
  }catch(e){$('#msg').className='msg err';$('#msg').textContent='Error de conexión';b.disabled=false;}
 };
}
pinta();
</script></body></html>
