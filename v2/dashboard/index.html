<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Dashboard · Casa Pepe</title>
<link rel="stylesheet" href="/v2/shared/ui.css"></head><body>
<div class="topbar"><span class="brand">Casa Pepe · Dashboard</span>
<span><span class="muted" id="user">…</span> · <a href="#" id="salir">salir</a></span></div>
<div class="wrap">
<p class="muted">Secciones según tus permisos:</p>
<div class="nav" id="nav"></div>
</div>
<script type="module">
import { requiereAuth, vincular, salir } from "/v2/shared/auth.js";
import { miNivel } from "/v2/shared/permisos.js";
const s=await requiereAuth("/v2/login/"); await vincular();
document.getElementById("user").textContent = s.user.email;
document.getElementById("salir").onclick=(e)=>{e.preventDefault();salir();};
const items=[
 {pag:"PAG-FIN-CONCILIACION",t:"Conciliación",d:"Pagos e ingresos vs banco",h:"/v2/dashboard/finanzas-conciliacion.html"},
 {pag:"PAG-FIN-FLUJO",t:"Flujo de caja",d:"Próximamente",h:"#"},
 {pag:"PAG-FIN-PAGOS",t:"Pagos críticos",d:"Próximamente",h:"#"},
 {pag:"PAG-SOCIOS-REPORTE",t:"Reporte a socios",d:"Próximamente",h:"#"}
];
const nav=document.getElementById("nav");
for(const it of items){ const n=await miNivel(it.pag); if(n!=="none"){ const a=document.createElement("a"); a.href=it.h; a.innerHTML=`<b>${it.t}</b><p>${it.d} · <em>${n}</em></p>`; nav.appendChild(a);} }
if(!nav.children.length) nav.innerHTML='<p class="muted">Aún no tienes secciones asignadas.</p>';
</script></body></html>
