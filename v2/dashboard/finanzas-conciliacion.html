<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Conciliación · Finanzas</title>
<link rel="stylesheet" href="/v2/shared/ui.css"></head><body>
<div class="topbar"><span class="brand">Casa Pepe · Finanzas</span><a href="/v2/dashboard/">← Dashboard</a></div>
<div class="wrap" id="app"><p class="muted">Cargando…</p></div>
<script type="module">
import { sb } from "/v2/shared/supabase.js";
import { requiereAuth, vincular } from "/v2/shared/auth.js";
import { miNivel } from "/v2/shared/permisos.js";
await requiereAuth("/v2/login/"); await vincular();
const app=document.getElementById("app");
const nivel=await miNivel("PAG-FIN-CONCILIACION");
const fmt=n=>Number(n).toLocaleString("es-MX",{minimumFractionDigits:2,maximumFractionDigits:2});
if(nivel==="none"){ app.innerHTML='<div class="card">No tienes permiso para ver Conciliación.</div>'; }
else{
  const editar=(nivel==="editar"||nivel==="admin");
  const { data:concs }=await sb.from("v_fin_conciliaciones").select("*");
  if(!concs||!concs.length){ app.innerHTML='<div class="card">Sin conciliaciones.</div>'; }
  else{
    const c=concs[0];
    const { data:pend }=await sb.from("v_fin_conciliacion_pendientes").select("*").eq("conciliacion_id",c.id).order("monto",{ascending:false});
    const estados=["pendiente","identificado","justificado","resuelto"];
    const rows=(pend||[]).map(p=>`<tr><td>${p.fecha||""}</td><td class="num">$${fmt(p.monto)}</td><td>${p.concepto||""}</td><td class="muted">${p.cuenta_destino||""}</td><td>${
      editar ? `<select data-id="${p.id}">`+estados.map(e=>`<option ${e===p.estado?"selected":""}>${e}</option>`).join("")+`</select>` : `<span class="badge b-${p.estado}">${p.estado}</span>`
    }</td></tr>`).join("");
    app.innerHTML=`<h2>Conciliación — ${c.entidad||""} · ${c.banco||""} ${c.cuenta||""} · ${c.periodo}</h2>
      <div class="card"><div class="kpis">
        <div class="kpi"><b>${c.matcheados}</b><span>Matcheados</span></div>
        <div class="kpi"><b>${c.pendientes_banco}</b><span>Pendientes banco</span></div>
        <div class="kpi"><b>${c.pendientes_qb}</b><span>Pendientes QB</span></div>
        <div class="kpi"><b>$${fmt(c.monto_pendiente)}</b><span>Monto pendiente</span></div>
      </div><p class="muted" style="margin:12px 0 0">Excluidos por acuerdo: HDI diferido e IMSS/impuestos (otra conciliación).</p></div>
      <div class="card"><table><thead><tr><th>Fecha</th><th class="num">Monto</th><th>Concepto</th><th>Cuenta destino</th><th>Estado</th></tr></thead><tbody>${rows}</tbody></table></div>
      <p class="muted" id="msg"></p>`;
    if(editar){ app.querySelectorAll("select[data-id]").forEach(sel=>{ sel.onchange=async()=>{
      const { data,error }=await sb.rpc("fin_pendiente_estado",{p_id:sel.dataset.id,p_estado:sel.value});
      document.getElementById("msg").textContent=(error||data!=="ok")?"No se pudo actualizar.":"Actualizado ✓";
    };});}
  }
}
</script></body></html>
