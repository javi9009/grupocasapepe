<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Entrar · Casa Pepe</title>
<link rel="stylesheet" href="/v2/shared/ui.css">
<style>body{display:flex;min-height:100vh;align-items:center;justify-content:center}.box{max-width:380px;width:100%;padding:24px}</style>
</head><body><div class="box">
<h1 class="brand">Casa Pepe</h1>
<p class="muted">Entra con tu correo. Te enviamos un enlace mágico.</p>
<input id="email" type="email" placeholder="tu@casapepe.mx" autocomplete="email">
<button class="btn" id="go" style="width:100%;margin-top:12px;padding:12px">Enviar enlace</button>
<p class="muted" id="msg" style="margin-top:14px"></p>
</div>
<script type="module">
import { sb } from "/v2/shared/supabase.js";
import { vincular } from "/v2/shared/auth.js";
const msg=document.getElementById("msg");
const { data:{ session } } = await sb.auth.getSession();
if(session){ await vincular(); location.href="/v2/dashboard/"; }
document.getElementById("go").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  if(!email){ msg.textContent="Escribe tu correo."; return; }
  msg.textContent="Enviando…";
  const { error }=await sb.auth.signInWithOtp({ email, options:{ emailRedirectTo: location.origin+"/v2/login/" }});
  msg.textContent = error ? ("Error: "+error.message) : "Listo — revisa tu correo y abre el enlace.";
};
</script></body></html>
