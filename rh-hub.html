<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RH · Grupo Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --warn:#8C6212; --warn-bg:#F3EAD6;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
header.top{padding:26px 0 6px}
header.top .miga{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  font-weight:600;margin-bottom:6px}
header.top h1{margin:0;font-size:1.5rem;letter-spacing:-.015em}
header.top p{margin:6px 0 0;color:var(--muted);font-size:.92rem;max-width:64ch}
.secnav{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin:18px 0 22px;overflow-x:auto}
.secnav a{padding:10px 14px;color:var(--muted);text-decoration:none;white-space:nowrap;
  border-bottom:2px solid transparent;font-size:.9rem}
.secnav a:hover{color:var(--ink)}
.secnav a.on{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px;padding-bottom:44px}
.tarjeta{display:flex;flex-direction:column;gap:7px;background:var(--surface);border:1px solid var(--rule);
  border-radius:11px;padding:17px 18px;box-shadow:var(--shadow);text-decoration:none;color:var(--ink);
  transition:border-color .12s}
.tarjeta:hover{border-color:var(--accent)}
.tarjeta:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tarjeta .ico{font-size:1.45rem;line-height:1}
.tarjeta h2{margin:0;font-size:1rem;letter-spacing:-.005em}
.tarjeta p{margin:0;font-size:.82rem;color:var(--muted);line-height:1.45}
.tarjeta .tag{margin-top:auto;padding-top:8px;font-size:.68rem;font-weight:600;color:var(--accent)}
.tarjeta.nuevo h2::after{content:"nuevo";background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;font-size:.62rem;font-weight:600;
  padding:1px 7px;margin-left:8px;vertical-align:2px}
footer.pie{padding:0 0 40px;color:var(--faint);font-size:.78rem}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="miga">Recursos Humanos</div>
    <h1 id="titulo"></h1>
    <p id="dek"></p>
  </header>
  <nav class="secnav" id="secnav"></nav>
  <div class="cards" id="cards"></div>
  <footer class="pie">Los permisos de cada herramienta se administran en Accesos; si una tarjeta te pide sesión, es que tu rol no la tiene asignada.</footer>
</div>

<script>
const SEC = {
  horarios: {
    titulo: "Horarios",
    dek: "Quién trabaja cuándo: turnos, calendario y vacaciones.",
    cards: [
      {ico:"📅", t:"Horarios", d:"El calendario de turnos por propiedad y puesto. Asigna, mueve y publica la semana.", href:"/m/rh-horario"},
      {ico:"🌴", t:"Vacaciones", d:"Saldos, solicitudes y el calendario de fechas rojas.", href:"/m/rh-expediente", tag:"dentro del expediente"}
    ]
  },
  incorporacion: {
    titulo: "Incorporación y desempeño",
    dek: "El ciclo completo del colaborador: entra, se forma, se evalúa y crece.",
    cards: [
      {ico:"＋", t:"Alta de trabajador", d:"Registrar a alguien nuevo con sus datos y documentos.", href:"/m/alta-trabajador"},
      {ico:"👤", t:"Crear usuario", d:"Darle acceso a la plataforma y a SoyPepe.", href:"/m/crear-usuario"},
      {ico:"✅", t:"Autorizar altas", d:"Aprobar las altas pendientes antes de que entren a nómina.", href:"/m/autorizar-altas.html"},
      {ico:"✍️", t:"Aceptación y contratos", d:"Generar el contrato, mandarlo a firma y archivar el acuse.", href:"/m/contratos"},
      {ico:"🧭", t:"Incorporaciones", d:"Quién está en periodo de prueba, su rotación de turnos y los hitos que vencen.", href:"/rh-incorporaciones.html", nuevo:true},
      {ico:"📖", t:"Procedimientos", d:"El catálogo maestro: qué lee cada puesto, cobertura de PepeQuiz y salud del paquete.", href:"/rh-procedimientos.html", nuevo:true},
      {ico:"📝", t:"Test de desempeño", d:"El test cuatrimestral que contesta cada jefe sobre su equipo. Cinco minutos.", href:"/rh-eval.html", nuevo:true},
      {ico:"📊", t:"Desempeño", d:"La pila de los cinco criterios por colaborador: puntualidad, actitud, oficio, conocimiento y discurso.", href:"/rh-desempeno.html", nuevo:true}
    ]
  },
  nomina: {
    titulo: "Nómina",
    dek: "Lo que se paga y por qué: quincenas, incidencias y el tabulador.",
    cards: [
      {ico:"💵", t:"Salarial quincenal", d:"La quincena en curso: percepciones, deducciones y cierre.", href:"/m/rh-nomina"},
      {ico:"⚠️", t:"Incidencias quincenal", d:"Retardos, faltas, horas extra y ajustes que afectan la quincena.", href:"/m/rh-incidencias"},
      {ico:"📐", t:"Rangos salariales", d:"El tabulador por puesto, sede y tramo: prácticas, junior, junior 2 y senior.", href:"/m/rh-rangos"}
    ]
  },
  expedientes: {
    titulo: "Expedientes",
    dek: "Quién es quién: la plantilla, su historia y su lugar en el organigrama.",
    cards: [
      {ico:"🗂️", t:"Base · ID maestro", d:"El registro maestro de colaboradores y sus identificadores.", href:"/m/rh-base"},
      {ico:"📁", t:"RH · Expediente", d:"Los Pepes: documentos, contratos y datos de cada colaborador.", href:"/m/rh-expediente"},
      {ico:"🧬", t:"Ficha 360", d:"Todo lo de una persona en una vista: criterios, maestría, bonos, puntualidad y movimientos.", href:"/rh-ficha.html", nuevo:true},
      {ico:"🏛️", t:"Organigrama", d:"Las seis categorías, quién reporta a quién, y el editor de cajas para mover a la gente.", href:"/rh-organigrama.html", nuevo:true}
    ]
  }
};
const ORDEN = ["horarios","incorporacion","nomina","expedientes"];
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const sec = (new URLSearchParams(location.search).get("sec")||"incorporacion");
const S = SEC[sec] || SEC.incorporacion;
document.title = S.titulo + " · RH · Grupo Casa Pepe";
$("#titulo").textContent = S.titulo;
$("#dek").textContent = S.dek;
$("#secnav").innerHTML = ORDEN.map(k=>
  `<a href="/rh-hub.html?sec=${k}" class="${(SEC[sec]===SEC[k])?"on":""}">${esc(SEC[k].titulo)}</a>`).join("");
$("#cards").innerHTML = S.cards.map(c=>
  `<a class="tarjeta${c.nuevo?" nuevo":""}" href="${esc(c.href)}">
     <span class="ico">${c.ico}</span>
     <h2>${esc(c.t)}</h2>
     <p>${esc(c.d)}</p>
     ${c.tag?`<span class="tag">${esc(c.tag)}</span>`:""}
   </a>`).join("");
</script>
</body>
</html>
