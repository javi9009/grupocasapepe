<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RH · Grupo Casa Pepe</title>
<style>
:root{
  --ground:#F4F1EA; --surface:#FFFFFF; --surface-2:#EFE9DD; --surface-3:#FBF8F1;
  --ink:#1F1B16; --ink-2:#3A3630; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E2DCCF; --rule-2:#D2C8B6;
  --accent:#137A56; --accent-soft:#DCEFE6; --on-accent:#FFFFFF;
  --shadow:0 1px 1px rgba(31,27,22,.04), 0 10px 26px -20px rgba(31,27,22,.35);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;
  font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1180px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:2px;overflow-x:auto}
.secnav .miga{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--faint);
  font-weight:600;white-space:nowrap;padding-right:14px;border-right:1px solid var(--rule);margin-right:8px}
.secnav button{border:0;background:none;font:inherit;padding:12px 14px;color:var(--muted);
  cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
.secnav button:hover{color:var(--ink)}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.secnav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.secnav .pill{display:inline-block;margin-left:6px;background:var(--accent-soft);color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;font-size:.6rem;font-weight:600;padding:0 6px;vertical-align:1px}
#marco{flex:1;border:0;width:100%;background:var(--ground)}
</style>
</head>
<body>
<nav class="secnav" aria-label="Subcategorías">
  <div class="secnav-in">
    <span class="miga" id="miga">RH</span>
    <span id="tabs" style="display:contents"></span>
  </div>
</nav>
<iframe id="marco" title="Contenido"></iframe>

<script>
const SEC = {
  horarios: {
    titulo: "Horarios",
    subs: [
      {k:"horarios",   t:"Horarios",   href:"/m/rh-horario"},
      {k:"vacaciones", t:"Vacaciones", href:"/rh-vacaciones.html", nuevo:true}
    ]
  },
  incorporacion: {
    titulo: "Incorporación y desempeño",
    subs: [
      {k:"alta",            t:"＋ Alta",              href:"/m/alta-trabajador"},
      {k:"usuario",         t:"Crear usuario",        href:"/m/crear-usuario"},
      {k:"autorizar",       t:"Autorizar altas",      href:"/m/autorizar-altas.html"},
      {k:"contratos",       t:"Contratos",            href:"/m/contratos"},
      {k:"incorporaciones", t:"Incorporaciones",      href:"/rh-incorporaciones.html", nuevo:true},
      {k:"procedimientos",  t:"Procedimientos",       href:"/rh-procedimientos.html",  nuevo:true},
      {k:"test",            t:"Test de desempeño",    href:"/rh-eval.html",            nuevo:true},
      {k:"desempeno",       t:"Desempeño",            href:"/rh-desempeno.html",       nuevo:true}
    ]
  },
  nomina: {
    titulo: "Nómina",
    subs: [
      {k:"salarial",    t:"Salarial quincenal",    href:"/m/rh-nomina"},
      {k:"incidencias", t:"Incidencias quincenal", href:"/m/rh-incidencias"},
      {k:"rangos",      t:"Rangos salariales",     href:"/m/rh-rangos"}
    ]
  },
  expedientes: {
    titulo: "Expedientes",
    subs: [
      {k:"expediente",  t:"Expediente · ID maestro", href:"/m/rh-expediente"},
      {k:"ficha",       t:"Ficha 360",         href:"/rh-ficha.html",       nuevo:true},
      {k:"organigrama", t:"Organigrama",       href:"/rh-organigrama.html", nuevo:true}
    ]
  }
};
const $ = s => document.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const params = new URLSearchParams(location.search);
const sec = SEC[params.get("sec")] ? params.get("sec") : "incorporacion";
const S = SEC[sec];
document.title = S.titulo + " · RH · Grupo Casa Pepe";
$("#miga").textContent = "RH · " + S.titulo;

let subK = params.get("sub");
if(!S.subs.some(x=>x.k===subK)) subK = S.subs[0].k;

$("#tabs").innerHTML = S.subs.map(x=>
  `<button role="tab" data-k="${esc(x.k)}" aria-selected="false">${esc(x.t)}${x.nuevo?'<span class="pill">nuevo</span>':""}</button>`).join("");

function abre(k){
  const x = S.subs.find(s=>s.k===k) || S.subs[0];
  subK = x.k;
  document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected", b.dataset.k===subK ? "true":"false"));
  $("#marco").src = x.href;
  try{ history.replaceState(null,"", location.pathname+"?sec="+sec+"&sub="+subK); }catch(e){}
}
document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>abre(b.dataset.k));
abre(subK);
</script>
</body>
</html>
