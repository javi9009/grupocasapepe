  /* ---------- mis experiencias ----------
     Es el mismo modulo del touroperador, no uno parecido: las fichas viven en
     op_experiencias, se miden con los mismos trece chequeos de
     /m/tour-editor.html y se editan en /ficha.html, que es la ficha de verdad.
     Lo unico propio del hotel es que su operador_id es el suyo. */
  var CHEQUEOS=[
    {k:'precio',l:'$',t:'Precio',ok:function(e){return !!(e.precio_adulto||e.neto_adulto);}},
    {k:'foto',l:'F',t:'Al menos una foto',ok:function(e){return (e.n_fotos||0)>0;}},
    {k:'descripción',l:'T',t:'Descripción: qué va a vivir la persona',ok:function(e){return !!e.tiene_texto;}},
    {k:'de dónde sale',l:'D',t:'De dónde sale',ok:function(e){return !!e.cer_inicio_lugar;}},
    {k:'recorrido',l:'R',t:'Las paradas del recorrido',ok:function(e){return (e.n_paradas||0)>0;}},
    {k:'qué incluye',l:'I',t:'Qué incluye',ok:function(e){return !!e.tiene_incluye;}},
    {k:'cancelación',l:'X',t:'Política de cancelación',ok:function(e){return !!e.tiene_cancelacion;}},
    {k:'ADN',l:'A',t:'ADN: La Ruta',ok:function(e){return !!e.storytelling;}},
    {k:'costeo',l:'C',t:'Costeo · paso 10',ok:function(e){return !!e.lineas_costeo;},
     aplica:function(e){return e.clase==='propia';}},
    {k:'guía del guía',l:'G',t:'Guía del guía · paso 11',ok:function(e){return !!e.guias_del_guia;},
     aplica:function(e){return e.clase==='propia';}},
    {k:'ODS',l:'O',t:'Impacto declarado',ok:function(e){return !!e.ods;}},
    {k:'publicar',l:'P',t:'Publicada',ok:function(e){return e.estado==='publicada';}}
  ];
  function aplicaC(c,e){ return c.aplica?c.aplica(e):true; }
  function faltan(e){ return CHEQUEOS.filter(function(c){return aplicaC(c,e)&&!c.ok(e);}).map(function(c){return c.k;}); }
  function semaforo(e){
    return CHEQUEOS.map(function(c){
      if(!aplicaC(c,e)) return '<span class="pt na" title="'+esc(c.t)+' · no aplica">·</span>';
      var ok=c.ok(e);
      return '<span class="pt '+(ok?'ok':'no')+'" title="'+esc(c.t)+(ok?'':' · falta')+'">'+(ok?'✓':c.l)+'</span>';
    }).join('');
  }

  /* El hotel necesita una ficha de touroperador para colgar de ella sus
     experiencias. Es ponerse el sombrero, no crear otra empresa: queda
     apuntada en entidad_papeles junto a su papel de hotel. */
  /* ESTA FUNCION ERA LA FABRICA DE LOS DUPLICADOS. Javi, 27-oct-2026.
     Resolvia el ateneista de una casa BUSCANDO POR NOMBRE, y si no lo
     encontraba creaba uno. Cada casa que abria «Mis experiencias» y no tenia
     un ateneista llamado exactamente igual se fabricaba el suyo: asi es como
     Barrio acabo con dos fichas, una por casa.
     Y hoy, al decidir Javi que «el ateneista debería ser el grupo», el nombre
     dejo de coincidir a proposito -el ateneista es «Barrio» y la casa es
     «Barrio Bolivar»-, asi que esta funcion habria vuelto a crear el duplicado
     que acabamos de fusionar, en silencio, en cuanto alguien abriera la
     seccion.
     Ahora se resuelve por la LIGA, que es el dato que dice de quien es la
     casa; el nombre solo vale de respaldo para las que todavia no la tienen.
     Y crear uno nuevo deja de ser automatico: si no hay a quien colgarse, se
     dice, porque crear una ficha de alguien sin que nadie lo pida es
     exactamente el problema. */
  async function sombreroTO(d){
    if(d.ateneista_id){
      var liga=await get('tour_operadores?select=id,nombre_comercial&id=eq.'+encodeURIComponent(d.ateneista_id));
      if(liga && liga[0]) return liga[0];
    }
    /* Respaldo para las casas que aun no estan ligadas: por nombre, y si lo
       encuentra, se liga para no volver a adivinar. */
    var yo=await get('tour_operadores?select=id,nombre_comercial&nombre_comercial=eq.'+encodeURIComponent(d.nombre_comercial||''));
    if(yo && yo[0]){
      fetch(SB+'/rest/v1/hoteles?id=eq.'+d.id,{method:'PATCH',headers:hdr(),
        body:JSON.stringify({ateneista_id:yo[0].id})}).then(function(){ d.ateneista_id=yo[0].id; }).catch(function(){});
      return yo[0];
    }
    toast('Esta casa no está ligada a ningún ateneísta. Se liga desde La comunidad; aquí no se crea uno nuevo.',true);
    var w=$('wrap');
    if(w) w.innerHTML='<div class="card"><h3>Falta saber de quién es esta casa</h3>'
      +'<div class="hint">Sus experiencias cuelgan del ateneísta que la tiene, y <b>'+esc(d.nombre_comercial||'esta casa')
      +'</b> todavía no está ligada a ninguno. Se liga desde <b>La comunidad</b>, en la ficha del ateneísta.</div>'
      +'<div class="hint" style="margin-top:8px">Antes esta pantalla creaba uno en silencio con el nombre de la casa. '
      +'Así es como un grupo acababa con una ficha por casa.</div></div>';
    return null;
  }

  async function sombreroTO_crea(d){
    var r=await fetch(SB+'/rest/v1/tour_operadores',{method:'POST',
      headers:Object.assign(hdr(),{Prefer:'return=representation'}),
      body:JSON.stringify({nombre_comercial:d.nombre_comercial,ciudad:d.ciudad,email:d.email,
        whatsapp:d.whatsapp,web:d.web,razon_social:d.razon_social,rfc:d.rfc,
        tipo_persona:d.tipo_persona,estado:'activo'})});
    if(!r.ok){ toast('No se pudo crear tu ficha de touroperador: '+(await r.text()).slice(0,110),true); return null; }
    var to=(await r.json())[0];
    var pap=await get('entidad_papeles?select=entidad_id&papel=eq.hotel&ref_id=eq.'+d.id);
    var ent=(pap&&pap[0]&&pap[0].entidad_id)||null;

  /* op_experiencias solo acepta CDMX, Puebla o Guatemala; el hotel escribe su
     ciudad como le da la gana ("Ciudad de México"). Se traduce antes de
     guardar, en vez de dejar que la base lo rechace con un 23514. */
  function ciudadCat(c){
    var t=(c||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    if(t.indexOf('puebla')>=0 || t.indexOf('cholula')>=0 || t.indexOf('atlixco')>=0) return 'Puebla';
    if(t.indexOf('guatemala')>=0 || t.indexOf('antigua')>=0) return 'Guatemala';
    return 'CDMX';
  }
  function min2h(m){ if(!m) return ''; var h=Math.floor(m/60), r=m%60;
    return (h?h+' h':'')+(h&&r?' ':'')+(r?r+' min':''); }

  /* ---------- EL SOMBRERO DE PRODUCTORA ----------
     Javi, 11-oct-2026: «debe ser el sistema de creación de la touroperadora
     […] lo mismo con los eventos». Así que el hotel NO tiene un formulario de
     eventos propio: se le da su ficha de productora —como ya se le da la de
     touroperador para las experiencias— y monta sus eventos en el MISMO
     asistente del Ateneo, con sus tres clases, su calendario de sala, sus
     boletos y sus fotos. Una sola pantalla: lo que se arregle allí le llega
     aquí sin tocar nada.

     Sus espacios se enlazan como «opera»: son suyos, no prestados. */
  async function sombreroPROD(d){
    var yo=await get('productoras?select=id,nombre_comercial,portal_token&nombre_comercial=eq.'
      +encodeURIComponent(d.nombre_comercial||''));
    var pr=(yo&&yo[0])||null;
    if(!pr){
      var r=await fetch(SB+'/rest/v1/productoras',{method:'POST',
        headers:Object.assign(hdr(),{Prefer:'return=representation'}),
        body:JSON.stringify({nombre_comercial:d.nombre_comercial,ciudad:ciudadCat(d.ciudad),
          email:d.email,whatsapp:d.whatsapp,razon_social:d.razon_social,rfc:d.rfc,
          tipo_persona:d.tipo_persona,estado:'activo',rol_ateneo:'productora',puede_gratis:true,
          com_hotel_pct:d.com_hotel_pct,com_vendedor_pct:d.com_colaborador_pct,
          com_plataforma_pct:d.com_plataforma_pct})});
      if(!r.ok){ toast('No se pudo crear tu ficha de productora: '+(await r.text()).slice(0,110),true); return null; }
      pr=(await r.json())[0];
      var pap=await get('entidad_papeles?select=entidad_id&papel=eq.hotel&ref_id=eq.'+d.id);
      var ent=(pap&&pap[0]&&pap[0].entidad_id)||null;
      if(ent) await fetch(SB+'/rest/v1/entidad_papeles',{method:'POST',headers:hdr(),
        body:JSON.stringify([{entidad_id:ent,papel:'productora',ref_tabla:'productoras',
          ref_id:pr.id,principal:false,nota:pr.nombre_comercial}])});
    }
    /* Sus salas, cada vez: si creó una terraza nueva en «Mis espacios» tiene
       que poder montar en ella sin que nadie la enlace a mano. */
    var casas=[G].concat(HOT||[]).filter(Boolean).map(function(x){return x.id;});
    var mias=await get('ev_espacios?select=id&hotel_id=in.('+casas.join(',')+')')||[];
    var ya=await get('ev_productora_espacios?select=espacio_id&productora_id=eq.'+pr.id)||[];
    var hay={}; ya.forEach(function(x){ hay[x.espacio_id]=1; });
    var faltan=mias.filter(function(e){ return !hay[e.id]; });
    if(faltan.length) await fetch(SB+'/rest/v1/ev_productora_espacios',{method:'POST',headers:hdr(),
      body:JSON.stringify(faltan.map(function(e){
        return {productora_id:pr.id,espacio_id:e.id,estado:'aprobado',relacion:'opera',
                nota:'espacio propio del hotel'};}))}).catch(function(){});
    return pr;
  }
  async function abreProductora(d,evId){
    /* EL MARCO SE FIRMA UNA VEZ (doc 116). El asistente de productoras pide
       firmar SU convenio antes de dejar entrar; pero el hotel y su sombrero
       son la misma persona, y esa persona ya firmó su contrato marco. Así que
       el sombrero hereda la firma del hotel. Si el hotel todavía no ha
       firmado, se lo decimos con sus palabras, aquí, en vez de soltarlo en un
       check-in de productora que no entiende. */
    if(!d.contrato_firmado_at){
      toast('Primero firma tu contrato marco',true);
      var w2=$('vfi')||$('wrap');
      if(w2) w2.insertAdjacentHTML('afterbegin',
        '<div class="card" style="border-color:#E6D2A8"><h3>Antes de montar eventos, el contrato</h3>'
        +'<div class="hint">Los eventos se venden por la plataforma, y eso se ampara en tu contrato marco. '
        +'Está en <b>Mi cuenta · El acuerdo</b>: se genera con tus datos y lo firmas en línea. '
        +'En cuanto esté firmado, el asistente de eventos se abre solo.</div></div>');
      return;
    }
    var pr=await sombreroPROD(d); if(!pr) return;
    /* La firma del marco viaja al sombrero, con los datos fiscales que ya dio. */
    await fetch(SB+'/rest/v1/productoras?id=eq.'+pr.id,{method:'PATCH',headers:hdr(),
      body:JSON.stringify({razon_social:d.razon_social,rfc:d.rfc,tipo_persona:d.tipo_persona,
        contrato_version:d.contrato_version,contrato_firmado_at:d.contrato_firmado_at,
        contrato_firmante:d.contrato_firmante,estado:'activo',
        email_notificaciones:d.email_notificaciones||d.email})}).catch(function(){});
    if(!pr.portal_token){
      var r=await fetch(SB+'/rest/v1/productoras?id=eq.'+pr.id,
        {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=representation'}),
         body:JSON.stringify({portal_token:crypto.randomUUID()})});
      if(r.ok){ var j=await r.json(); pr.portal_token=(j&&j[0]&&j[0].portal_token)||null; }
    }
    if(!pr.portal_token){ toast('No se pudo abrir tu asistente de eventos',true); return; }
    window.open('/productora.html?t='+encodeURIComponent(pr.portal_token)
      + (evId?'&ev='+encodeURIComponent(evId):''),'_blank','noopener');
  }

  /* ---------- mis eventos ----------
     Mismos chequeos que el modulo del Ateneo (/m/eventos.html), sobre la misma
     tabla. Lo unico distinto es de donde salen los espacios: los suyos, no los
     de Virreyes. */
  var CHEQ_EV=[
    {k:'nombre',l:'N',t:'Nombre',ok:function(e){return !!(e.nombre&&String(e.nombre).trim());}},
    {k:'espacio',l:'S',t:'Dónde se hace',ok:function(e){return !!e.espacio_id;}},
    {k:'fecha',l:'F',t:'Fecha',ok:function(e){return !!e.fecha_inicio;}},
    {k:'hora',l:'H',t:'Hora',ok:function(e){return !!(e.fecha_inicio&&String(e.fecha_inicio).length>=16);}},
    {k:'precio',l:'$',t:'Precio, o entrada libre',ok:function(e){return !!e.es_gratis||Number(e.precio||0)>0;}},
    {k:'cupo',l:'C',t:'Cuánta gente cabe',ok:function(e){return Number(e.aforo||e.cupo||0)>0;}},
    {k:'texto',l:'D',t:'De qué va',ok:function(e){return !!(e.descripcion&&String(e.descripcion).trim());}},
    {k:'foto',l:'P',t:'Al menos una foto',ok:function(e){return !!(e.fotos&&e.fotos.length);}},
    {k:'publicado',l:'✦',t:'Publicado',ok:function(e){return e.estado==='publicado'||e.estado==='realizado';}}
  ];
  function faltanEv(e){ return CHEQ_EV.filter(function(c){return (!c.aplica||c.aplica(e))&&!c.ok(e);}).map(function(c){return c.k;}); }
  function semEv(e){
    return CHEQ_EV.map(function(c){
      if(c.aplica&&!c.aplica(e)) return '<span class="pt na">·</span>';
      var ok=c.ok(e);
      return '<span class="pt '+(ok?'ok':'no')+'" title="'+esc(c.t)+(ok?'':' · falta')+'">'+(ok?'✓':c.l)+'</span>';
    }).join('');
  }

  function cuando(v){
    if(!v) return '';
    try{ return new Date(v).toLocaleString('es-MX',{timeZone:'America/Mexico_City',
      day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:false}); }
    catch(_){ return String(v).slice(0,16).replace('T',' '); }
  }

        +'<span class="op">'+esc(e?e.nombre:'sin espacio')+'</span>'

  /* ---------- las ligas, cada una donde se usa ----------
     Javi, 27-oct-2026: «esto ahora queda inútil. El acceso de la app muestra

      +'<div class="hint">La comisión de quien vende ('+esc(d.com_colaborador_pct==null?'—':d.com_colaborador_pct+'%')
      +') se liquida a la casa en el corte; la casa decide cómo se la paga a cada uno. '
      +'Los porcentajes se cambian en <b>Mi cuenta · Cómo te pagamos</b>, y de ahí salen éstos.</div></div>'
      +'<div class="card"><h3>Por dónde entran a vender</h3>'
      +'<div class="hint">Son dos ligas y no se confunden: la primera la abre cada uno <b>una vez</b>, para ponerse '
      +'su contraseña y recibir su código; la segunda es la de todos los días, la del turno.</div>'
      + filaLiga({g:'key', t:'Su primera vez', u:location.origin+'/concierge-acceso.html',
          d:'Se pone su contraseña y le sale su código de venta. Cada persona tiene la suya con su propia llave dentro, '
           +'y le llega al darla de alta aquí abajo: esta liga a secas no sirve para entrar.',
          q:'No se reparte en grupo: sale del alta de cada quien'})
      + filaLiga({g:'users', t:'La de cada turno', u:location.origin+'/concierge.html',
          d:'Las experiencias que vende esta casa, su comisión a la vista y el cobro. Ya con su correo y su contraseña.',
          q:'Es la que se deja en el escritorio de recepción'})
      +'</div>';
    ataLigas(w);
    /* Sin esto la tabla sale vacia para quien entra directo aqui sin pasar por
       Mi cuenta: eqCarga() solo se llamaba desde alli. Es el fallo de siempre
       -una pantalla que lee lo que otra carga- y aqui se evita cargando. */
    if(!(EQ.gente||[]).length) await eqCarga(); else eqPinta();
    var c=$('concCuenta'); if(!c) return;
    var vende=(EQ.gente||[]).filter(function(u){return (u.rol||'')==='concierge'||u.codigo_venta;});
    c.innerHTML = vende.length
      ? vende.length+' de '+EQ.gente.length+' venden.'
      : '<span class="nomi" style="display:block">Todavía nadie tiene código de venta. Dale uno a alguien abajo y aparece aquí.</span>';
  }

  /* ---------- mi app: la portada y sus cajas ----------
     Javi, 26-oct-2026: «si se pudiera que escogiera el usuario qué info va en
     cada caja para que pudiera editarlo un poco».
     El diseno pedia once campos nuevos en la ficha. Seis no existian, y
     anadirlos no aguantaba las cuatro clases de propiedad: un gran turismo
     quiere spa y seis departamentos, una renta corta quiere «como entrar» y
     «la lavadora», y ninguna quiere las columnas de la otra. Asi que no son
     columnas: son PIEZAS, y la casa decide en que ranura va cada una.
     Las `auto` no se teclean -su valor sale de la ficha al leerlo, para que no
     se quede viejo-; las `libres` las escribe la casa. */
  var PZ=[], PZedit=null;

  var RANURAS=[
    ['rapida', 'La banda de arriba', 'Tres datos cortos que el huésped ve sin bajar. Si pones más de tres, los demás esperan su turno.'],
    ['rejilla','En la casa',         'Lo que tienes y se puede usar: el restaurante, las maletas, la terraza, el wifi.'],
    ['indice', 'El índice',          'La lista numerada de la portada sobria. Máximo seis; de la séptima en adelante sale un «ver todo».'],
    ['contacto','A quién se escribe','Recepción, o cada departamento si eres grande, o la persona del WhatsApp si es una renta corta.'],
    ['',       'Guardadas, sin usar','Existen pero no se pintan. Es la manera de apagar algo sin borrarlo.']
  ];
  var PORTADAS=[
    ['casa',    'La casa por delante', 'Manda una foto grande de la propiedad y debajo lo que tienes. Necesita foto de portada.'],
    ['contacto','Habla con la casa',   'Lo primero es cómo llegar a una persona. Para quien resuelve por WhatsApp o por recepción.'],
    ['sobria',  'Sobria',              'Poca imagen y mucho aire. Es la que aguanta con menos datos, y la que se pone si no eliges.']
  ];

  /* DOS LECTURAS, Y HACEN FALTA LAS DOS.
     `hotel_piezas` guarda la pieza; las de origen `auto` NO guardan el dato —su
     valor vive en la ficha del hotel y se resuelve al leerlo, para que el dia
     que la casa cambie su hora de salida cambie sola—. Por eso la tabla cruda
     trae `dato` en null para ellas, y por eso esta pantalla llevaba toda la
     semana enseniando una raya donde decia «de tu ficha».
     Javi, 27-oct-2026: «no entiendo como generas o editas los submodulos».
     Claro que no: la pantalla le decia que el dato salia de su ficha y acto
     seguido le enseniaba que no habia dato.
     PZ  = la cruda, que es la que se edita y la unica que se puede escribir.
     PZR = la resuelta, que es la que se ENSENIA, aqui y en el telefono. */
  var PZR={};
  async function cargaPiezas(){
    var d=destino(); if(!d) return;
    PZ = await get('hotel_piezas?select=*&hotel_id=eq.'+d.id+'&order=ranura,orden') || [];
    PZR={};
    try{
      var r=await fetch(SB+'/rest/v1/rpc/hotel_piezas_resueltas',{method:'POST',headers:hdr(),
        body:JSON.stringify({p_hotel:d.id})});
      if(r.ok) (await r.json()||[]).forEach(function(x){ PZR[x.id]=x; });
    }catch(_){ /* sin resolver se ve la cruda: peor, pero no en blanco */ }
  }
  /* Lo que de verdad va a leer el huesped en esa pieza. */
  function pzDato(x){ var r=PZR[x.id]; return (r&&r.dato) || x.dato || ''; }
  function pzNota(x){ var r=PZR[x.id]; return (r&&r.nota) || x.nota || ''; }

  async function vApp(w){
    var d=destino();
    w.innerHTML='<div class="card"><h3>La portada</h3>'
      +'<div class="hint">Lo que ve tu huésped al abrir la app. Las tres llevan tu logo y tus colores; lo que cambia es qué se ve primero.</div>'
      +'<div class="hgrid" id="pgPort" style="margin-top:12px"></div></div>'
      +'<div class="card"><h3>La foto de portada</h3>'
      +'<div class="hint">Una sola, de la propiedad. Sin ella no se puede elegir «La casa por delante»: sería una portada de foto sin foto.</div>'
      +'<div class="fgrid"><div class="fld" style="grid-column:1/-1"><label>URL de la imagen</label>'
      +'<input data-c="foto_portada" value="'+esc(d.foto_portada||'')+'" placeholder="https://…/portada.jpg"></div></div>'
      + (d.foto_portada?'<img src="'+esc(d.foto_portada)+'" alt="" style="margin-top:10px;width:100%;max-width:340px;border-radius:10px;display:block">':'')
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>'
      +'<div class="card"><h3>Qué va en cada caja</h3>'
      +'<div class="hint">Cada cosa que enseñas es una pieza, y tú decides en qué caja va. '
      +'Las que dicen <b>de tu ficha</b> no se escriben aquí: salen de lo que ya pusiste en Mi cuenta, '
      +'así que el día que cambies tu hora de salida, cambia sola. '
      +'<b>Una caja sin piezas no se pinta</b>: no queda hueco.</div>'
      +'<div class="ft" style="justify-content:flex-start;margin-top:10px">'
      +'<button class="btn" id="pzNueva">+ Añadir una pieza</button>'
      +'<button class="btn ghost" id="pzSembrar">Traer lo que ya está en mi ficha</button></div></div>'
      +'<div class="card" id="cPal"><h3>Tus colores</h3>'
      +'<div class="hint">Cargando tu marca…</div></div>'
      +'<div class="card"><h3>Tu app por dentro</h3>'
      +'<div class="hint">Ésta es la portada que tienes puesta, a tamaño de teléfono y con tus datos de verdad. '
      +'<b>Toca cualquier caja</b> y eliges qué va ahí. Baja por el teléfono para ver cómo queda todo.</div>'
      +'<div class="taller"><div id="fonoG"></div><div class="bandeja" id="bandeja"></div></div></div>'
      +'<div id="pzCajas"><div class="mini">Cargando…</div></div>'
      +'<div class="card" id="cLigaApp"><h3>La liga que se reparte</h3>'
      +'<div class="hint">Una sola, y lleva tu marca: quien la abre ve tu nombre, tu logo y tus colores, no los nuestros. '
      +'No hace falta estar hospedado para entrar — quien llega de fuera puede comprar igual.</div>'
      + filaLiga({g:'bed', t:(nivel==='hotel'?'La app de esta casa':'La app de tu huésped'), u:ligaApp(d),
          d:'El check-in, el mapa, las experiencias y todo lo que le puedes vender.',
          q:'Va en el QR de recepción, en el correo de reserva y en tu bio'})
      +'</div>';
    ataGuarda();
    ataLigas(w);
    await cargaPaleta();
    await cargaPiezas();
    pintaPortadas();          /* con paleta y piezas: el previo es el suyo */
    pintaPaleta();
    pintaTaller();
    pintaPiezas();
    $('pzNueva').onclick=function(){ PZedit={nuevo:true, origen:'libre', ranura:'rejilla', activo:true}; pintaPiezas(); };
    $('pzSembrar').onclick=async function(){
      var b=this; b.disabled=true;
      try{
        var r=await fetch(SB+'/rest/v1/rpc/hotel_piezas_siembra',{method:'POST',headers:hdr(),
          body:JSON.stringify({p_hotel:destino().id})});
        if(!r.ok) throw new Error(await r.text());
        var n=await r.json();
        toast(n? ('Traídas '+n+' piezas de tu ficha') : 'Tu ficha no tiene nada más que traer');
        await cargaPiezas(); pintaPiezas();
      }catch(e){ toast('No se pudo',true); }
      b.disabled=false;
    };
  }

  /* EL PREVIO. Javi, 27-oct-2026: «enséñale cómo quedaría su app para que
     escojan cuál tener». Tres parrafos describiendo tres portadas no se
     comparan: se comparan mirandolas. El telefonito va pintado con SU paleta,
     SU logo, SU foto y SUS piezas, asi que lo que escoge es lo que va a
     tener, no un ejemplo con datos de otro. */
  /* LA MARCA SE HEREDA DEL GRUPO, Y EL PREVIO NO LO SABIA.
     `apepe_marca()` —la funcion que viste de verdad a la app del huesped— no
     busca solo la marca de ESA casa: si no tiene, toma la de una hermana del
     mismo grupo. Por eso la app de Barrio Bolivar sale con los colores de
     Barrio aunque Bolivar no tenga ni una fila de marca propia.
     Mi previo leia `hotel_marca` de esa casa a secas, no encontraba nada y
     pintaba los telefonos en gris. Ensenaba una app que no existe: la de
     verdad sale en color. Javi, 27-oct-2026.
     Aqui se repite la misma herencia —no se puede llamar a apepe_marca() y ya,
     porque devuelve la paleta ELEGIDA y el selector necesita la lista entera—.
     `MAR_HEREDADA` marca de donde salio, para poder decirlo en pantalla. */
  var PAL=null, MAR=null, MAR_HEREDADA=null;
  async function cargaPaleta(){
    var d=destino(); if(!d) return;
    MAR_HEREDADA=null;
    var r=await get('hotel_marca?select=paletas,paleta_elegida,logo_url&hotel_id=eq.'+d.id);
    var m=(r&&r[0])||null, P=null;
    if(!m){
      /* Las hermanas del grupo, incluido el nivel de arriba. */
      var fam=GRUPOS.filter(function(h){ return h.grupo_id && d.grupo_id && h.grupo_id===d.grupo_id && h.id!==d.id; });
      if(fam.length){
        var r2=await get('hotel_marca?select=paletas,paleta_elegida,logo_url,hotel_id&hotel_id=in.('
          + fam.map(function(h){return h.id;}).join(',') + ')');
        if(r2 && r2[0]){
          m=r2[0];
          var dueno=fam.filter(function(h){return h.id===m.hotel_id;})[0];
          MAR_HEREDADA=(dueno&&dueno.nombre_comercial)||'otra casa del grupo';
        }
      }
    }
    MAR=m;
    try{
      var L=(m&&m.paletas)||[];
      P=L.filter(function(x){ return Number(x.n)===Number(m.paleta_elegida||1); })[0]||L[0]||null;
    }catch(_){ }
    /* Sin paleta puesta se enseña en gris, no en los colores de otro: el
       previo tiene que decir la verdad tambien cuando falta. */
    PAL = P || {fondo:'#EFEAE3',suave:'#FBF8F3',tinta:'#2B2620',fuerte:'#8A8178',oscuro:'#5F584F',sinPoner:true};
    PAL.logo = (m&&m.logo_url)||null;
  }

  /* `g` = grande. El chico compara portadas; el grande se mira por dentro y
     cada caja suya es un boton que abre «que va aqui». */
  function fono(cual, g){
    var d=destino(), P=PAL||{}, nom=d.nombre_comercial||'Tu casa';
    var piezas=(PZ||[]).filter(function(x){return x.activo;});
    function de(r){ return piezas.filter(function(x){return (x.ranura||'')===r;}); }
    function tit(x){ var r=PZR[x.id]; return x.titulo||(r&&r.titulo)
      ||({checkin:'Check-in',checkout:'Salida',maletas:'Maletas',llegada:'Cómo llegar',restaurante:'Restaurante'})[x.clave]||'—'; }
    /* Envuelve una caja para que se pueda pulsar. Solo en el grande: en el
       chico seria un boton dentro de otro boton, que el navegador no permite. */
    function slot(html, ranura, id){
      if(!g) return html;
      return '<button type="button" class="slot" data-sr="'+esc(ranura)+'"'
        + (id?' data-si="'+esc(id)+'"':'') + '>'+html+'</button>';
    }
    function vacia(ranura, texto){
      return g ? '<button type="button" class="slot vacia" data-sr="'+esc(ranura)+'" '
        +'style="color:'+esc(P.tinta)+'">+ '+esc(texto)+'</button>' : '';
    }
    var ini=(nom.trim()[0]||'·').toUpperCase();
    var banda='<div class="fb" style="background:'+esc(P.fondo)+';color:'+esc(P.logo==='negro'?'#141414':'#fff')+'">'
      +'<i style="background:rgba(255,255,255,.22)">'+esc(ini)+'</i><b>'+esc(nom)+'</b></div>';
    var nav='<div class="fnav" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+'">'
      +'<span>Inicio</span><span>Exp.</span><span>Chat</span><span>Estancia</span></div>';
    var c='';

    if(cual==='casa'){
      var f=(d.foto_portada||'').trim();
      c+= f ? '<div class="fh" style="background-image:url(&quot;'+esc(f)+'&quot;)"></div>'
            : '<div class="fh" style="background:'+esc(P.fuerte)+';opacity:.25"></div>';
      var r3=de('rapida').slice(0, g?6:3);
      c+='<div class="'+(g?'slotrow':'frow')+'">'+ (r3.length? r3.map(function(x){
            return slot('<div class="fcard" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+'">'
              +'<i>'+esc(tit(x))+'</i><b>'+esc(pzDato(x)||'—')+'</b></div>', 'rapida', x.id); }).join('')
          : vacia('rapida','Tres datos de arriba') || '<div class="fcard" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+';opacity:.5"><i>Sin datos</i><b>—</b></div>')
        +'</div>';
      if(g && r3.length<3) c+=vacia('rapida','Otro dato arriba');
      var rj=de('rejilla').slice(0, g?12:4);
      c+='<div class="frow" style="flex-wrap:wrap">'+rj.map(function(x){
            return '<div style="flex:0 0 calc(50% - '+(g?4:2)+'px);min-width:0">'
              + slot('<div class="fcard" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+'">'
              +'<b>'+esc(tit(x))+'</b><i>'+esc(pzDato(x)||'')+'</i>'
              + (g&&pzNota(x)?'<em>'+esc(pzNota(x))+'</em>':'') +'</div>', 'rejilla', x.id)
              +'</div>'; }).join('')+'</div>';
      c+=vacia('rejilla','Algo más de la casa');

    } else if(cual==='contacto'){
      var ct=de('contacto');
      c+= ct.length ? ct.map(function(x){
            return slot('<div class="fcard" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+';padding:'+(g?'11px 13px':'7px 8px')+'">'
              +'<b style="font-size:'+(g?'15px':'9px')+'">¿Te ayudamos?</b>'
              +'<i style="margin-top:2px">'+esc(tit(x))+(pzDato(x)?' · '+esc(pzDato(x)):'')+'</i>'
              + (g&&pzNota(x)?'<em>'+esc(pzNota(x))+'</em>':'') +'</div>', 'contacto', x.id); }).join('')
          : (vacia('contacto','A quién se le escribe')
             || '<div class="fcard" style="background:'+esc(P.suave)+';color:'+esc(P.tinta)+';padding:7px 8px">'
                +'<b style="font-size:9px">¿Te ayudamos?</b><i style="margin-top:2px">Recepción</i></div>');
      c+='<div class="fbtn" style="background:'+esc(P.fuerte)+';color:#fff">Escribir</div>';
      c+='<div class="fsub" style="color:'+esc(P.tinta)+';margin-top:1px">Lo resuelves tú</div>';
      var li=de('rapida').concat(de('rejilla')).slice(0, g?12:4);
      c+='<div class="flista">'+ li.map(function(x){
            return slot('<div class="fli" style="color:'+esc(P.tinta)+'"><u>›</u><span>'+esc(tit(x))
              +(pzDato(x)?' · '+esc(pzDato(x)):'')+'</span></div>', x.ranura||'rejilla', x.id); }).join('')+'</div>';
      c+=vacia('rejilla','Otra cosa en la lista');

    } else {
      c+='<div style="text-align:center;padding:6px 2px 2px">'
        +'<div class="ftit" style="color:'+esc(P.tinta)+'">'+esc(nom)+'</div>'
        +'<div class="frule" style="background:'+esc(P.fuerte)+';margin:5px auto"></div></div>';
      var f2=(d.foto_portada||'').trim();
      if(f2) c+='<div class="fh" style="height:48px;background-image:url(&quot;'+esc(f2)+'&quot;)"></div>';
      var idx=de('indice').concat(de('rejilla')).slice(0, g?12:5);
      c+='<div class="flista" style="margin-top:2px">'+ (idx.length? idx.map(function(x,i){
            return slot('<div class="fli" style="color:'+esc(P.tinta)+'"><u>'+(i<9?'0':'')+(i+1)+'</u>'
              +'<span>'+esc(tit(x))+(g&&pzDato(x)?' · '+esc(pzDato(x)):'')+'</span></div>',
              x.ranura||'indice', x.id); }).join('')
          : '<div class="fli" style="color:'+esc(P.tinta)+';opacity:.5"><u>01</u><span>Aún sin piezas</span></div>')
        +'</div>';
      c+=vacia('indice','Otra línea del índice');
    }
    return '<div class="fono'+(g?' g':'')+'"><div style="display:contents">'+banda
      +'<div class="fc" style="background:'+esc(P.suave)+'">'+c+'</div>'+nav+'</div></div>';
  }

  /* ---------- LA PALETA, DONDE SE USA ----------
     Vivia en `hotel.html`, la ficha vieja, que es justo la pantalla de la que
     sacamos al hotelero. Resultado: veia los tres telefonitos pintados con su
     paleta y no tenia desde donde cambiarla. Una eleccion que se mira aqui se
     hace aqui.
     Las paletas las prepara la casa al subir el logo y viven en
     `hotel_marca.paletas`; esto solo elige cual de ellas manda. */
  function pintaPaleta(){
    var c=$('cPal'); if(!c) return;
    var L=[]; try{ L=(MAR&&MAR.paletas)||[]; }catch(_){ L=[]; }
    var sel=Number((MAR&&MAR.paleta_elegida)||0);
    if(!L.length){
      c.innerHTML='<h3>Tus colores</h3>'
        +'<div class="hint">Las paletas se preparan a partir de tu logo: cuando lo subas te armamos tres '
        +'y aquí eliges con cuál se viste tu app.</div>'
        +'<div class="nomi">Todavía no tienes paletas. Mientras tanto, los teléfonos de arriba se pintan '
        +'en gris — no en los colores de otra casa, para que lo que veas sea verdad.</div>';
      return;
    }
    c.innerHTML='<h3>Tus colores</h3>'
      +'<div class="hint">La que elijas viste tu app entera: la portada, los botones y el chat. '
      +'Los teléfonos de arriba cambian al momento, así que puedes compararlas mirando.'
      + (MAR_HEREDADA
         ? ' <b>Estos colores los heredas de '+esc(MAR_HEREDADA)+'</b>, porque esta casa no tiene marca propia: '
           +'si eliges otra aquí, se le pone solo a esta casa.'
         : '')
      +'</div>'
      +'<div class="pgrid" style="margin-top:12px">'
      + L.map(function(p){
          var on = Number(p.n)===sel;
          return '<button class="opcion'+(on?' on':'')+'" data-pal="'+esc(p.n)+'">'
            +'<span style="display:block;width:100%;border-radius:10px;overflow:hidden;border:1px solid var(--rule)">'
            +'<span style="display:block;height:46px;background:'+esc(p.fondo)+'"></span>'
            +'<span style="display:flex;height:22px">'
            +'<i style="flex:1;background:'+esc(p.fuerte)+'"></i><i style="flex:1;background:'+esc(p.oscuro)+'"></i>'
            +'<i style="flex:1;background:'+esc(p.suave)+'"></i><i style="flex:1;background:'+esc(p.tinta)+'"></i></span></span>'
            +'<div style="align-self:stretch"><div class="ot">'+esc(p.nombre||('Paleta '+p.n))+'</div>'
            +'<div class="od">'+esc(p.de||'')+(on?'<br><b>La que tienes puesta</b>':'')+'</div></div></button>';
        }).join('')
      +'</div>';
    c.querySelectorAll('button[data-pal]').forEach(function(b){
      b.onclick=async function(){
        var n=Number(b.getAttribute('data-pal'));
        var p=L.filter(function(x){return Number(x.n)===n;})[0]||{};
        /* Se guardan tambien color_1/2/3 porque es lo que leen las pantallas
           que todavia no saben de paletas. Mismo gesto que hacia la ficha. */
        var r=await fetch(SB+'/rest/v1/hotel_marca?hotel_id=eq.'+destino().id,{method:'PATCH',
          headers:hdr(),body:JSON.stringify({paleta_elegida:n,color_1:p.fuerte,color_2:p.oscuro,color_3:p.suave})});
        if(!r.ok){ toast('No se pudo guardar el color',true); return; }
        toast('Colores: '+(p.nombre||('paleta '+n)));
        await cargaPaleta(); pintaPaleta(); pintaPortadas(); pintaTaller();
      };
    });
  }

  /* ---------- EL TALLER: elegir el campo SOBRE el diseño ----------
     Javi, 27-oct-2026: «sobre la app escogida tú seleccionas qué campo va…
     dentro de la app o del diseño».
     Tenia razon en que la tabla de abajo no explica nada. Una tabla con una
     columna «en qué caja va» te obliga a imaginarte la app; aqui la app esta
     delante y la caja se toca. La tabla se queda abajo para lo que una tabla
     si hace bien: verlo todo junto, apagar y borrar.
     SRANURA es la caja que el usuario acaba de tocar; mientras hay una tocada,
     la bandeja de la derecha enseña lo que puede ir ahi. */
  var SRANURA=null, SPIEZA=null;

  function pintaTaller(){
    var c=$('fonoG'); if(!c) return;
    var d=destino(), act=d.portada||'sobria';
    c.innerHTML = fono(act, true);
    c.querySelectorAll('.slot').forEach(function(b){
      b.onclick=function(ev){
        ev.preventDefault();
        SRANURA=b.getAttribute('data-sr')||'';
        SPIEZA =b.getAttribute('data-si')||null;
        pintaBandeja();
        var bj=$('bandeja'); if(bj) bj.scrollIntoView({block:'nearest',behavior:'smooth'});
      };
    });
    pintaBandeja();
  }

  function nomRanura(k){
    var r=RANURAS.filter(function(x){return x[0]===k;})[0];
    return r?r[1]:'esa caja';
  }

  function pintaBandeja(){
    var w=$('bandeja'); if(!w) return;
    if(!SRANURA){
      w.innerHTML='<div class="nomi"><b>Toca una caja del teléfono.</b><br>'
        +'Te enseño aquí todo lo que puedes poner en ella: lo que ya está en tu ficha '
        +'—que se actualiza solo— y lo que escribas tú.</div>';
      return;
    }
    var aqui = PZ.filter(function(x){ return (x.ranura||'')===SRANURA; });
    var fuera= PZ.filter(function(x){ return (x.ranura||'')!==SRANURA; });
    function fila(x, puesta){
      return '<button type="button" class="bpieza'+(puesta?' puesta':'')+'" data-bp="'+esc(x.id)+'">'
        +'<span style="flex:1;min-width:0"><b>'+esc(pzTitulo(x))+'</b>'
        +'<span>'+esc(pzDato(x)|| (x.origen==='auto'?'Sin llenar en tu ficha':'Sin dato'))+'</span></span>'
        +'<span class="de">'+(x.origen==='auto'?'de tu ficha':'tuyo')
        + (puesta?' · puesto':'')+'</span></button>';
    }
    w.innerHTML='<div class="card" style="margin:0;border-color:var(--accent)">'
      +'<h3>'+esc(nomRanura(SRANURA))+'</h3>'
      +'<div class="hint">'+esc((RANURAS.filter(function(r){return r[0]===SRANURA;})[0]||['','',''])[2])+'</div>'
      + (aqui.length?'<div class="mini" style="margin:12px 0 6px"><b>Lo que hay aquí</b> · tócalo para sacarlo</div>'
          + aqui.map(function(x){return fila(x,true);}).join('') : '')
      +'<div class="mini" style="margin:12px 0 6px"><b>Lo que puedes traer</b> · tócalo y se pone aquí</div>'
      + (fuera.length ? fuera.map(function(x){return fila(x,false);}).join('')
         : '<div class="nomi">No te queda nada suelto. Crea una pieza nueva abajo.</div>')
      +'<div class="ft" style="justify-content:flex-start">'
      +'<button class="btn ghost sm" id="bNueva">+ Escribir algo nuevo aquí</button>'
      +'<button class="btn ghost sm" id="bCerrar">Cerrar</button></div></div>';

    w.querySelectorAll('button[data-bp]').forEach(function(b){
      b.onclick=async function(){
        var x=PZ.filter(function(y){return y.id===b.getAttribute('data-bp');})[0];
        if(!x) return;
        var puesta=(x.ranura||'')===SRANURA;
        /* Sacarla no la borra: la manda al cajon de guardadas, que es como se
           apaga algo sin perderlo.
           Y el cajon es NULL, no cadena vacia: `hotel_piezas_ranura_chk` solo
           admite nulo o una de las cuatro cajas. Guardar '' reventaba con un
           23514 en cuanto Javi sacaba una pieza. Javi, 27-oct-2026. */
        await pzGuarda({id:x.id, ranura: puesta ? null : (SRANURA||null), activo:true});
      };
    });
    $('bCerrar').onclick=function(){ SRANURA=null; SPIEZA=null; pintaBandeja(); };
    $('bNueva').onclick=function(){
      PZedit={nuevo:true, origen:'libre', ranura:SRANURA, activo:true};
      pintaPiezas(); $('pzCajas').scrollIntoView({block:'start',behavior:'smooth'});
    };
  }

  function pintaPortadas(){
    var d=destino(), hay=!!(d.foto_portada||'').trim(), act=d.portada||'sobria';
    $('pgPort').className='pgrid';
    $('pgPort').innerHTML = PORTADAS.map(function(p){
      var bloqueada = p[0]==='casa' && !hay, on = act===p[0];
      return '<button class="opcion'+(on?' on':'')+'" data-p="'+p[0]+'"'+(bloqueada?' disabled':'')+'>'
        + fono(p[0])
        +'<div style="align-self:stretch"><div class="ot">'+esc(p[1])+'</div>'
        +'<div class="od">'+esc(p[2])
        + (bloqueada?'<br><b style="color:var(--warn)">Te falta la foto de portada</b>':'')
        + (on?'<br><b>La que tienes puesta</b>':'')+'</div></div></button>';
    }).join('');
    $('pgPort').querySelectorAll('.opcion[data-p]:not([disabled])').forEach(function(b){
      b.onclick=async function(){
        var v=b.getAttribute('data-p');
        var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+destino().id,{method:'PATCH',
          headers:hdr(),body:JSON.stringify({portada:v})});
        if(!r.ok){ toast('No se pudo guardar',true); return; }
        destino().portada=v; toast('Portada: '+v); pintaPortadas(); pintaTaller();
      };
    });
  }

  function pzTitulo(x){
    var T={checkin:'Check-in',checkout:'Salida',maletas:'Guardar maletas',
           llegada:'Cómo llegar',restaurante:'Restaurante',whatsapp:'WhatsApp'};
    return x.titulo || T[x.clave] || '(sin título)';
  }

  function pintaPiezas(){
    var w=$('pzCajas'); if(!w) return;
    var h='';
    if(PZedit) h+=pzForm();
    RANURAS.forEach(function(r){
      var L=PZ.filter(function(x){ return (x.ranura||'')===r[0]; });
      if(!L.length && r[0]==='') return;           /* el cajón vacío no se enseña */
      h+='<div class="card"><h3>'+esc(r[1])+'</h3><div class="hint">'+esc(r[2])+'</div>'
        + (L.length
           ? '<div class="eqt" style="margin-top:12px"><table><thead><tr>'
             +'<th>Qué</th><th>Dato</th><th>De dónde</th><th></th><th></th></tr></thead><tbody>'
             + L.map(function(x){
                 return '<tr'+(x.activo?'':' style="opacity:.5"')+'>'
                   +'<td><b>'+esc(pzTitulo(x))+'</b>'
                     +(pzNota(x)?'<span class="mini" style="display:block">'+esc(pzNota(x))+'</span>':'')+'</td>'
                   +'<td class="mini">'+(pzDato(x)
                        ? esc(pzDato(x))
                        : '<span class="nomi" style="padding:0;border:0">'
                          +(x.origen==='auto'?'tu ficha no lo dice todavía':'sin dato')+'</span>')+'</td>'
                   +'<td class="mini">'+(x.origen==='auto'
                        ?'<b>de tu ficha</b>':'lo escribiste tú')+'</td>'
                   +'<td><span class="est '+(x.activo?'si':'no')+'">'+(x.activo?'Se ve':'Apagada')+'</span></td>'
                   +'<td><span class="ac"><button data-pe="'+x.id+'">Editar</button>'
                     +'<button class="bad" data-pq="'+x.id+'">'+(x.activo?'Apagar':'Encender')+'</button></span></td></tr>';
               }).join('')
             +'</tbody></table></div>'
           : '<div class="nomi">Nada aquí todavía, así que esta caja no se pinta en la app.</div>')
        +'</div>';
    });
    w.innerHTML=h;
    w.querySelectorAll('button[data-pe]').forEach(function(b){ b.onclick=function(){
      PZedit=PZ.filter(function(x){return x.id===b.getAttribute('data-pe');})[0]; pintaPiezas(); window.scrollTo(0,0); };});
    w.querySelectorAll('button[data-pq]').forEach(function(b){ b.onclick=function(){
      var x=PZ.filter(function(y){return y.id===b.getAttribute('data-pq');})[0];
      pzGuarda({id:x.id, activo:!x.activo}); };});
    if(PZedit) pzAta();
  }

  function pzForm(){
    var x=PZedit, auto=x.origen==='auto';
    return '<div class="card" style="border-color:var(--accent)">'
      +'<h3>'+(x.nuevo?'Una pieza nueva':'Editar '+esc(pzTitulo(x)))+'</h3>'
      + (auto?'<div class="hint">Esta sale de tu ficha, así que su título y su dato no se escriben aquí: '
              +'se cambian en <b>Mi cuenta</b> y aquí cambian solos. Lo que sí decides es en qué caja va.</div>':'')
      +'<div class="fgrid">'
      + (auto?'' :
          '<div class="fld"><label>Cómo se llama</label><input id="pzT" value="'+esc(x.titulo||'')+'" placeholder="Wi-Fi"></div>'
         +'<div class="fld"><label>El dato, corto</label><input id="pzD" value="'+esc(x.dato||'')+'" placeholder="barrio_huesped · 2026"></div>'
         +'<div class="fld" style="grid-column:1/-1"><label>Una línea más, si hace falta</label>'
         +'<input id="pzN" value="'+esc(x.nota||'')+'" placeholder="La clave cambia cada mes; pregunta en recepción."></div>')
      +'<div class="fld"><label>En qué caja va</label><select id="pzR">'
      + RANURAS.map(function(r){ return '<option value="'+r[0]+'"'+((x.ranura||'')===r[0]?' selected':'')+'>'+esc(r[1])+'</option>'; }).join('')
      +'</select></div>'
      +'<div class="fld"><label>Orden dentro de la caja</label><input id="pzO" type="number" step="10" value="'+esc(x.orden==null?20:x.orden)+'"></div>'
      + (auto?'':'<div class="fld" style="grid-column:1/-1"><label>Foto (opcional)</label>'
         +'<input id="pzF" value="'+esc(x.foto_url||'')+'" placeholder="https://…"></div>')
      +'</div>'
      +'<div class="ft" style="justify-content:flex-start">'
      +'<button class="btn" id="pzOk">Guardar</button>'
      +'<button class="btn ghost" id="pzNo">Cancelar</button>'
      + (!x.nuevo && !auto ? '<button class="btn ghost" id="pzBorrar" style="margin-left:auto;border-color:var(--bad);color:var(--bad)">Borrar</button>':'')
      +'</div></div>';
  }

  function pzAta(){
    $('pzNo').onclick=function(){ PZedit=null; pintaPiezas(); };
    $('pzOk').onclick=function(){
      var x=PZedit, b={ranura:$('pzR').value||null, orden:Number($('pzO').value||0)};
      if(x.origen!=='auto'){
        b.titulo=($('pzT').value||'').trim();
        b.dato=($('pzD').value||'').trim()||null;
        b.nota=($('pzN').value||'').trim()||null;
        b.foto_url=($('pzF').value||'').trim()||null;
        if(!b.titulo){ toast('Ponle un nombre',true); return; }
      }
      if(x.nuevo){ b.hotel_id=destino().id; b.origen='libre'; b.activo=true; }
      else b.id=x.id;
      pzGuarda(b, x.nuevo);
    };
    if($('pzBorrar')) $('pzBorrar').onclick=async function(){
      if(!confirm('¿Borrar esta pieza? No se puede deshacer.')) return;
      var r=await fetch(SB+'/rest/v1/hotel_piezas?id=eq.'+PZedit.id,{method:'DELETE',headers:hdr()});
      if(!r.ok){ toast('No se pudo borrar',true); return; }
      PZedit=null; toast('Borrada'); await cargaPiezas(); pintaPiezas();
    };
  }

  async function pzGuarda(body, esNueva){
    var r;
    if(esNueva) r=await fetch(SB+'/rest/v1/hotel_piezas',{method:'POST',headers:hdr(),body:JSON.stringify([body])});
    else {
      var id=body.id; delete body.id;
      r=await fetch(SB+'/rest/v1/hotel_piezas?id=eq.'+id,{method:'PATCH',headers:hdr(),body:JSON.stringify(body)});
    }
    if(!r.ok){
      var t=await r.text();
      /* Un volcado de JSON de Postgres no le dice nada a quien lleva un hotel.
         Se traduce lo que puede pasar de verdad aqui y lo demas se acorta. */
      var msg = /23514/.test(t) ? 'Esa caja no existe. Vuelve a elegirla y lo guardo.'
              : /23505/.test(t) ? 'Ya tienes una pieza igual en esa caja.'
              : /23503/.test(t) ? 'Esa pieza está ligada a algo que todavía existe.'
              : /row-level security|permission/i.test(t) ? 'No tienes permiso para cambiar esta casa.'
              : 'No se pudo guardar. Inténtalo otra vez.';
      toast(msg,true); console.warn('hotel_piezas:', t); return;
    }
    PZedit=null; toast('Guardado');
    await cargaPiezas(); pintaPiezas();
    if($('pgPort')) pintaPortadas();   /* el previo enseña lo que acaba de poner */
    if($('fonoG')) pintaTaller();      /* y el telefono grande, que es el que mira */
  }

  /* ---------- vender experiencias ----------
     Lo que la recepcion puede ofrecerle a un huesped, con lo que deja cada
     venta a la vista. No es el catalogo: el catalogo es «Mis intangibles», y
     aqui solo sale lo que esta puesto. Lo que falta -cobrar en recepcion con
     la tarjeta de la casa- esta dicho como lo que es: pendiente. */
  function vVender(){
    var d=destino(), L=[];
    ['experiencia','evento','tienda'].forEach(function(t){
      (CAT[t]||[]).forEach(function(x){ if(SEL[t+':'+x.id]) L.push({t:t,x:x}); });
    });
    var TN={experiencia:'Experiencia',evento:'Evento',tienda:'Tienda'};
    var filas=L.map(function(o){
      var pvp=Number(o.x.pvp)||0;
      var gc=pvp*(Number(o.x.vend)||0)/100, gh=pvp*(Number(o.x.hot)||0)/100;
      return '<tr><td><b>'+esc(o.x.n)+'</b><span class="mini" style="display:block">'+esc(TN[o.t]||o.t)
        +(o.x.op?' · '+esc(o.x.op):'')+'</span></td>'
        +'<td>'+(pvp?pesos(pvp):'—')+'</td>'
        +'<td class="mini">'+(pvp?pesos(gh)+' la casa':'—')+'</td>'
        +'<td class="mini">'+(pvp?pesos(gc)+' quien vende':'—')+'</td></tr>';
    }).join('');
    return '<div class="card"><h3>Las dos puertas</h3>'
      +'<div class="hint"><b>El huésped reserva solo</b>, con tu liga o tu QR de recepción: paga con su tarjeta '
      +'y la venta queda a nombre de tu casa y del concierge que lo invitó. La liga del huésped está en '
      +'<b>'+(nivel==='hotel'?'Su app':'Mi app')+'</b>; la de quien vende, en <b>'
      +(nivel==='hotel'?'Sus concierges':'Mis concierges')+'</b>.</div>'
      +'<div class="nomi"><b>Reservar en recepción</b> —cobrar ahí mismo con la tarjeta de la casa— todavía no está '
      +'hecho. Hace falta guardar una tarjeta del hotel, y eso no existe aún.</div></div>'
      +'<div class="card"><h3>Lo que ofrece '+esc(d.nombre_comercial||'esta casa')+'</h3>'
      +(L.length
        ? '<div class="hint">De cada venta, esto es lo que queda en casa. Los porcentajes salen del acuerdo de cada quien, no de aquí.</div>'
          +'<div class="eqt" style="margin-top:12px"><table><thead><tr><th>Qué</th><th>Precio</th><th>La casa</th><th>Quien vende</th></tr></thead><tbody>'
          +filas+'</tbody></table></div>'
        : '<div class="nomi">No hay nada puesto todavía. Lo marcas en <b>'+(nivel==='hotel'?'Sus intangibles':'Mis intangibles')+'</b> y aparece aquí.</div>')
      +'</div>';
  }

  function vPronto(){
    var T={
      mapa:['Su mapa',''],intang:['Sus intangibles','']};
    var t=T[sec]||['Pronto',''];
    return '<div class="card"><h3>'+esc(t[0])+'</h3><div class="pronto">'+esc(t[1])+'</div></div>';
  }

  function ataGuarda(){
    var b=$('gGen'); if(!b) return;
    b.onclick=async function(){
      var d=destino(), body={};
      document.querySelectorAll('[data-c]').forEach(function(el){
        var c=el.getAttribute('data-c'), v=el.value;
        if(c==='cuartos') body[c]= v===''?null:Number(v);
        else if(c==='es_grupo') body[c]= v==='true';
        /* `rest_activo` es booleano en la base: mandar la cadena "true" lo
           rechaza entero y el guardado se cae sin que se vea por que. */
        else if(c==='storage_activo'||c==='rest_activo') body[c]= v==='true';
        else body[c]= v===''?null:v;
      });
      var h=hdr(); h['Prefer']='return=representation';
      var r=await fetch(SB+'/rest/v1/hoteles?id=eq.'+d.id,{method:'PATCH',headers:h,body:JSON.stringify(body)});
      if(!r.ok){toast('No se pudo guardar: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json();
      if(!j||!j.length){toast('No se guardó: tu usuario no puede editar esta ficha.',true);return;}
      for(var i=0;i<GRUPOS.length;i++) if(GRUPOS[i].id===d.id) GRUPOS[i]=j[0];
      if(Hsel&&Hsel.id===d.id) Hsel=j[0]; if(G.id===d.id) G=j[0];
      toast('Guardado');
    };
  }
  /* pinta() arma el HTML y despues hay que atar el boton: se hace aqui para
     no repetirlo en cada vista. */
  var _pinta=pinta;
  function ataCuenta(){
    if(sec!=='cuenta') return;
    pintaStripe(); pintaContrato(); pintaSuma();
    ['com_hotel_pct','com_colaborador_pct','com_plataforma_pct'].forEach(function(c){
      var el=document.querySelector('[data-c="'+c+'"]'); if(el) el.oninput=pintaSuma;
    });
  }
  pinta=function(){ _pinta(); ataGuarda(); ataCuenta();
    document.querySelectorAll('.pc').forEach(function(c){c.onclick=function(){
      var p=c.parentNode, ya=p.classList.contains('ab');
      document.querySelectorAll('.paso').forEach(function(x){x.classList.remove('ab');});
      if(!ya){ p.classList.add('ab'); ataGuarda(); ataCuenta(); }
    };});
    var d=destino();
    ['storage_activo','rest_activo'].forEach(function(c){
      var el=document.querySelector('[data-c="'+c+'"]'); if(el) el.value = d[c]===true?'true':'false';
    });
  };

  load();
})();
</script>
</body></html>
