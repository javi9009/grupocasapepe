<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Portal del hotelero</title>
<style>
/* La paleta es la de Sincretico, la misma del diseno: papel en vez de
   blanco, tinta en vez de negro, y el naranja de la marca donde antes habia
   un verde que no salia de ningun sitio. Al vivir en variables, cambiarlas
   aqui repinta la pantalla entera. */
:root{--ground:#FBF7F2;--surface:#FFF;--surface-2:#F4EFE8;--surface-3:#FBF8F1;--ink:#1E1A16;--muted:#6E665C;--faint:#A9A096;--rule:#E6DFD6;--accent:#F2682A;--accent-dark:#C9501A;--accent-soft:#FDE7DC;--ok:#1D6B4A;--ok-bg:#E1F0E7;--warn:#8C6212;--warn-bg:#F6EBD5;--bad:#9E3B2E;--bad-bg:#F6E1DD;--shadow:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4)}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px}
.top{padding:14px 16px 6px;max-width:1280px;margin:0 auto;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{margin:0;font-size:20px;font-weight:800}
.top .sub{color:var(--muted);font-size:12.5px}
.top .sel{margin-left:auto}
.top select{font:inherit;padding:7px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface)}
.secnav{position:sticky;top:0;z-index:19;background:var(--ground);border-bottom:1px solid var(--rule)}
.secnav-in{max-width:1280px;margin:0 auto;padding:0 16px;display:flex;gap:2px;overflow-x:auto}
.secnav button{border:0;background:none;font:inherit;padding:12px 13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;display:flex;align-items:center;gap:7px}
.secnav button svg{width:15px;height:15px}
.secnav button[aria-selected="true"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.nivel{max-width:1280px;margin:0 auto;padding:12px 16px 0;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.nv{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.nv.on{border-color:var(--ink);background:var(--ink);color:#fff}
.wrap{max-width:1280px;margin:0 auto;padding:14px 16px 90px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:15.5px}
.card .hint{color:var(--muted);font-size:12.5px;margin-bottom:14px;line-height:1.45}
.panel{display:none}.panel.on{display:block}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px}
.fld label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px;font-weight:600}
.fld input,.fld select,.fld textarea{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);color:var(--ink)}
.fld .ay{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.4}
.btn{font:inherit;font-weight:600;border-radius:8px;cursor:pointer;padding:9px 15px;border:1px solid var(--accent);background:var(--accent);color:#fff;font-size:13px}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--rule)}
.btn.sm{padding:5px 10px;font-size:12px}
.ft{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.mini{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--rule);border-radius:11px;padding:13px 15px;box-shadow:var(--shadow)}
.kpi .et{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kpi .vl{font-size:26px;font-weight:800;margin-top:4px;line-height:1.05}
.kpi .nt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
/* rejilla de hoteles tipo "crear experiencia" */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.hc{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;box-shadow:var(--shadow)}
.hc:hover{border-color:var(--ink)}
.hc .hn{font-weight:700;font-size:14px}
.hc .hm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.hc.nuevo{border-style:dashed;display:grid;place-items:center;min-height:96px;color:var(--accent);font-weight:700}
/* buffet */
.bufbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.chip{border:1.5px solid var(--rule);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.vistas{margin-left:auto;display:flex;gap:4px;border:1px solid var(--rule);border-radius:9px;padding:3px;background:var(--surface)}
.vistas button{border:0;background:none;font:inherit;font-size:12px;font-weight:600;padding:5px 11px;border-radius:7px;cursor:pointer;color:var(--muted)}
.vistas button.on{background:var(--ink);color:#fff}
.buf{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media(max-width:980px){.buf{grid-template-columns:minmax(0,1fr)}}
.bg{display:grid;gap:10px}
.bg.foto{grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.bg.lista{grid-template-columns:1fr}
.it{position:relative;background:var(--surface);border:1.5px solid var(--rule);border-radius:11px;overflow:hidden;cursor:pointer;display:block;text-align:left}
.it:hover{border-color:var(--ink)}
.it.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.bg.foto .im{display:block;width:100%;height:96px;background:var(--surface-2) center/cover no-repeat}
.bg.foto .tx{display:block;padding:9px 11px 11px}
.bg.lista .it{display:grid;grid-template-columns:52px 1fr auto;gap:11px;align-items:center;padding:8px 12px 8px 8px}
.bg.lista .im{display:block;width:52px;height:40px;border-radius:7px;background:var(--surface-2) center/cover no-repeat}
.bg.lista .tx{display:block}
.it .nm{display:block;font-weight:700;font-size:12.8px;line-height:1.25}
.it .de{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.it .tp{display:inline-block;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin-top:5px}
.it .tick{position:absolute;top:7px;right:7px;width:21px;height:21px;border-radius:50%;background:var(--accent);color:#fff;display:none;place-items:center}
.bg.lista .it .tick{position:static}
.it.on .tick{display:grid}
.it .tick svg{width:13px;height:13px}
.panelsel{position:sticky;top:58px;background:var(--surface);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px}
.panelsel h4{margin:0 0 3px;font-size:13.5px}
.selist{list-style:none;margin:10px 0 0;padding:0;max-height:52vh;overflow:auto}
.selist li{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--rule);font-size:12.5px}
.selist li:first-child{border-top:0}
.selist li b{flex:1;font-weight:600}
.selist li button{border:0;background:none;color:var(--bad);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px}
.vacio{padding:26px 10px;text-align:center;color:var(--faint);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.pronto{border:1px dashed var(--rule);border-radius:11px;padding:16px 18px;background:var(--surface-3);color:var(--muted);font-size:12.5px;line-height:1.5}
/* Un <svg> sin width/height se estira al tamaño del contenedor: las
   palomitas de los pasos salían gigantes. Tamaño base y punto. */
.wrap svg{width:15px;height:15px;display:block;flex:none}
.it .tick svg{width:13px;height:13px}
.it .acc{display:flex;gap:6px;margin-top:9px}
.it .acc button{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:5px 10px;
  font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;color:var(--muted)}
.it .acc .bsel{border-color:var(--accent);color:var(--accent)}
.it .acc .bsel.on{background:var(--accent);color:#fff}
.it .acc button:hover{border-color:var(--ink)}
.it .eco{display:block;font-size:11px;color:var(--muted);margin-top:5px;line-height:1.45}
.it .eco b{color:var(--ink)}
.vistas{margin-left:0}
.modal{position:fixed;inset:0;background:rgba(31,27,22,.72);display:none;place-items:center;z-index:60;padding:26px}
.modal.on{display:grid}
.modal .mc{background:var(--surface);border-radius:14px;max-width:460px;width:100%;max-height:92vh;overflow:auto;position:relative}
.modal img{display:block;width:100%;height:210px;object-fit:cover}
.modal .imvacia{height:150px;display:grid;place-items:center;background:var(--surface-2);color:var(--faint);font-size:12.5px}
.modal .mb{padding:16px 18px 18px}
.modal h4{margin:0 0 4px;font-size:17px}
.modal .swn{position:absolute;top:11px;left:13px;background:rgba(31,27,22,.72);color:#fff;font-size:11.5px;
  font-weight:700;padding:4px 10px;border-radius:999px;z-index:2}
/* Listado grande: la foto manda y debajo va el dinero, que es lo que decide */
.bg.big{grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:13px}
.bg.mapa{grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px}
.it.big,.it.mp{display:block;padding:0}
.it .foto{display:block;width:100%;height:160px;background:var(--surface-2) center/cover no-repeat;position:relative}
.it.mp .foto{height:124px}
.it .foto .op{position:absolute;left:8px;top:8px;background:rgba(31,27,22,.82);color:#fff;font-size:9.5px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px;max-width:82%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .foto .nf{position:absolute;right:8px;bottom:8px;background:rgba(31,27,22,.78);color:#fff;font-size:10.5px;
  font-weight:700;padding:3px 8px;border-radius:999px}
.it .foto .cred{position:absolute;left:8px;bottom:6px;color:#fff;font-size:9.5px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.it .cu{display:block;padding:11px 13px 13px}
.it .cu .nm{display:block;font-weight:800;font-size:13.5px;line-height:1.28;text-transform:uppercase;letter-spacing:.01em}
.it .cu .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.it .cu .de2{display:block;font-size:12px;color:var(--ink);margin-top:7px;line-height:1.5}
.it .cu .dir{display:block;font-size:11px;color:var(--faint);margin-top:6px}
.it .cu .links{display:flex;gap:10px;margin-top:7px;flex-wrap:wrap}
.it .cu .links a{color:var(--accent);text-decoration:none;font-size:11.5px;font-weight:700}
.eco3{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);
  border-radius:9px;overflow:hidden;margin-top:10px}
.eco3 span{background:var(--surface-3);padding:7px 8px;text-align:center}
.eco3 span.mio{background:var(--accent-soft)}
.eco3 i{display:block;font-style:normal;font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.eco3 b{display:block;font-size:13px;margin-top:2px;white-space:nowrap}
.eco3 i{white-space:nowrap}
.eco3 span.mio b{color:var(--accent)}
.it .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.it .meta span{background:var(--surface-3);border:1px solid var(--rule);border-radius:999px;padding:3px 9px;font-size:11px;color:var(--muted)}
.it .bsel{display:block;width:100%;margin-top:10px;border:1.5px solid var(--accent);background:var(--surface);
  color:var(--accent);border-radius:9px;padding:8px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.it .bsel:hover{background:var(--accent-soft)}
.it .bsel.on{background:var(--accent);color:#fff}
/* filtros del mapa por tipología */
.tipos{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tp{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--rule);background:var(--surface);
  border-radius:999px;padding:6px 12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted)}
.tp svg{width:14px;height:14px}
.tp.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tp .c{font-size:11px;color:var(--faint)}
.tp.on .c{color:var(--accent)}
.modal .mc.ancho{max-width:700px}
.modal img.port{height:250px}
.modal .credf{font-size:10.5px;color:var(--faint);padding:4px 18px 0}
.modal .lead{font-size:14px;line-height:1.6;margin:11px 0 0}
.modal .imperd{display:inline-block;background:var(--warn-bg);color:var(--warn);font-size:10px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border-radius:999px;margin-bottom:7px}
.modal .links{display:flex;gap:12px;flex-wrap:wrap}
.modal .links a{color:var(--accent);text-decoration:none;font-weight:700;font-size:12.5px}
.fichasec{margin-top:16px;border-top:1px solid var(--rule);padding-top:13px}
.fichasec .fst{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:9px}
.fb{margin-bottom:11px}
.fb h5{margin:0 0 3px;font-size:12.5px;font-weight:700}
.fb p{margin:0;font-size:13px;line-height:1.55;color:var(--ink);white-space:pre-line}
.pares{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px}
.pares div{background:var(--surface-3);border-radius:9px;padding:9px 11px}
.pares span{display:block;font-size:11px;color:var(--muted)}
.pares b{display:block;font-size:13px;margin-top:2px}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px}
.gal img{width:100%;height:84px;object-fit:cover;border-radius:8px;display:block}
.tabla3{margin-top:13px;border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.tabla3 div{display:flex;align-items:center;gap:9px;padding:9px 12px;border-top:1px solid var(--rule);font-size:13px}
.tabla3 div:first-child{border-top:0;background:var(--surface-3)}
.tabla3 span{flex:1;color:var(--muted)}
.tabla3 b{font-size:14.5px}
.tabla3 i{font-style:normal;font-size:11px;color:var(--faint);min-width:30px;text-align:right}
.yaesta{margin-top:11px;background:var(--ok-bg);color:var(--ok);border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600}
.swb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.swb button{border:1.5px solid var(--rule);background:var(--surface);border-radius:11px;padding:13px 10px;
  font:inherit;font-size:14px;font-weight:700;cursor:pointer}
.swb .sx{color:var(--bad);border-color:#E6B8B2}
.swb .sx:hover{background:var(--bad-bg)}
.swb .ss{color:#fff;background:var(--accent);border-color:var(--accent)}
.swb .ss:hover{filter:brightness(1.08)}
/* El portal del hotelero no es una pantalla del dashboard: es su casa. Lleva
   su logo y sus colores arriba, y nada de Grupo Casa Pepe a la vista. */
:root{--mc:#1F1B16;--mc2:#137A56}
.marca{background:var(--mc);color:#fff}
.marca-in{max-width:1320px;margin:0 auto;padding:11px 18px;display:flex;align-items:center;gap:14px}
.marca .logo{display:flex;align-items:center;min-height:44px}
.marca .logo img{height:44px;max-width:150px;object-fit:contain;display:block}
.marca .logo .ini{width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800;font-size:14px}
.marca .tit{display:flex;flex-direction:column;line-height:1.25}
.marca .tit b{font-size:16px;font-weight:800}
.marca .tit i{font-style:normal;font-size:12px;color:rgba(255,255,255,.72)}
.marca-nav{margin-left:auto;display:flex;gap:6px}
.marca-nav a{color:rgba(255,255,255,.82);text-decoration:none;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid rgba(255,255,255,.22)}
.marca-nav a:hover{background:rgba(255,255,255,.12);color:#fff}
.cuerpo{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:216px minmax(0,1fr);gap:0}
@media(max-width:900px){.cuerpo{grid-template-columns:minmax(0,1fr)}.riel{display:none}}
.riel{padding:18px 12px 60px;border-right:1px solid var(--rule)}
.riel .rt{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:0 10px 8px}
.rl{list-style:none;margin:0;padding:0}
.rl li{padding:9px 11px;border-radius:9px;cursor:pointer;font-size:13px;border:1px solid transparent}
.rl li:hover{background:var(--surface-3)}
.rl li.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
.rl li .m{display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px}
.rl .nuevo{color:var(--accent);font-weight:700;border:1px dashed var(--rule);text-align:center;margin-top:8px}
.principal{min-width:0}
.principal .wrap{padding-top:10px}
/* Mi cuenta: cada paso se abre y trae su detalle, para no ir a otra pantalla */
.paso{border-top:1px solid var(--rule)}
.paso:first-child{border-top:0}
.pc{display:flex;gap:12px;align-items:center;padding:12px 2px;cursor:pointer}
.pc .pn{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--surface-2);color:var(--faint);font-size:12px;font-weight:700}
.pc .pn.ok{background:var(--ok-bg);color:var(--ok)}
.pc b{flex:1;font-size:13.5px}
.pc .fl{color:var(--faint);font-size:12px;transition:transform .15s}
.paso.ab .fl{transform:rotate(90deg)}
.pd{display:none;padding:4px 2px 18px}
.paso.ab .pd{display:block}
/* tarjeta de ficha propia, como en el editor de tours */
.ex{background:var(--surface);border:1px solid var(--rule);border-radius:12px;overflow:hidden;cursor:pointer;
  box-shadow:var(--shadow);display:block;text-align:left}
.ex:hover{border-color:var(--ink)}
.ex .foto{display:block;width:100%;height:132px;background:var(--surface-2) center/cover no-repeat;position:relative}
.ex .foto .op{position:absolute;left:8px;top:8px;background:rgba(31,27,22,.82);color:#fff;font-size:9.5px;
  font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:6px;max-width:72%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ex .foto .est{position:absolute;right:8px;top:8px;font-size:9.5px;font-weight:700;letter-spacing:.05em;
  text-transform:uppercase;padding:4px 8px;border-radius:6px}
.ex .foto .est.bor{background:rgba(31,27,22,.82);color:#fff}
.ex .foto .est.pub{background:var(--ok);color:#fff}
.ex .cu{display:block;padding:11px 13px 13px}
.ex .nm{display:block;font-weight:800;font-size:13.5px;line-height:1.28;text-transform:uppercase}
.ex .sub{display:block;font-size:11.5px;color:var(--muted);margin-top:4px}
.ex .de2{display:block;font-size:12px;color:var(--ink);margin-top:6px;line-height:1.5}
.sem{display:flex;gap:3px;margin-top:9px;flex-wrap:wrap}
.pt{width:17px;height:17px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:800;flex:none}
.pt.ok{background:var(--ok-bg);color:var(--ok)}
.pt.no{background:var(--surface-2);color:var(--faint);border:1px solid var(--rule)}
.pt.na{background:transparent;color:var(--faint);border:1px dashed var(--rule)}
.ex .falta{display:block;font-size:11px;color:var(--muted);margin-top:7px;line-height:1.4}
.cn{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--rule);border-radius:11px;margin-bottom:9px}
.cn .ci{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex:none}
.cn .ci svg{width:19px;height:19px}

.fono.g{width:300px;height:600px;border-width:8px;border-radius:30px}

.fono.g .slot{display:block;width:100%;text-align:left;border:1.5px dashed transparent;
  background:none;padding:0;font:inherit;color:inherit;cursor:pointer;border-radius:11px;position:relative}

  text-transform:uppercase;padding:2px 7px;border-radius:999px}

    }).map(function(x){return {id:x.id,n:x.nombre,d:x.fecha_inicio?String(x.fecha_inicio).slice(0,10):'',
      f:'',pvp:Number(x.precio)||0,vend:10,hot:5,quien:'',tipo:'Evento',colonia:'',dias:'',hora:'',nfotos:0,ficha:{}};});

    var m=await get('mapa_puntos?select=*&activo=is.true&limit=500&order=nombre')||[];
    /* El mapa tambien es de la ciudad de la casa. Antes lo decidia `deAqui`,

    CAT.mapa=m.filter(function(x){ return !x.ciudad || mismaCiudad(x.ciudad, ciu); }).map(function(x){
      /* Las fotos del mapa no estan en la base: maps_photo='y' solo dice que

      var fp = foto1(x.fotos) || (x.maps_photo==='y' && x.maps_place_id
               ? SB+'/functions/v1/place-photo?w=600&id='+encodeURIComponent(x.maps_place_id) : '');
      return {id:x.id,n:x.nombre,d:x.barrio||x.ciudad||'',f:fp,

        nfotos:cuenta(x.fotos), ficha:x};});
    /* La tienda es la de la Comunidad de Potrero de la Palmita: 26 piezas con

    var tn=await get('v_tienda_publico?select=*&order=orden,nombre')||[];
    CAT.tienda=tn.map(function(x){
      return {id:x.id,n:x.nombre,d:x.medidas||'',
        f:x.foto_url||'',pvp:Number(x.precio_mxn)||0,vend:10,hot:5,

        nfotos:0,

                 + (x.artesana_semblanza?' — '+x.artesana_semblanza:''),
               souvenir:'', salida:x.comunidad, galeria:x.galeria_url?[x.galeria_url]:[],

  function cuenta(g){ try{ var a=Array.isArray(g)?g:(g?JSON.parse(g):[]); return a.length; }catch(_){ return 0; } }
  function foto1(g){ try{ var a=Array.isArray(g)?g:(g?JSON.parse(g):[]); var f=a[0];
      return typeof f==='string'?f:(f&&(f.url||f.src))||''; }catch(_){ return ''; } }
  /* De "Calle Colón 1, Colonia Centro, Cuauhtémoc, 06040 CDMX" nos queda "Centro". */
  function colDe(dir){ if(!dir) return '';
    var m=String(dir).match(/colonia\s+([^,]+)/i); if(m) return m[1].trim();
    var p=String(dir).split(','); return p.length>1? p[1].trim() : ''; }

  /* ---------- niveles y pestañas ---------- */

    var logoG = (MAR && MAR.logo_url) || G.marca_logo_url;

       ciudad, porque no hay grupo del que hablar. Antes las dos decian lo

    $('sub').textContent = nivel==='hotel'

    var vp=$('verPublico'); vp.href=ligaApp(d);

  function pintaNav(){
    $('rielT').textContent = nivel==='hotel' ? 'Esta casa' : 'El grupo · vale para todas';
    $('rielBack').innerHTML = nivel==='hotel'
      ? '<button type="button" id="bVolverGrupo">← Todo el grupo</button>' : '';

    $('nav').innerHTML=SECS[nivel].map(function(x){
      return '<li data-k="'+x.k+'"><a role="tab" tabindex="0">'+ic(x.g)+esc(x.t)+'</a></li>';}).join('');
    $('nav').querySelectorAll('li').forEach(function(li){
      var k=li.getAttribute('data-k');
      li.querySelector('a').onclick=function(){ve(k);};

  function ve(k){
    sec=k;
    Array.prototype.forEach.call($('nav').children,function(li){
      li.className = li.getAttribute('data-k')===k ? 'on' : ''; });
    var x=SECS[nivel].filter(function(y){return y.k===k;})[0]||{t:'',d:''};
    $('sechead').innerHTML='<h1>'+esc(x.t)+'</h1>'+(x.d?'<p>'+esc(x.d)+'</p>':'')
      + (x.k==='espacios'&&nivel==='grupo'
          ? '<div class="nota">Un evento necesita dónde pasar: los espacios los da de alta el hotel, y luego los puede usar una productora si lo abres a terceros.</div>'
          : (x.k==='eventos'

  /* Cambiar de casa se pide desde dos sitios -el desplegable de la banda y el

  async function alNivel(v){
    if(v==='grupo'){ nivel='grupo'; Hsel=null; }
    else { nivel='hotel'; Hsel=HOT.filter(function(x){return x.id===v;})[0]; if(!Hsel){nivel='grupo';} }

    var L={rnt:'RNT',funcionamiento:'licencia de funcionamiento',renta_vacacional:'permiso de renta vacacional'};

      return avisoNota('warn','Sin permiso registrado',

  /* ---------- CÓMO TE PAGAMOS: Stripe Connect ----------
     El hotel no cobra al huésped. Lo único que necesita es una cuenta donde
     recibir su parte, y esa cuenta se abre en Stripe: sus datos bancarios los
     escribe él allí y nosotros no los vemos ni los guardamos. */
  var ST={pendiente:['Sin cuenta','Todavía no tienes dónde recibir tu parte.','falta'],
          liga_enviada:['Alta empezada','Abriste el alta pero no la terminaste.','falta'],
          restringido:['Restringida','Mandaste tus datos y Stripe pide algo más. Hasta que lo resuelvas no recibes.','falta'],
          vinculado:['Lista','Stripe ya te deja recibir transferencias.','si']};
  function pintaStripe(){
    var c=$('stripeCaja'); if(!c) return;

      + (d.stripe_account_id?'<span class="cn2" style="font-family:ui-monospace,monospace;font-size:11.5px">'+esc(d.stripe_account_id)+'</span>':'')
      +'</span><span class="est '+(t[2]==='si'?'si':'falta')+'">'+(t[2]==='si'?'Recibes':'No recibes')+'</span></div>'
      +'<div class="ft" style="justify-content:flex-start">'
      +'<button class="btn" id="stAlta">'+(d.stripe_account_id?'Volver a abrir tu alta':'Abrir tu alta en Stripe')+'</button>'
      + (d.stripe_account_id?'<button class="btn ghost" id="stVer">Revisar cómo va</button>':'')
      +'</div>'
      +'<div class="mini" style="margin-top:4px">La liga es tuya y caduca. Tus datos los escribes tú en Stripe; aquí no se guardan.</div>';
    $('stAlta').onclick=function(){stripeLlama('alta');};
    if($('stVer')) $('stVer').onclick=function(){stripeLlama('estado');};
  }
  async function stripeLlama(accion){
    var d=destino(); if(!d) return;
    var b=$(accion==='alta'?'stAlta':'stVer'); if(b){b.disabled=true;b.textContent='Un momento…';}
    try{
      var r=await fetch(SB+'/functions/v1/hotel-stripe-alta',{method:'POST',
        headers:hdr(), body:JSON.stringify({accion:accion,hotel_id:d.id,origen:location.origin})});
      var j=await r.json();
      if(!r.ok||j.error){ toast(j.error||'Stripe no contestó',true); }
      else if(accion==='alta' && j.url){ window.open(j.url,'_blank','noopener'); toast('Alta abierta en otra pestaña'); }
      else { toast(j.stripe_payouts_enabled?'Ya puedes recibir':'Todavía te falta algo en Stripe'); }
      var f=await get('hoteles?select=*&id=eq.'+d.id);
      if(f&&f[0]){ for(var i=0;i<GRUPOS.length;i++) if(GRUPOS[i].id===d.id) GRUPOS[i]=f[0];
                   if(Hsel&&Hsel.id===d.id) Hsel=f[0]; if(G.id===d.id) G=f[0]; }
    }catch(e){ toast('No pudimos hablar con Stripe: '+e.message,true); }
    finally{ pintaStripe(); }
  }
  function pintaSuma(){
    var e=$('sumaPct'); if(!e) return;
    var v=['com_hotel_pct','com_colaborador_pct','com_plataforma_pct'].map(function(c){
      var el=document.querySelector('[data-c="'+c+'"]'); return Number(el&&el.value)||0;});
    var s2=v[0]+v[1]+v[2];
    e.innerHTML = Math.abs(s2-100)<0.01
      ? '<span class="est si">Suma 100% con la parte de quien opera</span>'
      : '<span class="est falta">Entre los tres se llevan '+s2+'%; a quien opera le queda '+(100-s2)+'%</span>';
  }

  /* ---------- FIRMAMOS: el contrato marco, igual que en touroperadoras ----------
     No son tres campos de texto: la plantilla vive en hotel_contrato_plantilla,
     el cuerpo se arma con los datos del alta, se manda por correo con su liga y
     al firmar queda congelado con su acuse. */
  var CT=null;
  async function cargaContrato(){
    CT=null; var d=destino(); if(!d) return;
    var r=await get('hotel_contratos?hotel_id=eq.'+d.id+'&estado=in.(borrador,enviado,firmado)'
      +'&select=folio,estado,token,firmado_at,firmante,version&limit=1');
    CT=(r&&r[0])||null;
  }
  function pintaContrato(){
    var c=$('ctCaja'); if(!c) return;
    if(!CT){
      c.innerHTML='<div class="cn"><span class="ci">'+ic('doc')+'</span>'
        +'<span><span class="cn1">Sin contrato todavía</span>'
        +'<span class="cn2">Se genera con lo que ya está capturado. Si algo falta, el contrato lo deja en blanco y se nota.</span></span>'
        +'<span class="est falta">Falta</span></div>'
        +'<div class="ft" style="justify-content:flex-start"><button class="btn" id="ctGen">Generar y mandármelo</button></div>';
    } else {
      var liga='/contrato-hotel.html?t='+encodeURIComponent(CT.token);
      var fir=CT.estado==='firmado';
      c.innerHTML='<div class="cn"><span class="ci" style="'+(fir?'background:var(--ok-bg);color:var(--ok)':'')+'">'+ic(fir?'ok':'doc')+'</span>'
        +'<span><span class="cn1">'+(fir?'Firmado':'Mandado, sin firmar')+'</span>'
        +'<span class="cn2">Folio <b>'+esc(CT.folio)+'</b> · '+esc(CT.version||'')
        + (fir?(' · '+esc(CT.firmante||'')+' · '+String(CT.firmado_at||'').slice(0,10)):'')+'</span></span>'
        +'<span class="est '+(fir?'si':'falta')+'">'+(fir?'Listo':'Pendiente')+'</span></div>'
        +'<div class="ft" style="justify-content:flex-start">'
        +'<a class="btn ghost" href="'+liga+'" target="_blank" rel="noopener" style="text-decoration:none">'+(fir?'Ver el contrato firmado':'Leerlo y firmarlo')+'</a>'
        + (fir?'':'<button class="btn ghost" id="ctGen">Rehacerlo con mis datos de hoy</button>')
        +'</div>';
    }
    if($('ctGen')) $('ctGen').onclick=ctGenerar;
  }
  async function ctGenerar(){
    var b=$('ctGen'); if(b){b.disabled=true;b.textContent='Un momento…';}
    try{
      var r=await fetch(SB+'/functions/v1/hotel-contrato',{method:'POST',headers:hdr(),
        body:JSON.stringify({accion:'generar',hotel_id:destino().id,rehacer:!!(CT&&CT.estado!=='firmado')})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok||j.error) throw new Error(j.error||('HTTP '+r.status));
      await cargaContrato(); pintaContrato();
      toast(j.avisado_a&&j.avisado_a.length?('Contrato '+j.folio+' mandado a '+j.avisado_a.join(', ')):('Contrato '+j.folio+' generado'));
      if(j.url) window.open(j.url,'_blank','noopener');
    }catch(x){
      toast('No se pudo',true);
      if(b){b.disabled=false;b.textContent='Generar y mandármelo';}
      var c=$('ctCaja');
      if(c && !c.querySelector('.muroct')){
        var m=document.createElement('div');
        m.className='muroct';
        m.style.cssText='margin-top:10px;background:var(--warn-bg);border:1px solid #E6D2A8;color:var(--warn);border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.5';
        m.textContent=x.message||'No se pudo generar el contrato.';
        c.appendChild(m);
      }
    }
  }
  function cajaPrevio(d){
    var n=(EQ.mods||[]).length;
    var suma=(Number(d.com_hotel_pct)||0)+(Number(d.com_colaborador_pct)||0)+(Number(d.com_plataforma_pct)||0);
    var L=[
      ['Escogiste tus módulos', n>0, n+' módulos', 'Todavía ninguno'],
      ['El reparto está pactado', suma>0 && suma<100, 'Entre los tres: '+suma+'%', suma>=100?'Suma '+suma+'%: no le queda nada a quien opera':'Sin repartir'],
      ['Tienes tus datos fiscales', !!(d.rfc&&d.tipo_persona), String(d.rfc||''), 'Falta RFC o figura fiscal'],
      ['Sabemos dónde recibes', !!(d.clabe||d.stripe_account_id), 'Sí', 'Ni CLABE ni cuenta de cobro'],
      ['Tienes permiso vigente', !!(d.licencia_tipo && d.licencia_tipo!=='ninguna'), 'Sí', 'Sin permiso registrado'],
      ['Tienes a alguien dado de alta', (EQ.gente||[]).length>0, (EQ.gente||[]).length+' personas', 'Nadie todavía']
    ];

        +'<span><span class="cn1">'+x[0]+'</span><span class="cn2">'+esc(x[1]?x[2]:x[3])+'</span></span>'
        +'<span class="est '+(x[1]?'si':'falta')+'">'+(x[1]?'Listo':'Falta')+'</span></div>';
    }).join('');
  }

  /* ---------- MI EQUIPO ----------
     Aquí no se pregunta "hasta dónde llega tu equipo": eso ya se dijo en Quién
     eres. Aquí se dan de alta personas, una por una, con lo justo para abrirles
     la puerta: correo, nombre, dónde trabajan, su área y su puesto.
     Salario, contrato y vacaciones NO se piden aquí. Eso vive en Nómina, y solo
     si el hotel tiene ese módulo. */
  var EQ={gente:[],puestos:[],mods:[],cat:[],acc:{},sel:null,edit:null};
  var PAPELES=[['dueno','Dueño'],['socio','Socio'],['director','Director'],['gerente','Gerente'],
               ['jefe','Jefe de área'],['colaborador','Colaborador'],['concierge','Concierge'],['externo','Externo']];
  function eqCasas(){
    var a=[G].concat(HOT||[]), v={}, o=[];
    a.forEach(function(x){ if(x&&x.id&&!v[x.id]){v[x.id]=1;o.push(x);} });
    return o;
  }
  function eqAreas(){
    var v={},o=[]; (EQ.puestos||[]).forEach(function(p){ if(!v[p.area]){v[p.area]=1;o.push(p.area);} });
    return o.sort();
  }
  async function eqCarga(){
    var ids=eqCasas().map(function(x){return x.id;});
    if(!ids.length) return;
    var en='in.('+ids.join(',')+')';
    EQ.puestos = await get('hotel_puestos?select=area,nombre,orden,hotel_id&activo=is.true&order=area,orden') || [];
    EQ.gente   = await get('hotel_usuarios?select=*&hotel_id='+en+'&order=nombre') || [];
    if(!EQ.cat.length) EQ.cat = await get('hotel_modulos?select=codigo,nombre,area,integra&order=area,orden') || [];
    EQ.mods    = await get('hotel_modulos_activos?select=modulo,hotel_id&activo=is.true&hotel_id='+en) || [];
    EQ.acc={};
    var uids=EQ.gente.map(function(u){return u.id;});
    if(uids.length){
      (await get('hotel_usuario_modulos?select=usuario_id,modulo_codigo,nivel&usuario_id=in.('+uids.join(',')+')')||[])
        .forEach(function(a){ EQ.acc[a.usuario_id+':'+a.modulo_codigo]=a.nivel; });
    }
    eqPinta(); accPinta();
    if($('prevBox')) $('prevBox').innerHTML=cajaPrevio(destino());
  }
  function tieneNomina(){
    var cod={}; (EQ.cat||[]).forEach(function(m){ if(m.area==='Nómina') cod[m.codigo]=1; });
    return (EQ.mods||[]).some(function(m){ return cod[m.modulo]; });
  }
  function eqForm(){
    var e=EQ.edit||{}, casas=eqCasas(), areas=eqAreas();
    var alc=e.alcance||'uno';
    var pues=(EQ.puestos||[]).filter(function(p){ return p.area===(e.area||''); });
    /* Vende quien es concierge, y quien ya tenga un código aunque hoy figure

    var vende = (e.rol||'')==='concierge' || !!e.codigo_venta;
    return '<div class="fgrid">'
      +'<div class="fld"><label>Correo</label><input id="eMail" type="email" value="'+esc(e.email||'')+'" placeholder="nombre@hotel.com"><div class="ay">Con este correo entra; es su llave y no se comparte</div></div>'
      +'<div class="fld"><label>Nombre</label><input id="eNom" value="'+esc(e.nombre||'')+'"></div>'
      +'<div class="fld"><label>Apellido</label><input id="eApe" value="'+esc(e.apellido||'')+'"></div>'
      +'<div class="fld"><label>¿Dónde trabaja?</label><select id="eAlc">'

      +'</select></div>'
      +'<div class="fld"><label>Área del hotel</label><select id="eArea"><option value="">—</option>'
        + areas.map(function(a){ return '<option value="'+esc(a)+'"'+(e.area===a?' selected':'')+'>'+esc(a)+'</option>'; }).join('')
      +'</select></div>'
      +'<div class="fld"><label>Puesto</label><select id="ePue">'
        + (pues.length?'':'<option value="">Escoge primero el área</option>')
        + pues.map(function(p){ return '<option value="'+esc(p.nombre)+'"'+(e.puesto===p.nombre?' selected':'')+'>'+esc(p.nombre)+'</option>'; }).join('')
        + (pues.length?'<option value="__otro">Otro… (escribirlo)</option>':'')
      +'</select></div>'
      +'<div class="fld" id="eOtroBox" style="display:none"><label>¿Qué puesto?</label><input id="eOtro" placeholder="Como lo llaman en tu casa"><div class="ay">Se guarda en tu catálogo para la próxima</div></div>'
      +'<div class="fld"><label>Papel en el sistema</label><select id="ePap">'
        + PAPELES.map(function(p){ return '<option value="'+p[0]+'"'+((e.rol||'colaborador')===p[0]?' selected':'')+'>'+p[1]+'</option>'; }).join('')
      +'</select><div class="ay">Decide el marco; el detalle se afina en Accesos</div></div>'
      +'</div>'
      /* LO QUE LE FALTA A UN CONCIERGE PARA PODER VENDER. Bloque 4, 26-oct-2026.
         `codigo_venta`, `com_pct` y `descuento_max_pct` existen en
         hotel_usuarios y este formulario no los pedia: cero usos en todo el
         archivo. Un concierge dado de alta aqui quedaba sin codigo, y sin
         codigo su venta no se le atribuye a nadie. La pieza estaba; faltaba el
         campo. */
      +'<div id="eVenta" style="display:'+(vende?'block':'none')+'">'
        +'<div class="hint" style="margin-top:12px">Lo que necesita para vender desde recepci\u00f3n. Su c\u00f3digo es lo que hace que la venta sea suya a la hora del corte.</div>'
        +'<div class="fgrid">'
        +'<div class="fld"><label>Su c\u00f3digo de venta</label><input id="eCod" value="'+esc(e.codigo_venta||'')+'" placeholder="ANA-CP" style="text-transform:uppercase">'
          +'<div class="ay">Corto y f\u00e1cil de dictar. Si lo dejas vac\u00edo, su venta no se le atribuye.</div></div>'
        +'<div class="fld"><label>Su comisi\u00f3n %</label><input id="eCom" type="number" min="0" max="100" step="0.5" value="'+esc(e.com_pct==null?'':e.com_pct)+'">'
          +'<div class="ay">De lo que vende. Sale del 10% de quien vende, no se suma encima.</div></div>'
        +'<div class="fld"><label>Descuento m\u00e1ximo %</label><input id="eDto" type="number" min="0" max="100" step="1" value="'+esc(e.descuento_max_pct==null?'':e.descuento_max_pct)+'">'
          +'<div class="ay">Hasta cu\u00e1nto puede bajar el precio sin pedir permiso. Vac\u00edo: nada.</div></div>'
        +'</div></div>'
      +'<div id="eVarios" style="display:'+(alc==='varios'?'block':'none')+';margin-top:11px">'
        +'<div class="mini" style="margin-bottom:6px">¿En cuáles?</div><div class="tipos">'
        + casas.map(function(c){ var on=(e.hoteles||[]).indexOf(c.id)>=0;
            return '<button type="button" class="chip'+(on?' on':'')+'" data-casa="'+c.id+'">'+esc(c.nombre_comercial||'')+'</button>'; }).join('')
        +'</div></div>'
      + (tieneNomina()
          ? '<div class="nomi">Tienes el módulo de Nómina: el salario, el contrato, las vacaciones y el expediente de esta persona se capturan <b>allí</b>, no aquí. Aquí solo se abre la puerta.</div>'
          : '<div class="nomi">Salario, contrato y vacaciones no se piden aquí. Eso llega con el módulo de Nómina, si algún día lo contratas.</div>')
      +'<div class="ft">'
      + (EQ.edit&&EQ.edit.id?'<button class="btn ghost" id="eCancel">Cancelar</button>':'')
      +'<button class="btn" id="eGuarda">'+(EQ.edit&&EQ.edit.id?'Guardar cambios':'Dar de alta')+'</button></div>';
  }
  function eqTabla(){
    if(!(EQ.gente||[]).length) return '<div class="mini" style="margin-top:14px">Nadie dado de alta todavía.</div>';
    var casas={}; eqCasas().forEach(function(c){ casas[c.id]=c.nombre_comercial; });
    var pap={}; PAPELES.forEach(function(p){ pap[p[0]]=p[1]; });
    return '<div class="eqt" style="margin-top:14px"><table><thead><tr>'
      +'<th>Quién</th><th>Puesto</th><th>Dónde</th><th>Papel</th><th>Accesos</th><th></th><th></th></tr></thead><tbody>'
      + EQ.gente.map(function(u){
          var donde = u.alcance==='todos' ? 'Todo el grupo'
            : (u.alcance==='varios' ? ((u.hoteles||[]).map(function(i){return casas[i]||'';}).filter(Boolean).join(', ')||'Varios')
            : (casas[u.hotel_id]||'—'));
          var na=Object.keys(EQ.acc).filter(function(k){return k.indexOf(u.id+':')===0;}).length;
          return '<tr><td><b>'+esc([u.nombre,u.apellido].filter(Boolean).join(' ')||'—')+'</b>'
            +'<span class="mini" style="display:block">'+esc(u.email||u.whatsapp||'—')+'</span></td>'
            +'<td>'+esc(u.puesto||'—')+'<span class="mini" style="display:block">'+esc(u.area||'')+'</span></td>'
            +'<td class="mini">'+esc(donde)+'</td>'
            +'<td class="mini">'+esc(pap[u.rol]||u.rol||'—')
              /* El codigo, a la vista: es lo que se dicta y lo que hay que
                 poder comprobar de un vistazo el dia que una venta no cuadra. */
              +(u.codigo_venta?'<b style="display:block">'+esc(u.codigo_venta)+'</b>':'')
              +(u.com_pct!=null?'<span style="display:block">'+esc(u.com_pct)+'% de comisión</span>':'')
              +'</td>'
            +'<td class="mini" data-nacc="'+u.id+'">'+(na?na+' módulos':'—')+'</td>'
            +'<td><span class="est '+(u.activo?'si':'no')+'">'+(u.activo?'Activo':'Baja')+'</span></td>'
            +'<td><span class="ac"><button data-ed="'+u.id+'">Editar</button>'
            +'<button class="bad" data-baja="'+u.id+'">'+(u.activo?'Baja':'Alta')+'</button></span></td></tr>';
        }).join('')
      +'</tbody></table></div>';
  }
  function eqPinta(){
    var w=$('eqBox'); if(!w) return;
    w.innerHTML='<div class="hint">Cada persona entra con su correo. Decides dónde trabaja, de qué área es y qué puesto tiene; con eso el sistema ya sabe qué enseñarle.</div>'
      + eqForm() + eqTabla();
    var sel=$('eAlc'); if(sel) sel.onchange=function(){
      $('eVarios').style.display = this.value==='varios' ? 'block' : 'none';
    };
    var ar=$('eArea'); if(ar) ar.onchange=function(){
      EQ.edit=eqLee(); EQ.edit.area=this.value; EQ.edit.puesto=''; eqPinta();
    };
    var pu=$('ePue'); if(pu) pu.onchange=function(){
      $('eOtroBox').style.display = this.value==='__otro' ? 'block' : 'none';
    };
    /* Al marcarlo como concierge aparecen sus campos de venta en el momento,
       sin tener que guardar para enterarse. */
    var pa=$('ePap'); if(pa) pa.onchange=function(){
      var v=$('eVenta'); if(!v) return;
      var tiene=(EQ.edit&&EQ.edit.codigo_venta);
      v.style.display = (this.value==='concierge'||tiene) ? 'block' : 'none';
    };
    w.querySelectorAll('[data-casa]').forEach(function(b){ b.onclick=function(){ b.classList.toggle('on'); }; });
    w.querySelectorAll('[data-ed]').forEach(function(b){ b.onclick=function(){
      EQ.edit=EQ.gente.filter(function(u){return u.id===b.getAttribute('data-ed');})[0]||null; eqPinta();
      w.scrollIntoView({behavior:'smooth',block:'start'});
    };});
    w.querySelectorAll('[data-baja]').forEach(function(b){ b.onclick=function(){ eqBaja(b.getAttribute('data-baja')); };});
    if($('eCancel')) $('eCancel').onclick=function(){ EQ.edit=null; eqPinta(); };
    if($('eGuarda')) $('eGuarda').onclick=eqGuarda;
  }
  function eqLee(){
    var v=function(i){ var e=$(i); return e?(e.value||'').trim():''; };
    var alc=v('eAlc'), o={email:v('eMail'),nombre:v('eNom'),apellido:v('eApe'),
                          area:v('eArea'),rol:v('ePap')};
    o.puesto = v('ePue')==='__otro' ? v('eOtro') : v('ePue');
    /* El código en mayúsculas y sin espacios: se dicta por teléfono y se
       teclea en una tablet; «ana cp» y «ANA-CP» tienen que ser el mismo. */
    var cod=v('eCod').toUpperCase().replace(/\s+/g,'');
    o.codigo_venta       = cod || null;
    o.com_pct            = v('eCom')===''  ? null : Number(v('eCom'));
    o.descuento_max_pct  = v('eDto')===''  ? null : Number(v('eDto'));
    if(alc==='todos'){ o.alcance='todos'; o.hotel_id=(G&&G.id)||null; o.hoteles=eqCasas().map(function(c){return c.id;}); }
    else if(alc==='varios'){
      o.alcance='varios';
      o.hoteles=Array.prototype.map.call(document.querySelectorAll('[data-casa].on'),function(b){return b.getAttribute('data-casa');});
      o.hotel_id=o.hoteles[0]||(G&&G.id)||null;
    } else { o.alcance='uno'; o.hotel_id=alc.replace(/^h:/,''); o.hoteles=[o.hotel_id]; }
    if(EQ.edit&&EQ.edit.id) o.id=EQ.edit.id;
    return o;
  }
  async function eqGuarda(){
    var o=eqLee();
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(o.email)) return toast('Falta un correo válido: es su llave.',true);
    if(!o.nombre) return toast('Falta el nombre.',true);
    if(o.alcance==='varios' && !o.hoteles.length) return toast('Escoge en cuáles trabaja.',true);
    /* Un puesto nuevo se guarda en el catálogo: la próxima vez ya sale en la
       lista, y así el catálogo lo escribe quien conoce la casa. */
    if(o.area && o.puesto && !(EQ.puestos||[]).some(function(p){return p.area===o.area && p.nombre.toLowerCase()===o.puesto.toLowerCase();})){
      await fetch(SB+'/rest/v1/hotel_puestos',{method:'POST',headers:hdr(),
        body:JSON.stringify([{area:o.area,nombre:o.puesto,orden:500,hotel_id:(G&&G.id)||null}])}).catch(function(){});
    }
    var id=o.id; delete o.id;
    if(!id) o.activo=true;
    var h=hdr(); h['Prefer']='return=representation';
    var r=await fetch(SB+'/rest/v1/hotel_usuarios'+(id?'?id=eq.'+id:''),
      {method:id?'PATCH':'POST',headers:h,body:JSON.stringify(id?o:[o])});
    if(!r.ok) return toast('No se pudo guardar: '+(await r.text()).slice(0,110),true);
    var j=await r.json();
    if(!j||!j.length) return toast('No se guardó: tu usuario no puede editar este equipo.',true);
    EQ.edit=null; toast(id?'Guardado':'Dado de alta');
    await eqCarga();
  }
  async function eqBaja(id){

  /* ---------- ACCESOS ----------
     Solo se reparten los módulos que el hotel tiene dados de alta: no tiene
     sentido ofrecer una llave de una puerta que no existe. */
  function accPinta(){
    var w=$('accBox'); if(!w) return;
    var vivos=(EQ.gente||[]).filter(function(u){return u.activo;});
    if(!vivos.length){ w.innerHTML='<div class="mini">Da de alta a alguien en Mi equipo y aquí repartes sus accesos.</div>'; return; }
    if(!EQ.sel || !vivos.some(function(u){return u.id===EQ.sel;})) EQ.sel=vivos[0].id;
    var act={}; (EQ.mods||[]).forEach(function(m){ act[m.modulo]=1; });
    var mios=(EQ.cat||[]).filter(function(m){ return act[m.codigo]; });
    var cab='<div class="fgrid"><div class="fld"><label>¿A quién?</label><select id="accQuien">'
      + vivos.map(function(u){ return '<option value="'+u.id+'"'+(EQ.sel===u.id?' selected':'')+'>'
          + esc([u.nombre,u.apellido].filter(Boolean).join(' ')) + (u.puesto?' · '+esc(u.puesto):'') +'</option>'; }).join('')
      +'</select></div></div>';
    if(!mios.length){ w.innerHTML=cab+'<div class="mini" style="margin-top:12px">Todavía no tienes módulos dados de alta. En cuanto los contrates aparecen aquí para repartirlos.</div>'; return; }
    var porArea={}; mios.forEach(function(m){ (porArea[m.area||'Otros']=porArea[m.area||'Otros']||[]).push(m); });
    var h='<div class="accg">';
    Object.keys(porArea).sort().forEach(function(a){
      h+='<div class="ah">'+esc(a)+'</div>';
      porArea[a].forEach(function(m){
        var n=EQ.acc[EQ.sel+':'+m.codigo]||'';
        h+='<div class="accm"><span><span class="an">'+esc(m.nombre)+'</span>'
          + (m.integra&&m.integra!=='no'?'<span class="aq">necesita conexión</span>':'')
          +'</span><span class="resp" data-mod="'+esc(m.codigo)+'">'
          +'<button data-v="" class="'+(n===''?'on':'')+'">Sin acceso</button>'
          +'<button data-v="ver" class="'+(n==='ver'?'on':'')+'">Ver</button>'
          +'<button data-v="editar" class="'+(n==='editar'?'on':'')+'">Editar</button>'
          +'</span></div>';
      });
    });
    h+='</div>';
    w.innerHTML=cab+h+'<div class="mini" style="margin-top:10px">Se guarda al momento. Un acceso es personal: queda en la bitácora quién vio qué.</div>';
    $('accQuien').onchange=function(){ EQ.sel=this.value; accPinta(); };
    w.querySelectorAll('.resp button').forEach(function(b){ b.onclick=function(){
      accPon(b.parentNode.getAttribute('data-mod'), b.getAttribute('data-v'));

  async function accPon(cod,nivel){
    var u=EQ.sel; if(!u) return;
    var k=u+':'+cod;
    if(!nivel){
      var r=await fetch(SB+'/rest/v1/hotel_usuario_modulos?usuario_id=eq.'+u+'&modulo_codigo=eq.'+encodeURIComponent(cod),
        {method:'DELETE',headers:hdr()});
      if(!r.ok) return toast('No se pudo quitar',true);
      delete EQ.acc[k];
    } else {
      var h=hdr(); h['Prefer']='resolution=merge-duplicates,return=representation';
      var r2=await fetch(SB+'/rest/v1/hotel_usuario_modulos',{method:'POST',headers:h,
        body:JSON.stringify([{usuario_id:u,modulo_codigo:cod,nivel:nivel}])});
      if(!r2.ok) return toast('No se pudo dar el acceso: '+(await r2.text()).slice(0,90),true);
      EQ.acc[k]=nivel;
    }
    accPinta(); accCuenta();
  }

  var VAL={si:{t:'Sí',p:1},parcial:{t:'A medias',p:.5},no:{t:'No',p:0},na:{t:'No aplica',p:null}};

  async function vImpacto(w){
    var d=destino();

  function puntos(v){
    var hechas=0,suma=0;
    v.q.forEach(function(q){ var r=RESP[q[0]]; if(!r||r==='na') return; hechas++; suma+=VAL[r].p; });
    return {hechas:hechas, total:v.q.length, pct: hechas? Math.round(suma/hechas*100) : null};
  }
  function color(p){ return p==null?'var(--surface-2)' : p>=70?'var(--ok)' : p>=40?'var(--warn)' : 'var(--bad)'; }

  function pintaImpacto(w){
    var d=destino();
    var tot=VIAS.map(puntos), conD=tot.filter(function(x){return x.pct!=null;});
    var global = conD.length ? Math.round(conD.reduce(function(a,x){return a+x.pct;},0)/conD.length) : null;
    var respondidas = VIAS.reduce(function(a,v){return a+v.q.filter(function(q){return RESP[q[0]];}).length;},0);
    var totalQ = VIAS.reduce(function(a,v){return a+v.q.length;},0);

    w.innerHTML='<div class="kpis">'
      +'<div class="kpi"><div class="et">Dónde estás</div><div class="vl" style="color:'+color(global)+'">'+(global==null?'—':global+'%')+'</div><div class="nt">Media de las cinco vías</div></div>'
      +'<div class="kpi"><div class="et">Contestadas</div><div class="vl">'+respondidas+' / '+totalQ+'</div><div class="nt">Se puede dejar a medias y seguir luego</div></div>'
      +'<div class="kpi"><div class="et">Cuartos</div><div class="vl">'+(d.cuartos||'—')+'</div><div class="nt">El impacto se mide por cuarto, no en total</div></div>'
      +'<div class="kpi"><div class="et">Intangibles</div><div class="vl">'+Object.keys(SEL).filter(function(x){return x.indexOf("mapa:")!==0;}).length+'</div><div class="nt">Lo que ofreces además de la cama</div></div>'
      +'</div>'
      +'<div class="card"><h3>Tu impacto, por las cinco vías de Glasgow</h3>'
      +'<div class="hint">La Declaración de Glasgow pide cinco cosas a quien hospeda: medir, descarbonizar, regenerar, colaborar y financiar. Contesta lo que sepas hoy; lo que no, déjalo. Vale más un «no» honesto que un «sí» de adorno — esto lo acaba viendo un huésped.</div>'
      + VIAS.map(function(v,i){
          var p=tot[i];
          return '<div class="via'+(i===0?' ab':'')+'"><div class="viac">'
            +'<span class="vi" style="'+(p.pct!=null?'background:'+color(p.pct)+';color:#fff':'')+'">'+ic(v.g)+'</span>'
            +'<span><span class="vn">'+esc(v.n)+'</span><span class="vd">'+esc(v.d)+'</span></span>'
            +'<span style="display:flex;align-items:center;gap:9px">'
            +'<span class="barra"><i style="width:'+(p.pct==null?0:p.pct)+'%;background:'+color(p.pct)+'"></i></span>'
            +'<b style="font-size:12.5px;min-width:34px;text-align:right">'+(p.pct==null?'—':p.pct+'%')+'</b></span></div>'
            +'<div class="viaq">'+ v.q.map(function(q){
                return '<div class="q"><span><span class="qt">'+esc(q[1])+'</span><span class="qa">'+esc(q[2])+'</span></span>'
                  +'<span class="resp">'+['si','parcial','no','na'].map(function(k){
                      return '<button data-q="'+q[0]+'" data-v="'+k+'" class="'+(RESP[q[0]]===k?'on':'')+'">'+VAL[k].t+'</button>';

              }).join('') +'</div></div>';

      var q=b.getAttribute('data-q'), v=b.getAttribute('data-v');

      var el=document.querySelector('[data-q="'+q+'"]'); if(el) el.closest('.via').classList.add('ab');
    };});

  var busca='';
  function items(tipos){
    var q=(busca||'').toLowerCase().trim(), out=[];
    tipos.forEach(function(t){
      if(filtro!=='todos' && tipos.length>1 && filtro!==t) return;
      (CAT[t]||[]).forEach(function(x){
        if(t==='mapa' && ftipo && x.tipo!==ftipo) return;
        if(q && x.n.toLowerCase().indexOf(q)<0 && (x.colonia||'').toLowerCase().indexOf(q)<0) return;
        out.push({t:t,x:x});
      });
    });
    return out;
  }

  function dinero(n){ return '$'+Math.round(n).toLocaleString('es-MX'); }
  function econo(o){
    if(!o.x.pvp) return '';
    return '<span class="eco"><b>'+dinero(o.x.pvp)+'</b> PVP · '
      + dinero(o.x.pvp*o.x.vend/100)+' a quien la vende · '
      + dinero(o.x.pvp*o.x.hot/100)+' a tu casa</span>';
  }

  function rejilla(tipos){
    var L=items(tipos), g=$('bg'); if(!g) return;
    var esMapa = tipos.length===1 && tipos[0]==='mapa';
    g.className = 'bg ' + (esMapa?'mapa':vista);
    if(!L.length){ g.innerHTML='<div class="vacio">Nada que mostrar con este filtro.</div>'; return; }
    g.innerHTML=L.map(esMapa?tarjMapa:tarjExp).join('');
    g.querySelectorAll('.it').forEach(function(b){
      var t=b.getAttribute('data-t'), i=b.getAttribute('data-i');
      var bs=b.querySelector('[data-sel]'); if(bs) bs.onclick=function(e){e.stopPropagation();marca(t,i,tipos);};
      b.onclick=function(e){ if(e.target.closest('a')) return; ficha(t,i,tipos); };
    });
  }

  }

  function tarjMapa(o){
    var x=o.x, F=x.ficha||{}, on=!!SEL[o.t+':'+x.id];
    var tp=TIPOL.filter(function(t){return t.codigo===x.tipo;})[0];
    return '<div class="it mp'+(on?' on':'')+'" data-t="'+o.t+'" data-i="'+x.id+'">'
      +'<span class="foto"'+(x.f?' style="background-image:url(&quot;'+esc(x.f)+'&quot;)"':'')+'>'
      + (F.maps_photo_attr?'<span class="cred">Foto: '+esc(F.maps_photo_attr)+'</span>':'')
      +'</span>'
      +'<span class="cu">'
      +'<span class="nm">'+esc(x.n)+'</span>'
      +'<span class="sub">'+[tp?tp.nombre:'', x.colonia].filter(Boolean).map(esc).join(' · ')
      + (F.google_rating?' · ★ '+F.google_rating+(F.google_reviews?' · '+F.google_reviews+' reseñas':''):'')+'</span>'
      + (F.descripcion_breve||F.descripcion?'<span class="de2">'+esc(F.descripcion_breve||F.descripcion)+'</span>':'')
      +'<span class="links">'
      + (F.maps_url?'<a href="'+esc(F.maps_url)+'" target="_blank" rel="noopener">Cómo llegar ↗</a>':'')
      + (F.instagram?'<a href="'+esc(F.instagram)+'" target="_blank" rel="noopener">Instagram ↗</a>':'')
      +'</span>'
      + (F.direccion?'<span class="dir">'+esc(F.direccion)+'</span>':'')
      +'<button class="bsel'+(on?' on':'')+'" data-sel="1">'+(on?'Quitar del mapa':'Poner en mi mapa')+'</button>'
      +'</span></div>';
  }

  function marca(t,i,tipos){
    var k=t+':'+i;
    if(SEL[k]) delete SEL[k]; else SEL[k]=true;
    guardaSel(t,i,!!SEL[k]); rejilla(tipos); panelSel(tipos);
  }

  function dato(t,i){ return (CAT[t]||[]).filter(function(x){return x.id===i;})[0]; }

  /* La ficha: la foto grande, lo que cuesta y lo que deja. El mismo botón que
     en la tarjeta, para que no haya que cerrar y buscarla otra vez. */
  function bloque(tit,txt){ return txt? '<div class="fb"><h5>'+esc(tit)+'</h5><p>'+esc(txt)+'</p></div>' : ''; }

  /* La ficha que ve el hotelero es la MISMA que ve el cliente: si va a
     vender la experiencia tiene que conocerla igual de bien. Lo unico que
     se añade arriba es el dinero, que el cliente no ve. */
  function ficha(t,i,tipos){
    var x=dato(t,i); if(!x) return;
    if(t==='mapa') return fichaMapa(x,t,i,tipos);
    var on=!!SEL[t+':'+i]; var F=x.ficha||{};
    var gal=[]; try{ gal=Array.isArray(F.galeria)?F.galeria:(F.galeria?JSON.parse(F.galeria):[]); }catch(_){ }
    $('modal').innerHTML='<div class="mc ancho">'
      + (x.f?'<img class="port" src="'+esc(x.f)+'" alt="'+esc(x.n)+'">':'<div class="imvacia">Sin foto todavía</div>')
      +'<div class="mb"><h4>'+esc(x.n)+'</h4>'
      +'<div class="mini">'+[x.d,F.salida,x.quien].filter(Boolean).map(esc).join(' · ')+'</div>'
      + (F.rating?'<div class="mini" style="margin-top:3px">★ '+F.rating+(F.reviews?' · '+F.reviews+' reseñas':'')+'</div>':'')

      + (x.pvp?'<div class="tabla3">'
          +'<div><span>Lo que paga el huésped</span><b>'+dinero(x.pvp)+'</b></div>'
          +'<div><span>A quien la vende</span><b>'+dinero(x.pvp*x.vend/100)+'</b><i>'+x.vend+'%</i></div>'
          +'<div><span>A tu casa</span><b>'+dinero(x.pvp*x.hot/100)+'</b><i>'+x.hot+'%</i></div>'
          +'</div><div class="mini" style="margin-top:6px">Son los porcentajes de su contrato, no un ejemplo.</div>':'')

      + ((F.resumen||F.descripcion)
          ? '<div class="fichasec"><div class="fst">De qué va</div>'
            + bloque('', F.resumen)
            + (F.descripcion && F.descripcion!==F.resumen ? bloque('', F.descripcion) : '')
            + '</div>' : '')
      + ((F.incluye||F.no_incluye||F.llevar)
          ? '<div class="fichasec"><div class="fst">La letra chica</div>'
            + bloque('Incluye', F.incluye)
            + bloque('No incluye', F.no_incluye)
            + bloque('Qué llevar', F.llevar)
            + '</div>' : '')

      + ((F.dias||F.hora||F.min||F.salida||F.termina||F.idiomas)
          ? '<div class="fichasec"><div class="fst">Cómo funciona</div><div class="pares">'
            + (F.dias?'<div><span>Días</span><b>'+esc(F.dias)+'</b></div>':'')
            + (F.hora?'<div><span>Sale a las</span><b>'+esc(F.hora)+'</b></div>':'')
            /* data-marca="fija": el punto de salida no se traduce nunca.
               Javi: «si algún tour inicia o termina en casa pepe, eso no lo
               cambies». Aquí lo lee el hotelero, pero esta misma ficha se
               reutiliza y el traductor no distingue pantallas. */
            + (F.salida?'<div><span>Sale de</span><b data-marca="fija">'+esc(F.salida)+'</b></div>':'')
            + (F.termina?'<div><span>Termina en</span><b data-marca="fija">'+esc(F.termina)+'</b></div>':'')
            + (F.idiomas?'<div><span>Idiomas</span><b>'+esc(F.idiomas)+'</b></div>':'')
            + (F.min?'<div><span>Mínimo</span><b>'+esc(F.min)+' personas</b></div>':'')
            + (F.pickup?'<div><span>Pasan por el hotel</span><b>Sí</b></div>':'')
            +'</div></div>' : '')

      + ((F.ods||F.impacto)
          ? '<div class="fichasec"><div class="fst">Qué deja donde pasa</div>'
            + bloque('ODS', F.ods) + bloque('Impacto', F.impacto) + '</div>' : '')

      + (gal.length? '<div class="gal">'+gal.slice(0,6).map(function(u){
            return '<img src="'+esc(typeof u==='string'?u:(u&&u.url)||'')+'" alt="">'; }).join('')+'</div>' : '')

      + (!x.pvp && t==='mapa' ? '<div class="mini" style="margin-top:10px">Esto no se vende: es un lugar que recomiendas en tu mapa.</div>':'')

      +'<div class="ft"><button class="btn ghost" id="mX">Cerrar</button>'
      +'<button class="btn" id="mSel">'+(on?'Quitar de mi casa':'Añadir a mi casa')+'</button></div>'
      +'</div></div>';
    var M=$('modal'); M.classList.add('on');
    $('mX').onclick=function(){M.classList.remove('on');};
    M.onclick=function(e){ if(e.target===M) M.classList.remove('on'); };
    $('mSel').onclick=function(){ marca(t,i,tipos); M.classList.remove('on'); };
  }

  /* La ficha del lugar: la misma que ve el huesped en el mapa. Un punto no se
     vende, pero se recomienda, y para recomendarlo hay que saber por que. */
  function fichaMapa(x,t,i,tipos){
    var F=x.ficha||{}, on=!!SEL[t+':'+i];
    var tp=TIPOL.filter(function(y){return y.codigo===F.tipologia_codigo;})[0];
    var datos=[['Horario',F.horario],['Precio',F.precio],['Teléfono',F.telefono],
               ['Michelin',F.michelin]].filter(function(d){return d[1];});
    $('modal').innerHTML='<div class="mc ancho">'
      + (x.f?'<img class="port" src="'+esc(x.f)+'" alt="'+esc(x.n)+'">':'<div class="imvacia">Sin foto</div>')
      + (F.maps_photo_attr?'<div class="credf">Foto: '+esc(F.maps_photo_attr)+'</div>':'')
      +'<div class="mb">'
      + (F.imperdible?'<div class="imperd">Imperdible</div>':'')
      +'<h4>'+esc(x.n)+'</h4>'
      +'<div class="mini">'+[tp?tp.nombre:'', F.barrio, F.ciudad].filter(Boolean).map(esc).join(' · ')
      + (F.google_rating?' · ★ '+F.google_rating+(F.google_reviews?' · '+F.google_reviews+' reseñas':''):'')+'</div>'
      + (F.descripcion_breve?'<p class="lead">'+esc(F.descripcion_breve)+'</p>':'')
      + (F.descripcion&&F.descripcion!==F.descripcion_breve?'<div class="fichasec"><div class="fst">De qué va</div><div class="fb"><p>'+esc(F.descripcion)+'</p></div></div>':'')
      + (datos.length?'<div class="fichasec"><div class="fst">Lo práctico</div><div class="pares">'
          + datos.map(function(d){return '<div><span>'+esc(d[0])+'</span><b>'+esc(d[1])+'</b></div>';}).join('')
          +'</div></div>':'')
      + (F.como_llegar?'<div class="fichasec"><div class="fst">Cómo llegar</div><div class="fb"><p>'+esc(F.como_llegar)+'</p></div></div>':'')
      + (F.reto?'<div class="fichasec"><div class="fst">El reto</div><div class="fb"><p>'+esc(F.reto)+'</p></div></div>':'')
      + (F.embajador?'<div class="fichasec"><div class="fst">Quién lo recomienda</div><div class="fb"><p>'+esc(F.embajador)+(F.embajador_arroba?' · '+esc(F.embajador_arroba):'')+'</p></div></div>':'')
      + (F.direccion?'<div class="mini" style="margin-top:12px">'+esc(F.direccion)+'</div>':'')
      +'<div class="links" style="margin-top:9px">'
      + (F.maps_url?'<a href="'+esc(F.maps_url)+'" target="_blank" rel="noopener">Abrir en Maps ↗</a>':'')
      + (F.instagram?'<a href="'+esc(F.instagram)+'" target="_blank" rel="noopener">Instagram ↗</a>':'')
      + (F.reserva_url?'<a href="'+esc(F.reserva_url)+'" target="_blank" rel="noopener">Reservar ↗</a>':'')
      +'</div>'
      +'<div class="ft"><button class="btn ghost" id="mX">Cerrar</button>'
      +'<button class="btn" id="mSel">'+(on?'Quitar de mi mapa':'Poner en mi mapa')+'</button></div>'
      +'</div></div>';
    var M=$('modal'); M.classList.add('on');
    $('mX').onclick=function(){M.classList.remove('on');};
    M.onclick=function(e){ if(e.target===M) M.classList.remove('on'); };
    $('mSel').onclick=function(){ marca(t,i,tipos); M.classList.remove('on'); };
  }

  /* Swipe: de uno en uno, fuera o dentro. Para ciento y pico de experiencias
     es mas rapido que leer una rejilla entera. */
  var SW=[],swi=0,swTipos=null,swGal=[],swg=0;
  function swipe(tipos){
    swTipos=tipos; SW=items(tipos); swi=0;
    if(!SW.length){ toast('No hay nada que revisar'); return; }
    $('modal').classList.add('on'); pintaSwipe();
  }
  function pintaSwipe(){
    var M=$('modal');
    if(swi>=SW.length){
      M.innerHTML='<div class="mc"><div class="mb" style="text-align:center;padding:34px 24px">'
        +'<h4>Listo</h4><div class="mini">Revisaste las '+SW.length+'. Tienes '+Object.keys(SEL).length+' puestas.</div>'
        +'<div class="ft" style="justify-content:center"><button class="btn" id="mX">Cerrar</button></div></div></div>';
      $('mX').onclick=function(){M.classList.remove('on');rejilla(swTipos);panelSel(swTipos);};
      return;
    }
    var o=SW[swi], on=!!SEL[o.t+':'+o.x.id], F=o.x.ficha||{};
    /* LA GALERIA DEL POPUP. Javi, 26-oct-2026: «poder mover las fotos en
       galería para darle más info al hotelero para escoger», manteniendo el
       popup chico. La portada va primero y detrás las del producto; si solo
       hay una, las flechas no se pintan -un carrusel de una foto es un
       boton que miente-. */
    swGal = [o.x.f].concat((F.galeria||[]).map(function(u){
      return typeof u==='string'?u:(u&&u.url)||''; })).filter(Boolean);
    swGal = swGal.filter(function(u,i){ return swGal.indexOf(u)===i; });
    if(swg>=swGal.length) swg=0;

    var resumen = (F.resumen||F.descripcion||'').trim();
    if(resumen.length>190) resumen = resumen.slice(0,188).replace(/\s+\S*$/,'')+'…';

    M.innerHTML='<div class="mc">'
      +'<div class="swn">'+(swi+1)+' de '+SW.length+'</div>'
      + (swGal.length
          ? '<div class="swgal">'
            +'<img src="'+esc(swGal[swg])+'" alt="'+esc(o.x.n)+'">'
            + (swGal.length>1
               ? '<button class="ga izq" id="gIzq" aria-label="Foto anterior">‹</button>'
                +'<button class="ga der" id="gDer" aria-label="Foto siguiente">›</button>'
                +'<span class="gn">'+(swg+1)+'/'+swGal.length+'</span>' : '')
            +'</div>'
          : '<div class="imvacia">Sin foto todavía</div>')
      +'<div class="mb"><h4>'+esc(o.x.n)+'</h4>'

      /* La linea de identidad: que tipo de cosa es, cuanto dura y donde pasa. */
      +'<div class="mini">'+([o.x.tipo||'sin tipo', o.x.d, o.x.ciudad].filter(Boolean).map(esc).join(' · ')
         + (o.x.sinCiudad?' · <b style="color:var(--warn)">sin ciudad</b>':''))+'</div>'

      + (resumen?'<div class="swres">'+esc(resumen)+'</div>':'')

      + ((F.dias||F.hora||F.salida)
         ? '<div class="swdat">'
           + (F.dias?'<div><i>Días</i><b>'+esc(F.dias)+'</b></div>':'')
           + (F.hora?'<div><i>Sale a las</i><b>'+esc(F.hora)+'</b></div>':'')
           /* No se traduce: si sale de Casa Pepe, sale de Casa Pepe. */
           + (F.salida?'<div class="ancho"><i>Sale de</i><b data-marca="fija">'+esc(F.salida)+'</b></div>':'')
           + (F.termina?'<div class="ancho"><i>Termina en</i><b data-marca="fija">'+esc(F.termina)+'</b></div>':'')
           +'</div>' : '')

      + (o.x.pvp?'<div class="tabla3">'
          +'<div><span>Lo que paga el huésped</span><b>'+dinero(o.x.pvp)+'</b></div>'
          +'<div><span>A quien la vende</span><b>'+dinero(o.x.pvp*o.x.vend/100)+'</b><i>'+o.x.vend+'%</i></div>'
          +'<div><span>A tu casa</span><b>'+dinero(o.x.pvp*o.x.hot/100)+'</b><i>'+o.x.hot+'%</i></div>'
          +'</div>'
          :'<div class="mini" style="margin-top:8px;color:var(--warn)">Sin precio todavía: no se puede vender.</div>')
      + (on?'<div class="yaesta">Ya la tienes puesta</div>':'')
      +'<div class="swb">'
      +'<button class="sx" id="swNo">✕ No va</button>'
      +'<button class="ss" id="swSi">✓ La quiero</button>'
      +'</div>'
      +'<div style="text-align:center;margin-top:9px">'
      +'<button class="btn ghost sm" id="swVer">Ver la ficha entera</button> '
      +'<button class="btn ghost sm" id="swFin">Dejarlo aquí</button></div>'
      +'</div></div>';
    if($('gIzq')) $('gIzq').onclick=function(e){ e.stopPropagation(); swg=(swg-1+swGal.length)%swGal.length; pintaSwipe(); };
    if($('gDer')) $('gDer').onclick=function(e){ e.stopPropagation(); swg=(swg+1)%swGal.length; pintaSwipe(); };
    $('swNo').onclick=function(){ swg=0; if(on) marcaSilencio(o,false); swi++; pintaSwipe(); };
    $('swSi').onclick=function(){ swg=0; if(!on) marcaSilencio(o,true); swi++; pintaSwipe(); };
    $('swVer').onclick=function(){ M.classList.remove('on'); ficha(o.t,o.x.id,swTipos); };
    $('swFin').onclick=function(){ M.classList.remove('on'); rejilla(swTipos); panelSel(swTipos); };
  }
  function marcaSilencio(o,on){
    var k=o.t+':'+o.x.id;
    if(on) SEL[k]=true; else delete SEL[k];
    guardaSel(o.t,o.x.id,on);
  }

  function panelSel(tipos){
    var p=$('ps'); if(!p) return;
    var L=[]; tipos.forEach(function(t){ (CAT[t]||[]).forEach(function(x){ if(SEL[t+':'+x.id]) L.push({t:t,x:x}); }); });
    var d=destino();
    p.innerHTML='<h4>Lo que tienes puesto</h4><div class="mini">'+L.length+' en '+esc(d?(d.nombre_comercial||''):'')+'</div>'
      + (L.length
          ? '<ul class="selist">'+L.map(function(o){return '<li><b>'+esc(o.x.n)+'</b><button data-t="'+o.t+'" data-i="'+o.x.id+'" title="Quitar">&times;</button></li>';}).join('')+'</ul>'
          : '<div class="vacio">Marca lo que quieras ofrecer y aparecerá aquí.</div>')
      + (nivel==='hotel' ? '<div class="mini" style="margin-top:11px;padding-top:11px;border-top:1px solid var(--rule)">Esta es la selección de <b>'+esc(d.nombre_comercial)+'</b>. Lo que quites aquí no toca a las demás casas.</div>' : '');
    p.querySelectorAll('button[data-i]').forEach(function(b){b.onclick=function(){
      var t=b.getAttribute('data-t'), i=b.getAttribute('data-i');
      delete SEL[t+':'+i]; guardaSel(t,i,false); rejilla(tipos); panelSel(tipos);
    };});
  }

  async function guardaSel(tipo,ref,on){
    var d=destino(); if(!d) return;
    if(on){
      var h=hdr(); h['Prefer']='resolution=merge-duplicates';
      await fetch(SB+'/rest/v1/hotel_intangibles',{method:'POST',headers:h,
        body:JSON.stringify([{hotel_id:d.id,tipo:tipo,ref_id:ref,activo:true}])});
    } else {
      await fetch(SB+'/rest/v1/hotel_intangibles?hotel_id=eq.'+d.id+'&tipo=eq.'+tipo+'&ref_id=eq.'+ref,
        {method:'PATCH',headers:hdr(),body:JSON.stringify({activo:false})});
    }
  }

  /* ---------- la casa por dentro ---------- */
  function vGeneral(){
    var d=destino();
    return '<div class="card"><h3>La casa</h3>'
      +'<div class="hint">Lo que el huésped necesita saber antes de llegar y lo que busca cuando ya está dentro.</div>'
      +'<div class="fgrid">'
      +f('Nombre','nombre_comercial',d)+f('Ciudad','ciudad',d)+f('Cuartos','cuartos',d,'number')
      +f('Dirección','direccion',d)+f('Check-in','checkin_hora',d,'time')+f('Check-out','checkout_hora',d,'time')
      +'</div></div>'
      +'<div class="card"><h3>Guardar maletas</h3>'
      +'<div class="hint">Antes del check-in y después del check-out. Es la primera pregunta que hace todo el mundo.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>¿Guardan maletas?</label><select data-c="storage_activo"><option value="false">No</option><option value="true">Sí</option></select></div>'
      +'<div class="fld" style="grid-column:2/-1"><label>Cómo funciona</label><input data-c="storage_texto" value="'+esc(d.storage_texto||'')+'" placeholder="Dónde, hasta qué hora, si cuesta"></div>'
      +'</div></div>'
      +'<div class="card"><h3>Cómo se llega</h3>'
      +'<div class="fgrid"><div class="fld" style="grid-column:1/-1"><label>Instrucciones de llegada</label><input data-c="llegada_texto" value="'+esc(d.llegada_texto||'')+'" placeholder="Del aeropuerto, del metro, dónde está la puerta"></div></div>'
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>';
  }
  function f(lab,c,d,tipo){
    var v=d[c]; if((c==='checkin_hora'||c==='checkout_hora')&&v) v=String(v).slice(0,5);
    return '<div class="fld"><label>'+lab+'</label><input data-c="'+c+'" type="'+(tipo||'text')+'" value="'+esc(v==null?'':v)+'"></div>';
  }

  /* ---------- restaurante y menú ----------
     Javi, bloque 4 del rediseño. Esta pestaña llevaba desde siempre en el menú
     de las dos vistas y caía en «Próximamente»: las columnas `rest_*` existen
     en `hoteles` y NADIE las escribía. Otra pieza que estaba y no se podía
     usar.
     El menú de verdad no se teclea aquí: vive en A&B, que es de donde sale el
     costeo y el recetario. Aquí se dice que hay restaurante, cómo se llama y a
     qué hora abre, que es lo que el huésped pregunta. Enlazar su carta es el
     paso siguiente y se dice en pantalla, no se finge. */
  function vRest(){
    var d=destino();
    var abierto = d.rest_activo===true;
    return '<div class="card"><h3>Restaurante</h3>'
      +'<div class="hint">Lo primero que pregunta quien llega con hambre a las once de la noche: si hay dónde comer y hasta qué hora.</div>'
      +'<div class="fgrid">'
      +'<div class="fld"><label>¿Esta casa tiene restaurante?</label>'
        +'<select data-c="rest_activo"><option value="false"'+(abierto?'':' selected')+'>No</option>'
        +'<option value="true"'+(abierto?' selected':'')+'>Sí</option></select></div>'
      +'<div class="fld"><label>Cómo se llama</label>'
        +'<input data-c="rest_nombre" value="'+esc(d.rest_nombre||'')+'" placeholder="La Cósmica"></div>'
      +'<div class="fld"><label>Abre</label><input data-c="rest_abre" type="time" value="'+esc(String(d.rest_abre||'').slice(0,5))+'"></div>'
      +'<div class="fld"><label>Cierra</label><input data-c="rest_cierra" type="time" value="'+esc(String(d.rest_cierra||'').slice(0,5))+'"></div>'
      +'</div>'
      +(abierto && !(d.rest_abre&&d.rest_cierra)
        ? '<div class="hint" style="margin-top:10px;color:var(--warn,#8C6212)">Dices que hay restaurante y no has puesto el horario. Para el huésped es casi lo mismo que no tenerlo.</div>'
        : '')
      +'<div class="ft"><button class="btn" id="gGen">Guardar</button></div></div>'

      +'<div class="card"><h3>La carta</h3>'
      +'<div class="pronto">La carta no se teclea aquí: vive en A&amp;B, que es de donde salen el recetario y el costeo. '
        +'Enlazar la de esta casa para que el huésped la vea desde su app es el paso siguiente, y todavía no está hecho. '
        +'Mientras tanto, lo de arriba ya le dice si hay dónde comer y a qué hora.</div></div>';
  }

  /* ---------- mis ventas ----------
     Bloque 4. Esta pestaña estaba en el menú de las dos vistas y caía en
     «Próximamente».

     Antes de escribirla hubo que poner el cable: la única política de lectura
     de `sinc_reservas` dejaba pasar al equipo de casa y al operador dueño de
     la experiencia. Un hotel no es ninguno de los dos, así que la consulta le
     devolvía CERO FILAS — y cero filas se ve exactamente igual que «todavía no
     has vendido nada». Montar la pantalla encima habría sido construir un cero
     que miente. */
  var VTAS=null, VTAS_ERR=false;

  async function vVentas(w){
    var d=destino();
    w.innerHTML='<div class="card"><h3>'+(nivel==='grupo'?'Mis ventas':'Sus ventas')+'</h3>'
      +'<div class="mini">Trayendo lo vendido…</div></div>';

    /* En el nivel de grupo se piden las de todas sus casas; en el de casa,
       solo las de esa. La base vuelve a filtrar por su cuenta: esto es para
       no traer de más, no para decidir quién ve qué. */
    var ids=[d.id];
    if(nivel==='grupo') ids=ids.concat(HOT.map(function(x){return x.id;}));
    var q='sinc_reservas?select=id,folio,created_at,estado,pax,total,al_hotel,bono_concierge,'
      +'vendedor_nombre,canal,hotel_id,op_experiencia_id,pago_estado'
      +'&hotel_id=in.('+ids.join(',')+')&order=created_at.desc&limit=500';
    var r=await get(q);
    VTAS_ERR = (r===null);
    VTAS = r||[];
    pintaVentas(w);
  }

  function pintaVentas(w){
    /* UN CERO Y UN ERROR NO SE DICEN IGUAL. */
    if(VTAS_ERR){
      w.innerHTML='<div class="card"><h3>No pudimos traer tus ventas</h3>'
        +'<div class="pronto">No es que no haya ninguna: es que la consulta no llegó. '
        +'Vuelve a entrar y si sigue igual, avísanos — no es lo mismo que no haber vendido.</div>'
        +'<div class="ft"><button class="btn" id="vtOtra">Reintentar</button></div></div>';
      var b=$('vtOtra'); if(b) b.onclick=function(){ vVentas(w); };
      return;
    }
    var vivas=VTAS.filter(function(x){ return x.estado!=='anulada' && x.estado!=='cancelada'; });
    if(!vivas.length){
      w.innerHTML='<div class="card"><h3>'+(nivel==='grupo'?'Mis ventas':'Sus ventas')+'</h3>'
        +'<div class="pronto">Todavía no te ha comprado nadie. En cuanto alguien de recepción venda una '
        +'experiencia, aquí aparece qué vendió, cuánto le toca a la casa y cuánto a quien la vendió.</div></div>';
      return;
    }

    var tot=0, aCasa=0, aConc=0, pax=0, porConc={};
    vivas.forEach(function(x){
      tot  += Number(x.total||0);
      aCasa+= Number(x.al_hotel||0);
      aConc+= Number(x.bono_concierge||0);
      pax  += Number(x.pax||0);
      var k=(x.vendedor_nombre||'Sin nombre').trim();
      if(!porConc[k]) porConc[k]={n:0,v:0,b:0};
      porConc[k].n++; porConc[k].v+=Number(x.total||0); porConc[k].b+=Number(x.bono_concierge||0);
    });

    var h='<div class="card"><h3>'+(nivel==='grupo'?'Mis ventas':'Sus ventas')+'</h3>'
      +'<div class="hint">'+vivas.length+' venta'+(vivas.length===1?'':'s')+' · '+pax+' persona'+(pax===1?'':'s')+'.</div>'
      +'<div class="hgrid">'
      +cajaNum('Vendido', tot)
      +cajaNum('Para la casa', aCasa)
      +cajaNum('Para quien vendió', aConc)
      +'</div></div>';

    /* QUIEN VENDIO Y CUANTO SE LE DEBE. Es la pregunta que hace el hotelero el
       dia de pagar, y la que hoy se sacaba a mano. */
    var nombres=Object.keys(porConc).sort(function(a,b){return porConc[b].v-porConc[a].v;});
    h+='<div class="card"><h3>Quién vendió</h3>'
      +'<div class="hint">Lo que le toca a cada quien de lo vendido. Se liquida en el corte.</div>';
    h+=nombres.map(function(k){
      var c=porConc[k];
      return '<div class="fld" style="display:flex;gap:12px;align-items:baseline;justify-content:space-between;'
        +'padding:8px 0;border-bottom:1px solid var(--rule)">'
        +'<div><b>'+esc(k)+'</b><div class="mini">'+c.n+' venta'+(c.n===1?'':'s')+' · '+pesos(c.v)+'</div></div>'
        +'<b>'+pesos(c.b)+'</b></div>';
    }).join('');
    h+='</div>';

    h+='<div class="card"><h3>Una por una</h3>';
    h+=vivas.slice(0,80).map(function(x){
      var pagada = x.pago_estado==='pagado';
      return '<div class="fld" style="display:flex;gap:12px;align-items:baseline;justify-content:space-between;'
        +'padding:8px 0;border-bottom:1px solid var(--rule)">'
        +'<div><b>'+esc(x.folio||x.id.slice(0,8))+'</b>'
          +'<div class="mini">'+String(x.created_at||'').slice(0,10)
          +' · '+esc(x.vendedor_nombre||'sin vendedor')
          +' · '+(x.pax||0)+' pax'
          +(x.canal?' · '+esc(x.canal):'')
          +(pagada?'':' · <b>sin pagar</b>')+'</div></div>'
        +'<div style="text-align:right"><b>'+pesos(x.total)+'</b>'
          +'<div class="mini">a la casa '+pesos(x.al_hotel)+'</div></div></div>';
    }).join('');
    if(vivas.length>80) h+='<div class="mini" style="margin-top:10px">Se enseñan las 80 más recientes de '+vivas.length+'.</div>';
    h+='</div>';

    w.innerHTML=h;
  }

  function cajaNum(t,v){
    return '<div class="card" style="margin:0"><div class="mini">'+esc(t)+'</div>'
      +'<div style="font:700 22px Oswald,system-ui;letter-spacing:.02em;margin-top:2px">'+pesos(v)+'</div></div>';
  }
  function pesos(n){ return '$'+Math.round(Number(n||0)).toLocaleString('es-MX'); }


  /* ---------- mis espacios ---------- */
  var ESP=[];
  async function vEspacios(w){

      if(!r.ok){toast('No se pudo crear: '+(await r.text()).slice(0,110),true);return;}
      var j=await r.json(); toast('Espacio creado'); await vEspacios(w); fichaEspacio(j[0].id);

  /* La ficha del espacio es la del Ateneo entera — mismos campos, misma tabla.
     Lo único propio del hotel es de quién es y si lo abre a terceros. */

      + f('Horario de servicio','horario_servicio',null,null,'L–D 9:00 a 23:00')

      +'<div class="fld"><label>Tipo de fianza</label><select data-e="fianza_tipo"><option value="">— sin fianza —</option><option value="monto">Monto fijo</option><option value="tarjeta">Retención en tarjeta</option><option value="pagare">Pagaré</option></select></div>'
      + f('Monto de la fianza','fianza_monto','number','Se devuelve si todo queda bien')

      +'<div class="fld"><label>¿Necesita protección civil?</label><select data-e="requiere_proteccion_civil"><option value="false">No</option><option value="true">Sí</option></select><div class="ay">Aforo grande o público de pie suele pedirlo</div></div>'
      +'</div>'

    $('gEsp').onclick=async function(){

        else b[c]= v===''?null:v;
      });

      var j=await r.json();
      if(!j||!j.length){toast('No se guardó: tu usuario no puede editar este espacio.',true);return;}
