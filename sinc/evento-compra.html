<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · boletos</title>
<meta name="description" content="Compra tus boletos para eventos en el Ateneo de Virreyes.">
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:620px;margin:0 auto;padding:16px 20px 70px}
.volver{display:inline-block;font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);text-decoration:none;margin-bottom:10px}
.cab{display:flex;gap:14px;align-items:flex-start}
.cab .pic{width:86px;height:86px;border-radius:12px;background:var(--hueso) center/cover no-repeat;flex:none;border:1px solid var(--linea)}
h1{font:700 25px/1.1 Oswald,sans-serif;text-transform:uppercase;margin:0 0 6px;color:var(--tinta)}
.datos{display:grid;gap:4px}
.datos div{display:flex;gap:9px;font-size:13.5px;color:var(--tinta-2);line-height:1.35}
.datos b{font:600 10px/1.45 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);min-width:58px;flex:none}
.fija{font-size:11px;color:var(--tenue);font-style:italic}
.caja{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px;margin-top:18px}
.caja h2{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase;margin:0 0 12px;letter-spacing:.02em}
.pregunta{font:600 13px/1.3 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta);margin:0 0 8px}
.cant{display:flex;align-items:center;gap:14px}
.cant button{width:42px;height:42px;border:1.5px solid var(--linea);background:#fff;border-radius:10px;font-size:22px;line-height:1;cursor:pointer;color:var(--tinta)}
.cant button:hover:not(:disabled){border-color:var(--naranja);color:var(--naranja-oscuro)}
.cant button:disabled{opacity:.35;cursor:default}
.cant .n{font:700 26px/1 Oswald;min-width:40px;text-align:center;color:var(--tinta)}
.cant .q{font-size:13px;color:var(--gris)}
.tier{display:flex;gap:11px;align-items:flex-start;border:1.5px solid var(--linea);border-radius:11px;padding:12px 13px;cursor:pointer;margin-bottom:9px;transition:border-color .12s}
.tier:hover{border-color:var(--naranja)}
.tier.on{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.tier.ago{opacity:.45;cursor:default}
.tier input{margin-top:3px;flex:none;width:auto}
.tier .nm{font:600 14.5px/1.2 Oswald,sans-serif;text-transform:uppercase}
.tier .inc{font-size:12.5px;color:var(--gris);margin-top:3px;line-height:1.4}
.tier .pr{margin-left:auto;font:700 18px/1 Oswald,sans-serif;color:var(--naranja-oscuro);white-space:nowrap}
.tier .cupo{font-size:11px;color:var(--gris);margin-top:4px}
.unico{display:flex;align-items:baseline;gap:10px;border:1.5px solid var(--linea);border-radius:11px;padding:12px 13px;background:var(--hueso)}
.unico .nm{font:600 14.5px/1.2 Oswald,sans-serif;text-transform:uppercase}
.unico .inc{font-size:12.5px;color:var(--gris)}
.unico .pr{margin-left:auto;font:700 18px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
.sep{border:0;border-top:1px solid var(--linea);margin:16px 0}
label{display:block;font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);margin:0 0 5px}
input[type=text]{width:100%;font:400 15px/1.4 Inter;color:var(--tinta);border:1.5px solid var(--linea);border-radius:9px;padding:10px 11px;background:#fff;box-sizing:border-box}
input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.btcod{flex:none;width:auto;font:600 12px/1 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:0 16px;border-radius:9px;border:1.5px solid var(--naranja);background:#fff;color:var(--naranja-oscuro);cursor:pointer}
.codmsg{font-size:13px;margin-top:7px;line-height:1.4}
.codmsg.ok{color:var(--ok)} .codmsg.mal{color:var(--error)}
#cod{text-transform:uppercase}
.desglose{margin-top:4px}
.desglose .l{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--tinta-2);padding:5px 0;line-height:1.4}
.desglose .l.imp{color:var(--gris);font-size:12.5px}
.desglose .l.desc{color:var(--ok)}
.desglose .l.tot{border-top:1.5px solid var(--linea);margin-top:8px;padding-top:11px;align-items:baseline}
.desglose .l.tot span:first-child{font:700 15px/1 Oswald;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta)}
.desglose .l.tot b{font:700 28px/1 Oswald;color:var(--tinta)}
.bt{display:block;width:100%;font:600 14px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:15px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer;margin-top:16px}
.bt:disabled{opacity:.5;cursor:default}
.pie{font-size:12px;color:var(--gris);text-align:center;margin-top:10px;line-height:1.5}
.msg{margin-top:12px;font-size:14px;border-radius:9px;padding:11px 13px;display:none;line-height:1.5}
.msg.mal{display:block;background:var(--error-bg);color:var(--error)}
.msg.bien{display:block;background:var(--ok-bg);color:var(--ok)}
.cargando{color:var(--gris);padding:40px 0;text-align:center}
@media(max-width:380px){.cab .pic{width:64px;height:64px}h1{font-size:21px}}
</style>
</head>
<body>
<div class="env" id="env"><div class="cargando">Cargando…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sinc-cuenta.js"></script>
<script>
/* PANTALLA 1 DE LA COMPRA. Javi, 10-oct-2026, dictado:
 *   «No "dejas tus datos y el Ateneo te confirma". Es: ¿cuántas personas
 *    vienen? Fecha: fija. Precio (se modifica en base a personas). Desglose de
 *    impuestos y total. Código de pago. Pagar.»
 * Y lo que sigue:
 *   «Si está dado de alta pasa directo a la última pantalla de checkout, ya
 *    precarga los datos. Si no, abre un pop-up y pide darse de alta por Google
 *    o con correo, nombre y celular. Y al ponerlo pasa a la pantalla de
 *    checkout con sus datos para pagar.»
 * Ese pop-up ya existía entero en sinc-cuenta.js (Google o correo con sus seis
 * cifras, y luego nombre y WhatsApp); esta pantalla ya no pide esos datos a
 * mano: los toma de la cuenta. Un correo tecleado mal dejaba a alguien en la
 * puerta sin su QR.
 *
 * La vuelta de Google recarga la página entera, así que la elección (boleto,
 * cuántos, código) se guarda antes de salir y se recupera al volver: si no, el
 * huésped vuelve y se encuentra el formulario en blanco.
 */
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
/* El IVA ya va dentro del precio al público: aquí sólo se desglosa para que se
   vea, nunca se suma encima. Si algún día un productor no factura con IVA,
   esto es lo único que hay que tocar. */
var IVA=0.16;
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mx(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function mx2(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fFecha(s){ if(!s) return ''; try{ var d=new Date(s);
  var f=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  return f.charAt(0).toUpperCase()+f.slice(1)+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}catch(_){ return String(s).slice(0,16).replace('T',' '); } }

var _Q=new URLSearchParams(location.search);
var ID=_Q.get('id')||'';
var COD=(_Q.get('codigo')||'').trim().toUpperCase();
var CODEINFO=null;
var EV=null, SEL=null, CANT=1;
var LLAVE='sinc-compra-'+ID;

async function rpc(fn,body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  var j=null; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok,status:r.status,data:j};
}
function guardaEleccion(){
  try{ sessionStorage.setItem(LLAVE, JSON.stringify({sel:SEL,cant:CANT,cod:(($('cod')&&$('cod').value)||'')})); }catch(_){}
}
function leeEleccion(){
  try{ return JSON.parse(sessionStorage.getItem(LLAVE)||'null'); }catch(_){ return null; }
}
function portada(){
  var f=(EV&&EV.fotos)||[]; if(!f.length) return '';
  var u=typeof f[0]==='string'?f[0]:(f[0]&&(f[0].url||f[0].src));
  return u||'';
}
function disponibles(t){ return (t.cupo==null)?Infinity:Math.max(0,(t.cupo||0)-(t.vendidos||0)); }

async function cargar(){
  if(!ID){ $('env').innerHTML='<div class="cargando">Falta el evento.</div>'; return; }
  var r=await rpc('evento_publico',{p_id:ID});
  EV=r.data;
  if(!EV){ $('env').innerHTML='<div class="cargando">Este evento no está disponible.</div>'; return; }
  pinta();
}

function pinta(){
  var tiers=(EV.tiers||[]);
  var pic=portada();
  var cab='<a class="volver" href="evento.html?id='+esc(EV.id)+'">← Volver al evento</a>'
    +'<div class="cab">'
    +(pic?'<div class="pic" style="background-image:url(\''+esc(pic)+'\')"></div>':'')
    +'<div><h1>'+esc(EV.nombre||'Evento')+'</h1><div class="datos">'
      +(EV.fecha_inicio?'<div><b>Cuándo</b><span>'+esc(fFecha(EV.fecha_inicio))+' <span class="fija">(fecha fija)</span></span></div>':'')
      +(EV.espacio?'<div><b>Dónde</b><span>'+esc(EV.espacio)+'</span></div>':'')
    +'</div></div></div>';

  if(!tiers.length){
    $('env').innerHTML=cab+'<div class="caja"><p style="font-size:15px;color:var(--tinta-2);margin:0">Este evento todavía no tiene boletos a la venta en línea.</p></div>';
    return;
  }

  var unico = tiers.length===1;
  var elegir = unico
    ? '<div class="unico"><div><div class="nm">'+esc(tiers[0].nombre||'Boleto')+'</div>'
        +(tiers[0].incluye?'<div class="inc">'+esc(tiers[0].incluye)+'</div>':'')
      +'</div><div class="pr">'+mx(tiers[0].precio)+'</div></div>'
    : tiers.map(function(t,i){
        var disp=disponibles(t), ago=disp<=0;
        return '<label class="tier'+(ago?' ago':'')+'" data-i="'+i+'">'
          +'<input type="radio" name="tier"'+(ago?' disabled':'')+' value="'+i+'">'
          +'<div><div class="nm">'+esc(t.nombre||'Boleto')+'</div>'
            +(t.incluye?'<div class="inc">'+esc(t.incluye)+'</div>':'')
            +(t.cupo!=null?'<div class="cupo">'+(ago?'Agotado':(disp+' disponibles'))+'</div>':'')
          +'</div><div class="pr">'+mx(t.precio)+'</div></label>';
      }).join('');

  $('env').innerHTML = cab
    +'<div class="caja">'
      +'<h2>Tu compra</h2>'
      +'<p class="pregunta">¿Cuántas personas vienen?</p>'
      +'<div class="cant"><button type="button" id="menos">−</button>'
        +'<span class="n" id="cant">1</span>'
        +'<button type="button" id="mas">+</button>'
        +'<span class="q" id="quedan"></span></div>'
      +'<hr class="sep">'
      +'<p class="pregunta">'+(unico?'Tu boleto':'¿Qué boleto?')+'</p>'
      + elegir
      +'<hr class="sep">'
      +'<label for="cod">¿Tienes un código de pago?</label>'
      +'<div style="display:flex;gap:8px"><input type="text" id="cod" placeholder="Ej. ATENEO2X1" autocomplete="off">'
      +'<button type="button" class="btcod" id="aplicar">Aplicar</button></div>'
      +'<div class="codmsg" id="codMsg"></div>'
      +'<hr class="sep">'
      +'<div class="desglose" id="desglose"></div>'
      +'<button class="bt" id="pagar">Pagar</button>'
      +'<div class="msg" id="msg"></div>'
      +'<div class="pie">Pago seguro con Stripe. El cobro cae en la cuenta del productor.<br>Precios al público, IVA incluido.</div>'
    +'</div>';

  if(unico) SEL=0;
  else Array.prototype.forEach.call(document.querySelectorAll('.tier input'),function(r){
    r.onchange=function(){ SEL=+r.value;
      Array.prototype.forEach.call(document.querySelectorAll('.tier'),function(e){e.classList.toggle('on',+e.getAttribute('data-i')===SEL);});
      if(CANT>disponibles(EV.tiers[SEL])) CANT=Math.max(1,disponibles(EV.tiers[SEL]));
      pintaCant(); recalcula(); };
  });
  $('menos').onclick=function(){ if(CANT>1){CANT--;pintaCant();recalcula();} };
  $('mas').onclick=function(){ var max=SEL==null?20:disponibles(EV.tiers[SEL]); if(CANT<max){CANT++;pintaCant();recalcula();} };
  $('aplicar').onclick=recalcula;
  $('cod').onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); recalcula(); } };
  $('pagar').onclick=aPagar;

  /* Lo que había elegido antes de salir a Google. */
  var prev=leeEleccion();
  if(prev){
    if(!unico && prev.sel!=null && EV.tiers[prev.sel]){
      SEL=prev.sel;
      var rb=document.querySelector('.tier input[value="'+SEL+'"]');
      if(rb){ rb.checked=true; rb.parentNode.classList.add('on'); }
    }
    if(prev.cant>0) CANT=prev.cant;
    if(prev.cod) $('cod').value=prev.cod;
  }
  if(COD && !$('cod').value) $('cod').value=COD;
  pintaCant(); recalcula();
}

function pintaCant(){
  $('cant').textContent=CANT;
  var max=SEL==null?Infinity:disponibles(EV.tiers[SEL]);
  $('menos').disabled=(CANT<=1);
  $('mas').disabled=(CANT>=max);
  $('quedan').textContent=(max!==Infinity&&max<10)?('quedan '+max):'';
}

/* El desglose. Nada se inventa aquí: el descuento lo dice la base y el total
   que se cobra lo vuelve a calcular ella al crear la reserva. */
async function recalcula(){
  var d=$('desglose'), cm=$('codMsg');
  if(SEL==null){ d.innerHTML='<div class="l"><span>Elige un boleto para ver el total</span></div>'; $('pagar').disabled=true; return; }
  var t=EV.tiers[SEL];
  var sub=(t.precio||0)*CANT;
  var total=sub, etiqueta=null;
  CODEINFO=null;
  var codTxt=(($('cod')&&$('cod').value)||'').trim().toUpperCase();
  if(codTxt){
    var r=await rpc('evento_codigo_ver',{p_codigo:codTxt,p_precio_id:t.id,p_pax:CANT});
    var info=r.data;
    if(info && info.valido){
      CODEINFO={codigo:codTxt,total:Number(info.total)};
      sub=Number(info.subtotal); total=Number(info.total);
      etiqueta=info.etiqueta||'Código aplicado';
      cm.textContent=etiqueta; cm.className='codmsg ok';
    }else{
      cm.textContent=(info&&info.mensaje)||'Ese código no aplica.'; cm.className='codmsg mal';
      d.innerHTML='<div class="l"><span>'+esc(t.nombre||'Boleto')+' × '+CANT+'</span><span>'+mx(sub)+'</span></div>';
      $('pagar').disabled=true; $('pagar').textContent='Pagar';
      return;
    }
  }else{ cm.textContent=''; cm.className='codmsg'; }

  var desc = sub-total;
  var iva  = total - (total/(1+IVA));
  d.innerHTML=
     '<div class="l"><span>'+esc(t.nombre||'Boleto')+' × '+CANT+'</span><span>'+mx2(sub)+'</span></div>'
    +(desc>0?'<div class="l desc"><span>Descuento '+esc(etiqueta||'')+'</span><span>−'+mx2(desc)+'</span></div>':'')
    +'<div class="l imp"><span>IVA '+Math.round(IVA*100)+'% incluido</span><span>'+mx2(iva)+'</span></div>'
    +'<div class="l tot"><span>Total a pagar</span><b>'+mx(total)+'</b></div>';
  $('pagar').disabled=false;
  $('pagar').textContent='Pagar '+mx(total);
  guardaEleccion();
}

function msg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg '+cls; }

/* PANTALLA 2: la cuenta. Si ya está dentro no se le pregunta nada y se va
   derecho a pagar con sus datos; si no, el pop-up de alta y de ahí al pago. */
async function aPagar(){
  if(SEL==null) return;
  var t=EV.tiers[SEL];
  var b=$('pagar'), txt=b.textContent;
  guardaEleccion();
  b.disabled=true; b.textContent='Un momento…';

  var yo=null;
  try{
    yo=await sincCuenta.exige({
      titulo:'Entra para pagar',
      dice:'Tu boleto lleva un QR y te llega por correo: por eso necesitamos saber que el correo es tuyo de verdad. Es una vez y ya.',
      volverA:location.href
    });
  }catch(x){ console.error('cuenta',x); }
  if(!yo){ b.disabled=false; b.textContent=txt; return; }

  msg('Apartando tu lugar…','bien');
  var r=await rpc('evento_reserva_crear',{
    p_evento_id:EV.id, p_precio_id:t.id, p_pax:CANT,
    p_nombre:(yo.nombre||'').trim(), p_email:(yo.email||'').trim(),
    p_telefono:(yo.telefono||'').trim(),
    p_codigo:(CODEINFO&&CODEINFO.codigo)||''
  });
  if(!r.ok||!r.data||r.data.error){
    msg((r.data&&r.data.error)||'No se pudo apartar tu lugar. Intenta de nuevo.','mal');
    b.disabled=false; b.textContent=txt; return;
  }
  try{ sessionStorage.removeItem(LLAVE); }catch(_){}
  /* El lugar queda apartado 1 hora. El cobro cae en el Stripe del productor
     con la comisión del Ateneo, y la confirmación de verdad la da el webhook,
     no el ?pago de la URL. */
  location.href='evento-pago.html?res='+encodeURIComponent(r.data.folio);
}
cargar();
</script>
</body>
</html>
