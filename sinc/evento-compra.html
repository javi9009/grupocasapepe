<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · boletos</title>
<meta name="description" content="Compra tus boletos para eventos en el Ateneo de Virreyes.">
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:640px;margin:0 auto;padding:18px 20px 70px}
h1{font:700 28px/1.12 Oswald,sans-serif;text-transform:uppercase;margin:12px 0 4px;color:var(--tinta)}
.datos{display:grid;gap:6px;margin:8px 0 0}
.datos div{display:flex;gap:10px;font-size:14px;color:var(--tinta-2)}
.datos b{font:600 10.5px/1.5 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);min-width:72px;flex:none}
.desc{font-size:15px;line-height:1.6;color:var(--tinta-2);margin:12px 0 0}
.caja{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:16px 18px;margin-top:20px}
.caja h2{font:700 16px/1.2 Oswald,sans-serif;text-transform:uppercase;margin:0 0 10px}
.tier{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--linea);border-radius:12px;padding:13px 14px;cursor:pointer;margin-bottom:10px;transition:border-color .12s}
.tier:hover{border-color:var(--naranja)}
.tier.on{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.tier.ago{opacity:.5;cursor:default}
.tier input{margin-top:3px;flex:none;width:auto}
.tier .nm{font:600 15px/1.2 Oswald,sans-serif;text-transform:uppercase}
.tier .inc{font-size:13px;color:var(--gris);margin-top:3px;line-height:1.4}
.tier .pr{margin-left:auto;font:700 19px/1 Oswald,sans-serif;color:var(--naranja-oscuro);white-space:nowrap}
.tier .cupo{font-size:11px;color:var(--gris);margin-top:4px}
.cant{display:flex;align-items:center;gap:10px;margin:8px 0 0}
.cant button{width:34px;height:34px;border:1.5px solid var(--linea);background:#fff;border-radius:8px;font-size:18px;cursor:pointer;color:var(--tinta)}
.cant span{font:700 18px/1 Oswald;min-width:28px;text-align:center}
label{display:block;font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);margin:12px 0 5px}
input[type=text],input[type=email],input[type=tel]{width:100%;font:400 15px/1.4 Inter;color:var(--tinta);border:1.5px solid var(--linea);border-radius:9px;padding:10px 11px;background:#fff;box-sizing:border-box}
input:focus{outline:none;border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 0;font:600 14px Oswald;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.total b{font:700 26px/1 Oswald;color:var(--tinta)}
.bt{display:block;width:100%;font:600 14px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:14px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer;margin-top:16px}
.bt:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:14px;border-radius:9px;padding:11px 13px;display:none;line-height:1.5}
.msg.mal{display:block;background:var(--error-bg);color:var(--error)}
.msg.bien{display:block;background:var(--ok-bg);color:var(--ok)}
.cargando{color:var(--gris);padding:40px 0;text-align:center}
.btcod{flex:none;width:auto;font:600 12px/1 Oswald,sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:0 15px;border-radius:9px;border:1.5px solid var(--naranja);background:#fff;color:var(--naranja-oscuro);cursor:pointer}
.codmsg{font-size:13px;margin-top:7px;line-height:1.4}
.codmsg.ok{color:var(--ok)} .codmsg.mal{color:var(--error)}
.total .sub{font:600 14px/1 Oswald,sans-serif;color:var(--gris);text-decoration:line-through;margin-right:9px}
#cod{text-transform:uppercase}
</style>
</head>
<body>
<div class="env" id="env"><div class="cargando">Cargando…</div></div>

<script src="tel-pais.js"></script>
<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mx(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function fFecha(s){ if(!s) return ''; try{ var d=new Date(s); return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(_){ return String(s).slice(0,16).replace('T',' '); } }
var _Q=new URLSearchParams(location.search);
var ID=_Q.get('id')||'';
var COD=(_Q.get('codigo')||'').trim().toUpperCase();
var CODEINFO=null;
async function rpc(fn,body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  var j=null; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok,status:r.status,data:j};
}

var TEL=null;
var EV=null, SEL=null, CANT=1;
async function cargar(){
  if(!ID){ $('env').innerHTML='<div class="cargando">Falta el evento.</div>'; return; }
  var r=await rpc('evento_publico',{p_id:ID});
  EV=r.data;
  if(!EV){ $('env').innerHTML='<div class="cargando">Este evento no está disponible.</div>'; return; }
  pinta();
}
function disponibles(t){ return (t.cupo==null)?Infinity:Math.max(0,(t.cupo||0)-(t.vendidos||0)); }

function pinta(){
  var tiers=(EV.tiers||[]);
  var th=tiers.length ? tiers.map(function(t,i){
    var disp=disponibles(t), ago=disp<=0;
    return '<label class="tier'+(ago?' ago':'')+'" data-i="'+i+'">'
      +'<input type="radio" name="tier"'+(ago?' disabled':'')+' value="'+i+'">'
      +'<div><div class="nm">'+esc(t.nombre||'Boleto')+'</div>'
        +(t.incluye?'<div class="inc">'+esc(t.incluye)+'</div>':'')
        +(t.cupo!=null?'<div class="cupo">'+(ago?'Agotado':(disp+' disponibles'))+'</div>':'')
      +'</div><div class="pr">'+mx(t.precio)+'</div></label>';
  }).join('') : '<p class="desc">Este evento todavía no tiene boletos a la venta en línea.</p>';

  $('env').innerHTML=
    '<h1>'+esc(EV.nombre||'Evento')+'</h1>'
    +'<div class="datos">'
      +(EV.fecha_inicio?'<div><b>Cuándo</b><span>'+esc(fFecha(EV.fecha_inicio))+'</span></div>':'')
      +(EV.espacio?'<div><b>Dónde</b><span>'+esc(EV.espacio)+'</span></div>':'')
    +'</div>'
    +(EV.descripcion?'<div class="desc">'+esc(EV.descripcion)+'</div>':'')
    +(tiers.length?('<div class="caja"><h2>Elige tu boleto</h2>'+th
      +'<div id="cantWrap" style="display:none"><label>Cuántos</label>'
        +'<div class="cant"><button type="button" id="menos">−</button><span id="cant">1</span><button type="button" id="mas">+</button></div></div>'
      +'<div id="codWrap" style="display:none"><label>¿Tienes un código?</label>'
        +'<div style="display:flex;gap:8px"><input type="text" id="cod" placeholder="Ej. ATENEO2X1">'
        +'<button type="button" class="btcod" id="aplicar">Aplicar</button></div>'
        +'<div class="codmsg" id="codMsg"></div></div>'
      +'<label>Tu nombre</label><input type="text" id="nom" placeholder="Nombre y apellido">'
      +'<label>Tu correo</label><input type="email" id="mail" placeholder="para mandarte el boleto con su QR">'
      +'<label>WhatsApp</label><div id="telCaja"></div>'
      +'<div class="total"><span>Total</span><b id="total">—</b></div>'
      +'<button class="bt" id="pagar" disabled>Reservar y pagar</button>'
      +'<div class="msg" id="msg"></div></div>'):('<div class="caja">'+th+'</div>'));

  if(!tiers.length) return;
  Array.prototype.forEach.call(document.querySelectorAll('.tier input'),function(r){
    r.onchange=function(){ SEL=+r.value; CANT=1;
      Array.prototype.forEach.call(document.querySelectorAll('.tier'),function(e){e.classList.toggle('on',+e.getAttribute('data-i')===SEL);});
      $('cantWrap').style.display=''; $('codWrap').style.display=''; $('cant').textContent='1';
      if(COD && $('cod') && !$('cod').value) $('cod').value=COD;
      updateTotal(); };
  });
  $('menos').onclick=function(){ if(CANT>1){CANT--;$('cant').textContent=CANT;updateTotal();} };
  $('mas').onclick=function(){ var t=EV.tiers[SEL]; var max=disponibles(t); if(CANT<max){CANT++;$('cant').textContent=CANT;updateTotal();} };
  $('aplicar').onclick=updateTotal;
  $('pagar').onclick=reservar;
  TEL = telPais.monta('telCaja');
}
async function updateTotal(){
  var t=EV.tiers[SEL]; if(!t){return;}
  var sub=(t.precio||0)*CANT;
  var cm=$('codMsg'); CODEINFO=null;
  var codTxt=(($('cod')&&$('cod').value)||'').trim().toUpperCase();
  if(codTxt){
    var r=await rpc('evento_codigo_ver',{p_codigo:codTxt,p_precio_id:t.id,p_pax:CANT});
    var info=r.data;
    if(info && info.valido){
      CODEINFO={codigo:codTxt,total:Number(info.total)};
      $('total').innerHTML='<span class="sub">'+mx(info.subtotal)+'</span>'+mx(info.total);
      cm.textContent=info.etiqueta||'Código aplicado'; cm.className='codmsg ok';
      $('pagar').disabled=false; return;
    }
    cm.textContent=(info&&info.mensaje)||'Ese código no aplica.'; cm.className='codmsg mal';
    $('total').textContent=mx(sub); $('pagar').disabled=true; return;
  }
  cm.textContent=''; cm.className='codmsg';
  $('total').textContent=mx(sub); $('pagar').disabled=false;
}
function msg(t,cls){ var m=$('msg'); m.textContent=t; m.className='msg '+cls; }

async function reservar(){
  if(SEL==null){ return; }
  var t=EV.tiers[SEL];
  var nom=($('nom').value||'').trim(), mail=($('mail').value||'').trim();
  if(!nom||!mail){ msg('Pon tu nombre y tu correo para mandarte el boleto.','mal'); return; }
  /* El WhatsApp con su país, y obligatorio: es por donde se avisa si el evento
     cambia de hora o se cae. Javi, 4-oct-2026. */
  if(!TEL||!TEL.valido()){ msg('Nos falta tu WhatsApp con su país: es por donde te avisamos.','mal'); if(TEL)TEL.foco(); return; }
  var tel=TEL.valor();
  $('pagar').disabled=true; msg('Apartando tu lugar…','bien');
  var r=await rpc('evento_reserva_crear',{p_evento_id:EV.id,p_precio_id:t.id,p_pax:CANT,p_nombre:nom,p_email:mail,p_telefono:tel,p_codigo:(CODEINFO&&CODEINFO.codigo)||''});
  if(!r.ok||!r.data||r.data.error){ msg((r.data&&r.data.error)||'No se pudo apartar tu lugar. Intenta de nuevo.','mal'); $('pagar').disabled=false; return; }
  var folio=r.data.folio;
  /* El lugar queda apartado 1 hora; se va a la pantalla de pago (Elements). El
     cobro cae en el Stripe del productor con la comisión del Ateneo, y la
     confirmación de verdad la da el webhook, no el ?pago de la URL. */
  location.href='evento-pago.html?res='+encodeURIComponent(folio);
}
cargar();
</script>
</body>
</html>
