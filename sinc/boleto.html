<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu boleto · Sincrético</title>
<meta name="theme-color" content="#1F1B16">
<style>
:root{--ground:#F4F1EA;--surface:#FFFFFF;--ink:#1F1B16;--muted:#6B6459;--faint:#A49B8C;
--rule:#E2DCCF;--accent:#C9501A;--accent-soft:#FDE7DC;--ok:#1D6B4A;--ok-bg:#E1F0E7;
--bad:#9E3B2E;--bad-bg:#F4E2DE;--warn:#8C6212;--warn-bg:#F3EAD6}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;
  padding:18px 14px 60px;display:flex;flex-direction:column;align-items:center;gap:16px}
.marca{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:12.5px;
  letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.boleto{background:var(--surface);border-radius:18px;width:100%;max-width:400px;
  box-shadow:0 1px 2px rgba(31,27,22,.05),0 22px 48px -30px rgba(31,27,22,.5);overflow:hidden}
.cab{padding:22px 22px 18px;border-bottom:2px dashed var(--rule);position:relative}
.cab:before,.cab:after{content:'';position:absolute;bottom:-11px;width:22px;height:22px;
  background:var(--ground);border-radius:999px}
.cab:before{left:-11px}.cab:after{right:-11px}
.exp{font-size:21px;font-weight:800;line-height:1.2;margin:0 0 4px}
.quien{color:var(--muted);font-size:14px}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
.dato label{display:block;font-size:10.5px;color:var(--faint);font-weight:700;
  text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
.dato b{font-size:15.5px;font-weight:700}
.dato.ancho{grid-column:1/-1}
.qr{padding:22px;text-align:center}
.qr canvas,.qr img{width:200px;height:200px;image-rendering:pixelated}
.cod{font-family:ui-monospace,Menlo,monospace;font-size:23px;letter-spacing:.24em;
  font-weight:700;margin-top:12px}
.pie{padding:0 22px 22px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.5}
/* La caja de «todavia nada», igual que la de Vnums: fondo tinta, el titulo
   grande y debajo de que va. Un cero explicado no es un error. */
.nada{background:var(--tinta,#1E1A16);color:#fff;border-radius:16px;padding:22px 20px;
  max-width:400px;width:100%;box-shadow:0 1px 2px rgba(30,26,22,.06),0 18px 40px -26px rgba(30,26,22,.45)}
.nadaTit{font-family:Oswald,Inter,sans-serif;font-weight:700;text-transform:uppercase;
  letter-spacing:.03em;font-size:21px;line-height:1.15}
.nada p{margin:10px 0 0;font-size:14.5px;line-height:1.55;color:rgba(255,255,255,.88)}
.nada p.chico{font-size:13px;color:rgba(255,255,255,.62)}
.nadaBtn{display:inline-block;margin-top:16px;background:#F2682A;color:#fff;text-decoration:none;
  font-family:Oswald,Inter,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.05em;
  font-size:13px;padding:11px 20px;border-radius:10px}
.aviso{border-radius:12px;padding:14px 16px;font-size:14px;line-height:1.5;max-width:400px;width:100%}
.aviso.warn{background:var(--warn-bg);color:var(--warn)}
.aviso.bad{background:var(--bad-bg);color:var(--bad)}
.aviso b{display:block;font-size:16px;margin-bottom:3px}
.nav{display:flex;gap:8px;max-width:400px;width:100%}
.nav button{flex:1;font:inherit;font-size:13px;font-weight:600;padding:9px;border-radius:9px;
  border:1px solid var(--rule);background:var(--surface);color:var(--muted);cursor:pointer}
.nav button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.cargando{color:var(--muted);padding:40px 0}
/* ¿Ya no puedes venir? El bloque de la devolución */
.devolucion{background:var(--surface);border:1px solid var(--rule);border-radius:14px;
  padding:16px 18px;max-width:400px;width:100%;font-size:14px;line-height:1.5}
.devolucion h2{margin:0 0 5px;font-size:16px}
.devolucion p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.devolucion textarea{width:100%;border:1px solid var(--rule);border-radius:10px;padding:10px 12px;
  font:inherit;font-size:14px;min-height:70px;resize:vertical;background:var(--ground);color:var(--ink)}
.devolucion textarea:focus{outline:none;border-color:var(--accent)}
.bdev{font:inherit;font-size:14px;font-weight:600;padding:11px 16px;border-radius:10px;
  border:1px solid var(--rule);background:var(--surface);color:var(--ink);cursor:pointer;width:100%}
.bdev.fuerte{background:var(--accent);border-color:var(--accent);color:#fff}
.bdev[disabled]{opacity:.55;cursor:default}
</style>
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="manifest" href="/sinc.webmanifest">
<meta name="theme-color" content="#FBF7F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sincrético">
<link rel="apple-touch-icon" href="/sinc/img/sinc-app-180.png">
<!-- AMOR · IR VENIMOS — temporada de Muertos. Se enciende y se apaga
     sola entre el 24 de oct y el 3 de nov (hora de CDMX). Javi, 19-oct-2026. -->
<script src="/cp-muertos.js" data-modo="completa" defer></script>
</head><body>

<div class="marca">Sincrético · Casa Pepe <span id="idioma" data-claro style="margin-left:8px;vertical-align:middle"></span></div>
<div id="app" class="cargando" data-i18n>Buscando tu boleto…</div>

<script src="sinc-i18n.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  function T(x){ try{ return window.sincI18n ? sincI18n.t(x) : x; }catch(_){ return x; } }
  try{ sincI18n.barre(); }catch(_){}
  try{ sincI18n.conmutador('idioma'); }catch(_){}
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

  var q=new URLSearchParams(location.search);
  var COD=(q.get('c')||'').trim().toUpperCase();
  var FOL=(q.get('f')||'').trim().toUpperCase();

  async function rpc(f,b){
    var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(b||{})});
    if(!r.ok) throw new Error(await r.text());
    return await r.json();
  }

  /* Los nombres de día y mes salen del ayudante de idioma; en inglés cambia
     además el orden y desaparece la preposición. */
  function FE(){ try{ return sincI18n.fechas(); }catch(_){
    return {dias:['domingo','lunes','martes','miércoles','jueves','viernes','sábado'],
            largos:['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
                    'septiembre','octubre','noviembre','diciembre']}; } }
  function esIngles(){ try{ return sincI18n.idioma()!=='es'; }catch(_){ return false; } }
  function fecha(f){
    if(!f) return '—';
    var p=String(f).split('-');
    var d=new Date(+p[0],+p[1]-1,+p[2]), fe=FE();
    var dd=fe.dias[d.getDay()], mm=(fe.largos||fe.meses)[+p[1]-1];
    return esIngles() ? dd+' '+(+p[2])+' '+mm : dd+' '+(+p[2])+' de '+mm;
  }
  function hhmm(h){return (h||'').slice(0,5)||'—';}

  function money(n){
    return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:0,maximumFractionDigits:2});
  }
  function pinta(B){
    if(!B.length){ $('app').className=''; $('app').innerHTML=
      '<div class="aviso bad"><b>'+esc(T('No encontramos ese boleto'))+'</b>'+
      esc(T('Revisa el enlace del correo, o escríbenos y lo buscamos por tu nombre.'))+'</div>'; return; }

    var h='';
    if(B.length>1){
      h+='<div class="nav" id="nav">'+B.map(function(b,i){
        return '<button data-i="'+i+'" aria-pressed="'+(i===0)+'">'+esc(T('Persona'))+' '+b.numero+'</button>';
      }).join('')+'</div>';
    }
    h+='<div id="uno"></div><div id="dev"></div>';
    $('app').className=''; $('app').innerHTML=h;

    function uno(b){
      var cancel = b.motivo==='cancelada';
      var html='';
      if(cancel){
        html+='<div class="aviso bad" style="margin-bottom:14px"><b>'+esc(T('Esta reserva está cancelada'))+'</b>'+
              esc(T('Si crees que es un error, escríbenos antes de venir.'))+'</div>';
      } else if(b.usado){
        html+='<div class="aviso warn" style="margin-bottom:14px"><b>'+esc(T('Este boleto ya se usó'))+'</b>'+
              esc(T('Si todavía no has entrado, enséñaselo a quien te recibe.'))+'</div>';
      }
      html+='<div class="boleto">'+
        '<div class="cab">'+
          '<h1 class="exp">'+esc(b.experiencia)+'</h1>'+
          '<div class="quien">'+esc(b.titular||'')+
            (b.de>1?' · '+esc(T('persona'))+' '+b.numero+' '+esc(T('de'))+' '+b.de:'')+'</div>'+
          '<div class="datos">'+
            '<div class="dato ancho"><label>'+esc(T('Cuándo'))+'</label><b>'+esc(fecha(b.fecha))+'</b>'+
              '<div class="quien">'+esc(T('a las'))+' '+esc(hhmm(b.hora))+'</div></div>'+
            (b.punto?'<div class="dato ancho"><label>'+esc(T('Dónde'))+'</label><b>'+esc(b.punto)+'</b></div>':'')+
            '<div class="dato"><label>'+esc(T('Folio'))+'</label><b>'+esc(b.folio||'—')+'</b></div>'+
            '<div class="dato"><label>'+esc(T('Boleto'))+'</label><b>'+esc(T(b.tipo==='menor'?'Menor':'Adulto'))+'</b></div>'+
            /* QUIEN LA OPERA, AQUI Y NO ANTES. Javi, 19-oct-2026: «quita el
               nombre Oaxaca Crew (o el touroperador) hasta que reserven y ya
               se lo mandas en su boleto». En el escaparate el nombre de la
               operadora es una puerta para saltarse a Sincrético; en el boleto
               es lo que el huésped necesita para saber con quién se va. */
            (b.opera?'<div class="dato ancho"><label>'+esc(T('La opera'))+'</label><b>'+esc(b.opera)+'</b></div>':'')+
          '</div>'+
        '</div>'+
        /* Cobro dividido: lo que se paga en el punto de encuentro va ARRIBA del
           QR, no en la letra chica. Es dinero que cambia de manos entre dos
           personas que acaban de conocerse; las dos tienen que llegar sabiendo
           la cifra. Si no hay nada pendiente, esto no existe. Javi, 8-oct. */
        (Number(b.por_persona||0)>0
          ? '<div class="aviso warn" style="margin:0 16px 4px"><b>'+
            esc(T('Llevas pendiente de pago '))+money(b.por_persona)+'</b>'+
            esc(T('Se paga en el punto de encuentro, al empezar, directo con '))+
            esc(b.cobra||T('tu guía'))+'. '+esc(T('Lleva efectivo si puedes.'))+'</div>'
          : '')+
        '<div class="qr"><div id="qr"></div><div class="cod">'+esc(b.codigo)+'</div></div>'+
        '<div class="pie">'+esc(T('Enseña este código al llegar. Si no carga la imagen, sirve leerlo en voz alta: no lleva ni ceros ni oes ni unos ni íes, para que no haya confusión.'))+'</div>'+
      '</div>';
      $('uno').innerHTML=html;
      try{
        new QRCode(document.getElementById('qr'),
          {text:b.codigo, width:200, height:200, correctLevel:QRCode.CorrectLevel.M,
           colorDark:'#1F1B16', colorLight:'#FFFFFF'});
      }catch(_){}
    }

    uno(B[0]);
    devolucion(B[0]);
    var nav=$('nav');
    if(nav) Array.prototype.forEach.call(nav.querySelectorAll('button'),function(b){
      b.onclick=function(){
        Array.prototype.forEach.call(nav.querySelectorAll('button'),function(x){
          x.setAttribute('aria-pressed', x===b ? 'true':'false');});
        uno(B[+b.getAttribute('data-i')]);
      };});
  }

  /* ---------- PEDIR LA DEVOLUCIÓN ----------
     Javi, 15-oct-2026: «permítele al cliente que en su portal de reserva pueda
     solicitar devolución del tour aunque no sea reembolsable, y mándale un
     mensaje diciendo que vamos a revisar si hemos incurrido en algún coste
     —boletos, reserva de lugares, alimentos, nómina— y si no, le devolvemos la
     parte que se pueda liberar».
     Antes de esto, quien no podía venir no tenía dónde decirlo: la tarifa no
     reembolsable cerraba la puerta y la conversación acababa en un correo suelto
     o en nada. Esto NO devuelve dinero ni cancela la reserva: la deja marcada
     para que alguien la mire, y le dice al huésped en qué consiste esa revisión
     para que no espere una cifra que a lo mejor no sale. */
  function devolucion(b){
    var c=$('dev'); if(!c||!b||!b.folio) return;
    if(b.motivo==='cancelada') return;
    c.innerHTML='<div class="devolucion">'+
      '<h2>'+esc(T('¿Ya no puedes venir?'))+'</h2>'+
      '<p>'+esc(T('Puedes pedirnos que te lo devolvamos. Aunque tu tarifa no sea reembolsable, lo miramos caso por caso.'))+'</p>'+
      '<button class="bdev" id="devAbre">'+esc(T('Pedir la devolución'))+'</button></div>';
    $('devAbre').onclick=function(){
      c.querySelector('.devolucion').innerHTML=
        '<h2>'+esc(T('Cuéntanos qué pasó'))+'</h2>'+
        '<p>'+esc(T('No hace falta que sea largo. Nos ayuda a resolverlo más rápido.'))+'</p>'+
        '<textarea id="devTxt" placeholder="'+esc(T('Me salió un imprevisto y no voy a llegar…'))+'"></textarea>'+
        '<div style="margin-top:10px"><button class="bdev fuerte" id="devOk">'+
          esc(T('Enviar la solicitud'))+'</button></div>'+
        '<div id="devMsg" style="margin-top:9px;font-size:13px;color:var(--muted)"></div>';
      $('devOk').onclick=async function(){
        var btn=this; btn.disabled=true; $('devMsg').textContent=T('Enviando…');
        try{
          var r=await rpc('sinc_pide_devolucion',{p_folio:b.folio,p_motivo:($('devTxt').value||'').slice(0,500)});
          if(r&&r.ok){
            c.innerHTML='<div class="aviso warn"><b>'+esc(T('Tenemos tu solicitud'))+'</b>'+
              esc(T('Vamos a revisar si ya tuvimos que gastar algo por tu reserva —boletos, apartar el lugar, alimentos o la nómina del día—. Si todavía no hemos incurrido en ese gasto, te devolvemos la parte que se pueda liberar. Te escribimos a tu correo en cuanto lo tengamos.'))+'</div>';
          } else {
            btn.disabled=false;
            $('devMsg').textContent=(r&&r.mensaje)||T('No pudimos enviarla. Inténtalo otra vez en un momento.');
          }
        }catch(e){
          btn.disabled=false;
          $('devMsg').textContent=T('No pudimos enviarla. Inténtalo otra vez en un momento.');
        }
      };
    };
  }

  (async function(){
    try{
      if(FOL){ pinta((await rpc('sinc_boletos_de_folio',{p_folio:FOL})||[]).filter(Boolean)); }
      else if(COD){ var b=await rpc('sinc_boleto_publico',{p_codigo:COD}); pinta(b&&b.codigo?[b]:[]); }
      else {
        /* SIN BOLETOS NO ES UN ERROR. Javi, 19-oct-2026: «si no hay boletos hay
           que replicar la portada de VNUMS». Quien toca «Boletos» en la barra
           sin haber comprado nada no se ha equivocado de nada: le salia un
           aviso ambar de «falta el código» y una pantalla en blanco sin salida.
           La portada de Vnums hace lo contrario con el cero: lo explica y dice
           como se consigue. Esto es lo mismo con los boletos. */
        $('app').className='';
        $('app').innerHTML=
          '<div class="nada">'+
            '<div class="nadaTit">'+esc(T('Todavía no tienes boletos'))+'</div>'+
            '<p>'+esc(T('Aquí van a aparecer los boletos de las experiencias que reserves, '+
              'con su QR para enseñarlo el día del tour.'))+'</p>'+
            '<p class="chico">'+esc(T('Si ya reservaste, abre el enlace que te llegó por correo: '+
              'tu boleto vive en esa dirección.'))+'</p>'+
            '<a class="nadaBtn" href="/sinc/">'+esc(T('Ver experiencias'))+'</a>'+
          '</div>';
      }
    }catch(e){
      $('app').className='';
      $('app').innerHTML='<div class="aviso bad"><b>'+esc(T('No pudimos cargarlo'))+'</b>'+
        esc(T('Inténtalo de nuevo en un momento.'))+'</div>';
    }
  })();
})();
</script>
</body></html>
