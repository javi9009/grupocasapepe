<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · la productora</title>
<meta name="description" content="Quién programa en el Ateneo de Virreyes, y qué tiene a la venta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<script src="sinc-vitrina.js"></script>
<meta name="theme-color" content="#FBF7F2">
<style>
/* La misma idea que la ficha de una comunidad artesana: su cara arriba, quién
   es debajo, y lo suyo a la venta al final. Lo que cambia es que aquí lo que
   se vende son fechas, no piezas. */
.env{max-width:900px;margin:0 auto;padding:18px 20px 60px}
.volver{display:inline-flex;gap:7px;align-items:center;font:600 12.5px/1 Oswald,sans-serif;
  text-transform:uppercase;letter-spacing:.06em;color:var(--gris);text-decoration:none;margin:2px 0 14px}
.cab{display:flex;gap:16px;align-items:center}
.logo{width:96px;height:96px;flex:none;border-radius:18px;overflow:hidden;background:var(--hueso);
  border:1px solid var(--linea);display:flex;align-items:center;justify-content:center}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.logo .ini{font:700 38px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
h1{font:700 28px/1.08 Oswald,sans-serif;text-transform:uppercase;margin:0 0 4px;color:var(--tinta)}
.giro{font:600 12.5px/1.35 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.bio{font-size:15.5px;line-height:1.62;color:var(--tinta-2);margin:18px 0 0}
.bio.corta{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mas{background:none;border:0;padding:0;margin-top:6px;cursor:pointer;
  font:600 13px/1 Inter,sans-serif;color:var(--naranja-oscuro)}
.enl{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.enl a{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--linea);
  border-radius:999px;padding:7px 13px;font-size:13px;text-decoration:none;color:var(--tinta)}
.lab{font:600 12px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.09em;
  color:var(--gris);margin:30px 0 2px}
.dice{color:var(--gris);font-size:12.5px;line-height:1.45;margin:4px 0 0}
.rej{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));margin-top:12px}
.rej .sv-f{flex:1 1 auto}
.vacio{background:var(--hueso);border:1px solid var(--linea);border-radius:var(--radio);
  padding:18px 20px;margin-top:12px;color:var(--gris);font-size:14px;line-height:1.5}
.comparte{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px 18px;margin-top:26px}
.comparte b{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase;display:block;margin-bottom:8px}
.copia{display:flex;gap:8px}
.copia input{flex:1;font:400 13px/1.4 Inter,sans-serif;border:1.5px solid var(--linea);
  border-radius:9px;padding:9px 10px;background:var(--hueso);color:var(--tinta-2);min-width:0}
.copia button{font:600 12.5px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;
  padding:9px 16px;border-radius:9px;border:2px solid var(--naranja);background:var(--naranja);
  color:#fff;cursor:pointer;flex:none}
</style>
</head>
<body>
<main class="env">
  <a class="volver" id="aVolver" href="index.html">← Sincrético</a>
  <div id="cargando" style="color:var(--gris);font-size:14.5px">Abriendo la ficha…</div>

  <div id="todo" class="oculto">
    <div class="cab">
      <div class="logo" id="logo"></div>
      <div><h1 id="nom"></h1><div class="giro" id="giro"></div></div>
    </div>
    <p class="bio corta" id="bio"></p>
    <button class="mas oculto" id="bMas">Leer más</button>
    <div class="enl" id="enl"></div>

    <div class="lab">Lo que tiene a la venta</div>
    <p class="dice">Se reserva aquí mismo, con la liga de Sincrético.</p>
    <div class="rej" id="rej"></div>
    <div class="vacio oculto" id="vacio"></div>

    <div class="comparte">
      <b>Comparte tu ficha</b>
      <div class="copia">
        <input id="liga" readonly>
        <button id="bCopia">Copiar</button>
      </div>
    </div>
  </div>
</main>

<script>
(function(){
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){ if(n==null)return ''; n=Number(n);
  return n===0?'Gratis':'$'+n.toLocaleString('es-MX',{maximumFractionDigits:0}); }

var P=new URLSearchParams(location.search);
var SLUG=(P.get('p')||'').trim().toLowerCase();
var PRUEBA=P.get('prueba')==='1', CODIGO=(P.get('c')||'').trim(), H=(P.get('h')||'').trim();
var QS=(PRUEBA?'&prueba=1':'')+(CODIGO?'&c='+encodeURIComponent(CODIGO):'')+(H?'&h='+encodeURIComponent(H):'');
$('aVolver').href='index.html'+(QS?('?'+QS.slice(1)):'');

async function get(path){
  var r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}
async function rpc(f,b){
  var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(b||{})});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}

/* La hora siempre en hora de la Ciudad de México: el evento pasa ahí, no donde
   esté el teléfono de quien lo lee. */
function cuandoMx(iso,conHora){
  if(!iso)return '';
  var d=new Date(iso); if(isNaN(d))return '';
  var o={timeZone:'America/Mexico_City',weekday:'short',day:'numeric',month:'short'};
  if(conHora){o.hour='2-digit';o.minute='2-digit';o.hour12=false;}
  return new Intl.DateTimeFormat('es-MX',o).format(d);
}

async function arranca(){
  if(!SLUG){ $('cargando').textContent='Falta decir qué productora.'; return; }
  var p, evs=[];
  try{
    var l=await get('v_productora_publica?select=*&slug=eq.'+encodeURIComponent(SLUG));
    p=l[0];
  }catch(x){ $('cargando').textContent='No pudimos abrir la ficha. '+x.message; return; }
  if(!p){
    $('cargando').innerHTML='Esta ficha todavía no es pública. '+
      '<a href="index.html'+(QS?('?'+QS.slice(1)):'')+'" style="color:var(--naranja-oscuro);font-weight:600">'+
      'Mira lo que sí hay</a>.';
    return;
  }
  try{ evs=await rpc('productora_eventos_publicos',{p_slug:SLUG})||[]; }catch(_){ evs=[]; }

  /* El estilo de la tarjeta se trae del escaparate: lo que esta productora
     vende tiene que verse exactamente igual aquí que allí. */
  try{ sincVitrina.estilo(); }catch(_){}

  $('logo').innerHTML = p.logo_url
    ? '<img src="'+esc(p.logo_url)+'" alt="'+esc(p.nombre)+'">'
    : '<span class="ini">'+esc(String(p.nombre||'·').trim().charAt(0).toUpperCase())+'</span>';
  $('nom').textContent=p.nombre;
  $('giro').textContent=[p.giro,p.espacio,p.ciudad].filter(Boolean).join(' · ');

  if(p.bio){ $('bio').textContent=p.bio; }
  else{ $('bio').style.display='none'; }

  var enl=[];
  if(p.instagram) enl.push('<a href="'+esc(p.instagram.indexOf('http')===0?p.instagram:('https://instagram.com/'+String(p.instagram).replace(/^@/,'')))+'" target="_blank" rel="noopener">📷 Instagram</a>');
  if(p.web)       enl.push('<a href="'+esc(p.web.indexOf('http')===0?p.web:('https://'+p.web))+'" target="_blank" rel="noopener">🌐 Su web</a>');
  $('enl').innerHTML=enl.join('');

  if(!evs.length){
    $('rej').classList.add('oculto');
    $('vacio').classList.remove('oculto');
    $('vacio').innerHTML='<b>Todavía no hay fechas publicadas.</b><br>'+
      'En cuanto el Ateneo autorice la siguiente, aparece aquí y se puede reservar desde esta misma página.';
  }else{
    $('rej').innerHTML=evs.map(function(e){
      var gratis=e.es_gratis||Number(e.precio||0)===0;
      var tarj={id:e.id,nombre:e.nombre,portada:e.foto_url||null};
      var img;
      try{ img=sincVitrina.tapa(e.nombre,e.foto_url); }
      catch(_){ img=e.foto_url?('<img src="'+esc(e.foto_url)+'" alt="">'):''; }
      return '<a class="sv-f" href="evento.html?id='+esc(e.id)+QS+'">'+
        '<span class="im">'+img+
          '<span class="hora">'+esc(cuandoMx(e.fecha_inicio,true))+'</span></span>'+
        '<span class="cu">'+
          '<span class="nm">'+esc(e.nombre||'')+'</span>'+
          '<span class="datos">'+
            (e.espacio?'<span>'+esc(e.espacio)+'</span>':'')+
            (e.cupo?'<span>👥 '+e.cupo+' lugares</span>':'')+
          '</span>'+
          '<span class="pie">'+
            '<span class="pr">'+(gratis?'Entrada libre':money(e.precio))+'</span>'+
            (e.tipo?'<span class="qn">'+esc(e.tipo)+'</span>':'')+
          '</span>'+
        '</span></a>';
    }).join('');
  }

  /* La liga que la productora reparte. Es la de Sincrético a propósito: quien
     la abra reserva con nosotros, que es de lo que se trata. */
  var liga='https://casapepe.mx/sincretico/productora.html?p='+encodeURIComponent(SLUG);
  $('liga').value=liga;
  $('bCopia').onclick=function(){
    $('liga').select();
    try{ navigator.clipboard.writeText(liga); }catch(_){ document.execCommand('copy'); }
    $('bCopia').textContent='Copiada';
    setTimeout(function(){ $('bCopia').textContent='Copiar'; },1600);
  };

  $('cargando').classList.add('oculto');
  $('todo').classList.remove('oculto');

  /* El botón de «Leer más» sólo si el texto de verdad no cabe. */
  var t=$('bio'), m=$('bMas');
  if(p.bio && t.scrollHeight>t.clientHeight+1){
    m.classList.remove('oculto');
    m.onclick=function(){
      var ab=t.classList.toggle('corta');
      m.textContent = ab ? 'Leer más' : 'Leer menos';
    };
  }
}
arranca();
})();
</script>
</body>
</html>
