<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · la productora</title>
<meta name="description" content="Quién programa en el Ateneo de Virreyes, y qué tiene a la venta.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<script src="sinc-vitrina.js"></script>
<meta name="theme-color" content="#FBF7F2">
<style>
/* UNA LANDING, NO UNA FICHA. Javi, 3-oct-2026: «hazlo más comercial, como una
   landing page». Así que esto ya no es una tarjeta con datos: es una página de
   venta, con su portada ancha, su intro, su equipo y sus dos galerías. */

/* ---------- 1 · la portada ---------- */
.portada{position:relative;min-height:300px;display:flex;align-items:flex-end;
  background:var(--tinta);overflow:hidden}
.portada .bg{position:absolute;inset:0}
.portada .bg img{width:100%;height:100%;object-fit:cover;display:block}
/* Sin foto de portada no se pone un gris: se pone la marca. Un hueco gris
   arriba del todo hace que la página parezca rota antes de empezar. */
.portada .bg.sinfoto{background:
  radial-gradient(120% 140% at 15% 0%, #F2682A 0%, rgba(242,104,42,0) 58%),
  radial-gradient(120% 140% at 85% 100%, #E2188E 0%, rgba(226,24,142,0) 55%),
  #1E1A16}
.portada .velo{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(20,17,14,.18) 0%,rgba(20,17,14,.82) 82%)}
/* El header horizontal: logo a la izquierda, nombre y giro a la derecha. */
.hdr{position:relative;display:flex;align-items:center;gap:16px;
  max-width:980px;margin:0 auto;width:100%;padding:28px 20px 24px}
.hdr .logo{width:92px;height:92px;flex:none;border-radius:18px;overflow:hidden;
  background:#fff;border:2px solid rgba(255,255,255,.9);display:flex;
  align-items:center;justify-content:center;box-shadow:0 10px 30px -12px rgba(0,0,0,.6)}
.hdr .logo img{width:100%;height:100%;object-fit:cover;display:block}
.hdr .logo .ini{font:700 40px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
.hdr h1{font:700 32px/1.05 Oswald,sans-serif;text-transform:uppercase;margin:0;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.45)}
.hdr .giro{font:600 12.5px/1.4 Oswald,sans-serif;letter-spacing:.07em;text-transform:uppercase;
  color:#F8BBCB;margin-top:5px}
@media(max-width:560px){
  .portada{min-height:250px}
  .hdr{flex-direction:column;align-items:flex-start;gap:12px;padding:24px 18px 20px}
  .hdr h1{font-size:26px}
}
.volver{position:absolute;top:14px;left:20px;z-index:3;display:inline-flex;gap:6px;
  align-items:center;font:600 11.5px/1 Oswald,sans-serif;text-transform:uppercase;
  letter-spacing:.07em;color:#fff;text-decoration:none;background:rgba(20,17,14,.45);
  border-radius:999px;padding:7px 12px;backdrop-filter:blur(4px)}

.env{max-width:980px;margin:0 auto;padding:0 20px 64px}
.bloque{margin-top:34px}
.lab{font:600 12px/1 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.09em;
  color:var(--gris);margin:0 0 10px}
.intro{font-size:18px;line-height:1.55;color:var(--tinta);margin:26px 0 0;font-weight:500}
.hist{font-size:15.5px;line-height:1.68;color:var(--tinta-2);margin:0}
.hist.corta{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.mas{background:none;border:0;padding:0;margin-top:8px;cursor:pointer;
  font:600 13px/1 Inter,sans-serif;color:var(--naranja-oscuro)}

/* ---------- 3 · redes y 4 · contacto ---------- */
.redes{display:flex;flex-wrap:wrap;gap:8px}
.redes a{display:inline-flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--linea);
  border-radius:999px;padding:9px 15px;font-size:13.5px;font-weight:600;
  text-decoration:none;color:var(--tinta)}
.redes a:active{transform:scale(.98)}
.contacto{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.contacto a{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--linea);
  border-radius:var(--radio);box-shadow:var(--sombra);padding:14px 16px;text-decoration:none;color:var(--tinta)}
.contacto .ic{width:38px;height:38px;border-radius:11px;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:19px;background:var(--naranja-suave)}
.contacto .q{font:600 10.5px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris)}
.contacto .v{font-size:14.5px;margin-top:3px;word-break:break-all}

/* ---------- 5 · mi equipo ---------- */
.sub{color:var(--gris);font-size:12.5px;line-height:1.45;margin:0 0 10px}
.equipo{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
/* Los protagonistas son el gancho, así que la cara manda: más grande, y el
   nombre debajo. El equipo que produce va después y más discreto. */
.protas .p{align-items:center;text-align:center}
.protas .p .cara{width:104px;height:104px;margin-bottom:12px}
.protas .p .cara .ini{font-size:40px}
.protas .p .nm{font-size:16.5px}
.protas .p .ct{justify-content:center}
.p{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:16px;display:flex;flex-direction:column;gap:3px}
.p .cara{width:68px;height:68px;border-radius:50%;overflow:hidden;background:var(--hueso);
  border:1px solid var(--linea);display:flex;align-items:center;justify-content:center;margin-bottom:9px}
.p .cara img{width:100%;height:100%;object-fit:cover;display:block}
.p .cara .ini{font:700 26px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
.p .nm{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase}
.p .rl{font-size:11.5px;color:var(--naranja-oscuro);font-weight:600;margin-top:2px}
.p .de{font-size:13px;line-height:1.5;color:var(--tinta-2);margin-top:7px}
.p .ct{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.p .ct a{font-size:12px;text-decoration:none;color:var(--tinta);background:var(--hueso);
  border:1px solid var(--linea);border-radius:999px;padding:5px 10px}

/* ---------- 7/8 · las dos galerías ---------- */
/* La carta: una lista de precios, no tarjetas. Lo que se mira aquí es qué hay
   y cuánto cuesta, y eso se lee mejor en renglones. */
.carta{display:grid;gap:0;background:#fff;border:1px solid var(--linea);
  border-radius:var(--radio);overflow:hidden;box-shadow:var(--sombra)}
.carta .sec{font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gris);background:var(--hueso);padding:9px 16px;border-top:1px solid var(--linea)}
.carta .sec:first-child{border-top:0}
.carta .it{display:flex;gap:12px;align-items:baseline;padding:11px 16px;border-top:1px solid var(--linea)}
.carta .it .n{font-weight:600;font-size:14.5px}
.carta .it .d{color:var(--gris);font-size:12.5px;line-height:1.4;margin-top:2px}
.carta .it .p{margin-left:auto;font:600 14px/1 Oswald,sans-serif;color:var(--naranja-oscuro);white-space:nowrap}
.carta .it.off{opacity:.45}
.carta .it.off .p{text-decoration:line-through}
.rsbtn{display:inline-block;margin-top:12px;font:600 13px/1 Oswald,sans-serif;letter-spacing:.05em;
  text-transform:uppercase;padding:12px 20px;border-radius:9px;border:2px solid var(--naranja);
  background:var(--naranja);color:#fff;text-decoration:none}
.rej{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(172px,1fr))}
.rej .sv-f{flex:1 1 auto}
/* Lo que ya pasó se mira por otra razón: no para comprar, para saber qué tipo
   de cosas monta esta gente. Así que es más chico y no lleva precio. */
.pasados{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
.pz{background:#fff;border:1px solid var(--linea);border-radius:12px;overflow:hidden;
  display:flex;flex-direction:column}
.pz .im{position:relative;aspect-ratio:4/3;background:var(--hueso);overflow:hidden}
.pz .im img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(.72)}
.pz .cu{padding:8px 10px 10px}
.pz .nm{font-weight:700;font-size:12.5px;line-height:1.25}
.pz .cd{font-size:11px;color:var(--tenue);margin-top:3px}

.vacio{background:var(--hueso);border:1px solid var(--linea);border-radius:var(--radio);
  padding:18px 20px;color:var(--gris);font-size:14px;line-height:1.5}
.pie{text-align:center;color:var(--tenue);font-size:12px;margin-top:30px}
.pie .lema{font:italic 400 18px/1 'Lobster Two',cursive;color:var(--magenta);display:block;margin-bottom:4px}
</style>
</head>
<body>

<header class="portada" id="portada">
  <a class="volver" id="aVolver" href="index.html">← Sincrético</a>
  <div class="bg sinfoto" id="portadaBg"></div>
  <div class="velo"></div>
  <div class="hdr">
    <div class="logo" id="logo"></div>
    <div><h1 id="nom">…</h1><div class="giro" id="giro"></div></div>
  </div>
</header>

<main class="env">
  <div id="cargando" style="color:var(--gris);font-size:14.5px;padding:24px 0">Abriendo la ficha…</div>

  <div id="todo" class="oculto">
    <p class="intro" id="intro"></p>

    <div class="bloque oculto" id="bRedes">
      <div class="lab">Síguenos</div>
      <div class="redes" id="redes"></div>
    </div>

    <div class="bloque oculto" id="bContacto">
      <div class="lab">Contacto</div>
      <div class="contacto" id="contacto"></div>
    </div>

    <!-- LOS PROTAGONISTAS VAN PRIMERO. Javi, 3-oct-2026: «te faltan los
         protagonistas». No son el equipo: el equipo produce, y los
         protagonistas son a quien va a ver la gente. Por eso van delante y con
         la cara mas grande. La diferencia la da es_talento, del catalogo de
         roles, que ya existia y la ficha no usaba. -->
    <div class="bloque oculto" id="bProtas">
      <div class="lab">Los protagonistas</div>
      <p class="sub">Quién se sube al escenario.</p>
      <div class="equipo protas" id="protas"></div>
    </div>

    <div class="bloque oculto" id="bEquipo">
      <div class="lab">Quién lo monta</div>
      <div class="equipo" id="equipo"></div>
    </div>

    <div class="bloque oculto" id="bHist">
      <div class="lab">Nuestra historia</div>
      <p class="hist corta" id="hist"></p>
      <button class="mas oculto" id="bMas">Leer más</button>
    </div>

    <!-- ROOM SERVICE. Solo sale si esta productora lo tiene encendido: hoy,
         Cafe Cumbre. Se pide desde la app del Ateneista, que es donde se sabe
         quien pide y en que sala esta. -->
    <div class="bloque oculto" id="bRS">
      <div class="lab">Room service</div>
      <p class="sub" id="rsSub"></p>
      <div class="carta" id="carta"></div>
      <a class="rsbtn" id="rsIr">Pedir desde la app del Ateneo →</a>
    </div>

    <div class="bloque">
      <div class="lab">Lo que tenemos a la venta</div>
      <div class="rej" id="rej"></div>
      <div class="vacio oculto" id="vacio"></div>
    </div>

    <div class="bloque oculto" id="bPasados">
      <div class="lab">Lo que ya hicimos</div>
      <div class="pasados" id="pasados"></div>
    </div>

    <div class="pie"><span class="lema">How to be a Mexican?</span>Sincrético · Ateneo de Virreyes</div>
  </div>
</main>

<script>
(function(){
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){ if(n==null)return ''; n=Number(n);
  return n===0?'Gratis':'$'+n.toLocaleString('es-MX',{maximumFractionDigits:0}); }
function vale(s){ return !!(s&&String(s).trim()); }

var P=new URLSearchParams(location.search);
var SLUG=(P.get('p')||'').trim().toLowerCase();
var PRUEBA=P.get('prueba')==='1', CODIGO=(P.get('c')||'').trim(), H=(P.get('h')||'').trim();
var QS=(PRUEBA?'&prueba=1':'')+(CODIGO?'&c='+encodeURIComponent(CODIGO):'')+(H?'&h='+encodeURIComponent(H):'');
$('aVolver').href='index.html'+(QS?('?'+QS.slice(1)):'');

async function get(path){
  var r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}
async function rpc(f,b){
  var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(b||{})});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}

/* La hora, siempre la de la Ciudad de México: el evento pasa ahí. */
function cuandoMx(iso,conHora){
  if(!iso)return '';
  var d=new Date(iso); if(isNaN(d))return '';
  var o={timeZone:'America/Mexico_City',weekday:'short',day:'numeric',month:'short'};
  if(conHora){o.hour='2-digit';o.minute='2-digit';o.hour12=false;}
  return new Intl.DateTimeFormat('es-MX',o).format(d);
}
function mesMx(iso){
  if(!iso)return '';
  var d=new Date(iso); if(isNaN(d))return '';
  return new Intl.DateTimeFormat('es-MX',{timeZone:'America/Mexico_City',
    month:'long',year:'numeric'}).format(d);
}
/* Una cuenta puede venir como @nombre, como nombre o como liga entera. */
function liga(v,base){
  v=String(v||'').trim(); if(!v)return '';
  if(v.indexOf('http')===0) return v;
  return base+String(v).replace(/^@/,'');
}

var REDES=[
  ['instagram','📷','Instagram','https://instagram.com/'],
  ['facebook', '👍','Facebook', 'https://facebook.com/'],
  ['tiktok',   '🎵','TikTok',   'https://tiktok.com/@'],
  ['youtube',  '▶️','YouTube',  'https://youtube.com/@'],
  ['spotify',  '🎧','Spotify',  'https://open.spotify.com/'],
  ['web',      '🌐','Su web',   'https://']
];

async function arranca(){
  if(!SLUG){ $('cargando').textContent='Falta decir qué productora.'; return; }
  var p;
  try{
    var l=await get('v_productora_publica?select=*&slug=eq.'+encodeURIComponent(SLUG));
    p=l[0];
  }catch(x){ $('cargando').textContent='No pudimos abrir la ficha. '+x.message; return; }
  if(!p){
    $('cargando').innerHTML='Esta ficha todavía no es pública. '+
      '<a href="index.html'+(QS?('?'+QS.slice(1)):'')+'" style="color:var(--naranja-oscuro);font-weight:600">'+
      'Mira lo que sí hay</a>.';
    return;
  }

  var evs=[], pas=[], eq=[];
  try{ evs=await rpc('productora_eventos_publicos',{p_slug:SLUG})||[]; }catch(_){}
  try{ pas=await rpc('productora_eventos_pasados',{p_slug:SLUG,p_tope:12})||[]; }catch(_){}
  try{ eq =await rpc('productora_gente_publica',{p_slug:SLUG})||[]; }catch(_){}
  var carta=[];
  try{ carta=await rpc('rs_carta',{p_slug:SLUG})||[]; }catch(_){ carta=[]; }

  /* Las tarjetas de lo que está a la venta son las MISMAS del escaparate. */
  try{ sincVitrina.estilo(); }catch(_){}

  document.title='Sincrético · '+p.nombre;

  /* ---------- 1 · portada y header ---------- */
  if(vale(p.portada_url)){
    $('portadaBg').className='bg';
    $('portadaBg').innerHTML='<img src="'+esc(p.portada_url)+'" alt="">';
  }
  $('logo').innerHTML = vale(p.logo_url)
    ? '<img src="'+esc(p.logo_url)+'" alt="'+esc(p.nombre)+'">'
    : '<span class="ini">'+esc(String(p.nombre||'·').trim().charAt(0).toUpperCase())+'</span>';
  $('nom').textContent=p.nombre;
  $('giro').textContent=[p.giro,p.espacio,p.ciudad].filter(Boolean).join(' · ');

  /* ---------- 2 · intro ---------- */
  if(vale(p.bio)) $('intro').textContent=p.bio; else $('intro').style.display='none';

  /* ---------- 3 · redes ---------- */
  var r=REDES.map(function(x){
    var v=p[x[0]]; if(!vale(v))return '';
    return '<a href="'+esc(liga(v,x[3]))+'" target="_blank" rel="noopener">'+x[1]+' '+esc(x[2])+'</a>';
  }).filter(Boolean);
  if(r.length){ $('redes').innerHTML=r.join(''); $('bRedes').classList.remove('oculto'); }

  /* ---------- 4 · contacto ---------- */
  var c=[];
  if(vale(p.whatsapp_publico)){
    var wa=String(p.whatsapp_publico).replace(/[^0-9]/g,'');
    c.push('<a href="https://wa.me/'+esc(wa)+'" target="_blank" rel="noopener">'+
      '<span class="ic">💬</span><span><span class="q">WhatsApp</span>'+
      '<span class="v">'+esc(p.whatsapp_publico)+'</span></span></a>');
  }
  if(vale(p.email_publico)){
    c.push('<a href="mailto:'+esc(p.email_publico)+'">'+
      '<span class="ic">✉️</span><span><span class="q">Correo</span>'+
      '<span class="v">'+esc(p.email_publico)+'</span></span></a>');
  }
  if(c.length){ $('contacto').innerHTML=c.join(''); $('bContacto').classList.remove('oculto'); }

  /* ---------- 5 · protagonistas y equipo ---------- */
  function persona(u){
      var ct=[];
      if(vale(u.instagram)) ct.push('<a href="'+esc(liga(u.instagram,'https://instagram.com/'))+'" target="_blank" rel="noopener">📷 '+esc(String(u.instagram).replace(/^https?:\/\/[^\/]+\//,'@'))+'</a>');
      if(vale(u.whatsapp))  ct.push('<a href="https://wa.me/'+esc(String(u.whatsapp).replace(/[^0-9]/g,''))+'" target="_blank" rel="noopener">💬 WhatsApp</a>');
      if(vale(u.email))     ct.push('<a href="mailto:'+esc(u.email)+'">✉️ Correo</a>');
      return '<div class="p">'+
        '<div class="cara">'+(vale(u.foto_url)
          ? '<img src="'+esc(u.foto_url)+'" alt="'+esc(u.nombre)+'">'
          : '<span class="ini">'+esc(String(u.nombre||'·').trim().charAt(0).toUpperCase())+'</span>')+'</div>'+
        '<div class="nm">'+esc(u.nombre||'')+'</div>'+
        (vale(u.rol)?'<div class="rl">'+esc(u.rol)+'</div>':'')+
        (vale(u.descripcion)?'<div class="de">'+esc(u.descripcion)+'</div>':'')+
        (ct.length?'<div class="ct">'+ct.join('')+'</div>':'')+
      '</div>';
  }
  var protas = eq.filter(function(u){ return u.es_talento; });
  var monta  = eq.filter(function(u){ return !u.es_talento; });
  if(protas.length){
    $('protas').innerHTML=protas.map(persona).join('');
    $('bProtas').classList.remove('oculto');
  }
  if(monta.length){
    $('equipo').innerHTML=monta.map(persona).join('');
    $('bEquipo').classList.remove('oculto');
  }

  /* ---------- 5b · room service ---------- */
  if(carta.length){
    var secs=[];
    carta.forEach(function(i){ if(secs.indexOf(i.seccion)<0) secs.push(i.seccion); });
    $('carta').innerHTML=secs.map(function(sc){
      return '<div class="sec">'+esc(sc)+'</div>'+
        carta.filter(function(i){return i.seccion===sc;}).map(function(i){
          return '<div class="it'+(i.agotado?' off':'')+'">'+
            '<span><span class="n">'+esc(i.nombre)+'</span>'+
            (vale(i.descripcion)?'<span class="d">'+esc(i.descripcion)+'</span>':'')+
            (i.agotado?'<span class="d">Se acabó hoy</span>':'')+'</span>'+
            '<span class="p">'+money(i.precio)+'</span></div>';
        }).join('');
    }).join('');
    $('rsSub').textContent='Pide de nuestra carta desde donde estés en el Ateneo y te lo subimos a tu sala.';
    $('rsIr').href='/ateneo/app.html?rs='+encodeURIComponent(SLUG);
    $('bRS').classList.remove('oculto');
  }

  /* ---------- 6 · historia ---------- */
  if(vale(p.historia)){
    $('hist').textContent=p.historia;
    $('bHist').classList.remove('oculto');
  }

  /* ---------- 7 · lo que está a la venta ---------- */
  if(!evs.length){
    $('rej').classList.add('oculto');
    $('vacio').classList.remove('oculto');
    $('vacio').innerHTML='<b>Todavía no hay fechas publicadas.</b><br>'+
      'En cuanto el Ateneo autorice la siguiente, aparece aquí y se puede reservar desde esta misma página.';
  }else{
    $('rej').innerHTML=evs.map(function(e){
      var gratis=e.es_gratis||Number(e.precio||0)===0;
      var img;
      try{ img=sincVitrina.tapa(e.nombre,e.foto_url); }
      catch(_){ img=vale(e.foto_url)?('<img src="'+esc(e.foto_url)+'" alt="">'):''; }
      return '<a class="sv-f" href="evento.html?id='+esc(e.id)+QS+'">'+
        '<span class="im">'+img+
          '<span class="hora">'+esc(cuandoMx(e.fecha_inicio,true))+'</span></span>'+
        '<span class="cu">'+
          '<span class="nm">'+esc(e.nombre||'')+'</span>'+
          '<span class="datos">'+
            (vale(e.espacio)?'<span>'+esc(e.espacio)+'</span>':'')+
            (e.cupo?'<span>👥 '+e.cupo+' lugares</span>':'')+
          '</span>'+
          '<span class="pie">'+
            '<span class="pr">'+(gratis?'Entrada libre':money(e.precio))+'</span>'+
            (vale(e.tipo)?'<span class="qn">'+esc(e.tipo)+'</span>':'')+
          '</span>'+
        '</span></a>';
    }).join('');
  }

  /* ---------- 8 · lo que ya pasó ---------- */
  if(pas.length){
    $('pasados').innerHTML=pas.map(function(e){
      var img;
      try{ img=sincVitrina.tapa(e.nombre,e.foto_url); }
      catch(_){ img=vale(e.foto_url)?('<img src="'+esc(e.foto_url)+'" alt="">'):''; }
      return '<div class="pz"><div class="im">'+img+'</div>'+
        '<div class="cu"><div class="nm">'+esc(e.nombre||'')+'</div>'+
        '<div class="cd">'+esc([mesMx(e.fecha_inicio),e.espacio].filter(Boolean).join(' · '))+'</div>'+
        '</div></div>';
    }).join('');
    $('bPasados').classList.remove('oculto');
  }

  $('cargando').classList.add('oculto');
  $('todo').classList.remove('oculto');

  /* El «Leer más» de la historia, sólo si de verdad no cabe. */
  var t=$('hist'), m=$('bMas');
  if(vale(p.historia) && t.scrollHeight>t.clientHeight+1){
    m.classList.remove('oculto');
    m.onclick=function(){
      var ab=t.classList.toggle('corta');
      m.textContent = ab ? 'Leer más' : 'Leer menos';
    };
  }
}
arranca();
})();
</script>
</body>
</html>
