<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cotiza tu evento · Sincrético</title>
<meta name="description" content="Eventos para empresas y grupos en la Ciudad de México: transporte, experiencia, lugar, alimentos y extras. Arma tu cotización.">
<link rel="icon" href="img/sincretico-isotipo-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   COTIZA TU EVENTO · para empresas y grupos
   Javi, 21-nov-2026, sobre la portada de sincretico.mx: «poner un botón más
   que diga cotizar evento corporativo, y ahí es donde metes todo lo que
   estamos haciendo». Esto es ese «todo».
   Seis pasos y la cesta a la derecha, que se arma en vivo.
   LOS PRECIOS QUE SE VEN AQUÍ SON UNA ESTIMACIÓN: el que vale lo recalcula el
   servidor en corp_solicitar, con los catálogos y las reglas, y nunca se fía
   de lo que diga este navegador.
   =========================================================================== */
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#fff;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --error:#9E3B2E; --error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:'Inter',system-ui,sans-serif;font-size:15px;line-height:1.5}
a{color:var(--naranja-oscuro)}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;margin:0}
.kick{font-family:'Oswald';text-transform:uppercase;letter-spacing:.11em;
  font-size:11.5px;font-weight:600;color:var(--gris)}
.mini{font-size:12.5px;color:var(--gris);line-height:1.45}

header.top{background:var(--tinta);color:#fff}
header.top .wrap{display:flex;align-items:center;gap:20px;flex-wrap:wrap;padding-top:13px;padding-bottom:13px}
header.top b{font-family:'Oswald';font-weight:700;font-size:17px;letter-spacing:.06em}
header.top b i{font-style:normal;color:var(--cielo)}
header.top nav{margin-left:auto;display:flex;gap:18px;flex-wrap:wrap;
  font-family:'Oswald';font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
header.top nav a{color:#C9C2B8;text-decoration:none}
header.top nav a:hover{color:#fff}

.tit{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;
  gap:16px;margin:26px 0 18px}
.tit h1{font-size:40px;line-height:1.05;font-weight:700}
.tit .tag{font-family:'Lobster Two',cursive;font-style:italic;font-size:22px;color:var(--magenta);margin-top:2px}
.pasos{display:flex;gap:7px;flex-wrap:wrap;list-style:none;margin:0;padding:0;
  font-family:'Oswald';font-weight:600;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase}
.pasos li{display:flex;align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
  background:#fff;border:1px solid var(--linea);color:var(--tinta-2);cursor:pointer}
.pasos li u{text-decoration:none;display:inline-flex;width:19px;height:19px;border-radius:50%;
  background:var(--hueso);align-items:center;justify-content:center;font-size:10.5px}
.pasos li.on{background:var(--tinta);border-color:var(--tinta);color:#fff}
.pasos li.on u{background:var(--naranja);color:#fff}
.pasos li.listo u{background:var(--ok);color:#fff}

.cols{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-bottom:60px}
main{flex:999 1 580px;min-width:0;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra)}
section.paso{padding:20px 22px}
section.paso h2{font-size:21px;font-weight:700}
section.paso>.mini{margin:5px 0 14px}

label.campo{display:block}
label.campo>span{display:block;font-family:'Oswald';font-weight:600;font-size:11px;
  letter-spacing:.07em;text-transform:uppercase;color:var(--gris);margin:0 0 5px}
input,select,textarea{width:100%;font:15px 'Inter',system-ui,sans-serif;color:var(--tinta);
  background:#fff;border:1.5px solid var(--linea);border-radius:9px;padding:10px 12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja);
  box-shadow:0 0 0 3px var(--naranja-suave)}
textarea{resize:vertical;line-height:1.5}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}

.ops{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:11px}
.op{border:1.5px solid var(--linea);border-radius:11px;background:#fff;padding:13px 15px;
  cursor:pointer;text-align:left;font:inherit;color:inherit}
.op:hover{border-color:var(--naranja)}
.op.on{border-color:var(--naranja);background:var(--naranja-suave)}
.op b{display:block;font-family:'Oswald';font-weight:600;font-size:15px;text-transform:uppercase}

.chips{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 13px}

/* EL CRONOGRAMA DEL DÍA. Una fila por momento, la hora a la izquierda y el
   lápiz a la derecha: el resumen no es sólo para mirar, es desde donde se
   corrige, como el check-in de un avión. */
.crono{margin-top:14px;border:1.5px solid var(--linea);border-radius:12px;overflow:hidden}
.tramo{display:flex;gap:11px;align-items:center;padding:11px 12px;background:var(--blanco);
  border-bottom:1px solid var(--linea)}
.tramo:last-child{border-bottom:none}
.tramo .hh{flex:0 0 52px;font-family:'Oswald';font-weight:600;font-size:14px;color:var(--naranja-oscuro)}
.tramo .qq{flex:1;min-width:0}
.tramo .qq b{font-size:14px}
.lap{flex:0 0 auto;border:1.5px solid var(--linea);background:var(--blanco);border-radius:8px;
  width:32px;height:32px;cursor:pointer;color:var(--gris);font-size:14px;line-height:1}
.lap:hover{border-color:var(--naranja);color:var(--naranja-oscuro)}
.sumas{border-top:2px solid var(--tinta);padding-top:9px}
.sumas .fila{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}
.sumas .fila.tot{border-top:1px solid var(--linea);margin-top:5px;padding-top:8px}
.sumas .fila.tot b{font-family:'Oswald';font-size:20px}
.nota.roja{background:#F6E1DD;color:#9E3B2E}

/* EL ESTANTE: se recorre de lado. Cada grupo de la carta es una fila que se
   arrastra, no doscientas filas apiladas. El scroll se engancha a cada
   tarjeta para que nunca se quede una cortada a la mitad. */
.estante{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 10px;
  scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.estante::-webkit-scrollbar{height:6px}
.estante::-webkit-scrollbar-thumb{background:var(--linea);border-radius:3px}
.prod{flex:0 0 168px;scroll-snap-align:start;background:var(--blanco);
  border:1.5px solid var(--linea);border-radius:12px;padding:9px;
  display:flex;flex-direction:column;gap:5px}
.prod.on{border-color:var(--naranja);box-shadow:0 0 0 3px var(--naranja-suave)}
.prod .pfoto{height:92px;border-radius:9px;background:var(--hueso) center/cover no-repeat}
.prod .pnom{font-weight:600;font-size:13.5px;line-height:1.25}
.prod .ppre{font-family:'Oswald';font-weight:600;font-size:15px;margin-top:auto}
.prod .ppre span{font-family:Inter;font-weight:400;font-size:11px;color:var(--gris)}
.prod select{width:100%;font-size:12.5px;padding:6px 8px}
.prod .cont{width:100%;justify-content:space-between}
.prod .pcu{color:var(--naranja-oscuro);font-weight:600}
@media(max-width:520px){ .prod{flex:0 0 150px} .prod .pfoto{height:78px} }
.chip{font-family:'Oswald';font-weight:600;font-size:11.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:8px 14px;border-radius:999px;cursor:pointer;
  border:1.5px solid var(--linea);background:#fff;color:var(--tinta-2)}
.chip.on{border-color:var(--naranja);background:var(--naranja-suave);color:var(--naranja-oscuro)}

.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}
.tj{border:1px solid var(--linea);border-radius:12px;background:#fff;overflow:hidden;
  display:flex;flex-direction:column;box-shadow:var(--sombra)}
.tj.on{border-color:var(--naranja);box-shadow:0 0 0 1px var(--naranja)}
.tj.no{opacity:.55}
.tj .foto{height:118px;background:var(--cielo-suave) center/cover no-repeat;position:relative}
.tj .foto em{position:absolute;left:9px;top:9px;font-style:normal;font-family:'Oswald';
  font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;
  background:rgba(255,255,255,.88);color:var(--tinta-2);padding:3px 9px;border-radius:999px}
.tj .cu{padding:12px 14px;display:flex;flex-direction:column;gap:4px;flex:1}
.tj .nom{font-family:'Oswald';font-weight:600;font-size:16px;text-transform:uppercase;line-height:1.2}
.tj .pre{font-weight:700;font-size:15px;margin-top:auto;padding-top:6px}
.tj .pre span{font-weight:400;font-size:11.5px;color:var(--gris)}
.tj .pie{display:flex;gap:7px;padding:0 14px 13px;flex-wrap:wrap}

.btn{font-family:'Oswald';font-weight:600;font-size:12.5px;letter-spacing:.05em;
  text-transform:uppercase;padding:10px 16px;border-radius:9px;cursor:pointer;
  border:2px solid var(--naranja);background:var(--naranja);color:#fff}
.btn.fan{background:transparent;color:var(--naranja-oscuro)}
.btn.gris{border-color:var(--linea);background:#fff;color:var(--tinta-2)}
.btn.sm{padding:7px 12px;font-size:11.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

.cont{display:inline-flex;align-items:center;border:1.5px solid var(--linea);
  border-radius:9px;overflow:hidden;background:#fff}
.cont button{width:34px;height:36px;border:0;background:#fff;font-size:17px;cursor:pointer;color:var(--tinta)}
.cont .mas{background:var(--naranja);color:#fff}
.cont span{min-width:34px;text-align:center;font-weight:700;font-size:14px}

.nota{border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.5;margin:12px 0 0}
.nota.amb{background:var(--alerta-bg);color:var(--alerta)}
.nota.roja{background:var(--error-bg);color:var(--error)}
.nota.azul{background:var(--cielo-suave);color:var(--tinta-2)}
.nota.verde{background:var(--ok-bg);color:var(--ok)}

/* La ficha: panel grande arriba del paso, nunca fixed -en el canvas no se
   veía- y se desplaza sola hasta quedar a la vista. */
.ficha{display:flex;flex-wrap:wrap;gap:20px;border:1px solid var(--linea);
  border-radius:12px;background:#fff;box-shadow:var(--sombra);padding:18px;margin:0 0 14px}
.ficha .gal{flex:0 1 300px;min-width:0}
.ficha .gal .big{height:210px;border-radius:10px;background:var(--cielo-suave) center/cover no-repeat;position:relative}
.ficha .gal .big b{position:absolute;right:9px;bottom:9px;font-family:'Inter';font-size:11.5px;
  background:rgba(30,26,22,.72);color:#fff;padding:3px 9px;border-radius:999px;font-weight:500}
.ficha .gal .tiras{display:flex;gap:6px;margin-top:7px;overflow-x:auto}
.ficha .gal .tiras i{flex:0 0 58px;height:44px;border-radius:7px;background:var(--hueso) center/cover no-repeat;cursor:pointer}
.ficha .txt{flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:11px}
.ficha h3{font-size:25px;font-weight:700;line-height:1.1}
.ficha .datos{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:1px;
  background:var(--linea);border:1px solid var(--linea);border-radius:10px;overflow:hidden}
.ficha .datos div{background:var(--hueso);padding:9px 11px}
.ficha .datos em{display:block;font-style:normal;font-family:'Oswald';font-weight:600;
  font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--gris)}
.ficha .datos strong{display:block;font-size:14px;margin-top:2px}
.ficha ul{margin:0;padding-left:18px;font-size:14px;line-height:1.5}

/* La cesta */
aside.cesta{flex:1 1 320px;min-width:0;position:sticky;top:14px;background:#fff;
  border:1px solid var(--linea);border-radius:12px;box-shadow:var(--sombra);overflow:hidden}
aside.cesta .cab{padding:15px 17px 12px;border-bottom:1px solid var(--linea);
  display:flex;justify-content:space-between;align-items:baseline;gap:10px}
aside.cesta .cab h2{font-size:19px;font-weight:700}
aside.cesta .cu{padding:2px 17px;max-height:440px;overflow-y:auto}
aside.cesta .gr{font-family:'Oswald';font-weight:600;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:var(--tenue);padding:12px 0 2px}
.lin{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--linea)}
.lin .n{font-weight:600;font-size:14px;line-height:1.25}
.lin .q{font-size:12.5px;color:var(--gris);margin-top:2px}
.lin .imp{font-weight:600;font-size:14px;white-space:nowrap}
aside.cesta .tot{padding:14px 17px 18px;display:flex;flex-direction:column;gap:7px}
aside.cesta .fila{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--tinta-2)}
aside.cesta .gran{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding-top:10px;border-top:2px solid var(--tinta);margin-top:3px}
aside.cesta .gran b{font-family:'Oswald';font-weight:700;font-size:15px;text-transform:uppercase}
aside.cesta .gran i{font-style:normal;font-family:'Oswald';font-weight:700;font-size:26px;line-height:1}

.navpaso{display:flex;gap:9px;flex-wrap:wrap;justify-content:space-between;
  padding:14px 22px 20px;border-top:1px solid var(--linea)}

.gracias{padding:30px 24px;text-align:center}
.gracias h2{font-size:30px;font-weight:700}
.gracias .folio{font-family:'Oswald';font-weight:700;font-size:26px;letter-spacing:.06em;
  background:var(--hueso);border-radius:10px;padding:10px 18px;display:inline-block;margin:12px 0}
.salidas{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:13px;
  margin-top:22px;text-align:left}
.salidas>div{border:1px solid var(--linea);border-radius:11px;padding:15px;background:var(--hueso)}

@media(max-width:900px){ aside.cesta{position:static} .tit h1{font-size:31px} }
@media(max-width:560px){ .tarjetas{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))} }
</style>
</head>

<div class="wrap">

      <div class="kick">Eventos para empresas y grupos</div>
      <h1>Cotiza tu evento</h1>
      <div class="tag">How to be a Mexican?</div>
    </div>
    <ol class="pasos" id="pasos"></ol>
  </div>

<script src="tel-pais.js"></script>
<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function $(i){ return document.getElementById(i); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }
function $$(n){ return '$'+Number(n||0).toLocaleString('es-MX',
  {minimumFractionDigits:2,maximumFractionDigits:2}); }
async function api(path){
  var r=await fetch(SB+'/rest/v1/'+path,{headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  return r.ok ? r.json() : [];
}

/* ====================== EL ESTADO ======================
   Una sola caja con todo lo que el cliente va eligiendo. La cesta y los
   pasos se pintan de aquí; no hay dos verdades. */
var S={
  paso:1, enviado:null, tel:null,
  empresa:'', contacto:'', email:'', idea:'', personas:20,
  fecha1:'', hora1:'', fecha2:'', hora2:'',
  modo:'', recogida:'', recogidaHora:'', regreso:'', regresoHora:'', recorrido:false,
  transpSi:null,                /* ¿hace falta transporte? */
  lugarModo:'preasignado',      /* preasignado | otro_espacio | cliente | propuesta */
  lugarOtro:'',                 /* la dirección que pone el cliente */
  horaIni:'', horaFin:'', comentarios:'',
  veh:{},                       /* id -> unidades */
  expFiltro:'todas', exp:null,  /* {origen,id} */
  espacio:null, oficina:'',
  abSi:null, ab:{}, abTexto:'', abPasillo:'comida', /* carta_id -> {cant, modo} */
  extras:{},                    /* id -> horas */
  ficha:null                    /* {que, id} */
};
var CAT={transportes:[],exps:[],espacios:[],extras:[],reglas:{},carta:[]};
/* PRIMERO QUÉ QUIEREN, LUEGO CÓMO LLEGAN. Javi, 21-nov-2026: «pon primero
   qué experiencia quieren y luego lo del transporte». Preguntar el transporte
   antes de saber a dónde van es pedirle al cliente que decida el camino sin
   saber el destino -y el recargo por ir a su oficina sólo tiene sentido
   cuando ya se sabe si lo elegido es un taller-. */
/* EL ORDEN DE LAS PREGUNTAS ES EL ORDEN EN QUE SE DECIDEN. Javi, 21-nov-2026:
   primero qué quieren, luego dónde se hace -que la propia experiencia ya
   trae-, luego a qué hora, y sólo entonces si hace falta transporte. Antes se
   preguntaba el camino antes que el destino. */
var PASOS=[[1,'Tu evento'],[2,'Experiencia'],[3,'Dónde'],[4,'Horario'],
           [5,'Transporte'],[6,'Alimentos'],[7,'Extras'],[8,'Resumen']];
var TIPOS={gastro:'Talleres gastronómicos',artesanos:'Talleres con artesanos',
           shows:'Shows y bailongos',tour:'Tours',otro:'Otros'};

function regla(k,d){ var v=CAT.reglas[k]; return v==null?d:v; }
function pct(k,d){ return Number(regla(k,d))||d; }

/* ====================== LOS PRECIOS ======================
   Esto es la ESTIMACIÓN que se enseña mientras se arma. El importe que vale
   lo vuelve a calcular corp_solicitar en el servidor al enviar. */
function horasViaje(){
  if(!S.recogidaHora || !S.regresoHora) return null;
  function m(t){ var p=String(t).split(':'); return Number(p[0])*60+Number(p[1]||0); }
  var d=m(S.regresoHora)-m(S.recogidaHora); if(d<0) d+=1440;
  return Math.ceil(d/60);
}
function precioVeh(v,horas){
  var h=Math.max(horas||Number(v.horas_incluidas), Number(v.horas_incluidas));
  return Number(v.precio_base) + Math.max(0,h-Number(v.horas_incluidas))*Number(v.precio_hora_extra);
}
function expElegida(){
  if(!S.exp) return null;
  var r=null; CAT.exps.forEach(function(x){
    if(x.id===S.exp.id && x.origen===S.exp.origen) r=x; });
  return r;
}
/* EL LUGAR LO MANDA LA FICHA, NO EL CLIENTE. Javi, 21-nov-2026: «lo de
   escoger dónde sería sólo para los talleres. Los shows y experiencias deben
   ser en el lugar que viene en su descripción». Así que el paso del lugar -y
   el recargo por desplazarnos- sólo existen cuando lo elegido es un taller. */
function esTaller(e){ return !!e && (e.corp_tipo==='gastro' || e.corp_tipo==='artesanos'); }
function eligeLugar(){ return esTaller(expElegida()); }

function lineas(){
  var L=[], h=horasViaje();

  CAT.transportes.forEach(function(v){
    if(!S.transpSi) return;
    var u=Number(S.veh[v.id]||0); if(!u) return;
    var hh=Math.max(h||Number(v.horas_incluidas), Number(v.horas_incluidas));
    var pu=precioVeh(v,h);
    L.push({g:'Transporte',n:v.nombre+' · '+hh+' h',q:u+' × '+$$(pu),imp:u*pu});
  });
  /* El recorrido con guía no cuesta: Javi, 21-nov-2026, «es sólo considerar
     una nueva ruta». Una línea en cero, no un «por cotizar» -eso diría que
     hay un precio por saber y mandaría al cliente a esperar un número-. */
  if(S.transpSi && S.recorrido) L.push({g:'Transporte',n:'Recorrido turístico con guía',
                          q:'Sin costo · es otra ruta',imp:0});

  var e=expElegida();
  if(e){
    var neto = e.pvp_con_iva==null ? null : Number(e.pvp_con_iva)/1.16;
    L.push({g:'Experiencia',n:e.nombre,q:S.personas+' × '+(neto==null?'—':$$(neto)),
            imp: neto==null?null:Math.round(neto*S.personas*100)/100});
    /* El recargo por desplazarnos sólo cuando de verdad nos desplazamos, y
       sólo en talleres: un show no se mueve de su sitio. */
    if(S.lugarModo==='cliente' && neto!=null && esTaller(e)){
      var p=pct('recargo_oficina_pct',30);
      L.push({g:'Experiencia',n:'Llevarlo a donde ustedes digan (+'+p+'%)',q:'',
              imp:Math.round(neto*S.personas*p)/100});
    }
  }
  /* EL LUGAR, SIEMPRE UNA LÍNEA, AUNQUE NO CUESTE. Que esté en la cesta es lo
     que deja editarlo desde el resumen y lo que lo mete en la proforma. */
  if(e){
    if(S.lugarModo==='preasignado' && (e.lugar_dir||e.lugar_nombre))
      L.push({g:'Lugar',n:e.lugar_dir||e.lugar_nombre,q:'Donde se da siempre',imp:0});
    else if(S.lugarModo==='cliente')
      L.push({g:'Lugar',n:S.lugarOtro||'La dirección que nos den',q:'Lo montamos ahí · por recotizar',imp:null});
    else if(S.lugarModo==='otro_espacio')
      L.push({g:'Lugar',n:S.lugarOtro||'Otro lugar, por buscar',q:'No caben en el de siempre · por recotizar',imp:null});
    else if(S.lugarModo==='propuesta')
      L.push({g:'Lugar',n:'El lugar lo proponemos nosotros',q:'Por recotizar',imp:null});
  }
  Object.keys(S.ab).forEach(function(k){
    var it=S.ab[k]; if(!it||!it.cant) return;
    var p=CAT.carta.filter(function(x){return String(x.id)===String(k);})[0]; if(!p) return;
    var neto=p.precio_incluye_iva ? Number(p.precio_mxn)/1.16 : Number(p.precio_mxn);
    var tot=it.modo==='grupo' ? it.cant : it.cant*S.personas;
    L.push({g:'Alimentos y bebidas',n:p.nombre,
            q:(it.modo==='grupo' ? (it.cant+' en total, al centro')
                                 : (it.cant+' por persona × '+S.personas+' = '+tot)),
            imp:Math.round(tot*neto*100)/100});
  });
  if(S.abTexto.trim()) L.push({g:'Alimentos y bebidas',n:'Menú a la medida',q:'',imp:null});

  CAT.extras.forEach(function(x){
    var hh=Number(S.extras[x.id]||0); if(!hh) return;
    var base=x.precio_incluye_iva?Number(x.precio)/1.16:Number(x.precio);
    var inc=Number(x.horas_incluidas||1);
    var pu=base+Math.max(0,hh-inc)*Number(x.precio_hora_extra||0);
    L.push({g:'Extras',n:x.nombre+' · '+hh+' h',q:'',imp:pu});
  });
  return L;
}
function totales(){
  var L=lineas(), sub=0, porCotizar=[];
  L.forEach(function(l){ if(l.imp==null) porCotizar.push(l.n); else sub+=l.imp; });
  var iva=pct('iva_pct',16);
  return {lineas:L, sub:sub, iva:sub*iva/100, total:sub*(1+iva/100),
          porCotizar:porCotizar, ivaPct:iva};
}

/* LO QUE LA EXPERIENCIA YA TRAE. Javi, 21-nov-2026: «si escogen luchas o
   alguna experiencia que incluye A&B coméntalo cuando vayan a seleccionar A&B
   extra», y lo mismo con el protagonista en extras. Es la misma idea dos
   veces: que nadie pague otra vez por algo que ya está dentro. Sale de la
   ficha y no de una lista escrita aquí; si la ficha no lo dice, no se dice
   nada, que es mejor que prometer una cena que no está. */
function comidaIncluida(e){
  if(!e) return '';
  var p=[];
  if(e.gastro_desc) p.push(String(e.gastro_desc).trim());
  (e.incluye||[]).forEach(function(x){
    if(/aliment|bebid|comida|cena|comid|desayuno|taco|cerveza|degustaci|cata|snack|refriger/i.test(x))
      p.push(String(x).trim());
  });
  var vistos={}, out=[];
  p.forEach(function(x){ var k=x.toLowerCase(); if(x && !vistos[k]){ vistos[k]=1; out.push(x); } });
  return out.join('. ');
}

/* ====================== 3 · DÓNDE SE REALIZA ======================
   Javi, 21-nov-2026: «vamos a unir transporte y espacios; se va a llamar
   ¿dónde se realiza el evento? Todas las experiencias tienen un lugar
   preestablecido. Ojo: ya no pongas el espacio, ahora pones la ubicación —
   Casa Pepe Uruguay 86, Virreyes Izazaga 8».

   El cambio de fondo no es juntar dos pasos: es que el lugar deja de ser una
   pregunta y pasa a ser un dato que la experiencia ya trae. Lo que se
   pregunta es sólo qué hacer cuando ese lugar no sirve, y los tres casos
   acaban igual — hay que recotizar, así que no se cobra el 30%.  */
var LUGARES=[
  ['otro_espacio','No caben, busquen otro lugar','Lo buscamos y les recotizamos.'],
  ['cliente','En nuestras oficinas, hotel u otro sitio','Nos dicen dónde y lo montamos ahí.'],
  ['propuesta','Que lo elijan ustedes','Nos gustaría explorar un sitio que propongan.']
];
function aforoExp(e){ return e && e.cupo_max!=null ? Number(e.cupo_max) : null; }
function caben(e){ var a=aforoExp(e); return a==null || S.personas<=a; }

/* ====================== 4 · EL HORARIO ======================
   Javi: «si el evento tiene un show prefijado, como la lucha libre, se
   comenta aquí que arranca a la hora X y termina a la Y, como en la
   experiencia a la venta. Si el evento es libre, como los talleres,
   mantenemos su hora de inicio y le decimos que termina Y horas después».
   La hora no se inventa nunca: o es la de la ficha, o es la que ellos ponen. */
function masMin(hhmm,min){
  if(!hhmm) return '';
  var p=String(hhmm).split(':'), t=Number(p[0])*60+Number(p[1]||0)+Number(min||0);
  t=((t%1440)+1440)%1440;
  return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');
}
function esShow(e){ return !!e && e.corp_tipo==='shows'; }
function horasFicha(e){
  var hs=(e&&e.horas)||[]; return Array.isArray(hs)?hs.filter(Boolean):[];
}
function pHorario(){
  var e=expElegida();
  var h='<section class="paso"><div class="kick">Paso '+S.paso+'</div><h2>El horario</h2>';
  if(!e) return h+'<div class="nota amb">Primero elige la experiencia.</div></section>';
  var dur=Number(e.duracion_min||0);
  var hs=horasFicha(e), hf=(e.horas_fin||[]);

  if(esShow(e) && hs.length){
    /* Un show no se mueve: su hora es la de la función. */
    h+='<div class="mini">'+esc(e.nombre)+' tiene horario fijo: es un show con función a su hora.</div>'+
      '<div class="ops" style="margin-top:12px">'+hs.map(function(x,i){
        var fin=hf[i]||masMin(x,dur);
        return '<button type="button" class="op'+(S.horaIni===x?' on':'')+'" data-hi="'+esc(x)+'" '+
          'data-hf="'+esc(fin)+'"><b>'+esc(String(x).slice(0,5))+' a '+esc(String(fin).slice(0,5))+'</b>'+
          '<span class="mini">La experiencia arranca y termina a esta hora.</span></button>'; }).join('')+
      '</div>';
  }else{
    h+='<div class="mini">Ustedes ponen la hora de inicio'+
      (dur?(' y nosotros cerramos '+(dur>=60?(Math.round(dur/60*10)/10)+' h':dur+' min')+' después'):'')+'.</div>'+

         hs.map(function(x){return '<b>'+esc(String(x).slice(0,5))+'</b>';}).join(' · ')+'</div>';

  if(S.horaIni){

/* ====================== 8 · EL RESUMEN ======================
   Javi: «finalmente se hace un resumen de la experiencia tipo calendario»,
   con las cinco filas del día, el listado de lo comprado y un hueco para
   comentarios. Y «permitir en cada elemento la opción de editar y regresar»,
   como el check-in de un avión: por eso cada renglón lleva su lápiz. */
function tramos(){
  var e=expElegida(), T=[], dur=Number((e&&e.duracion_min)||0);
  var ini=S.horaIni, fin=S.horaFin||masMin(ini,dur);
  var sitio=(S.lugarModo==='preasignado')
      ? ((e&&(e.lugar_dir||e.lugar_nombre))||'')
      : (S.lugarOtro||'Por definir');
  if(S.transpSi){
    T.push({h:S.recogidaHora,t:'Los recogemos',d:S.recogida||'Punto por definir',p:5});
    var veh=CAT.transportes.filter(function(v){return Number(S.veh[v.id]||0)>0;})
            .map(function(v){ return S.veh[v.id]+' × '+v.nombre; }).join(', ');
    T.push({h:'',t:'Traslado'+(S.recorrido?' con recorrido turístico':''),
            d:veh||'Transporte por definir',p:5});
  }else{
    T.push({h:ini,t:'Llegan por su cuenta',d:sitio,p:5});
  }
  var cosas=[];
  Object.keys(S.ab).forEach(function(k){ var it=S.ab[k]; if(!it||!it.cant) return;
    var pr=CAT.carta.filter(function(x){return String(x.id)===String(k);})[0];
    if(pr) cosas.push(it.cant+' × '+pr.nombre); });
  CAT.extras.forEach(function(x){ var hh=Number(S.extras[x.id]||0);
    if(hh) cosas.push(x.nombre+' ('+hh+' h)'); });
  T.push({h:ini,t:(e?e.nombre:'La experiencia'),d:sitio+
          (dur?(' · '+(dur>=60?(Math.round(dur/60*10)/10)+' h':dur+' min')):'')+
          (cosas.length?(' · con '+cosas.join(', ')):''),p:2});
  T.push({h:fin,t:'Termina la actividad',d:sitio,p:4});
  if(S.transpSi) T.push({h:S.regresoHora,t:'Los regresamos',d:S.regreso||'Punto por definir',p:5});
  return T;
}

  }
  ['f_empresa','f_contacto','f_email','f_idea','f_personas','f_fecha1','f_hora1','f_fecha2','f_hora2']
    .forEach(function(id){ var el=$(id); if(el) el.oninput=function(){ guardaPaso1(); pintaCesta(); }; });

  Array.prototype.forEach.call(document.querySelectorAll('[data-modo]'),function(b){
    b.onclick=function(){ S.modo=b.getAttribute('data-modo');
      if(S.modo!=='recoger'){ S.veh={}; S.recorrido=false; } pinta(); };
  });
  ['f_rec','f_recH','f_reg','f_regH','f_oficina','f_abtexto'].forEach(function(id){
    var el=$(id); if(!el) return;
    el.oninput=function(){
      if(id==='f_rec') S.recogida=el.value;
      if(id==='f_recH') S.recogidaHora=el.value;
      if(id==='f_reg') S.regreso=el.value;
      if(id==='f_regH') S.regresoHora=el.value;
      if(id==='f_oficina') S.oficina=el.value;
      if(id==='f_abtexto') S.abTexto=el.value;
      pintaCesta();
    };
    if(id==='f_recH'||id==='f_regH') el.onchange=function(){ pinta(); };
  });
  var rc=$('f_recorr'); if(rc) rc.onchange=function(){ S.recorrido=rc.checked; pintaCesta(); };

  Array.prototype.forEach.call(document.querySelectorAll('[data-vp]'),function(b){
    b.onclick=function(){ var v=CAT.transportes.filter(function(x){return x.id===b.getAttribute('data-vp');})[0];
      var n=Number(S.veh[v.id]||0)+1; S.veh[v.id]=Math.min(n, Number(v.unidades)); pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-vm]'),function(b){
    b.onclick=function(){ var k=b.getAttribute('data-vm');
      var n=Number(S.veh[k]||0)-1; if(n>0) S.veh[k]=n; else delete S.veh[k]; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-lm]'),function(b){
    b.onclick=function(){ if(b.disabled) return;
      S.lugarModo=b.getAttribute('data-lm');
      if(S.lugarModo!=='otro_espacio' && S.lugarModo!=='cliente') S.lugarOtro='';
      pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-lot]'),function(b){
    b.onclick=function(){ S.lugarOtro=b.getAttribute('data-lot'); S.lugarModo='otro_espacio'; pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ts]'),function(b){
    b.onclick=function(){ S.transpSi=b.getAttribute('data-ts')==='1';
      if(!S.transpSi){ S.veh={}; S.recorrido=false; S.modo='directo'; } pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-hi]'),function(b){
    b.onclick=function(){ S.horaIni=b.getAttribute('data-hi');
      S.horaFin=b.getAttribute('data-hf')||''; pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ir2]'),function(b){
    b.onclick=function(){ S.paso=Number(b.getAttribute('data-ir2'))||2; S.ficha=null; pinta();
      try{ window.scrollTo({top:0,behavior:'smooth'}); }catch(_){ } };});
  var fl=$('f_lugar'); if(fl) fl.oninput=function(){ S.lugarOtro=fl.value; };
  var fc=$('f_coment'); if(fc) fc.oninput=function(){ S.comentarios=fc.value; };
  var fh=$('f_hini'); if(fh) fh.onchange=function(){
    var e=expElegida(); S.horaIni=fh.value;
    S.horaFin=masMin(fh.value, Number((e&&e.duracion_min)||0)); pinta(); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-abp]'),function(b){
    b.onclick=function(){ S.abPasillo=b.getAttribute('data-abp'); pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('[data-ef]'),function(b){
    b.onclick=function(){ S.expFiltro=b.getAttribute('data-ef'); pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-exp]'),function(b){
    b.onclick=function(){ var p=b.getAttribute('data-exp').split('|');
      S.exp = (S.exp && S.exp.id===p[1]) ? null : {origen:p[0], id:p[1]};
      /* La carta también depende de la experiencia: un show no elige espacio
         y su casa la dice su ficha. */
      cargaCarta().then(pinta); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-esp]'),function(b){
    b.onclick=function(){ var id=b.getAttribute('data-esp');
      S.espacio = S.espacio===id ? null : id; cargaCarta().then(pinta); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ab]'),function(b){
    b.onclick=function(){ S.abSi = b.getAttribute('data-ab')==='1'; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-abmas]'),function(b){
    b.onclick=function(){ var k=b.getAttribute('data-abmas');
      var it=S.ab[k]||{cant:0,modo:'persona'}; it.cant++; S.ab[k]=it; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-abmen]'),function(b){
    b.onclick=function(){ var k=b.getAttribute('data-abmen');
      var it=S.ab[k]||{cant:0,modo:'persona'}; it.cant=Math.max(0,it.cant-1);
      if(it.cant) S.ab[k]=it; else delete S.ab[k]; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-abm]'),function(sl){
    sl.onchange=function(){ var k=sl.getAttribute('data-abm');
      var it=S.ab[k]||{cant:0,modo:'persona'}; it.modo=sl.value; S.ab[k]=it; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-exp2]'),function(b){
    b.onclick=function(){ var x=CAT.extras.filter(function(y){return String(y.id)===b.getAttribute('data-exp2');})[0];
      var inc=Number(x.horas_incluidas||1);
      S.extras[x.id] = Number(S.extras[x.id]||0) ? Number(S.extras[x.id])+1 : inc; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-exm]'),function(b){
    b.onclick=function(){ var k=b.getAttribute('data-exm');
      var x=CAT.extras.filter(function(y){return String(y.id)===k;})[0];
      var inc=Number(x.horas_incluidas||1), n=Number(S.extras[k]||0)-1;
      if(n>=inc) S.extras[k]=n; else delete S.extras[k]; pinta(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-ficha]'),function(b){
    b.onclick=function(){ var f=b.getAttribute('data-ficha');
      S.ficha = S.ficha===f ? null : f; pinta(); };
  });
  var fn=$('fichaNo'); if(fn) fn.onclick=function(){ S.ficha=null; pinta(); };

  var a=$('bAnt'); if(a) a.onclick=function(){ guardaPaso1(); S.paso=Math.max(1,S.paso-1); S.ficha=null; pinta(); };
  var s=$('bSig'); if(s) s.onclick=function(){ guardaPaso1(); S.paso=Math.min(6,S.paso+1); S.ficha=null; pinta(); };
  var e=$('bEnviar'); if(e) e.onclick=function(){ envia(e); };
}

/* ====================== ENVIAR ======================
   Lo que se manda es lo ELEGIDO, no los totales: el servidor los recalcula.
   Si el navegador mintiera, no serviría de nada. */
function avisa(txt){
  var n=document.createElement('div');
  n.className='nota roja'; n.innerHTML=txt;
  var nav=$('bEnviar')?$('bEnviar').parentNode:null;
  if(nav) nav.parentNode.insertBefore(n, nav);
  n.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(function(){ if(n.parentNode) n.parentNode.removeChild(n); }, 9000);
}
async function envia(b){
  guardaPaso1();
  if(!S.empresa.trim() || !S.contacto.trim() || !S.email.trim()){
    S.paso=1; pinta(); avisa('Nos faltan la <b>empresa</b>, tu <b>nombre</b> y tu <b>correo</b> para poder cotizarte.'); return;
  }
  if(!S.exp){ S.paso=2; pinta(); avisa('Falta elegir la <b>experiencia</b>.'); return; }
  if(!S.horaIni){ S.paso=4; pinta(); avisa('Falta la <b>hora de inicio</b>. La hora no la inventamos: dinos a qué hora empiezan.'); return; }
  if(S.lugarModo==='cliente' && !String(S.lugarOtro||'').trim()){
    S.paso=3; pinta(); avisa('Si lo montamos donde ustedes digan, hace falta la <b>dirección</b>.'); return; }
  if(S.transpSi===null){ S.paso=5; pinta(); avisa('Dinos si necesitan <b>transporte</b> o llegan directo.'); return; }
  b.disabled=true; b.textContent='Mandando…';
  var payload={
    empresa:S.empresa, contacto:S.contacto, email:S.email,
    telefono: S.tel? S.tel.valor() : '', idea:S.idea, personas:S.personas,
    fecha1:S.fecha1||null, hora1:(S.horaIni||S.hora1||null), fecha2:S.fecha2||null, hora2:S.hora2||null,
    modo_transporte:(S.transpSi?'recoger':(S.lugarModo==='cliente'?'oficina':'directo')),
    lugar_modo:S.lugarModo||'preasignado',
    lugar_nombre:(function(){ var e=expElegida();
      return S.lugarModo==='preasignado' ? ((e&&e.lugar_nombre)||null) : (S.lugarOtro||null); })(),
    lugar_dir:(function(){ var e=expElegida();
      return S.lugarModo==='preasignado' ? ((e&&e.lugar_dir)||null) : (S.lugarOtro||null); })(),
    hora_fin:S.horaFin||null,
    comentarios:S.comentarios||null,
    recogida:{dir:(S.transpSi?S.recogida:''), hora:(S.transpSi?(S.recogidaHora||null):null)},
    regreso:{dir:(S.transpSi?S.regreso:''), hora:(S.transpSi?(S.regresoHora||null):null)},
    recorrido_turistico:!!(S.transpSi && S.recorrido),
    transportes:(S.transpSi?Object.keys(S.veh).map(function(k){ return {id:k, unidades:S.veh[k]}; }):[]),
    experiencia:S.exp||null,
    espacio_id:null,
    oficina:{dir:(S.lugarModo==='cliente'?S.lugarOtro:'')},
    ab:Object.keys(S.ab).map(function(k){ return {carta_id:k, cant:S.ab[k].cant, modo:S.ab[k].modo}; }),
    ab_texto:S.abTexto,
    extras:Object.keys(S.extras).map(function(k){ return {id:k, horas:S.extras[k]}; })
  };
  try{
    var r=await fetch(SB+'/rest/v1/rpc/corp_solicitar',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({payload:payload})});
    var j=await r.json();
    if(!r.ok || !j || j.ok!==true){
      b.disabled=false; b.textContent='Recibir mi cotización →';
      avisa((j&&j.error)||'No pudimos mandar tu solicitud. Vuelve a intentarlo o escríbenos por WhatsApp.');
      return;
    }
    S.enviado=j; pinta();
    /* El correo va aparte, despues de guardar: si Resend falla, la cotizacion
       ya esta dentro y no se pierde la venta. La funcion marca correo_at y no
       se repite. */
    try{
      await fetch(SB+'/functions/v1/corp-correo',{method:'POST',
        headers:{apikey:KEY,'Content-Type':'application/json'},
        body:JSON.stringify({cotizacion_id:j.id})});
    }catch(_e){}
  }catch(x){
    b.disabled=false; b.textContent='Recibir mi cotización →';
    avisa('No pudimos mandar tu solicitud: '+esc(x.message));
  }
}

/* ====================== ARRANQUE ====================== */
async function cargaCarta(){
  /* DE QUÉ CASA ES LA CARTA. Primero el espacio elegido -si lo hay y si su
     carta está encendida en el catálogo-; si no, la casa que diga la ficha de
     la experiencia, para que un show que no elige espacio pueda igualmente
     ofrecer de comer. Si no la dice ninguno, no se inventa: queda el «menú a
     la medida» por cotizar. */
  CAT.carta=[];
  var hid=null;
  if(S.espacio){
    var es=CAT.espacios.filter(function(x){return x.id===S.espacio;})[0];
    if(es && es.corp_carta!==false) hid=es.hotel_id||null;
  }
  if(!hid){ var ex=expElegida(); if(ex) hid=ex.hotel_id||null; }
  if(!hid) return;
  CAT.carta = await api('cosmica_carta?select=id,seccion,grupo,nombre,foto_url,gramaje,precio_mxn,precio_incluye_iva'+
    '&activo=eq.true&hotel_id=eq.'+hid+'&order=seccion,orden&limit=400');
}
(async function(){
  var res=await Promise.all([
    api('corp_transportes?select=*&activo=eq.true&order=orden'),
    api('v_corp_experiencias?select=*'),
    api('v_corp_espacios?select=*'),
    api('op_extras_catalogo?select=*&activo=eq.true&corporativo=eq.true&order=orden'),
    api('corp_reglas?select=clave,valor')
  ]);
  CAT.transportes=res[0]||[]; CAT.exps=res[1]||[]; CAT.espacios=res[2]||[]; CAT.extras=res[3]||[];
  (res[4]||[]).forEach(function(r){ CAT.reglas[r.clave]=r.valor; });
  var wa=String(regla('whatsapp_seguimiento','+525549305703')).replace(/[^0-9]/g,'');
  var nv=$('navWa'); if(nv){ nv.href='https://wa.me/'+wa; nv.target='_blank'; nv.rel='noopener'; }
  pinta();
})();
})();
</script>
