<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · espacios creativos</title>
<meta name="description" content="Coworking del Ateneo de Virreyes: por un día o por una semana.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:900px;margin:0 auto;padding:18px 20px 60px}
.volver{display:inline-flex;gap:7px;align-items:center;font:600 12.5px/1 Oswald,sans-serif;
  text-transform:uppercase;letter-spacing:.06em;color:var(--gris);text-decoration:none;margin:2px 0 14px}
.foto{border-radius:var(--radio);overflow:hidden;background:var(--hueso);aspect-ratio:16/9}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
h1{font:700 30px/1.1 Oswald,sans-serif;text-transform:uppercase;margin:16px 0 4px;color:var(--tinta)}
.sub{font:600 13px/1.3 Oswald,sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--gris)}
.tarifa{display:flex;align-items:baseline;gap:10px;margin:14px 0 2px}
.tarifa b{font:700 34px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
.tarifa s{color:var(--tenue);font-size:17px}
.tarifa .et{align-self:center}
.incluye{list-style:none;padding:0;margin:16px 0 0;display:grid;gap:7px}
.incluye li{display:flex;gap:9px;font-size:14.5px;color:var(--tinta-2)}
.incluye li:before{content:'·';color:var(--naranja);font-weight:700}
.caja{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:18px 20px;margin-top:22px}
.caja h2{font:700 19px/1.2 Oswald,sans-serif;text-transform:uppercase;margin:0 0 4px}
.caja p.ay{color:var(--gris);font-size:13.5px;margin:0 0 14px}
.rejilla{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.rejilla{grid-template-columns:1fr}}
label{display:block;font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gris);margin:0 0 5px}
input,textarea{width:100%;font:400 15px/1.4 Inter,sans-serif;color:var(--tinta);
  border:1.5px solid var(--linea);border-radius:9px;padding:10px 11px;background:#fff;
  box-sizing:border-box}
input:focus,textarea:focus{outline:none;border-color:var(--naranja);
  box-shadow:0 0 0 3px var(--naranja-suave)}
.ancho{grid-column:1/-1}
.bt{display:inline-block;font:600 13px/1 Oswald,sans-serif;letter-spacing:.05em;
  text-transform:uppercase;padding:12px 22px;border-radius:9px;border:2px solid var(--naranja);
  background:var(--naranja);color:#fff;cursor:pointer;margin-top:16px}
.bt:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:14px;border-radius:9px;padding:11px 13px;display:none}
.msg.mal{display:block;background:var(--error-bg);color:var(--error)}
.msg.bien{display:block;background:var(--ok-bg);color:var(--ok)}
.otros{margin-top:26px;display:grid;gap:10px}
.otros a{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  padding:13px 16px;text-decoration:none;color:var(--tinta)}
.otros a b{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase}
.otros a span{font:600 14px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
</style>
</head>
<body>
<main class="env">
  <a class="volver" id="aVolver" href="index.html">← Sincrético</a>
  <div id="cargando" style="color:var(--gris);font-size:14.5px">Abriendo el espacio…</div>

  <div id="todo" class="oculto">
    <div class="foto" id="foto"></div>
    <h1 id="nom"></h1>
    <div class="sub" id="cuando"></div>
    <div class="tarifa" id="tarifa"></div>
    <div style="color:var(--gris);font-size:13px" id="letra"></div>
    <ul class="incluye" id="incluye"></ul>

    <div class="caja">
      <h2>Aparta tu lugar</h2>
      <!-- Todavía no se cobra aquí: se deja la solicitud y el Ateneo confirma.
           El precio NO lo manda esta pantalla, lo calcula la base. -->
      <p class="ay">Nos dices quién eres y qué día vienes, y el Ateneo te
        confirma el lugar y cómo pagarlo. El precio es el de arriba.</p>
      <form id="f" class="rejilla" autocomplete="on">
        <div><label for="fNom">Tu nombre</label>
          <input id="fNom" name="name" required maxlength="80"></div>
        <div><label for="fMail">Correo</label>
          <input id="fMail" name="email" type="email" required maxlength="120"></div>
        <div><label for="fTel">WhatsApp</label><div id="fTelCaja"></div></div>
        <div><label for="fFecha">Día que vienes</label>
          <input id="fFecha" type="date"></div>
        <div><label for="fPers">Cuántos son</label>
          <input id="fPers" type="number" min="1" max="20" value="1"></div>
        <div class="ancho"><label for="fNotas">Algo que debamos saber <span style="text-transform:none">(opcional)</span></label>
          <textarea id="fNotas" rows="2" maxlength="400"></textarea></div>
        <div class="ancho"><button class="bt" id="bEnviar" type="submit">Apartar</button></div>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <div class="otros" id="otros"></div>
  </div>
</main>

<script src="tel-pais.js"></script>
<script>
(function(){
var TEL=null;
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(id){return document.getElementById(id);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){ if(n==null)return '—'; n=Number(n);
  return n===0?'Gratis':'$'+n.toLocaleString('es-MX'); }
function mini(u,w){ if(!u||u.indexOf('/storage/v1/object/public/')<0)return u;
  return u.replace('/storage/v1/object/public/','/storage/v1/render/image/public/')+
         '?width='+w+'&quality=75&resize=cover'; }

var P=new URLSearchParams(location.search);
var PLAN=(P.get('plan')||'day-pass').trim();
var PRUEBA=P.get('prueba')==='1', CODIGO=(P.get('c')||'').trim();
var QS=(PRUEBA?'&prueba=1':'')+(CODIGO?'&c='+encodeURIComponent(CODIGO):'');
$('aVolver').href='index.html'+(QS?('?'+QS.slice(1)):'');

var LISTA=[], YO=null;

async function get(path){
  var r=await fetch(SB+'/rest/v1/'+path,
    {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}

async function arranca(){
  try{ LISTA=await get('v_espacios_creativos?select=*&order=orden'); }
  catch(x){ $('cargando').textContent='No pudimos abrir el espacio. '+x.message; return; }
  YO=LISTA.filter(function(x){return String(x.id)===PLAN;})[0]||LISTA[0];
  if(!YO){ $('cargando').textContent='Ese espacio no está a la venta ahora mismo.'; return; }

  /* El detalle de lo que incluye vive en la vista de planes; si no llega, la
     pantalla sigue vendiendo: el pase es el pase. */
  var inc=[];
  try{
    var pl=await get('v_ateneo_planes_publico?select=slug,incluye&slug=eq.'+encodeURIComponent(YO.id));
    inc=(pl[0]&&pl[0].incluye)||[];
  }catch(_){}

  $('foto').innerHTML=YO.foto_url
    ? '<img src="'+esc(mini(YO.foto_url,1100))+'" alt="'+esc(YO.nombre)+'">' : '';
  $('nom').textContent=YO.nombre;
  $('cuando').textContent=YO.cuando||'';
  var promo=YO.en_promo&&YO.precio_lista!=null&&Number(YO.precio)<Number(YO.precio_lista);
  $('tarifa').innerHTML=(promo?'<s>'+money(YO.precio_lista)+'</s>':'')+
    '<b>'+money(YO.precio)+'</b>'+
    (promo?'<span class="et magenta">-'+esc(YO.descuento_pct)+'%</span>':'');
  $('letra').textContent=(YO.id==='semanal'?'Por una semana, por persona.':'Por un día, por persona.')+
    (promo?' Precio de lanzamiento.':'');
  $('incluye').innerHTML=inc.map(function(t){return '<li>'+esc(t)+'</li>';}).join('');

  var otros=LISTA.filter(function(x){return String(x.id)!==String(YO.id);});
  $('otros').innerHTML=otros.map(function(x){
    return '<a href="espacios.html?plan='+encodeURIComponent(x.id)+(QS||'')+'">'+
      '<b>'+esc(x.nombre)+'</b><span>'+money(x.precio)+'</span></a>';
  }).join('');

  $('cargando').classList.add('oculto');
  $('todo').classList.remove('oculto');
}

$('f').onsubmit=async function(ev){
  ev.preventDefault();
  var m=$('msg'); m.className='msg';
  if(!TEL||!TEL.valido()){ m.className='msg mal'; m.textContent='Nos falta tu WhatsApp con su país: es por donde te confirmamos.'; if(TEL)TEL.foco(); return; }
    var b=$('bEnviar'); b.disabled=true; b.textContent='Apartando…';
  try{
    var r=await fetch(SB+'/rest/v1/rpc/ateneo_solicita_pase',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_plan:String(YO.id),
        p_nombre:$('fNom').value.trim(), p_email:$('fMail').value.trim(),
        p_telefono:TEL.valor(),
        p_fecha:$('fFecha').value||null,
        p_personas:parseInt($('fPers').value,10)||1,
        p_notas:$('fNotas').value.trim()||null})});
    var t=await r.text(), j=null; try{j=t?JSON.parse(t):null;}catch(_){}
    if(!r.ok)throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status));
    var fila=(j&&j[0])||{};

    /* NO SE VENDE LO QUE NO SE COBRA. Javi, 4-oct-2026: «el modelo de reserva
       de daypass no permite hacer el pago por Stripe. No vendas nada que no
       genere pago -a no ser que sea gratis-, aun así debe haber checkout».
       Antes esto acababa en «te escribimos para cobrarlo», que es una venta
       sin cobro y un correo que alguien tiene que acordarse de mandar. Ahora
       la solicitud se crea y de ahí se va derecho a la pasarela, con el
       importe que calculó la base. */
    if(Number(fila.monto||0) > 0){
      b.textContent='Abriendo el pago…';
      m.className='msg'; m.textContent='Te llevamos a la pasarela segura…';
      var c=await fetch(SB+'/functions/v1/ateneo-checkout',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
        body:JSON.stringify({plan:String(YO.id), reserva_id:fila.id})});
      var cj=await c.json().catch(function(){return null;});
      if(c.ok && cj && cj.url){ location.href=cj.url; return; }
      /* Si la pasarela no abre, se dice lo que pasa y se deja volver a
         intentar: la reserva ya está, lo que falta es el cobro. */
      m.className='msg mal';
      m.textContent=((cj&&cj.error)||'No pudimos abrir el pago')+
        '. Tu lugar quedó apartado a nombre de '+esc($('fNom').value.trim())+
        '; escríbenos a javi@casapepe.mx y lo cerramos.';
      b.disabled=false; b.textContent='Reintentar el pago';
      b.onclick=function(){ location.reload(); };
      return;
    }

    m.className='msg bien';
    m.textContent='Listo, '+esc(fila.nombre||YO.nombre)+' queda apartado a tu nombre. '+
      'Te mandamos el pase a '+$('fMail').value.trim()+'.';
    $('f').reset(); $('fPers').value=1;
    b.textContent='Apartado';
  }catch(x){
    m.className='msg mal'; m.textContent=x.message;
    b.disabled=false; b.textContent='Apartar';
  }
};

TEL = telPais.monta('fTelCaja');
arranca();
})();
</script>
</body>
</html>
