<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Contrato · Sincrético</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF7F2; --tinta:#221D18; --tinta-2:#5A514A; --gris:#8A8078;
  --naranja:#F2682A; --magenta:#E2188E; --linea:#E6DED4; --blanco:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6}
.barra{background:var(--blanco);border-bottom:1px solid var(--linea);padding:14px 18px;
  display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
.barra h1{font-family:Oswald,sans-serif;font-size:19px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.barra .folio{margin-left:auto;font-size:12.5px;color:var(--gris)}
.tira{height:4px;background:linear-gradient(90deg,var(--naranja) 0 22%,var(--magenta) 22% 50%,#F6B8D8 50% 74%,#8FC7E8 74% 100%)}
main{max-width:760px;margin:0 auto;padding:22px 18px 90px}
.aviso{border-radius:12px;padding:13px 15px;margin-bottom:18px;font-size:14px}
.aviso.ok{background:#EAF7EF;border:1px solid #BFE4CD;color:#1F5D38}
.aviso.mal{background:#FDECEC;border:1px solid #F3C4C4;color:#8D2222}
.doc{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  padding:26px 26px 30px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.doc h2{font-family:Oswald,sans-serif;font-size:21px;text-transform:uppercase;
  letter-spacing:.02em;margin:0 0 4px}
.doc h3{font-family:Oswald,sans-serif;font-size:15px;text-transform:uppercase;
  letter-spacing:.04em;color:var(--naranja);margin:26px 0 6px}
.doc h4,.doc h5{font-size:14px;margin:18px 0 4px}
.doc p{margin:0 0 11px;font-size:14.5px;color:var(--tinta-2)}
.doc b{color:var(--tinta)}
.doc ul{margin:0 0 12px;padding-left:20px;font-size:14.5px;color:var(--tinta-2)}
.doc li{margin-bottom:3px}
.doc hr{border:0;border-top:1px solid var(--linea);margin:22px 0}
.firma{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  padding:22px;margin-top:20px}
.firma h3{font-family:Oswald,sans-serif;font-size:16px;text-transform:uppercase;margin:0 0 4px}
.rejilla{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:16px 0}
label{display:block;font-size:12px;font-weight:600;color:var(--tinta-2);margin-bottom:4px}
input[type=text]{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:9px;
  font:inherit;font-size:14px;background:var(--papel);color:var(--tinta)}
input[type=text]:focus{outline:2px solid var(--naranja);outline-offset:-1px;border-color:transparent}
.acepta{display:flex;gap:9px;align-items:flex-start;font-size:14px;color:var(--tinta-2);margin:14px 0}
.acepta input{margin-top:3px;width:17px;height:17px;accent-color:var(--naranja);flex:none}
button.firmar{background:var(--naranja);color:#fff;border:0;border-radius:11px;
  padding:14px 26px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button.firmar:disabled{opacity:.45;cursor:not-allowed}
.mini{font-size:12.5px;color:var(--gris)}
.cargando{text-align:center;padding:60px 20px;color:var(--gris)}
@media print{.barra,.firma,.tira{display:none}body{background:#fff}
  .doc{border:0;box-shadow:none;padding:0}}
</style>
</head>
<body>

<header class="barra">
  <h1>Sincrético</h1>
  <span class="folio" id="folio"></span>
</header>
<div class="tira"></div>

<main>
  <div id="avisos"></div>
  <div id="cuerpo" class="cargando">Abriendo el contrato…</div>
  <section class="firma" id="cajaFirma" hidden>
    <h3>Firmar</h3>
    <p class="mini">Revisa que tus datos estén bien. Lo que corrijas aquí queda en el contrato.</p>
    <div class="rejilla">
      <div><label for="razon_social">Razón social</label><input type="text" id="razon_social" autocomplete="organization"></div>
      <div><label for="rfc">RFC</label><input type="text" id="rfc" autocomplete="off" maxlength="13" style="text-transform:uppercase"></div>
      <div><label for="representante">Representante legal</label><input type="text" id="representante" autocomplete="name"></div>
      <div><label for="domicilio">Domicilio fiscal</label><input type="text" id="domicilio" autocomplete="street-address"></div>
      <div><label for="rnt">Registro Nacional de Turismo</label><input type="text" id="rnt"></div>
      <div><label for="titular_cuenta">Titular de la cuenta</label><input type="text" id="titular_cuenta"></div>
    </div>
    <div><label for="firmante">Tu nombre completo, como firma</label>
      <input type="text" id="firmante" autocomplete="name" placeholder="Nombre y apellidos"></div>
    <label class="acepta"><input type="checkbox" id="acepta">
      <span>Leí este contrato completo, los datos del Anexo A son míos y son correctos, y acepto sus términos.</span></label>
    <button class="firmar" id="btnFirmar" disabled>Firmar el contrato</button>
    <p class="mini" style="margin-top:10px">Al firmar se guarda la fecha, tu IP y tu navegador como acuse, y te mandamos copia por correo.</p>
  </section>
</main>

<script>
(function(){
  var FN='https://rehophywchakfapivsbh.supabase.co/functions/v1/operador-contrato';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var TOKEN=new URLSearchParams(location.search).get('t')||'';
  var C=null;

  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function avisa(clase,html){ $('avisos').innerHTML='<div class="aviso '+clase+'">'+html+'</div>'; }

  async function llama(cuerpo){
    var r=await fetch(FN,{method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(cuerpo)});
    var j=await r.json().catch(function(){return {};});
    if(!r.ok||j.error)throw new Error(j.error||('No se pudo (HTTP '+r.status+')'));
    return j;
  }

  function pinta(){
    $('folio').textContent=C.folio||'';
    $('cuerpo').className='doc';
    $('cuerpo').innerHTML=C.cuerpo_html||'';
    if(C.estado==='firmado'){
      var a=C.acuse||{};
      avisa('ok','<b>Contrato firmado.</b> Lo firmó '+esc(C.firmante||'')+
        (a.fecha_local?' el '+esc(a.fecha_local):'')+
        '. Esta página es tu copia: puedes imprimirla o guardarla en PDF.');
      $('cajaFirma').hidden=true;
      return;
    }
    /* Se rellenan con lo que ya sabemos; el operador corrige lo que haga falta. */
    $('cajaFirma').hidden=false;
  }

  function revisa(){
    $('btnFirmar').disabled=!($('acepta').checked && $('firmante').value.trim().length>=5);
  }
  $('acepta').addEventListener('change',revisa);
  $('firmante').addEventListener('input',revisa);

  $('btnFirmar').onclick=async function(){
    $('btnFirmar').disabled=true;
    $('btnFirmar').textContent='Firmando…';
    try{
      await llama({accion:'firmar',token:TOKEN,
        firmante:$('firmante').value.trim(), acepta:true,
        fecha_local:new Date().toLocaleString('es-MX'),
        razon_social:$('razon_social').value.trim(), rfc:$('rfc').value.trim(),
        representante:$('representante').value.trim(), domicilio:$('domicilio').value.trim(),
        rnt:$('rnt').value.trim(), titular_cuenta:$('titular_cuenta').value.trim()});
      C=(await llama({accion:'ver',token:TOKEN})).contrato;
      pinta();
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){
      avisa('mal','No se pudo firmar: '+esc(e.message)+' Si vuelve a pasar, escríbenos y lo resolvemos.');
      $('btnFirmar').disabled=false;
      $('btnFirmar').textContent='Firmar el contrato';
    }
  };

  (async function(){
    if(!TOKEN){
      $('cuerpo').className='';
      avisa('mal','Esta liga está incompleta. Abre la que te llegó por correo, entera.');
      $('cuerpo').innerHTML='';
      return;
    }
    try{
      C=(await llama({accion:'ver',token:TOKEN})).contrato;
      pinta();
    }catch(e){
      $('cuerpo').className='';
      $('cuerpo').innerHTML='';
      avisa('mal','No encontramos ese contrato: '+esc(e.message));
    }
  })();
})();
</script>
</body>
</html>
