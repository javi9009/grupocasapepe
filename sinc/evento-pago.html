<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · pagar</title>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:900px;margin:0 auto;padding:18px 20px 70px}
h1{font:700 24px/1.14 Oswald,sans-serif;text-transform:uppercase;margin:0 0 14px}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}
@media(max-width:760px){.dos{grid-template-columns:1fr;gap:16px}}
.col{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);box-shadow:var(--sombra);padding:18px 20px}
.col h2{font:700 14px/1.2 Oswald,sans-serif;text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;color:var(--tinta)}
.ev{display:flex;gap:12px;align-items:flex-start;margin-bottom:14px}
.ev .pic{width:66px;height:66px;border-radius:10px;background:var(--hueso) center/cover no-repeat;flex:none;border:1px solid var(--linea)}
.ev .nm{font:700 17px/1.15 Oswald,sans-serif;text-transform:uppercase;color:var(--tinta)}
.ev .sub{font-size:13px;color:var(--gris);line-height:1.45;margin-top:4px}
.l{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--tinta-2);padding:5px 0;line-height:1.4}
.l.imp{color:var(--gris);font-size:12.5px}
.l.desc{color:var(--ok)}
.l.tot{border-top:1.5px solid var(--linea);margin-top:9px;padding-top:11px;align-items:baseline}
.l.tot span:first-child{font:700 15px/1 Oswald;text-transform:uppercase;letter-spacing:.05em;color:var(--tinta)}
.l.tot b{font:700 28px/1 Oswald;color:var(--tinta)}
.quien{border-top:1px solid var(--linea);margin-top:14px;padding-top:12px;font-size:13px;color:var(--tinta-2);line-height:1.5}
.quien b{font:600 10px/1.5 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:var(--gris);display:block}
.folio{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:var(--gris);margin-top:10px}
#pe{margin:4px 0 0;min-height:200px}
.bt{display:block;width:100%;font:600 14px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:15px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;cursor:pointer;margin-top:16px;text-decoration:none;text-align:center;box-sizing:border-box}
.bt:disabled{opacity:.5;cursor:default}
.msg{margin-top:12px;font-size:14px;border-radius:9px;padding:11px 13px;display:none;line-height:1.5}
.msg.mal{display:block;background:var(--error-bg);color:var(--error)}
.msg.bien{display:block;background:var(--ok-bg);color:var(--ok)}
.cargando{color:var(--gris);padding:40px 0;text-align:center}
.seguro{font-size:12px;color:var(--gris);text-align:center;margin-top:12px;line-height:1.5}
.esp{height:180px;display:flex;align-items:center;justify-content:center;color:var(--tenue);font-size:13.5px}
</style>
</head>
<body>
<div class="env" id="env"><div class="cargando">Cargando…</div></div>

<script src="https://js.stripe.com/v3/"></script>
<script>
/* LA ÚLTIMA PANTALLA. Javi, 10-oct-2026: «se abre el detalle de la compra y
 * del otro lado para meter la tarjeta y comprar». Dos columnas: a la izquierda
 * qué se está comprando —evento, cuándo, dónde, a nombre de quién, el desglose
 * con el IVA— y a la derecha la tarjeta.
 *
 * Y: «en la siguiente pantalla pone esta info, creo que sobra». La pantalla de
 * ¡Listo! no decía nada que el boleto no diga mejor, así que ya no existe: al
 * pagar se va derecho al boleto con su QR.
 *
 * Los datos de la tarjeta se precargan solos: al darle su correo a Stripe,
 * Link reconoce al comprador que ya pagó antes y le ofrece su tarjeta guardada
 * sin que la vuelva a teclear. La tarjeta nunca pasa por aquí ni por la base.
 */
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var IVA=0.16;
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function mx(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});}
function mx2(n){return '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fFecha(s){ if(!s) return ''; try{ var d=new Date(s);
  var f=d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'});
  return f.charAt(0).toUpperCase()+f.slice(1)+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'});
}catch(_){ return String(s).slice(0,16).replace('T',' '); } }

var P=new URLSearchParams(location.search);
var FOLIO=(P.get('res')||P.get('f')||'').trim().toUpperCase();
var VUELTA=P.get('redirect_status')||'';
var stripe=null, elements=null, CTX=null;

async function fn(accion){
  var r=await fetch(SB+'/functions/v1/evento-checkout',{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
    body:JSON.stringify(Object.assign({folio:FOLIO},accion||{}))});
  var j=null; try{ j=await r.json(); }catch(_){}
  return {ok:r.ok,status:r.status,data:j};
}
function boletoLink(){ return 'evento-boleto.html?f='+encodeURIComponent(FOLIO); }
function alBoleto(){ location.replace(boletoLink()); }
function portada(){
  var f=(CTX&&CTX.evento&&CTX.evento.fotos)||[]; if(!f.length) return '';
  var u=typeof f[0]==='string'?f[0]:(f[0]&&(f[0].url||f[0].src));
  return u||'';
}

function detalle(){
  var ev=CTX.evento||{}, pic=portada();
  var sub=Number(CTX.subtotal||CTX.total||0);
  var tot=Number(CTX.total||0);
  var desc=Math.max(0,sub-tot);
  var iva=tot-(tot/(1+IVA));
  var uni=Number(CTX.unitario||0);
  return '<div class="col">'
    +'<h2>Tu compra</h2>'
    +'<div class="ev">'
      +(pic?'<div class="pic" style="background-image:url(\''+esc(pic)+'\')"></div>':'')
      +'<div><div class="nm">'+esc(ev.nombre||'Evento')+'</div>'
        +'<div class="sub">'+esc(fFecha(ev.fecha_inicio))
        +(ev.espacio?'<br>'+esc(ev.espacio):'')+'</div></div>'
    +'</div>'
    +'<div class="l"><span>'+esc(CTX.tier||'Boleto')+' × '+(CTX.pax||1)
      +(uni?' <span style="color:var(--tenue)">('+mx(uni)+' c/u)</span>':'')+'</span><span>'+mx2(sub)+'</span></div>'
    +(desc>0?'<div class="l desc"><span>Descuento</span><span>−'+mx2(desc)+'</span></div>':'')
    +'<div class="l imp"><span>IVA '+Math.round(IVA*100)+'% incluido</span><span>'+mx2(iva)+'</span></div>'
    +'<div class="l tot"><span>Total</span><b>'+mx(tot)+'</b></div>'
    +'<div class="quien"><b>A nombre de</b>'+esc(CTX.nombre||'—')
      +(CTX.email?'<br>'+esc(CTX.email):'')
      +(CTX.telefono?'<br>'+esc(CTX.telefono):'')+'</div>'
    +(CTX.productora?'<div class="quien"><b>Lo monta</b>'+esc(CTX.productora)+'</div>':'')
    +'<div class="folio">Folio '+esc(CTX.folio||FOLIO)+'</div>'
  +'</div>';
}

async function init(){
  if(!FOLIO){ $('env').innerHTML='<div class="cargando">Falta la reserva.</div>'; return; }
  var c=await fn({accion:'contexto'});
  if(!c.ok||!c.data||c.data.error){ $('env').innerHTML='<div class="cargando">'+esc((c.data&&c.data.error)||'No encontramos tu reserva.')+'</div>'; return; }
  CTX=c.data;
  /* Pagado, o de vuelta de un 3-D Secure que salió bien: al boleto, sin
     pantallas intermedias. */
  if(CTX.pagado || VUELTA==='succeeded'){ alBoleto(); return; }

  $('env').innerHTML='<h1>Pagar</h1><div class="dos">'
    + detalle()
    + '<div class="col"><h2>Con qué pagas</h2>'
      +'<div id="pe"><div class="esp">Abriendo el pago seguro…</div></div>'
      +'<button class="bt" id="pagar" disabled>Pagar '+mx(CTX.total)+'</button>'
      +'<div class="msg" id="msg"></div>'
      +'<div class="seguro">Pago seguro con Stripe. El cobro cae en la cuenta del productor.<br>Si ya compraste antes con este correo, tu tarjeta aparece guardada.</div>'
    +'</div></div>';

  if(!CTX.pk){ msg('El cobro con tarjeta todavía no está configurado. Te mandaremos el enlace de pago.','mal'); return; }
  var pi=await fn({});
  if(!pi.ok||!pi.data||!pi.data.client_secret){ msg((pi.data&&pi.data.error)||'No pudimos abrir el pago. Intenta de nuevo.','mal'); $('pe').innerHTML=''; return; }
  stripe = CTX.cuenta ? Stripe(CTX.pk,{stripeAccount:CTX.cuenta}) : Stripe(CTX.pk);
  elements = stripe.elements({
    clientSecret: pi.data.client_secret,
    appearance:{ theme:'stripe', variables:{
      colorPrimary:'#F2682A', colorText:'#1E1A16', colorDanger:'#9E3B2E',
      fontFamily:'Inter, system-ui, sans-serif', borderRadius:'9px', spacingUnit:'4px' } }
  });
  var pe = elements.create('payment',{
    layout:'tabs',
    /* Con el correo del comprador, Link le ofrece su tarjeta ya guardada. */
    defaultValues:{ billingDetails:{
      name: CTX.nombre || undefined,
      email: CTX.email || undefined,
      phone: CTX.telefono || undefined } }
  });
  $('pe').innerHTML='';
  pe.mount('#pe');
  pe.on('ready',function(){ $('pagar').disabled=false; });
  $('pagar').onclick=pagar;
}
function msg(t,cls){ var m=$('msg'); if(!m)return; m.textContent=t; m.className='msg '+cls; }

async function pagar(){
  $('pagar').disabled=true; msg('Procesando…','bien');
  var r=await stripe.confirmPayment({
    elements:elements,
    confirmParams:{
      return_url: location.origin+location.pathname+'?res='+encodeURIComponent(FOLIO),
      payment_method_data:{ billing_details:{
        name: CTX.nombre || undefined, email: CTX.email || undefined } }
    }
  });
  if(r.error){ msg(r.error.message||'No se pudo cobrar. Revisa tu tarjeta.','mal'); $('pagar').disabled=false; return; }
  /* Si no hubo redirección, el pago quedó hecho aquí mismo. La confirmación de
     verdad la da el webhook; esto solo lleva al boleto. */
  alBoleto();
}
init();
</script>
</body>
</html>
