<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu boleto · Sincrético</title>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:420px;margin:0 auto;padding:22px 20px 60px}
.boleto{background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.cab{background:var(--naranja);color:#fff;padding:16px 18px}
.cab h1{font:700 20px/1.15 Oswald,sans-serif;text-transform:uppercase;margin:0}
.cab .cuando{font-size:13px;opacity:.95;margin-top:3px}
.qr{padding:22px;text-align:center}
.qr canvas,.qr img{width:210px;height:210px;image-rendering:pixelated}
.datos{padding:4px 18px 18px;display:grid;gap:10px}
.dato{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--linea);padding-top:9px}
.dato:first-child{border-top:0;padding-top:0}
.dato label{font:600 10.5px/1.4 Oswald;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.dato b{font-weight:600;text-align:right}
.folio{font-family:ui-monospace,Menlo,monospace}
.aviso{margin:0 18px 18px;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.45}
.aviso.pend{background:var(--error-bg);color:var(--error)}
.cargando{color:var(--gris);padding:50px 0;text-align:center}
.bt{display:block;text-align:center;margin:0 18px 18px;font:600 13px/1 Oswald;letter-spacing:.05em;text-transform:uppercase;padding:13px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;text-decoration:none}
</style>
</head>
<body>
<div class="env" id="env"><div class="cargando">Buscando tu boleto…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fFecha(s){ if(!s)return''; try{ var d=new Date(s); return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(_){ return String(s).slice(0,16).replace('T',' '); } }
var FOL=(new URLSearchParams(location.search).get('f')||'').trim().toUpperCase();

async function rpc(fn,body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  var j=null; try{ j=await r.json(); }catch(_){}
  return r.ok?j:null;
}
async function cargar(){
  if(!FOL){ $('env').innerHTML='<div class="cargando">Falta el folio del boleto.</div>'; return; }
  var b=await rpc('evento_reserva_ver',{p_folio:FOL});
  if(!b){ $('env').innerHTML='<div class="cargando">No encontramos ese boleto.</div>'; return; }
  var pagado=(b.pago_estado==='pagado');
  var ev=b.evento||{};
  $('env').innerHTML='<div class="boleto">'
    +'<div class="cab"><h1>'+esc(ev.nombre||'Evento')+'</h1>'
      +(ev.fecha_inicio?'<div class="cuando">'+esc(fFecha(ev.fecha_inicio))+'</div>':'')+'</div>'
    +(pagado
      ? '<div class="qr" id="qr"></div>'
      : '<div class="aviso pend">Este boleto todavía no está pagado. Termina tu pago para activarlo.</div>')
    +'<div class="datos">'
      +'<div class="dato"><label>Boleto</label><b>'+esc(b.tier||'General')+' × '+(b.pax||1)+'</b></div>'
      +(ev.espacio?'<div class="dato"><label>Dónde</label><b>'+esc(ev.espacio)+'</b></div>':'')
      +'<div class="dato"><label>A nombre de</label><b>'+esc(b.nombre||'—')+'</b></div>'
      +'<div class="dato"><label>Folio</label><b class="folio">'+esc(b.folio||'—')+'</b></div>'
    +'</div>'
    +(pagado?'':'<a class="bt" href="evento-pago.html?res='+encodeURIComponent(b.folio)+'">Pagar ahora</a>')
    +'</div>';
  if(pagado && b.qr_token){
    try{ new QRCode($('qr'),{text:String(b.qr_token),width:210,height:210,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  }
}
cargar();
</script>
</body>
</html>
