<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Tu boleto · Sincrético</title>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<script src="/sinc/sinc-i18n.js"></script>
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:420px;margin:0 auto;padding:22px 20px 60px}
.barraIdioma{max-width:420px;margin:0 auto;padding:14px 20px 0;text-align:right}
.boleto{background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra);overflow:hidden}
.cab{background:var(--naranja);color:#fff;padding:16px 18px}
.cab h1{font:700 20px/1.15 Oswald,sans-serif;text-transform:uppercase;margin:0}
.cab .cuando{font-size:13px;opacity:.95;margin-top:3px}
.qr{padding:22px;text-align:center}
.qr canvas,.qr img{width:210px;height:210px;image-rendering:pixelated}
.datos{padding:4px 18px 18px;display:grid;gap:10px}
.dato{display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:1px solid var(--linea);padding-top:9px}
.dato:first-child{border-top:0;padding-top:0}
.dato label{font:600 10.5px/1.4 Oswald;letter-spacing:.08em;text-transform:uppercase;color:var(--gris)}
.dato b{font-weight:600;text-align:right}
.folio{font-family:ui-monospace,Menlo,monospace}
.aviso{margin:0 18px 18px;border-radius:10px;padding:11px 13px;font-size:13.5px;line-height:1.45}
.aviso.pend{background:var(--error-bg);color:var(--error)}
.cargando{color:var(--gris);padding:50px 0;text-align:center}
.bt{display:block;text-align:center;margin:0 18px 18px;font:600 13px/1 Oswald;letter-spacing:.05em;text-transform:uppercase;padding:13px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);color:#fff;text-decoration:none}
.cta{display:block;text-decoration:none;color:var(--tinta);background:#fff;border:1px solid var(--linea);border-radius:18px;box-shadow:var(--sombra);padding:18px;margin-top:16px}
.cta .ct{font:700 17px/1.15 Oswald,sans-serif;text-transform:uppercase;margin:0}
.cta .cs{font-size:13.5px;color:var(--gris);line-height:1.45;margin:6px 0 13px}
.cta .cb{display:inline-block;font:600 12px/1 Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase;padding:12px 16px;border-radius:9px;background:var(--tinta);color:#fff}
</style>
<!-- AMOR · IR VENIMOS — temporada de Muertos. Se enciende y se apaga
     sola entre el 24 de oct y el 3 de nov (hora de CDMX). Javi, 19-oct-2026. -->
<script src="/cp-muertos.js" data-modo="completa" defer></script>
</head>
<body>
<div class="barraIdioma"><span id="idioma" data-claro></span></div>
<div class="env" id="env"><div class="cargando" data-i18n>Buscando tu boleto…</div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
function T(x){ try{ return window.sincI18n?sincI18n.t(x):x; }catch(_){ return x; } }
try{ sincI18n.conmutador('idioma'); }catch(_){}
try{ sincI18n.barre(); }catch(_){}
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(i){return document.getElementById(i);};
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fFecha(s){ if(!s)return''; try{ var d=new Date(s); return d.toLocaleDateString('es-MX',{weekday:'long',day:'numeric',month:'long'})+' · '+d.toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(_){ return String(s).slice(0,16).replace('T',' '); } }
var FOL=(new URLSearchParams(location.search).get('f')||'').trim().toUpperCase();

async function rpc(fn,body){
  var r=await fetch(SB+'/rest/v1/rpc/'+fn,{method:'POST',
    headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},body:JSON.stringify(body||{})});
  var j=null; try{ j=await r.json(); }catch(_){}
  return r.ok?j:null;
}
async function cargar(){
  if(!FOL){ $('env').innerHTML='<div class="cargando">'+esc(T('Falta el folio del boleto.'))+'</div>'; return; }
  var b=await rpc('evento_reserva_ver',{p_folio:FOL});
  if(!b){ $('env').innerHTML='<div class="cargando">'+esc(T('No encontramos ese boleto.'))+'</div>'; return; }
  /* QUÉ HACE VÁLIDO UN BOLETO. Javi, 26-oct-2026: su boleto de la MUERTEADA
     -entrada libre- decía «todavía no está pagado» y ofrecía pagar $0, que
     terminaba en «esa reserva no tiene importe que cobrar». La reserva estaba
     bien: confirmada, en estado «gratis» y con su hora de pago. Lo que estaba
     mal era esta línea, que sólo daba por bueno «pagado» — y en eventos no
     existe todavía ninguna reserva con ese estado, así que el QR no salía
     nunca, ni en los de pago ni en los libres.
     Un boleto vale cuando no se le debe nada a nadie, no cuando pasó por
     Stripe: gratis, sin cobro o total cero valen igual que pagado. Una
     cancelada no vale, aunque se hubiera pagado. */
  var ev=b.evento||{};
  var cancelada = (b.estado==='cancelada');
  var sinDeuda  = b.pago_estado==='pagado' || b.pago_estado==='gratis' ||
                  b.pago_estado==='sin_cobro' || Number(b.total||0)<=0;
  var pagado    = !cancelada && sinDeuda;
  /* Y sólo se ofrece pagar lo que de verdad se puede pagar. */
  var porPagar  = !cancelada && !sinDeuda && Number(b.total||0)>0;
  $('env').innerHTML='<div class="boleto">'
    +'<div class="cab"><h1>'+esc(ev.nombre||T('Evento'))+'</h1>'
      +(ev.fecha_inicio?'<div class="cuando">'+esc(fFecha(ev.fecha_inicio))+'</div>':'')+'</div>'
    +(pagado
      ? '<div class="qr" id="qr"></div>'
      : cancelada
        ? '<div class="aviso pend">'+esc(T('Este boleto está cancelado.'))+'</div>'
        : '<div class="aviso pend">'+esc(T('Este boleto todavía no está pagado. Termina tu pago para activarlo.'))+'</div>')
    +'<div class="datos">'
      +'<div class="dato"><label>'+esc(T('Boleto'))+'</label><b>'+esc(b.tier||T('General'))+' × '+(b.pax||1)+'</b></div>'
      +(ev.espacio?'<div class="dato"><label>'+esc(T('Dónde'))+'</label><b>'+esc(ev.espacio)+'</b></div>':'')
      +'<div class="dato"><label>'+esc(T('A nombre de'))+'</label><b>'+esc(b.nombre||'—')+'</b></div>'
      +'<div class="dato"><label>'+esc(T('Folio'))+'</label><b class="folio">'+esc(b.folio||'—')+'</b></div>'
    +'</div>'
    +(porPagar?'<a class="bt" href="evento-pago.html?res='+encodeURIComponent(b.folio)+'">'+esc(T('Pagar ahora'))+'</a>':'')
    +'</div>'
    +'<a class="cta" href="/ateneo/app.html'+(b.email?('?email='+encodeURIComponent(b.email)):'')+'">'
      +'<div class="ct">'+esc(T('Conviértete en ateneísta'))+'</div>'
      +'<div class="cs">'+esc(T('Tus boletos, reservar las salas del Ateneo y pedir room service a tu lugar viven en la app. Entra con este mismo correo y date de alta en un toque.'))+'</div>'
      +'<span class="cb">'+esc(T('Abrir mi app del Ateneo'))+'</span></a>';
  try{ sincI18n.barre(); }catch(_){}
  if(pagado && b.qr_token){
    try{ new QRCode($('qr'),{text:String(b.qr_token),width:210,height:210,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
  }
}
cargar();
</script>
</body>
</html>
