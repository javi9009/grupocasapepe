<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMOR · IR VENIMOS — Colección Día de Muertos · Sincrético</title>
<meta name="description" content="Lo que la Ciudad de México hace cuando vuelven: desfiles, catrinas, alebrijes y una noche que no se parece a ninguna otra del año.">
<meta name="theme-color" content="#EE8B0B">
<link rel="icon" type="image/png" href="/dash-192.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=Rye&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cp-muertos.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:#EE8B0B;color:#1E1A16;
  font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px}
.wrap{max-width:1020px;margin:0 auto;padding:0 16px 70px}
.marca{text-align:center;color:#fff;opacity:.82;font-size:11.5px;letter-spacing:.16em;
  text-transform:uppercase;padding:14px 0 2px}
.lienzo{background:#fff;border-radius:20px;padding:20px 18px 26px;margin-top:34px;
  box-shadow:0 2px 2px rgba(30,26,22,.06),0 30px 70px -40px rgba(0,0,0,.9);position:relative}
.lienzo::before,.lienzo::after{content:'';position:absolute;left:0;right:0;height:22px;
  background-repeat:repeat-x;background-size:auto 22px;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='44' viewBox='0 0 60 44'><path fill='%23ffffff' fill-rule='evenodd' d='M0 0 H60 V28 q-15 26 -30 0 q-15 26 -30 0 Z M30 9 a5 5 0 1 0 0.1 0 Z M12 11 L17 18 L12 25 L7 18 Z M48 11 L53 18 L48 25 L43 18 Z'/></svg>")}
.lienzo::before{top:-21px}
.lienzo::after{bottom:-21px;transform:scaleY(-1)}
.cargando{color:#fff;text-align:center;padding:40px 0;opacity:.85}
.pie{color:#fff;opacity:.8;font-size:12.5px;text-align:center;margin-top:26px;line-height:1.6}
.pie a{color:#fff}
.vuelta{display:inline-block;margin-top:16px;font-family:Oswald,Inter,sans-serif;font-weight:600;
  font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-decoration:none;
  border:2px solid rgba(255,255,255,.55);border-radius:9px;padding:9px 16px}
.vuelta:hover{border-color:#fff}
.dm-grupo{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:13px;letter-spacing:.11em;
  text-transform:uppercase;color:#A85C04;margin:4px 0 12px;padding-top:6px}
.dm-grupo+.dm-galeria{margin-bottom:26px}
.dm-cuando{font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:11px;letter-spacing:.09em;
  text-transform:uppercase;color:#A85C04}
.dm-vermas{display:inline-block;margin-top:auto;align-self:flex-start;
  font-family:Oswald,Inter,sans-serif;font-weight:600;font-size:13px;letter-spacing:.05em;
  text-transform:uppercase;background:#EE8B0B;color:#fff;border-radius:9px;padding:9px 15px;
  box-shadow:0 2px 0 rgba(0,0,0,.1)}
.dm-card:hover .dm-vermas{background:#C96F05}
.dm-card.pasada{opacity:.72}
.dm-card.pasada .dm-vermas{background:#EFE7DC;color:#6E665C;box-shadow:none}
.dm-card .dm-cuerpo{gap:7px}
</style>
</head><body>

<div class="dm-picado" aria-hidden="true"></div>
<div class="marca">Sincrético · Casa Pepe</div>

<div class="wrap">
  <header class="dm-portada">
    <h2>AMOR <span class="dm-flor" aria-hidden="true">&#10048;</span> IR<br>VENIMOS</h2>
    <div class="dm-casa" id="firma"></div>
    <p class="dm-bajada" id="bajada">Lo que la ciudad hace cuando vuelven.</p>
  </header>

  <main class="lienzo">
    <div id="app" class="dm-galeria" aria-live="polite"></div>
    <div id="cargando" class="cargando" style="color:#6E665C">Abriendo la colección…</div>
  </main>

  <p class="pie" id="fechas"></p>
  <div style="text-align:center"><a class="vuelta" href="/sinc/">Ver todas las experiencias</a></div>
</div>

<div class="dm-picado abajo" aria-hidden="true" style="margin-top:30px"></div>

<script>
(function(){
  'use strict';
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function money(n){ return n==null||n===''?null:'$'+Math.round(Number(n)).toLocaleString('es-MX'); }

  /* El día se escribe largo porque la pieza es un cartel, no una tabla. */
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
             'septiembre','octubre','noviembre','diciembre'];
  function dia(f){ if(!f)return ''; var p=String(f).split('-');
    return (+p[2])+' de '+MESES[+p[1]-1]; }

  (async function(){
    try{
      var r=await fetch(SB+'/rest/v1/v_sinc_coleccion?select=*&coleccion=eq.dia-de-muertos&order=orden.asc',
        {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
      if(!r.ok) throw new Error('la base respondió '+r.status);
      var L=await r.json();
      $('cargando').style.display='none';

      if(!L.length){
        $('app').innerHTML='<p style="color:#6E665C">Todavía no hay nada publicado en esta colección.</p>';
        return;
      }
      if(L[0].coleccion_bajada) $('bajada').textContent=L[0].coleccion_bajada;
      /* La firma viene de la colecci\u00f3n, no escrita a mano: el d\u00eda que un
         hotel asociado tenga la suya, aqu\u00ed sale su nombre y no el nuestro. */
      $('firma').textContent = L[0].firma || '';
      if(L[0].desde && L[0].hasta)
        $('fechas').textContent='Del '+dia(L[0].desde)+' al '+dia(L[0].hasta)+' · Ciudad de México';

      /* ORDENADO POR FECHA, Y LO PASADO ABAJO. Javi, 19-oct-2026.
         Lo que tiene fecha por delante manda y va primero, de la m\u00e1s
         pr\u00f3xima a la m\u00e1s lejana. Lo que todav\u00eda no est\u00e1 programado no es
         lo mismo que lo que ya pas\u00f3, as\u00ed que va en su propio bloque y se
         dice tal cual. Y al final, lo vivido. */
      var hoy=new Date().toLocaleDateString('en-CA',{timeZone:'America/Mexico_City'});
      var prox=[], sin=[], pas=[];
      L.forEach(function(x){
        if(x.proxima)                       prox.push(x);
        else if(x.ultima && x.ultima < hoy) pas.push(x);
        else                                sin.push(x);
      });
      prox.sort(function(a,b){ return a.proxima < b.proxima ? -1 : a.proxima > b.proxima ? 1 : 0; });
      pas.sort(function(a,b){ return a.ultima > b.ultima ? -1 : a.ultima < b.ultima ? 1 : 0; });

      function cuando(x){
        if(x.proxima) return dia(x.proxima);
        if(x.ultima && x.ultima < hoy) return 'Fue el '+dia(x.ultima);
        return 'Fecha por confirmar';
      }
      function tarjeta(x, apagada){
        var p=money(x.precio);
        return '<a class="dm-card'+(apagada?' pasada':'')+'" href="'+esc(x.liga)+'">'+
          '<div class="dm-foto"'+(x.foto?' style="background-image:url(&quot;'+esc(x.foto)+'&quot;)"':'')+'></div>'+
          '<div class="dm-cuerpo">'+
            '<span class="dm-cuando">'+esc(cuando(x))+(x.tipo==='evento'?' &middot; evento':'')+'</span>'+
            '<h3>'+esc(x.nombre)+'</h3>'+
            (x.resumen?'<p>'+esc(x.resumen)+'\u2026</p>':'')+
            '<span class="dm-vermas">'+(p?esc(p)+' \u00b7 ':'')+(apagada?'Ver la ficha':'Reservar')+'</span>'+
          '</div></a>';
      }
      function bloque(titulo, lista, apagada){
        if(!lista.length) return '';
        return '<h2 class="dm-grupo">'+esc(titulo)+'</h2>'+
               '<div class="dm-galeria">'+lista.map(function(x){return tarjeta(x,apagada);}).join('')+'</div>';
      }

      $('app').className='';
      $('app').innerHTML =
        bloque('Lo que viene', prox, false) +
        bloque('Sin fecha todav\u00eda', sin, false) +
        bloque('Ya pasaron', pas, true);
    }catch(e){
      $('cargando').textContent='No pudimos abrir la colección. Inténtalo en un momento.';
    }
  })();
})();
</script>
</body></html>
