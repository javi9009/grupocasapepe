<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu cotización · Sincrético</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===========================================================================
   LA PROFORMA · Sincrético

   Javi, 21-nov-2026, mandando la proforma de Casa Pepe: «debes de mandar una
   cotización proforma bien hecha con los datos de nuestra empresa y el
   detalle de la compra; tropicalízala a Sincrético».

   Es una página y no un PDF generado a ciegas por dos razones. La primera:
   el cliente entra con su liga y lo que ve es lo que hay AHORA, no lo que
   había el día que se mandó el correo; si cambia algo, su papel cambia con
   él. La segunda: desde aquí puede volver al cotizador y editarla -«el link
   permite entrar a su sesión»-, cosa que un adjunto no sabe hacer.

   Y se imprime. El bloque @media print la deja como el documento que pidió:
   sin botones, sin fondo, en hoja carta. Guardar como PDF es un paso del
   navegador, y ese PDF sí viaja por correo.
   =========================================================================== */
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#FFF;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --mal:#9E3B2E; --mal-bg:#F6E1DD;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.osw{font-family:Oswald,Inter,sans-serif;text-transform:uppercase;letter-spacing:.04em;margin:0}
.hoja{max-width:820px;margin:0 auto;padding:0 18px 70px}
.mini{font-size:12.5px;color:var(--gris);line-height:1.45}

.tapa{background:var(--naranja);color:#fff;padding:34px 0 30px;margin-bottom:22px}
.tapa .hoja{padding-bottom:0}
.tapa .marca{font-family:Oswald;font-weight:700;font-size:15px;letter-spacing:.08em;text-transform:uppercase}
.tapa h1{font-size:34px;margin:14px 0 2px;line-height:1.05}
.tapa .sub{font-size:15px;opacity:.95}
.tapa .folio{font-family:Oswald;font-weight:600;letter-spacing:.09em;font-size:13px;
  background:rgba(255,255,255,.18);border-radius:999px;padding:5px 13px;display:inline-block;margin-top:14px}

.caja{background:var(--blanco);border:1px solid var(--linea);border-radius:13px;
  padding:18px 20px;margin-bottom:16px}
.caja h2{font-size:13px;letter-spacing:.1em;color:var(--gris);margin-bottom:12px}
.dato{display:flex;gap:12px;padding:4px 0;font-size:14px}
.dato .k{flex:0 0 128px;color:var(--gris)}
.dato .v{flex:1;min-width:0}

.tramo{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--linea)}
.tramo:last-child{border-bottom:none}
.tramo .hh{flex:0 0 56px;font-family:Oswald;font-weight:600;font-size:15px;color:var(--naranja-oscuro)}
.tramo .qq{flex:1;min-width:0}
.tramo .qq b{font-size:14.5px}

table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th{font-family:Oswald;font-weight:600;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  color:#fff;background:var(--naranja-oscuro);text-align:left;padding:9px 10px}
table.tb th.i{text-align:right}
table.tb td{padding:9px 10px;border-bottom:1px solid var(--linea);vertical-align:top}
table.tb td.i{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sumas{margin-top:14px;margin-left:auto;max-width:330px}
.sumas .f{display:flex;justify-content:space-between;padding:4px 0;font-size:14.5px}
.sumas .f.tot{border-top:2px solid var(--tinta);margin-top:6px;padding-top:9px}
.sumas .f.tot b{font-family:Oswald;font-size:22px}

.nota{border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:12px}
.nota.verde{background:var(--ok-bg);color:var(--ok)}
.nota.amb{background:var(--alerta-bg);color:var(--alerta)}
.nota.mal{background:var(--mal-bg);color:var(--mal)}
ul.tyc{margin:6px 0 0;padding-left:20px;font-size:13.5px;line-height:1.65}
.banco{background:var(--hueso);border-radius:10px;padding:13px 15px;margin-top:12px;font-size:14px}
.banco b{font-family:Oswald;letter-spacing:.04em}

.barra{position:sticky;bottom:0;background:var(--blanco);border-top:1px solid var(--linea);
  padding:12px 18px;display:flex;gap:9px;flex-wrap:wrap;justify-content:center;z-index:5}
.btn{font-family:Oswald;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.05em;
  padding:11px 19px;border-radius:10px;border:2px solid var(--naranja);background:var(--naranja);
  color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn.fan{background:transparent;color:var(--naranja-oscuro)}
.estado{text-align:center;padding:60px 20px;color:var(--gris)}

@media print{
  body{background:#fff}
  .barra,.noimp{display:none!important}
  .tapa{background:#fff;color:var(--tinta);border-bottom:3px solid var(--naranja);padding:0 0 18px}
  .tapa .folio{background:var(--hueso);color:var(--tinta-2)}
  .caja{border:none;padding:0 0 10px;margin-bottom:10px;break-inside:avoid}
  .hoja{max-width:none;padding:0}
  @page{size:letter;margin:14mm}
}
</style>
</head><body>

<div id="todo"><div class="estado">Cargando tu cotización…</div></div>

<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var T=new URLSearchParams(location.search).get('t')||'';

function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function $$(n){ return n==null?'—':'$'+Number(n).toLocaleString('es-MX',
  {minimumFractionDigits:2,maximumFractionDigits:2})+' MXN'; }
var MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto',
         'septiembre','octubre','noviembre','diciembre'];
function dia(f){ if(!f) return 'fecha por definir';
  var p=String(f).slice(0,10).split('-');
  return (+p[2])+' de '+MES[(+p[1])-1]+' de '+p[0]; }
function hh(t){ return t?String(t).slice(0,5):''; }

var GRUPOS={transporte:'Transporte', experiencia:'Experiencia', lugar:'Lugar',
            ab:'Alimentos y bebidas', extras:'Extras'};

function pinta(d){
  var c=d.cot, R=d.reglas||{}, L=d.lineas||[], S=d.snapshot||{};
  var ant=Number(c.anticipo_pct||R.anticipo_pct||30);
  var anticipo=Number(c.total||0)*ant/100;
  var porCotizar=L.filter(function(l){ return l.importe==null; });

  var h='<div class="tapa"><div class="hoja">'+
    '<div class="marca">'+esc(R.emisor_marca||'Sincrético')+'</div>'+
    '<h1>Cotización</h1>'+
    '<div class="sub">'+esc(c.empresa||'')+(c.contacto?(' · '+esc(c.contacto)):'')+'</div>'+
    '<div class="folio">'+esc(c.folio)+(Number(c.version)>1?(' · versión '+c.version):'')+'</div>'+
    '</div></div><div class="hoja">';

  /* ---- El día, contado como un calendario ---- */
  h+='<div class="caja"><h2>El evento</h2>'+
    fila('Cuándo', esc(dia(c.fecha1))+(c.hora1?(' a las '+esc(hh(c.hora1))):''))+
    fila('Personas','<b>'+(Number(c.personas)||0)+'</b>')+
    fila('Dónde', esc(c.lugar_dir||c.lugar_nombre||'Por definir'))+
    (c.comentarios?fila('Nos pidieron', esc(c.comentarios)):'')+
  '</div>';

  var T2=tramos(c,L);
  if(T2.length)
    h+='<div class="caja"><h2>Cómo va el día</h2>'+T2.map(function(x){
      return '<div class="tramo"><div class="hh">'+esc(x.h||'—')+'</div>'+
        '<div class="qq"><b>'+esc(x.t)+'</b>'+
        (x.d?'<div class="mini">'+esc(x.d)+'</div>':'')+'</div></div>'; }).join('')+'</div>';

  /* ---- El desglose ---- */
  h+='<div class="caja"><h2>El detalle</h2>'+
    '<table class="tb"><thead><tr><th>Concepto</th><th>Detalle</th>'+
    '<th class="i">Importe</th></tr></thead><tbody>';
  Object.keys(GRUPOS).forEach(function(g){
    var del=L.filter(function(l){ return l.etapa===g; });
    del.forEach(function(l){
      h+='<tr><td><b>'+esc(l.nombre)+'</b><div class="mini">'+esc(GRUPOS[g])+'</div></td>'+
        '<td class="mini">'+(Number(l.cantidad)||1)+' · '+esc(l.modo||'')+'</td>'+
        '<td class="i">'+(l.importe==null?'Por cotizar':$$(l.importe))+'</td></tr>';
    });
  });
  h+='</tbody></table>'+
    '<div class="sumas">'+
      '<div class="f"><span>Subtotal</span><span>'+$$(c.subtotal)+'</span></div>'+
      '<div class="f"><span>IVA '+(R.iva_pct||16)+'%</span><span>'+$$(c.iva)+'</span></div>'+
      '<div class="f tot"><span>Gran total</span><b>'+$$(c.total)+'</b></div>'+
    '</div>';
  if(porCotizar.length)
    h+='<div class="nota amb"><b>Pendiente de cotizar</b>, no está sumado arriba: '+
       porCotizar.map(function(l){return esc(l.nombre);}).join(', ')+'.</div>';
  h+='</div>';

  /* ---- Términos. Los de Javi, 21-nov-2026: 30% no reembolsable al reservar
         y el 100% quince días antes, ajustando volúmenes. ---- */
  h+='<div class="caja"><h2>Términos y condiciones</h2><ul class="tyc">'+
    '<li>Precios en pesos mexicanos. El gran total ya incluye impuestos.</li>'+
    (c.apartable===false
      ? '<li><b>Esta cotización es preliminar</b>: falta cerrar el lugar, así que el precio puede '+
        'cambiar y todavía no se puede apartar la fecha con el anticipo.</li>'
      : '<li>Se aparta la fecha con un <b>'+ant+'% no reembolsable</b> ('+$$(anticipo)+').</li>'+
        '<li>El <b>100% se liquida '+(R.saldo_dias_antes||15)+' días antes</b> de la experiencia, '+
        'tras ajustar el número final de personas.</li>')+
    '<li>'+esc(R.propina_nota||'La propina es voluntaria.')+'</li>'+
    '<li>Aceptamos transferencia bancaria.</li>'+
    '</ul>'+
    (c.apartable===false?'':
      '<div class="banco">Banco <b>'+esc(R.emisor_banco||'')+'</b><br>'+
      'CLABE <b>'+esc(R.emisor_clabe||'')+'</b><br>'+
      esc(R.emisor_razon||'')+'</div>')+
  '</div>';

  h+='<div class="caja"><h2>Quién la emite</h2>'+
    fila('Razón social', esc(R.emisor_razon||''))+
    fila('Marca', esc(R.emisor_marca||'Sincrético'))+
    fila('Domicilio', esc(R.emisor_dir||''))+
    fila('Contacto','<a href="mailto:javi@casapepe.mx">javi@casapepe.mx</a>'+
      (R.whatsapp_seguimiento?(' · WhatsApp '+esc(R.whatsapp_seguimiento)):''))+
    '<div class="mini" style="margin-top:10px">Cotización emitida el '+
      esc(dia(c.created_at))+'. Documento sin valor fiscal: la factura se emite al confirmar.</div>'+
  '</div></div>';

  /* ---- La barra: imprimir, editar, escribir ---- */
  var wa=String(R.whatsapp_seguimiento||'+525549305703').replace(/[^0-9]/g,'');
  h+='<div class="barra noimp">'+
    '<button class="btn" id="bImp">Guardar como PDF o imprimir</button>'+
    (c.confirmada||c.archivada ? ''
      : '<a class="btn fan" href="/sinc/empresas.html?t='+encodeURIComponent(T)+'">Editar mi cotización</a>')+
    '<a class="btn fan" href="https://wa.me/'+wa+'?text='+
      encodeURIComponent('Hola, sobre mi cotización '+(c.folio||''))+
      '" target="_blank" rel="noopener">Escribirnos</a>'+
  '</div>';

  document.getElementById('todo').innerHTML=h;
  var bi=document.getElementById('bImp'); if(bi) bi.onclick=function(){ window.print(); };
  document.title='Cotización '+(c.folio||'')+' · Sincrético';
}
function fila(k,v){ return '<div class="dato"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div></div>'; }

/* El mismo día que enseña el cotizador, contado desde lo guardado. */
function tramos(c,L){
  var T=[], sitio=c.lugar_dir||c.lugar_nombre||'Por definir';
  var exp=L.filter(function(l){return l.etapa==='experiencia' && l.tipo!=='recargo';})[0];
  if(c.recogida_dir)
    T.push({h:hh(c.recogida_hora),t:'Los recogemos',d:c.recogida_dir});
  var veh=L.filter(function(l){return l.etapa==='transporte' && l.tipo==='transporte';})
           .map(function(l){return l.nombre;}).join(', ');
  if(veh) T.push({h:'',t:'Traslado'+(c.recorrido_turistico?' con recorrido turístico por la ciudad':''),d:veh});
  if(!c.recogida_dir) T.push({h:hh(c.hora1),t:'Llegan por su cuenta',d:sitio});
  var dentro=L.filter(function(l){return l.etapa==='ab'||l.etapa==='extras';})
              .map(function(l){return l.nombre;});
  T.push({h:hh(c.hora1),t:(exp?exp.nombre:'La experiencia'),
          d:sitio+(dentro.length?(' · con '+dentro.join(', ')):'')});
  if(c.hora_fin) T.push({h:hh(c.hora_fin),t:'Termina la actividad',d:sitio});
  if(c.regreso_dir) T.push({h:hh(c.regreso_hora),t:'Los regresamos',d:c.regreso_dir});
  return T;
}

(async function(){
  if(!T){ document.getElementById('todo').innerHTML=
    '<div class="estado">Falta la liga de tu cotización. Búscala en el correo que te mandamos.</div>'; return; }
  try{
    var r=await fetch(SB+'/rest/v1/rpc/corp_proforma',{method:'POST',
      headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:T})});
    var j=await r.json();
    if(!r.ok||!j||j.ok!==true) throw new Error((j&&j.error)||'No pudimos abrirla.');
    pinta(j);
  }catch(e){
    document.getElementById('todo').innerHTML='<div class="estado">'+esc(e.message)+
      '<br><br>Escríbenos y te la mandamos otra vez.</div>';
  }
})();
})();
</script>
</body></html>
