<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · la comunidad</title>
<meta name="description" content="Las comunidades con las que trabajamos: quiénes son, qué hacen y lo que deja cada viaje.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<meta name="theme-color" content="#FBF7F2">
<script src="sinc-i18n.js"></script>
<style>
/* ============================================================
   LA COMUNIDAD, EN EL ESCAPARATE. Javi, 29-oct-2026: «en esta página
   también sube los módulos de nuestras comunidades pero sin la tienda».

   La misma ficha que ve el huésped en la Apepe -quiénes son, su historia, lo
   que deja el año, su gente y sus talleres-, menos lo único que aquí no
   aplica: la tienda. Las piezas se recogen en la recepción de un hotel de la
   casa; quien mira este escaparate todavía no está alojado, así que
   ofrecerle «pídelo y te lo dejamos en tu cuarto» sería prometer un cuarto
   que no tiene. Lo que sí puede hacer desde aquí es reservar un taller, y
   eso sí está.
   ============================================================ */
.wrapc{max-width:900px;margin:0 auto;padding:22px 20px 70px;}
.volver{display:inline-block;color:var(--gris);font-size:13.5px;margin-bottom:12px;}
.volver:hover{color:var(--naranja-oscuro);}

.port{position:relative;aspect-ratio:16/9;min-height:190px;border-radius:16px;overflow:hidden;
  background:var(--hueso);}
.port img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  /* En una foto de gente lo que importa está en el tercio de arriba. */
  object-position:center 28%;}

h1.nomc{font-family:Oswald,sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
  font-size:27px;line-height:1.1;margin:16px 0 2px;}
.luc{color:var(--gris);font-size:14px;margin:0 0 14px;}
.histc{font-size:15px;line-height:1.7;color:var(--tinta-2);margin:0;}
.histc.corta{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;}
.masc{background:none;border:0;color:var(--naranja-oscuro);font:inherit;font-weight:600;
  text-decoration:underline;cursor:pointer;padding:6px 0 0;}

/* La pila del año: lo mismo que en la Apepe, con la marca de la web. */
.imp{margin:22px 0 0;background:var(--tinta);color:#fff;border-radius:15px;padding:16px 17px;}
.imp .ti{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  font-size:11px;color:#C9C0B4;margin-bottom:9px;}
.imp .cif{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.imp .cif b{font-family:Oswald,sans-serif;font-weight:700;font-size:25px;}
.imp .cif span{font-size:12.5px;color:#CFC7BB;}
.imp .pila{height:9px;border-radius:999px;background:rgba(255,255,255,.18);overflow:hidden;margin-top:7px;}
.imp .pila i{display:block;height:100%;background:var(--naranja);border-radius:999px;}
.imp .deso{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:10px;}
.imp .deso span{font-size:12.5px;color:#CFC7BB;}
.imp .deso b{font-weight:700;color:#fff;}
.imp ul{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;}
.imp li{font-size:13.5px;color:#E8E2D9;display:flex;gap:9px;align-items:baseline;}
.imp li b{font-family:Oswald,sans-serif;font-weight:700;font-size:16px;color:#fff;}

h2.secc{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.06em;
  font-size:14px;color:var(--gris);margin:28px 0 10px;}

.tira{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;}
.tira::-webkit-scrollbar{display:none;}

/* Un taller es un paisaje con gente dentro; una persona es un retrato. */
.expc{flex:0 0 212px;background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;}
.expc .ph{display:block;position:relative;aspect-ratio:16/10;background:var(--hueso);overflow:hidden;}
.expc .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.expc .cu{display:block;padding:10px 11px 12px;}
.expc .nm{display:block;font-weight:700;font-size:14px;line-height:1.3;}
.expc .de{display:block;color:var(--gris);font-size:12px;margin-top:3px;}

.artec{position:relative;flex:0 0 168px;min-height:300px;border:0;padding:0;border-radius:15px;
  overflow:hidden;cursor:pointer;text-align:left;color:#fff;background:var(--tinta);
  box-shadow:var(--sombra);font:inherit;}
.artec img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.artec .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:Oswald,sans-serif;
  font-weight:700;font-size:64px;color:rgba(255,255,255,.26);}
.artec .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,14,.05) 40%,rgba(20,17,14,.84) 92%);}
.artec .tx{position:absolute;left:12px;right:40px;bottom:10px;}
.artec .nm{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  font-size:14.5px;line-height:1.15;display:block;}
.artec .pz{font-size:11px;opacity:.78;display:block;margin-top:2px;}
.artec .mas{position:absolute;right:9px;bottom:9px;width:28px;height:28px;border-radius:50%;
  background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:17px;line-height:1;}

.enl{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px;}
.enl a{background:var(--hueso);color:var(--tinta);border:1px solid var(--linea);border-radius:999px;
  padding:9px 15px;font-size:13px;font-weight:600;white-space:nowrap;}
.enl a:hover{background:var(--naranja-suave);border-color:var(--naranja-suave);}

.otrasc{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding-bottom:3px;}
.otrasc::-webkit-scrollbar{display:none;}
.comuc{position:relative;flex:0 0 200px;min-height:130px;border-radius:14px;overflow:hidden;
  color:#fff;background:var(--tinta);box-shadow:var(--sombra);display:block;}
.comuc img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 28%;}
.comuc .velo{position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,17,14,.05),rgba(20,17,14,.82));}
.comuc .tx{position:absolute;left:12px;right:12px;bottom:10px;}
.comuc .nm{font-family:Oswald,sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.03em;
  font-size:14px;display:block;}
.comuc .lu{font-size:11.5px;opacity:.88;display:block;margin-top:2px;}

/* La ficha de una persona, a pantalla completa. Mismo gesto que en la app. */
.vart{position:fixed;inset:0;background:rgba(20,17,14,.94);display:none;z-index:90;
  overflow-y:auto;flex-direction:column;padding:0 0 env(safe-area-inset-bottom,0px);}
.vart.on{display:flex;}
.vart .cerrar{position:sticky;top:0;align-self:flex-end;background:none;border:0;color:#fff;
  font-size:30px;line-height:1;padding:12px 16px;cursor:pointer;z-index:2;}
.vart .pie{background:var(--papel);border-radius:18px 18px 0 0;padding:18px 20px 30px;margin-top:auto;}
.vart .fart{display:flex;gap:14px;align-items:center;margin-bottom:12px;}
.vart .fart .av{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:0 0 auto;
  background:var(--hueso);display:grid;place-items:center;font-family:Oswald,sans-serif;
  font-weight:700;font-size:27px;color:var(--gris);}
.vart .fart .n{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.03em;font-size:18px;}
.vart .fart .d{color:var(--gris);font-size:12.5px;margin-top:2px;}
.vart .ds{font-size:14.5px;line-height:1.65;color:var(--tinta-2);}
.vart .wa{margin-left:auto;background:var(--ok-bg);color:var(--ok);border-radius:999px;
  padding:8px 13px;font-size:12.5px;font-weight:600;white-space:nowrap;}
.cargandoc{color:var(--tenue);font-size:13px;padding:40px 0;text-align:center;}
</style>
<script src="/cp-foto.js" defer></script>
</head>
<body>

<div class="top">
  <div class="in">
    <a href="index.html" style="display:flex;align-items:center;gap:11px">
      <img class="iso" src="img/sincretico-isotipo-64.png" alt="Sincrético">
      <span><span class="nom">Sincrético</span><span class="lema script">How to be a Mexican?</span></span>
    </a>
    <div class="hueco"></div>
    <span id="idioma"></span>
  </div>
</div>

<div class="wrapc" id="wrap">
  <div class="cargandoc" data-i18n>Cargando…</div>
</div>

<div class="vart" id="vart">
  <button class="cerrar" id="vartX" aria-label="Cerrar" data-i18n-aria="Cerrar">×</button>
  <div class="pie" id="vartPie"></div>
</div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var H={apikey:KEY,Authorization:'Bearer '+KEY};
var ANIO=new Date().getFullYear();
function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function T(t){ try{ return (window.sincI18n&&sincI18n.t)?sincI18n.t(t):t; }catch(_){ return t; } }
function money(n){ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }
function slugDeLaUrl(){
  try{ var p=new URLSearchParams(location.search);
       return (p.get('c')||p.get('comunidad')||'').trim(); }catch(_){ return ''; }
}

var COMUS=[], ARTES=[], IMP=[], EXPS=[], C=null;

Promise.all([
  fetch(SB+'/rest/v1/v_arte_comunidades?select=*',{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];}),
  fetch(SB+'/rest/v1/v_arte_artesanos_publico?select=*',{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];}),
  fetch(SB+'/rest/v1/v_comunidad_impacto?select=*',{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];}),
  fetch(SB+'/rest/v1/v_comunidad_experiencias?select=*',{headers:H}).then(function(r){return r.ok?r.json():[];}).catch(function(){return[];})
]).then(async function(res){
  COMUS=res[0]||[]; ARTES=res[1]||[]; IMP=res[2]||[]; EXPS=res[3]||[];
  /* El nombre, el lugar, el resumen y la historia se piden traducidos antes
     de pintar; si falta la traducción se queda el español, que es lo
     correcto, y `aplica` no lanza nunca. */
  try{
    if(window.sincI18n && sincI18n.aplica && sincI18n.idioma && sincI18n.idioma()!=='es'){
      await Promise.all([
        COMUS.length ? sincI18n.aplica('arte_comunidades', COMUS, {clave:'slug'}) : null,
        /* LA GENTE TAMBIÉN SE TRADUCE. Lo que cuenta cada artesano de sí mismo
           -que es lo que el viajero abre al tocar el «+»- se quedaba siempre en
           español: nadie pedía su traducción. El portal escribe en `bio` y la
           vista pública lo sirve como `semblanza`, así que hay que decirle a
           `aplica` dónde dejarlo. Javi, 29-oct-2026. */
        ARTES.length ? sincI18n.aplica('arte_artesanas', ARTES,
                        {clave:'id', campos:{bio:'semblanza'}}) : null,
        /* Y sus talleres: el nombre del tour ya está traducido en la base, lo
           que faltaba era pedirlo. Si no, «Taller de Alebrijes» se quedaba en
           español dentro de una ficha en inglés. Javi, 29-oct-2026. */
        EXPS.length ? sincI18n.aplica('op_experiencias', EXPS,
                        {clave:'experiencia_id'}) : null
      ]);
    }
  }catch(_){}
  var s=slugDeLaUrl();
  C=COMUS.filter(function(x){ return x.slug===s; })[0] || null;
  pinta();
}).catch(function(){ $('wrap').innerHTML='<div class="cargandoc">'+esc(T('No pudimos cargar la comunidad.'))+'</div>'; });

function pilaHTML(){
  var i=IMP.filter(function(x){ return x.slug===C.slug && Number(x.anio)===ANIO; })[0];
  if(!i || !(Number(i.meta)>0)) return '';
  var meta=Number(i.meta), lleva=Number(i.llevamos||0);
  var pct=Math.max(0,Math.min(100,Math.round(lleva/meta*100)));
  var cons=Array.isArray(i.conceptos)?i.conceptos:[];
  return '<div class="cif"><b>'+esc(money(lleva))+'</b>'+
      '<span>'+esc(T('de {a} en {b}').replace('{a}',money(meta)).replace('{b}',ANIO))+'</span></div>'+
    '<div class="pila"><i style="width:'+pct+'%"></i></div>'+
    (cons.length
      ? '<div class="deso">'+cons.filter(function(x){ return Number(x.monto)>0; }).map(function(x){
          return '<span>'+esc(T(x.concepto))+' <b>'+esc(money(x.monto))+'</b></span>';
        }).join('')+'</div>'
      : '');
}

function impactoHTML(){
  var L=C.impacto; if(typeof L==='string'){ try{ L=JSON.parse(L); }catch(_){ L=null; } }
  var pila=pilaHTML();
  if(!pila && (!Array.isArray(L)||!L.length)) return '';
  return '<div class="imp"><div class="ti">'+esc(T('El impacto'))+'</div>'+pila+
    ((Array.isArray(L)&&L.length)
      ? '<ul>'+L.map(function(x){
          return '<li>'+(x&&x.n?'<b>'+esc(x.n)+'</b>':'')+'<span>'+esc((x&&x.t)||'')+'</span></li>';
        }).join('')+'</ul>'
      : '')+'</div>';
}

function experienciasHTML(){
  var l=EXPS.filter(function(x){ return x.comunidad_slug===C.slug; });
  if(!l.length) return '';
  return '<h2 class="secc">'+esc(T('Sus experiencias'))+'</h2><div class="tira">'+
    l.map(function(x){
      var h=x.duracion_min?(Math.round(x.duracion_min/60*10)/10)+' h':'';
      return '<a class="expc" href="exp.html?id='+esc(x.experiencia_id)+'">'+
        '<span class="ph">'+(x.foto?'<img src="'+esc(x.foto)+'" alt="" loading="lazy">':'')+'</span>'+
        '<span class="cu"><span class="nm">'+esc(x.nombre||'')+'</span>'+
        (h||x.ciudad?'<span class="de">'+esc([h,x.ciudad].filter(Boolean).join(' · '))+'</span>':'')+
        '</span></a>';
    }).join('')+'</div>';
}

function artesanosHTML(){
  var l=ARTES.filter(function(a){ return a.comunidad_slug===C.slug; });
  if(!l.length) return '';
  return '<h2 class="secc">'+esc(T('Su gente'))+'</h2><div class="tira" id="tiraArtes">'+
    l.map(function(a){
      var ini=String(a.nombre||'?').trim().charAt(0).toUpperCase();
      return '<button class="artec" data-arte="'+esc(a.id)+'">'+
        (a.foto_url?'<img src="'+esc(a.foto_url)+'" alt="" loading="lazy">':'<span class="ini">'+esc(ini)+'</span>')+
        '<span class="velo"></span>'+
        '<span class="tx"><span class="nm">'+esc(a.nombre)+'</span>'+
        '<span class="pz">'+esc(a.comunidad||(a.semblanza?T('su historia'):''))+'</span></span>'+
        '<span class="mas" aria-hidden="true">+</span></button>';
    }).join('')+'</div>';
}

function otrasHTML(){
  var l=COMUS.filter(function(x){
    return x.slug!==C.slug && (Number(x.artesanas)>0 || Number(x.piezas)>0 || x.experiencia_id); });
  if(!l.length) return '';
  return '<h2 class="secc">'+esc(T('Otras comunidades con las que colaboramos'))+'</h2>'+
    '<div class="otrasc">'+l.map(function(x){
      return '<a class="comuc" href="comunidad.html?c='+esc(x.slug)+'">'+
        (x.foto_url?'<img src="'+esc(x.foto_url)+'" alt="" loading="lazy">':'')+
        '<span class="velo"'+(x.foto_url?'':' style="background:'+esc(x.color||'#1E1A16')+'"')+'></span>'+
        '<span class="tx"><span class="nm">'+esc(x.nombre)+'</span>'+
        (x.lugar?'<span class="lu">'+esc(T(x.lugar))+'</span>':'')+'</span></a>';
    }).join('')+'</div>';
}

function pinta(){
  if(!C){
    $('wrap').innerHTML='<a class="volver" href="index.html">'+esc(T('Todas las comunidades'))+'</a>'+
      '<div class="cargandoc">'+esc(T('Esa comunidad no está publicada.'))+'</div>';
    return;
  }
  document.title='Sincrético · '+C.nombre;
  var enl=[];
  if(C.instagram) enl.push('<a href="'+esc(C.instagram)+'" target="_blank" rel="noopener">📷 Instagram</a>');
  if(C.web) enl.push('<a href="'+esc(C.web)+'" target="_blank" rel="noopener">🌐 '+esc(T('Su web'))+'</a>');
  if(C.fuente_url) enl.push('<a href="'+esc(C.fuente_url)+'" target="_blank" rel="noopener">📖 '+esc(T('Su historia'))+'</a>');
  if(C.telefono) enl.push('<a href="https://wa.me/'+esc(String(C.telefono).replace(/[^0-9]/g,''))+
    '" target="_blank" rel="noopener">💬 '+esc(C.lider?T('Escribe a {a}').replace('{a}',C.lider):T('Escríbeles'))+'</a>');

  $('wrap').innerHTML=
    '<div class="port">'+(C.foto_url?'<img src="'+esc(C.foto_url)+'" alt="">':'')+'</div>'+
    '<h1 class="nomc">'+esc(C.nombre)+'</h1>'+
    (C.lugar||C.oficio ? '<p class="luc">'+esc([T(C.lugar||''),C.oficio].filter(Boolean).join(' · '))+'</p>' : '')+
    (C.historia?'<p class="histc corta" id="hist">'+esc(C.historia)+'</p>'+
                '<button class="masc" id="masHist">'+esc(T('Leer más'))+'</button>':'')+
    impactoHTML()+
    experienciasHTML()+
    artesanosHTML()+
    (enl.length?'<div class="enl">'+enl.join('')+'</div>':'')+
    (C.contacto?'<p class="luc" style="margin-top:12px">'+esc(C.contacto)+'</p>':'')+
    otrasHTML();

  var m=$('masHist'), t=$('hist');
  if(m&&t){
    if(t.scrollHeight<=t.clientHeight+1) m.style.display='none';
    else m.onclick=function(){
      var ab=t.classList.toggle('corta');
      m.textContent = ab ? T('Leer más') : T('Leer menos');
    };
  }
  Array.prototype.forEach.call(document.querySelectorAll('[data-arte]'),function(b){
    b.onclick=function(){ verArtesano(b.getAttribute('data-arte')); };
  });
  try{ if(window.sincI18n && sincI18n.vigila) sincI18n.vigila(document.body); }catch(_){}
}

/* La ficha de una persona. Aquí no lleva sus piezas: la tienda no vive en
   este escaparate, y enseñar lo que no se puede comprar es una promesa rota.
   Lo que sí lleva es quién es y cómo se le escribe. */
function verArtesano(id){
  var a=ARTES.filter(function(x){ return String(x.id)===String(id); })[0]; if(!a) return;
  var ini=String(a.nombre||'?').trim().charAt(0).toUpperCase();
  var d=[];
  if(a.colectivo) d.push(T('colectivo'));
  if(a.comunidad) d.push(a.comunidad);
  if(a.desde_anio) d.push(T('desde {a}').replace('{a}',a.desde_anio));
  var wa=a.telefono
    ? '<a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+
      esc(String(a.telefono).replace(/[^0-9]/g,''))+'">'+esc(T('Escríbele'))+'</a>' : '';
  $('vartPie').innerHTML=
    '<div class="fart">'+
      (a.foto_url?'<img class="av" src="'+esc(a.foto_url)+'" alt="">':'<span class="av">'+esc(ini)+'</span>')+
      '<div><div class="n">'+esc(a.nombre)+'</div>'+
        (d.length?'<div class="d">'+esc(d.join(' · '))+'</div>':'')+'</div>'+wa+
    '</div>'+
    (a.semblanza?'<div class="ds">'+esc(a.semblanza)+'</div>':'');
  $('vart').classList.add('on');
  try{ $('vart').scrollTop=0; }catch(_){}
}
$('vartX').onclick=function(){ $('vart').classList.remove('on'); };
$('vart').onclick=function(e){ if(e.target===$('vart')) $('vart').classList.remove('on'); };

try{ sincI18n.conmutador('idioma'); }catch(_){}
try{ sincI18n.barre(); }catch(_){}  /* los pocos data-i18n de la cáscara */
try{ sincI18n.titulo(); }catch(_){}
</script>
</body></html>
