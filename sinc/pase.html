<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Entrada · Sincrético</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1E1A16">
<link rel="icon" href="/sinc/img/sincretico-isotipo-64.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entrada">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  LA TABLET DE LA PUERTA. Javi, 7-nov-2026: «una pantalla de escaneo pública
  para los tours... una tablet abierta con la cámara permanente abierta y que
  el cliente ponga su QR debajo y arriba aparezca: Bienvenido, son 2 pax. No
  permitir editar».

  Esta pantalla NO es el lector de boletos. El lector es de quien trabaja: pide
  sesión, enseña historial, deja cobrar cartas y corregir cuántos llegaron.
  Aquí no hay nada de eso a propósito: la tablet está sola en una terraza, de
  cara al huésped, y cualquier cosa que se pueda tocar es una cosa que alguien
  va a tocar. No hay botones que cambien datos, no hay listas, no hay teclado.
  Sólo cámara y una frase grande.

  Y es el SEGUNDO escaneo, no el único. Primero pasa el ateneísta con su gente
  -Capital, en la Noche Mexicana-; esto es el espacio confirmando. Quien la
  autoriza no es una cuenta sino el código del espacio que viaja en la liga, y
  con él sólo se puede confirmar lo que ocurre en ESE espacio y HOY.

  Si el ateneísta no escaneó antes, al huésped se le da la bienvenida igual
  (Javi: «le da la bienvenida igual y se reporta en la programación en ámbar»).
  Un descuadre entre dos empresas no se resuelve dejando a alguien en la calle.
-->
<style>
:root{
  --naranja:#F2682A; --naranja-claro:#FF8A4C;
  --tinta:#15120F; --tinta-2:#231E19;
  --tenue:#9A9089; --linea:#332C25;
  --ok:#34C98A; --ok-fondo:#10301F;
  --ambar:#E9B949; --ambar-fondo:#33270B;
  --malo:#E8705C; --malo-fondo:#331713;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--tinta);color:#fff;
  font-family:Inter,-apple-system,'Segoe UI',system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  /* Una tablet de puerta no se lee, se mira: nada seleccionable, nada que
     arrastrar, ningún menú contextual si alguien deja el dedo encima. */
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}

/* ---- el aviso, arriba y enorme: es lo que mira el huésped ---- */
#aviso{
  flex:0 0 auto;min-height:38vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
  padding:26px 24px;border-bottom:1px solid var(--linea);
  transition:background .25s ease;
}
#aviso.ok{background:var(--ok-fondo)}
#aviso.ambar{background:var(--ambar-fondo)}
#aviso.malo{background:var(--malo-fondo)}
.gigante{
  font-family:Oswald,sans-serif;font-weight:600;letter-spacing:.01em;
  font-size:clamp(34px,7.2vw,78px);line-height:1.05;margin:0;
}
#aviso.ok .gigante{color:var(--ok)}
#aviso.ambar .gigante{color:var(--ambar)}
#aviso.malo .gigante{color:var(--malo)}
.cuantos{
  font-family:Oswald,sans-serif;font-weight:600;
  font-size:clamp(26px,5.4vw,56px);line-height:1.1;margin:10px 0 0;color:#fff;
}
.quien{
  font-size:clamp(16px,2.6vw,26px);margin:12px 0 0;color:#EDE6DE;max-width:24ch;
}
.cual{
  font-family:Oswald,sans-serif;font-size:clamp(13px,1.9vw,19px);
  letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);margin:8px 0 0;
}
.reposo{
  font-family:Oswald,sans-serif;font-weight:500;
  font-size:clamp(22px,4vw,40px);letter-spacing:.03em;color:#EDE6DE;margin:0;
}
.reposo small{
  display:block;font-family:Inter,sans-serif;font-weight:400;letter-spacing:0;
  text-transform:none;font-size:clamp(14px,2.1vw,20px);color:var(--tenue);margin-top:10px;
}

/* ---- el visor ---- */
#visor{flex:1 1 auto;position:relative;background:#000;overflow:hidden;min-height:0}
#lector{position:absolute;inset:0;width:100%!important;height:100%!important}
/* SÓLO AL VÍDEO. Javi, 7-nov-2026: «me aparece el escáner en blanco».
   Aquí estaba: ayer puse a llenar el alto a `#lector>div>div` para quitar unas
   franjas negras, y dentro de #qr-shaded-region hay OCHO div de 5px que son
   los marcadores de esquina del lector, blancos. Al mandarles llenar, los ocho
   se volvieron bloques blancos de 559px tapando la cámara entera. Una regla
   con `*` y `!important` sobre la interfaz de una librería ajena siempre
   acaba así: lo que se quería era el vídeo, y el vídeo es lo único que hay
   que nombrar. */
#lector video{width:100%!important;height:100%!important;object-fit:cover;display:block;
  /* Y traslúcido, que es como lo pidió: en la terraza la pantalla es un
     cartel que da la bienvenida, no un televisor. La cámara se intuye y lo
     que manda es la frase. */
  opacity:.5}
/* html5-qrcode pinta su propio marco y su propia interfaz -botones de
   permiso, selector de cámara-. El marco ya lo dibujamos nosotros, y en una
   tablet de puerta no debe haber nada que tocar. */
#lector #qr-shaded-region{display:none!important}
#lector img,#lector button,#lector select,#lector span[id$="header_message"]{display:none!important}
.mira{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(52vh,62vw);aspect-ratio:1;border-radius:26px;
  /* La máscara de fuera, más suave: el vídeo ya va al 50%, y las dos cosas
     juntas dejaban la esquina casi negra. */
  box-shadow:0 0 0 100vmax rgba(10,8,6,.35);pointer-events:none;
}
.mira i{position:absolute;width:38px;height:38px;border:4px solid rgba(255,255,255,.85)}
.mira i:nth-child(1){top:-2px;left:-2px;border-right:0;border-bottom:0;border-radius:18px 0 0 0}
.mira i:nth-child(2){top:-2px;right:-2px;border-left:0;border-bottom:0;border-radius:0 18px 0 0}
.mira i:nth-child(3){bottom:-2px;left:-2px;border-right:0;border-top:0;border-radius:0 0 0 18px}
.mira i:nth-child(4){bottom:-2px;right:-2px;border-left:0;border-top:0;border-radius:0 0 18px 0}

/* ---- el pie: de quién es esta puerta ---- */
#pie{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;justify-content:center;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:var(--tinta-2);border-top:1px solid var(--linea);
  font-family:Oswald,sans-serif;font-size:clamp(11px,1.6vw,15px);
  letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);
}
#pie b{color:#EDE6DE;font-weight:600}
#pie .punto{width:9px;height:9px;border-radius:50%;background:var(--malo);flex:0 0 auto}
#pie .punto.vivo{background:var(--ok)}

/* En apaisado, que es como va una tablet en un atril, el aviso y la cámara
   van uno al lado del otro: si no, la cámara queda en una rendija. */
@media (orientation:landscape) and (min-width:760px){
  body{flex-direction:row;flex-wrap:wrap}
  #aviso{flex:1 1 44%;min-height:0;height:calc(100% - 44px);border-bottom:0;border-right:1px solid var(--linea)}
  #visor{flex:1 1 56%;height:calc(100% - 44px)}
  #pie{flex:1 1 100%;order:3}
}
</style>
</head>
<body>

<div id="aviso">
  <p class="reposo" id="avisoTxt">Pon tu código debajo<small>Acerca el QR de tu reserva a la cámara</small></p>
</div>

<div id="visor">
  <div id="lector"></div>
  <div class="mira"><i></i><i></i><i></i><i></i></div>
</div>

<div id="pie">
  <!-- El logotipo a color sobre la tinta sale apagado y rojizo. En una barra
       de 17px el nombre escrito se lee mejor que la imagen. -->
  <b>Sincrético</b>
  <span id="pieEsp">—</span>
  <span class="punto" id="pieLuz"></span>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var sb = window.supabase ? supabase.createClient(SB,KEY) : null;
var $=function(i){return document.getElementById(i);};
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

var TOKEN=(new URLSearchParams(location.search).get('e')||'').trim();
var ESPACIO='';

/* El QR de la reserva puede ser una liga o el código pelado. Mismo criterio
   que el lector de boletos: de la liga se sacan los parámetros y los trozos de
   la ruta, y se prueban de más probable a menos. */
function candidatos(txt){
  txt=String(txt||'').trim();
  var out=[];
  if(/^https?:\/\//i.test(txt)){
    try{ var u=new URL(txt);
      u.searchParams.forEach(function(v){ if(v) out.push(v); });
      u.pathname.split('/').filter(Boolean).forEach(function(s){ out.push(decodeURIComponent(s)); });
    }catch(_){}
  } else { out.push(txt); }
  out.push(txt);
  var visto={}, res=[];
  out.forEach(function(s){ s=String(s||'').trim().toUpperCase();
    if(s && s.length>=4 && s.length<=80 && !/\.(HTML?|PHP)$/.test(s) && !visto[s]){ visto[s]=1; res.push(s); } });
  return res;
}

/* ---------- lo que se enseña ---------- */
var VUELVE=null;
function reposo(){
  VUELVE=null;
  $('aviso').className='';
  $('aviso').innerHTML='<p class="reposo">Pon tu código debajo'+
    '<small>Acerca el QR de tu reserva a la cámara</small></p>';
}
/* Siempre vuelve al reposo. Una tablet que se queda con el nombre de alguien
   en pantalla es una tablet que enseña el nombre de alguien a los siguientes
   cuarenta que pasen. */
function pinta(clase, grande, cuantos, quien, cual, segundos){
  if(VUELVE) clearTimeout(VUELVE);
  $('aviso').className=clase||'';
  $('aviso').innerHTML=
    '<p class="gigante">'+esc(grande)+'</p>'+
    (cuantos?'<p class="cuantos">'+esc(cuantos)+'</p>':'')+
    (quien?'<p class="quien">'+esc(quien)+'</p>':'')+
    (cual?'<p class="cual">'+esc(cual)+'</p>':'');
  VUELVE=setTimeout(reposo, (segundos||7)*1000);
}

function personas(n){ n=Number(n||0); return n===1?'1 persona':n+' personas'; }

/* LO QUE ENTRA AHORA, NO EL GRUPO. Javi, 7-nov-2026: «si en la entrada
   editaron su QR y entraron 2 en vez de 3... si luego llega el 3º vería sólo
   el 3º». La base manda `pax` ya como la diferencia y `ya_iban` con los que
   pasaron antes, así que aquí sólo hay que decirlo con palabras. */
function cuenta(d){
  if(d.repetido){
    pinta('ambar','Ya habías entrado', personas(d.pax), d.titular,
      (d.entro_a? 'Entraste a las '+d.entro_a : ''), 7);
    return;
  }
  var ya=Number(d.ya_iban||0);
  var grande = ya>0 ? 'Bienvenido el que faltaba' : 'Bienvenido';
  var cuantos = ya>0
    ? personas(d.pax)+' más'
    : 'Son '+personas(d.pax);
  /* Si abajo ajustaron -compraron 3 y entraron 2- se dice, sin dramatizar:
     el espacio tiene que saber que esperan a uno menos. */
  var pie = d.experiencia || '';
  if(ya>0)               pie = 'Ya van '+Number(d.total||0)+' de '+Number(d.de||0)+' · '+pie;
  else if(d.ajustado)    pie = 'De '+Number(d.de||0)+' que reservaron · '+pie;
  pinta('ok', grande, cuantos, d.titular, pie, 8);
}

var MOTIVOS={
  no_encontrado:['malo','Ese código no es de aquí','','','Comprueba que sea el QR de tu reserva'],
  otro_dia:['malo','Esta reserva no es de hoy','','','Mira la fecha de tu boleto'],
  otro_espacio:['malo','Esta reserva no es de este sitio','','',''],
  no_es_de_doble_escaneo:['malo','Aquí no se valida esta experiencia','','',''],
  cancelada:['malo','Esta reserva está cancelada','','','Habla con el personal'],
  devuelta:['malo','Esta reserva se devolvió','','','Habla con el personal'],
  devolucion_parcial:['ambar','Esta reserva tuvo una devolución','','','Habla con el personal antes de pasar'],
  entrada_desconocida:['malo','Esta pantalla no está dada de alta','','','Avisa a recepción']
};

async function verifica(texto){
  var cands=candidatos(texto);
  if(!cands.length) return;

  for(var i=0;i<cands.length;i++){
    var d=null;
    try{
      var r=await sb.rpc('sinc_entrada_espacio',{p_token:TOKEN, p_codigo:cands[i]});
      d = r.error ? null : r.data;
    }catch(_){ d=null; }
    if(!d) continue;

    if(d.ok){ cuenta(d); return; }
    /* «No lo encuentro» puede ser que el código bueno sea el siguiente de la
       lista; los demás motivos son definitivos y se dicen ya. */
    if(d.motivo && d.motivo!=='no_encontrado'){
      var m=MOTIVOS[d.motivo]||['malo','No se puede validar','','',''];
      pinta(m[0], m[1], m[2], d.titular||m[3], m[4], 8);
      return;
    }
  }
  var nm=MOTIVOS.no_encontrado;
  pinta(nm[0], nm[1], '', '', nm[4], 7);
}

/* ---------- la cámara, abierta toda la noche ---------- */
var ultimo='', ultimoAt=0, ocupado=false, lector=null;

function leido(texto){
  var ahora=Date.now();
  /* El lector dispara varias veces sobre el mismo QR mientras siga delante.
     Ocho segundos es lo que tarda alguien en apartar el teléfono y pasar el
     siguiente; sin esto, el mismo boleto se contaría en bucle. */
  if(ocupado) return;
  if(texto===ultimo && ahora-ultimoAt<8000) return;
  ultimo=texto; ultimoAt=ahora; ocupado=true;
  verifica(texto).catch(function(){}).then(function(){ ocupado=false; });
}

async function arrancaCamara(){
  if(!window.Html5Qrcode){ $('pieLuz').classList.remove('vivo'); return; }
  try{
    if(lector){ try{ await lector.stop(); }catch(_){} try{ lector.clear(); }catch(_){} }
    lector=new Html5Qrcode('lector',{ verbose:false });
    await lector.start(
      { facingMode:'environment' },
      { fps:10, qrbox:function(w,h){ var l=Math.floor(Math.min(w,h)*0.78); return {width:l,height:l}; },
        aspectRatio:undefined, disableFlip:false },
      leido,
      function(){}      /* los «no veo nada» son constantes: no son un fallo */
    );
    $('pieLuz').classList.add('vivo');
  }catch(e){
    $('pieLuz').classList.remove('vivo');
    pinta('malo','La cámara no abre','','','Toca la pantalla para reintentar',20);
  }
}

/* UNA TABLET SE DEJA SOLA Y TIENE QUE SEGUIR AHÍ A LAS DOS DE LA MAÑANA. Tres
   cosas la tumban: que el navegador suspenda la cámara al volver de reposo,
   que el sistema apague la pantalla, y que se pierda el wifi un momento. Las
   tres se vigilan. */
function vigila(){
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible') arrancaCamara();
  });
  window.addEventListener('online', arrancaCamara);
  document.body.addEventListener('click', function(){
    if(!$('pieLuz').classList.contains('vivo')) arrancaCamara();
  });
  /* Cada minuto: si el vídeo dejó de correr, se vuelve a levantar. */
  setInterval(function(){
    var v=document.querySelector('#lector video');
    if(!v || v.readyState===0 || v.paused){ arrancaCamara(); }
  }, 60000);
}

/* Que la pantalla no se duerma. Si el navegador no lo deja, no pasa nada: se
   configura en la tablet y ya. */
var centinela=null;
async function noDormir(){
  try{
    if(!navigator.wakeLock) return;
    centinela=await navigator.wakeLock.request('screen');
    centinela.addEventListener('release', function(){ centinela=null; });
  }catch(_){}
}
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && !centinela) noDormir();
});

async function arranca(){
  if(!sb || !TOKEN){
    pinta('malo','Esta pantalla no está dada de alta','','',
      'Falta el código del espacio en la dirección', 9999);
    return;
  }
  try{
    var r=await sb.rpc('sinc_entrada_espacio',{p_token:TOKEN, p_codigo:''});
    if(r.data && r.data.ok && r.data.espacio){
      ESPACIO=r.data.espacio;
      $('pieEsp').textContent=ESPACIO;
    }else{
      pinta('malo','Esta pantalla no está dada de alta','','','Avisa a recepción',9999);
      return;
    }
  }catch(_){ $('pieEsp').textContent='—'; }

  reposo();
  await arrancaCamara();
  vigila();
  noDormir();
}

arranca();
})();
</script>
</body>
</html>
