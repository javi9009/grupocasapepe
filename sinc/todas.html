<style>
/* Aquí no hay escaparate: es el catálogo entero y se viene a buscar algo
   concreto. Por eso manda la rejilla y no el carril —comparar precios pasando
   tarjetas de lado es imposible— y por eso los filtros son de verdad. */
.cab{max-width:1160px;margin:0 auto;padding:18px 20px 0;display:flex;
  align-items:baseline;gap:12px;flex-wrap:wrap}
.cab h1{font-size:25px}
.cab .mini{margin-left:auto}

.filtro{max-width:1160px;margin:0 auto;padding:14px 20px 0}
.busca{display:flex;align-items:center;gap:10px;background:var(--blanco);
  border:1px solid var(--linea);border-radius:999px;padding:10px 15px;box-shadow:var(--sombra)}
.busca svg{flex:0 0 auto;color:var(--tenue)}
.busca input{flex:1;min-width:0;border:0;background:none;font:inherit;font-size:15px;outline:none}
.busca input::-webkit-search-cancel-button{display:none}

/* La barra compacta: un botón de filtros y, al lado, lo que está puesto. Los
   filtros abiertos ocupaban media pantalla antes de enseñar la primera foto. */
.aplica{display:flex;gap:8px;align-items:center;overflow-x:auto;scrollbar-width:none;
  padding:12px 0 2px;}
.aplica::-webkit-scrollbar{display:none}
.bFiltros{flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  border:1.5px solid var(--tinta);background:var(--blanco);border-radius:999px;
  padding:9px 16px;font:inherit;font-size:14px;font-weight:600;color:var(--tinta);cursor:pointer}
.bFiltros:hover{background:var(--hueso)}
.bFiltros .n{background:var(--tinta);color:#fff;border-radius:999px;min-width:19px;height:19px;
  display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.puesto{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;border:0;
  background:var(--naranja-suave);color:var(--naranja-oscuro);border-radius:999px;
  padding:8px 13px;font:inherit;font-size:13.5px;cursor:pointer}
.puesto i{font-style:normal;font-weight:700;opacity:.7}
.puesto:hover i{opacity:1}

/* La hoja de filtros. En el teléfono sube desde abajo; en pantalla grande es
   una tarjeta en medio. */
.capa{position:fixed;inset:0;background:rgba(30,26,22,.5);z-index:100;display:none;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.capa.on{display:flex}
.hoja{background:var(--blanco);width:100%;max-width:560px;max-height:88vh;
  border-radius:20px 20px 0 0;display:flex;flex-direction:column;
  box-shadow:0 -20px 50px -30px rgba(30,26,22,.7)}
@media(min-width:720px){
  .capa{align-items:center}
  .hoja{border-radius:18px;max-height:84vh}
}
.hoja .cabh{display:flex;align-items:center;gap:12px;padding:18px 22px 4px}
.hoja .cabh h2{font-size:19px}
.hoja .cerrar{margin-left:auto;background:none;border:0;font-size:24px;line-height:1;
  color:var(--gris);cursor:pointer;padding:0 4px}
.hoja .dentro{overflow-y:auto;padding:4px 22px 18px;flex:1}
.hoja .pieh{display:flex;gap:10px;align-items:center;padding:14px 22px;
  border-top:1px solid var(--linea);background:var(--papel);
  border-radius:0 0 18px 18px;padding-bottom:calc(14px + env(safe-area-inset-bottom))}
.hoja .pieh .btn{flex:1}

.grupo{margin-top:16px}
.grupo h3{font-family:Oswald,sans-serif;font-weight:600;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--gris);margin:0 0 8px}
.tiras{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tiras::-webkit-scrollbar{display:none}
.tiras .chip{flex:0 0 auto}

.precio{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.precio input[type=range]{flex:1 1 130px;min-width:110px;accent-color:var(--naranja)}
.precio .val{flex:0 0 auto;font-family:Oswald,sans-serif;font-weight:700;font-size:15px;
  white-space:nowrap;text-align:right}

.dia{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dia input[type=date]{border:1px solid var(--linea);border-radius:999px;padding:7px 14px;
  font:inherit;font-size:13.5px;background:var(--blanco);color:var(--tinta)}

.barra{max-width:1160px;margin:18px auto 0;padding:0 20px;display:flex;align-items:center;
  gap:12px;flex-wrap:wrap}
.barra .n{font-size:13.5px;color:var(--gris)}
.barra select{margin-left:auto;border:1px solid var(--linea);border-radius:999px;
  padding:8px 14px;font:inherit;font-size:13.5px;background:var(--blanco)}
.limpiar{background:none;border:0;font:inherit;font-size:13.5px;color:var(--naranja-oscuro);
  text-decoration:underline;cursor:pointer;padding:0;flex:0 0 auto;white-space:nowrap}

.malla{max-width:1160px;margin:0 auto;padding:18px 20px 80px;
  display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.vacio{padding:60px 20px;text-align:center;color:var(--tenue)}
.vacio b{color:var(--gris);display:block;font-family:Oswald,sans-serif;text-transform:uppercase;
  font-size:14px;letter-spacing:.05em;margin-bottom:6px}

.tarj{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  overflow:hidden;box-shadow:var(--sombra);display:flex;flex-direction:column;
  transition:transform .18s ease,box-shadow .18s ease}
.tarj:hover{transform:translateY(-3px);box-shadow:0 2px 2px rgba(30,26,22,.05),0 20px 34px -22px rgba(30,26,22,.5)}
.tarj .marco{height:158px;position:relative;overflow:hidden;background:var(--hueso)}
.tarj .marco img{width:100%;height:100%;object-fit:cover}
.tarj .marco .sello{position:absolute;top:10px;left:10px}
.tarj .cuerpo{padding:13px 14px 14px;display:flex;flex-direction:column;flex:1;gap:6px}
.tarj .nom{font-family:Oswald,sans-serif;font-weight:700;font-size:15.5px;
  text-transform:uppercase;line-height:1.2}
.tarj .res{font-size:13px;color:var(--gris);line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tarj .don{font-size:12px;color:var(--gris);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tarj .fin{margin-top:auto;padding-top:9px;display:flex;align-items:flex-end;gap:10px;
  border-top:1px dashed var(--linea)}
.tarj .cuando{font-size:11.5px;color:var(--naranja-oscuro);font-weight:600;line-height:1.3}
.tarj .cuando.gris{color:var(--tenue);font-weight:400}
.tarj .pre{margin-left:auto;font-family:Oswald,sans-serif;font-weight:700;font-size:16px;
  white-space:nowrap;text-align:right}
.tarj .pre small{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:9.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--tenue)}
.tarj .pre s{display:block;font-family:Inter,sans-serif;font-weight:400;font-size:11px;color:var(--tenue)}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;
  background:rgba(251,247,242,.97);backdrop-filter:blur(12px) saturate(1.6);
  border-top:1px solid var(--linea);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 4px 8px;font-size:10.5px;color:var(--gris);font-weight:500;
  font-family:Oswald,sans-serif;letter-spacing:.05em;text-transform:uppercase}
.tabbar a.on{color:var(--naranja-oscuro)}
.tabbar a svg{width:21px;height:21px}
body{padding-bottom:64px}
@media(min-width:900px){.tabbar{display:none}body{padding-bottom:0}}
</style>

<script>
(function(){
'use strict';
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var P=new URLSearchParams(location.search);
var PRUEBA=!(P.get('prueba')==='0'||P.get('prueba')==='no');
var QS=PRUEBA?'&prueba=1':'';
var CODIGO=(function(){var q=(P.get('c')||'').trim();
  try{ if(q)sessionStorage.setItem('sinc_c',q); else q=sessionStorage.getItem('sinc_c')||''; }catch(_){}
  return q;})();
var QC=CODIGO?'&c='+encodeURIComponent(CODIGO):'';

var CAT=[], TOPE=0, SALIDAS=null;
var F={q:'',fam:'Todo',tip:'Todo',pre:null,cuando:'',fecha:'',orden:'reco'};

function $(i){return document.getElementById(i);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){return n==null?'—':'$'+Number(n).toLocaleString('es-MX');}
function hdr(){return {'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'};}
async function rpc(f,b){
  var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',headers:hdr(),body:JSON.stringify(b||{})});
  var t=await r.text(), j=null; try{j=t?JSON.parse(t):null;}catch(_){}
  if(!r.ok)throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status));
  return j;
}
function mini(u,a){
  if(!u||u.indexOf('/storage/v1/object/public/')<0)return u;
  return u.replace('/storage/v1/object/public/','/storage/v1/render/image/public/')+
         '?width='+a+'&quality=72&resize=cover';
}
var MESC=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var DIAS=['dom','lun','mar','mié','jue','vie','sáb'];
function deYmd(s){var p=String(s).slice(0,10).split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+
  String(d.getDate()).padStart(2,'0');}
function cuando(f,h){
  if(!f)return null;
  var d=deYmd(f), hoy=new Date(); hoy.setHours(0,0,0,0);
  var dif=Math.round((d-hoy)/86400000), hora=h?' · '+String(h).slice(0,5):'';
  if(dif===0)return 'Hoy'+hora;
  if(dif===1)return 'Mañana'+hora;
  if(dif<7)return DIAS[d.getDay()]+' '+d.getDate()+hora;
  return DIAS[d.getDay()]+' '+d.getDate()+' '+MESC[d.getMonth()]+hora;
}
function fams(e){return e.familias||[];}
function liga(e){return 'exp.html?id='+esc(e.id)+QS+QC;}
function hueco(e){
  var g='g'+((String(e.id).charCodeAt(0)+String(e.id).charCodeAt(1))%5+1);
  return '<div class="sinfoto '+g+'" style="position:absolute;inset:0">'+
         '<div class="ini">'+esc(String(e.nombre||'S').trim().charAt(0).toUpperCase())+'</div></div>';
}
function marco(e){
  if(!e.portada)return hueco(e);
  return '<img src="'+esc(mini(e.portada,520))+'" alt="'+esc(e.nombre)+'" loading="lazy"'+
    ' onerror="this.insertAdjacentHTML(\'afterend\',this.getAttribute(\'data-hueco\'));this.remove()"'+
    ' data-hueco="'+esc(hueco(e))+'">';
}

/* ---------- los filtros ---------- */
/* El tope del precio se saca del catálogo, no de un número inventado: si el
   tour más caro vale 1.800, no tiene sentido ofrecer una barra hasta 10.000. */
function topePrecio(){
  var m=0; CAT.forEach(function(e){ if(e.pvp_adulto>m)m=Number(e.pvp_adulto); });
  return Math.ceil(m/100)*100 || 1000;
}
function precioDe(v){ return Math.round(TOPE*v/100/50)*50; }

function pintaChips(){
  var fam=[], tip=[];
  CAT.forEach(function(e){
    fams(e).forEach(function(f){ if(fam.indexOf(f)<0)fam.push(f); });
    if(e.tipologia&&tip.indexOf(e.tipologia)<0)tip.push(e.tipologia);
  });
  fam.sort(); tip.sort();
  function tira(cont,lista,cual){
    $(cont).innerHTML=['Todo'].concat(lista).map(function(x){
      return '<button class="chip'+(F[cual]===x?' on':'')+'" data-v="'+esc(x)+'">'+esc(x)+'</button>';
    }).join('');
    Array.prototype.forEach.call($(cont).querySelectorAll('.chip'),function(b){
      b.onclick=function(){ F[cual]=b.getAttribute('data-v'); pinta(); };
    });
  }
  tira('fFam',fam,'fam');
  tira('fTip',tip,'tip');

  var CU=[['','Cualquier día'],['hoy','Hoy'],['manana','Mañana'],['semana','Esta semana']];
  $('fCuando').innerHTML=CU.map(function(c){
    return '<button class="chip'+(F.cuando===c[0]&&!F.fecha?' on':'')+'" data-v="'+c[0]+'">'+
           esc(c[1])+'</button>';}).join('');
  Array.prototype.forEach.call($('fCuando').querySelectorAll('.chip'),function(b){
    b.onclick=async function(){
      F.cuando=b.getAttribute('data-v'); F.fecha=''; $('fFecha').value='';
      SALIDAS=null; pinta();
    };
  });
}

/* ---------- qué pasa el filtro ---------- */
function pasa(e){
  if(F.q){
    var q=F.q.toLowerCase();
    var texto=[e.nombre,e.resumen,e.tipologia,e.barrio,e.salida_desde,e.operador]
      .concat(fams(e)).filter(Boolean).join(' ').toLowerCase();
    if(texto.indexOf(q)<0)return false;
  }
  if(F.fam!=='Todo'&&fams(e).indexOf(F.fam)<0)return false;
  if(F.tip!=='Todo'&&e.tipologia!==F.tip)return false;
  if(F.pre!=null&&F.pre<TOPE){
    if(e.pvp_adulto==null)return false;
    if(Number(e.pvp_promo!=null?e.pvp_promo:e.pvp_adulto)>F.pre)return false;
  }
  if(F.fecha){ return !!(SALIDAS&&SALIDAS[e.id]); }
  if(F.cuando){
    if(!e.proxima_fecha)return false;
    var d=deYmd(e.proxima_fecha), hoy=new Date(); hoy.setHours(0,0,0,0);
    var dif=Math.round((d-hoy)/86400000);
    if(F.cuando==='hoy'&&dif!==0)return false;
    if(F.cuando==='manana'&&dif!==1)return false;
    if(F.cuando==='semana'&&(dif<0||dif>7))return false;
  }
  return true;
}
function ordena(l){
  var o=F.orden;
  function pre(e){ return Number(e.pvp_promo!=null?e.pvp_promo:e.pvp_adulto); }
  if(o==='az')    return l.sort(function(a,b){return String(a.nombre).localeCompare(String(b.nombre),'es');});
  if(o==='pronto')return l.sort(function(a,b){
    return (a.proxima_fecha?0:1)-(b.proxima_fecha?0:1) ||
           String(a.proxima_fecha||'').localeCompare(String(b.proxima_fecha||''));});
  if(o==='barato'||o==='caro'){
    return l.sort(function(a,b){
      var x=pre(a), y=pre(b);
      /* Lo que no tiene precio va al final en los dos sentidos: no es ni lo más
         barato ni lo más caro, es que todavía no se sabe. */
      if(isNaN(x)&&isNaN(y))return 0;
      if(isNaN(x))return 1;
      if(isNaN(y))return -1;
      return o==='barato'?x-y:y-x;
    });
  }
  return l; /* como vienen: el catálogo ya los ordena por lo completa que está la ficha */
}

function tarjeta(e){
  var c=cuando(e.proxima_fecha,e.proxima_hora);
  var hay=e.pvp_promo!=null&&e.pvp_adulto!=null&&Number(e.pvp_promo)<Number(e.pvp_adulto);
  return '<a class="tarj" href="'+liga(e)+'">'+
    '<div class="marco">'+marco(e)+
      '<span class="sello et '+(e.proxima_fecha?'naranja':'')+'">'+esc(e.tipologia||'Experiencia')+'</span>'+
    '</div>'+
    '<div class="cuerpo">'+
      '<div class="nom">'+esc(e.nombre)+'</div>'+
      (e.resumen?'<div class="res">'+esc(e.resumen)+'</div>':'')+
      ((e.barrio||e.salida_desde)?'<div class="don">📍 '+esc(e.barrio||e.salida_desde)+'</div>':'')+
      '<div class="fin">'+
        '<span class="cuando'+(c?'':' gris')+'">'+(c?esc(c):'Sin fechas publicadas')+'</span>'+
        '<span class="pre">'+(hay?'<s>'+money(e.pvp_adulto)+'</s>'+money(e.pvp_promo)
                                :money(e.pvp_adulto))+'<small>por persona</small></span>'+
      '</div>'+
    '</div></a>';
}

function hayFiltro(){
  return !!(F.q||F.fam!=='Todo'||F.tip!=='Todo'||F.cuando||F.fecha||(F.pre!=null&&F.pre<TOPE));
}

/* Lo que está puesto, dicho en la barra. Cada uno se quita solo, sin abrir la
   hoja: es lo que se hace nueve de cada diez veces. */
var CUNOM={hoy:'Hoy',manana:'Mañana',semana:'Esta semana'};
function puestos(){
  var l=[];
  if(F.fam!=='Todo') l.push(['fam',F.fam]);
  if(F.tip!=='Todo') l.push(['tip',F.tip]);
  if(F.pre!=null&&F.pre<TOPE) l.push(['pre','Hasta '+money(F.pre)]);
  if(F.fecha) l.push(['fecha',(function(){var d=deYmd(F.fecha);
    return d.getDate()+' '+MESC[d.getMonth()];})()]);
  else if(F.cuando) l.push(['cuando',CUNOM[F.cuando]||F.cuando]);
  return l;
}
function quita(cual){
  if(cual==='fam')F.fam='Todo';
  if(cual==='tip')F.tip='Todo';
  if(cual==='pre'){F.pre=TOPE;$('fPre').value=100;}
  if(cual==='fecha'){F.fecha='';$('fFecha').value='';SALIDAS=null;}
  if(cual==='cuando')F.cuando='';
  pinta();
}
function pintaAplica(){
  var l=puestos();
  $('nFiltros').textContent=l.length;
  $('nFiltros').classList.toggle('oculto',!l.length);
  var viejos=$('aplica').querySelectorAll('.puesto');
  Array.prototype.forEach.call(viejos,function(x){x.remove();});
  l.forEach(function(x){
    var b=document.createElement('button');
    b.className='puesto';
    b.innerHTML=esc(x[1])+' <i>×</i>';
    b.onclick=function(){quita(x[0]);};
    $('aplica').appendChild(b);
  });
}

function pinta(){
  pintaChips();
  pintaAplica();
  var l=ordena(CAT.filter(pasa).slice());
  var dice=l.length+(l.length===1?' experiencia':' experiencias')+
    (hayFiltro()?' de '+CAT.length:'');
  $('cuenta').textContent=dice;
  $('bVer').textContent=l.length?('Ver '+dice.split(' de ')[0]):'Nada con eso';
  $('bVer').disabled=!l.length;
  $('bLimpia').classList.toggle('oculto',!hayFiltro());
  $('malla').innerHTML=l.map(tarjeta).join('');
  $('vacio').classList.toggle('oculto',!!l.length);
  $('preVal').textContent=(F.pre==null||F.pre>=TOPE)?'Cualquiera':'Hasta '+money(F.pre);
}

function abreHoja(v){
  $('capa').classList.toggle('on',v);
  document.body.style.overflow=v?'hidden':'';
}

async function arranca(){
  var carga=sincCargando.monta('cargando',{pie:'Trayendo el catálogo…'});
  try{ CAT=await rpc(PRUEBA?'sinc_catalogo_prueba':'sinc_catalogo',{p_dias:120})||[]; }
  catch(x){ carga.para(); $('cargando').textContent='No pudimos cargar el catálogo. '+x.message; return; }
  try{ await sincI18n.aplica('op_experiencias',CAT); }catch(_){}
  try{ sincI18n.conmutador('idioma'); }catch(_){}
  try{ sincI18n.apunta('escaparate'); }catch(_){}
  carga.para();
  $('cargando').classList.add('oculto');
  $('todo').classList.remove('oculto');

  TOPE=topePrecio();
  F.pre=TOPE;
  $('fPre').value=100;

  /* Si llega con algo puesto desde la portada, se respeta. */
  if(P.get('fam'))F.fam=P.get('fam');
  if(P.get('q')){ F.q=P.get('q'); $('q').value=F.q; }

  var t=null;
  $('q').oninput=function(){
    var v=this.value.trim();
    clearTimeout(t); t=setTimeout(function(){ F.q=v; pinta(); },200);
  };
  $('fPre').oninput=function(){ F.pre=precioDe(Number(this.value)); pinta(); };
  $('fOrden').onchange=function(){ F.orden=this.value; pinta(); };
  $('bLimpia').onclick=function(){
    F={q:F.q,fam:'Todo',tip:'Todo',pre:TOPE,cuando:'',fecha:'',orden:F.orden};
    $('fPre').value=100; $('fFecha').value=''; SALIDAS=null; pinta();
  };
  $('bFiltros').onclick=function(){ abreHoja(true); };
  $('bCerrar').onclick=function(){ abreHoja(false); };
  $('bVer').onclick=function(){ abreHoja(false); };
  $('capa').onclick=function(e){ if(e.target===this)abreHoja(false); };
  document.addEventListener('keydown',function(e){ if(e.key==='Escape')abreHoja(false); });
  /* Un día concreto no se puede contestar con el catálogo, que solo guarda la
     próxima salida de cada experiencia: hay que preguntar por ese día. */
  $('fFecha').onchange=async function(){
    F.fecha=this.value; F.cuando='';
    if(!F.fecha){ SALIDAS=null; pinta(); return; }
    $('cuenta').textContent='Mirando ese día…';
    try{
      var filas=await rpc('sinc_salidas_dia',{p_fecha:F.fecha})||[];
      SALIDAS={}; filas.forEach(function(f){ SALIDAS[f.experiencia_id]=true; });
    }catch(_){ SALIDAS={}; }
    pinta();
  };

  pinta();
}
arranca().catch(function(x){ $('cargando').textContent=String((x&&x.message)||x); });
})();
</script>
