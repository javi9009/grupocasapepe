<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sincrético · el evento</title>
<meta name="description" content="Eventos en el Ateneo de Virreyes, Ciudad de México.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="icon" href="img/sincretico-isotipo-64.png">
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Lobster+Two:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sinc.css">
<script src="/sinc/sinc-i18n.js"></script>
<meta name="theme-color" content="#FBF7F2">
<style>
.env{max-width:900px;margin:0 auto;padding:18px 20px 60px}
.volver{display:inline-flex;gap:7px;align-items:center;font:600 12.5px/1 Oswald,sans-serif;
  text-transform:uppercase;letter-spacing:.06em;color:var(--gris);text-decoration:none;margin:2px 0 14px}
.foto{border-radius:var(--radio);overflow:hidden;background:var(--hueso);aspect-ratio:16/9}
.foto img{width:100%;height:100%;object-fit:cover;display:block}
h1{font:700 30px/1.1 Oswald,sans-serif;text-transform:uppercase;margin:16px 0 6px;color:var(--tinta)}
.datos{display:grid;gap:8px;margin:12px 0 0}
.datos div{display:flex;gap:10px;font-size:14.5px;color:var(--tinta-2)}
.datos b{font:600 11px/1.5 Oswald,sans-serif;letter-spacing:.09em;text-transform:uppercase;
  color:var(--gris);min-width:92px;flex:none}
.desc{font-size:15.5px;line-height:1.62;color:var(--tinta-2);margin:16px 0 0}
.tarifa{display:flex;align-items:baseline;gap:10px;margin:16px 0 0}
.tarifa b{font:700 32px/1 Oswald,sans-serif;color:var(--naranja-oscuro)}
.caja{background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  box-shadow:var(--sombra);padding:18px 20px;margin-top:22px}
.caja h2{font:700 19px/1.2 Oswald,sans-serif;text-transform:uppercase;margin:0 0 4px}
.caja p.ay{color:var(--gris);font-size:13.5px;margin:0 0 14px}
.rejilla{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:620px){.rejilla{grid-template-columns:1fr}}
label{display:block;font:600 11px/1 Oswald,sans-serif;letter-spacing:.09em;
  text-transform:uppercase;color:var(--gris);margin:0 0 5px}
input,textarea{width:100%;font:400 15px/1.4 Inter,sans-serif;color:var(--tinta);
  border:1.5px solid var(--linea);border-radius:9px;padding:10px 11px;background:#fff;
  box-sizing:border-box}
input:focus,textarea:focus{outline:none;border-color:var(--naranja);
  box-shadow:0 0 0 3px var(--naranja-suave)}
.ancho{grid-column:1/-1}
.bt{display:inline-block;font:600 13px/1 Oswald,sans-serif;letter-spacing:.05em;
  text-transform:uppercase;padding:12px 22px;border-radius:9px;border:2px solid var(--naranja);
  background:var(--naranja);color:#fff;cursor:pointer;margin-top:16px}
.bt:disabled{opacity:.55;cursor:default}
.msg{margin-top:12px;font-size:14px;border-radius:9px;padding:11px 13px;display:none}
.msg.mal{display:block;background:var(--error-bg);color:var(--error)}
.msg.bien{display:block;background:var(--ok-bg);color:var(--ok)}
.otros{margin-top:26px;display:grid;gap:10px}
.otros a{display:flex;justify-content:space-between;align-items:center;gap:12px;
  background:#fff;border:1px solid var(--linea);border-radius:var(--radio);
  padding:13px 16px;text-decoration:none;color:var(--tinta)}
.otros a b{font:700 15px/1.2 Oswald,sans-serif;text-transform:uppercase}
.otros a span{font:600 13px/1 Oswald,sans-serif;color:var(--gris)}
</style>
</head>
<body>
<main class="env">
  <div style="text-align:right;margin:0 0 8px"><span id="idioma" data-claro></span></div>
  <a class="volver" id="aVolver" href="index.html">← Sincrético</a>
  <div id="cargando" style="color:var(--gris);font-size:14.5px" data-i18n>Abriendo el evento…</div>

  <div id="todo" class="oculto">
    <div class="foto" id="foto"></div>
    <h1 id="nom"></h1>
    <div class="datos" id="datos"></div>
    <p class="desc" id="desc"></p>
    <!-- LO QUE DEJA EN EL BARRIO. La productora lo declara en su ficha; aquí
         sale contado en una frase, sin cifras ni promesas. Javi, 4-oct-2026. -->
    <div id="impacto"></div>
    <div class="tarifa" id="tarifa"></div>

    <div class="caja">
      <h2 data-i18n>Pide tu lugar</h2>
      <!-- Los eventos del Ateneo todavía no se cobran en línea: se pide el
           lugar y el Ateneo confirma y cobra. El monto lo calcula la base a
           partir del precio del evento, no esta pantalla. -->
      <p class="ay" data-i18n="Dejas tus datos y el Ateneo te confirma el lugar y cómo pagarlo. No se cobra nada ahora.">Dejas tus datos y el Ateneo te confirma el lugar y cómo
        pagarlo. No se cobra nada ahora.</p>
      <form id="f" class="rejilla" autocomplete="on">
        <div><label for="fNom" data-i18n>Tu nombre</label>
          <input id="fNom" name="name" required maxlength="80"></div>
        <div><label for="fMail" data-i18n>Correo</label>
          <input id="fMail" name="email" type="email" required maxlength="120"></div>
        <div><label for="fTel">WhatsApp</label><div id="fTelCaja"></div></div>
        <div><label for="fPers" data-i18n>Cuántos van</label>
          <input id="fPers" type="number" min="1" max="20" value="1"></div>
        <div class="ancho"><label for="fNotas"><span data-i18n>Algo que debamos saber</span> <span style="text-transform:none" data-i18n>(opcional)</span></label>
          <textarea id="fNotas" rows="2" maxlength="400"></textarea></div>
        <div class="ancho"><button class="bt" id="bEnviar" type="submit" data-i18n>Pedir lugar</button></div>
      </form>
      <div class="msg" id="msg"></div>
    </div>

    <div class="otros" id="otros"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="sinc-cuenta.js"></script>
<script src="evento-compra.js"></script>
<script src="tel-pais.js"></script>
<script>
(function(){
var TEL=null;
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(id){return document.getElementById(id);};
function T(x){ try{ return window.sincI18n?sincI18n.t(x):x; }catch(_){ return x; } }
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){ if(n==null)return '—'; n=Number(n);
  return n===0?T('Gratis'):'$'+n.toLocaleString('es-MX'); }
function mini(u,w){ if(!u||u.indexOf('/storage/v1/object/public/')<0)return u;
  return u.replace('/storage/v1/object/public/','/storage/v1/render/image/public/')+
         '?width='+w+'&quality=75&resize=cover'; }
/* Siempre en hora de la Ciudad de México: el evento pasa ahí, no donde esté
   el teléfono de quien lo lee. */
function cuandoMx(iso,conHora){
  if(!iso)return '';
  var d=new Date(iso); if(isNaN(d))return '';
  var o={timeZone:'America/Mexico_City',weekday:'long',day:'numeric',month:'long'};
  if(conHora){o.hour='2-digit';o.minute='2-digit';o.hour12=false;}
  return new Intl.DateTimeFormat('es-MX',o).format(d);
}

var P=new URLSearchParams(location.search);
var ID=(P.get('id')||'').trim();
var PRUEBA=P.get('prueba')==='1', CODIGO=(P.get('c')||'').trim();
var QS=(PRUEBA?'&prueba=1':'')+(CODIGO?'&c='+encodeURIComponent(CODIGO):'');
$('aVolver').href='index.html'+(QS?('?'+QS.slice(1)):'');

var LISTA=[], YO=null;
try{ sincI18n.conmutador('idioma'); }catch(_){}
try{ sincI18n.barre(); }catch(_){}

async function get(path){
  var r=await fetch(SB+'/rest/v1/'+path,
    {headers:{apikey:KEY,Authorization:'Bearer '+KEY}});
  if(!r.ok)throw new Error('La base respondió '+r.status);
  return r.json();
}

async function arranca(){
  try{ LISTA=await get('v_concierge_eventos?select=*&order=fecha_inicio'); }
  catch(x){ $('cargando').textContent=T('No pudimos abrir el evento. ')+x.message; return; }
  /* traduce nombre/descripcion del evento por su id (tabla eventos) */
  try{ await sincI18n.aplica('eventos', LISTA); }catch(_){}
  YO=LISTA.filter(function(e){return String(e.id)===ID;})[0];
  if(!YO){
    $('cargando').innerHTML=esc(T('Este evento ya no está a la venta. '))+
      '<a href="index.html'+(QS?('?'+QS.slice(1)):'')+'" style="color:var(--naranja-oscuro);font-weight:600">'+
      esc(T('Mira lo que sí hay'))+'</a>.';
    return;
  }

  $('foto').innerHTML=YO.foto_url
    ? '<img src="'+esc(mini(YO.foto_url,1100))+'" alt="'+esc(YO.nombre)+'">' : '';
  $('nom').textContent=YO.nombre;

  var multi=YO.fecha_fin && String(YO.fecha_fin).slice(0,10)!==String(YO.fecha_inicio).slice(0,10);
  var filas=[];
  /* «CUÁNDO: h». Javi lo vio en la ficha de la sala de música: un espacio que
     se renta por horas no tiene fecha, y esta fila la daba por hecha —pegaba
     una 'h' a una fecha vacía y eso era todo lo que se leía—. Cuando no hay
     fecha, lo que hay que decir es el horario en que se puede reservar. */
  var DIAS_C={1:'L',2:'M',3:'X',4:'J',5:'V',6:'S',7:'D'};
  if(!YO.fecha_inicio && Number(YO.precio_por_hora||0)>0){
    var dd=Array.isArray(YO.dias_semana)&&YO.dias_semana.length
      ? YO.dias_semana.slice().sort(function(a,b){return a-b;}).map(function(n){return DIAS_C[n]||'';}).join(' ')
      : T('todos los días');
    var hh=(YO.hora_desde&&YO.hora_hasta)
      ? (' · '+String(YO.hora_desde).slice(0,5)+'–'+String(YO.hora_hasta).slice(0,5)) : '';
    filas.push([T('Cuándo'), dd+hh+(YO.min_horas?(' · '+T('mínimo ')+YO.min_horas+' h'):'')]);
  }else{
    filas.push([T('Cuándo'), multi
      ? (cuandoMx(YO.fecha_inicio,false)+' → '+cuandoMx(YO.fecha_fin,false))
      : cuandoMx(YO.fecha_inicio,true)+' h']);
  }
  if(YO.espacio)   filas.push([T('Dónde'),  YO.espacio+' · Ateneo de Virreyes']);
  if(YO.productora)filas.push([T('Lo monta'), YO.productora]);
  if(YO.cupo_total||YO.cupo) filas.push([T('Cupo'), (YO.cupo_total||YO.cupo)+' '+T('lugares')]);
  $('datos').innerHTML=filas.map(function(f){
    return '<div><b>'+esc(f[0])+'</b><span>'+esc(f[1])+'</span></div>';}).join('');

  /* QUÉ HAY EN LA SALA. Javi, 14-oct-2026: «no aparece la info de qué backline
     hay». Quien va a ensayar necesita saber si hay batería, ampli y micros
     antes de pagar; la descripción sola no lo dice. Lo escribe el productor en
     su portal —equipo y materiales— y hasta hoy se quedaba ahí dentro. */
  var equipo=(Array.isArray(YO.equipo_extra)?YO.equipo_extra:[])
    .map(function(x){ return (x && (x.nombre||x.que||x.titulo)) || (typeof x==='string'?x:''); })
    .filter(Boolean);
  $('desc').innerHTML=esc(YO.descripcion||'')
    +(YO.materiales?('<div style="margin-top:10px"><b>'+esc(T('Qué hay en la sala'))+'</b><br>'+esc(YO.materiales)+'</div>'):'')
    +(equipo.length?('<div style="margin-top:8px"><b>'+esc(T('Equipo'))+'</b><br>'+equipo.map(esc).join(' · ')+'</div>'):'');
  /* EL EQUIPO ES DE LA SALA, NO DEL SERVICIO. Javi, 14-oct-2026: «el backline
     lo tienes en la info de la sala con las bocinas y todo el equipo». Y así
     era: la Sala de Ensayo tiene nueve líneas cargadas —la consola, los in-ear,
     la batería, los amplis—, más su horario, sus reglas y lo que hay que traer.
     Nada de eso llegaba aquí porque la ficha sólo miraba el evento. Se pide
     aparte y se pinta debajo: es lo que el músico necesita saber antes de
     pagar, y evita la llamada de «¿y hay batería?». */
  pintaSala();
  async function pintaSala(){
    var s=null;
    try{
      var r=await fetch(SB+'/rest/v1/rpc/ev_espacio_ficha_de_evento',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
        body:JSON.stringify({p_evento:YO.id})});
      s=r.ok?await r.json():null;
    }catch(_){ }
    if(!s) return;
    var cajon=document.createElement('div');
    cajon.style.cssText='margin-top:14px;border:1px solid var(--linea,#E2DCCF);border-radius:12px;padding:14px';
    var eq=Array.isArray(s.equipo)?s.equipo:[];
    var bloques={};
    eq.forEach(function(x){ (bloques[x.bloque||T('Equipo')]=bloques[x.bloque||T('Equipo')]||[]).push(x); });
    var html='';
    if(s.descripcion) html+='<p style="margin:0 0 10px">'+esc(s.descripcion)+'</p>';
    Object.keys(bloques).forEach(function(b){
      html+='<div style="margin-bottom:10px"><b>'+esc(b)+'</b><ul style="margin:4px 0 0;padding-left:18px">'
        +bloques[b].map(function(x){
          var n=Number(x.cantidad)||0;
          return '<li>'+(n>1?('<b>'+n+'×</b> '):'')+esc(x.equipo||'')+(x.nota?(' <span style="color:var(--gris)">— '+esc(x.nota)+'</span>'):'')+'</li>';
        }).join('')+'</ul></div>';
    });
    /* Lo que hay que traer y las reglas van con el equipo, no en letra pequeña
       al final: «traes tú los platos y la tarola» es justo lo que arruina un
       ensayo si se lee después de pagar. */
    [[T('Antes de venir'), s.observaciones], [T('Cómo funciona'), s.reglas]].forEach(function(p){
      if(!p[1]) return;
      html+='<div style="margin-bottom:10px"><b>'+esc(p[0])+'</b><ul style="margin:4px 0 0;padding-left:18px">'
        +String(p[1]).split('\n').filter(function(l){return l.trim();})
          .map(function(l){ return '<li>'+esc(l.trim())+'</li>'; }).join('')+'</ul></div>';
    });
    var pie=[];
    if(s.horario)   pie.push(T('Horario de la sala: ')+s.horario);
    if(s.metros2)   pie.push(s.metros2+' m²');
    if(s.capacidad) pie.push(T('hasta ')+s.capacidad+' '+T('personas'));
    if(s.direccion) pie.push(s.direccion);
    if(pie.length) html+='<div style="color:var(--gris);font-size:13px">'+esc(pie.join(' · '))+'</div>';
    if(!html) return;
    cajon.innerHTML='<h3 style="margin:0 0 10px">'+esc(T('Qué hay en '))+esc(s.nombre||T('la sala'))+'</h3>'+html;
    var d=$('desc'); if(d && d.parentNode) d.parentNode.insertBefore(cajon, d.nextSibling);
  }
  /* EL PRECIO ESTÁ EN LOS BOLETOS. Javi, 10-oct-2026: «puse el precio y no
     sale». Un evento con tipos de boleto no guarda nada en `eventos.precio`:
     cada tipo tiene el suyo en `evento_precios`. Esta pantalla miraba solo el
     primero y por eso anunciaba «Entrada libre» un concierto de $350. Ahora se
     enseñan los tipos tal como los puso la productora. */
  var bol=(YO.boletos||[]).filter(function(b){return b && b.nombre;});
  var desde=Number(YO.precio_desde||YO.precio||0);
  var porHora=Number(YO.precio_por_hora||0);
  /* GRATIS LO DECIDE EL ADMINISTRADOR, NO LA FALTA DE UN NÚMERO. Javi,
     11-oct-2026: «la experiencia de ensayo NO es entrada libre, tiene un coste
     y lo pusimos por hora… eso lo pone el administrador cuando selecciona
     gratis en la aprobación». Antes, si la página no encontraba precio donde
     miraba, concluía «Entrada libre» y regalaba la sala de ensayo. */
  var gratis=!!YO.es_gratis;
  /* TODOS LOS SHOWS PASAN POR EL CHECKOUT. Javi, 10-oct-2026: «este no es el
     motor de pide tu lugar, TODOS los shows deben tener integrado el checkout
     de Stripe». El motor ya existía entero —evento-compra elige el boleto,
     evento-pago cobra con Stripe y evento-boleto devuelve el QR—; esta página
     no lo usaba y seguía con el formulario viejo de dejar los datos. Si el
     evento tiene boletos, aquí ya no se piden datos: se manda a comprar. */
  /* EL PANEL DE COMPRA, AQUÍ MISMO. Javi, 10-oct-2026: «esta segunda pantalla
     incorpórala a la primera». Antes había un botón que llevaba a otra página a
     elegir cuántos boletos: dos pantallas para una sola decisión. Ahora la caja
     de «Pide tu lugar» se convierte en la de «Tu compra» cuando el evento tiene
     boletos. El panel vive en evento-compra.js y es el mismo que usa la liga
     suelta de evento-compra.html, para no tener dos verdades. */
  /* Y SE MONTA SIEMPRE, no solo cuando hay boletos: el panel decide. Javi,
     10-oct-2026: «no quiero ninguno que requiera visto bueno o apartar
     lugar». La sala por horas y la entrada libre pasan por el mismo camino. */
  if(window.eventoCompra && !document.getElementById('panelCompra')){
    var bE=document.getElementById('bEnviar');
    var caja=(bE && bE.form) ? bE.form.parentNode : null;
    if(caja){
      caja.id='panelCompra';
      caja.innerHTML='<div style="color:var(--gris);font-size:13.5px">'+esc(T('Abriendo la compra…'))+'</div>';
      eventoCompra.rpc('evento_publico',{p_id:YO.id}).then(function(r){
        var EVP=r.data;
        if(!EVP || !eventoCompra.monta(caja, EVP, {codigo:(P.get('codigo')||'').trim()})){
          caja.innerHTML='<h2>'+esc(T('Pide tu lugar'))+'</h2><p class="ay">'+esc(T('Escríbenos a '))+
            '<a href="mailto:ateneo@casapepe.mx" style="color:var(--naranja-oscuro)">ateneo@casapepe.mx</a>'+
            esc(T(' y te apartamos el lugar.'))+'</p>';
        }
      });
    }
  }
  if(porHora && !gratis){
    /* Los paquetes se anuncian aquí, con la tarifa: si sólo se vieran al elegir
       las horas, quien mira el precio y se va nunca sabría que 4 h le salen más
       baratas. Javi, 14-oct-2026, por petición de Fer de Reyes Recording. */
    var paqs=(Array.isArray(YO.paquetes_horas)?YO.paquetes_horas:[])
      .filter(function(p){ return Number(p.horas)>0 && Number(p.precio)>0; })
      .sort(function(a,b){ return Number(a.horas)-Number(b.horas); });
    $('tarifa').innerHTML='<b>'+money(porHora)+'</b>'+
      '<span style="color:var(--gris);font-size:13px">'+esc(T('por hora'))+
      (YO.min_horas?' · '+esc(T('mínimo '))+YO.min_horas+' h':'')+'</span>'+
      (paqs.length?('<div style="color:var(--gris);font-size:13px;margin-top:4px">'+
        esc(T('O por paquete: '))+paqs.map(function(p){
          return '<b>'+p.horas+' h '+esc(T('por '))+money(p.precio)+'</b>';
        }).join(' · ')+'</div>'):'');
  }else if(gratis){
    $('tarifa').innerHTML='<b>'+esc(T('Entrada libre'))+'</b>';
    $('bEnviar').textContent=T('Apartar lugar');
  }else if(bol.length>1){
    $('tarifa').innerHTML='<b>'+esc(T('desde '))+money(desde)+'</b>'+
      '<div style="margin-top:8px;display:grid;gap:5px">'+bol.map(function(b){
        return '<div style="display:flex;gap:8px;align-items:baseline;font-size:14px">'+
          '<b style="font-weight:600">'+esc(b.nombre)+'</b>'+
          (b.incluye?'<span style="color:var(--gris);font-size:12.5px">'+esc(b.incluye)+'</span>':'')+
          '<span style="margin-left:auto;font-weight:700">'+(Number(b.precio||0)?money(b.precio):T('Gratis'))+'</span>'+
          '</div>';
      }).join('')+'</div>';
  }else if(desde){
    var uno=bol[0];
    $('tarifa').innerHTML='<b>'+money(desde)+'</b>'+
      '<span style="color:var(--gris);font-size:13px">'+
        esc(uno&&uno.incluye ? uno.incluye : T('por persona'))+'</span>';
  }else{
    /* Sin precio puesto no se dice ni «gratis» ni una cifra inventada. */
    $('tarifa').innerHTML='<b style="font-size:16px;color:var(--gris)">'+esc(T('Precio por confirmar'))+'</b>';
  }

  var otros=LISTA.filter(function(e){return String(e.id)!==String(YO.id);}).slice(0,6);
  $('otros').innerHTML=otros.map(function(e){
    return '<a href="evento.html?id='+esc(e.id)+(QS||'')+'">'+
      '<b>'+esc(e.nombre)+'</b><span>'+esc(cuandoMx(e.fecha_inicio,false))+'</span></a>';
  }).join('');

  pintaImpacto();

  $('cargando').classList.add('oculto');
  $('todo').classList.remove('oculto');
  try{ sincI18n.barre(); }catch(_){}
}

/* Se pide aparte y después: si falla, el evento se ve igual. */
async function pintaImpacto(){
  var c=$('impacto'); if(!c) return;
  var lista=[];
  try{
    var r=await fetch(SB+'/rest/v1/rpc/ev_impacto_publico',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_evento:YO.id})});
    if(r.ok) lista=await r.json();
  }catch(_){}
  if(!lista||!lista.length){ c.innerHTML=''; return; }
  c.innerHTML='<div style="background:var(--cielo-suave,#E4F1FA);border-radius:12px;'+
      'padding:14px 16px;margin-top:16px">'+
    '<div style="font:700 12px/1 Oswald,system-ui,sans-serif;text-transform:uppercase;'+
      'letter-spacing:.09em;color:var(--gris,#6E665C);margin-bottom:8px">'+esc(T('Lo que deja en el barrio'))+'</div>'+
    '<ul style="margin:0;padding-left:18px;line-height:1.65;font-size:14px">'+
      lista.map(function(x){
        return '<li>'+esc(x.frase||'')+
          (x.quien?' <span style="color:var(--gris,#6E665C)">— '+esc(x.quien)+'</span>':'')+'</li>';
      }).join('')+
    '</ul></div>';
}

$('f').onsubmit=async function(ev){
  ev.preventDefault();
  var m=$('msg'); m.className='msg';
  if(!TEL||!TEL.valido()){ m.className='msg mal'; m.textContent=T('Nos falta tu WhatsApp con su país: es por donde te confirmamos.'); if(TEL)TEL.foco(); return; }
    var b=$('bEnviar'), txt=b.textContent;
  b.disabled=true; b.textContent=T('Pidiendo…');
  try{
    var r=await fetch(SB+'/rest/v1/rpc/ateneo_solicita_boleto',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p_evento:String(YO.id),
        p_nombre:$('fNom').value.trim(), p_email:$('fMail').value.trim(),
        p_telefono:TEL.valor(),
        p_personas:parseInt($('fPers').value,10)||1,
        p_notas:$('fNotas').value.trim()||null})});
    var t=await r.text(), j=null; try{j=t?JSON.parse(t):null;}catch(_){}
    if(!r.ok)throw new Error((j&&(j.message||j.hint))||('La base respondió '+r.status));
    var fila=(j&&j[0])||{};
    var n=fila.personas||1, lug=n>1?' '+T('lugares'):' '+T('lugar');

    /* Gratis sí se aparta aquí mismo: hay un paso que confirma, que es lo que
       pide la regla de la casa. */
    if(fila.gratis || !(Number(fila.monto||0)>0)){
      m.className='msg bien';
      m.textContent=T('Listo, te apartamos ')+n+lug+T('. Te mandamos el pase a ')+
        $('fMail').value.trim()+'.';
      $('f').reset(); $('fPers').value=1;
      b.textContent=T('Apartado');
      return;
    }

    /* CON PRECIO SE COBRA, NO SE APUNTA. Javi, 4-oct-2026: «no vendas nada que
       no genere pago». La compra de boleto vive en evento-compra.html: elige
       tipo de boleto, crea la reserva y de ahí al cobro, que entra en la cuenta
       del productor con nuestra comisión descontada —la que lleve ese productor
       en su convenio, que no es la misma para todos—. Aquí no se duplica ese
       formulario: se lleva allí. */
    m.className='msg bien';
    m.textContent=T('Te llevamos a elegir boleto y pagar…');
    location.href='evento-compra.html?id='+encodeURIComponent(String(YO.id));
  }catch(x){
    m.className='msg mal'; m.textContent=x.message;
    b.disabled=false; b.textContent=txt;
  }
};

if(!ID){ $('cargando').textContent=T('Falta decir qué evento.'); } else { TEL = telPais.monta('fTelCaja');
arranca(); }
})();
</script>
