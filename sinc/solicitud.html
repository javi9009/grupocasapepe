<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>¿Cabe alguien? · Sincrético</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/cp-movil.css">
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8; --blanco:#fff;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --error:#9E3B2E; --error-bg:#F6E1DD;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55;}
.caja{max-width:480px;margin:0 auto;padding:28px 18px 60px;}
.marca{font-family:Oswald,sans-serif;font-weight:600;font-size:11px;
  letter-spacing:.16em;text-transform:uppercase;color:var(--naranja-oscuro);margin:0 0 6px;}
h1{font-family:Oswald,sans-serif;font-weight:700;font-size:26px;margin:0 0 14px;line-height:1.2;}
.tarjeta{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;
  padding:16px 18px;margin:0 0 18px;
  box-shadow:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);}
.l{display:flex;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px;}
.l span{color:var(--gris)}
.l b{font-weight:600;text-align:right}
.btn{display:block;width:100%;border:2px solid var(--naranja);background:var(--naranja);
  color:#fff;font-family:Oswald,sans-serif;font-weight:600;font-size:14px;letter-spacing:.05em;
  text-transform:uppercase;padding:13px 20px;border-radius:9px;cursor:pointer;margin:0 0 10px;}
.btn:hover{background:var(--naranja-oscuro);border-color:var(--naranja-oscuro)}
.btn.no{background:transparent;color:var(--tinta);border-color:var(--linea)}
.btn:disabled{opacity:.5;cursor:default}
.pie{font-size:12.5px;color:var(--gris);margin:14px 0 0;}
.aviso{border-radius:10px;padding:13px 15px;margin:0 0 16px;font-size:14px;}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.mal{background:var(--error-bg);color:var(--error)}
.aviso.espera{background:var(--cielo-suave);color:#2A6588}
textarea{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;
  font-family:inherit;font-size:14px;margin:0 0 10px;min-height:64px;resize:vertical}
.oculto{display:none}
.firma{font-size:11.5px;color:var(--tenue);margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="caja">
  <p class="marca">Sincrético</p>
  <h1 id="tit">Un momento…</h1>
  <div id="aviso" class="aviso espera">Buscando la solicitud…</div>
  <div class="tarjeta oculto" id="ficha"></div>
  <div class="oculto" id="acciones">
    <button class="btn" id="bSi">Sí, que venga</button>
    <button class="btn no" id="bNo">No cabe</button>
    <div class="oculto" id="porque">
      <textarea id="motivo" placeholder="¿Por qué no? (opcional, se lo contamos)"></textarea>
      <button class="btn no" id="bNoOk">Mandar el no</button>
    </div>
    <p class="pie">Si dices que sí, le llega el link de pago. <b>Su lugar no queda apartado hasta que pague</b>, y el link deja de servir cuando sale el tour.</p>
  </div>
  <p class="firma">Sincrético · Una empresa de Grupo Casa Pepe</p>
</div>

<script>
(function(){
'use strict';
/* CONTESTAR UNA SOLICITUD DE ÚLTIMA HORA. Javi, 1-nov-2026.
   La llave es el enlace del correo, no una sesión: lo abre el guía desde el
   teléfono, en la calle, o la operadora desde donde esté. Por eso la página no
   enseña ni el correo ni el teléfono del cliente — contestar sí o no no los
   necesita, y un «no» menos todavía. */
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var $=function(i){return document.getElementById(i);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
var P=new URLSearchParams(location.search);
var TOK=(P.get('t')||'').trim(), QUIEN=(P.get('q')||'').trim(), PRE=(P.get('r')||'').trim();

async function rpc(f,b){
  var r=await fetch(SB+'/rest/v1/rpc/'+f,{method:'POST',
    headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},
    body:JSON.stringify(b||{})});
  var t=await r.text(); var d=null; try{d=JSON.parse(t);}catch(_){}
  if(!r.ok) throw new Error((d&&(d.message||d.hint))||t||('error '+r.status));
  return d;
}
function dice(txt,clase){ var a=$('aviso'); a.textContent=txt; a.className='aviso '+(clase||'espera'); a.classList.remove('oculto'); }
function diaBonito(f){
  try{ return new Date(f+'T12:00:00').toLocaleDateString('es-MX',
    {weekday:'long',day:'numeric',month:'long'}); }catch(_){ return f; }
}

var S=null;
async function arranca(){
  if(!TOK){ $('tit').textContent='Enlace incompleto'; dice('Este enlace no trae la solicitud. Ábrelo desde el correo.','mal'); return; }
  try{ S=await rpc('sinc_solicitud_lee',{p_token:TOK}); }
  catch(e){ $('tit').textContent='No se pudo abrir'; dice(e.message,'mal'); return; }

  if(!S||!S.ok){ $('tit').textContent='No encontramos esa solicitud'; dice('El enlace no corresponde a ninguna solicitud.','mal'); return; }

  $('ficha').innerHTML=
    fila('Tour',S.tour)+fila('Cuándo',diaBonito(S.fecha)+' · '+String(S.hora).slice(0,5))+
    fila('Personas',String(S.pax))+fila('A nombre de',S.nombre)+
    (S.notas?fila('Nota',S.notas):'')+fila('Folio',S.folio||'');
  $('ficha').classList.remove('oculto');

  if(S.pagada){ $('tit').textContent='Ya está pagada'; dice('Esta solicitud ya se convirtió en reserva. No hay nada que contestar.','ok'); return; }
  if(S.salio){  $('tit').textContent='Ese tour ya salió'; dice('La solicitud caducó al salir el tour.','mal'); return; }

  if(S.estado==='confirmada'){
    $('tit').textContent='Ya dijeron que sí';
    dice('Aceptada'+(S.respondida_por?' por '+S.respondida_por:'')+'. Le mandamos el link de pago; su lugar se aparta cuando pague.','ok');
    return;
  }
  if(S.estado==='rechazada'||S.estado==='cancelada'){
    $('tit').textContent='Ya está contestada';
    dice('Quedó como '+S.estado+(S.respondida_por?', por '+S.respondida_por:'')+'.','mal');
    return;
  }

  $('tit').textContent='¿Todavía cabe alguien?';
  dice('La venta de esta salida ya cerró. Tú decides si entra.','espera');
  $('acciones').classList.remove('oculto');

  /* El correo trae dos botones; si llega con la respuesta puesta, se marca,
     pero no se manda sola: el último clic lo da una persona mirando esto. */
  if(PRE==='no') $('porque').classList.remove('oculto');
}
function fila(k,v){ return '<div class="l"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div>'; }

async function contesta(si,motivo){
  ['bSi','bNo','bNoOk'].forEach(function(i){ var b=$(i); if(b) b.disabled=true; });
  dice('Mandando…','espera');
  try{
    var r=await rpc('sinc_solicitud_responde',
      {p_token:TOK, p_si:si, p_quien:QUIEN||null, p_motivo:motivo||null});
    if(!r||!r.ok){
      dice(r&&r.motivo==='ya_salio'?'Ese tour ya salió: la solicitud caducó.'
          :r&&r.motivo==='ya_contestada'?'Alguien la contestó antes que tú.'
          :r&&r.motivo==='ya_pagada'?'Ya está pagada.'
          :'No se pudo contestar.','mal');
      return;
    }
    /* El aviso al cliente sale aparte: si el correo falla, la respuesta ya
       está guardada y se puede reenviar. */
    try{
      await fetch(SB+'/functions/v1/sinc-solicitud-resuelta',{method:'POST',
        headers:{'Content-Type':'application/json',apikey:KEY,Authorization:'Bearer '+KEY},
        body:JSON.stringify({token:TOK})});
    }catch(_){ }
    $('acciones').classList.add('oculto');
    $('tit').textContent=si?'Hecho: que venga':'Hecho: le decimos que no';
    dice(si?'Le mandamos el link de pago. Su lugar se aparta cuando pague, no antes.'
           :'Le avisamos y le proponemos otras fechas.', si?'ok':'mal');
  }catch(e){
    ['bSi','bNo','bNoOk'].forEach(function(i){ var b=$(i); if(b) b.disabled=false; });
    dice(e.message,'mal');
  }
}

$('bSi').onclick=function(){ contesta(true,null); };
$('bNo').onclick=function(){ $('porque').classList.remove('oculto'); $('motivo').focus(); };
$('bNoOk').onclick=function(){ contesta(false,($('motivo').value||'').trim()||null); };

arranca();
})();
</script>
</body>
</html>
