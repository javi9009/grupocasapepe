<!doctype html><html lang="es"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#2B2622;--tenue:#8A7F72;--linea:#E4DCD1}
body{font-family:Inter,system-ui,sans-serif;background:#6b6258;margin:0;padding:26px;color:var(--tinta)}
#guia .in{background:#fff;max-width:560px;margin:0 auto;border-radius:16px;padding:26px}
#guia h2{font-family:Oswald;font-weight:600;font-size:23px;margin:12px 0 2px;text-transform:uppercase}
.lead{font-family:Georgia,serif;font-style:italic;color:#C2185B;margin-bottom:14px}
.gpasos{list-style:none;padding:0;margin:0 0 6px}
.gpasos li{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--linea);font-size:13.5px}
.gpasos li:last-child{border-bottom:0}
.gpasos .num{flex:0 0 22px;height:22px;border-radius:50%;background:#F3EFE9;display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.gpasos b{display:block;text-transform:uppercase;font-size:12px;letter-spacing:.05em;margin-bottom:2px}
.mini{font-size:12px;color:var(--tenue)}
.ft{display:flex;justify-content:flex-end}
.btn{background:#D4562A;color:#fff;border:0;border-radius:9px;padding:10px 20px;font:600 14px Inter;cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
/* Lo primero que ve quien llega y ya tiene ficha hecha: lo que le tenemos
   adelantado. Es el gancho, no la letra pequeña. */
.gYa{border:1px solid var(--linea);border-radius:12px;padding:13px 15px;margin:0 0 14px;background:#FCFAF7}
.gYa .cifras{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 0}
.gYa .cifras div{line-height:1.15}
.gYa .cifras b{display:block;font-family:'Oswald';font-size:22px;font-weight:600}
.gYa .cifras span{font-size:12px;color:var(--tenue)}
.gAzul{display:flex;gap:9px;align-items:flex-start;background:#EFF4FF;color:#1D4ED8;
  border-radius:10px;padding:9px 12px;margin:12px 0 0;font-size:12.5px;line-height:1.45}
.gAzul i{font-style:normal;flex:0 0 3px;align-self:stretch;background:#1D4ED8;border-radius:2px}

</style></head><body>
<div id="guia"><div class="in">
  <div style="width:52px;height:52px;border-radius:11px;background:#F3EFE9;display:flex;align-items:center;justify-content:center;font-weight:700;color:#D4562A">S</div>
  <h2 id="gTit">Bienvenido</h2><div class="lead">How to be a Mexican?</div>
  <div id="gCuerpo"></div>
  <div class="ft"><button class="btn">Empezar</button></div>
</div></div>
<script>
var SB='', X=[], cur={nombre_comercial:'Ancient Tenochtitlán Tours'};
function $(id){return document.getElementById(id);}
function hdr(){return {};}
function esc(s){return s==null?"":String(s);}
X=[{id:'a',origen:'preficha',fotos_ref:[1,2,3,4,5]},{id:'b',origen:'preficha',fotos_ref:[1,2,3,4,5]},{id:'c',origen:'preficha',fotos_ref:[1,2,3]}];
window.fetch=async function(){return {ok:true, json:async function(){return new Array(23).fill({id:1});}};};
  /* ---------- la bienvenida ----------
     Hay dos maneras de llegar aquí y no se parecen en nada. Quien llega a una
     casa vacía necesita que le digan por dónde empezar. Quien llega y ya tiene
     sus tours armados necesita ver eso primero: es el motivo de que esté aquí,
     y si se lo enterramos bajo cinco pasos de trámite lo perdemos. */
  async function pintaGuia(){
    var box=$('gCuerpo'); if(!box)return;
    var pre=(X||[]).filter(function(e){return e.origen==='preficha';});
    var fotos=pre.reduce(function(a,e){
      var f=e.fotos_ref; return a+((f&&f.length)||0);},0);

    var paradas=0;
    if(pre.length){
      try{
        var ids=pre.map(function(e){return e.id;}).join(',');
        var r=await fetch(SB+'/rest/v1/op_exp_paradas?select=id&experiencia_id=in.('+ids+')',{headers:hdr()});
        if(r.ok)paradas=(await r.json()).length;
      }catch(_){}
    }

    /* Una sola lista: si se parte en dos, la numeración se reinicia y el
       operador cree que va por el paso 1 cuando va por el tres. */
    var ALTA=[
      ['Lo formal','La póliza de responsabilidad civil es lo único que de verdad nos frena. Si no la tienes, te la conseguimos.'],
      ['Cómo te pagamos','Vinculas tu Stripe y el dinero de cada venta te cae directo. No pasa por nosotros.'],
      ['Cómo leemos tus tours','Si ya usas un sistema, lo conectamos para que el cupo no se venda dos veces.'],
      ['El acuerdo','Se firma una vez y de ahí cuelgan todos tus tours.']
    ];
    function lista(pasos){
      return '<ul class="gpasos">'+pasos.map(function(p,i){
        return '<li><span class="num">'+(i+1)+'</span><span><b>'+esc(p[0])+'</b>'+p[1]+'</span></li>';
      }).join('')+'</ul>';
    }

    if(!pre.length){
      $('gTit').textContent='Bienvenido'+(cur.nombre_comercial?', '+cur.nombre_comercial:'');
      box.innerHTML=
        '<p style="margin:0 0 14px">Ya tienes cuenta. Aquí subes tus experiencias y las vendemos '+
        'en la recepción de nuestros hoteles y en el concierge de los huéspedes. Antes de publicar '+
        'la primera hay que completar tu alta; se guarda lo que lleves.</p>'+
        lista([['Tu empresa y tus contactos','Quién eres en papel y a dónde te avisamos de cada venta.']].concat(ALTA))+
        '<p class="mini" style="margin-bottom:16px">Ten a la mano, si los tienes: RFC, tu póliza '+
        'y los días y horarios de tus tours.</p>';
      return;
    }

    $('gTit').textContent='Te estábamos esperando y nos encanta lo que divulgas'+
      (cur.nombre_comercial?', '+cur.nombre_comercial:'');
    var n=pre.length;
    box.innerHTML=
      '<p style="margin:0 0 14px">Hemos encontrado esta información sobre tu proyecto en la web. '+
      '<b>¿Te suena?</b> Te dejamos aquí '+
      (n===1?'tu experiencia':'tus '+n+' experiencias')+', con el recorrido, qué incluye, de dónde '+
      'sale y a qué precio.</p>'+
      '<div class="gYa"><b>Lo que ya te tenemos hecho</b>'+
        '<div class="cifras">'+
          '<div><b>'+n+'</b><span>experiencia'+(n===1?'':'s')+'</span></div>'+
          (paradas?'<div><b>'+paradas+'</b><span>paradas del recorrido</span></div>':'')+
          (fotos?'<div><b>'+fotos+'</b><span>fotos tuyas localizadas</span></div>':'')+
        '</div>'+
      '</div>'+
      '<div class="gAzul"><i></i><span><b>Nada de esto lo has validado tú.</b> Va en azul hasta que '+
        'lo confirmes, y no se publica nada sin que pases por ahí. Si algo está mal, lo corriges y '+
        'se queda como tú lo dejes.</span></div>'+
      '<p style="margin:16px 0 8px"><b>Lo que falta es tuyo:</b></p>'+
      lista([['Revisar tus fichas','Lo azul es nuestro hasta que lo toques. El precio que ves es '+
        'estimado: lo sacamos de tu precio público menos la comisión de la plataforma donde lo vendes.'],
        ['Tu empresa y tus contactos','Quién eres en papel y a dónde te avisamos de cada venta.']].concat(ALTA))+
      '<p class="mini" style="margin-bottom:16px">Ten a la mano, si los tienes: RFC, tu póliza y los '+
        'días y horarios de tus tours.</p>';
  }
pintaGuia();
</script></body></html>
