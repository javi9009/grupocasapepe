<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--tinta:#2B2622;--tenue:#8A7F72;--linea:#E4DCD1;--blanco:#fff;--gris:#5C534A}
body{font-family:Inter,system-ui,sans-serif;background:#F6F2EC;color:var(--tinta);margin:0;padding:20px}
.btn{font:inherit;border:1px solid var(--linea);background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer}
.btn.sm{font-size:12px}.btn.fantasma{background:transparent}
.cxvelo{position:fixed;inset:0;background:rgba(20,16,12,.45);display:flex;align-items:flex-start;justify-content:center;padding:0;z-index:100;overflow:auto}
.cxhoja{background:#fff;width:100%;max-width:760px;max-height:92vh;overflow:auto}
@media(min-width:760px){.cxvelo{align-items:center;padding:24px}.cxhoja{border-radius:16px}}
.cxhoja .cab{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:10px;padding:14px 18px;z-index:2}
.cxhoja .cab h3{margin:0;font-size:15.5px;flex:1;font-family:Oswald;font-weight:600}
.cxhoja .cue{padding:16px 18px 18px}
/* ---- Previsualizar anuncio: cómo se vería publicada ---------------------
   No es la ficha del cliente de verdad, es un espejo fiel de lo que hay
   escrito ahora mismo, con lo que falta señalado en vez de escondido. */
.vp{font-size:14px;line-height:1.5}
.vp .hero{position:relative;border-radius:12px;overflow:hidden;background:#EFEAE3;aspect-ratio:16/9}
.vp .hero img{width:100%;height:100%;object-fit:cover;display:block}
.vp .hero .falta{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:#8A7F72;font-size:13px;text-align:center;padding:20px}
.vp .tiras{display:flex;gap:6px;margin-top:6px;overflow-x:auto;padding-bottom:2px}
.vp .tiras img{width:76px;height:54px;object-fit:cover;border-radius:7px;flex:0 0 auto}
.vp h2{font-family:'Oswald';font-weight:600;font-size:21px;margin:14px 0 2px;line-height:1.2}
.vp .porq{color:var(--tenue);font-size:13px}
.vp .chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0}
.vp .chips span{background:#F3EFE9;border-radius:999px;padding:3px 10px;font-size:12.5px}
.vp .precio{margin:14px 0;padding:12px 14px;border:1px solid var(--linea);border-radius:12px;background:#FCFAF7}
.vp .precio .pvp{font-family:'Oswald';font-size:26px;font-weight:600;line-height:1}
.vp .precio .pvp i{font-style:normal;font-size:13px;color:var(--tenue);font-family:inherit;font-weight:400;margin-left:6px}
.vp .esc{margin-top:9px;font-size:12.5px;color:var(--tenue)}
.vp .esc div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.vp .esc div.tot{border-top:1px solid var(--linea);margin-top:4px;padding-top:5px;color:var(--tinta);font-weight:600}
.vp section{margin-top:18px}
.vp section>b{display:block;font-family:'Oswald';font-weight:600;font-size:13px;letter-spacing:.07em;
  text-transform:uppercase;color:var(--tenue);margin-bottom:5px}
.vp p{margin:0 0 8px;white-space:pre-wrap}
.vp ul{margin:0;padding-left:18px}
.vp ul li{margin:2px 0}
.vp .par{display:flex;gap:9px;margin:7px 0}
.vp .par .n{flex:0 0 22px;height:22px;border-radius:50%;background:var(--tinta);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.vp .azul{border-left:3px solid #1D4ED8;padding-left:9px}
.vp .leyenda{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:12.5px;color:#1D4ED8;
  background:#EFF4FF;border-radius:9px;padding:7px 11px}
.vp .leyenda i{font-style:normal;flex:0 0 3px;height:15px;background:#1D4ED8;border-radius:2px}
.vp .huecos{margin-top:20px;border:1px dashed #D7B24A;background:#FFFBF0;border-radius:11px;padding:11px 13px}
.vp .huecos b{display:block;font-size:12.5px;margin-bottom:4px}
.vp .huecos ul{font-size:12.5px;color:#6B5B33}
</style></head><body>
<script>
var PAR=[], VALIDADOS={}, E={};
function $(id){return document.getElementById(id);}
function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function money(n){return n==null||n===''?'\u2014':'$'+Number(n).toLocaleString('es-MX');}
function esPreficha(){return E.origen==='preficha';}
function cxCierra(){var v=$('cxVelo');if(v)v.remove();}
function cxAbre(html){cxCierra();var v=document.createElement('div');v.className='cxvelo';v.id='cxVelo';
 v.innerHTML='<div class="cxhoja" role="dialog">'+html+'</div>';document.body.appendChild(v);return v;}
var CAMPOS={}, CHIPS={};
function leeChips(c){return CHIPS[c]||[];}
function duracion(){return CAMPOS.__dur||0;}
function comisionPct(){return 25;}
function cfg(k,d){return d;}
function desglose(){var neto=Number(CAMPOS.neto_adulto||0);if(!neto)return null;
 var com=25, nf=Math.round(neto/(1-com/100)), iva=Math.round(nf*16/100);
 return {netoOp:neto,com:com,comision:nf-neto,netoFinal:nf,ivaPct:16,iva:iva,bruto:nf+iva};}
document.querySelector=function(sel){
  var m=/\[data-c="([a-z_0-9]+)"\]/.exec(sel);
  if(m){var v=CAMPOS[m[1]];return v==null?null:{type:'text',value:String(v)};}
  return null;};
  /* ---------- Previsualizar anuncio -------------------------------------
     Lee lo que hay en pantalla ahora (no lo guardado) y lo arma como lo
     vería un cliente. Lo que sigue en azul se marca, y lo que falta se
     lista al final: más vale ver el hueco aquí que en la tienda. */
  function vpVal(c){
    var el=document.querySelector('[data-c="'+c+'"]');
    if(!el)return null;
    if(el.type==='checkbox')return el.checked;
    var v=String(el.value==null?'':el.value).trim();
    return v===''?null:v;
  }
  function vpAzul(c){ return esPreficha() && !VALIDADOS[c] && vpVal(c)!=null; }
  function vpBloque(c,html){ return '<div class="'+(vpAzul(c)?'azul':'')+'">'+html+'</div>'; }
  function vpFotos(){
    var out=[];
    (E&&E.fotos||[]).forEach(function(f){ var u=typeof f==='string'?f:(f&&f.url); if(u)out.push({url:u,alt:(f&&f.alt)||''}); });
    if(!out.length)(E&&E.fotos_ref||[]).forEach(function(f){ if(f&&f.url)out.push({url:f.url,alt:f.alt||''}); });
    return out;
  }
  /* Los chips y el texto libre dicen a menudo lo mismo. Si el texto ya
     contiene todos los chips, sobra la lista; si no, van los dos. */
  function vpLista(titulo, chips, texto, campo){
    if(!chips.length && !texto)return '';
    var t=(texto||'').toLowerCase();
    var cubiertos = chips.length>0 && chips.every(function(x){ return t.indexOf(String(x).toLowerCase())>=0; });
    var h='<section><b>'+esc(titulo)+'</b>';
    if(chips.length && !cubiertos)
      h+='<ul>'+chips.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul>';
    if(texto)h+=vpBloque(campo,'<p>'+esc(texto)+'</p>');
    return h+'</section>';
  }

  function vistaPrevia(){
    var d=desglose(), fotos=vpFotos(), huecos=[];
    var nombre=vpVal('nombre'), resumen=vpVal('resumen'), descripcion=vpVal('descripcion');
    var ini=($('cerIni')&&$('cerIni').value.trim())||vpVal('cer_inicio_lugar');
    var fin=($('cerFin')&&$('cerFin').value.trim())||vpVal('cer_final_lugar');
    var idiomas=leeChips('chIdiomas'), incluye=leeChips('chIncluye'),
        noInc=leeChips('chNoIncluye'), llevar=leeChips('chLlevar');
    var incTxt=vpVal('incluye_desc'), noIncTxt=vpVal('no_incluye');
    var dur=duracion(), cupo=vpVal('cupo_max'), edad=vpVal('edad_minima');
    var cancel=vpVal('cancelacion'), antel=vpVal('antelacion'), acces=vpVal('accesibilidad');
    var opNom=(E&&E.operador_nombre)||($('bNom')&&$('bNom').textContent)||'';

    if(!fotos.length)huecos.push('Fotos: sin una imagen el anuncio no se publica.');
    if(!nombre)huecos.push('El nombre de la experiencia.');
    if(!descripcion&&!resumen)huecos.push('La descripción: qué va a vivir la persona.');
    if(!d)huecos.push('El precio neto, que es de donde sale todo lo demás.');
    if(!ini)huecos.push('Dónde empieza.');
    if(!idiomas.length)huecos.push('En qué idiomas se da.');
    if(!dur)huecos.push('Cuánto dura (sale de la hora de salida y la de fin).');
    if(!incluye.length&&!incTxt)huecos.push('Qué incluye.');
    if(!cancel)huecos.push('La política de cancelación.');

    var chips=[];
    if(dur)chips.push(Math.floor(dur/60)+'h'+(dur%60?' '+(dur%60)+'m':''));
    if(idiomas.length)chips.push(idiomas.join(' · '));
    if(cupo)chips.push('hasta '+cupo+' personas');
    if(edad)chips.push('desde '+edad+' años');
    if(E&&E.sale_de_casa_pepe)chips.push('sale de Casa Pepe');

    var h='<div class="cab"><h3>Así se vería el anuncio</h3>'+
      '<button class="btn fantasma sm" data-cxcerrar>Cerrar</button></div><div class="cue"><div class="vp">';

    if(esPreficha())
      h+='<div class="leyenda"><i></i><span>Lo que lleva filo azul lo sacamos nosotros de lo que publica '+
         'en línea. Nadie del equipo del operador lo ha revisado todavía.</span></div>';
    h+='<div class="hero">'+(fotos.length
        ? '<img src="'+esc(fotos[0].url)+'" alt="'+esc(fotos[0].alt)+'">'
        : '<div class="falta">Aquí va la foto de portada.<br>Sin ella el anuncio no se publica.</div>')+'</div>';
    if(fotos.length>1)h+='<div class="tiras">'+fotos.slice(1,9).map(function(f){
        return '<img src="'+esc(f.url)+'" alt="'+esc(f.alt)+'">';}).join('')+'</div>';

    h+=vpBloque('nombre','<h2>'+esc(nombre||'Sin nombre todavía')+'</h2>');
    if(opNom)h+='<div class="porq">con '+esc(opNom)+'</div>';
    if(chips.length)h+='<div class="chips">'+chips.map(function(c){return '<span>'+esc(c)+'</span>';}).join('')+'</div>';

    h+='<div class="precio">';
    if(d){
      h+='<div class="pvp">'+money(d.bruto)+'<i>por persona, IVA incluido</i></div>'+
         '<div class="esc">'+
         '<div><span>Neto del operador</span><span>'+money(d.netoOp)+'</span></div>'+
         '<div><span>Comisión Sincrético '+d.com+'%</span><span>'+money(d.comision)+'</span></div>'+
         '<div><span>Precio neto cliente</span><span>'+money(d.netoFinal)+'</span></div>'+
         '<div><span>IVA '+d.ivaPct+'%</span><span>'+money(d.iva)+'</span></div>'+
         '<div class="tot"><span>PVP</span><span>'+money(d.bruto)+'</span></div></div>';
    } else {
      h+='<div class="porq">Falta el precio neto. Hasta que esté, el anuncio no tiene precio que enseñar.</div>';
    }
    h+='</div>';

    if(resumen||descripcion)
      h+='<section><b>Lo que vas a vivir</b>'+
         vpBloque(descripcion?'descripcion':'resumen','<p>'+esc(descripcion||resumen)+'</p>')+'</section>';

    if(ini||fin){
      h+='<section><b>Dónde empieza y dónde termina</b>';
      if(ini)h+=vpBloque('cer_inicio_lugar','<p><b>Empieza:</b> '+esc(ini)+'</p>');
      if(fin)h+=vpBloque('cer_final_lugar','<p><b>Termina:</b> '+esc(fin)+'</p>');
      h+='</section>';
    }

    if(typeof PAR!=='undefined' && PAR && PAR.length){
      h+='<section><b>El recorrido</b>'+PAR.map(function(p,i){
        return '<div class="par"><div class="n">'+(i+1)+'</div><div><b>'+esc(p.titulo||'')+'</b>'+
               (p.descripcion?'<div class="porq">'+esc(p.descripcion)+'</div>':'')+'</div></div>';
      }).join('')+'</section>';
    }

    h+=vpLista('Incluye', incluye, incTxt, 'incluye_desc');
    h+=vpLista('No incluye', noInc, noIncTxt, 'no_incluye');
    if(llevar.length)
      h+='<section><b>Qué llevar</b><ul>'+llevar.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></section>';

    if(cancel||antel||acces){
      h+='<section><b>Antes de reservar</b>';
      if(antel)h+=vpBloque('antelacion','<p><b>Se reserva:</b> '+esc(antel)+'</p>');
      if(cancel)h+=vpBloque('cancelacion','<p><b>Cancelación:</b> '+esc(cancel)+'</p>');
      if(acces)h+=vpBloque('accesibilidad','<p><b>Accesibilidad:</b> '+esc(acces)+'</p>');
      h+='</section>';
    }

    if(huecos.length)
      h+='<div class="huecos"><b>Esto todavía no se vería</b><ul>'+
         huecos.map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ul></div>';
    else
      h+='<div class="huecos" style="border-color:#8FBF8F;background:#F4FBF4;color:#2F5D2F">'+
         '<b>No falta nada: así se publica.</b></div>';

    h+='</div></div>';
    var v=cxAbre(h);
    var c=v.querySelector('[data-cxcerrar]'); if(c)c.onclick=cxCierra;
  }
  if($('bVer'))$('bVer').onclick=vistaPrevia;
</script>

VALIDADOS={};
CAMPOS={"nombre": "Mexico City Reimagined · caminata cultural", "descripcion": "Caminata por el Centro leyendo la ciudad por capas: ruinas mexicas, virreinato, porfiriato y la ciudad de hoy, una encima de otra. Salimos de la puerta de Casa Pepe y terminamos donde empieza la tarde.", "cer_inicio_lugar": "Casa Pepe Hostel, Centro Histórico", "cer_final_lugar": "Plaza Manuel Tolsá, frente al Munal", "cupo_max": "6", "edad_minima": "12", "neto_adulto": "597", "incluye_desc": "Entradas a los sitios que se visitan", "no_incluye": "Comida y bebida · Propinas · Transporte al punto de encuentro", "cancelacion": "Cancelación gratuita hasta 24 horas antes del inicio.", "antelacion": "Hasta 2 horas antes de la salida", "accesibilidad": "Los viajeros deben tener una condición física media · Hay transporte público cerca", "__dur": 180};
CHIPS={"chIdiomas": ["Español", "Inglés"], "chIncluye": ["Guía local certificado", "Entradas incluidas"], "chNoIncluye": ["Comida", "Propinas"], "chLlevar": ["Zapato cómodo", "Agua", "Gorra"]};

                  if(id==='cerFin')return {value:CAMPOS.cer_final_lugar||''};
                  if(id==='bNom')return {textContent:'Miguel Fuentes'};
                  if(id==='netoAd')return {value:CAMPOS.neto_adulto||''};
                  if(id==='bVer')return null;
                  return document.getElementById(id); };
vistaPrevia();
</script></body></html>
