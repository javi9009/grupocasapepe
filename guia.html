<!DOCTYPE html><html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Guía del Guía · Casa Pepe</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.brand h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}.who{font-size:12px;color:var(--muted)}.who b{color:var(--gold2)}
  main{padding:14px 16px 90px;max-width:980px;margin:0 auto}
  label{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:4px}
  input,textarea,select{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  textarea{min-height:54px;resize:vertical}
  .crumbs{font-size:12px;color:var(--muted);margin-bottom:10px}.crumbs a{color:var(--gold2);cursor:pointer}
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
  .sec h2{margin:0 0 4px;font-size:14px;color:var(--gold2);text-transform:uppercase;letter-spacing:1px}
  .sec .d{color:var(--muted);font-size:12px;margin-bottom:10px}
  .btn{background:var(--gold);color:#1a1206;border:0;border-radius:8px;padding:8px 13px;font-weight:600;cursor:pointer;font-size:12px}
  .btn.ghost{background:transparent;color:var(--gold2);border:1px solid var(--line)}
  .btn.sm{padding:5px 9px;font-size:11px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:.15s}
  .card:hover{border-color:var(--gold);transform:translateY(-2px)}
  .cover{height:110px;background:linear-gradient(135deg,#3a2c12,#7a5a1e);display:flex;align-items:flex-end;color:#fff;font-weight:700;font-size:15px;padding:10px;background-size:cover;background-position:center;text-shadow:0 1px 4px #000}
  .card .meta{padding:9px 11px;font-size:12px;color:var(--muted)}
  .card.add{display:flex;align-items:center;justify-content:center;border-style:dashed;color:var(--gold2);font-size:14px;min-height:160px}
  .item{background:#16120c;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0}
  .item .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .item .num{width:24px;height:24px;border-radius:50%;background:#3a2c12;color:var(--gold2);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
  .item .x{color:var(--red);cursor:pointer;margin-left:auto;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:680px){.grid2{grid-template-columns:1fr}}
  .fg{margin:8px 0}
  .regla{background:#15120c;border-left:3px solid var(--gold);border-radius:6px;padding:8px 11px;margin:6px 0;font-size:12px;color:var(--muted)}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:320px;width:90%;text-align:center}
  .gate h2{color:var(--gold2);margin:0 0 12px}.gate button{display:block;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--txt);padding:10px;border-radius:9px;margin:6px 0;cursor:pointer}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#23402a;color:#bfe6c4;border:1px solid #3f6043;padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;transition:.2s;z-index:60}.toast.show{opacity:1}
  .muted{color:var(--muted);font-size:12px}a{color:var(--blue)}
  .hide{display:none}
  /* overlay PDF */
  #ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:none;overflow:auto;padding:22px}#ov.show{display:block}
  .ovbar{max-width:820px;margin:0 auto 10px;display:flex;gap:8px;justify-content:flex-end}
  #doc{max-width:820px;margin:0 auto;background:#fff;color:#1a1a1a;padding:44px 52px;border-radius:6px;font-size:13px;line-height:1.6}
  #doc h1{font-size:20px;margin:0 0 2px;color:#7a5a1e}#doc .sub{color:#777;font-size:12px;margin-bottom:14px}
  #doc h3{font-size:14px;margin:18px 0 4px;border-bottom:1px solid #ddd;padding-bottom:3px;color:#3a2c12}
  #doc .stop{margin:10px 0;padding-left:12px;border-left:3px solid #e0c98a}
  #doc .hora{display:inline-block;background:#f0e6cf;color:#7a5a1e;border-radius:5px;padding:1px 7px;font-weight:700;font-size:12px;margin-right:6px}
  #doc .narr{font-style:italic;color:#555;margin-top:3px}
  @media print{body *{visibility:hidden}#ov,#ov *{visibility:visible}#ov{position:absolute;inset:0;background:#fff;padding:0}.ovbar{display:none}#doc{box-shadow:none}}
</style></head>
<body>
<div class="gate" id="gate"><div class="box"><h2>Guía del Guía</h2><p class="muted">¿Quién eres?</p><div id="who"></div></div></div>
<header><div class="brand"><h1>🗺️ La Guía del Guía</h1><span class="spacer"></span><span class="who">Sesión de <b id="whoLbl">—</b></span></div></header>
<main>
  <div class="crumbs" id="crumbs"></div>
  <!-- VISTA 1: galería de tours -->
  <div id="vTours"><div class="sec"><h2>Tours</h2><div class="d">Elige un tour para ver sus versiones de guía.</div><div class="grid" id="toursGrid"></div></div></div>
  <!-- VISTA 2: versiones -->
  <div id="vVers" class="hide"><div class="sec"><h2 id="versTtl">Versiones</h2><div class="d">Cada versión es una guía distinta del mismo tour (por guía/personaje). Usa ＋ para crear una nueva, en blanco o copiando otra.</div><div class="grid" id="versGrid"></div></div></div>
  <!-- VISTA 3: editor -->
  <div id="vEdit" class="hide"></div>
</main>
<div class="toast" id="toast"></div>
<div id="ov"><div class="ovbar"><button class="btn" onclick="window.print()">🖨 Imprimir / PDF</button><button class="btn ghost" onclick="document.getElementById('ov').classList.remove('show')">Cerrar</button></div><div id="doc"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const EDITORS=['Alan','Joseph','Víctor','Ana','Deisy','Javi'];
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let WHO=localStorage.getItem('cpp_who')||'';
let TOURS=[],REGLAS=[],T=null,V=null,G=null,PAR=[],MOM=[],COSTOS=[],TPVP={};
let tt;function toast(m,ok=true){const t=$('toast');t.textContent=m;t.style.background=ok?'#23402a':'#3a2a2a';t.style.color=ok?'#bfe6c4':'#e6bfbf';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1400);}
const deb={};function debounce(k,fn){clearTimeout(deb[k]);deb[k]=setTimeout(fn,600);}
function show(v){['vTours','vVers','vEdit'].forEach(x=>$(x).classList.toggle('hide',x!==v));}

EDITORS.forEach(n=>{const b=document.createElement('button');b.textContent=n;b.onclick=()=>{WHO=n;localStorage.setItem('cpp_who',n);openApp();};$('who').appendChild(b);});
function openApp(){$('gate').style.display='none';$('whoLbl').textContent=WHO;load();}
if(WHO)openApp();

async function load(){
  const [{data:tours},{data:vers},{data:reglas}]=await Promise.all([
    sb.from('tours').select('id,nombre,slug,estatus').order('nombre'),
    sb.from('guia_versiones').select('id,tour_id,nombre,autor,cover_url'),
    sb.from('guia_reglas').select('*').eq('ambito','global').order('orden')
  ]);
  REGLAS=reglas||[];
  const byTour={};(vers||[]).forEach(v=>{(byTour[v.tour_id]=byTour[v.tour_id]||[]).push(v);});
  TOURS=(tours||[]).map(t=>({...t,versiones:byTour[t.id]||[]}));
  renderTours();crumbs();show('vTours');
}
function crumbs(){
  let h='<a id="cbHome">Tours</a>';
  if(T){h+=' › <a id="cbVers">'+esc(T.nombre)+'</a>';}
  if(V&&!$('vEdit').classList.contains('hide')){h+=' › '+esc(V.nombre);}
  $('crumbs').innerHTML=h;
  const home=$('cbHome');if(home)home.onclick=()=>{T=null;V=null;show('vTours');crumbs();};
  const cv=$('cbVers');if(cv)cv.onclick=()=>openTour(T.id);
}
function coverStyle(url){return url?`style="background-image:url('${esc(url)}')"`:'';}
function renderTours(){
  $('toursGrid').innerHTML=TOURS.map(t=>{
    const cover=(t.versiones.find(v=>v.cover_url)||{}).cover_url;
    return `<div class="card" data-t="${t.id}"><div class="cover" ${coverStyle(cover)}>${esc(t.nombre)}</div><div class="meta">${t.versiones.length} versión(es)${t.estatus==='borrador'?' · borrador':''}</div></div>`;
  }).join('');
  $('toursGrid').querySelectorAll('.card').forEach(c=>c.onclick=()=>openTour(c.dataset.t));
}
function openTour(id){
  T=TOURS.find(x=>x.id===id);if(!T)return;V=null;
  $('versTtl').textContent='Versiones · '+T.nombre;
  $('versGrid').innerHTML=T.versiones.map(v=>`<div class="card" data-v="${v.id}"><div class="cover" ${coverStyle(v.cover_url)}>${esc(v.nombre)}</div><div class="meta">${v.autor?('por '+esc(v.autor)):'—'}<span class="delv" data-del="${v.id}" title="Borrar versión" style="float:right;color:var(--red);cursor:pointer">🗑</span></div></div>`).join('')
    +`<div class="card add" id="addVer">＋ Nueva versión</div>`;
  $('versGrid').querySelectorAll('.card[data-v]').forEach(c=>c.onclick=(e)=>{if(e.target.classList.contains('delv'))return;openEditor(c.dataset.v);});
  $('versGrid').querySelectorAll('.delv').forEach(d=>d.onclick=async(e)=>{e.stopPropagation();if(!confirm('¿Borrar esta versión y todo su contenido?'))return;const id=d.dataset.del;await sb.from('guia_paradas').delete().eq('version_id',id);await sb.from('guia_momentos').delete().eq('version_id',id);await sb.from('guia_tour').delete().eq('version_id',id);await sb.from('guia_versiones').delete().eq('id',id);toast('Versión borrada');await load();openTour(T.id);});
  $('addVer').onclick=newVersion;
  show('vVers');crumbs();
}
async function newVersion(){
  const nombre=prompt('Nombre de la nueva versión (ej. "Frida Kahlo", "Andrés/Víctor"):');if(!nombre)return;
  const autor=prompt('¿Qué guía la arma? (autor)','')||null;
  let copyFrom=null;
  if(T.versiones.length){
    const opts=T.versiones.map((v,i)=>`${i+1}) ${v.nombre}`).join('\n');
    const sel=prompt('¿Copiar de una versión existente? Escribe el número, o deja vacío para empezar en blanco:\n'+opts,'');
    if(sel&&T.versiones[+sel-1])copyFrom=T.versiones[+sel-1];
  }
  const {data:nv,error}=await sb.from('guia_versiones').insert({tour_id:T.id,nombre,autor}).select().single();
  if(error)return toast('Error: '+error.message,false);
  if(copyFrom){
    const [{data:sg},{data:sp},{data:sm}]=await Promise.all([
      sb.from('guia_tour').select('*').eq('version_id',copyFrom.id).maybeSingle(),
      sb.from('guia_paradas').select('*').eq('version_id',copyFrom.id).order('orden'),
      sb.from('guia_momentos').select('*').eq('version_id',copyFrom.id).order('orden')
    ]);
    if(sg){const {id,version_id,updated_at,...rest}=sg;await sb.from('guia_tour').insert({...rest,tour_id:T.id,version_id:nv.id});}
    if(sp&&sp.length)await sb.from('guia_paradas').insert(sp.map(({id,version_id,created_at,...r})=>({...r,tour_id:T.id,version_id:nv.id})));
    if(sm&&sm.length)await sb.from('guia_momentos').insert(sm.map(({id,version_id,...r})=>({...r,tour_id:T.id,version_id:nv.id})));
    toast('Versión creada copiando "'+copyFrom.nombre+'"');
  } else toast('Versión creada');
  await load();openTour(T.id);
}

async function openEditor(vid){
  const vs=T.versiones.find(x=>x.id===vid)||(await sb.from('guia_versiones').select('*').eq('id',vid).single()).data;
  V=vs;
  let g=(await sb.from('guia_tour').select('*').eq('version_id',vid).maybeSingle()).data;
  if(!g){g=(await sb.from('guia_tour').insert({tour_id:T.id,version_id:vid,tiempo_max_min:150}).select().single()).data;}
  G=g;
  const [{data:p},{data:m},{data:vfull}]=await Promise.all([
    sb.from('guia_paradas').select('*').eq('version_id',vid).order('orden'),
    sb.from('guia_momentos').select('*').eq('version_id',vid).order('orden'),
    sb.from('guia_versiones').select('*').eq('id',vid).single()
  ]);
  PAR=p||[];MOM=m||[];V=vfull.data||vs;
  COSTOS=((await sb.from('tour_costos').select('concepto,categoria,cantidad,costo_unitario,tipo_costo').eq('tour_id',T.id).order('orden')).data)||[];
  TPVP=((await sb.from('tours').select('pvp,tipo_jornada').eq('id',T.id).maybeSingle()).data)||{};
  renderEditor();show('vEdit');crumbs();
}
function renderEditor(){
  const reglasH=REGLAS.map(r=>`<div class="regla">⚖️ ${esc(r.regla)}</div>`).join('');
  $('vEdit').innerHTML=`
  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px">
    <button class="btn" id="btnDoc">📄 Ver documento / PDF</button>
    <button class="btn ghost" id="btnEditDoc">✏️ Editar documento</button>
    <button class="btn ghost" id="btnBack">↩ Versiones</button>
  </div>
  <div class="sec"><h2>${esc(V.nombre)}</h2><div class="d">${esc(T.nombre)} ${V.autor?('· por '+esc(V.autor)):''}</div>
    <div class="grid2">
      <div class="fg"><label>Nombre de la versión</label><input id="vNombre" value="${esc(V.nombre)}"></div>
      <div class="fg"><label>Autor (guía)</label><input id="vAutor" value="${esc(V.autor)}"></div>
      <div class="fg" style="grid-column:1/-1"><label>Portada (URL de imagen)</label><input id="vCover" value="${esc(V.cover_url)}" placeholder="https://…"></div>
    </div>
  </div>
  ${reglasH?`<div class="sec"><h2>Reglas base</h2>${reglasH}</div>`:''}
  <div class="sec"><h2>Itinerario y ruta</h2><div class="d">Recorrido general. Pega un link de Google Maps, o genera uno con las paradas (botón en el documento).</div>
    <div class="grid2"><div class="fg"><label>Tiempo máx (min)</label><input type="number" id="tmax" value="${G.tiempo_max_min||150}"></div>
    <div class="fg"><label>Link Google Maps de la ruta</label><input id="maps" value="${esc(G.maps_url)}" placeholder="https://maps.app.goo.gl/…"></div></div>
    <div class="fg"><label>Itinerario</label><textarea id="itin" rows="3">${esc(G.itinerario)}</textarea></div>
  </div>
  <div class="sec"><h2>Paradas · qué contar</h2><div class="d">Cada parada: hora aprox. de llegada (para no irse perdiendo), qué contar y, si aplica, la narrativa en 1ª persona del protagonista.</div>
    <div id="paradas"></div><button class="btn" id="addParada">+ Parada</button>
  </div>
  <div class="sec"><h2>Coordinación</h2>
    <div class="grid2">
      <div class="fg"><label>Transportes</label><textarea data-coord="coord_transportes">${esc(G.coord_transportes)}</textarea></div>
      <div class="fg"><label>Comidas / gastronómico</label><textarea data-coord="coord_comidas">${esc(G.coord_comidas)}</textarea></div>
      <div class="fg"><label>Boletos / accesos</label><textarea data-coord="coord_boletos">${esc(G.coord_boletos)}</textarea></div>
      <div class="fg"><label>Confirmación con protagonista</label><textarea data-coord="coord_protagonista">${esc(G.coord_protagonista)}</textarea></div>
      <div class="fg" style="grid-column:1/-1"><label>Tips de otros guías</label><textarea data-coord="coord_tips">${esc(G.coord_tips)}</textarea></div>
    </div>
  </div>
  <div class="sec"><h2>Momentos WOW</h2><div class="d">Hasta 10-12 momentos memorables.</div><div id="momentos"></div><button class="btn" id="addMomento">+ Momento</button></div>
  <div class="sec hide" id="docEditSec"><h2>Documento (override)</h2><div class="d">Si escribes aquí, el PDF usará este texto/HTML en vez de generarse de los campos. Déjalo vacío para usar la versión automática.</div><textarea id="docHtml" rows="10">${esc(V.documento_html)}</textarea><div style="margin-top:8px"><button class="btn sm" id="saveDoc">Guardar documento</button></div></div>`;

  $('btnBack').onclick=()=>openTour(T.id);
  $('btnDoc').onclick=()=>openDoc();
  $('btnEditDoc').onclick=()=>{$('docEditSec').classList.toggle('hide');$('docEditSec').scrollIntoView({behavior:'smooth'});};
  $('saveDoc').onclick=async()=>{await sb.from('guia_versiones').update({documento_html:$('docHtml').value||null,updated_at:new Date().toISOString()}).eq('id',V.id);V.documento_html=$('docHtml').value;toast('Documento guardado');};
  $('vNombre').oninput=()=>debounce('vn',()=>saveVer({nombre:$('vNombre').value}));
  $('vAutor').oninput=()=>debounce('va',()=>saveVer({autor:$('vAutor').value||null}));
  $('vCover').oninput=()=>debounce('vc',()=>saveVer({cover_url:$('vCover').value||null}));
  $('itin').oninput=()=>debounce('itin',()=>saveTour({itinerario:$('itin').value}));
  $('maps').oninput=()=>debounce('maps',()=>saveTour({maps_url:$('maps').value.trim()||null}));
  $('tmax').onchange=()=>saveTour({tiempo_max_min:+$('tmax').value||150});
  document.querySelectorAll('[data-coord]').forEach(el=>el.oninput=()=>debounce(el.dataset.coord,()=>saveTour({[el.dataset.coord]:el.value})));
  renderParadas();renderMomentos();
}
async function saveVer(patch){Object.assign(V,patch);await sb.from('guia_versiones').update({...patch,updated_at:new Date().toISOString()}).eq('id',V.id);toast('Guardado');}
async function saveTour(patch){G=Object.assign(G||{},patch);const {error}=await sb.from('guia_tour').update({...patch,updated_at:new Date().toISOString()}).eq('version_id',V.id);if(error)toast('Error: '+error.message,false);else toast('Guardado');}

function renderParadas(){
  $('paradas').innerHTML=PAR.map((p,i)=>`<div class="item" data-i="${i}" style="${p.opcional?'opacity:.65;border-style:dashed':''}">
    <div class="hd"><span class="num">${i+1}</span><b>${esc(p.nombre)||'Parada'}</b><label style="margin-left:auto;font-size:11px;color:var(--muted);text-transform:none;display:flex;align-items:center;gap:4px"><input type="checkbox" data-f="opcional" ${p.opcional?'checked':''} style="width:auto"> no considerar</label><span class="x" data-del="${i}" style="margin-left:8px">✕</span></div>
    <div class="grid2">
      <div class="fg"><label>Nombre de la parada</label><input data-f="nombre" value="${esc(p.nombre)}"></div>
      <div class="fg"><label>Hora aprox. de llegada</label><input data-f="hora_aprox" value="${esc(p.hora_aprox)}" placeholder="ej. 10:30"></div>
      <div class="fg"><label>Protagonista</label><input data-f="protagonista" value="${esc(p.protagonista)}"></div>
      <div class="fg"><label>Link Maps de la parada</label><input data-f="maps_url" value="${esc(p.maps_url)}"></div>
    </div>
    <div class="grid2">
      <div class="fg"><label>Qué contar (ES)</label><textarea data-f="descripcion">${esc(p.descripcion)}</textarea></div>
      <div class="fg"><label>What to tell (EN)</label><textarea data-f="descripcion_en">${esc(p.descripcion_en)}</textarea></div>
      <div class="fg"><label>Narrativa / referencia (ES)</label><textarea data-f="narrativa">${esc(p.narrativa)}</textarea></div>
      <div class="fg"><label>Narrative / reference (EN)</label><textarea data-f="narrativa_en">${esc(p.narrativa_en)}</textarea></div>
    </div>
  </div>`).join('')||'<div class="muted">Sin paradas. Agrega la primera.</div>';
  $('paradas').querySelectorAll('.item').forEach(it=>{const i=+it.dataset.i;
    it.querySelectorAll('[data-f]').forEach(el=>{const isCk=el.type==='checkbox';el[isCk?'onchange':'oninput']=()=>{PAR[i][el.dataset.f]=isCk?el.checked:el.value;debounce('par'+i,()=>savePar(i));if(el.dataset.f==='opcional')renderParadas();};});
    it.querySelector('[data-del]').onclick=async()=>{const p=PAR[i];if(p.id)await sb.from('guia_paradas').delete().eq('id',p.id);PAR.splice(i,1);renderParadas();};
  });
}
async function savePar(i){const p=PAR[i];const row={tour_id:T.id,version_id:V.id,orden:i+1,nombre:p.nombre||'Parada',hora_aprox:p.hora_aprox||null,protagonista:p.protagonista||null,opcional:!!p.opcional,descripcion:p.descripcion||null,descripcion_en:p.descripcion_en||null,narrativa:p.narrativa||null,narrativa_en:p.narrativa_en||null,maps_url:p.maps_url||null};if(p.id){await sb.from('guia_paradas').update(row).eq('id',p.id);}else{const {data}=await sb.from('guia_paradas').insert(row).select().single();if(data)p.id=data.id;}toast('Guardado');}
$('vEdit').addEventListener('click',e=>{if(e.target&&e.target.id==='addParada'){PAR.push({nombre:'',orden:PAR.length+1});renderParadas();}if(e.target&&e.target.id==='addMomento'){MOM.push({titulo:'',orden:MOM.length+1});renderMomentos();}});

function renderMomentos(){
  $('momentos').innerHTML=MOM.map((m,i)=>`<div class="item" data-i="${i}">
    <div class="hd"><span class="num">${i+1}</span><input data-f="titulo" value="${esc(m.titulo)}" placeholder="Título del momento" style="font-weight:600"><span class="x" data-del="${i}">✕</span></div>
    <div class="fg"><textarea data-f="descripcion" placeholder="¿Qué pasa en este momento?">${esc(m.descripcion)}</textarea></div>
  </div>`).join('')||'<div class="muted">Sin momentos.</div>';
  $('momentos').querySelectorAll('.item').forEach(it=>{const i=+it.dataset.i;
    it.querySelectorAll('[data-f]').forEach(el=>el.oninput=()=>{MOM[i][el.dataset.f]=el.value;debounce('mom'+i,()=>saveMom(i));});
    it.querySelector('[data-del]').onclick=async()=>{const m=MOM[i];if(m.id)await sb.from('guia_momentos').delete().eq('id',m.id);MOM.splice(i,1);renderMomentos();};
  });
}
async function saveMom(i){const m=MOM[i];const row={tour_id:T.id,version_id:V.id,orden:i+1,titulo:m.titulo||'Momento',descripcion:m.descripcion||null};if(m.id){await sb.from('guia_momentos').update(row).eq('id',m.id);}else{const {data}=await sb.from('guia_momentos').insert(row).select().single();if(data)m.id=data.id;}toast('Guardado');}

function mapsRoute(){
  const stops=PAR.map(p=>{
    const u=(p.maps_url||'').trim();
    const cm=u.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||u.match(/(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(cm)return cm[1]+','+cm[2];
    return encodeURIComponent((p.nombre||'')+', Ciudad de México');
  }).filter(Boolean);
  if(stops.length<2)return null;
  return 'https://www.google.com/maps/dir/'+stops.join('/');
}
function buildDoc(){
  const route=mapsRoute();
  const reglas=REGLAS.map(r=>`<li>${esc(r.regla)}</li>`).join('');
  const paradas=PAR.map((p,i)=>`<div class="stop">${p.opcional?'<span style="background:#eee;color:#888;border-radius:4px;padding:0 6px;font-size:11px">opcional · puede no considerarse</span>':''}<div>${p.hora_aprox?`<span class="hora">${esc(p.hora_aprox)}</span>`:''}<b>${i+1}. ${esc(p.nombre)||'Parada'}</b>${p.protagonista?` — <i>${esc(p.protagonista)}</i>`:''}</div>${p.descripcion?`<div>${esc(p.descripcion)}</div>`:''}${p.descripcion_en?`<div style="color:#8a7a55">${esc(p.descripcion_en)}</div>`:''}${p.narrativa?`<div class="narr">“${esc(p.narrativa)}”</div>`:''}${p.narrativa_en?`<div class="narr" style="color:#8a7a55">“${esc(p.narrativa_en)}”</div>`:''}${p.maps_url?`<div><a href="${esc(p.maps_url)}" target="_blank">📍 Maps</a></div>`:''}</div>`).join('');
  const mom=MOM.map((m,i)=>`<li><b>${esc(m.titulo)}</b>${m.descripcion?' — '+esc(m.descripcion):''}</li>`).join('');
  const cvT=COSTOS.filter(c=>(c.tipo_costo||'variable')==='variable').reduce((s,c)=>s+(c.cantidad||0)*(c.costo_unitario||0),0);
  const cfT=COSTOS.filter(c=>c.tipo_costo==='fijo').reduce((s,c)=>s+(c.cantidad||0)*(c.costo_unitario||0),0);
  const costoH=COSTOS.length?`<h3>Costos y PVP (del costeo del tour)</h3><ul>${COSTOS.map(c=>`<li>${esc(c.concepto)} — $${c.costo_unitario} (${esc(c.tipo_costo||'variable')})</li>`).join('')}<li><b>Costo variable/pax ≈ $${cvT}</b>${cfT?` · costo fijo/grupo $${cfT}`:''}${TPVP.pvp?` · <b>PVP propuesto $${TPVP.pvp}</b>`:''}</li></ul>`:'';
  return `<h1>${esc(T.nombre)}</h1><div class="sub">Guía del Guía · versión "${esc(V.nombre)}"${V.autor?(' · por '+esc(V.autor)):''} · tiempo máx ${G.tiempo_max_min||150} min</div>
  ${reglas?`<h3>Reglas base</h3><ul>${reglas}</ul>`:''}
  <h3>Itinerario</h3><p>${esc(G.itinerario)||'—'}</p>
  ${(G.maps_url||route)?`<p style="background:#f5efdf;border:1px solid #e0c98a;border-radius:8px;padding:8px 12px"><a href="${esc(G.maps_url||route)}" target="_blank">🗺️ Abrir / descargar la ruta en Google Maps</a><br><span style="font-size:11px;color:#888">Ábrela en tu cel y sigue las paradas en orden.</span></p>`:''}
  ${costoH}
  <h3>Paradas</h3>${paradas||'<p>—</p>'}
  ${mom?`<h3>Momentos WOW</h3><ul>${mom}</ul>`:''}
  ${(G.coord_transportes||G.coord_comidas||G.coord_boletos||G.coord_protagonista||G.coord_tips)?`<h3>Coordinación</h3><ul>${[['Transportes',G.coord_transportes],['Comidas',G.coord_comidas],['Boletos',G.coord_boletos],['Protagonista',G.coord_protagonista],['Tips',G.coord_tips]].filter(x=>x[1]).map(x=>`<li><b>${x[0]}:</b> ${esc(x[1])}</li>`).join('')}</ul>`:''}`;
}
function openDoc(){
  // si hay link de ruta generado y no hay maps_url guardado, lo guardamos
  const route=mapsRoute();if(route&&!G.maps_url){saveTour({maps_url:route});$('maps')&&($('maps').value=route);}
  $('doc').innerHTML = (V.documento_html&&V.documento_html.trim())? V.documento_html : buildDoc();
  $('ov').classList.add('show');window.scrollTo(0,0);
}
</script></body></html>
