<!--
  EL ALTA DEL ATENEISTA · una sola puerta.

  Javi, 26-oct-2026. Hasta hoy habia cinco altas -touroperadora, productora,
  artesano, hotel, concierge- y cada una escribia en su propio registro. Por eso
  Barrio Hostel esta dado de alta tres veces, Cafe Cumbre dos, y Flylike estaba
  con dos nombres distintos para la misma persona. Nadie decidio eso: el sistema
  preguntaba "que eres" y solo dejaba elegir una respuesta, asi que quien hacia
  dos cosas se daba de alta dos veces.

  Aqui se pregunta QUE TRAES, y se pueden marcar varias.

  FUERA DEL PANEL, A PROPOSITO. Esta pagina se abre desde una liga que se dicta
  por telefono y se pega en WhatsApp, en el movil de alguien que todavia no sabe
  quienes somos. No lleva barra lateral, ni sesion, ni nada del dashboard.

  LO QUE SE MARCA EN EL PASO 1 DECIDE EL RESTO. Con solo Membresia son seis
  pasos, porque no hay nada que cobrar. El anticipo solo se ofrece a quien trae
  experiencias: los campos del cobro dividido solo existen en las reservas de
  tours, asi que ofrecerselo a un evento seria prometer algo que no se puede
  guardar.
-->
<style>
:root{
  --naranja:#F2682A;--naranja-oscuro:#C9501A;--naranja-suave:#FDE7DC;
  --magenta:#E2188E;--magenta-oscuro:#B3106F;--magenta-suave:#FBDCEE;
  --rosa:#F8BBCB;--cielo:#8DC8EA;--cielo-suave:#E4F1FA;
  --tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;--tenue:#A9A096;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--alerta:#8C6212;--alerta-bg:#F6EBD5;
  --error:#9E3B2E;--error-bg:#F6E1DD;
  --artesania:#D9A441;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--papel);font-family:Inter,system-ui,sans-serif;color:var(--tinta)}
input,select,textarea{font:inherit;color:var(--tinta)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}

.cab{background:var(--tinta);min-height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;position:sticky;top:0;z-index:20}
.cab img{width:28px;height:28px;border-radius:7px}
.cab .marca{font:700 18px Oswald;color:#fff;letter-spacing:.05em}
.cab .paso{margin-left:auto;font:500 12.5px Inter;color:#C9C2B8}
.barrita{height:4px;background:#2A2521}
.barrita i{display:block;height:100%;background:var(--naranja);transition:width .3s}

.wrap{max-width:1000px;margin:0 auto;padding:26px 20px 120px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:34px;align-items:start}
.pasos{position:sticky;top:84px}
.pasos .et{font:600 10.5px Oswald;letter-spacing:.11em;color:var(--tenue);margin:0 0 10px}
.pasos ol{list-style:none;margin:0;padding:0}
.pasos li{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;font:600 12.5px Oswald;letter-spacing:.06em;color:var(--gris)}
.pasos li .n{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 11px Inter;background:var(--hueso);color:var(--gris)}
.pasos li.on{background:#fff;color:var(--tinta);box-shadow:var(--sombra)}
.pasos li.on .n{background:var(--tinta);color:#fff}
.pasos li.ok .n{background:var(--naranja);color:#fff}
.pasos .nota{font:400 12px/1.5 Inter;color:var(--tenue);margin-top:14px}

h1{font:700 34px/1.1 Oswald;letter-spacing:.02em;margin:0 0 6px;text-transform:uppercase}
.lead{font:400 15px/1.55 Inter;color:var(--gris);margin:0 0 22px;text-wrap:pretty}
.tarj{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;margin-bottom:16px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo .et{font:600 11px Oswald;letter-spacing:.09em;color:var(--gris)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea);border-radius:9px;padding:12px 14px;font-size:15px;width:100%;background:#fff}
.campo .ay{font:400 12.5px Inter;color:var(--tenue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.caps{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cap{cursor:pointer;border:2px solid var(--linea);border-radius:12px;padding:15px 16px;background:#fff;display:flex;gap:12px;align-items:flex-start;text-align:left}
.cap .box{flex:0 0 24px;height:24px;border-radius:7px;border:2px solid var(--linea);display:grid;place-items:center;font:700 14px Inter;color:transparent;background:#fff}
.cap b{display:flex;align-items:center;gap:7px;font:700 14px Oswald;letter-spacing:.07em;text-transform:uppercase}
.cap b i{width:7px;height:7px;border-radius:50%;background:var(--tenue)}
.cap span{display:block;font:400 13px/1.5 Inter;color:var(--gris);margin-top:4px}
.cap.on{border-color:var(--naranja);background:var(--naranja-suave)}
.cap.on .box{background:var(--naranja);border-color:var(--naranja);color:#fff}
.cap[data-k="experiencias"] b i{background:var(--naranja)}
.cap[data-k="eventos"] b i{background:var(--magenta)}
.cap[data-k="hotel"] b i{background:var(--cielo)}
.cap[data-k="artesania"] b i{background:var(--artesania)}
.cap[data-k="membresia"] b i{background:var(--ok)}

.opt{cursor:pointer;border:2px solid var(--linea);border-radius:12px;padding:15px 16px;background:#fff;display:block;text-align:left}
.opt b{display:block;font:700 14px Oswald;letter-spacing:.06em;text-transform:uppercase}
.opt span{display:block;font:400 13px/1.5 Inter;color:var(--gris);margin-top:4px}
.opt.on{border-color:var(--naranja);background:var(--naranja-suave)}

.aviso{border-radius:10px;padding:12px 14px;font:400 13.5px/1.55 Inter}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.aviso.alerta{background:var(--alerta-bg);color:var(--alerta)}
.aviso.err{background:var(--error-bg);color:var(--error)}
.aviso.info{background:var(--cielo-suave);color:#1a5f85}
.h3{font:700 17px Oswald;letter-spacing:.05em;text-transform:uppercase;margin:0}
.cursiva{font:italic 400 19px 'Lobster Two';color:var(--magenta)}

.convenio{background:var(--hueso);border:1px solid var(--linea);border-radius:10px;padding:16px;max-height:300px;overflow:auto;font:400 13.5px/1.6 Inter;color:var(--tinta-2)}
.convenio h4{font:700 13px Oswald;letter-spacing:.07em;text-transform:uppercase;margin:16px 0 6px}
.convenio h4:first-child{margin-top:0}
.chk{display:flex;gap:11px;align-items:flex-start;cursor:pointer;font:400 14px/1.5 Inter}
.chk input{margin-top:3px;width:18px;height:18px;accent-color:var(--naranja)}

.pie{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--linea);padding:12px 20px;display:flex;gap:10px;align-items:center;z-index:30}
.pie .in{max-width:1000px;margin:0 auto;width:100%;display:flex;gap:10px;align-items:center}
.pie .hueco{flex:1}
.btn{cursor:pointer;font:600 13px Oswald;letter-spacing:.05em;padding:12px 20px;border-radius:9px;border:2px solid transparent;background:none}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.naranja:hover{border-color:var(--naranja-oscuro);background:var(--naranja-oscuro)}
.btn.tinta{border-color:var(--tinta);color:var(--tinta)}
.btn[disabled]{opacity:.45;cursor:default}
.oculto{display:none!important}

@media(max-width:860px){
  .wrap{grid-template-columns:1fr;gap:0;padding:18px 16px 110px}
  .pasos{display:none}
  .caps{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  h1{font-size:26px}
  .btn{padding:14px 18px}
}
.opc{border:1.5px solid var(--linea);border-radius:12px;padding:14px 16px;cursor:pointer;margin-bottom:10px;background:#fff}
.opc:hover{border-color:var(--tenue)}
.opc.on{border-color:var(--naranja);background:var(--naranja-suave);box-shadow:0 0 0 3px var(--naranja-suave)}
.opc b{display:block;font:600 16px Inter}
.opc span{display:block;font:400 13px Inter;color:var(--gris);margin-top:3px}
</style></head>

</div></div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* Lo que se va llenando. Vive en memoria y se guarda de una vez al firmar: si
   alguien abandona a la mitad no dejamos una ficha a medias en el padrón. */
var D={capacidades:[],tipo_persona:'',forma_pago:'',tiene_poliza:null,poliza_cotizar:false};
var paso=0, enviado=null;

var CAPS=[
 {k:'experiencias',t:'Experiencias',d:'Tours, talleres, recorridos. Tú los guías, nosotros te traemos clientes.'},
 {k:'eventos',     t:'Eventos',     d:'Una función, un concierto, una noche. En tu espacio o en el nuestro.'},
 {k:'hotel',       t:'Hotel',       d:'Tienes un hotel o un grupo de hoteles. Das de alta tus espacios y vendes a tus huéspedes.'},
 {k:'artesania',   t:'Artesanía',   d:'Haces piezas que se pueden vender en la tienda.'},
 {k:'membresia',   t:'Membresía',   d:'Tu lugar en el espacio común del Ateneo de Virreyes. Sin costo.'}];

function trae(k){ return D.capacidades.indexOf(k)>=0; }
/* Produce quien trae algo que se vende. Quien solo viene por su membresía no
   cobra nada, así que no hay nada que preguntarle sobre cobros. */
function produce(){ return ['experiencias','eventos','hotel','artesania'].some(trae); }

function PASOS(){
  /* LA PLAZA VA PRIMERO. En el alta vieja era el primer campo y era
     obligatorio: «si una touroperadora se da de alta en Puebla, vende en
     Puebla». Al unificar se perdió, y sin ella el aviso de un alta de Puebla
     le llega a experience.cdmx y Ale no se entera nunca. */
  var p=[{k:'sede',t:'Dónde vendes'},{k:'caps',t:'Qué traes'},{k:'quien',t:'Quién eres'},{k:'contacto',t:'Cómo te localizamos'}];
  if(produce()) p.push({k:'pago',t:'Cómo te pagamos'});
  p.push({k:'poliza',t:'Tu póliza'},{k:'convenio',t:'El convenio'},{k:'listo',t:'Listo'});
  return p;
}

function pintaLista(){
  var P=PASOS();
  $('lista').innerHTML=P.map(function(x,i){
    return '<li class="'+(i===paso?'on':(i<paso?'ok':''))+'"><span class="n">'+
      (i<paso?'✓':(i+1))+'</span><span>'+esc(x.t)+'</span></li>';}).join('');
  $('hPaso').textContent='Paso '+(paso+1)+' de '+P.length;
  $('hBar').style.width=Math.round((paso+1)/P.length*100)+'%';
}

/* ---------- los pasos ---------- */
var P={};

P.caps=function(){
  return {t:'¿Qué traes a la comunidad?',
    s:'Eres ateneísta porque produces o porque tienes tu membresía. Las dos valen igual.',
    h:'<div class="caps">'+CAPS.map(function(c){
        return '<button type="button" class="cap'+(trae(c.k)?' on':'')+'" data-k="'+c.k+'">'+
          '<span class="box">✓</span><span><b><i></i>'+esc(c.t)+'</b>'+
          '<span>'+esc(c.d)+'</span></span></button>';}).join('')+'</div>'+
      '<div class="aviso info" style="margin-top:16px">Puedes marcar varias, y añadir más después sin volver a empezar.</div>'};
};
P.caps.ata=function(){
  Array.prototype.forEach.call(document.querySelectorAll('.cap'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k'), i=D.capacidades.indexOf(k);
      if(i>=0)D.capacidades.splice(i,1); else D.capacidades.push(k);
      pinta(); };});
};
P.caps.vale=function(){ return D.capacidades.length ? '' : 'Marca al menos una.'; };

P.sede=function(){
  var sd=D.sede||'';
  return {t:'¿Dónde vendes?', s:'La plaza manda: decide quién te atiende y dónde se vende lo tuyo.',
   h:'<div class="tarj">'+
     '<div class="opc'+(sd==='cdmx'?' on':'')+'" data-sede="cdmx">'+
       '<b>Ciudad de México</b><span>Centro Histórico, Roma, Condesa, Coyoacán…</span></div>'+
     '<div class="opc'+(sd==='puebla'?' on':'')+'" data-sede="puebla">'+
       '<b>Puebla y Cholula</b><span>Te atiende el equipo de Puebla.</span></div>'+
     '<div class="aviso info">Si operas en las dos, empieza por una: la otra la abrimos nosotros '+
       'con una ficha aparte, porque las ventas y los equipos son distintos.</div>'+
   '</div>'};
};
P.sede.ata=function(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-sede]'),function(d){
    d.onclick=function(){ D.sede=d.getAttribute('data-sede'); pinta(); };});
};
P.sede.vale=function(){ return D.sede?'':'Dinos en qué plaza vendes.'; };

P.quien=function(){
  var tp=D.tipo_persona, ext=(D.nacionalidad||'').trim() && (D.nacionalidad||'').toLowerCase().indexOf('mex')<0;
  return {t:'¿Quién eres?', s:'Lo que nos permite facturarte y responder por lo que vendes.',
   h:'<div class="tarj">'+
     '<div class="campo"><span class="et">NOMBRE CON EL QUE TE CONOCEN</span>'+
       '<input id="f_nombre_comercial" value="'+esc(D.nombre_comercial)+'" placeholder="Hiking Puebla">'+
       '<span class="ay">Es el que va a ver el cliente.</span></div>'+
     '<div class="campo"><span class="et">¿CÓMO FACTURAS?</span>'+
       '<select id="f_tipo_persona">'+
         '<option value="">—</option>'+
         '<option value="moral"'+(tp==='moral'?' selected':'')+'>Empresa (persona moral)</option>'+
         '<option value="fisica"'+(tp==='fisica'?' selected':'')+'>Persona física con actividad empresarial</option>'+
         '<option value="fisica_sin"'+(tp==='fisica_sin'?' selected':'')+'>Persona física sin actividad empresarial</option>'+
       '</select></div>'+
     (tp==='moral'?'<div class="campo"><span class="et">RAZÓN SOCIAL</span>'+
       '<input id="f_razon_social" value="'+esc(D.razon_social)+'"></div>':'')+
     (tp==='fisica_sin'
       ? '<div class="campo"><span class="et">CURP</span><input id="f_curp" maxlength="18" value="'+esc(D.curp)+'">'+
         '<span class="ay">Una persona física sin actividad empresarial no tiene RFC. No te lo pedimos.</span></div>'
       : (tp? '<div class="campo"><span class="et">RFC</span><input id="f_rfc" maxlength="13" value="'+esc(D.rfc)+'"></div>':''))+
     '<div class="g2">'+
       '<div class="campo"><span class="et">CIUDAD</span><input id="f_ciudad" value="'+esc(D.ciudad)+'"></div>'+
       '<div class="campo"><span class="et">NACIONALIDAD</span><input id="f_nacionalidad" value="'+esc(D.nacionalidad)+'" placeholder="Mexicana"></div>'+
     '</div>'+
     (ext?'<div class="g2">'+
       '<div class="campo"><span class="et">PASAPORTE</span><input id="f_pasaporte_numero" value="'+esc(D.pasaporte_numero)+'"></div>'+
       '<div class="campo"><span class="et">FORMA MIGRATORIA</span><input id="f_fm_numero" value="'+esc(D.fm_numero)+'"></div>'+
     '</div>':'')+
   '</div>'+
   (trae('hotel')?'<div class="tarj"><h3 class="h3">Tu hotel</h3>'+
     '<div class="aviso info">Un grupo de hoteles no es un hotel. Si tienes varias casas, da de alta el grupo: después cuelgas cada una.</div>'+
     '<div class="campo"><span class="et">¿QUÉ DAS DE ALTA?</span>'+
       '<select id="f_hotel_tipo"><option value="hotel"'+(D.hotel_tipo!=='grupo'?' selected':'')+'>Un hotel</option>'+
       '<option value="grupo"'+(D.hotel_tipo==='grupo'?' selected':'')+'>Un grupo o cadena</option></select></div>'+
     '<div class="campo"><span class="et">CUÁNTOS CUARTOS</span><input type="number" min="1" id="f_cuartos" value="'+esc(D.cuartos)+'"></div>'+
   '</div>':'')};
};
P.quien.ata=function(){ liga(); var t=$('f_tipo_persona'); if(t)t.onchange=function(){D.tipo_persona=t.value;pinta();};
  var n=$('f_nacionalidad'); if(n)n.onblur=function(){D.nacionalidad=n.value;pinta();}; };
P.quien.vale=function(){
  if(!(D.nombre_comercial||'').trim()) return 'Falta el nombre.';
  if(!D.tipo_persona) return 'Dinos cómo facturas.';
  if(D.tipo_persona==='fisica_sin' && !(D.curp||'').trim()) return 'Falta la CURP.';
  if(D.tipo_persona!=='fisica_sin' && !(D.rfc||'').trim()) return 'Falta el RFC.';
  return '';
};

P.contacto=function(){
  return {t:'¿Cómo te localizamos?', s:'Aquí llegan las reservas y lo de último momento.',
   h:'<div class="tarj">'+
     '<div class="campo"><span class="et">CORREO</span><input type="email" id="f_email" value="'+esc(D.email)+'"></div>'+
     '<div class="campo"><span class="et">CORREO PARA LOS AVISOS DE RESERVA · OPCIONAL</span>'+
       '<input type="email" id="f_email_notificaciones" value="'+esc(D.email_notificaciones)+'">'+
       '<span class="ay">Si lo dejas vacío usamos el de arriba.</span></div>'+
     '<div class="campo"><span class="et">WHATSAPP</span><input id="f_whatsapp" value="'+esc(D.whatsapp)+'" placeholder="+52 55 ..."></div>'+
     '<div class="g2">'+
       '<div class="campo"><span class="et">WEB · OPCIONAL</span><input id="f_web" value="'+esc(D.web)+'"></div>'+
       '<div class="campo"><span class="et">INSTAGRAM · OPCIONAL</span><input id="f_instagram" value="'+esc(D.instagram)+'"></div>'+
     '</div>'+
     '<div class="campo"><span class="et">QUIÉN RESPONDE · NOMBRE Y PUESTO</span><input id="f_administrador" value="'+esc(D.administrador)+'"></div>'+
   '</div>'};
};
P.contacto.ata=liga;
P.contacto.vale=function(){
  if(!(D.email||'').trim()) return 'Falta el correo.';
  if(!(D.whatsapp||'').trim()) return 'Falta el WhatsApp.';
  if(!(D.administrador||'').trim()) return 'Dinos quién responde.';
  return '';
};

P.pago=function(){
  var fp=D.forma_pago;
  /* EL ANTICIPO SOLO PARA EXPERIENCIAS. Los campos del cobro dividido
     -cobro_dividido, pago_ahora, pago_resto- solo existen en las reservas de
     tours. Ofrecerselo a un evento seria prometer algo que no se puede
     guardar. */
  return {t:'¿Cómo te pagamos?', s:'El dinero de lo que vendes te llega en el momento de la venta.',
   h:'<div class="tarj" style="gap:12px">'+
     '<button type="button" class="opt'+(fp==='stripe_connect'?' on':'')+'" data-fp="stripe_connect">'+
       '<b>Tu Stripe</b><span>El dinero cae directo en tu cuenta al cobrarse, y la comisión se retiene sola. '+
       'Tus datos bancarios y fiscales los escribes tú en Stripe: aquí no se piden ni se guardan.</span></button>'+
     (trae('experiencias')
       ? '<button type="button" class="opt'+(fp==='dos_cobros'?' on':'')+'" data-fp="dos_cobros">'+
         '<b>Anticipo y resto contigo</b><span>Cobramos el anticipo al reservar y el resto lo cobras tú el día del tour. '+
         'Si eliges esto no te pedimos Stripe.</span></button>'
       : '')+
     '</div>'+
     '<div class="tarj"><h3 class="h3">Lo que se reparte</h3>'+
     '<div class="aviso alerta">Lo normal del Grupo es <b>10% a quien vende · 10% a la plataforma · 5% a la casa</b>. '+
     'Si tu convenio dice otra cosa, lo editamos antes de publicarte nada.</div></div>'};
};
P.pago.ata=function(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-fp]'),function(b){
    b.onclick=function(){ D.forma_pago=b.getAttribute('data-fp'); pinta(); };});
};
P.pago.vale=function(){ return D.forma_pago ? '' : 'Elige cómo te pagamos.'; };

P.poliza=function(){
  return {t:'Tu póliza', s:'De responsabilidad civil. Si no tienes, la de la casa te cubre: esto avisa, nunca bloquea.',
   h:'<div class="tarj" style="gap:12px">'+
     '<button type="button" class="opt'+(D.tiene_poliza===true?' on':'')+'" data-pol="si"><b>Sí tengo</b>'+
       '<span>Apúntala y te avisamos cuando se acerque su vencimiento.</span></button>'+
     '<button type="button" class="opt'+(D.poliza_cotizar===true?' on':'')+'" data-pol="cotizar"><b>No tengo, quiero que me coticen</b>'+
       '<span>Te pasamos una cotización. Mientras tanto te cubre la de la casa.</span></button>'+
     '<button type="button" class="opt'+(D.tiene_poliza===false&&!D.poliza_cotizar?' on':'')+'" data-pol="no"><b>No tengo y no la quiero por ahora</b>'+
       '<span>Te cubre la de la casa.</span></button>'+
     '</div>'+
     (D.tiene_poliza===true?'<div class="tarj">'+
       '<div class="g2">'+
         '<div class="campo"><span class="et">ASEGURADORA</span><input id="f_poliza_aseguradora" value="'+esc(D.poliza_aseguradora)+'"></div>'+
         '<div class="campo"><span class="et">NÚMERO</span><input id="f_poliza_numero" value="'+esc(D.poliza_numero)+'"></div>'+
       '</div>'+
       '<div class="campo"><span class="et">VIGENTE HASTA</span><input type="date" id="f_poliza_vigencia" value="'+esc(D.poliza_vigencia)+'"></div>'+
     '</div>':'')};
};
P.poliza.ata=function(){
  liga();
  Array.prototype.forEach.call(document.querySelectorAll('[data-pol]'),function(b){
    b.onclick=function(){ var v=b.getAttribute('data-pol');
      D.tiene_poliza = v==='si'; D.poliza_cotizar = v==='cotizar'; pinta(); };});
};
P.poliza.vale=function(){ return (D.tiene_poliza===null) ? 'Dinos si tienes póliza.' : ''; };

P.convenio=function(){
  var caps=D.capacidades.map(function(k){ var c=CAPS.filter(function(x){return x.k===k;})[0]; return c?c.t:k; });
  return {t:'El convenio', s:'Uno solo, con un anexo por cada cosa que traes. Se arma con lo que acabas de escribir.',
   h:'<div class="tarj">'+
     '<div class="convenio">'+
       '<h4>Quiénes</h4><p>'+esc(D.nombre_comercial||'—')+
       (D.razon_social?' ('+esc(D.razon_social)+')':'')+
       ', con '+(D.tipo_persona==='fisica_sin'?'CURP '+esc(D.curp||''):'RFC '+esc(D.rfc||''))+
       ', y el Ateneo Turístico / Sincrético, del Grupo Casa Pepe.</p>'+
       '<h4>Qué traes</h4><p>'+esc(caps.join(' · '))+'. Cada una lleva su anexo.</p>'+
       '<h4>Cómo se cobra</h4><p>'+
         (D.forma_pago==='dos_cobros'
           ? 'Cobramos el anticipo al reservar y tú cobras el resto el día de la actividad.'
           : (D.forma_pago==='stripe_connect'
              ? 'El dinero cae en tu cuenta de Stripe en el momento de la venta, y la comisión se retiene en el mismo cobro.'
              : 'No hay cobro: vienes por tu membresía.'))+'</p>'+
       '<h4>Qué se reparte</h4><p>De cada venta: 10% para quien la vende, 10% para la plataforma y 5% para la casa que la aloja. '+
       'Si lo tuyo es distinto, se escribe aquí antes de firmar.</p>'+
       '<h4>Quién responde ante el cliente</h4><p>La reserva la tiene Casa Pepe y es quien responde ante el cliente. '+
       'Las devoluciones, las cancelaciones y el cobro los llevamos nosotros. '+
       'Tú respondes de que la actividad se dé como la describiste.</p>'+
       '<h4>Publicar</h4><p>Tú creas lo tuyo cuando quieras. Publicarlo lo aprobamos nosotros: '+
       'revisamos que lo que ve el cliente coincida con lo que va a recibir.</p>'+
       '<h4>Seguro</h4><p>'+(D.tiene_poliza===true?'Tienes póliza propia de responsabilidad civil.'
         :'No tienes póliza propia; te cubre la de la casa.')+'</p>'+
     '</div>'+
     '<label class="chk"><input type="checkbox" id="f_acepta"'+(D.acepta?' checked':'')+'>'+
       '<span>Lo leí y lo acepto. Entiendo que publicar lo aprueba el Ateneo.</span></label>'+
   '</div>'};
};
P.convenio.ata=function(){ var a=$('f_acepta'); if(a)a.onchange=function(){D.acepta=a.checked; pieAviso();}; };
P.convenio.vale=function(){ return D.acepta ? '' : 'Hay que aceptarlo para seguir.'; };

P.listo=function(){
  var caps=D.capacidades.map(function(k){ var c=CAPS.filter(function(x){return x.k===k;})[0]; return c?c.t:k; });
  if(!enviado) return {t:'Ya casi', s:'Falta mandarlo.', h:'<div class="tarj"><div class="aviso alerta">Dale a «Darme de alta» aquí abajo.</div></div>'};
  /* NO SE LE DICE QUE YA ESTA DENTRO, PORQUE NO LO ESTA. Javi, 26-oct-2026.
     Antes esta pantalla decia «ya eres ateneista» y «te mandamos la liga de tu
     portal», y las dos cosas eran mentira: la ficha quedaba esperando revision
     y no habia cuenta ninguna, asi que el que intentaba entrar se estrellaba.
     Ahora se dicen los dos correos y en que orden llegan. */
  return {t:'Alta enviada', s:'',
   h:'<div class="tarj">'+
     '<div class="cursiva">Gracias por traernos lo tuyo.</div>'+
     '<div class="aviso ok">Recibimos tu alta como <b>'+esc(D.nombre_comercial)+'</b>, con '+
       esc(caps.join(' · '))+'. Te acabamos de mandar el acuse a <b>'+esc(D.email)+'</b>.</div>'+
     '<p style="font:400 14.5px/1.6 Inter;color:var(--tinta-2);margin:0 0 4px"><b>Lo que sigue:</b> la revisamos '+
     'nosotros, normalmente en menos de un día hábil. <b>En cuanto la aprobemos te llega un segundo correo '+
     'con la liga para poner tu contraseña</b>, y con esa entras a tu portal.</p>'+
     '<div class="aviso info">Hasta entonces todavía no puedes entrar: es normal, no te falta ningún paso.</div>'+
     (enviado && enviado.correo===false ? '<div class="aviso alerta">El acuse no salió ('+esc(enviado.motivo||'')+'). '+
       'Tu alta sí quedó guardada; escríbenos a hola@casapepe.mx si no te llega nada.</div>' : '')+
   '</div>'};
};
P.listo.vale=function(){ return ''; };

/* ---------- motor ---------- */
function liga(){
  Array.prototype.forEach.call(document.querySelectorAll('[id^="f_"]'),function(el){
    var c=el.id.slice(2);
    el.oninput=el.onchange=function(){ D[c]= el.type==='checkbox'? el.checked : el.value; pieAviso(); };});
}
function pieAviso(){
  var k=PASOS()[paso].k, f=P[k], m=(f.vale?f.vale():'');
  $('pieAviso').textContent = m;
  $('bSig').disabled = !!m && k!=='listo';
}
function pinta(){
  var L=PASOS();
  if(paso>=L.length) paso=L.length-1;
  var k=L[paso].k, f=P[k], o=f();
  $('tit').textContent=o.t; $('sub').textContent=o.s||''; $('sub').style.display=o.s?'':'none';
  $('cuerpo').innerHTML=o.h;
  if(f.ata) f.ata();
  $('bAtras').style.visibility = paso===0||enviado ? 'hidden':'visible';
  $('bSig').textContent = enviado ? 'Entendido'
    : (k==='convenio' ? 'Firmar y darme de alta' : (k==='listo'?'Darme de alta':'Siguiente →'));
  pintaLista(); pieAviso();
  window.scrollTo(0,0);
}
$('bAtras').onclick=function(){ if(paso>0){paso--;pinta();} };
$('bSig').onclick=async function(){
  var L=PASOS(), k=L[paso].k, f=P[k];
  if(f.vale && f.vale()) return;
  if(enviado){ location.href='https://casapepe.mx'; return; }
  if(k!=='convenio' && k!=='listo'){ paso++; pinta(); return; }

  this.disabled=true; this.textContent='Dando de alta…';
  try{
    var r=await fetch(SB+'/rest/v1/rpc/alta_ateneista',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p:D})});
    var j=await r.json();
    if(!r.ok||!j||j.ok!==true) throw new Error((j&&(j.message||j.error))||'no se pudo');
    /* El acuse y el aviso a la casa. Si esto falla, el alta YA quedo guardada:
       no se tira el trabajo del que la lleno por un correo que no salio, se
       dice en pantalla y se sigue. */
    try{
      var av=await fetch(SB+'/functions/v1/ateneista-aviso',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
        body:JSON.stringify({accion:'alta',id:j.id})});
      var aj=await av.json().catch(function(){return null;});
      j.correo = !!(aj&&aj.correo); j.motivo = aj&&aj.motivo;
    }catch(e){ j.correo=false; j.motivo=String((e&&e.message)||e); }
    enviado=j; paso=L.length-1; pinta();
  }catch(e){
    this.disabled=false;
    $('cuerpo').insertAdjacentHTML('afterbegin',
      '<div class="aviso err" style="margin-bottom:14px">No se pudo completar el alta. '+esc(String(e.message||e))+
      '<br>Si vuelve a pasar, escríbenos a hola@casapepe.mx y lo hacemos nosotros.</div>');
    pinta();
  }
};
pinta();
</script>
</body></html>
