<!--
  EL ALTA DEL ATENEISTA · una sola puerta.

  Javi, 26-oct-2026. Hasta hoy habia cinco altas -touroperadora, productora,
  artesano, hotel, concierge- y cada una escribia en su propio registro. Por eso
  Barrio Hostel esta dado de alta tres veces, Cafe Cumbre dos, y Flylike estaba
  con dos nombres distintos para la misma persona. Nadie decidio eso: el sistema
  preguntaba "que eres" y solo dejaba elegir una respuesta, asi que quien hacia
  dos cosas se daba de alta dos veces.

  Aqui se pregunta QUE TRAES, y se pueden marcar varias.

  FUERA DEL PANEL, A PROPOSITO. Esta pagina se abre desde una liga que se dicta
  por telefono y se pega en WhatsApp, en el movil de alguien que todavia no sabe
  quienes somos. No lleva barra lateral, ni sesion, ni nada del dashboard.

  LO QUE SE MARCA EN EL PASO 1 DECIDE EL RESTO. Con solo Membresia son seis
  pasos, porque no hay nada que cobrar. El anticipo solo se ofrece a quien trae
  experiencias: los campos del cobro dividido solo existen en las reservas de
  tours, asi que ofrecerselo a un evento seria prometer algo que no se puede
  guardar.
-->

<!-- EL IDIOMA. 27-oct-2026: este alta la hace quien quiere dar de alta su tour,
     su evento, su hotel, sus piezas o su membresia de coworking, y hay
     ateneistas que no son de aqui: el asistente entero estaba en espanol.
     No se marca trozo por trozo porque esta pantalla se construye desde el JS,
     paso a paso, y marcar ciento cuarenta pedazos de innerHTML habria dejado
     fuera el primero que se anada manana. Se traduce por nodo de texto, y un
     observador barre cada paso nuevo sin que el paso tenga que acordarse. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="/sinc/sinc-i18n.js"></script>
<script>
function _T(x){ try{ return window.sincI18n ? sincI18n.t(x) : x; }catch(_){ return x; } }
try{ sincI18n.conmutador('idioma'); }catch(_){}
try{ sincI18n.vigila(document.body); }catch(_){}
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* Lo que se va llenando. Vive en memoria y se guarda de una vez al firmar: si
   alguien abandona a la mitad no dejamos una ficha a medias en el padrón. */
var D={capacidades:[],dedica:'',tipo_persona:'',forma_pago:'',pago_experiencias:'',tiene_poliza:null,poliza_cotizar:false,instagram:'',tiktok:''};
var paso=0, enviado=null;

var CAPS=[
 {k:'experiencias',t:'Experiencias',d:'Tours, talleres, recorridos. Tú los guías, nosotros te traemos clientes.'},
 {k:'eventos',     t:'Eventos',     d:'Una función, un concierto, una noche. En tu espacio o en el nuestro.'},
 {k:'hotel',       t:'Hotel',       d:'Tienes un hotel o un grupo de hoteles. Das de alta tus espacios y vendes a tus huéspedes.'},
 {k:'artesania',   t:'Artesanía',   d:'Haces piezas que se pueden vender en la tienda.'},
 {k:'membresia',   t:'Membresía',   d:'Tu lugar en el espacio común del Ateneo de Virreyes. Sin costo.'}];

/* LA PREGUNTA QUE PARTE EL ALTA EN DOS. Javi, 29-oct-2026.
   Antes se enseñaban las cinco capacidades juntas y en fila: un hotel tenía que
   ir a buscarse entre «Artesanía» y «Membresía», y un artesano se encontraba de
   frente con «Tienes un hotel o un grupo de hoteles». Son dos conversaciones
   distintas y ahora se preguntan por separado: primero a qué te dedicas, y
   según eso, qué traes.
   «hotel» no es un servicio que se elija: lo trae puesto quien dice ser hotel. */
var RAMAS=[
 {k:'hotel',    t:'Soy un hotel, departamento turístico o grupo de hospedaje',
  d:'Tienes camas. Vendes a tus huéspedes lo que hay en la ciudad, y cobras por acercárselo.'},
 {k:'prestador',t:'Soy un prestador de servicios de experiencias o productor de eventos',
  d:'Traes lo que se vive: un tour, un taller, una función, tus piezas.'}];

var SERV_HOTEL=['experiencias','eventos'];
var SERV_PREST=['experiencias','eventos','membresia','artesania'];
function menuServicios(){ return D.dedica==='hotel' ? SERV_HOTEL : SERV_PREST; }
function capDe(k){ return CAPS.filter(function(x){return x.k===k;})[0] || {k:k,t:k,d:''}; }

function trae(k){ return D.capacidades.indexOf(k)>=0; }
/* Produce quien trae algo que se vende. Quien solo viene por su membresía no
   cobra nada, así que no hay nada que preguntarle sobre cobros. */
function produce(){ return ['experiencias','eventos','hotel','artesania'].some(trae); }

function PASOS(){
  /* LA PLAZA VA PRIMERO. En el alta vieja era el primer campo y era
     obligatorio: «si una touroperadora se da de alta en Puebla, vende en
     Puebla». Al unificar se perdió, y sin ella el aviso de un alta de Puebla
     le llega a experience.cdmx y Ale no se entera nunca. */
  var p=[{k:'sede',t:'Dónde vendes'},{k:'caps',t:'A qué te dedicas'},{k:'quien',t:'Quién eres'},{k:'contacto',t:'Cómo te localizamos'}];
  if(produce()) p.push({k:'pago',t:'Cómo te pagamos'});
  p.push({k:'poliza',t:'Tu póliza'},{k:'convenio',t:'El convenio'},{k:'listo',t:'Listo'});
  return p;
}

function pintaLista(){
  var P=PASOS();
  $('lista').innerHTML=P.map(function(x,i){
    return '<li class="'+(i===paso?'on':(i<paso?'ok':''))+'"><span class="n">'+
      (i<paso?'✓':(i+1))+'</span><span>'+esc(x.t)+'</span></li>';}).join('');
  /* El contador tambien se lee: «Paso 3 de 8» / «Step 3 of 8». 27-oct-2026. */
  $('hPaso').textContent=_T('Paso')+' '+(paso+1)+' '+_T('de')+' '+P.length;
  $('hBar').style.width=Math.round((paso+1)/P.length*100)+'%';
}

/* ---------- los pasos ---------- */
var P={};

P.caps=function(){
  var rama=D.dedica;
  var cab='<div class="tarj" style="gap:12px">'+RAMAS.map(function(r){
      return '<button type="button" class="opt'+(rama===r.k?' on':'')+'" data-rama="'+r.k+'">'+
        '<b>'+esc(r.t)+'</b><span>'+esc(r.d)+'</span></button>';}).join('')+'</div>';

  if(!rama) return {t:'¿A qué te dedicas?', s:'De esto depende todo lo que viene después.', h:cab};

  var menu=menuServicios();
  var tit = rama==='hotel' ? '¿Quieres crear experiencias o eventos?' : '¿Qué tipo de servicios das?';
  var pie = rama==='hotel'
    ? 'Puedes no marcar ninguna: con tu hotel dado de alta ya vendes lo que hay en la ciudad y cobras tu comisión. '+
      'Esto es para cuando además quieras crear lo tuyo.'
    : 'Puedes marcar varias, y añadir más después sin volver a empezar.';

  return {t:'¿A qué te dedicas?', s:'De esto depende todo lo que viene después.',
    h:cab+
      '<h3 class="h3" style="margin:22px 0 10px">'+esc(tit)+'</h3>'+
      '<div class="caps">'+menu.map(function(k){ var c=capDe(k);
        return '<button type="button" class="cap'+(trae(k)?' on':'')+'" data-k="'+k+'">'+
          '<span class="box">✓</span><span><b><i></i>'+esc(c.t)+'</b>'+
          '<span>'+esc(c.d)+'</span></span></button>';}).join('')+'</div>'+
      '<div class="aviso info" style="margin-top:16px">'+esc(pie)+'</div>'};
};
P.caps.ata=function(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-rama]'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-rama');
      if(D.dedica===k){ pinta(); return; }
      D.dedica=k;
      /* Al cambiar de rama se tiran los servicios que la rama nueva no ofrece:
         si no, un hotel que antes dijo «artesanía» se la lleva puesta sin poder
         verla ni quitarla, y acaba firmando un anexo que no eligió. */
      var ok=menuServicios();
      D.capacidades=D.capacidades.filter(function(x){ return ok.indexOf(x)>=0; });
      if(k==='hotel'){ if(D.capacidades.indexOf('hotel')<0) D.capacidades.push('hotel'); }
      pinta(); };});
  Array.prototype.forEach.call(document.querySelectorAll('.cap'),function(b){
    b.onclick=function(){
      var k=b.getAttribute('data-k'), i=D.capacidades.indexOf(k);
      if(i>=0)D.capacidades.splice(i,1); else D.capacidades.push(k);
      pinta(); };});
};
P.caps.vale=function(){
  if(!D.dedica) return 'Dinos a qué te dedicas.';
  if(D.dedica==='hotel') return '';          /* el hotel ya es una capacidad */
  return D.capacidades.length ? '' : 'Marca al menos un servicio.';
};

P.sede=function(){
  var sd=D.sede||'';
  return {t:'¿Dónde vendes?', s:'La plaza manda: decide quién te atiende y dónde se vende lo tuyo.',
   h:'<div class="tarj">'+
     '<div class="opc'+(sd==='cdmx'?' on':'')+'" data-sede="cdmx">'+
       '<b>Ciudad de México</b><span>Centro Histórico, Roma, Condesa, Coyoacán…</span></div>'+
     '<div class="opc'+(sd==='puebla'?' on':'')+'" data-sede="puebla">'+
       '<b>Puebla y Cholula</b><span>Te atiende el equipo de Puebla.</span></div>'+
     '<div class="aviso info">Si operas en las dos, empieza por una: la otra la abrimos nosotros '+
       'con una ficha aparte, porque las ventas y los equipos son distintos.</div>'+
   '</div>'};
};
P.sede.ata=function(){
  Array.prototype.forEach.call(document.querySelectorAll('[data-sede]'),function(d){
    d.onclick=function(){
      D.sede=d.getAttribute('data-sede');
      /* La columna `ciudad` de la ficha se sigue llenando: la plaza es la que
         la dicta ahora que el campo salio del paso de «¿Quien eres?». */
      D.ciudad = D.sede==='puebla' ? 'Puebla' : 'Ciudad de México';
      pinta(); };});
};
P.sede.vale=function(){ return D.sede?'':'Dinos en qué plaza vendes.'; };

/* QUIEN NO ES MEXICANO NO TIENE RFC NI CURP. Javi, 26-oct-2026: «¿puedes ver
   cómo hacer para que se den de alta ateneístas con pasaportes de otros países
   como Colombia o Argentina, España o US?».
   Las dos identificaciones que pedíamos son mexicanas, así que un colombiano no

/* ---------- LOS PAPELES ----------
   Javi, 29-oct-2026: «Es obligatorio que suban el archivo de INE / Pasaporte /
   FM todos, y la CSF de razon moral y persona fisica con actividad empresarial».

   Antes esto era medio paso: se le tomaba foto al pasaporte SOLO para rellenar
   los campos, la foto se tiraba, y el documento se entregaba despues, al entrar.
   Ahora el archivo se queda, y sin el no se manda el alta.

   El orden importa y es al reves de lo que parece: PRIMERO se guarda el archivo
   en memoria, DESPUES se lee. Si el lector tiene un mal dia, el papel ya esta y
   la persona solo teclea; al reves se perderia el documento cada vez.

   El lector es el de siempre (`tercero-ocr`, que ya sabia de INE, pasaporte,
   forma migratoria y constancia). Como aqui todavia no hay sesion, se le llama
   por `alta-documento`, que lo reenvia con la llave de servicio: un solo juego
   de instrucciones de lectura, no dos.

   La constancia casi siempre es un PDF: se dibuja su primera pagina y se manda
   esa imagen, que es lo que el lector sabe mirar. */

var DOCS={};   /* k -> {file, media, nombre, estado, msg, b64} */

function docsPedidos(){
  var l=[];
  if(esExt()){
    l.push({k:'pasaporte', t:'Tu pasaporte', ob:true,
            ay:'La hoja de la foto, completa y con los dos renglones de abajo visibles.'});
    l.push({k:'forma_migratoria', t:'Tu forma migratoria', ob:false,

  }

    l.push({k:'constancia', t:'Tu constancia de situación fiscal', ob:true,
            ay:'La del SAT. Si es el PDF tal cual te lo dieron, nos sirve igual.'});
  return l;
}
var NOMDOC={ine:'tu INE',pasaporte:'tu pasaporte',forma_migratoria:'tu forma migratoria',
            constancia:'tu constancia de situación fiscal'};

function faltanDocs(){
  return docsPedidos().filter(function(d){
    return d.ob && !(DOCS[d.k] && DOCS[d.k].file); });

    (d.ay?'<div class="ay">'+esc(d.ay)+'</div>':'')+
    '<label class="btn-foto">'+(x.file?'Cambiar el archivo':'Tomar foto o subir archivo')+
      '<input type="file" id="fl-'+d.k+'" accept="image/*,application/pdf" hidden></label>'+
    (x.nombre?'<div class="docu-f">'+esc(x.nombre)+'</div>':'')+
    (x.msg?'<div class="docu-m" style="color:'+color+'">'+esc(x.msg)+'</div>':'')+
  '</div>';

function pintaDocs(){
  var c=$('cajaDocs'); if(!c) return;
  c.innerHTML=docsPedidos().map(cajaDoc).join('');
  docsPedidos().forEach(function(d){

/* De un PDF se dibuja la primera pagina; de una foto, la foto encogida. */
function pdfAImagen(file,max){
  return new Promise(function(res){
    if(!window.pdfjsLib) return res(null);
    try{
      pdfjsLib.GlobalWorkerOptions.workerSrc=
        'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      var fr=new FileReader();
      fr.onload=function(){
        pdfjsLib.getDocument({data:new Uint8Array(fr.result)}).promise.then(function(pdf){
          return pdf.getPage(1);
        }).then(function(pg){
          var v1=pg.getViewport({scale:1});
          var e=Math.min(3,(max||1700)/Math.max(v1.width,v1.height));   /* el SAT usa letra chica */
          var vp=pg.getViewport({scale:e});
          var c=document.createElement('canvas');
          c.width=Math.round(vp.width); c.height=Math.round(vp.height);
          var cx=c.getContext('2d');
          cx.fillStyle='#fff'; cx.fillRect(0,0,c.width,c.height);
          return pg.render({canvasContext:cx,viewport:vp}).promise.then(function(){
            res(c.toDataURL('image/jpeg',0.9));
          });
        }).catch(function(){res(null);});
      };
      fr.onerror=function(){res(null);};
      fr.readAsArrayBuffer(file);
    }catch(_){res(null);}
  });
}
function aDataURL(file,max){
  return new Promise(function(res){
    if(file.type==='application/pdf') return pdfAImagen(file,max).then(res);
    try{
      var img=new Image();
      img.onload=function(){
        var e=Math.min(1,(max||1500)/Math.max(img.width,img.height));
        var c=document.createElement('canvas');
        c.width=Math.round(img.width*e); c.height=Math.round(img.height*e);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.88));
      };
      img.onerror=function(){res(null);};
      img.src=URL.createObjectURL(file);
    }catch(_){res(null);}
  });
}
/* El archivo entero, tal cual lo dio: lo que se guarda es su original, no la
   foto encogida que se le manda al lector. */
function aBase64(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){ res(String(fr.result)); };
    fr.onerror=function(){ rej(new Error('no se pudo leer el archivo')); };
    fr.readAsDataURL(file);
  });
}

function marcaDoc(k,o){ DOCS[k]=Object.assign(DOCS[k]||{},o); pintaDocs(); pieAviso(); }

async function tomaDoc(k,file){
  if(file.size > 8*1024*1024){
    marcaDoc(k,{file:null,nombre:file.name,estado:'malo',
      msg:'Pesa más de 8 MB. Hazle una foto más chica o guárdalo en menor calidad.'});
    return;
  }
  marcaDoc(k,{file:file, media:file.type||'application/octet-stream', nombre:file.name,
              estado:'ok', msg:'Guardado. Leyéndolo…'});
  try{ DOCS[k].b64 = await aBase64(file); }
  catch(e){ marcaDoc(k,{file:null,estado:'malo',msg:'No pudimos abrir ese archivo.'}); return; }

  var img=await aDataURL(file,1700);
  if(!img){ marcaDoc(k,{estado:'ojo',msg:'Guardado. No pudimos leerlo: completa los datos a mano aquí abajo.'}); return; }

  var j=null;
  try{
    var r=await fetch(SB+'/functions/v1/alta-documento',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({accion:'leer',doc:k,image_b64:img,media_type:'image/jpeg'})});
    j=await r.json();
  }catch(_){}
  if(!j || !j.ok || j.legible===false){
    marcaDoc(k,{estado:'ojo',msg:'Guardado, pero no pudimos leerlo. Completa los datos a mano aquí abajo.'});
    return;
  }
  aplicaLeido(k,j);
}

/* Nunca se pisa lo que la persona ya escribio: rellenar un hueco ayuda,
   cambiarle lo tecleado es quitarle el control de su propia alta. */
function pon(campo,valor){
  if(!valor) return;
  if((D[campo]||'').trim()) return;
  D[campo]=String(valor);
  var e=$('f_'+campo); if(e) e.value=D[campo];
}

function aplicaLeido(k,j){
  var nota='✓ Leído. Revisa que esté bien.';
  if(k==='pasaporte'){
    pon('pasaporte_numero', j.numero);
    pon('pasaporte_vence', /^\d{4}-\d{2}-\d{2}$/.test(String(j.vence||''))?j.vence:'');
    if(j.nacionalidad && !D.nacionalidad){
      D.nacionalidad=String(j.nacionalidad);
      var sel=$('f_nacionalidad'); if(sel) CP.ponPais(sel, D.nacionalidad);
    }
    if(j.vence) DOCS[k].vigencia=j.vence;
    var f1=[]; if(!j.numero)f1.push('el número'); if(!j.vence)f1.push('la vigencia');
    if(f1.length) nota='Leído, pero no sacamos '+f1.join(' ni ')+'. Complétalo abajo.';
  }
  if(k==='ine'){
    pon('curp', j.curp);
    if(!(D.contrato_firmante||'').trim() && j.nombre) D.contrato_firmante=String(j.nombre);
    if(!j.curp) nota='Leído, pero no sacamos la CURP. Escríbela abajo.';
  }
  if(k==='forma_migratoria'){
    pon('fm_numero', j.numero);
    pon('curp', j.curp);
    if(/^\d{4}-\d{2}-\d{2}$/.test(String(j.vence||''))){ D.fm_vence=j.vence; DOCS[k].vigencia=j.vence; }
  }
  if(k==='constancia'){
    pon('rfc', j.rfc);
    pon('razon_social', j.razon_social);
    pon('curp', j.curp);
    if(!D.tipo_persona && (j.tipo_persona==='moral'||j.tipo_persona==='fisica')) D.tipo_persona=j.tipo_persona;
    /* MAS DE TRES MESES: SE AVISA Y SE SIGUE. Javi, 29-oct-2026. Una constancia
       vieja no es un dato falso, es un dato viejo: bloquear el alta por eso
       manda a la persona al SAT antes de dejarla entrar, y entonces no vuelve. */
    if(j.csf_vieja===true){
      var m=Math.floor(Number(j.dias_de_emitida||0)/30);
      marcaDoc(k,{estado:'ojo', msg:'Leído. Ojo: esta constancia se emitió hace '+
        (m>0?('unos '+m+' meses'):'más de tres meses')+'. Te la vamos a pedir actualizada, '+
        'pero puedes seguir con el alta ahora mismo.'});
      pinta(); return;
    }
    if(!j.rfc) nota='Leído, pero no sacamos el RFC. Escríbelo abajo.';
  }
  marcaDoc(k,{estado:'ok', msg:nota});
  pinta();
}

P.quien.vale=function(){
  if(!(D.nombre_comercial||'').trim()) return 'Falta el nombre.';
  if(!D.tipo_persona) return 'Dinos cómo facturas.';
  if(esExt()){
    /* Cualquiera de las cuatro sirve. Se pide UNA, no las cuatro: lo que
       necesitamos es poder identificar a quien responde, no coleccionar
       números suyos. */
    var hay = (D.rfc||'').trim() || (D.curp||'').trim() || (D.pasaporte_numero||'').trim();
    if(!hay) return 'Falta tu pasaporte (o tu RFC, si lo tienes).';
    return faltanDoc();
  }
  if(D.tipo_persona==='fisica_sin' && !(D.curp||'').trim())
    return 'Falta la CURP. Si no eres mexicano, escribe tu nacionalidad arriba y te pedimos el pasaporte en su lugar.';
  if(D.tipo_persona!=='fisica_sin' && !(D.rfc||'').trim())
    return 'Falta el RFC. Si no eres mexicano, escribe tu nacionalidad arriba y te pedimos el pasaporte en su lugar.';
  return faltanCasas() || faltanDoc();
};
/* Un grupo sin casas es un nombre y nada mas: no se deja pasar. */
function faltanCasas(){
  if(!trae('hotel') || D.hotel_tipo!=='grupo') return '';
  var l=casas().filter(function(c){ return (c.nombre||'').trim(); });
  if(!l.length) return 'Dinos al menos una casa del grupo: su nombre y sus cuartos.';
  var sin=l.filter(function(c){ return !(String(c.cuartos||'').trim()); });
  if(sin.length) return 'Falta cuántos cuartos tiene '+sin[0].nombre.trim()+'.';
  return '';
}
/* El papel es obligatorio y se dice cual falta por su nombre: «faltan
   documentos» no le dice a nadie que tiene que ir a buscar. */
function faltanDoc(){
  var f=faltanDocs();
  if(!f.length) return '';
  return 'Falta subir '+f.map(function(d){ return nombreDoc(d.k); }).join(' y ')+'.';
}

/* EL TELEFONO CON SU LADA. Javi, 28-oct-2026: «pon los prefijos de serie en

var TEL=null;
P.contacto=function(){

/* De lo que teclean se quita la arroba, la URL y los espacios: se guarda el
   nombre pelado, que es lo unico que sirve para armar la liga despues. */
function limpiaArroba(v){
  return String(v||'').trim()
    .replace(/^https?:\/\/(www\.)?(instagram|tiktok)\.com\//i,'')
    .replace(/[\/?#].*$/,'')
    .replace(/^@+/,'')
    .replace(/\s+/g,'');
}

  }

  ['instagram','tiktok'].forEach(function(k){

    e.oninput=function(){ D[k]=limpiaArroba(e.value); };
    e.onblur =function(){ D[k]=limpiaArroba(e.value); e.value=D[k]; };
  });
};

    el.oninput=el.onchange=function(){ D[c]= el.type==='checkbox'? el.checked : el.value; pieAviso(); };});
}
function pieAviso(){
  var k=PASOS()[paso].k, f=P[k], m=(f.vale?f.vale():'');
  $('pieAviso').textContent = m;
  $('bSig').disabled = !!m && k!=='listo';
}
function pinta(){
  var L=PASOS();
  if(paso>=L.length) paso=L.length-1;
  var k=L[paso].k, f=P[k], o=f();
  $('tit').textContent=o.t; $('sub').textContent=o.s||''; $('sub').style.display=o.s?'':'none';
  $('cuerpo').innerHTML=o.h;
  if(f.ata) f.ata();
  $('bAtras').style.visibility = paso===0||enviado ? 'hidden':'visible';
  $('bSig').textContent = enviado ? 'Entendido'
    : (k==='convenio' ? _T('Firmar y darme de alta') : (k==='listo'?_T('Darme de alta'):_T('Siguiente →')));
  pintaLista(); pieAviso();
  window.scrollTo(0,0);
}
$('bAtras').onclick=function(){ if(paso>0){paso--;pinta();} };
$('bSig').onclick=async function(){
  var L=PASOS(), k=L[paso].k, f=P[k];
  if(f.vale && f.vale()) return;
  /* Javi, 28-oct-2026: «tras mandarme el correo de Gracias por traernos lo
     tuyo mandalo al link de Sincretico». Acababa en casapepe.mx, que es la web
     del hotel: el que se acaba de dar de alta como ateneista quiere ver donde
     va a vivir lo suyo, no el hostal. */
  if(enviado){ location.href='/sinc/'; return; }
  if(k!=='convenio' && k!=='listo'){ paso++; pinta(); return; }

  this.disabled=true; this.textContent='Dando de alta…';
  try{
    var r=await fetch(SB+'/rest/v1/rpc/alta_ateneista',{method:'POST',
      headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify({p:D})});
    var j=await r.json();
    if(!r.ok||!j||j.ok!==true) throw new Error((j&&(j.message||j.error))||'no se pudo');
    /* LOS PAPELES, EN CUANTO LA FICHA EXISTE. Hasta este renglon no habia
       donde colgarlos: el expediente cuelga de un id que acaba de nacer.
       Van de uno en uno y sin tirar el alta si alguno falla —el archivo se
       puede reponer desde el portal; el alta, no—. Lo que no entro se dice
       en la pantalla final, con su nombre. */
    j.docs_fallidos=[];
    for(var dk in DOCS){
      var dv=DOCS[dk];
      if(!dv || !dv.b64) continue;
      try{
        var rd=await fetch(SB+'/functions/v1/alta-documento',{method:'POST',
          headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
          body:JSON.stringify({accion:'guardar', id:j.id, doc:dk,
            archivo_b64:dv.b64, media_type:dv.media, nombre:dv.nombre, vigencia:dv.vigencia||null})});
        var jd=await rd.json().catch(function(){return null;});
        if(!rd.ok || !jd || jd.ok!==true) j.docs_fallidos.push(dk);
      }catch(e){ j.docs_fallidos.push(dk); }
    }

    /* La cuenta, la liga de contrasena y el aviso a la casa. Si esto falla, el
       alta YA quedo guardada: no se tira el trabajo del que la lleno por un
       correo que no salio, se dice en pantalla y se sigue. */
    try{
      var av=await fetch(SB+'/functions/v1/ateneista-aviso',{method:'POST',
        headers:{apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'},
        body:JSON.stringify({accion:'alta',id:j.id})});
      var aj=await av.json().catch(function(){return null;});
      j.correo = !!(aj&&aj.correo); j.motivo = aj&&aj.motivo;
    }catch(e){ j.correo=false; j.motivo=String((e&&e.message)||e); }
    enviado=j; paso=L.length-1; pinta();
  }catch(e){
    this.disabled=false;
    $('cuerpo').insertAdjacentHTML('afterbegin',
      '<div class="aviso err" style="margin-bottom:14px">No se pudo completar el alta. '+esc(String(e.message||e))+
      '<br>Si vuelve a pasar, escríbenos a hola@casapepe.mx y lo hacemos nosotros.</div>');
    pinta();
  }
};
pinta();
</script>
