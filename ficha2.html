<!--
  ALTA Y EDICIÓN DE UNA EXPERIENCIA · el rediseño.

  Javi, 25-oct-2026, con el handoff de diseño en la mano: siete pasos, la
  Cósmica como lo único opcional, y la tarjeta del cliente a la derecha
  actualizándose mientras se escribe.

  POR QUÉ ESTE ARCHIVO EXISTE Y NO SE TOCÓ ficha.html.
  La ficha de hoy tiene cinco mil líneas vivas —mapas, recorte de fotos,
  costeo, los candados de publicación— y hay touroperadores dentro ahora
  mismo. Rehacerla por encima, paso a paso, les habría dado varios días de
  media ficha nueva y media vieja. Así que el rediseño crece aquí al lado,
  sobre los mismos datos y la misma sesión, y el día que esté se cambia la
  liga: una línea, reversible en treinta segundos.

  LO QUE YA ESTÁ (esta entrega): el esqueleto completo —cabecera, los siete
  pasos, la vista previa, el pie— y tres pasos de verdad: Lo esencial,
  Capacidad, y Precio e incluye. Guardan y cargan contra op_experiencias,
  los mismos campos de siempre.
  LO QUE FALTA: Ruta sobre el mapa, Horarios, Fotos y guía, Impacto y La
  Cósmica. Mientras no estén, su pestaña lo dice y manda a la ficha de hoy,
  que sigue entera: nadie se queda sin poder hacer su trabajo.

  LA VISTA PREVIA NO ES DECORACIÓN. Es lo que arregla el problema de fondo
  del alta: quien llena la ficha no está viendo lo que llena —ve campos—, y
  el cliente no ve campos, ve una tarjeta. Entre una cosa y otra se pierden
  las fotos malas, las líneas que no venden y los precios sin sentido.
-->
<style>
:root{
  --naranja:#F2682A; --naranja-oscuro:#C9501A; --naranja-suave:#FDE7DC;
  --magenta:#E2188E; --magenta-oscuro:#B3106F; --magenta-suave:#FBDCEE;
  --rosa:#F8BBCB; --cielo:#8DC8EA; --cielo-suave:#E4F1FA;
  --tinta:#1E1A16; --tinta-2:#3C3630; --gris:#6E665C; --tenue:#A9A096;
  --linea:#E6DFD6; --papel:#FBF7F2; --hueso:#F4EFE8;
  --ok:#1D6B4A; --ok-bg:#E1F0E7; --alerta:#8C6212; --alerta-bg:#F6EBD5;
  --error:#9E3B2E; --error-bg:#F6E1DD;
  --sombra:0 1px 1px rgba(30,26,22,.05),0 12px 30px -22px rgba(30,26,22,.4);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--papel);font-family:Inter,system-ui,sans-serif;color:var(--tinta);display:flex;flex-direction:column;overflow:hidden}
input,textarea,select{font:inherit;color:var(--tinta)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--naranja)!important;box-shadow:0 0 0 3px var(--naranja-suave)}
a{color:var(--naranja-oscuro)}

/* ---------- cabecera ---------- */
.cab{background:var(--tinta);min-height:60px;display:flex;align-items:center;gap:14px;padding:0 32px;flex:none}
.cab img{width:30px;height:30px;border-radius:7px}
.marca{font:700 19px Oswald;color:#fff;letter-spacing:.04em}
.punto{color:var(--gris)}
.nomb{flex:1;min-width:0;font:500 15px Inter;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font:600 11px Oswald;letter-spacing:.09em;padding:4px 11px;border-radius:999px;white-space:nowrap}
.btn{cursor:pointer;font:600 13px Oswald;letter-spacing:.05em;padding:8px 16px;border-radius:9px;border:2px solid transparent;background:none}
.btn.naranja{border-color:var(--naranja);background:var(--naranja);color:#fff}
.btn.naranja:hover{border-color:var(--naranja-oscuro);background:var(--naranja-oscuro)}
.btn.cielo{border-color:var(--cielo);color:#fff}
.btn.cielo.on{background:var(--cielo);color:var(--tinta)}
.btn.tinta{border-color:var(--tinta);color:var(--tinta)}
.btn.tinta.relleno{background:var(--tinta);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}

/* ---------- pestañas ---------- */
.tabs{background:#fff;border-bottom:1px solid var(--linea);padding:0 32px;display:flex;gap:2px;align-items:stretch;flex:none}
.tab{cursor:pointer;display:flex;align-items:center;gap:8px;padding:15px 11px 12px;border-bottom:3px solid transparent;white-space:nowrap}
.tab .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 10.5px Inter;background:var(--alerta-bg);color:var(--alerta)}
.tab .t{font:600 13px Oswald;letter-spacing:.06em;color:var(--gris)}
.tab.on{border-bottom-color:var(--naranja)}
.tab.on .t{color:var(--tinta)}
.tab.listo .n{background:var(--naranja);color:#fff}
.tabs .hueco{flex:1}
.opt{display:flex;align-items:center;gap:8px}
.opt .et{font:500 11px Inter;color:var(--tenue)}
.pcos{cursor:pointer;display:flex;align-items:center;gap:7px;padding:7px 14px;border-radius:999px;background:var(--magenta-suave);color:var(--magenta-oscuro);font:600 13px Oswald;letter-spacing:.06em}
.pcos.on{background:var(--magenta);color:#fff}

/* ---------- barra de celular ---------- */
.mbar{display:none;padding:14px 18px 4px;flex-direction:column;gap:7px;flex:none}
.mbar .seg{display:flex;gap:4px}
.mbar .seg i{flex:1;height:6px;border-radius:3px;background:var(--linea);cursor:pointer}
.mbar .seg i.listo{background:var(--naranja)}
.mbar .seg i.on{background:var(--tinta)}
.mbar .seg i.cos{background:var(--rosa)}
.mbar .seg i.cos.on{background:var(--magenta)}

/* ---------- cuerpo ---------- */
.scroll{flex:1;overflow:auto}
.cuerpo{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:28px;padding:28px 32px 40px;align-items:start}
.cuerpo.solo{grid-template-columns:minmax(0,1fr)}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.kicker{font:600 11px Oswald;letter-spacing:.09em;color:var(--naranja-oscuro)}
.titulo{font:700 30px Oswald;letter-spacing:.03em;margin-top:2px}
.sub{font:400 14px/1.5 Inter;color:var(--gris);margin-top:4px;text-wrap:pretty}
.tarj{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:18px}
.campo{display:flex;flex-direction:column;gap:6px;min-width:0}
.campo>.et{font:600 11px Oswald;letter-spacing:.09em;color:var(--gris);display:flex;justify-content:space-between;gap:10px}
.campo .et b{font:400 12px Inter;color:var(--tenue)}
.campo input,.campo select,.campo textarea{border:1.5px solid var(--linea);border-radius:9px;padding:12px 14px;font-size:15px;width:100%;background:#fff}
.campo textarea{resize:vertical;min-height:84px;line-height:1.5}
.campo .ay{font:400 12.5px Inter;color:var(--tenue)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{cursor:pointer;font:600 12.5px Inter;padding:7px 13px;border-radius:999px;border:1.5px solid var(--linea);background:#fff;color:var(--tinta-2)}
.chip.on{border-color:var(--naranja);background:var(--naranja);color:#fff}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer}
.sw i{flex:none;width:44px;height:26px;border-radius:13px;background:#D9CFC3;position:relative;transition:background .18s}
.sw i::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .18s}
.sw.on i{background:var(--naranja)}
.sw.on i::after{left:21px}
.sw .tx b{display:block;font:600 14px Inter}
.sw .tx span{font:400 12.5px Inter;color:var(--gris)}
.aviso{border-radius:10px;padding:11px 13px;font:400 13.5px/1.5 Inter}
.aviso.alerta{background:var(--alerta-bg);color:var(--alerta)}
.aviso.err{background:var(--error-bg);color:var(--error)}
.aviso.ok{background:var(--ok-bg);color:var(--ok)}
.porque{background:var(--cielo-suave);border-left:3px solid var(--cielo);border-radius:0 10px 10px 0;padding:11px 14px;font:400 13.5px/1.55 Inter;color:var(--tinta-2)}
.h3{font:700 17px Oswald;letter-spacing:.04em;text-transform:uppercase;margin:0}

/* ---------- pie ---------- */
.pie{flex:none;border-top:1px solid var(--linea);background:#fff;padding:12px 32px;display:flex;gap:10px;align-items:center}
.pie .hueco{flex:1}

/* ---------- la tarjeta del cliente ---------- */
.prev{position:sticky;top:0}
.ficha{background:#fff;border:1px solid var(--linea);border-radius:14px;overflow:hidden;box-shadow:var(--sombra)}
.ficha .foto{aspect-ratio:16/10;background:var(--hueso);display:grid;place-items:center;font:500 12px ui-monospace;color:var(--tenue);background-size:cover;background-position:center}
.ficha .dentro{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px}
.ficha .etqs{display:flex;gap:6px;flex-wrap:wrap}
.ficha .etq{font:600 11px Oswald;letter-spacing:.09em;padding:3px 10px;border-radius:999px;background:var(--hueso);color:var(--gris)}
.ficha .etq.cat{background:var(--naranja-suave);color:var(--naranja-oscuro)}
.ficha .etq.cos{background:var(--magenta-suave);color:var(--magenta-oscuro)}
.ficha h4{font:700 24px/1.1 Oswald;letter-spacing:.02em;text-transform:uppercase;margin:0}
.ficha .linea{font:400 14.5px/1.5 Inter;color:var(--tinta-2);text-wrap:pretty}
.ficha .filas{display:flex;flex-direction:column;gap:5px;border-top:1px solid #EFE9E1;padding-top:10px;font:400 13px/1.45 Inter;color:var(--tinta-2)}
.ficha .filas>div{display:flex;gap:10px}
.ficha .filas>div>span:first-child{width:64px;flex:none;color:var(--gris)}
.ficha .precio{display:flex;align-items:baseline;gap:8px;border-top:1px solid #EFE9E1;padding-top:12px}
.ficha .precio b{font:700 26px Inter;letter-spacing:-.02em}
.ficha .precio span{font:400 12.5px Inter;color:var(--gris)}
.prevNota{font:400 11.5px/1.45 Inter;color:var(--tenue);margin-top:9px;text-align:center}

/* ---------- celular ---------- */
@media(max-width:980px){
  .cuerpo{grid-template-columns:minmax(0,1fr);padding:16px 18px 32px;gap:18px}
  .tabs{display:none}
  .mbar{display:flex}
  .cab{padding:0 16px;gap:10px}
  .marca,.punto,.cab .pill{display:none}
  .titulo{font-size:24px}
  .g2,.g3{grid-template-columns:1fr}
  .pie{padding:10px 16px}
  .prev{position:static}
  .prevCol{display:none}
  .prevCol.abierta{display:block;position:fixed;inset:auto 0 0 0;max-height:88vh;overflow:auto;background:var(--papel);
    border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(30,26,22,.25);padding:16px;z-index:50}
  .verComo{display:block;position:fixed;right:16px;bottom:74px;z-index:40;background:var(--cielo);color:var(--tinta);
    border:0;border-radius:999px;padding:12px 18px;font:600 13px Oswald;letter-spacing:.05em;box-shadow:var(--sombra);cursor:pointer}
}
.verComo{display:none}
.cargando{padding:60px 32px;text-align:center;color:var(--gris);font:400 14px Inter}
</style></head>
<body>

<div class="cab">
  <img src="/img/sincretico/sincretico-isotipo-64.png" alt="Sincrético">
  <div class="marca">SINCRÉTICO</div><div class="punto">·</div>

  <button class="btn naranja" id="bGuardar">GUARDAR</button>
</div>

</div>

<script>
var SB='https://rehophywchakfapivsbh.supabase.co';
var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
var ID=new URLSearchParams(location.search).get('id')||'';
var E=null, ses=null, paso=0, TAXC=[], TAXT=[], sucio=false;

function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function sesionPanel(){try{for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
  if(k&&/sb-.*-auth-token/.test(k)){var v=JSON.parse(localStorage.getItem(k)||'null');
  var s=v&&(v.currentSession||v); if(s&&s.access_token)return s;}}}catch(_){}return null;}
function tok(){return ses&&ses.access_token||KEY;}
function hdr(){return {apikey:KEY,Authorization:'Bearer '+tok(),'Content-Type':'application/json'};}
function get(q){return fetch(SB+'/rest/v1/'+q,{headers:hdr()}).then(function(r){return r.ok?r.json():[];});}

/* ---------- el catálogo de categorías y tipos ----------
   Se lee, no se inventa: las mismas tablas que usa la ficha de hoy, para que
   una categoría nueva aparezca en las dos pantallas sin tocar ninguna. */
function catalogo(){
  return Promise.all([
    get('exp_categorias?select=slug,nombre,orden&activo=is.true&order=orden'),
    get('exp_tipos?select=slug,categoria_slug,nombre,orden&activo=is.true&order=orden')
  ]).then(function(r){ TAXC=r[0]||[]; TAXT=r[1]||[]; });
}

/* ---------- los siete pasos y lo opcional ----------
   El orden es el del alta, no el de la base: primero lo que el cliente ve y lo
   que entra en la transacción. La Cósmica va aparte porque sólo aplica cuando
   el tour empieza o acaba en casa — un paso que la mayoría se salta, puesto
   donde nadie puede saltárselo, hace que la ficha parezca incompleta. */
var PASOS=[
  {k:'esencial', t:'LO ESENCIAL',  titulo:'Lo esencial',       sub:'Lo primero que ve el cliente, en la recepción y en el buscador.'},
  {k:'capacidad',t:'CAPACIDAD',    titulo:'Capacidad',          sub:'Cuánta gente cabe, cuánta hace falta para salir y si se vende en privado.'},
  {k:'ruta',     t:'DE DÓNDE SALE',titulo:'De dónde sale y por dónde va', sub:'El recorrido entero, de la salida a la llegada, escrito una sola vez.', pendiente:true},
  {k:'horarios', t:'HORARIOS',     titulo:'Horarios',           sub:'A qué hora sale, qué días, y cuándo no opera.', pendiente:true},
  {k:'precio',   t:'PRECIO',       titulo:'Precio e incluye',   sub:'Cuánto cuesta, qué lleva dentro y hasta cuándo se puede reservar.'},
  {k:'fotos',    t:'FOTOS Y GUÍA', titulo:'Fotos y guía',       sub:'Las fotos que venden y quién los recibe.', pendiente:true},
  {k:'impacto',  t:'IMPACTO',      titulo:'Impacto',            sub:'A dónde va el dinero de cada reserva.', pendiente:true},
  {k:'cosmica',  t:'LA CÓSMICA',   titulo:'La Cósmica',         sub:'Si el tour empieza o acaba en casa, les ponemos mesa.', opcional:true, pendiente:true}
];
function esCosmica(i){return PASOS[i].opcional===true;}
function cuantosObligatorios(){return PASOS.filter(function(p){return !p.opcional;}).length;}

/* ---------- qué se considera hecho ----------
   Un paso está listo cuando tiene lo que hace falta para vender, no cuando
   está todo escrito. Si marcáramos listo sólo lo perfecto, la barra nunca
   avanzaría y dejaría de medir nada. */
function listo(k){
  if(!E) return false;
  if(k==='esencial')  return !!(E.nombre && E.resumen && E.categoria_slug);
  if(k==='capacidad') return !!(E.cupo_max>0);
  if(k==='precio')    return E.apepe_gratuito===true || Number(E.neto_adulto)>0;
  return false;   /* los que aún no se rehicieron no se pintan como hechos */
}

/* ---------- pintar la navegación ---------- */
function pintaTabs(){
  var h='';
  PASOS.forEach(function(p,i){
    if(p.opcional) return;
    var ok=listo(p.k);
    h+='<div class="tab'+(i===paso?' on':'')+(ok?' listo':'')+'" data-i="'+i+'">'+
       '<div class="n">'+(ok?'✓':(i+1))+'</div><div class="t">'+esc(p.t)+'</div></div>';
  });
  h+='<div class="hueco"></div><div class="opt"><span class="et">Opcional</span>';
  PASOS.forEach(function(p,i){ if(!p.opcional) return;
    h+='<div class="pcos'+(i===paso?' on':'')+'" data-i="'+i+'">✦ <span>'+esc(p.t)+'</span></div>'; });
  h+='</div>';
  $('tabs').innerHTML=h;
  Array.prototype.forEach.call($('tabs').querySelectorAll('[data-i]'),function(d){
    d.onclick=function(){ ve(+d.getAttribute('data-i')); };});

  var m='';
  PASOS.forEach(function(p,i){
    m+='<i class="'+(p.opcional?'cos ':'')+(i===paso?'on ':'')+(listo(p.k)?'listo':'')+'" data-i="'+i+'"></i>';});
  $('mseg').innerHTML=m;
  Array.prototype.forEach.call($('mseg').querySelectorAll('i'),function(d){
    d.onclick=function(){ ve(+d.getAttribute('data-i')); };});
  $('mkick').textContent = esCosmica(paso) ? '✦ LA CÓSMICA · OPCIONAL'
    : 'PASO '+(paso+1)+' DE '+cuantosObligatorios();
}

function ve(i){ paso=i; pinta(); try{ $('scroll').scrollTop=0; }catch(_){} }

function pinta(){
  var p=PASOS[paso];
  $('kicker').textContent = esCosmica(paso) ? '✦ OPCIONAL' : 'PASO '+(paso+1)+' DE '+cuantosObligatorios();
  $('titulo').textContent = p.titulo;
  $('subtitulo').textContent = p.sub;
  $('paso').innerHTML = p.pendiente ? pendiente(p) : PINTA[p.k]();
  if(!p.pendiente && ATA[p.k]) ATA[p.k]();
  $('bAtras').disabled = paso===0;
  $('bSig').textContent = esCosmica(paso) ? 'GUARDAR'
    : (paso>=PASOS.length-2 ? 'PUBLICAR' : 'SIGUIENTE · '+PASOS[paso+1].t+' →');
  $('bSig').className = 'btn '+(paso>=PASOS.length-2?'naranja':'tinta relleno');
  pintaTabs(); pintaTarjeta();
}

/* Lo que todavía no se rehizo no se disimula: se dice, y se manda a donde sí
   se puede hacer hoy. Una pantalla a medias que no avisa es peor que una que
   falta. */
function pendiente(p){
  return '<div class="tarj"><h3 class="h3">'+esc(p.titulo)+'</h3>'+
    '<div class="aviso alerta">Este paso todavía no está rehecho en la pantalla nueva. '+
    'La ficha de siempre lo tiene entero y funcionando: ábrela, haz esta parte ahí y vuelve. '+
    'Lo que guardes allá sale aquí, son los mismos datos.</div>'+
    '<div><a class="btn tinta" style="display:inline-block;text-decoration:none" '+
    'href="/ficha.html?id='+encodeURIComponent(ID)+'">Abrir en la ficha de siempre</a></div></div>';
}

/* ---------- ligar un campo a la ficha ---------- */
function liga(sel){
  Array.prototype.forEach.call(document.querySelectorAll(sel||'[data-c]'),function(el){
    var c=el.getAttribute('data-c');
    if(el.type==='checkbox'){ el.checked=E[c]===true;
      el.onchange=function(){ E[c]=el.checked; sucio=true; pinta(); }; return; }
    var v=E[c]; el.value=(v==null?'':v);
    el.oninput=el.onchange=function(){
      var x=el.value;
      if(el.getAttribute('data-num')!=null) E[c]= x===''?null:Number(x);
      else if(el.getAttribute('data-bool')!=null) E[c]= x===''?null:(x==='true');
      else E[c]= x===''?null:x;
      sucio=true; pintaTarjeta(); pintaTabs();
      if(el.getAttribute('data-repinta')!=null) pinta();
    };
  });
}
/* LAS ETIQUETAS, Y «OTRO» CUANDO LA LISTA NO ALCANZA.
   Javi, 25-oct-2026, sobre los idiomas: «anade Otro y que lo escriba».
   La lista de siete idiomas cubre lo normal y se queda corta en lo que nos
   importa: un guia que da el tour en nahuatl o en wixarika no tiene donde
   decirlo, y eso es justo lo que hace distinto a ese tour. Una lista cerrada
   no solo impide escribir: ensena que eso no cuenta.
   El anadido no es texto suelto, es una etiqueta mas: se guarda en el mismo
   array y se pinta igual, asi que filtra y busca como las demas.
   OJO: `libre` solo se enciende donde el vocabulario es abierto de verdad. En
   «que incluye» no se enciende a proposito -ahi el vocabulario ata cada
   concepto a lo que promete la ficha, y texto libre lo rompe. */
function chips(id,lista,campo,libre){
  var c=$(id); if(!c) return;
  function pinta_(){
    var sel=Array.isArray(E[campo])?E[campo].slice():[];
    /* Lo que el operador escribio se pinta junto a lo de la lista, no debajo:
       para el es un idioma igual que el ingles. */
    var todas=lista.slice();
    sel.forEach(function(n){ if(todas.indexOf(n)<0) todas.push(n); });
    c.innerHTML=todas.map(function(n){
      return '<div class="chip'+(sel.indexOf(n)>=0?' on':'')+'" data-n="'+esc(n)+'">'+esc(n)+'</div>';}).join('')+
      (libre?'<div class="chip" data-otro style="border-style:dashed;color:var(--gris)">＋ Otro</div>':'');
    Array.prototype.forEach.call(c.querySelectorAll('.chip[data-n]'),function(d){
      d.onclick=function(){
        var n=d.getAttribute('data-n'), a=Array.isArray(E[campo])?E[campo].slice():[];
        var i=a.indexOf(n); if(i>=0)a.splice(i,1); else a.push(n);
        E[campo]=a; sucio=true; pinta_(); pintaTarjeta(); pintaTabs(); };});
    var mas=c.querySelector('[data-otro]');
    if(mas) mas.onclick=function(){ escribe(mas); };
  }
  /* El chip se convierte en campo en su sitio. Nada de ventanas: se escribe
     donde se va a ver, y se confirma con Enter o saliendo. */
  function escribe(chip){
    var caja=document.createElement('span');
    caja.className='chip';
    caja.style.cssText='border-color:var(--naranja);background:#fff;padding:3px 6px';
    var i=document.createElement('input');
    i.placeholder='Náhuatl, lengua de señas…';
    i.style.cssText='border:0;outline:none;font:600 12.5px Inter;width:150px;padding:4px 6px;background:transparent';
    caja.appendChild(i); chip.replaceWith(caja); i.focus();
    function cierra(guardar){
      var v=(i.value||'').trim();
      if(guardar && v){
        var a=Array.isArray(E[campo])?E[campo].slice():[];
        /* Sin repetidos, y sin pelear por una mayuscula: «frances» y
           «Francés» son el mismo idioma. */
        var ya=a.concat(lista).some(function(x){ return String(x).toLowerCase()===v.toLowerCase(); });
        if(!ya){ a.push(v); E[campo]=a; sucio=true; }
        else { var j=a.map(function(x){return String(x).toLowerCase();}).indexOf(v.toLowerCase());
               if(j<0){ a.push(v); E[campo]=a; sucio=true; } }
      }
      pinta_(); pintaTarjeta(); pintaTabs();
    }
    i.onkeydown=function(e){
      if(e.key==='Enter'){ e.preventDefault(); cierra(true); }
      if(e.key==='Escape'){ e.preventDefault(); cierra(false); } };
    i.onblur=function(){ cierra(true); };
  }
  pinta_();
}

   corte fijas y no cuentas hacia atrás desde la salida: un tour que sale a las
   6 de la mañana no se puede vender a las 4, aunque «2 h antes» lo permita. */
var ANTES=[['2h','Hasta 2 h antes'],['6h','Hasta 6 h antes'],['12h','Hasta 12 h antes'],
  ['24h','Hasta 24 h antes'],['48h','Hasta 48 h antes'],
  ['mismo12','Hasta el mismo día a las 12:00'],['ant20','Hasta el día anterior a las 20:00'],

function ops(lista,val){ return '<option value="">—</option>'+lista.map(function(o){
  var v=Array.isArray(o)?o[0]:o, n=Array.isArray(o)?o[1]:o;
  return '<option value="'+esc(v)+'"'+(String(val||'')===String(v)?' selected':'')+'>'+esc(n)+'</option>';}).join(''); }

/* ---------- la tarjeta del cliente ---------- */
function nom(lista,v){ for(var i=0;i<lista.length;i++) if(lista[i].slug===v) return lista[i].nombre; return ''; }
function etqAntes(v){ for(var i=0;i<ANTES.length;i++) if(ANTES[i][0]===v) return ANTES[i][1]; return ''; }
function etqCancela(v){ for(var i=0;i<CANCELA.length;i++) if(CANCELA[i][0]===v) return CANCELA[i][1]; return ''; }
function dinero(n){ return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0}); }

function pintaTarjeta(){
  if(!E) return;
  var foto='';
  try{ var f=(E.fotos||[]); if(f.length) foto=f[0].url||f[0]; }catch(_){}
  var dur = E.duracion_min ? Math.round(E.duracion_min/60)+' h' : '';
  var meta=[dur, E.edad_minima?('+'+E.edad_minima):''].filter(Boolean).join(' · ');
  var cos = E.cosmica_salida||E.cosmica_llegada;
  var filas=[];
  if(E.cer_inicio_lugar) filas.push(['Sale de',E.cer_inicio_lugar]);
  if((E.idiomas||[]).length) filas.push(['Idiomas',(E.idiomas||[]).join(', ')]);
  if(E.cupo_max) filas.push(['Grupo','hasta '+E.cupo_max+(E.cupo_min?(' · mínimo '+E.cupo_min):'')]);
  if(E.cancelacion) filas.push(['Cancela',etqCancela(E.cancelacion)]);
  if(E.antelacion) filas.push(['Se reserva',etqAntes(E.antelacion)]);
  if((E.incluye||[]).length) filas.push(['Incluye',(E.incluye||[]).join(', ')]);

  $('tarjeta').innerHTML=
    '<div class="foto"'+(foto?(' style="background-image:url('+esc(foto)+')"'):'')+'>'+(foto?'':'sin foto todavía')+'</div>'+
    '<div class="dentro">'+
      '<div class="etqs">'+
        (E.categoria_slug?'<div class="etq cat">'+esc(nom(TAXC,E.categoria_slug))+'</div>':'')+
        (meta?'<div class="etq">'+esc(meta)+'</div>':'')+
        (cos?'<div class="etq cos">✦ '+(E.cosmica_salida&&E.cosmica_llegada?'INICIA Y TERMINA EN LA CÓSMICA':(E.cosmica_salida?'INICIA EN LA CÓSMICA':'TERMINA EN LA CÓSMICA'))+'</div>':'')+
      '</div>'+
      '<h4>'+esc(E.nombre||'Sin nombre todavía')+'</h4>'+
      '<div class="linea">'+esc(E.resumen||'Falta la línea que la vende: es lo único que se lee entero en el buscador.')+'</div>'+
      (filas.length?'<div class="filas">'+filas.map(function(f){
        return '<div><span>'+esc(f[0])+'</span><span>'+esc(f[1])+'</span></div>';}).join('')+'</div>':'')+
      '<div class="precio">'+(E.apepe_gratuito===true
        ? '<b>Gratis</b><span>va por propina</span>'
        : (Number(E.neto_adulto)>0 ? '<b>'+dinero(E.neto_adulto)+'</b><span>por persona</span>'
                                   : '<span>Falta el precio</span>'))+'</div>'+
    '</div>';
}

/* ---------- guardar ---------- */
var GUARDABLES=['nombre','categoria_slug','tipo_slug','edad_minima','resumen','descripcion','idiomas',
  'cupo_max','cupo_min','grupo_promedio','requiere_minimo','admite_segundo_grupo','cupo_max_grupo2','privado',
  'apepe_gratuito','neto_adulto','neto_menor','cancelacion','antelacion',
  'incluye','no_incluye_lista','que_llevar','accesibilidad'];

async function guarda(){
  /* El mismo candado que la ficha de siempre: si cobra, no puede costar cero.
     Un cero y un gratuito se ven igual en la base y no son lo mismo — uno es
     un tour de propina y el otro es un precio que a alguien se le olvidó. */
  if(E.apepe_gratuito!==true && !(Number(E.neto_adulto)>0)){
    alert('Si el tour cobra al cliente, el precio tiene que ser de un peso para arriba. Si no se cobra, ponlo como gratuito por propina.');
    ve(4); return;
  }
  var b={}; GUARDABLES.forEach(function(c){ if(c in E) b[c]=E[c]; });
  if(E.apepe_gratuito===true){ b.neto_adulto=0; b.neto_menor=null; }
  $('bGuardar').disabled=true; $('bGuardar').textContent='GUARDANDO…';
  try{
    var r=await fetch(SB+'/rest/v1/op_experiencias?id=eq.'+encodeURIComponent(ID),
      {method:'PATCH',headers:Object.assign(hdr(),{Prefer:'return=minimal'}),body:JSON.stringify(b)});
    if(!r.ok) throw new Error((await r.text()).slice(0,200));
    sucio=false; $('bGuardar').textContent='GUARDADO ✓';
    setTimeout(function(){ $('bGuardar').textContent='GUARDAR'; },1600);
  }catch(e){ alert('No se pudo guardar.\n\n'+String(e.message||e)); $('bGuardar').textContent='GUARDAR'; }
  $('bGuardar').disabled=false;
}

/* ---------- arranque ---------- */
var ESTADOS={borrador:['BORRADOR','var(--alerta-bg)','var(--alerta)'],
  en_revision:['EN REVISIÓN','var(--cielo-suave)','#1a5f85'],
  publicada:['PUBLICADA · A LA VENTA','var(--ok-bg)','var(--ok)'],
  pasada:['PASADA','var(--hueso)','var(--gris)'],
  anulada:['ANULADA','var(--error-bg)','var(--error)']};

async function arranca(){
  ses=sesionPanel();
  if(!ID){ $('cargando').textContent='Falta decir qué experiencia abrir.'; return; }
  await catalogo();
  var f=await get('op_experiencias?select=*&id=eq.'+encodeURIComponent(ID)+'&limit=1');
  E=f&&f[0];
  if(!E){ $('cargando').innerHTML='No encontramos esa experiencia, o tu sesión no alcanza a verla.<br><br>'+
    '<a href="/ficha.html?id='+encodeURIComponent(ID)+'">Probar en la ficha de siempre</a>'; return; }
  E.idiomas=E.idiomas||[]; E.incluye=E.incluye||[]; E.no_incluye_lista=E.no_incluye_lista||[]; E.que_llevar=E.que_llevar||[];
  $('hNombre').textContent=E.nombre||'Sin nombre';
  var es=ESTADOS[E.estado]||[String(E.estado||'—').toUpperCase(),'var(--hueso)','var(--gris)'];
  $('hEstado').textContent=es[0]; $('hEstado').style.background=es[1]; $('hEstado').style.color=es[2];
  $('cargando').style.display='none'; $('cuerpo').style.display='';
  pinta();
}
