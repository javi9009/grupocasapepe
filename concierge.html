<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F2682A">
<link rel="manifest" href="/concierge.webmanifest">
<title>Concierge · Sincrético</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Lobster+Two:ital@1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF7F2; --blanco:#fff; --tinta:#221D18; --tinta-2:#5A514A; --gris:#8A8078;
  --naranja:#F2682A; --magenta:#E2188E; --linea:#E6DED4;
  --verde:#1F7A4D; --verde-suave:#EAF7EF; --ambar:#9A6212; --ambar-suave:#FFF4E2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.55;
  padding-bottom:env(safe-area-inset-bottom)}

.barra{background:var(--blanco);border-bottom:1px solid var(--linea);
  padding:12px 16px calc(12px);position:sticky;top:0;z-index:20}
.barra .fila{display:flex;align-items:baseline;gap:10px;max-width:640px;margin:0 auto}
.barra h1{font-family:Oswald,sans-serif;font-size:18px;letter-spacing:.02em;
  text-transform:uppercase;margin:0}
.barra .sub{font-family:'Lobster Two',cursive;font-style:italic;color:var(--magenta);font-size:14px}
.barra .hotel{margin-left:auto;font-size:12px;color:var(--gris);text-align:right}
.tira{height:4px;background:linear-gradient(90deg,var(--naranja) 0 22%,var(--magenta) 22% 50%,#F6B8D8 50% 74%,#8FC7E8 74% 100%)}

main{max-width:640px;margin:0 auto;padding:16px 16px 40px}

.demo{background:var(--ambar-suave);border:1px solid #F0CE95;color:var(--ambar);
  border-radius:12px;padding:11px 14px;font-size:13.5px;margin-bottom:16px}
.demo b{color:#7A4D0B}

nav.tabs{display:flex;gap:6px;background:var(--blanco);border:1px solid var(--linea);
  border-radius:12px;padding:4px;margin-bottom:18px}
nav.tabs button{flex:1;border:0;background:transparent;font:inherit;font-size:13.5px;
  font-weight:600;color:var(--tinta-2);padding:9px 6px;border-radius:9px;cursor:pointer}
nav.tabs button[aria-selected="true"]{background:var(--naranja);color:#fff}

section{display:none}
section.on{display:block}

/* ---- resumen ---- */
.hoy{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:18px;margin-bottom:14px}
.hoy .titulo{font-family:Oswald,sans-serif;text-transform:uppercase;font-size:13px;
  letter-spacing:.05em;color:var(--gris);margin:0 0 12px}
.cifras{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cifra{text-align:center}
.cifra .n{font-family:Oswald,sans-serif;font-size:27px;line-height:1.1;color:var(--tinta)}
.cifra .q{font-size:11.5px;color:var(--gris);margin-top:2px}

.dinero{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;
  padding:18px;margin-bottom:14px}
.linea{display:flex;align-items:flex-start;gap:12px;padding:11px 0;border-bottom:1px solid var(--linea)}
.linea:last-child{border-bottom:0;padding-bottom:0}
.linea .txt{flex:1}
.linea .k{font-weight:600;font-size:14px}
.linea .d{font-size:12.5px;color:var(--gris);line-height:1.45}
.linea .v{font-family:Oswald,sans-serif;font-size:19px;white-space:nowrap}
.v.verde{color:var(--verde)} .v.ambar{color:var(--ambar)} .v.gris{color:var(--gris)}

.nota{background:var(--verde-suave);border:1px solid #BFE4CD;color:#15532F;
  border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}
.aviso{background:var(--ambar-suave);border:1px solid #F0CE95;color:var(--ambar);
  border-radius:12px;padding:12px 14px;font-size:13.5px;margin-bottom:14px}

/* ---- detalle ---- */
.venta{background:var(--blanco);border:1px solid var(--linea);border-radius:13px;
  padding:14px 15px;margin-bottom:10px}
.venta .cab{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.venta .exp{font-family:Oswald,sans-serif;font-size:15px;text-transform:uppercase;line-height:1.25}
.venta .me{font-family:Oswald,sans-serif;font-size:17px;white-space:nowrap}
.venta .quien{font-size:12.5px;color:var(--gris);margin-top:3px}
.etq{display:inline-block;margin-top:9px;padding:3px 9px;border-radius:999px;
  font-size:11px;font-weight:700;letter-spacing:.03em}
.etq.retenido{background:var(--ambar-suave);color:var(--ambar)}
.etq.pendiente{background:#EEF3F8;color:#2B5473}
.etq.liberado{background:var(--verde-suave);color:var(--verde)}
.etq.pagado{background:var(--verde);color:#fff}
.etq.propina{background:var(--magenta);color:#fff}

.vacio{text-align:center;color:var(--gris);padding:46px 20px;font-size:14px}

/* ---- ficha ---- */
.campo{background:var(--blanco);border:1px solid var(--linea);border-radius:12px;
  padding:12px 15px;margin-bottom:9px;display:flex;justify-content:space-between;gap:12px}
.campo .k{font-size:12.5px;color:var(--gris)}
.campo .v2{font-weight:600;font-size:14px;text-align:right}
.mini{font-size:12.5px;color:var(--gris)}
</style>
</head>
<body>

<header class="barra">
  <div class="fila">
    <h1>Concierge</h1>
    <span class="sub">lo que llevas vendido</span>
    <span class="hotel" id="hotel">—</span>
  </div>
</header>
<div class="tira"></div>

<main>
  <div id="avisoDemo"></div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-t="0" aria-selected="true">Mi resumen</button>
    <button role="tab" data-t="1" aria-selected="false">Mis ventas</button>
    <button role="tab" data-t="2" aria-selected="false">Mi ficha</button>
  </nav>

  <section data-s="0" class="on">
    <div class="hoy">
      <p class="titulo">Lo que llevas vendido</p>
      <div class="cifras">
        <div class="cifra"><div class="n" id="rHoy">—</div><div class="q">hoy</div></div>
        <div class="cifra"><div class="n" id="rSem">—</div><div class="q">esta semana</div></div>
        <div class="cifra"><div class="n" id="rMes">—</div><div class="q">este mes</div></div>
      </div>
      <div class="linea" style="margin-top:14px;border-top:1px solid var(--linea);padding-top:13px">
        <div class="txt"><div class="k">Este mes</div>
          <div class="d"><span id="paxMes">—</span> personas · <span id="vendidoMes">—</span> vendidos</div></div>
      </div>
    </div>

    <div id="cajaDinero"></div>
  </section>

  <section data-s="1">
    <div id="lista"></div>
  </section>

  <section data-s="2">
    <div id="ficha"></div>
  </section>
</main>

<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var $=function(i){return document.getElementById(i);};
  var esc=function(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
  var pesos=function(n){return '$'+Number(n||0).toLocaleString('es-MX',{maximumFractionDigits:0});};

  /* La sesión es la del propio colaborador. Si no hay, la pantalla se enseña
     con un ejemplo, para poder verla y opinar antes de que haya gente dada de
     alta. El ejemplo se anuncia: nunca se hace pasar por datos reales. */
  function tok(){
    try{
      for(var i=0;i<localStorage.length;i++){
        var k=localStorage.key(i);
        if(/^sb-.*-auth-token$/.test(k)){
          var j=JSON.parse(localStorage.getItem(k));
          if(j&&j.access_token)return j.access_token;
        }
      }
    }catch(_){ }
    return null;
  }
  function hdr(){var t=tok();return {apikey:KEY,Authorization:'Bearer '+(t||KEY),'Content-Type':'application/json'};}

  var EJEMPLO={
    resumen:{colaborador:'María Fernanda Ruiz', hotel:'Barrio Hostel', reparto_modo:'sincretico',
      reservas_hoy:2, reservas_semana:7, reservas_mes:23, pax_mes:41, vendido_mes:38400,
      retenido:3840, pendiente:0, liberado:0, pagado:0, propinas:620},
    ventas:[
      {experiencia:'Tolantongo · grutas y pozas', huesped:'Sophie Lambert', pax:2, venta_mxn:4400,
       me_toca:440, estado:'retenido', que_pasa:'Contando, todavía no se paga', parte:'colaborador',
       vendida_at:'2026-09-24', servicio_fecha:'2026-09-28'},
      {experiencia:'Tolantongo · grutas y pozas', huesped:'Sophie Lambert', pax:2, venta_mxn:4400,
       me_toca:200, estado:'retenido', que_pasa:'Contando, todavía no se paga', parte:'propina',
       vendida_at:'2026-09-24', servicio_fecha:'2026-09-28'},
      {experiencia:'Taco tasting · Centro Histórico', huesped:'Mark Feeney', pax:3, venta_mxn:2850,
       me_toca:285, estado:'retenido', que_pasa:'Contando, todavía no se paga', parte:'colaborador',
       vendida_at:'2026-09-24', servicio_fecha:'2026-09-25'},
      {experiencia:'Live a Football Match at the stadium', huesped:'Luca Bianchi', pax:2, venta_mxn:3600,
       me_toca:360, estado:'retenido', que_pasa:'Contando, todavía no se paga', parte:'colaborador',
       vendida_at:'2026-09-23', servicio_fecha:'2026-09-27'}
    ],
    ficha:{nombre:'María Fernanda Ruiz', email:'mafer@barriohostel.mx', rol:'concierge',
      codigo_venta:'BH-MAFER', com_pct:10}
  };

  var MODO_EJEMPLO=false, R=null, V=[], F=null;

  async function trae(ruta){
    var r=await fetch(SB+'/rest/v1/'+ruta,{headers:hdr()});
    if(!r.ok)return null;
    return await r.json();
  }

  async function carga(){
    var res=null;
    if(tok()){
      res=await trae('v_concierge_resumen?select=*&limit=1');
    }
    if(res&&res.length){
      R=res[0];
      V=(await trae('v_concierge_ventas?select=*&order=vendida_at.desc&limit=60'))||[];
      var f=await trae('hotel_usuarios?select=nombre,email,rol,codigo_venta,com_pct&limit=1');
      F=(f&&f[0])||null;
    }else{
      MODO_EJEMPLO=true;
      R=EJEMPLO.resumen; V=EJEMPLO.ventas; F=EJEMPLO.ficha;
      $('avisoDemo').innerHTML='<div class="demo"><b>Vista de ejemplo.</b> Todavía no hay '+
        'colaboradores dados de alta, así que esto son números inventados para enseñar cómo se ve. '+
        'En cuanto alguien entre con su cuenta, verá aquí sus ventas de verdad.</div>';
    }
    pinta();
  }

  function pinta(){
    $('hotel').textContent=R.hotel||'';
    $('rHoy').textContent=R.reservas_hoy;
    $('rSem').textContent=R.reservas_semana;
    $('rMes').textContent=R.reservas_mes;
    $('paxMes').textContent=R.pax_mes;
    $('vendidoMes').textContent=pesos(R.vendido_mes);

    /* La regla que evita el peor error de esta pantalla: si el hotel es quien
       reparte, aquí NO se enseñan pesos. Enseñar una comisión que no la paga
       Sincrético convierte un malentendido del hotel en un reclamo nuestro. */
    if(R.reparto_modo==='hotel'){
      $('cajaDinero').innerHTML=
        '<div class="nota"><b>Tu comisión te la paga tu hotel.</b> Aquí llevamos la cuenta de lo que '+
        'vendes y se la pasamos a '+esc(R.hotel)+', que es quien te liquida por su nómina. '+
        'Si algo no te cuadra, díselo a tu gerente.</div>';
      return;
    }

    var h='<div class="dinero"><p class="titulo" style="font-family:Oswald,sans-serif;'+
      'text-transform:uppercase;font-size:13px;letter-spacing:.05em;color:var(--gris);margin:0 0 4px">Lo que te toca</p>';
    h+=fila('Contando','Ganado, pero todavía no sale: falta definir cómo se te paga.',R.retenido,'ambar');
    h+=fila('Se libera después del tour','La comisión se gana cuando el tour sale.',R.pendiente,'gris');
    h+=fila('En el próximo corte','Ya liberado, entra en el siguiente pago.',R.liberado,'verde');
    h+=fila('Pagado','Lo que ya se te depositó.',R.pagado,'verde');
    if(Number(R.propinas)>0)
      h+=fila('Propinas','De los huéspedes, íntegras. No llevan comisión.',R.propinas,'verde');
    h+='</div>';

    if(Number(R.retenido)>0){
      h+='<div class="aviso"><b>¿Por qué dice «contando»?</b> Tu comisión ya está ganada y anotada. '+
         'Estamos terminando de definir cómo pagártela para que te llegue bien y en orden. '+
         'No se pierde nada: en cuanto quede, entra en el corte siguiente.</div>';
    }
    $('cajaDinero').innerHTML=h;

    $('lista').innerHTML=V.length?V.map(function(v){
      var est=(v.estado||'').toLowerCase();
      var etq=v.parte==='propina'?'<span class="etq propina">propina</span>':
        '<span class="etq '+esc(est)+'">'+esc(v.que_pasa||est)+'</span>';
      return '<div class="venta">'+
        '<div class="cab"><span class="exp">'+esc(v.experiencia||'—')+'</span>'+
          '<span class="me">'+pesos(v.me_toca)+'</span></div>'+
        '<div class="quien">'+esc(v.huesped||'')+' · '+esc(v.pax||0)+' pax · venta de '+pesos(v.venta_mxn)+
          (v.servicio_fecha?' · sale el '+esc(String(v.servicio_fecha).slice(5).replace('-','/')):'')+'</div>'+
        etq+
      '</div>';
    }).join(''):'<div class="vacio">Todavía no has vendido nada.<br>Cuando hagas tu primera reserva, aparece aquí.</div>';

    $('ficha').innerHTML=F?
      campo('Nombre',F.nombre)+campo('Correo',F.email)+campo('Rol',F.rol)+
      campo('Tu código de venta',F.codigo_venta||'—')+
      campo('Tu comisión',(F.com_pct!=null?F.com_pct:R.reparto_modo==='hotel'?'—':10)+'%')+
      '<p class="mini" style="margin-top:12px">Tu código de venta es con lo que se te atribuye cada reserva. '+
      'Si algo de aquí está mal, pídele a tu gerente que lo corrija.</p>'
      :'<div class="vacio">Sin ficha.</div>';
  }

  function fila(k,d,v,cls){
    return '<div class="linea"><div class="txt"><div class="k">'+k+'</div><div class="d">'+d+'</div></div>'+
      '<div class="v '+cls+'">'+pesos(v)+'</div></div>';
  }
  function campo(k,v){
    return '<div class="campo"><span class="k">'+esc(k)+'</span><span class="v2">'+esc(v)+'</span></div>';
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(b){
    b.onclick=function(){
      Array.prototype.forEach.call(document.querySelectorAll('nav.tabs button'),function(o){
        o.setAttribute('aria-selected', String(o===b));});
      Array.prototype.forEach.call(document.querySelectorAll('section'),function(s){
        s.classList.toggle('on', s.getAttribute('data-s')===b.getAttribute('data-t'));});
    };
  });

  carga();
})();
</script>
</body>
</html>
