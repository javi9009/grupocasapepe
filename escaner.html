<!--
  EL ESCANER, EN SU PROPIA APP. Javi, 30-oct-2026: «no me abre la cámara.
  ¿Podrías generarme un link para que se descarguen el scaner de boletos en su
  cel y que puedan revisar el listado de los boletos pendientes de cobrar y los
  cobrados? Del día o días anteriores y el detalle de si se ajustó o no llegó
  alguien?»

  POR QUE UNA PAGINA APARTE Y NO UNA PESTAÑA MAS. La de dentro del portal vive
  en un iframe, dentro de otra pantalla, con el menú del panel encima: en un
  teléfono, en la puerta de un teatro y con gente esperando, eso es tres
  estorbos antes de llegar a la cámara. Aquí no hay nada más que la cámara y la
  lista. Y se instala: se abre a pantalla completa desde el icono, sin barra de
  navegador comiéndose el visor.

  Quien puede validar qué lo sigue decidiendo la base -`sinc_puede_validar`-,
  no esta pantalla. Esto es una ventana; la puerta está donde siempre.
-->
<style>
:root{
  --naranja:#F2682A;--tinta:#1E1A16;--tinta-2:#3C3630;--gris:#6E665C;
  --linea:#E6DFD6;--papel:#FBF7F2;--hueso:#F4EFE8;--blanco:#fff;
  --ok:#1D6B4A;--ok-bg:#E1F0E7;--error:#9E3B2E;--error-bg:#F6E1DD;
  --ambar:#8C6212;--ambar-bg:#F6EBD5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,-apple-system,"Segoe UI",system-ui,sans-serif;font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--tinta);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
  position:sticky;top:0;z-index:20}
header h1{font-family:Oswald;font-size:17px;letter-spacing:.1em;text-transform:uppercase;margin:0}
header .sub{font-size:12px;color:#C9C2B8;margin-top:2px}
header .salir{position:absolute;right:14px;top:calc(14px + env(safe-area-inset-top));
  background:none;border:0;color:#C9C2B8;font:inherit;font-size:13px;cursor:pointer}
main{padding:14px max(14px,env(safe-area-inset-left)) 28px max(14px,env(safe-area-inset-right))}
.card{background:var(--blanco);border:1px solid var(--linea);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-family:Oswald;font-size:14px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}
.mini{font-size:12.5px;color:var(--gris);line-height:1.5}
.btn{font-family:Oswald;font-weight:600;letter-spacing:.05em;text-transform:uppercase;font-size:14px;
  background:var(--naranja);color:#fff;border:0;border-radius:11px;padding:13px 18px;cursor:pointer}
.btn.g{background:var(--hueso);color:var(--tinta);border:1px solid var(--linea)}
.btn.ancho{display:block;width:100%}
.btn:disabled{opacity:.5}
#visor{width:100%;background:#000;border-radius:12px;overflow:hidden;margin-top:10px}
#visor:not(:empty){min-height:min(58vh,360px)}
#visor video,#visor canvas{width:100%!important;height:auto!important;display:block}
input{width:100%;padding:13px 12px;border:1.5px solid var(--linea);border-radius:11px;font:inherit;
  font-size:17px;letter-spacing:.08em;text-transform:uppercase;background:#fff;color:var(--tinta)}
.res{border-radius:12px;padding:14px;margin-top:12px;border:1px solid var(--linea)}
.res.ok{background:var(--ok-bg);border-color:var(--ok)}
.res.mal{background:var(--error-bg);border-color:var(--error)}
.res.ojo{background:var(--ambar-bg);border-color:#C9A227}
.res .big{font-family:Oswald;font-size:21px;font-weight:700;line-height:1.2}
.pasos{display:flex;gap:7px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pasos b{font-family:Oswald;font-size:24px;min-width:38px;text-align:center}
.idbox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--linea)}
/* LA HOJA. No es un dialogo del navegador -esos los bloquea el telefono-,
   es la propia pagina: sube desde abajo y tapa todo, para que a un metro,
   en la puerta, se vea si el QR se leyo o no. */
.modal{position:fixed;inset:0;z-index:60;background:rgba(30,26,22,.58);display:none;
  align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.hoja{background:var(--papel);width:100%;max-width:520px;border-radius:18px 18px 0 0;
  max-height:92vh;overflow:auto;border-top:4px solid var(--naranja);
  padding:14px max(14px,env(safe-area-inset-left)) calc(16px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-right))}
.hoja .cerrar{float:right;background:none;border:0;font-size:28px;line-height:1;
  color:var(--gris);cursor:pointer;padding:0 6px}
@media(min-width:560px){.modal{align-items:center}.hoja{border-radius:18px;max-height:88vh}}
.fila{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.fila:first-of-type{border-top:0}
.fila .n{flex:1;min-width:0}
.fila .n b{display:block;font-size:14.5px}
.fila .c{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11.5px;color:var(--gris);word-break:break-all}
.etq{font-family:Oswald;font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;
  border-radius:999px;padding:3px 9px;background:var(--hueso);color:var(--tinta-2);white-space:nowrap}
.etq.ok{background:var(--ok-bg);color:var(--ok)}
.etq.mal{background:var(--error-bg);color:var(--error)}
.etq.ojo{background:var(--ambar-bg);color:var(--ambar)}
.sal{border:1px solid var(--linea);border-radius:14px;margin-bottom:12px;overflow:hidden;background:#fff}
.sal-c{padding:12px 14px;background:var(--hueso);cursor:pointer}
.sal-c b{font-family:Oswald;font-size:15px}
.sal-b{padding:0 14px 10px}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.tabs button{font-family:Oswald;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;
  background:var(--blanco);border:1px solid var(--linea);border-radius:999px;padding:8px 14px;cursor:pointer;color:var(--gris)}
.tabs button.on{background:var(--tinta);color:#fff;border-color:var(--tinta)}
.vacio{text-align:center;color:var(--gris);padding:26px 10px;font-size:13.5px}
</style></head><body>

<header>
  <h1>Boletos</h1>
  <div class="sub" id="quien">…</div>
  <button class="salir" id="salir">Salir</button>
</header>

<main>
  <div id="puerta" style="display:none">
    <div class="card">
      <h2>Entra con tu cuenta</h2>
      <div class="mini">La misma con la que entras al portal. Si no tienes contraseña todavía, la creas desde el correo que te mandamos.</div>
      <div style="margin-top:12px"><input id="mail" type="email" placeholder="tu@correo.com" style="text-transform:none;letter-spacing:0"></div>
      <div style="margin-top:8px"><input id="pass" type="password" placeholder="Tu contraseña" style="text-transform:none;letter-spacing:0"></div>
      <div style="margin-top:12px"><button class="btn ancho" id="entrar">Entrar</button></div>
      <div class="mini" id="avisoPuerta" style="margin-top:10px"></div>
    </div>
  </div>

  <div id="app" style="display:none">
    <div class="tabs">
      <button data-t="escanear" class="on">Escanear</button>
      <button data-t="lista">La lista</button>
    </div>

    <section id="tabEscanear">
      <div class="card">
        <button class="btn ancho" id="camOn">Encender la cámara</button>
        <button class="btn g ancho" id="camOff" style="display:none">Apagar la cámara</button>
        <div class="mini" id="camNota" style="margin-top:8px">Apunta al QR del boleto.</div>
        <div id="visor"></div>
      </div>
      <div class="card">
        <h2>Sin cámara</h2>
        <div class="mini">Escribe el código que viene debajo del QR, tal cual, con sus guiones.</div>
        <div style="margin-top:10px"><input id="codigo" placeholder="SR-2610-00118" maxlength="40" autocomplete="off" autocapitalize="characters"></div>
        <div style="margin-top:8px"><button class="btn g ancho" id="valida">Validar</button></div>
      </div>
      <div id="res"></div>
    </section>

    <section id="tabLista" style="display:none">
      <div class="card">
        <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <button class="btn g" id="diaMenos">← Día antes</button>
          <input id="dia" type="date" style="flex:1;min-width:140px;text-transform:none;letter-spacing:0;font-size:15px">
          <button class="btn g" id="diaMas">Día después →</button>
        </div>
      </div>
      <div id="lista"><div class="vacio">Cargando…</div></div>
    </section>
  </div>
</main>

<div class="modal" id="modal"><div class="hoja" id="hoja"></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const SB  = 'https://rehophywchakfapivsbh.supabase.co';
const KEY = 'sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb  = createClient(SB, KEY);
const $   = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pesos = n => '$'+Number(n||0).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const cuando = t => { try{ return new Date(t).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit'}); }catch(_){ return ''; } };

let SES=null, LECTOR=null, ULT='', ULTAT=0;

function hdr(){
  return { apikey:KEY, Authorization:'Bearer '+(SES?.access_token||KEY), 'Content-Type':'application/json' };
}
/* EL TOKEN SE VENCE. Javi, 30-oct-2026, con la fila en la puerta: «ya no
   permite validar ni subir fotos», y abajo del boton decia «JWT expired».
   Esta pantalla se abre a las seis y se usa hasta la una: el token que guardo
   al entrar dura una hora. La libreria lo renueva sola, pero nosotros nos
   habiamos quedado con la copia vieja en SES y la mandabamos en cada llamada.
   Asi que antes de cada peticion se pide el vivo -getSession lo renueva si
   hace falta- y se guarda. Si ya no hay forma de renovarlo, se vuelve a la
   puerta en vez de dar un error que nadie sabe leer. */
async function fresco(){
  try{
    const { data } = await sb.auth.getSession();
    if(data?.session){ SES = data.session; return true; }
  }catch(_){}
  SES=null; $('puerta').style.display=''; $('app').style.display='none';
  $('quien').textContent='Sin entrar';
  $('avisoPuerta').textContent='Tu sesión caducó. Entra otra vez para seguir validando.';
  cierraHoja();
  return false;
}
sb.auth.onAuthStateChange((_e, s) => { if(s) SES = s; });

/* ---------- la puerta ---------- */
async function arranca(){
  const { data } = await sb.auth.getSession();
  SES = data?.session || null;
  if(!SES){ $('puerta').style.display=''; $('app').style.display='none'; $('quien').textContent='Sin entrar'; return; }
  $('puerta').style.display='none'; $('app').style.display='';
  $('quien').textContent = SES.user?.email || '';
  $('dia').value = new Date(Date.now()-new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
  cargaLista();
}
$('entrar').onclick = async () => {
  const b=$('entrar'); b.disabled=true; b.textContent='Entrando…';
  const { error } = await sb.auth.signInWithPassword({
    email:($('mail').value||'').trim().toLowerCase(), password:$('pass').value||'' });
  b.disabled=false; b.textContent='Entrar';
  if(error){ $('avisoPuerta').textContent='No pudimos entrar: '+error.message; return; }
  arranca();
};
$('pass').onkeydown = e => { if(e.key==='Enter') $('entrar').click(); };
$('salir').onclick = async () => { await apagaCam(); await sb.auth.signOut(); location.reload(); };

/* ---------- pestañas ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x===b));
  const t=b.getAttribute('data-t');
  $('tabEscanear').style.display = t==='escanear' ? '' : 'none';
  $('tabLista').style.display    = t==='lista'    ? '' : 'none';
  if(t==='lista') cargaLista(); else apagaCam();
});

/* ---------- la cámara ----------
   El lector se trae de fuera y puede no llegar: si no llega, se dice, y queda
   el campo de escribir el código, que nunca falla. */
function cargaLector(){
  return new Promise((ok,mal)=>{
    if(window.Html5Qrcode) return ok();
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js';
    s.onload=()=>ok(); s.onerror=()=>mal(new Error('no cargó el lector'));
    document.head.appendChild(s);
  });
}
$('camOn').onclick = async () => {
  try{
    $('camNota').textContent='Preparando la cámara…';
    await cargaLector();
    LECTOR = new Html5Qrcode('visor');
    $('camOn').style.display='none'; $('camOff').style.display='';
    await LECTOR.start({facingMode:'environment'}, {fps:10, qrbox:{width:240,height:240}},
      t => verifica(t, true), () => {});
    $('camNota').textContent='Apunta al QR del boleto.';
  }catch(e){
    /* El motivo importa: «permiso denegado» se arregla en los ajustes del
       teléfono y «no hay cámara» no se arregla. */
    const m = String(e?.message||e);
    $('camNota').textContent = /permission|denied|notallowed/i.test(m)
      ? 'El teléfono no dio permiso de cámara. Entra a los ajustes del navegador y permítelo para este sitio, o escribe el código abajo.'
      : 'No se pudo abrir la cámara: '+m+'. Escribe el código abajo.';
    $('camOn').style.display=''; $('camOff').style.display='none'; LECTOR=null;
  }
};
async function apagaCam(){
  if(!LECTOR) return;
  try{ await LECTOR.stop(); }catch(_){}
  try{ LECTOR.clear(); }catch(_){}
  LECTOR=null; $('camOn').style.display=''; $('camOff').style.display='none';
}
$('camOff').onclick = apagaCam;
$('valida').onclick = () => { const c=($('codigo').value||'').trim(); if(c){ verifica(c,false); $('codigo').value=''; } };
$('codigo').onkeydown = e => { if(e.key==='Enter') $('valida').click(); };

/* ---------- validar ---------- */
async function verifica(cod, deCamara){
  cod=String(cod||'').trim().toUpperCase(); if(!cod) return;
  /* El lector dispara varias veces sobre el mismo QR mientras enfoca. A mano
     no: si alguien teclea dos veces es porque son dos personas. */
  const ahora=Date.now();
  if(deCamara && cod===ULT && ahora-ULTAT<4000) return;
  /* Con la hoja abierta la camara sigue viendo el mismo QR: que no la cambie
     debajo de las manos de quien esta contando personas. */
  if(deCamara && $('modal').classList.contains('on')) return;
  ULT=cod; ULTAT=ahora;
  $('res').innerHTML='<div class="res"><div class="mini">Comprobando…</div></div>';
  if(!await fresco()) return;
  try{
    const g = await fetch(SB+'/rest/v1/rpc/sinc_boleto_grupo',{method:'POST',headers:hdr(),
      body:JSON.stringify({p_codigo:cod})}).then(r=>r.json());
    if(g && g.ok===false && g.motivo==='no_encontrado'){
      $('res').innerHTML='<div class="res mal"><div class="big">No encontramos ese código</div>'+
        '<div class="mini">Revisa que esté completo, con sus guiones.</div></div>';
      vibra([80,60,80]); return;
    }
    if(g && g.grupo) return pintaGrupo(g);
    $('res').innerHTML='<div class="res ojo"><div class="mini">Código leído: '+esc(cod)+'</div></div>';
  }catch(e){
    $('res').innerHTML='<div class="res mal"><div class="mini">Falló la comprobación: '+esc(e.message||e)+'</div></div>';
  }
}

/* LA HOJA DEL ESCANEO. Javi, 30-oct-2026: «Cuando el sistema detecta el qr no
   se ve si lo leyo bien. Puedes hacer que cuando lo lea se abra un pop up que
   abra el editor de personas y capturar ID. Y si ya paso poner cuantos pasaron
   y si ya pasaron todos reportar que ya llego».
   Y: «en la lista permite que quien este en la puerta en vez de escanear le de
   a un boton que diga "ya llego" y el num de personas». Es la misma hoja: se
   llegue por la camara, por el codigo escrito o por el boton de la lista, lo
   que se abre es esto, para que nadie aprenda dos pantallas. */
function abreHoja(html){
  $('hoja').innerHTML='<button class="cerrar" id="hojaX" aria-label="Cerrar">&times;</button>'+html;
  $('modal').classList.add('on');
  $('hojaX').onclick = cierraHoja;
}
function cierraHoja(){ $('modal').classList.remove('on'); $('hoja').innerHTML=''; }
$('modal').onclick = e => { if(e.target===$('modal')) cierraHoja(); };

function pintaGrupo(b){
  const pax = Number(b.pax);
  const llegaron = Number(b.llegaron||0);
  const todos = pax>0 && llegaron>=pax;
  const ya = llegaron>0;
  const cab = b.ok===false ? 'Reserva cancelada'
            : todos ? 'Ya llego'
            : ya    ? 'Ya pasaron '+llegaron+' de '+pax
            :         (b.titular||'Reserva');
  $('res').innerHTML='';
  abreHoja(
    '<div class="res '+(b.ok===false?'mal':(todos?'ok':(ya?'ojo':'ok')))+'" style="margin-top:6px">'+
      '<div class="big">'+esc(cab)+'</div>'+
      ((todos||ya) && b.titular ? '<div class="mini" style="margin-top:2px"><b>'+esc(b.titular)+'</b></div>' : '')+
      '<div class="mini">'+esc(b.experiencia||'')+' &middot; '+esc(String(b.fecha||'').slice(0,10))+
        (b.hora?' a las '+esc(String(b.hora).slice(0,5)):'')+'</div>'+
      '<div class="mini" style="margin-top:3px">'+esc(b.codigo||'')+'</div>'+
      /* Quien autorizo el paso. Javi, 30-oct-2026: «En el detalle se ha de
         poner que usuario escaneo o autorizo pasar». */
      (b.llego_por ? '<div class="mini" style="margin-top:6px">Lo paso <b>'+esc(b.llego_por)+'</b>'+
          (b.llego_at?' &middot; '+esc(cuando(b.llego_at)):'')+'</div>' : '')+
      (Number(b.por_cobrar)>0 ? '<div class="mini" style="margin-top:6px"><b>Por cobrar en la puerta:</b> '+
        pesos(b.por_cobrar)+' ('+pesos(b.por_persona)+' por persona)</div>' : '')+
      '<div class="pasos">'+
        '<button class="btn g" id="menos">&minus;</button>'+
        '<b id="cuantos">'+(ya?llegaron:pax)+'</b>'+
        '<button class="btn g" id="mas">+</button>'+
        '<span class="mini">de '+pax+' persona'+(pax===1?'':'s')+'</span>'+
      '</div>'+
      '<div class="mini" style="margin-top:8px">Si llegaron menos, baja el numero antes de confirmar.</div>'+
      /* LA FOTO DEL ID, una por reserva: el grupo llega junto. */
      '<div class="idbox">'+
        '<div class="mini"><b>Identificacion'+(b.pide_id?' &middot; hace falta':' &middot; opcional')+'</b></div>'+
        (b.id_foto
          ? '<div class="mini" id="idYa">Ya tiene foto'+(b.id_foto_por?', la tomo <b>'+esc(b.id_foto_por)+'</b>':'')+'. '+
            '<button class="btn g" id="idVer" style="padding:7px 12px;font-size:12px">Verla</button> '+
            '<button class="btn g" id="idOtra" style="padding:7px 12px;font-size:12px">Cambiarla</button></div>'
          : '<label class="btn g ancho" style="display:block;text-align:center">Tomar la foto del ID'+
            '<input type="file" id="idArch" accept="image/*" capture="environment" style="display:none"></label>')+
        '<div class="mini" id="idNota" style="margin-top:6px"></div>'+
      '</div>'+
      '<div style="margin-top:12px"><button class="btn ancho" id="confirma">Confirmar la llegada</button></div>'+
      '<div style="margin-top:8px"><button class="btn g ancho" id="cierra2">Cerrar</button></div>'+
    '</div>');
  $('cierra2').onclick = cierraHoja;

  let n = ya ? llegaron : pax;
  let foto = b.id_foto || null;
  const pinta = () => { $('cuantos').textContent = n; };

  /* EL ID AVISA, NO TRANCA. Javi, 30-oct-2026: «Una vez suban el ID ya se
     cierra la entrada. Si no suben ID se reporta que llego sin ID». Antes el
     boton se quedaba apagado sin foto, y eso para la fila en la puerta. Ahora
     se puede pasar sin foto, y queda escrito que se paso sin foto. */
  const candado = () => {
    const c=$('confirma'); if(!c) return;
    const falta = b.pide_id && !foto;
    c.textContent = falta ? 'Confirmar sin ID' : 'Confirmar la llegada';
    c.className   = falta ? 'btn g ancho' : 'btn ancho';
    const nota=$('idNota'); if(!nota) return;
    nota.textContent = falta ? 'Si confirmas sin la foto, queda reportado que llego sin ID.'
                     : (foto ? 'Identificacion guardada.' : '');
  };
  candado();

  const sube = async (f) => {
    if(!f) return;
    if(f.size > 12*1024*1024){ $('idNota').textContent='La foto pesa mas de 12 MB.'; return; }
    $('idNota').textContent='Subiendo la foto...';
    if(!await fresco()) return;
    const ext=(String(f.name).split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
    /* La regla del almacen mira la TERCERA carpeta y ahi tiene que ir el
       operador; cambiar el orden rompe el permiso sin avisar. */
    const ruta='identificaciones/'+b.salida_id+'/'+(b.operador_id||'casa')+'/'+b.reserva_id+'-'+Date.now()+'.'+ext;
    try{
      const up=await fetch(SB+'/storage/v1/object/tercero-docs/'+ruta,{method:'POST',
        headers:{apikey:KEY, Authorization:'Bearer '+SES.access_token,
                 'Content-Type':f.type||'image/jpeg'}, body:f});
      if(!up.ok){
        $('idNota').textContent = up.status===401
          ? 'Tu sesión caducó. Sal y entra otra vez.'
          : 'El almacen la rechazo ('+up.status+').';
        return;
      }
      const r=await fetch(SB+'/rest/v1/rpc/sinc_reserva_id_foto',{method:'POST',headers:hdr(),
        body:JSON.stringify({p_reserva:b.reserva_id, p_ruta:ruta})}).then(x=>x.json());
      if(r && r.ok){ foto=ruta; candado(); vibra([30]); }
      else $('idNota').textContent=(r&&(r.message||r.motivo))||'No se pudo guardar.';
    }catch(e){ $('idNota').textContent='No se pudo subir: '+(e.message||e); }
  };
  const arch=$('idArch'); if(arch) arch.onchange = () => sube(arch.files && arch.files[0]);
  const otra=$('idOtra'); if(otra) otra.onclick = () => {
    $('idYa').outerHTML='<label class="btn g ancho" style="display:block;text-align:center">Tomar la foto del ID'+
      '<input type="file" id="idArch2" accept="image/*" capture="environment" style="display:none"></label>';
    const a2=$('idArch2'); if(a2) a2.onchange = () => sube(a2.files && a2.files[0]);
  };
  const ver=$('idVer'); if(ver) ver.onclick = async () => {
    if(!await fresco()) return;
    const sg=await fetch(SB+'/storage/v1/object/sign/tercero-docs/'+foto,{method:'POST',
      headers:hdr(), body:JSON.stringify({expiresIn:600})}).then(x=>x.json()).catch(()=>null);
    if(sg && sg.signedURL) window.open(SB+'/storage/v1'+sg.signedURL,'_blank','noopener');
    else $('idNota').textContent='No se pudo abrir la foto.';
  };
  $('menos').onclick = () => { if(n>0){ n--; pinta(); } };
  $('mas').onclick   = () => { if(n<pax){ n++; pinta(); } };
  $('confirma').onclick = async () => {
    const btn=$('confirma'); btn.disabled=true; const antes=btn.textContent; btn.textContent='...';
    const sinId = !!(b.pide_id && !foto);
    if(!await fresco()){ btn.disabled=false; btn.textContent=antes; return; }
    try{
      const r = await fetch(SB+'/rest/v1/rpc/sinc_confirmar_grupo',{method:'POST',headers:hdr(),
        body:JSON.stringify({p_codigo:b.codigo, p_pax:n})}).then(x=>x.json());
      if(r && r.ok){
        abreHoja('<div class="res '+(sinId?'ojo':'ok')+'" style="margin-top:6px">'+
          '<div class="big">'+(n>=pax ? 'Ya llego' : n+' de '+pax+' adentro')+'</div>'+
          '<div class="mini" style="margin-top:2px"><b>'+esc(b.titular||'')+'</b></div>'+
          '<div class="mini">'+esc(b.experiencia||'')+'</div>'+
          '<div class="mini" style="margin-top:6px">Lo paso <b>'+esc(SES.user?.email||'')+'</b></div>'+
          (sinId?'<div class="mini" style="margin-top:6px"><b>Llego sin ID.</b> Queda reportado asi.</div>':'')+
          '<div style="margin-top:12px"><button class="btn ancho" id="listo">Listo</button></div>'+
        '</div>');
        $('listo').onclick = cierraHoja;
        vibra([40]);
        if($('tabLista').style.display!=='none') cargaLista();
      }else{
        btn.disabled=false; btn.textContent=antes;
        $('idNota') && ($('idNota').textContent=(r&&(r.message||r.motivo))||'No se pudo confirmar');
      }
    }catch(e){
      btn.disabled=false; btn.textContent=antes;
      $('idNota') && ($('idNota').textContent=String(e.message||e));
    }
  };
}
function vibra(p){ try{ navigator.vibrate && navigator.vibrate(p); }catch(_){} }

/* ---------- la lista del día ---------- */
$('diaMenos').onclick = () => mueveDia(-1);
$('diaMas').onclick   = () => mueveDia(1);
$('dia').onchange     = cargaLista;
function mueveDia(d){
  const v=$('dia').value; if(!v) return;
  const p=v.split('-'); const f=new Date(+p[0], +p[1]-1, +p[2]); f.setDate(f.getDate()+d);
  $('dia').value = f.getFullYear()+'-'+String(f.getMonth()+1).padStart(2,'0')+'-'+String(f.getDate()).padStart(2,'0');
  cargaLista();
}
const ETQ = {
  pendiente:['', 'sin pasar'],
  llego    :['ok', 'llegaron'],
  ajustado :['ojo','ajustada'],
  no_show  :['mal','no llegó'],
};
async function cargaLista(){
  if(!SES) return;
  $('lista').innerHTML='<div class="vacio">Cargando…</div>';
  if(!await fresco()) return;
  try{
    const salidas = await fetch(SB+'/rest/v1/rpc/sinc_dia_boletos',{method:'POST',headers:hdr(),
      body:JSON.stringify({p_fecha:$('dia').value||null})}).then(r=>r.json());
    if(!salidas || !salidas.length){
      $('lista').innerHTML='<div class="vacio">Ese día no tienes ninguna salida.</div>'; return;
    }
    $('lista').innerHTML = salidas.map(s => {
      const r = s.reservas||[];
      return '<div class="sal">'+
        '<div class="sal-c"><b>'+esc(String(s.hora||'').slice(0,5))+' · '+esc(s.experiencia)+'</b>'+
          '<div class="mini">'+s.llegaron+' de '+s.pax+' personas adentro · '+
            s.pendientes+' sin pasar'+
            (s.ajustadas?' · '+s.ajustadas+' ajustada'+(s.ajustadas===1?'':'s'):'')+
            (s.no_shows?' · '+s.no_shows+' no llegó':'')+
            (s.sin_id?' · '+s.sin_id+' sin ID':'')+
            (Number(s.por_cobrar)>0?' · por cobrar '+pesos(s.por_cobrar):'')+
          '</div></div>'+
        '<div class="sal-b">'+ (r.length ? r.map(x => {
          const e = ETQ[x.estado]||['',''];
          return '<div class="fila"><div class="n"><b>'+esc(x.nombre)+'</b>'+
            '<div class="c">'+esc(x.codigo)+'</div>'+
            (x.estado==='ajustado' ? '<div class="mini">entraron '+x.llegaron+' de '+x.pax+'</div>' : '')+
            (Number(x.por_cobrar)>0 ? '<div class="mini">por cobrar '+pesos(x.por_cobrar)+'</div>' : '')+
            (x.restricciones ? '<div class="mini">'+esc(x.restricciones)+'</div> ' : '')+
            (x.llego_por ? '<div class="mini">lo pasó '+esc(x.llego_por)+
                (x.llego_at?' · '+esc(cuando(x.llego_at)):'')+'</div>' : '')+
            ((x.estado==='llego'||x.estado==='ajustado') && !x.id_foto
              ? '<div class="mini"><b>llegó sin ID</b></div>' : '')+
          '</div>'+
          /* EL BOTON DE LA PUERTA. Javi, 30-oct-2026: «en vez de escanear le
             de a un boton que diga "ya llego" y el num de personas. Ahi
             tambien lanza la camara para que se suba el ID». Abre la misma
             hoja que el escaneo: contar personas, foto del ID, confirmar. */
          '<div style="text-align:right"><span class="etq '+e[0]+'">'+e[1]+'</span>'+
            '<div class="mini">'+x.pax+' pers.</div>'+
            '<button class="btn'+(x.estado==='pendiente'?'':' g')+'" data-cod="'+esc(x.codigo)+'" '+
              'style="margin-top:7px;padding:8px 12px;font-size:12px;white-space:nowrap">'+
              (x.estado==='pendiente'?'Ya llegó':'Abrir')+'</button>'+
          '</div></div>';
        }).join('') : '<div class="mini" style="padding:10px 0">Sin reservas.</div>')+
        '</div></div>';
    }).join('');
  }catch(e){
    $('lista').innerHTML='<div class="vacio">No pudimos traer la lista: '+esc(e.message||e)+'</div>';
  }
}
/* La lista se vuelve a dibujar entera cada vez, asi que el click se escucha
   arriba y no en cada boton: uno solo, que no se pierde al repintar. */
$('lista').onclick = e => {
  const b = e.target.closest && e.target.closest('button[data-cod]');
  if(!b) return;
  verifica(b.getAttribute('data-cod'), false);
};

arranca();
</script>
</body></html>
