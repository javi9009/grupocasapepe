# 6-nov-2026 · Que el HTML llegue tal como se escribió.
#
# Un huésped mandó la captura: casapepe.mx/boleto, 404 de Netlify. «En la parte
# de Sincrético, para ver el mapa y mis boletos no nos deja avanzar».
#
# El escaparate se sirve por DOS puertas: grupocasapepe.netlify.app/sinc/ y
# casapepe.mx/sincretico/, que es la que se reparte a huéspedes y concierges.
# Por la segunda fallaban 8 de 8: las tres pestañas de abajo (Mapa, Boletos,
# Todas), la hoja de celular, el manifest, el icono y dos scripts. No era un
# enlace roto: era la navegación entera por su puerta principal.
#
# Y la causa no era la que parecía. En el código, Mapa y Todas ya estaban
# RELATIVOS y bien escritos. Lo que los rompía era este procesado de Netlify:
# «Pretty URLs» reescribe, en el HTML que sirve, cada href relativo .html por
# uno absoluto desde la raíz del sitio —«mapa.html» sale como «/sinc/mapa»—.
# Por la puerta de casapepe.mx eso apunta a un /sinc/ que allí no existe.
#
# Es la trampa de este fallo: mirar el fuente no lo enseña. El fuente está
# bien; el que lo cambia es el servidor, entre el repo y el navegador. Por eso
# relativizar a mano no arreglaba nada —lo deshacía otra vez— y por eso había
# que medir lo SERVIDO, no lo escrito.
#
# Apagarlo no cambia cómo se resuelven las direcciones: una URL sin extensión
# sigue abriendo su .html, y las ligas cortas de _redirects siguen igual. Lo
# único que deja de ocurrir es la reescritura de los enlaces dentro del HTML.
#
# Aquí no se declara `publish` ni `command` a propósito: los del panel de
# Netlify siguen mandando. Este archivo sólo apaga el procesado.

[build.processing.html]
  pretty_urls = false
