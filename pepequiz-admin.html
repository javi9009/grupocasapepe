<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PepeQuiz · Admin de preguntas</title>
<style>
  :root{--bg:#0f0d0a;--card:#1a1611;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--accent:#1d9e75;--bad:#b03434}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;font-size:14px}
  .wrap{max-width:920px;margin:0 auto;padding:18px}
  h1{font-size:20px;margin:0 0 2px} .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
  .chip{padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--muted);cursor:pointer;font-weight:600;font-size:13px}
  .chip.on{background:var(--gold);border-color:var(--gold);color:#1a1208}
  .chip .n{opacity:.7;font-weight:700;margin-left:6px}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:9px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:13px}
  .btn.sec{background:#2a2114;color:var(--gold);border:1px solid var(--line)}
  .q{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .q textarea,.q input,.q select{width:100%;background:#0e0c08;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit}
  .q textarea{resize:vertical;min-height:42px}
  .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:8px 0 3px}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .opt{display:flex;align-items:center;gap:6px}
  .opt input[type=radio]{width:auto}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>div{flex:1;min-width:120px}
  .qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
  .small{color:var(--muted);font-size:12px}
  .msg{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#13261d;border:1px solid #1d4d3a;color:#bfe8d4;padding:10px 16px;border-radius:10px;display:none;z-index:9}
  .pill{display:inline-block;background:#241c10;border:1px dashed #5a4422;color:#cdb079;font-size:11px;padding:2px 8px;border-radius:999px}
  .gate{max-width:420px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;text-align:center}
</style>
</head><body>
<div class="wrap">
  <h1>🧠 PepeQuiz · Admin de preguntas</h1>
  <div class="sub">Revisa, edita y comenta el banco de preguntas. Los comentarios nutren la skill de PepeQuiz.</div>
  <div id="gate" class="gate" style="display:none">Inicia sesión en el <b>Dashboard</b> (grupocasapepe) en esta misma ventana para poder guardar cambios. Puedes ver las preguntas, pero guardar requiere sesión.</div>
  <div class="cats" id="cats"></div>
  <div class="bar"><div class="small" id="count">—</div><button class="btn" id="addBtn">+ Nueva pregunta</button></div>
  <div id="list"></div>
</div>
<div class="msg" id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SBU='https://rehophywchakfapivsbh.supabase.co';
const SBK='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=supabase.createClient(SBU,SBK);
let CATS=[], CUR=null, COUNTS={};
const $=id=>document.getElementById(id);
function toast(t){ const m=$('msg'); m.textContent=t; m.style.display='block'; setTimeout(()=>m.style.display='none',2200); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session) $('gate').style.display='block';
  const {data:cats}=await sb.from('pq_categorias').select('*').order('orden');
  CATS=cats||[];
  // counts
  for(const c of CATS){ const {count}=await sb.from('pq_preguntas').select('*',{count:'exact',head:true}).eq('categoria_id',c.id); COUNTS[c.id]=count||0; }
  CUR=CATS[0]?CATS[0].id:null;
  renderCats(); render();
}
function renderCats(){
  $('cats').innerHTML=CATS.map(c=>`<div class="chip ${c.id===CUR?'on':''}" data-id="${c.id}">${c.emoji||''} ${esc(c.nombre)}<span class="n">${COUNTS[c.id]||0}</span></div>`).join('');
  document.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{ CUR=ch.dataset.id; renderCats(); render(); });
}
async function render(){
  const cat=CATS.find(c=>c.id===CUR); if(!cat){ $('list').innerHTML=''; return; }
  $('count').textContent=`${cat.nombre} · ${COUNTS[cat.id]||0} preguntas`+(cat.construccion?' · en construcción':'');
  $('list').innerHTML='Cargando…';
  const {data}=await sb.from('pq_preguntas').select('*').eq('categoria_id',CUR).order('fecha_alta',{ascending:true});
  const rows=data||[];
  if(!rows.length){ $('list').innerHTML='<div class="small">Sin preguntas todavía. Usa “+ Nueva pregunta”.</div>'; return; }
  $('list').innerHTML=rows.map(qCard).join('');
  wireCards();
}
function qCard(q){
  const o=Array.isArray(q.opciones)?q.opciones:JSON.parse(q.opciones||'["","","",""]');
  const opts=[0,1,2,3].map(i=>`<div class="opt"><input type="radio" name="c_${q.id}" value="${i}" ${q.correcta===i?'checked':''}><input data-f="opt${i}" value="${esc(o[i]||'')}"></div>`).join('');
  return `<div class="q" data-id="${q.id}">
    ${q.activa?'':'<span class="pill">inactiva</span>'}
    <div class="lbl">Pregunta</div><textarea data-f="enunciado">${esc(q.enunciado)}</textarea>
    <div class="lbl">Opciones (marca la correcta)</div><div class="opts">${opts}</div>
    <div class="row"><div><div class="lbl">Dificultad (1-3)</div><input data-f="dificultad" type="number" min="1" max="3" value="${q.dificultad||1}"></div>
      <div><div class="lbl">Fuente · texto del enlace</div><input data-f="fuente_label" value="${esc(q.fuente_label)}"></div></div>
    <div class="lbl">Fuente · URL (web o documento/SOP interno)</div><input data-f="fuente_url" value="${esc(q.fuente_url)}">
    <div class="lbl">Explicación (repaso post-Gym)</div><textarea data-f="explicacion">${esc(q.explicacion)}</textarea>
    <div class="lbl">💬 Comentario interno (nutre la skill)</div><textarea data-f="comentario">${esc(q.comentario)}</textarea>
    <div class="qfoot"><label class="small"><input type="checkbox" data-f="activa" ${q.activa?'checked':''}> activa</label>
      <button class="btn save" data-id="${q.id}">Guardar</button></div>
  </div>`;
}
function readCard(el){
  const get=f=>{ const n=el.querySelector(`[data-f="${f}"]`); return n?n.value:null; };
  const opciones=[0,1,2,3].map(i=>get('opt'+i)||'');
  const correctaEl=el.querySelector('input[type=radio]:checked');
  return {
    enunciado:get('enunciado'), opciones, correcta:correctaEl?Number(correctaEl.value):0,
    dificultad:Number(get('dificultad'))||1, fuente_label:get('fuente_label')||null,
    fuente_url:get('fuente_url')||null, explicacion:get('explicacion')||null,
    comentario:get('comentario')||null, activa:el.querySelector('[data-f="activa"]').checked
  };
}
function wireCards(){
  document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{
    const card=b.closest('.q'); const id=b.dataset.id; const patch=readCard(card);
    b.disabled=true; const t=b.textContent; b.textContent='Guardando…';
    const {error}=await sb.from('pq_preguntas').update(patch).eq('id',id);
    b.disabled=false; b.textContent=t;
    if(error){ toast('No se pudo guardar (¿sesión iniciada?)'); } else { toast('✓ Guardado'); }
  });
}
$('addBtn').onclick=async()=>{
  const {error}=await sb.from('pq_preguntas').insert({categoria_id:CUR,enunciado:'Nueva pregunta…',opciones:['','','',''],correcta:0,dificultad:1,activa:false});
  if(error){ toast('No se pudo crear (¿sesión iniciada?)'); return; }
  COUNTS[CUR]=(COUNTS[CUR]||0)+1; renderCats(); render(); toast('Pregunta creada (inactiva)');
};
boot();
</script>
</body></html>
