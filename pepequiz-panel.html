<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PepeQuiz · Panel</title>
<style>
  :root{--bg:#0f0d0a;--panel:#1a1611;--panel2:#221d16;--line:#34291c;--txt:#f3ead9;--muted:#a99a82;--gold:#d9a441;--gold2:#f0c674;--green:#5fae6b;--red:#cf6a5a;--blue:#6a93cf}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.45}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#15110b,#0f0d0a);border-bottom:1px solid var(--line);padding:12px 16px}
  .brand{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.brand h1{font-size:16px;margin:0;font-weight:600}
  .spacer{flex:1}.muted{color:var(--muted);font-size:12px}
  .rbtn{border:1px solid var(--line);background:var(--panel2);color:var(--gold2);border-radius:8px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
  .tabs{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
  .tab{padding:8px 14px;border-radius:9px 9px 0 0;background:transparent;border:1px solid transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:600}
  .tab.on{color:var(--gold2);background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel)}
  main{padding:14px 16px 60px;max-width:980px;margin:0 auto}
  main.full{max-width:none;padding:0}
  .sec{display:none}.sec.on{display:block}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:4px 0 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
  .card .lbl{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .card .big{font-size:26px;font-weight:700;color:var(--gold2);margin-top:2px;line-height:1.1}
  .card .sub{color:var(--muted);font-size:11.5px;margin-top:3px}
  .card .mini{height:5px;border-radius:4px;background:#2a2118;margin-top:8px;overflow:hidden}
  .card .mini i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
  h3{font-size:13px;color:var(--gold2);margin:18px 0 8px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .row{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;display:flex;align-items:center;gap:12px}
  .row .em{font-size:20px;width:26px;text-align:center}
  .row .nm{font-weight:600;min-width:120px}
  .row .bar{flex:1;height:9px;border-radius:6px;background:#2a2118;overflow:hidden;min-width:80px}
  .row .bar i{display:block;height:100%}
  .row .cnt{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);min-width:64px;text-align:right}
  .chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0}
  .chip.ok{color:#bfe6c4;border-color:#2f5a35}.chip.no{color:#e6bfbf;border-color:#5a2f2a}
  .chip.constr{color:var(--gold2);border-color:#5a431f;background:#2a200f}
  .puesto{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px;margin:9px 0}
  .puesto .pt{font-weight:600;font-size:14px;margin-bottom:7px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
  th{color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;font-weight:600}
  td.n{text-align:right;font-variant-numeric:tabular-nums}
  tr td .pos{display:inline-block;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%;background:#2a2118;color:var(--gold2);font-size:11px;font-weight:700;margin-right:6px}
  .empty{text-align:center;color:var(--muted);padding:40px;border:1px dashed var(--line);border-radius:12px;margin:10px 0}
  .note{color:var(--muted);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:9px 12px;margin:10px 0}
  #editorFrame{display:block;width:100%;height:calc(100vh - 96px);border:0;background:var(--bg)}
  .gate{position:fixed;inset:0;background:#0f0d0a;display:flex;align-items:center;justify-content:center;z-index:50}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:24px;max-width:320px;width:90%;text-align:center}
  .gate h2{color:var(--gold2);margin:0 0 10px}.gate input{width:100%;background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:10px;font-size:14px;margin-bottom:10px}
  .gate .err{color:var(--red);font-size:12px;min-height:14px}.gate button{width:100%;background:var(--gold);color:#1a1206;border:0;border-radius:9px;padding:10px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="gate" id="gate" style="display:none"><div class="box"><h2>🧠 PepeQuiz</h2><p class="muted">Inicia sesión.</p><input type="email" id="lemail" placeholder="correo"><input type="password" id="lpass" placeholder="contraseña"><div class="err" id="lerr"></div><button id="lbtn">Entrar</button></div></div>
<header>
  <div class="brand"><h1>🧠 PepeQuiz</h1><span class="muted">Academia · panel de control</span><span class="spacer"></span><button class="rbtn" id="refresh">↻ Actualizar</button><span class="muted" id="me"></span></div>
  <div class="tabs">
    <button class="tab on" data-s="resumen">Resumen</button>
    <button class="tab" data-s="contenido">Contenido</button>
    <button class="tab" data-s="onboarding">Onboarding por puesto</button>
    <button class="tab" data-s="ranking">Ranking</button>
  </div>
</header>
<main id="main">
  <section class="sec on" id="sec-resumen">
    <div class="cards" id="kpis"><div class="empty">Cargando…</div></div>
    <div class="note" id="resnote" style="display:none"></div>
    <h3>Cobertura del banco de preguntas <span class="muted" style="text-transform:none;font-weight:400">· meta 50 por categoría</span></h3>
    <div id="cobertura"><div class="empty">Cargando…</div></div>
  </section>
  <section class="sec" id="sec-contenido">
    <iframe id="editorFrame" title="Editor de preguntas" src="/pepequiz-admin.html"></iframe>
  </section>
  <section class="sec" id="sec-onboarding">
    <h3>Quizzes obligatorios por puesto</h3>
    <div id="onboarding"><div class="empty">Cargando…</div></div>
  </section>
  <section class="sec" id="sec-ranking">
    <h3>Ranking · histórico</h3>
    <div id="ranking"><div class="empty">Cargando…</div></div>
    <h3>Premios otorgados</h3>
    <div id="premios"><div class="empty">Cargando…</div></div>
  </section>
</main>
<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb=createClient('https://rehophywchakfapivsbh.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJlaG9waHl3Y2hha2ZhcGl2c2JoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzOTU3MDgsImV4cCI6MjA5Njk3MTcwOH0.kntapjLdn0jUr62pre6uqFaf2RPfun6-DujIkshVd8Y');
const META=50;
const $=id=>document.getElementById(id);
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nm=p=>{const n=(p&&p.nombre||'').trim();if(n&&!n.includes('@'))return n;const e=(p&&(p.email||p.nombre)||'').trim();return e?e.split('@')[0]:'—';};

document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));
  document.querySelectorAll('.sec').forEach(x=>x.classList.toggle('on',x.id==='sec-'+t.dataset.s));
  $('main').classList.toggle('full',t.dataset.s==='contenido');
});

async function cnt(tbl){try{const {count,error}=await sb.from(tbl).select('*',{count:'exact',head:true});return error?0:(count||0);}catch(e){return 0;}}

async function load(){
  let cats=[],preg=[],cart=[],profs=[],oblig=[],premios=[];
  try{cats=(await sb.from('pq_categorias').select('*').order('orden',{ascending:true})).data||[];}catch(e){}
  try{preg=(await sb.from('pq_preguntas').select('categoria_id,activa')).data||[];}catch(e){}
  try{cart=(await sb.from('pq_carteras').select('usuario_id,pts_mes,pts_historico,nivel')).data||[];}catch(e){}
  try{profs=(await sb.from('profiles').select('id,nombre,email')).data||[];}catch(e){}
  try{oblig=(await sb.from('pq_puesto_obligatorio').select('puesto,categoria_id')).data||[];}catch(e){}
  try{premios=(await sb.from('pq_premios').select('*').order('creado',{ascending:false})).data||[];}catch(e){}
  const [gym,retos,empleados]=await Promise.all([cnt('pq_gym_sesiones'),cnt('pq_retos'),cnt('employees')]);

  const pById={}; profs.forEach(p=>pById[p.id]=p);
  const cById={}; cats.forEach(c=>cById[c.id]=c);
  const pregCat={}; preg.forEach(q=>{if(q.activa!==false)pregCat[q.categoria_id]=(pregCat[q.categoria_id]||0)+1;});
  const totalAct=Object.values(pregCat).reduce((a,b)=>a+b,0);
  const conContenido=cats.filter(c=>(pregCat[c.id]||0)>0).length;
  const activosMes=cart.filter(c=>(c.pts_mes||0)>0).length;
  const metaTotal=cats.length*META;

  // KPIs
  const pct=metaTotal?Math.round(totalAct/metaTotal*100):0;
  $('kpis').innerHTML=[
    ['Preguntas activas',totalAct,`de ${metaTotal} meta (${pct}%)`,pct],
    ['Categorías con contenido',`${conContenido} / ${cats.length}`,'banco listo para jugar',cats.length?Math.round(conContenido/cats.length*100):0],
    ['Empleados',empleados,`${cart.length} con cartera PepeQuiz`,empleados?Math.round(cart.length/empleados*100):0],
    ['Activos este mes',activosMes,'con puntos en el mes',null],
    ['Sesiones de Gym',gym,'entrenamientos jugados',null],
    ['Retos',retos,'duelos lanzados',null],
  ].map(([l,v,s,bar])=>`<div class="card"><div class="lbl">${l}</div><div class="big">${esc(v)}</div><div class="sub">${esc(s)}</div>${bar==null?'':`<div class="mini"><i style="width:${Math.min(100,bar)}%"></i></div>`}</div>`).join('');
  const falt=cats.length-conContenido;
  $('resnote').style.display='block';
  $('resnote').innerHTML=falt>0
    ?`📌 <b>Contenido:</b> faltan <b>${falt}</b> categoría(s) por llenar (~${falt*META} preguntas). Edítalas en la pestaña <b>Contenido</b>.`
    :`✅ Las ${cats.length} categorías tienen contenido.`;

  // Cobertura
  $('cobertura').innerHTML = cats.length? cats.map(c=>{
    const q=pregCat[c.id]||0, w=Math.min(100,Math.round(q/META*100)), col=c.color||'#d9a441';
    const badge=q>=META?'<span class="chip ok">completa</span>':(c.construccion?'<span class="chip constr">en construcción</span>':(q>0?'<span class="chip">parcial</span>':'<span class="chip no">vacía</span>'));
    return `<div class="row"><span class="em">${esc(c.emoji||'•')}</span><span class="nm">${esc(c.nombre)}</span><span class="bar"><i style="width:${w}%;background:${esc(col)}"></i></span><span class="cnt">${q} / ${META}</span><span>${badge}</span></div>`;
  }).join('') : '<div class="empty">Sin categorías.</div>';

  // Onboarding
  const byP={}; oblig.forEach(o=>{(byP[o.puesto]=byP[o.puesto]||[]).push(o.categoria_id);});
  const puestos=Object.keys(byP).sort();
  $('onboarding').innerHTML = puestos.length? puestos.map(p=>{
    const chips=byP[p].map(cid=>{const c=cById[cid];const q=pregCat[cid]||0;const lab=esc((c&&c.emoji?c.emoji+' ':'')+(c?c.nombre:cid));return q>0?`<span class="chip ok">${lab}</span>`:`<span class="chip no">${lab} · sin contenido</span>`;}).join('');
    return `<div class="puesto"><div class="pt">${esc(p)}</div>${chips}</div>`;
  }).join('')+`<div class="note">Los quizzes <span class="chip no" style="margin:0">en rojo</span> aún no tienen preguntas: ese puesto no podrá completar su onboarding obligatorio hasta llenarlas.</div>` : '<div class="empty">Sin obligatorios configurados.</div>';

  // Ranking
  const rk=[...cart].sort((a,b)=>(b.pts_historico||0)-(a.pts_historico||0)).slice(0,15);
  const anyPts=rk.some(r=>(r.pts_historico||0)>0||(r.pts_mes||0)>0);
  $('ranking').innerHTML = !rk.length?'<div class="empty">Sin carteras todavía.</div>':
    (anyPts?'':'<div class="note">Aún no hay puntos registrados — el ranking se llenará cuando el equipo empiece a jugar Gym y Retos.</div>')+
    `<table><thead><tr><th>#</th><th>Colaborador</th><th class="n">Nivel</th><th class="n">Pts mes</th><th class="n">Pts histórico</th></tr></thead><tbody>`+
    rk.map((r,i)=>`<tr><td><span class="pos">${i+1}</span></td><td>${esc(nm(pById[r.usuario_id]))}</td><td class="n">${r.nivel||1}</td><td class="n">${r.pts_mes||0}</td><td class="n">${r.pts_historico||0}</td></tr>`).join('')+`</tbody></table>`;

  // Premios
  $('premios').innerHTML = premios.length?
    `<table><thead><tr><th>Periodo</th><th>Alcance</th><th class="n">Pos.</th><th>Premio</th><th>Colaborador</th></tr></thead><tbody>`+
    premios.map(p=>`<tr><td>${esc(p.periodo||'—')}</td><td>${esc(p.alcance||'—')}</td><td class="n">${p.posicion||'—'}</td><td>${esc(p.descripcion||'—')}</td><td>${esc(nm(pById[p.usuario_id]))}</td></tr>`).join('')+`</tbody></table>`
    : '<div class="empty">Sin premios otorgados. (Modelo de premios pendiente de definir.)</div>';
}

async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  const email=(session&&session.user&&session.user.email||'').toLowerCase();
  if(!email){$('gate').style.display='flex';return;}
  $('me').textContent=email;$('gate').style.display='none';
  load();
}
$('refresh').onclick=()=>{document.querySelectorAll('main .empty').forEach(e=>e.textContent='Cargando…');load();const f=$('editorFrame');if(f)f.src=f.src;};
$('lbtn').onclick=async()=>{$('lerr').textContent='';const {error}=await sb.auth.signInWithPassword({email:$('lemail').value.trim(),password:$('lpass').value});if(error){$('lerr').textContent=error.message;return;}boot();};
boot();
</script>
</body>
</html>
