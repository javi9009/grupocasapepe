<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Tu acceso · Sincrético</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Lobster+Two:ital@1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --papel:#FAF7F2; --tinta:#221D18; --tinta-2:#5A514A; --gris:#8A8078;
  --naranja:#F2682A; --magenta:#E2188E; --linea:#E6DED4; --blanco:#fff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--papel);color:var(--tinta);
  font-family:Inter,system-ui,sans-serif;font-size:15px;line-height:1.6}
.barra{background:var(--blanco);border-bottom:1px solid var(--linea);padding:14px 18px;
  display:flex;align-items:center;gap:10px}
.barra h1{font-family:Oswald,sans-serif;font-size:19px;letter-spacing:.02em;margin:0;text-transform:uppercase}
.barra .lema{font-family:'Lobster Two',cursive;font-style:italic;color:var(--gris);font-size:14px}
.tira{height:4px;background:linear-gradient(90deg,var(--naranja) 0 22%,var(--magenta) 22% 50%,#F6B8D8 50% 74%,#8FC7E8 74% 100%)}
main{max-width:460px;margin:0 auto;padding:26px 18px 80px}
.caja{background:var(--blanco);border:1px solid var(--linea);border-radius:16px;padding:24px;
  box-shadow:0 1px 2px rgba(0,0,0,.03)}
h2{font-family:Oswald,sans-serif;font-size:22px;text-transform:uppercase;letter-spacing:.02em;margin:0 0 4px}
p.intro{color:var(--tinta-2);font-size:14.5px;margin:0 0 18px}
.codigo{display:inline-block;background:#FFF3EC;border:1px solid #F7CDB6;border-radius:9px;
  padding:5px 11px;font-weight:700;letter-spacing:.06em;font-size:14px}
label{display:block;font-size:12px;font-weight:600;color:var(--tinta-2);margin:14px 0 4px}
input{width:100%;padding:11px 12px;border:1px solid var(--linea);border-radius:10px;
  font:inherit;font-size:15px;background:var(--papel);color:var(--tinta)}
input:focus{outline:2px solid var(--naranja);outline-offset:-1px;border-color:transparent}
.ayuda{font-size:12.5px;color:var(--gris);margin-top:4px}
button{width:100%;margin-top:18px;background:var(--naranja);color:#fff;border:0;border-radius:12px;
  padding:14px;font:inherit;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.aviso{border-radius:11px;padding:12px 14px;font-size:14px;margin-bottom:16px}
.aviso.mal{background:#FDECEC;border:1px solid #F3C4C4;color:#8D2222}
.aviso.ok{background:#EAF7EF;border:1px solid #BFE4CD;color:#1F5D38}
.cargando{text-align:center;padding:50px 20px;color:var(--gris)}
</style>
</head>
<body>

<header class="barra">
  <h1>Sincrético</h1><span class="lema">How to be a Mexican?</span>
</header>
<div class="tira"></div>

<main>
  <div id="avisos"></div>
  <div id="cuerpo" class="cargando">Abriendo tu liga…</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  var SB='https://rehophywchakfapivsbh.supabase.co';
  var KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
  var FN=SB+'/functions/v1/hotel-colaborador';
  var $=function(i){return document.getElementById(i);};
  var TOKEN=new URLSearchParams(location.search).get('t')||'';
  var YO=null;

  function esc(s){return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function avisa(clase,html){$('avisos').innerHTML='<div class="aviso '+clase+'">'+html+'</div>';}

  async function llama(cuerpo){
    var r=await fetch(FN,{method:'POST',
      headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json'},
      body:JSON.stringify(cuerpo)});
    var j=await r.json().catch(function(){return {};});
    if(!r.ok||j.error)throw new Error(j.error||('No se pudo (HTTP '+r.status+')'));
    return j;
  }

  function pinta(){
    $('cuerpo').className='caja';
    $('cuerpo').innerHTML=
      '<h2>Hola, '+esc(String(YO.nombre).split(' ')[0])+'</h2>'+
      '<p class="intro">Ponte una contraseña y entras a vender.'+
        (YO.hotel?' Quedas dado de alta en <b>'+esc(YO.hotel)+'</b>.':'')+'</p>'+
      (YO.codigo_venta
        ? '<p style="margin:0 0 6px;font-size:13.5px;color:var(--tinta-2)">Tu código de venta:</p>'+
          '<span class="codigo">'+esc(YO.codigo_venta)+'</span>'+
          '<p class="ayuda" style="margin-top:8px">Va dentro de tu QR. Cuando un huésped lo escanea y '+
          'compra, esa venta es tuya aunque la pague más tarde.</p>'
        : '')+
      '<label for="p1">Tu contraseña</label><input id="p1" type="password" autocomplete="new-password">'+
      '<div class="ayuda">Mínimo 8 caracteres.</div>'+
      '<label for="p2">Repítela</label><input id="p2" type="password" autocomplete="new-password">'+
      '<button id="btn">Entrar</button>'+
      '<p class="ayuda" style="margin-top:12px">Tu cuenta queda a nombre de '+esc(YO.email)+'.</p>';
    $('btn').onclick=guarda;
    $('p2').addEventListener('keydown',function(e){if(e.key==='Enter')guarda();});
    $('p1').focus();
  }

  async function guarda(){
    var a=$('p1').value, b=$('p2').value, btn=$('btn');
    if(a.length<8){avisa('mal','La contraseña necesita al menos 8 caracteres.');return;}
    if(a!==b){avisa('mal','Las dos contraseñas no son iguales.');return;}
    btn.disabled=true; btn.textContent='Creando tu cuenta…';
    try{
      var j=await llama({accion:'password',token:TOKEN,password:a});
      /* Se inicia sesión con la librería, no a mano: así queda guardada donde
         la pantalla del concierge la busca, y se renueva sola. */
      var cli=supabase.createClient(SB,KEY);
      var s=await cli.auth.signInWithPassword({email:j.email,password:a});
      if(s.error)throw new Error(s.error.message);
      avisa('ok','Listo. Te llevamos a tu pantalla…');
      setTimeout(function(){location.href='/concierge';},700);
    }catch(e){
      avisa('mal','No se pudo: '+esc(e.message));
      btn.disabled=false; btn.textContent='Entrar';
    }
  }

  (async function(){
    if(!TOKEN){
      $('cuerpo').className=''; $('cuerpo').innerHTML='';
      avisa('mal','Esta liga está incompleta. Abre la que te llegó por correo, entera.');
      return;
    }
    try{
      YO=await llama({accion:'ver',token:TOKEN});
      if(YO.ya_usada){
        $('cuerpo').className=''; $('cuerpo').innerHTML='';
        avisa('ok','Esa liga ya se usó. Entra con tu contraseña en '+
          '<a href="/entrar.html">grupocasapepe.netlify.app/entrar</a>.');
        return;
      }
      pinta();
    }catch(e){
      $('cuerpo').className=''; $('cuerpo').innerHTML='';
      avisa('mal',esc(e.message));
    }
  })();
})();
</script>
</body>
</html>
