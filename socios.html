<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Pepe · Socios</title>
<meta name="theme-color" content="#AD8F93">
<link rel="icon" type="image/png" href="/dash-192.png">
<link rel="apple-touch-icon" href="/dash-192.png">
<style>
:root{
  --ground:#FDFBF8; --surface:#FFFFFF; --arena:#D1B9A9; --crema:#F0E7DD;
  --soc:#AD8F93; --soc-txt:#906A6F; --tinta:#3D0001;
  --muted:#6B6459; --rule:#E7DED4;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--ground);color:var(--tinta);
  font:15px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:20px}
.card{background:var(--surface);border:1px solid var(--rule);border-top:4px solid var(--soc);
  border-radius:16px;padding:28px 26px;width:380px;max-width:94vw;
  box-shadow:0 12px 34px rgba(61,0,1,.07)}
.logo{width:120px;display:block;margin:0 auto 16px}
h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:25px;
  margin:0 0 4px;text-align:center;letter-spacing:-.01em}
.s{text-align:center;color:var(--muted);font-size:13.5px;margin:0 0 20px}
label{display:block;font-size:12px;font-weight:700;color:var(--soc-txt);margin:12px 0 5px}
input{width:100%;padding:11px 12px;border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);color:var(--tinta);font:inherit;font-size:15px}
input:focus{outline:2px solid var(--soc);outline-offset:1px}
.btn{width:100%;margin-top:18px;padding:12px;border:0;border-radius:10px;background:var(--soc);
  color:#fff;font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55;cursor:default}
.err{display:none;margin-top:12px;background:#F5ECEC;border:1px solid #E0C9C9;color:#8A2F2F;
  border-radius:9px;padding:9px 11px;font-size:13.5px}
.err.on{display:block}
.pie{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
.pie a{color:var(--soc-txt);font-weight:600}
</style>
</head><body>

<div class="card">
  <img class="logo" src="/img/portales/socios.png" alt="Casa Pepe">
  <h1>Socios</h1>
  <p class="s">Accionistas de HBR, El Pontigu y Struchture.</p>

  <label for="email">Correo</label>
  <input id="email" type="email" autocomplete="username" placeholder="tu@correo.com">

  <label for="pass">Contraseña</label>
  <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••">

  <button class="btn" id="btn">Entrar</button>
  <div class="err" id="err"></div>

  <div id="extras"></div>

  <p class="pie">Lo que ves aquí es información reservada del Grupo.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/puerta.js"></script>
<script>
const SB_URL='https://rehophywchakfapivsbh.supabase.co';
const SB_KEY='sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const $=id=>document.getElementById(id);

function mal(t){ const e=$('err'); e.innerHTML=t; e.className='err on'; }

/* Quien ya tiene sesion no tiene que volver a entrar: su panel es el del
   Grupo, que se pinta con los colores de Socios al reconocer su portal. */
(async function(){
  try{
    const {data:{session}}=await sb.auth.getSession();
    if(session){ location.replace('/'); return; }
  }catch(e){}
  CPPuerta.extras({el:'extras', portal:'socios', sb:sb, url:SB_URL, key:SB_KEY});
})();

$('btn').onclick=async function(){
  const email=$('email').value.trim().toLowerCase(), pass=$('pass').value;
  if(!email||!pass){ mal('Pon tu correo y tu contraseña.'); return; }
  $('err').className='err'; this.disabled=true; this.textContent='Entrando…';
  const {error}=await sb.auth.signInWithPassword({email,password:pass});
  if(error){
    this.disabled=false; this.textContent='Entrar';
    mal('No pudimos entrar con esos datos. Si es tu primera vez, usa '
        +'<a href="#" id="liga-rec">¿Olvidaste tu contraseña?</a> y te llega el enlace.');
    const l=document.getElementById('liga-rec');
    if(l) l.onclick=(ev)=>{ ev.preventDefault(); const r=document.querySelector('.cpp-x [data-rec]'); if(r) r.click(); };
    return;
  }
  location.href='/';
};
$('pass').addEventListener('keydown',e=>{ if(e.key==='Enter') $('btn').click(); });
</script>
</body></html>
