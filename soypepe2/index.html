<style>
/* SoyPepe v2 — APP APARTE. No toca /soypepe/ ni su service worker. Javi, 22-nov-2026:
   «ejecútalos en una aplicación aparte para no afectar lo que ya tenemos».
   Primeras dos pantallas: portada de Mi Casa Pepe y el detalle de Mi desempeño. */
:root{
  --ground:#F4F1EA; --surface:#fff; --surface-2:#FBF8F1; --ink:#1F1B16; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E6E0D3; --dark:#16241D; --dark-2:#22342B; --accent:#137A56; --accent-2:#1F9E75; --lime:#C9DA3C;
  --c1:#1F5E3F; --c2:#2F6DB5; --c3:#C0552F; --c4:#6C4FA1; --c5:#D9A21B;
  --ok:#137A56; --warn:#D9A21B; --bad:#C0452F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;background:var(--ground)}
.top{background:var(--dark);color:#F4F1EA;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 22px 22px}
.hello{display:flex;align-items:center;gap:10px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--dark-2);display:grid;place-items:center;font-weight:800}
.hello small{display:block;font-size:.72rem;opacity:.7;text-transform:capitalize}
.hello b{color:#E9C46A}
.sede{margin-left:auto;background:#F4F1EA;color:var(--ink);border-radius:9px;padding:6px 10px;font-size:.78rem;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--dark-2);border-radius:999px;padding:4px;margin:14px 0 12px}
.tabs button{flex:1;border:0;background:none;color:#cfd8d2;border-radius:999px;padding:7px 4px;font-size:.78rem;font-weight:600;white-space:nowrap}
.tabs button.on{background:#F4F1EA;color:var(--ink)}
.dcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #33483d;background:var(--dark-2);border-radius:16px;padding:12px 14px;color:#F4F1EA}
.dcard h3{margin:0;font-size:1rem}
.dcard p{margin:2px 0 0;font-size:.76rem;opacity:.82;line-height:1.35}
.dcard .chev{margin-left:auto;font-size:1.3rem;opacity:.7}
main{padding:14px 14px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:12px}
.com{background:linear-gradient(180deg,#FBE3D6,#FDF1EA);border-color:#F3CDB9}
.rowh{display:flex;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1rem;flex:none}
.rowh h4{margin:0;font-size:.95rem}
.rowh small{display:block;color:var(--muted);font-size:.74rem}
.days{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.day{flex:0 0 46%;background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:9px 10px;text-align:left}
.day.hoy{border-color:var(--accent)}
.day .d{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .pl{font-weight:700;font-size:.92rem;margin:1px 0}
.day .n{font-size:.72rem;color:var(--muted)}
.day .ap{margin-top:6px;width:100%;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:5px;font-size:.76rem;font-weight:700}
.day .ap.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:13px;text-align:left}
.tile h4{margin:9px 0 1px;font-size:.95rem}
.tile b{font-size:.8rem}
.tile small{display:block;color:var(--muted);font-size:.72rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec button{border:0;background:none;color:var(--accent);font-weight:700;font-size:.78rem;text-transform:none;letter-spacing:0}
.bono{background:#FBF4DC;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:.82rem}
.bono.sp{background:#EAF4EE}
.bono small{display:block;color:var(--muted);font-size:.72rem}
.track{display:flex;align-items:center;gap:6px;margin:12px 0 8px}

.track .n.sig{background:#FBF4DC;color:#8A6A0A;border:1px solid var(--c5)}
.track i{flex:1;height:2px;background:var(--rule)}
.pb{height:8px;border-radius:5px;background:#E8E2D5;overflow:hidden;position:relative}
.pb>i{display:block;height:100%;border-radius:5px}
.pb>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:90%}

.bot a{flex:1;text-align:center;font-size:.66rem;color:var(--muted);text-decoration:none}
.bot a span{display:block;font-size:1.05rem;line-height:1.3}
.bot a.on{color:var(--accent);font-weight:700}
.bot a.go span{width:46px;height:46px;border-radius:50%;background:var(--accent-2);color:#fff;display:grid;place-items:center;margin:-22px auto 2px;font-size:1.25rem;box-shadow:0 4px 12px rgba(19,122,86,.35)}
.bot a.go{color:var(--ink);font-weight:700}
/* detalle */
#det{background:var(--ground);min-height:100vh}
.dtop{background:var(--dark);color:#F4F1EA;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.dtop button{border:0;background:var(--dark-2);color:#F4F1EA;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700}
.dtop span{font-size:.78rem;opacity:.75;margin-left:auto}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.five button{border:0;border-radius:10px;padding:8px 2px;color:#fff;text-align:center}
.five b{display:block;font-size:.95rem}
.five small{display:block;font-size:.56rem;opacity:.9;line-height:1.15}
.act{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:.84rem}
.act:first-child{border-top:0}
.act small{display:block;color:var(--muted);font-size:.72rem}
.act button{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700;flex:none}
.crit{background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:10px;overflow:hidden}
.crit>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.crit .num{width:34px;height:34px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.crit h4{margin:0;font-size:.95rem}
.crit .v{margin-left:auto;font-weight:800;font-size:.9rem;white-space:nowrap}
.crit .v small{color:var(--faint);font-weight:600}
.crit .mini{padding:0 14px 12px}
.crit .body{display:none;padding:2px 14px 14px;border-top:1px solid var(--rule)}
.crit.open .body{display:block}
.lbl{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.obj{background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:.84rem}
.obj small{display:block;color:var(--muted);font-size:.7rem;margin-top:3px}
.li{font-size:.82rem;padding:3px 0}
.note{background:#FBF4DC;border:1px solid #e3d3a8;border-radius:10px;padding:10px 12px;font-size:.8rem;line-height:1.4;margin-top:8px}
.niv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.niv div{border-radius:10px;padding:8px;background:#EFE9DD;border:1.5px solid transparent}
.niv div.cur{background:var(--accent);color:#fff}
.niv div.sig{background:#FBF4DC;border-color:var(--c5)}
.niv small{display:block;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.niv b{font-size:.92rem}
.bars{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:74px;margin-top:10px}
.bars i{display:block;border-radius:3px 3px 0 0;min-height:3px}
.bars i.vac{background:#E8E2D5;height:3px}
.bars u{position:absolute;left:0;right:0;bottom:90%;border-top:1.5px dotted var(--accent);opacity:.6}
.blbl{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:.56rem;text-align:center;color:var(--muted);margin-top:3px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.86rem}
.btn.out{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost{background:none;color:var(--muted);border:1px dashed var(--rule);font-weight:600;font-size:.78rem;width:100%;margin-top:10px}
/* hojas */
.sheet{position:fixed;inset:0;background:rgba(22,36,29,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--ground);width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.full .in{height:100vh;max-height:100vh;border-radius:0}
.sheet .h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule);background:#fff}
.sheet .h b{font-size:.98rem}
.sheet .h button{margin-left:auto;border:0;background:#EFE9DD;border-radius:999px;width:32px;height:32px;font-size:1.05rem}
.sheet .b{padding:14px;overflow:auto;flex:1}
.sheet iframe{border:0;width:100%;height:100%;flex:1;background:#fff}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.faint{color:var(--faint)} .muted{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:700;border:1px solid currentColor}
.center{padding:60px 24px;text-align:center;color:var(--muted)}
.beta{background:#FBF4DC;color:#6E540A;font-size:.7rem;text-align:center;padding:5px 8px}
</style>
</head>
<body>
<div id="app"><div class="center">Cargando…</div></div>
<div class="sheet" id="sheet"><div class="in"><div class="h"><b id="shT"></b><button id="shX" aria-label="Cerrar">×</button></div><div class="b" id="shB"></div></div></div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const sb = createClient('https://rehophywchakfapivsbh.supabase.co','sb_publishable_BUSblqsDsVEokJr6yK8GIg_N34bGVWO',
  { auth:{ flowType:'implicit', detectSessionInUrl:true, persistSession:true, autoRefreshToken:true } });
const VIVA='/soypepe/';                                    // la app actual: ahí siguen checador, chat, concierge y juegos
const CDMX_PROP='45e69775-d877-4507-a9e1-a45bd3400dc5', ATENEO_PROP='3e10a9ea-4913-4f7c-86ef-0c829caa851d';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mxn=n=>n==null?'—':'$'+Number(n).toLocaleString('es-MX',{maximumFractionDigits:0});
const mxToday=()=>new Date(new Date().toLocaleString('en-US',{timeZone:'America/Mexico_City'}));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const col=v=>v>=90?'var(--ok)':(v>=70?'var(--warn)':'var(--bad)');
const MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'], DIA=['dom','lun','mar','mié','jue','vie','sáb'];
const CRIT=[['puntualidad','Puntualidad','--c1'],['actitud','Trabajo en equipo','--c2'],['desempeno','Productividad','--c3'],['conocimiento','Conocimiento del puesto','--c4'],['discurso','Discurso de Casa Pepe','--c5']];
const NIV={practicas:'Prácticas',junior:'N1',junior2:'N2',senior:'N3'};
let D=null, LEC=[], GUIA={}, DET={}, open={};

/* ---------- datos derivados ---------- */
const cr=k=>{const c=(D.pila.criterios||{})[k]||{}; const v=c.valor_20??c.valor; return {v:v==null?0:Number(v), det:c.detalle||{}, sinDato:(v==null)};};
const score=()=>{const p=Number(D.pila.posibles)||100; return Math.round((Number(D.pila.puntos)||0)/p*100);};
function flojo(){let low=null; CRIT.forEach(([k,n])=>{const v=cr(k).v; if(!low||v<low.v)low={k,n,v};}); return low;}
/* Tests: cada uno con su enlace EXACTO (Javi, 22-nov-2026: «un link al test exacto, no al procedimiento»). */
const QZ=c=>'/m/pepequiz.html?cat='+encodeURIComponent(c.cat);
const DOC=x=>'/soypepe/leer.html?doc='+encodeURIComponent(x.documento_id);
const tPuesto=()=>((DET.test_puesto&&DET.test_puesto.length?DET.test_puesto:DET.conocimiento)||[]).filter(c=>c.banco);
const tDisc=()=>((DET.discurso&&DET.discurso.length?DET.discurso:DET.discurso_base)||[]).filter(c=>c.banco);
const hecho=c=>Number(c.contestadas??c.acertadas??0);
function filaTest(c,color){const h=hecho(c), b=Number(c.banco)||0, p=b?Math.min(100,Math.round(h/b*100)):0;
  return `<div class="obj"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="min-width:0"><b>${esc((c.emoji?c.emoji+' ':'')+c.nombre)}</b><small>${c.contestadas!=null?('Respondidas <b>'+h+' de '+b+'</b> preguntas · acertadas '+(c.acertadas||0)):('Acertadas <b>'+h+' de '+b+'</b> preguntas')}</small></div>${c.cat?`<button class="btn" style="padding:7px 11px;font-size:.78rem;flex:none" data-url="${esc(QZ(c))}" data-t="${esc(c.nombre)}">${h>0?(h>=b?'Repasar':'Seguir test'):'Empezar test'}</button>`:''}</div><div class="pb" style="height:6px;margin-top:6px"><i style="width:${p}%;background:${color}"></i></div></div>`;}
function totalTests(L){const h=L.reduce((a,c)=>a+hecho(c),0), b=L.reduce((a,c)=>a+(Number(c.banco)||0),0); return {h,b};}
function tip(k){
  if(k==='conocimiento'){const t=tPuesto().slice().sort((a,b)=>hecho(a)/a.banco-hecho(b)/b.banco)[0]; if(t)return 'el test de '+t.nombre;}
  if(k==='conocimiento')return GUIA.conocimiento?('el test de '+String(GUIA.conocimiento).split(',')[0].replace(/^[^\wÁÉÍÓÚáéíóúñÑ]+/,'').trim()):'los tests de tu puesto';
  return {puntualidad:'llegar a tiempo a cada turno',actitud:'que tu jefe y tus compañeros te valoren',desempeno:'los objetivos de tu puesto',discurso:'el test de Discurso Casa Pepe'}[k];
}
function ciclo(){
  const hoy=mxToday(), hY=hoy.getFullYear(), hM=hoy.getMonth(); let sY=hY,sM=hM,total=1;
  if(D.emp.ciclo_desde){const d=new Date(String(D.emp.ciclo_desde).slice(0,10)+'T12:00:00'); if(!isNaN(d)){total=Math.max(1,(hY-d.getFullYear())*12+(hM-d.getMonth())+1); const s=new Date(d.getFullYear(),d.getMonth()+Math.floor((total-1)/12)*12,1); sY=s.getFullYear(); sM=s.getMonth();}}
  const H={}; (D.meses||[]).forEach(m=>H[m.mes]=Number(m.pct));
  const slots=[]; for(let i=0;i<12;i++){const d=new Date(sY,sM+i,1), key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); slots.push({lbl:MES[d.getMonth()],v:H[key]??null,fut:(d.getFullYear()>hY||(d.getFullYear()===hY&&d.getMonth()>hM))});}
  const med=slots.filter(s=>s.v!=null), fut=slots.filter(s=>s.fut).length, sum=med.reduce((a,s)=>a+s.v,0);
  const prom=med.length?Math.round(sum/med.length*10)/10:null;
  const nec=(med.length&&fut)?Math.ceil((90*(med.length+fut)-sum)/fut):null;
  return {slots,prom,fut,nec,enCiclo:((total-1)%12)+1};
}
function niveles(){const g=D.niveles||{}, t=D.emp.tramo; const ks=['practicas','junior','junior2','senior'].filter(k=>g[k]!=null&&(k!=='practicas'||t==='practicas')); const i=ks.indexOf(t); return {ks,i,g,sig:(i>-1&&i<ks.length-1)?ks[i+1]:null};}
function ring(v,size,dark){const R=size/2-6,C=2*Math.PI*R,p=Math.max(0,Math.min(100,v));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${dark?'#33483d':'#E8E2D5'}" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${dark?'var(--lime)':col(v)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.3}" font-weight="800" fill="${dark?'#F4F1EA':'#1F1B16'}">${v}</text></svg>`;}

/* anillo y barra de evolución a color: cada punto con su color, en el mismo orden siempre */
function ringSeg(size){const R=size/2-7,C=2*Math.PI*R; let a=0;
  const arcs=CRIT.map(([k,,v])=>{const l=C*Math.max(0,Math.min(20,cr(k).v))/100; const h=l>0?`<circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="var(${v})" stroke-width="8" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-a}" transform="rotate(-90 ${size/2} ${size/2})"/>`:''; a+=l; return h;}).join('');
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#E8E2D5" stroke-width="8"/>${arcs}<text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.3}" font-weight="800" fill="#1F1B16">${score()}</text></svg>`;}
function pilaBar(){return `<div style="position:relative;margin-top:10px"><div style="display:flex;height:12px;border-radius:6px;overflow:hidden;background:#E8E2D5">${CRIT.map(([k,n,v])=>`<i title="${esc(n)}: ${cr(k).v}/20" style="display:block;width:${Math.max(0,Math.min(20,cr(k).v))}%;background:var(${v})"></i>`).join('')}</div><u style="position:absolute;top:-3px;bottom:-3px;left:90%;width:2px;background:var(--ink)"></u><div style="display:flex;justify-content:space-between;font-size:.66rem;color:var(--muted);margin-top:4px"><span>0</span><span>meta 90 ▲</span></div></div>`;}

/* ---------- hojas ---------- */
function sheet(t,html,full){$('shT').textContent=t; $('shB').innerHTML=html; $('shB').style.padding=''; $('sheet').classList.toggle('full',!!full); $('sheet').classList.add('on');}
function frame(t,url){sheet(t,'',true); const b=$('shB'); b.style.padding='0'; b.innerHTML='<iframe src="'+esc(url)+'" title="'+esc(t)+'"></iframe>';}
$('shX').onclick=()=>{$('sheet').classList.remove('on'); $('shB').innerHTML='';};
$('sheet').addEventListener('click',e=>{if(e.target===$('sheet'))$('shX').onclick();});
async function pedir(tipo,texto,btn){ if(btn){btn.disabled=true;btn.textContent='Enviando…';}
  try{const r=await sb.rpc('sp2_solicitar',{p_tipo:tipo,p_texto:texto}); const d=r.data||{}; if(r.error||!d.ok)throw 0;
      if(btn)btn.textContent=d.ya?'Ya la habías enviado':'✓ Solicitud enviada'; return true;}
  catch(_){ if(btn){btn.disabled=false;btn.textContent='No se pudo enviar. Reintentar';} return false; } }

/* ---------- portada: Mi Casa Pepe ---------- */
function home(){
  const hoy=mxToday(), s=score(), lo=flojo(), c=ciclo(), nv=niveles();

/* ---------- resúmenes de los cuatro accesos ---------- */
async function comidas(){
  const box=$('days'); if(!box)return; const prop=(D.emp.property_id===ATENEO_PROP||!D.emp.property_id)?CDMX_PROP:D.emp.property_id;
  const hoy=mxToday(), keys=[]; for(let i=0;i<7;i++){const d=new Date(hoy.getTime()+i*864e5); keys.push(iso(d));}
  let menu={},mine={},votos={};
  try{(await sb.from('comidas_menu').select('fecha,platillo').eq('property_id',prop).in('fecha',keys)).data?.forEach(m=>menu[m.fecha]=m.platillo||'');}catch(_){}
  try{(await sb.from('comida_inscripciones').select('fecha,apuntado').eq('property_id',prop).eq('employee_id',D.emp.id).in('fecha',keys)).data?.forEach(x=>mine[x.fecha]=!!x.apuntado);}catch(_){}
  try{(await sb.from('comida_inscripciones').select('fecha').eq('property_id',prop).eq('apuntado',true).in('fecha',keys)).data?.forEach(x=>votos[x.fecha]=(votos[x.fecha]||0)+1);}catch(_){}
  const h=keys.filter(k=>menu[k]).map(k=>{const d=new Date(k+'T12:00:00'); return `<div class="day${k===keys[0]?' hoy':''}"><div class="d">${DIA[d.getDay()]} ${d.getDate()}${k===keys[0]?' · hoy':''}</div><div class="pl">${esc(menu[k])}</div><div class="n"><b data-n="${k}">${votos[k]||0}</b> apuntados</div><button class="ap${mine[k]?' on':''}" data-f="${k}">${mine[k]?'Apuntado ✓':'Apuntarme'}</button></div>`;}).join('');
  box.innerHTML=h||'<span class="faint" style="font-size:.8rem">No hay menú cargado para los próximos días.</span>';
  box.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const f=b.dataset.f, next=!b.classList.contains('on'); b.disabled=true;
    try{const r=await sb.from('comida_inscripciones').upsert({property_id:prop,fecha:f,employee_id:D.emp.id,nombre_display:D.emp.nombre,apuntado:next,updated_at:new Date().toISOString()},{onConflict:'property_id,fecha,employee_id'}); if(r.error)throw r.error;
      b.classList.toggle('on',next); b.textContent=next?'Apuntado ✓':'Apuntarme'; const n=box.querySelector('[data-n="'+f+'"]'); if(n)n.textContent=Math.max(0,Number(n.textContent)+(next?1:-1));}
    catch(_){alert('No se pudo guardar. Inténtalo de nuevo.');} b.disabled=false;});
}
async function resNomina(){
  try{const now=mxToday(), desde=new Date(now.getTime()-115*864e5);
    const rows=(await sb.from('asistencias').select('fecha,minutos_retraso,estatus').eq('employee_id',D.emp.id).gte('fecha',iso(desde)).not('check_in','is',null)).data||[];
    const qk=f=>{const p=String(f).split('-'); return p[0]+'-'+p[1]+'-'+(parseInt(p[2],10)<=15?'1':'2');}; const Q={};
    rows.forEach(x=>{const k=qk(x.fecha); Q[k]=Q[k]||{d:0,r:0}; Q[k].d++; if((x.minutos_retraso&&x.minutos_retraso>0)||/retard/i.test(x.estatus||''))Q[k].r++;});
    const ck=qk(iso(now)), cur=Q[ck]||{d:0,r:0}; const done=Object.keys(Q).filter(k=>k!==ck).sort().reverse().slice(0,7); let racha=0; for(const k of done){if(Q[k].r===0)racha++;else break;}
    $('sNom').textContent=cur.d+' d · '+(cur.r?('⚠ '+cur.r+' retardo'+(cur.r===1?'':'s')):'puntual'); $('sNom').style.color=cur.r?'var(--bad)':'';
    $('sNom2').textContent=D.emp.bono_puntualidad?'bono de puntualidad activo':('racha '+racha+' quincena'+(racha===1?'':'s')+' limpia'+(racha===1?'':'s'));
  }catch(_){}
}

  if(d.jefe_20!=null)h+=li('🧭','Test de tu jefe: <b>'+esc(d.jefe_20)+' / 20</b> <span class="faint">(pesa como 3 compañeros)</span>');
  if(d.pares_media_1a5!=null)h+=li('🫱','Tus compañeros: <b>'+esc(d.pares_media_1a5)+' / 5</b>'+(Number(d.pares_contestaron)>=4?' · '+esc(d.pares_contestaron)+' respuestas':''));
  if(!h||x.v===0)h+=`<div class="note"><b>Estás en 0 porque todavía nadie te ha valorado.</b> No es una mala nota: falta la valoración. Pídele a tu jefe que conteste tu test y anima a tus compañeros a responder la encuesta.<div style="margin-top:8px"><button class="btn" data-pideval="1">Pedir a mi jefe que me valore</button></div></div>`;
  return `<div class="lbl">De dónde sale</div>${h}<div class="faint" style="font-size:.72rem;margin-top:6px">Es anónimo: nunca se ve quién opinó.</div>`;}
function bProd(){const d=cr('desempeno').det, O=Array.isArray(d.objetivos)?d.objetivos:[];
  let h=O.map(o=>{const v=Math.max(0,Math.min(100,Math.round(Number(o.logro)||0))); return `<div class="obj"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o.kpi)}</b><b style="color:${col(v)}">${v}%</b></div><div class="pb" style="height:6px;margin-top:5px"><i style="width:${v}%;background:${col(v)}"></i></div><small>Meta ${esc(o.regla||'≥')} ${esc(o.meta)} · vas en ${esc(o.valor)}${v===0&&Number(o.valor)>0?' · por debajo del 70% del objetivo no suma':''}</small></div>`;}).join('');
  if(d.equipo_20!=null){const v=Math.round(Number(d.equipo_20)/20*100); h+=`<div class="obj"><div style="display:flex;justify-content:space-between;gap:8px"><b>Logro de tu equipo</b><b style="color:${col(v)}">${v}%</b></div><div class="pb" style="height:6px;margin-top:5px"><i style="width:${v}%;background:${col(v)}"></i></div><small>Promedio de la Productividad de tu equipo directo (${esc(d.subordinados||'—')} personas)</small></div>`;}
  if(!h)h='<div class="faint" style="font-size:.82rem">Tu puesto aún no tiene objetivos medibles en la matriz.</div>';
  const calc=d.escalera?`Tu Productividad = 50% tus objetivos (${esc(d.propio_20)}/20) + 50% el logro de tu equipo (${esc(d.equipo_20)}/20).`:'Tu Productividad = promedio del % de logro de estos objetivos, con los meses cerrados del año.';
  const B=(D.bonos||[]).map(b=>`<div class="bono${b.sin_pago?' sp':''}"><b>${esc(b.nombre)}</b> <span style="float:right;color:#8A6A0A;font-weight:800">${b.sin_pago?'sin cobro':mxn(b.monto)}</span><small>${esc(b.quincena||'')} · ${b.sin_pago?'suma a tu desempeño':(b.estatus==='propuesto'?'pendiente de validar':esc(b.estatus))}</small></div>`).join('');
  return `<div class="lbl">Este es tu puesto · ${esc(D.emp.puesto||'')}</div>${h}<div class="lbl">Cómo se calcula</div><div class="li">${calc}</div><div class="li faint" style="font-size:.76rem">Un objetivo logrado en menos del 70% no suma nada ese mes; del 70% para arriba, cuenta lo logrado.${d.bono_sin_pago_pts?' Incluye +'+esc(d.bono_sin_pago_pts)+' por objetivos sin cobro.':''}</div>${B?'<div class="lbl">Tus bonos por objetivo</div>'+B:''}`;}
function bSaber(k){
  const color=k==='conocimiento'?'var(--c4)':'var(--c5)';
  const L=k==='conocimiento'?tPuesto():tDisc(); const T=totalTests(L); let h='';
  if(L.length){h+=`<div class="lbl">${k==='conocimiento'?'Tests de tu puesto':'Tests de Casa Pepe'} · ${k==='conocimiento'?'respondidas':'acertadas'} ${T.h} de ${T.b}</div>`+L.map(c=>filaTest(c,color)).join('');}
  else h+='<div class="faint" style="font-size:.82rem">Todavía no tienes tests asignados en este punto.</div>';
  if(k==='conocimiento'){
    const con=LEC.filter(x=>(x.preguntas||0)>0), ok=con.filter(x=>x.quiz_ok).length, falt=con.filter(x=>!x.quiz_ok);
    if(con.length){
      h+=`<div class="lbl">Tests de tus lecturas · resueltos ${ok} de ${con.length}</div>`
        +falt.map((x,i)=>`<div class="act"${i>=6?' data-mas="1" hidden':''}><div style="min-width:0"><b>${esc(x.titulo||x.codigo||'Documento')}</b><small>${x.preguntas} pregunta${x.preguntas===1?'':'s'}${x.quiz_score!=null?' · último intento '+esc(x.quiz_score)+'%':''}${x.leido?'':' · primero se lee'}</small></div><button data-url="${esc(DOC(x))}" data-t="${esc(x.titulo||'Lectura')}">${x.leido?'Hacer test':'Leer y test'}</button></div>`).join('')
        +(falt.length>6?`<button class="btn ghost" data-vermas="1">Ver los ${falt.length-6} tests restantes</button>`:'')
        +(falt.length?'':'<div class="li">✅ Ya resolviste todos los tests de tus lecturas.</div>');
    }
    const sinTest=LEC.filter(x=>!x.leido&&!(x.preguntas||0)>0).length; if(sinTest)h+=`<div class="faint" style="font-size:.74rem;margin-top:6px">Además te faltan ${sinTest} lecturas que no llevan test.</div>`;
  }
  return h;}

/* ---------- opciones de fondo: reiniciar el ciclo y pedir objetivos sin cobro ---------- */
function opciones(){
  const c=ciclo(), S=D.solicitudes||[], sup=(D.superior&&D.superior.objetivos)||[];
  const ya=t=>S.find(x=>x.tipo===t&&x.estado==='pendiente');
  const tengo={}; (D.bonos||[]).forEach(b=>{if(b.kpi_id)tengo[b.kpi_id]=1;});
  sheet('Si no llegas al 90%',`
   <div class="card"><b>Pedir un objetivo sin cobro</b><div class="muted" style="font-size:.78rem;margin:2px 0 8px">Son objetivos de la posición de arriba${D.superior&&D.superior.celda?' ('+esc(D.superior.celda)+')':''}. No llevan dinero: si los cumples, suman a tu Productividad. Los autoriza Dirección.</div>
     ${sup.length?sup.map(o=>`<div class="act"><div><b>${esc(o.kpi)}</b>${tengo[o.kpi_id]?'<small>ya lo tienes asignado</small>':''}</div>${tengo[o.kpi_id]?'':`<button data-sp="${esc(o.kpi)}">Solicitar</button>`}</div>`).join(''):'<div class="faint" style="font-size:.82rem">La posición de arriba no tiene objetivos que se puedan pedir.</div>'}</div>
   <div class="card"><b>Reiniciar a ceros mi rendimiento</b><div class="muted" style="font-size:.78rem;margin:2px 0 8px">Tu ciclo de 12 meses vuelve a empezar desde hoy: se deja de contar tu promedio actual${c.prom!=null?' ('+c.prom+'%)':''} y empiezas 12 meses nuevos hacia el 90%. Pierdes los meses buenos que ya llevabas. Lo decide Dirección.</div>
     ${ya('reinicio_rendimiento')?'<span class="pill" style="color:#8A6A0A">solicitud enviada · en revisión</span>':'<button class="btn out" id="rst">Solicitar reinicio</button>'}</div>`);
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>pedir('bono_sin_pago',b.dataset.sp,b));
  const r=$('rst'); if(r)r.onclick=async()=>{ if(!confirm('¿Seguro? Si Dirección lo aprueba, tu promedio vuelve a cero y empiezas 12 meses nuevos.'))return; if(await pedir('reinicio_rendimiento','Promedio actual '+(c.prom??'—')+'% · mes '+c.enCiclo+' de 12',r)) (D.solicitudes=D.solicitudes||[]).unshift({tipo:'reinicio_rendimiento',estado:'pendiente'}); };
}

/* ---------- arranque ---------- */
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">Entra con tu cuenta</h3><p>Esta es la versión nueva de SoyPepe, en pruebas. Inicia sesión en la app de siempre y vuelve a abrir esta liga.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Ir a SoyPepe</a></div>'; return; }
  try{ const r=await sb.rpc('sp2_mi_casa'); D=r.data; if(r.error||!D||!D.ok) throw 0; }
  catch(_){ $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">No encontramos tu ficha de colaborador</h3><p>Tu cuenta no está ligada a un colaborador activo. Avisa a RH.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Volver a SoyPepe</a></div>'; return; }
  try{ ((await sb.from('eval_quiz_guia').select('criterio,tests').eq('employee_id',D.emp.id)).data||[]).forEach(x=>GUIA[x.criterio]=x.tests); }catch(_){}
  try{ LEC=(await sb.rpc('proc_mis_lecturas',{})).data||[]; }catch(_){}
  try{ DET=(await sb.rpc('desemp_detalle',{p_emp:D.emp.id})).data||{}; }catch(_){}
  home();
})();
</script>
