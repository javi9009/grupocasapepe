<html lang="es">
<head>
<meta charset="utf-8">

<style>
/* SoyPepe v2 — APP APARTE. No toca /soypepe/ ni su service worker. Javi, 22-nov-2026:
   «ejecútalos en una aplicación aparte para no afectar lo que ya tenemos».
   Primeras dos pantallas: portada de Mi Casa Pepe y el detalle de Mi desempeño. */
:root{
  --ground:#F4F1EA; --surface:#fff; --surface-2:#FBF8F1; --ink:#1F1B16; --muted:#6B6459; --faint:#A49B8C;
  --rule:#E6E0D3; --dark:#16241D; --dark-2:#22342B; --accent:#137A56; --accent-2:#1F9E75; --lime:#C9DA3C;
  --c1:#55606B; --c2:#2F6DB5; --c3:#7B3F98; --c4:#5B4FB0; --c5:#C49A1A;
  --ok:#137A56; --warn:#D9A21B; --bad:#C0452F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
.embed #app{padding-bottom:18px;max-width:none}
.embed .top{padding-top:12px;border-radius:0 0 18px 18px}
.crumb{border:0;background:none;color:#E9C46A;font-weight:700;font-size:.8rem;padding:0 0 6px}
[hidden]{display:none!important}
html,body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:92px;background:var(--ground)}
.top{background:var(--dark);color:#F4F1EA;padding:calc(14px + env(safe-area-inset-top)) 16px 18px;border-radius:0 0 22px 22px}
.hello{display:flex;align-items:center;gap:10px}
.ava{width:38px;height:38px;border-radius:50%;background:var(--dark-2);display:grid;place-items:center;font-weight:800}
.hello small{display:block;font-size:.72rem;opacity:.7;text-transform:capitalize}
.hello b{color:#E9C46A}
.sede{margin-left:auto;background:#F4F1EA;color:var(--ink);border-radius:9px;padding:6px 10px;font-size:.78rem;font-weight:700}
.tabs{display:flex;gap:4px;background:var(--dark-2);border-radius:999px;padding:4px;margin:14px 0 12px}
.tabs button{flex:1;border:0;background:none;color:#cfd8d2;border-radius:999px;padding:7px 4px;font-size:.78rem;font-weight:600;white-space:nowrap}
.tabs button.on{background:#F4F1EA;color:var(--ink)}
.dcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid #33483d;background:var(--dark-2);border-radius:16px;padding:12px 14px;color:#F4F1EA}
.dcard h3{margin:0;font-size:1rem}
.dcard p{margin:2px 0 0;font-size:.76rem;opacity:.82;line-height:1.35}
.dcard .chev{margin-left:auto;font-size:1.3rem;opacity:.7}
.dbig{border:1px solid #33483d;background:var(--dark-2);border-radius:18px;padding:14px;color:#F4F1EA}
.dbig .dsub{font-size:.66rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:#CFC3AE;margin:14px 0 4px}
.dbig .drow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid rgba(244,236,221,.12);background:none;color:inherit;padding:10px 0;min-height:44px;font:inherit}
.dbig .drow .pts{flex:none;min-width:44px;text-align:center;border-radius:9px;padding:6px 4px;font-weight:800;font-size:.8rem;color:#fff}
.dbig .drow .tx{flex:1;min-width:0}.dbig .drow .tx b{display:block;font-size:.86rem}.dbig .drow .tx small{display:block;font-size:.74rem;opacity:.8;line-height:1.35}
.dbig .drow .chev{opacity:.6;font-size:1.1rem}
.dbig .dacts .act{border-top:1px solid rgba(244,236,221,.12);color:#F4F1EA}.dbig .dacts .act small{color:#CFC3AE}
main{padding:14px 14px 0}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:14px;margin-bottom:12px}
.com{background:linear-gradient(180deg,#FBE3D6,#FDF1EA);border-color:#F3CDB9}
.rowh{display:flex;align-items:center;gap:10px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:1rem;flex:none}
.rowh h4{margin:0;font-size:.95rem}
.rowh small{display:block;color:var(--muted);font-size:.74rem}
.days{display:flex;gap:8px;overflow-x:auto;margin-top:10px;padding-bottom:2px}
.day{flex:0 0 46%;background:#fff;border:1.5px solid var(--rule);border-radius:12px;padding:9px 10px;text-align:left}
.day.hoy{border-color:var(--accent)}
.day .d{font-size:.62rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.day .pl{font-weight:700;font-size:.92rem;margin:1px 0}
.day .n{font-size:.72rem;color:var(--muted)}
.day .ap{margin-top:6px;width:100%;border:1px solid var(--accent);background:#fff;color:var(--accent);border-radius:8px;padding:5px;font-size:.76rem;font-weight:700}
.day .ap.on{background:var(--accent);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:13px;text-align:left}
.tile h4{margin:9px 0 1px;font-size:.95rem}

.tile small{display:block;color:var(--muted);font-size:.72rem}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:16px 2px 8px;font-size:.7rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.sec button{border:0;background:none;color:var(--accent);font-weight:700;font-size:.78rem;text-transform:none;letter-spacing:0}
.bono{background:#FBF4DC;border-radius:10px;padding:9px 11px;margin-top:8px;font-size:.82rem}

.track{display:flex;align-items:center;gap:6px;margin:12px 0 8px}

.track .n.cur{background:var(--accent);color:#fff}
.track .n.sig{background:#FBF4DC;color:#8A6A0A;border:1px solid var(--c5)}
.track i{flex:1;height:2px;background:var(--rule)}
.pb{height:8px;border-radius:5px;background:#E8E2D5;overflow:hidden;position:relative}
.pb>i{display:block;height:100%;border-radius:5px}
.pb>u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);left:90%}
.bot{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--rule);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.bot div{max-width:520px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around;padding:6px 4px 7px}
.bot a{flex:1;text-align:center;font-size:.66rem;color:var(--muted);text-decoration:none}
.bot a span{display:block;font-size:1.05rem;line-height:1.3}
.bot a.on{color:var(--accent);font-weight:700}
.bot a.go span{width:46px;height:46px;border-radius:50%;background:var(--accent-2);color:#fff;display:grid;place-items:center;margin:-22px auto 2px;font-size:1.25rem;box-shadow:0 4px 12px rgba(19,122,86,.35)}
.bot a.go{color:var(--ink);font-weight:700}
/* detalle */
#det{background:var(--ground);min-height:100vh}
.dtop{background:var(--dark);color:#F4F1EA;padding:calc(12px + env(safe-area-inset-top)) 14px 14px;display:flex;align-items:center;gap:8px;position:sticky;top:0;z-index:10}
.dtop button{border:0;background:var(--dark-2);color:#F4F1EA;border-radius:999px;padding:6px 12px;font-size:.8rem;font-weight:700}
.dtop span{font-size:.78rem;opacity:.75;margin-left:auto}
.five{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.five button{border:0;border-radius:10px;padding:8px 2px;color:#fff;text-align:center}
.five b{display:block;font-size:.95rem}
.five small{display:block;font-size:.56rem;opacity:.9;line-height:1.15}
.act{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:.84rem}
.act:first-child{border-top:0}
/* UNA FILA POR RECOMENDACIÓN. Javi, 22-nov-2026: «evita la segunda línea para
   tenerlo todo en la misma fila por tipo de recomendación». El detalle va
   detrás del título, no debajo: tres renglones en vez de seis. */
.act small{display:inline;color:var(--muted);font-size:.72rem}
.act>div{min-width:0}
.act button{margin-left:auto;border:0;background:var(--accent);color:#fff;border-radius:8px;padding:6px 12px;font-size:.78rem;font-weight:700;flex:none}
.crit{background:var(--surface);border:1px solid var(--rule);border-radius:16px;margin-bottom:10px;overflow:hidden}
.crit>button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:12px 14px;text-align:left}
.crit .num{width:34px;height:34px;border-radius:10px;color:#fff;display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.crit h4{margin:0;font-size:.95rem}
.crit .v{margin-left:auto;font-weight:800;font-size:.9rem;white-space:nowrap}
.crit .v small{color:var(--faint);font-weight:600}
.crit .mini{padding:0 14px 12px}
.crit .body{display:none;padding:2px 14px 14px;border-top:1px solid var(--rule)}
.crit.open .body{display:block}
.lbl{font-size:.62rem;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.obj{background:var(--surface-2);border-radius:10px;padding:9px 11px;margin-bottom:7px;font-size:.84rem}
.obj small{display:block;color:var(--muted);font-size:.7rem;margin-top:3px}
.li{font-size:.82rem;padding:3px 0}
.note{background:#FBF4DC;border:1px solid #e3d3a8;border-radius:10px;padding:10px 12px;font-size:.8rem;line-height:1.4;margin-top:8px}
.niv{display:grid;grid-template-columns:repeat(auto-fit,minmax(74px,1fr));gap:6px}
.niv div{border-radius:10px;padding:8px;background:#EFE9DD;border:1.5px solid transparent}
.niv div.cur{background:var(--accent);color:#fff}
.niv div.sig{background:#FBF4DC;border-color:var(--c5)}
.niv small{display:block;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85}
.niv b{font-size:.92rem}
.bars{position:relative;display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:74px;margin-top:10px}
.bars i{display:block;border-radius:3px 3px 0 0;min-height:3px}
.bars i.vac{background:#E8E2D5;height:3px}
.bars u{position:absolute;left:0;right:0;bottom:90%;border-top:1.5px dotted var(--accent);opacity:.6}
.blbl{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;font-size:.56rem;text-align:center;color:var(--muted);margin-top:3px}
.btn{border:0;background:var(--accent);color:#fff;border-radius:10px;padding:10px 14px;font-weight:700;font-size:.86rem}
.btn.out{background:#fff;color:var(--accent);border:1px solid var(--accent)}
.btn.ghost{background:none;color:var(--muted);border:1px dashed var(--rule);font-weight:600;font-size:.78rem;width:100%;margin-top:10px}
/* hojas */
.sheet{position:fixed;inset:0;background:rgba(22,36,29,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:var(--ground);width:100%;max-width:520px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
.sheet.full .in{height:100vh;max-height:100vh;border-radius:0}
.sheet .h{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule);background:#fff}
.sheet .h b{font-size:.98rem}
.sheet.solo-x .h{border-bottom:0;padding:6px 10px;background:transparent}
.sheet .h button{margin-left:auto;border:0;background:#EFE9DD;border-radius:999px;width:32px;height:32px;font-size:1.05rem}
.sheet .b{padding:14px;overflow:auto;flex:1}
.sheet iframe{border:0;width:100%;height:100%;flex:1;background:#fff}
input,textarea,select{font:inherit;width:100%;padding:10px;border:1px solid var(--rule);border-radius:10px;background:#fff}
.faint{color:var(--faint)} .muted{color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.66rem;font-weight:700;border:1px solid currentColor}
.center{padding:60px 24px;text-align:center;color:var(--muted)}
.beta{background:#FBF4DC;color:#6E540A;font-size:.7rem;text-align:center;padding:5px 8px}
.beta select{width:auto;padding:3px 6px;font-size:.72rem;border-radius:7px;margin-left:4px}
.ptit h2{margin:2px 0 2px;font-size:1.3rem}
.ptit p{margin:0;font-size:.76rem;opacity:.8}
.ptop{background:var(--dark);color:#F4F1EA;padding:calc(12px + env(safe-area-inset-top)) 16px 18px}
.ptop button{border:0;background:none;color:#E9C46A;font-weight:700;font-size:.8rem;padding:0}
.ptop h2{margin:6px 0 2px;font-size:1.35rem}
.ptop p{margin:0;font-size:.76rem;opacity:.8}
.hero{background:linear-gradient(135deg,#1C4A37,#2E6B50);color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.hero small{opacity:.85;font-size:.74rem}
.hero .big{font-size:2rem;font-weight:800;line-height:1.15}
.chip{display:inline-block;background:rgba(255,255,255,.16);border-radius:999px;padding:3px 10px;font-size:.7rem;font-weight:700;margin:8px 6px 0 0}
.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--rule);font-size:.86rem}
.row:first-of-type{border-top:0}
.row.tot{font-weight:800}
#nomRoot a{color:#16805F}#nomRoot a:hover{color:#0F5E46}#nomRoot button{font-family:inherit}
.ptag{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:7px 13px;border-radius:999px;border:1px solid rgba(233,196,106,.65);background:rgba(233,196,106,.16);color:#E9C46A;font:inherit;font-size:.76rem;font-weight:700;line-height:1.2;text-align:left;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:8px}
.cal span{font-size:.62rem;text-align:center;color:var(--muted);font-weight:700}
.cal button{border:1px solid var(--rule);background:#fff;border-radius:9px;padding:9px 0;font-size:.82rem;font-weight:600}
.cal button:disabled{background:#F1ECE1;color:#C9C0AE;border-color:#F1ECE1}
.cal button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.cal button.ya{background:#DCEFE6;border-color:#B9DEC9}
.dd{display:flex;gap:10px;align-items:center;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin-bottom:9px}
.dd.hoy{border-color:var(--accent)}
.dd.off{background:#F1ECE1;color:var(--muted)}
.dd .dt{width:42px;text-align:center;flex:none}
.dd .dt small{display:block;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.dd .dt b{font-size:1.15rem}
.dd .mid{flex:1;min-width:0}
.dd .mid small{display:block;color:var(--muted);font-size:.72rem}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;border:1px solid var(--rule);background:#fff;border-radius:999px;padding:8px;font-size:.8rem;font-weight:700}
.seg button.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.five2{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.five2 button{border:0;background:none;padding:0;text-align:center}
.five2 i{display:block;height:64px;border-radius:9px}

.crit .sub{font-size:.76rem;color:var(--muted);padding:0 14px 12px;margin-top:-6px}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-size:1.25rem}
.stat small{color:var(--muted);font-size:.72rem}
.rec{border-radius:11px;padding:9px 11px;margin-bottom:7px;font-size:.82rem;line-height:1.4}
.rec.ok{background:#EAF4EE}.rec.up{background:#F1F6F2}.rec.mal{background:#FBE9E4}.rec.av{background:#FBF4DC}
.qrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--rule);font-size:.8rem}

.qrow b{width:26px;text-align:right}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.opt{border:1.5px solid var(--rule);background:#fff;border-radius:12px;padding:10px 12px;text-align:left}

<div id="app"><div class="center">Cargando…</div></div>
<!-- Mi nómina · plantilla del diseño P6c (se llena con datos reales en nomVals) -->
<template id="tNom">
<div style="position: relative; width: 100%; max-width: 520px; margin: 0 auto; min-height: 100vh; box-sizing: border-box; background: #F1EDE4; color: #1F1B16; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">
<header style="background: #1E2A24; color: #F4ECDD; padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 12px">
<a href="#" onClick="{{irCasa}}" style="color: #E9CF72; text-decoration: none; font-size: 13px; font-weight: 700">← Mi Casa Pepe</a>
<div style="display: flex; flex-direction: column; gap: 4px"><strong style="font-size: 24px; line-height: 1.1">Mi nómina</strong><span style="font-size: 13px; color: #CFC3AE">{{sub}}</span></div>
<div style="display: flex; flex-direction: column; gap: 6px; background: rgba(244,236,221,.06); border: 1px solid rgba(244,236,221,.12); border-radius: 16px; padding: 14px">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 12px; color: #CFC3AE">Total neto estimado a percibir</span><span style="font-size: 10px; font-weight: 800; color: #1E2A24; background: #E9CF72; padding: 3px 8px; border-radius: 999px">ESTIMADO</span></span>
<strong style="font-size: 34px; line-height: 1; color: #FFFFFF">{{neto}}</strong>
<span style="font-size: 12px; color: #CFC3AE">{{formula}}</span>
<span style="display: flex; height: 10px; border-radius: 999px; overflow: hidden; gap: 2px; margin-top: 6px"><span style="display: block; height: 10px; width: {{hb_s}}%; background: #3E7C5A"></span><span style="display: block; height: 10px; width: {{hb_d}}%; background: #9E3B2E"></span></span>
<span style="display: flex; flex-wrap: wrap; gap: 10px; font-size: 11px; color: #CFC3AE"><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #3E7C5A"></span>Sueldo estimado</span><span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 2px; background: #D0705F"></span>Deducciones</span></span>
</div>
</header>
<div style="padding: 14px; display: flex; flex-direction: column; gap: 12px">
<span style="font-size: 11px; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; color: #8A8173">De dónde sale · toca para ver</span>
<section style="background: #FFFFFF; border: 1px solid #E6E0D3; border-radius: 16px; overflow: hidden">

function ciclo(){
  const hoy=mxToday(), hY=hoy.getFullYear(), hM=hoy.getMonth(); let sY=hY,sM=hM,total=1;
  if(D.emp.ciclo_desde){const d=new Date(String(D.emp.ciclo_desde).slice(0,10)+'T12:00:00'); if(!isNaN(d)){total=Math.max(1,(hY-d.getFullYear())*12+(hM-d.getMonth())+1); const s=new Date(d.getFullYear(),d.getMonth()+Math.floor((total-1)/12)*12,1); sY=s.getFullYear(); sM=s.getMonth();}}
  const H={}; (D.meses||[]).forEach(m=>H[m.mes]=Number(m.pct));
  const slots=[]; for(let i=0;i<12;i++){const d=new Date(sY,sM+i,1), key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); slots.push({lbl:MES[d.getMonth()],v:H[key]??null,fut:(d.getFullYear()>hY||(d.getFullYear()===hY&&d.getMonth()>hM))});}
  /* LOS MESES QUE FALTAN INCLUYEN EL DE HOY. Javi, 22-nov-2026: «no le faltan
     dos meses, le faltan 3 o 4 porque entró en febrero». El mes en curso no
     está cerrado ni medido, así que contarlo como pasado hacía la cuenta más
     corta de lo que es y adelantaba el «ya no alcanzas».
     Y se cuentan aparte los meses del ciclo que ya pasaron y nadie midió: no
     se suman como cero -eso condenaría a cualquiera-, pero se dicen, porque
     un promedio de un mes no es el promedio del año. */
  /* DESDE CUÁNDO MEDIMOS. Javi, 22-nov-2026: «al iniciar en noviembre no
     tenemos historial, por tanto sólo podemos promediar sobre los meses que
     tenemos». Los meses del ciclo anteriores a noviembre de 2026 no son
     meses «sin medir» que alguien olvidó registrar: son meses en los que
     todavía no se medía. Llamarlos un olvido sería reprochar al colaborador
     -y a su jefe- algo que no pasó. */
  const med=slots.filter(s=>s.v!=null), sum=med.reduce((a,s)=>a+s.v,0);
  const enCurso=slots.filter((s,i)=>{const d=new Date(sY,sM+i,1); return !s.fut && s.v==null &&
      d.getFullYear()===hY && d.getMonth()===hM;}).length;
  const fut=slots.filter(s=>s.fut).length + enCurso;
  const _antes=slots.filter((x,i)=>{const d=new Date(sY,sM+i,1);
      return x.v==null && !x.fut && (d.getFullYear()<MIDE_Y || (d.getFullYear()===MIDE_Y && d.getMonth()<MIDE_M));}).length;
  const sinDato=slots.filter(s=>s.v==null && !s.fut).length - enCurso - _antes;
  const antesDeMedir=_antes;
  const prom=med.length?Math.round(sum/med.length*10)/10:null;
  const nec=(med.length&&fut)?Math.ceil((90*(med.length+fut)-sum)/fut):null;
  const dia=D.emp.ciclo_desde?new Date(String(D.emp.ciclo_desde).slice(0,10)+'T12:00:00').getDate():1; const ini=new Date(sY,sM,dia,12), fin=new Date(sY+1,sM,dia-1,12);
  return {slots,prom,fut,nec,sinDato,antesDeMedir,enCiclo:((total-1)%12)+1,ini,fin};
}
function niveles(){const g=D.niveles||{}, sal=Number(D.emp.salario)||0, ks=['junior','junior2','senior'].filter(k=>g[k]!=null); let i=-1;
  /* tolerancia de $25: una diferencia de redondeo (9,451 contra 9,456) no baja a nadie de nivel */
  if(sal>0){ks.forEach((k,j)=>{if(sal>=Number(g[k])-25)i=j;}); while(i<ks.length-1&&(Number(g[ks[i+1]])-sal)/sal<0.09)i++;} else i=ks.indexOf(D.emp.tramo);
  /* por debajo del Nivel 1 = está en Prácticas (ya trabajando), con su propia nómina como referencia */
  if(sal>0&&i===-1&&ks.length){ks.unshift('practicas'); i=0;}
  return {ks,i,g,bajo:false,sig:(i<ks.length-1)?ks[i+1]:null};}
/* escala de rojo a verde pasando por naranja y amarillo: se usa en el anillo, la barra y los 5 puntos */
function heat(r){r=Math.max(0,Math.min(1,r)); const S=[[0,[179,38,30]],[.35,[232,112,26]],[.55,[224,180,28]],[.7,[168,200,28]],[1,[30,138,60]]];
  for(let i=1;i<S.length;i++)if(r<=S[i][0]){const [a,ca]=S[i-1],[b,cb]=S[i],t=(r-a)/(b-a); return 'rgb('+ca.map((c,j)=>Math.round(c+(cb[j]-c)*t)).join(',')+')';} return 'rgb(30,138,60)';}

/* ---------- Mi nómina · diseño P6c (22-nov-2026) ----------
   La pantalla es la plantilla de referencia tal cual (#tNom), llena con datos reales del trabajador.
   TODO va trazado al id del trabajador: sp2_mi_nomina2(employee_id) junta contrato, días de la quincena,
   sábana de Incidencias, puntualidad del mes, concierge, bonos por objetivo (ligados a su KPI de desempeño),
   horas extra y quincenas pagadas. Si esa función falla, se abre la versión anterior (no se pierde nada). */
function ncGet(scope,path){path=path.trim(); if(path==='true')return true; if(path==='false')return false; if(/^-?\d+(\.\d+)?$/.test(path))return +path;
  let v=scope; for(const k of path.split('.')){ if(v==null)return undefined; v=v[k]; } return v;}
function ncSub(str,scope){ const m=str.match(/^\{\{([^}]+)\}\}$/); if(m) return ncGet(scope,m[1]);
  return str.replace(/\{\{([^}]+)\}\}/g,(_,p)=>{const v=ncGet(scope,p);return v==null||v===false?'':v;});}
function ncWalk(node,scope,out){
  for(const ch of [...node.childNodes]){
    if(ch.nodeType===3){ out.appendChild(document.createTextNode(ncSub(ch.textContent,scope))); continue; }
    if(ch.nodeType!==1) continue;
    const tag=ch.tagName.toLowerCase();
    if(tag==='sc-for'){ const list=ncSub(ch.getAttribute('list'),scope)||[]; const as=ch.getAttribute('as'); (Array.isArray(list)?list:[]).forEach((it,i)=>{ const s=Object.create(scope); s[as]=it; s.index=i; ncWalk(ch,s,out); }); continue; }
    if(tag==='sc-if'){ if(ncSub(ch.getAttribute('value'),scope)) ncWalk(ch,scope,out); continue; }
    const el=document.createElement(tag);
    for(const a of ch.attributes){ const v=ncSub(a.value,scope);
      if(/^on[a-z]+$/i.test(a.name)){ if(typeof v==='function'){ const ev=a.name.slice(2).toLowerCase(); el.addEventListener(ev,e=>{ if(tag==='a')e.preventDefault(); v(e); }); } continue; }
      if(a.name==='disabled'){ if(v&&v!=='false') el.setAttribute(a.name,''); continue; }
      if(a.name==='value'&&(tag==='input'||tag==='textarea')){ el.value=v==null?'':v; continue; }
      if(v===false||v==null) continue;
      el.setAttribute(a.name,v);
    }
    ncWalk(ch,scope,el); out.appendChild(el);
  }
}

  const sueldoM=+N.emp.salario||0, sd=sueldoM/30, r2=n=>Math.round(n*100)/100;
  const ini=N.emp.ingreso?new Date(N.emp.ingreso+'T00:00:00'):null, years=ini?Math.max(1,Math.floor((Date.now()-ini)/(365.25*864e5))):1;

async function pgHor(){
  page('Mi horario','Cargando…','<div class="center">Cargando tus turnos…</div>');

  const by={}; H.forEach(x=>{(by[x.fecha]=by[x.fecha]||[]).push(x);}); const hoy=iso(mxToday()); let sem=0;
  const hhmm=x=>String(x.hora_inicio).slice(0,5)+'–'+String(x.hora_fin||'').slice(0,5);
  const prox=H.find(x=>x.hora_inicio&&x.fecha>=hoy);

    const ks=keys.slice(sem*7,sem*7+7), pub=ks.some(k=>by[k]);

      <button class="btn" style="width:100%;margin-top:6px;background:#3F56B0" id="hPedir">Pedir cambio de turno o descanso</button>`;
    $('hbody').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sem=+b.dataset.s; pinta();});
    $('hPedir').onclick=()=>pedirCambio(ks);
  }
  /* PEDIR UN CAMBIO en tres pasos (diseño de Javi): qué · qué días · con qué compañero.
     Solo compañeros directos de su área y sede. Llega al compañero y al jefe; el horario
     no se mueve solo: lo confirma el jefe. */
  let COMP=null;
  async function pedirCambio(ks){
    /* desde hoy: lo que queda de esta semana y la siguiente completa */
    const dias=(sem===0?keys:ks).filter(k=>k>=hoy); let que=null, sel=new Set(), comp=null;

    const info=c=>{const T={}; (c.turnos||[]).forEach(t=>{(T[t.fecha]=T[t.fecha]||[]).push(t.ini+'–'+t.fin);});
      const desc=dias.filter(k=>!T[k]).map(k=>{const d=new Date(k+'T12:00:00'); return DIA[d.getDay()]+' '+d.getDate();});
      const elegidos=[...sel].sort().map(k=>{const d=new Date(k+'T12:00:00'); return DIA[d.getDay()]+' '+d.getDate()+' '+(T[k]?T[k].join(' · '):'descansa');});
      if(!(c.turnos||[]).length)return 'sin turnos publicados esa semana';
      return (elegidos.length?elegidos.join(' · '):('descansa '+(desc.length?desc.join(', '):'ningún día')));};

      sheet('Pedir un cambio',`

          <button class="opt${que==='descanso'?' on':''}" data-que="descanso"><b>Cambio de descanso</b><small>mueves tu día libre</small></button></div>
        <div class="lbl">2 · Qué días · uno o varios</div>
        <div style="display:grid;grid-template-columns:repeat(${Math.min(7,Math.max(dias.length,1))},1fr);gap:5px">${dias.map(k=>{const d=new Date(k+'T12:00:00'); const ok=true;

        <div class="faint" style="font-size:.7rem;margin-top:5px">${que==='descanso'?'Elige tu día de descanso y el de tu compañero: en cada día elegido, cada quien toma el lugar del otro.':'En cada día que elijas, tú haces su turno y tu compañero el tuyo.'}</div>

        ${COMP.length?COMP.map(c=>`<button class="opt wide${comp===c.id?' on':''}" data-comp="${c.id}"><b>${esc(c.nombre)}</b><small>${esc(c.puesto||'')} · ${esc(info(c))}</small></button>`).join(''):'<div class="faint" style="font-size:.82rem">No hay compañeros de tu área y sede dados de alta.</div>'}
        <div style="font-size:.72rem;color:#3F56B0;margin:6px 0 10px">Solo compañeros directos de tu área y sede.</div>
        <button class="btn" id="cGo" style="width:100%${listo?'':';background:#EADFCB;color:#8A7C62'}"${listo?'':' disabled'}>${listo?('Pedir el cambio a '+esc(cn)):'Elige tipo, días y compañero'}</button>
        <div class="faint" style="font-size:.72rem;margin-top:8px">A tu compañero le llega la notificación. Si acepta, el cambio se hace solo en Horarios y avisamos a tu jefe.</div>`);
      document.querySelectorAll('[data-que]').forEach(b=>b.onclick=()=>{que=b.dataset.que; pinta();});

function bPunt(){const d=cr('puntualidad').det, ct=Number(d.con_turno)||0, at=Number(d.a_tiempo)||0, pct=ct?Math.round(at/ct*1000)/10:null;

/* ---------- arranque ---------- */
async function carga(ver){
  $('app').innerHTML='<div class="center">Cargando…</div>'; LEC=[]; GUIA={}; DET={}; open={}; VAC=null; HOR=[];
  try{ const r=await sb.rpc('sp2_mi_casa',{p_emp:ver||null}); D=r.data; if(r.error||!D||!D.ok) throw 0; }
  catch(_){ if(ver){ try{localStorage.removeItem(LSV);}catch(e){} return carga(null); }
    $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">No encontramos tu ficha de colaborador</h3><p>Tu cuenta no está ligada a un colaborador activo. Avisa a RH.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Volver a SoyPepe</a></div>'; return; }
  RO=!!D.solo_lectura;
  /* Dirección entra viendo a un trabajador (Javi, 22-nov-2026: «monta el de Alo de Puebla para ver un trabajador»). */
  if(!EMBED&&!ver&&(D.roster||[]).length){ let pref=null; try{pref=localStorage.getItem(LSV);}catch(e){}
    if(pref&&pref!=='yo') return carga(pref);
    if(!pref){ const alo=D.roster.find(x=>x.nombre==='Alo'&&/puebla/i.test(x.sede||'')); if(alo){ try{localStorage.setItem(LSV,alo.id);}catch(e){} return carga(alo.id); } } }
  try{ ((await sb.from('eval_quiz_guia').select('criterio,tests').eq('employee_id',D.emp.id)).data||[]).forEach(x=>GUIA[x.criterio]=x.tests); }catch(_){}
  try{ LEC=(await sb.rpc('proc_mis_lecturas',RO?{p_emp:D.emp.id}:{})).data||[]; }catch(_){}
  try{ DET=(await sb.rpc('desemp_detalle',{p_emp:D.emp.id})).data||{}; }catch(_){}
  /* CÓMO VAMOS ESTE MES. Javi, 22-nov-2026: el acumulado del año no se puede
     mejorar, el mes sí. Las frases salen de la base (mi_mes), de los
     objetivos que esa persona ya tiene colgados en su matriz. */
  try{ MES_REC=(await sb.rpc('mi_mes',{p_employee:D.emp.id})).data||[]; }catch(_){ MES_REC=[]; }
  await cargaCamb();
  home();
}
async function cargaCamb(){ CAMB={recibidos:[],enviados:[]}; if(RO)return; try{ const d=(await sb.rpc('sp2_cambios_mios')).data; if(d)CAMB={recibidos:d.recibidos||[],enviados:d.enviados||[]}; }catch(_){} }
window.addEventListener('message',e=>{ if(e.origin===location.origin&&e.data==='sp2-home'&&D){ home(); window.scrollTo(0,0); } });
/* La hoja donde la cocina sube el menú vive en la app que nos contiene: al
   guardar o al cerrarla nos avisa y se repinta lo que esté a la vista. */
window.addEventListener('message',e=>{ if(e.origin!==location.origin||e.data!=='sp2-comidas-cambio'||!D) return;
  try{ if($('cmPag')) pgComidas(); else if(EN_HOME) comidas(); }catch(_){} });
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">Entra con tu cuenta</h3><p>Esta es la versión nueva de SoyPepe, en pruebas. Inicia sesión en la app de siempre y vuelve a abrir esta liga.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Ir a SoyPepe</a></div>'; return; }
  let v=new URLSearchParams(location.search).get('ver'); carga(v||null);
})();
</script>
