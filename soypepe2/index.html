const POS=()=>Number(D.pila.posibles)||100;
const score=()=>{const p=Number(D.pila.posibles)||100; return Math.round((Number(D.pila.puntos)||0)/p*100);};
function flojo(){let low=null; CRIT.forEach(([k,n])=>{const x=cr(k); if(!low||x.r<low.r)low={k,n,v:x.v,r:x.r};}); return low;}

function filaTest(c,color){const h=hecho(c), b=Number(c.banco)||0, p=b?Math.min(100,Math.round(h/b*100)):0;
  return `<div class="obj"><div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><div style="min-width:0"><b>${esc((c.emoji?c.emoji+' ':'')+c.nombre)}</b><small>${c.contestadas!=null?('Respondidas <b>'+h+' de '+b+'</b> preguntas · acertadas '+(c.acertadas||0)):('Acertadas <b>'+h+' de '+b+'</b> preguntas')}</small></div>${c.cat?`<button class="btn" style="padding:7px 11px;font-size:.78rem;flex:none" data-url="${esc(QZ(c))}" data-t="${esc(c.nombre)}">${h>0?(h>=b?'Repasar':'Seguir test'):'Empezar test'}</button>`:''}</div><div class="pb" style="height:6px;margin-top:6px"><i style="width:${p}%;background:${color}"></i></div></div>`;}
function totalTests(L){const h=L.reduce((a,c)=>a+hecho(c),0), b=L.reduce((a,c)=>a+(Number(c.banco)||0),0); return {h,b};}
function tip(k){
  if(k==='conocimiento'){const t=tPuesto().slice().sort((a,b)=>hecho(a)/a.banco-hecho(b)/b.banco)[0]; if(t)return 'el test de '+t.nombre;}
  if(k==='conocimiento')return GUIA.conocimiento?('el test de '+String(GUIA.conocimiento).split(',')[0].replace(/^[^\wÁÉÍÓÚáéíóúñÑ]+/,'').trim()):'los tests de tu puesto';
  return {puntualidad:'llegar a tiempo a cada turno',actitud:'que tu jefe y tus compañeros te valoren',desempeno:'los objetivos de tu puesto',discurso:'el test de Discurso Casa Pepe'}[k];
}
function ciclo(){
  const hoy=mxToday(), hY=hoy.getFullYear(), hM=hoy.getMonth(); let sY=hY,sM=hM,total=1;
  if(D.emp.ciclo_desde){const d=new Date(String(D.emp.ciclo_desde).slice(0,10)+'T12:00:00'); if(!isNaN(d)){total=Math.max(1,(hY-d.getFullYear())*12+(hM-d.getMonth())+1); const s=new Date(d.getFullYear(),d.getMonth()+Math.floor((total-1)/12)*12,1); sY=s.getFullYear(); sM=s.getMonth();}}
  const H={}; (D.meses||[]).forEach(m=>H[m.mes]=Number(m.pct));
  const slots=[]; for(let i=0;i<12;i++){const d=new Date(sY,sM+i,1), key=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); slots.push({lbl:MES[d.getMonth()],v:H[key]??null,fut:(d.getFullYear()>hY||(d.getFullYear()===hY&&d.getMonth()>hM))});}
  /* LOS MESES QUE FALTAN INCLUYEN EL DE HOY. Javi, 22-nov-2026: «no le faltan
     dos meses, le faltan 3 o 4 porque entró en febrero». El mes en curso no
     está cerrado ni medido, así que contarlo como pasado hacía la cuenta más
     corta de lo que es y adelantaba el «ya no alcanzas».
     Y se cuentan aparte los meses del ciclo que ya pasaron y nadie midió: no
     se suman como cero -eso condenaría a cualquiera-, pero se dicen, porque
     un promedio de un mes no es el promedio del año. */
  /* DESDE CUÁNDO MEDIMOS. Javi, 22-nov-2026: «al iniciar en noviembre no
     tenemos historial, por tanto sólo podemos promediar sobre los meses que
     tenemos». Los meses del ciclo anteriores a noviembre de 2026 no son
     meses «sin medir» que alguien olvidó registrar: son meses en los que
     todavía no se medía. Llamarlos un olvido sería reprochar al colaborador
     -y a su jefe- algo que no pasó. */
  const med=slots.filter(s=>s.v!=null), sum=med.reduce((a,s)=>a+s.v,0);
  const enCurso=slots.filter((s,i)=>{const d=new Date(sY,sM+i,1); return !s.fut && s.v==null &&
      d.getFullYear()===hY && d.getMonth()===hM;}).length;
  const fut=slots.filter(s=>s.fut).length + enCurso;
  const _antes=slots.filter((x,i)=>{const d=new Date(sY,sM+i,1);
      return x.v==null && !x.fut && (d.getFullYear()<MIDE_Y || (d.getFullYear()===MIDE_Y && d.getMonth()<MIDE_M));}).length;
  const sinDato=slots.filter(s=>s.v==null && !s.fut).length - enCurso - _antes;
  const antesDeMedir=_antes;
  const prom=med.length?Math.round(sum/med.length*10)/10:null;
  const nec=(med.length&&fut)?Math.ceil((90*(med.length+fut)-sum)/fut):null;
  const dia=D.emp.ciclo_desde?new Date(String(D.emp.ciclo_desde).slice(0,10)+'T12:00:00').getDate():1; const ini=new Date(sY,sM,dia,12), fin=new Date(sY+1,sM,dia-1,12);
  return {slots,prom,fut,nec,sinDato,antesDeMedir,enCiclo:((total-1)%12)+1,ini,fin};
}
function niveles(){const g=D.niveles||{}, sal=Number(D.emp.salario)||0, ks=['junior','junior2','senior'].filter(k=>g[k]!=null); let i=-1;
  /* tolerancia de $25: una diferencia de redondeo (9,451 contra 9,456) no baja a nadie de nivel */
  if(sal>0){ks.forEach((k,j)=>{if(sal>=Number(g[k])-25)i=j;}); while(i<ks.length-1&&(Number(g[ks[i+1]])-sal)/sal<0.09)i++;} else i=ks.indexOf(D.emp.tramo);
  /* por debajo del Nivel 1 = está en Prácticas (ya trabajando), con su propia nómina como referencia */
  if(sal>0&&i===-1&&ks.length){ks.unshift('practicas'); i=0;}
  return {ks,i,g,bajo:false,sig:(i<ks.length-1)?ks[i+1]:null};}
/* escala de rojo a verde pasando por naranja y amarillo: se usa en el anillo, la barra y los 5 puntos */
function heat(r){r=Math.max(0,Math.min(1,r)); const S=[[0,[179,38,30]],[.35,[232,112,26]],[.55,[224,180,28]],[.7,[168,200,28]],[1,[30,138,60]]];
  for(let i=1;i<S.length;i++)if(r<=S[i][0]){const [a,ca]=S[i-1],[b,cb]=S[i],t=(r-a)/(b-a); return 'rgb('+ca.map((c,j)=>Math.round(c+(cb[j]-c)*t)).join(',')+')';} return 'rgb(30,138,60)';}
const HEATBG='linear-gradient(90deg,#B3261E 0%,#E8701A 35%,#E0B41C 55%,#A8C81C 70%,#1E8A3C 100%)';
function rutaTxt(nv){const c=NIV_L, cc=ciclo(), fd=x=>x.getDate()+' de '+MESL[x.getMonth()]+' de '+x.getFullYear(), f=D.emp.ciclo_desde?('del '+fd(cc.ini)+' al '+fd(cc.fin)):'desde tu fecha de ingreso';
  if(!nv.ks.length)return '';
  if(nv.bajo)return `Hoy tu nómina está por debajo del Nivel 1 de tu puesto (${mxn(nv.g[nv.ks[0]])}). Con un desempeño del 90% sostenido durante 12 meses puedes pasar a Nivel 1.`;
  if(!nv.sig)return `Ahora mismo eres <b>${esc(D.emp.puesto||'')} ${c[nv.ks[nv.i]]}</b>, el nivel más alto de tu puesto. Tu siguiente paso ya es un ascenso de puesto.`;
  /* Javi, 22-nov-2026, sobre este texto. El anterior metía la condición, el
     plazo, el sueldo y la coletilla de las vacaciones en una sola frase de
     cuarenta palabras. Ahora van tres: dónde estás, qué sigue y qué hace
     falta. El sueldo y la fecha no se tocan: son el compromiso. */
  return `Hoy eres <b>${esc(D.emp.puesto||'')} ${nv.ks[nv.i]==='practicas'?'en Prácticas':c[nv.ks[nv.i]]}</b>. `

   +`Para llegar necesitas un desempeño del <b>90%</b> de promedio en tu año laboral (${f}).`;}

function ring(v,size,dark){const R=size/2-6,C=2*Math.PI*R,p=Math.max(0,Math.min(100,v));
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${dark?'#33483d':'#E8E2D5'}" stroke-width="7"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${heat(v/100)}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C*p/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="54%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.3}" font-weight="800" fill="${dark?'#F4F1EA':'#1F1B16'}">${v}</text></svg>`;}

/* anillo y barra de evolución a color: cada punto con su color, en el mismo orden siempre */
function ringSeg(size){const R=size/2-9,C=2*Math.PI*R,v=score(),c=heat(v/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none"><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="#3A4A40" stroke-width="11"/><circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${c}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C*Math.min(100,v)/100} ${C}" transform="rotate(-90 ${size/2} ${size/2})"/><text x="50%" y="48%" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.3}" font-weight="800" fill="${c}">${v}</text><text x="50%" y="68%" text-anchor="middle" font-size="${size*0.1}" fill="#cfd8d2">de 100</text></svg>`;}
function pilaBar(){const v=Math.max(0,Math.min(100,score())); const tk=(p,t)=>`<span style="position:absolute;left:${p}%;transform:translateX(${p===0?'0':(p===100?'-100%':'-50%')})">${t}</span>`;
  return `<div style="position:relative;margin-top:16px"><div style="height:12px;border-radius:6px;background:${HEATBG}"></div><u style="position:absolute;top:-4px;height:20px;left:calc(${v}% - 3px);width:6px;border-radius:3px;background:#F4F1EA;box-shadow:0 0 0 1.5px #16241D"></u><div style="position:relative;height:16px;font-size:.68rem;color:#cfd8d2;margin-top:5px">${tk(0,'0')}${tk(50,'50')}${tk(90,'90')}${tk(100,'100')}</div></div>`;}

  const box=$('days'); if(!box)return; const prop=(D.emp.property_id===ATENEO_PROP||!D.emp.property_id)?CDMX_PROP:D.emp.property_id;
  const hoy=mxToday(), keys=[]; for(let i=0;i<7;i++){const d=new Date(hoy.getTime()+i*864e5); keys.push(iso(d));}
  let menu={},mine={},votos={};
  try{(await sb.from('comidas_menu').select('fecha,platillo').eq('property_id',prop).in('fecha',keys)).data?.forEach(m=>menu[m.fecha]=m.platillo||'');}catch(_){}
  try{(await sb.from('comida_inscripciones').select('fecha,apuntado').eq('property_id',prop).eq('employee_id',D.emp.id).in('fecha',keys)).data?.forEach(x=>mine[x.fecha]=!!x.apuntado);}catch(_){}
  try{(await sb.from('comida_inscripciones').select('fecha').eq('property_id',prop).eq('apuntado',true).in('fecha',keys)).data?.forEach(x=>votos[x.fecha]=(votos[x.fecha]||0)+1);}catch(_){}
  const h=keys.filter(k=>menu[k]).map(k=>{const d=new Date(k+'T12:00:00'); return `<div class="day${k===keys[0]?' hoy':''}"><div class="d">${DIA[d.getDay()]} ${d.getDate()}${k===keys[0]?' · hoy':''}</div><div class="pl">${esc(menu[k])}</div><div class="n"><b data-n="${k}">${votos[k]||0}</b> apuntados</div><button class="ap${mine[k]?' on':''}" data-f="${k}">${mine[k]?'Apuntado ✓':'Apuntarme'}</button></div>`;}).join('');

/* ---------- Mi horario ---------- */
async function pgHor(){
  page('Mi horario','Cargando…','<div class="center">Cargando tus turnos…</div>');
  const l0=lunes(mxToday()), keys=[]; for(let i=0;i<14;i++)keys.push(iso(new Date(l0.getTime()+i*864e5)));
  let H=[]; try{H=(await sb.from('horarios').select('fecha,hora_inicio,hora_fin,actividad,ubicacion').eq('employee_id',D.emp.id).in('fecha',keys).order('fecha').order('hora_inicio')).data||[];}catch(_){}
  const by={}; H.forEach(x=>{(by[x.fecha]=by[x.fecha]||[]).push(x);}); const hoy=iso(mxToday()); let sem=0;
  const hhmm=x=>String(x.hora_inicio).slice(0,5)+'–'+String(x.hora_fin||'').slice(0,5);
  const prox=H.find(x=>x.hora_inicio&&x.fecha>=hoy);
  function pinta(){
    const ks=keys.slice(sem*7,sem*7+7), pub=ks.some(k=>by[k]);
    const rows=ks.map(k=>{const d=new Date(k+'T12:00:00'), T=(by[k]||[]).filter(x=>x.hora_inicio);
      return `<div class="dd${k===hoy?' hoy':''}${T.length?'':' off'}"><div class="dt"><small>${DIA[d.getDay()]}</small><b>${d.getDate()}</b></div><div class="mid"><b>${T.length?T.map(hhmm).join(' · '):(by[k]||!pub?(pub?'Descanso':'Sin turno publicado'):'Descanso')}</b><small>${T.length?esc([T[0].actividad,T[0].ubicacion].filter(Boolean).join(' · ')):''}</small></div></div>`;}).join('');
    $('hbody').innerHTML=`<div class="seg"><button class="${sem===0?'on':''}" data-s="0">Esta semana</button><button class="${sem===1?'on':''}" data-s="1">Siguiente</button></div>${rows}${pub?'':'<div class="faint" style="font-size:.76rem;text-align:center">Esa semana todavía no está publicada.</div>'}
      <button class="btn" style="width:100%;margin-top:6px;background:#3F56B0" id="hPedir">Pedir cambio de turno o descanso</button>`;
    $('hbody').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{sem=+b.dataset.s; pinta();});
    $('hPedir').onclick=()=>pedirCambio(ks);
  }
  /* PEDIR UN CAMBIO en tres pasos (diseño de Javi): qué · qué días · con qué compañero.
     Solo compañeros directos de su área y sede. Llega al compañero y al jefe; el horario
     no se mueve solo: lo confirma el jefe. */
  let COMP=null;
  async function pedirCambio(ks){
    /* desde hoy: lo que queda de esta semana y la siguiente completa */
    const dias=(sem===0?keys:ks).filter(k=>k>=hoy); let que=null, sel=new Set(), comp=null;
    const trabajo=k=>(by[k]||[]).some(x=>x.hora_inicio);
    if(COMP===null){ sheet('Pedir un cambio','<div class="center">Cargando a tus compañeros…</div>');
      try{COMP=(await sb.rpc('sp2_companeros',{p_desde:keys[0],p_hasta:keys[13],p_emp:RO?D.emp.id:null})).data||[];}catch(_){COMP=[];} }
    const info=c=>{const T={}; (c.turnos||[]).forEach(t=>{(T[t.fecha]=T[t.fecha]||[]).push(t.ini+'–'+t.fin);});
      const desc=dias.filter(k=>!T[k]).map(k=>{const d=new Date(k+'T12:00:00'); return DIA[d.getDay()]+' '+d.getDate();});
      const elegidos=[...sel].sort().map(k=>{const d=new Date(k+'T12:00:00'); return DIA[d.getDay()]+' '+d.getDate()+' '+(T[k]?T[k].join(' · '):'descansa');});
      if(!(c.turnos||[]).length)return 'sin turnos publicados esa semana';
      return (elegidos.length?elegidos.join(' · '):('descansa '+(desc.length?desc.join(', '):'ningún día')));};
    function pinta(){
      const listo=que&&sel.size&&comp; const cn=comp?(COMP.find(c=>c.id===comp)||{}).nombre:'';
      sheet('Pedir un cambio',`
        <div class="lbl" style="margin-top:0">1 · Qué quieres cambiar</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
          <button class="opt${que==='turno'?' on':''}" data-que="turno"><b>Cambio de turno</b><small>cambias el horario</small></button>
          <button class="opt${que==='descanso'?' on':''}" data-que="descanso"><b>Cambio de descanso</b><small>mueves tu día libre</small></button></div>
        <div class="lbl">2 · Qué días · uno o varios</div>
        <div style="display:grid;grid-template-columns:repeat(${Math.min(7,Math.max(dias.length,1))},1fr);gap:5px">${dias.map(k=>{const d=new Date(k+'T12:00:00'); const ok=true;
          return `<button class="dchip${sel.has(k)?' on':''}" data-dia="${k}"${ok?'':' disabled'}><small>${DIA[d.getDay()]}</small><b>${d.getDate()}</b></button>`;}).join('')}</div>
        <div class="faint" style="font-size:.7rem;margin-top:5px">${que==='descanso'?'Elige tu día de descanso y el de tu compañero: en cada día elegido, cada quien toma el lugar del otro.':'En cada día que elijas, tú haces su turno y tu compañero el tuyo.'}</div>
        <div class="lbl">3 · Con qué compañero</div>
        ${COMP.length?COMP.map(c=>`<button class="opt wide${comp===c.id?' on':''}" data-comp="${c.id}"><b>${esc(c.nombre)}</b><small>${esc(c.puesto||'')} · ${esc(info(c))}</small></button>`).join(''):'<div class="faint" style="font-size:.82rem">No hay compañeros de tu área y sede dados de alta.</div>'}
        <div style="font-size:.72rem;color:#3F56B0;margin:6px 0 10px">Solo compañeros directos de tu área y sede.</div>
        <button class="btn" id="cGo" style="width:100%${listo?'':';background:#EADFCB;color:#8A7C62'}"${listo?'':' disabled'}>${listo?('Pedir el cambio a '+esc(cn)):'Elige tipo, días y compañero'}</button>
        <div class="faint" style="font-size:.72rem;margin-top:8px">A tu compañero le llega la notificación. Si acepta, el cambio se hace solo en Horarios y avisamos a tu jefe.</div>`);
      document.querySelectorAll('[data-que]').forEach(b=>b.onclick=()=>{que=b.dataset.que; pinta();});
      document.querySelectorAll('[data-dia]').forEach(b=>b.onclick=()=>{const k=b.dataset.dia; sel.has(k)?sel.delete(k):sel.add(k); pinta();});
      document.querySelectorAll('[data-comp]').forEach(b=>b.onclick=()=>{comp=b.dataset.comp; pinta();});
      $('cGo').onclick=async()=>{ if(!listo||!noRO())return; const b=$('cGo'); b.disabled=true; b.textContent='Enviando…';
        try{const r=await sb.rpc('sp2_pedir_cambio',{p_que:que,p_dias:[...sel].sort(),p_companero:comp}); const d=r.data||{}; if(r.error||!d.ok)throw 0; b.textContent=d.ya?'Ya habías pedido este cambio':'✓ Enviado a '+cn+': si acepta, el horario cambia solo'; cargaCamb();}
        catch(_){b.disabled=false; b.textContent='No se pudo enviar. Reintentar';} };
    }
    pinta();
  }
  const ult=new Date(l0.getTime()+6*864e5);
  page('Mi horario',`Semana ${l0.getDate()}–${ult.getDate()} ${MES[ult.getMonth()]} · ${esc(D.emp.sede||'')} · ${esc(D.emp.puesto||'')}`,
    `<div class="nx"><small>Tu próximo turno</small><b>${prox?(()=>{const d=new Date(prox.fecha+'T12:00:00'); return (prox.fecha===hoy?'Hoy':DIA[d.getDay()][0].toUpperCase()+DIA[d.getDay()].slice(1)+' '+d.getDate())+' · '+hhmm(prox);})():'Sin turno publicado'}</b><small>${prox?esc([prox.actividad,prox.ubicacion].filter(Boolean).join(' · ')||D.emp.puesto||'')+' · marca tu llegada en «Llegué / Me voy»':'Cuando tu jefe publique la semana, aparece aquí.'}</small></div>
     ${CAMB.recibidos.map(c=>`<div class="card" style="border-color:#E0903F"><div class="lbl" style="margin-top:0;color:#B5651D">Te piden un cambio</div>
        <div style="font-size:.88rem"><b>${esc(c.de)}</b> te pide un <b>${c.que==='turno'?'cambio de turno':'cambio de descanso'}</b>:</div>
        ${(c.dias||[]).map(x=>{const d=new Date(x.fecha+'T12:00:00'); return `<div class="li" style="font-size:.82rem">📅 <b>${DIA[d.getDay()]} ${fch(x.fecha)}</b> — tú harías <b>${esc(x.suyo)}</b> y ${esc(c.de)} haría <b>${esc(x.mio)}</b></div>`;}).join('')}
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button class="btn" data-resp="${c.id}" data-ok="1">Aceptar</button><button class="btn out" data-resp="${c.id}" data-ok="0">Rechazar</button></div>
        <div class="faint" style="font-size:.72rem;margin-top:6px">Si aceptas, el cambio se hace solo en Horarios (y el checador ya te espera en el turno nuevo) y avisamos a tu jefe.</div></div>`).join('')}
     <div id="hbody"></div>
     ${CAMB.enviados.length?`<div class="card" style="margin-top:12px"><div class="lbl" style="margin-top:0">Cambios que pediste</div>${CAMB.enviados.map(c=>`<div class="row"><span>${c.que==='turno'?'Turno':'Descanso'} con <b>${esc(c.a)}</b> · ${(c.dias||[]).map(fch).join(', ')}</span><span class="pill" style="color:${c.estado==='aceptado'?'#137A56':(c.estado==='rechazado'?'#C0452F':'#8A6A0A')}">${c.estado==='aceptado'?'hecho':(c.estado==='rechazado'?'no aceptado':'esperando respuesta')}</span></div>`).join('')}</div>`:''}`);
  document.querySelectorAll('[data-resp]').forEach(b=>b.onclick=async()=>{ if(!noRO())return; const ok=b.dataset.ok==='1';
    if(!confirm(ok?'¿Aceptar el cambio? Tu horario se modifica en este momento.':'¿Rechazar el cambio? Los horarios quedan como están.'))return;
    b.disabled=true; b.textContent='…';
    try{const r=await sb.rpc('sp2_responder_cambio',{p_id:b.dataset.resp,p_acepta:ok}); const d=r.data||{}; if(r.error||!d.ok){ alert({vacaciones:'Uno de esos días tiene vacaciones, permiso o incapacidad: no se puede intercambiar.',fecha_pasada:'Alguno de esos días ya pasó.',sin_turnos:'Ninguno de los dos tiene turno publicado esos días.',no_disponible:'Esa solicitud ya no está disponible.'}[d.motivo]||'No se pudo responder. Inténtalo de nuevo.'); }
      await cargaCamb(); pgHor(); }
    catch(_){ b.disabled=false; alert('No se pudo responder. Inténtalo de nuevo.'); } });
  pinta();
}

  if(conEq){const v=Math.round(Number(d.equipo_20)/20*100), ve=pesoMod*0.5; h+=`<div class="rec ${v>=90?'ok':(v>=70?'av':'mal')}" style="padding:10px 12px"><div style="display:flex;justify-content:space-between;gap:8px"><b>Logro de tu equipo</b><b style="color:${col(v)};font-size:1.05rem;white-space:nowrap">${v}% <small style="font-size:.62rem;font-weight:600">cumplido</small></b></div><div class="muted" style="font-size:.72rem">Promedio de la Productividad de tu equipo directo (${esc(d.subordinados||'—')} personas) · pesa la mitad de la tuya</div><div style="font-size:.76rem;margin-top:3px">Te da <b style="color:${col(v)}">${f1(ve*v/100)}</b> de ${f1(ve)} puntos</div></div>`;}

  const bien=O.filter(o=>Number(o.logro)>=76), mal=O.filter(o=>Number(o.logro)<54);
  let ex='';
  if(bien.length)ex+='<div class="lbl">Dónde vas bien</div>'+bien.map(o=>rec('ok','✓ <b>'+esc(o.kpi)+'.</b> '+esc(consejo(o,true)))).join('');
  if(mal.length)ex+='<div class="lbl">Dónde estás fallando</div>'+mal.map(o=>rec('mal','→ <b>'+esc(o.kpi)+'.</b> '+esc(consejo(o,false)))).join('');
  /* camaristas y limpieza: sus tareas por zona */
  const HK=DET.hk||[];
  if(HK.length){const n=HK.reduce((a,z)=>a+(Number(z.n)||0),0), nr=HK.reduce((a,z)=>a+(Number(z.no_real)||0),0), p=n?Math.round((n-nr)/n*100):0;
    const Z=HK.filter(z=>z.efic!=null&&z.n>=5), mej=Z.filter(z=>z.efic>=110&&(z.no_real||0)/z.n<0.1).sort((a,b)=>b.efic-a.efic).slice(0,3),
          sin=HK.filter(z=>z.no_real>0).sort((a,b)=>(b.no_real/b.n)-(a.no_real/a.n)).slice(0,3), len=Z.filter(z=>z.efic<100).sort((a,b)=>a.efic-b.efic).slice(0,3);
    ex+=`<div class="lbl">Tus tareas de limpieza · 90 días</div><div style="display:flex;justify-content:space-between;font-size:.86rem"><span>Terminaste <b>${n-nr} de ${n}</b> tareas asignadas</span><b style="color:${col(p)}">${p}%</b></div><div class="pb" style="margin:6px 0"><i style="width:${p}%;background:var(--c3)"></i></div><div class="faint" style="font-size:.72rem">Termina todo lo asignado y registra el tiempo real; si lo haces más rápido que el estándar, subes.</div>
      <div class="two" style="margin-top:8px"><div class="rec ok"><div class="lbl" style="margin:0 0 4px;color:var(--c1)">Donde rindes mejor</div>${mej.length?mej.map(z=>li('●','<b>'+esc(z.zona)+'</b> — '+z.efic+'% ('+z.n+')')).join(''):'<span class="faint">Aún sin zonas arriba del estándar.</span>'}</div>
      <div class="rec mal"><div class="lbl" style="margin:0 0 4px;color:var(--bad)">Para revisar</div>${sin.length?sin.map(z=>li('●','<b>'+esc(z.zona)+'</b> · '+z.no_real+' de '+z.n+' sin realizar')).join(''):'<span class="faint">Nada sin realizar. ✓</span>'}</div></div>
      ${len.length?'<div class="lbl">Tardas más que el estándar</div>'+len.map(z=>li('🟠','<b>'+esc(z.zona)+'</b> — '+z.efic+'% ('+z.real+' min reales vs '+z.est+' estimados)')).join(''):''}`;}
  /* mantenimiento: trabajos que sumaron y que restaron */
  const S=DET.mtto_suman||[], R=DET.mtto_restan||[];
  if(S.length||R.length){ex+='<div class="lbl">Tus trabajos de mantenimiento</div>'
    +(S.length?rec('ok','<div class="lbl" style="margin:0 0 4px;color:var(--c1)">Los que sumaron</div>'+S.map(t=>li('●','<b>'+esc(t.titulo||t.folio)+'</b> — '+t.real+' min de '+t.est+' estimados')).join('')):'')
    +(R.length?rec('mal','<div class="lbl" style="margin:0 0 4px;color:var(--bad)">Los que restaron</div>'+R.map(t=>li('●','<b>'+esc(t.titulo||t.folio)+'</b> — '+(t.abierto?('sigue '+esc(t.estado)+' desde hace '+t.dias+' días'):(t.real+' min vs '+t.est+' estimados')))).join('')+'<div class="faint" style="font-size:.72rem;margin-top:4px">Cierra los abiertos y registra el tiempo real: un ticket abierto resta cada día.</div>'):'');}
  /* lo que dicen los huéspedes */
  const M=DET.menciones, MJ=DET.menciones_ej||[];
  if(M&&(M.positivas||M.negativas))ex+='<div class="lbl">Lo que dicen los huéspedes · 90 días</div>'+li('💬','<b>'+(M.positivas||0)+'</b> comentarios positivos · <b>'+(M.negativas||0)+'</b> negativos')+MJ.slice(0,4).map(m=>rec(m.negativa?'mal':'ok',(m.negativa?'👎':'👍')+' <i>«'+esc(m.extracto)+'»</i> <span class="faint">'+esc(m.plataforma||'')+'</span>')).join('');
  /* FUERA LA EXPLICACIÓN DE LA ESCALERA. Javi, 22-nov-2026: «quita esto». El
     bloque «Cómo se calcula» contaba la fórmula -70% = 0 puntos, 80% = 19,
     90% = 54- antes que el resultado. Cada objetivo ya dice su meta, lo que
     lleva y sus puntos; quien quiera la fórmula la pide, y a quien abre su
     desempeño lo que le sirve es saber qué hacer, no cómo se pondera.
     Sólo se queda el aviso del bono sin cobro, que sí cambia la cuenta. */
  const B=(D.bonos||[]).map(b=>`<div class="bono${b.sin_pago?' sp':''}"><b>${esc(b.nombre)}</b> <span style="float:right;color:#8A6A0A;font-weight:800">${b.sin_pago?'sin cobro':mxn(b.monto)}</span><small>${esc(b.quincena||'')} · ${b.sin_pago?'suma a tu desempeño':(b.estatus==='propuesto'?'pendiente de validar':esc(b.estatus))}</small></div>`).join('');
  /* ES ACUMULADO, Y SE DICE. Javi, 22-nov-2026: «mantenlo, solo comenta que
     es el dato acumulado». Quien lee «vas en 7.01» entiende «este mes»; y
     no: es lo que lleva en los meses de su año que ya están medidos. */
  return `<div class="lbl">Objetivos de tu puesto · ${esc(D.emp.puesto||'')}</div>`
    +`<div class="faint" style="font-size:.74rem;margin:-2px 0 8px">Es el acumulado de los meses de tu año laboral que ya están medidos, no sólo el mes en curso.</div>`
    +`${h}${ex}${d.bono_sin_pago_pts?'<div class="li faint" style="font-size:.76rem">Incluye +'+esc(d.bono_sin_pago_pts)+' por objetivos sin cobro.</div>':''}${B?'<div class="lbl">Tus bonos por objetivo</div>'+B:''}`;}
/* CÓMO VAMOS ESTE MES. Javi, 22-nov-2026: «¿cómo conocer la productividad que
   llevamos en el mes para poder subirla? ¿por qué no lo pones en
   recomendaciones?». Lo de abajo es el acumulado del año, que ya no se puede
   mover; esto es el mes en curso, que sí. Un dato que aún no se ha capturado
   se dice con todas sus letras en vez de enseñar un cero que no es un cero. */
function blqMes(){
  if(!MES_REC||!MES_REC.length) return '';
  const MESN=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const hoy=mxToday();
  const ico={bien:'✓',falta:'→',sin_dato:'·'};
  const fil=MES_REC.map(r=>{
    const cls=r.estado==='bien'?'ok':(r.estado==='sin_dato'?'':'mal');
    return `<div class="rec ${cls}" style="padding:10px 12px"><b>${ico[r.estado]||'·'} ${esc(r.titulo)}.</b> ${esc(r.texto)}</div>`;
  }).join('');
  return `<div class="card"><div class="lbl" style="margin-top:0">Cómo vamos en ${MESN[hoy.getMonth()]}</div>`
    +`<div class="faint" style="font-size:.74rem;margin:-2px 0 8px">Esto sí lo puedes mover antes de que cierre el mes.</div>${fil}</div>`;
}
function bSaber(k){
  const color=k==='conocimiento'?'var(--c4)':'var(--c5)';
  const L=k==='conocimiento'?tPuesto():tDisc(); const T=totalTests(L); let h='';
  const bien=L.filter(c=>hecho(c)/c.banco>=0.8), falta=L.filter(c=>hecho(c)/c.banco<0.8);
  if(k==='conocimiento'){const sub=(cr(k).det.submodulos||[]).filter(x=>x.y!=null);
    /* Javi, 22-nov-2026, sobre el texto de esta sección. Lo que estaba
       enumeraba las tres partes como un reglamento; lo que mueve a alguien a
       abrir un documento es saber para qué le sirve. */
    h+='<div class="li" style="font-size:.82rem">Lo que sabes de tu puesto se mide con lo que lees y con lo que contestas. '
      +'Cada procedimiento leído y cada test aprobado suben este punto.</div>'
      +(sub.length?'<div class="stats">'+sub.map(x=>`<div class="stat"><b style="color:var(--c4)">${esc(x.x)} / ${esc(x.y)}</b><small>${esc(x.nombre)}</small></div>`).join('')+'</div>':'');}
  if(L.length){
    h+=`<div class="lbl">${k==='conocimiento'?'Tests de tu puesto':'Tests de Casa Pepe'} · ${k==='conocimiento'?'respondidas':'acertadas'} ${T.h} de ${T.b}</div>`;
    if(falta.length)h+='<div class="faint" style="font-size:.74rem;margin:-2px 0 6px">Los que te faltan</div>'+falta.map(c=>filaTest(c,color)).join('');
    if(bien.length)h+='<div class="faint" style="font-size:.74rem;margin:8px 0 6px">Los que llevas bien ✓</div>'+bien.map(c=>filaTest(c,'var(--ok)')).join('');
  } else h+='<div class="faint" style="font-size:.82rem;margin-top:8px">Todavía no tienes tests asignados en este punto.</div>';
  if(k==='conocimiento'){
    /* documentos por leer, por área, con el enlace al siguiente pendiente */
    const A={}; LEC.forEach(x=>{const a=x.area||'GEN'; (A[a]=A[a]||{t:0,l:0,sig:null}); A[a].t++; if(x.leido)A[a].l++; else if(!A[a].sig)A[a].sig=x.documento_id;});
    const ks=Object.keys(A).sort((a,b)=>(A[a].l===A[a].t)-(A[b].l===A[b].t)||(AREA_N[a]||a).localeCompare(AREA_N[b]||b));
    if(ks.length)h+='<div class="lbl">Documentos por leer</div>'+ks.map(a=>{const r=A[a], ok=r.l===r.t; return `<div class="act"><div style="flex:1;min-width:0"><b>${ok?'✅ ':''}${esc(AREA_N[a]||a)}</b><div class="pb" style="height:6px;margin-top:5px"><i style="width:${r.t?r.l/r.t*100:0}%;background:var(--c4)"></i></div></div><b style="color:var(--c4);font-size:.82rem;white-space:nowrap">${r.l} / ${r.t}</b>${ok?'':`<button style="background:var(--c4)" data-url="${esc(r.sig?('/apepe/procedimientos.html?doc='+encodeURIComponent(r.sig)+'&solo=1&embed=1')
                     :('/apepe/procedimientos.html?ver=pend&embed=1&area='+encodeURIComponent(a)))}" data-t="${esc(AREA_N[a]||a)}">Leer</button>`}</div>`;}).join('');
    const con=LEC.filter(x=>(x.preguntas||0)>0), okT=con.filter(x=>x.quiz_ok), falt=con.filter(x=>!x.quiz_ok);
    if(con.length){
      h+=`<div class="lbl">Tests de tus lecturas · resueltos ${okT.length} de ${con.length}</div>`
        +(falt.length?'<div class="faint" style="font-size:.74rem;margin:-2px 0 2px">Los que te faltan</div>':'')
        +falt.map((x,i)=>`<div class="act"${i>=5?' data-mas="1" hidden':''}><div style="min-width:0"><b>${esc(x.titulo||x.codigo||'Documento')}</b><small>${x.preguntas} pregunta${x.preguntas===1?'':'s'}${x.quiz_score!=null?' · último intento '+esc(x.quiz_score)+'%':''}${x.leido?'':' · primero se lee'}</small></div><button data-url="${esc(DOC(x))}" data-t="${esc(x.titulo||'Lectura')}">${x.leido?'Hacer test':'Leer y test'}</button></div>`).join('')
        +(falt.length>5?`<button class="btn ghost" data-vermas="1">Ver los ${falt.length-5} tests restantes</button>`:'')
        +(okT.length?`<details style="margin-top:8px"><summary class="faint" style="cursor:pointer;font-size:.78rem;font-weight:700">Los que ya aprobaste ✓ (${okT.length})</summary>${okT.map(x=>li('✅',esc(x.titulo||x.codigo||'Documento')+(x.quiz_score!=null?' · '+esc(x.quiz_score)+'%':''))).join('')}</details>`:'');
    }
  }
  return h;}

/* ---------- opciones de fondo: reiniciar el ciclo y pedir objetivos sin cobro ---------- */
function opciones(){
  const c=ciclo(), S=D.solicitudes||[], sup=(D.superior&&D.superior.objetivos)||[];
  const ya=t=>S.find(x=>x.tipo===t&&x.estado==='pendiente');
  const tengo={}; (D.bonos||[]).forEach(b=>{if(b.kpi_id)tengo[b.kpi_id]=1;});
  sheet('Si no llegas al 90%',`
   <div class="card"><b>Pedir un objetivo sin cobro</b><div class="muted" style="font-size:.78rem;margin:2px 0 8px">Son objetivos de la posición de arriba${D.superior&&D.superior.celda?' ('+esc(D.superior.celda)+')':''}. No llevan dinero: si los cumples, suman a tu Productividad. Los autoriza Dirección.</div>
     ${sup.length?sup.map(o=>`<div class="act"><div><b>${esc(o.kpi)}</b>${tengo[o.kpi_id]?'<small>ya lo tienes asignado</small>':''}</div>${tengo[o.kpi_id]?'':`<button data-sp="${esc(o.kpi)}">Solicitar</button>`}</div>`).join(''):'<div class="faint" style="font-size:.82rem">La posición de arriba no tiene objetivos que se puedan pedir.</div>'}</div>
   <div class="card"><b>Reiniciar a ceros mi rendimiento</b><div class="muted" style="font-size:.78rem;margin:2px 0 8px">Tu ciclo de 12 meses vuelve a empezar desde hoy: se deja de contar tu promedio actual${c.prom!=null?' ('+c.prom+'%)':''} y empiezas 12 meses nuevos hacia el 90%. Pierdes los meses buenos que ya llevabas. Lo decide Dirección.</div>
     ${ya('reinicio_rendimiento')?'<span class="pill" style="color:#8A6A0A">solicitud enviada · en revisión</span>':'<button class="btn out" id="rst">Solicitar reinicio</button>'}</div>`);
  document.querySelectorAll('[data-sp]').forEach(b=>b.onclick=()=>pedir('bono_sin_pago',b.dataset.sp,b));
  const r=$('rst'); if(r)r.onclick=async()=>{ if(!confirm('¿Seguro? Si Dirección lo aprueba, tu promedio vuelve a cero y empiezas 12 meses nuevos.'))return; if(await pedir('reinicio_rendimiento','Promedio actual '+(c.prom??'—')+'% · mes '+c.enCiclo+' de 12',r)) (D.solicitudes=D.solicitudes||[]).unshift({tipo:'reinicio_rendimiento',estado:'pendiente'}); };
}

/* ---------- arranque ---------- */
async function carga(ver){
  $('app').innerHTML='<div class="center">Cargando…</div>'; LEC=[]; GUIA={}; DET={}; open={}; VAC=null; HOR=[];
  try{ const r=await sb.rpc('sp2_mi_casa',{p_emp:ver||null}); D=r.data; if(r.error||!D||!D.ok) throw 0; }
  catch(_){ if(ver){ try{localStorage.removeItem(LSV);}catch(e){} return carga(null); }
    $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">No encontramos tu ficha de colaborador</h3><p>Tu cuenta no está ligada a un colaborador activo. Avisa a RH.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Volver a SoyPepe</a></div>'; return; }
  RO=!!D.solo_lectura;
  /* Dirección entra viendo a un trabajador (Javi, 22-nov-2026: «monta el de Alo de Puebla para ver un trabajador»). */
  if(!EMBED&&!ver&&(D.roster||[]).length){ let pref=null; try{pref=localStorage.getItem(LSV);}catch(e){}
    if(pref&&pref!=='yo') return carga(pref);
    if(!pref){ const alo=D.roster.find(x=>x.nombre==='Alo'&&/puebla/i.test(x.sede||'')); if(alo){ try{localStorage.setItem(LSV,alo.id);}catch(e){} return carga(alo.id); } } }
  try{ ((await sb.from('eval_quiz_guia').select('criterio,tests').eq('employee_id',D.emp.id)).data||[]).forEach(x=>GUIA[x.criterio]=x.tests); }catch(_){}
  try{ LEC=(await sb.rpc('proc_mis_lecturas',RO?{p_emp:D.emp.id}:{})).data||[]; }catch(_){}
  try{ DET=(await sb.rpc('desemp_detalle',{p_emp:D.emp.id})).data||{}; }catch(_){}
  /* CÓMO VAMOS ESTE MES. Javi, 22-nov-2026: el acumulado del año no se puede
     mejorar, el mes sí. Las frases salen de la base (mi_mes), de los
     objetivos que esa persona ya tiene colgados en su matriz. */
  try{ MES_REC=(await sb.rpc('mi_mes',{p_employee:D.emp.id})).data||[]; }catch(_){ MES_REC=[]; }
  await cargaCamb();
  home();
}
async function cargaCamb(){ CAMB={recibidos:[],enviados:[]}; if(RO)return; try{ const d=(await sb.rpc('sp2_cambios_mios')).data; if(d)CAMB={recibidos:d.recibidos||[],enviados:d.enviados||[]}; }catch(_){} }
window.addEventListener('message',e=>{ if(e.origin===location.origin&&e.data==='sp2-home'&&D){ home(); window.scrollTo(0,0); } });
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ $('app').innerHTML='<div class="center"><h3 style="color:var(--ink)">Entra con tu cuenta</h3><p>Esta es la versión nueva de SoyPepe, en pruebas. Inicia sesión en la app de siempre y vuelve a abrir esta liga.</p><a class="btn" style="display:inline-block;text-decoration:none" href="'+VIVA+'">Ir a SoyPepe</a></div>'; return; }
  let v=new URLSearchParams(location.search).get('ver'); carga(v||null);
})();
</script>
